  <style>
    body{margin:0;background:#fff;color:#111;font-family:ui-sans-serif,system-ui,-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;line-height:1.8}
    .container{max-width:920px;margin:0 auto;padding:40px 18px 56px}.back{display:inline-block;margin-bottom:28px;color:#666;text-decoration:none;font-size:14px}
    h1{font-size:24px;margin:0 0 8px}.desc{color:#666;font-size:13px;margin:0 0 18px}
    .panel{border:1px solid #e5e7eb;border-radius:12px;padding:14px;background:#fff;margin-bottom:24px}
    .grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.wide{grid-column:1/-1}
    select,input{width:100%;height:42px;padding:0 12px;border:1px solid #d1d5db;border-radius:10px;background:#fff}.label{display:block;font-size:12px;color:#666;margin:0 0 6px}

<body>
  <div class="container">
    <a href="arxiv.html" class="back">← Research Digest に戻る</a>
    <h1>Research Digest アーカイブ 2026年11月</h1>
    <p class="desc">アーカイブ一覧は本体ページにあります。 <a href="arxiv.html">Research Digest に戻る</a></p>

    <div class="panel">
      <div class="grid">
        <label><span class="label">月</span><select id="month"><option value="">すべて</option></select></label>
        <label><span class="label">ジャンル</span><select id="genre"><option value="">すべて</option></select></label>
        <label><span class="label">主分類</span><select id="field"><option value="">すべて</option></select></label>
        <label><span class="label">並び順</span><select id="sort"><option value="newest">新しい順</option><option value="oldest">古い順</option><option value="title">タイトル順</option></select></label>
        <label class="wide"><span class="label">キーワード</span><input id="keyword" type="search" placeholder="タイトル・要約・著者・分類を検索" /></label>
      </div>
      <div id="meta" class="meta"></div>
    </div>
    <div class="list" id="list"></div>
  </div>
  <script>
    const DATA = {"version": 1, "updatedAt": "2026-11-06T03:59:24Z", "articles": [{"source": "arXiv cs.CY", "title": "Beyond the principle-practice gap: Responsible AI as situated epistemic and ethical practice", "titleJa": "原則と実践のギャップを超えて――責任あるAIは、状況に埋め込まれた認識的・倫理的実践である", "summaryHtml": "責任あるAIの研究は、倫理原則がAIの設計と開発にしばしば反映されないことを見出してきた。「原則と実践のギャップ」として概念化され、これは実装、認識、コンプライアンスの問題、ひいてはシステムや個人の振る舞いの不足として枠づけられてきた。本論文は、別の説明を提示する。<br><br>法執行、商業、研究、サバイバー支援の文脈にわたり、AIを活用した人身売買対策システムを設計・統治するアクターへの14件の半構造化インタビューに基づき、著者らは、そのような見かけのギャップは、アクターがある問題を――しかし他の問題はそうではなく――行動を要する倫理的問題として認識するに至る、多様で複雑な制度的・専門的条件から生じると論じる。<br><br>認識的な選択が倫理的判断と絡み合うことが示され、知覚、判断、状況づけられた行動、社会技術的な物質化という、相互に結びついた4つの局面がたどられる。ギャップを「不足」ではなく「現場の条件」から理解し直す、質的な研究である。", "url": "https://arxiv.org/abs/2611.06709", "publishedAt": "2026-11-04T16:08:17Z", "timestamp": 1793808497000, "monthKey": "2026-11", "field": "cs.CY", "genre": "LLM / NLP", "authors": ["Thao Do Ngoc", "Emma Carmel"], "categories": ["cs.CY", "cs.AI"]}, {"source": "arXiv cs.CL", "title": "ALTO: African and Levantine Tech-Facilitated Gender-Based Violence Corpus", "titleJa": "ALTO――アフリカとレバントにおけるテクノロジーを介したジェンダー暴力コーパス", "summaryHtml": "テクノロジーを介したジェンダーに基づく暴力（TFGBV）は、直接的・隠蔽的さまざまな形態を通じて、女性とジェンダー少数者に広く及ぶオンラインの危害である。ジェンダー化された危害の検出のための現在のモデルと注釈付きデータセットは、グローバルノースの言語のデータと、そこで訓練されたモデルに支配されている。<br><br>ヨルダン、フランス語圏西アフリカ、ケニアの市民社会組織（CSO）と協力し、著者らは、レバント・アラビア語、アフリカのフランス語、スワヒリ語における、文化的・言語的に関連したTFGBVの事例をクラウドソースする、コミュニティ主導のアプローチを開発した。クラウドソースされたデータをアクティブラーニングで注釈し、小さいながら性能の良いデータセット（N=3,022）「ALTO」を構築し、3言語でのTFGBV検出を改善した。<br><br>ベンチマークとファインチューニングの実験では、既存の有害コンテンツ検出モデルはALTO内でのTFGBVの再現率が低く、ファインチューニングで改善することが示された。モデルは隠蔽的な危害を見逃しがちであることも分かった。過小評価されてきた言語圏の危害検出に光を当てる研究である。", "url": "https://arxiv.org/abs/2611.06706", "publishedAt": "2026-11-04T16:06:15Z", "timestamp": 1793808375000, "monthKey": "2026-11", "field": "cs.CL", "genre": "LLM / NLP", "authors": ["Tianwei Zhang", "Ivy Njoki Nyagwencha", "Zahraa Dirani", "Shalini Joshi", "Scott A. Hale"], "categories": ["cs.CL", "cs.AI", "cs.CY", "cs.LG"]}, {"source": "arXiv cs.LG", "title": "Where It Breaks: Diagnosing Perception, Memory, and Decision Failures of a Vision-Language Agent in Pac-Man", "titleJa": "どこで壊れるか――パックマンで視覚言語エージェントの知覚・記憶・意思決定の失敗を診断する", "summaryHtml": "上下左右だけの行動でパックマンをプレイするようエージェントを訓練すると、基本的な問いが生じる。性能が悪いとき、何を改善すべきか。難しさは、画面を読むことから来るのか、長い系列にわたる行動選択から来るのか。本研究は、Qwen3.5-9Bベースのエージェントについて、独立した知覚チェックと、原始方策の強化学習研究を通じてこれらの問題を調べる。<br><br>テキスト化した盤面を使い、画像の転記を意思決定インターフェースから取り除いた方策研究では、8つの保留迷路でのクリア率は、この最適化の前の0%から、選ばれたチェックポイントで80.2%（残機3つ追加）まで上がった。知覚チェックは、正確な静止スクリーンショットの読み取りが、対話中の誤りと共存しうることを示す。<br><br>別の方策比較では、さらなる最適化がより悪い行動選択を伴うことも示された。これらの知見は、訓練後の具体的なチェックを動機づける。知覚は使用中の状態で評価すること、そして失敗の所在を切り分けることが、エージェント改善の前提になるという診断の研究である。", "url": "https://arxiv.org/abs/2611.06704", "publishedAt": "2026-11-04T16:04:57Z", "timestamp": 1793808297000, "monthKey": "2026-11", "field": "cs.LG", "genre": "Vision / Multimodal", "authors": ["Xinglu Wang", "Edward Wang", "Yong Zhang", "Zhenan Fan"], "categories": ["cs.LG"]}, {"source": "arXiv cs.RO", "title": "When to Ask for Help: Uncertainty-Triggered Aerial Refinement for Off-Road Navigation", "titleJa": "いつ助けを求めるか――不確実性で発動するオフロード航法の空中支援", "summaryHtml": "異種の空地チームは、地上車両のセンサの限られた範囲と視点を、空からのセンシングで補うことができる。しかし、UGV（無人地上車）が支援を必要とするのはいつか、UAV（無人航空機）がどんな情報を集めるべきかを決めることは課題として残る。本論文は、プランナ条件付きの空地支援手法を提示する。地図情報の不確実性がUGVの現在のMPPIロールアウトへどう影響するかを評価する手法である。<br><br>航法が劣化したままであれば、解決済みの地図仮説のもとで同じロールアウトを採点し、最も有用な改善をもたらす地図レイヤーを選び、対応する空からの計測を要求し、返ってきた情報を融合して再計画する。固定した支援役割やタスク構造、不確実性そのものに駆動される手法と異なり、本手法は、不確実性の解消が予測される地上航法を改善するかどうかに支援を条件づける。<br><br>3つのオフロード路線での180回のシミュレーション試行で、本手法は98.9%の目標到達を達成しながら、UAVの平均飛行時間を削減した。「必要なときだけ呼ぶ」支援の設計である。", "url": "https://arxiv.org/abs/2611.06702", "publishedAt": "2026-11-04T16:02:59Z", "timestamp": 1793808179000, "monthKey": "2026-11", "field": "cs.RO", "genre": "Robotics", "authors": ["Pranay Samineni", "Adam Thorpe", "John Chubick", "Anand Balakrishnan", "Christian Ellis", "Swarat Chaudhuri", "Ufuk Topcu"], "categories": ["cs.RO", "eess.SY"]}, {"source": "arXiv cs.CV", "title": "Agent-Driven Generative Priors for Pathology Image Synthesis and Segmentation", "titleJa": "エージェント駆動の生成事前知識による病理画像の合成とセグメンテーション", "summaryHtml": "病理学のための深層学習手法は、大規模なピクセルレベルの注釈の入手可能性の低さとコストの高さに制約されている。合成データはこの制限を緩和できるが、既存のパイプラインは信頼できる品質管理を欠くことが多く、下流の分析とのつながりも弱い。この問題に対し、本論文は、自動データスクリーニング、生成的表現学習、下流タスクへの効率的な適応を統合した3段階の枠組みを提案する。<br><br>第一に、病理エージェントシステムを開発して画像品質を評価しサンプルを選別し、公開TCGAリポジトリから選ばれた217,030件の病理パッチからなるデータセット「TCGA-200K」を得た。第二に、選別されたデータで生成モデルを訓練する。画像合成に加えて、そのバックボーンは下流タスクへ転移可能な構造的・意味的表現を学ぶ。<br><br>第三に、事前学習した生成バックボーンを、意味的セグメンテーションへ適応させる。データの質の管理から生成、実タスクへの転移までを一つの流れにまとめた、医療画像AIの実践的なパイプライン研究である。", "url": "https://arxiv.org/abs/2611.06701", "publishedAt": "2026-11-04T16:02:29Z", "timestamp": 1793808149000, "monthKey": "2026-11", "field": "cs.CV", "genre": "Vision / Multimodal", "authors": ["Sicheng Yang", "Rui Tang", "Haipeng Zhou", "Hongqiu Wang", "Zhaohu Xing", "Jianda Ma", "Lie Dai", "Guang Yang", "Lei Zhu"], "categories": ["cs.CV"]}, {"source": "Hugging Face Papers", "title": "What Does Multi-Turn Reinforcement Learning Really Improve in LLM Agents?", "titleJa": "マルチターン強化学習はLLMエージェントの何を本当に改善するのか", "summaryHtml": "マルチターンのエージェント強化学習は長期的なタスクで優れた性能を示すが、その効果は対話の制約条件に大きく左右される。本論文は、サンプリングの幅Kと対話の深さTを変えた評価指標Pass@(K,T)により、軌跡レベルの強化学習の優位性が十分なターン数の予算に依存し、予算が厳しくなると大幅に低下することを示した。<br><br>また、エージェント強化学習は一段階の意思決定の質を一様に高めるわけではない。その強みはむしろ、誤りからの回復や長期的な粘り強さに集中していることが明らかになった。展開時の予算依存によるリスクを抑えるため、論文ではプロセス監督シグナルの利点と限界を予備的に論じ、学習中に相互作用の予算を変化させるBudgetMix RLを提案している。<br><br>実験の結果、BudgetMix RLは多様な実行条件のもとで頑健な性能を達成し、学習時と展開時でターンの予算が異なる場合でも性能が崩れにくい点が確認された。エージェント強化学習の効果を「何が改善され、何が改善されないか」という観点から切り分けた、実務的にも示唆に富む検証である。", "url": "https://arxiv.org/abs/2611.06483", "publishedAt": "2026-11-04T08:24:54Z", "authors": ["Kejian Zhu", "Zhuoran Jin", "Shangqing Tu", "Tianyi Men", "Yupu Hao", "Jiachun Li", "Kang Liu", "Jun Zhao"], "categories": ["cs.LG", "cs.CL"], "field": "cs.LG", "genre": "Agents / Reasoning", "timestamp": 1793780694000, "monthKey": "2026-11"}, {"source": "PubMed", "title": "Psilocybin-Assisted Therapy for Cancer-Related Psychological and Existential Distress in Adults with Cancer: An Integrative Systematic Review", "titleJa": "がんに伴う心理的・実存的苦悩に対するシロシビン支援療法――統合的システマティックレビュー", "summaryHtml": "シロシビン支援療法は、がんや生命を脅かす病気に伴う苦悩への有望な介入として再び注目されている。本統合的システマティックレビューはPRISMA指針に沿い、2025年8月10日から10月31日までにPubMed、Scopus、Google Scholar、CINAHLを検索し、6つの独立した臨床コホートから得られた11件の報告を対象に、がんのある成人における抑うつ、不安、実存的苦悩に対する安全性、有効性、治療的影響を評価した。<br><br>シロシビンは一般に、準備、投与、統合の構造化された枠組みのもとで、監督下の単回中〜高用量（25〜30mg/70kg）として投与された。すべての研究デザインを通じて、抑うつ、不安、実存的苦悩、死への恐怖の迅速かつ持続的な軽減がみられ、効果は2〜6か月、場合によっては4.5年まで続いた。質的知見では、感情の明晰さや受容、スピリチュアルな安寧、意味との再接続が際立った。11件中5件がMMATの基準を満たし、他では評価者の盲検化や代表性、交絡の統制などに課題が残った。<br><br>シロシビン関連の重篤な有害事象は報告されず、一時的な心血管系の変化や頭痛、吐き気、不安、短時間の精神病様症状がみられた。著者らは、がん関連の心理的・実存的苦悩に対する有望だがいまだ研究段階の緩和的介入だと結論づけている。", "url": "https://pubmed.ncbi.nlm.nih.gov/42975895/", "publishedAt": "2026-11-03T00:00:00Z", "authors": ["Athanasios Pitis", "Maria Nikoloudi", "Nikos Stefanis", "Kyriaki Mystakidou"], "categories": ["psychedelics", "systematic review"], "field": "PubMed", "genre": "Psychedelics / Therapy", "timestamp": 1793664000000, "monthKey": "2026-11"}]};
    const byId = id => document.getElementById(id);
    const norm = s => String(s||'').toLowerCase().normalize('NFKC').replace(/\s+/g,' ').trim();
    const esc = s => String(s||'').replace(/[&<>"]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
    const months = [...new Set((DATA.articles||[]).map(a => a.monthKey).filter(Boolean))].sort().reverse();
    const genres = [...new Set((DATA.articles||[]).map(a => a.genre).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'ja'));
    const fields = [...new Set((DATA.articles||[]).map(a => a.field).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'ja'));
    function fill(select, values){ values.forEach(v=>{ const o=document.createElement('option'); o.value=v; o.textContent=v; select.appendChild(o); }); }
    fill(byId('month'), months); fill(byId('genre'), genres); fill(byId('field'), fields);
    function render(){
      const month=byId('month').value, genre=byId('genre').value, field=byId('field').value, sort=byId('sort').value, kw=norm(byId('keyword').value);
      let rows=(DATA.articles||[]).filter(a=>{
        if(month&&a.monthKey!==month) return false; if(genre&&a.genre!==genre) return false; if(field&&a.field!==field) return false;
        const hay=norm([a.titleJa,a.title,a.summaryHtml,a.authors.join(' '),a.categories.join(' ')].join(' '));
        if(kw&& !hay.includes(kw)) return false; return true;
      });
      rows = rows.slice().sort((a,b)=> sort==='oldest' ? a.timestamp-b.timestamp : sort==='title' ? a.titleJa.localeCompare(b.titleJa,'ja') : b.timestamp-a.timestamp);
      byId('meta').textContent = `更新: ${DATA.updatedAt || '-'} / 表示件数: ${rows.length}件`;
      byId('list').innerHTML = rows.map(a=>`
        <article>
          <div class="src">${esc(a.source)} / ${esc(a.publishedAt.slice(0,10))}</div>
          <h2 class="title">${esc(a.titleJa)}</h2>
          <div class="tags"><span class="tag">AI</span><span class="tag">${esc(a.genre)}</span><span class="tag">${esc(a.field)}</span>${a.categories.slice(0,4).map(c=>`<span class=\"tag\">${esc(c)}</span>`).join('')}</div>
          <div class="summary">${a.summaryHtml}</div>
          <div class="box"><strong>ソース・引用元</strong><br>配信元：${esc(a.source)}<br>原題：${esc(a.title)}<br>著者：${esc(a.authors.join(', '))}<br>原文URL：<a href="${esc(a.url)}" target="_blank" rel="noopener">${esc(a.url)}</a></div>
        </article>`).join('');
    }
    ['month','genre','field','sort'].forEach(id=>byId(id).addEventListener('change',render)); byId('keyword').addEventListener('input',render); render();
  </script>
</body>
