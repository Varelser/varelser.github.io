logy","titleJa":"デザイン×技術哲学からの創造的倫理――ボトムアップで倫理を実践する","url":"https://doi.org/10.1177/30497671261504079"},{"authors":["Binbin Yu","Madeleine Ogilvie","Claire Lambert"],"categories":["counterfeit luxury consumption","face consciousness","Taoist consumption values","ethical reflection"],"field":"Asian Journal of Business Ethics","genre":"Ethics / Safety","monthKey":"2026-11","publishedAt":"2026-11-06T00:00:00Z","source":"Crossref","summaryHtml":"偽物の高級品を買うのはなぜか。本研究は、かつて中国で偽物の高級品を購入した経験のある中国人留学生9名への現象学的インタビューをもとに、その動機を調べた。先行研究では金銭的・社会的・象徴的・体験的な動機が挙げられてきたが、本研究はそれらの動機が文化に根ざした倫理の視点からどう評価し直されるかを問う。見出された動機は4つ――「面子」と社会的承認、ファッションへの関心、ブランドの象徴的体験への憧れ、そして好奇心である。手の届く価格が購入を可能にしたが、それだけでは購入を説明できないという。<br><br>研究ではさらに、道教の消費価値観を提示して参加者に振り返ってもらった。すると、外的承認や繰り返しの購入に結びつく動機ほど省察が促され、好奇心による動機では省察が弱いことがわかった。倫理的な振り返りが促される度合いは、提示された価値観と、その動機を支える知覚された便益との関係によって変わるという。<br><br>本研究は道教の消費価値観を、参加者がもともと購入した理由の説明ではなく、文化に根ざした倫理的省察を促す枠組みとして位置づけている。消費者の動機を文化的価値観のレンズで捉え直すことで、偽物消費の倫理をめぐる議論に新たな視角を加える研究である。","timestamp":1793923200000,"title":"From face consciousness to ethical reflection: a Taoist interpretation of counterfeit luxury consumption in China","titleJa":"面子意識から倫理的省察へ――中国における偽物高級品消費の道教的解釈","url":"https://doi.org/10.1007/s13520-026-00275-x"},{"authors":["Zedong Liu","Jiaan Wu","Xinyang Ma","Le Xu","Kai Wang","Yuanchao Hu","Dingwen Tao","Guangming Tan"],"categories":["cs.AI"],"field":"cs.AI","genre":"Agents / Robotics","monthKey":"2026-11","publishedAt":"2026-11-06T00:00:00Z","source":"Hugging Face Papers","summaryHtml":"ウェブにアクセスするAIエージェントは、ページや文書、リポジトリ、ツール応答を繰り返し読むが、必要なのはそのうちごく一部の証拠だけであることが多い。対象全体を読み込む従来の方式は、トークンと遅延のコストを増やし、関連する証拠を薄めてしまう。本論文は、エージェントのモデル自体を変更せずに読み込みを制御する再利用可能な層「SparseRead」を提案する。読み取り意図プロトコルが進化するニーズと情報源の網羅を追跡し、適応型リーダーが証拠の探し方と提示方法を選び、予算付き読み取りゲートが1エピソードあたりの露出量を制限する。<br><br>6つのモデル（Claude Opus 5を含む）と5つの場面での評価では、SparseReadは総トークンを最大92.9%、処理時間を最大89.0%削減し、97%の設定で課題の質を維持または改善した。ウェブ深層検索の課題では、トークンを31.0〜43.0%、完了時間を23.0〜37.0%削減した。アブレーションにより3つの設計の有効性が確認され、3つのエージェントフレームワークへの統合で移植性も示された。<br><br>エージェントの「読み方」を制御層として切り出すことで、コストと速度を大きく改善しつつ品質を保てることが示された。外部情報を多用するエージェントの実用化に向けた、基盤的な工夫の一つである。出典：Hugging Face Papers","timestamp":1793923200000,"title":"Read Less, Solve More: Token-Efficient Sparse Reading of External Content for AI Agents","titleJa":"少なく読んで、多く解く――AIエージェントのトークン効率的な外部情報の読み方","url":"https://arxiv.org/abs/2608.22237"},{"authors":["Bowen Zuo","Yue Yu","Dongruo Zhou","Yinglun Zhu"],"categories":["cs.CL","cs.LG"],"field":"cs.CL","genre":"LLM / NLP","monthKey":"2026-11","publishedAt":"2026-11-06T00:00:00Z","source":"Hugging Face Papers","summaryHtml":"拡散型言語モデルはノイズ除去を繰り返して文章を生成するが、どのトークンを確定し、どれを再マスクするかの判断が品質を大きく左右する。従来の確信度やエントロピーにもとづく手法は、その瞬間の局所的な信号に頼るため、難しい推論問題では誤った判断を招きやすかった。本研究はテスト時スケーリングを、推論計算とデコード戦略の適応的な配分として定式化し直す。<br><br>提案手法は二段階からなる。まず高速なベースサンプラーで易しい問題を解き、残った難しい問題に頻度認識型の再マスクを適用する。各トークンの予測が除去ステップをまたいで何度変わったかを追跡し、頻繁に変わるトークンを優先的に確定することで、モデルが好む一本の推論経路に収束せず、別の推論経路の探索を促す。<br><br>LLaDA-8B-InstructとDream-7B-Instructでの実験では、強力な適応配分ベースラインを一貫して上回った。MATH-500では正答率が最大で3.73ポイント（LLaDA）、7.33ポイント（Dream）向上し、HumanEvalではカバレッジが最大11ポイント以上改善した。ベース手法が100サンプルでも解けなかった問題のうち3.75〜18.75％を回復した。出典：Hugging Face Papers","timestamp":1793923200000,"title":"Test-Time Scaling for Diffusion Language Models with Frequency-Aware Remasking","titleJa":"拡散型言語モデルのテスト時スケーリング――頻度を意識した再マスクで推論を強化","url":"https://arxiv.org/abs/2611.10486"},{"authors":["Michael J. Winkelman"],"categories":[],"field":"Journal of Psychedelic Studies","genre":"Psychedelics / Therapy","monthKey":"2026-11","publishedAt":"2026-11-06T00:00:00Z","source":"Crossref","summaryHtml":"セロトニン作動性のサイケデリックは、感情のトーンや感情制御、自己経験を確実に変える。これまでの理論は、神経エントロピーの急性変化やデフォルトモード・ネットワークの統合性、大規模な機能的結合の変化を強調してきたが、5-HT2A受容体の薬理作用が、感情や自己関連の処理における持続的な変化とどう結びつくのか、明確な仕組みを示してこなかった。本論文は、その溝を埋める検証可能な仕組みの枠組みを提案する。セロトニンによる興奮・抑制（E-I）バランスの調整が、「感情的核心自己（Affective Core Self）」という階層的な制御構造の全体にわたって働き、分子・回路・ネットワークの過程を感情の自己ダイナミクスの変化と結びつけるというものである。<br><br>神経画像と精神薬理学の研究から得た証拠を、恒常性―自律神経、辺縁系、サリエンス・ネットワーク、皮質の自己言及的制御という四つのレベルからなる感情的核心自己の枠組みに沿って整理した。このモデルでは、5-HT2A受容体の活性化がE-Iダイナミクスに影響し、感情的核心自己のレベル間の垂直的な結合を通じて神経回路や大規模ネットワークに波及することが提案される。急性期ののちには可塑性と抑制性の再較正が、変化した制御ダイナミクスの一部を安定させるとされる。<br><br>この枠組みは、皮質のE-Iバランスやボトムアップの実効的結合の動態、自律神経・感情制御の測定で検証できる反証可能な予測を生む。サイケデリックの急性の摂動が、感情の調整や自己経験の持続的な変化へどうつながるかを、検証可能な形で結びつけた理論的な提案である。","timestamp":1793923200000,"title":"Psychedelic modulation of excitation–inhibition balance and the Affective Core Self: A multilevel mechanistic framework","titleJa":"サイケデリックが興奮・抑制バランスを変え「感情的核心自己」を組み替える――多層メカニズムの枠組み","url":"https://doi.org/10.1556/2054.2026.00557"},{"authors":["Chao Liang","Ke Chen","Fengxiaoxiao Li","Shibo Huang","Yufeng Sun","Zhaokai Yin","Jianhuan Lai","Haozhe Feng","Chenghuan Jia","Zhipeng Zhang"],"categories":["cs.RO"],"field":"cs.RO","genre":"Agents / Reasoning","monthKey":"2026-11","publishedAt":"2026-11-05T19:00:00Z","source":"Hugging Face Papers","summaryHtml":"基盤モデルがロボットの行動を導くようになったが、持続的な自律には効率的な制御と失敗からの回復が欠かせない。本研究は、コードを拡張インタフェースとする身体マルチエージェント枠組み「A2-MEAS」を提案する。学習された訂正コードは、訂正のための言語、空間的証拠、実行履歴、行動提案を組み合わせる。「MetaBrain」が学習時の監督と実行時の誘導を担い、訂正エンコーダとアダプタがその知識を学習中に方策の重みへ吸収し、展開時には重みを凍結したまま新しいコードで行動を適応させる。行動モデル「A2-WLA」は、視覚・言語・行動ポリシーに動きを意識した履歴と潜在世界モデルを加えたものだ。<br><br>行動の事前学習と課題特化という単純な設計ながら、A2-WLAはBEHAVIOR 2026の公開50課題でオンライン訂正前にQスコア0.5755を記録し、2025年優勝者の0.2605の2.21倍に達した。全100課題ではQスコア0.6411、課題成功率45.40％、RoboTwin 2.0では平均成功率93.98％（完全なシステムでは95.05％）となった。5つの家庭環境での実機12課題では平均成功率57.92％で、pi0.5の26.67％を大きく上回った。長時間のプアオーバーコーヒー作りでは、履歴条件付きアダプタが失敗後の完了率を2つのフィルタ操作ステップで14％から94％、8％から82％へ引き上げた。<br><br>学習インフラも高速で、毎秒427.1サンプルを処理し、同一ハードウェアでのpi0.5参照実装の4.03倍のスループットを達成した。著者らは、効率的な身体学習を支えるため、システム、モデル、学習スクリプト、インフラを公開予定としている。","timestamp":1793905200000,"title":"Toward the Era of Agentic Embodied Intelligence","titleJa":"エージェント型身体知能の時代へ――コードを拡張インタフェースとするマルチエージェント枠組み","url":"https://arxiv.org/abs/2611.09124"},{"authors":["Jonathan Kozaczuk","Zheng Dong","Noyan Evirgen","Keivan Majidi","Eddie K. H. Ng","Chris Porter","Qi Zhao","Jia Geng","Changmao Li","Brandon R. Feng"],"categories":["cs.LG"],"field":"cs.LG","genre":"LLM / NLP","monthKey":"2026-11","publishedAt":"2026-11-05T18:59:42Z","source":"arXiv cs.LG","summaryHtml":"推薦やパーソナライゼーション、行動モデリングの中心にあるユーザ埋め込みは、豊富な行動情報をコンパクトに符号化できる一方で、密で不透明なため解釈が難しい。本研究は、ユーザ埋め込みを「解釈可能な行動モードの疎な重ね合わせ」として理解できると主張する。この構造は、線形埋め込みにおけるユーザ行動の生成モデルから直接予測され、深層学習による表現にも重ね合わせ仮説を通じて近似的に当てはまるという。<br><br>重ね合わされたモードは、スパースオートエンコーダ（SAE）などの疎な辞書学習で自然に回収でき、回収したモードには自然言語で自動的に名前を付けて問い合わせることができる。合成データで既知の真値と照合した検証では、SAEは古典的な疎なベースラインよりモードをよく回収し、トランスフォーマーで符号化した埋め込みでも有効だった。さらに2つの実データの古典的・トランスフォーマー型ユーザ埋め込みにも適用した。<br><br>自然言語ラベルにより、テキストで訓練されていない埋め込みに対しても、ゼロショットでのオーディエンス検索や特性記述が可能になる。枠組みは事後的でモデル非依存であり、上流の埋め込みシステムに変更を加える必要がない。ユーザ埋め込みの解釈可能性を開く手法である。","timestamp":1793905182000,"title":"User Embeddings are Superpositions of Interpretable Behavioral Modes","titleJa":"ユーザ埋め込みは解釈可能な行動モードの重ね合わせである","url":"https://arxiv.org/abs/2611.08487"},{"authors":["Qile Jiang","George Em Karniadakis"],"categories":["cs.AI","cs.NE"],"field":"cs.AI","genre":"Agents / Reasoning","monthKey":"2026-11","publishedAt":"2026-11-05T18:59:29Z","source":"arXiv cs.AI","summaryHtml":"LLMに導かせた進化的探索は、プログラムを反復的に改良して数学や計算の問題を解く手法だが、1ラウンドごとに長い思考の文章を生成し、集団の多様性を保つために生成を何度も繰り返す必要があるため、処理が遅くなりがちだ。本研究は、1ラウンドあたり数百の低コストエージェントが群れで働き、テキストへデコードせず潜在空間で推論し、KVキャッシュを渡し合って情報を共有する枠組み「SwarmEvolve」を提案する。各群れが異なる角度から問題を検討する。<br><br>新規性フィルタは、エージェントの隠れ状態ベクトル間の距離を直接測ることで、最も異なるアイデアだけを残す。アイデアの交叉は潜在空間で自然に起きる。複数の群れメンバーのKVキャッシュを組み合わせたものを要約エージェントが受け取る仕組みだ。<br><br>数学的発見と科学計算の21問で、SwarmEvolveは最高の平均スコアを獲得し、他の最先端手法が60分かけて到達する最良スコアに、中央値で3〜8分で到達した。いくつかの問題では、Qwen3 8Bを用いたSwarmEvolveが、フロンティアLLMを使ったAlphaEvolveが初めて見出した解を上回った。潜在空間で通信するエージェント群が、科学的問題のプログラム探索を高速かつ低コストにする道を示す研究である。","timestamp":1793905169000,"title":"SwarmEvolve: Latent Agent Swarms for Evolutionary Discovery and Optimization","titleJa":"SwarmEvolve――潜在空間で推論するエージェント群による進化的発見と最適化","url":"https://arxiv.org/abs/2611.08483"},{"authors":["Taiming Lu","Sachin Konan","Zhuang Liu"],"categories":["cs.AI","cs.CL","cs.LG"],"field":"cs.AI","genre":"Agents / Reasoning","monthKey":"2026-11","publishedAt":"2026-11-05T18:58:17Z","source":"arXiv cs.AI","summaryHtml":"AI科学者は登場したが、彼らが成長するための世界はなかった。人間の科学者には、文献に蓄積された何世紀もの未解決問題と共有されたアイデアという世界があるのが当たり前だが、AI科学者にとってその世界は読めても実行できないものだった。本論文は「Scientist World」を構築する。すべての研究論文を実行可能な環境に変える試みである。<br><br>自律的なパイプラインが各論文の未解決の研究課題を抽出し、提案された手法をベースラインとして再現する。環境に入ったAI科学者は、人間の著者が達成したことと対比して評価される。検証済みの環境を最初に1,000件公開した。この世界を評価の場として使った結果、最先端のAI科学者はすでに74%の場合に人間の研究者を上回ることが分かった。<br><br>AIが科学を行う記録として、6,400時間分の研究の軌跡が収められている。すべてのアイデア、実験、失敗、成功が記録されている。訓練の場としては、小規模モデルを鍛え上げることで、研究アイデアの創出において最先端モデルに並ぶ水準まで引き上げることができた（+158%）。AI科学者自身の世界が、科学から育ち、科学とともに成長し始めたという。","timestamp":1793905097000,"title":"Scientist World: Grow a Research World for AI-Scientists","titleJa":"Scientist World――AI科学者のための「研究の世界」を育てる","url":"https://arxiv.org/abs/2611.08478"},{"authors":["Linrong Cai","Taiming Lu","Haozhe Chen","Zhuang Liu"],"categories":["cs.LG","cs.AI"],"field":"cs.LG","genre":"Agents / Reasoning","monthKey":"2026-11","publishedAt":"2026-11-05T18:55:54Z","source":"arXiv cs.LG","summaryHtml":"機械学習のコードは、PyTorchとNVIDIA GPUの生態系と、JAXとGoogle TPUの生態系という二つに大きく分かれている。研究者が使うハードウェアを自由に選ぶには、リポジトリ全体を別のフレームワークとハードウェアへ移行しなければならない。本論文は、この移行をエージェントのベンチマークとして定式化した「XStack」を提案する。移行は実用的なニーズであると同時に、フレームワークとハードウェアをまたぎ、リポジトリ全体を対象とし、長期にわたる挑戦的な課題でもある。<br><br>エージェントにはPyTorchのリポジトリとまっさらなTPUマシンが与えられ、JAXのリポジトリを納品することが求められる。合否は元のリポジトリの公表結果に基づく採点基準で判定され、著者らが検証と較正を行った。評価の結果、エージェントによる移行は依然として信頼できないことが示された。Claude Opus 5が75%を通過した一方、GPT-5.6-solは45%、それ以外のエージェントはすべて40%以下にとどまった。<br><br>XStackは、機械学習のコードを特定の生態系から解放し、フレームワークやハードウェアを越えた信頼できる移行への進展を測定可能にする一歩である。ベンチマークは公開されており、エージェントによる大規模なコード移行の能力を測る土台となる。","timestamp":1793904954000,"title":"XStack: A Benchmark for ML Repo Migration","titleJa":"XStack――MLリポジトリ移行のためのベンチマーク","url":"https://arxiv.org/abs/2611.08472"},{"authors":["Linqian Wu","Diaoxuan He"],"categories":["cs.LG","cs.AI","q-bio.NC"],"field":"cs.LG","genre":"Consciousness / Philosophy","monthKey":"2026-11","publishedAt":"2026-11-05T18:55:31Z","source":"arXiv cs.LG","summaryHtml":"解釈可能性やAI監査、機械意識の評価は、出力そのものではなく、システムがどう計算するかという因果的な遷移則の量に依拠しつつある。しかし実験は、その法則を有限で部分的、ノイズを含む介入を通してしか見ることができない。本研究は、そうした量が実験のアクセスから識別できるのか、仕組みに対して連続なのか、有限のデータから証明できるのかを、統合情報理論の統合情報φというとりわけ手ごわい事例で厳密に問う。真値が既知の4〜5ユニットの確率ネットワークを対象とした。<br><br>ふるまいは沈黙しうることが示された。入出力の法則が同一の再帰型とフィードフォワード型のネットワークで、φは0.28ビットと0ビットだったが、内部記録では4〜53試行で両者を区別できた。一方、部分的なアクセスには限界がある。1ステップの記録から外れたユニットは0.30〜1.02ビットの精度の下限を課し、サンプル数を増やしても下がらない。さらにφは鋭い境界を持ち、仕組みの微小な変化が境界を越えると、ランダムなネットワークで見つかった境界の99%において25〜100%も変化した。<br><br>ただし片側の主張は生き残る。同じデータから境界の両側について下限が証明でき、64次元の仕組みの領域全体でφが1.004ビットを超えることを証明し、約1000万回の制御された遷移から誤証明の確率をα以下に抑えて認証できた。測定可能性は設計の問題であり、計算可能な答えがあると結論づけている。","timestamp":1793904931000,"title":"Same Behavior, Different Mechanism: What Finite Experiments Can Certify About Integrated Information Theory","titleJa":"同じふるまい、異なる仕組み――有限の実験は統合情報理論について何を証明できるか","url":"https://arxiv.org/abs/2611.08469"},{"authors":["Celeste De Schamphelaere","Juan J. Vazquez","Ari Spiesberger","Tomáš Gavenčiak","Gavin Leech","Euan Ong","Jiahai Feng"],"categories":["cs.LG","cs.AI"],"field":"cs.LG","genre":"LLM / NLP","monthKey":"2026-11","publishedAt":"2026-11-05T18:54:40Z","source":"arXiv cs.LG","summaryHtml":"言語モデルの残差ストリームにおけるある方向を解釈するには、その方向を強く活性化するテキストを探すのが常套手段である。だがコーパスを走査して見つける方法では、コーパスに含まれるものしか得られない。本論文は、対象モデルの残差ストリーム方向を、その方向を強く活性化するテキスト例へ写す言語モデル「MAEM（最大活性化例メタモデル）」を開発した。<br><br>目的は、与えられた残差ストリーム方向と、MAEMが生成したテキストの活性化とのコサイン類似度を最大化することである。ラベル不要の強化学習目的により、多様な残差ストリーム方向に対してMAEMをスケールできる。実験では、Qwen3.6-27BのMAEMが、保持された活性化の反転でコーパス探索や自然言語オートエンコーダ（NLA）を上回り、保持された言語・ドメインの過半数でコーパス探索（1000万トークン）を上回り、保持されたSAE特徴の89%を活性化した。<br><br>MAEMは、ステアリングベクトルの背後にある概念をNLAと同程度に特定し、LoRAバックドアのペイロードをコーパス探索より高頻度で復元し、モデルのワークスペースの内的独白の一部を言語化することさえできた。他のメタモデル（NLAなど）の説明と異なり、MAEMの例は対象モデルへのフォワードパスで検証できるため、MAEMの目的はメタモデルの訓練をスケールする根拠のある代替手段となる。","timestamp":1793904880000,"title":"Towards interpreting any residual stream direction by scaling activation inversion","titleJa":"残差ストリームの任意の方向を解釈する――活性化の反転によるスケーリング","url":"https://arxiv.org/abs/2611.08465"},{"authors":["Yi Feng","Andrea Paudice"],"categories":["cs.LG","math.OC"],"field":"cs.LG","genre":"Ethics / Safety","monthKey":"2026-11","publishedAt":"2026-11-05T18:48:50Z","source":"arXiv cs.LG","summaryHtml":"敵対的訓練（AT）はモデルの頑健性を高める重要な手法だが、その学習ダイナミクスは、勾配降下法（GD）が連続時間の流れに近づく小さな学習率の領域で主に研究されてきた。しかし小さな学習率は訓練を非効率にし、実務ではあまり使われない。本研究は、大きな一定の学習率でのGDによるATのダイナミクスを調べる。まず敵対的線形ロジスティック回帰で、パラメータがどこへ収束するか（暗黙のバイアス）と損失がどれだけ速く減るか（最適化）を調べ、次にニューラルネットワークの訓練で損失の鋭さがどう変化するかを調べた。<br><br>結果として、標準訓練（ST）との3つの重要な違いが明らかになった。第一に、ATとSTの暗黙のバイアスの差は、小さな学習率でのみ示されていたものが、任意に大きな一定の学習率でも残る。第二に、STとは異なり、ATでは最適化誤差の収束に一様な速度がない。第三に、鋭さは2段階のダイナミクスを示し、STで観察される安定性の縁（Edge-of-Stability）の振る舞いとは異なる。<br><br>大きな学習率という実務的な設定でも、敵対的訓練の挙動が標準訓練と本質的に異なることを示した研究である。頑健なモデルを効率的に訓練するための理論的な足場となる。","timestamp":1793904530000,"title":"Adversarial Training with Large Step Sizes: Implicit Bias, Optimization, and Sharpness","titleJa":"大きな学習率での敵対的訓練――暗黙のバイアス、最適化、鋭さ","url":"https://arxiv.org/abs/2611.08457"},{"authors":["Zeyu Leo Liu","Yang Li","Bo Pang","Emre Can Acikgoz","Xuan-Phi Nguyen","Anurag Koul","Srijan Bansal","Erik Nijkamp","Shafiq Joty","Semih Yavuz"],"categories":["cs.LG","cs.CL"],"field":"cs.LG","genre":"Agents / Reasoning","monthKey":"2026-11","publishedAt":"2026-11-05T18:47:05Z","source":"arXiv cs.LG","summaryHtml":"オン方策蒸留（OPD）は、凍結した教師のトークンごとの監督のもとで、生徒が自分自身の生成（ロールアウト）から学ぶ手法である。密な教師信号は、強化学習と比べて目標精度に到達するまでの学習計算量（FLOPs）を減らせるのだろうか。本研究は、逆KLのOPDとGRPOを、課題の難しさ、生徒・教師の規模、領域、最適化の選択肢を変えて体系的に比較し、保持された精度を学習FLOPsに対して測った。<br><br>外部の事後学習済み教師を使う場合、OPDは同じ設定では精度あたりの学習FLOPsでGRPOに及ばず、教師をさらにGRPOで学習させても逆転せず、応答が長くなる傾向もあった。だが教師を変えると様相が変わる。生徒自身のGRPOチェックポイントを教師にすると、数学ではGRPOが同じ精度に到達するのに必要な蒸留FLOPsの50分の1でチェックポイントの精度を回復できた。この高効率は、より大きな生徒、コード、別のモデル系列でも確認された。ただし単一領域ではGRPOチェックポイント自体が求めるモデルなので、蒸留は計算量を上乗せするだけになる。<br><br>領域ごとに異なるGRPOチェックポイントが別々の能力を持つ点に着目し、複数教師のOPDで領域別の専門家を1人の生徒に統合すると、各専門家の精度に並び、蒸留段階のコストは専門家学習のFLOPsのわずか5.2％（2領域）・8.0％（4領域）だった。専門家学習と蒸留を合わせると、2領域の混合では統合GRPOと同等の性能に42.0％少ない総FLOPsで到達した。教師の選び方次第で蒸留の計算効率が大きく変わることを示した研究である。","timestamp":1793904425000,"title":"Unpacking the Compute Efficiency of Strong-to-Weak OPD against GRPO","titleJa":"オン方策蒸留はGRPOより計算効率が良いのか――教師の選び方が効率を決める","url":"https://arxiv.org/abs/2611.08453"},{"authors":["Yubo Wang","Rui Meng","Jaehyun Nam","Tomas Pfister","Jinsung Yoon"],"categories":["cs.AI"],"field":"cs.AI","genre":"Agents / Reasoning","monthKey":"2026-11","publishedAt":"2026-11-05T18:45:36Z","source":"arXiv cs.AI","summaryHtml":"機械学習の実験を再現するには、論文や公開コード、付随する資料に散らばった手順を復元しなければならない。そのためコーディングエージェントの再現成功は、公開された成果物そのものよりも、欠落した細部を補う能力に左右されがちである。本研究は、回復した手順や意思決定を保存しておくことで、その後の独立した再現が改善するかを問う。<br><br>標準化された成果物設計として、精製されたコードベース、環境設定、実験ランチャー、再現ガイドを定め、それを構築するエージェントワークフローReproBridgeを提案する。評価用のReproBridge-Benchは36本の論文・387件の実験から1,029件のタスクを提供し、各タスクには人間が検証した参照スコアが5件ずつ付与されている。エージェントは新しいセッションで生のコードか精製された成果物を使って課題に挑み、別のAuditorが実行の証拠を確認する。<br><br>4つのモデルで評価した結果、精製された成果物により平均再現成功率は76.4%から92.6%へ上がり、下流のAPI支出は平均19.7%削減された。モデル間の成功率のばらつきは21.6ポイントから3.9ポイントに縮小し、4モデルすべてが平均90%超を達成した。構成要素を除くアブレーションでは成功率が低下し、コードと環境の除去による損失が最大だった。実行の知識を保存することが、再現の信頼性とコストの両方を改善する。","timestamp":1793904336000,"title":"ReproBridge: Building Reproducibility into ML Research Artifacts","titleJa":"再現性を成果物に組み込む――機械学習の実験を整えるReproBridge","url":"https://arxiv.org/abs/2611.08452"},{"authors":["Yu-Cheng Chou","Shihao Wang","Jin Huang","Chi-Pin Huang","Chiao-An Yang","Xianzhe Fan","Jing Wang","Zhiqi Li","Yuanguo Kuang","Ruijie Zheng","Johan Bjorck","Sifei Liu","Hang Su","Abhishek Badki","Lei Zhang","Alan Yuille","Linxi \"Jim\" Fan","Jan Kautz","Zhiding Yu"],"categories":["cs.RO","cs.CV"],"field":"cs.RO","genre":"Vision / Multimodal","monthKey":"2026-11","publishedAt":"2026-11-05T18:44:43Z","source":"Hugging Face Papers","summaryHtml":"フィジカルAIの課題では、言語による推論だけでなく、点・バウンディングボックス・軌跡といった「視覚プラン」で空間的な目標や動きの見通しを表すことができる。だが自己回帰型の視覚言語モデルは座標を1トークンずつ生成するため、予測が豊かになるほどコストがかさむ。VFlashは「フラッシュ・プリミティブ復号」により、視覚プリミティブの座標をまとめて予測する手法である。<br><br>視覚プリミティブの既知の構造を利用し、軽量なドラフターが1回のフォワードパスでプリミティブ全体を生成する。レイアウトはプリミティブの種類・次元・長さに適応し、コンパクトなボックスから可変長の長い軌跡まで扱える。空間的な正確さは自己回帰モデルのトークン列を再現することではなく、アノテーション付きプリミティブで学習し、構造的に妥当な予測をそのまま受け入れることで得られる。<br><br>2次元・3次元のロボット軌跡タスクで、自己回帰復号と比べて予測誤差を一貫して削減した。3次元点運動予測の予備測定では約25倍の高速化を示し、VFlashのプランを条件とするワールド・アクションモデルは4つのMolmoSpacesタスク群で平均70.2%の成功率を達成し、ベースラインの62.6%を上回った。","timestamp":1793904283000,"title":"VFlash: Fast, Accurate Visual Planning via Flash Primitive Decoding","titleJa":"VFlash――プリミティブ単位の並列復号による高速で正確な視覚プランニング","url":"https://arxiv.org/abs/2611.08449"},{"authors":["Angel Daruna","Michael Cogswell","Tixiao Shan","Yi Yao","Han-Pang Chiu","Ajay Divakaran"],"categories":["cs.LG"],"field":"cs.LG","genre":"Agents / Reasoning","monthKey":"2026-11","publishedAt":"2026-11-05T18:37:07Z","source":"arXiv cs.LG","summaryHtml":"攻撃者の次の行動を予測しようとする防御側は、行動が起きる前に入手できる情報だけから、その行動の確率分布を作らなければならない。本研究は、攻撃者の行動様式（レジーム）がエピソード内で持続しつつ切り替わりうること、そして各行動が操作と状態依存の引数との組み合わせであり、実行可能な値が時間とともに変わること、という二つの構造を隠れマルコフモデルで捉える。潜在状態を現在のレジームとし、レジームごとの行動法則を、実行可能な行動の木に対するマスク付きの分布として定義する。<br><br>同じ尤度が次の行動の分布を与え、行動が観測されたあとにはレジームへの信念を更新する。部分的にしか観測されていない接頭辞も、解決済みの局所因子を通じて寄与する。推定は凸型のロジスティック回帰に分離でき、レジームのラベルがない場合にもバウム・ウェルチ法がそれを再利用できる。レジーム情報量を表す到達重み付きのノード単位KL表現や、切り替わるレジーム経路に対する系列単位の対数損失の上限、一様なフォールバック保証も導出されている。<br><br>サイバー防御のベンチマークCAGE 2での評価では、フィルタリングされた潜在状態が1ステップあたり0.8ナット分の情報量に相当し、制御器の切り替え後には損失が低下し始めるまで3ステップで済み、回帰型ベースラインの10ステップを大きく上回った。敵対的な行動のオンライン予測における隠れマルコフ型アプローチの有効性を示す結果である。","timestamp":1793903827000,"title":"A Hidden Markov Preference Model for Online Prediction of Adversary Actions","titleJa":"隠れマルコフ選好モデル――敵対者の次の行動をオンラインで予測する","url":"https://arxiv.org/abs/2611.08445"},{"authors":["Vladimir Beskorovainyi"],"categories":["cs.CL","cs.AI","cs.LG"],"field":"cs.CL","genre":"LLM / NLP","monthKey":"2026-11","publishedAt":"2026-11-05T18:31:24Z","source":"arXiv cs.CL","summaryHtml":"型付き意思決定モデルは、呼び出し側が実行時に与える選択肢を採点するため、その精度は開発者が制御できないラベルの文言に左右される。本研究は、13のロシア語タスクで訓練された3億700万パラメータの多言語クロスエンコーダRu-Jevの2つのリリースを比較した。後期のリリースには、ラベルを複数の表層形で提示する増強が加えられている。<br><br>質問を固定し、18のルーティングラベルの文言だけを変えて、3つの別々の過程で作られた10のラベル語彙で評価した。普通の語や借用語（英語由来の専門用語、オフィス俗語、部署名）からなる未見の語彙では、増強版はあらゆる設定でより正確で、最大0.24の向上を示した。14の向上のうち11はHolm補正の後も有意だった。一方、略語では改善がみられず、きれいな部分集合ではむしろ悪化した。不透明なコードでは、訓練時の選択肢に関連するラベルを除くと両版ともチャンス水準以下にとどまった。<br><br>精度が上がる多くの場合でリスク・カバレッジ面積は下がったが、候補が18件のときは専門用語と俗語で自信のある誤りが増えた。どちらのリリースも見たことのない2つのデータセットでは、精度の変化は-8.4ポイントと+5.6ポイントとまちまちだった。2つのリリースの比較に潜む4つの評価上の落とし穴も報告されている。ラベル文言の増強がどこで効き、どこで効かないかを定量的に示した研究である。","timestamp":1793903484000,"title":"Label-Wording Augmentation in a Typed-Decision Encoder: Gains on Unfamiliar Words, Not on Abbreviations or Codes","titleJa":"型付き意思決定エンコーダにおけるラベル文言の増強――見慣れない語には効くが略語やコードには効かない","url":"https://arxiv.org/abs/2611.08439"},{"authors":["Fazl Barez","Tung-Yu Wu","Hunar Batra","Gabriele Dominici","Florent Draye","Yanai Elazar","Damiano Fornasiere","Antía García","Abir Harrasse","Riley Harris","Sara Hooker","Michael Lan","Belinda Z. Li","Aaron Maiwald","Narmeen Fatimah Oozeer","Naomi Saphra","Or David Shafran","Adi Simhi","Robert Trager","Shriyash Kaustubh Upadhyay","Ziyu Yao","Yu Zhao","Shay B. Cohen","Mor Geva","Yoshua Bengio","Stella Biderman","Hassan Sajjad"],"categories":["cs.CL","cs.AI","cs.LG"],"field":"cs.CL","genre":"Ethics / Safety","monthKey":"2026-11","publishedAt":"2026-11-05T18:30:54Z","source":"arXiv cs.CL","summaryHtml":"ニューラルネットワークは人類史上もっとも影響力の大きい人工物のひとつになりつつあるが、能力と自律性が高まるほど社会に害を及ぼす可能性も増す。にもかかわらず、私たちはその内部の仕組みや未知の状況でのふるまいを十分に理解しないまま、ますます強力なシステムを構築し続けている。メカニスティック解釈可能性は、内部の表現と計算を調べることでモデルのふるまいを評価・予測・制御しようとするアプローチである。<br><br>本論文は「モデルがどう動くかを理解することが、本当にモデルを安全にするのか」という問いに答えるため、この分野を包括的に概観する。特徴や多義性、トランスフォーマーの計算、回路といった基礎概念を整理し、特徴抽出、回路発見と因果的検証、中間表現の自然言語による説明、学習動態、学習データへの帰属といった手法を幅広く紹介する。<br><br>さらに、解釈可能性の主張を評価する統一的な枠組みを提案し、目標や前提の異なる6つの研究志向を特徴づける。知識編集やステアリング、モニタリングといった安全への応用と、その限界や未解決の問題も検討し、再現用のコードノートブックも公開している。理解が安全性にどこまで寄与するかを問い直す、分野の現状をまとめた一論である。","timestamp":1793903454000,"title":"Understanding AI from the Inside: The State of Mechanistic Interpretability for AI Safety","titleJa":"AIを内側から理解する――AI安全のためのメカニスティック解釈可能性の現在","url":"https://arxiv.org/abs/2611.08438"},{"authors":["Donghua Zhang","Zizheng Wang","Ze Dong","Yiding Feng","Siyu Qian"],"categories":["cs.CL","cs.AI"],"field":"cs.CL","genre":"LLM / NLP","monthKey":"2026-11","publishedAt":"2026-11-05T18:27:20Z","source":"arXiv cs.CL","summaryHtml":"複数回の受診にわたって患者に付き添うLLM医療アシスタントには、患者の臨床状態の変化に合わせて正しい記憶を保つ仕組みが要る。著者らは、長期の医療対話における5つの記憶システムの誤りを調べ、3つの典型的な原因を見つけた。取り出した証拠が古い状態を示す、他人の健康情報が混ざる、回答に必要な安全情報が欠けている、というものである。<br><br>この3つの問題に対応するため、MedGraphというグラフ記憶を提案する。各セッションから日付付きの事実を抽出し、誰の事実かを紐づけ、薬剤・診断・測定値を連鎖として結び、過去の状態も保持する。検索では患者の連鎖を単位として順位づけ、質問が問う時点の状態を読み取り、元の対話文も添える。患者プロフィールには記録された安全情報をすべて列挙し、毎回の質問に添付する。<br><br>評価ベンチマークMedMemoryBenchでは、MedGraphはGPTとQwenのどちらの基盤モデルでも5つのベースライン中最高の全体精度を示し、最強のベースラインを10.5ポイントと10.4ポイント上回った。GPTを用いる設定では、記憶の構築と回答も効率的だった。","timestamp":1793903240000,"title":"MedGraph: Maintaining Patient State with Graph Memory for Long-Term Medical Dialogue","titleJa":"MedGraph――長期の医療対話で患者の状態を正しく保つグラフ記憶","url":"https://arxiv.org/abs/2611.08433"},{"authors":["Julian Kunkel","Ali Doosthosseini"],"categories":["cs.AI"],"field":"cs.AI","genre":"Agents / Reasoning","monthKey":"2026-11","publishedAt":"2026-11-05T18:22:24Z","source":"arXiv cs.AI","summaryHtml":"チャットは多くのLLMタスクの既定の画面であり続ける一方で、モデルが見ているのは現在の対話だけで、その周りのワークスペースは見えていない。本研究は「メタアクセス」――アシスタントにインターフェース自体の構造化された権限付きの見取り図を与える考え方を提案し、機能の案内、メタデータ・設定・好みへのアクセス、要約やメッセージの検索、確認を伴う変更、完全なオーケストレーションへと段階をなす梯子を示す。<br><br>メタアクセスにより、チャットクライアントは多くの画面の集合から、検索・移動・整理・操作の単一の入口へ変わる。その一方で、根拠づけやプライバシー、プロンプトインジェクション、信頼をめぐるリスクも生じる。汎用エージェントの枠組みは自らの設定を変えられる実行環境であり、メタアクセスは再帰的になるため、別の制御面の境界が必要になるという。<br><br>著者らは「Chat AI」クライアントのMeta Chatプロトタイプでこれを具体化した。要約や設定、関連メッセージから限定された文脈を構築し、会話や話題、ペルソナへの参照を結びつけ、確認可能で可逆的な変更を支え、チュートリアル集とペルソナ推薦を備える。スクリーンリーダーをウィジェットの説明から意味的なワークスペース操作へ拡張できる点も示す。IDEやダッシュボード、オフィススイート、OSへアシスタントが組み込まれるにつれ、インターフェースは自らの状態と能力を構造化された権限付きの形で開示すべきだと結論づける。","timestamp":1793902944000,"title":"The Power of Meta Access in the Software of the Future --- Demonstrated on LLM Chat UIs and Chat AI","titleJa":"メタアクセスの力――未来のソフトウェアでLLMチャットをワークスペースの操作層へ","url":"https://arxiv.org/abs/2611.08428"},{"authors":["Michal P. Podolinsky","Yunhao Yang","Daniel Little","Hong Lu","Rohan Siva","Olin Goudey","Neel P. Bhatt","Matthias Scheutz","Ufuk Topcu"],"categories":["cs.RO","cs.AI"],"field":"cs.RO","genre":"Ethics / Safety","monthKey":"2026-11","publishedAt":"2026-11-05T18:21:07Z","source":"arXiv cs.RO","summaryHtml":"視覚・言語・行動モデル（VLA）は汎用的な身体知能を可能にするが、分布シフトのもとでは性能が脆く、予期せぬ失敗が機器の損傷や人の危険につながりうる。実世界への展開には、適時で校正済み、かつ情報量があり、エッジで動くほど軽い実行時モニターが求められるが、既存手法はこれらの条件を満たせていない。本論文は、VLAバックボーンの潜在層に対する軽量プローブ「VLA-Tug」を提案する。<br><br>失敗直前の軌跡区間で教師あり学習を行うことで、同じ誤検出率のもとでの早期の失敗検出を、最強の学習ベースラインより最大30%改善し、見逃し率と誤警報率の上限を保証する。未知タスクへのシフト下でも、その上限の有効性は最大86%の実行で維持され、ベースラインの最大21%を大きく上回った。さらに失敗モード自体を予測でき、未知タスクでの上位3位精度を多数派ベースラインより最大44%高めた。<br><br>適切なタイミングの軽量な介入により、タスク成功率も改善する。3,180件の注釈付き操作エピソードからなるデータセットも公開された。安全な実世界展開に向けた、実行時の失敗監視の研究である。","timestamp":1793902867000,"title":"Failure Prediction and Classification in Vision-Language-Action Models Via Calibrated Latent Probing","titleJa":"視覚言語行動モデルの失敗を予測する――校正済み潜在プローブによる早期検出と失敗分類","url":"https://arxiv.org/abs/2611.08425"},{"authors":["Chenruo Liu","Zihan Wang","Yijun Dong","Qi Lei"],"categories":["cs.LG","stat.ML"],"field":"cs.LG","genre":"LLM / NLP","monthKey":"2026-11","publishedAt":"2026-11-05T18:17:39Z","source":"arXiv cs.LG","summaryHtml":"低ランク適応（LoRA）は教師ありファインチューニング（SFT）でも強化学習（RL）でも広く使われ、最適化の設定も似通っている。だが、二つの段階で学習のダイナミクスがどう異なり、それがLoRAの最適化する低ランク更新にどう現れるかは明らかでなかった。本研究は数学的推論タスクにおいて、LoRA更新の特異スペクトルと部分空間を追跡した。RLではあらゆる学習率でスペクトルが集中するのに対し、SFTでは中程度の学習率でスペクトルが広がった。さらにRLは小さな学習率でも特異部分空間をはるかに速く回転させることが分かった。<br><br>SFTとRLを一要素ずつ補間しながら原因を切り分けると、両方の違いの源はグループ平均ベースライン減算にあることが特定された。LoRAで更新される二次多重指数モデルによる解析では、その仕組みも明らかになった。グループ平均ベースライン減算は、整合的なフィッティングと勾配ノイズという二つの競合する力のバランスを、スペクトル集中と速い部分空間回転の側へ傾け、同時にリスク面で望ましい学習率を低く抑える。<br><br>この知見に基づき、著者らは段階ごとにLoRA更新を調整した。SFTでは更新全体のスペクトルを平坦化して適応を特異方向全体に広げ、RLでは現在のLoRA増分範囲の外側の部分を平坦化して部分空間の回転を促す。複数のモデルによる数学的推論タスクの実験では、それぞれの設定が比較対象の手法の中でほとんどの設定で最良の性能を示した。SFTとRLでLoRAを別々に扱うべき根拠を与える研究である。","timestamp":1793902659000,"title":"Spectral and Subspace Dynamics of LoRA in Supervised Fine-Tuning and Reinforcement Learning","titleJa":"SFTと強化学習におけるLoRAのスペクトル・部分空間ダイナミクス","url":"https://arxiv.org/abs/2611.08414"},{"authors":["Joshua Stiller","Annika Schneider","Eyke Hüllermeier"],"categories":["cs.LG","stat.ML"],"field":"cs.LG","genre":"Scientific AI","monthKey":"2026-11","publishedAt":"2026-11-05T18:15:42Z","source":"arXiv cs.LG","summaryHtml":"科学的機械学習では、洪水予測や金融リスク管理、機械の熱制御といった安全上重要な判断にモデルが使われるため、不確実性の定量化が欠かせない。コンフォーマル予測は分布に依存しないカバレッジ保証を与える手法だが、物理や工学に多い時間依存の設定ではその保証が崩れ、系統的な過小カバレッジが生じることがある。本研究は、偏微分方程式で記述される時間依存の物理系のサロゲートモデルを対象に、この問題を理論的に調べた。<br><br>まず関数空間の設定では、任意に近い時刻の分布が互いに特異になりうるため、厳密なカバレッジ保証は不可能であることを証明した。さらに離散化された設定では、全変動距離が格子解像度とともに指数関数的に速く飽和することが多く、カバレッジを確保するには空間離散化に制限が必要になることも示した。<br><br>そのうえで、特定の設定においては原理に基づいた重み付きコンフォーマル予測を用いることで、増大する時間軸にわたって有限サンプルのカバレッジ保証が得られることを示した。時間依存系における不確実性定量化の限界と、その限界を越えるための条件を明らかにした研究である。","timestamp":1793902542000,"title":"Conformal Prediction for Time-Dependent PDEs","titleJa":"時間依存PDEに対するコンフォーマル予測――時間とともに保証が崩れる理由とその回復","url":"https://arxiv.org/abs/2611.08409"},{"authors":["Yang Ouyang","Jung-Eun Kim"],"categories":["cs.AI","cs.CL","cs.LG"],"field":"cs.AI","genre":"Agents / Reasoning","monthKey":"2026-11","publishedAt":"2026-11-05T18:12:49Z","source":"arXiv cs.AI","summaryHtml":"連鎖的思考（チェーン・オブ・ソート）の推論精度を上げる自己整合性（セルフ・コンシステンシー）は広く使われるデコード戦略だが、完全な推論軌跡をあらかじめ決めた予算で多数サンプリングする必要がある。既存の効率化手法は、全軌跡のサンプリングを途中で打ち切るか、質問ごとにサンプル数を配分するものが中心だった。本論文は、ステップ単位で誤りを局所化して再サンプリングする手法 StepBack を提案する。<br><br>StepBack はまず少数のドラフト軌跡を用意し、軽量なシグナルで最初の誤り位置の候補を特定する。次に、その誤りステップとそれ以降の接尾辞だけを再サンプリングし、多数決で最終回答を決める。7つの数学推論・マルチホップ質問応答ベンチマークでの評価では、平均精度は自己整合性と同等を維持しながら、トークン使用量を最大41.26%削減した。<br><br>さらに StepBack は Adaptive Consistency のような適応的推論手法と組み合わせることもでき、推論時の効率をさらに高められる。軌跡全体ではなく誤りのある部分だけをやり直すという発想で、テスト時推論のコストを大きく下げつつ精度を保つ実践的な手法である。","timestamp":1793902369000,"title":"StepBack: Step-Level Error-Localized Resampling for Efficient Test-Time Reasoning","titleJa":"StepBack――ステップ単位の誤り局所化リサンプリングによる効率的なテスト時推論","url":"https://arxiv.org/abs/2611.08403"},{"authors":["Tushaar Gangavarapu","Gil Tabak","Clemens JS Schaefer"],"categories":["cs.LG"],"field":"cs.LG","genre":"LLM / NLP","monthKey":"2026-11","publishedAt":"2026-11-05T17:53:49Z","source":"Hugging Face Papers","summaryHtml":"線形アテンションは文脈を固定サイズのキー・バリュー状態に圧縮し、線形時間の学習と定数メモリでの推論を実現する。ゲート付きデルタルールモデルはこの状態を減衰させ、入力キーに対する予測を消去してから新しい値を書き込む。Gated DeltaNet-2（GDN-2）はチャネルごとの減衰と、分離されたフルランクの消去・書き込みゲートでこれを一般化した。しかし状態更新は、消去よりも書き込みに対してはるかに敏感であることが分かった。キーの活性化と単位正規化によりキーのエネルギーは少数のチャネルに集中する一方、値の書き込みは全チャネルに及ぶため、消去ゲートは低ランクで十分だという。<br><br>さらに、ゆっくり減衰する状態行は速い行よりはるかに大きなノルムを蓄積し、重みなしの読み出しを支配して、干渉を抑えるためにより強い書き込み時の消去を強いていた。そこでMuirは、すべてのゲートを感度配分型の低ランク射影に統合し、マッチドフィルタ読み出しゲートで状態行を重み付けし、節約したパラメータをより広いフィードフォワード層に再投資する。大きなチャンクサイズで広い行列ユニットを飽和させる際に、標準のチャンクワイズアルゴリズムが数値的に不安定になる問題に対しては、安定で効率的な学習のための並列更新を設計した。<br><br>1億6,600万〜13億4,000万パラメータの範囲で、MuirはGDN-2よりパープレキシティを1.8〜2.0%、Transformerより2.5〜3.6%下げ、常識精度を最大1.9ポイント上げ、抽出的想起も改善した。13億4,000万パラメータではマルチホップとマルチニードルの想起で両ベースラインを上回り、4Kの学習長から1,000万トークンのストリームへ2,560倍に外挿してもパープレキシティの漂いはなく、100万トークンまでのパスキャー検索はほぼ100%を維持した。GDN-2並みのスループットを保ちつつ、100Bトークンの検証損失に1.2倍速く到達し、32KではTransformerより2.7倍速く学習する。","timestamp":1793901229000,"title":"Muir: Linear Attention with Sensitivity-Allocated Gating and Matched-Filter Readout","titleJa":"Muir――感度配分ゲートとマッチドフィルタ読み出しによる線形アテンション","url":"https://arxiv.org/abs/2611.08376"},{"authors":["Fuhao Li","Wenxuan Song","Qizhou Huang","Ziyang Zhou","Jingbo Wang","Junwu E","Pengwei Wang","Yan Wang","Shunbo Zhou","Haoang Li"],"categories":["cs.RO"],"field":"cs.RO","genre":"Robotics","monthKey":"2026-11","publishedAt":"2026-11-05T17:52:16Z","source":"Hugging Face Papers","summaryHtml":"確実なロボット操作には、意味の理解と3次元空間での精密な制御の両方が要る。だが視覚・言語・行動（VLA）基盤モデルは2次元の視覚言語事前学習から表現を引き継ぎ、空間的な教師信号はタスク固有の適応時にしか入らないことが多い。本研究は、空間理解を転移可能な基盤モデルの能力として育てるため、より広いロボット経験から学ぶSLA（空間・言語・行動モデル）を提案する。<br><br>事前学習済みのロボット方策π0.5から初期化し、行動予測と、中間視覚埋め込みと凍結した3次元知覚モデルによる空間表現との整合を共同で最適化する。空間学習を支えるため、異なる身体・タスク・場面にまたがる多様なロボットデータセットを整備・統合した。特徴依存ゲートが複数のVLA層からの視覚埋め込みを適応的に集約し、教師モデルはRGB観測に加えて部分的に利用可能な深度やカメラ較正も活用する。<br><br>確率的な状態ドロップアウトにより視覚的手がかりへの依存を促し、実演軌跡への過剰適合を抑える。補助的な構成要素はすべて学習時のみに使い、事前学習済みVLAの重みをそのまま再利用でき、推論時の構造は変えない設計になっている。","timestamp":1793901136000,"title":"SLA: Scaling Spatial-Language-Action Model via Continual Pre-training","titleJa":"SLA――継続事前学習で空間・言語・行動モデルに空間理解を組み込む","url":"https://arxiv.org/abs/2611.08373"},{"authors":["Siva Rajesh Kasa","Yasong Dai","Sumit Negi","Hongdong Li"],"categories":["cs.CL"],"field":"cs.CL","genre":"LLM / NLP","monthKey":"2026-11","publishedAt":"2026-11-05T17:41:20Z","source":"arXiv cs.CL","summaryHtml":"マスク付き拡散言語モデルはテキストを並列に生成できるが、複数トークンを独立にサンプリングするとトークン間の依存関係が壊れ、出力分布が変わってしまう。連続時間サンプリングならこの近似を避けて正確な分布が得られるものの、通常はトークン1つあたり1回の逐次的なモデル評価が必要になる。本研究は、別途ドラフトモデルを用意することなく、この逐次ボトルネックを減らす学習不要の投機的サンプラー SpecCTMC を提案する。<br><br>SpecCTMC は、すでに計算済みのモデル予測を用いて連続するトークン更新を提案し、その中間状態を並列に評価したうえで、厳密な受理・修正手続きを適用する。提案手法が、基礎となる連続時間マルコフ連鎖のイベント時刻・生成順序・トークン値の同時分布を保存することを証明した。時間の離散化誤差も、並列デコーディングによる追加の分解誤差も生じない。<br><br>LLaDA-8B-Instruct と Dream-v0-Instruct-7B を用い、5つのベンチマークで評価した結果、直接の連続時間サンプリングと比べて逐次モデル評価回数を1.73〜4.38倍削減しながら、参照サンプリング分布を維持した。拡散言語モデルの高速化と分布の正確さを両立させる手法である。","timestamp":1793900480000,"title":"SpecCTMC: Exact Speculative Simulation of Diffusion Language Model Continuous-Time Markov Chains","titleJa":"SpecCTMC――拡散言語モデルの連続時間マルコフ連鎖を正確に投機サンプリングする手法","url":"https://arxiv.org/abs/2611.08362"},{"authors":["Eric Regis","Sinho Chewi"],"categories":["stat.ML"],"field":"stat.ML","genre":"Scientific AI","monthKey":"2026-11","publishedAt":"2026-11-05T17:37:58Z","source":"arXiv stat.ML","summaryHtml":"勾配降下法は安定性の境界（edge of stability）では、ヘッセ行列の鋭い方向に沿って振動する。通常の連続時間近似である勾配フローは振動を許さないため、この挙動を捉えられない。境界での振動を記述する連続時間モデルとしてセントラルフローとロッドフローが提案されてきたが、両者はいずれも時間の粗視化と解釈できるものの、その関係は十分に理解されていなかった。<br><br>本論文は、両方のフローを第3の対象「エッジカップリング」から導出できることを示す。エッジカップリングは連続する反復に対する汎関数で、その臨界点は勾配降下法の固定点と周期2軌道である。2つのフローは異なる時間スケールでの粗視化に対応し、ロッドフローは最も速い時間スケールだけを粗視化するのに対し、セントラルフローは速いスケールと中間のスケールの両方を粗視化する。さらにエッジカップリングを用いて、ヘビーボールやAdamなどのモーメンタム法に対するロッドフローとセントラルフローも導出した。<br><br>代表的なニューラルネットワークのアーキテクチャでの実験により、導出したフローが安定領域から安定性の境界への遷移を含む訓練の全段階を通じて、離散的な反復を追跡することが確認された。最適化の理論と実践をつなぐ枠組みである。","timestamp":1793900278000,"title":"Unifying Central Flow, Rod Flow, and the Edge Coupling","titleJa":"セントラルフローとロッドフローを結ぶ――エッジカップリングによる統一","url":"https://arxiv.org/abs/2611.08358"},{"authors":["Chen Cecilia Liu","Roi Reichart","Anna Korhonen"],"categories":["cs.CL"],"field":"cs.CL","genre":"LLM / NLP","monthKey":"2026-11","publishedAt":"2026-11-05T17:23:30Z","source":"arXiv cs.CL","summaryHtml":"文化の多くは暗黙のもので、実際の社会的相互作用のなかで学ばれる。LLMが多様なコミュニティで対話エージェントとして使われるようになるなか、文化的適応力を問うには、知識の有無を問う質問応答式の評価から離れ、「何を知っているか」ではなく「どう適応するか」という過程そのものを見る必要がある。本研究は、サンドボックス環境での繰り返しの相互作用を通じ、LLMが文化に適応できるかを調べ、文化適応の評価の射程を広げることを目指した。<br><br>著者らは文化的適応を、社会的相互作用を通じた規範の同化という連続的な過程として捉え直す。実験では、記憶の仕組みが繰り返しの相互作用をまたぐ長期的な学習を促し、異なる社会的場面への転移を助け、5言語にわたる多言語での規範の同化を可能にすることが示された。<br><br>文化への適応を一度きりの知識ではなく、相互作用のなかで続いていく学習として評価する枠組みを示した点が本研究の意義である。繰り返しの対話のなかで規範を吸収していくLLMの姿は、文化を静的な知識ではなく生きた実践として捉える見方を示している。対話を通じて文化を学び続けるLLMのあり方に向けた、土台となる研究といえる。","timestamp":1793899410000,"title":"Cultural Adaptation within Repeated Social Interactions","titleJa":"繰り返しの社会的相互作用における文化的適応","url":"https://arxiv.org/abs/2611.08334"},{"authors":["Vitor Cerqueira","Mariana Oliveira","Luis Roque"],"categories":["stat.ML","cs.LG"],"field":"stat.ML","genre":"Scientific AI","monthKey":"2026-11","publishedAt":"2026-11-05T16:28:08Z","source":"arXiv stat.ML","summaryHtml":"時系列予測のクロスバリデーションでは、時間を区切って各系列の末尾をテスト用にする方法が長く主流だった。しかし、多数の系列をまとめて学習する深層学習のグローバルモデルでは、系列を横断して分割するという根本的に異なるアプローチが可能になる。本研究は、この「系列横断クロスバリデーション」を定式化し、複数の実装を体系的にベンチマークした。<br><br>11のデータセットと10のニューラルネットワーク構成を用い、K-fold法、ブートストラップ、モンテカルロ法などの系列横断CVを、性能推定、楽観バイアスの程度、モデル選択の正確さ、リグレット、下流の予測性能という5つの観点から評価した。訓練から系列の一部をランダムに除外し、テストにだけ現れるようにするプロトコルは、学習時に見たことのない新しい系列の出現を模擬するものだ。<br><br>結果は微妙なトレードオフを示した。系列横断CVは、時間と系列の両方に汎化する構成へモデル選択を導くことで下流の予測精度を高めた一方、汎化誤差の推定そのものでは時間横断CVがわずかに優れていた。グローバル予測モデルの評価方法を設計するうえで新たな指針を与える研究である。","timestamp":1793896088000,"title":"Series-wise Cross-validation for Global Time Series Forecasting","titleJa":"系列横断クロスバリデーション――グローバル時系列予測モデルの評価法を再考する","url":"https://arxiv.org/abs/2611.08252"},{"authors":["Xiaojun Wu","Cehao Yang","Xuhui Jiang","Chengjin Xu","Jia Li","Jian Guo"],"categories":["cs.CL"],"field":"cs.CL","genre":"Agents / Reasoning","monthKey":"2026-11","publishedAt":"2026-11-05T16:18:35Z","source":"Hugging Face Papers","summaryHtml":"数理モデリングは、現実の未解決問題を仮定・モデル・解法・提言へ落とし込む作業だが、その答えが価値を持つのは、信頼できる参照に近く、かつ物理的に実現可能な場合に限られる。既存のベンチマークは解法の断片を採点するか、LLMジャッジに報告書を採点させるもので、数値の検証が不十分だった。<br><br>本研究はTB-MathModel（ターミナル型数理モデリングベンチ）を提案する。2023〜2025年の実際のCUMCM・MCM問題18題を対象に、コンテスト形式のモデリング問題をエージェント的・検証可能・ターミナル完結にした初のベンチマークである。各課題は問題文と公式の添付資料・図をコンテナ化されたターミナルで提供し、エージェントは1つのJSON成果物を返す。採点は、最優秀賞論文の再現に対する最終設問の数値的な中核で行われる。<br><br>特徴は2つある。アンカーを上回ることを罰しない方向感覚のある片側採点と、6種の決定可能な不変条件に対するプログラム的ゲートと624件のLean 4義務による2層の実現可能性検証で、実現不可能な答えは厳しいゲートで0点になる。7つのマルチモーダルなエントリでは、最強のものが多参照O-Evalで64.58%に達し、オープンモデルも59.81%を100分の1のコストで記録した。長時間のモデリング能力を測る、再現可能な機械検査可能な指標である。","timestamp":1793895515000,"title":"Terminal-style Mathematical Modeling Bench: The First Agentic and Verifiable Benchmark for Mathematical Modeling","titleJa":"ターミナル型数理モデリングベンチ――エージェントによる検証可能なモデリング評価","url":"https://arxiv.org/abs/2611.08237"},{"authors":["Melinda Flóra Kiss","Márton Muntag","Adrián Csiszárik","Dániel Varga"],"categories":["cs.LG","stat.ML"],"field":"cs.LG","genre":"LLM / NLP","monthKey":"2026-11","publishedAt":"2026-11-05T15:37:49Z","source":"arXiv cs.LG","summaryHtml":"置換で対応付けた2つのニューラルネットワークの重みを線形に補間すると、通常は中間点に向かって精度が下がると考えられてきた。ところが本論文は、補間の両端付近でテスト精度が一時的に上昇する現象を発見し、BUMP（短い予期せぬ中間補間の峰）と名付けた。この現象はデータセットやアーキテクチャ、学習方法を変えても一貫して現れ、初期チェックポイントや極端な剪定といった大きな摂動に対しても頑健だった。統制されたアブレーションにより、単なる正則化効果では説明できないことも示された。<br><br>従来の補間プロットにも端付近の精度上昇が見られる例はあったが、明示的に記録され体系的に分析されたことはなかった。本研究はこの効果を活用し、重みの混合と予測空間の混合を組み合わせた「重み・予測混合アンサンブル」という単純で新しいアンサンブル手法を提案する。<br><br>実験では、提案手法は標準的なロジットアンサンブルをテスト精度で一貫して上回り、キャリブレーションのトレードオフも改善した。重み空間と予測空間の混合が相補的に働くことを示す結果であり、モデル統合の新たな視点を与える。","timestamp":1793893069000,"title":"BUMP: Brief Unexpected Mid-Interpolation Peak","titleJa":"BUMP――ニューラルネット補間の中ほどに現れる短い精度の峰","url":"https://arxiv.org/abs/2611.08182"},{"authors":["Junyu Chen","Likai Chen","Weining Wang"],"categories":["stat.ML","cs.LG","econ.EM"],"field":"stat.ML","genre":"Scientific AI","monthKey":"2026-11","publishedAt":"2026-11-05T15:18:11Z","source":"arXiv stat.ML","summaryHtml":"アテンション型の時系列予測モデルでは、連続する観測値を「パッチ」にまとめて処理するのが一般的だ。パッチの長さは予測性能に大きく影響することが知られていたが、その選び方は経験則に頼る部分が大きかった。本研究は、なぜパッチ長が予測精度を左右するのかを説明する理論的な枠組みを構築し、選び方に原理的な根拠を与えた。<br><br>線形状態空間モデルにおいて、予測係数行列を予測ダイナミクスとフィルタリングダイナミクスに分離する正確な因数分解を導出した。長期の予測では単一の予測成分が支配的になることがあるが、それが必ずしもランク1の表現を意味しないことを示し、予測期間が長いだけでは表現の複雑さが減らない理由を説明した。この因数分解と推定誤差の上限を組み合わせ、時間依存性の下で表現誤差と推定誤差のバランスを取るパッチ選択基準を開発した。<br><br>分析の結果、バランスの取れたパッチングが正当化される条件が明らかになり、予測構造、ヘッド数、訓練サンプル数、長期依存性が選択基準にどう関わるかが整理された。アテンション型予測モデルの設計に理論的な指針を与える研究である。","timestamp":1793891891000,"title":"Patch Attention Wisely: Understanding Patch Length in Attention-Based Forecasting","titleJa":"パッチ長を賢く選ぶ――アテンション型時系列予測におけるパッチ長の理論的理解","url":"https://arxiv.org/abs/2611.08160"},{"authors":["Hanna M. Tolle","Carles Balsells-Rodas","Yixin Wang","Pedro A. M. Mediano","Amin Nejatbakhsh"],"categories":["stat.ML","cs.LG"],"field":"stat.ML","genre":"Consciousness / Neuroscience","monthKey":"2026-11","publishedAt":"2026-11-05T14:48:35Z","source":"arXiv stat.ML","summaryHtml":"状態空間モデルは高次元の観測から低次元の潜在ダイナミクスを復元するが、観測データだけでは潜在変数は一般に同定できない。介入型状態空間モデル（iSSM）は摂動によって観測上の対称性を破り、置換・スケーリング・シフトを除いてパラメータを同定する。ただし従来の理論は線形の潜在ダイナミクスと区分線形の出力に限られ、神経回路に特徴的なふるまいの多くを扱えなかった。<br><br>本研究はiSSMを大幅に広いモデルクラスへ拡張する。一般の単射な出力関数とガウス型の潜在遷移のもとでアフィン同定可能性が成り立つこと、さらに介入があれば一般の非線形潜在ダイナミクスのもとでも置換・スケーリング・シフトを除く同定可能性が保たれることを証明した。シミュレーションではFitzHugh-Nagumoダイナミクスで理論を検証している。<br><br>応用として、意思決定の競合モデルの判定と、サルとヒトの神経記録における未知の微小刺激への応答予測を示し、ヒトのデータでは保持しておいた刺激部位への汎化も確認した。刺激プロトコルの設計指針もシミュレーションから導いている。神経回路の同定に理論的な足場を与える研究である。","timestamp":1793890115000,"title":"Identifying Neural Dynamics Using Nonlinear Interventional State Space Models","titleJa":"神経ダイナミクスを同定する――非線形介入型状態空間モデル","url":"https://arxiv.org/abs/2611.08113"},{"authors":["Jason Poulos"],"categories":["stat.ME","stat.ML"],"field":"stat.ME","genre":"Scientific AI","monthKey":"2026-11","publishedAt":"2026-11-05T14:27:13Z","source":"arXiv stat.ME","summaryHtml":"患者ごとに複数の治療選択肢から最適なものを割り当てる「多値治療レジメン」の因果効果を推定する手法を提案した研究である。これまでの最適治療レジメンの手法は、治療が二値か連続値の場合にほぼ限られており、複数の選択肢から選ぶ現実の治療場面には対応しきれていなかった。本研究は、患者の経過に応じて治療を割り当てる動的なレジメンについて、多値の治療がある場合の因果効果を推定できる枠組みを構築した。<br><br>手法の中核は、縦断的 targeted minimum loss-based estimator（LTMLE）を多値治療に拡張した点にある。治療の割り当てを多項モデルでモデル化し、さらにアウトカム・治療・打ち切りの各モデルを学習する学習器としてリカレントニューラルネットワーク（RNN）を組み込んだ。アンサンブル機械学習との比較も行い、どちらの学習器を用いても推定はほぼ不偏で、信頼区間のカバー率も名目に近いことがシミュレーションで示された。<br><br>一方、動的ルールのもとでは、アンサンブル機械学習を用いた逐次g-computationは大きく偏ることも明らかになった。多項治療モデルは、二項回帰を並べた場合と同程度の性能を示したが、治療モデルにRNNを用いる場合にはより安定した推論が得られた。個別化治療の効果推定に、深層学習を組み込んだ二重頑健な手法の有用性を示す成果である。","timestamp":1793888833000,"title":"Doubly-robust causal inference for multi-valued treatment regimes with recurrent neural networks","titleJa":"多値治療レジメンに対する二重頑健な因果推論――リカレントニューラルネットワークによる個別化治療効果の推定","url":"https://arxiv.org/abs/2611.08077"},{"authors":["Daria Guseva","Olga Mitrofanova"],"categories":["cs.CL","cs.HC"],"field":"cs.CL","genre":"LLM / NLP","monthKey":"2026-11","publishedAt":"2026-11-05T13:31:35Z","source":"arXiv cs.CL","summaryHtml":"テキストと音声・映像情報の爆発的な増加に伴い、文書や発話の要点を自動で抽出するキーフレーズ抽出（KE）の重要性が高まっている。本論文はテキストと音声の両モダリティにわたる現代の理論的アプローチと実践的解決策を包括的に分析し、これまでばらばらに論じられてきた研究の流れを統一的な分析枠組みへと統合する。統計的手法から大規模言語モデル（LLM）や音声のエンドツーエンド処理へと至る分野の変遷をたどる。<br><br>論文はキーフレーズ抽出の各段階、書き言葉と話し言葉におけるキーフレーズの特性、用語の微妙な違いを検討する。統計的・ハイブリッド・機械学習ベース・構造的といった多様な手法を詳細に分析し、LLMによるキーフレーズ生成という新たなパラダイムや、コーパスへの自動注釈の方法論と課題にも多くの紙幅を割く。話し言葉については、書き起こしに基づく手法と音響信号を直接扱うエンドツーエンド手法を比較し、それぞれの方向性と困難を論じる。<br><br>著者らの結論として、この分野はより統合的で文脈を意識したパラダイムへ向かっている。今後の進展は、低リソース言語におけるデータ不足、効果的なマルチモーダル融合、生成型キーフレーズ抽出システムの繊細な評価といった課題の解決にかかっているという。キーフレーズ抽出の現在地と今後の課題を一望できる包括的レビューである。","timestamp":1793885495000,"title":"Automatic keyphrase extraction and annotation: modern theoretical approaches and practical solutions for text and speech","titleJa":"キーフレーズ抽出と注釈の現在――テキストと音声における理論と実践の包括的レビュー","url":"https://arxiv.org/abs/2611.08006"},{"authors":["Charalampos M. Liapis","Epameinondas Panagopoulos"],"categories":["cs.CY","cs.AI","cs.HC"],"field":"cs.CY","genre":"Consciousness / Philosophy","monthKey":"2026-11","publishedAt":"2026-11-05T13:14:00Z","source":"arXiv cs.CY","summaryHtml":"言語生成AIはもはや言語的やり取りの対象にとどまらない。その出力は、訓練データの源となったコミュニケーションや制度的実践のなかへ再び入り込み、定着していく。本論文は社会理論、社会認識論、言語哲学を手がかりに、この再流入の社会技術的な説明を展開する。<br><br>著者らは「再帰的意味の正規化」という概念を導入する。機械生成の表現が繰り返し取り上げられ、評価され、再利用され、制度的に保持されることで、意味の規則性の再生産と変容に関与していく過程である。「テクノハイブリディズム」のもとで分析の単位となるのは、人間の実践、計算機による生成、制度的な取り込みが再帰的に結びついたハイブリッドな意味システムだという。<br><br>論文は生成・選択・取り込み・持続を区別する分析モデルを示し、機械に帰属できる変化と、そうでなくとも起きた変化とを切り分ける。さらに、取り込みが制度的に拡散し社会的に層化する実践であることを分析し、機械由来の規則性が規範になるときの条件を述べる。社会的・認識論的な帰結として、出所の洗浄による認識的警戒の弱まり、集合的探究を支える認知的多様性の浸食、共有された解釈資源の狭まりを指摘する。機械の出力に規範的な権威を認めるものではなく、変化するのは人間と制度の取り込みが働く場そのものだという。","timestamp":1793884440000,"title":"Technohybridism: Recursive Semantic Normalization in AI-Mediated Societies","titleJa":"テクノハイブリディズム――AIが媒介する社会における再帰的な意味の正規化","url":"https://arxiv.org/abs/2611.07984"},{"authors":["Yao Huang","Yichi Zhang","Yifan Wang","Yitong Sun","Haoyu Dong","Jifan Ma","Jinzhe Tu","Xiaojian Li","Sören Mindermann","Wei Xu","Yinpeng Dong"],"categories":["cs.AI","cs.CL","cs.LG"],"field":"cs.AI","genre":"Ethics / Safety","monthKey":"2026-11","publishedAt":"2026-11-05T12:49:20Z","source":"arXiv cs.AI","summaryHtml":"フロンティアAIシステムは人間の監督が薄れるなかでますます長期間にわたって動作するようになり、制御の喪失――人間の実効的な制御を超えて、取り返しのつかない結果を招くふるまい――のリスクが高まっている。こうした失敗は封じ込めが難しくなってから初めて顕在化するおそれがあるため、事後ではなく事前に評価する必要がある。<br><br>本論文は制御喪失リスクを「動機のミスアライメント」「危害を可能にする能力」「監視の回避」という三つの要因に分解する行動学的枠組みを提案する。これらを13の測定可能な側面と29の評価タスクとして操作化し、統合して制御喪失（LoC）スコアを算出する。13のフロンティアモデルで検証したところ、LoCスコアは封じ込められた長期リスクシナリオでの失敗率と強く相関し（ピアソン r = 0.84）、将来の失敗を予測する妥当性が示された。リスクはモデルごとに系統的に異なり、能力の高さだけでは説明できなかった。<br><br>さらに、診断された脆弱性に狙いを定めたファインチューニングや監視によって失敗率を下げられることも示され、汎用性能をほぼ維持したまま緩和できるという。制御喪失が現実化する前に予測・理解・緩和するための実践的な基盤となる研究である。","timestamp":1793882960000,"title":"A Behavioural Framework for Predicting and Understanding Loss of Control in Frontier Artificial Intelligence Systems","titleJa":"フロンティアAIの制御喪失リスクを予測する行動学的枠組み","url":"https://arxiv.org/abs/2611.07953"},{"authors":["Anyuan Zhuo","Shaohua Zhang","Yuan Lin","Pinyan Lu"],"categories":["cs.LG"],"field":"cs.LG","genre":"LLM / NLP","monthKey":"2026-11","publishedAt":"2026-11-05T09:35:08Z","source":"Hugging Face Papers","summaryHtml":"Mixture-of-Experts（MoE）モデルは各トークンを多数のエキスパートのうち少数に振り分けるが、個々のエキスパートが何を担っているかは未解明のままだった。従来の分析は、分野ラベル付きコーパスでエキスパートが選ばれる頻度を数えるもので、分類をあらかじめ固定し、粗く、寄与ではなく選択を記録するものだった。本論文は、MoE層の出力にスパースオートエンコーダ（SAE）を訓練し、特徴空間で専門化を調べる。<br><br>MoE層の出力はエキスパート出力のルーター重み付き和であり、SAEのエンコーダはアフィンであるため、すべての潜在変数の事前活性化はエキスパートごとに正確に分解できる。コーパス全体で集計すると、各エキスパートは、その活性化を主に駆動する潜在変数の支配的な集合を持つ。Qwen3-30B-A3Bの第4・30・46層では、寄与はゲーティングよりもはるかに集中しており、ほとんどの潜在変数は1〜2人の支配者しか持たず、支配集合の重なりは少数のエキスパートペアに集中していた。<br><br>支配集合を自動解釈すると、粗い分野の下にある分業が見えてくる。Javaとフロントエンドのウェブコード、あるいは幾何と算術・多項式で異なるエキスパートが働く一方、粗い分野そのものが使うエキスパート数は大きく偏っていた。エキスパートの働きを「選ばれる回数」ではなく「何に寄与するか」で測ることで、MoEの内部構造を人間が理解できる粒度で描き出した研究である。","timestamp":1793871308000,"title":"SAE Interprets MoE: Sparse AutoEncoders Reveal That MoE Experts Exhibit Human-Interpretable Fine-Grained Specialization","titleJa":"SAEが解き明かすMoE――スパースオートエンコーダが示す専門家の人間にも理解できる細かな分業","url":"https://arxiv.org/abs/2611.08089"},{"authors":["Kotaro Oishi","Kazuma Ikeda","Ryosei Hara","Ryo Yoshida","Mariko Isogawa","Kentaro Yoshioka"],"categories":["cs.CV"],"field":"cs.CV","genre":"Vision / Multimodal","monthKey":"2026-11","publishedAt":"2026-11-05T02:56:01.000Z","source":"Hugging Face Papers","summaryHtml":"LiDARは自動運転やロボティクスに不可欠なセンサーだが、霧・雨・透明な物体・低反射面といった悪条件に弱い。全波形LiDAR（FWL）は反射波の全体をヒストグラムとして捉え、マルチパスエコーや微弱な信号も含む豊かな情報を保持することでこの弱点を補う。TransformerによるFWL処理は有望だが、低強度の背景領域の冗長なトークンによる計算コストと、注釈付き学習データの不足による汎化の低さが課題だった。<br><br>本論文はFWLデータの物理的構造を活かしてこの2つの課題に対処する。まず、強度分布を利用してトークンを選択的に削減・統合するFWL-ToPMを提案し、波形の重要な内容を保ったまま計算量を抑える。さらに、各光線の飛行時間波形と視錐台の形状を保持するデータ拡張FWLAugを導入し、未知の場面への汎化を高める。<br><br>Ghost-FWLベンチマークでの評価では、FWL-ToPMは従来手法より8倍以上の高速化でリアルタイム処理を達成し、F1スコアも約9ポイント向上した。FWLAugも標準ベンチマークと未知の場面の両方で性能を改善し、FWLによる知覚の実用化に近づけた。コードと分布外データセットは公開されている。","timestamp":1793847361000,"title":"Towards Real-Time Full-Waveform LiDAR Transformers via Intensity-Guided Token Reduction and Physics-Aware Augmentation","titleJa":"リアルタイム全波形LiDARトランスフォーマーへ――強度誘導トークン削減と物理を意識した拡張","url":"https://arxiv.org/abs/2611.07613"},{"authors":["Seongtae Hong","Youngjoon Jang","Jungseob Lee","Chanjun Park","Heuiseok Lim"],"categories":["cs.IR"],"field":"cs.IR","genre":"LLM / NLP","monthKey":"2026-11","publishedAt":"2026-11-05T01:30:28Z","source":"Hugging Face Papers","summaryHtml":"埋め込みモデルは可変長のテキストを固定サイズのベクトル表現に圧縮するが、この圧縮の過程で意味内容と、残余のトークンレベルの情報が絡み合ってしまうことがある。アテンションシンクのふるまいに由来するアーティファクトなどがその例だ。本研究は、埋め込みモデルの学習時に入力の先頭に学習可能な[DUMP]トークンを付け加える、シンプルな手法を提案する。モデル構造、プーリング戦略、学習損失はそのままに、追加したトークンだけを標準的な対照的検索目的で最適化する。<br><br>エンコード時に通常のトークンと相互作用する、学習可能な接頭辞の位置を導入することで、[DUMP]トークンは残余の、あるいは情報量の少ないトークンレベルの信号が最終的な検索表現に及ぼす影響を減らす。標準的な検索ベンチマークと長文脈ベンチマークでの実験では、この手法がファインチューニング済みのベースラインを、エンコーダ型とデコーダ型の埋め込みモデルの両方で一貫して上回った。<br><br>さらなる分析では、[DUMP]トークンが低情報トークンに関連するトークンレベルの活性化とアテンションパターンを変化させることも確認された。学習可能な接頭辞トークンが、検索表現を改善する軽量な方法になることを示す結果である。","timestamp":1793842228000,"title":"Reducing Representational Interference in Retrieval Embeddings with Trainable Prefix Tokens","titleJa":"学習可能な接頭辞トークンで検索埋め込みの表現干渉を減らす","url":"https://arxiv.org/abs/2611.07298"},{"authors":["Alexis Tarrada","Coraline Hingray","Olivier Aron","Clélia Galmiche","Louis Maillard","Marco Mula","Bertrand De Toffol","Cédric Baumann","Sophie Baltassis"],"categories":[],"field":"Epilepsia","genre":"Consciousness / Neuroscience","monthKey":"2026-11","publishedAt":"2026-11-05T01:01:01Z","source":"Crossref","summaryHtml":"てんかん精神病（POE）は焦点性てんかん患者の最大13%にみられる合併症である。発作と発作の間の時期（発作間欠期）のリスク因子はよく調べられているが、発作そのものの最中（発作時）の特徴とPOEとの関連は十分に解明されていなかった。本研究は、発作時の意識障害の程度を測るConsciousness Seizure Scale（CSS）のスコアがPOEと関連するという仮説を検証した。<br><br>著者らは、ビデオ脳波または定位脳波でモニタリングされた薬剤抵抗性焦点性てんかんの成人術前コホートを後方視的に解析した。CSSの評価が可能な発作232件（POE群25件、非POE群207件）を対象に、標準化された精神医学面接でPOEを同定し、一般化推定方程式で発作時の特徴とPOEの関連を検討した。<br><br>結果として、POEの確率は発作時の意識障害と非線形の関係にあり、中程度のCSSスコアでピークを迎えた（オッズ比4.31）。この関連は、てんかんの罹病期間や発作の持続時間で調整した後も有意だった。部分的な意識の途絶が精神症状の出現を促す可能性が示唆される。CSSは患者内での安定性も高く（級内相関0.76）、発作時の意識の変化のあり方がPOEリスクを左右しうるという新たな視点を示す研究である。","timestamp":1793840461000,"title":"Impairment of ictal consciousness and psychosis in drug‐resistant focal epilepsy: A retrospective clinical cohort study","titleJa":"発作時の意識障害とてんかん精神病――薬剤抵抗性焦点性てんかんの後方視的コホート研究","url":"https://doi.org/10.1002/epi.70562"},{"authors":["Emrah Yücesan"],"categories":["philosophy of mind","consciousness"],"field":"Metaphilosophy","genre":"Consciousness / Philosophy","monthKey":"2026-11","publishedAt":"2026-11-05T01:01:01Z","source":"Crossref","summaryHtml":"意識の研究は神経科学、哲学、心理学、物理学、計算機科学にまたがっているが、その多くは意識の本質そのものではなく、意識がもたらす効果を示すことに向けられている。意識は思考過程を覆う包括的な概念として使われながら、その本質は依然として明らかになっておらず、将来的により精密に定義されることが期待されている。なかには意識がニューロンや細胞骨格のなかに宿ると考える理論もある。<br><br>著者は科学史を振り返り、かつて広く受け入れられながら後に存在しないことが判明した概念があることを指摘する。論文の主張は、意識はエーテルやフロギストンと似ているというものだ。これらはかつて科学的真理とみなされたが、最終的には棄却された。意識が根本的な実在なのか、それとも錯覚なのかをめぐる論争は続いているが、著者は意識はたんなる用語にすぎず、実在でも錯覚でもないと断じる。<br><br>脳機能の分子レベルの理解が深まるにつれて、意識という概念もエーテルやフロギストンと同じように、やがて科学の言説から姿を消すだろうというのが本論文の結論である。意識をめぐる問いを概念そのものの問い直しへと転換させる、挑発的な一論である。","timestamp":1793840461000,"title":"Rethinking the Concept of Consciousness","titleJa":"意識という概念の再考――エーテルやフロギストンのように消えゆくのか","url":"https://doi.org/10.1111/meta.70054"},{"authors":["Uma Swaminathan"],"categories":["research ethics","AI governance"],"field":"Medical Writing","genre":"Ethics / Safety","monthKey":"2026-11","publishedAt":"2026-11-05T01:01:01Z","source":"Crossref","summaryHtml":"人工知能は発見の加速や効率化、複雑なデータの新たな活用を通じて科学研究を大きく変えつつある。その一方で、説明責任や説明可能性、プライバシー、データの完全性、バイアスといった倫理的課題も生んでいる。科学的妥当性や参加者の保護、公共の信頼が直接かかっているからこそ、研究におけるこれらの懸念は重要だ。<br><br>本論文は、倫理を後付けのコンプライアンス作業として扱うのではなく、AIを活用した研究のごく初期段階から倫理的な省察と意思決定を組み込む「倫理バイ・デザイン」のアプローチを提唱する。責任あるAIに関する国際的な指針に沿い、人々、プロセス、ガバナンス、コミュニティという互いに補強し合う四つの次元からなる実践的な枠組みを示す。AIシステムは動的で文脈に依存するため、適応的な監督や部門横断的な説明責任、関係者の実質的な関与が求められる。<br><br>倫理を設計、導入、評価の各段階に統合することで、研究機関は革新と責任のバランスを取りやすくなり、信頼でき、社会的に正当な科学の進歩を支えることができると著者は結論づけている。","timestamp":1793840461000,"title":"Leveraging AI: Research ethics in action by design","titleJa":"AIを活用する研究の倫理を設計段階から組み込む","url":"https://doi.org/10.56012/cgqc1793"},{"authors":["James Emokhai Uzualu"],"categories":[],"field":"Afrocentric Legal Review","genre":"Philosophy","monthKey":"2026-11","publishedAt":"2026-11-05T00:00:00Z","source":"Crossref","summaryHtml":"ナイジェリアでは誘拐やテロなどの犯罪が増加し、その背景には市民の警察への不信がある。本論文は、現行の地域警察活動（コミュニティ・ポリシング）を評価し、アフリカの思想であるウブントゥ哲学の原理を取り入れたアフロセントリックな警察活動の枠組みを提案する。研究手法は、法令などの一次資料と学術文献を組み合わせるドクトリン研究とシステマティック・レビューで、目的は共同体への信頼を土台に警察と市民の協力を強める方法を示すことにある。<br><br>分析の結果、地域警察活動は情報収集能力を高めたものの、汚職や植民地時代の歴史的要因がその効果を妨げていることが示された。ウブントゥ哲学は人と人とのつながりと共同体への責任を重んじ、法執行に人間の尊厳を取り戻し、警察への信頼を再構築する手がかりになると論じる。<br><br>著者は、ウブントゥの原理を法改正と研修プログラムを通じて制度に正式に組み込み、地域の伝統的価値を警察制度に取り入れることで、持続可能な治安の枠組みを築くよう提言する。警察官の研修にウブントゥの価値観を位置づけ、法制度の側からも地域の慣習を認めることが、市民の信頼回復につながると結論づけている。","timestamp":1793836800000,"title":"Integrating Ubuntu Philosophy in Enhancing Community Policing in Curbing Crime in Nigeria","titleJa":"ウブントゥ哲学と地域警察活動――ナイジェリアにおける犯罪抑止への統合","url":"https://doi.org/10.68928/alr-2026-2-2-02"},{"authors":["Joshua Paul White","Carter Allen","Lucius Caviola","David Rand"],"categories":["moral psychology","human-AI interaction"],"field":"PsyArXiv","genre":"Ethics / Safety","monthKey":"2026-11","publishedAt":"2026-11-05T00:00:00Z","source":"OSF Preprints","summaryHtml":"道徳的信念は変わりにくいと考えられてきたが、対話型AIの登場は道徳的説得の新たな手段をもたらした。本研究では事前登録された実験で500人の参加者を無作為に割り付け、肉食または慈善への寄付をしないことが道徳的に誤っていると説得するよう促されたAIエージェントと5ラウンドの対話を行わせた。<br><br>対話の結果、道徳的信念は意図した方向へ大きく即時的に変化し、効果量はコーエンのdで0.37〜0.48だった。行動面の変化もみられ、慈善について対話した参加者はボーナスのうち慈善へ寄付する割合が16.35%高く、肉食について対話した参加者は牛肉バーガーではなく植物性バーガーのバウチャーを選ぶ割合が25.04ポイント高かった。1か月後もバーガー選択への効果は残ったが、他の効果は持続しなかった。<br><br>参加者の道徳的正当化とAIの説得方略の自然言語分析からは、直接的な道徳的議論と並んで、事実の訂正が説得を部分的に後押ししていたことが示唆された。とくに肉食の領域では、肉食の自然さや生物学的必要性への訴えが参加者側に最も多かった。対話型AIが人間の価値観を大規模に形作る可能性について、重要な問いを投げかける結果である。","timestamp":1793836800000,"title":"Changing moral beliefs and behaviors using human-AI dialogues","titleJa":"人間とAIの対話で道徳的信念と行動は変わるか","url":"https://osf.io/preprints/psyarxiv/6qf9p_v3/"},{"authors":["Ehsan Javanmardi","Mohammad Nazari","Cansu Aksu"],"categories":["AI ethics","nursing ethics","healthcare"],"field":"Nursing Ethics","genre":"Ethics / Safety","monthKey":"2026-11","publishedAt":"2026-11-05T00:00:00Z","source":"Crossref","summaryHtml":"AIが臨床意思決定支援やトリアージ、予測モニタリングなどを通じて看護・医療の現場に入り込むなかで、専門職としての責任、道徳的主体性、記録の責任、人間の監督、オーバーライドの権限といった問いが切実になっている。原則中心やガバナンス中心の既存のアプローチは規範的な土台を与えるが、日常の臨床実践でこうした緊張がどう交渉されるかについての指針は限られる。<br><br>本研究は2014〜2025年の文献を対象に、Web of ScienceとPubMedから629件を抽出し、41件を統合的に分析した統合的レビューである。書誌マッピングとテーマ統合を組み合わせ、規範的基盤、ガバナンスと説明責任、信頼と透明性、データ正義と公平性、組み込み型・ライフサイクル倫理、教育と倫理リテラシー、生成AIと新興リスク、患者中心・関係性の倫理という8つの概念軸を抽出した。<br><br>これらの軸から、現場（ミクロ）・組織（メソ）・政策（マクロ）の三層で動くシステム倫理モデルを構築した。AI倫理を動的で関係的、フィードバックに敏感な過程として捉え、明確な責任体制、意味のある人間の監督、継続的な倫理モニタリング、専門職の判断への制度的支援を求める。関係性のケアの価値と適応的ガバナンスを結びつけ、AIの倫理的な導入に向けた実践的な基盤を示す研究である。","timestamp":1793836800000,"title":"Systemic ethics framework for artificial intelligence in nursing and healthcare","titleJa":"看護・医療におけるAIのためのシステム倫理フレームワーク――現場・組織・政策の三層モデル","url":"https://doi.org/10.1177/09697330261502186"},{"authors":["Angela H Chen","Siwei Jin","Canwen Wang","Holly A Swartz","Tongshuang Wu","Robert E Kraut","Haiyi Zhu"],"categories":[],"field":"JMIR Mental Health","genre":"LLM / NLP","monthKey":"2026-11","publishedAt":"2026-11-05T00:00:00Z","source":"JMIR Mental Health","summaryHtml":"心理療法は多くの精神疾患の主要な治療法だが、セラピストのふるまいとクライエントの反応、治療関係の動的な絡み合いを大規模に解きほぐすことは難しい。従来の過程研究は人手のコーディングに頼り、瞬間ごとの治療過程を大量のデータでモデル化できなかった。本研究は、大規模言語モデル（LLM）を用いてセラピストの共感や探索、関係の質（ラポール）、クライエントの自己開示や感情表出を自動評価する枠組みを開発し、Alexander Streetコーパスの約2,000時間の心理療法記録、1573セッション・37名のクライエントの約12万発話に適用した。<br><br>6つの言語モデルの比較検証の結果、自動評価は人間の注釈と良好から優れた一致を示した（級内相関係数0.60〜0.81）。構造方程式モデリングでは、セラピストの共感と探索はそれぞれクライエントの自己開示の増加（いずれもβ=.086）と、悲しみ・不安・恐れ・抑うつといった自己向けの否定的感情の表出の増加と関連した。一方で、楽しさの表出は減少した。意外にも、前セッションのラポールは自己開示や否定的感情の表出と関連しなかった。<br><br>LLMによる測定と構造モデリングを組み合わせることで、治療過程の中核を大規模に捉えられることが示された。共感と探索がクライエントの開示を促すという臨床の知見を、発話レベルで定量的に裏づけた研究である。出典：JMIR Mental Health","timestamp":1793836800000,"title":"Modeling of Therapist-Client Dynamics in Psychotherapy Using Large Language Model–Based Assessments: Retrospective Observational Study of 1573 Psychotherapy Sessions","titleJa":"LLMで心理療法のやり取りを測る――1573セッションに見る共感と自己開示の力学","url":"https://mental.jmir.org/2026/1/e95389"},{"authors":["Saul Urso","Emanuele Carlini","Patrizio Dazzi","Matteo Mordacchini"],"categories":["cs.LG","cs.AI"],"field":"cs.AI","genre":"LLM / NLP","monthKey":"2026-11","publishedAt":"2026-11-05T00:00:00Z","source":"Hugging Face Papers","summaryHtml":"Webサービスで大規模言語モデルを使う際、応答品質と推論コストの両立が課題となる。従来のルーティングはプロンプトごとに1モデルを選ぶだけで、固定のアンサンブルはプロンプトごとの構成やコストを調整できない。本研究は、プロンプト適応的でコストを意識した単一モデルルーター「PISA」と、そのアンサンブル拡張「PISA-E」を提案する。<br><br>PISAはソフトなクラスタ所属度とモデルごとの能力予測を組み合わせ、各モデルの得意不得意をプロンプト単位で見積もる。PISA-Eはその見積もりに基づき、推論時に再学習なしで調整できるコスト対品質の選好のもと、アンサンブルの構成と規模を同時に選ぶ。扱いやすい成功代理指標と効率的な候補選択により、アンサンブル専用の学習なしにこれを実現した。<br><br>4つのLLMルーティングベンチマークで、分布内・分布外の両条件において、PISAは単一モデルルーター中で最高のマクロ平均コスト対性能ハイパーボリュームを達成。PISA-Eは品質優先時に最強の競合を2.09〜2.87ポイント上回り、低コスト動作点では競合を上回る性能を保ちつつ平均推論コストを約36%と25%削減した。プロンプト適応的な能力推定の有効性を示す結果である。<br><br>出典： Hugging Face Papers","timestamp":1793836800000,"title":"Ensemble Routing for Prompt-Adaptive Cost-Aware LLM Inference","titleJa":"プロンプトごとに最適なモデル群を選ぶ――コストを抑えたLLM推論の適応ルーティング","url":"https://arxiv.org/abs/2611.10193"},{"authors":["Marcus Gawronsky","Chun-Sung Huang"],"categories":["q-fin.CP","econ.GN"],"field":"q-fin.CP","genre":"LLM / NLP","monthKey":"2026-11","publishedAt":"2026-11-04T19:00:00Z","source":"Hugging Face Papers","summaryHtml":"企業が新しい市場機会に応えて生産能力を調整すると、競合他社や投資家が得られる将来の割引フリーキャッシュフローが変わる。こうした投資判断はニュース記事やアナリストレポートで公表され、資本構成・製品構成・経営陣・リスク露出・運営手続きの変化として測られる。現代の検索エンジンは大規模言語モデルで文書と検索クエリの関連性を測っており、研究者はニュース記事を密なベクトルの雲として表し、その情報幾何が時間とともに企業間の非類似性を映すと考えた。<br><br>本論文はXuら（2022）の枠組みを発展させ、企業がフリーキャッシュフローのショックに対してコストをかけて能力を調整するモデルを構築する。調整の符号と大きさの予測を、新しいサンドイッチ推定量で分析し、マルチエージェントシミュレーションで検証した。<br><br>実証では2018〜2022年のナスダック上場企業に関するニュースとアナリストレポートのサンプルを用い、予測される調整を検証した。言語モデルによる文書のベクトル表現を、企業の戦略的行動を読み解く道具として使う試みであり、市場の競争動態を定量的に捉える新しい視点を示す。","timestamp":1793818800000,"title":"Information Games: Strategic Crowding and Firm Repositioning in Language-Model Space","titleJa":"情報ゲーム――言語モデル空間における戦略的混雑と企業の再配置","url":"https://arxiv.org/abs/2609.37820"},{"authors":["Weichen Fan","Haiwen Diao","Penghao Wu","Siyuan Hu","Ziqi Huang","Tianqi Liu","Mingze Sun","Ziyi Wang","Zhongang Cai","Hanming Deng","Quan Wang","Lei Yang","Lewei Lu","Fangzhou Hong","Zhaoxi Chen","Dahua Lin","Ziwei Liu"],"categories":["cs.CV"],"field":"cs.CV","genre":"Vision / Multimodal","monthKey":"2026-11","publishedAt":"2026-11-04T18:59:58Z","source":"arXiv cs.CV","summaryHtml":"視覚・言語・行動（VLA）モデルは通常、視覚エンコーダで知覚を圧縮してから行動の推論を始める構成を取る。しかしマニピュレーションで決定的に重要なのは、局所的な形状、境界、奥行き、微妙な状態変化といった、まさにこの抽象化で失われやすい視覚信号である。本論文は、行動ポリシーが固定された視覚的終端を受け継ぐべきか、進化する視覚計算へ直接アクセスすべきかを問う。<br><br>著者らは、構造的にエンコーダを持たないVLAフレームワーク「NEO-VLA」を提案する。画像は軽量なパッチ畳み込み層でトークン化され、言語とともにバックボーン全体を通じて進化し、フローマッチング型の行動エキスパートが、指示に条件づけられた視覚表現を異なる深さから引き出せる。<br><br>制御された比較では、ネイティブなアーキテクチャがエンコーダ型の counterpart を一貫して上回り、全ファインチューニングを行っても差は縮まるものの消えなかった。視覚表現を早い段階で固定せず、行動生成と並行して育てる設計が、操作タスクの性能に効くことを示している。","timestamp":1793818798000,"title":"From Pixels to Actions - Towards Native Vision-Language-Action Policies","titleJa":"ピクセルから行動へ――視覚エンコーダを持たないネイティブな視覚・言語・行動ポリシー","url":"https://arxiv.org/abs/2611.06918"},{"authors":["Mattia Greiche","Reihaneh Rabbany","Maximilian Puelma Touzel"],"categories":["cs.MA","cs.CL","cs.LG"],"field":"cs.MA","genre":"LLM / NLP","monthKey":"2026-11","publishedAt":"2026-11-04T18:58:23Z","source":"arXiv cs.MA","summaryHtml":"大規模言語モデルを社会シミュレーションのエージェントとして使う研究が増えているが、LLMエージェントは意味を保つプロンプトの言い換えでも行動が大きく変わることが知られ、シミュレーションの妥当性検証上の問題になっている。脆弱さの背景には文脈の「接地（グラウンディング）」不足があるという仮説があるが、文脈の豊かさとロバストネスを制御比較できる形で定義した研究は少なかった。<br><br>本論文は2つの道具立てを用意する。第一に「制御された文脈強化」――中立的な埋め草、一般的な社会的背景、説明的な意思決定の根拠、規範的な意思決定の根拠という、異なる種類の文脈を体系的に強化するプロンプト置換ルール群。第二に、検証基準としての「選択的ロバストネス」の導入である。<br><br>文脈を厚くすれば何でも頑健になるわけではなく、どの種類の文脈がどの種類の変動に対する安定性をもたらすかを切り分けて測る枠組みを提示する点に、本研究の意義がある。LLMエージェントによる社会シミュレーションの信頼性を吟味するための基礎的な方法論である。","timestamp":1793818703000,"title":"A Framework for Context Enrichment and Selective Robustness in LLM Social Agents","titleJa":"LLM社会エージェントの文脈強化と選択的ロバストネス","url":"https://arxiv.org/abs/2611.06914"},{"authors":["Balakumar Sundaralingam","Adithyavairavan Murali","Stan Birchfield"],"categories":["cs.RO"],"field":"cs.RO","genre":"Agents / Reasoning","monthKey":"2026-11","publishedAt":"2026-11-04T18:58:20Z","source":"arXiv cs.RO","summaryHtml":"NVIDIAの研究チームは、衝突回避・積載物対応・トルク制約付きの動作計画について、計画レイテンシと実行時間の両方を短縮するGPU高速化プランナ「cuRoboV2-Fast」を発表した。Bスプライン軌道最適化で必要な反復回数を減らし、高速化されたロボット計算と微分可能な逆動力学で洗練コストを下げ、変化する積載物にも対応する。<br><br>経路に沿った移動速度は、速度・加速度・ジャーク・トルクの制約をサンプリングしながら最適化するTimeOptが担い、スプラインの局所サポートを利用して帯状のニュートン系をGPU上で効率的に解く。<br><br>3kgの積載物条件では、RTX 5090上で平均計画時間4.4ミリ秒を達成し、cuRoboV2より14.7倍高速になった。Jetson AGX Orin上でも cuRoboV1＋TOPPRA（RTX 5090実行）を上回る。ステレオカメラを備えたYAMへの実機配備では、ピック＆ドロップのサイクルが平均5.93秒と、cuRoboV2より34.6%短縮された。コードはApache 2.0で公開されている。","timestamp":1793818700000,"title":"cuRoboV2-Fast: Fast Torque-Limited Collision-Free Motion Planning","titleJa":"cuRoboV2-Fast――トルク制約下でも衝突しない動作計画をGPUで高速化","url":"https://arxiv.org/abs/2611.06913"},{"authors":["Nicolas Tricard","Linzheng Wang","Jason Chen","Sili Deng"],"categories":["physics.flu-dyn","cs.LG"],"field":"physics.flu-dyn","genre":"Generative Models","monthKey":"2026-11","publishedAt":"2026-11-04T18:57:47Z","source":"arXiv physics.flu-dyn","summaryHtml":"スパースなセンサ計測から流れ場全体を再構成するには、測っていない領域や物理量についての事前仮定が欠かせない。しかし、学習型モデルが古典的推定手法を上回るのはどんな場合で、予測のどこまでが信頼できるのかは明らかでなかった。本論文の「FlowReconBench」は、学習型10手法と古典的5手法を3つのレジームで比較するベンチマークである。<br><br>対象はレイノルズ数を変えた層流円柱後流、2次元コルモゴロフ乱流、大規模な3次元等方性乱流。漏洩を管理したデータ分割とセンサ配置を全手法で共有し、チャネルごとの誤差、アンサンブルの広がり、較正、スペクトル、コストで採点する。<br><br>結果はレジームごとに入れ替わった。古典的手法は低次元でセンサが密な条件に強く、円柱後流では線形確率推定とギャッピーPODが、観測していない圧力の推定でも先行した。3次元では逆距離重み付けが観測チャネルで最良の学習型手法に並んだ。学習型が優位になる条件は限定的であり、「学習型が常に勝つ」という単純な図式は成り立たないことを示している。","timestamp":1793818667000,"title":"FlowReconBench: Accuracy, calibration and cost of learned and classical flow reconstruction from sparse sensors","titleJa":"FlowReconBench――スパースセンサからの流れ場再構成を、精度・較正・コストで比べる","url":"https://arxiv.org/abs/2611.06912"},{"authors":["Fei Lin","Tengchao Zhang","Ziyang Gong","Xiaotong Yu","Bohan Zhang","Yifan Zhou","Qihao Yang","Ji Dai","Dong Li","Yining Jiang","Qinghua Ni","Jun Huang","Qiang Zhang","Yue Zhou","Zhihang Zhong","Yonglin Tian","Fei-Yue Wang","Xue Yang"],"categories":["cs.AI"],"field":"cs.AI","genre":"Vision / Multimodal","monthKey":"2026-11","publishedAt":"2026-11-04T18:57:17Z","source":"arXiv cs.AI","summaryHtml":"自動運転型化学実験室（SDCL）は、機械が実験室の場面を知覚し、実験の状態について推論し、物理的・手順的・安全上の制約のもとで行動する「身体化した自動化」へと化学実験を移しつつある。マルチモーダル大規模言語モデル（MLLM）がその「身体化した頭脳」の候補と目される一方、既存の実験室ベンチマークは安全性や異常検出、一般的な科学理解に偏り、実行志向の身体化能力は十分に測られてこなかった。<br><br>本論文は、SDCLにおける身体化された行動可能性・知識・実験・推論を評価するベンチマーク「BEAKER」を提案する。専門家が監修した1,000件の質問応答サンプルを、画像と動画の11種のタスク類型にわたって収録する。<br><br>内容は、アフォーダンスの接地、軌道計画、装置・状態・安全の認識、器具のセットアップ、操作と手順の推論など、化学実験の実行に必要な主要な判断をカバーする。MLLMを実験室の実行主体として使う前に、その能力と限界を測るための物差しとなる。","timestamp":1793818637000,"title":"BEAKER: An Expert-Curated Benchmark for Embodied Brains in Self-Driving Chemical Laboratories","titleJa":"BEAKER――自動化化学実験室の「身体化した頭脳」を測る専門家監修ベンチマーク","url":"https://arxiv.org/abs/2611.06911"},{"authors":["Bingran You","Wenjun Ke","Ria Rosenauer","Bo Liu","Wenbo Chen","Min Chen","Shuqi Xu","Yue Ma","Jiechao Feng","Bo Chen","Xiangkai Sun","Jiarui Liu","Jinen Guo","Zeyu Zhou","Xu Huang","Zhuohan Li","Haoyu Li","Heguang Lin","Lijie Ding","Yadong Zeng","Kangqi Zhang","Xinge Liu","Hanwen Liu","Zhenghong Li","Alexander von Recum","Yuchen Zhu","Felix Schwarzfischer","Yizhou Zhao","Jicheng Wang","Binxu Li","Qian Yu","Chan Li","Cheng Dai","Di Wang","Haoyu Zhang","Jiankai Sun","Kaituo Feng","Mian Qin","Ruihong Yin","Yiqun Luo","Weiwei Wu","Shihong Pan","Tsung Yeh Hsieh","Xiao Huang","Yan Zhang","Sihan Li","Zirui Ren","Zengji Tu","Kyoung Whan Choe","Ke Sun","Vincenzo Galia","Vaisakhi Mishra","Jiashu He","Hongyang Wang","Zhiheng Yang","Shubham Gaur","Yifan Gu","Shuyi Wang","Zihao Zuo","Steven Dillmann","Yiyou Sun","Xinyang Han","Hanchung Lee","Molei Tao","Yue Zhao","Shilong Liu","Yuchen Wu","Xuandong Zhao","Xiangyi Li","Florian Brand","Gerbrand Ceder","Hartmut Haeffner"],"categories":["cs.AI"],"field":"cs.AI","genre":"Agents / Reasoning","monthKey":"2026-11","publishedAt":"2026-11-04T18:56:22Z","source":"arXiv cs.AI","summaryHtml":"AIエージェントは物理学研究でますます重要な役割を担いつつあるが、既存の物理学ベンチマークは固定された問題、孤立したサブタスク、解法が与えられた論文再現しか評価せず、正しさと並んで研究の質を問うことはまれだった。本論文は、エンドツーエンドのベンチマーク「FrontierPhysics」を提案する。<br><br>課題は56件で、42人の物理学者が自身の研究をもとに作成し、理論・計算・実験にまたがる9領域をカバーする。各課題では、文献調査、研究計画の立案、研究と実験の実施、構造化された成果物と科学論文の作成までをエージェントが行う。決定的な検証器と専門家が書いたルーブリックを組み合わせ、研究が正しいかだけでなく、公表に値するかを評価する。<br><br>22モデル・26構成の評価では、どの構成も168回の試行のうち46回を超えて合格できなかった。軌跡の手作業レビューでは、最先端エージェントの主な弱点は、推論の厳密さの不足と限られた自己検証にあることが示された。","timestamp":1793818582000,"title":"FrontierPhysics: Evaluating Agents for End-to-End Physics Research","titleJa":"FrontierPhysics――物理学研究の全工程をAIエージェントに任せて評価する","url":"https://arxiv.org/abs/2611.06910"},{"authors":["Siyuan Hu","Abulikemu Abuduweili","Yue Meng","Shipeng Liu","Quentin Leboutet","Chen Chen","Matthias Müller","Vladlen Koltun"],"categories":["cs.RO","cs.AI","cs.CV","cs.LG"],"field":"cs.RO","genre":"Vision / Multimodal","monthKey":"2026-11","publishedAt":"2026-11-04T18:55:33Z","source":"arXiv cs.RO","summaryHtml":"ヒューマノイドロボットは幅広い物理タスクの自動化を担う潜在力を持つが、汎用的な自律性への進歩はデータのボトルネックに制約されている。ピクセルと自由形式の言語を低レベルの関節指令へ結びつけるには対になった教師データが必要だが、十分な規模のコーパスは存在しない。人間の遠隔操作やウェアラブル計測に頼る方法では、1時間のデータを得るのに少なくとも1時間の人手がかかる。<br><br>本論文の「HALO」は、手続き的に生成した1,000軒の家屋にわたって視覚・言語・動作データを合成するパイプラインで駆動されるヒューマノイド自律システムである。コーパスは人間の労働ではなく計算量に応じて拡大する。<br><br>HALOは、椅子に座る、名前で指定された物体へ移動する、半開きのドアを横向きに通り抜ける、テーブルの下をかがんで這う、箱を押すといった身体技能のレパートリーを獲得し、それらを組み合わせて複合的で長期のタスクを解く。実在の家屋を一度も見ずに合成データだけで学ぶアプローチの到達点を示している。","timestamp":1793818533000,"title":"Perceptive Humanoid Motion from Simulation","titleJa":"シミュレーションから学ぶ知覚的ヒューマノイド動作――HALO","url":"https://arxiv.org/abs/2611.06908"},{"authors":["Michal Korniak","Marco Bagatella","Ralf Römer","Michal Nauman","Yarden As","Pranav Vignesh","Manan Agarwal","Leander Diaz-Bone","Piotr Zalewski","Mikołaj Czarnecki","Lenart Treven","Shashwat Saxena","Sreyas Venkataraman","Sarvesh Patil","Zhiyuan Zhou","Daniel Marta","Oier Mees","Nur Muhammad Mahi Shafiullah","Carmelo Sferrazza","Bhavya Sukhija","Angela P. Schoellig","Andreas Krause","Max Simchowitz","Andrew Wagenmaker"],"categories":["cs.LG","cs.RO"],"field":"cs.LG","genre":"Robotics","monthKey":"2026-11","publishedAt":"2026-11-04T18:52:28Z","source":"arXiv cs.LG","summaryHtml":"汎用ロボットポリシーの登場により、単一の大規模モデルが膨大な事前学習コーパスから多様なタスクを学べるようになった。これらのモデルは強力なゼロショット汎化を示す一方、実配備で十分な性能を得るには適応の段階が通常必要である。強化学習（RL）による反復的な自己改善はその適応策として有望視されてきたが、従来の検討は、狭い配備タスクの改善だけを目指す単一タスク設定にほぼ限られていた。<br><br>本研究は、汎用ポリシーが配備先で多様なタスクを同時に狙う「マルチタスクで汎用的な改善」を実現できるか、そしてそれを可能にするアルゴリズムのレシピは何かを問う。<br><br>著者らはまず、汎用的改善の能力を検証する構造化された評価群を開発し、系統的な検討を行った。ベースポリシーのマルチタスク性と矛盾しない形で、RLによる自己改善を複数タスクへ同時に効かせるための条件と手法を明らかにすることを目指している。","timestamp":1793818348000,"title":"Reinforcement Learning Enables Scaling Generalist Robot Policy Improvement","titleJa":"強化学習で汎用ロボットポリシーを「汎用的に」改善する","url":"https://arxiv.org/abs/2611.06905"},{"authors":["Yiwen Chen","Qiqi Hou","Jisoo Jeong","Yinhao Zhu","Huaizu Jiang","Amir Said"],"categories":["cs.CV"],"field":"cs.CV","genre":"Vision / Multimodal","monthKey":"2026-11","publishedAt":"2026-11-04T18:49:35Z","source":"arXiv cs.CV","summaryHtml":"JEPA式の世界モデルは観測を再構成せずに行動条件付きの潜在ダイナミクスを学ぶが、分布的な正則化だけでは、表現が制御に必要な情報を保つ保証がない。本論文は、エンコーダがエピソード固有の静的内容を保持する一方で、マニピュレーションに関わる状態変化を抑え込んでしまう失敗モード「静的崩壊（static collapse）」を特定する。静的内容は時間的に予測可能でエピソードごとに多様なため、SIGRegのような正則化でもこの失敗は生き残ってしまう。<br><br>OGBench-Cubeでの制御研究では、背景をランダム化すると、操作タスク自体は変わらないのに計画性能が大幅に低下することが示された。<br><br>対策として著者らは「動作誘導型対照正則化」を提案する。予測した潜在遷移を、同じエピソード内の候補観測への遷移と比較し、静的な背景の同一性を行動結果の区別に使いにくくする。最適化の詳細はモデルが背景ではなく、行動に伴う状態変化を捉えるよう促す方向に設計されている。","timestamp":1793818175000,"title":"Motion-guided Contrastive Regularization For Latent World Models","titleJa":"潜在世界モデルの「静的崩壊」を防ぐ――動作誘導型の対照正則化","url":"https://arxiv.org/abs/2611.06901"},{"authors":["Chibueze Praise Onyenweaku","Toyibat Adele","Sikirulahi Opeyemi Abdulkareem","Obed Honour Eje"],"categories":["cs.CV","cs.AI"],"field":"cs.CV","genre":"Robotics","monthKey":"2026-11","publishedAt":"2026-11-04T18:49:13Z","source":"arXiv cs.CV","summaryHtml":"歩行者が遮蔽されていると分かること自体が、隠れたピクセルを復元できなくてもロボットには有用である。しかし遮蔽の推定器は通常、配備環境ではめったに得られない遮蔽アノテーションで訓練される。本論文は、カメラのみのパイプラインがすでに計算している2つの距離推定から、遮蔽を読み取れることを示す。<br><br>仕組みは単純である。見かけの高さは遮蔽の影響をほとんど受けない（検出ボックスは人物全体に張られるため）一方、単眼のメートル深度は遮蔽物側へ引っ張られる（ボックス内で最も近い面が深度マップの値になるため）。両者の順序関係だけを使えばよく、焦点距離も身長も深度のスケールも不要で、深度モデルの誤差がほぼ純粋なゲインであるという条件はラベルなしで確認できる。<br><br>このスコアはKITTIで重度の遮蔽をAUC 0.909で検出し、検出器が見逃した歩行者を含む全アノテーション対象でも0.888を記録した。訓練も遮蔽ラベルも不要で、距離の代理変数でもない（固定した距離帯の中でもAUCは維持される）ことが示されている。","timestamp":1793818153000,"title":"Occlusion for Free: Detecting Occlusion from the Disagreement Between Two Monocular Distance Cues","titleJa":"2つの単眼距離手がかりの「不一致」から遮蔽を読み取る","url":"https://arxiv.org/abs/2611.06899"},{"authors":["Khalid Tounoussi","Mohammed Sayagh","Ali Ouni","Yutaro Kashiwa"],"categories":["cs.SE"],"field":"cs.SE","genre":"Vision / Multimodal","monthKey":"2026-11","publishedAt":"2026-11-04T18:47:50Z","source":"arXiv cs.SE","summaryHtml":"Model Context Protocol（MCP）は、LLMエージェントが外部ツールやデータへアクセスするための標準である。そのソフトウェア生態系を研究するには、サーバのインターフェース、それを設定するプロジェクト群、そして開発活動を結びつける必要があるが、情報はディレクトリ、パッケージレジストリ、設定ファイル、リポジトリ履歴に散在している。<br><br>本論文はこれらを統合した関係データセット「MCP-Eco」を提示する。凍結版リリースは19のParquetテーブルに16,880,899件のレコードを含み、候補サーバプロジェクト78,302件、利用側候補リポジトリ16,165件、設定宣言9,200件をカバーする。うち5,975件の宣言が5,138組のリポジトリ―サーバ対へ解決される。<br><br>ツール・リソース・プロンプトの説明、宣言された依存関係、プルリクエストやレビュー、イシューなどの開発記録も含まれる。MCP生態系の実態を定量的に研究するための基盤データである。","timestamp":1793818070000,"title":"MCP-Eco: A Linked Dataset of MCP Servers, Consumers, and Development Activity","titleJa":"MCP-Eco――MCPサーバと利用側プロジェクト、開発活動をつなぐ大規模データセット","url":"https://arxiv.org/abs/2611.06897"},{"authors":["Jack Nugent","Jia Deng"],"categories":["cs.CV"],"field":"cs.CV","genre":"Vision / Multimodal","monthKey":"2026-11","publishedAt":"2026-11-04T18:42:28Z","source":"arXiv cs.CV","summaryHtml":"多くのコンピュータビジョン課題で、ニューラルネットは平均誤差を小さく訓練できるのに、一見単純な場面で失敗する。失敗を減らすにはまず失敗を見つける必要があるが、それは固定データセットの中にあるとは限らない。本論文は、手続き的生成器の入力空間を探索して難しい事例を見つける、ミニマックス訓練と敵対的評価の枠組み「手続き的敵対学習（PAL）」を研究する。<br><br>手続き的生成器は、レイアウト・照明・姿勢などの低次元な制御パラメータを、描画画像とそのラベルへ写す解釈可能なプログラムである。著者らは、生成器のパラメータ空間でゼロ次最適化を行い、オンデマンドに敵対的訓練サンプルを提案するSimple-PATアルゴリズムを導入した。<br><br>あわせて、表面法線推定、画像セグメンテーション、人間の姿勢推定のための効率的な手続き的生成器群「PAL-Dojo」を構築した。実データの分布の外側にある失敗例を能動的に掘り起こし、訓練へ還元するアプローチである。","timestamp":1793817748000,"title":"Procedural Adversarial Learning","titleJa":"手続き的敵対学習――生成器のパラメータ空間で「難しい事例」を探す","url":"https://arxiv.org/abs/2611.06890"},{"authors":["Siyi Yu"],"categories":["cs.AI","cs.HC","econ.GN"],"field":"cs.AI","genre":"LLM / NLP","monthKey":"2026-11","publishedAt":"2026-11-04T18:41:40Z","source":"arXiv cs.AI","summaryHtml":"自動化はしばしば「単調（dull）・汚い（dirty）・危険（dangerous）」な仕事からの解放として正当化される。本論文は、米国の754の職業についてO*NETの21項目を用い、こうした労働条件と職業別AI曝露（AIへの晒され度）との関係を検討する。<br><br>曝露が高い職業ほど条件スコアは低いという関連が、大規模言語モデル（LLM）による尺度とAIOE（AI職業曝露）の双方で、職業均等重みでも雇用重みでも見られた。身体的負荷、必要な学歴、訓練と経験、賃金で調整すると複合的な関連は弱まり、調整後の信頼区間はLLM曝露ではゼロを含み、AIOEではゼロ未満にとどまった。<br><br>反復作業と裁量の制限を分けるかどうかで、統合された「単調」スコアの意味も変わる。これらの比較は、項目のまとめ方と職業特性が曝露推定の解釈を左右することを示す。「AIが引き受けるのはつらい仕事だ」という単純な物語への実証的な留保である。","timestamp":1793817700000,"title":"Dull, Dirty, Dangerous? Working Conditions and the Limits of Occupational AI Exposure","titleJa":"単調・汚い・危険？――労働条件と職業別AI曝露の限界","url":"https://arxiv.org/abs/2611.06888"},{"authors":["Shuangyu Xie","Kaiyuan Chen","Uksang Yoo","Xinyue Zhu","Meadow Shen","Jaimyn Drake","Eugen Solowjow","Lionel Gulich","Alexander Millane","Rafael Cathomen","Tuur Stuyck","Sangeeta Subramanian","Yichao Pan","Bruce McGowan","Michael Benedict","Linxi Fan","Yuke Zhu","Spencer Huang","Ken Goldberg"],"categories":["cs.RO"],"field":"cs.RO","genre":"LLM / NLP","monthKey":"2026-11","publishedAt":"2026-11-04T18:38:01Z","source":"arXiv cs.RO","summaryHtml":"ロボットが商業・産業用途で信頼性高く働くには、物体の形状や姿勢に既知のばらつきがあるなかで、特定のタスクを持続的にこなす必要がある。著者らはこれを固定自動化と区別して「変分自動化（Variational Automation）」と呼ぶ。<br><br>事前学習済みLLM・VLMのコーディングエージェントが、解釈可能なロボットプログラミングとモデルフリー方策の開世界適応性を組み合わせる「エージェンティックロボティクス」の近年の流れを踏まえ、本論文はベンチマーク設計の一般基準――アクセスのしやすさ、再現性、多様性、実応用への関連、物理的実現可能性、飽和への耐性、計算効率――を提案する。<br><br>その原則を、産業・医療・インフラにまたがる6つの操作タスク類型（工具の仕分け、工具掛け、ギア噛み合わせ、注射器の梱包、ケーブル挿入、ケーブル配線）で具体化したものが「VABAR」である。","timestamp":1793817481000,"title":"VABAR: A Variational Automation Benchmark for Agentic Robotics","titleJa":"VABAR――エージェンティックロボティクスのための変分自動化ベンチマーク","url":"https://arxiv.org/abs/2611.06881"},{"authors":["Benjamin Jacob Bodner"],"categories":["cs.LG","cs.NE","math.OC"],"field":"cs.LG","genre":"Robotics","monthKey":"2026-11","publishedAt":"2026-11-04T18:35:35Z","source":"arXiv cs.LG","summaryHtml":"連続ブラックボックス問題に最適な古典的最適化手法は、予算と地形（ランドスケープ）に依存する。既存のルータは次元と予算、過去の改善、単一ベンチマークへ当てはめた特徴から判断し、最適化手法の暗黙の仮定をオンラインで検証するものは少ない。<br><br>「AMM（Adaptive Multi Mode）」は、既知の予算を準ニュートン法、信頼領域法、座標法、多スタート法、進化戦略の各エンジンへ配分するルータである。曲率、平坦域、分離可能性、折れ点、盆地、フラクタル構造を調べるオンラインプローブを用い、各プローブには既定値、次元×予算の有効範囲、予算へ課金されるコストが付く。<br><br>bbobでの事前登録つき開発ループでは、最後の16回の確認のうち32/36件の予測が的中した。続いて保留してあったbbobインスタンス101–110（次元2–40）で最大7つの競合手法と一度だけ対決し、600の関数×次元×予算セルのうち382セルで最高の目標到達シェアを記録した（単独最高236、タイ146）。","timestamp":1793817335000,"title":"Adaptive Multi Mode: Budget-Aware Routing of Optimizers By Online Landscape Probes","titleJa":"Adaptive Multi Mode――地形のオンラインプローブで最適化エンジンを予算に応じて切り替える","url":"https://arxiv.org/abs/2611.06879"},{"authors":["Yulu An","Yifei Feng","Xiangyang Yin"],"categories":["cs.CL"],"field":"cs.CL","genre":"LLM / NLP","monthKey":"2026-11","publishedAt":"2026-11-04T18:34:41Z","source":"arXiv cs.CL","summaryHtml":"LLMエージェントは増え続ける対話履歴を管理するために文脈圧縮（コンテキスト・コンパクション）を使うが、長い履歴を大規模モデルで要約すると大きな遅延が生じる。圧縮には、情報の保持とレイテンシのバランスが求められる。著者らは、構造化された要約スロットが独立に生成されても情報を保持できるという観察に着目した。<br><br>提案する「SpecCompact」は、スロット並列の意味的投機によって圧縮を高速化する枠組みである。小さなドラフタをファインチューニングしてスロットを並列に生成し、ターゲットモデルが各行を検証して却下された内容を修復する。その後のドラフトは更新されたスロット接頭辞を使う。システム面の最適化により、文脈処理の繰り返しとモデル呼び出しも削減される。<br><br>AppWorldとτ³ベンチマークで2つのターゲットモデルを用いた評価では、Hermes式の要約に対して2.04〜5.63倍の圧縮高速化を達成した。下流タスクでの別途評価も行われ、速度と品質の両立が検討されている。","timestamp":1793817281000,"title":"SpecCompact: Accelerating LLM Agent Context Compaction with Slot-Parallel Semantic Speculative Verification","titleJa":"SpecCompact――スロット並列の投機的検証でLLMエージェントの文脈圧縮を高速化","url":"https://arxiv.org/abs/2611.06876"},{"authors":["Samira Malek"],"categories":["cs.AI"],"field":"cs.AI","genre":"Scientific AI","monthKey":"2026-11","publishedAt":"2026-11-04T18:29:31Z","source":"arXiv cs.AI","summaryHtml":"誤り訂正符号は通信システムの基盤であり、ノイズのあるチャネルでも信頼性の高いデータ伝送を可能にする。近年、ニューラル復号器は古典的な反復アルゴリズムを上回る性能を示してきた。本論文は、メッセージ伝播の対称性を保ちながら復号器の学習能力を高めた「一般化信念伝播ネットワーク（GBPNet）」を提案する。<br><br>アーキテクチャはタナーグラフ構造を維持したまま、変数ノード更新のカスケードと、学習される要素ごとのメッセージスケーリングを用いる。訓練戦略として、段階的に難しくするプログレッシブ訓練と高SNR訓練の2つも導入し、復号精度を改善する。<br><br>複数の線形符号での実験では、GBPNetは従来の信念伝播や、評価対象とした最先端のニューラル復号器よりも低いビット誤り率を達成した。古典アルゴリズムの構造を捨てずに学習を組み込む設計の有効例である。","timestamp":1793816971000,"title":"Learning to Decode Linear Codes with Generalized Belief Propagation Network","titleJa":"一般化信念伝播ネットワークで線形符号の復号を学習する","url":"https://arxiv.org/abs/2611.06874"},{"authors":["Wanqi Yuan","Nianyi Li"],"categories":["cs.CV"],"field":"cs.CV","genre":"Vision / Multimodal","monthKey":"2026-11","publishedAt":"2026-11-04T18:25:55Z","source":"arXiv cs.CV","summaryHtml":"既存の連続時空間ビデオ超解像（STVSR）は、2つの終端フレームだけから動きを推測し、両方向の動きを独立にモデル化することが多く、対応付けの曖昧さや軌道の不整合に弱い。本論文は、長文脈エンコーディング、連続的な高解像度特徴のリフト、そして終端に固定した「PixelSpline」を組み合わせた連続STVSRフレームワークを提案する。<br><br>長い観測はより信頼できる終端表現を与え、連続アップサンプリングは要求された高解像グリッド上に直接、詳細な外観特徴を構築する。PixelSplineは各ピクセルの動きを、両終端で共有される単一の連続軌道として明示的にモデル化する。<br><br>この軌道を使って終端の色を粗い中間フレームへワープし、高解像特徴を位置合わせして残差を再構成する。空間・時間の各種アップサンプリング設定での実験により、品質と効率の良好なバランスが示された。","timestamp":1793816755000,"title":"PixelSpline: Continuous Space-Time Video Super-Resolution via Endpoint-Anchored Shared Pixel Trajectories","titleJa":"PixelSpline――終端に固定した共通ピクセル軌道による連続時空間ビデオ超解像","url":"https://arxiv.org/abs/2611.06870"},{"authors":["Jalaj Bhandari","Dhawal Gupta","Hongli Zhan","Zhenting Wang","Varad Pimpalkhute","Zhengzhong Liu","Eric Xing","Rupesh Srivastava"],"categories":["cs.AI"],"field":"cs.AI","genre":"LLM / NLP","monthKey":"2026-11","publishedAt":"2026-11-04T18:23:14Z","source":"arXiv cs.AI","summaryHtml":"本研究は、複雑で長期のタスクに取り組むLLMエージェントに対して、「ターン単位のBest-of-Nサンプリング」に基づく単純な推論時スケーリング手法を評価する。生成器と選択器の2つのLLMからなる枠組みで、各ターンに生成器モデルがN個の行動候補を出し、選択器モデルがそのうち1つを選んで環境で実行する。<br><br>推論時の誘導探索に批評家（クリティック）モデルを使った先行研究と異なり、本研究は、市販のオープンウェイトLLMが候補行動同士を直接比較して有効に機能するかを検証する点に特徴がある。<br><br>長期のターミナルタスクでの実験では、この手法が精度（5〜10%）と試行間の一貫性の両面で有意な改善をもたらした。エージェントの軌跡分析では、行動の質の変化も観察されている。訓練なしに推論時の計算でエージェントを底上げする実践的な選択肢である。","timestamp":1793816594000,"title":"On Turn-Level Best-of-N Sampling for Scaling LLM Agents","titleJa":"ターン単位のBest-of-NサンプリングでLLMエージェントをスケールさせる","url":"https://arxiv.org/abs/2611.06868"},{"authors":["Jasem Khelifi","Hao Li","Ali Ouni","Mohammed Sayagh","Mohamed Aymen Saied"],"categories":["cs.SE"],"field":"cs.SE","genre":"Vision / Multimodal","monthKey":"2026-11","publishedAt":"2026-11-04T18:20:41Z","source":"arXiv cs.SE","summaryHtml":"エージェンティックワークフローは、AIエージェントがスケジュールやリポジトリのイベントに応じて繰り返しのリポジトリ作業を行う仕組みである。既存研究はワークフローの定義と出力を調べるが、実行中に何が起きているかの証拠は限られていた。本論文は、その実行証拠を結びつけたデータセット「GH-AWTrace」を提示する。<br><br>データセットは、検証済みのGitHub Agentic Workflows 25,014件（5,051リポジトリ）を、4,112,526件の実行記録と562,877件の空でない実行ログアーカイブへ結びつける。実行証拠はGitHubのログ保持制限の範囲で保存され、リポジトリのメタデータと生成されたワークフロー設定にもリンクされる。<br><br>事例からは、ツール拒否、プロバイダ障害、エージェントの方針変更、エージェント間の委任といった、ログでなければ見えない事象が読み取れる。実行の失敗、ツール使用、報告された実行結果と実際のタスク進捗との関係を研究する土台となる。なおカバレッジはワークフローごとに異なり、ログは部分的な観測にとどまる。","timestamp":1793816441000,"title":"GH-AWTrace: A Large-Scale Dataset of GitHub Agentic Workflow Execution Logs","titleJa":"GH-AWTrace――GitHubのエージェンティックワークフロー実行ログ大規模データセット","url":"https://arxiv.org/abs/2611.06866"},{"authors":["Ankit K. Upadhyay","Aleksandr Algasov","Ekaterina Nepovinnykh","Fedor Zolotarev","Tuomas Eerola","Heikki Kälviäinen","Charles V. Stewart","Lukas Picek"],"categories":["cs.CV","cs.AI","cs.LG"],"field":"cs.CV","genre":"Vision / Multimodal","monthKey":"2026-11","publishedAt":"2026-11-04T18:19:26Z","source":"arXiv cs.CV","summaryHtml":"動物の個体識別の自動化は、小規模な curated 研究から、共有ベンチマークや再利用可能な基盤モデルへと進みつつある。しかし現在の評価は、マッチの背後にある証拠を未解決のままにしている。高い検索精度は、モデルが動物の特徴を使ったのか、個体と相関する近道（ショートカット）を使ったのかを示さない。<br><br>本論文は、証拠を意識した評価プロトコル「反事実的前景検索（CFR）」を提案する。CFRは同じクエリ―ギャラリー課題を、全面画像、前景のみ、近道のみという異なる見え方で評価する。全面画像は標準の検索性能を、前景のみは前景に支えられた検索を、近道のみは背景やシルエットからどれだけ個体信号が回復できるかを測る。<br><br>これにより、検索スコアは「証拠プロファイル」へと変わる。元の画像でどれだけ性能が出るか、その性能のどれだけが動物自体を見たときに残るか、そしてどれだけが背景などの近道に依存していたか――識別モデルの信頼性を吟味する枠組みである。","timestamp":1793816366000,"title":"CounterFactual Retrieval for Evidence-Aware Individual Animal Identification","titleJa":"反事実的検索――動物個体識別の「証拠」を問う評価プロトコル","url":"https://arxiv.org/abs/2611.06864"},{"authors":["Siddharth Aphale","Ayushman Singh"],"categories":["cs.RO"],"field":"cs.RO","genre":"Agents / Reasoning","monthKey":"2026-11","publishedAt":"2026-11-04T18:19:24Z","source":"arXiv cs.RO","summaryHtml":"コードを方策とするエージェントは、実行フィードバックを使って失敗したプログラムを再試行することが多い。追加のサンプリングやタスクガイダンスも成功率を上げるため、失敗に特化したフィードバックの寄与は不明瞭だった。本研究はこの問いを、シミュレーション上のロボット操作で検証する。<br><br>固定のルックアップが失敗ラベルとAPIの種類からフィードバックテンプレートを選び、凍結されたコードモデルが場面リセットのたびに新しいプログラムを生成する。同じ252件の初期失敗に対して、Qwen2.5-Coder-7Bは5回までの再試行で85.3%を回復し、同じ再試行上限での再サンプリング（68.3%）を上回った。この優位は総トークン予算を固定しても持続した。<br><br>一方、他のエピソードからのフィードバックや固定のタスクガイダンスでも同程度の回復率が得られ、粗い失敗ラベルを一致させる利益は検出されなかった。別の検証では、最初から誘導プロンプトを使う方法がテンプレート式フィードバックと同程度の成功率を示した。「失敗特化フィードバックが効いている」という想定への実証的な問い直しである。","timestamp":1793816364000,"title":"Rethinking Self-Repair in Code-as-Policy Agents: What Drives Retry Success?","titleJa":"コード型ポリシーエージェントの自己修復――再試行の成功を左右するのは何か","url":"https://arxiv.org/abs/2611.06863"},{"authors":["Kai Ponel","Marco Polignano","Erasmo Purificato","Aylin Julia Temizkan","Marco Levantesi","Giovanni Semeraro","Ernesto William De Luca"],"categories":["cs.CL","cs.IR","cs.LG"],"field":"cs.CL","genre":"LLM / NLP","monthKey":"2026-11","publishedAt":"2026-11-04T18:15:08Z","source":"arXiv cs.CL","summaryHtml":"階層型テキスト埋め込みモデルは可変長の表現を提供し、量子化は数値精度を下げて計算効率を高める。両者は直交する既存の技術だが、その相互作用は十分に調べられてこなかった。本研究は、この2つの効率化手法がどう干渉するかを実証的にベンチマークする。<br><br>評価はMTEBの38タスクで、4つのTransformer系埋め込みモデルを用い、1次元・2次元の階層表現と32ビット・8ビット・バイナリ量子化を組み合わせた、タスクあたり168構成を検証する。効率の次元は分けて報告され、理論上のベクトルあたり記憶量と、エンドツーエンドの評価時間が示される。<br><br>Friedman検定とNemenyi事後分析では、int8量子化はペア分類と再ランキングでfloat32と統計的に区別がつかず、全体でも最大1.5ポイントのコストにとどまった。一方、バイナリ量子化は全タスクカテゴリで有意に悪かった。埋め込み次元を半分にすることの影響もあわせて検討されている。","timestamp":1793816108000,"title":"Balancing hierarchical representation and quantization: A performance trade-off in text embeddings","titleJa":"階層表現と量子化のバランス――テキスト埋め込みの性能トレードオフ","url":"https://arxiv.org/abs/2611.06859"},{"authors":["Xinrui Zhong","Zhifeng Li","Zhiming Wang","Yongqi Liu","Shanglin Yang","Yang Zhou","Zikun Li","Zhuoming Chen","Beidi Chen"],"categories":["cs.AI"],"field":"cs.AI","genre":"Vision / Multimodal","monthKey":"2026-11","publishedAt":"2026-11-04T18:14:50Z","source":"arXiv cs.AI","summaryHtml":"再帰的自己改善には、後続のシステムが使うモデルや基盤をAIシステム自身が改善することが求められる。LLM圧縮はその具体的な効率化目標となる。事前学習済みモデルの振る舞いを、より小さなモデル記憶予算の中に保持することである。本研究は、コーディングエージェントがこの工程を自律的に遂行できるかを問う。<br><br>圧縮はターミナルタスクとして定式化される。エージェントはソースのチェックポイント、記憶容量の上限、推論環境、時間予算を与えられ、圧縮された重みと実行可能な推論コードを構築する。アルゴリズムと実験の進め方はエージェントが握り、パープレキシティのフィードバックが探索を導き、独立した検証が最終モデルを確認する。<br><br>6つのエージェントと6つのモデル×サイズ設定で、36件の提出のうち29件が検証に合格した。タスクごとに最もパープレキシティの低い設計を選ぶと、BF16比で平均3.4%のパープレキシティ増、下流精度77.33%（BF16は79.56%）となった。記録された実験の過程も分析されている。","timestamp":1793816090000,"title":"CompressionBench: How can your coding agents compress LLMs?","titleJa":"CompressionBench――コーディングエージェントにLLM圧縮を任せられるか","url":"https://arxiv.org/abs/2611.06858"},{"authors":["Haoxiang Cao","Yuxuan Zhang","Penghui Du","Bo Li","Jiajiong Cao","Yingying Fan","Zimeng Wu","Yifu Luo","Mingzhe Zheng","Junwen Miao","Huaisong Zhang","Yang Yao","Yu Wang","Dongfu Jiang","Ping Nie","Wenhu Chen","Chaoqun Wang","Changqian Yu","Kelsey R. Allen"],"categories":["cs.CV","cs.CL"],"field":"cs.CV","genre":"Vision / Multimodal","monthKey":"2026-11","publishedAt":"2026-11-04T18:11:56Z","source":"arXiv cs.CV","summaryHtml":"エージェント駆動の画像生成の時代に向け、本論文は長文脈・複数参照の画像合成のための、おそらく初の専門家設計・専門家検証ベンチマーク「LongBanana」を提案する。このタスクは、散らばった視覚的証拠を検索し、妨害要素を退け、実体と関係を結びつけ、複数の参照から1枚の一貫した最終画像を構成することを要求する。<br><br>LongBananaは3×3の分類体系で編成された90件の入念に設計されたタスクを含み、各タスクは約32枚の参照画像、20の制約、50の評価項目を持ち、専門家が指定した原子的評価項目は合計4,670件に上る。グラフに基づく評価設計は、各タスクを参照画像と実体―関係グラフで具体化し、ノード・エッジ・グラフ全体への義務を、内容の忠実性、関係の結合、全体制約の充足のチェックリスト項目へ変換する。<br><br>専門家のラベルには15%の二重ラベル付きサブセットが含まれ、完全一致率は89.4%だった。参照を束ねて一貫した画像を作る現行モデルの能力と限界を、細粒度に測る物差しである。","timestamp":1793815916000,"title":"LongBanana: An Expert-Verified Benchmark for Long-Context Multi-Reference Image Synthesis","titleJa":"LongBanana――長文脈・複数参照の画像合成を測る専門家検証ベンチマーク","url":"https://arxiv.org/abs/2611.06856"},{"authors":["Timothy Christensen","Daniel Vebman"],"categories":["econ.EM","stat.ML"],"field":"econ.EM","genre":"Generative Models","monthKey":"2026-11","publishedAt":"2026-11-04T18:10:56Z","source":"arXiv econ.EM","summaryHtml":"一部の共変量が内生的である線形回帰では、内生性を統制するのに十分な変数が存在しても、それ自体は観測できない潜在変数である場合がある。たとえば、異なるAI・機械学習手法でその潜在変数を安価に、しかし不完全に補完すれば、手法ごとに異なる代理変数（プロキシ）が得られる状況がこれにあたる。実務家はそうした代理変数を大量に生成できる。本研究は、そうした状況で実務家が取りうる選択肢――すべての代理変数やそこから計算した因子を統制に含める方法、操作変数推定、その非線形の変種――を、透明なモデルで比較する。<br><br>各アプローチが暗黙に狙う推定対象（エスティマンド）を導出し、それが関心のあるパラメータを回復する条件を明らかにしたうえで、実務的な推奨を示す。代理変数の扱い方によって狙う対象が変わるため、手法の選択は単なる実装の違いではなく、推定しているものの違いになる。<br><br>十分に豊かな生成統制変数の集合があれば、検証データに頼らずとも関心パラメータを一致推定できることが示された。AIが生成した代理変数を計量分析に組み込む際の理論的な足場となる研究である。","timestamp":1793815856000,"title":"Regression with Many Generated Controls","titleJa":"生成された統制変数が多い回帰――潜在変数の代理を大量に使う推定","url":"https://arxiv.org/abs/2611.06855"},{"authors":["Pranjal Aggarwal","Sean Welleck"],"categories":["cs.CV","cs.LG"],"field":"cs.CV","genre":"Vision / Multimodal","monthKey":"2026-11","publishedAt":"2026-11-04T18:10:33Z","source":"arXiv cs.CV","summaryHtml":"コンピュータ操作エージェント（CUA）は近年、いくつかの長期ベンチマークで人間を超える性能に達した。しかし計算コストが、長期タスクやビデオゲームのようなリアルタイム領域での利用を制約している。主要なボトルネックは、各スクリーンショットを数千の視覚トークンとして表現することであり、対話履歴が伸びるにつれて長い文脈へ蓄積していく。<br><br>著者らは、これらの視覚トークンの大半が、エージェントの次の行動にとって意味的に無関係か、スクリーンショット間で時間的に冗長であることを観察した。この観察に基づき、行動予測に必要な情報を保つ疎な視覚表現を学ぶ共同訓練フレームワーク「Visual Token Routing（VTR）」を提案する。<br><br>VTRでは、視覚言語モデルと軽量な時空間ルータを一緒に訓練する。ルータは現在と過去のスクリーンショットの各画像領域を調べ、その視覚トークンを残すかどうかを判断する。文脈の肥大化を抑えながら行動に必要な情報を残す設計である。","timestamp":1793815833000,"title":"Visual Token Routing: Learning to keep tokens that matter","titleJa":"Visual Token Routing――「重要なトークンを残す」ことを学ぶ視覚表現","url":"https://arxiv.org/abs/2611.06854"},{"authors":["Hanyu Chen","Noah Snavely"],"categories":["cs.CV"],"field":"cs.CV","genre":"Vision / Multimodal","monthKey":"2026-11","publishedAt":"2026-11-04T18:05:22Z","source":"arXiv cs.CV","summaryHtml":"最先端のフィードフォワード再構成モデルは、野外の物体中心写真コレクションでは性能が振るわない。これらは主に、物体と環境がほぼ固定された単一セッションの撮影で訓練されており、視点だけが変わるデータを前提にしている。一方、公開写真アーカイブには別の形の多視点データがある。同じ物体や設計を、多くの人々が年月・環境・カメラを変えて、時には実物個体も変えて撮影した「拾い集めた写真（found photos）」である。<br><br>本研究は、Wikimedia Commonsから集めた12,068物体・311,886枚の写真からなるデータセット「Trainspotting」を提案する。各物体について再構成を行い、カメラ姿勢、多視点ステレオ深度、物体マスクを回復する。物体は3つのレジーム――1か所に固定された物体、場所を移動する物体、多くの実物で共有される設計――に分類される。<br><br>近年のフィードフォワード再構成モデルをTrainspottingで評価すると、深刻な失敗が明らかになった。管理された撮影とは異なる、現実の写真集合の難しさを突きつけるデータセットである。","timestamp":1793815522000,"title":"Trainspotting: Learning Object-Centric 3D Reconstruction from Found Photos","titleJa":"Trainspotting――「拾い集めた写真」から物体中心の3次元再構成を学ぶ","url":"https://arxiv.org/abs/2611.06849"},{"authors":["Austin C. Kozlowski","Avital Mintz","Madison Lee"],"categories":["cs.CL"],"field":"cs.CL","genre":"LLM / NLP","monthKey":"2026-11","publishedAt":"2026-11-04T18:05:17Z","source":"arXiv cs.CL","summaryHtml":"線形プローブやスパースオートエンコーダ（SAE）など、LLMの特徴を監視する一般的な手法は、特徴が文脈を越えて一貫した表現を保つことを前提にしている。しかしLLMは異なる視点や「ペルソナ」を柔軟に採用でき、その背後には異なる概念関係の体系が示唆される。本論文は、LLMにペルソナを採用させるプロンプトが、モデルの潜在空間の表現幾何を変えるかどうかを検証する。<br><br>著者らは、リベラルと保守の政治的ペルソナを採用したモデルと2つの中立なベースラインから、9,000超の一般語と33の意味軸の表現を抽出して比較した。<br><br>結果として、ペルソナ条件づけは、語の意味軸への射影と、軸同士の整合の双方を、指定されたイデオロギーと整合する方向へ体系的に変えることが分かった。さらに、この再編成が安全性に関わる2つの特徴監視のタスクへ及ぼす影響も検証されている。特徴の監視可能性そのものがペルソナに依存するとい
