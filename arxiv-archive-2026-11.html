う、解釈可能性研究への示唆である。","timestamp":1793815517000,"title":"Persona Perspectives: Adopting Viewpoints Reorganizes Representations in LLMs","titleJa":"ペルソナという視点――LLMの表現は立場の採用で組み替わる","url":"https://arxiv.org/abs/2611.06848"},{"authors":["Grant Shanklin","Jiří Němeček","Asia Biega"],"categories":["cs.LG","cs.CY"],"field":"cs.LG","genre":"LLM / NLP","monthKey":"2026-11","publishedAt":"2026-11-04T18:03:15Z","source":"arXiv cs.LG","summaryHtml":"忠実性（faithfulness）は、アルゴリズムによる説明がモデルの振る舞いを正確に反映することを要求する。しかし忠実性の既存の操作化（測り方）は、同じ説明が忠実かどうかについて互いに食い違うことがあり、開発者や監査者は相争う評価の間で選択を迫られる。本論文は、評価基準同士の不一致を調査し、説明の忠実性を評価するための実践的な道筋を提示する。<br><br>著者らはまず、忠実性の操作化が互いにどう異なるかを特定する。次に「忠実性汎関数」を導入し、不一致の所在を、説明がモデルについて何を主張するのか、どの比較がその主張に関わるのか、その比較群の一致をどう集約すべきか、という点に位置づける。そして既存の評価基準をこの汎関数の内側に再構成する。<br><br>著者らの主張では、この再構成は、忠実性をモデルと説明の間の共通だが完全には仕様化されていない関係として理解することを支持する。基準間の差は、測る対象そのものの違いではなく、仕様化の選択の違いを反映しているという整理である。監査実務で評価基準を選ぶ際の理論的な足場となる。","timestamp":1793815395000,"title":"Navigating Disagreement Among Criteria for Evaluating Explanation Faithfulness","titleJa":"説明の忠実性をどう測るか――評価基準同士の不一致をどう扱うか","url":"https://arxiv.org/abs/2611.06846"},{"authors":["Yingying Yan","Jiaqi Tang","Wei Wei","Qianzhou Wang","Lei Zhang","Jianmin Chen","Yuyang Xia","Botong Geng","Jinjian Wu","Qifeng Chen"],"categories":["cs.CV"],"field":"cs.CV","genre":"Vision / Multimodal","monthKey":"2026-11","publishedAt":"2026-11-04T18:01:24Z","source":"arXiv cs.CV","summaryHtml":"マルチモーダル大規模言語モデル（MLLM）における中心的だが未開拓の問題は、「どこでつなぐか」である。階層的な視覚エンコーダからの視覚情報を、LLMの層ごとの意味へどう配線するか。主流のMLLMは単一層の固定された視覚表現をLLMへ注入し、全LLM層を単一の消費者として扱うため、層ごとに異なる視覚粒度への要求を無視している。近年の多層融合手法も、エンコーダ側で階層特徴を圧縮するか、あらかじめ定義した疎な層間接続に頼り、ViTとLLMの階層間の適応的な相互作用のモデル化には届いていない。<br><br>このギャップに取り組むのが、ルーティング機構「DGP（Dynamic Gated Pathways）」である。DGPはViTの全層とLLMの全層の間に全対全の接続を張り、各LLM層が文脈に応じて視覚層への選好を動的にゲートする。<br><br>視覚情報の「深さ」を層ごとに選び直せるようにすることで、単一の視覚表現の注入よりも細やかなマルチモーダル推論を目指す設計である。接続の場所そのものを学習対象にする視点が新しい。","timestamp":1793815284000,"title":"Where to Connect? Boosting MLLMs via Dynamic Gated Pathways across ALL ViT and LLM Layers","titleJa":"どこでつなぐか――ViTとLLMの全層を動的ゲートで結ぶMLLM","url":"https://arxiv.org/abs/2611.06844"},{"authors":["Eliane Younes","Elie Hachem","Marc Bernacki"],"categories":["cond-mat.mtrl-sci","cs.LG"],"field":"cond-mat.mtrl-sci","genre":"Generative Models","monthKey":"2026-11","publishedAt":"2026-11-04T17:59:26Z","source":"arXiv cond-mat.mtrl-sci","summaryHtml":"熱処理中の結晶粒成長は多結晶材料の微細組織を強く左右し、ひいては機械的性質を決める。フロントトラッキングやフロントキャプチャリングの数値シミュレーションは結晶粒成長を正確に記述できるが、計算コストが高く、長い熱サイクルや非等温サイクルへの適用は限られていた。先行研究では、等温条件のもとで結晶粒径分布を時系列として扱い、リカレントニューラルネットワークでその発展を予測することに成功しており、高コストなPDEシミュレーションではなく数秒で完全な成長軌跡を生成できた。<br><br>本研究はこの予測フレームワークを再定式化し、モデルアーキテクチャへ熱情報を明示的に組み込むことで非等温条件へ対応させる。結晶粒径分布は畳み込みニューラルネットワークで符号化され、熱に関する記述子も入力される。<br><br>実プロセスで一般的な、温度が時間とともに変わる熱処理条件でも結晶粒成長を高速に予測できるようにする試みであり、材料設計のシミュレーションコストを下げる方向の研究である。","timestamp":1793815166000,"title":"Thermally Conditioned Time-Series Forecasting of Grain Growth in Polycrystalline Materials","titleJa":"熱条件を組み込んだ多結晶材料の結晶粒成長の時系列予測","url":"https://arxiv.org/abs/2611.06843"},{"authors":["Xinrui Zhong","Zhiming Wang","Yongqi Liu","Zhaohui Wang","Shanglin Yang","Zikun Li","Zhuoming Chen","Beidi Chen"],"categories":["cs.AI"],"field":"cs.AI","genre":"LLM / NLP","monthKey":"2026-11","publishedAt":"2026-11-04T17:59:07Z","source":"arXiv cs.AI","summaryHtml":"LLMコーディングエージェントは実験を通じてソフトウェアを開発する。その力を使えば、自分たちの運用を支えるサービングシステム自体を設計させることもできる。有効なサービングには、セッション依存性、レイテンシ制約、正しさの要件のもとで、実装と運用の判断を調整することが求められる。本論文は、完全で特化したLLMサービングシステムのエージェント設計を測るベンチマーク「ServerBench」を提案する。<br><br>エージェントは共通の目的――「ドルあたりドル」、すなわちGPUコスト1ドルあたりの、レイテンシ条件を満たしたトークン価値――に対して実験を行う。状態を持つリプレイがセッション依存性を保ち、独立した検証が提出されたシステムを確認する。<br><br>11のコーディングエージェントモデルと3つの配備条件での評価では、Claude Sonnet 5.5がGemma E4Bで2.97ドル/ドルを達成し、vLLM参照実装の4.87倍となった。33回の実行のうち22回が検証済みシステムを生み、13回が最強のベースラインを上回った。分析からは、高価値な設計に共通する3つの知見が特定されている。","timestamp":1793815147000,"title":"ServerBench: How can your coding agents design specialized LLM serving systems?","titleJa":"ServerBench――コーディングエージェントにLLMサービングシステムを設計させられるか","url":"https://arxiv.org/abs/2611.06841"},{"authors":["Liang Yue","Eric A. Vance"],"categories":["cs.CV","cs.LG"],"field":"cs.CV","genre":"Vision / Multimodal","monthKey":"2026-11","publishedAt":"2026-11-04T17:57:53Z","source":"arXiv cs.CV","summaryHtml":"SD3.5-Mediumに物体を12個描かせ、同じ初期ノイズから25個に変えてみる。画像のレイアウトは保たれるが、数は新しいランダムシードのときと同じくらいしか変わらず、方向も一貫しない。本研究は、オープンなテキスト画像生成モデル5つについて、要求がおよそ10個を超えたときに数詞が何をするかを調べる。<br><br>物体と初期ノイズを固定し、一度に1つだけを変えながら、要求を見ていない人々が3,088枚の画像を数えた。すべてのモデルは小さな群衆では数に従うが、それには限界（リーチ）がある。SD3.5-MとFLUX.1-devは10を少し超えたところで従わなくなり、FLUX.2 [klein] とQwen-Imageは25までゆるやかに従う。<br><br>SD3.5-Mのリーチを超えると、初期ノイズの粗い部分が画像の構図を決めるが、物体の数は決めない。画像の1/8より細かいノイズだけを描き直してもレイアウトは新しい数のときと同じくらい保たれる。数詞が「構図の種」として働く一方で、個数の精密な制御には届いていない実態が浮かぶ。","timestamp":1793815073000,"title":"Same Layout, Different Count: What Number Words Do Past Ten in Text-to-Image Models","titleJa":"同じレイアウト、違う数――テキスト画像生成モデルで数詞は「10を超えたら」何をするか","url":"https://arxiv.org/abs/2611.06840"},{"authors":["Peidi Dong","Yunze Xiao","Yu-Lin Tsai","Yichen Zheng","Heyuan Huang","Weihao Xuan","Mark Dredze","Jen-tse Huang"],"categories":["cs.CL"],"field":"cs.CL","genre":"LLM / NLP","monthKey":"2026-11","publishedAt":"2026-11-04T17:54:49Z","source":"arXiv cs.CL","summaryHtml":"LLMアシスタントは、時間に依存する制約を伴う日常活動をますます手伝うようになっている。しかしユーザが後のリクエストでその制約に触れるとは限らず、アシスタントは自分で気づいて助言を調整する必要がある。この能力を評価するために、本論文はベンチマーク「TASC（会話における時間的行動安全性）」を提案する。<br><br>TASCは128のテンプレートから作られた3,418件の入力と、経過時間の計算能力と、その情報を適用する能力を比較するための33のシナリオ群からなる。<br><br>13モデルでの評価では、提案された行動が規則に違反するケースで、アシスタントが時間依存の制約を考慮できたのは30.5%にとどまり、不要な警告はまれだった。より重要なのは、正しく時間を計算できていながら制約の適用に失敗するケースが62.1%あったことである。「計算できること」と「対話の中で使うこと」の間の溝が、安全上の課題として浮き彫りになった。","timestamp":1793814889000,"title":"Before You Continue: Evaluating Time-Sensitive Safety Awareness in Conversational Assistants","titleJa":"続ける前に――会話アシスタントの時間依存の安全意識を評価する","url":"https://arxiv.org/abs/2611.06839"},{"authors":["Jixuan Ying","Haoyu Liu","Timing Yang","Tingyu Zhu","Predrag Neskovic","Anand Bhattad","Cihang Xie","Zeyu Zheng","Alan Yuille","Feng Wang"],"categories":["cs.CV"],"field":"cs.CV","genre":"Vision / Multimodal","monthKey":"2026-11","publishedAt":"2026-11-04T17:54:14Z","source":"arXiv cs.CV","summaryHtml":"自己回帰型の画像生成は近年、競争力のある視覚生成パラダイムとして台頭してきた。しかし生成の順序は、次パッチ予測、ランダム順予測、特定スケールでの一括生成のように、あらかじめ決められたものかヒューリスティックなものが多く、これらの戦略はモデルが画像の重要な構造的依存性を見落とす原因となり、構造的な頑健性と推論能力の双方を制限していた。<br><br>本研究は、全体の文脈と現在の局所情報に基づいてモデルが次のトークン位置を動的に決める、文脈を意識した自己回帰生成フレームワークを提案する。固定やランダムの順序に従うのではなく、生成過程そのものが画像構造と意味的な依存関係へ適応する。<br><br>広範な実験では、文脈を意識した生成が、マスク型自己回帰を含む異なる画像自己回帰パラダイムにわたって構造的頑健性を有意に改善することが示された。生成順序を設計対象として捉え直す研究である。","timestamp":1793814854000,"title":"Context-Aware Autoregressive Image Generation for Emerging Reasoning Properties","titleJa":"文脈を意識した自己回帰画像生成――創発する推論特性に向けて","url":"https://arxiv.org/abs/2611.06838"},{"authors":["Hongcheng Gao","Weiheng Li","Yipeng Wei","Yu Lei","Shuo Sun","Yi Li","Yajiao Wang","Jie Luo","Jianwei Wen","Xinyi Zhou","Hongda Li","Yibing Zhang","Henghui Sun","Yufan Zhou","Tianfang Hao","Naihao Xue","Hailong Qu","Jingjing Zhou","Peng Xu","Yongzheng Wei","Yichen Zhu","Ziying Wang","Yibo Wang","Jianshu Zeng","Yuhang Lei","Zeqiang Wang"],"categories":["cs.SE","cs.AI","cs.CL","cs.LG"],"field":"cs.SE","genre":"Agents / Robotics","monthKey":"2026-11","publishedAt":"2026-11-04T17:53:55Z","source":"Hugging Face Papers","summaryHtml":"工学の現場で使えるエージェント型AIを目指し、270億パラメータのモデル「Micius-Flash」が提案された。マルチモーダル入力にネイティブ対応し、深い推論と25万6千トークンのコンテキストを持つ。知識ツリーを軸とするデータパイプライン（知識ツリーの構築と拡張、データ合成、難例を増やす品質検証の三段階）で学習データを整えた。<br><br>このデータから、半導体知識と推論、ハードウェアコーディング、半導体マルチモーダル理解の専門家モデルと、エージェント型の専門家を訓練した。さらに「Multi-Teacher On-Policy Distillation（MOPD）」により、Micius自身が生成した系列への教師あり学習で各専門家の能力を一つのモデルに統合した。20以上のデータセット・約15,000件の評価では、ハードウェアコードのベンチマークで平均64.2%と、同規模のベースラインを15.0ポイント上回った。半導体特化のエージェントベンチマークでも62.4%と、ベースラインを17.2ポイント上回った。<br><br>産業応用向けに「Micius Harness」も開発され、EDAツールやKiCadなどの専門ツールや実行環境とモデルを接続する。PCB設計、チップ設計ワークフローの自動化、ソフトウェア開発の事例では、ツールの実行フィードバックを使った多段階の計画、コードのデバッグ、反復検証ができることが示された。科学・工学向けエージェントの発展のため、オープンソースとして公開されている。出典：Hugging Face Papers","timestamp":1793814835000,"title":"Micius-Flash: Lightweight Agentic Intelligence for Engineering","titleJa":"Micius-Flash――エンジニアリングのための軽量エージェント型知能","url":"https://arxiv.org/abs/2611.10015"},{"authors":["Tommy He","Thomas Jiralerspong"],"categories":["cs.LG","cs.AI"],"field":"cs.LG","genre":"LLM / NLP","monthKey":"2026-11","publishedAt":"2026-11-04T17:53:52Z","source":"arXiv cs.LG","summaryHtml":"確率的デコーディングのもとでは、1つの文脈から言語モデルは多様な応答を引き出しうる。このばらつきの特性評価には通常、多数の高コストな自己回帰ロールアウトが必要で、しかも各 rollout が示すのは1つの実現だけである。本研究は、文脈を読む際に生じる活性化から、モデルのロールアウト活性化を直接予測できるかを問う。<br><br>著者らは、文脈の活性化系列を、平均プールされた応答活性化の点予測または分布予測へ写す「文脈―応答メタモデル」を訓練した。<br><br>主な知見は4つある。(i) 検討した4つのメタモデル族は平均プール応答活性化を高い忠実度で予測し、分布メタモデルはロールアウトの変動も捉える。(ii) 訓練集合が50万プロンプトまで増えるにつれて性能が向上し、ドメイン外データセットへもゼロショットで汎化する。(iii) 予測には行動を予測する信号が保持される。(iv) Qwen2.5の文脈活性化から応答活性化が予測できる。多数のサンプリングをせずに応答分布の見通しを得る道筋である。","timestamp":1793814832000,"title":"Context--Answer Metamodels: Forecasting LLM Activations Before the First Answer Token","titleJa":"文脈―応答メタモデル――最初の応答トークンの前にLLMの活性化を予測する","url":"https://arxiv.org/abs/2611.06837"},{"authors":["Lele Yang","Muxi Diao","Zhonghao Yan","Jiankang Chen","Bin Wen","Tingting Gao","Wentao Zhang","Kongming Liang","Zhanyu Ma","Weiran Xu"],"categories":["cs.CL"],"field":"cs.CL","genre":"LLM / NLP","monthKey":"2026-11","publishedAt":"2026-11-04T17:52:11Z","source":"arXiv cs.CL","summaryHtml":"ループ型Transformerは共有層を再実行することで実効的な深さを増やすが、採用を妨げる3つの限界がある。メモリがループ回数とともに増えること、計算量の調整がブロック単位でしかできないこと、訓練後にループ回数を変えにくいことである。本論文はそのそれぞれに対処する「LooM（ループ不変メモリ）」を提案する。<br><br>因果的エンコーダ・デコーダ（CED）において、LooMは最初のデコーダ層以降だけをループさせ、それらはトークンごとに一度だけ書かれる大域メモリを読む。各層はトークンのキー・バリュー（KV）エントリを最初の訪問時にだけ公開するため、キャッシュはループ回数とともに増えない。<br><br>各層が独立にループすることで、トークンあたり3〜21回の層実行というあらゆる予算が可能になり、予算をランダムにサンプリングして訓練した1つのモデルが、ルータなしで全予算をカバーする。十分なループ数では、同じデータで訓練した単一パスのベースラインを、言語モデリング、ゼロショット精度、長文脈パープレキシティで上回った。","timestamp":1793814731000,"title":"LooM: Loop-Invariant Memory for Causal Encoder-Decoder Language Models","titleJa":"LooM――因果的エンコーダ・デコーダ言語モデルのためのループ不変メモリ","url":"https://arxiv.org/abs/2611.06835"},{"authors":["Remi Denton","Aida Davani","Cynthia L Bennett","Michael Madaio","Roma Patel","Himabindu Lakkaraju"],"categories":["stat.ML","cs.CY","cs.LG"],"field":"stat.ML","genre":"Generative Models","monthKey":"2026-11","publishedAt":"2026-11-04T17:44:07Z","source":"arXiv stat.ML","summaryHtml":"現在の生成AIのアラインメントは、目先の会話満足度を優先する近視的なパラダイムに依拠している。短い時間軸のフィードバックに頼るこのアプローチは、持続的な人間とAIの相互作用がもたらす深刻で長期的な外部性を無視しており、認知の萎縮、社会的浸食、人間の主体性の低下といった望ましくない帰結につながりうる。<br><br>これに対処するため著者らは、AIが時間をかけて人間の経験をどう作り変えるかを織り込んだ、長期的な時間軸のアラインメントへのパラダイム転換を提案する。人間の幸福の4つの側面にわたって、AI利用の短期的な有用性と長期的なコストの間の緊張関係を地図化し、現在の報酬モデルが捉え損ねている帰結を明らかにする。<br><br>結論として、単純な選好最適化を超え、複雑な時間スケールを操縦しながら長期的な人間の幸福を積極的に育むアラインメント戦略への移行を主張する。アラインメント研究の時間軸そのものを問う、概念的な論考である。","timestamp":1793814247000,"title":"Alignment Myopia in Generative AI","titleJa":"生成AIのアラインメント近視――長期的な人間の幸福へ視野を広げる","url":"https://arxiv.org/abs/2611.06830"},{"authors":["David Rostcheck"],"categories":["cs.AR","cs.AI","cs.LG"],"field":"cs.AR","genre":"LLM / NLP","monthKey":"2026-11","publishedAt":"2026-11-04T17:44:04Z","source":"arXiv cs.AR","summaryHtml":"AWSのFPGAが利用可能になって8年になるにもかかわらず、学術文献には高水準言語からAWS EC2 F2クラウドFPGA基盤上で機械学習モデルを開発する完全なワークフローが欠けていた。本研究は、Vitis HLSからHDKを経てAFIへ至る橋渡しを実装したツールチェーンを提示する。誤りの局所化を助ける4段階の方法論――FP32のPyTorch、ビット精度の量子化Python、HLSのCシミュレーション、物理FPGA――も導入し、FPGA特有の回路誤りにも対応する。<br><br>これらの道具により、コーディングエージェントがユーザの指示からFPGA設計を実効的に実装し、必要に応じてテストとデバッグを行えるようになる。配備ワークフロー、タイミング収束の戦略、実践上決定的に重要だったHLSエンジニアリングの判断も記録されている。<br><br>検証には、住所の固有表現認識向けにファインチューニングしたTinyBERTを用い、埋め込み層と4つのエンコーダ層のうち第1層をFPGAハードウェアへ実装した。重みはホストDRAMからストリーミングする構成で、性能はCPU・GPU実装を下回ったが、その原因と今後の方向性も議論されている。","timestamp":1793814244000,"title":"Enabling AWS Cloud FPGA Development Using High-Level Vitis HLS","titleJa":"高水準Vitis HLSでAWSクラウドFPGA開発を可能にする","url":"https://arxiv.org/abs/2611.06829"},{"authors":["Gagik Amirkhanyan","Nuojin Cheng"],"categories":["cs.LG"],"field":"cs.LG","genre":"LLM / NLP","monthKey":"2026-11","publishedAt":"2026-11-04T17:42:58Z","source":"arXiv cs.LG","summaryHtml":"Gated DeltaNet（GDN）やKimi Delta Attention（KDA）、GDN-2といったゲート付きデルタ型の線形注意層はGPU向けに調整されている。GPUでは小さなテンソルコアタイルと高速なベクトルレジスタにより、チャネルごとの減衰リスケーリングやブロック内の逐次解法が安く済む。一方、Google TPUは計算を幅256×256のシストリック行列ユニットに集中させ、ベクトルユニットは相対的に遅いため、これらの層をそのまま移植すると各行列タイルの半分が空き、ベクトル演算がボトルネックになる。<br><br>本論文は、行列ユニットを中心にゲート付きデルタ注意を作り替えた「Systolic Linear Attention（SLA）」を提示する。キーを256へ広げて値ヘッドをグループ化し、減衰ゲートを4つの64チャネルタイルにまとめ、チャンク解法全体を単一の融合カーネル内のブロック行列積で計算する。<br><br>TPU v7xでは、完全なSLA-R4層がオープンソースのTokamax KDAカーネルより1.6〜2.5倍高速に動作した（厳密なチャンク逆行列でも1.4〜2.4倍）。ハードウェアの特性に合わせた注意機構の再設計である。","timestamp":1793814178000,"title":"Systolic Linear Attention: Co-Designing Tile-Grouped Gated Delta Attention for TPUs","titleJa":"Systolic Linear Attention――TPU向けにタイル化ゲート付きデルタ注意を協調設計する","url":"https://arxiv.org/abs/2611.06828"},{"authors":["Nguyen Minh Thang","Trinh Thi Phuong"],"categories":["cs.AI"],"field":"cs.AI","genre":"LLM / NLP","monthKey":"2026-11","publishedAt":"2026-11-04T17:41:09Z","source":"arXiv cs.AI","summaryHtml":"本研究は、オフラインで4基のL4 GPUを使い最大12時間までという条件のもと、3つのオープンモデルがARC-AGI-2のタスクを解くのに、どんな訓練・較正データが効くかを調べる。データは公開タスクでオフライン比較され、隠された準非公開タスク120件での189回の実行が報告される。<br><br>NVARCのQwen3-4Bグリッドモデルについては、型付き言語による実行可能なルール12,000件と95,993件のタスクからなるコーパスを構築した。ルールは固定プローブ集合での振る舞いが既存の全ルールと異なる場合にのみ採用され、タスクは競合ルールの候補を反証し、12の近道ソルバを破る場合にのみ採用される。1,920件の実タスク記録での継続ファインチューニングと4GPUスケジューリングの改訂により、準非公開スコアは28.96（公開モデル平均）から33.06（5回平均、最良34.86）へ上がった。合成タスクだけで訓練したチェックポイントは、95,993件すべてを使っても実タスクモデルを上回らなかった。<br><br>Qwen3.8-27Bの推論モデルについても、自身の軌跡を用いたファインチューニングが検討されている。「データの量より、実タスクとの適合と選別が効く」という実証である。","timestamp":1793814069000,"title":"Rules, Traces and Routing Statistics: Training and Calibration Data for Open Models on ARC-AGI-2","titleJa":"ルール・軌跡・ルーティング統計――ARC-AGI-2でオープンモデルに効く訓練・較正データ","url":"https://arxiv.org/abs/2611.06827"},{"authors":["Nuno Batista","Gabriel Falcao","Penousal Machado"],"categories":["quant-ph","cs.LG"],"field":"quant-ph","genre":"Generative Models","monthKey":"2026-11","publishedAt":"2026-11-04T17:31:57Z","source":"arXiv quant-ph","summaryHtml":"実際のデバイス向けに量子誤り訂正符号を選ぶには、候補を回路レベルのシミュレーションで採点する必要があるが、その計算は遅く、数百件しか実行できない。だからこそ評価1回1回が貴重であり、探索は「支払った評価あたり何件の良い符号を見つけたか」で judged される。少数の群要素から作られる量子LDPC符号は多くの論理量子ビットを守るが、良いものは巨大な空間の中では稀である。<br><br>本論文は、量子符号設計のための、おそらく初の生成フローネットワーク（GFlowNet）「GFlowQEC」を提案する。符号を群要素1つずつ組み立て、スコアの冪に比例する確率で符号を提案するよう学習する。過去の探索のスコアで一度訓練して凍結し、180物理量子ビットのリフテッド積符号を、距離で採点しながら提案させる。<br><br>有料の呼び出しごとに10件の抽選を順位付けすると、GFlowQECは調整済みの並列テンパリングより2倍を超える数の、新しい最高スコア級の符号（訓練に使われたどれとも非同値なもの）を見つけた。評価コストの高い探索問題への生成モデルの応用である。","timestamp":1793813517000,"title":"GFlowQEC: Generative Flow Networks that Learn to Sample Quantum LDPC Codes","titleJa":"GFlowQEC――生成フローネットワークで量子LDPC符号をサンプリングする","url":"https://arxiv.org/abs/2611.06819"},{"authors":["Juncheng Ma","Jiaxin Li","Jiankai Tu","Bo Liang","Guodong Lv","Yufan Deng","Junzhe Tang","Liangzhu Yang","Chen Bian","Zicong Cao","Baohao Zhu","Jianxin Bi","Tengfei Yan","Yinyuan Zhang","Kewei Zhang","Xinglong Chen","Kaiqi Chen","Duomin Wang","Xiaotian Tang","Liang Tan","Li Li","Yuan Xu","Haosen Yang","Yuqi Wang","Jingfei Xia","Songyan Huang","Zhiyang Dou","Zhen Dong","Enze Xie","Tat-Seng Chua","Daquan Zhou"],"categories":["cs.CV"],"field":"cs.CV","genre":"Vision / Multimodal","monthKey":"2026-11","publishedAt":"2026-11-04T17:31:35Z","source":"arXiv cs.CV","summaryHtml":"一人称の人間動画は、ロボット学習のための操作事前知識の、拡張可能な供給源である。しかし生のデータ規模を汎化可能なロボットポリシーへ結びつけるには、厳密なデータキュレーションと訓練レシピが要る。本論文は、一人称事前学習を50,000時間まで拡大するための初の完全公開レシピ「Open-HumanScale」を提案する。その中核は、手の動きと自然言語で密に注釈された一人称動画コーパス「Open-HumanScale-50K」である。<br><br>このコーパスを使い、著者らは純粋な人間データの事前学習を閉ループのシミュレーション評価で系統的に検証し、事前学習データの時間数と下流のロボット成功率を結ぶ、経験的な対数線形のスケーリング則を発見した。<br><br>この知見に基づき、50,000時間の一人称人間動画だけで事前学習した世界―行動モデル「HumanWAM-Vanilla」を開発した。ロボットの事後訓練を施すと、RoboTwin 2.0のClean2Cleanで92.08%、Clean2Randomで68.88%の成功率に達した。人間動画からの事前学習をどこまで押し上げられるかを示す公開基盤である。","timestamp":1793813495000,"title":"Open-HumanScale: An Open Recipe for Scaling Human and Robot Experience for Embodied Foundation Models","titleJa":"Open-HumanScale――人とロボットの経験を50,000時間へ拡大する公開レシピ","url":"https://arxiv.org/abs/2611.06817"},{"authors":["Man-Ling Sung","Hemanth Kandula","Jeff Ma","William Hartmann","Matthew Snover"],"categories":["cs.CL","eess.AS"],"field":"cs.CL","genre":"LLM / NLP","monthKey":"2026-11","publishedAt":"2026-11-04T17:25:40Z","source":"arXiv cs.CL","summaryHtml":"明確な最終目標を持たない会話の要約と評価には課題が残る。本論文は、言語横断の会話音声要約のための、参照不要で事実ベースの評価パイプライン「SAUCE」を提案する。SAUCEは、会話とテキストの間の含意（entailment）を通じて、要約の正確さと事実のカバレッジを測る。<br><br>著者らはSAUCEを複数の一般的な要約指標と比較し、文字起こしや翻訳の誤りによる情報損失の捕捉や、壊れた要約の特定における有効性を示した。<br><br>決定的に重要なのは、ブラックボックスなLLM評価器や密な埋め込み指標と違い、SAUCEが本来的に説明可能であることである。要約スコアを離散的で検証可能な事実へ対応づけるため、利用者は正確なハルシネーションや脱落をピンポイントで特定できる。この解釈可能性が、開発者によるLLMの振る舞いの系統的なプロファイリングを助ける。音声対話の要約評価における、監査可能性を重視した設計である。","timestamp":1793813140000,"title":"SAUCE: Summary Analysis Using Conversation Entailment","titleJa":"SAUCE――会話含意で要約を分析する、参照不要の事実ベース評価","url":"https://arxiv.org/abs/2611.06812"},{"authors":["Aditya Raghavan","Sergei V Kalinin"],"categories":["cond-mat.mtrl-sci","cs.LG"],"field":"cond-mat.mtrl-sci","genre":"Vision / Multimodal","monthKey":"2026-11","publishedAt":"2026-11-04T17:25:10Z","source":"arXiv cond-mat.mtrl-sci","summaryHtml":"構造と物性の予測は、分子活性や材料物性から顕微鏡で測る局所的な機能応答まで、機械学習の古典的な課題である。画像ベースの回帰では、予測に使える情報を決める選択が2つある。画像近傍の大きさと、その内部に保持する空間解像度である。小さな近傍は関連する周囲構造を取りこぼし、大きく細かくサンプルした近傍は冗長で無関係な情報を招きうる。<br><br>本研究は、局所スペクトルとヒステリシスループの予測のための空間記述子を構築する枠組みを開発する。回帰モデルをベンチマークし、SHAPマップで空間的な寄与を調べ、パッチサイズと圧縮の影響を探って、予測精度と記述子の次元数との関係を明らかにする。<br><br>さらに遺伝的アルゴリズムを用いて、空間分割と測定の割り当てを最適化し、解釈可能性を保ちながら予測に効く空間記述子を進化的に設計する。記述子の「設計」そのものを最適化対象にするアプローチである。","timestamp":1793813110000,"title":"Evolutionary Design of Interpretable Spatial Descriptors for Structure-Property Relationship Discovery","titleJa":"構造―物性関係の発見に向けた、解釈可能な空間記述子の進化的設計","url":"https://arxiv.org/abs/2611.06811"},{"authors":["Lingfei Qian","Yan Wang","Xueqing Peng","Yupeng Cao","Yuechen Jiang","Zhuohan Xie","Anke Xu","Wenbo Cao","Jiarui Chen","Zehan Li","Jimin Huang","Alejandro Lopez-Lira","Yuehua Tang","Sophia Ananiadou","Jian-Yun Nie"],"categories":["cs.CL"],"field":"cs.CL","genre":"LLM / NLP","monthKey":"2026-11","publishedAt":"2026-11-04T17:24:02Z","source":"arXiv cs.CL","summaryHtml":"LLMの金融バックテストが意味を持つのは、モデルが予測を求められている結果をすでに知らない場合に限る。実務家はこれを、ベンダが公表する知識カットオフを信じる、モデル自身に何を知っているか尋ねる、過去の日付時点で答えるよう指示する、といった方法で防ごうとしてきた。本論文は、これらの安全策が信頼できるかを検証する。<br><br>著者らは、1999年から2026年の日付つき米国事実2,226件（月次マクロ経済系列、月末株価、連邦準備制度の決定をカバー）からなるベンチマーク「FinDendro」を提案する。各事実は4つのプロンプトを生む。値そのものを問う質問、日付を宣言せずに知っている/推測していると主張を対にした想起と予測の質問、そして歴史的な宣言日付つきの予測質問である。持続性と支配的結果への統制により、偶然の正解率は0.27付近に保たれる。<br><br>結果として、ほとんどのフロンティアモデルで自己申告は知識を過小に示した。たとえばGPT-5は、知らないと申告した範囲でも高い割合で正解している。「モデルに聞けば分かる」という前提の危うさを、バックテストの文脈で示した研究である。","timestamp":1793813042000,"title":"LLMs Don't Know What They Know: Benchmarking Temporal Self-Knowledge for Financial Backtesting","titleJa":"LLMは自分が何を知っているかを知らない――金融バックテストのための時間的自己知識ベンチマーク","url":"https://arxiv.org/abs/2611.06808"},{"authors":["Nil-Jana Akpinar","Eugenia Kim","Natalie Isak","Amanda Minnich","Victoria Westerhoff","Matthew Dressman"],"categories":["cs.CL","cs.CY"],"field":"cs.CL","genre":"LLM / NLP","monthKey":"2026-11","publishedAt":"2026-11-04T17:22:23Z","source":"arXiv cs.CL","summaryHtml":"LLMとの対話による心理的危害は、繰り返しの対話の中で現れ、利用者個人の主観的な文脈に強く依存するため、直接監視することはできない。本論文は「害ではなくリスクを測る」ことを提案する。AIの応答レベルで観測可能な、心理的危害のリスク要因となるAIの振る舞いを検出し、その信号を集約して長期的な監視を支えるという発想である。<br><br>著者らは8つのそのような振る舞いを操作化し、47,062件のAI応答と373,873件の応答―要因ラベルからなる合成マルチラベルコーパスを構築した。検証と評価のために対象を絞った人手注釈も用意されている。<br><br>訓練済みの埋め込みベース分類器、LLMによる直接判定、分類器と判定器のカスケードが比較された。すべての検出器はモデル非依存で、LLMの出力だけに働き、内部状態へのアクセスを必要としない。検出器は、先行研究の複数の分布外の人間―AI会話データセットへも適用されている。危害そのものではなく前兆を捉える、安全性監視の実務的な設計である。","timestamp":1793812943000,"title":"Measuring Risk, Not Harm: Detecting Psychological Harm Risk Factors in LLM Conversations","titleJa":"害ではなくリスクを測る――LLM会話における心理的危害のリスク要因検出","url":"https://arxiv.org/abs/2611.06806"},{"authors":["Ben Johnson","Hayden Helm"],"categories":["cs.AI"],"field":"cs.AI","genre":"LLM / NLP","monthKey":"2026-11","publishedAt":"2026-11-04T17:20:09Z","source":"arXiv cs.AI","summaryHtml":"効率的なベンチマークは、少数のタスク実行からシステムの完全なベンチマーク性能を推定する。標準的な手法は、すでに評価された参照システム群の実行の二値の正しさだけに依拠する。しかしエージェントシステムは実行ごとに豊かな軌跡（トレース）を生み、それは能力について遥かに多くを明かしうる。この情報を活かすには、有用な軌跡表現が必要である。<br><br>本論文は、軌跡を、LLMで構造化要約を抽出し、標準的なテキストエンコーダで埋め込むことで表現する手法を提案する。この表現は、正しさとタスク関連の信号を保ちながら、生の軌跡埋め込みを支配するシステムの同一性、モデルファミリー、実行ハーネス関連の信号の存在を最小化する。<br><br>全参照システムの各タスク実行についてこの表現が得られれば、システムの低次元表現を構築でき、新しいシステムのスコアを、少数の実行から予測できる。評価コストの高いエージェント時代のベンチマーク設計に対する提案である。","timestamp":1793812809000,"title":"Task-Efficient Agent Evaluation Using Cached Traces","titleJa":"キャッシュした軌跡でエージェント評価を効率化する","url":"https://arxiv.org/abs/2611.06803"},{"authors":["Kendra Givens","Taylor T. Johnson","Bryan C. Ward","Thomas Beckers"],"categories":["cs.RO","cs.LG","eess.SY"],"field":"cs.RO","genre":"Generative Models","monthKey":"2026-11","publishedAt":"2026-11-04T17:18:50Z","source":"arXiv cs.RO","summaryHtml":"ハミルトン・ヤコビ（HJ）到達可能性は、最悪ケースの外乱のもとで失敗へ追い込まれうる力学系の不安全な状態を特定する。しかし古典的な格子ベースのソルバは、状態次元に対して指数的にスケールする。DeepReachは格子を、HJ-Isaacs（HJI）変分不等式（VI）で訓練したニューラル価値関数に置き換えて拡張性を高めたが、残差の両側を等しく罰するため、学習された値が真の値を上回り、不安全な状態が安全と誤分類されうる。<br><br>本論文は「ConDR（保守的DeepReach）」を提案する。学習された不安全集合が真の集合を含むよう、HJI VIの部分解を学ぶことを目指す。ConDRは障害物分岐と終端条件を構成上強制し、一方向の損失でHJI残差を安全マージンεだけゼロ未満へ押し下げ、すべてを不安全と分類する自明解を防ぐ。<br><br>マージン付き問題の厳密解についての証明も与えられている。安全性の文脈で「誤って安全と判定する」方向の誤りを構造的に抑える設計であり、学習ベース到達可能性解析の信頼性を高める試みである。","timestamp":1793812730000,"title":"ConDR: Conservative Reachability through Neural Hamilton-Jacobi Subsolutions","titleJa":"ConDR――ニューラルHJ部分解による保守的な到達可能性解析","url":"https://arxiv.org/abs/2611.06802"},{"authors":["Jorge Luiz Franco","Arthur Queiroz Moura","Moacir Ponti","Amauri Souza"],"categories":["cs.LG","cs.AI","stat.ML"],"field":"cs.LG","genre":"Scientific AI","monthKey":"2026-11","publishedAt":"2026-11-04T17:18:34Z","source":"arXiv cs.LG","summaryHtml":"メッセージパッシング型グラフニューラルネットワーク（GNN）の表現力は、1次元Weisfeiler-Lemanテストによって制限される。持続的ホモロジー（PH）はGNN表現を補完できる位相的記述子を与えるが、既存の手法は通常、表現学習の過程とは別に持続性を計算していた。本論文は、メッセージパッシングをグラフフィルトレーションへ組み込んだ位相的記述子の族「メッセージパッシング型グラフ持続性（MGP）」を提案する。<br><br>各フィルトレーション段階で、ノード埋め込みは現在の部分グラフを使って更新され、持続性イベントと結びつけられる。これらの埋め込みは、持続性計算における連結成分の代表元も決める。<br><br>著者らは、MGPがグラフ同型のもとで不変であること、そして拡張元であるPHベースの記述子よりも厳密に表現力が高いことを証明した。MGPは表現力ベンチマークと、複数のグラフ分類・回帰タスクで評価されている。位相データ解析とGNNを、学習の内側で結びつける試みである。","timestamp":1793812714000,"title":"Message-passing graph persistence","titleJa":"メッセージパッシング型グラフ持続性――位相的記述子へ伝播を組み込む","url":"https://arxiv.org/abs/2611.06801"},{"authors":["Yihong Luo","Tianyu Pang","Tianyang Hu"],"categories":["cs.CV"],"field":"cs.CV","genre":"Vision / Multimodal","monthKey":"2026-11","publishedAt":"2026-11-04T17:14:20Z","source":"arXiv cs.CV","summaryHtml":"少数ステップへの蒸留は、拡散モデルとフローモデルによる効率的な生成を可能にするが、わずかなサンプリングステップで品質を保つことは依然として難しい。スコア蒸留による分布マッチング手法は強固な土台を提供するが、生徒（student）の変化する分布を正確に追跡することに依存している。少数ステップサンプリングの中間生成ステップでは、生徒のスコア推定が難しく、一般に使われる推定器は、生徒の更新に使われる分布とは別の分布を記述してしまうことがある。<br><br>フローマッチングは、生徒のサンプリング過程から構築される速度場を通じた、より柔軟な教師づけを可能にする。この視点に立ち、本論文は「速度場敵対的蒸留（VAD）」を提案する。学習された批評家（critic）が生徒と教師の場を比較し、その不一致を学習へのフィードバックに変える。<br><br>VADはスコア蒸留、Fisherベースのマッチング、モーメントマッチングを統一し、それぞれがどう位置づくかも説明する。少数ステップ生成の品質改善を、一つの枠組みで整理する研究である。","timestamp":1793812460000,"title":"VA-TDM: A Unified View for Improving Few-Step Diffusion Models by Velocity Adversarial Distillation","titleJa":"VA-TDM――速度場の敵対的蒸留で少数ステップ拡散モデルを改善する統一的視点","url":"https://arxiv.org/abs/2611.06796"},{"authors":["Harsidak Singh Banwait"],"categories":["cs.LG","cs.AI"],"field":"cs.LG","genre":"Vision / Multimodal","monthKey":"2026-11","publishedAt":"2026-11-04T17:11:04Z","source":"arXiv cs.LG","summaryHtml":"サンプル効率の高い流動的知能には、見慣れない対話的環境の作動モデルを素早く形作るエージェントが必要である。ARC-AGI-3は、指示のない視覚ゲームでこれをテストし、相対的人間行動効率（RHAE）で採点する。この指標は探索の無駄を二乗で罰する。フロンティアモデルが生の整数格子を読むと、直列化によって空間トポロジーが壊れ、基本的な境界や対称性を再発見するために数百の行動を費やしてしまう。<br><br>本論文は、ARC-AGI-3における対話的推論を支配するのは計画能力ではなく空間知覚だという前提で構築された、オープンウェイトのエージェント「SARBLOH」を提案する。パラメータを持たないO(HW)の知覚エンジンが、各フレームを35ミリ秒で、双方向の時間追跡を備えた物体目録、証明済みの不変量とアフォーダンス仮説を分ける幾何学的ブリーフィング、そして注釈付きキャンバスへ変換する。<br><br>コードをアクションとするランタイムと組にすることで、エージェントは低レベルの手ではなくアルゴリズム的な仮説を書く。8つの環境での評価が報告されており、「推論の前に、まず見えるようにする」ことの重要性を示す研究である。","timestamp":1793812264000,"title":"Transforming Integer Grids to Spatial Intuition: Perception, Not Planning, Governs ARC-AGI-3","titleJa":"整数格子を空間的直観へ――ARC-AGI-3を支配するのは計画ではなく知覚","url":"https://arxiv.org/abs/2611.06793"},{"authors":["Shaoliang Yang","Jun Wang"],"categories":["cs.CL","cs.LG"],"field":"cs.CL","genre":"Vision / Multimodal","monthKey":"2026-11","publishedAt":"2026-11-04T17:03:30Z","source":"arXiv cs.CL","summaryHtml":"高速な採択分類器があれば、より遅い評価器にかける改訂稿を選別できるかもしれない。本研究は、既存論文での一致がその用途を支持するかどうかを問う。語と文書の特徴による分類器と、同じ30億パラメータの言語モデルからファインチューニングされた2つの公表済みテキストのみ採択予測器を比較する。<br><br>ICLRの198本の論文について、原文の順位づけと、事実・主張の強さ・帰属が変わらないよう自動でスクリーニングされた段落書き換えへの順位づけを比較した。分類器は一方の予測器とは原文の順位が近く、他方とも中程度に一致したが、どちらの書き換えがスコアを上げるかについては、どちらの予測器とも検出可能な一致を示さなかった。<br><br>事前に指定された検定は数値精度を下げて行われており、丸め誤差が小さなスコア応答を支配していた。そこで公表済み重みを完全な32ビット精度で事後的に再採点したが、編集の一致は依然としてほぼ見られなかった。「原文での一致」が「編集への感応の一致」を保証しないという、予測器の使い方への注意喚起である。","timestamp":1793811810000,"title":"Ranking Agreement Does Not Reveal Paragraph-Edit Agreement in Two Released Paper Acceptance Predictors","titleJa":"順位の一致は段落編集の一致を明かさない――2つの公表済み論文採択予測器の検証","url":"https://arxiv.org/abs/2611.06789"},{"authors":["Songbin Liu","Hanyu Yang","Junren Chen","Arian Maleki"],"categories":["math.ST","stat.ML"],"field":"math.ST","genre":"Scientific AI","monthKey":"2026-11","publishedAt":"2026-11-04T16:56:12Z","source":"arXiv math.ST","summaryHtml":"本研究は、複素数値のマルチルック・コヒーレントイメージングにおいて、信号振幅と大気による位相歪みを同時推定する問題の基本限界を調べる。測定は乗法性のスペックルと加法性ガウスノイズで汚染され、すべてのルックは既知のガウスセンシング行列を共有し、両パラメータは構造化されたクラスに属する。<br><br>制約付き最尤推定器を分析することで、許容可能なパラメータクラス全体に一様に成り立つ同時ミニマックスリスクの上限を確立する。一方、オラクルへの帰着とFano型の議論により、同クラス上の最悪ケース下限が得られる。<br><br>これらの結果は、構造的複雑性、信号と測定の次元、ルック数、ノイズレベルの影響を定量化し、いくつかの設定で一致するミニマックスレートを確立する。ただし、測定次元が信号次元を上回る場合の低ノイズでの位相推定には、依然としてギャップが残る。理論的な到達限界を明確にする研究である。","timestamp":1793811372000,"title":"Fundamental Limits of Coherent Imaging in The Presence of Atmospheric Turbulence","titleJa":"大気ゆらぎのもとでのコヒーレントイメージングの基本限界","url":"https://arxiv.org/abs/2611.06784"},{"authors":["Quan Minh Nguyen","Hoang M. Ngo","Bhakti Chowkwale","Yasaman Keshtkarjahromi","My T. Thai"],"categories":["cs.LG","cs.AI"],"field":"cs.LG","genre":"Ethics / Safety","monthKey":"2026-11","publishedAt":"2026-11-04T16:56:10Z","source":"arXiv cs.LG","summaryHtml":"ワンショットおよび数ラウンドの連合学習（FL）は、1回または数回の通信ラウンドで大域モデルを構築して通信負担を減らすが、通常の多ラウンドFLより性能が低くなりがちである。頻繁な同期がないためクライアントモデル同士が漂い、似た特徴を学ぶニューロンがクライアントごとに異なる位置を占めることがある。同時に、局所データの異質性により、対応するパラメータでもクライアントの予測への重要性が異なる。<br><br>この2つの課題により、単純な平均化は不一致なニューロンを混ぜ合わせ、重要性の違いを無視して等しい重みを与えてしまう。本論文は、Fisher情報でパラメータの重要性を定量化し、ニューロンの整列とモデル集約を導く、Fisher重み付き最適輸送フレームワーク「FedFiOT」を提案する。<br><br>FedFiOTはニューロンの対応関係と大域モデルの構築を共同で最適化する。通信回数を絞ったFLにおける統合品質の改善を目指す手法である。","timestamp":1793811370000,"title":"FedFiOT: Fisher-Weighted Optimal Transport for Model Merging in One-Shot and Few-Round Federated Learning","titleJa":"FedFiOT――Fisher重み付き最適輸送による連合学習のモデル統合","url":"https://arxiv.org/abs/2611.06783"},{"authors":["Chang Liu","Ke Han","Niccolò Biondi","Gloria Isotton","Elisa Ricci","Davide Talon","Nicu Sebe"],"categories":["cs.CV"],"field":"cs.CV","genre":"LLM / NLP","monthKey":"2026-11","publishedAt":"2026-11-04T16:55:08Z","source":"arXiv cs.CV","summaryHtml":"手話生成（SLG）は、書かれた文を手話の動作へ写し、語彙内容と細かな発話の双方を保持する課題である。モデルは、どの手話を表現すべきかを決め、それを正確な手の形、軌道、表情、身体の協調を通じて実現しなければならない。既存の姿勢ベースのシステムや再構成のみの動作トークナイザは、この2つの決定を絡み合わせがちで、生成器には「どう動くか」を洗練する前に「何を表すか」の、テキストに整列した明示的な中間目標が欠けていた。<br><br>この問題に対し、本論文は「意味的残差ベクトル量子化（SRVQ）」を提案する。生成を意味から運動学へ進む2レベルの過程として捉える枠組みである。<br><br>新たに導入されたSRV量子化器は階層を学ぶ。最初の残差レベルが手話の内容を符号化し、続くレベルが姿勢、手の形、軌道、身体の協調を洗練する。すべてが単一の量子化器の内側で完結する設計である。言語内容と身体表現の分離が、手話生成の制御性を高める。","timestamp":1793811308000,"title":"Semantic Residual Vector Quantization for Sign Language Generation","titleJa":"意味的残差ベクトル量子化――手話生成を「何を表すか」から「どう動くか」へ","url":"https://arxiv.org/abs/2611.06781"},{"authors":["Omar Hagrass","Bharath K. Sriperumbudur"],"categories":["math.ST","stat.ML"],"field":"math.ST","genre":"Optimization / Theory","monthKey":"2026-11","publishedAt":"2026-11-04T16:54:07Z","source":"arXiv math.ST","summaryHtml":"最大平均不一致（MMD）検定は、一般の領域で使える人気のノンパラメトリック検定である。その最適性については、構造的に異なる2つの系統が研究してきた。第一は、R^d上の畳み込みアプローチで、縮小する帯域幅を持つ平行移動不変カーネルを使い、L^2分離のもとでソボレフボール上にミニマックス最適である。第二は、一般の可測空間における正則化アプローチで、カーネル共分散作用素のスペクトル正則化を使い、Hellinger分離およびχ²分離の対立仮説に対してミニマックス最適である。<br><br>本論文は、L^2分離のもとでソボレフボール上の正則化アプローチを研究し、2つのアプローチの接続を明らかにする。<br><br>R^d上の平行移動不変カーネルでは、両者はカーネルのスペクトル密度に対する単一の条件を満たすための2つの方法であることが示される。スペクトル正則化された不一致は、ソボレフ対立仮説のL^2分離Δを捉える。検定理論の異なる伝統を一つの視点で結ぶ研究である。","timestamp":1793811247000,"title":"Regularization vs. Convolution in Kernel-Based Hypothesis Testing","titleJa":"正則化か畳み込みか――カーネル仮説検定における2つの最適性の接続","url":"https://arxiv.org/abs/2611.06778"},{"authors":["Jiawei Zhang","Rizhao Cai","Dayan Guan"],"categories":["cs.CV"],"field":"cs.CV","genre":"Vision / Multimodal","monthKey":"2026-11","publishedAt":"2026-11-04T16:50:17Z","source":"arXiv cs.CV","summaryHtml":"細粒度の視覚推論は、都市管理におけるリモートセンシングに不可欠だが、マルチモーダル大規模言語モデル（MLLM）の評価では十分に探求されてこなかった。本論文は、無人航空機（UAV）画像から構築された、交通監視、都市建設、環境品質、災害警報といった複数の都市管理タスクのための細粒度都市リモートセンシングベンチマーク「UMBench」を提案する。<br><br>UMBenchでの評価は、現在のMLLMがしばしば場面レベルの事前知識に頼り、細粒度の視覚的証拠を見落とすことを明らかにした。<br><br>この問題に対処するため、著者らはさらに、訓練不要の方法でモデルに細粒度の視覚的証拠を精査させる、新しい証拠優先の思考連鎖（evidence-first chain-of-thought）手法を提案する。実験では、この手法がオープンソースと商用の双方のMLLMのUMBenchでの性能を改善できることが示された。「まず証拠を見る」推論の促しが、リモートセンシングでも効くことを示す研究である。","timestamp":1793811017000,"title":"Benchmarking Fine-Grained Visual Reasoning for Remote Sensing in Urban Management","titleJa":"UMBench――都市管理のためのリモートセンシング細粒度視覚推論ベンチマーク","url":"https://arxiv.org/abs/2611.06770"},{"authors":["Qiang Wang","Jianxin Bi","Shulong Jiang","Ruiyang Si","Wenbo Huang","Kaiqi Chen","Jiaxin Li","Liyun Li","Xuanyi Li","Daquan Zhou"],"categories":["cs.RO"],"field":"cs.RO","genre":"Agents / Reasoning","monthKey":"2026-11","publishedAt":"2026-11-04T16:46:03Z","source":"arXiv cs.RO","summaryHtml":"GPT-6-Astraのようなモデルで駆動されるコーディングエージェントは、空間的推論と実行可能なロボット行動を結びつけ、そのようなエージェントが物理的な相互作用からロボット能力の持続的な改善をどう生み出せるかという問いを提起している。本研究は、「PyRUA-REAL」という枠組みを通じて、身体化された再帰的自己改善（RSI）を実世界の探索、コード洗練、配備の観点から研究する。<br><br>この枠組みでは、コーディングエージェントが相互作用の経験を、持続的な記憶と再利用可能な実行可能スキルとして保持し、その後の探索と改善に活かす。実証研究は物理的なマニピュレーションを改善過程の中心に置き、エージェント同士がどう協働するか、どんな実行フィードバックが効果的なコード洗練を支えるか、タスク仕様や以前に獲得したスキルが頑健性やタスク転移にどう影響するかを調べる。<br><br>さらに、得られたプログラムを人間の関与なしに配備した際の効率と能力も検証されている。シミュレーションではなく実世界で自己改善のループを回す試みであり、その成否の条件を探る研究である。","timestamp":1793810763000,"title":"PyRUA-REAL: Robot Exploration and Adaptive Learning through RSI in the Real World","titleJa":"PyRUA-REAL――実世界での探索と適応学習によるロボットの再帰的自己改善","url":"https://arxiv.org/abs/2611.06768"},{"authors":["Chijin Zhou","Quan Zhang"],"categories":["cs.SE"],"field":"cs.SE","genre":"LLM / NLP","monthKey":"2026-11","publishedAt":"2026-11-04T16:42:53Z","source":"arXiv cs.SE","summaryHtml":"LLMエージェントはデータへアクセスし、ツールを呼び出し、ユーザの代わりに行動する。これらの行動を認可された範囲内に保つことは難しい。エージェントは自ら実行経路を選ぶ一方で、権限や運用条件は変化しうるからである。本論文は、エージェントのアクセス制御における最近の進展を、方針の仕様化と導出、アイデンティティと委任、行動とリソースの強制、情報フロー制御という4つの領域にわたって概観する。<br><br>著者らは各手法の制御対象、強制の境界、前提を比較し、個別の仕組みが何を達成し、どう協働できるかを検討する。その分析を踏まえて、認可について4つの側面を考え直す。計画の選択が権限の要求を形作ること、文脈情報はそれ自体が権限を与えなくても意思決定に資すること、制限はシステムのインターフェースを越えても意味を保たなければならないこと、ワークフローの進化に合わせて認可を再評価しなければならないことである。<br><br>これらの洞察が、未解決の課題群を動機づける。エージェントの権限管理を「一度与えて終わり」ではなく、実行に寄り添う継続的な営みとして設計し直すサーベイである。","timestamp":1793810573000,"title":"Rethinking Access Control for AI Agents: Recent Advances and Open Challenges","titleJa":"AIエージェントのアクセス制御を考え直す――最近の進展と未解決の課題","url":"https://arxiv.org/abs/2611.06764"},{"authors":["Shubhabrata Mukherjee","Jeffrey Donatelli","Daniela Ushizima"],"categories":["cs.CV","cs.AI"],"field":"cs.CV","genre":"Vision / Multimodal","monthKey":"2026-11","publishedAt":"2026-11-04T16:39:17Z","source":"arXiv cs.CV","summaryHtml":"科学的な画像分析ワークフローでは、エージェントは説明、検出、計数、セグメンテーションなど多様な能力の中から選ぶ必要がある。現在のマルチツールアーキテクチャは、意図の解釈と視覚的実行を混同しており、失敗が推論の欠陥（誤った経路選択）によるのか、知覚の失敗（無効なツール実行）によるのかを覆い隠している。この監査可能性の欠如が、高リスクの科学自動化におけるエージェントの信頼性を損なっている。<br><br>本論文は、ルーティング方針と行動実行の分離を実装した拡張可能なアーキテクチャ「ZETA」を提案する。ZETAは専門的な視覚ツールを呼び出す前に科学的意図を解決し、計測を、生成的出力ではなく明示的な幾何に基づく決定的な操作として扱う。<br><br>このアーキテクチャはエージェントの意思決定という「ブラックボックス」を露わにし、経路選択の正しさと下流の実行を独立した失敗モードとして評価できるようにする。科学用途のエージェントに求められる説明可能性への、設計面からの回答である。","timestamp":1793810357000,"title":"Route First, See Later: Enabling Vision Agents to Reason Scientifically by Separating Routing Policy from Action Spaces","titleJa":"まず経路を決め、見るのは後――ルーティング方針と行動空間を分けて視覚エージェントに科学的推論を","url":"https://arxiv.org/abs/2611.06760"},{"authors":["Gilad Karpel","Itay Evron","Ron Meir","Daniel Soudry"],"categories":["cs.LG"],"field":"cs.LG","genre":"Ethics / Safety","monthKey":"2026-11","publishedAt":"2026-11-04T16:38:46Z","source":"arXiv cs.LG","summaryHtml":"本研究は、高次元の統計設定における、線形予測器による継続学習のためのロジスティック回帰を調べる。既存の理論研究は、解析的な単純さとニューラルネットのカーネルレジームとの接続を動機として、L2正則化の変種を用いた継続線形回帰にほぼ集中してきた。<br><br>著者らはまず、継続線形分類に対する最適なL2正則化強度を導出し、その汎化性能を特徴づける。継続線形回帰についての先行結果と類似した振る舞いが回復される。次に、最小の2層対角線形ネットワークを用いて、より深いモデルにおけるL2正則化の効果を調べる。単一タスク設定では、このようなモデルの重みへのL2正則化は予測器のスパース性を促進し、カーネルレジームを超えた豊かなスパース特徴学習のレジームを生むことが知られている（2層ReLUネットでも同様の効果がある）。しかし継続学習では事情が異なりうる。<br><br>継続学習の文脈でスパース性バイアスがどう働くか――過去タスクの保持と新タスクの学習の緊張の中で――を理論的に掘り下げる研究である。","timestamp":1793810326000,"title":"Continual Classification Beyond the Kernel Regime: Harnessing the Sparsity Bias of L2 Regularization in Diagonal Linear Networks","titleJa":"カーネルレジームを超えた継続分類――対角線形ネットにおけるL2正則化のスパース性バイアス","url":"https://arxiv.org/abs/2611.06759"},{"authors":["Yequan Bie","Dengyang Jiang","Zhixuan Chen","Xiaozhuan Liang","Haoxuan Che","Quande Liu","Xi Chen","Hao Chen"],"categories":["cs.CV","cs.AI"],"field":"cs.CV","genre":"Vision / Multimodal","monthKey":"2026-11","publishedAt":"2026-11-04T16:26:45Z","source":"arXiv cs.CV","summaryHtml":"生成ビデオモデルは視覚的な世界シミュレータとしてますます使われているが、その主たる強みは世界の進化の仕方についての推論ではなく、もっともらしいピクセルの描画にある。一貫した世界の進化には視覚的忠実度以上のものが必要である。出来事が起きたとき、モデルは世界の実体への帰結を推論し、その結果の状態を描画しなければならない。たとえば野獣が現れた後、モデルは野獣を描くだけでなく、近くの人が逃げるべきか、身を隠すべきか、戦うべきかを、実現した場面に基づいて推論すべきである。<br><br>既存の拡散ベースビデオモデルには、世界の状態を保持し、そのような出来事条件付きの帰結について推論する明示的な仕組みが欠けており、視覚的にはもっともらしくても振る舞いが静的だったり、因果的に不整合だったりする出力をしばしば生む。<br><br>この推論のギャップを具体的で測定可能なものにするため、著者らは新しい問題「視界外因果進化（Out-of-Sight Causal Evolution）」を提案する。モデルに、画面の外で起きた出来事の帰結まで含めて世界の進化を推論させる課題である。","timestamp":1793809605000,"title":"EvoWorld: Towards Out-of-Sight World Evolution in Generative Video Models","titleJa":"EvoWorld――生成ビデオモデルにおける「視界の外」の世界進化へ","url":"https://arxiv.org/abs/2611.06748"},{"authors":["Ruikang Li","Zixuan Chen","Jiarui Wu","Mingde Yao","Yiyuan Zhang","Yujin Wang","Hanming Deng","Lewei Lu","Tianfan Xue"],"categories":["cs.CV","cs.AI"],"field":"cs.CV","genre":"Vision / Multimodal","monthKey":"2026-11","publishedAt":"2026-11-04T16:23:24Z","source":"arXiv cs.CV","summaryHtml":"単一ターンの編集性能が強くても、複数ターンの対話が信頼できるとは限らない。編集された出力が繰り返し再利用されるにつれ、小さな意図しない変化が蓄積し、深刻な視覚的ドリフトになりうる。この長期ドリフトは通常、複数ターンデータでの訓練やターン横断のロールアウトで緩和されるが、それは事前学習の事前分布を変えてしまう可能性がある。あるいは基盤モデルへの拡張が難しい、推論時に特化した仕組みで対処されてきた。<br><br>本論文は、最終段階の訓練フレームワーク「TailSteer」を提案する。複数ターンの頑健性を高めながら、それまでの訓練で獲得した生成・編集能力を保持する。<br><br>TailSteerの原理は単純である。初期のデノイジング動態はベースモデルに近づけて保ち、保存のための修正は、細かな逸脱を抑え込める軌道の尾部（テール）付近に集中させる。修正は、編集器自身のオンポリシーなデノイジング・ロールアウトから、変化していないソース内容を使って学習される。能力を壊さずにドリフトだけを抑える狙いの設計である。","timestamp":1793809404000,"title":"TailSteer: Trajectory-Tail Steering for Drift-Resistant Multi-turn Image Editing","titleJa":"TailSteer――軌道の尾部を操舵して複数ターン画像編集のドリフトに抗う","url":"https://arxiv.org/abs/2611.06741"},{"authors":["Zeno Nongmaithem","Anushttha Srivastava","Anshit Sinha","Apoorv Sisodia","Suman Chowdhury","Prerana Mukherjee","Rajesh P. Barnwal"],"categories":["cs.CV","cs.LG"],"field":"cs.CV","genre":"Vision / Multimodal","monthKey":"2026-11","publishedAt":"2026-11-04T16:20:37Z","source":"arXiv cs.CV","summaryHtml":"シーングラフ予測（SGA）は、将来のビデオフレームにおける物体間の関係を予測する。連続時間のSGAモデルは主語―目的語の各ペアを独立したニューラルODEで進化させるため、実体を共有する関係同士は積分の間に互いに影響し合えず、同じペアについて「座っている」と「立っている」のような相互排他的な予測を何も妨げない。<br><br>本論文は「CoupledSGA」を提案する。関係同士を、ODEのベクトル場内にグラフ注意を持つ「関係相互作用グラフ」で結びつけ、相互排他的な述語の行列に基づく構造的一貫性損失（L_SC）を加える。<br><br>CoupledSGAの開発は、評価プロトコルの限界も明らかにした。制約付き（With-Constraint）評価は主語―目的語ペアごとにグループあたり1つの述語だけを保持するため、その R@K と mR@K は、L_SC が狙うグループ内の違反を捉えることができない。各グループの勝者述語が変わらない限り、これらの指標は不変であることが証明されている。評価指標そのものへの批判を含む研究である。","timestamp":1793809237000,"title":"Coupled Scene Graph Anticipation: When With-Constraint Recall Hides Structural Inconsistency","titleJa":"結合シーングラフ予測――制約付き再現率が構造的不整合を隠すとき","url":"https://arxiv.org/abs/2611.06738"},{"authors":["Abhiram Kothagundu","Pheelip Pritipal Raipure","Abhijit Chandrakant Patil","Himangshu Sarma","Christian Eichhorn","David A. Plecher","Johanna Pirker"],"categories":["cs.HC","cs.AI"],"field":"cs.HC","genre":"LLM / NLP","monthKey":"2026-11","publishedAt":"2026-11-04T16:18:35Z","source":"arXiv cs.HC","summaryHtml":"高強度インターバルトレーニング（HIIT）をゲーム化するため、スクワットとパンチの組み合わせ、両腕のストライク、斜めのストレッチコンボなど、あらかじめ定義した11種のコンボ動作を用いるVRエクサゲームシステムを開発した。ウェアラブルなモーションキャプチャスーツやヘッドセット内蔵センサに頼る従来の追跡法と異なり、三脚に置いた標準的なスマートフォンのカメラで全身の動きを捉える。HIIT特有の速く動的な動きにも適した、費用対効果が高く拡張可能な方法である。<br><br>スマートフォンの映像は姿勢推定アルゴリズムでリアルタイムに処理され、抽出された生体力学データは、Anthropicのオープン標準であるModel Context Protocol（MCP）上に構築されたバックエンドサーバとGPT-4oによって分析される。フォームの正確さ、動きの効率、運動強度、けがのリスクについて、個人に合わせた評価を生成する。<br><br>18〜25歳の参加者20名による被験者内比較では、VR条件のほうが非VR条件より楽しさ（平均3.5対2.8、p=0.02）、没入・集中（3.2対2.8、p=0.03）、他者への推奨意向（3.2対2.7、p=0.04）で有意に高かった。継続の自信に差はなく、知覚される強度も同程度だった。MCPによる評価は専門家の評価と87.5%一致し（10セッション、認定トレーナー1名）、フィードバック手段としての信頼性が示された。","timestamp":1793809115000,"title":"Smartphone-Aided VR Exergames for HIIT: Gamifying Fitness with Real-Time Pose Estimation","titleJa":"スマートフォン支援のVRエクサゲームでHIITをゲーム化する――リアルタイム姿勢推定","url":"https://arxiv.org/abs/2611.06734"},{"authors":["Philipp Mondorf","Adrien Deliège","Solim LeGris","Claas Beger","Ryan Yi","Barbara Plank","Brenden M. Lake","Todd M. Gureckis"],"categories":["cs.AI","cs.LG"],"field":"cs.AI","genre":"Agents / Reasoning","monthKey":"2026-11","publishedAt":"2026-11-04T16:17:36Z","source":"arXiv cs.AI","summaryHtml":"大規模推論モデル（LRM）は難しいベンチマークで良い性能を示すが、概念的に関連した推論タスクにわたって汎化可能な抽象を形成しているかは不明である。抽象と推論コーパス（ARC）は抽象を研究するための制御された試験台であり、解題者は少数の例から2次元格子上の変換規則を推論しなければならない。ARCは個別タスク内の規則抽象を評価するが、異なるタスクでも、異なる変換を必要としながら高次の構造を共有することがある。たとえば複数のタスクが、他の物体の中に含まれた物体についての推論を含むような場合である。<br><br>ConceptARCのようなベンチマークは、ARC式のタスクを繰り返し現れる空間的・意味的概念ごとにグループ化してこの構造を捉えるが、概念あたり数件の手作りタスクしか含まないことが多い。<br><br>本論文は「ConceptARC at Scale」を提案する。特定の概念を狙ったARC式タスクを数千件規模で作る生成器であり、概念理解の研究をスケールさせるための基盤である。","timestamp":1793809056000,"title":"ConceptARC at Scale: Studying Conceptual Understanding in Reasoning Models","titleJa":"ConceptARC at Scale――推論モデルの概念理解を大規模に研究する","url":"https://arxiv.org/abs/2611.06732"},{"authors":["Jarrod Ragsdale","Rajendra Boppana"],"categories":["cs.LG","cs.CL"],"field":"cs.LG","genre":"LLM / NLP","monthKey":"2026-11","publishedAt":"2026-11-04T16:17:28Z","source":"arXiv cs.LG","summaryHtml":"小規模言語モデルは、提出されたコマンドを実行することなくシェルをシミュレーションする、コンパクトな基盤を提供する。しかし全出力のデコーディングでは、実行ごとに変わる内容と並んで、繰り返し現れるユーティリティの構造まで予測しなければならない。本論文は「テンプレートギャップ再構成（TGR）」を提案する。再利用可能な出力リテラルに番兵（センチネル）を散りばめたテンプレートを与え、自己回帰的に生成される「ギャップ」と交互に配置する手法である。<br><br>テンプレート選択器が再構成すべきテンプレートを選び、空のテンプレートは全出力デコーディングを保持する。著者らは、異種の実行環境にわたって収集した1,870万件の出力からテンプレートバンクを構築し、バンク構築から除外した対象環境で、テンプレート選択器と5つの再構成モデルを、各種の小規模言語モデルのチェックポイントから初期化して訓練した。<br><br>評価では、最適なテンプレートがカバーする範囲が広い条件で、TGRが出力編集類似度（O-ES）において全出力デコーディング（FOD）を上回ることが示された。定型と可変部分を分けることで、小さなモデルの生成を安定させる工夫である。","timestamp":1793809048000,"title":"Template Gap Reconstruction for Shell Output Simulation with Small Language Models","titleJa":"テンプレートギャップ再構成――小規模言語モデルによるシェル出力シミュレーション","url":"https://arxiv.org/abs/2611.06731"},{"authors":["Shuai Dong","Kanghui Tian","Linghan Chen","Wenqi Shao","Hongrui Wu","Haowen Hou","Yongfu Zhu","Xuehui Wang","Ziyue Wang","Wenpu Liu","Weichu Xie","Yuqi Xu","Congcong Wang","Kaiwen Tuo","Caoyuan Ma","Taiqiang Wu","Ji Zhao","Wenzheng Chang","Dianyi Wang","Siyuan Wang","Zhongyu Wei","Yu Qiao","Jiaqi Wang"],"categories":["cs.CV","cs.CL","cs.LG"],"field":"cs.CV","genre":"Vision / Multimodal","monthKey":"2026-11","publishedAt":"2026-11-04T16:16:27Z","source":"arXiv cs.CV","summaryHtml":"ストリーミングビデオ理解では、モデルは応答するか観察を続けるかを繰り返し判断しなければならない。近年、Group Relative Policy Optimization（GRPO）がこの設定に適用され、既存のアプローチは報酬設計を重視する一方で、全ターンに単一の軌跡レベルのアドバンテージを保持してきた。そのような共有クレジットは、初期の成功後の冗長な返答を強化したり、初期の失敗後の有用なフォローアップを抑制したりしうる。<br><br>本論文は、学習を個々のストリーミング判断に合わせるターン単位のGRPOフレームワーク「TurnWise」を提案する。TurnWiseは、軌跡レベルのフィードバックとターン単位の対話との不整合に対処し、情報のある応答を促して冗長性を減らす。<br><br>具体的には、ターン単位のクレジット割り当ては、無音で完結した接頭辞のスコアリングを使って、各判断の残りのリターンからグループ相対アドバンテージを構築し、その学習信号を以前の報酬から分離する。ターン平均の方策最適化も導入される。「いつ話すか」を学ぶエージェントのための信用割り当ての精緻化である。","timestamp":1793808987000,"title":"Turns Matter: Advancing Streaming Video RL via Turn-Level Credit","titleJa":"ターンは重要だ――ターン単位のクレジットでストリーミングビデオ強化学習を進める","url":"https://arxiv.org/abs/2611.06728"},{"authors":["Ji Pei"],"categories":["cs.RO","cs.AI","cs.CV","cs.LG"],"field":"cs.RO","genre":"Vision / Multimodal","monthKey":"2026-11","publishedAt":"2026-11-04T16:13:29Z","source":"arXiv cs.RO","summaryHtml":"器用なロボットハンドは、大規模な人間データや基盤モデルとますます結びつけられているが、ハードウェア、表現学習、評価の進歩はばらばらに評価されることが多い。本調査は2024年1月から2026年11月初めまでの研究をレビューし、技術的系譜を確立するためにそれ以前の研究も含める。<br><br>文献は相互依存する5つの層に整理される。ハードウェア、データ収集とキュレーション、身体間（クロスエンボディメント）転移、学習と基盤モデル、そして評価と応用である。人間の手と物体の理解と、触覚センシングが、横断的な2つの視点を提供する。システムレベルのアーキテクチャ、比較表、5件のケース分析が、これらの層にわたる設計選択を結びつける。研究内の実験比較と、不均一なコーパス統計、ベンダ仕様、企業公表結果は区別して扱われる。<br><br>結論の一つは、人間データの価値は運動学的・視覚的な条件に依存することである。ハンドという部品ではなく、データから評価までの全スタックで設計を考える必要性を示すサーベイである。","timestamp":1793808809000,"title":"Dexterous Robotic Hands in the Foundation-Model Era: A Full-Stack Survey of Hardware, Data, Cross-Embodiment Transfer, Learning, and Evaluation","titleJa":"基盤モデル時代の器用なロボットハンド――ハードウェア・データ・身体間転移・学習・評価の全スタック調査","url":"https://arxiv.org/abs/2611.06724"},{"authors":["Naima Elosegui Borras","Georgios Arvanitidis"],"categories":["cs.LG"],"field":"cs.LG","genre":"Scientific AI","monthKey":"2026-11","publishedAt":"2026-11-04T16:11:59Z","source":"arXiv cs.LG","summaryHtml":"ニューラルネットの連続対称性は、線形ネットやReLUネットにおける層のバランス性のように、勾配フローのもとで不変な保存量を生む。有限ステップの勾配降下はこれらの法則を保つとは限らない。とりわけ「安定性の縁（EOS）」では、反復はより滑らかな軌道の周りで振動し、その軌道は中心フロー力学（Cohen et al., 2025）で記述できる。本研究は、勾配フローの保存法則がこのレジームの中心フロー記述のもとでどう進化するかを調べる。<br><br>著者らは、曲率の補正が、臨界パラメータ方向に沿った振動の共分散によって決まる有限次元のドリフトを誘発することを示す。<br><br>これにより、中心フロー力学に従ってEOSでどの保存法則が残り、どれが破れるかを分析する第一歩が踏み出される。分析対象は、スカラーの2層モデル、2層の行列分解、2層ReLUネットワークであり、既知の保存法則がどうなるかが検証される。最適化の幾何と対称性の関係を深める理論研究である。","timestamp":1793808719000,"title":"Symmetry Breaking at the Edge of Stability via Central Flow Analysis","titleJa":"中心フロー解析による安定性の縁での対称性の破れ","url":"https://arxiv.org/abs/2611.06718"},{"authors":["Zohreh Abbasi Liasi","Batoul Hammoud","Anas Madkoor","Ehsaneddin Asgari"],"categories":["cs.CL","cs.AI"],"field":"cs.CL","genre":"LLM / NLP","monthKey":"2026-11","publishedAt":"2026-11-04T16:11:26Z","source":"arXiv cs.CL","summaryHtml":"検索拡張生成（RAG）は、言語モデルが事前学習で記憶した連想に頼るのではなく、文脈に述べられた関係について推論できることを前提にしている。本研究は、事実を取得させるのではなくプロンプトに直接与えることで、この証拠条件付きの関係推論を分離して調べる。<br><br>「Rel-Bloom」は、30のWikidata関係から構築された450問の多肢選択式の、制御された多言語診断である。同じ源泉関係が、Bloomに着想を得た5段階（記憶・理解・応用・分析・評価）と、3つの真実性条件（事実的・反事実的・中立化）で具体化される。43モデル、6言語、2つの多言語設定（226,800件の予測）にわたる評価で、3つの知見が際立った。<br><br>第一に、評価したすべてのオープンウェイトモデル系列で、応用から分析への段階で精度が急落し、大規模Graniteバケットでは47.2ポイントに達したが、どちらのGeminiモデルでもそうはならなかった。「文脈に書いてある関係を、その場で推論に使う」能力の段差が、多言語で定量化された研究である。","timestamp":1793808686000,"title":"Reasoning over Non-Parametric Memory in Multilingual LLMs: A Cognitive-Based Analysis of Relational Knowledge","titleJa":"多言語LLMにおける非パラメトリックメモリ上の推論――関係知識の認知的分析","url":"https://arxiv.org/abs/2611.06715"},{"authors":["Giuliano Galadini","Aurelio Uncini","Danilo Comminiello"],"categories":["cs.LG","physics.comp-ph"],"field":"cs.LG","genre":"Agents / Reasoning","monthKey":"2026-11","publishedAt":"2026-11-04T16:09:05Z","source":"arXiv cs.LG","summaryHtml":"フローマッチングをはじめとする深層生成モデルは、複雑な物理系を合成する強力な道具として台頭してきた。しかし標準的なアーキテクチャは純粋に統計駆動で、背後の支配方程式に無知なため、推論時に基本的な物理制約に違反しがちである。これらの制約を強制する既存のゼロショット手法は、硬い代数射影に頼ることが多い。疎な境界条件には有効だが、そのような離散的な幾何補正を密で全領域のPDEへ適用すると、確率の経路を乱し、学習された多様体から逸脱させ、大きな計算オーバーヘッドを招く可能性がある。<br><br>この課題に対し、本論文は「エネルギー誘導輸送」を提案する。非線形の物理制約を滑らかなポテンシャルエネルギーの景観として定式化する、訓練不要の新しい枠組みである。ODE積分を中断するのではなく、その流れにエネルギーの勾配を沿わせる発想である。<br><br>物理情報つき生成を、射影の硬さなしに実現する方向の研究であり、物理法則とデータ駆動生成の両立を狙う。","timestamp":1793808545000,"title":"Energy-Guided Transport for Projection-Free Physics-Informed Flow Matching","titleJa":"エネルギー誘導輸送――射影なしで物理制約を組み込むフローマッチング","url":"https://arxiv.org/abs/2611.06711"},{"authors":["Muhammad Danish Waseem","Ahmed Ali-Eldin Hassan"],"categories":["cs.RO"],"field":"cs.RO","genre":"Vision / Multimodal","monthKey":"2026-11","publishedAt":"2026-11-04T16:09:02Z","source":"arXiv cs.RO","summaryHtml":"視覚・言語・行動（VLA）モデルは、カメラ観測と言語指示をロボットの行動へ写像する。しかし大きなバックボーンと繰り返しの行動生成により、推論がロボットの次の行動に求められるリアルタイム要件より長くかかることがある。VLA計算の負荷を減らすため、量子化やプルーニングなど複数の最適化手法が提案されてきた。これらは、より良いカーネルコンパイルや、eagerモードの代わりにCUDAグラフを使うといった一般的な最適化と組み合わせることもできる。<br><br>しかし、これらの最適化結果の多くは単一のGPU種で、少数のVLAモデルについて報告されるだけで、特定のハードウェア上でモデルの本当のボトルネックが何か、最適化が報告結果の外側へどう汎化するかは分析されていない。<br><br>本論文は、CUDAグラフから始まる7系統の推論最適化手法についての包括的な測定研究を提供する。最適化の「効く・効かない」を、モデルとGPUの組み合わせごとに実測で切り分ける、実務的な価値の高い研究である。","timestamp":1793808542000,"title":"Where Is VLA Inference Time Spent? Bottlenecks and Optimization Interactions Across GPUs","titleJa":"VLAの推論時間はどこで使われるか――GPU横断のボトルネックと最適化の相互作用","url":"https://arxiv.org/abs/2611.06710"},{"authors":["Thao Do Ngoc","Emma Carmel"],"categories":["cs.CY","cs.AI"],"field":"cs.CY","genre":"LLM / NLP","monthKey":"2026-11","publishedAt":"2026-11-04T16:08:17Z","source":"arXiv cs.CY","summaryHtml":"責任あるAIの研究は、倫理原則がAIの設計と開発にしばしば反映されないことを見出してきた。「原則と実践のギャップ」として概念化され、これは実装、認識、コンプライアンスの問題、ひいてはシステムや個人の振る舞いの不足として枠づけられてきた。本論文は、別の説明を提示する。<br><br>法執行、商業、研究、サバイバー支援の文脈にわたり、AIを活用した人身売買対策システムを設計・統治するアクターへの14件の半構造化インタビューに基づき、著者らは、そのような見かけのギャップは、アクターがある問題を――しかし他の問題はそうではなく――行動を要する倫理的問題として認識するに至る、多様で複雑な制度的・専門的条件から生じると論じる。<br><br>認識的な選択が倫理的判断と絡み合うことが示され、知覚、判断、状況づけられた行動、社会技術的な物質化という、相互に結びついた4つの局面がたどられる。ギャップを「不足」ではなく「現場の条件」から理解し直す、質的な研究である。","timestamp":1793808497000,"title":"Beyond the principle-practice gap: Responsible AI as situated epistemic and ethical practice","titleJa":"原則と実践のギャップを超えて――責任あるAIは、状況に埋め込まれた認識的・倫理的実践である","url":"https://arxiv.org/abs/2611.06709"},{"authors":["Tianwei Zhang","Ivy Njoki Nyagwencha","Zahraa Dirani","Shalini Joshi","Scott A. Hale"],"categories":["cs.CL","cs.AI","cs.CY","cs.LG"],"field":"cs.CL","genre":"LLM / NLP","monthKey":"2026-11","publishedAt":"2026-11-04T16:06:15Z","source":"arXiv cs.CL","summaryHtml":"テクノロジーを介したジェンダーに基づく暴力（TFGBV）は、直接的・隠蔽的さまざまな形態を通じて、女性とジェンダー少数者に広く及ぶオンラインの危害である。ジェンダー化された危害の検出のための現在のモデルと注釈付きデータセットは、グローバルノースの言語のデータと、そこで訓練されたモデルに支配されている。<br><br>ヨルダン、フランス語圏西アフリカ、ケニアの市民社会組織（CSO）と協力し、著者らは、レバント・アラビア語、アフリカのフランス語、スワヒリ語における、文化的・言語的に関連したTFGBVの事例をクラウドソースする、コミュニティ主導のアプローチを開発した。クラウドソースされたデータをアクティブラーニングで注釈し、小さいながら性能の良いデータセット（N=3,022）「ALTO」を構築し、3言語でのTFGBV検出を改善した。<br><br>ベンチマークとファインチューニングの実験では、既存の有害コンテンツ検出モデルはALTO内でのTFGBVの再現率が低く、ファインチューニングで改善することが示された。モデルは隠蔽的な危害を見逃しがちであることも分かった。過小評価されてきた言語圏の危害検出に光を当てる研究である。","timestamp":1793808375000,"title":"ALTO: African and Levantine Tech-Facilitated Gender-Based Violence Corpus","titleJa":"ALTO――アフリカとレバントにおけるテクノロジーを介したジェンダー暴力コーパス","url":"https://arxiv.org/abs/2611.06706"},{"authors":["Xinglu Wang","Edward Wang","Yong Zhang","Zhenan Fan"],"categories":["cs.LG"],"field":"cs.LG","genre":"Vision / Multimodal","monthKey":"2026-11","publishedAt":"2026-11-04T16:04:57Z","source":"arXiv cs.LG","summaryHtml":"上下左右だけの行動でパックマンをプレイするようエージェントを訓練すると、基本的な問いが生じる。性能が悪いとき、何を改善すべきか。難しさは、画面を読むことから来るのか、長い系列にわたる行動選択から来るのか。本研究は、Qwen3.5-9Bベースのエージェントについて、独立した知覚チェックと、原始方策の強化学習研究を通じてこれらの問題を調べる。<br><br>テキスト化した盤面を使い、画像の転記を意思決定インターフェースから取り除いた方策研究では、8つの保留迷路でのクリア率は、この最適化の前の0%から、選ばれたチェックポイントで80.2%（残機3つ追加）まで上がった。知覚チェックは、正確な静止スクリーンショットの読み取りが、対話中の誤りと共存しうることを示す。<br><br>別の方策比較では、さらなる最適化がより悪い行動選択を伴うことも示された。これらの知見は、訓練後の具体的なチェックを動機づける。知覚は使用中の状態で評価すること、そして失敗の所在を切り分けることが、エージェント改善の前提になるという診断の研究である。","timestamp":1793808297000,"title":"Where It Breaks: Diagnosing Perception, Memory, and Decision Failures of a Vision-Language Agent in Pac-Man","titleJa":"どこで壊れるか――パックマンで視覚言語エージェントの知覚・記憶・意思決定の失敗を診断する","url":"https://arxiv.org/abs/2611.06704"},{"authors":["Pranay Samineni","Adam Thorpe","John Chubick","Anand Balakrishnan","Christian Ellis","Swarat Chaudhuri","Ufuk Topcu"],"categories":["cs.RO","eess.SY"],"field":"cs.RO","genre":"Robotics","monthKey":"2026-11","publishedAt":"2026-11-04T16:02:59Z","source":"arXiv cs.RO","summaryHtml":"異種の空地チームは、地上車両のセンサの限られた範囲と視点を、空からのセンシングで補うことができる。しかし、UGV（無人地上車）が支援を必要とするのはいつか、UAV（無人航空機）がどんな情報を集めるべきかを決めることは課題として残る。本論文は、プランナ条件付きの空地支援手法を提示する。地図情報の不確実性がUGVの現在のMPPIロールアウトへどう影響するかを評価する手法である。<br><br>航法が劣化したままであれば、解決済みの地図仮説のもとで同じロールアウトを採点し、最も有用な改善をもたらす地図レイヤーを選び、対応する空からの計測を要求し、返ってきた情報を融合して再計画する。固定した支援役割やタスク構造、不確実性そのものに駆動される手法と異なり、本手法は、不確実性の解消が予測される地上航法を改善するかどうかに支援を条件づける。<br><br>3つのオフロード路線での180回のシミュレーション試行で、本手法は98.9%の目標到達を達成しながら、UAVの平均飛行時間を削減した。「必要なときだけ呼ぶ」支援の設計である。","timestamp":1793808179000,"title":"When to Ask for Help: Uncertainty-Triggered Aerial Refinement for Off-Road Navigation","titleJa":"いつ助けを求めるか――不確実性で発動するオフロード航法の空中支援","url":"https://arxiv.org/abs/2611.06702"},{"authors":["Sicheng Yang","Rui Tang","Haipeng Zhou","Hongqiu Wang","Zhaohu Xing","Jianda Ma","Lie Dai","Guang Yang","Lei Zhu"],"categories":["cs.CV"],"field":"cs.CV","genre":"Vision / Multimodal","monthKey":"2026-11","publishedAt":"2026-11-04T16:02:29Z","source":"arXiv cs.CV","summaryHtml":"病理学のための深層学習手法は、大規模なピクセルレベルの注釈の入手可能性の低さとコストの高さに制約されている。合成データはこの制限を緩和できるが、既存のパイプラインは信頼できる品質管理を欠くことが多く、下流の分析とのつながりも弱い。この問題に対し、本論文は、自動データスクリーニング、生成的表現学習、下流タスクへの効率的な適応を統合した3段階の枠組みを提案する。<br><br>第一に、病理エージェントシステムを開発して画像品質を評価しサンプルを選別し、公開TCGAリポジトリから選ばれた217,030件の病理パッチからなるデータセット「TCGA-200K」を得た。第二に、選別されたデータで生成モデルを訓練する。画像合成に加えて、そのバックボーンは下流タスクへ転移可能な構造的・意味的表現を学ぶ。<br><br>第三に、事前学習した生成バックボーンを、意味的セグメンテーションへ適応させる。データの質の管理から生成、実タスクへの転移までを一つの流れにまとめた、医療画像AIの実践的なパイプライン研究である。","timestamp":1793808149000,"title":"Agent-Driven Generative Priors for Pathology Image Synthesis and Segmentation","titleJa":"エージェント駆動の生成事前知識による病理画像の合成とセグメンテーション","url":"https://arxiv.org/abs/2611.06701"},{"authors":["Zhenyi Shen","Junru Lu","Wei Liu","Jiangnan Ye","Jiazheng Li","Di Yin","Xing Sun","Tameem Adel","Yali Du","Lin Gui","Yulan He"],"categories":["cs.CL"],"field":"cs.CL","genre":"LLM / NLP","monthKey":"2026-11","publishedAt":"2026-11-04T13:33:47Z","source":"Hugging Face Papers","summaryHtml":"言語モデル間の潜在的なコミュニケーションの一形態であるPrefill-to-Autoregressive Cross-model Transfer（PACT）は、大きなモデルのプロンプト表現と小さなモデルの効率的な生成を組み合わせ、能力と推論コストのバランスを取る有望な方法である。しかし既存のシステムは、大小のモデルの協調を独立に評価する仕組みが乏しく、タスク性能の向上だけでは、受け手が送り手の情報を本当に活用したのかは分からない。<br><br>本研究は、凍結したモデル同士を軽量なゼロ初期化の線形ブリッジでつなぎ、タスク報酬で直接訓練するオープンソースのPACTフレームワーク「PLatour」を提案する。ハイブリッド注意アーキテクチャにも対応する。PLatourは生成タスクでオープンソースのベースラインを大きく上回り、数学とコーディングの共有ベンチマークでは、より小さな送り手を用いながらMostikの報告結果を上回った。<br><br>一方で統制実験では、一部のタスクの改善が、無情報な送り手信号や自己コミュニケーション、受け手だけの訓練でも再現できることが示された。訓練可能なブリッジは、送り手の情報を活用せずにパラメータ効率的な適応として働きうる。そこで本研究は、訓練済みPACTシステムの改善のうちどれだけが真にコミュニケーションに由来するかを定量化する「PACT-Check」を提案し、PACTシステムの可能性と課題を論じる。","timestamp":1793799227000,"title":"On the Opportunities and Challenges of Prefill-to-Autoregressive Cross-Model Transfer","titleJa":"大小モデル間の潜在コミュニケーションPACT――性能向上は本当に情報伝達によるものか","url":"https://arxiv.org/abs/2611.06976"},{"authors":["Yuetong Liu","Zhehao Zhou","Yitong Zhang","Haorui Chen","Jia Li"],"categories":["cs.AI"],"field":"cs.AI","genre":"Agents / Reasoning","monthKey":"2026-11","publishedAt":"2026-11-04T13:32:36Z","source":"Hugging Face Papers","summaryHtml":"LLMエージェントは通常、ツールの出力をそのままテキストとして文脈に追加する。複数ステップのやり取りでは、長くノイズの多い観測が文脈を圧迫し、課題に関連する情報への注意を薄めてしまう。既存のトークン削減や要約の手法は、離散的なテキスト表現に縛られ、圧縮率にも限界があった。本研究は、エージェントがツールの観測を必ずしも明示的なテキストトークンとして消費する必要はない、という前提に疑問を投げかける。<br><br>著者らは、ツールの観測を潜在トークンに圧縮し、エージェントの入力埋め込み空間に組み込む連続潜在文脈圧縮モデル「Coca-Cola」を提案する。さらに、完全な観測と圧縮した観測の下での次の行動の分布を一致させる「行動保持訓練」を導入し、意思決定に必要な情報を保つ行動十分な潜在トークンを学習させる。<br><br>ウェブ検索エージェントを用いた4つのQAベンチマークと2つのモデル系列での実験では、トークン消費量が70.01〜89.24％、エンドツーエンドの実行時間が24.45〜55.97％削減され、課題性能は一貫して向上した。テキストに頼らず潜在空間で文脈を扱うことが、エージェントの効率と性能の両方を高める道であることを示す研究である。","timestamp":1793799156000,"title":"Tools Need Not Speak in Text: Latent Context Compression for Agents","titleJa":"ツールはテキストで語る必要はない――エージェントのための潜在文脈圧縮","url":"https://arxiv.org/abs/2611.06500"},{"authors":["Kejian Zhu","Zhuoran Jin","Shangqing Tu","Tianyi Men","Yupu Hao","Jiachun Li","Kang Liu","Jun Zhao"],"categories":["cs.LG","cs.CL"],"field":"cs.LG","genre":"Agents / Reasoning","monthKey":"2026-11","publishedAt":"2026-11-04T08:24:54Z","source":"Hugging Face Papers","summaryHtml":"マルチターンのエージェント強化学習は長期的なタスクで優れた性能を示すが、その効果は対話の制約条件に大きく左右される。本論文は、サンプリングの幅Kと対話の深さTを変えた評価指標Pass@(K,T)により、軌跡レベルの強化学習の優位性が十分なターン数の予算に依存し、予算が厳しくなると大幅に低下することを示した。<br><br>また、エージェント強化学習は一段階の意思決定の質を一様に高めるわけではない。その強みはむしろ、誤りからの回復や長期的な粘り強さに集中していることが明らかになった。展開時の予算依存によるリスクを抑えるため、論文ではプロセス監督シグナルの利点と限界を予備的に論じ、学習中に相互作用の予算を変化させるBudgetMix RLを提案している。<br><br>実験の結果、BudgetMix RLは多様な実行条件のもとで頑健な性能を達成し、学習時と展開時でターンの予算が異なる場合でも性能が崩れにくい点が確認された。エージェント強化学習の効果を「何が改善され、何が改善されないか」という観点から切り分けた、実務的にも示唆に富む検証である。","timestamp":1793780694000,"title":"What Does Multi-Turn Reinforcement Learning Really Improve in LLM Agents?","titleJa":"マルチターン強化学習はLLMエージェントの何を本当に改善するのか","url":"https://arxiv.org/abs/2611.06483"},{"authors":["Lindsay P Cameron","Matthew W Johnson","Kevin S Murnane","Mark M Rasenick","Charles D Nichols"],"categories":["psychedelics","drug development","review"],"field":"PubMed","genre":"Psychedelics / Therapy","monthKey":"2026-11","publishedAt":"2026-11-04T00:00:00Z","source":"PubMed","summaryHtml":"サイケデリック医療は、うつ病や不安、心的外傷後ストレス障害（PTSD）など、さまざまな神経精神疾患の治療として急速に注目を集めている。これまで治療が難しいとされてきた症状に対しても新たな選択肢として期待が高まり、研究と臨床応用の両面で広がりを見せている。新しいサイケデリック類縁体や投与レジメンが次々に登場し、検証すべき変数の数も増え続けている。本総説は、次世代のサイケデリック治療を開発するうえでの多様なアプローチと留意点を整理する。<br><br>現在の評価法やモデルの長所と短所を検討し、どのような試験系が新しい化合物や投与法の評価に適しているかを論じる。類縁体や投与レジメンが増えるなかで、どの変数をどう検証すべきか、開発の現場で直面する判断材料を提示する。既存の評価法では捉えきれない側面や、モデルごとの適用範囲の違いにも触れ、開発の進め方を多角的に検討する。<br><br>最後に、次世代のサイケデリック医薬品開発に向けた指針と考慮事項を示す。安全性と有効性の両立をどう評価し、臨床応用へどうつなげるか。サイケデリック医療の広がりを受けて、開発の枠組みそのものを整えるための展望をまとめた総説である。","timestamp":1793750400000,"title":"Next-Generation Psychedelic Drug Development","titleJa":"次世代サイケデリック医薬品の開発――新たな治療法づくりへの指針","url":"https://pubmed.ncbi.nlm.nih.gov/42980080/"},{"authors":["Sherry Choi","Sitao Sunny Li","Joseph Romero","Lillian Chin","Ashwin G. Ramayya","Allison M. Okamura","Ava Chen"],"categories":["cs.RO"],"field":"cs.RO","genre":"Neuroscience","monthKey":"2026-11","publishedAt":"2026-11-03T23:27:44Z","source":"arXiv","summaryHtml":"意識障害の入院患者の神経学的評価では、有害刺激への運動反応が用いられるが、ベッドサイドでは手作業で刺激を与えるため力や持続時間、頻度、部位にばらつきがある。本研究は、手首装着型の空気圧デバイス「OUCH」を提案する。ブロック力試験や臨床医による評価、有限要素解析、変形可能な圧力試験台で特性を評価し、市販の携帯型圧力痛覚計と比較した。<br><br>積層した空気圧ポーチと硬い圧子、設定荷重で座屈する柔軟なスペーサーを組み合わせ、作動時のみ圧子が皮膚に触れる。200kPaの加圧で接触圧は推定18,500kPaに達し、市販の圧痛計の25倍以上で、必要な総荷重は小さい。変形可能な試験台では表面近くの変形に局在し、深部の変形は圧痛計と同程度だった。<br><br>予備的な知覚試験では、圧痛計より約89％低い力で不快感を誘発でき、小型でウェアラブルなソフトアクチュエータでも不快感を起こせることが示された。空気圧と接触形状の設計により、制御可能で再現性のある有害刺激を手首で与えられ、客観的な神経学的評価の基盤になる。出典： arXiv","timestamp":1793748464000,"title":"OUCH: Objective, Uniform, Controlled Haptic Stimulation for Automated Neurological Assessment","titleJa":"OUCH：自動神経学的評価のための客観的・均一・制御された触覚刺激","url":"https://arxiv.org/abs/2611.05741"},{"authors":["Athanasios Pitis","Maria Nikoloudi","Nikos Stefanis","Kyriaki Mystakidou"],"categories":["psychedelics","systematic review"],"field":"PubMed","genre":"Psychedelics / Therapy","monthKey":"2026-11","publishedAt":"2026-11-03T00:00:00Z","source":"PubMed","summaryHtml":"シロシビン支援療法は、がんや生命を脅かす病気に伴う苦悩への有望な介入として再び注目されている。本統合的システマティックレビューはPRISMA指針に沿い、2025年8月10日から10月31日までにPubMed、Scopus、Google Scholar、CINAHLを検索し、6つの独立した臨床コホートから得られた11件の報告を対象に、がんのある成人における抑うつ、不安、実存的苦悩に対する安全性、有効性、治療的影響を評価した。<br><br>シロシビンは一般に、準備、投与、統合の構造化された枠組みのもとで、監督下の単回中〜高用量（25〜30mg/70kg）として投与された。すべての研究デザインを通じて、抑うつ、不安、実存的苦悩、死への恐怖の迅速かつ持続的な軽減がみられ、効果は2〜6か月、場合によっては4.5年まで続いた。質的知見では、感情の明晰さや受容、スピリチュアルな安寧、意味との再接続が際立った。11件中5件がMMATの基準を満たし、他では評価者の盲検化や代表性、交絡の統制などに課題が残った。<br><br>シロシビン関連の重篤な有害事象は報告されず、一時的な心血管系の変化や頭痛、吐き気、不安、短時間の精神病様症状がみられた。著者らは、がん関連の心理的・実存的苦悩に対する有望だがいまだ研究段階の緩和的介入だと結論づけている。","timestamp":1793664000000,"title":"Psilocybin-Assisted Therapy for Cancer-Related Psychological and Existential Distress in Adults with Cancer: An Integrative Systematic Review","titleJa":"がんに伴う心理的・実存的苦悩に対するシロシビン支援療法――統合的システマティックレビュー","url":"https://pubmed.ncbi.nlm.nih.gov/42975895/"},{"authors":["Hao Fei"],"categories":["cs.CL"],"field":"cs.CL","genre":"Agents / Reasoning","monthKey":"2026-11","publishedAt":"2026-11-03T00:00:00Z","source":"Hugging Face Papers","summaryHtml":"10年間、AIの進歩は機械が独力で何をできるかで測られてきた。基盤モデルはコードを書き、複数段階のタスクをこなし、パーソナルエージェントは人に代わって行動するようになった。それでも人は、かつて知っていたことを忘れ、目の前のものを見逃し、適切な言葉が見つからず、自分の来歴を活かせないまま難しい選択に直面する。助けになるはずの機械が、状況の外に立っているからだ。<br><br>フィジカルAIの時代、注目は身体化ロボットに集まっているが、本論文はもう一つの同等に重要な存在として「AIによって拡張された人」を挙げる。汎用人工知能（AGI）が「機械がどれほど賢くなれるか」を問うのに対し、AI拡張人間知性（AHI）は「機械が特定の個人にどれだけの知性を可能にするか」を問う。その実現には「認知的共生体」という新しいシステムが必要だ。生涯にわたり、埋め込み型で、リアルタイム、プライベート、低摩擦、能動的な伴侶であり、外部デバイスを通じて人が感じるものを感知し、数年にわたって文脈を保持し、状況と心をモデル化し、適切な瞬間に思考へ参加し、文脈を踏まえて日常のタスクを遂行し、双方の変化とともに人を学び続ける。<br><br>概念的な核は「認知的ギャップ」――人が状況に持ち込めたはずのものと、ワーキングメモリに保持できるものとの隔たりである。設計空間は、感知・保持・理解・共生・代行・共考・成長からなる共生ループとして整理され、個人ランタイムと信頼によって囲まれる。一方で、試験での隠れた支援や導入への同調圧力など、新種のリスクも生じるとし、ガバナンスをこのパラダイムの一部として扱う。","timestamp":1793664000000,"title":"From Autonomous Agents to Cognitive Symbionts: Toward AI-Augmented Human Intelligence","titleJa":"自律エージェントから認知的共生体へ――AIで拡張される人間の知性","url":"https://arxiv.org/abs/2611.05376"},{"authors":["Swathi Pallikala","Yashas Hariprasad"],"categories":["cs.AI"],"field":"cs.AI","genre":"Ethics / Safety","monthKey":"2026-11","publishedAt":"2026-11-02T05:38:45Z","source":"arXiv","summaryHtml":"自律型AIエージェントが医療、法務、財務、企業の業務といった影響の大きい領域に急速に導入され、ガバナンスの課題が差し迫っている。AI評価の分野はエージェントの能力を測る高度なベンチマークを生んできたが、それらが測るのは「何ができるか」だけであり、「どのように行うか」は測られていない。人間の自律性の尊重、危害の回避、透明性と非欺瞞、プライバシー遵守、説明責任といった、責任ある導入に最も重要な倫理的次元は、現在の評価実践から体系的に抜け落ちている。本論文はこの空白に応える。<br><br>貢献は三つある。第一に、主要なAIエージェントベンチマーク12本の構造化された文献レビューにより、各ベンチマークが測っている倫理的次元と測っていない次元を明らかにした。第二に、確立されたAI倫理原則にもとづき、開発者、監査者、規制当局が使える運用可能な評価手段として、AIエージェント倫理評価フレームワーク（EEFA）を導入した。EEFAは自律性の尊重、危害回避、透明性と非欺瞞、プライバシー遵守、説明責任と追跡可能性といった次元で構成される。第三に、EEFAを実運用のエージェントへ適用するための再現可能な検証プロトコルを示した。<br><br>EEFAはEU AI法とNISTのAIリスク管理フレームワークの要件に直接対応づけられており、高リスクAI応向けのコンプライアンス評価手段として位置づけられる。多様なベンチマークやエージェントシステムへの実証的な適用は、今後の優先課題として挙げられている。","timestamp":1793597925000,"title":"EEFA: A Framework for the Ethical Evaluation of AI Agents","titleJa":"EEFA：AIエージェントの倫理評価フレームワーク――能力ではなく「どう行うか」を測る","url":"https://arxiv.org/abs/2611.02561"},{"authors":["John D Gault","Erin Almklov","Shirley Tang","Borsika A Rabin","Brian C Huynh","James O E Pittman"],"categories":["psychedelic-assisted psychotherapy","implementation science","systematic review"],"field":"PubMed","genre":"Psychedelics / Therapy","monthKey":"2026-11","publishedAt":"2026-11-02T00:00:00Z","source":"PubMed","summaryHtml":"サイケデリック支援心理療法（PAP）は、PTSDやうつ病など従来治療が難しい精神疾患への有効性を示すエビデンスが急速に蓄積し、米国では公衆や政府の関心も高まっている。一方で、効果的な治療法の発見と臨床現場への導入のあいだには溝があり、複雑な治療様式を体系的に実装するための知見を整理する必要がある。本系統的レビューは、PAPの実装に関する文献を特定し、その知見を統合して今後の方向性を示すことを目的とした。<br><br>PRISMA 2020に沿い、6つのデータベースを「implementation」「psychedelic（MDMA、シロシビン、LSD、ケタミン）」「psychotherapy」などの検索語で調べた。2,406件が特定され、重複と非査読文献を除いて2,074件をタイトル・抄録でスクリーニングし、47件を全文精査して20件を採用した。実装科学の枠組みPRISMに沿って、実装に関連する要因を抽出・統合した。<br><br>採用された20件のうち15件は、組織の視点から横断調査や質的インタビューで実装を評価したものだった。残りは患者の視点（2件）、インフラ（2件）、患者特性（1件）を扱っていた。学術的な場から利用しやすい臨床プログラムへPAPを移すうえでの最良実践に関する、実装に焦点を当てた研究には目立った不足がある。PAPを現実の現場で安全かつ効果的に実装するには、この溝を埋めることが不可欠だと結論づけている。","timestamp":1793577600000,"title":"From Evidence to Practice: A Systematic Review of Implementation of Psychedelic-Assisted Psychotherapy.","titleJa":"エビデンスから実践へ――サイケデリック支援心理療法の実装に関する系統的レビュー","url":"https://pubmed.ncbi.nlm.nih.gov/42978762/"},{"authors":["Odilia D Lu","Katrina White","Kendall B Raymond","Christine Liu","Alexandra S Klein","Nathaniel Green","Sam Vaillancourt","Austin J Gallagher","Lena Shindy","Alyssa Li","Kira E Wallquist","Ruoxian Li","Mila Zou","Austen B Casey","Natalie Perez","Muhammad Asim","Setareh Metanat","Kelsey R Logas","Vivan Chhaya","Alexander S Enos","Ellie M Ho","Lindsay P Cameron","Matthew B Pomrenze","Jason M Tucciarone","Vikaas S Sohal","Mazen A Kheirbek","Andrea M Gomez","Stephan Lammel","Boris D Heifets","Robert C Malenka"],"categories":["psilocybin","mouse behavior","reproducibility"],"field":"PubMed","genre":"Psychedelics / Therapy","monthKey":"2026-11","publishedAt":"2026-11-02T00:00:00Z","source":"PubMed","summaryHtml":"サイケデリック薬物のマウス行動への影響を報告する研究は急増しているが、その効果がどれほど再現性があり信頼できるかは不確かだった。これまで報告されてきた行動への影響が、別の研究室でも同じように得られるのかは確かめられていなかった。本研究は、5つの独立した研究室が同じ実験を行う多施設共同のアプローチで、シロシビンのマウス行動への影響のうち何が頑健で再現可能かを検証した。各実験には雌雄あわせて約200匹のマウスが用いられた。<br><br>その結果、シロシビン（2 mg/kg、腹腔内投与）は急性期に不安・回避関連の行動を増やし、恐怖の表出を減らすことが、頑健かつ再現可能な形で示された。一方で、投与24時間後の不安・抑うつ様行動の軽減や恐怖消去学習の促進といった持続的な効果は、再現可能な形では認められなかった。社会的選好や社会的報酬学習への影響も観察されなかった。<br><br>シロシビンには確かな急性効果がある一方で、報告されてきた持続的な効果の一部は控えめか一貫しない可能性があることが示された。マウス研究におけるサイケデリック効果の解釈に、再現性の観点から慎重さを求める検証結果である。","timestamp":1793577600000,"title":"A multi-institutional investigation of psilocybin's effects on mouse behavior","titleJa":"シロシビンのマウス行動への影響を多施設で検証――再現可能な効果はどれか","url":"https://pubmed.ncbi.nlm.nih.gov/42972049/"},{"authors":["LaPlante CD","Saviano SC","Hardt MM","Pain K","Kolla S","Lee C","Maciejewski PK","Russell D","Smid GE","Prigerson HG"],"categories":["bereavement","prolonged grief disorder","pharmacotherapy","systematic review"],"field":"European journal of psychotraumatology","genre":"Psychedelics / Therapy","monthKey":"2026-11","publishedAt":"2026-11-02T00:00:00Z","source":"Europe PMC","summaryHtml":"遷延性悲嘆障害がDSM-5-TRとICD-11の診断体系に加わったことで、悲嘆に対する薬物療法への関心が高まっている。本レビューは、死別に伴う心理的苦痛、とくに死別に続発するうつ病への薬物療法がどのように行われ、どの程度有効かを調べた。MEDLINE、Embase、コクラン・ライブラリーなど6つのデータベースを検索し、2024年12月まで更新した。33件の研究（症例報告・症例集積10件、コホート研究7件、臨床試験16件）、参加者211,920人が対象となった。<br><br>9つの薬物クラスが検討され、抗うつ薬が最も多く研究されていた。対照群のある研究では、どの薬物も悲嘆症状そのものを軽減しなかった。抗うつ薬と、ベータ遮断薬とアスピリンの併用は、死別者のうつ症状には有効に見えた。薬物介入の悲嘆に対する効果量は無視できるほど小さく（標準化平均差-0.06）、うつに対する効果量も小さく有意ではなかった（-0.29）。<br><br>研究の質は全体に低く、方法論の弱さと報告のばらつきが統合を難しくした。現行の薬物療法が遷延性悲嘆障害に有効だという証拠はなく、治療選択肢の空白を埋めるさらなる研究が必要だという結論である。","timestamp":1793577600000,"title":"Pharmacological treatment of bereavement-related distress: a systematic review","titleJa":"死別に伴う苦痛の薬物療法――系統的レビュー","url":"https://europepmc.org/article/MED/42969145"},{"authors":["Xingyu Yi","Xinya Zhang","Yunshen Zhou","Haoyu Bao"],"categories":["cs.AI","cs.LG","q-bio.QM"],"field":"cs.AI","genre":"Agents / Robotics","monthKey":"2026-11","publishedAt":"2026-11-01T03:58:26Z","source":"Hugging Face Papers","summaryHtml":"科学エージェントは、読んで引用した証拠が異なっていても同じ結論を出すことがある。判断の正しさだけを見ていては、根拠のすり替えに気づけない。本研究は、同じ科学計算の場に保存された参照値と候補値を対にして用い、値を復元・移植してエージェントを走らせる監査手法「BioAgent-DF」を提案する。結論だけでなく、エージェントが使った証拠も追跡できるかを検証した。<br><br>8つのSciFactバッチで検証したところ、Qwen3.5-4Bでは3つの取得と主張の組み合わせで引用の変化が再現性をもって起き、Gemma 3 4B ITでは4つの組み合わせで読み取りと引用の変化が起きた。完全な復元では参照の証拠集合が回復したが、結論は変わらなかった。ツールと最適化の追加実験により、数値状態の回復、順位付きリストの回復、エージェントの可視履歴の復元の違いが区別された。<br><br>心臓安全性試験（hERGアッセイ）の割り当てでは、無言の数値不良が検査判断を変えたが、修正後の実行状態を復元し認証済みスコアを与えると、変わった39件の判断がすべて回復した。予測ファイルを置き換えるだけでは回復しなかった。監査は最終的な答えだけでなく、エージェントが使った証拠も追うべきだと示す研究である。出典：Hugging Face Papers","timestamp":1793505506000,"title":"From Tool State to Scientific Action: Auditing Decision Provenance in Biomedical Research Agents","titleJa":"ツール状態から科学的行動へ――生物医学研究エージェントの判断根拠を監査する","url":"https://arxiv.org/abs/2611.01527"},{"authors":["Daniel A Schaefer","Manish Agrawal","Emanuele Mazzola","Michelle K Leff","Celia Leeks","Benjamin S Kematick","Yvan Beaussant"],"categories":["psilocybin","cancer","depression"],"field":"PubMed","genre":"Psychedelics / Therapy","monthKey":"2026-11","publishedAt":"2026-11-01T00:00:00Z","source":"PubMed","summaryHtml":"シロシビン支援療法は、がん患者のうつ病に対して速やかな抗うつ効果を示すことが知られている。だがこれまでの試験の多くは、全身性の抗がん治療を現に受けている人を除外してきたため、この集団における安全性データは限られていた。本研究は、抗がん治療を併用している患者とそうでない患者とで、シロシビン支援療法の有効性と安全性を比較した、フェーズ2非盲検単群試験の二次解析である。<br><br>対象は悪性腫瘍と大うつ病性障害の診断を受けた成人30人（平均年齢56歳、女性70%）で、個人および集団での準備療法、25mgのシロシビン経口投与による集団投与セッション、個人および集団での統合療法を受けた。全身性抗がん治療群は17人、非併用群は13人。主要評価項目は投与後1・3・8週のMADRS（モンゴメリー・アスベルグうつ病評価尺度）スコアの群間差で、副次項目として8週までの有害事象を調べた。<br><br>その結果、MADRSスコアは両群とも大幅に低下し、群間に有意差はなかった（1週 P=.88、3週 P=.93、8週 P=.97）。有害事象は両群で頻繁だったが、重度の有害事象4件と重篤な有害事象1件はいずれも全身性治療群で生じたものの、シロシビンとは無関係と判断された。検査値や自殺念慮にシロシビンに起因する変化も見られなかった。抗がん治療中のがん患者でもシロシビン支援療法の抗うつ効果と安全性は同等であり、今後の試験に積極的治療中の患者を含める根拠となる。","timestamp":1793491200000,"title":"Safety and Efficacy of Psilocybin During Anticancer Treatment: A Phase II Trial Secondary Analysis.","titleJa":"抗がん治療中のシロシビン――安全性と有効性の第II相試験二次解析","url":"https://pubmed.ncbi.nlm.nih.gov/42546985/"},{"authors":["J Patchitt","T Karapanagiotidis","S N Garfinkel","M Miller","M Tsakiris","A Clark","H D Critchley"],"categories":["interoception","false feedback","graph theory"],"field":"PubMed","genre":"Consciousness / Neuroscience","monthKey":"2026-11","publishedAt":"2026-11-01T00:00:00Z","source":"PubMed","summaryHtml":"実際には存在しない身体の生理的フィードバックを信じ込んでしまう――そんな「偽フィードバック」へのだまされやすさには個人差があり、内受容（身体内部の感覚の処理）の違いを反映すると考えられてきたが、その背景にある脳ネットワークの仕組みは分かっていなかった。本研究は、偽フィードバック課題を行った健常成人41名の安静時機能的結合を、グラフ理論の手法で解析した。先行研究の賦活解析から定めた9つの関心領域について、局所効率やクラスタリング係数、中心性、経路長などのネットワーク指標を複数の閾値で計算した。<br><br>だまされやすさを予測したのは、3つの異なるネットワーク組織のパターンだった。だまされやすい人ほど、内受容の鍵となる後部島の偏心度が高く、ネットワークの周辺に位置づけられていた。また、眼窩前頭皮質は複数の指標で一貫して分離しており、経路長が長く中心性が低かった。さらに小脳ネットワークでは、局所効率の低下と媒介中心性の上昇を伴う再構成が見られた。<br><br>偽フィードバックへの感受性は、後部島などの内受容領域と、眼窩前頭皮質の情動評価システムとの統合が弱いことに由来する。内受容の処理は、内臓感覚と情動評価、認知制御システムの効率的な統合に依存するというネットワークモデルを支持する結果であり、内受容の気づきや情動調節を標的とする介入にもつながる知見である。","timestamp":1793491200000,"title":"Functional Network Organization Underlying Individual Differences in False Feedback Susceptibility: A Graph Theoretical Analysis","titleJa":"偽の身体フィードバックにだまされやすい脳――内受容ネットワークの個人差をグラフ理論で読む","url":"https://pubmed.ncbi.nlm.nih.gov/42963537/"},{"authors":["Letian Yang","Yiyang Wang","Weizhen Yin","Xinru Xu","Xuye Yuan","Han Yang","Shanping Zhang","Shuai Jiang","Yuanjie Guo","Yao Wang","Chanjuan Yang","Yanlin Zhou","Dongwei Li","Yan Song","Cai-Ping Dang"],"categories":["ADHD","auditory attention","EEG","N2ac","cross-modal attention"],"field":"NeuroImage","genre":"Consciousness / Neuroscience","monthKey":"2026-11","publishedAt":"2026-11-01T00:00:00Z","source":"PubMed","summaryHtml":"聴覚的な注意を効率よく働かせるには、目標となる音をそれ以外の音より優先しなければならない。注意の欠陥はADHDの中核的な特徴だが、視覚と聴覚をまたぐ注意のなかで、聴覚情報の優先づけを担う神経メカニズムは明らかになっていなかった。本研究は学齢期の子ども95名（ADHD群46名、定型発達群49名、平均年齢10.81歳）を対象に、視覚的手がかりによる聴覚空間注意課題を脳波（EEG）計測下で行い、N2ac成分と多変量パターン解析（MVPA）で調べた。<br><br>定型発達群では目標位置のMVPA復号が強まり、非目標位置の復号は弱まった。目標と非目標の神経的な区別が大きいほどN2acの振幅も大きかった。一方ADHD群では目標の側性化が弱く、N2ac振幅が小さく、目標の復号は弱い一方で非目標の復号が強まり、関連情報と無関連情報の神経的な区別が縮んだ。<br><br>目標関連の側性化の低下は反応時間のばらつきの大きさと、目標復号精度の低下は多動性・衝動性の症状の重さと関連していた。ADHD児では聴覚情報の神経的優先づけが変わっており、それが行動のばらつきや症状の重さと結びつくことが示された。注意機能障害の神経認知メカニズムへの新たな知見である。","timestamp":1793491200000,"title":"Altered neural prioritization of auditory information during cross-modal attention in children with ADHD.","titleJa":"ADHD児における聴覚情報の神経的優先づけの変化――クロスモーダル注意下のEEG研究","url":"https://pubmed.ncbi.nlm.nih.gov/42826852/"},{"authors":["Parsa Seyfourian","Lydia C Marks","Leslie D Claar","Yasmeen Nahas","Miles Keating","Christof Koch","Irene Rembado"],"categories":["pupil dynamics","consciousness","DeepLabCut"],"field":"Journal of Neuroscience Methods","genre":"Consciousness / Neuroscience","monthKey":"2026-11","publishedAt":"2026-11-01T00:00:00Z","source":"PubMed","summaryHtml":"瞳孔径は覚醒や注意、認知処理、意識と相関する非侵襲的な脳状態バイオマーカーである。しかし既存の瞳孔測定ソフトウェアは、実験条件や種をまたいでスケーラビリティと頑健性に欠けることが多い。本研究は、DeepLabCut に基づくオープンソースのオフライン・パイプライン Pupil-DLC を提案する。主にマウスを対象とし、マーカーなしで瞳孔を追跡できる。<br><br>140本超の頭部固定マウスの動画から人手でアノテーションした21,909フレームで学習した。覚醒状態に加え、サイケデリックスや麻酔による薬物誘発状態も含み、瞳孔サイズの多様性を最大化するようデータセットを構成した。Pupil-DLC は、高速処理向けの汎用モデルと、セッションごとに最適化する個別モデルの二重構造を採用する。覚醒時、サイケデリック投与時、麻酔時の瞳孔動態をグラウンドトゥルースと高い一致で捉え、活発な移動時も静止時も同等の追跡精度を示した。<br><br>信頼度指標は人間のフレーム品質評価と一致し、精度と保持率のトレードオフを原理的に調整できる。さらに、再学習なしに、昼光下やスマートフォン撮影を含む多様な条件・フレームレートのヒト動画にも拡張できることを示した。既存の自動手法を精度とフレーム保持率で上回りつつ、リアルタイム級の計算効率を維持する。瞳孔形状のばらつきや遮蔽、反射、撮像アーチファクトに頑健な学習済みキーポイント表現によるもので、マウス神経科学からヒトへの橋渡しとなる再現可能な基盤を提供する。","timestamp":1793491200000,"title":"Pupil-DLC: An open-source deep learning pipeline for scalable, marker-less tracking of pupil dynamics across conscious and unconscious states.","titleJa":"Pupil-DLC――意識状態と無意識状態を横断する瞳孔動態のスケーラブルなマーカー不要トラッキング","url":"https://pubmed.ncbi.nlm.nih.gov/42401399/"},{"authors":["Praachi Tiwari","Bryan W Jenkins","Catherine F Moore","Hudson Zhou","Tylaah George","David B Yaden","Elise M Weerts"],"categories":["psilocybin","spontaneous behavior","head-twitch response","dose-response"],"field":"Journal of Psychopharmacology","genre":"Psychedelics / Therapy","monthKey":"2026-11","publishedAt":"2026-11-01T00:00:00Z","source":"PubMed","summaryHtml":"サイケデリック薬はさまざまな神経精神疾患の治療薬として期待されているが、動物モデルにおける自発行動への影響は、これまで広く研究されてきたヘッドトゥイッチ反応（HTR）を除くと体系的に調べられてこなかった。本研究は、雌雄のラットにシロシビン（0.5、1、1.5 mg/kg）または生理食塩水を投与し、行動をビデオで記録して分析した。<br><br>HTRとウェットドッグシェイクに加え、不動、立ち上がり、グルーミング、嗅ぎ・掘り、旋回の5つの自発行動も評価した。各行動は用量反応プロファイルが異なり、HTRはベル型の曲線を示す一方、不動は用量とともに直線的に増加した。立ち上がりとグルーミングは低用量でも顕著に減少し、嗅ぎ・掘りは高用量でのみ減少、旋回は用量と性別で変動した。<br><br>行動間の相関も用量依存的に変化した。結果は、シロシビンの影響がHTRにとどまらず幅広い自発行動に及ぶことを示し、生理学的に妥当な用量範囲での神経行動学的効果を特定する枠組みを提供する。動物実験におけるサイケデリック作用の評価を広げる研究である。","timestamp":1793491200000,"title":"Beyond head-twitch response: Acute psilocybin affects spontaneous behaviors in rats in a dose-dependent manner.","titleJa":"ヘッドトゥイッチ反応を超えて――急性シロシビンがラットの自発行動に与える用量依存的影響","url":"https://pubmed.ncbi.nlm.nih.gov/42639976/"},{"authors":["A E Ostrand","M M Nour","C Timmermann","A Rosati","L X Luan","A Gomez-Emilsson","J Bornemann","K T Greenway","L Roseman","Carhart-Harris R"],"categories":["psychedelic","phenomenology","psilocybin","ketamine","MDMA"],"field":"Journal of Psychopharmacology","genre":"Psychedelics / Therapy","monthKey":"2026-11","publishedAt":"2026-11-01T00:00:00Z","source":"PubMed","summaryHtml":"「サイケデリック」という言葉は1956年、ハンフリー・オズモンドが「魂（psyche）」と「顕現させる（delic）」を組み合わせて造語した。語源は「魂を照らし出す」状態を指すが、それが単なる主観状態の名なのか、そうした作用を主作用とする薬物の分類名なのかは曖昧なままだった。本研究は現象学を出発点に、「サイケデリック」というカテゴリーを経験の側から定義し直すことを試みた。<br><br>著者らは200人以上の参加者に、シロシビン、ケタミン、MDMAの3薬物について、デルファイ法で作成した主観評価項目への回答を求めた。因子分析の結果、主観体験は3〜4つのほぼ独立した次元に分かれ、機械学習分類器は体験の特徴だけからどの薬物かを正確に予測できた。3薬物の主観プロファイルは明確に異なり、シロシビンは幻視と心理的洞察、ケタミンは解離、MDMAは向社会的で愛情に満ちた感情によって特徴づけられた。<br><br>結論として、シロシビンは典型的なサイケデリックであり、「サイケデリック」とはサイケデリック状態を引き起こす薬物のカテゴリーとして定義できるという。核となる現象は、幻視と心理的洞察を特徴とする主観状態である。薬物の分類を主観体験に基づいて整理し直すことで、サイケデリック研究の概念的な土台を明確にした研究である。","timestamp":1793491200000,"title":"Defining 'psychedelic'.","titleJa":"「サイケデリック」を定義する――幻視と心理的洞察を核とする主観状態","url":"https://pubmed.ncbi.nlm.nih.gov/42605589/"},{"authors":["Robert F Dougherty","Nadav Liam Modlin","Niall M McGowan","Patrick Staples","Ella Williams","Patrick Clarke","Mario Shafiei","Carly Leininger","Merve Alti","Megan Croal","Lindsey Marwood","Namik Kirlić","Gregory A Ryslik","Guy M Goodwin"],"categories":["psychedelic","psilocybin","PTSD","psychotherapy"],"field":"Journal of Psychopharmacology","genre":"Psychedelics / Therapy","monthKey":"2026-11","publishedAt":"2026-11-01T00:00:00Z","source":"PubMed","summaryHtml":"シロシビンは、モニタリングと支援を伴う投与によって複数の精神疾患に有望性を示してきた。しかし、サイケデリック試験における参加者支援の役割やその性質については議論が続いている。本研究は、Compass社の試験における投与セッションのモニタリングと支援の構造を、音声記録の分析から明らかにすることを試みた。<br><br>外傷後ストレス障害（PTSD）の参加者22人を対象とした12週間の臨床試験で、25mgのCOMP360シロシビン投与セッション中の参加者と支援者の発話速度（分あたり語数）を測定し、投与後のインタビューをテーマ分析した。投与セッションでは発話はまれで、平均で78%の時間が沈黙で占められたのに対し、準備セッションやフォローアップでは25〜30%にとどまった。支援は最小限でありながら体験上は際立っており、自律性が促され、変性意識状態における支援の中心は安心感の付与と承認だった。<br><br>言葉のやり取りが乏しいことは、Compassの投与セッションにおける支援が、多くの従来型心理療法やMDMA支援療法、サイケデリックを用いる精神分析的な治療パラダイムとは区別できることを示唆している。サイケデリック治療における「支援」の実態を定量的に記録した研究である。","timestamp":1793491200000,"title":"Silence is golden: Documenting the speech production of participants and support providers in psilocybin administration sessions for the treatment of post-traumatic stress disorder.","titleJa":"沈黙は金なり――PTSD治療におけるシロシビン投与セッションの発話記録","url":"https://pubmed.ncbi.nlm.nih.gov/42460632/"},{"authors":["Rebecca Ehrenkranz","Nathan D Sepeda","Sean P Goldy","Brandon M Weiss","Praachi Tiwari","Arozo Azimi","David B Yaden"],"categories":["psychedelic","questionnaire","psychometrics"],"field":"Journal of Psychopharmacology","genre":"Psychedelics / Therapy","monthKey":"2026-11","publishedAt":"2026-11-01T00:00:00Z","source":"PubMed","summaryHtml":"持続効果質問票（PEQ）は、サイケデリックなどの体験がもたらす肯定的・否定的な持続効果を自己報告で測る尺度で、多くの研究で使われてきた。しかし正式な妥当性検証は行われておらず、140項目以上に単項目も加わるため回答者の負担が大きいという課題があった。本研究はPEQの統計的・質的な妥当性検証を行い、検証済みの短縮版（PEQ-SF）を作成することを目指した。<br><br>検証では、探索的因子分析による次元削減、収束的・弁別的妥当性の検討、別サンプルでの確認的因子分析、項目の理解しやすさを確認する質的な回答過程評価、そして臨床試験と健常者試験の2件の投与研究における原版と短縮版の比較を行った。その結果、原版の因子構造は定量的には支持されず、全体的な肯定的因子と否定的因子からなる2因子構造が明らかになった。<br><br>この2因子構造は、肯定的・否定的各1因子の計14項目に、ウェルビーイングと意味に関する原版の単項目3つを加えた短縮版でも維持された。原版には十分な妥当性がなかった一方、短縮版は強い心理測定的特性を示し、投与研究でも原版と同様に機能した。サイケデリック研究の測定負担を軽くする実用的な成果である。","timestamp":1793491200000,"title":"Validating and creating a short-form of the persisting effects questionnaire: A measure of positive and negative outcomes from psychedelic experiences.","titleJa":"持続効果質問票の短縮版を検証する――サイケデリック体験の肯定的・否定的な持続効果を測る尺度","url":"https://pubmed.ncbi.nlm.nih.gov/42755297/"},{"authors":["Kevin H. Yang","Boris D. Heifets","Andrew Krystal","Josh D. Woolley"],"categories":[],"field":"JAMA Psychiatry","genre":"Psychedelics / Trauma","monthKey":"2026-11","publishedAt":"2026-11-01T00:00:00Z","source":"Crossref","summaryHtml":"サイケデリクス試験には特有の盲検化の問題がある。薬理作用がはっきりと感じられるため、参加者も実施者も自分が実薬群かプラセボ群かを推測できてしまい、盲検が崩れて期待効果や報告の偏りが結果に混ざり、薬効の評価が歪むおそれがある。本論考は、このマスキングの問題に対処するため、より積極的な盲検化の戦略が必要だと主張する。<br><br>著者らが提案するのはUMBRAA（識別不能な多剤盲検化と、承認された範囲での気づきの低減）という戦略である。実薬の体験が強ければ強いほど割付の推測は容易になり盲検の維持は難しくなるため、複数の薬剤を組み合わせることで、参加者が自分がどの群に割り付けられたかを特定できないようにし、効果への気づきを抑える。盲検を単なる手続きではなく、試験の信頼性を左右する設計上の課題として正面から扱う提案だ。<br><br>サイケデリクス治療の有効性を正しく評価するには、盲検の質を高める工夫が欠かせない。UMBRAAはそのための具体的な方針を示すものであり、盲検性の評価と報告の慣行とあわせて、今後の試験デザインの標準的な選択肢になるかどうかが焦点になる。出典：Crossref","timestamp":1793491200000,"title":"The Case for More Aggressive Masking in Psychedelic Trials","titleJa":"サイケデリクス試験ではもっと積極的なマスキングを――UMBRAA戦略の提案","url":"https://doi.org/10.1001/jamapsychiatry.2026.2858"},{"authors":["Davis OM","Tippett LJ","Addis DR"],"categories":[],"field":"Philosophical Transactions of the Royal Society B: Biological Sciences","genre":"Consciousness / Philosophy","monthKey":"2026-11","publishedAt":"2026-11-01T00:00:00Z","source":"Europe PMC","summaryHtml":"時間を超えて自分が同じ自分であり続ける感覚は、誰もが持つ普遍的な経験である。エピソード的な自伝的記憶がその一端を担うことは知られているが、記憶障害のある人でもこの連続性の感覚が保たれることがあり、記憶以外の仕組みが関わっているはずだ。本論文は、PsycINFO・PubMed・Web of Scienceの3データベースから153件の文献を系統的に検索し、記憶以外の候補プロセスを批判的に検討した。<br><br>検討の結果、内受容感覚、身体化、時間性、安定した人生の軌跡、ノスタルジアといった複数のプロセスが、異なる時間スケールにわたって統合され、現象学的連続性を支えていることが示された。さらに加齢、社会文化的要因、物語化のプロセスも、連続性の顕著さや表れ方に間接的に影響する。記憶と並ぶ多様な恒常性の源が、自己の連続感を形作っている。<br><br>これらの知見は自己連続性の既存モデルを拡張し、記憶とともに現象学的連続性を支えるプロセスの包括的な見取り図を与える。本論文は王立協会の討論集会号「From being to identity」に収録されたもので、自己のあり方をめぐる議論に実証的な土台を提供する。<br><br>出典： Europe PMC","timestamp":1793491200000,"title":"Towards a comprehensive understanding of the processes underlying phenomenological continuity.","titleJa":"自分は自分であり続ける感覚はどこから来るのか――現象学的連続性の仕組み","url":"https://doi.org/10.1098/rstb.2025.0162"},{"authors":["Manneschi L","Jimenez-Rodriguez A","Camilleri D","Prescott TJ"],"categories":[],"field":"Philosophical Transactions of the Royal Society B: Biological Sciences","genre":"Consciousness / Philosophy","monthKey":"2026-11","publishedAt":"2026-11-01T00:00:00Z","source":"Europe PMC","summaryHtml":"自己の感覚は人間の発達のなかでどのように生まれるのか、そして人工システムは適切な身体と経験があれば同じような感覚を獲得できるのか。本研究は、発達心理学と神経生物学に着想を得た機械学習の枠組みで、自己と世界の区別と最小限の自己モデルを獲得する過程を提案した。相関ベースの手法と予測的手法を層状アーキテクチャに統合し、段階的に組み上げる点が特徴である。<br><br>シミュレーション上のヒューマノイドを用い、まず乳児のモーターバブリングのような動きのなかで、固有受容感覚と視覚の依存関係から自分の身体と周囲を区別する自己―世界区別が、相関ベースの自己教師あり学習で生まれることを示した。次に、その区別を入力として神経常微分方程式モデルが感覚信号の時間発展を予測する仕組みを構築した。下層がすでに備わっていると上層の予測学習が速く進み、段階的な足場かけが確認された。<br><br>自己の感覚を一挙に与えるのではなく、下層の区別が上層の予測を支えるという発達的な積み重ねで説明した点が本研究の要点である。最小限のロボット的自己を特徴づける枠組みは、人間の心や脳における自己感覚の出現を理解する手がかりにもなる。出典：Europe PMC","timestamp":1793491200000,"title":"Scaffolded acquisition of a robot self-world distinction in a layered architecture model of the developing self.","titleJa":"ロボットにおける自己―世界区別の段階的獲得――発達する自己の層状アーキテクチャモデル","url":"https://doi.org/10.1098/rstb.2025.0153"},{"authors":["Savage H","Felsenheimer AK","Smekal V","Garfinkel SN"],"categories":[],"field":"Philosophical Transactions of the Royal Society B: Biological Sciences","genre":"Consciousness / Philosophy","monthKey":"2026-11","publishedAt":"2026-11-01T00:00:00Z","source":"Europe PMC","summaryHtml":"内受容感覚は、身体の状態と認知・感情のプロセスを無意識と意識の両領域で結びつけ、一貫した自己感覚の基盤となる。これまでの研究は内受容の正確さや注意、自己信念に注目してきたが、本論文は、意識にのぼった身体感覚をどう解釈するかという高次の過程が、精神的健康との関係で十分に検討されてこなかったと指摘する。<br><br>著者らは、意識された身体感覚の解釈を構成する二つの高次プロセス――「内受容的帰属」と「評価」――からなる枠組みを提案した。注意・帰属・評価を調整する要因と、精神疾患との関連の証拠を整理したうえで、こうした過程は認知からアクセス可能であるため、既存の心理療法の重要な標的になると論じる。枠組みの中に心理療法的介入を位置づけ、内受容に基づく治療を高める可能性を示した。注意・帰属・評価の三つは互いに関わり合いながら働き、その相互作用が精神的健康を左右する接点になるとしている。<br><br>身体感覚そのものではなく、その意味づけに焦点を当てた点が本論文の特徴である。内受容の解釈過程を標的とすることで、精神的健康への介入に新たな視点を与える枠組みの提案である。出典：Europe PMC","timestamp":1793491200000,"title":"Making sense of sensation: a framework of interoceptive attribution and appraisal with clinical applications.","titleJa":"感覚を意味づける――内受容感覚の帰属と評価の枠組みと臨床応用","url":"https://doi.org/10.1098/rstb.2025.0161"}],"updatedAt":"2026-11-12T16:09:10Z","version":1};

        if(kw&& !hay.includes(kw)) return false; return true;
      });
      rows = rows.slice().sort((a,b)=> sort==='oldest' ? a.timestamp-b.timestamp : sort==='title' ? a.titleJa.localeCompare(b.titleJa,'ja') : b.timestamp-a.timestamp);
      const pageSize = parseInt(byId('pageSize').value, 10) || 0;
      const totalPages = pageSize ? Math.max(1, Math.ceil(rows.length / pageSize)) : 1;
      if (currentPage > totalPages) currentPage = totalPages;
      if (currentPage < 1) currentPage = 1;
      const pageRows = pageSize ? rows.slice((currentPage - 1) * pageSize, currentPage * pageSize) : rows;
      byId('pageInfo').textContent = rows.length ? `${currentPage} / ${totalPages} ページ` : '0 / 0 ページ';
      byId('prevPage').disabled = currentPage <= 1;
      byId('nextPage').disabled = currentPage >= totalPages;
      byId('meta').textContent = `更新: ${DATA.updatedAt || '-'} / 表示件数: ${rows.length}件`;
      byId('list').innerHTML = pageRows.map(a=>`
        <article>
          <div class="src">${esc(a.source)} / ${esc(a.publishedAt.slice(0,10))}</div>
          <h2 class="title">${esc(a.titleJa)}</h2>
          <div class="tags"><span class="tag">${esc(a.genre)}</span><span class="tag">${esc(a.field)}</span>${a.categories.slice(0,4).map(c=>`<span class=\"tag\">${esc(c)}</span>`).join('')}</div>
          <div class="summary">${a.summaryHtml}</div>
          <div class="box"><strong>ソース・引用元</strong><br>配信元：${esc(a.source)}<br>原題：${esc(a.title)}<br>著者：${esc(a.authors.join(', '))}<br>原文URL：<a href="${esc(a.url)}" target="_blank" rel="noopener">${esc(a.url)}</a></div>
        </article>`).join('');
    }
    function resetAndRender(){ currentPage = 1; render(); }
    ['month','genre','field','sort','pageSize'].forEach(id=>byId(id).addEventListener('change',resetAndRender)); byId('keyword').addEventListener('input',resetAndRender);
    byId('prevPage').addEventListener('click',()=>{ if(currentPage>1){ currentPage--; render(); } });
    byId('nextPage').addEventListener('click',()=>{ currentPage++; render(); });
    render();
  </script>
</body>
</html>
