究である。", "timestamp": 1793811247000, "title": "Regularization vs. Convolution in Kernel-Based Hypothesis Testing", "titleJa": "正則化か畳み込みか――カーネル仮説検定における2つの最適性の接続", "url": "https://arxiv.org/abs/2611.06778"}, {"authors": ["Jiawei Zhang", "Rizhao Cai", "Dayan Guan"], "categories": ["cs.CV"], "field": "cs.CV", "genre": "Vision / Multimodal", "monthKey": "2026-11", "publishedAt": "2026-11-04T16:50:17Z", "source": "arXiv cs.CV", "summaryHtml": "細粒度の視覚推論は、都市管理におけるリモートセンシングに不可欠だが、マルチモーダル大規模言語モデル（MLLM）の評価では十分に探求されてこなかった。本論文は、無人航空機（UAV）画像から構築された、交通監視、都市建設、環境品質、災害警報といった複数の都市管理タスクのための細粒度都市リモートセンシングベンチマーク「UMBench」を提案する。<br><br>UMBenchでの評価は、現在のMLLMがしばしば場面レベルの事前知識に頼り、細粒度の視覚的証拠を見落とすことを明らかにした。<br><br>この問題に対処するため、著者らはさらに、訓練不要の方法でモデルに細粒度の視覚的証拠を精査させる、新しい証拠優先の思考連鎖（evidence-first chain-of-thought）手法を提案する。実験では、この手法がオープンソースと商用の双方のMLLMのUMBenchでの性能を改善できることが示された。「まず証拠を見る」推論の促しが、リモートセンシングでも効くことを示す研究である。", "timestamp": 1793811017000, "title": "Benchmarking Fine-Grained Visual Reasoning for Remote Sensing in Urban Management", "titleJa": "UMBench――都市管理のためのリモートセンシング細粒度視覚推論ベンチマーク", "url": "https://arxiv.org/abs/2611.06770"}, {"authors": ["Qiang Wang", "Jianxin Bi", "Shulong Jiang", "Ruiyang Si", "Wenbo Huang", "Kaiqi Chen", "Jiaxin Li", "Liyun Li", "Xuanyi Li", "Daquan Zhou"], "categories": ["cs.RO"], "field": "cs.RO", "genre": "Agents / Reasoning", "monthKey": "2026-11", "publishedAt": "2026-11-04T16:46:03Z", "source": "arXiv cs.RO", "summaryHtml": "GPT-6-Astraのようなモデルで駆動されるコーディングエージェントは、空間的推論と実行可能なロボット行動を結びつけ、そのようなエージェントが物理的な相互作用からロボット能力の持続的な改善をどう生み出せるかという問いを提起している。本研究は、「PyRUA-REAL」という枠組みを通じて、身体化された再帰的自己改善（RSI）を実世界の探索、コード洗練、配備の観点から研究する。<br><br>この枠組みでは、コーディングエージェントが相互作用の経験を、持続的な記憶と再利用可能な実行可能スキルとして保持し、その後の探索と改善に活かす。実証研究は物理的なマニピュレーションを改善過程の中心に置き、エージェント同士がどう協働するか、どんな実行フィードバックが効果的なコード洗練を支えるか、タスク仕様や以前に獲得したスキルが頑健性やタスク転移にどう影響するかを調べる。<br><br>さらに、得られたプログラムを人間の関与なしに配備した際の効率と能力も検証されている。シミュレーションではなく実世界で自己改善のループを回す試みであり、その成否の条件を探る研究である。", "timestamp": 1793810763000, "title": "PyRUA-REAL: Robot Exploration and Adaptive Learning through RSI in the Real World", "titleJa": "PyRUA-REAL――実世界での探索と適応学習によるロボットの再帰的自己改善", "url": "https://arxiv.org/abs/2611.06768"}, {"authors": ["Chijin Zhou", "Quan Zhang"], "categories": ["cs.SE"], "field": "cs.SE", "genre": "LLM / NLP", "monthKey": "2026-11", "publishedAt": "2026-11-04T16:42:53Z", "source": "arXiv cs.SE", "summaryHtml": "LLMエージェントはデータへアクセスし、ツールを呼び出し、ユーザの代わりに行動する。これらの行動を認可された範囲内に保つことは難しい。エージェントは自ら実行経路を選ぶ一方で、権限や運用条件は変化しうるからである。本論文は、エージェントのアクセス制御における最近の進展を、方針の仕様化と導出、アイデンティティと委任、行動とリソースの強制、情報フロー制御という4つの領域にわたって概観する。<br><br>著者らは各手法の制御対象、強制の境界、前提を比較し、個別の仕組みが何を達成し、どう協働できるかを検討する。その分析を踏まえて、認可について4つの側面を考え直す。計画の選択が権限の要求を形作ること、文脈情報はそれ自体が権限を与えなくても意思決定に資すること、制限はシステムのインターフェースを越えても意味を保たなければならないこと、ワークフローの進化に合わせて認可を再評価しなければならないことである。<br><br>これらの洞察が、未解決の課題群を動機づける。エージェントの権限管理を「一度与えて終わり」ではなく、実行に寄り添う継続的な営みとして設計し直すサーベイである。", "timestamp": 1793810573000, "title": "Rethinking Access Control for AI Agents: Recent Advances and Open Challenges", "titleJa": "AIエージェントのアクセス制御を考え直す――最近の進展と未解決の課題", "url": "https://arxiv.org/abs/2611.06764"}, {"authors": ["Shubhabrata Mukherjee", "Jeffrey Donatelli", "Daniela Ushizima"], "categories": ["cs.CV", "cs.AI"], "field": "cs.CV", "genre": "Vision / Multimodal", "monthKey": "2026-11", "publishedAt": "2026-11-04T16:39:17Z", "source": "arXiv cs.CV", "summaryHtml": "科学的な画像分析ワークフローでは、エージェントは説明、検出、計数、セグメンテーションなど多様な能力の中から選ぶ必要がある。現在のマルチツールアーキテクチャは、意図の解釈と視覚的実行を混同しており、失敗が推論の欠陥（誤った経路選択）によるのか、知覚の失敗（無効なツール実行）によるのかを覆い隠している。この監査可能性の欠如が、高リスクの科学自動化におけるエージェントの信頼性を損なっている。<br><br>本論文は、ルーティング方針と行動実行の分離を実装した拡張可能なアーキテクチャ「ZETA」を提案する。ZETAは専門的な視覚ツールを呼び出す前に科学的意図を解決し、計測を、生成的出力ではなく明示的な幾何に基づく決定的な操作として扱う。<br><br>このアーキテクチャはエージェントの意思決定という「ブラックボックス」を露わにし、経路選択の正しさと下流の実行を独立した失敗モードとして評価できるようにする。科学用途のエージェントに求められる説明可能性への、設計面からの回答である。", "timestamp": 1793810357000, "title": "Route First, See Later: Enabling Vision Agents to Reason Scientifically by Separating Routing Policy from Action Spaces", "titleJa": "まず経路を決め、見るのは後――ルーティング方針と行動空間を分けて視覚エージェントに科学的推論を", "url": "https://arxiv.org/abs/2611.06760"}, {"authors": ["Gilad Karpel", "Itay Evron", "Ron Meir", "Daniel Soudry"], "categories": ["cs.LG"], "field": "cs.LG", "genre": "Ethics / Safety", "monthKey": "2026-11", "publishedAt": "2026-11-04T16:38:46Z", "source": "arXiv cs.LG", "summaryHtml": "本研究は、高次元の統計設定における、線形予測器による継続学習のためのロジスティック回帰を調べる。既存の理論研究は、解析的な単純さとニューラルネットのカーネルレジームとの接続を動機として、L2正則化の変種を用いた継続線形回帰にほぼ集中してきた。<br><br>著者らはまず、継続線形分類に対する最適なL2正則化強度を導出し、その汎化性能を特徴づける。継続線形回帰についての先行結果と類似した振る舞いが回復される。次に、最小の2層対角線形ネットワークを用いて、より深いモデルにおけるL2正則化の効果を調べる。単一タスク設定では、このようなモデルの重みへのL2正則化は予測器のスパース性を促進し、カーネルレジームを超えた豊かなスパース特徴学習のレジームを生むことが知られている（2層ReLUネットでも同様の効果がある）。しかし継続学習では事情が異なりうる。<br><br>継続学習の文脈でスパース性バイアスがどう働くか――過去タスクの保持と新タスクの学習の緊張の中で――を理論的に掘り下げる研究である。", "timestamp": 1793810326000, "title": "Continual Classification Beyond the Kernel Regime: Harnessing the Sparsity Bias of L2 Regularization in Diagonal Linear Networks", "titleJa": "カーネルレジームを超えた継続分類――対角線形ネットにおけるL2正則化のスパース性バイアス", "url": "https://arxiv.org/abs/2611.06759"}, {"authors": ["Yequan Bie", "Dengyang Jiang", "Zhixuan Chen", "Xiaozhuan Liang", "Haoxuan Che", "Quande Liu", "Xi Chen", "Hao Chen"], "categories": ["cs.CV", "cs.AI"], "field": "cs.CV", "genre": "Vision / Multimodal", "monthKey": "2026-11", "publishedAt": "2026-11-04T16:26:45Z", "source": "arXiv cs.CV", "summaryHtml": "生成ビデオモデルは視覚的な世界シミュレータとしてますます使われているが、その主たる強みは世界の進化の仕方についての推論ではなく、もっともらしいピクセルの描画にある。一貫した世界の進化には視覚的忠実度以上のものが必要である。出来事が起きたとき、モデルは世界の実体への帰結を推論し、その結果の状態を描画しなければならない。たとえば野獣が現れた後、モデルは野獣を描くだけでなく、近くの人が逃げるべきか、身を隠すべきか、戦うべきかを、実現した場面に基づいて推論すべきである。<br><br>既存の拡散ベースビデオモデルには、世界の状態を保持し、そのような出来事条件付きの帰結について推論する明示的な仕組みが欠けており、視覚的にはもっともらしくても振る舞いが静的だったり、因果的に不整合だったりする出力をしばしば生む。<br><br>この推論のギャップを具体的で測定可能なものにするため、著者らは新しい問題「視界外因果進化（Out-of-Sight Causal Evolution）」を提案する。モデルに、画面の外で起きた出来事の帰結まで含めて世界の進化を推論させる課題である。", "timestamp": 1793809605000, "title": "EvoWorld: Towards Out-of-Sight World Evolution in Generative Video Models", "titleJa": "EvoWorld――生成ビデオモデルにおける「視界の外」の世界進化へ", "url": "https://arxiv.org/abs/2611.06748"}, {"authors": ["Ruikang Li", "Zixuan Chen", "Jiarui Wu", "Mingde Yao", "Yiyuan Zhang", "Yujin Wang", "Hanming Deng", "Lewei Lu", "Tianfan Xue"], "categories": ["cs.CV", "cs.AI"], "field": "cs.CV", "genre": "Vision / Multimodal", "monthKey": "2026-11", "publishedAt": "2026-11-04T16:23:24Z", "source": "arXiv cs.CV", "summaryHtml": "単一ターンの編集性能が強くても、複数ターンの対話が信頼できるとは限らない。編集された出力が繰り返し再利用されるにつれ、小さな意図しない変化が蓄積し、深刻な視覚的ドリフトになりうる。この長期ドリフトは通常、複数ターンデータでの訓練やターン横断のロールアウトで緩和されるが、それは事前学習の事前分布を変えてしまう可能性がある。あるいは基盤モデルへの拡張が難しい、推論時に特化した仕組みで対処されてきた。<br><br>本論文は、最終段階の訓練フレームワーク「TailSteer」を提案する。複数ターンの頑健性を高めながら、それまでの訓練で獲得した生成・編集能力を保持する。<br><br>TailSteerの原理は単純である。初期のデノイジング動態はベースモデルに近づけて保ち、保存のための修正は、細かな逸脱を抑え込める軌道の尾部（テール）付近に集中させる。修正は、編集器自身のオンポリシーなデノイジング・ロールアウトから、変化していないソース内容を使って学習される。能力を壊さずにドリフトだけを抑える狙いの設計である。", "timestamp": 1793809404000, "title": "TailSteer: Trajectory-Tail Steering for Drift-Resistant Multi-turn Image Editing", "titleJa": "TailSteer――軌道の尾部を操舵して複数ターン画像編集のドリフトに抗う", "url": "https://arxiv.org/abs/2611.06741"}, {"authors": ["Zeno Nongmaithem", "Anushttha Srivastava", "Anshit Sinha", "Apoorv Sisodia", "Suman Chowdhury", "Prerana Mukherjee", "Rajesh P. Barnwal"], "categories": ["cs.CV", "cs.LG"], "field": "cs.CV", "genre": "Vision / Multimodal", "monthKey": "2026-11", "publishedAt": "2026-11-04T16:20:37Z", "source": "arXiv cs.CV", "summaryHtml": "シーングラフ予測（SGA）は、将来のビデオフレームにおける物体間の関係を予測する。連続時間のSGAモデルは主語―目的語の各ペアを独立したニューラルODEで進化させるため、実体を共有する関係同士は積分の間に互いに影響し合えず、同じペアについて「座っている」と「立っている」のような相互排他的な予測を何も妨げない。<br><br>本論文は「CoupledSGA」を提案する。関係同士を、ODEのベクトル場内にグラフ注意を持つ「関係相互作用グラフ」で結びつけ、相互排他的な述語の行列に基づく構造的一貫性損失（L_SC）を加える。<br><br>CoupledSGAの開発は、評価プロトコルの限界も明らかにした。制約付き（With-Constraint）評価は主語―目的語ペアごとにグループあたり1つの述語だけを保持するため、その R@K と mR@K は、L_SC が狙うグループ内の違反を捉えることができない。各グループの勝者述語が変わらない限り、これらの指標は不変であることが証明されている。評価指標そのものへの批判を含む研究である。", "timestamp": 1793809237000, "title": "Coupled Scene Graph Anticipation: When With-Constraint Recall Hides Structural Inconsistency", "titleJa": "結合シーングラフ予測――制約付き再現率が構造的不整合を隠すとき", "url": "https://arxiv.org/abs/2611.06738"}, {"authors": ["Abhiram Kothagundu", "Pheelip Pritipal Raipure", "Abhijit Chandrakant Patil", "Himangshu Sarma", "Christian Eichhorn", "David A. Plecher", "Johanna Pirker"], "categories": ["cs.HC", "cs.AI"], "field": "cs.HC", "genre": "LLM / NLP", "monthKey": "2026-11", "publishedAt": "2026-11-04T16:18:35Z", "source": "arXiv cs.HC", "summaryHtml": "高強度インターバルトレーニング（HIIT）をゲーム化するため、スクワットとパンチの組み合わせ、両腕のストライク、斜めのストレッチコンボなど、あらかじめ定義した11種のコンボ動作を用いるVRエクサゲームシステムを開発した。ウェアラブルなモーションキャプチャスーツやヘッドセット内蔵センサに頼る従来の追跡法と異なり、三脚に置いた標準的なスマートフォンのカメラで全身の動きを捉える。HIIT特有の速く動的な動きにも適した、費用対効果が高く拡張可能な方法である。<br><br>スマートフォンの映像は姿勢推定アルゴリズムでリアルタイムに処理され、抽出された生体力学データは、Anthropicのオープン標準であるModel Context Protocol（MCP）上に構築されたバックエンドサーバとGPT-4oによって分析される。フォームの正確さ、動きの効率、運動強度、けがのリスクについて、個人に合わせた評価を生成する。<br><br>18〜25歳の参加者20名による被験者内比較では、VR条件のほうが非VR条件より楽しさ（平均3.5対2.8、p=0.02）、没入・集中（3.2対2.8、p=0.03）、他者への推奨意向（3.2対2.7、p=0.04）で有意に高かった。継続の自信に差はなく、知覚される強度も同程度だった。MCPによる評価は専門家の評価と87.5%一致し（10セッション、認定トレーナー1名）、フィードバック手段としての信頼性が示された。", "timestamp": 1793809115000, "title": "Smartphone-Aided VR Exergames for HIIT: Gamifying Fitness with Real-Time Pose Estimation", "titleJa": "スマートフォン支援のVRエクサゲームでHIITをゲーム化する――リアルタイム姿勢推定", "url": "https://arxiv.org/abs/2611.06734"}, {"authors": ["Philipp Mondorf", "Adrien Deliège", "Solim LeGris", "Claas Beger", "Ryan Yi", "Barbara Plank", "Brenden M. Lake", "Todd M. Gureckis"], "categories": ["cs.AI", "cs.LG"], "field": "cs.AI", "genre": "Agents / Reasoning", "monthKey": "2026-11", "publishedAt": "2026-11-04T16:17:36Z", "source": "arXiv cs.AI", "summaryHtml": "大規模推論モデル（LRM）は難しいベンチマークで良い性能を示すが、概念的に関連した推論タスクにわたって汎化可能な抽象を形成しているかは不明である。抽象と推論コーパス（ARC）は抽象を研究するための制御された試験台であり、解題者は少数の例から2次元格子上の変換規則を推論しなければならない。ARCは個別タスク内の規則抽象を評価するが、異なるタスクでも、異なる変換を必要としながら高次の構造を共有することがある。たとえば複数のタスクが、他の物体の中に含まれた物体についての推論を含むような場合である。<br><br>ConceptARCのようなベンチマークは、ARC式のタスクを繰り返し現れる空間的・意味的概念ごとにグループ化してこの構造を捉えるが、概念あたり数件の手作りタスクしか含まないことが多い。<br><br>本論文は「ConceptARC at Scale」を提案する。特定の概念を狙ったARC式タスクを数千件規模で作る生成器であり、概念理解の研究をスケールさせるための基盤である。", "timestamp": 1793809056000, "title": "ConceptARC at Scale: Studying Conceptual Understanding in Reasoning Models", "titleJa": "ConceptARC at Scale――推論モデルの概念理解を大規模に研究する", "url": "https://arxiv.org/abs/2611.06732"}, {"authors": ["Jarrod Ragsdale", "Rajendra Boppana"], "categories": ["cs.LG", "cs.CL"], "field": "cs.LG", "genre": "LLM / NLP", "monthKey": "2026-11", "publishedAt": "2026-11-04T16:17:28Z", "source": "arXiv cs.LG", "summaryHtml": "小規模言語モデルは、提出されたコマンドを実行することなくシェルをシミュレーションする、コンパクトな基盤を提供する。しかし全出力のデコーディングでは、実行ごとに変わる内容と並んで、繰り返し現れるユーティリティの構造まで予測しなければならない。本論文は「テンプレートギャップ再構成（TGR）」を提案する。再利用可能な出力リテラルに番兵（センチネル）を散りばめたテンプレートを与え、自己回帰的に生成される「ギャップ」と交互に配置する手法である。<br><br>テンプレート選択器が再構成すべきテンプレートを選び、空のテンプレートは全出力デコーディングを保持する。著者らは、異種の実行環境にわたって収集した1,870万件の出力からテンプレートバンクを構築し、バンク構築から除外した対象環境で、テンプレート選択器と5つの再構成モデルを、各種の小規模言語モデルのチェックポイントから初期化して訓練した。<br><br>評価では、最適なテンプレートがカバーする範囲が広い条件で、TGRが出力編集類似度（O-ES）において全出力デコーディング（FOD）を上回ることが示された。定型と可変部分を分けることで、小さなモデルの生成を安定させる工夫である。", "timestamp": 1793809048000, "title": "Template Gap Reconstruction for Shell Output Simulation with Small Language Models", "titleJa": "テンプレートギャップ再構成――小規模言語モデルによるシェル出力シミュレーション", "url": "https://arxiv.org/abs/2611.06731"}, {"authors": ["Shuai Dong", "Kanghui Tian", "Linghan Chen", "Wenqi Shao", "Hongrui Wu", "Haowen Hou", "Yongfu Zhu", "Xuehui Wang", "Ziyue Wang", "Wenpu Liu", "Weichu Xie", "Yuqi Xu", "Congcong Wang", "Kaiwen Tuo", "Caoyuan Ma", "Taiqiang Wu", "Ji Zhao", "Wenzheng Chang", "Dianyi Wang", "Siyuan Wang", "Zhongyu Wei", "Yu Qiao", "Jiaqi Wang"], "categories": ["cs.CV", "cs.CL", "cs.LG"], "field": "cs.CV", "genre": "Vision / Multimodal", "monthKey": "2026-11", "publishedAt": "2026-11-04T16:16:27Z", "source": "arXiv cs.CV", "summaryHtml": "ストリーミングビデオ理解では、モデルは応答するか観察を続けるかを繰り返し判断しなければならない。近年、Group Relative Policy Optimization（GRPO）がこの設定に適用され、既存のアプローチは報酬設計を重視する一方で、全ターンに単一の軌跡レベルのアドバンテージを保持してきた。そのような共有クレジットは、初期の成功後の冗長な返答を強化したり、初期の失敗後の有用なフォローアップを抑制したりしうる。<br><br>本論文は、学習を個々のストリーミング判断に合わせるターン単位のGRPOフレームワーク「TurnWise」を提案する。TurnWiseは、軌跡レベルのフィードバックとターン単位の対話との不整合に対処し、情報のある応答を促して冗長性を減らす。<br><br>具体的には、ターン単位のクレジット割り当ては、無音で完結した接頭辞のスコアリングを使って、各判断の残りのリターンからグループ相対アドバンテージを構築し、その学習信号を以前の報酬から分離する。ターン平均の方策最適化も導入される。「いつ話すか」を学ぶエージェントのための信用割り当ての精緻化である。", "timestamp": 1793808987000, "title": "Turns Matter: Advancing Streaming Video RL via Turn-Level Credit", "titleJa": "ターンは重要だ――ターン単位のクレジットでストリーミングビデオ強化学習を進める", "url": "https://arxiv.org/abs/2611.06728"}, {"authors": ["Ji Pei"], "categories": ["cs.RO", "cs.AI", "cs.CV", "cs.LG"], "field": "cs.RO", "genre": "Vision / Multimodal", "monthKey": "2026-11", "publishedAt": "2026-11-04T16:13:29Z", "source": "arXiv cs.RO", "summaryHtml": "器用なロボットハンドは、大規模な人間データや基盤モデルとますます結びつけられているが、ハードウェア、表現学習、評価の進歩はばらばらに評価されることが多い。本調査は2024年1月から2026年11月初めまでの研究をレビューし、技術的系譜を確立するためにそれ以前の研究も含める。<br><br>文献は相互依存する5つの層に整理される。ハードウェア、データ収集とキュレーション、身体間（クロスエンボディメント）転移、学習と基盤モデル、そして評価と応用である。人間の手と物体の理解と、触覚センシングが、横断的な2つの視点を提供する。システムレベルのアーキテクチャ、比較表、5件のケース分析が、これらの層にわたる設計選択を結びつける。研究内の実験比較と、不均一なコーパス統計、ベンダ仕様、企業公表結果は区別して扱われる。<br><br>結論の一つは、人間データの価値は運動学的・視覚的な条件に依存することである。ハンドという部品ではなく、データから評価までの全スタックで設計を考える必要性を示すサーベイである。", "timestamp": 1793808809000, "title": "Dexterous Robotic Hands in the Foundation-Model Era: A Full-Stack Survey of Hardware, Data, Cross-Embodiment Transfer, Learning, and Evaluation", "titleJa": "基盤モデル時代の器用なロボットハンド――ハードウェア・データ・身体間転移・学習・評価の全スタック調査", "url": "https://arxiv.org/abs/2611.06724"}, {"authors": ["Naima Elosegui Borras", "Georgios Arvanitidis"], "categories": ["cs.LG"], "field": "cs.LG", "genre": "Scientific AI", "monthKey": "2026-11", "publishedAt": "2026-11-04T16:11:59Z", "source": "arXiv cs.LG", "summaryHtml": "ニューラルネットの連続対称性は、線形ネットやReLUネットにおける層のバランス性のように、勾配フローのもとで不変な保存量を生む。有限ステップの勾配降下はこれらの法則を保つとは限らない。とりわけ「安定性の縁（EOS）」では、反復はより滑らかな軌道の周りで振動し、その軌道は中心フロー力学（Cohen et al., 2025）で記述できる。本研究は、勾配フローの保存法則がこのレジームの中心フロー記述のもとでどう進化するかを調べる。<br><br>著者らは、曲率の補正が、臨界パラメータ方向に沿った振動の共分散によって決まる有限次元のドリフトを誘発することを示す。<br><br>これにより、中心フロー力学に従ってEOSでどの保存法則が残り、どれが破れるかを分析する第一歩が踏み出される。分析対象は、スカラーの2層モデル、2層の行列分解、2層ReLUネットワークであり、既知の保存法則がどうなるかが検証される。最適化の幾何と対称性の関係を深める理論研究である。", "timestamp": 1793808719000, "title": "Symmetry Breaking at the Edge of Stability via Central Flow Analysis", "titleJa": "中心フロー解析による安定性の縁での対称性の破れ", "url": "https://arxiv.org/abs/2611.06718"}, {"authors": ["Zohreh Abbasi Liasi", "Batoul Hammoud", "Anas Madkoor", "Ehsaneddin Asgari"], "categories": ["cs.CL", "cs.AI"], "field": "cs.CL", "genre": "LLM / NLP", "monthKey": "2026-11", "publishedAt": "2026-11-04T16:11:26Z", "source": "arXiv cs.CL", "summaryHtml": "検索拡張生成（RAG）は、言語モデルが事前学習で記憶した連想に頼るのではなく、文脈に述べられた関係について推論できることを前提にしている。本研究は、事実を取得させるのではなくプロンプトに直接与えることで、この証拠条件付きの関係推論を分離して調べる。<br><br>「Rel-Bloom」は、30のWikidata関係から構築された450問の多肢選択式の、制御された多言語診断である。同じ源泉関係が、Bloomに着想を得た5段階（記憶・理解・応用・分析・評価）と、3つの真実性条件（事実的・反事実的・中立化）で具体化される。43モデル、6言語、2つの多言語設定（226,800件の予測）にわたる評価で、3つの知見が際立った。<br><br>第一に、評価したすべてのオープンウェイトモデル系列で、応用から分析への段階で精度が急落し、大規模Graniteバケットでは47.2ポイントに達したが、どちらのGeminiモデルでもそうはならなかった。「文脈に書いてある関係を、その場で推論に使う」能力の段差が、多言語で定量化された研究である。", "timestamp": 1793808686000, "title": "Reasoning over Non-Parametric Memory in Multilingual LLMs: A Cognitive-Based Analysis of Relational Knowledge", "titleJa": "多言語LLMにおける非パラメトリックメモリ上の推論――関係知識の認知的分析", "url": "https://arxiv.org/abs/2611.06715"}, {"authors": ["Giuliano Galadini", "Aurelio Uncini", "Danilo Comminiello"], "categories": ["cs.LG", "physics.comp-ph"], "field": "cs.LG", "genre": "Agents / Reasoning", "monthKey": "2026-11", "publishedAt": "2026-11-04T16:09:05Z", "source": "arXiv cs.LG", "summaryHtml": "フローマッチングをはじめとする深層生成モデルは、複雑な物理系を合成する強力な道具として台頭してきた。しかし標準的なアーキテクチャは純粋に統計駆動で、背後の支配方程式に無知なため、推論時に基本的な物理制約に違反しがちである。これらの制約を強制する既存のゼロショット手法は、硬い代数射影に頼ることが多い。疎な境界条件には有効だが、そのような離散的な幾何補正を密で全領域のPDEへ適用すると、確率の経路を乱し、学習された多様体から逸脱させ、大きな計算オーバーヘッドを招く可能性がある。<br><br>この課題に対し、本論文は「エネルギー誘導輸送」を提案する。非線形の物理制約を滑らかなポテンシャルエネルギーの景観として定式化する、訓練不要の新しい枠組みである。ODE積分を中断するのではなく、その流れにエネルギーの勾配を沿わせる発想である。<br><br>物理情報つき生成を、射影の硬さなしに実現する方向の研究であり、物理法則とデータ駆動生成の両立を狙う。", "timestamp": , {"authors": ["Tianwei Zhang", "Ivy Njoki Nyagwencha", "Zahraa Dirani", "Shalini Joshi", "Scott A. Hale"], "categories": ["cs.CL", "cs.AI", "cs.CY", "cs.LG"], "field": "cs.CL", "genre": "LLM / NLP", "monthKey": "2026-11", "publishedAt": "2026-11-04T16:06:15Z", "source": "arXiv cs.CL", "summaryHtml": "テクノロジーを介したジェンダーに基づく暴力（TFGBV）は、直接的・隠蔽的さまざまな形態を通じて、女性とジェンダー少数者に広く及ぶオンラインの危害である。ジェンダー化された危害の検出のための現在のモデルと注釈付きデータセットは、グローバルノースの言語のデータと、そこで訓練されたモデルに支配されている。<br><br>ヨルダン、フランス語圏西アフリカ、ケニアの市民社会組織（CSO）と協力し、著者らは、レバント・アラビア語、アフリカのフランス語、スワヒリ語における、文化的・言語的に関連したTFGBVの事例をクラウドソースする、コミュニティ主導のアプローチを開発した。クラウドソースされたデータをアクティブラーニングで注釈し、小さいながら性能の良いデータセット（N=3,022）「ALTO」を構築し、3言語でのTFGBV検出を改善した。<br><br>ベンチマークとファインチューニングの実験では、既存の有害コンテンツ検出モデルはALTO内でのTFGBVの再現率が低く、ファインチューニングで改善することが示された。モデルは隠蔽的な危害を見逃しがちであることも分かった。過小評価されてきた言語圏の危害検出に光を当てる研究である。", "timestamp": 1793808375000, "title": "ALTO: African and Levantine Tech-Facilitated Gender-Based Violence Corpus", "titleJa": "ALTO――アフリカとレバントにおけるテクノロジーを介したジェンダー暴力コーパス", "url": "https://arxiv.org/abs/2611.06706"}, {"authors": ["Xinglu Wang", "Edward Wang", "Yong Zhang", "Zhenan Fan"], "categories": ["cs.LG"], "field": "cs.LG", "genre": "Vision / Multimodal", "monthKey": "2026-11", "publishedAt": "2026-11-04T16:04:57Z", "source": "arXiv cs.LG", "summaryHtml": "上下左右だけの行動でパックマンをプレイするようエージェントを訓練すると、基本的な問いが生じる。性能が悪いとき、何を改善すべきか。難しさは、画面を読むことから来るのか、長い系列にわたる行動選択から来るのか。本研究は、Qwen3.5-9Bベースのエージェントについて、独立した知覚チェックと、原始方策の強化学習研究を通じてこれらの問題を調べる。<br><br>テキスト化した盤面を使い、画像の転記を意思決定インターフェースから取り除いた方策研究では、8つの保留迷路でのクリア率は、この最適化の前の0%から、選ばれたチェックポイントで80.2%（残機3つ追加）まで上がった。知覚チェックは、正確な静止スクリーンショットの読み取りが、対話中の誤りと共存しうることを示す。<br><br>別の方策比較では、さらなる最適化がより悪い行動選択を伴うことも示された。これらの知見は、訓練後の具体的なチェックを動機づける。知覚は使用中の状態で評価すること、そして失敗の所在を切り分けることが、エージェント改善の前提になるという診断の研究である。", "timestamp": 1793808297000, "title": "Where It Breaks: Diagnosing Perception, Memory, and Decision Failures of a Vision-Language Agent in Pac-Man", "titleJa": "どこで壊れるか――パックマンで視覚言語エージェントの知覚・記憶・意思決定の失敗を診断する", "url": "https://arxiv.org/abs/2611.06704"}, {"authors": ["Pranay Samineni", "Adam Thorpe", "John Chubick", "Anand Balakrishnan", "Christian Ellis", "Swarat Chaudhuri", "Ufuk Topcu"], "categories": ["cs.RO", "eess.SY"], "field": "cs.RO", "genre": "Robotics", "monthKey": "2026-11", "publishedAt": "2026-11-04T16:02:59Z", "source": "arXiv cs.RO", "summaryHtml": "異種の空地チームは、地上車両のセンサの限られた範囲と視点を、空からのセンシングで補うことができる。しかし、UGV（無人地上車）が支援を必要とするのはいつか、UAV（無人航空機）がどんな情報を集めるべきかを決めることは課題として残る。本論文は、プランナ条件付きの空地支援手法を提示する。地図情報の不確実性がUGVの現在のMPPIロールアウトへどう影響するかを評価する手法である。<br><br>航法が劣化したままであれば、解決済みの地図仮説のもとで同じロールアウトを採点し、最も有用な改善をもたらす地図レイヤーを選び、対応する空からの計測を要求し、返ってきた情報を融合して再計画する。固定した支援役割やタスク構造、不確実性そのものに駆動される手法と異なり、本手法は、不確実性の解消が予測される地上航法を改善するかどうかに支援を条件づける。<br><br>3つのオフロード路線での180回のシミュレーション試行で、本手法は98.9%の目標到達を達成しながら、UAVの平均飛行時間を削減した。「必要なときだけ呼ぶ」支援の設計である。", "timestamp": 1793808179000, "title": "When to Ask for Help: Uncertainty-Triggered Aerial Refinement for Off-Road Navigation", "titleJa": "いつ助けを求めるか――不確実性で発動するオフロード航法の空中支援", "url": "https://arxiv.org/abs/2611.06702"}, {"authors": ["Sicheng Yang", "Rui Tang", "Haipeng Zhou", "Hongqiu Wang", "Zhaohu Xing", "Jianda Ma", "Lie Dai", "Guang Yang", "Lei Zhu"], "categories": ["cs.CV"], "field": "cs.CV", "genre": "Vision / Multimodal", "monthKey": "2026-11", "publishedAt": "2026-11-04T16:02:29Z", "source": "arXiv cs.CV", "summaryHtml": "病理学のための深層学習手法は、大規模なピクセルレベルの注釈の入手可能性の低さとコストの高さに制約されている。合成データはこの制限を緩和できるが、既存のパイプラインは信頼できる品質管理を欠くことが多く、下流の分析とのつながりも弱い。この問題に対し、本論文は、自動データスクリーニング、生成的表現学習、下流タスクへの効率的な適応を統合した3段階の枠組みを提案する。<br><br>第一に、病理エージェントシステムを開発して画像品質を評価しサンプルを選別し、公開TCGAリポジトリから選ばれた217,030件の病理パッチからなるデータセット「TCGA-200K」を得た。第二に、選別されたデータで生成モデルを訓練する。画像合成に加えて、そのバックボーンは下流タスクへ転移可能な構造的・意味的表現を学ぶ。<br><br>第三に、事前学習した生成バックボーンを、意味的セグメンテーションへ適応させる。データの質の管理から生成、実タスクへの転移までを一つの流れにまとめた、医療画像AIの実践的なパイプライン研究である。", "timestamp": 1793808149000, "title": "Agent-Driven Generative Priors for Pathology Image Synthesis and Segmentation", "titleJa": "エージェント駆動の生成事前知識による病理画像の合成とセグメンテーション", "url": "https://arxiv.org/abs/2611.06701"}, {"authors": ["Zhenyi Shen", "Junru Lu", "Wei Liu", "Jiangnan Ye", "Jiazheng Li", "Di Yin", "Xing Sun", "Tameem Adel", "Yali Du", "Lin Gui", "Yulan He"], "categories": ["cs.CL"], "field": "cs.CL", "genre": "LLM / NLP", "monthKey": "2026-11", "publishedAt": "2026-11-04T13:33:47Z", "source": "Hugging Face Papers", "summaryHtml": "言語モデル間の潜在的なコミュニケーションの一形態であるPrefill-to-Autoregressive Cross-model Transfer（PACT）は、大きなモデルのプロンプト表現と小さなモデルの効率的な生成を組み合わせ、能力と推論コストのバランスを取る有望な方法である。しかし既存のシステムは、大小のモデルの協調を独立に評価する仕組みが乏しく、タスク性能の向上だけでは、受け手が送り手の情報を本当に活用したのかは分からない。<br><br>本研究は、凍結したモデル同士を軽量なゼロ初期化の線形ブリッジでつなぎ、タスク報酬で直接訓練するオープンソースのPACTフレームワーク「PLatour」を提案する。ハイブリッド注意アーキテクチャにも対応する。PLatourは生成タスクでオープンソースのベースラインを大きく上回り、数学とコーディングの共有ベンチマークでは、より小さな送り手を用いながらMostikの報告結果を上回った。<br><br>一方で統制実験では、一部のタスクの改善が、無情報な送り手信号や自己コミュニケーション、受け手だけの訓練でも再現できることが示された。訓練可能なブリッジは、送り手の情報を活用せずにパラメータ効率的な適応として働きうる。そこで本研究は、訓練済みPACTシステムの改善のうちどれだけが真にコミュニケーションに由来するかを定量化する「PACT-Check」を提案し、PACTシステムの可能性と課題を論じる。", "timestamp": 1793799227000, "title": "On the Opportunities and Challenges of Prefill-to-Autoregressive Cross-Model Transfer", "titleJa": "大小モデル間の潜在コミュニケーションPACT――性能向上は本当に情報伝達によるものか", "url": "https://arxiv.org/abs/2611.06976"}, {"authors": ["Yuetong Liu", "Zhehao Zhou", "Yitong Zhang", "Haorui Chen", "Jia Li"], "categories": ["cs.AI"], "field": "cs.AI", "genre": "Agents / Reasoning", "monthKey": "2026-11", "publishedAt": "2026-11-04T13:32:36Z", "source": "Hugging Face Papers", "summaryHtml": "LLMエージェントは通常、ツールの出力をそのままテキストとして文脈に追加する。複数ステップのやり取りでは、長くノイズの多い観測が文脈を圧迫し、課題に関連する情報への注意を薄めてしまう。既存のトークン削減や要約の手法は、離散的なテキスト表現に縛られ、圧縮率にも限界があった。本研究は、エージェントがツールの観測を必ずしも明示的なテキストトークンとして消費する必要はない、という前提に疑問を投げかける。<br><br>著者らは、ツールの観測を潜在トークンに圧縮し、エージェントの入力埋め込み空間に組み込む連続潜在文脈圧縮モデル「Coca-Cola」を提案する。さらに、完全な観測と圧縮した観測の下での次の行動の分布を一致させる「行動保持訓練」を導入し、意思決定に必要な情報を保つ行動十分な潜在トークンを学習させる。<br><br>ウェブ検索エージェントを用いた4つのQAベンチマークと2つのモデル系列での実験では、トークン消費量が70.01〜89.24％、エンドツーエンドの実行時間が24.45〜55.97％削減され、課題性能は一貫して向上した。テキストに頼らず潜在空間で文脈を扱うことが、エージェントの効率と性能の両方を高める道であることを示す研究である。", "timestamp": 1793799156000, "title": "Tools Need Not Speak in Text: Latent Context Compression for Agents", "titleJa": "ツールはテキストで語る必要はない――エージェントのための潜在文脈圧縮", "url": "https://arxiv.org/abs/2611.06500"}, {"authors": ["Kejian Zhu", "Zhuoran Jin", "Shangqing Tu", "Tianyi Men", "Yupu Hao", "Jiachun Li", "Kang Liu", "Jun Zhao"], "categories": ["cs.LG", "cs.CL"], "field": "cs.LG", "genre": "Agents / Reasoning", "monthKey": "2026-11", "publishedAt": "2026-11-04T08:24:54Z", "source": "Hugging Face Papers", "summaryHtml": "マルチターンのエージェント強化学習は長期的なタスクで優れた性能を示すが、その効果は対話の制約条件に大きく左右される。本論文は、サンプリングの幅Kと対話の深さTを変えた評価指標Pass@(K,T)により、軌跡レベルの強化学習の優位性が十分なターン数の予算に依存し、予算が厳しくなると大幅に低下することを示した。<br><br>また、エージェント強化学習は一段階の意思決定の質を一様に高めるわけではない。その強みはむしろ、誤りからの回復や長期的な粘り強さに集中していることが明らかになった。展開時の予算依存によるリスクを抑えるため、論文ではプロセス監督シグナルの利点と限界を予備的に論じ、学習中に相互作用の予算を変化させるBudgetMix RLを提案している。<br><br>実験の結果、BudgetMix RLは多様な実行条件のもとで頑健な性能を達成し、学習時と展開時でターンの予算が異なる場合でも性能が崩れにくい点が確認された。エージェント強化学習の効果を「何が改善され、何が改善されないか」という観点から切り分けた、実務的にも示唆に富む検証である。", "timestamp": 1793780694000, "title": "What Does Multi-Turn Reinforcement Learning Really Improve in LLM Agents?", "titleJa": "マルチターン強化学習はLLMエージェントの何を本当に改善するのか", "url": "https://arxiv.org/abs/2611.06483"}, {"authors": ["Lindsay P Cameron", "Matthew W Johnson", "Kevin S Murnane", "Mark M Rasenick", "Charles D Nichols"], "categories": ["psychedelics", "drug development", "review"], "field": "PubMed", "genre": "Psychedelics / Therapy", "monthKey": "2026-11", "publishedAt": "2026-11-04T00:00:00Z", "source": "PubMed", "summaryHtml": "サイケデリック医療は、うつ病や不安、心的外傷後ストレス障害（PTSD）など、さまざまな神経精神疾患の治療として急速に注目を集めている。これまで治療が難しいとされてきた症状に対しても新たな選択肢として期待が高まり、研究と臨床応用の両面で広がりを見せている。新しいサイケデリック類縁体や投与レジメンが次々に登場し、検証すべき変数の数も増え続けている。本総説は、次世代のサイケデリック治療を開発するうえでの多様なアプローチと留意点を整理する。<br><br>現在の評価法やモデルの長所と短所を検討し、どのような試験系が新しい化合物や投与法の評価に適しているかを論じる。類縁体や投与レジメンが増えるなかで、どの変数をどう検証すべきか、開発の現場で直面する判断材料を提示する。既存の評価法では捉えきれない側面や、モデルごとの適用範囲の違いにも触れ、開発の進め方を多角的に検討する。<br><br>最後に、次世代のサイケデリック医薬品開発に向けた指針と考慮事項を示す。安全性と有効性の両立をどう評価し、臨床応用へどうつなげるか。サイケデリック医療の広がりを受けて、開発の枠組みそのものを整えるための展望をまとめた総説である。", "timestamp": 1793750400000, "title": "Next-Generation Psychedelic Drug Development", "titleJa": "次世代サイケデリック医薬品の開発――新たな治療法づくりへの指針", "url": "https://pubmed.ncbi.nlm.nih.gov/42980080/"}, {"authors": ["Athanasios Pitis", "Maria Nikoloudi", "Nikos Stefanis", "Kyriaki Mystakidou"], "categories": ["psychedelics", "systematic review"], "field": "PubMed", "genre": "Psychedelics / Therapy", "monthKey": "2026-11", "publishedAt": "2026-11-03T00:00:00Z", "source": "PubMed", "summaryHtml": "シロシビン支援療法は、がんや生命を脅かす病気に伴う苦悩への有望な介入として再び注目されている。本統合的システマティックレビューはPRISMA指針に沿い、2025年8月10日から10月31日までにPubMed、Scopus、Google Scholar、CINAHLを検索し、6つの独立した臨床コホートから得られた11件の報告を対象に、がんのある成人における抑うつ、不安、実存的苦悩に対する安全性、有効性、治療的影響を評価した。<br><br>シロシビンは一般に、準備、投与、統合の構造化された枠組みのもとで、監督下の単回中〜高用量（25〜30mg/70kg）として投与された。すべての研究デザインを通じて、抑うつ、不安、実存的苦悩、死への恐怖の迅速かつ持続的な軽減がみられ、効果は2〜6か月、場合によっては4.5年まで続いた。質的知見では、感情の明晰さや受容、スピリチュアルな安寧、意味との再接続が際立った。11件中5件がMMATの基準を満たし、他では評価者の盲検化や代表性、交絡の統制などに課題が残った。<br><br>シロシビン関連の重篤な有害事象は報告されず、一時的な心血管系の変化や頭痛、吐き気、不安、短時間の精神病様症状がみられた。著者らは、がん関連の心理的・実存的苦悩に対する有望だがいまだ研究段階の緩和的介入だと結論づけている。", "timestamp": 1793664000000, "title": "Psilocybin-Assisted Therapy for Cancer-Related Psychological and Existential Distress in Adults with Cancer: An Integrative Systematic Review", "titleJa": "がんに伴う心理的・実存的苦悩に対するシロシビン支援療法――統合的システマティックレビュー", "url": "https://pubmed.ncbi.nlm.nih.gov/42975895/"}, {"authors": ["Hao Fei"], "categories": ["cs.CL"], "field": "cs.CL", "genre": "Agents / Reasoning", "monthKey": "2026-11", "publishedAt": "2026-11-03T00:00:00Z", "source": "Hugging Face Papers", "summaryHtml": "10年間、AIの進歩は機械が独力で何をできるかで測られてきた。基盤モデルはコードを書き、複数段階のタスクをこなし、パーソナルエージェントは人に代わって行動するようになった。それでも人は、かつて知っていたことを忘れ、目の前のものを見逃し、適切な言葉が見つからず、自分の来歴を活かせないまま難しい選択に直面する。助けになるはずの機械が、状況の外に立っているからだ。<br><br>フィジカルAIの時代、注目は身体化ロボットに集まっているが、本論文はもう一つの同等に重要な存在として「AIによって拡張された人」を挙げる。汎用人工知能（AGI）が「機械がどれほど賢くなれるか」を問うのに対し、AI拡張人間知性（AHI）は「機械が特定の個人にどれだけの知性を可能にするか」を問う。その実現には「認知的共生体」という新しいシステムが必要だ。生涯にわたり、埋め込み型で、リアルタイム、プライベート、低摩擦、能動的な伴侶であり、外部デバイスを通じて人が感じるものを感知し、数年にわたって文脈を保持し、状況と心をモデル化し、適切な瞬間に思考へ参加し、文脈を踏まえて日常のタスクを遂行し、双方の変化とともに人を学び続ける。<br><br>概念的な核は「認知的ギャップ」――人が状況に持ち込めたはずのものと、ワーキングメモリに保持できるものとの隔たりである。設計空間は、感知・保持・理解・共生・代行・共考・成長からなる共生ループとして整理され、個人ランタイムと信頼によって囲まれる。一方で、試験での隠れた支援や導入への同調圧力など、新種のリスクも生じるとし、ガバナンスをこのパラダイムの一部として扱う。", "timestamp": 1793664000000, "title": "From Autonomous Agents to Cognitive Symbionts: Toward AI-Augmented Human Intelligence", "titleJa": "自律エージェントから認知的共生体へ――AIで拡張される人間の知性", "url": "https://arxiv.org/abs/2611.05376"}, {"authors": ["John D Gault", "Erin Almklov", "Shirley Tang", "Borsika A Rabin", "Brian C Huynh", "James O E Pittman"], "categories": ["psychedelic-assisted psychotherapy", "implementation science", "systematic review"], "field": "PubMed", "genre": "Psychedelics / Therapy", "monthKey": "2026-11", "publishedAt": "2026-11-02T00:00:00Z", "source": "PubMed", "summaryHtml": "サイケデリック支援心理療法（PAP）は、PTSDやうつ病など従来治療が難しい精神疾患への有効性を示すエビデンスが急速に蓄積し、米国では公衆や政府の関心も高まっている。一方で、効果的な治療法の発見と臨床現場への導入のあいだには溝があり、複雑な治療様式を体系的に実装するための知見を整理する必要がある。本系統的レビューは、PAPの実装に関する文献を特定し、その知見を統合して今後の方向性を示すことを目的とした。<br><br>PRISMA 2020に沿い、6つのデータベースを「implementation」「psychedelic（MDMA、シロシビン、LSD、ケタミン）」「psychotherapy」などの検索語で調べた。2,406件が特定され、重複と非査読文献を除いて2,074件をタイトル・抄録でスクリーニングし、47件を全文精査して20件を採用した。実装科学の枠組みPRISMに沿って、実装に関連する要因を抽出・統合した。<br><br>採用された20件のうち15件は、組織の視点から横断調査や質的インタビューで実装を評価したものだった。残りは患者の視点（2件）、インフラ（2件）、患者特性（1件）を扱っていた。学術的な場から利用しやすい臨床プログラムへPAPを移すうえでの最良実践に関する、実装に焦点を当てた研究には目立った不足がある。PAPを現実の現場で安全かつ効果的に実装するには、この溝を埋めることが不可欠だと結論づけている。", "timestamp": 1793577600000, "title": "From Evidence to Practice: A Systematic Review of Implementation of Psychedelic-Assisted Psychotherapy.", "titleJa": "エビデンスから実践へ――サイケデリック支援心理療法の実装に関する系統的レビュー", "url": "https://pubmed.ncbi.nlm.nih.gov/42978762/"}, {"authors": ["Odilia D Lu", "Katrina White", "Kendall B Raymond", "Christine Liu", "Alexandra S Klein", "Nathaniel Green", "Sam Vaillancourt", "Austin J Gallagher", "Lena Shindy", "Alyssa Li", "Kira E Wallquist", "Ruoxian Li", "Mila Zou", "Austen B Casey", "Natalie Perez", "Muhammad Asim", "Setareh Metanat", "Kelsey R Logas", "Vivan Chhaya", "Alexander S Enos", "Ellie M Ho", "Lindsay P Cameron", "Matthew B Pomrenze", "Jason M Tucciarone", "Vikaas S Sohal", "Mazen A Kheirbek", "Andrea M Gomez", "Stephan Lammel", "Boris D Heifets", "Robert C Malenka"], "categories": ["psilocybin", "mouse behavior", "reproducibility"], "field": "PubMed", "genre": "Psychedelics / Therapy", "monthKey": "2026-11", "publishedAt": "2026-11-02T00:00:00Z", "source": "PubMed", "summaryHtml": "サイケデリック薬物のマウス行動への影響を報告する研究は急増しているが、その効果がどれほど再現性があり信頼できるかは不確かだった。これまで報告されてきた行動への影響が、別の研究室でも同じように得られるのかは確かめられていなかった。本研究は、5つの独立した研究室が同じ実験を行う多施設共同のアプローチで、シロシビンのマウス行動への影響のうち何が頑健で再現可能かを検証した。各実験には雌雄あわせて約200匹のマウスが用いられた。<br><br>その結果、シロシビン（2 mg/kg、腹腔内投与）は急性期に不安・回避関連の行動を増やし、恐怖の表出を減らすことが、頑健かつ再現可能な形で示された。一方で、投与24時間後の不安・抑うつ様行動の軽減や恐怖消去学習の促進といった持続的な効果は、再現可能な形では認められなかった。社会的選好や社会的報酬学習への影響も観察されなかった。<br><br>シロシビンには確かな急性効果がある一方で、報告されてきた持続的な効果の一部は控えめか一貫しない可能性があることが示された。マウス研究におけるサイケデリック効果の解釈に、再現性の観点から慎重さを求める検証結果である。", "timestamp": 1793577600000, "title": "A multi-institutional investigation of psilocybin's effects on mouse behavior", "titleJa": "シロシビンのマウス行動への影響を多施設で検証――再現可能な効果はどれか", "url": "https://pubmed.ncbi.nlm.nih.gov/42972049/"}, {"authors": ["LaPlante CD", "Saviano SC", "Hardt MM", "Pain K", "Kolla S", "Lee C", "Maciejewski PK", "Russell D", "Smid GE", "Prigerson HG"], "categories": ["bereavement", "prolonged grief disorder", "pharmacotherapy", "systematic review"], "field": "European journal of psychotraumatology", "genre": "Psychedelics / Therapy", "monthKey": "2026-11", "publishedAt": "2026-11-02T00:00:00Z", "source": "Europe PMC", "summaryHtml": "遷延性悲嘆障害がDSM-5-TRとICD-11の診断体系に加わったことで、悲嘆に対する薬物療法への関心が高まっている。本レビューは、死別に伴う心理的苦痛、とくに死別に続発するうつ病への薬物療法がどのように行われ、どの程度有効かを調べた。MEDLINE、Embase、コクラン・ライブラリーなど6つのデータベースを検索し、2024年12月まで更新した。33件の研究（症例報告・症例集積10件、コホート研究7件、臨床試験16件）、参加者211,920人が対象となった。<br><br>9つの薬物クラスが検討され、抗うつ薬が最も多く研究されていた。対照群のある研究では、どの薬物も悲嘆症状そのものを軽減しなかった。抗うつ薬と、ベータ遮断薬とアスピリンの併用は、死別者のうつ症状には有効に見えた。薬物介入の悲嘆に対する効果量は無視できるほど小さく（標準化平均差-0.06）、うつに対する効果量も小さく有意ではなかった（-0.29）。<br><br>研究の質は全体に低く、方法論の弱さと報告のばらつきが統合を難しくした。現行の薬物療法が遷延性悲嘆障害に有効だという証拠はなく、治療選択肢の空白を埋めるさらなる研究が必要だという結論である。", "timestamp": 1793577600000, "title": "Pharmacological treatment of bereavement-related distress: a systematic review", "titleJa": "死別に伴う苦痛の薬物療法――系統的レビュー", "url": "https://europepmc.org/article/MED/42969145"}, {"authors": ["Daniel A Schaefer", "Manish Agrawal", "Emanuele Mazzola", "Michelle K Leff", "Celia Leeks", "Benjamin S Kematick", "Yvan Beaussant"], "categories": ["psilocybin", "cancer", "depression"], "field": "PubMed", "genre": "Psychedelics / Therapy", "monthKey": "2026-11", "publishedAt": "2026-11-01T00:00:00Z", "source": "PubMed", "summaryHtml": "シロシビン支援療法は、がん患者のうつ病に対して速やかな抗うつ効果を示すことが知られている。だがこれまでの試験の多くは、全身性の抗がん治療を現に受けている人を除外してきたため、この集団における安全性データは限られていた。本研究は、抗がん治療を併用している患者とそうでない患者とで、シロシビン支援療法の有効性と安全性を比較した、フェーズ2非盲検単群試験の二次解析である。<br><br>対象は悪性腫瘍と大うつ病性障害の診断を受けた成人30人（平均年齢56歳、女性70%）で、個人および集団での準備療法、25mgのシロシビン経口投与による集団投与セッション、個人および集団での統合療法を受けた。全身性抗がん治療群は17人、非併用群は13人。主要評価項目は投与後1・3・8週のMADRS（モンゴメリー・アスベルグうつ病評価尺度）スコアの群間差で、副次項目として8週までの有害事象を調べた。<br><br>その結果、MADRSスコアは両群とも大幅に低下し、群間に有意差はなかった（1週 P=.88、3週 P=.93、8週 P=.97）。有害事象は両群で頻繁だったが、重度の有害事象4件と重篤な有害事象1件はいずれも全身性治療群で生じたものの、シロシビンとは無関係と判断された。検査値や自殺念慮にシロシビンに起因する変化も見られなかった。抗がん治療中のがん患者でもシロシビン支援療法の抗うつ効果と安全性は同等であり、今後の試験に積極的治療中の患者を含める根拠となる。", "timestamp": 1793491200000, "title": "Safety and Efficacy of Psilocybin During Anticancer Treatment: A Phase II Trial Secondary Analysis.", "titleJa": "抗がん治療中のシロシビン――安全性と有効性の第II相試験二次解析", "url": "https://pubmed.ncbi.nlm.nih.gov/42546985/"}, {"authors": ["J Patchitt", "T Karapanagiotidis", "S N Garfinkel", "M Miller", "M Tsakiris", "A Clark", "H D Critchley"], "categories": ["interoception", "false feedback", "graph theory"], "field": "PubMed", "genre": "Consciousness / Neuroscience", "monthKey": "2026-11", "publishedAt": "2026-11-01T00:00:00Z", "source": "PubMed", "summaryHtml": "実際には存在しない身体の生理的フィードバックを信じ込んでしまう――そんな「偽フィードバック」へのだまされやすさには個人差があり、内受容（身体内部の感覚の処理）の違いを反映すると考えられてきたが、その背景にある脳ネットワークの仕組みは分かっていなかった。本研究は、偽フィードバック課題を行った健常成人41名の安静時機能的結合を、グラフ理論の手法で解析した。先行研究の賦活解析から定めた9つの関心領域について、局所効率やクラスタリング係数、中心性、経路長などのネットワーク指標を複数の閾値で計算した。<br><br>だまされやすさを予測したのは、3つの異なるネットワーク組織のパターンだった。だまされやすい人ほど、内受容の鍵となる後部島の偏心度が高く、ネットワークの周辺に位置づけられていた。また、眼窩前頭皮質は複数の指標で一貫して分離しており、経路長が長く中心性が低かった。さらに小脳ネットワークでは、局所効率の低下と媒介中心性の上昇を伴う再構成が見られた。<br><br>偽フィードバックへの感受性は、後部島などの内受容領域と、眼窩前頭皮質の情動評価システムとの統合が弱いことに由来する。内受容の処理は、内臓感覚と情動評価、認知制御システムの効率的な統合に依存するというネットワークモデルを支持する結果であり、内受容の気づきや情動調節を標的とする介入にもつながる知見である。", "timestamp": 1793491200000, "title": "Functional Network Organization Underlying Individual Differences in False Feedback Susceptibility: A Graph Theoretical Analysis", "titleJa": "偽の身体フィードバックにだまされやすい脳――内受容ネットワークの個人差をグラフ理論で読む", "url": "https://pubmed.ncbi.nlm.nih.gov/42963537/"}, {"authors": ["Letian Yang", "Yiyang Wang", "Weizhen Yin", "Xinru Xu", "Xuye Yuan", "Han Yang", "Shanping Zhang", "Shuai Jiang", "Yuanjie Guo", "Yao Wang", "Chanjuan Yang", "Yanlin Zhou", "Dongwei Li", "Yan Song", "Cai-Ping Dang"], "categories": ["ADHD", "auditory attention", "EEG", "N2ac", "cross-modal attention"], "field": "NeuroImage", "genre": "Consciousness / Neuroscience", "monthKey": "2026-11", "publishedAt": "2026-11-01T00:00:00Z", "source": "PubMed", "summaryHtml": "聴覚的な注意を効率よく働かせるには、目標となる音をそれ以外の音より優先しなければならない。注意の欠陥はADHDの中核的な特徴だが、視覚と聴覚をまたぐ注意のなかで、聴覚情報の優先づけを担う神経メカニズムは明らかになっていなかった。本研究は学齢期の子ども95名（ADHD群46名、定型発達群49名、平均年齢10.81歳）を対象に、視覚的手がかりによる聴覚空間注意課題を脳波（EEG）計測下で行い、N2ac成分と多変量パターン解析（MVPA）で調べた。<br><br>定型発達群では目標位置のMVPA復号が強まり、非目標位置の復号は弱まった。目標と非目標の神経的な区別が大きいほどN2acの振幅も大きかった。一方ADHD群では目標の側性化が弱く、N2ac振幅が小さく、目標の復号は弱い一方で非目標の復号が強まり、関連情報と無関連情報の神経的な区別が縮んだ。<br><br>目標関連の側性化の低下は反応時間のばらつきの大きさと、目標復号精度の低下は多動性・衝動性の症状の重さと関連していた。ADHD児では聴覚情報の神経的優先づけが変わっており、それが行動のばらつきや症状の重さと結びつくことが示された。注意機能障害の神経認知メカニズムへの新たな知見である。", "timestamp": 1793491200000, "title": "Altered neural prioritization of auditory information during cross-modal attention in children with ADHD.", "titleJa": "ADHD児における聴覚情報の神経的優先づけの変化――クロスモーダル注意下のEEG研究", "url": "https://pubmed.ncbi.nlm.nih.gov/42826852/"}, {"authors": ["Parsa Seyfourian", "Lydia C Marks", "Leslie D Claar", "Yasmeen Nahas", "Miles Keating", "Christof Koch", "Irene Rembado"], "categories": ["pupil dynamics", "consciousness", "DeepLabCut"], "field": "Journal of Neuroscience Methods", "genre": "Consciousness / Neuroscience", "monthKey": "2026-11", "publishedAt": "2026-11-01T00:00:00Z", "source": "PubMed", "summaryHtml": "瞳孔径は覚醒や注意、認知処理、意識と相関する非侵襲的な脳状態バイオマーカーである。しかし既存の瞳孔測定ソフトウェアは、実験条件や種をまたいでスケーラビリティと頑健性に欠けることが多い。本研究は、DeepLabCut に基づくオープンソースのオフライン・パイプライン Pupil-DLC を提案する。主にマウスを対象とし、マーカーなしで瞳孔を追跡できる。<br><br>140本超の頭部固定マウスの動画から人手でアノテーションした21,909フレームで学習した。覚醒状態に加え、サイケデリックスや麻酔による薬物誘発状態も含み、瞳孔サイズの多様性を最大化するようデータセットを構成した。Pupil-DLC は、高速処理向けの汎用モデルと、セッションごとに最適化する個別モデルの二重構造を採用する。覚醒時、サイケデリック投与時、麻酔時の瞳孔動態をグラウンドトゥルースと高い一致で捉え、活発な移動時も静止時も同等の追跡精度を示した。<br><br>信頼度指標は人間のフレーム品質評価と一致し、精度と保持率のトレードオフを原理的に調整できる。さらに、再学習なしに、昼光下やスマートフォン撮影を含む多様な条件・フレームレートのヒト動画にも拡張できることを示した。既存の自動手法を精度とフレーム保持率で上回りつつ、リアルタイム級の計算効率を維持する。瞳孔形状のばらつきや遮蔽、反射、撮像アーチファクトに頑健な学習済みキーポイント表現によるもので、マウス神経科学からヒトへの橋渡しとなる再現可能な基盤を提供する。", "timestamp": 1793491200000, "title": "Pupil-DLC: An open-source deep learning pipeline for scalable, marker-less tracking of pupil dynamics across conscious and unconscious states.", "titleJa": "Pupil-DLC――意識状態と無意識状態を横断する瞳孔動態のスケーラブルなマーカー不要トラッキング", "url": "https://pubmed.ncbi.nlm.nih.gov/42401399/"}, {"authors": ["Praachi Tiwari", "Bryan W Jenkins", "Catherine F Moore", "Hudson Zhou", "Tylaah George", "David B Yaden", "Elise M Weerts"], "categories": ["psilocybin", "spontaneous behavior", "head-twitch response", "dose-response"], "field": "Journal of Psychopharmacology", "genre": "Psychedelics / Therapy", "monthKey": "2026-11", "publishedAt": "2026-11-01T00:00:00Z", "source": "PubMed", "summaryHtml": "サイケデリック薬はさまざまな神経精神疾患の治療薬として期待されているが、動物モデルにおける自発行動への影響は、これまで広く研究されてきたヘッドトゥイッチ反応（HTR）を除くと体系的に調べられてこなかった。本研究は、雌雄のラットにシロシビン（0.5、1、1.5 mg/kg）または生理食塩水を投与し、行動をビデオで記録して分析した。<br><br>HTRとウェットドッグシェイクに加え、不動、立ち上がり、グルーミング、嗅ぎ・掘り、旋回の5つの自発行動も評価した。各行動は用量反応プロファイルが異なり、HTRはベル型の曲線を示す一方、不動は用量とともに直線的に増加した。立ち上がりとグルーミングは低用量でも顕著に減少し、嗅ぎ・掘りは高用量でのみ減少、旋回は用量と性別で変動した。<br><br>行動間の相関も用量依存的に変化した。結果は、シロシビンの影響がHTRにとどまらず幅広い自発行動に及ぶことを示し、生理学的に妥当な用量範囲での神経行動学的効果を特定する枠組みを提供する。動物実験におけるサイケデリック作用の評価を広げる研究である。", "timestamp": 1793491200000, "title": "Beyond head-twitch response: Acute psilocybin affects spontaneous behaviors in rats in a dose-dependent manner.", "titleJa": "ヘッドトゥイッチ反応を超えて――急性シロシビンがラットの自発行動に与える用量依存的影響", "url": "https://pubmed.ncbi.nlm.nih.gov/42639976/"}, {"authors": ["A E Ostrand", "M M Nour", "C Timmermann", "A Rosati", "L X Luan", "A Gomez-Emilsson", "J Bornemann", "K T Greenway", "L Roseman", "Carhart-Harris R"], "categories": ["psychedelic", "phenomenology", "psilocybin", "ketamine", "MDMA"], "field": "Journal of Psychopharmacology", "genre": "Psychedelics / Therapy", "monthKey": "2026-11", "publishedAt": "2026-11-01T00:00:00Z", "source": "PubMed", "summaryHtml": "「サイケデリック」という言葉は1956年、ハンフリー・オズモンドが「魂（psyche）」と「顕現させる（delic）」を組み合わせて造語した。語源は「魂を照らし出す」状態を指すが、それが単なる主観状態の名なのか、そうした作用を主作用とする薬物の分類名なのかは曖昧なままだった。本研究は現象学を出発点に、「サイケデリック」というカテゴリーを経験の側から定義し直すことを試みた。<br><br>著者らは200人以上の参加者に、シロシビン、ケタミン、MDMAの3薬物について、デルファイ法で作成した主観評価項目への回答を求めた。因子分析の結果、主観体験は3〜4つのほぼ独立した次元に分かれ、機械学習分類器は体験の特徴だけからどの薬物かを正確に予測できた。3薬物の主観プロファイルは明確に異なり、シロシビンは幻視と心理的洞察、ケタミンは解離、MDMAは向社会的で愛情に満ちた感情によって特徴づけられた。<br><br>結論として、シロシビンは典型的なサイケデリックであり、「サイケデリック」とはサイケデリック状態を引き起こす薬物のカテゴリーとして定義できるという。核となる現象は、幻視と心理的洞察を特徴とする主観状態である。薬物の分類を主観体験に基づいて整理し直すことで、サイケデリック研究の概念的な土台を明確にした研究である。", "timestamp": 1793491200000, "title": "Defining 'psychedelic'.", "titleJa": "「サイケデリック」を定義する――幻視と心理的洞察を核とする主観状態", "url": "https://pubmed.ncbi.nlm.nih.gov/42605589/"}, {"authors": ["Robert F Dougherty", "Nadav Liam Modlin", "Niall M McGowan", "Patrick Staples", "Ella Williams", "Patrick Clarke", "Mario Shafiei", "Carly Leininger", "Merve Alti", "Megan Croal", "Lindsey Marwood", "Namik Kirlić", "Gregory A Ryslik", "Guy M Goodwin"], "categories": ["psychedelic", "psilocybin", "PTSD", "psychotherapy"], "field": "Journal of Psychopharmacology", "genre": "Psychedelics / Therapy", "monthKey": "2026-11", "publishedAt": "2026-11-01T00:00:00Z", "source": "PubMed", "summaryHtml": "シロシビンは、モニタリングと支援を伴う投与によって複数の精神疾患に有望性を示してきた。しかし、サイケデリック試験における参加者支援の役割やその性質については議論が続いている。本研究は、Compass社の試験における投与セッションのモニタリングと支援の構造を、音声記録の分析から明らかにすることを試みた。<br><br>外傷後ストレス障害（PTSD）の参加者22人を対象とした12週間の臨床試験で、25mgのCOMP360シロシビン投与セッション中の参加者と支援者の発話速度（分あたり語数）を測定し、投与後のインタビューをテーマ分析した。投与セッションでは発話はまれで、平均で78%の時間が沈黙で占められたのに対し、準備セッションやフォローアップでは25〜30%にとどまった。支援は最小限でありながら体験上は際立っており、自律性が促され、変性意識状態における支援の中心は安心感の付与と承認だった。<br><br>言葉のやり取りが乏しいことは、Compassの投与セッションにおける支援が、多くの従来型心理療法やMDMA支援療法、サイケデリックを用いる精神分析的な治療パラダイムとは区別できることを示唆している。サイケデリック治療における「支援」の実態を定量的に記録した研究である。", "timestamp": 1793491200000, "title": "Silence is golden: Documenting the speech production of participants and support providers in psilocybin administration sessions for the treatment of post-traumatic stress disorder.", "titleJa": "沈黙は金なり――PTSD治療におけるシロシビン投与セッションの発話記録", "url": "https://pubmed.ncbi.nlm.nih.gov/42460632/"}, {"authors": ["Rebecca Ehrenkranz", "Nathan D Sepeda", "Sean P Goldy", "Brandon M Weiss", "Praachi Tiwari", "Arozo Azimi", "David B Yaden"], "categories": ["psychedelic", "questionnaire", "psychometrics"], "field": "Journal of Psychopharmacology", "genre": "Psychedelics / Therapy", "monthKey": "2026-11", "publishedAt": "2026-11-01T00:00:00Z", "source": "PubMed", "summaryHtml": "持続効果質問票（PEQ）は、サイケデリックなどの体験がもたらす肯定的・否定的な持続効果を自己報告で測る尺度で、多くの研究で使われてきた。しかし正式な妥当性検証は行われておらず、140項目以上に単項目も加わるため回答者の負担が大きいという課題があった。本研究はPEQの統計的・質的な妥当性検証を行い、検証済みの短縮版（PEQ-SF）を作成することを目指した。<br><br>検証では、探索的因子分析による次元削減、収束的・弁別的妥当性の検討、別サンプルでの確認的因子分析、項目の理解しやすさを確認する質的な回答過程評価、そして臨床試験と健常者試験の2件の投与研究における原版と短縮版の比較を行った。その結果、原版の因子構造は定量的には支持されず、全体的な肯定的因子と否定的因子からなる2因子構造が明らかになった。<br><br>この2因子構造は、肯定的・否定的各1因子の計14項目に、ウェルビーイングと意味に関する原版の単項目3つを加えた短縮版でも維持された。原版には十分な妥当性がなかった一方、短縮版は強い心理測定的特性を示し、投与研究でも原版と同様に機能した。サイケデリック研究の測定負担を軽くする実用的な成果である。", "timestamp": 1793491200000, "title": "Validating and creating a short-form of the persisting effects questionnaire: A measure of positive and negative outcomes from psychedelic experiences.", "titleJa": "持続効果質問票の短縮版を検証する――サイケデリック体験の肯定的・否定的な持続効果を測る尺度", "url": "https://pubmed.ncbi.nlm.nih.gov/42755297/"}], "updatedAt": "2026-11-10T07:28:13Z", "version": 1};
    const byId = id => document.getElementById(id);
    const norm = s => String(s||'').toLowerCase().normalize('NFKC').replace(/\s+/g,' ').trim();
    const esc = s => String(s||'').replace(/[&<>"]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
    const months = [...new Set((DATA.articles||[]).map(a => a.monthKey).filter(Boolean))].sort().reverse();
    const genres = [...new Set((DATA.articles||[]).map(a => a.genre).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'ja'));
    const fields = [...new Set((DATA.articles||[]).map(a => a.field).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'ja'));
    function fill(select, values){ values.forEach(v=>{ const o=document.createElement('option'); o.value=v; o.textContent=v; select.appendChild(o); }); }
    fill(byId('month'), months); fill(byId('genre'), genres); fill(byId('field'), fields);
    function render(){
      const month=byId('month').value, genre=byId('genre').value, field=byId('field').value, sort=byId('sort').value, kw=norm(byId('keyword').value);
      let rows=(DATA.articles||[]).filter(a=>{
        if(month&&a.monthKey!==month) return false; if(genre&&a.genre!==genre) return false; if(field&&a.field!==field) return false;
        const hay=norm([a.titleJa,a.title,a.summaryHtml,a.authors.join(' '),a.categories.join(' ')].join(' '));
        if(kw&& !hay.includes(kw)) return false; return true;
      });
      rows = rows.slice().sort((a,b)=> sort==='oldest' ? a.timestamp-b.timestamp : sort==='title' ? a.titleJa.localeCompare(b.titleJa,'ja') : b.timestamp-a.timestamp);
      byId('meta').textContent = `更新: ${DATA.updatedAt || '-'} / 表示件数: ${rows.length}件`;
      byId('list').innerHTML = rows.map(a=>`
        <article>
          <div class="src">${esc(a.source)} / ${esc(a.publishedAt.slice(0,10))}</div>
          <h2 class="title">${esc(a.titleJa)}</h2>
          <div class="tags"><span class="tag">AI</span><span class="tag">${esc(a.genre)}</span><span class="tag">${esc(a.field)}</span>${a.categories.slice(0,4).map(c=>`<span class=\"tag\">${esc(c)}</span>`).join('')}</div>
          <div class="summary">${a.summaryHtml}</div>
          <div class="box"><strong>ソース・引用元</strong><br>配信元：${esc(a.source)}<br>原題：${esc(a.title)}<br>著者：${esc(a.authors.join(', '))}<br>原文URL：<a href="${esc(a.url)}" target="_blank" rel="noopener">${esc(a.url)}</a></div>
        </article>`).join('');
    }
    ['month','genre','field','sort'].forEach(id=>byId(id).addEventListener('change',render)); byId('keyword').addEventListener('input',render); render();
