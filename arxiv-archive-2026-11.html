  <script>
    const DATA = {"version": 1, "updatedAt": "2026-11-09T08:36:43Z", "articles": [{"source": "arXiv cs.RO", "title": "Perceptive Humanoid Motion from Simulation", "titleJa": "シミュレーションから学ぶ知覚的ヒューマノイド動作――HALO", "summaryHtml": "ヒューマノイドロボットは幅広い物理タスクの自動化を担う潜在力を持つが、汎用的な自律性への進歩はデータのボトルネックに制約されている。ピクセルと自由形式の言語を低レベルの関節指令へ結びつけるには対になった教師データが必要だが、十分な規模のコーパスは存在しない。人間の遠隔操作やウェアラブル計測に頼る方法では、1時間のデータを得るのに少なくとも1時間の人手がかかる。<br><br>本論文の「HALO」は、手続き的に生成した1,000軒の家屋にわたって視覚・言語・動作データを合成するパイプラインで駆動されるヒューマノイド自律システムである。コーパスは人間の労働ではなく計算量に応じて拡大する。<br><br>HALOは、椅子に座る、名前で指定された物体へ移動する、半開きのドアを横向きに通り抜ける、テーブルの下をかがんで這う、箱を押すといった身体技能のレパートリーを獲得し、それらを組み合わせて複合的で長期のタスクを解く。実在の家屋を一度も見ずに合成データだけで学ぶアプローチの到達点を示している。", "url": "https://arxiv.org/abs/2611.06908", "publishedAt": "2026-11-04T18:55:33Z", "timestamp": 1793818533000, "monthKey": "2026-11", "field": "cs.RO", "genre": "Vision / Multimodal", "authors": ["Siyuan Hu", "Abulikemu Abuduweili", "Yue Meng", "Shipeng Liu", "Quentin Leboutet", "Chen Chen", "Matthias Müller", "Vladlen Koltun"], "categories": ["cs.RO", "cs.AI", "cs.CV", "cs.LG"]}, {"source": "arXiv cs.LG", "title": "Reinforcement Learning Enables Scaling Generalist Robot Policy Improvement", "titleJa": "強化学習で汎用ロボットポリシーを「汎用的に」改善する", "summaryHtml": "汎用ロボットポリシーの登場により、単一の大規模モデルが膨大な事前学習コーパスから多様なタスクを学べるようになった。これらのモデルは強力なゼロショット汎化を示す一方、実配備で十分な性能を得るには適応の段階が通常必要である。強化学習（RL）による反復的な自己改善はその適応策として有望視されてきたが、従来の検討は、狭い配備タスクの改善だけを目指す単一タスク設定にほぼ限られていた。<br><br>本研究は、汎用ポリシーが配備先で多様なタスクを同時に狙う「マルチタスクで汎用的な改善」を実現できるか、そしてそれを可能にするアルゴリズムのレシピは何かを問う。<br><br>著者らはまず、汎用的改善の能力を検証する構造化された評価群を開発し、系統的な検討を行った。ベースポリシーのマルチタスク性と矛盾しない形で、RLによる自己改善を複数タスクへ同時に効かせるための条件と手法を明らかにすることを目指している。", "url": "https://arxiv.org/abs/2611.06905", "publishedAt": "2026-11-04T18:52:28Z", "timestamp": 1793818348000, "monthKey": "2026-11", "field": "cs.LG", "genre": "Robotics", "authors": ["Michal Korniak", "Marco Bagatella", "Ralf Römer", "Michal Nauman", "Yarden As", "Pranav Vignesh", "Manan Agarwal", "Leander Diaz-Bone", "Piotr Zalewski", "Mikołaj Czarnecki", "Lenart Treven", "Shashwat Saxena", "Sreyas Venkataraman", "Sarvesh Patil", "Zhiyuan Zhou", "Daniel Marta", "Oier Mees", "Nur Muhammad Mahi Shafiullah", "Carmelo Sferrazza", "Bhavya Sukhija", "Angela P. Schoellig", "Andreas Krause", "Max Simchowitz", "Andrew Wagenmaker"], "categories": ["cs.LG", "cs.RO"]}, {"source": "arXiv cs.CV", "title": "Motion-guided Contrastive Regularization For Latent World Models", "titleJa": "潜在世界モデルの「静的崩壊」を防ぐ――動作誘導型の対照正則化", "summaryHtml": "JEPA式の世界モデルは観測を再構成せずに行動条件付きの潜在ダイナミクスを学ぶが、分布的な正則化だけでは、表現が制御に必要な情報を保つ保証がない。本論文は、エンコーダがエピソード固有の静的内容を保持する一方で、マニピュレーションに関わる状態変化を抑え込んでしまう失敗モード「静的崩壊（static collapse）」を特定する。静的内容は時間的に予測可能でエピソードごとに多様なため、SIGRegのような正則化でもこの失敗は生き残ってしまう。<br><br>OGBench-Cubeでの制御研究では、背景をランダム化すると、操作タスク自体は変わらないのに計画性能が大幅に低下することが示された。<br><br>対策として著者らは「動作誘導型対照正則化」を提案する。予測した潜在遷移を、同じエピソード内の候補観測への遷移と比較し、静的な背景の同一性を行動結果の区別に使いにくくする。最適化の詳細はモデルが背景ではなく、行動に伴う状態変化を捉えるよう促す方向に設計されている。", "url": "https://arxiv.org/abs/2611.06901", "publishedAt": "2026-11-04T18:49:35Z", "timestamp": 1793818175000, "monthKey": "2026-11", "field": "cs.CV", "genre": "Vision / Multimodal", "authors": ["Yiwen Chen", "Qiqi Hou", "Jisoo Jeong", "Yinhao Zhu", "Huaizu Jiang", "Amir Said"], "categories": ["cs.CV"]}, {"source": "arXiv cs.CV", "title": "Occlusion for Free: Detecting Occlusion from the Disagreement Between Two Monocular Distance Cues", "titleJa": "2つの単眼距離手がかりの「不一致」から遮蔽を読み取る", "summaryHtml": "歩行者が遮蔽されていると分かること自体が、隠れたピクセルを復元できなくてもロボットには有用である。しかし遮蔽の推定器は通常、配備環境ではめったに得られない遮蔽アノテーションで訓練される。本論文は、カメラのみのパイプラインがすでに計算している2つの距離推定から、遮蔽を読み取れることを示す。<br><br>仕組みは単純である。見かけの高さは遮蔽の影響をほとんど受けない（検出ボックスは人物全体に張られるため）一方、単眼のメートル深度は遮蔽物側へ引っ張られる（ボックス内で最も近い面が深度マップの値になるため）。両者の順序関係だけを使えばよく、焦点距離も身長も深度のスケールも不要で、深度モデルの誤差がほぼ純粋なゲインであるという条件はラベルなしで確認できる。<br><br>このスコアはKITTIで重度の遮蔽をAUC 0.909で検出し、検出器が見逃した歩行者を含む全アノテーション対象でも0.888を記録した。訓練も遮蔽ラベルも不要で、距離の代理変数でもない（固定した距離帯の中でもAUCは維持される）ことが示されている。", "url": "https://arxiv.org/abs/2611.06899", "publishedAt": "2026-11-04T18:49:13Z", "timestamp": 1793818153000, "monthKey": "2026-11", "field": "cs.CV", "genre": "Robotics", "authors": ["Chibueze Praise Onyenweaku", "Toyibat Adele", "Sikirulahi Opeyemi Abdulkareem", "Obed Honour Eje"], "categories": ["cs.CV", "cs.AI"]}, {"source": "arXiv cs.SE", "title": "MCP-Eco: A Linked Dataset of MCP Servers, Consumers, and Development Activity", "titleJa": "MCP-Eco――MCPサーバと利用側プロジェクト、開発活動をつなぐ大規模データセット", "summaryHtml": "Model Context Protocol（MCP）は、LLMエージェントが外部ツールやデータへアクセスするための標準である。そのソフトウェア生態系を研究するには、サーバのインターフェース、それを設定するプロジェクト群、そして開発活動を結びつける必要があるが、情報はディレクトリ、パッケージレジストリ、設定ファイル、リポジトリ履歴に散在している。<br><br>本論文はこれらを統合した関係データセット「MCP-Eco」を提示する。凍結版リリースは19のParquetテーブルに16,880,899件のレコードを含み、候補サーバプロジェクト78,302件、利用側候補リポジトリ16,165件、設定宣言9,200件をカバーする。うち5,975件の宣言が5,138組のリポジトリ―サーバ対へ解決される。<br><br>ツール・リソース・プロンプトの説明、宣言された依存関係、プルリクエストやレビュー、イシューなどの開発記録も含まれる。MCP生態系の実態を定量的に研究するための基盤データである。", "url": "https://arxiv.org/abs/2611.06897", "publishedAt": "2026-11-04T18:47:50Z", "timestamp": 1793818070000, "monthKey": "2026-11", "field": "cs.SE", "genre": "Vision / Multimodal", "authors": ["Khalid Tounoussi", "Mohammed Sayagh", "Ali Ouni", "Yutaro Kashiwa"], "categories": ["cs.SE"]}, {"source": "arXiv cs.CV", "title": "Procedural Adversarial Learning", "titleJa": "手続き的敵対学習――生成器のパラメータ空間で「難しい事例」を探す", "summaryHtml": "多くのコンピュータビジョン課題で、ニューラルネットは平均誤差を小さく訓練できるのに、一見単純な場面で失敗する。失敗を減らすにはまず失敗を見つける必要があるが、それは固定データセットの中にあるとは限らない。本論文は、手続き的生成器の入力空間を探索して難しい事例を見つける、ミニマックス訓練と敵対的評価の枠組み「手続き的敵対学習（PAL）」を研究する。<br><br>手続き的生成器は、レイアウト・照明・姿勢などの低次元な制御パラメータを、描画画像とそのラベルへ写す解釈可能なプログラムである。著者らは、生成器のパラメータ空間でゼロ次最適化を行い、オンデマンドに敵対的訓練サンプルを提案するSimple-PATアルゴリズムを導入した。<br><br>あわせて、表面法線推定、画像セグメンテーション、人間の姿勢推定のための効率的な手続き的生成器群「PAL-Dojo」を構築した。実データの分布の外側にある失敗例を能動的に掘り起こし、訓練へ還元するアプローチである。", "url": "https://arxiv.org/abs/2611.06890", "publishedAt": "2026-11-04T18:42:28Z", "timestamp": 1793817748000, "monthKey": "2026-11", "field": "cs.CV", "genre": "Vision / Multimodal", "authors": ["Jack Nugent", "Jia Deng"], "categories": ["cs.CV"]}, {"source": "arXiv cs.AI", "title": "Dull, Dirty, Dangerous? Working Conditions and the Limits of Occupational AI Exposure", "titleJa": "単調・汚い・危険？――労働条件と職業別AI曝露の限界", "summaryHtml": "自動化はしばしば「単調（dull）・汚い（dirty）・危険（dangerous）」な仕事からの解放として正当化される。本論文は、米国の754の職業についてO*NETの21項目を用い、こうした労働条件と職業別AI曝露（AIへの晒され度）との関係を検討する。<br><br>曝露が高い職業ほど条件スコアは低いという関連が、大規模言語モデル（LLM）による尺度とAIOE（AI職業曝露）の双方で、職業均等重みでも雇用重みでも見られた。身体的負荷、必要な学歴、訓練と経験、賃金で調整すると複合的な関連は弱まり、調整後の信頼区間はLLM曝露ではゼロを含み、AIOEではゼロ未満にとどまった。<br><br>反復作業と裁量の制限を分けるかどうかで、統合された「単調」スコアの意味も変わる。これらの比較は、項目のまとめ方と職業特性が曝露推定の解釈を左右することを示す。「AIが引き受けるのはつらい仕事だ」という単純な物語への実証的な留保である。", "url": "https://arxiv.org/abs/2611.06888", "publishedAt": "2026-11-04T18:41:40Z", "timestamp": 1793817700000, "monthKey": "2026-11", "field": "cs.AI", "genre": "LLM / NLP", "authors": ["Siyi Yu"], "categories": ["cs.AI", "cs.HC", "econ.GN"]}, {"source": "arXiv cs.RO", "title": "VABAR: A Variational Automation Benchmark for Agentic Robotics", "titleJa": "VABAR――エージェンティックロボティクスのための変分自動化ベンチマーク", "summaryHtml": "ロボットが商業・産業用途で信頼性高く働くには、物体の形状や姿勢に既知のばらつきがあるなかで、特定のタスクを持続的にこなす必要がある。著者らはこれを固定自動化と区別して「変分自動化（Variational Automation）」と呼ぶ。<br><br>事前学習済みLLM・VLMのコーディングエージェントが、解釈可能なロボットプログラミングとモデルフリー方策の開世界適応性を組み合わせる「エージェンティックロボティクス」の近年の流れを踏まえ、本論文はベンチマーク設計の一般基準――アクセスのしやすさ、再現性、多様性、実応用への関連、物理的実現可能性、飽和への耐性、計算効率――を提案する。<br><br>その原則を、産業・医療・インフラにまたがる6つの操作タスク類型（工具の仕分け、工具掛け、ギア噛み合わせ、注射器の梱包、ケーブル挿入、ケーブル配線）で具体化したものが「VABAR」である。", "url": "https://arxiv.org/abs/2611.06881", "publishedAt": "2026-11-04T18:38:01Z", "timestamp": 1793817481000, "monthKey": "2026-11", "field": "cs.RO", "genre": "LLM / NLP", "authors": ["Shuangyu Xie", "Kaiyuan Chen", "Uksang Yoo", "Xinyue Zhu", "Meadow Shen", "Jaimyn Drake", "Eugen Solowjow", "Lionel Gulich", "Alexander Millane", "Rafael Cathomen", "Tuur Stuyck", "Sangeeta Subramanian", "Yichao Pan", "Bruce McGowan", "Michael Benedict", "Linxi Fan", "Yuke Zhu", "Spencer Huang", "Ken Goldberg"], "categories": ["cs.RO"]}, {"source": "arXiv cs.LG", "title": "Adaptive Multi Mode: Budget-Aware Routing of Optimizers By Online Landscape Probes", "titleJa": "Adaptive Multi Mode――地形のオンラインプローブで最適化エンジンを予算に応じて切り替える", "summaryHtml": "連続ブラックボックス問題に最適な古典的最適化手法は、予算と地形（ランドスケープ）に依存する。既存のルータは次元と予算、過去の改善、単一ベンチマークへ当てはめた特徴から判断し、最適化手法の暗黙の仮定をオンラインで検証するものは少ない。<br><br>「AMM（Adaptive Multi Mode）」は、既知の予算を準ニュートン法、信頼領域法、座標法、多スタート法、進化戦略の各エンジンへ配分するルータである。曲率、平坦域、分離可能性、折れ点、盆地、フラクタル構造を調べるオンラインプローブを用い、各プローブには既定値、次元×予算の有効範囲、予算へ課金されるコストが付く。<br><br>bbobでの事前登録つき開発ループでは、最後の16回の確認のうち32/36件の予測が的中した。続いて保留してあったbbobインスタンス101–110（次元2–40）で最大7つの競合手法と一度だけ対決し、600の関数×次元×予算セルのうち382セルで最高の目標到達シェアを記録した（単独最高236、タイ146）。", "url": "https://arxiv.org/abs/2611.06879", "publishedAt": "2026-11-04T18:35:35Z", "timestamp": 1793817335000, "monthKey": "2026-11", "field": "cs.LG", "genre": "Robotics", "authors": ["Benjamin Jacob Bodner"], "categories": ["cs.LG", "cs.NE", "math.OC"]}, {"source": "arXiv cs.CL", "title": "SpecCompact: Accelerating LLM Agent Context Compaction with Slot-Parallel Semantic Speculative Verification", "titleJa": "SpecCompact――スロット並列の投機的検証でLLMエージェントの文脈圧縮を高速化", "summaryHtml": "LLMエージェントは増え続ける対話履歴を管理するために文脈圧縮（コンテキスト・コンパクション）を使うが、長い履歴を大規模モデルで要約すると大きな遅延が生じる。圧縮には、情報の保持とレイテンシのバランスが求められる。著者らは、構造化された要約スロットが独立に生成されても情報を保持できるという観察に着目した。<br><br>提案する「SpecCompact」は、スロット並列の意味的投機によって圧縮を高速化する枠組みである。小さなドラフタをファインチューニングしてスロットを並列に生成し、ターゲットモデルが各行を検証して却下された内容を修復する。その後のドラフトは更新されたスロット接頭辞を使う。システム面の最適化により、文脈処理の繰り返しとモデル呼び出しも削減される。<br><br>AppWorldとτ³ベンチマークで2つのターゲットモデルを用いた評価では、Hermes式の要約に対して2.04〜5.63倍の圧縮高速化を達成した。下流タスクでの別途評価も行われ、速度と品質の両立が検討されている。", "url": "https://arxiv.org/abs/2611.06876", "publishedAt": "2026-11-04T18:34:41Z", "timestamp": 1793817281000, "monthKey": "2026-11", "field": "cs.CL", "genre": "LLM / NLP", "authors": ["Yulu An", "Yifei Feng", "Xiangyang Yin"], "categories": ["cs.CL"]}, {"source": "arXiv cs.AI", "title": "Learning to Decode Linear Codes with Generalized Belief Propagation Network", "titleJa": "一般化信念伝播ネットワークで線形符号の復号を学習する", "summaryHtml": "誤り訂正符号は通信システムの基盤であり、ノイズのあるチャネルでも信頼性の高いデータ伝送を可能にする。近年、ニューラル復号器は古典的な反復アルゴリズムを上回る性能を示してきた。本論文は、メッセージ伝播の対称性を保ちながら復号器の学習能力を高めた「一般化信念伝播ネットワーク（GBPNet）」を提案する。<br><br>アーキテクチャはタナーグラフ構造を維持したまま、変数ノード更新のカスケードと、学習される要素ごとのメッセージスケーリングを用いる。訓練戦略として、段階的に難しくするプログレッシブ訓練と高SNR訓練の2つも導入し、復号精度を改善する。<br><br>複数の線形符号での実験では、GBPNetは従来の信念伝播や、評価対象とした最先端のニューラル復号器よりも低いビット誤り率を達成した。古典アルゴリズムの構造を捨てずに学習を組み込む設計の有効例である。", "url": "https://arxiv.org/abs/2611.06874", "publishedAt": "2026-11-04T18:29:31Z", "timestamp": 1793816971000, "monthKey": "2026-11", "field": "cs.AI", "genre": "Scientific AI", "authors": ["Samira Malek"], "categories": ["cs.AI"]}, {"source": "arXiv cs.CV", "title": "PixelSpline: Continuous Space-Time Video Super-Resolution via Endpoint-Anchored Shared Pixel Trajectories", "titleJa": "PixelSpline――終端に固定した共通ピクセル軌道による連続時空間ビデオ超解像", "summaryHtml": "既存の連続時空間ビデオ超解像（STVSR）は、2つの終端フレームだけから動きを推測し、両方向の動きを独立にモデル化することが多く、対応付けの曖昧さや軌道の不整合に弱い。本論文は、長文脈エンコーディング、連続的な高解像度特徴のリフト、そして終端に固定した「PixelSpline」を組み合わせた連続STVSRフレームワークを提案する。<br><br>長い観測はより信頼できる終端表現を与え、連続アップサンプリングは要求された高解像グリッド上に直接、詳細な外観特徴を構築する。PixelSplineは各ピクセルの動きを、両終端で共有される単一の連続軌道として明示的にモデル化する。<br><br>この軌道を使って終端の色を粗い中間フレームへワープし、高解像特徴を位置合わせして残差を再構成する。空間・時間の各種アップサンプリング設定での実験により、品質と効率の良好なバランスが示された。", "url": "https://arxiv.org/abs/2611.06870", "publishedAt": "2026-11-04T18:25:55Z", "timestamp": 1793816755000, "monthKey": "2026-11", "field": "cs.CV", "genre": "Vision / Multimodal", "authors": ["Wanqi Yuan", "Nianyi Li"], "categories": ["cs.CV"]}, {"source": "arXiv cs.AI", "title": "On Turn-Level Best-of-N Sampling for Scaling LLM Agents", "titleJa": "ターン単位のBest-of-NサンプリングでLLMエージェントをスケールさせる", "summaryHtml": "本研究は、複雑で長期のタスクに取り組むLLMエージェントに対して、「ターン単位のBest-of-Nサンプリング」に基づく単純な推論時スケーリング手法を評価する。生成器と選択器の2つのLLMからなる枠組みで、各ターンに生成器モデルがN個の行動候補を出し、選択器モデルがそのうち1つを選んで環境で実行する。<br><br>推論時の誘導探索に批評家（クリティック）モデルを使った先行研究と異なり、本研究は、市販のオープンウェイトLLMが候補行動同士を直接比較して有効に機能するかを検証する点に特徴がある。<br><br>長期のターミナルタスクでの実験では、この手法が精度（5〜10%）と試行間の一貫性の両面で有意な改善をもたらした。エージェントの軌跡分析では、行動の質の変化も観察されている。訓練なしに推論時の計算でエージェントを底上げする実践的な選択肢である。", "url": "https://arxiv.org/abs/2611.06868", "publishedAt": "2026-11-04T18:23:14Z", "timestamp": 1793816594000, "monthKey": "2026-11", "field": "cs.AI", "genre": "LLM / NLP", "authors": ["Jalaj Bhandari", "Dhawal Gupta", "Hongli Zhan", "Zhenting Wang", "Varad Pimpalkhute", "Zhengzhong Liu", "Eric Xing", "Rupesh Srivastava"], "categories": ["cs.AI"]}, {"source": "arXiv cs.SE", "title": "GH-AWTrace: A Large-Scale Dataset of GitHub Agentic Workflow Execution Logs", "titleJa": "GH-AWTrace――GitHubのエージェンティックワークフロー実行ログ大規模データセット", "summaryHtml": "エージェンティックワークフローは、AIエージェントがスケジュールやリポジトリのイベントに応じて繰り返しのリポジトリ作業を行う仕組みである。既存研究はワークフローの定義と出力を調べるが、実行中に何が起きているかの証拠は限られていた。本論文は、その実行証拠を結びつけたデータセット「GH-AWTrace」を提示する。<br><br>データセットは、検証済みのGitHub Agentic Workflows 25,014件（5,051リポジトリ）を、4,112,526件の実行記録と562,877件の空でない実行ログアーカイブへ結びつける。実行証拠はGitHubのログ保持制限の範囲で保存され、リポジトリのメタデータと生成されたワークフロー設定にもリンクされる。<br><br>事例からは、ツール拒否、プロバイダ障害、エージェントの方針変更、エージェント間の委任といった、ログでなければ見えない事象が読み取れる。実行の失敗、ツール使用、報告された実行結果と実際のタスク進捗との関係を研究する土台となる。なおカバレッジはワークフローごとに異なり、ログは部分的な観測にとどまる。", "url": "https://arxiv.org/abs/2611.06866", "publishedAt": "2026-11-04T18:20:41Z", "timestamp": 1793816441000, "monthKey": "2026-11", "field": "cs.SE", "genre": "Vision / Multimodal", "authors": ["Jasem Khelifi", "Hao Li", "Ali Ouni", "Mohammed Sayagh", "Mohamed Aymen Saied"], "categories": ["cs.SE"]}, {"source": "arXiv cs.CV", "title": "CounterFactual Retrieval for Evidence-Aware Individual Animal Identification", "titleJa": "反事実的検索――動物個体識別の「証拠」を問う評価プロトコル", "summaryHtml": "動物の個体識別の自動化は、小規模な curated 研究から、共有ベンチマークや再利用可能な基盤モデルへと進みつつある。しかし現在の評価は、マッチの背後にある証拠を未解決のままにしている。高い検索精度は、モデルが動物の特徴を使ったのか、個体と相関する近道（ショートカット）を使ったのかを示さない。<br><br>本論文は、証拠を意識した評価プロトコル「反事実的前景検索（CFR）」を提案する。CFRは同じクエリ―ギャラリー課題を、全面画像、前景のみ、近道のみという異なる見え方で評価する。全面画像は標準の検索性能を、前景のみは前景に支えられた検索を、近道のみは背景やシルエットからどれだけ個体信号が回復できるかを測る。<br><br>これにより、検索スコアは「証拠プロファイル」へと変わる。元の画像でどれだけ性能が出るか、その性能のどれだけが動物自体を見たときに残るか、そしてどれだけが背景などの近道に依存していたか――識別モデルの信頼性を吟味する枠組みである。", "url": "https://arxiv.org/abs/2611.06864", "publishedAt": "2026-11-04T18:19:26Z", "timestamp": 1793816366000, "monthKey": "2026-11", "field": "cs.CV", "genre": "Vision / Multimodal", "authors": ["Ankit K. Upadhyay", "Aleksandr Algasov", "Ekaterina Nepovinnykh", "Fedor Zolotarev", "Tuomas Eerola", "Heikki Kälviäinen", "Charles V. Stewart", "Lukas Picek"], "categories": ["cs.CV", "cs.AI", "cs.LG"]}, {"source": "arXiv cs.RO", "title": "Rethinking Self-Repair in Code-as-Policy Agents: What Drives Retry Success?", "titleJa": "コード型ポリシーエージェントの自己修復――再試行の成功を左右するのは何か", "summaryHtml": "コードを方策とするエージェントは、実行フィードバックを使って失敗したプログラムを再試行することが多い。追加のサンプリングやタスクガイダンスも成功率を上げるため、失敗に特化したフィードバックの寄与は不明瞭だった。本研究はこの問いを、シミュレーション上のロボット操作で検証する。<br><br>固定のルックアップが失敗ラベルとAPIの種類からフィードバックテンプレートを選び、凍結されたコードモデルが場面リセットのたびに新しいプログラムを生成する。同じ252件の初期失敗に対して、Qwen2.5-Coder-7Bは5回までの再試行で85.3%を回復し、同じ再試行上限での再サンプリング（68.3%）を上回った。この優位は総トークン予算を固定しても持続した。<br><br>一方、他のエピソードからのフィードバックや固定のタスクガイダンスでも同程度の回復率が得られ、粗い失敗ラベルを一致させる利益は検出されなかった。別の検証では、最初から誘導プロンプトを使う方法がテンプレート式フィードバックと同程度の成功率を示した。「失敗特化フィードバックが効いている」という想定への実証的な問い直しである。", "url": "https://arxiv.org/abs/2611.06863", "publishedAt": "2026-11-04T18:19:24Z", "timestamp": 1793816364000, "monthKey": "2026-11", "field": "cs.RO", "genre": "Agents / Reasoning", "authors": ["Siddharth Aphale", "Ayushman Singh"], "categories": ["cs.RO"]}, {"source": "arXiv cs.CL", "title": "Balancing hierarchical representation and quantization: A performance trade-off in text embeddings", "titleJa": "階層表現と量子化のバランス――テキスト埋め込みの性能トレードオフ", "summaryHtml": "階層型テキスト埋め込みモデルは可変長の表現を提供し、量子化は数値精度を下げて計算効率を高める。両者は直交する既存の技術だが、その相互作用は十分に調べられてこなかった。本研究は、この2つの効率化手法がどう干渉するかを実証的にベンチマークする。<br><br>評価はMTEBの38タスクで、4つのTransformer系埋め込みモデルを用い、1次元・2次元の階層表現と32ビット・8ビット・バイナリ量子化を組み合わせた、タスクあたり168構成を検証する。効率の次元は分けて報告され、理論上のベクトルあたり記憶量と、エンドツーエンドの評価時間が示される。<br><br>Friedman検定とNemenyi事後分析では、int8量子化はペア分類と再ランキングでfloat32と統計的に区別がつかず、全体でも最大1.5ポイントのコストにとどまった。一方、バイナリ量子化は全タスクカテゴリで有意に悪かった。埋め込み次元を半分にすることの影響もあわせて検討されている。", "url": "https://arxiv.org/abs/2611.06859", "publishedAt": "2026-11-04T18:15:08Z", "timestamp": 1793816108000, "monthKey": "2026-11", "field": "cs.CL", "genre": "LLM / NLP", "authors": ["Kai Ponel", "Marco Polignano", "Erasmo Purificato", "Aylin Julia Temizkan", "Marco Levantesi", "Giovanni Semeraro", "Ernesto William De Luca"], "categories": ["cs.CL", "cs.IR", "cs.LG"]}, {"source": "arXiv cs.AI", "title": "CompressionBench: How can your coding agents compress LLMs?", "titleJa": "CompressionBench――コーディングエージェントにLLM圧縮を任せられるか", "summaryHtml": "再帰的自己改善には、後続のシステムが使うモデルや基盤をAIシステム自身が改善することが求められる。LLM圧縮はその具体的な効率化目標となる。事前学習済みモデルの振る舞いを、より小さなモデル記憶予算の中に保持することである。本研究は、コーディングエージェントがこの工程を自律的に遂行できるかを問う。<br><br>圧縮はターミナルタスクとして定式化される。エージェントはソースのチェックポイント、記憶容量の上限、推論環境、時間予算を与えられ、圧縮された重みと実行可能な推論コードを構築する。アルゴリズムと実験の進め方はエージェントが握り、パープレキシティのフィードバックが探索を導き、独立した検証が最終モデルを確認する。<br><br>6つのエージェントと6つのモデル×サイズ設定で、36件の提出のうち29件が検証に合格した。タスクごとに最もパープレキシティの低い設計を選ぶと、BF16比で平均3.4%のパープレキシティ増、下流精度77.33%（BF16は79.56%）となった。記録された実験の過程も分析されている。", "url": "https://arxiv.org/abs/2611.06858", "publishedAt": "2026-11-04T18:14:50Z", "timestamp": 1793816090000, "monthKey": "2026-11", "field": "cs.AI", "genre": "Vision / Multimodal", "authors": ["Xinrui Zhong", "Zhifeng Li", "Zhiming Wang", "Yongqi Liu", "Shanglin Yang", "Yang Zhou", "Zikun Li", "Zhuoming Chen", "Beidi Chen"], "categories": ["cs.AI"]}, {"source": "arXiv cs.CV", "title": "LongBanana: An Expert-Verified Benchmark for Long-Context Multi-Reference Image Synthesis", "titleJa": "LongBanana――長文脈・複数参照の画像合成を測る専門家検証ベンチマーク", "summaryHtml": "エージェント駆動の画像生成の時代に向け、本論文は長文脈・複数参照の画像合成のための、おそらく初の専門家設計・専門家検証ベンチマーク「LongBanana」を提案する。このタスクは、散らばった視覚的証拠を検索し、妨害要素を退け、実体と関係を結びつけ、複数の参照から1枚の一貫した最終画像を構成することを要求する。<br><br>LongBananaは3×3の分類体系で編成された90件の入念に設計されたタスクを含み、各タスクは約32枚の参照画像、20の制約、50の評価項目を持ち、専門家が指定した原子的評価項目は合計4,670件に上る。グラフに基づく評価設計は、各タスクを参照画像と実体―関係グラフで具体化し、ノード・エッジ・グラフ全体への義務を、内容の忠実性、関係の結合、全体制約の充足のチェックリスト項目へ変換する。<br><br>専門家のラベルには15%の二重ラベル付きサブセットが含まれ、完全一致率は89.4%だった。参照を束ねて一貫した画像を作る現行モデルの能力と限界を、細粒度に測る物差しである。", "url": "https://arxiv.org/abs/2611.06856", "publishedAt": "2026-11-04T18:11:56Z", "timestamp": 1793815916000, "monthKey": "2026-11", "field": "cs.CV", "genre": "Vision / Multimodal", "authors": ["Haoxiang Cao", "Yuxuan Zhang", "Penghui Du", "Bo Li", "Jiajiong Cao", "Yingying Fan", "Zimeng Wu", "Yifu Luo", "Mingzhe Zheng", "Junwen Miao", "Huaisong Zhang", "Yang Yao", "Yu Wang", "Dongfu Jiang", "Ping Nie", "Wenhu Chen", "Chaoqun Wang", "Changqian Yu", "Kelsey R. Allen"], "categories": ["cs.CV", "cs.CL"]}, {"source": "arXiv econ.EM", "title": "Regression with Many Generated Controls", "titleJa": "生成された統制変数が多い回帰――潜在変数の代理を大量に使う推定", "summaryHtml": "一部の共変量が内生的である線形回帰では、内生性を統制するのに十分な変数が存在しても、それ自体は観測できない潜在変数である場合がある。たとえば、異なるAI・機械学習手法でその潜在変数を安価に、しかし不完全に補完すれば、手法ごとに異なる代理変数（プロキシ）が得られる状況がこれにあたる。実務家はそうした代理変数を大量に生成できる。本研究は、そうした状況で実務家が取りうる選択肢――すべての代理変数やそこから計算した因子を統制に含める方法、操作変数推定、その非線形の変種――を、透明なモデルで比較する。<br><br>各アプローチが暗黙に狙う推定対象（エスティマンド）を導出し、それが関心のあるパラメータを回復する条件を明らかにしたうえで、実務的な推奨を示す。代理変数の扱い方によって狙う対象が変わるため、手法の選択は単なる実装の違いではなく、推定しているものの違いになる。<br><br>十分に豊かな生成統制変数の集合があれば、検証データに頼らずとも関心パラメータを一致推定できることが示された。AIが生成した代理変数を計量分析に組み込む際の理論的な足場となる研究である。", "url": "https://arxiv.org/abs/2611.06855", "publishedAt": "2026-11-04T18:10:56Z", "timestamp": 1793815856000, "monthKey": "2026-11", "field": "econ.EM", "genre": "Generative Models", "authors": ["Timothy Christensen", "Daniel Vebman"], "categories": ["econ.EM", "stat.ML"]}, {"source": "arXiv cs.CV", "title": "Visual Token Routing: Learning to keep tokens that matter", "titleJa": "Visual Token Routing――「重要なトークンを残す」ことを学ぶ視覚表現", "summaryHtml": "コンピュータ操作エージェント（CUA）は近年、いくつかの長期ベンチマークで人間を超える性能に達した。しかし計算コストが、長期タスクやビデオゲームのようなリアルタイム領域での利用を制約している。主要なボトルネックは、各スクリーンショットを数千の視覚トークンとして表現することであり、対話履歴が伸びるにつれて長い文脈へ蓄積していく。<br><br>著者らは、これらの視覚トークンの大半が、エージェントの次の行動にとって意味的に無関係か、スクリーンショット間で時間的に冗長であることを観察した。この観察に基づき、行動予測に必要な情報を保つ疎な視覚表現を学ぶ共同訓練フレームワーク「Visual Token Routing（VTR）」を提案する。<br><br>VTRでは、視覚言語モデルと軽量な時空間ルータを一緒に訓練する。ルータは現在と過去のスクリーンショットの各画像領域を調べ、その視覚トークンを残すかどうかを判断する。文脈の肥大化を抑えながら行動に必要な情報を残す設計である。", "url": "https://arxiv.org/abs/2611.06854", "publishedAt": "2026-11-04T18:10:33Z", "timestamp": 1793815833000, "monthKey": "2026-11", "field": "cs.CV", "genre": "Vision / Multimodal", "authors": ["Pranjal Aggarwal", "Sean Welleck"], "categories": ["cs.CV", "cs.LG"]}, {"source": "arXiv cs.CV", "title": "Trainspotting: Learning Object-Centric 3D Reconstruction from Found Photos", "titleJa": "Trainspotting――「拾い集めた写真」から物体中心の3次元再構成を学ぶ", "summaryHtml": "最先端のフィードフォワード再構成モデルは、野外の物体中心写真コレクションでは性能が振るわない。これらは主に、物体と環境がほぼ固定された単一セッションの撮影で訓練されており、視点だけが変わるデータを前提にしている。一方、公開写真アーカイブには別の形の多視点データがある。同じ物体や設計を、多くの人々が年月・環境・カメラを変えて、時には実物個体も変えて撮影した「拾い集めた写真（found photos）」である。<br><br>本研究は、Wikimedia Commonsから集めた12,068物体・311,886枚の写真からなるデータセット「Trainspotting」を提案する。各物体について再構成を行い、カメラ姿勢、多視点ステレオ深度、物体マスクを回復する。物体は3つのレジーム――1か所に固定された物体、場所を移動する物体、多くの実物で共有される設計――に分類される。<br><br>近年のフィードフォワード再構成モデルをTrainspottingで評価すると、深刻な失敗が明らかになった。管理された撮影とは異なる、現実の写真集合の難しさを突きつけるデータセットである。", "url": "https://arxiv.org/abs/2611.06849", "publishedAt": "2026-11-04T18:05:22Z", "timestamp": 1793815522000, "monthKey": "2026-11", "field": "cs.CV", "genre": "Vision / Multimodal", "authors": ["Hanyu Chen", "Noah Snavely"], "categories": ["cs.CV"]}, {"source": "arXiv cs.CL", "title": "Persona Perspectives: Adopting Viewpoints Reorganizes Representations in LLMs", "titleJa": "ペルソナという視点――LLMの表現は立場の採用で組み替わる", "summaryHtml": "線形プローブやスパースオートエンコーダ（SAE）など、LLMの特徴を監視する一般的な手法は、特徴が文脈を越えて一貫した表現を保つことを前提にしている。しかしLLMは異なる視点や「ペルソナ」を柔軟に採用でき、その背後には異なる概念関係の体系が示唆される。本論文は、LLMにペルソナを採用させるプロンプトが、モデルの潜在空間の表現幾何を変えるかどうかを検証する。<br><br>著者らは、リベラルと保守の政治的ペルソナを採用したモデルと2つの中立なベースラインから、9,000超の一般語と33の意味軸の表現を抽出して比較した。<br><br>結果として、ペルソナ条件づけは、語の意味軸への射影と、軸同士の整合の双方を、指定されたイデオロギーと整合する方向へ体系的に変えることが分かった。さらに、この再編成が安全性に関わる2つの特徴監視のタスクへ及ぼす影響も検証されている。特徴の監視可能性そのものがペルソナに依存するという、解釈可能性研究への示唆である。", "url": "https://arxiv.org/abs/2611.06848", "publishedAt": "2026-11-04T18:05:17Z", "timestamp": 1793815517000, "monthKey": "2026-11", "field": "cs.CL", "genre": "LLM / NLP", "authors": ["Austin C. Kozlowski", "Avital Mintz", "Madison Lee"], "categories": ["cs.CL"]}, {"source": "arXiv cs.LG", "title": "Navigating Disagreement Among Criteria for Evaluating Explanation Faithfulness", "titleJa": "説明の忠実性をどう測るか――評価基準同士の不一致をどう扱うか", "summaryHtml": "忠実性（faithfulness）は、アルゴリズムによる説明がモデルの振る舞いを正確に反映することを要求する。しかし忠実性の既存の操作化（測り方）は、同じ説明が忠実かどうかについて互いに食い違うことがあり、開発者や監査者は相争う評価の間で選択を迫られる。本論文は、評価基準同士の不一致を調査し、説明の忠実性を評価するための実践的な道筋を提示する。<br><br>著者らはまず、忠実性の操作化が互いにどう異なるかを特定する。次に「忠実性汎関数」を導入し、不一致の所在を、説明がモデルについて何を主張するのか、どの比較がその主張に関わるのか、その比較群の一致をどう集約すべきか、という点に位置づける。そして既存の評価基準をこの汎関数の内側に再構成する。<br><br>著者らの主張では、この再構成は、忠実性をモデルと説明の間の共通だが完全には仕様化されていない関係として理解することを支持する。基準間の差は、測る対象そのものの違いではなく、仕様化の選択の違いを反映しているという整理である。監査実務で評価基準を選ぶ際の理論的な足場となる。", "url": "https://arxiv.org/abs/2611.06846", "publishedAt": "2026-11-04T18:03:15Z", "timestamp": 1793815395000, "monthKey": "2026-11", "field": "cs.LG", "genre": "LLM / NLP", "authors": ["Grant Shanklin", "Jiří Němeček", "Asia Biega"], "categories": ["cs.LG", "cs.CY"]}, {"source": "arXiv cs.CV", "title": "Where to Connect? Boosting MLLMs via Dynamic Gated Pathways across ALL ViT and LLM Layers", "titleJa": "どこでつなぐか――ViTとLLMの全層を動的ゲートで結ぶMLLM", "summaryHtml": "マルチモーダル大規模言語モデル（MLLM）における中心的だが未開拓の問題は、「どこでつなぐか」である。階層的な視覚エンコーダからの視覚情報を、LLMの層ごとの意味へどう配線するか。主流のMLLMは単一層の固定された視覚表現をLLMへ注入し、全LLM層を単一の消費者として扱うため、層ごとに異なる視覚粒度への要求を無視している。近年の多層融合手法も、エンコーダ側で階層特徴を圧縮するか、あらかじめ定義した疎な層間接続に頼り、ViTとLLMの階層間の適応的な相互作用のモデル化には届いていない。<br><br>このギャップに取り組むのが、ルーティング機構「DGP（Dynamic Gated Pathways）」である。DGPはViTの全層とLLMの全層の間に全対全の接続を張り、各LLM層が文脈に応じて視覚層への選好を動的にゲートする。<br><br>視覚情報の「深さ」を層ごとに選び直せるようにすることで、単一の視覚表現の注入よりも細やかなマルチモーダル推論を目指す設計である。接続の場所そのものを学習対象にする視点が新しい。", "url": "https://arxiv.org/abs/2611.06844", "publishedAt": "2026-11-04T18:01:24Z", "timestamp": 1793815284000, "monthKey": "2026-11", "field": "cs.CV", "genre": "Vision / Multimodal", "authors": ["Yingying Yan", "Jiaqi Tang", "Wei Wei", "Qianzhou Wang", "Lei Zhang", "Jianmin Chen", "Yuyang Xia", "Botong Geng", "Jinjian Wu", "Qifeng Chen"], "categories": ["cs.CV"]}, {"source": "arXiv cond-mat.mtrl-sci", "title": "Thermally Conditioned Time-Series Forecasting of Grain Growth in Polycrystalline Materials", "titleJa": "熱条件を組み込んだ多結晶材料の結晶粒成長の時系列予測", "summaryHtml": "熱処理中の結晶粒成長は多結晶材料の微細組織を強く左右し、ひいては機械的性質を決める。フロントトラッキングやフロントキャプチャリングの数値シミュレーションは結晶粒成長を正確に記述できるが、計算コストが高く、長い熱サイクルや非等温サイクルへの適用は限られていた。先行研究では、等温条件のもとで結晶粒径分布を時系列として扱い、リカレントニューラルネットワークでその発展を予測することに成功しており、高コストなPDEシミュレーションではなく数秒で完全な成長軌跡を生成できた。<br><br>本研究はこの予測フレームワークを再定式化し、モデルアーキテクチャへ熱情報を明示的に組み込むことで非等温条件へ対応させる。結晶粒径分布は畳み込みニューラルネットワークで符号化され、熱に関する記述子も入力される。<br><br>実プロセスで一般的な、温度が時間とともに変わる熱処理条件でも結晶粒成長を高速に予測できるようにする試みであり、材料設計のシミュレーションコストを下げる方向の研究である。", "url": "https://arxiv.org/abs/2611.06843", "publishedAt": "2026-11-04T17:59:26Z", "timestamp": 1793815166000, "monthKey": "2026-11", "field": "cond-mat.mtrl-sci", "genre": "Generative Models", "authors": ["Eliane Younes", "Elie Hachem", "Marc Bernacki"], "categories": ["cond-mat.mtrl-sci", "cs.LG"]}, {"source": "arXiv cs.AI", "title": "ServerBench: How can your coding agents design specialized LLM serving systems?", "titleJa": "ServerBench――コーディングエージェントにLLMサービングシステムを設計させられるか", "summaryHtml": "LLMコーディングエージェントは実験を通じてソフトウェアを開発する。その力を使えば、自分たちの運用を支えるサービングシステム自体を設計させることもできる。有効なサービングには、セッション依存性、レイテンシ制約、正しさの要件のもとで、実装と運用の判断を調整することが求められる。本論文は、完全で特化したLLMサービングシステムのエージェント設計を測るベンチマーク「ServerBench」を提案する。<br><br>エージェントは共通の目的――「ドルあたりドル」、すなわちGPUコスト1ドルあたりの、レイテンシ条件を満たしたトークン価値――に対して実験を行う。状態を持つリプレイがセッション依存性を保ち、独立した検証が提出されたシステムを確認する。<br><br>11のコーディングエージェントモデルと3つの配備条件での評価では、Claude Sonnet 5.5がGemma E4Bで2.97ドル/ドルを達成し、vLLM参照実装の4.87倍となった。33回の実行のうち22回が検証済みシステムを生み、13回が最強のベースラインを上回った。分析からは、高価値な設計に共通する3つの知見が特定されている。", "url": "https://arxiv.org/abs/2611.06841", "publishedAt": "2026-11-04T17:59:07Z", "timestamp": 1793815147000, "monthKey": "2026-11", "field": "cs.AI", "genre": "LLM / NLP", "authors": ["Xinrui Zhong", "Zhiming Wang", "Yongqi Liu", "Zhaohui Wang", "Shanglin Yang", "Zikun Li", "Zhuoming Chen", "Beidi Chen"], "categories": ["cs.AI"]}, {"source": "arXiv cs.CV", "title": "Same Layout, Different Count: What Number Words Do Past Ten in Text-to-Image Models", "titleJa": "同じレイアウト、違う数――テキスト画像生成モデルで数詞は「10を超えたら」何をするか", "summaryHtml": "SD3.5-Mediumに物体を12個描かせ、同じ初期ノイズから25個に変えてみる。画像のレイアウトは保たれるが、数は新しいランダムシードのときと同じくらいしか変わらず、方向も一貫しない。本研究は、オープンなテキスト画像生成モデル5つについて、要求がおよそ10個を超えたときに数詞が何をするかを調べる。<br><br>物体と初期ノイズを固定し、一度に1つだけを変えながら、要求を見ていない人々が3,088枚の画像を数えた。すべてのモデルは小さな群衆では数に従うが、それには限界（リーチ）がある。SD3.5-MとFLUX.1-devは10を少し超えたところで従わなくなり、FLUX.2 [klein] とQwen-Imageは25までゆるやかに従う。<br><br>SD3.5-Mのリーチを超えると、初期ノイズの粗い部分が画像の構図を決めるが、物体の数は決めない。画像の1/8より細かいノイズだけを描き直してもレイアウトは新しい数のときと同じくらい保たれる。数詞が「構図の種」として働く一方で、個数の精密な制御には届いていない実態が浮かぶ。", "url": "https://arxiv.org/abs/2611.06840", "publishedAt": "2026-11-04T17:57:53Z", "timestamp": 1793815073000, "monthKey": "2026-11", "field": "cs.CV", "genre": "Vision / Multimodal", "authors": ["Liang Yue", "Eric A. Vance"], "categories": ["cs.CV", "cs.LG"]}, {"source": "arXiv cs.CL", "title": "Before You Continue: Evaluating Time-Sensitive Safety Awareness in Conversational Assistants", "titleJa": "続ける前に――会話アシスタントの時間依存の安全意識を評価する", "summaryHtml": "LLMアシスタントは、時間に依存する制約を伴う日常活動をますます手伝うようになっている。しかしユーザが後のリクエストでその制約に触れるとは限らず、アシスタントは自分で気づいて助言を調整する必要がある。この能力を評価するために、本論文はベンチマーク「TASC（会話における時間的行動安全性）」を提案する。<br><br>TASCは128のテンプレートから作られた3,418件の入力と、経過時間の計算能力と、その情報を適用する能力を比較するための33のシナリオ群からなる。<br><br>13モデルでの評価では、提案された行動が規則に違反するケースで、アシスタントが時間依存の制約を考慮できたのは30.5%にとどまり、不要な警告はまれだった。より重要なのは、正しく時間を計算できていながら制約の適用に失敗するケースが62.1%あったことである。「計算できること」と「対話の中で使うこと」の間の溝が、安全上の課題として浮き彫りになった。", "url": "https://arxiv.org/abs/2611.06839", "publishedAt": "2026-11-04T17:54:49Z", "timestamp": 1793814889000, "monthKey": "2026-11", "field": "cs.CL", "genre": "LLM / NLP", "authors": ["Peidi Dong", "Yunze Xiao", "Yu-Lin Tsai", "Yichen Zheng", "Heyuan Huang", "Weihao Xuan", "Mark Dredze", "Jen-tse Huang"], "categories": ["cs.CL"]}, {"source": "arXiv cs.CV", "title": "Context-Aware Autoregressive Image Generation for Emerging Reasoning Properties", "titleJa": "文脈を意識した自己回帰画像生成――創発する推論特性に向けて", "summaryHtml": "自己回帰型の画像生成は近年、競争力のある視覚生成パラダイムとして台頭してきた。しかし生成の順序は、次パッチ予測、ランダム順予測、特定スケールでの一括生成のように、あらかじめ決められたものかヒューリスティックなものが多く、これらの戦略はモデルが画像の重要な構造的依存性を見落とす原因となり、構造的な頑健性と推論能力の双方を制限していた。<br><br>本研究は、全体の文脈と現在の局所情報に基づいてモデルが次のトークン位置を動的に決める、文脈を意識した自己回帰生成フレームワークを提案する。固定やランダムの順序に従うのではなく、生成過程そのものが画像構造と意味的な依存関係へ適応する。<br><br>広範な実験では、文脈を意識した生成が、マスク型自己回帰を含む異なる画像自己回帰パラダイムにわたって構造的頑健性を有意に改善することが示された。生成順序を設計対象として捉え直す研究である。", "url": "https://arxiv.org/abs/2611.06838", "publishedAt": "2026-11-04T17:54:14Z", "timestamp": 1793814854000, "monthKey": "2026-11", "field": "cs.CV", "genre": "Vision / Multimodal", "authors": ["Jixuan Ying", "Haoyu Liu", "Timing Yang", "Tingyu Zhu", "Predrag Neskovic", "Anand Bhattad", "Cihang Xie", "Zeyu Zheng", "Alan Yuille", "Feng Wang"], "categories": ["cs.CV"]}, {"source": "arXiv cs.LG", "title": "Context--Answer Metamodels: Forecasting LLM Activations Before the First Answer Token", "titleJa": "文脈―応答メタモデル――最初の応答トークンの前にLLMの活性化を予測する", "summaryHtml": "確率的デコーディングのもとでは、1つの文脈から言語モデルは多様な応答を引き出しうる。このばらつきの特性評価には通常、多数の高コストな自己回帰ロールアウトが必要で、しかも各 rollout が示すのは1つの実現だけである。本研究は、文脈を読む際に生じる活性化から、モデルのロールアウト活性化を直接予測できるかを問う。<br><br>著者らは、文脈の活性化系列を、平均プールされた応答活性化の点予測または分布予測へ写す「文脈―応答メタモデル」を訓練した。<br><br>主な知見は4つある。(i) 検討した4つのメタモデル族は平均プール応答活性化を高い忠実度で予測し、分布メタモデルはロールアウトの変動も捉える。(ii) 訓練集合が50万プロンプトまで増えるにつれて性能が向上し、ドメイン外データセットへもゼロショットで汎化する。(iii) 予測には行動を予測する信号が保持される。(iv) Qwen2.5の文脈活性化から応答活性化が予測できる。多数のサンプリングをせずに応答分布の見通しを得る道筋である。", "url": "https://arxiv.org/abs/2611.06837", "publishedAt": "2026-11-04T17:53:52Z", "timestamp": 1793814832000, "monthKey": "2026-11", "field": "cs.LG", "genre": "LLM / NLP", "authors": ["Tommy He", "Thomas Jiralerspong"], "categories": ["cs.LG", "cs.AI"]}, {"source": "arXiv cs.CL", "title": "LooM: Loop-Invariant Memory for Causal Encoder-Decoder Language Models", "titleJa": "LooM――因果的エンコーダ・デコーダ言語モデルのためのループ不変メモリ", "summaryHtml": "ループ型Transformerは共有層を再実行することで実効的な深さを増やすが、採用を妨げる3つの限界がある。メモリがループ回数とともに増えること、計算量の調整がブロック単位でしかできないこと、訓練後にループ回数を変えにくいことである。本論文はそのそれぞれに対処する「LooM（ループ不変メモリ）」を提案する。<br><br>因果的エンコーダ・デコーダ（CED）において、LooMは最初のデコーダ層以降だけをループさせ、それらはトークンごとに一度だけ書かれる大域メモリを読む。各層はトークンのキー・バリュー（KV）エントリを最初の訪問時にだけ公開するため、キャッシュはループ回数とともに増えない。<br><br>各層が独立にループすることで、トークンあたり3〜21回の層実行というあらゆる予算が可能になり、予算をランダムにサンプリングして訓練した1つのモデルが、ルータなしで全予算をカバーする。十分なループ数では、同じデータで訓練した単一パスのベースラインを、言語モデリング、ゼロショット精度、長文脈パープレキシティで上回った。", "url": "https://arxiv.org/abs/2611.06835", "publishedAt": "2026-11-04T17:52:11Z", "timestamp": 1793814731000, "monthKey": "2026-11", "field": "cs.CL", "genre": "LLM / NLP", "authors": ["Lele Yang", "Muxi Diao", "Zhonghao Yan", "Jiankang Chen", "Bin Wen", "Tingting Gao", "Wentao Zhang", "Kongming Liang", "Zhanyu Ma", "Weiran Xu"], "categories": ["cs.CL"]}, {"source": "arXiv stat.ML", "title": "Alignment Myopia in Generative AI", "titleJa": "生成AIのアラインメント近視――長期的な人間の幸福へ視野を広げる", "summaryHtml": "現在の生成AIのアラインメントは、目先の会話満足度を優先する近視的なパラダイムに依拠している。短い時間軸のフィードバックに頼るこのアプローチは、持続的な人間とAIの相互作用がもたらす深刻で長期的な外部性を無視しており、認知の萎縮、社会的浸食、人間の主体性の低下といった望ましくない帰結につながりうる。<br><br>これに対処するため著者らは、AIが時間をかけて人間の経験をどう作り変えるかを織り込んだ、長期的な時間軸のアラインメントへのパラダイム転換を提案する。人間の幸福の4つの側面にわたって、AI利用の短期的な有用性と長期的なコストの間の緊張関係を地図化し、現在の報酬モデルが捉え損ねている帰結を明らかにする。<br><br>結論として、単純な選好最適化を超え、複雑な時間スケールを操縦しながら長期的な人間の幸福を積極的に育むアラインメント戦略への移行を主張する。アラインメント研究の時間軸そのものを問う、概念的な論考である。", "url": "https://arxiv.org/abs/2611.06830", "publishedAt": "2026-11-04T17:44:07Z", "timestamp": 1793814247000, "monthKey": "2026-11", "field": "stat.ML", "genre": "Generative Models", "authors": ["Remi Denton", "Aida Davani", "Cynthia L Bennett", "Michael Madaio", "Roma Patel", "Himabindu Lakkaraju"], "categories": ["stat.ML", "cs.CY", "cs.LG"]}, {"source": "arXiv cs.AR", "title": "Enabling AWS Cloud FPGA Development Using High-Level Vitis HLS", "titleJa": "高水準Vitis HLSでAWSクラウドFPGA開発を可能にする", "summaryHtml": "AWSのFPGAが利用可能になって8年になるにもかかわらず、学術文献には高水準言語からAWS EC2 F2クラウドFPGA基盤上で機械学習モデルを開発する完全なワークフローが欠けていた。本研究は、Vitis HLSからHDKを経てAFIへ至る橋渡しを実装したツールチェーンを提示する。誤りの局所化を助ける4段階の方法論――FP32のPyTorch、ビット精度の量子化Python、HLSのCシミュレーション、物理FPGA――も導入し、FPGA特有の回路誤りにも対応する。<br><br>これらの道具により、コーディングエージェントがユーザの指示からFPGA設計を実効的に実装し、必要に応じてテストとデバッグを行えるようになる。配備ワークフロー、タイミング収束の戦略、実践上決定的に重要だったHLSエンジニアリングの判断も記録されている。<br><br>検証には、住所の固有表現認識向けにファインチューニングしたTinyBERTを用い、埋め込み層と4つのエンコーダ層のうち第1層をFPGAハードウェアへ実装した。重みはホストDRAMからストリーミングする構成で、性能はCPU・GPU実装を下回ったが、その原因と今後の方向性も議論されている。", "url": "https://arxiv.org/abs/2611.06829", "publishedAt": "2026-11-04T17:44:04Z", "timestamp": 1793814244000, "monthKey": "2026-11", "field": "cs.AR", "genre": "LLM / NLP", "authors": ["David Rostcheck"], "categories": ["cs.AR", "cs.AI", "cs.LG"]}, {"source": "arXiv cs.LG", "title": "Systolic Linear Attention: Co-Designing Tile-Grouped Gated Delta Attention for TPUs", "titleJa": "Systolic Linear Attention――TPU向けにタイル化ゲート付きデルタ注意を協調設計する", "summaryHtml": "Gated DeltaNet（GDN）やKimi Delta Attention（KDA）、GDN-2といったゲート付きデルタ型の線形注意層はGPU向けに調整されている。GPUでは小さなテンソルコアタイルと高速なベクトルレジスタにより、チャネルごとの減衰リスケーリングやブロック内の逐次解法が安く済む。一方、Google TPUは計算を幅256×256のシストリック行列ユニットに集中させ、ベクトルユニットは相対的に遅いため、これらの層をそのまま移植すると各行列タイルの半分が空き、ベクトル演算がボトルネックになる。<br><br>本論文は、行列ユニットを中心にゲート付きデルタ注意を作り替えた「Systolic Linear Attention（SLA）」を提示する。キーを256へ広げて値ヘッドをグループ化し、減衰ゲートを4つの64チャネルタイルにまとめ、チャンク解法全体を単一の融合カーネル内のブロック行列積で計算する。<br><br>TPU v7xでは、完全なSLA-R4層がオープンソースのTokamax KDAカーネルより1.6〜2.5倍高速に動作した（厳密なチャンク逆行列でも1.4〜2.4倍）。ハードウェアの特性に合わせた注意機構の再設計である。", "url": "https://arxiv.org/abs/2611.06828", "publishedAt": "2026-11-04T17:42:58Z", "timestamp": 1793814178000, "monthKey": "2026-11", "field": "cs.LG", "genre": "LLM / NLP", "authors": ["Gagik Amirkhanyan", "Nuojin Cheng"], "categories": ["cs.LG"]}, {"source": "arXiv cs.AI", "title": "Rules, Traces and Routing Statistics: Training and Calibration Data for Open Models on ARC-AGI-2", "titleJa": "ルール・軌跡・ルーティング統計――ARC-AGI-2でオープンモデルに効く訓練・較正データ", "summaryHtml": "本研究は、オフラインで4基のL4 GPUを使い最大12時間までという条件のもと、3つのオープンモデルがARC-AGI-2のタスクを解くのに、どんな訓練・較正データが効くかを調べる。データは公開タスクでオフライン比較され、隠された準非公開タスク120件での189回の実行が報告される。<br><br>NVARCのQwen3-4Bグリッドモデルについては、型付き言語による実行可能なルール12,000件と95,993件のタスクからなるコーパスを構築した。ルールは固定プローブ集合での振る舞いが既存の全ルールと異なる場合にのみ採用され、タスクは競合ルールの候補を反証し、12の近道ソルバを破る場合にのみ採用される。1,920件の実タスク記録での継続ファインチューニングと4GPUスケジューリングの改訂により、準非公開スコアは28.96（公開モデル平均）から33.06（5回平均、最良34.86）へ上がった。合成タスクだけで訓練したチェックポイントは、95,993件すべてを使っても実タスクモデルを上回らなかった。<br><br>Qwen3.8-27Bの推論モデルについても、自身の軌跡を用いたファインチューニングが検討されている。「データの量より、実タスクとの適合と選別が効く」という実証である。", "url": "https://arxiv.org/abs/2611.06827", "publishedAt": "2026-11-04T17:41:09Z", "timestamp": 1793814069000, "monthKey": "2026-11", "field": "cs.AI", "genre": "LLM / NLP", "authors": ["Nguyen Minh Thang", "Trinh Thi Phuong"], "categories": ["cs.AI"]}, {"source": "arXiv quant-ph", "title": "GFlowQEC: Generative Flow Networks that Learn to Sample Quantum LDPC Codes", "titleJa": "GFlowQEC――生成フローネットワークで量子LDPC符号をサンプリングする", "summaryHtml": "実際のデバイス向けに量子誤り訂正符号を選ぶには、候補を回路レベルのシミュレーションで採点する必要があるが、その計算は遅く、数百件しか実行できない。だからこそ評価1回1回が貴重であり、探索は「支払った評価あたり何件の良い符号を見つけたか」で judged される。少数の群要素から作られる量子LDPC符号は多くの論理量子ビットを守るが、良いものは巨大な空間の中では稀である。<br><br>本論文は、量子符号設計のための、おそらく初の生成フローネットワーク（GFlowNet）「GFlowQEC」を提案する。符号を群要素1つずつ組み立て、スコアの冪に比例する確率で符号を提案するよう学習する。過去の探索のスコアで一度訓練して凍結し、180物理量子ビットのリフテッド積符号を、距離で採点しながら提案させる。<br><br>有料の呼び出しごとに10件の抽選を順位付けすると、GFlowQECは調整済みの並列テンパリングより2倍を超える数の、新しい最高スコア級の符号（訓練に使われたどれとも非同値なもの）を見つけた。評価コストの高い探索問題への生成モデルの応用である。", "url": "https://arxiv.org/abs/2611.06819", "publishedAt": "2026-11-04T17:31:57Z", "timestamp": 1793813517000, "monthKey": "2026-11", "field": "quant-ph", "genre": "Generative Models", "authors": ["Nuno Batista", "Gabriel Falcao", "Penousal Machado"], "categories": ["quant-ph", "cs.LG"]}, {"source": "arXiv cs.CV", "title": "Open-HumanScale: An Open Recipe for Scaling Human and Robot Experience for Embodied Foundation Models", "titleJa": "Open-HumanScale――人とロボットの経験を50,000時間へ拡大する公開レシピ", "summaryHtml": "一人称の人間動画は、ロボット学習のための操作事前知識の、拡張可能な供給源である。しかし生のデータ規模を汎化可能なロボットポリシーへ結びつけるには、厳密なデータキュレーションと訓練レシピが要る。本論文は、一人称事前学習を50,000時間まで拡大するための初の完全公開レシピ「Open-HumanScale」を提案する。その中核は、手の動きと自然言語で密に注釈された一人称動画コーパス「Open-HumanScale-50K」である。<br><br>このコーパスを使い、著者らは純粋な人間データの事前学習を閉ループのシミュレーション評価で系統的に検証し、事前学習データの時間数と下流のロボット成功率を結ぶ、経験的な対数線形のスケーリング則を発見した。<br><br>この知見に基づき、50,000時間の一人称人間動画だけで事前学習した世界―行動モデル「HumanWAM-Vanilla」を開発した。ロボットの事後訓練を施すと、RoboTwin 2.0のClean2Cleanで92.08%、Clean2Randomで68.88%の成功率に達した。人間動画からの事前学習をどこまで押し上げられるかを示す公開基盤である。", "url": "https://arxiv.org/abs/2611.06817", "publishedAt": "2026-11-04T17:31:35Z", "timestamp": 1793813495000, "monthKey": "2026-11", "field": "cs.CV", "genre": "Vision / Multimodal", "authors": ["Juncheng Ma", "Jiaxin Li", "Jiankai Tu", "Bo Liang", "Guodong Lv", "Yufan Deng", "Junzhe Tang", "Liangzhu Yang", "Chen Bian", "Zicong Cao", "Baohao Zhu", "Jianxin Bi", "Tengfei Yan", "Yinyuan Zhang", "Kewei Zhang", "Xinglong Chen", "Kaiqi Chen", "Duomin Wang", "Xiaotian Tang", "Liang Tan", "Li Li", "Yuan Xu", "Haosen Yang", "Yuqi Wang", "Jingfei Xia", "Songyan Huang", "Zhiyang Dou", "Zhen Dong", "Enze Xie", "Tat-Seng Chua", "Daquan Zhou"], "categories": ["cs.CV"]}, {"source": "arXiv cs.CL", "title": "SAUCE: Summary Analysis Using Conversation Entailment", "titleJa": "SAUCE――会話含意で要約を分析する、参照不要の事実ベース評価", "summaryHtml": "明確な最終目標を持たない会話の要約と評価には課題が残る。本論文は、言語横断の会話音声要約のための、参照不要で事実ベースの評価パイプライン「SAUCE」を提案する。SAUCEは、会話とテキストの間の含意（entailment）を通じて、要約の正確さと事実のカバレッジを測る。<br><br>著者らはSAUCEを複数の一般的な要約指標と比較し、文字起こしや翻訳の誤りによる情報損失の捕捉や、壊れた要約の特定における有効性を示した。<br><br>決定的に重要なのは、ブラックボックスなLLM評価器や密な埋め込み指標と違い、SAUCEが本来的に説明可能であることである。要約スコアを離散的で検証可能な事実へ対応づけるため、利用者は正確なハルシネーションや脱落をピンポイントで特定できる。この解釈可能性が、開発者によるLLMの振る舞いの系統的なプロファイリングを助ける。音声対話の要約評価における、監査可能性を重視した設計である。", "url": "https://arxiv.org/abs/2611.06812", "publishedAt": "2026-11-04T17:25:40Z", "timestamp": 1793813140000, "monthKey": "2026-11", "field": "cs.CL", "genre": "LLM / NLP", "authors": ["Man-Ling Sung", "Hemanth Kandula", "Jeff Ma", "William Hartmann", "Matthew Snover"], "categories": ["cs.CL", "eess.AS"]}, {"source": "arXiv cond-mat.mtrl-sci", "title": "Evolutionary Design of Interpretable Spatial Descriptors for Structure-Property Relationship Discovery", "titleJa": "構造―物性関係の発見に向けた、解釈可能な空間記述子の進化的設計", "summaryHtml": "構造と物性の予測は、分子活性や材料物性から顕微鏡で測る局所的な機能応答まで、機械学習の古典的な課題である。画像ベースの回帰では、予測に使える情報を決める選択が2つある。画像近傍の大きさと、その内部に保持する空間解像度である。小さな近傍は関連する周囲構造を取りこぼし、大きく細かくサンプルした近傍は冗長で無関係な情報を招きうる。<br><br>本研究は、局所スペクトルとヒステリシスループの予測のための空間記述子を構築する枠組みを開発する。回帰モデルをベンチマークし、SHAPマップで空間的な寄与を調べ、パッチサイズと圧縮の影響を探って、予測精度と記述子の次元数との関係を明らかにする。<br><br>さらに遺伝的アルゴリズムを用いて、空間分割と測定の割り当てを最適化し、解釈可能性を保ちながら予測に効く空間記述子を進化的に設計する。記述子の「設計」そのものを最適化対象にするアプローチである。", "url": "https://arxiv.org/abs/2611.06811", "publishedAt": "2026-11-04T17:25:10Z", "timestamp": 1793813110000, "monthKey": "2026-11", "field": "cond-mat.mtrl-sci", "genre": "Vision / Multimodal", "authors": ["Aditya Raghavan", "Sergei V Kalinin"], "categories": ["cond-mat.mtrl-sci", "cs.LG"]}, {"source": "arXiv cs.CL", "title": "LLMs Don't Know What They Know: Benchmarking Temporal Self-Knowledge for Financial Backtesting", "titleJa": "LLMは自分が何を知っているかを知らない――金融バックテストのための時間的自己知識ベンチマーク", "summaryHtml": "LLMの金融バックテストが意味を持つのは、モデルが予測を求められている結果をすでに知らない場合に限る。実務家はこれを、ベンダが公表する知識カットオフを信じる、モデル自身に何を知っているか尋ねる、過去の日付時点で答えるよう指示する、といった方法で防ごうとしてきた。本論文は、これらの安全策が信頼できるかを検証する。<br><br>著者らは、1999年から2026年の日付つき米国事実2,226件（月次マクロ経済系列、月末株価、連邦準備制度の決定をカバー）からなるベンチマーク「FinDendro」を提案する。各事実は4つのプロンプトを生む。値そのものを問う質問、日付を宣言せずに知っている/推測していると主張を対にした想起と予測の質問、そして歴史的な宣言日付つきの予測質問である。持続性と支配的結果への統制により、偶然の正解率は0.27付近に保たれる。<br><br>結果として、ほとんどのフロンティアモデルで自己申告は知識を過小に示した。たとえばGPT-5は、知らないと申告した範囲でも高い割合で正解している。「モデルに聞けば分かる」という前提の危うさを、バックテストの文脈で示した研究である。", "url": "https://arxiv.org/abs/2611.06808", "publishedAt": "2026-11-04T17:24:02Z", "timestamp": 1793813042000, "monthKey": "2026-11", "field": "cs.CL", "genre": "LLM / NLP", "authors": ["Lingfei Qian", "Yan Wang", "Xueqing Peng", "Yupeng Cao", "Yuechen Jiang", "Zhuohan Xie", "Anke Xu", "Wenbo Cao", "Jiarui Chen", "Zehan Li", "Jimin Huang", "Alejandro Lopez-Lira", "Yuehua Tang", "Sophia Ananiadou", "Jian-Yun Nie"], "categories": ["cs.CL"]}, {"source": "arXiv cs.CL", "title": "Measuring Risk, Not Harm: Detecting Psychological Harm Risk Factors in LLM Conversations", "titleJa": "害ではなくリスクを測る――LLM会話における心理的危害のリスク要因検出", "summaryHtml": "LLMとの対話による心理的危害は、繰り返しの対話の中で現れ、利用者個人の主観的な文脈に強く依存するため、直接監視することはできない。本論文は「害ではなくリスクを測る」ことを提案する。AIの応答レベルで観測可能な、心理的危害のリスク要因となるAIの振る舞いを検出し、その信号を集約して長期的な監視を支えるという発想である。<br><br>著者らは8つのそのような振る舞いを操作化し、47,062件のAI応答と373,873件の応答―要因ラベルからなる合成マルチラベルコーパスを構築した。検証と評価のために対象を絞った人手注釈も用意されている。<br><br>訓練済みの埋め込みベース分類器、LLMによる直接判定、分類器と判定器のカスケードが比較された。すべての検出器はモデル非依存で、LLMの出力だけに働き、内部状態へのアクセスを必要としない。検出器は、先行研究の複数の分布外の人間―AI会話データセットへも適用されている。危害そのものではなく前兆を捉える、安全性監視の実務的な設計である。", "url": "https://arxiv.org/abs/2611.06806", "publishedAt": "2026-11-04T17:22:23Z", "timestamp": 1793812943000, "monthKey": "2026-11", "field": "cs.CL", "genre": "LLM / NLP", "authors": ["Nil-Jana Akpinar", "Eugenia Kim", "Natalie Isak", "Amanda Minnich", "Victoria Westerhoff", "Matthew Dressman"], "categories": ["cs.CL", "cs.CY"]}, {"source": "arXiv cs.AI", "title": "Task-Efficient Agent Evaluation Using Cached Traces", "titleJa": "キャッシュした軌跡でエージェント評価を効率化する", "summaryHtml": "効率的なベンチマークは、少数のタスク実行からシステムの完全なベンチマーク性能を推定する。標準的な手法は、すでに評価された参照システム群の実行の二値の正しさだけに依拠する。しかしエージェントシステムは実行ごとに豊かな軌跡（トレース）を生み、それは能力について遥かに多くを明かしうる。この情報を活かすには、有用な軌跡表現が必要である。<br><br>本論文は、軌跡を、LLMで構造化要約を抽出し、標準的なテキストエンコーダで埋め込むことで表現する手法を提案する。この表現は、正しさとタスク関連の信号を保ちながら、生の軌跡埋め込みを支配するシステムの同一性、モデルファミリー、実行ハーネス関連の信号の存在を最小化する。<br><br>全参照システムの各タスク実行についてこの表現が得られれば、システムの低次元表現を構築でき、新しいシステムのスコアを、少数の実行から予測できる。評価コストの高いエージェント時代のベンチマーク設計に対する提案である。", "url": "https://arxiv.org/abs/2611.06803", "publishedAt": "2026-11-04T17:20:09Z", "timestamp": 1793812809000, "monthKey": "2026-11", "field": "cs.AI", "genre": "LLM / NLP", "authors": ["Ben Johnson", "Hayden Helm"], "categories": ["cs.AI"]}, {"source": "arXiv cs.RO", "title": "ConDR: Conservative Reachability through Neural Hamilton-Jacobi Subsolutions", "titleJa": "ConDR――ニューラルHJ部分解による保守的な到達可能性解析", "summaryHtml": "ハミルトン・ヤコビ（HJ）到達可能性は、最悪ケースの外乱のもとで失敗へ追い込まれうる力学系の不安全な状態を特定する。しかし古典的な格子ベースのソルバは、状態次元に対して指数的にスケールする。DeepReachは格子を、HJ-Isaacs（HJI）変分不等式（VI）で訓練したニューラル価値関数に置き換えて拡張性を高めたが、残差の両側を等しく罰するため、学習された値が真の値を上回り、不安全な状態が安全と誤分類されうる。<br><br>本論文は「ConDR（保守的DeepReach）」を提案する。学習された不安全集合が真の集合を含むよう、HJI VIの部分解を学ぶことを目指す。ConDRは障害物分岐と終端条件を構成上強制し、一方向の損失でHJI残差を安全マージンεだけゼロ未満へ押し下げ、すべてを不安全と分類する自明解を防ぐ。<br><br>マージン付き問題の厳密解についての証明も与えられている。安全性の文脈で「誤って安全と判定する」方向の誤りを構造的に抑える設計であり、学習ベース到達可能性解析の信頼性を高める試みである。", "url": "https://arxiv.org/abs/2611.06802", "publishedAt": "2026-11-04T17:18:50Z", "timestamp": 1793812730000, "monthKey": "2026-11", "field": "cs.RO", "genre": "Generative Models", "authors": ["Kendra Givens", "Taylor T. Johnson", "Bryan C. Ward", "Thomas Beckers"], "categories": ["cs.RO", "cs.LG", "eess.SY"]}, {"source": "arXiv cs.LG", "title": "Message-passing graph persistence", "titleJa": "メッセージパッシング型グラフ持続性――位相的記述子へ伝播を組み込む", "summaryHtml": "メッセージパッシング型グラフニューラルネットワーク（GNN）の表現力は、1次元Weisfeiler-Lemanテストによって制限される。持続的ホモロジー（PH）はGNN表現を補完できる位相的記述子を与えるが、既存の手法は通常、表現学習の過程とは別に持続性を計算していた。本論文は、メッセージパッシングをグラフフィルトレーションへ組み込んだ位相的記述子の族「メッセージパッシング型グラフ持続性（MGP）」を提案する。<br><br>各フィルトレーション段階で、ノード埋め込みは現在の部分グラフを使って更新され、持続性イベントと結びつけられる。これらの埋め込みは、持続性計算における連結成分の代表元も決める。<br><br>著者らは、MGPがグラフ同型のもとで不変であること、そして拡張元であるPHベースの記述子よりも厳密に表現力が高いことを証明した。MGPは表現力ベンチマークと、複数のグラフ分類・回帰タスクで評価されている。位相データ解析とGNNを、学習の内側で結びつける試みである。", "url": "https://arxiv.org/abs/2611.06801", "publishedAt": "2026-11-04T17:18:34Z", "timestamp": 1793812714000, "monthKey": "2026-11", "field": "cs.LG", "genre": "Scientific AI", "authors": ["Jorge Luiz Franco", "Arthur Queiroz Moura", "Moacir Ponti", "Amauri Souza"], "categories": ["cs.LG", "cs.AI", "stat.ML"]}, {"source": "arXiv cs.CV", "title": "VA-TDM: A Unified View for Improving Few-Step Diffusion Models by Velocity Adversarial Distillation", "titleJa": "VA-TDM――速度場の敵対的蒸留で少数ステップ拡散モデルを改善する統一的視点", "summaryHtml": "少数ステップへの蒸留は、拡散モデルとフローモデルによる効率的な生成を可能にするが、わずかなサンプリングステップで品質を保つことは依然として難しい。スコア蒸留による分布マッチング手法は強固な土台を提供するが、生徒（student）の変化する分布を正確に追跡することに依存している。少数ステップサンプリングの中間生成ステップでは、生徒のスコア推定が難しく、一般に使われる推定器は、生徒の更新に使われる分布とは別の分布を記述してしまうことがある。<br><br>フローマッチングは、生徒のサンプリング過程から構築される速度場を通じた、より柔軟な教師づけを可能にする。この視点に立ち、本論文は「速度場敵対的蒸留（VAD）」を提案する。学習された批評家（critic）が生徒と教師の場を比較し、その不一致を学習へのフィードバックに変える。<br><br>VADはスコア蒸留、Fisherベースのマッチング、モーメントマッチングを統一し、それぞれがどう位置づくかも説明する。少数ステップ生成の品質改善を、一つの枠組みで整理する研究である。", "url": "https://arxiv.org/abs/2611.06796", "publishedAt": "2026-11-04T17:14:20Z", "timestamp": 1793812460000, "monthKey": "2026-11", "field": "cs.CV", "genre": "Vision / Multimodal", "authors": ["Yihong Luo", "Tianyu Pang", "Tianyang Hu"], "categories": ["cs.CV"]}, {"source": "arXiv cs.LG", "title": "Transforming Integer Grids to Spatial Intuition: Perception, Not Planning, Governs ARC-AGI-3", "titleJa": "整数格子を空間的直観へ――ARC-AGI-3を支配するのは計画ではなく知覚", "summaryHtml": "サンプル効率の高い流動的知能には、見慣れない対話的環境の作動モデルを素早く形作るエージェントが必要である。ARC-AGI-3は、指示のない視覚ゲームでこれをテストし、相対的人間行動効率（RHAE）で採点する。この指標は探索の無駄を二乗で罰する。フロンティアモデルが生の整数格子を読むと、直列化によって空間トポロジーが壊れ、基本的な境界や対称性を再発見するために数百の行動を費やしてしまう。<br><br>本論文は、ARC-AGI-3における対話的推論を支配するのは計画能力ではなく空間知覚だという前提で構築された、オープンウェイトのエージェント「SARBLOH」を提案する。パラメータを持たないO(HW)の知覚エンジンが、各フレームを35ミリ秒で、双方向の時間追跡を備えた物体目録、証明済みの不変量とアフォーダンス仮説を分ける幾何学的ブリーフィング、そして注釈付きキャンバスへ変換する。<br><br>コードをアクションとするランタイムと組にすることで、エージェントは低レベルの手ではなくアルゴリズム的な仮説を書く。8つの環境での評価が報告されており、「推論の前に、まず見えるようにする」ことの重要性を示す研究である。", "url": "https://arxiv.org/abs/2611.06793", "publishedAt": "2026-11-04T17:11:04Z", "timestamp": 1793812264000, "monthKey": "2026-11", "field": "cs.LG", "genre": "Vision / Multimodal", "authors": ["Harsidak Singh Banwait"], "categories": ["cs.LG", "cs.AI"]}, {"source": "arXiv cs.CL", "title": "Ranking Agreement Does Not Reveal Paragraph-Edit Agreement in Two Released Paper Acceptance Predictors", "titleJa": "順位の一致は段落編集の一致を明かさない――2つの公表済み論文採択予測器の検証", "summaryHtml": "高速な採択分類器があれば、より遅い評価器にかける改訂稿を選別できるかもしれない。本研究は、既存論文での一致がその用途を支持するかどうかを問う。語と文書の特徴による分類器と、同じ30億パラメータの言語モデルからファインチューニングされた2つの公表済みテキストのみ採択予測器を比較する。<br><br>ICLRの198本の論文について、原文の順位づけと、事実・主張の強さ・帰属が変わらないよう自動でスクリーニングされた段落書き換えへの順位づけを比較した。分類器は一方の予測器とは原文の順位が近く、他方とも中程度に一致したが、どちらの書き換えがスコアを上げるかについては、どちらの予測器とも検出可能な一致を示さなかった。<br><br>事前に指定された検定は数値精度を下げて行われており、丸め誤差が小さなスコア応答を支配していた。そこで公表済み重みを完全な32ビット精度で事後的に再採点したが、編集の一致は依然としてほぼ見られなかった。「原文での一致」が「編集への感応の一致」を保証しないという、予測器の使い方への注意喚起である。", "url": "https://arxiv.org/abs/2611.06789", "publishedAt": "2026-11-04T17:03:30Z", "timestamp": 1793811810000, "monthKey": "2026-11", "field": "cs.CL", "genre": "Vision / Multimodal", "authors": ["Shaoliang Yang", "Jun Wang"], "categories": ["cs.CL", "cs.LG"]}, {"source": "arXiv math.ST", "title": "Fundamental Limits of Coherent Imaging in The Presence of Atmospheric Turbulence", "titleJa": "大気ゆらぎのもとでのコヒーレントイメージングの基本限界", "summaryHtml": "本研究は、複素数値のマルチルック・コヒーレントイメージングにおいて、信号振幅と大気による位相歪みを同時推定する問題の基本限界を調べる。測定は乗法性のスペックルと加法性ガウスノイズで汚染され、すべてのルックは既知のガウスセンシング行列を共有し、両パラメータは構造化されたクラスに属する。<br><br>制約付き最尤推定器を分析することで、許容可能なパラメータクラス全体に一様に成り立つ同時ミニマックスリスクの上限を確立する。一方、オラクルへの帰着とFano型の議論により、同クラス上の最悪ケース下限が得られる。<br><br>これらの結果は、構造的複雑性、信号と測定の次元、ルック数、ノイズレベルの影響を定量化し、いくつかの設定で一致するミニマックスレートを確立する。ただし、測定次元が信号次元を上回る場合の低ノイズでの位相推定には、依然としてギャップが残る。理論的な到達限界を明確にする研究である。", "url": "https://arxiv.org/abs/2611.06784", "publishedAt": "2026-11-04T16:56:12Z", "timestamp": 1793811372000, "monthKey": "2026-11", "field": "math.ST", "genre": "Scientific AI", "authors": ["Songbin Liu", "Hanyu Yang", "Junren Chen", "Arian Maleki"], "categories": ["math.ST", "stat.ML"]}, {"source": "arXiv cs.LG", "title": "FedFiOT: Fisher-Weighted Optimal Transport for Model Merging in One-Shot and Few-Round Federated Learning", "titleJa": "FedFiOT――Fisher重み付き最適輸送による連合学習のモデル統合", "summaryHtml": "ワンショットおよび数ラウンドの連合学習（FL）は、1回または数回の通信ラウンドで大域モデルを構築して通信負担を減らすが、通常の多ラウンドFLより性能が低くなりがちである。頻繁な同期がないためクライアントモデル同士が漂い、似た特徴を学ぶニューロンがクライアントごとに異なる位置を占めることがある。同時に、局所データの異質性により、対応するパラメータでもクライアントの予測への重要性が異なる。<br><br>この2つの課題により、単純な平均化は不一致なニューロンを混ぜ合わせ、重要性の違いを無視して等しい重みを与えてしまう。本論文は、Fisher情報でパラメータの重要性を定量化し、ニューロンの整列とモデル集約を導く、Fisher重み付き最適輸送フレームワーク「FedFiOT」を提案する。<br><br>FedFiOTはニューロンの対応関係と大域モデルの構築を共同で最適化する。通信回数を絞ったFLにおける統合品質の改善を目指す手法である。", "url": "https://arxiv.org/abs/2611.06783", "publishedAt": "2026-11-04T16:56:10Z", "timestamp": 1793811370000, "monthKey": "2026-11", "field": "cs.LG", "genre": "Ethics / Safety", "authors": ["Quan Minh Nguyen", "Hoang M. Ngo", "Bhakti Chowkwale", "Yasaman Keshtkarjahromi", "My T. Thai"], "categories": ["cs.LG", "cs.AI"]}, {"source": "arXiv cs.CV", "title": "Semantic Residual Vector Quantization for Sign Language Generation", "titleJa": "意味的残差ベクトル量子化――手話生成を「何を表すか」から「どう動くか」へ", "summaryHtml": "手話生成（SLG）は、書かれた文を手話の動作へ写し、語彙内容と細かな発話の双方を保持する課題である。モデルは、どの手話を表現すべきかを決め、それを正確な手の形、軌道、表情、身体の協調を通じて実現しなければならない。既存の姿勢ベースのシステムや再構成のみの動作トークナイザは、この2つの決定を絡み合わせがちで、生成器には「どう動くか」を洗練する前に「何を表すか」の、テキストに整列した明示的な中間目標が欠けていた。<br><br>この問題に対し、本論文は「意味的残差ベクトル量子化（SRVQ）」を提案する。生成を意味から運動学へ進む2レベルの過程として捉える枠組みである。<br><br>新たに導入されたSRV量子化器は階層を学ぶ。最初の残差レベルが手話の内容を符号化し、続くレベルが姿勢、手の形、軌道、身体の協調を洗練する。すべてが単一の量子化器の内側で完結する設計である。言語内容と身体表現の分離が、手話生成の制御性を高める。", "url": "https://arxiv.org/abs/2611.06781", "publishedAt": "2026-11-04T16:55:08Z", "timestamp": 1793811308000, "monthKey": "2026-11", "field": "cs.CV", "genre": "LLM / NLP", "authors": ["Chang Liu", "Ke Han", "Niccolò Biondi", "Gloria Isotton", "Elisa Ricci", "Davide Talon", "Nicu Sebe"], "categories": ["cs.CV"]}, {"source": "arXiv math.ST", "title": "Regularization vs. Convolution in Kernel-Based Hypothesis Testing", "titleJa": "正則化か畳み込みか――カーネル仮説検定における2つの最適性の接続", "summaryHtml": "最大平均不一致（MMD）検定は、一般の領域で使える人気のノンパラメトリック検定である。その最適性については、構造的に異なる2つの系統が研究してきた。第一は、R^d上の畳み込みアプローチで、縮小する帯域幅を持つ平行移動不変カーネルを使い、L^2分離のもとでソボレフボール上にミニマックス最適である。第二は、一般の可測空間における正則化アプローチで、カーネル共分散作用素のスペクトル正則化を使い、Hellinger分離およびχ²分離の対立仮説に対してミニマックス最適である。<br><br>本論文は、L^2分離のもとでソボレフボール上の正則化アプローチを研究し、2つのアプローチの接続を明らかにする。<br><br>R^d上の平行移動不変カーネルでは、両者はカーネルのスペクトル密度に対する単一の条件を満たすための2つの方法であることが示される。スペクトル正則化された不一致は、ソボレフ対立仮説のL^2分離Δを捉える。検定理論の異なる伝統を一つの視点で結ぶ研究である。", "url": "https://arxiv.org/abs/2611.06778", "publishedAt": "2026-11-04T16:54:07Z", "timestamp": 1793811247000, "monthKey": "2026-11", "field": "math.ST", "genre": "Optimization / Theory", "authors": ["Omar Hagrass", "Bharath K. Sriperumbudur"], "categories": ["math.ST", "stat.ML"]}, {"source": "arXiv cs.CV", "title": "Benchmarking Fine-Grained Visual Reasoning for Remote Sensing in Urban Management", "titleJa": "UMBench――都市管理のためのリモートセンシング細粒度視覚推論ベンチマーク", "summaryHtml": "細粒度の視覚推論は、都市管理におけるリモートセンシングに不可欠だが、マルチモーダル大規模言語モデル（MLLM）の評価では十分に探求されてこなかった。本論文は、無人航空機（UAV）画像から構築された、交通監視、都市建設、環境品質、災害警報といった複数の都市管理タスクのための細粒度都市リモートセンシングベンチマーク「UMBench」を提案する。<br><br>UMBenchでの評価は、現在のMLLMがしばしば場面レベルの事前知識に頼り、細粒度の視覚的証拠を見落とすことを明らかにした。<br><br>この問題に対処するため、著者らはさらに、訓練不要の方法でモデルに細粒度の視覚的証拠を精査させる、新しい証拠優先の思考連鎖（evidence-first chain-of-thought）手法を提案する。実験では、この手法がオープンソースと商用の双方のMLLMのUMBenchでの性能を改善できることが示された。「まず証拠を見る」推論の促しが、リモートセンシングでも効くことを示す研究である。", "url": "https://arxiv.org/abs/2611.06770", "publishedAt": "2026-11-04T16:50:17Z", "timestamp": 1793811017000, "monthKey": "2026-11", "field": "cs.CV", "genre": "Vision / Multimodal", "authors": ["Jiawei Zhang", "Rizhao Cai", "Dayan Guan"], "categories": ["cs.CV"]}, {"source": "arXiv cs.RO", "title": "PyRUA-REAL: Robot Exploration and Adaptive Learning through RSI in the Real World", "titleJa": "PyRUA-REAL――実世界での探索と適応学習によるロボットの再帰的自己改善", "summaryHtml": "GPT-6-Astraのようなモデルで駆動されるコーディングエージェントは、空間的推論と実行可能なロボット行動を結びつけ、そのようなエージェントが物理的な相互作用からロボット能力の持続的な改善をどう生み出せるかという問いを提起している。本研究は、「PyRUA-REAL」という枠組みを通じて、身体化された再帰的自己改善（RSI）を実世界の探索、コード洗練、配備の観点から研究する。<br><br>この枠組みでは、コーディングエージェントが相互作用の経験を、持続的な記憶と再利用可能な実行可能スキルとして保持し、その後の探索と改善に活かす。実証研究は物理的なマニピュレーションを改善過程の中心に置き、エージェント同士がどう協働するか、どんな実行フィードバックが効果的なコード洗練を支えるか、タスク仕様や以前に獲得したスキルが頑健性やタスク転移にどう影響するかを調べる。<br><br>さらに、得られたプログラムを人間の関与なしに配備した際の効率と能力も検証されている。シミュレーションではなく実世界で自己改善のループを回す試みであり、その成否の条件を探る研究である。", "url": "https://arxiv.org/abs/2611.06768", "publishedAt": "2026-11-04T16:46:03Z", "timestamp": 1793810763000, "monthKey": "2026-11", "field": "cs.RO", "genre": "Agents / Reasoning", "authors": ["Qiang Wang", "Jianxin Bi", "Shulong Jiang", "Ruiyang Si", "Wenbo Huang", "Kaiqi Chen", "Jiaxin Li", "Liyun Li", "Xuanyi Li", "Daquan Zhou"], "categories": ["cs.RO"]}, {"source": "arXiv cs.SE", "title": "Rethinking Access Control for AI Agents: Recent Advances and Open Challenges", "titleJa": "AIエージェントのアクセス制御を考え直す――最近の進展と未解決の課題", "summaryHtml": "LLMエージェントはデータへアクセスし、ツールを呼び出し、ユーザの代わりに行動する。これらの行動を認可された範囲内に保つことは難しい。エージェントは自ら実行経路を選ぶ一方で、権限や運用条件は変化しうるからである。本論文は、エージェントのアクセス制御における最近の進展を、方針の仕様化と導出、アイデンティティと委任、行動とリソースの強制、情報フロー制御という4つの領域にわたって概観する。<br><br>著者らは各手法の制御対象、強制の境界、前提を比較し、個別の仕組みが何を達成し、どう協働できるかを検討する。その分析を踏まえて、認可について4つの側面を考え直す。計画の選択が権限の要求を形作ること、文脈情報はそれ自体が権限を与えなくても意思決定に資すること、制限はシステムのインターフェースを越えても意味を保たなければならないこと、ワークフローの進化に合わせて認可を再評価しなければならないことである。<br><br>これらの洞察が、未解決の課題群を動機づける。エージェントの権限管理を「一度与えて終わり」ではなく、実行に寄り添う継続的な営みとして設計し直すサーベイである。", "url": "https://arxiv.org/abs/2611.06764", "publishedAt": "2026-11-04T16:42:53Z", "timestamp": 1793810573000, "monthKey": "2026-11", "field": "cs.SE", "genre": "LLM / NLP", "authors": ["Chijin Zhou", "Quan Zhang"], "categories": ["cs.SE"]}, {"source": "arXiv cs.CV", "title": "Route First, See Later: Enabling Vision Agents to Reason Scientifically by Separating Routing Policy from Action Spaces", "titleJa": "まず経路を決め、見るのは後――ルーティング方針と行動空間を分けて視覚エージェントに科学的推論を", "summaryHtml": "科学的な画像分析ワークフローでは、エージェントは説明、検出、計数、セグメンテーションなど多様な能力の中から選ぶ必要がある。現在のマルチツールアーキテクチャは、意図の解釈と視覚的実行を混同しており、失敗が推論の欠陥（誤った経路選択）によるのか、知覚の失敗（無効なツール実行）によるのかを覆い隠している。この監査可能性の欠如が、高リスクの科学自動化におけるエージェントの信頼性を損なっている。<br><br>本論文は、ルーティング方針と行動実行の分離を実装した拡張可能なアーキテクチャ「ZETA」を提案する。ZETAは専門的な視覚ツールを呼び出す前に科学的意図を解決し、計測を、生成的出力ではなく明示的な幾何に基づく決定的な操作として扱う。<br><br>このアーキテクチャはエージェントの意思決定という「ブラックボックス」を露わにし、経路選択の正しさと下流の実行を独立した失敗モードとして評価できるようにする。科学用途のエージェントに求められる説明可能性への、設計面からの回答である。", "url": "https://arxiv.org/abs/2611.06760", "publishedAt": "2026-11-04T16:39:17Z", "timestamp": 1793810357000, "monthKey": "2026-11", "field": "cs.CV", "genre": "Vision / Multimodal", "authors": ["Shubhabrata Mukherjee", "Jeffrey Donatelli", "Daniela Ushizima"], "categories": ["cs.CV", "cs.AI"]}, {"source": "arXiv cs.LG", "title": "Continual Classification Beyond the Kernel Regime: Harnessing the Sparsity Bias of L2 Regularization in Diagonal Linear Networks", "titleJa": "カーネルレジームを超えた継続分類――対角線形ネットにおけるL2正則化のスパース性バイアス", "summaryHtml": "本研究は、高次元の統計設定における、線形予測器による継続学習のためのロジスティック回帰を調べる。既存の理論研究は、解析的な単純さとニューラルネットのカーネルレジームとの接続を動機として、L2正則化の変種を用いた継続線形回帰にほぼ集中してきた。<br><br>著者らはまず、継続線形分類に対する最適なL2正則化強度を導出し、その汎化性能を特徴づける。継続線形回帰についての先行結果と類似した振る舞いが回復される。次に、最小の2層対角線形ネットワークを用いて、より深いモデルにおけるL2正則化の効果を調べる。単一タスク設定では、このようなモデルの重みへのL2正則化は予測器のスパース性を促進し、カーネルレジームを超えた豊かなスパース特徴学習のレジームを生むことが知られている（2層ReLUネットでも同様の効果がある）。しかし継続学習では事情が異なりうる。<br><br>継続学習の文脈でスパース性バイアスがどう働くか――過去タスクの保持と新タスクの学習の緊張の中で――を理論的に掘り下げる研究である。", "url": "https://arxiv.org/abs/2611.06759", "publishedAt": "2026-11-04T16:38:46Z", "timestamp": 1793810326000, "monthKey": "2026-11", "field": "cs.LG", "genre": "Ethics / Safety", "authors": ["Gilad Karpel", "Itay Evron", "Ron Meir", "Daniel Soudry"], "categories": ["cs.LG"]}, {"source": "arXiv cs.CV", "title": "EvoWorld: Towards Out-of-Sight World Evolution in Generative Video Models", "titleJa": "EvoWorld――生成ビデオモデルにおける「視界の外」の世界進化へ", "summaryHtml": "生成ビデオモデルは視覚的な世界シミュレータとしてますます使われているが、その主たる強みは世界の進化の仕方についての推論ではなく、もっともらしいピクセルの描画にある。一貫した世界の進化には視覚的忠実度以上のものが必要である。出来事が起きたとき、モデルは世界の実体への帰結を推論し、その結果の状態を描画しなければならない。たとえば野獣が現れた後、モデルは野獣を描くだけでなく、近くの人が逃げるべきか、身を隠すべきか、戦うべきかを、実現した場面に基づいて推論すべきである。<br><br>既存の拡散ベースビデオモデルには、世界の状態を保持し、そのような出来事条件付きの帰結について推論する明示的な仕組みが欠けており、視覚的にはもっともらしくても振る舞いが静的だったり、因果的に不整合だったりする出力をしばしば生む。<br><br>この推論のギャップを具体的で測定可能なものにするため、著者らは新しい問題「視界外因果進化（Out-of-Sight Causal Evolution）」を提案する。モデルに、画面の外で起きた出来事の帰結まで含めて世界の進化を推論させる課題である。", "url": "https://arxiv.org/abs/2611.06748", "publishedAt": "2026-11-04T16:26:45Z", "timestamp": 1793809605000, "monthKey": "2026-11", "field": "cs.CV", "genre": "Vision / Multimodal", "authors": ["Yequan Bie", "Dengyang Jiang", "Zhixuan Chen", "Xiaozhuan Liang", "Haoxuan Che", "Quande Liu", "Xi Chen", "Hao Chen"], "categories": ["cs.CV", "cs.AI"]}, {"source": "arXiv cs.CV", "title": "TailSteer: Trajectory-Tail Steering for Drift-Resistant Multi-turn Image Editing", "titleJa": "TailSteer――軌道の尾部を操舵して複数ターン画像編集のドリフトに抗う", "summaryHtml": "単一ターンの編集性能が強くても、複数ターンの対話が信頼できるとは限らない。編集された出力が繰り返し再利用されるにつれ、小さな意図しない変化が蓄積し、深刻な視覚的ドリフトになりうる。この長期ドリフトは通常、複数ターンデータでの訓練やターン横断のロールアウトで緩和されるが、それは事前学習の事前分布を変えてしまう可能性がある。あるいは基盤モデルへの拡張が難しい、推論時に特化した仕組みで対処されてきた。<br><br>本論文は、最終段階の訓練フレームワーク「TailSteer」を提案する。複数ターンの頑健性を高めながら、それまでの訓練で獲得した生成・編集能力を保持する。<br><br>TailSteerの原理は単純である。初期のデノイジング動態はベースモデルに近づけて保ち、保存のための修正は、細かな逸脱を抑え込める軌道の尾部（テール）付近に集中させる。修正は、編集器自身のオンポリシーなデノイジング・ロールアウトから、変化していないソース内容を使って学習される。能力を壊さずにドリフトだけを抑える狙いの設計である。", "url": "https://arxiv.org/abs/2611.06741", "publishedAt": "2026-11-04T16:23:24Z", "timestamp": 1793809404000, "monthKey": "2026-11", "field": "cs.CV", "genre": "Vision / Multimodal", "authors": ["Ruikang Li", "Zixuan Chen", "Jiarui Wu", "Mingde Yao", "Yiyuan Zhang", "Yujin Wang", "Hanming Deng", "Lewei Lu", "Tianfan Xue"], "categories": ["cs.CV", "cs.AI"]}, {"source": "arXiv cs.CV", "title": "Coupled Scene Graph Anticipation: When With-Constraint Recall Hides Structural Inconsistency", "titleJa": "結合シーングラフ予測――制約付き再現率が構造的不整合を隠すとき", "summaryHtml": "シーングラフ予測（SGA）は、将来のビデオフレームにおける物体間の関係を予測する。連続時間のSGAモデルは主語―目的語の各ペアを独立したニューラルODEで進化させるため、実体を共有する関係同士は積分の間に互いに影響し合えず、同じペアについて「座っている」と「立っている」のような相互排他的な予測を何も妨げない。<br><br>本論文は「CoupledSGA」を提案する。関係同士を、ODEのベクトル場内にグラフ注意を持つ「関係相互作用グラフ」で結びつけ、相互排他的な述語の行列に基づく構造的一貫性損失（L_SC）を加える。<br><br>CoupledSGAの開発は、評価プロトコルの限界も明らかにした。制約付き（With-Constraint）評価は主語―目的語ペアごとにグループあたり1つの述語だけを保持するため、その R@K と mR@K は、L_SC が狙うグループ内の違反を捉えることができない。各グループの勝者述語が変わらない限り、これらの指標は不変であることが証明されている。評価指標そのものへの批判を含む研究である。", "url": "https://arxiv.org/abs/2611.06738", "publishedAt": "2026-11-04T16:20:37Z", "timestamp": 1793809237000, "monthKey": "2026-11", "field": "cs.CV", "genre": "Vision / Multimodal", "authors": ["Zeno Nongmaithem", "Anushttha Srivastava", "Anshit Sinha", "Apoorv Sisodia", "Suman Chowdhury", "Prerana Mukherjee", "Rajesh P. Barnwal"], "categories": ["cs.CV", "cs.LG"]}, {"source": "arXiv cs.HC", "title": "Smartphone-Aided VR Exergames for HIIT: Gamifying Fitness with Real-Time Pose Estimation", "titleJa": "スマートフォン支援のVRエクサゲームでHIITをゲーム化する――リアルタイム姿勢推定", "summaryHtml": "高強度インターバルトレーニング（HIIT）をゲーム化するため、スクワットとパンチの組み合わせ、両腕のストライク、斜めのストレッチコンボなど、あらかじめ定義した11種のコンボ動作を用いるVRエクサゲームシステムを開発した。ウェアラブルなモーションキャプチャスーツやヘッドセット内蔵センサに頼る従来の追跡法と異なり、三脚に置いた標準的なスマートフォンのカメラで全身の動きを捉える。HIIT特有の速く動的な動きにも適した、費用対効果が高く拡張可能な方法である。<br><br>スマートフォンの映像は姿勢推定アルゴリズムでリアルタイムに処理され、抽出された生体力学データは、Anthropicのオープン標準であるModel Context Protocol（MCP）上に構築されたバックエンドサーバとGPT-4oによって分析される。フォームの正確さ、動きの効率、運動強度、けがのリスクについて、個人に合わせた評価を生成する。<br><br>18〜25歳の参加者20名による被験者内比較では、VR条件のほうが非VR条件より楽しさ（平均3.5対2.8、p=0.02）、没入・集中（3.2対2.8、p=0.03）、他者への推奨意向（3.2対2.7、p=0.04）で有意に高かった。継続の自信に差はなく、知覚される強度も同程度だった。MCPによる評価は専門家の評価と87.5%一致し（10セッション、認定トレーナー1名）、フィードバック手段としての信頼性が示された。", "url": "https://arxiv.org/abs/2611.06734", "publishedAt": "2026-11-04T16:18:35Z", "timestamp": 1793809115000, "monthKey": "2026-11", "field": "cs.HC", "genre": "LLM / NLP", "authors": ["Abhiram Kothagundu", "Pheelip Pritipal Raipure", "Abhijit Chandrakant Patil", "Himangshu Sarma", "Christian Eichhorn", "David A. Plecher", "Johanna Pirker"], "categories": ["cs.HC", "cs.AI"]}, {"source": "arXiv cs.AI", "title": "ConceptARC at Scale: Studying Conceptual Understanding in Reasoning Models", "titleJa": "ConceptARC at Scale――推論モデルの概念理解を大規模に研究する", "summaryHtml": "大規模推論モデル（LRM）は難しいベンチマークで良い性能を示すが、概念的に関連した推論タスクにわたって汎化可能な抽象を形成しているかは不明である。抽象と推論コーパス（ARC）は抽象を研究するための制御された試験台であり、解題者は少数の例から2次元格子上の変換規則を推論しなければならない。ARCは個別タスク内の規則抽象を評価するが、異なるタスクでも、異なる変換を必要としながら高次の構造を共有することがある。たとえば複数のタスクが、他の物体の中に含まれた物体についての推論を含むような場合である。<br><br>ConceptARCのようなベンチマークは、ARC式のタスクを繰り返し現れる空間的・意味的概念ごとにグループ化してこの構造を捉えるが、概念あたり数件の手作りタスクしか含まないことが多い。<br><br>本論文は「ConceptARC at Scale」を提案する。特定の概念を狙ったARC式タスクを数千件規模で作る生成器であり、概念理解の研究をスケールさせるための基盤である。", "url": "https://arxiv.org/abs/2611.06732", "publishedAt": "2026-11-04T16:17:36Z", "timestamp": 1793809056000, "monthKey": "2026-11", "field": "cs.AI", "genre": "Agents / Reasoning", "authors": ["Philipp Mondorf", "Adrien Deliège", "Solim LeGris", "Claas Beger", "Ryan Yi", "Barbara Plank", "Brenden M. Lake", "Todd M. Gureckis"], "categories": ["cs.AI", "cs.LG"]}, {"source": "arXiv cs.LG", "title": "Template Gap Reconstruction for Shell Output Simulation with Small Language Models", "titleJa": "テンプレートギャップ再構成――小規模言語モデルによるシェル出力シミュレーション", "summaryHtml": "小規模言語モデルは、提出されたコマンドを実行することなくシェルをシミュレーションする、コンパクトな基盤を提供する。しかし全出力のデコーディングでは、実行ごとに変わる内容と並んで、繰り返し現れるユーティリティの構造まで予測しなければならない。本論文は「テンプレートギャップ再構成（TGR）」を提案する。再利用可能な出力リテラルに番兵（センチネル）を散りばめたテンプレートを与え、自己回帰的に生成される「ギャップ」と交互に配置する手法である。<br><br>テンプレート選択器が再構成すべきテンプレートを選び、空のテンプレートは全出力デコーディングを保持する。著者らは、異種の実行環境にわたって収集した1,870万件の出力からテンプレートバンクを構築し、バンク構築から除外した対象環境で、テンプレート選択器と5つの再構成モデルを、各種の小規模言語モデルのチェックポイントから初期化して訓練した。<br><br>評価では、最適なテンプレートがカバーする範囲が広い条件で、TGRが出力編集類似度（O-ES）において全出力デコーディング（FOD）を上回ることが示された。定型と可変部分を分けることで、小さなモデルの生成を安定させる工夫である。", "url": "https://arxiv.org/abs/2611.06731", "publishedAt": "2026-11-04T16:17:28Z", "timestamp": 1793809048000, "monthKey": "2026-11", "field": "cs.LG", "genre": "LLM / NLP", "authors": ["Jarrod Ragsdale", "Rajendra Boppana"], "categories": ["cs.LG", "cs.CL"]}, {"source": "arXiv cs.CV", "title": "Turns Matter: Advancing Streaming Video RL via Turn-Level Credit", "titleJa": "ターンは重要だ――ターン単位のクレジットでストリーミングビデオ強化学習を進める", "summaryHtml": "ストリーミングビデオ理解では、モデルは応答するか観察を続けるかを繰り返し判断しなければならない。近年、Group Relative Policy Optimization（GRPO）がこの設定に適用され、既存のアプローチは報酬設計を重視する一方で、全ターンに単一の軌跡レベルのアドバンテージを保持してきた。そのような共有クレジットは、初期の成功後の冗長な返答を強化したり、初期の失敗後の有用なフォローアップを抑制したりしうる。<br><br>本論文は、学習を個々のストリーミング判断に合わせるターン単位のGRPOフレームワーク「TurnWise」を提案する。TurnWiseは、軌跡レベルのフィードバックとターン単位の対話との不整合に対処し、情報のある応答を促して冗長性を減らす。<br><br>具体的には、ターン単位のクレジット割り当ては、無音で完結した接頭辞のスコアリングを使って、各判断の残りのリターンからグループ相対アドバンテージを構築し、その学習信号を以前の報酬から分離する。ターン平均の方策最適化も導入される。「いつ話すか」を学ぶエージェントのための信用割り当ての精緻化である。", "url": "https://arxiv.org/abs/2611.06728", "publishedAt": "2026-11-04T16:16:27Z", "timestamp": 1793808987000, "monthKey": "2026-11", "field": "cs.CV", "genre": "Vision / Multimodal", "authors": ["Shuai Dong", "Kanghui Tian", "Linghan Chen", "Wenqi Shao", "Hongrui Wu", "Haowen Hou", "Yongfu Zhu", "Xuehui Wang", "Ziyue Wang", "Wenpu Liu", "Weichu Xie", "Yuqi Xu", "Congcong Wang", "Kaiwen Tuo", "Caoyuan Ma", "Taiqiang Wu", "Ji Zhao", "Wenzheng Chang", "Dianyi Wang", "Siyuan Wang", "Zhongyu Wei", "Yu Qiao", "Jiaqi Wang"], "categories": ["cs.CV", "cs.CL", "cs.LG"]}, {"source": "arXiv cs.RO", "title": "Dexterous Robotic Hands in the Foundation-Model Era: A Full-Stack Survey of Hardware, Data, Cross-Embodiment Transfer, Learning, and Evaluation", "titleJa": "基盤モデル時代の器用なロボットハンド――ハードウェア・データ・身体間転移・学習・評価の全スタック調査", "summaryHtml": "器用なロボットハンドは、大規模な人間データや基盤モデルとますます結びつけられているが、ハードウェア、表現学習、評価の進歩はばらばらに評価されることが多い。本調査は2024年1月から2026年11月初めまでの研究をレビューし、技術的系譜を確立するためにそれ以前の研究も含める。<br><br>文献は相互依存する5つの層に整理される。ハードウェア、データ収集とキュレーション、身体間（クロスエンボディメント）転移、学習と基盤モデル、そして評価と応用である。人間の手と物体の理解と、触覚センシングが、横断的な2つの視点を提供する。システムレベルのアーキテクチャ、比較表、5件のケース分析が、これらの層にわたる設計選択を結びつける。研究内の実験比較と、不均一なコーパス統計、ベンダ仕様、企業公表結果は区別して扱われる。<br><br>結論の一つは、人間データの価値は運動学的・視覚的な条件に依存することである。ハンドという部品ではなく、データから評価までの全スタックで設計を考える必要性を示すサーベイである。", "url": "https://arxiv.org/abs/2611.06724", "publishedAt": "2026-11-04T16:13:29Z", "timestamp": 1793808809000, "monthKey": "2026-11", "field": "cs.RO", "genre": "Vision / Multimodal", "authors": ["Ji Pei"], "categories": ["cs.RO", "cs.AI", "cs.CV", "cs.LG"]}, {"source": "arXiv cs.LG", "title": "Symmetry Breaking at the Edge of Stability via Central Flow Analysis", "titleJa": "中心フロー解析による安定性の縁での対称性の破れ", "summaryHtml": "ニューラルネットの連続対称性は、線形ネットやReLUネットにおける層のバランス性のように、勾配フローのもとで不変な保存量を生む。有限ステップの勾配降下はこれらの法則を保つとは限らない。とりわけ「安定性の縁（EOS）」では、反復はより滑らかな軌道の周りで振動し、その軌道は中心フロー力学（Cohen et al., 2025）で記述できる。本研究は、勾配フローの保存法則がこのレジームの中心フロー記述のもとでどう進化するかを調べる。<br><br>著者らは、曲率の補正が、臨界パラメータ方向に沿った振動の共分散によって決まる有限次元のドリフトを誘発することを示す。<br><br>これにより、中心フロー力学に従ってEOSでどの保存法則が残り、どれが破れるかを分析する第一歩が踏み出される。分析対象は、スカラーの2層モデル、2層の行列分解、2層ReLUネットワークであり、既知の保存法則がどうなるかが検証される。最適化の幾何と対称性の関係を深める理論研究である。", "url": "https://arxiv.org/abs/2611.06718", "publishedAt": "2026-11-04T16:11:59Z", "timestamp": 1793808719000, "monthKey": "2026-11", "field": "cs.LG", "genre": "Scientific AI", "authors": ["Naima Elosegui Borras", "Georgios Arvanitidis"], "categories": ["cs.LG"]}, {"source": "arXiv cs.CL", "title": "Reasoning over Non-Parametric Memory in Multilingual LLMs: A Cognitive-Based Analysis of Relational Knowledge", "titleJa": "多言語LLMにおける非パラメトリックメモリ上の推論――関係知識の認知的分析", "summaryHtml": "検索拡張生成（RAG）は、言語モデルが事前学習で記憶した連想に頼るのではなく、文脈に述べられた関係について推論できることを前提にしている。本研究は、事実を取得させるのではなくプロンプトに直接与えることで、この証拠条件付きの関係推論を分離して調べる。<br><br>「Rel-Bloom」は、30のWikidata関係から構築された450問の多肢選択式の、制御された多言語診断である。同じ源泉関係が、Bloomに着想を得た5段階（記憶・理解・応用・分析・評価）と、3つの真実性条件（事実的・反事実的・中立化）で具体化される。43モデル、6言語、2つの多言語設定（226,800件の予測）にわたる評価で、3つの知見が際立った。<br><br>第一に、評価したすべてのオープンウェイトモデル系列で、応用から分析への段階で精度が急落し、大規模Graniteバケットでは47.2ポイントに達したが、どちらのGeminiモデルでもそうはならなかった。「文脈に書いてある関係を、その場で推論に使う」能力の段差が、多言語で定量化された研究である。", "url": "https://arxiv.org/abs/2611.06715", "publishedAt": "2026-11-04T16:11:26Z", "timestamp": 1793808686000, "monthKey": "2026-11", "field": "cs.CL", "genre": "LLM / NLP", "authors": ["Zohreh Abbasi Liasi", "Batoul Hammoud", "Anas Madkoor", "Ehsaneddin Asgari"], "categories": ["cs.CL", "cs.AI"]}, {"source": "arXiv cs.LG", "title": "Energy-Guided Transport for Projection-Free Physics-Informed Flow Matching", "titleJa": "エネルギー誘導輸送――射影なしで物理制約を組み込むフローマッチング", "summaryHtml": "フローマッチングをはじめとする深層生成モデルは、複雑な物理系を合成する強力な道具として台頭してきた。しかし標準的なアーキテクチャは純粋に統計駆動で、背後の支配方程式に無知なため、推論時に基本的な物理制約に違反しがちである。これらの制約を強制する既存のゼロショット手法は、硬い代数射影に頼ることが多い。疎な境界条件には有効だが、そのような離散的な幾何補正を密で全領域のPDEへ適用すると、確率の経路を乱し、学習された多様体から逸脱させ、大きな計算オーバーヘッドを招く可能性がある。<br><br>この課題に対し、本論文は「エネルギー誘導輸送」を提案する。非線形の物理制約を滑らかなポテンシャルエネルギーの景観として定式化する、訓練不要の新しい枠組みである。ODE積分を中断するのではなく、その流れにエネルギーの勾配を沿わせる発想である。<br><br>物理情報つき生成を、射影の硬さなしに実現する方向の研究であり、物理法則とデータ駆動生成の両立を狙う。", "url": "https://arxiv.org/abs/2611.06711", "publishedAt": "2026-11-04T16:09:05Z", "timestamp": 1793808545000, "monthKey": "2026-11", "field": "cs.LG", "genre": "Agents / Reasoning", "authors": ["Giuliano Galadini", "Aurelio Uncini", "Danilo Comminiello"], "categories": ["cs.LG", "physics.comp-ph"]}, {"source": "arXiv cs.RO", "title": "Where Is VLA Inference Time Spent? Bottlenecks and Optimization Interactions Across GPUs", "titleJa": "VLAの推論時間はどこで使われるか――GPU横断のボトルネックと最適化の相互作用", "summaryHtml": "視覚・言語・行動（VLA）モデルは、カメラ観測と言語指示をロボットの行動へ写像する。しかし大きなバックボーンと繰り返しの行動生成により、推論がロボットの次の行動に求められるリアルタイム要件より長くかかることがある。VLA計算の負荷を減らすため、量子化やプルーニングなど複数の最適化手法が提案されてきた。これらは、より良いカーネルコンパイルや、eagerモードの代わりにCUDAグラフを使うといった一般的な最適化と組み合わせることもできる。<br><br>しかし、これらの最適化結果の多くは単一のGPU種で、少数のVLAモデルについて報告されるだけで、特定のハードウェア上でモデルの本当のボトルネックが何か、最適化が報告結果の外側へどう汎化するかは分析されていない。<br><br>本論文は、CUDAグラフから始まる7系統の推論最適化手法についての包括的な測定研究を提供する。最適化の「効く・効かない」を、モデルとGPUの組み合わせごとに実測で切り分ける、実務的な価値の高い研究である。", "url": "https://arxiv.org/abs/2611.06710", "publishedAt": "2026-11-04T16:09:02Z", "timestamp": 1793808542000, "monthKey": "2026-11", "field": "cs.RO", "genre": "Vision / Multimodal", "authors": ["Muhammad Danish Waseem", "Ahmed Ali-Eldin Hassan"], "categories": ["cs.RO"]}, {"source": "arXiv cs.CY", "title": "Beyond the principle-practice gap: Responsible AI as situated epistemic and ethical practice", "titleJa": "原則と実践のギャップを超えて――責任あるAIは、状況に埋め込まれた認識的・倫理的実践である", "summaryHtml": "責任あるAIの研究は、倫理原則がAIの設計と開発にしばしば反映されないことを見出してきた。「原則と実践のギャップ」として概念化され、これは実装、認識、コンプライアンスの問題、ひいてはシステムや個人の振る舞いの不足として枠づけられてきた。本論文は、別の説明を提示する。<br><br>法執行、商業、研究、サバイバー支援の文脈にわたり、AIを活用した人身売買対策システムを設計・統治するアクターへの14件の半構造化インタビューに基づき、著者らは、そのような見かけのギャップは、アクターがある問題を――しかし他の問題はそうではなく――行動を要する倫理的問題として認識するに至る、多様で複雑な制度的・専門的条件から生じると論じる。<br><br>認識的な選択が倫理的判断と絡み合うことが示され、知覚、判断、状況づけられた行動、社会技術的な物質化という、相互に結びついた4つの局面がたどられる。ギャップを「不足」ではなく「現場の条件」から理解し直す、質的な研究である。", "url": "https://arxiv.org/abs/2611.06709", "publishedAt": "2026-11-04T16:08:17Z", "timestamp": 1793808497000, "monthKey": "2026-11", "field": "cs.CY", "genre": "LLM / NLP", "authors": ["Thao Do Ngoc", "Emma Carmel"], "categories": ["cs.CY", "cs.AI"]}, {"source": "arXiv cs.CL", "title": "ALTO: African and Levantine Tech-Facilitated Gender-Based Violence Corpus", "titleJa": "ALTO――アフリカとレバントにおけるテクノロジーを介したジェンダー暴力コーパス", "summaryHtml": "テクノロジーを介したジェンダーに基づく暴力（TFGBV）は、直接的・隠蔽的さまざまな形態を通じて、女性とジェンダー少数者に広く及ぶオンラインの危害である。ジェンダー化された危害の検出のための現在のモデルと注釈付きデータセットは、グローバルノースの言語のデータと、そこで訓練されたモデルに支配されている。<br><br>ヨルダン、フランス語圏西アフリカ、ケニアの市民社会組織（CSO）と協力し、著者らは、レバント・アラビア語、アフリカのフランス語、スワヒリ語における、文化的・言語的に関連したTFGBVの事例をクラウドソースする、コミュニティ主導のアプローチを開発した。クラウドソースされたデータをアクティブラーニングで注釈し、小さいながら性能の良いデータセット（N=3,022）「ALTO」を構築し、3言語でのTFGBV検出を改善した。<br><br>ベンチマークとファインチューニングの実験では、既存の有害コンテンツ検出モデルはALTO内でのTFGBVの再現率が低く、ファインチューニングで改善することが示された。モデルは隠蔽的な危害を見逃しがちであることも分かった。過小評価されてきた言語圏の危害検出に光を当てる研究である。", "url": "https://arxiv.org/abs/2611.06706", "publishedAt": "2026-11-04T16:06:15Z", "timestamp": 1793808375000, "monthKey": "2026-11", "field": "cs.CL", "genre": "LLM / NLP", "authors": ["Tianwei Zhang", "Ivy Njoki Nyagwencha", "Zahraa Dirani", "Shalini Joshi", "Scott A. Hale"], "categories": ["cs.CL", "cs.AI", "cs.CY", "cs.LG"]}, {"source": "arXiv cs.LG", "title": "Where It Breaks: Diagnosing Perception, Memory, and Decision Failures of a Vision-Language Agent in Pac-Man", "titleJa": "どこで壊れるか――パックマンで視覚言語エージェントの知覚・記憶・意思決定の失敗を診断する", "summaryHtml": "上下左右だけの行動でパックマンをプレイするようエージェントを訓練すると、基本的な問いが生じる。性能が悪いとき、何を改善すべきか。難しさは、画面を読むことから来るのか、長い系列にわたる行動選択から来るのか。本研究は、Qwen3.5-9Bベースのエージェントについて、独立した知覚チェックと、原始方策の強化学習研究を通じてこれらの問題を調べる。<br><br>テキスト化した盤面を使い、画像の転記を意思決定インターフェースから取り除いた方策研究では、8つの保留迷路でのクリア率は、この最適化の前の0%から、選ばれたチェックポイントで80.2%（残機3つ追加）まで上がった。知覚チェックは、正確な静止スクリーンショットの読み取りが、対話中の誤りと共存しうることを示す。<br><br>別の方策比較では、さらなる最適化がより悪い行動選択を伴うことも示された。これらの知見は、訓練後の具体的なチェックを動機づける。知覚は使用中の状態で評価すること、そして失敗の所在を切り分けることが、エージェント改善の前提になるという診断の研究である。", "url": "https://arxiv.org/abs/2611.06704", "publishedAt": "2026-11-04T16:04:57Z", "timestamp": 1793808297000, "monthKey": "2026-11", "field": "cs.LG", "genre": "Vision / Multimodal", "authors": ["Xinglu Wang", "Edward Wang", "Yong Zhang", "Zhenan Fan"], "categories": ["cs.LG"]}, {"source": "arXiv cs.RO", "title": "When to Ask for Help: Uncertainty-Triggered Aerial Refinement for Off-Road Navigation", "titleJa": "いつ助けを求めるか――不確実性で発動するオフロード航法の空中支援", "summaryHtml": "異種の空地チームは、地上車両のセンサの限られた範囲と視点を、空からのセンシングで補うことができる。しかし、UGV（無人地上車）が支援を必要とするのはいつか、UAV（無人航空機）がどんな情報を集めるべきかを決めることは課題として残る。本論文は、プランナ条件付きの空地支援手法を提示する。地図情報の不確実性がUGVの現在のMPPIロールアウトへどう影響するかを評価する手法である。<br><br>航法が劣化したままであれば、解決済みの地図仮説のもとで同じロールアウトを採点し、最も有用な改善をもたらす地図レイヤーを選び、対応する空からの計測を要求し、返ってきた情報を融合して再計画する。固定した支援役割やタスク構造、不確実性そのものに駆動される手法と異なり、本手法は、不確実性の解消が予測される地上航法を改善するかどうかに支援を条件づける。<br><br>3つのオフロード路線での180回のシミュレーション試行で、本手法は98.9%の目標到達を達成しながら、UAVの平均飛行時間を削減した。「必要なときだけ呼ぶ」支援の設計である。", "url": "https://arxiv.org/abs/2611.06702", "publishedAt": "2026-11-04T16:02:59Z", "timestamp": 1793808179000, "monthKey": "2026-11", "field": "cs.RO", "genre": "Robotics", "authors": ["Pranay Samineni", "Adam Thorpe", "John Chubick", "Anand Balakrishnan", "Christian Ellis", "Swarat Chaudhuri", "Ufuk Topcu"], "categories": ["cs.RO", "eess.SY"]}, {"source": "arXiv cs.CV", "title": "Agent-Driven Generative Priors for Pathology Image Synthesis and Segmentation", "titleJa": "エージェント駆動の生成事前知識による病理画像の合成とセグメンテーション", "summaryHtml": "病理学のための深層学習手法は、大規模なピクセルレベルの注釈の入手可能性の低さとコストの高さに制約されている。合成データはこの制限を緩和できるが、既存のパイプラインは信頼できる品質管理を欠くことが多く、下流の分析とのつながりも弱い。この問題に対し、本論文は、自動データスクリーニング、生成的表現学習、下流タスクへの効率的な適応を統合した3段階の枠組みを提案する。<br><br>第一に、病理エージェントシステムを開発して画像品質を評価しサンプルを選別し、公開TCGAリポジトリから選ばれた217,030件の病理パッチからなるデータセット「TCGA-200K」を得た。第二に、選別されたデータで生成モデルを訓練する。画像合成に加えて、そのバックボーンは下流タスクへ転移可能な構造的・意味的表現を学ぶ。<br><br>第三に、事前学習した生成バックボーンを、意味的セグメンテーションへ適応させる。データの質の管理から生成、実タスクへの転移までを一つの流れにまとめた、医療画像AIの実践的なパイプライン研究である。", "url": "https://arxiv.org/abs/2611.06701", "publishedAt": "2026-11-04T16:02:29Z", "timestamp": 1793808149000, "monthKey": "2026-11", "field": "cs.CV", "genre": "Vision / Multimodal", "authors": ["Sicheng Yang", "Rui Tang", "Haipeng Zhou", "Hongqiu Wang", "Zhaohu Xing", "Jianda Ma", "Lie Dai", "Guang Yang", "Lei Zhu"], "categories": ["cs.CV"]}, {"source": "Hugging Face Papers", "title": "On the Opportunities and Challenges of Prefill-to-Autoregressive Cross-Model Transfer", "titleJa": "大小モデル間の潜在コミュニケーションPACT――性能向上は本当に情報伝達によるものか", "summaryHtml": "言語モデル間の潜在的なコミュニケーションの一形態であるPrefill-to-Autoregressive Cross-model Transfer（PACT）は、大きなモデルのプロンプト表現と小さなモデルの効率的な生成を組み合わせ、能力と推論コストのバランスを取る有望な方法である。しかし既存のシステムは、大小のモデルの協調を独立に評価する仕組みが乏しく、タスク性能の向上だけでは、受け手が送り手の情報を本当に活用したのかは分からない。<br><br>本研究は、凍結したモデル同士を軽量なゼロ初期化の線形ブリッジでつなぎ、タスク報酬で直接訓練するオープンソースのPACTフレームワーク「PLatour」を提案する。ハイブリッド注意アーキテクチャにも対応する。PLatourは生成タスクでオープンソースのベースラインを大きく上回り、数学とコーディングの共有ベンチマークでは、より小さな送り手を用いながらMostikの報告結果を上回った。<br><br>一方で統制実験では、一部のタスクの改善が、無情報な送り手信号や自己コミュニケーション、受け手だけの訓練でも再現できることが示された。訓練可能なブリッジは、送り手の情報を活用せずにパラメータ効率的な適応として働きうる。そこで本研究は、訓練済みPACTシステムの改善のうちどれだけが真にコミュニケーションに由来するかを定量化する「PACT-Check」を提案し、PACTシステムの可能性と課題を論じる。", "url": "https://arxiv.org/abs/2611.06976", "publishedAt": "2026-11-04T13:33:47Z", "authors": ["Zhenyi Shen", "Junru Lu", "Wei Liu", "Jiangnan Ye", "Jiazheng Li", "Di Yin", "Xing Sun", "Tameem Adel", "Yali Du", "Lin Gui", "Yulan He"], "categories": ["cs.CL"], "field": "cs.CL", "genre": "LLM / NLP", "timestamp": 1793799227000, "monthKey": "2026-11"}, {"source": "Hugging Face Papers", "title": "Tools Need Not Speak in Text: Latent Context Compression for Agents", "titleJa": "ツールはテキストで語る必要はない――エージェントのための潜在文脈圧縮", "summaryHtml": "LLMエージェントは通常、ツールの出力をそのままテキストとして文脈に追加する。複数ステップのやり取りでは、長くノイズの多い観測が文脈を圧迫し、課題に関連する情報への注意を薄めてしまう。既存のトークン削減や要約の手法は、離散的なテキスト表現に縛られ、圧縮率にも限界があった。本研究は、エージェントがツールの観測を必ずしも明示的なテキストトークンとして消費する必要はない、という前提に疑問を投げかける。<br><br>著者らは、ツールの観測を潜在トークンに圧縮し、エージェントの入力埋め込み空間に組み込む連続潜在文脈圧縮モデル「Coca-Cola」を提案する。さらに、完全な観測と圧縮した観測の下での次の行動の分布を一致させる「行動保持訓練」を導入し、意思決定に必要な情報を保つ行動十分な潜在トークンを学習させる。<br><br>ウェブ検索エージェントを用いた4つのQAベンチマークと2つのモデル系列での実験では、トークン消費量が70.01〜89.24％、エンドツーエンドの実行時間が24.45〜55.97％削減され、課題性能は一貫して向上した。テキストに頼らず潜在空間で文脈を扱うことが、エージェントの効率と性能の両方を高める道であることを示す研究である。", "url": "https://arxiv.org/abs/2611.06500", "publishedAt": "2026-11-04T13:32:36Z", "authors": ["Yuetong Liu", "Zhehao Zhou", "Yitong Zhang", "Haorui Chen", "Jia Li"], "categories": ["cs.AI"], "field": "cs.AI", "genre": "Agents / Reasoning", "timestamp": 1793799156000, "monthKey": "2026-11"}, {"source": "Hugging Face Papers", "title": "What Does Multi-Turn Reinforcement Learning Really Improve in LLM Agents?", "titleJa": "マルチターン強化学習はLLMエージェントの何を本当に改善するのか", "summaryHtml": "マルチターンのエージェント強化学習は長期的なタスクで優れた性能を示すが、その効果は対話の制約条件に大きく左右される。本論文は、サンプリングの幅Kと対話の深さTを変えた評価指標Pass@(K,T)により、軌跡レベルの強化学習の優位性が十分なターン数の予算に依存し、予算が厳しくなると大幅に低下することを示した。<br><br>また、エージェント強化学習は一段階の意思決定の質を一様に高めるわけではない。その強みはむしろ、誤りからの回復や長期的な粘り強さに集中していることが明らかになった。展開時の予算依存によるリスクを抑えるため、論文ではプロセス監督シグナルの利点と限界を予備的に論じ、学習中に相互作用の予算を変化させるBudgetMix RLを提案している。<br><br>実験の結果、BudgetMix RLは多様な実行条件のもとで頑健な性能を達成し、学習時と展開時でターンの予算が異なる場合でも性能が崩れにくい点が確認された。エージェント強化学習の効果を「何が改善され、何が改善されないか」という観点から切り分けた、実務的にも示唆に富む検証である。", "url": "https://arxiv.org/abs/2611.06483", "publishedAt": "2026-11-04T08:24:54Z", "authors": ["Kejian Zhu", "Zhuoran Jin", "Shangqing Tu", "Tianyi Men", "Yupu Hao", "Jiachun Li", "Kang Liu", "Jun Zhao"], "categories": ["cs.LG", "cs.CL"], "field": "cs.LG", "genre": "Agents / Reasoning", "timestamp": 1793780694000, "monthKey": "2026-11"}, {"source": "PubMed", "title": "Next-Generation Psychedelic Drug Development", "titleJa": "次世代サイケデリック医薬品の開発――新たな治療法づくりへの指針", "summaryHtml": "サイケデリック医療は、うつ病や不安、心的外傷後ストレス障害（PTSD）など、さまざまな神経精神疾患の治療として急速に注目を集めている。これまで治療が難しいとされてきた症状に対しても新たな選択肢として期待が高まり、研究と臨床応用の両面で広がりを見せている。新しいサイケデリック類縁体や投与レジメンが次々に登場し、検証すべき変数の数も増え続けている。本総説は、次世代のサイケデリック治療を開発するうえでの多様なアプローチと留意点を整理する。<br><br>現在の評価法やモデルの長所と短所を検討し、どのような試験系が新しい化合物や投与法の評価に適しているかを論じる。類縁体や投与レジメンが増えるなかで、どの変数をどう検証すべきか、開発の現場で直面する判断材料を提示する。既存の評価法では捉えきれない側面や、モデルごとの適用範囲の違いにも触れ、開発の進め方を多角的に検討する。<br><br>最後に、次世代のサイケデリック医薬品開発に向けた指針と考慮事項を示す。安全性と有効性の両立をどう評価し、臨床応用へどうつなげるか。サイケデリック医療の広がりを受けて、開発の枠組みそのものを整えるための展望をまとめた総説である。", "url": "https://pubmed.ncbi.nlm.nih.gov/42980080/", "publishedAt": "2026-11-04T00:00:00Z", "authors": ["Lindsay P Cameron", "Matthew W Johnson", "Kevin S Murnane", "Mark M Rasenick", "Charles D Nichols"], "categories": ["psychedelics", "drug development", "review"], "field": "PubMed", "genre": "Psychedelics / Therapy", "timestamp": 1793750400000, "monthKey": "2026-11"}, {"source": "PubMed", "title": "Psilocybin-Assisted Therapy for Cancer-Related Psychological and Existential Distress in Adults with Cancer: An Integrative Systematic Review", "titleJa": "がんに伴う心理的・実存的苦悩に対するシロシビン支援療法――統合的システマティックレビュー", "summaryHtml": "シロシビン支援療法は、がんや生命を脅かす病気に伴う苦悩への有望な介入として再び注目されている。本統合的システマティックレビューはPRISMA指針に沿い、2025年8月10日から10月31日までにPubMed、Scopus、Google Scholar、CINAHLを検索し、6つの独立した臨床コホートから得られた11件の報告を対象に、がんのある成人における抑うつ、不安、実存的苦悩に対する安全性、有効性、治療的影響を評価した。<br><br>シロシビンは一般に、準備、投与、統合の構造化された枠組みのもとで、監督下の単回中〜高用量（25〜30mg/70kg）として投与された。すべての研究デザインを通じて、抑うつ、不安、実存的苦悩、死への恐怖の迅速かつ持続的な軽減がみられ、効果は2〜6か月、場合によっては4.5年まで続いた。質的知見では、感情の明晰さや受容、スピリチュアルな安寧、意味との再接続が際立った。11件中5件がMMATの基準を満たし、他では評価者の盲検化や代表性、交絡の統制などに課題が残った。<br><br>シロシビン関連の重篤な有害事象は報告されず、一時的な心血管系の変化や頭痛、吐き気、不安、短時間の精神病様症状がみられた。著者らは、がん関連の心理的・実存的苦悩に対する有望だがいまだ研究段階の緩和的介入だと結論づけている。", "url": "https://pubmed.ncbi.nlm.nih.gov/42975895/", "publishedAt": "2026-11-03T00:00:00Z", "authors": ["Athanasios Pitis", "Maria Nikoloudi", "Nikos Stefanis", "Kyriaki Mystakidou"], "categories": ["psychedelics", "systematic review"], "field": "PubMed", "genre": "Psychedelics / Therapy", "timestamp": 1793664000000, "monthKey": "2026-11"}, {"source": "Hugging Face Papers", "title": "From Autonomous Agents to Cognitive Symbionts: Toward AI-Augmented Human Intelligence", "titleJa": "自律エージェントから認知的共生体へ――AIで拡張される人間の知性", "summaryHtml": "10年間、AIの進歩は機械が独力で何をできるかで測られてきた。基盤モデルはコードを書き、複数段階のタスクをこなし、パーソナルエージェントは人に代わって行動するようになった。それでも人は、かつて知っていたことを忘れ、目の前のものを見逃し、適切な言葉が見つからず、自分の来歴を活かせないまま難しい選択に直面する。助けになるはずの機械が、状況の外に立っているからだ。<br><br>フィジカルAIの時代、注目は身体化ロボットに集まっているが、本論文はもう一つの同等に重要な存在として「AIによって拡張された人」を挙げる。汎用人工知能（AGI）が「機械がどれほど賢くなれるか」を問うのに対し、AI拡張人間知性（AHI）は「機械が特定の個人にどれだけの知性を可能にするか」を問う。その実現には「認知的共生体」という新しいシステムが必要だ。生涯にわたり、埋め込み型で、リアルタイム、プライベート、低摩擦、能動的な伴侶であり、外部デバイスを通じて人が感じるものを感知し、数年にわたって文脈を保持し、状況と心をモデル化し、適切な瞬間に思考へ参加し、文脈を踏まえて日常のタスクを遂行し、双方の変化とともに人を学び続ける。<br><br>概念的な核は「認知的ギャップ」――人が状況に持ち込めたはずのものと、ワーキングメモリに保持できるものとの隔たりである。設計空間は、感知・保持・理解・共生・代行・共考・成長からなる共生ループとして整理され、個人ランタイムと信頼によって囲まれる。一方で、試験での隠れた支援や導入への同調圧力など、新種のリスクも生じるとし、ガバナンスをこのパラダイムの一部として扱う。", "url": "https://arxiv.org/abs/2611.05376", "publishedAt": "2026-11-03T00:00:00Z", "authors": ["Hao Fei"], "categories": ["cs.CL"], "field": "cs.CL", "genre": "Agents / Reasoning", "time
