  <script>
    const DATA = {"version": 1, "updatedAt": "2026-11-06T07:29:18Z", "articles": [{"source": "arXiv cs.LG", "title": "Template Gap Reconstruction for Shell Output Simulation with Small Language Models", "titleJa": "テンプレートギャップ再構成――小規模言語モデルによるシェル出力シミュレーション", "summaryHtml": "小規模言語モデルは、提出されたコマンドを実行することなくシェルをシミュレーションする、コンパクトな基盤を提供する。しかし全出力のデコーディングでは、実行ごとに変わる内容と並んで、繰り返し現れるユーティリティの構造まで予測しなければならない。本論文は「テンプレートギャップ再構成（TGR）」を提案する。再利用可能な出力リテラルに番兵（センチネル）を散りばめたテンプレートを与え、自己回帰的に生成される「ギャップ」と交互に配置する手法である。<br><br>テンプレート選択器が再構成すべきテンプレートを選び、空のテンプレートは全出力デコーディングを保持する。著者らは、異種の実行環境にわたって収集した1,870万件の出力からテンプレートバンクを構築し、バンク構築から除外した対象環境で、テンプレート選択器と5つの再構成モデルを、各種の小規模言語モデルのチェックポイントから初期化して訓練した。<br><br>評価では、最適なテンプレートがカバーする範囲が広い条件で、TGRが出力編集類似度（O-ES）において全出力デコーディング（FOD）を上回ることが示された。定型と可変部分を分けることで、小さなモデルの生成を安定させる工夫である。", "url": "https://arxiv.org/abs/2611.06731", "publishedAt": "2026-11-04T16:17:28Z", "timestamp": 1793809048000, "monthKey": "2026-11", "field": "cs.LG", "genre": "LLM / NLP", "authors": ["Jarrod Ragsdale", "Rajendra Boppana"], "categories": ["cs.LG", "cs.CL"]}, {"source": "arXiv cs.CV", "title": "Turns Matter: Advancing Streaming Video RL via Turn-Level Credit", "titleJa": "ターンは重要だ――ターン単位のクレジットでストリーミングビデオ強化学習を進める", "summaryHtml": "ストリーミングビデオ理解では、モデルは応答するか観察を続けるかを繰り返し判断しなければならない。近年、Group Relative Policy Optimization（GRPO）がこの設定に適用され、既存のアプローチは報酬設計を重視する一方で、全ターンに単一の軌跡レベルのアドバンテージを保持してきた。そのような共有クレジットは、初期の成功後の冗長な返答を強化したり、初期の失敗後の有用なフォローアップを抑制したりしうる。<br><br>本論文は、学習を個々のストリーミング判断に合わせるターン単位のGRPOフレームワーク「TurnWise」を提案する。TurnWiseは、軌跡レベルのフィードバックとターン単位の対話との不整合に対処し、情報のある応答を促して冗長性を減らす。<br><br>具体的には、ターン単位のクレジット割り当ては、無音で完結した接頭辞のスコアリングを使って、各判断の残りのリターンからグループ相対アドバンテージを構築し、その学習信号を以前の報酬から分離する。ターン平均の方策最適化も導入される。「いつ話すか」を学ぶエージェントのための信用割り当ての精緻化である。", "url": "https://arxiv.org/abs/2611.06728", "publishedAt": "2026-11-04T16:16:27Z", "timestamp": 1793808987000, "monthKey": "2026-11", "field": "cs.CV", "genre": "Vision / Multimodal", "authors": ["Shuai Dong", "Kanghui Tian", "Linghan Chen", "Wenqi Shao", "Hongrui Wu", "Haowen Hou", "Yongfu Zhu", "Xuehui Wang", "Ziyue Wang", "Wenpu Liu", "Weichu Xie", "Yuqi Xu", "Congcong Wang", "Kaiwen Tuo", "Caoyuan Ma", "Taiqiang Wu", "Ji Zhao", "Wenzheng Chang", "Dianyi Wang", "Siyuan Wang", "Zhongyu Wei", "Yu Qiao", "Jiaqi Wang"], "categories": ["cs.CV", "cs.CL", "cs.LG"]}, {"source": "arXiv cs.RO", "title": "Dexterous Robotic Hands in the Foundation-Model Era: A Full-Stack Survey of Hardware, Data, Cross-Embodiment Transfer, Learning, and Evaluation", "titleJa": "基盤モデル時代の器用なロボットハンド――ハードウェア・データ・身体間転移・学習・評価の全スタック調査", "summaryHtml": "器用なロボットハンドは、大規模な人間データや基盤モデルとますます結びつけられているが、ハードウェア、表現学習、評価の進歩はばらばらに評価されることが多い。本調査は2024年1月から2026年11月初めまでの研究をレビューし、技術的系譜を確立するためにそれ以前の研究も含める。<br><br>文献は相互依存する5つの層に整理される。ハードウェア、データ収集とキュレーション、身体間（クロスエンボディメント）転移、学習と基盤モデル、そして評価と応用である。人間の手と物体の理解と、触覚センシングが、横断的な2つの視点を提供する。システムレベルのアーキテクチャ、比較表、5件のケース分析が、これらの層にわたる設計選択を結びつける。研究内の実験比較と、不均一なコーパス統計、ベンダ仕様、企業公表結果は区別して扱われる。<br><br>結論の一つは、人間データの価値は運動学的・視覚的な条件に依存することである。ハンドという部品ではなく、データから評価までの全スタックで設計を考える必要性を示すサーベイである。", "url": "https://arxiv.org/abs/2611.06724", "publishedAt": "2026-11-04T16:13:29Z", "timestamp": 1793808809000, "monthKey": "2026-11", "field": "cs.RO", "genre": "Vision / Multimodal", "authors": ["Ji Pei"], "categories": ["cs.RO", "cs.AI", "cs.CV", "cs.LG"]}, {"source": "arXiv cs.LG", "title": "Symmetry Breaking at the Edge of Stability via Central Flow Analysis", "titleJa": "中心フロー解析による安定性の縁での対称性の破れ", "summaryHtml": "ニューラルネットの連続対称性は、線形ネットやReLUネットにおける層のバランス性のように、勾配フローのもとで不変な保存量を生む。有限ステップの勾配降下はこれらの法則を保つとは限らない。とりわけ「安定性の縁（EOS）」では、反復はより滑らかな軌道の周りで振動し、その軌道は中心フロー力学（Cohen et al., 2025）で記述できる。本研究は、勾配フローの保存法則がこのレジームの中心フロー記述のもとでどう進化するかを調べる。<br><br>著者らは、曲率の補正が、臨界パラメータ方向に沿った振動の共分散によって決まる有限次元のドリフトを誘発することを示す。<br><br>これにより、中心フロー力学に従ってEOSでどの保存法則が残り、どれが破れるかを分析する第一歩が踏み出される。分析対象は、スカラーの2層モデル、2層の行列分解、2層ReLUネットワークであり、既知の保存法則がどうなるかが検証される。最適化の幾何と対称性の関係を深める理論研究である。", "url": "https://arxiv.org/abs/2611.06718", "publishedAt": "2026-11-04T16:11:59Z", "timestamp": 1793808719000, "monthKey": "2026-11", "field": "cs.LG", "genre": "Scientific AI", "authors": ["Naima Elosegui Borras", "Georgios Arvanitidis"], "categories": ["cs.LG"]}, {"source": "arXiv cs.CL", "title": "Reasoning over Non-Parametric Memory in Multilingual LLMs: A Cognitive-Based Analysis of Relational Knowledge", "titleJa": "多言語LLMにおける非パラメトリックメモリ上の推論――関係知識の認知的分析", "summaryHtml": "検索拡張生成（RAG）は、言語モデルが事前学習で記憶した連想に頼るのではなく、文脈に述べられた関係について推論できることを前提にしている。本研究は、事実を取得させるのではなくプロンプトに直接与えることで、この証拠条件付きの関係推論を分離して調べる。<br><br>「Rel-Bloom」は、30のWikidata関係から構築された450問の多肢選択式の、制御された多言語診断である。同じ源泉関係が、Bloomに着想を得た5段階（記憶・理解・応用・分析・評価）と、3つの真実性条件（事実的・反事実的・中立化）で具体化される。43モデル、6言語、2つの多言語設定（226,800件の予測）にわたる評価で、3つの知見が際立った。<br><br>第一に、評価したすべてのオープンウェイトモデル系列で、応用から分析への段階で精度が急落し、大規模Graniteバケットでは47.2ポイントに達したが、どちらのGeminiモデルでもそうはならなかった。「文脈に書いてある関係を、その場で推論に使う」能力の段差が、多言語で定量化された研究である。", "url": "https://arxiv.org/abs/2611.06715", "publishedAt": "2026-11-04T16:11:26Z", "timestamp": 1793808686000, "monthKey": "2026-11", "field": "cs.CL", "genre": "LLM / NLP", "authors": ["Zohreh Abbasi Liasi", "Batoul Hammoud", "Anas Madkoor", "Ehsaneddin Asgari"], "categories": ["cs.CL", "cs.AI"]}, {"source": "arXiv cs.LG", "title": "Energy-Guided Transport for Projection-Free Physics-Informed Flow Matching", "titleJa": "エネルギー誘導輸送――射影なしで物理制約を組み込むフローマッチング", "summaryHtml": "フローマッチングをはじめとする深層生成モデルは、複雑な物理系を合成する強力な道具として台頭してきた。しかし標準的なアーキテクチャは純粋に統計駆動で、背後の支配方程式に無知なため、推論時に基本的な物理制約に違反しがちである。これらの制約を強制する既存のゼロショット手法は、硬い代数射影に頼ることが多い。疎な境界条件には有効だが、そのような離散的な幾何補正を密で全領域のPDEへ適用すると、確率の経路を乱し、学習された多様体から逸脱させ、大きな計算オーバーヘッドを招く可能性がある。<br><br>この課題に対し、本論文は「エネルギー誘導輸送」を提案する。非線形の物理制約を滑らかなポテンシャルエネルギーの景観として定式化する、訓練不要の新しい枠組みである。ODE積分を中断するのではなく、その流れにエネルギーの勾配を沿わせる発想である。<br><br>物理情報つき生成を、射影の硬さなしに実現する方向の研究であり、物理法則とデータ駆動生成の両立を狙う。", "url": "https://arxiv.org/abs/2611.06711", "publishedAt": "2026-11-04T16:09:05Z", "timestamp": 1793808545000, "monthKey": "2026-11", "field": "cs.LG", "genre": "Agents / Reasoning", "authors": ["Giuliano Galadini", "Aurelio Uncini", "Danilo Comminiello"], "categories": ["cs.LG", "physics.comp-ph"]}, {"source": "arXiv cs.RO", "title": "Where Is VLA Inference Time Spent? Bottlenecks and Optimization Interactions Across GPUs", "titleJa": "VLAの推論時間はどこで使われるか――GPU横断のボトルネックと最適化の相互作用", "summaryHtml": "視覚・言語・行動（VLA）モデルは、カメラ観測と言語指示をロボットの行動へ写像する。しかし大きなバックボーンと繰り返しの行動生成により、推論がロボットの次の行動に求められるリアルタイム要件より長くかかることがある。VLA計算の負荷を減らすため、量子化やプルーニングなど複数の最適化手法が提案されてきた。これらは、より良いカーネルコンパイルや、eagerモードの代わりにCUDAグラフを使うといった一般的な最適化と組み合わせることもできる。<br><br>しかし、これらの最適化結果の多くは単一のGPU種で、少数のVLAモデルについて報告されるだけで、特定のハードウェア上でモデルの本当のボトルネックが何か、最適化が報告結果の外側へどう汎化するかは分析されていない。<br><br>本論文は、CUDAグラフから始まる7系統の推論最適化手法についての包括的な測定研究を提供する。最適化の「効く・効かない」を、モデルとGPUの組み合わせごとに実測で切り分ける、実務的な価値の高い研究である。", "url": "https://arxiv.org/abs/2611.06710", "publishedAt": "2026-11-04T16:09:02Z", "timestamp": 1793808542000, "monthKey": "2026-11", "field": "cs.RO", "genre": "Vision / Multimodal", "authors": ["Muhammad Danish Waseem", "Ahmed Ali-Eldin Hassan"], "categories": ["cs.RO"]}, {"source": "arXiv cs.CY", "title": "Beyond the principle-practice gap: Responsible AI as situated epistemic and ethical practice", "titleJa": "原則と実践のギャップを超えて――責任あるAIは、状況に埋め込まれた認識的・倫理的実践である", "summaryHtml": "責任あるAIの研究は、倫理原則がAIの設計と開発にしばしば反映されないことを見出してきた。「原則と実践のギャップ」として概念化され、これは実装、認識、コンプライアンスの問題、ひいてはシステムや個人の振る舞いの不足として枠づけられてきた。本論文は、別の説明を提示する。<br><br>法執行、商業、研究、サバイバー支援の文脈にわたり、AIを活用した人身売買対策システムを設計・統治するアクターへの14件の半構造化インタビューに基づき、著者らは、そのような見かけのギャップは、アクターがある問題を――しかし他の問題はそうではなく――行動を要する倫理的問題として認識するに至る、多様で複雑な制度的・専門的条件から生じると論じる。<br><br>認識的な選択が倫理的判断と絡み合うことが示され、知覚、判断、状況づけられた行動、社会技術的な物質化という、相互に結びついた4つの局面がたどられる。ギャップを「不足」ではなく「現場の条件」から理解し直す、質的な研究である。", "url": "https://arxiv.org/abs/2611.06709", "publishedAt": "2026-11-04T16:08:17Z", "timestamp": 1793808497000, "monthKey": "2026-11", "field": "cs.CY", "genre": "LLM / NLP", "authors": ["Thao Do Ngoc", "Emma Carmel"], "categories": ["cs.CY", "cs.AI"]}, {"source": "arXiv cs.CL", "title": "ALTO: African and Levantine Tech-Facilitated Gender-Based Violence Corpus", "titleJa": "ALTO――アフリカとレバントにおけるテクノロジーを介したジェンダー暴力コーパス", "summaryHtml": "テクノロジーを介したジェンダーに基づく暴力（TFGBV）は、直接的・隠蔽的さまざまな形態を通じて、女性とジェンダー少数者に広く及ぶオンラインの危害である。ジェンダー化された危害の検出のための現在のモデルと注釈付きデータセットは、グローバルノースの言語のデータと、そこで訓練されたモデルに支配されている。<br><br>ヨルダン、フランス語圏西アフリカ、ケニアの市民社会組織（CSO）と協力し、著者らは、レバント・アラビア語、アフリカのフランス語、スワヒリ語における、文化的・言語的に関連したTFGBVの事例をクラウドソースする、コミュニティ主導のアプローチを開発した。クラウドソースされたデータをアクティブラーニングで注釈し、小さいながら性能の良いデータセット（N=3,022）「ALTO」を構築し、3言語でのTFGBV検出を改善した。<br><br>ベンチマークとファインチューニングの実験では、既存の有害コンテンツ検出モデルはALTO内でのTFGBVの再現率が低く、ファインチューニングで改善することが示された。モデルは隠蔽的な危害を見逃しがちであることも分かった。過小評価されてきた言語圏の危害検出に光を当てる研究である。", "url": "https://arxiv.org/abs/2611.06706", "publishedAt": "2026-11-04T16:06:15Z", "timestamp": 1793808375000, "monthKey": "2026-11", "field": "cs.CL", "genre": "LLM / NLP", "authors": ["Tianwei Zhang", "Ivy Njoki Nyagwencha", "Zahraa Dirani", "Shalini Joshi", "Scott A. Hale"], "categories": ["cs.CL", "cs.AI", "cs.CY", "cs.LG"]}, {"source": "arXiv cs.LG", "title": "Where It Breaks: Diagnosing Perception, Memory, and Decision Failures of a Vision-Language Agent in Pac-Man", "titleJa": "どこで壊れるか――パックマンで視覚言語エージェントの知覚・記憶・意思決定の失敗を診断する", "summaryHtml": "上下左右だけの行動でパックマンをプレイするようエージェントを訓練すると、基本的な問いが生じる。性能が悪いとき、何を改善すべきか。難しさは、画面を読むことから来るのか、長い系列にわたる行動選択から来るのか。本研究は、Qwen3.5-9Bベースのエージェントについて、独立した知覚チェックと、原始方策の強化学習研究を通じてこれらの問題を調べる。<br><br>テキスト化した盤面を使い、画像の転記を意思決定インターフェースから取り除いた方策研究では、8つの保留迷路でのクリア率は、この最適化の前の0%から、選ばれたチェックポイントで80.2%（残機3つ追加）まで上がった。知覚チェックは、正確な静止スクリーンショットの読み取りが、対話中の誤りと共存しうることを示す。<br><br>別の方策比較では、さらなる最適化がより悪い行動選択を伴うことも示された。これらの知見は、訓練後の具体的なチェックを動機づける。知覚は使用中の状態で評価すること、そして失敗の所在を切り分けることが、エージェント改善の前提になるという診断の研究である。", "url": "https://arxiv.org/abs/2611.06704", "publishedAt": "2026-11-04T16:04:57Z", "timestamp": 1793808297000, "monthKey": "2026-11", "field": "cs.LG", "genre": "Vision / Multimodal", "authors": ["Xinglu Wang", "Edward Wang", "Yong Zhang", "Zhenan Fan"], "categories": ["cs.LG"]}, {"source": "arXiv cs.RO", "title": "When to Ask for Help: Uncertainty-Triggered Aerial Refinement for Off-Road Navigation", "titleJa": "いつ助けを求めるか――不確実性で発動するオフロード航法の空中支援", "summaryHtml": "異種の空地チームは、地上車両のセンサの限られた範囲と視点を、空からのセンシングで補うことができる。しかし、UGV（無人地上車）が支援を必要とするのはいつか、UAV（無人航空機）がどんな情報を集めるべきかを決めることは課題として残る。本論文は、プランナ条件付きの空地支援手法を提示する。地図情報の不確実性がUGVの現在のMPPIロールアウトへどう影響するかを評価する手法である。<br><br>航法が劣化したままであれば、解決済みの地図仮説のもとで同じロールアウトを採点し、最も有用な改善をもたらす地図レイヤーを選び、対応する空からの計測を要求し、返ってきた情報を融合して再計画する。固定した支援役割やタスク構造、不確実性そのものに駆動される手法と異なり、本手法は、不確実性の解消が予測される地上航法を改善するかどうかに支援を条件づける。<br><br>3つのオフロード路線での180回のシミュレーション試行で、本手法は98.9%の目標到達を達成しながら、UAVの平均飛行時間を削減した。「必要なときだけ呼ぶ」支援の設計である。", "url": "https://arxiv.org/abs/2611.06702", "publishedAt": "2026-11-04T16:02:59Z", "timestamp": 1793808179000, "monthKey": "2026-11", "field": "cs.RO", "genre": "Robotics", "authors": ["Pranay Samineni", "Adam Thorpe", "John Chubick", "Anand Balakrishnan", "Christian Ellis", "Swarat Chaudhuri", "Ufuk Topcu"], "categories": ["cs.RO", "eess.SY"]}, {"source": "arXiv cs.CV", "title": "Agent-Driven Generative Priors for Pathology Image Synthesis and Segmentation", "titleJa": "エージェント駆動の生成事前知識による病理画像の合成とセグメンテーション", "summaryHtml": "病理学のための深層学習手法は、大規模なピクセルレベルの注釈の入手可能性の低さとコストの高さに制約されている。合成データはこの制限を緩和できるが、既存のパイプラインは信頼できる品質管理を欠くことが多く、下流の分析とのつながりも弱い。この問題に対し、本論文は、自動データスクリーニング、生成的表現学習、下流タスクへの効率的な適応を統合した3段階の枠組みを提案する。<br><br>第一に、病理エージェントシステムを開発して画像品質を評価しサンプルを選別し、公開TCGAリポジトリから選ばれた217,030件の病理パッチからなるデータセット「TCGA-200K」を得た。第二に、選別されたデータで生成モデルを訓練する。画像合成に加えて、そのバックボーンは下流タスクへ転移可能な構造的・意味的表現を学ぶ。<br><br>第三に、事前学習した生成バックボーンを、意味的セグメンテーションへ適応させる。データの質の管理から生成、実タスクへの転移までを一つの流れにまとめた、医療画像AIの実践的なパイプライン研究である。", "url": "https://arxiv.org/abs/2611.06701", "publishedAt": "2026-11-04T16:02:29Z", "timestamp": 1793808149000, "monthKey": "2026-11", "field": "cs.CV", "genre": "Vision / Multimodal", "authors": ["Sicheng Yang", "Rui Tang", "Haipeng Zhou", "Hongqiu Wang", "Zhaohu Xing", "Jianda Ma", "Lie Dai", "Guang Yang", "Lei Zhu"], "categories": ["cs.CV"]}, {"source": "Hugging Face Papers", "title": "What Does Multi-Turn Reinforcement Learning Really Improve in LLM Agents?", "titleJa": "マルチターン強化学習はLLMエージェントの何を本当に改善するのか", "summaryHtml": "マルチターンのエージェント強化学習は長期的なタスクで優れた性能を示すが、その効果は対話の制約条件に大きく左右される。本論文は、サンプリングの幅Kと対話の深さTを変えた評価指標Pass@(K,T)により、軌跡レベルの強化学習の優位性が十分なターン数の予算に依存し、予算が厳しくなると大幅に低下することを示した。<br><br>また、エージェント強化学習は一段階の意思決定の質を一様に高めるわけではない。その強みはむしろ、誤りからの回復や長期的な粘り強さに集中していることが明らかになった。展開時の予算依存によるリスクを抑えるため、論文ではプロセス監督シグナルの利点と限界を予備的に論じ、学習中に相互作用の予算を変化させるBudgetMix RLを提案している。<br><br>実験の結果、BudgetMix RLは多様な実行条件のもとで頑健な性能を達成し、学習時と展開時でターンの予算が異なる場合でも性能が崩れにくい点が確認された。エージェント強化学習の効果を「何が改善され、何が改善されないか」という観点から切り分けた、実務的にも示唆に富む検証である。", "url": "https://arxiv.org/abs/2611.06483", "publishedAt": "2026-11-04T08:24:54Z", "authors": ["Kejian Zhu", "Zhuoran Jin", "Shangqing Tu", "Tianyi Men", "Yupu Hao", "Jiachun Li", "Kang Liu", "Jun Zhao"], "categories": ["cs.LG", "cs.CL"], "field": "cs.LG", "genre": "Agents / Reasoning", "timestamp": 1793780694000, "monthKey": "2026-11"}, {"source": "PubMed", "title": "Next-Generation Psychedelic Drug Development", "titleJa": "次世代サイケデリック医薬品の開発――新たな治療法づくりへの指針", "summaryHtml": "サイケデリック医療は、うつ病や不安、心的外傷後ストレス障害（PTSD）など、さまざまな神経精神疾患の治療として急速に注目を集めている。これまで治療が難しいとされてきた症状に対しても新たな選択肢として期待が高まり、研究と臨床応用の両面で広がりを見せている。新しいサイケデリック類縁体や投与レジメンが次々に登場し、検証すべき変数の数も増え続けている。本総説は、次世代のサイケデリック治療を開発するうえでの多様なアプローチと留意点を整理する。<br><br>現在の評価法やモデルの長所と短所を検討し、どのような試験系が新しい化合物や投与法の評価に適しているかを論じる。類縁体や投与レジメンが増えるなかで、どの変数をどう検証すべきか、開発の現場で直面する判断材料を提示する。既存の評価法では捉えきれない側面や、モデルごとの適用範囲の違いにも触れ、開発の進め方を多角的に検討する。<br><br>最後に、次世代のサイケデリック医薬品開発に向けた指針と考慮事項を示す。安全性と有効性の両立をどう評価し、臨床応用へどうつなげるか。サイケデリック医療の広がりを受けて、開発の枠組みそのものを整えるための展望をまとめた総説である。", "url": "https://pubmed.ncbi.nlm.nih.gov/42980080/", "publishedAt": "2026-11-04T00:00:00Z", "authors": ["Lindsay P Cameron", "Matthew W Johnson", "Kevin S Murnane", "Mark M Rasenick", "Charles D Nichols"], "categories": ["psychedelics", "drug development", "review"], "field": "PubMed", "genre": "Psychedelics / Therapy", "timestamp": 1793750400000, "monthKey": "2026-11"}, {"source": "PubMed", "title": "Psilocybin-Assisted Therapy for Cancer-Related Psychological and Existential Distress in Adults with Cancer: An Integrative Systematic Review", "titleJa": "がんに伴う心理的・実存的苦悩に対するシロシビン支援療法――統合的システマティックレビュー", "summaryHtml": "シロシビン支援療法は、がんや生命を脅かす病気に伴う苦悩への有望な介入として再び注目されている。本統合的システマティックレビューはPRISMA指針に沿い、2025年8月10日から10月31日までにPubMed、Scopus、Google Scholar、CINAHLを検索し、6つの独立した臨床コホートから得られた11件の報告を対象に、がんのある成人における抑うつ、不安、実存的苦悩に対する安全性、有効性、治療的影響を評価した。<br><br>シロシビンは一般に、準備、投与、統合の構造化された枠組みのもとで、監督下の単回中〜高用量（25〜30mg/70kg）として投与された。すべての研究デザインを通じて、抑うつ、不安、実存的苦悩、死への恐怖の迅速かつ持続的な軽減がみられ、効果は2〜6か月、場合によっては4.5年まで続いた。質的知見では、感情の明晰さや受容、スピリチュアルな安寧、意味との再接続が際立った。11件中5件がMMATの基準を満たし、他では評価者の盲検化や代表性、交絡の統制などに課題が残った。<br><br>シロシビン関連の重篤な有害事象は報告されず、一時的な心血管系の変化や頭痛、吐き気、不安、短時間の精神病様症状がみられた。著者らは、がん関連の心理的・実存的苦悩に対する有望だがいまだ研究段階の緩和的介入だと結論づけている。", "url": "https://pubmed.ncbi.nlm.nih.gov/42975895/", "publishedAt": "2026-11-03T00:00:00Z", "authors": ["Athanasios Pitis", "Maria Nikoloudi", "Nikos Stefanis", "Kyriaki Mystakidou"], "categories": ["psychedelics", "systematic review"], "field": "PubMed", "genre": "Psychedelics / Therapy", "timestamp": 1793664000000, "monthKey": "2026-11"}]};

    const genres = [...new Set((DATA.articles||[]).map(a => a.genre).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'ja'));
    const fields = [...new Set((DATA.articles||[]).map(a => a.field).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'ja'));
    function fill(select, values){ values.forEach(v=>{ const o=document.createElement('option'); o.value=v; o.textContent=v; select.appendChild(o); }); }
    fill(byId('month'), months); fill(byId('genre'), genres); fill(byId('field'), fields);
    function render(){
      const month=byId('month').value, genre=byId('genre').value, field=byId('field').value, sort=byId('sort').value, kw=norm(byId('keyword').value);
      let rows=(DATA.articles||[]).filter(a=>{
        if(month&&a.monthKey!==month) return false; if(genre&&a.genre!==genre) return false; if(field&&a.field!==field) return false;
        const hay=norm([a.titleJa,a.title,a.summaryHtml,a.authors.join(' '),a.categories.join(' ')].join(' '));
        if(kw&& !hay.includes(kw)) return false; return true;
      });
      rows = rows.slice().sort((a,b)=> sort==='oldest' ? a.timestamp-b.timestamp : sort==='title' ? a.titleJa.localeCompare(b.titleJa,'ja') : b.timestamp-a.timestamp);
      byId('meta').textContent = `更新: ${DATA.updatedAt || '-'} / 表示件数: ${rows.length}件`;
      byId('list').innerHTML = rows.map(a=>`
        <article>
          <div class="src">${esc(a.source)} / ${esc(a.publishedAt.slice(0,10))}</div>
          <h2 class="title">${esc(a.titleJa)}</h2>
          <div class="tags"><span class="tag">AI</span><span class="tag">${esc(a.genre)}</span><span class="tag">${esc(a.field)}</span>${a.categories.slice(0,4).map(c=>`<span class=\"tag\">${esc(c)}</span>`).join('')}</div>
          <div class="summary">${a.summaryHtml}</div>
          <div class="box"><strong>ソース・引用元</strong><br>配信元：${esc(a.source)}<br>原題：${esc(a.title)}<br>著者：${esc(a.authors.join(', '))}<br>原文URL：<a href="${esc(a.url)}" target="_blank" rel="noopener">${esc(a.url)}</a></div>
        </article>`).join('');
    }
    ['month','genre','field','sort'].forEach(id=>byId(id).addEventListener('change',render)); byId('keyword').addEventListener('input',render); render();
  </script>
</body>
</html>
