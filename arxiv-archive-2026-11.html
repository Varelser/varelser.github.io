stamp": 1793664000000, "monthKey": "2026-11"}, {"source": "PubMed", "title": "From Evidence to Practice: A Systematic Review of Implementation of Psychedelic-Assisted Psychotherapy.", "titleJa": "エビデンスから実践へ――サイケデリック支援心理療法の実装に関する系統的レビュー", "summaryHtml": "サイケデリック支援心理療法（PAP）は、PTSDやうつ病など従来治療が難しい精神疾患への有効性を示すエビデンスが急速に蓄積し、米国では公衆や政府の関心も高まっている。一方で、効果的な治療法の発見と臨床現場への導入のあいだには溝があり、複雑な治療様式を体系的に実装するための知見を整理する必要がある。本系統的レビューは、PAPの実装に関する文献を特定し、その知見を統合して今後の方向性を示すことを目的とした。<br><br>PRISMA 2020に沿い、6つのデータベースを「implementation」「psychedelic（MDMA、シロシビン、LSD、ケタミン）」「psychotherapy」などの検索語で調べた。2,406件が特定され、重複と非査読文献を除いて2,074件をタイトル・抄録でスクリーニングし、47件を全文精査して20件を採用した。実装科学の枠組みPRISMに沿って、実装に関連する要因を抽出・統合した。<br><br>採用された20件のうち15件は、組織の視点から横断調査や質的インタビューで実装を評価したものだった。残りは患者の視点（2件）、インフラ（2件）、患者特性（1件）を扱っていた。学術的な場から利用しやすい臨床プログラムへPAPを移すうえでの最良実践に関する、実装に焦点を当てた研究には目立った不足がある。PAPを現実の現場で安全かつ効果的に実装するには、この溝を埋めることが不可欠だと結論づけている。", "url": "https://pubmed.ncbi.nlm.nih.gov/42978762/", "publishedAt": "2026-11-02T00:00:00Z", "authors": ["John D Gault", "Erin Almklov", "Shirley Tang", "Borsika A Rabin", "Brian C Huynh", "James O E Pittman"], "categories": ["psychedelic-assisted psychotherapy", "implementation science", "systematic review"], "field": "PubMed", "genre": "Psychedelics / Therapy", "timestamp": 1793577600000, "monthKey": "2026-11"}, {"source": "PubMed", "title": "A multi-institutional investigation of psilocybin's effects on mouse behavior", "titleJa": "シロシビンのマウス行動への影響を多施設で検証――再現可能な効果はどれか", "summaryHtml": "サイケデリック薬物のマウス行動への影響を報告する研究は急増しているが、その効果がどれほど再現性があり信頼できるかは不確かだった。これまで報告されてきた行動への影響が、別の研究室でも同じように得られるのかは確かめられていなかった。本研究は、5つの独立した研究室が同じ実験を行う多施設共同のアプローチで、シロシビンのマウス行動への影響のうち何が頑健で再現可能かを検証した。各実験には雌雄あわせて約200匹のマウスが用いられた。<br><br>その結果、シロシビン（2 mg/kg、腹腔内投与）は急性期に不安・回避関連の行動を増やし、恐怖の表出を減らすことが、頑健かつ再現可能な形で示された。一方で、投与24時間後の不安・抑うつ様行動の軽減や恐怖消去学習の促進といった持続的な効果は、再現可能な形では認められなかった。社会的選好や社会的報酬学習への影響も観察されなかった。<br><br>シロシビンには確かな急性効果がある一方で、報告されてきた持続的な効果の一部は控えめか一貫しない可能性があることが示された。マウス研究におけるサイケデリック効果の解釈に、再現性の観点から慎重さを求める検証結果である。", "url": "https://pubmed.ncbi.nlm.nih.gov/42972049/", "publishedAt": "2026-11-02T00:00:00Z", "authors": ["Odilia D Lu", "Katrina White", "Kendall B Raymond", "Christine Liu", "Alexandra S Klein", "Nathaniel Green", "Sam Vaillancourt", "Austin J Gallagher", "Lena Shindy", "Alyssa Li", "Kira E Wallquist", "Ruoxian Li", "Mila Zou", "Austen B Casey", "Natalie Perez", "Muhammad Asim", "Setareh Metanat", "Kelsey R Logas", "Vivan Chhaya", "Alexander S Enos", "Ellie M Ho", "Lindsay P Cameron", "Matthew B Pomrenze", "Jason M Tucciarone", "Vikaas S Sohal", "Mazen A Kheirbek", "Andrea M Gomez", "Stephan Lammel", "Boris D Heifets", "Robert C Malenka"], "categories": ["psilocybin", "mouse behavior", "reproducibility"], "field": "PubMed", "genre": "Psychedelics / Therapy", "timestamp": 1793577600000, "monthKey": "2026-11"}, {"source": "Europe PMC", "title": "Pharmacological treatment of bereavement-related distress: a systematic review", "titleJa": "死別に伴う苦痛の薬物療法――系統的レビュー", "summaryHtml": "遷延性悲嘆障害がDSM-5-TRとICD-11の診断体系に加わったことで、悲嘆に対する薬物療法への関心が高まっている。本レビューは、死別に伴う心理的苦痛、とくに死別に続発するうつ病への薬物療法がどのように行われ、どの程度有効かを調べた。MEDLINE、Embase、コクラン・ライブラリーなど6つのデータベースを検索し、2024年12月まで更新した。33件の研究（症例報告・症例集積10件、コホート研究7件、臨床試験16件）、参加者211,920人が対象となった。<br><br>9つの薬物クラスが検討され、抗うつ薬が最も多く研究されていた。対照群のある研究では、どの薬物も悲嘆症状そのものを軽減しなかった。抗うつ薬と、ベータ遮断薬とアスピリンの併用は、死別者のうつ症状には有効に見えた。薬物介入の悲嘆に対する効果量は無視できるほど小さく（標準化平均差-0.06）、うつに対する効果量も小さく有意ではなかった（-0.29）。<br><br>研究の質は全体に低く、方法論の弱さと報告のばらつきが統合を難しくした。現行の薬物療法が遷延性悲嘆障害に有効だという証拠はなく、治療選択肢の空白を埋めるさらなる研究が必要だという結論である。", "url": "https://europepmc.org/article/MED/42969145", "publishedAt": "2026-11-02T00:00:00Z", "authors": ["LaPlante CD", "Saviano SC", "Hardt MM", "Pain K", "Kolla S", "Lee C", "Maciejewski PK", "Russell D", "Smid GE", "Prigerson HG"], "categories": ["bereavement", "prolonged grief disorder", "pharmacotherapy", "systematic review"], "field": "European journal of psychotraumatology", "genre": "Psychedelics / Therapy", "timestamp": 1793577600000, "monthKey": "2026-11"}, {"source": "PubMed", "title": "Safety and Efficacy of Psilocybin During Anticancer Treatment: A Phase II Trial Secondary Analysis.", "titleJa": "抗がん治療中のシロシビン――安全性と有効性の第II相試験二次解析", "summaryHtml": "シロシビン支援療法は、がん患者のうつ病に対して速やかな抗うつ効果を示すことが知られている。だがこれまでの試験の多くは、全身性の抗がん治療を現に受けている人を除外してきたため、この集団における安全性データは限られていた。本研究は、抗がん治療を併用している患者とそうでない患者とで、シロシビン支援療法の有効性と安全性を比較した、フェーズ2非盲検単群試験の二次解析である。<br><br>対象は悪性腫瘍と大うつ病性障害の診断を受けた成人30人（平均年齢56歳、女性70%）で、個人および集団での準備療法、25mgのシロシビン経口投与による集団投与セッション、個人および集団での統合療法を受けた。全身性抗がん治療群は17人、非併用群は13人。主要評価項目は投与後1・3・8週のMADRS（モンゴメリー・アスベルグうつ病評価尺度）スコアの群間差で、副次項目として8週までの有害事象を調べた。<br><br>その結果、MADRSスコアは両群とも大幅に低下し、群間に有意差はなかった（1週 P=.88、3週 P=.93、8週 P=.97）。有害事象は両群で頻繁だったが、重度の有害事象4件と重篤な有害事象1件はいずれも全身性治療群で生じたものの、シロシビンとは無関係と判断された。検査値や自殺念慮にシロシビンに起因する変化も見られなかった。抗がん治療中のがん患者でもシロシビン支援療法の抗うつ効果と安全性は同等であり、今後の試験に積極的治療中の患者を含める根拠となる。", "url": "https://pubmed.ncbi.nlm.nih.gov/42546985/", "publishedAt": "2026-11-01T00:00:00Z", "authors": ["Daniel A Schaefer", "Manish Agrawal", "Emanuele Mazzola", "Michelle K Leff", "Celia Leeks", "Benjamin S Kematick", "Yvan Beaussant"], "categories": ["psilocybin", "cancer", "depression"], "field": "PubMed", "genre": "Psychedelics / Therapy", "timestamp": 1793491200000, "monthKey": "2026-11"}, {"source": "PubMed", "title": "Functional Network Organization Underlying Individual Differences in False Feedback Susceptibility: A Graph Theoretical Analysis", "titleJa": "偽の身体フィードバックにだまされやすい脳――内受容ネットワークの個人差をグラフ理論で読む", "summaryHtml": "実際には存在しない身体の生理的フィードバックを信じ込んでしまう――そんな「偽フィードバック」へのだまされやすさには個人差があり、内受容（身体内部の感覚の処理）の違いを反映すると考えられてきたが、その背景にある脳ネットワークの仕組みは分かっていなかった。本研究は、偽フィードバック課題を行った健常成人41名の安静時機能的結合を、グラフ理論の手法で解析した。先行研究の賦活解析から定めた9つの関心領域について、局所効率やクラスタリング係数、中心性、経路長などのネットワーク指標を複数の閾値で計算した。<br><br>だまされやすさを予測したのは、3つの異なるネットワーク組織のパターンだった。だまされやすい人ほど、内受容の鍵となる後部島の偏心度が高く、ネットワークの周辺に位置づけられていた。また、眼窩前頭皮質は複数の指標で一貫して分離しており、経路長が長く中心性が低かった。さらに小脳ネットワークでは、局所効率の低下と媒介中心性の上昇を伴う再構成が見られた。<br><br>偽フィードバックへの感受性は、後部島などの内受容領域と、眼窩前頭皮質の情動評価システムとの統合が弱いことに由来する。内受容の処理は、内臓感覚と情動評価、認知制御システムの効率的な統合に依存するというネットワークモデルを支持する結果であり、内受容の気づきや情動調節を標的とする介入にもつながる知見である。", "url": "https://pubmed.ncbi.nlm.nih.gov/42963537/", "publishedAt": "2026-11-01T00:00:00Z", "authors": ["J Patchitt", "T Karapanagiotidis", "S N Garfinkel", "M Miller", "M Tsakiris", "A Clark", "H D Critchley"], "categories": ["interoception", "false feedback", "graph theory"], "field": "PubMed", "genre": "Consciousness / Neuroscience", "timestamp": 1793491200000, "monthKey": "2026-11"}, {"source": "PubMed", "title": "Altered neural prioritization of auditory information during cross-modal attention in children with ADHD.", "titleJa": "ADHD児における聴覚情報の神経的優先づけの変化――クロスモーダル注意下のEEG研究", "summaryHtml": "聴覚的な注意を効率よく働かせるには、目標となる音をそれ以外の音より優先しなければならない。注意の欠陥はADHDの中核的な特徴だが、視覚と聴覚をまたぐ注意のなかで、聴覚情報の優先づけを担う神経メカニズムは明らかになっていなかった。本研究は学齢期の子ども95名（ADHD群46名、定型発達群49名、平均年齢10.81歳）を対象に、視覚的手がかりによる聴覚空間注意課題を脳波（EEG）計測下で行い、N2ac成分と多変量パターン解析（MVPA）で調べた。<br><br>定型発達群では目標位置のMVPA復号が強まり、非目標位置の復号は弱まった。目標と非目標の神経的な区別が大きいほどN2acの振幅も大きかった。一方ADHD群では目標の側性化が弱く、N2ac振幅が小さく、目標の復号は弱い一方で非目標の復号が強まり、関連情報と無関連情報の神経的な区別が縮んだ。<br><br>目標関連の側性化の低下は反応時間のばらつきの大きさと、目標復号精度の低下は多動性・衝動性の症状の重さと関連していた。ADHD児では聴覚情報の神経的優先づけが変わっており、それが行動のばらつきや症状の重さと結びつくことが示された。注意機能障害の神経認知メカニズムへの新たな知見である。", "url": "https://pubmed.ncbi.nlm.nih.gov/42826852/", "publishedAt": "2026-11-01T00:00:00Z", "authors": ["Letian Yang", "Yiyang Wang", "Weizhen Yin", "Xinru Xu", "Xuye Yuan", "Han Yang", "Shanping Zhang", "Shuai Jiang", "Yuanjie Guo", "Yao Wang", "Chanjuan Yang", "Yanlin Zhou", "Dongwei Li", "Yan Song", "Cai-Ping Dang"], "categories": ["ADHD", "auditory attention", "EEG", "N2ac", "cross-modal attention"], "field": "NeuroImage", "genre": "Consciousness / Neuroscience", "timestamp": 1793491200000, "monthKey": "2026-11"}, {"source": "PubMed", "title": "Pupil-DLC: An open-source deep learning pipeline for scalable, marker-less tracking of pupil dynamics across conscious and unconscious states.", "titleJa": "Pupil-DLC――意識状態と無意識状態を横断する瞳孔動態のスケーラブルなマーカー不要トラッキング", "summaryHtml": "瞳孔径は覚醒や注意、認知処理、意識と相関する非侵襲的な脳状態バイオマーカーである。しかし既存の瞳孔測定ソフトウェアは、実験条件や種をまたいでスケーラビリティと頑健性に欠けることが多い。本研究は、DeepLabCut に基づくオープンソースのオフライン・パイプライン Pupil-DLC を提案する。主にマウスを対象とし、マーカーなしで瞳孔を追跡できる。<br><br>140本超の頭部固定マウスの動画から人手でアノテーションした21,909フレームで学習した。覚醒状態に加え、サイケデリックスや麻酔による薬物誘発状態も含み、瞳孔サイズの多様性を最大化するようデータセットを構成した。Pupil-DLC は、高速処理向けの汎用モデルと、セッションごとに最適化する個別モデルの二重構造を採用する。覚醒時、サイケデリック投与時、麻酔時の瞳孔動態をグラウンドトゥルースと高い一致で捉え、活発な移動時も静止時も同等の追跡精度を示した。<br><br>信頼度指標は人間のフレーム品質評価と一致し、精度と保持率のトレードオフを原理的に調整できる。さらに、再学習なしに、昼光下やスマートフォン撮影を含む多様な条件・フレームレートのヒト動画にも拡張できることを示した。既存の自動手法を精度とフレーム保持率で上回りつつ、リアルタイム級の計算効率を維持する。瞳孔形状のばらつきや遮蔽、反射、撮像アーチファクトに頑健な学習済みキーポイント表現によるもので、マウス神経科学からヒトへの橋渡しとなる再現可能な基盤を提供する。", "url": "https://pubmed.ncbi.nlm.nih.gov/42401399/", "publishedAt": "2026-11-01T00:00:00Z", "authors": ["Parsa Seyfourian", "Lydia C Marks", "Leslie D Claar", "Yasmeen Nahas", "Miles Keating", "Christof Koch", "Irene Rembado"], "categories": ["pupil dynamics", "consciousness", "DeepLabCut"], "field": "Journal of Neuroscience Methods", "genre": "Consciousness / Neuroscience", "timestamp": 1793491200000, "monthKey": "2026-11"}, {"source": "PubMed", "title": "Beyond head-twitch response: Acute psilocybin affects spontaneous behaviors in rats in a dose-dependent manner.", "titleJa": "ヘッドトゥイッチ反応を超えて――急性シロシビンがラットの自発行動に与える用量依存的影響", "summaryHtml": "サイケデリック薬はさまざまな神経精神疾患の治療薬として期待されているが、動物モデルにおける自発行動への影響は、これまで広く研究されてきたヘッドトゥイッチ反応（HTR）を除くと体系的に調べられてこなかった。本研究は、雌雄のラットにシロシビン（0.5、1、1.5 mg/kg）または生理食塩水を投与し、行動をビデオで記録して分析した。<br><br>HTRとウェットドッグシェイクに加え、不動、立ち上がり、グルーミング、嗅ぎ・掘り、旋回の5つの自発行動も評価した。各行動は用量反応プロファイルが異なり、HTRはベル型の曲線を示す一方、不動は用量とともに直線的に増加した。立ち上がりとグルーミングは低用量でも顕著に減少し、嗅ぎ・掘りは高用量でのみ減少、旋回は用量と性別で変動した。<br><br>行動間の相関も用量依存的に変化した。結果は、シロシビンの影響がHTRにとどまらず幅広い自発行動に及ぶことを示し、生理学的に妥当な用量範囲での神経行動学的効果を特定する枠組みを提供する。動物実験におけるサイケデリック作用の評価を広げる研究である。", "url": "https://pubmed.ncbi.nlm.nih.gov/42639976/", "publishedAt": "2026-11-01T00:00:00Z", "authors": ["Praachi Tiwari", "Bryan W Jenkins", "Catherine F Moore", "Hudson Zhou", "Tylaah George", "David B Yaden", "Elise M Weerts"], "categories": ["psilocybin", "spontaneous behavior", "head-twitch response", "dose-response"], "field": "Journal of Psychopharmacology", "genre": "Psychedelics / Therapy", "timestamp": 1793491200000, "monthKey": "2026-11"}, {"source": "PubMed", "title": "Defining 'psychedelic'.", "titleJa": "「サイケデリック」を定義する――幻視と心理的洞察を核とする主観状態", "summaryHtml": "「サイケデリック」という言葉は1956年、ハンフリー・オズモンドが「魂（psyche）」と「顕現させる（delic）」を組み合わせて造語した。語源は「魂を照らし出す」状態を指すが、それが単なる主観状態の名なのか、そうした作用を主作用とする薬物の分類名なのかは曖昧なままだった。本研究は現象学を出発点に、「サイケデリック」というカテゴリーを経験の側から定義し直すことを試みた。<br><br>著者らは200人以上の参加者に、シロシビン、ケタミン、MDMAの3薬物について、デルファイ法で作成した主観評価項目への回答を求めた。因子分析の結果、主観体験は3〜4つのほぼ独立した次元に分かれ、機械学習分類器は体験の特徴だけからどの薬物かを正確に予測できた。3薬物の主観プロファイルは明確に異なり、シロシビンは幻視と心理的洞察、ケタミンは解離、MDMAは向社会的で愛情に満ちた感情によって特徴づけられた。<br><br>結論として、シロシビンは典型的なサイケデリックであり、「サイケデリック」とはサイケデリック状態を引き起こす薬物のカテゴリーとして定義できるという。核となる現象は、幻視と心理的洞察を特徴とする主観状態である。薬物の分類を主観体験に基づいて整理し直すことで、サイケデリック研究の概念的な土台を明確にした研究である。", "url": "https://pubmed.ncbi.nlm.nih.gov/42605589/", "publishedAt": "2026-11-01T00:00:00Z", "authors": ["A E Ostrand", "M M Nour", "C Timmermann", "A Rosati", "L X Luan", "A Gomez-Emilsson", "J Bornemann", "K T Greenway", "L Roseman", "Carhart-Harris R"], "categories": ["psychedelic", "phenomenology", "psilocybin", "ketamine", "MDMA"], "field": "Journal of Psychopharmacology", "genre": "Psychedelics / Therapy", "timestamp": 1793491200000, "monthKey": "2026-11"}, {"source": "PubMed", "title": "Silence is golden: Documenting the speech production of participants and support providers in psilocybin administration sessions for the treatment of post-traumatic stress disorder.", "titleJa": "沈黙は金なり――PTSD治療におけるシロシビン投与セッションの発話記録", "summaryHtml": "シロシビンは、モニタリングと支援を伴う投与によって複数の精神疾患に有望性を示してきた。しかし、サイケデリック試験における参加者支援の役割やその性質については議論が続いている。本研究は、Compass社の試験における投与セッションのモニタリングと支援の構造を、音声記録の分析から明らかにすることを試みた。<br><br>外傷後ストレス障害（PTSD）の参加者22人を対象とした12週間の臨床試験で、25mgのCOMP360シロシビン投与セッション中の参加者と支援者の発話速度（分あたり語数）を測定し、投与後のインタビューをテーマ分析した。投与セッションでは発話はまれで、平均で78%の時間が沈黙で占められたのに対し、準備セッションやフォローアップでは25〜30%にとどまった。支援は最小限でありながら体験上は際立っており、自律性が促され、変性意識状態における支援の中心は安心感の付与と承認だった。<br><br>言葉のやり取りが乏しいことは、Compassの投与セッションにおける支援が、多くの従来型心理療法やMDMA支援療法、サイケデリックを用いる精神分析的な治療パラダイムとは区別できることを示唆している。サイケデリック治療における「支援」の実態を定量的に記録した研究である。", "url": "https://pubmed.ncbi.nlm.nih.gov/42460632/", "publishedAt": "2026-11-01T00:00:00Z", "authors": ["Robert F Dougherty", "Nadav Liam Modlin", "Niall M McGowan", "Patrick Staples", "Ella Williams", "Patrick Clarke", "Mario Shafiei", "Carly Leininger", "Merve Alti", "Megan Croal", "Lindsey Marwood", "Namik Kirlić", "Gregory A Ryslik", "Guy M Goodwin"], "categories": ["psychedelic", "psilocybin", "PTSD", "psychotherapy"], "field": "Journal of Psychopharmacology", "genre": "Psychedelics / Therapy", "timestamp": 1793491200000, "monthKey": "2026-11"}, {"source": "PubMed", "title": "Validating and creating a short-form of the persisting effects questionnaire: A measure of positive and negative outcomes from psychedelic experiences.", "titleJa": "持続効果質問票の短縮版を検証する――サイケデリック体験の肯定的・否定的な持続効果を測る尺度", "summaryHtml": "持続効果質問票（PEQ）は、サイケデリックなどの体験がもたらす肯定的・否定的な持続効果を自己報告で測る尺度で、多くの研究で使われてきた。しかし正式な妥当性検証は行われておらず、140項目以上に単項目も加わるため回答者の負担が大きいという課題があった。本研究はPEQの統計的・質的な妥当性検証を行い、検証済みの短縮版（PEQ-SF）を作成することを目指した。<br><br>検証では、探索的因子分析による次元削減、収束的・弁別的妥当性の検討、別サンプルでの確認的因子分析、項目の理解しやすさを確認する質的な回答過程評価、そして臨床試験と健常者試験の2件の投与研究における原版と短縮版の比較を行った。その結果、原版の因子構造は定量的には支持されず、全体的な肯定的因子と否定的因子からなる2因子構造が明らかになった。<br><br>この2因子構造は、肯定的・否定的各1因子の計14項目に、ウェルビーイングと意味に関する原版の単項目3つを加えた短縮版でも維持された。原版には十分な妥当性がなかった一方、短縮版は強い心理測定的特性を示し、投与研究でも原版と同様に機能した。サイケデリック研究の測定負担を軽くする実用的な成果である。", "url": "https://pubmed.ncbi.nlm.nih.gov/42755297/", "publishedAt": "2026-11-01T00:00:00Z", "authors": ["Rebecca Ehrenkranz", "Nathan D Sepeda", "Sean P Goldy", "Brandon M Weiss", "Praachi Tiwari", "Arozo Azimi", "David B Yaden"], "categories": ["psychedelic", "questionnaire", "psychometrics"], "field": "Journal of Psychopharmacology", "genre": "Psychedelics / Therapy", "timestamp": 1793491200000, "monthKey": "2026-11"}]};
    const byId = id => document.getElementById(id);
    const norm = s => String(s||'').toLowerCase().normalize('NFKC').replace(/\s+/g,' ').trim();
    const esc = s => String(s||'').replace(/[&<>"]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
    const months = [...new Set((DATA.articles||[]).map(a => a.monthKey).filter(Boolean))].sort().reverse();
    const genres = [...new Set((DATA.articles||[]).map(a => a.genre).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'ja'));
    const fields = [...new Set((DATA.articles||[]).map(a => a.field).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'ja'));
    function fill(select, values){ values.forEach(v=>{ const o=document.createElement('option'); o.value=v; o.textContent=v; select.appendChild(o); }); }
    fill(byId('month'), months); fill(byId('genre'), genres); fill(byId('field'), fields);
    function render(){
      const month=byId('month').value, genre=byId('genre').value, field=byId('field').value, sort=byId('sort').value, kw=norm(byId('keyword').value);
      let rows=(DATA.articles||[]).filter(a=>{
        if(month&&a.monthKey!==month) return false; if(genre&&a.genre!==genre) return false; if(field&&a.field!==field) return false;
        const hay=norm([a.titleJa,a.title,a.summaryHtml,a.authors.join(' '),a.categories.join(' ')].join(' '));
        if(kw&& !hay.includes(kw)) return false; return true;
      });
      rows = rows.slice().sort((a,b)=> sort==='oldest' ? a.timestamp-b.timestamp : sort==='title' ? a.titleJa.localeCompare(b.titleJa,'ja') : b.timestamp-a.timestamp);
      byId('meta').textContent = `更新: ${DATA.updatedAt || '-'} / 表示件数: ${rows.length}件`;
      byId('list').innerHTML = rows.map(a=>`
        <article>
          <div class="src">${esc(a.source)} / ${esc(a.publishedAt.slice(0,10))}</div>
          <h2 class="title">${esc(a.titleJa)}</h2>
          <div class="tags"><span class="tag">AI</span><span class="tag">${esc(a.genre)}</span><span class="tag">${esc(a.field)}</span>${a.categories.slice(0,4).map(c=>`<span class=\"tag\">${esc(c)}</span>`).join('')}</div>
          <div class="summary">${a.summaryHtml}</div>
          <div class="box"><strong>ソース・引用元</strong><br>配信元：${esc(a.source)}<br>原題：${esc(a.title)}<br>著者：${esc(a.authors.join(', '))}<br>原文URL：<a href="${esc(a.url)}" target="_blank" rel="noopener">${esc(a.url)}</a></div>
        </article>`).join('');
    }
    ['month','genre','field','sort'].forEach(id=>byId(id).addEventListener('change',render)); byId('keyword').addEventListener('input',render); render();
  </script>
