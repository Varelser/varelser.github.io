<script>
/* 4DT Tier B (2026-11-13): View Transitions for view switches +
   Wake Lock during timeline playback. Self-contained and fails safe:
   everything is feature-detected and try/caught, and nothing here
   reads or writes the app's own state. */
(function(){
  'use strict';
  var api = { vtInstalled:false, wakeInstalled:false, vtCalls:0, wakeRequests:0, wakeReleases:0, lookInstalled:false, look:null, bodyInstalled:false, persist:null, badge:null, pip:false, guideInstalled:false, guideLinks:0 };
  window.__twTierB = api;
  var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)');

  /* ---------- View Transitions (workspace <main> only) ---------- */
  try {
    if (document.startViewTransition && !reduceMotion.matches) {
      var lastMainMutation = 0;
      var mo = new MutationObserver(function(){ lastMainMutation = performance.now(); });
      var moTarget = null;
      function armObserver(){
        if (moTarget && document.contains(moTarget)) return;
        var main = document.querySelector('#root > main');
        if (main) { moTarget = main; mo.observe(main, {childList:true, subtree:true}); }
      }
      armObserver();
      new MutationObserver(armObserver).observe(document.documentElement, {childList:true, subtree:true});

      var pending = null;
      document.addEventListener('click', function(ev){
        try {
          if (pending) return;
          var btn = ev.target && ev.target.closest ? ev.target.closest('button') : null;
          if (!btn) return;
          var section = btn.closest('#root > aside > div');
          if (!section) return;
          var head = section.querySelector('button');
          var label = head ? (head.textContent || '') : '';
          if (!/トピック|レイアウト・表示|画面分割/.test(label)) return;
          var clickAt = performance.now();
          var vt = document.startViewTransition(function(){
            return new Promise(function(resolve){
              if (lastMainMutation > clickAt) { resolve(); return; }
              var done = false;
              var obs = new MutationObserver(function(){
                if (done) return; done = true; obs.disconnect();
                requestAnimationFrame(function(){ requestAnimationFrame(resolve); });
              });
              var main = document.querySelector('#root > main');
              if (main) obs.observe(main, {childList:true, subtree:true});
              setTimeout(function(){
                if (done) return; done = true; obs.disconnect();
                try { vt.skipTransition(); } catch(e) {}
                resolve();
              }, 220);
            });
          });
          pending = vt; api.vtCalls++;
          document.documentElement.classList.add('tw-vt-active');
          var clear = function(){
            if (pending === vt) pending = null;
            document.documentElement.classList.remove('tw-vt-active');
          };
          vt.finished.then(clear, clear);
        } catch(e) {}
      }, true);
      api.vtInstalled = true;
    }
  } catch(e) {}

  /* ---------- Wake Lock while the timeline plays ----------
     The bottom bar is the app's own fixed div. During playback its
     time label / playhead mutate continuously; 3 mutation batches
     within 2.5s counts as "playing". Silence for 5s releases. */
  try {
    if ('wakeLock' in navigator) {

<script>
// Thought Workbench hover panels (overlay): hovering a side panel's toggle
// opens it; leaving the panel + toggle for a while closes it again.
// A click on the toggle while hover-opened pins it open (manual control wins).
(function () {
  try {
    if (window.__twHoverPanels) return;
    window.__twHoverPanels = true;
    var OPEN_DWELL = 150, CLOSE_DELAY = 700;
    var sides = {
      L: { open: false, openTimer: 0, closeTimer: 0, synthetic: false },
      R: { open: false, openTimer: 0, closeTimer: 0, synthetic: false }
    };
    function toggleBtn(side) {
      var name = side === 'L' ? '左パネルを' : '右パネルを';
      var btns = document.querySelectorAll('button[aria-label^="' + name + '"]');
      return btns.length ? btns[0] : null;
    }
    function isOpen(side) {
      var b = toggleBtn(side);
      return !!(b && (b.getAttribute('aria-label') || '').indexOf('閉じる') > -1);
    }
    function asideFor(side) {
      var list = document.querySelectorAll('aside');
      for (var i = 0; i < list.length; i++) {
        var c = list[i].className || '';
        if (side === 'L' && c.indexOf('rounded-r') > -1) return list[i];
        if (side === 'R' && c.indexOf('rounded-l') > -1) return list[i];
      }
      return list.length ? list[side === 'L' ? 0 : list.length - 1] : null;
    }
    function clickToggle(side) {
      var b = toggleBtn(side), s = sides[side];
      if (!b) return;
      s.synthetic = true;
      try { b.click(); } catch (e) {}
      s.synthetic = false;
    }
    function inZone(side, el) {
      if (!el || !el.closest) return false;
      var b = toggleBtn(side), a = asideFor(side);
      if (b && el.closest('button') === b) return true;
      if (a && (el === a || el.closest('aside') === a)) return true;
      return false;
    }
    function sideOf(el) {
      if (!el || !el.closest) return null;
      var b = el.closest('button');
      if (b) {
        var l = b.getAttribute('aria-label') || '';
        if (l.indexOf('左パネルを') === 0) return 'L';
        if (l.indexOf('右パネルを') === 0) return 'R';
      }
      var a = el.closest('aside');
      if (a) {
        var c = a.className || '';
        if (c.indexOf('rounded-r') > -1) return 'L';
        if (c.indexOf('rounded-l') > -1) return 'R';
      }
      return null;
    }
    document.addEventListener('mouseover', function (e) {
      var side = sideOf(e.target);
      if (!side) return;
      var s = sides[side];
      if (e.relatedTarget && inZone(side, e.relatedTarget)) return; // moving within zone
      clearTimeout(s.closeTimer);
      var b = toggleBtn(side);
      if (b && (b.getAttribute('aria-label') || '').indexOf('開く') > -1 && !s.openTimer) {
        s.openTimer = setTimeout(function () {
          s.openTimer = 0;
          if (!isOpen(side)) { clickToggle(side); s.open = true; }
        }, OPEN_DWELL);
      }
    }, true);
    document.addEventListener('mouseout', function (e) {
      var side = sideOf(e.target);
      if (!side) return;
      if (e.relatedTarget && inZone(side, e.relatedTarget)) return; // still in zone
      var s = sides[side];
      clearTimeout(s.openTimer); s.openTimer = 0;
      if (s.open) {
        clearTimeout(s.closeTimer);
        s.closeTimer = setTimeout(function () {
          s.closeTimer = 0;
          if (s.open && isOpen(side)) clickToggle(side);
          s.open = false;
        }, CLOSE_DELAY);
      }
    }, true);
    document.addEventListener('click', function (e) {
      var side = sideOf(e.target);
      if (!side) return;
      var s = sides[side];
      if (s.synthetic) return; // our own toggle click: let it through
      var b = e.target.closest && e.target.closest('button');
      if (b && b === toggleBtn(side) && s.open) {
        // first manual click while hover-opened: pin it open, swallow the click
        e.stopPropagation(); e.preventDefault();
        s.open = false;
        clearTimeout(s.closeTimer);
      } else if (b && b === toggleBtn(side)) {
        s.open = false; clearTimeout(s.closeTimer); clearTimeout(s.openTimer); s.openTimer = 0;
      }
    }, true);
  } catch (e) { /* hover panels are decorative; never break the app */ }
})();

<script>
// Thought Workbench sphere bar autohide (overlay): the bottom sphere-look bar
// stays hidden until the cursor moves over where it sits, then fades back out
// when the cursor leaves. The app still decides (via display) whether the
// sphere view is active at all; this only gates opacity/visibility.
(function () {
  try {
    if (window.__twSphereBarHover) return;
    window.__twSphereBarHover = true;
    var style = document.createElement('style');
    style.textContent =
      '#twSphereBar{opacity:0;visibility:hidden;transform:translate(-50%,10px);' +
      'transition:opacity .22s ease,transform .22s ease,visibility 0s linear .22s;pointer-events:none}' +
      '#twSphereBar.tw-reveal{opacity:1;visibility:visible;transform:translate(-50%,0);' +
      'transition:opacity .22s ease,transform .22s ease;pointer-events:auto}' +
      '@media (hover: none) { #twSphereBar { opacity: 1 !important; visibility: visible !important; pointer-events: auto !important; } }';
    document.head.appendChild(style);
    var MARGIN = 16, HIDE_DELAY = 500;
    var hideTimer = 0, rafPending = false, lastX = -1, lastY = -1;
    function bar() { return document.getElementById('twSphereBar'); }
    function active(b) { return b && b.style.display !== 'none' && b.getClientRects().length > 0; }
    function reveal(b) {
      clearTimeout(hideTimer); hideTimer = 0;
      if (!b.classList.contains('tw-reveal')) b.classList.add('tw-reveal');
    }
    function scheduleHide(b) {
      if (!b.classList.contains('tw-reveal') || hideTimer) return;
      hideTimer = setTimeout(function () {
        hideTimer = 0;
        var bb = bar();
        if (bb) bb.classList.remove('tw-reveal');
      }, HIDE_DELAY);
    }
    function evaluate() {
      rafPending = false;
      var b = bar();
      if (!active(b)) { if (b) b.classList.remove('tw-reveal'); return; }
      var r = b.getBoundingClientRect();
      var inside = lastX >= r.left - MARGIN && lastX <= r.right + MARGIN &&
                   lastY >= r.top - MARGIN && lastY <= r.bottom + MARGIN;
      if (inside) reveal(b); else scheduleHide(b);
    }
    document.addEventListener('mousemove', function (e) {
      lastX = e.clientX; lastY = e.clientY;
      if (!rafPending) { rafPending = true; requestAnimationFrame(evaluate); }
    }, true);
    document.addEventListener('focusin', function (e) {
      var b = bar();
      if (b && e.target && b.contains(e.target) && active(b)) reveal(b);
    }, true);
    document.addEventListener('focusout', function () {
      var b = bar();
      if (b) scheduleHide(b);
    }, true);
  } catch (e) { /* sphere bar autohide is decorative; never break the app */ }
})();
