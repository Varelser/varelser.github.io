    var pipWin = null;
    async function openPiP(b) {
      if (!('documentPictureInPicture' in window)) { flash(b, '未対応'); return; }
      if (pipWin) { pipWin.close(); return; }
      try {
        pipWin = await documentPictureInPicture.requestWindow({ width: 300, height: 300 });
        var d = pipWin.document;
        d.body.style.margin = '0';
        d.body.style.overflow = 'hidden';
        d.body.style.background = getComputedStyle(document.documentElement).getPropertyValue('--tw-bg') || '#000';
        var c = d.createElement('canvas');
        c.style.cssText = 'position:absolute;inset:0;width:100%;height:100%;';
        d.body.appendChild(c);
        var g = c.getContext('2d');
        api.pip = true;
        var draw = function(now) {
          if (!pipWin) return;
          pipWin.requestAnimationFrame(draw);
          var w = pipWin.innerWidth, h = pipWin.innerHeight;
          var dpr = Math.min(pipWin.devicePixelRatio || 1, 2);
          if (c.width !== Math.round(w * dpr) || c.height !== Math.round(h * dpr)) { c.width = Math.round(w * dpr); c.height = Math.round(h * dpr); }
          g.setTransform(dpr, 0, 0, dpr, 0, 0);
          g.clearRect(0, 0, w, h);
          refreshInk();
          drawBody(g, BODY[cur] ? cur : 'lines', w / 2, h / 2, Math.min(w, h) / 2 - 10, (now - bt0) / 1000);
        };
        pipWin.requestAnimationFrame(draw);
        pipWin.addEventListener('pagehide', function() { pipWin = null; api.pip = false; });
      } catch (e) { pipWin = null; }
    }
    var sep = document.createElement('span');
    sep.className = 'sep';
    bar.appendChild(sep);
    function barBtn(label, title, fn, act) {
      var b = document.createElement('button');
      b.type = 'button'; b.textContent = label; b.title = title;
      if (act) b.setAttribute('data-act', act);
      b.addEventListener('click', function(ev) { fn(b, ev); });
      bar.appendChild(b);
      return b;
    }
    barBtn('画像', '球体をPNGで保存（Alt=透過背景）', async function(b, ev) {
      flash(b, '生成中');
      try { var blob = await exportPNGBlob(!!(ev && ev.altKey)); if (blob) saveBlob(blob, 'thought-sphere.png'); } catch (e) {}
    }, 'png');
    barBtn('コピー', 'PNGをクリップボードにコピー（Alt=透過背景）', async function(b, ev) {
      try {
        var blob = await exportPNGBlob(!!(ev && ev.altKey)); if (!blob) return;
        if (navigator.clipboard && window.ClipboardItem) {
          var item = {}; item['image/png'] = blob;
          await navigator.clipboard.write([new ClipboardItem(item)]);
          flash(b, '済');
        } else flash(b, '未対応');
      } catch (e) { flash(b, '不可'); }
    }, 'copy');
    barBtn('共有', 'PNGを共有', async function(b) {
      try {
        var blob = await exportPNGBlob(); if (!blob) return;
        var f = new File([blob], 'thought-sphere.png', { type: 'image/png' });
        if (navigator.canShare && navigator.canShare({ files: [f] })) await navigator.share({ files: [f] });
        else saveBlob(blob, 'thought-sphere.png');
      } catch (e) {}
    }, 'share');
    barBtn('全画面', '球体ビューを全画面表示', function() {
      var svg = sphereSvg(), el = svg ? svg.parentElement : null;
      if (document.fullscreenElement) document.exitFullscreen().catch(function() {});
      else if (el && el.requestFullscreen) el.requestFullscreen().catch(function() {});
    }, 'fs');
    barBtn('小窓', 'ミニ球体を常時最前面の小窓で表示', function(b) { openPiP(b); }, 'pip');

    var lastBadge = -1;
    var syncVis2 = function() {
      if (!bar.isConnected) document.body.appendChild(bar);
      var fs = document.fullscreenElement;
      if (fs && bar.parentElement !== fs) fs.appendChild(bar);
      if (!fs && bar.parentElement !== document.body) document.body.appendChild(bar);
      try {
        if (navigator.setAppBadge) {
          var m = document.body.textContent.match(/(\\d+)\\s*events/);
          var n = m ? parseInt(m[1], 10) : 0;
          if (n !== lastBadge) {
            lastBadge = n; api.badge = n;
            if (n > 0) navigator.setAppBadge(n).catch(function() {});
            else if (navigator.clearAppBadge) navigator.clearAppBadge().catch(function() {});
          }
        }
      } catch (e) {}
    };
    document.addEventListener('keydown', function(e) {
      if (e.metaKey || e.ctrlKey || e.altKey) return;
      var tg = e.target;
      if (tg && (tg.tagName === 'INPUT' || tg.tagName === 'TEXTAREA' || tg.tagName === 'SELECT' || tg.isContentEditable)) return;
      if (!bar.isConnected || bar.style.display === 'none') return;
      var clickLook = function(name) { var b = bar.querySelector('button[data-look="' + name + '"]'); if (b) b.click(); };
      var clickAct = function(name) { var b = bar.querySelector('button[data-act="' + name + '"]'); if (b) b.click(); };
      var key = e.key;
      if (key >= '1' && key <= '9') clickLook(LOOKS[parseInt(key, 10) - 1][0]);
      else if (key === '0') clickLook('topo');
      else if (key === 'u' || key === 'U') clickLook('pulse');
      else if (key === 'f' || key === 'F') clickAct('fs');
      else if (key === 's' || key === 'S') clickAct('png');
      else if (key === 'c' || key === 'C') clickAct('copy');
    });
    setInterval(syncVis2, 900);
  } catch (e) { /* look switcher is decorative; never break the app */ }
})();
</script>
</body>
</html>
