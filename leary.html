         message in the handler; applyNoiseFilter only renders).
         Cases: playing WITH level -> pulse formula; playing WITHOUT
         level (old sender) -> master-only baseline; stopped/stale/OFF
         -> follower reset and filter cleared (existing behaviour). */
      let vlFast=0, vlSlow=0, vlFollowerInit=false, vlHasLevel=false;
      /* sync-config from Varelser Studio (protocol v1.1, R3) */
      let vlCfgAmt=1, vlCfgFast=0.65, vlCfgSlow=0.08;
      function applySyncConfig(m){
        const t=(m.targets && m.targets.leary) || null;
        const g=m.global || {};
        const c01=v=>Math.max(0,Math.min(1,v));
        if(t && typeof t.amount==='number' && Number.isFinite(t.amount)) vlCfgAmt=c01(t.amount)*2;
        if(typeof g.attack==='number' && Number.isFinite(g.attack)) vlCfgFast=0.05+0.9*c01(g.attack);
        if(typeof g.release==='number' && Number.isFinite(g.release)) vlCfgSlow=0.01+0.29*c01(g.release);
        msgEl.textContent='Studio sync-config: amount x'+vlCfgAmt.toFixed(2)+' / attack '+vlCfgFast.toFixed(2)+' / release '+vlCfgSlow.toFixed(2);
      }
      function vlFollowerUpdate(d){
        const inst=noiseDriveOf(d); /* null when stopped or no level fields */
        if(inst===null){ vlFast=0; vlSlow=0; vlFollowerInit=false; vlHasLevel=false; return; }
        if(!vlFollowerInit){ vlFast=inst; vlSlow=inst; vlFollowerInit=true; }
        else { vlFast+=vlCfgFast*(inst-vlFast); vlSlow+=vlCfgSlow*(inst-vlSlow); }
        vlHasLevel=true;
      }
      function applyNoiseFilter(){
        if(!cv) return;
        if(ch && lastNoise && (Date.now()-lastNoise.ts<1500) && lastNoise.playing){
          const m=Math.max(0,Math.min(1,Number(lastNoise.master)||0));
          cv.style.transition='filter 120ms linear';
          if(vlHasLevel){
            const swing=Math.min(0.75,Math.max(-0.45,(vlFast-vlSlow)*20));
            const levelTerm=Math.max(0,Math.min(1,vlFast));
            const b=Math.min(1.65,Math.max(0.55,0.82+0.22*m+(0.22*levelTerm+0.38*swing)*vlCfgAmt));
            const ct=Math.min(1.45,Math.max(0.85,1+(0.10*levelTerm+0.18*swing)*vlCfgAmt));
            cv.style.filter='brightness('+b.toFixed(3)+') contrast('+ct.toFixed(3)+')';
          }
          else cv.style.filter='brightness('+(0.85+0.3*m).toFixed(3)+')';
        } else { vlFast=0; vlSlow=0; vlFollowerInit=false; vlHasLevel=false; cv.style.transition=''; cv.style.filter=''; }
      }
      function start(){
        if(ch || typeof BroadcastChannel==='undefined') return;
        try{
          ch=new BroadcastChannel('varelser-link-v1');
          ch.onmessage=function(ev){
            const d=ev && ev.data; if(!d || d.app==='leary') return;
            try{
              if(d.app==='studio' && d.type==='sync-config') applySyncConfig(d);
              else if(d.type==='seed-sync' && d.master!==undefined && !applying) applyRemoteSeed(d.master);
              else if(d.app==='noise' && d.type==='state'){
                lastNoise=d;
                vlFollowerUpdate(d);
                const l1=d.layers && d.layers[0] ? d.layers[0].type : '';
                const lv=(typeof d.levelPeak==='number'&&Number.isFinite(d.levelPeak))?' / level '+Math.max(0,Math.min(1,d.levelPeak)).toFixed(2):'';
                noiseEl.textContent='Noise: master '+(Number(d.master)||0).toFixed(2)+' / '+l1+' / '+(d.playing?'再生中':'停止')+lv;
                applyNoiseFilter();
              }
              else if(d.app==='meikyoshisui' && d.type==='state'){
                meikyoEl.textContent='♪ Meikyoshisui: '+d.bpm+' BPM / '+(d.genre||'')+' / '+(d.playing?'再生中':'停止');
              }
            }catch(e){}
          };
          lastSeed=state.seed; sendState();
          pollTimer=setInterval(function(){
            if(state.seed!==lastSeed){ lastSeed=state.seed; if(!applying) sendState(); }
            applyNoiseFilter();
          },500);
          const rb=document.getElementById('btnRandomize');
          if(rb) rb.addEventListener('click', function(){ setTimeout(function(){ if(ch && !applying) sendSeedSync(); },0); });
        }catch(e){ ch=null; }
      }
      function stop(){
        if(pollTimer){ clearInterval(pollTimer); pollTimer=null; }
        if(ch){ try{ ch.close(); }catch(e){} ch=null; }
        if(cv){ cv.style.transition=''; cv.style.filter=''; }
      }
      let saved=false; try{ saved=localStorage.getItem(KEY)==='1'; }catch(e){}
      toggle.checked=saved; if(saved) start();
      toggle.addEventListener('change', function(){ try{ localStorage.setItem(KEY, toggle.checked?'1':'0'); }catch(e){} if(toggle.checked) start(); else stop(); });
      syncBtn.addEventListener('click', sendSeedSync);
    }catch(e){}
  })();

  init();
})();
</script>

<script>
/* leary-noise-refine: collapsible panel sections, Noise-style.
   Additive only: generation/rendering code is untouched. State key
   follows Noise's convention (noise_ui_panels_v1). */
(() => {
  'use strict';
  const KEY = 'leary_ui_panels_v1';
  let saved = {};
  try { saved = JSON.parse(localStorage.getItem(KEY) || '{}') || {}; } catch (e) { saved = {}; }
  const sections = Array.from(document.querySelectorAll('.panel .section'));
  const persist = () => {
    const map = {};
    sections.forEach((sec, i) => { map[i] = sec.classList.contains('collapsed') ? 1 : 0; });
    try { localStorage.setItem(KEY, JSON.stringify(map)); } catch (e) {}
  };
  sections.forEach((sec, i) => {
    if (saved[i]) sec.classList.add('collapsed');
    const head = sec.querySelector('h3');
    if (head) head.addEventListener('click', () => { sec.classList.toggle('collapsed'); persist(); });
  });
  const tools = document.createElement('div');
  tools.className = 'leary-panel-tools';
  const mk = (label, fn) => {
    const b = document.createElement('button');
    b.type = 'button'; b.textContent = label;
    b.addEventListener('click', fn);
    return b;
  };
  tools.append(
    mk('\u5168\u3066\u958b\u304f', () => { sections.forEach(s => s.classList.remove('collapsed')); persist(); }),
    mk('\u5168\u3066\u9589\u3058\u308b', () => { sections.forEach(s => s.classList.add('collapsed')); persist(); })
  );
  const head = document.querySelector('.panel-head');
  if (head && head.parentNode) head.parentNode.insertBefore(tools, head.nextSibling);
})();
</script>

<script id="leary-lien-v2-script">
/* leary-lien-v2: move Leary to the Lien shell — 56px header, full-area
   canvas, bottom text toolbar, floating settings panel (closed by
   default so the artwork opens large). Additive: existing buttons keep
   their core listeners because the same elements are re-parented. */
(() => {
  'use strict';
  const app = document.getElementById('app');
  const panel = document.querySelector('aside.panel');
  const viewer = document.getElementById('viewer');
  if (!app || !panel || !viewer) return;

  const header = document.createElement('header');
  header.className = 'leary2-header';
  header.innerHTML = '<div class="leary2-title">LEARY</div>';
  app.insertBefore(header, app.firstChild);

  const bar = document.createElement('nav');
  bar.className = 'leary2-toolbar';
  bar.setAttribute('aria-label', 'Leary toolbar');

  const toggle = document.createElement('button');
  toggle.className = 'btn leary2-toggle';
  toggle.type = 'button';
  toggle.textContent = '設定';
  toggle.setAttribute('aria-expanded', 'false');
  bar.appendChild(toggle);

  const status = document.createElement('span');
  status.className = 'leary2-status';
  status.id = 'leary2Status';

  const move = (id) => { const el = document.getElementById(id); if (el) bar.appendChild(el); return el; };
  move('btnRandomize');
  move('btnResetView');
  const spacer = document.createElement('span'); spacer.className = 'leary2-spacer'; bar.appendChild(spacer);
  bar.appendChild(status);
  move('btnExportViewPng');
  move('btnExportSvg');
  move('btnExportSettings');
  move('btnImportSettings');
  move('btnExportPng');
  app.appendChild(bar);

  const setOpen = (open) => {
    document.body.classList.toggle('leary2-panel-open', open);
    toggle.setAttribute('aria-expanded', String(open));
    if (window.__leary2Resize) window.__leary2Resize();
  };
  toggle.addEventListener('click', () => setOpen(!document.body.classList.contains('leary2-panel-open')));
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') setOpen(false); });

  /* Canvas sizing uses the viewer box; tell it to refit after the shell
     is in place and on the next frame (fonts/layout settle). */
  const refit = () => window.dispatchEvent(new Event('resize'));
  window.__leary2Resize = refit;
  requestAnimationFrame(refit);
  setTimeout(refit, 250);


  /* ============ Leary power-up features (additive) ============ */
  const $id = (i) => document.getElementById(i);
  const toast = (msg) => {
    let t = $id('leary2Toast');
    if (!t) { t = document.createElement('div'); t.id = 'leary2Toast';
      t.style.cssText = 'position:fixed;left:50%;bottom:70px;transform:translateX(-50%);background:rgba(10,10,10,.92);color:#fff;border:1px solid rgba(255,255,255,.25);border-radius:8px;padding:8px 14px;font-size:12px;z-index:9999;pointer-events:none;opacity:0;transition:opacity .25s';
      document.body.appendChild(t); }
    t.textContent = msg; t.style.opacity = '1';
    clearTimeout(t._h); t._h = setTimeout(() => { t.style.opacity = '0'; }, 2400);
  };
  const NUMCFG = ['lineCount','lineWidthMin','lineWidthMax','opacity','flowCoverage','generationWidth','segmentResolution','batchLines','swirlRadius','swirlStrength','curveTension','turbulence','turbulenceFreq','verticalStretch'];
  const SELCFG = { swirlType: 'swirlType', renderShape: 'renderShape', colorMode: 'colorMode' };
  const snapshotSettings = () => {
    const cfg = {};
    NUMCFG.forEach(k => { const el = $id(k); if (el) cfg[k] = Number(el.value); });
    Object.keys(SELCFG).forEach(k => { const el = $id(k); if (el) cfg[k] = el.value; });
    const bg = $id('bgColor'); if (bg) cfg.bgColor = bg.value;
    const bt = $id('bgTransparent'); if (bt) cfg.bgTransparent = bt.checked;
    cfg.colors = Array.from(document.querySelectorAll('#colors .color-item')).map(item => {
      const ins = item.querySelectorAll('input');
      return { hex: ins[0].value, weight: Number(ins[1].value) || 1, width: Number(ins[2].value) || 1 };
    });
    const o = { app: 'Leary', version: 1, config: cfg };
    const seed = $id('seedInput'); if (seed && seed.value !== '') o.seed = Number(seed.value);
    const w = $id('width'), h = $id('height');
    if (w && h) o.size = { width: Number(w.value), height: Number(h.value) };
    const num = (id, key) => { const el = $id(id); if (el) o[key] = Number(el.value); };
    num('exportScale', 'exportScale'); num('previewScale', 'previewScale');
    num('exportSupersample', 'exportSupersample'); num('exportBatchLines', 'exportBatchLines');
    const q = $id('exportQuality'); if (q) o.exportQuality = q.value;
    const ap = $id('exportAutoProtect'); if (ap) o.exportAutoProtect = ap.checked;
    return o;
  };
  const applySettings = (obj) => {
    const sf = $id('settingsFile'); if (!sf) return false;
    const file = new File([JSON.stringify(obj)], 'leary-settings.json', { type: 'application/json' });
    const dt = new DataTransfer(); dt.items.add(file);
    sf.files = dt.files; sf.dispatchEvent(new Event('change', { bubbles: true }));
    setTimeout(() => { try { histPush(); } catch (e) {} }, 1000);
    return true;
  };
  const waitRenderDone = (timeoutMs) => new Promise((resolve) => {
    const t0 = Date.now(); let stable = 0;
    const iv = setInterval(() => {
      const done = $id('statusRender') && $id('statusRender').textContent.trim() === '待機'
        && $id('statusProgress') && $id('statusProgress').textContent.trim() === '100%';
      if (Date.now() - t0 > 700) { stable = done ? stable + 1 : 0; if (stable >= 2) { clearInterval(iv); resolve(true); } }
      if (Date.now() - t0 > (timeoutMs || 60000)) { clearInterval(iv); resolve(false); }
    }, 200);
  });

  /* ---- toolbar: share link + fullscreen ---- */
  const mkBtn = (label, fn) => { const b = document.createElement('button'); b.type = 'button'; b.className = 'btn'; b.textContent = label; b.addEventListener('click', fn); return b; };
  bar.appendChild(mkBtn('共有リンク', async () => {
    try {
      const json = JSON.stringify(snapshotSettings());
      const enc = btoa(unescape(encodeURIComponent(json))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
      const url = location.origin + location.pathname + '#s=' + enc;
      await navigator.clipboard.writeText(url);
      toast('共有リンクをコピーしました（開くと設定が復元されます）');
    } catch (e) { toast('共有リンクの作成に失敗しました'); }
  }));
  if (location.hash.indexOf('#s=') === 0) {
    try {
      let b64 = location.hash.slice(3).replace(/-/g, '+').replace(/_/g, '/'); while (b64.length % 4) b64 += '='; const json = decodeURIComponent(escape(atob(b64)));
      const obj = JSON.parse(json);
      setTimeout(() => { if (applySettings(obj)) toast('共有リンクの設定を復元しました'); }, 900);
    } catch (e) {}
  }

  /* ---- extension section in the panel ---- */
  const ext = document.createElement('div'); ext.className = 'section';
  const extH = document.createElement('h3'); extH.textContent = '拡張'; ext.appendChild(extH);
  const extGrid = document.createElement('div'); extGrid.className = 'grid-preset'; extGrid.style.gridColumn = '1 / -1';
  ext.appendChild(extGrid);
  const extBtn = (label, fn) => { const b = document.createElement('button'); b.type = 'button'; b.className = 'btn small'; b.textContent = label; b.addEventListener('click', fn); extGrid.appendChild(b); return b; };

  const RANGES = { lineCount:[100,4000], lineWidthMin:[0.2,3], lineWidthMax:[1,9], opacity:[0.2,1], flowCoverage:[0.5,8], generationWidth:[0.5,8], segmentResolution:[0.3,3], swirlRadius:[250,3200], swirlStrength:[0.2,3.2], curveTension:[0,1.6], turbulence:[0,70], turbulenceFreq:[0.002,0.05], verticalStretch:[0.5,2] };
  const SAN = { lineCount:[1,30000], lineWidthMin:[0.1,50], lineWidthMax:[0.1,50], opacity:[0,1], flowCoverage:[0.1,20], generationWidth:[0.1,20], segmentResolution:[0.1,20], batchLines:[10,4000], swirlRadius:[1,10000], swirlStrength:[0,10], curveTension:[0,10], turbulence:[0,200], turbulenceFreq:[0.0001,1], verticalStretch:[0.1,10] };
  const rnd = (a, b) => a + Math.random() * (b - a);
  const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];
  const hex2 = (n) => Math.round(Math.max(0, Math.min(255, n))).toString(16).padStart(2, '0');
  const grayHex = (v) => '#' + hex2(v) + hex2(v) + hex2(v);
  const hslHex = (h, s, l) => { const c = (1 - Math.abs(2 * l - 1)) * s, x = c * (1 - Math.abs((h / 60) % 2 - 1)), m = l - c / 2; let r = 0, g = 0, b = 0;
    if (h < 60) { r = c; g = x; } else if (h < 120) { r = x; g = c; } else if (h < 180) { g = c; b = x; } else if (h < 240) { g = x; b = c; } else if (h < 300) { r = x; b = c; } else { r = c; b = x; }
    return '#' + hex2((r + m) * 255) + hex2((g + m) * 255) + hex2((b + m) * 255); };

  extBtn('ランダム設定', () => {
    const o = snapshotSettings(); const cfg = o.config;
    Object.keys(RANGES).forEach(k => { cfg[k] = Math.round(rnd(RANGES[k][0], RANGES[k][1]) * 100) / 100; });
    cfg.lineCount = Math.round(cfg.lineCount); if (cfg.lineWidthMax < cfg.lineWidthMin) cfg.lineWidthMax = cfg.lineWidthMin + 0.5;
    cfg.swirlType = pick(['vortex', 'attract', 'repel']); cfg.renderShape = pick(['rect', 'circle']); cfg.colorMode = pick(['sequence', 'linear', 'weighted']);
    if (Math.random() < 0.55) { const dark = Math.random() < 0.7; cfg.bgColor = dark ? '#000000' : '#f2efe9';
      const n = 2 + Math.floor(Math.random() * 3); cfg.colors = Array.from({ length: n }, () => ({ hex: grayHex(dark ? rnd(120, 255) : rnd(0, 110)), weight: 1, width: 1 }));
    } else { const hue = rnd(0, 360); const dark = Math.random() < 0.65; cfg.bgColor = hslHex(hue, 0.35, dark ? 0.05 : 0.92);
      const n = 2 + Math.floor(Math.random() * 3); cfg.colors = Array.from({ length: n }, (_, i) => ({ hex: hslHex((hue + i * rnd(15, 60)) % 360, rnd(0.35, 0.8), dark ? rnd(0.45, 0.85) : rnd(0.15, 0.5)), weight: 1, width: 1 })); }
    o.seed = Math.floor(rnd(1, 999999999));
    applySettings(o); toast('ランダム設定を適用しました');
  });
  extBtn('微変異', () => {
    const o = snapshotSettings(); const cfg = o.config;
    Object.keys(SAN).forEach(k => { if (typeof cfg[k] === 'number') { const f = rnd(0.86, 1.17); cfg[k] = Math.max(SAN[k][0], Math.min(SAN[k][1], Math.round(cfg[k] * f * 100) / 100)); } });
    cfg.lineCount = Math.round(cfg.lineCount); cfg.batchLines = Math.round(cfg.batchLines);
    if (Math.random() < 0.2) cfg.swirlType = pick(['vortex', 'attract', 'repel']);
    applySettings(o); toast('微変異を適用しました');
  });

  /* undo / redo */
  const hist = { stack: [], idx: -1, busy: false };
  const histPush = () => { if (hist.busy) return; const s = JSON.stringify(snapshotSettings());
    if (hist.stack[hist.idx] === s) return; hist.stack = hist.stack.slice(0, hist.idx + 1); hist.stack.push(s); if (hist.stack.length > 60) hist.stack.shift(); hist.idx = hist.stack.length - 1; };
  let histTimer = null;
  panel.addEventListener('input', () => { clearTimeout(histTimer); histTimer = setTimeout(histPush, 700); });
  setTimeout(histPush, 1200);
  const histGo = (d) => { const n = hist.idx + d; if (n < 0 || n >= hist.stack.length) { toast(d < 0 ? 'これ以上戻れません' : 'これ以上進めません'); return; }
    hist.idx = n; hist.busy = true; applySettings(JSON.parse(hist.stack[n])); setTimeout(() => { hist.busy = false; }, 900); toast(d < 0 ? '元に戻しました' : 'やり直しました'); };
  extBtn('元に戻す', () => histGo(-1));
  extBtn('やり直す', () => histGo(1));

  /* preview canvas copy / share */
  const canvasBlob = () => new Promise(res => $id('canvas').toBlob(res, 'image/png'));
  extBtn('PNGコピー', async () => { try { const b = await canvasBlob(); await navigator.clipboard.write([new ClipboardItem({ 'image/png': b })]); toast('表示中のPNGをコピーしました'); } catch (e) { toast('コピーできませんでした'); } });
  extBtn('共有', async () => { try { const b = await canvasBlob(); const f = new File([b], 'leary.png', { type: 'image/png' });
    if (navigator.canShare && navigator.canShare({ files: [f] })) await navigator.share({ files: [f] }); else toast('この環境では共有が使えません'); } catch (e) {} });

  /* download router: send the next core download to a chosen file/folder */
  const router = { mode: null, dir: null, waiter: null };
  document.addEventListener('click', (e) => {
    const a = e.target && e.target.closest ? e.target.closest('a[download]') : null;
    if (!a || !router.mode) return;
    const done = (ok) => { if (router.waiter) { const w = router.waiter; router.waiter = null; w(ok); } router.mode = null; };
    e.preventDefault(); e.stopImmediatePropagation();
    (async () => {
      try {
        const blob = await (await fetch(a.href)).blob();
        if (router.mode === 'picker') {
          const handle = await window.showSaveFilePicker({ suggestedName: a.download || 'leary.png' });
          const ws = await handle.createWritable(); await ws.write(blob); await ws.close(); toast('保存しました');
        } else if (router.mode === 'dir' && router.dir) {
          const handle = await router.dir.getFileHandle(a.download || 'leary.png', { create: true });
          const ws = await handle.createWritable(); await ws.write(blob); await ws.close();
        }
        done(true);
      } catch (err) { done(false); }
    })();
  }, true);
  extBtn('保存先を選んで保存', async () => {
    if (!window.showSaveFilePicker) { toast('このブラウザは保存先選択に未対応です'); return; }
    router.mode = 'picker'; toast('保存先ダイアログで場所を選んでください'); $id('btnExportPng').click();
  });

  /* eyedropper */
  const eye = async (apply) => { if (!window.EyeDropper) { toast('スポイトはこのブラウザで使えません'); return; }
    try { const r = await new EyeDropper().open(); apply(r.sRGBHex); } catch (e) {} };
  extBtn('スポイト背景色', () => eye((hex) => { const el = $id('bgColor'); el.value = hex; el.dispatchEvent(new Event('input', { bubbles: true })); toast('背景色に ' + hex); }));
  extBtn('スポイト色追加', () => eye((hex) => { $id('btnAddColor').click(); const items = document.querySelectorAll('#colors .color-item'); const last = items[items.length - 1];
    const ci = last.querySelector('input[type="color"]'); ci.value = hex; ci.dispatchEvent(new Event('input', { bubbles: true })); toast('色を追加しました ' + hex); }));

  /* document picture-in-picture preview */
  extBtn('PiPプレビュー', async () => {
    if (!window.documentPictureInPicture) { toast('PiPはこのブラウザで使えません'); return; }
    try {
      const w = await documentPictureInPicture.requestWindow({ width: 480, height: 270 });
      w.document.body.style.cssText = 'margin:0;background:#000;overflow:hidden';
      const c = w.document.createElement('canvas'); c.style.cssText = 'width:100%;height:100%'; w.document.body.appendChild(c);
      const ctx = c.getContext('2d'); const src = $id('canvas');
      const iv = w.setInterval(() => { if (w.closed) { w.clearInterval(iv); return; } c.width = src.width; c.height = src.height; ctx.drawImage(src, 0, 0); }, 300);
      c.width = src.width; c.height = src.height; ctx.drawImage(src, 0, 0);
    } catch (e) { toast('PiPを開けませんでした'); }
  });

  /* batch export */
  const batchWrap = document.createElement('div'); batchWrap.style.gridColumn = '1 / -1';
  batchWrap.innerHTML = '<div style="font-size:10px;color:rgba(255,255,255,.55);margin:4px 0 3px">バッチ書き出し（Seed連番）</div>';
  const bSeed = document.createElement('input'); bSeed.type = 'number'; bSeed.value = '1000'; bSeed.title = '開始Seed'; bSeed.style.cssText = 'width:64px;margin-right:4px';
  const bCount = document.createElement('input'); bCount.type = 'number'; bCount.value = '6'; bCount.min = '1'; bCount.max = '50'; bCount.title = '件数'; bCount.style.cssText = 'width:44px;margin-right:4px';
  const bGo = document.createElement('button'); bGo.type = 'button'; bGo.className = 'btn small'; bGo.textContent = '実行';
  batchWrap.appendChild(bSeed); batchWrap.appendChild(bCount); batchWrap.appendChild(bGo);
  ext.appendChild(batchWrap);
  let batchRunning = false;
  bGo.addEventListener('click', async () => {
    if (batchRunning) return;
    const start = Number(bSeed.value) || 0; const count = Math.max(1, Math.min(50, Number(bCount.value) || 1));
    let dir = null;
    if (window.showDirectoryPicker) { try { dir = await window.showDirectoryPicker(); } catch (e) { return; } }
    batchRunning = true; bGo.textContent = '実行中…';
    const base = snapshotSettings();
    for (let i = 0; i < count; i++) {

  async function webgpuAvailable() {
    try {
      const gpu = navigator.gpu;

  }
  var BACKEND_CACHE_KEY = "leary-backend-cache-v1";
  var BACKEND_FORCE_KEY = "leary-backend-force";
  async function adapterFingerprint() {
    try {
      const gpu = navigator.gpu;
      if (!gpu) return "no-webgpu";
      const adapter = await gpu.requestAdapter();
      if (!adapter) return "no-adapter";
      let info = adapter.info || {};
      if (!info.vendor && !info.architecture && typeof adapter.requestAdapterInfo === "function") {
        try {
          info = await adapter.requestAdapterInfo();
        } catch {
        }
      }
      const fp = [info.vendor || "", info.architecture || "", info.device || "", info.description || ""].join("|").replace(/\|+$/, "");
      return fp || "unknown-gpu";
    } catch {
      return "unknown-gpu";
    }

  async function timeSteps(step, sync) {
    for (let i = 0; i < 5; i++) step();
    await sync();
    const p0 = performance.now();
    for (let i = 0; i < 5; i++) step();
    await sync();
    const est = (performance.now() - p0) / 5;
    if (est > 400) return est;
    const n = Math.max(5, Math.min(20, Math.floor(1200 / Math.max(est, 0.01))));
    const runs = [];
    for (let r = 0; r < 3; r++) {
      const t0 = performance.now();
      for (let i = 0; i < n; i++) step();
      await sync();
      runs.push((performance.now() - t0) / n);
    }
    runs.sort((a, b) => a - b);
    return runs[1];
  }
  async function runAdaptiveBench(params) {
    const bp = JSON.parse(JSON.stringify(params));
    bp.simResolution = Math.min(bp.simResolution || 256, 256);
    bp.dyeResolution = Math.min(bp.dyeResolution || 1024, 1024);
    const results = {};
    let gpuBest = null;
    try {
      const c = document.createElement("canvas");
      c.width = 480;
      c.height = 300;
      const eng = new FluidEngineGPU(c, bp, { offscreen: true });
      await eng.ready;
      eng.setSeed(999);
      eng.clear();
      eng.triggerCollision();
      const sync = () => eng.device.queue.onSubmittedWorkDone();
      const step = () => {
        eng.stepPhysics(1 / 60);
        eng.renderDisplay();
      };
      eng.useComputeProjection = false;
      results.fragment = await timeSteps(step, sync);
      let mode = "fragment";
      let best = results.fragment;
      if (eng.computeAvailable) {
        eng.useComputeProjection = true;
        results.compute = await timeSteps(step, sync);

          mode = "compute";

        }

    } catch {
    }
    let glMs = null;
    try {
      const c = document.createElement("canvas");
      c.width = 480;
      c.height = 300;
      const eng = new FluidEngine(c, bp, {});
      eng.setSeed(999);
      eng.clear();
      eng.triggerCollision();
      const gl = eng.gl;
      const px = new Uint8Array(4);
      const sync = async () => {
        gl.finish();
        gl.readPixels(0, 0, 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, px);
      };
      const step = () => {
        eng.stepPhysics(1 / 60);
        eng.renderDisplay();
      };
      glMs = await timeSteps(step, sync);
      results.webgl2 = glMs;
      eng.destroy();
    } catch {
    }
    if (gpuBest && glMs !== null && glMs < gpuBest.ms * 0.9) {
      return { backend: "webgl2", projection: gpuBest.mode, source: "bench", bench: results };
    }
    if (gpuBest) return { backend: "webgpu", projection: gpuBest.mode, source: "bench", bench: results };
    if (glMs !== null) return { backend: "webgl2", projection: "fragment", source: "bench", bench: results };
    return { backend: "webgl2", projection: "fragment", source: "bench-failed", bench: results };
  }
  async function createEngine(canvas, params, callbacks) {
    const W = window;
    let force = null;
    try {
      force = localStorage.getItem(BACKEND_FORCE_KEY);
    } catch {
    }
    let choice = null;
    if (force === "webgl2" || force === "webgpu-fragment" || force === "webgpu-compute") {
      choice = {
        backend: force === "webgl2" ? "webgl2" : "webgpu",
        projection: force === "webgpu-fragment" ? "fragment" : "compute",

    }
    const gpuOk = await webgpuAvailable();
    if (!choice && gpuOk) {
      const fp = await adapterFingerprint();
      let cache = {};

      } catch {
      }

          try {

          } catch {
          }
        } catch {

    }
    if (choice && choice.backend === "webgl2") {
      W.__ChromaFlow.backend = "webgl2";

      } catch {
      }

  }

    FluidEngine,
    FluidEngineGPU,
    AudioReactiveEngine,
    DEFAULT_PARAMS,
    CURATED_PRESETS,
    createEngine,
    backend: "webgl2",
    benchInfo: null
  };

    seedWatchTimer = setTimeout(() => { if (active && engine) { reseed(); } }, 400);
  }, 700);

  document.addEventListener('visibilitychange', () => {
    if (!engine || !active) return;
    if (document.hidden) engine.stop(); else engine.start();
  });

  /* recipe link (#recipe=...) — decode before first activation */
  try {
    if (location.hash && location.hash.startsWith('#recipe=')) {
      const b64 = location.hash.slice('#recipe='.length).replace(/-/g, '+').replace(/_/g, '/');
      const pad = b64.length % 4 === 0 ? '' : '='.repeat(4 - (b64.length % 4));
      const bin = atob(b64 + pad);
      const bytes = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
      const decoded = JSON.parse(new TextDecoder().decode(bytes));
      if (decoded && typeof decoded === 'object') {
        params = mergeParams(CF.DEFAULT_PARAMS, decoded);
        history = [clone(params)]; histIdx = 0;
        setTimeout(() => { setActive(true); toast('レシピリンクの流体設定を適用しました'); }, 900);
      }
    }
  } catch (e) {}

  syncUIFromParams();
  try { if (localStorage.getItem('leary-chromaflow-active') === '1') setTimeout(() => setActive(true), 700); } catch (e) {}
  window.__learyChromaFlow = { setActive, setUiMode, get uiMode() { return uiMode; }, get active() { return active; }, get engine() { return engine; }, get params() { return params; }, get renderScale() { return renderScale; }, get autoQuality() { return autoQ; }, get slideshow() { return !!slideTimer; }, reseed, applyPreset, randomize, startSlideshow, stopSlideshow };
})();

<script>
/* Leary cover-fit display (additive; Leary core untouched).
   The core sizes the stage/canvas with a contain fit (min scale), which
   leaves checkerboard bars whenever the viewer area is not exactly the
   artwork aspect (1920x1080). This script scales the stage uniformly by
   the cover factor (max scale) so the artwork fills the whole viewer
   area edge-to-edge, cropping the overflow instead of showing bars.
   All core coordinate mapping goes through getBoundingClientRect(),
   which includes the transform, so pan / zoom / source-point dragging
   stay aligned. The artwork bitmap and exports are unchanged. */
(function () {
  'use strict';
  var viewer = document.getElementById('viewer');
  var stage = document.getElementById('stage');
  var wrap = document.querySelector('.canvas-wrap');
  if (!viewer || !stage || !wrap) return;

  var style = document.createElement('style');
  style.id = 'learyCoverStyle';
  style.textContent = '.canvas-wrap{overflow:hidden}#stage{transform-origin:center center}';
  document.head.appendChild(style);

  var raf = 0;
  function apply() {
    raf = 0;
    var vw = viewer.clientWidth, vh = viewer.clientHeight;
    var sw = stage.offsetWidth, sh = stage.offsetHeight;
    if (!vw || !vh || !sw || !sh) return;
    var s = Math.max(vw / sw, vh / sh);
    var next = s > 1.001 ? 'scale(' + s.toFixed(5) + ')' : '';
    if (stage.style.transform !== next) stage.style.transform = next;
  }
  function queue() { if (!raf) raf = requestAnimationFrame(apply); }

  /* The core rewrites the stage size on resize and settings changes;
     re-apply the cover scale whenever that happens. */
  new MutationObserver(queue).observe(stage, { attributes: true, attributeFilter: ['style'] });
  window.addEventListener('resize', queue);
  queue();
  window.__learyCover = { apply: apply, version: 1 };
})();

<!-- Studio Console transport receiver (additive) -->
<script>
/* leary */(function(){
'use strict';
/* ═══ Studio Console transport receiver (2026-11-16, additive) ═══
   Varelser Studio の console v2 {app:'studio', type:'console', transport}
   を受けて、このアプリの描画を一時停止／再開する。
   前提は本体の Varelser Link と同じ流儀: このアプリ側の Link が ON
   (localStorage 'leary.varelserLink.v1' === '1') の間だけチャンネルを開く。
   停止方式: requestAnimationFrame ゲート (停止中はコールバックを保留し、
   再開時に流す)。p5 グローバルモード (noLoop/loop) があれば併用する。
   BPM は映像アプリに概念がないため対象外。 */
var LS_KEY='leary.varelserLink.v1';
var paused=false, seen=0, fakeId=1000000000;
var held=new Map();
var origRAF=window.requestAnimationFrame.bind(window);
var origCAF=window.cancelAnimationFrame.bind(window);
window.requestAnimationFrame=function(cb){
  seen++;
  if(paused){ var id=++fakeId; held.set(id,cb); return id; }
  return origRAF(cb);
};
window.cancelAnimationFrame=function(id){
  if(held.has(id)){ held.delete(id); return; }
  return origCAF(id);
};
var badge=null, badgeTimer=null;
function showBadge(text, sticky){
  if(!badge){
    badge=document.createElement('div');
    badge.id='studioTransportBadge';
    badge.style.cssText='position:fixed;left:10px;bottom:10px;z-index:99999;pointer-events:none;background:rgba(10,10,10,.8);color:#eee;border:1px solid rgba(255,255,255,.28);border-radius:999px;padding:4px 12px;font-size:11px;letter-spacing:.08em;backdrop-filter:blur(6px)';
    document.body.appendChild(badge);
  }
  badge.textContent=text;
  badge.style.display='block';
  if(badgeTimer)clearTimeout(badgeTimer);
  if(!sticky)badgeTimer=setTimeout(function(){ badge.style.display='none'; },1400);
}
function setPaused(p){
  p=!!p; if(p===paused)return; paused=p;
  try{
    if(paused){ if(typeof window.noLoop==='function')window.noLoop(); }
    else{ if(typeof window.loop==='function')window.loop(); }
  }catch(e){}
  if(paused){ showBadge('STUDIO ■ 一時停止中', true); }
  else{
    var h=Array.from(held.values()); held.clear();
    for(var i=0;i<h.length;i++)origRAF(h[i]);
    showBadge('STUDIO ▶ 再開', false);
  }
}
window.__studioTransport={version:1,paused:function(){return paused;},held:function(){return held.size;},seen:function(){return seen;}};
var ch=null;
function wantOn(){ try{ return localStorage.getItem(LS_KEY)==='1'; }catch(e){ return false; } }
function onMsg(ev){
  var m=ev&&ev.data; if(!m||typeof m!=='object')return;
  if(m.app!=='studio'||m.type!=='console')return;
  if(m.transport==='stop')setPaused(true);
  else if(m.transport==='play')setPaused(false);
}
function start(){
  if(ch||typeof BroadcastChannel==='undefined')return;
  try{ ch=new BroadcastChannel('varelser-link-v1'); ch.onmessage=onMsg; }catch(e){ ch=null; }
}
function stopCh(){ if(ch){ try{ ch.close(); }catch(e){} ch=null; } }
function sync(){ if(wantOn())start(); else stopCh(); }
sync();
setInterval(sync,2000);
window.addEventListener('storage',function(e){ if(e.key===LS_KEY)sync(); });
})();

</script>
