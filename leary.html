<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Leary</title>
<style>
  :root{
    --bg:#000000;
    --bg-2:#000000;
    --panel:rgba(0,0,0,.92);
    --panel-2:rgba(255,255,255,.02);
    --panel-3:rgba(255,255,255,.04);
    --line:rgba(255,255,255,.10);
    --line-strong:rgba(255,255,255,.18);
    --text:#f5f7fb;
    --muted:rgba(255,255,255,.56);
    --soft:rgba(255,255,255,.78);
    --accent:#ffffff;
    --shadow:none;
    --radius:18px;
    --radius-sm:12px;
  }
  *{box-sizing:border-box}
  html,body{
    height:100%;
    margin:0;
    background:#000;
    color:var(--text);
    font:13px/1.45 Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans JP",sans-serif;
    letter-spacing:.01em;
  }
  button,input,select{font:inherit}
  button,input,select{outline:none}
  ::selection{background:rgba(255,255,255,.10)}
  #app{
    height:100%;
    display:grid;
    grid-template-columns:390px minmax(0,1fr);
    gap:0;
    overflow:hidden;
  }
  .panel{
    position:relative;
    overflow:auto;
    padding:18px 16px 40px;
    background:var(--panel);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    border-right:1px solid var(--line);
  }
  .panel::after{
    content:"";
    position:fixed;
    top:0;
    left:389px;
    width:1px;
    height:100vh;
    background:rgba(255,255,255,.12);
    pointer-events:none;
  }
  .panel-head{
    margin-bottom:14px;
    padding:4px 2px 10px;
  }
  .eyebrow{
    display:inline-flex;
    align-items:center;
    gap:10px;
    color:var(--soft);
    font-size:10px;
    letter-spacing:.22em;
    text-transform:uppercase;
  }
  .eyebrow::before{
    content:"";
    width:24px;
    height:1px;
    background:rgba(255,255,255,.48);
  }
  .title,.subtitle{display:none}
  .toolbar{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
    margin:0 0 14px;
  }
  .btn{
    appearance:none;
    border:1px solid var(--line);
    background:rgba(255,255,255,.03);
    color:var(--text);
    border-radius:14px;
    padding:11px 12px;
    cursor:pointer;
    transition:transform .14s ease, background .14s ease, border-color .14s ease, box-shadow .14s ease, opacity .14s ease;
    box-shadow:none;
  }
  .btn:hover{
    background:rgba(255,255,255,.06);
    border-color:var(--line-strong);
    transform:translateY(-1px);
  }
  .btn:active{transform:translateY(0)}
  .btn.primary{
    color:#000000;
    background:#ffffff;
    border-color:#ffffff;
    box-shadow:none;
  }
  .btn.small{
    padding:9px 10px;
    border-radius:12px;
  }
  .section{
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:14px;
    background:var(--panel-2);
    box-shadow:var(--shadow);
    margin-bottom:12px;
  }
  .section h3{
    margin:0 0 12px;
    font-size:11px;
    font-weight:600;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:var(--soft);
  }
  .metrics{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px;
  }
  .metric{
    min-width:0;
    border:1px solid var(--line);
    border-radius:16px;
    padding:10px 11px;
    background:rgba(255,255,255,.015);
  }
  .metric-label{
    color:var(--muted);
    font-size:11px;
    margin-bottom:5px;
  }
  .metric-value{
    font-size:13px;
    color:var(--text);
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .row{
    display:grid;
    grid-template-columns:minmax(0,1fr) 96px;
    gap:12px;
    align-items:center;
    margin-bottom:10px;
  }
  .row:last-child{margin-bottom:0}
  .row > label{
    color:rgba(255,255,255,.88);
    min-width:0;
  }
  .row input[type="number"],
  .row input[type="text"],
  .row select{
    width:100%;
    padding:9px 10px;
    border-radius:12px;
    border:1px solid var(--line);
    background:#000000;
    color:var(--text);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.03);
  }
  .row input[type="number"]:focus,
  .row input[type="text"]:focus,
  .row select:focus,
  .color-item input:focus{
    border-color:rgba(255,255,255,.28);
    box-shadow:0 0 0 3px rgba(255,255,255,.06);
  }
  .row input[type="color"]{
    width:100%;
    height:40px;
    padding:3px;
    border-radius:12px;
    border:1px solid var(--line);
    background:#000000;
  }
  .stack{display:flex;flex-direction:column;gap:8px}
  .inline{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .muted{color:var(--muted)}
  .mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
  .grid-2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .grid-preset{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px;
  }
  .colors{display:flex;flex-direction:column;gap:8px}
  .color-item{
    display:grid;
    grid-template-columns:minmax(0,1fr) 62px 62px 32px;
    gap:8px;
    align-items:center;
    padding:6px;
    border:1px solid var(--line);
    border-radius:14px;
    background:rgba(255,255,255,.015);
  }
  .color-item input[type="number"]{
    padding:8px 7px;
    border-radius:10px;
    border:1px solid var(--line);
    background:#000000;
    color:var(--text);
  }
  .hint{
    font-size:12px;
    color:var(--muted);
    line-height:1.5;
  }
  .footer-space{height:24px}
  .viewer{
    position:relative;
    overflow:hidden;
    background:#000000;
  }
  .viewer::before{
    content:"";
    position:absolute;
    inset:22px;
    border-radius:28px;
    border:1px solid rgba(255,255,255,.08);
    pointer-events:none;
  }
  .viewer-top{
    position:absolute;
    top:20px;
    left:20px;
    right:20px;
    display:flex;
    justify-content:space-between;
    gap:10px;
    pointer-events:none;
  }
  .pill{
    pointer-events:auto;
    display:inline-flex;
    gap:10px;
    align-items:center;
    min-height:42px;
    padding:10px 14px;
    background:rgba(0,0,0,.72);
    border:1px solid rgba(255,255,255,.08);
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
    border-radius:999px;
    color:#ffffff;
    box-shadow:none;
  }
  .canvas-wrap{position:absolute;inset:0;display:grid;place-items:center;padding:30px}
  .stage{position:relative;max-width:100%;max-height:100%}
  canvas{
    display:block;
    background:transparent;
    border-radius:22px;
    box-shadow:none;
  }
  canvas:focus-visible{
    outline:2px solid rgba(255,255,255,.85);
    outline-offset:4px;
  }
  .checker{
    background-image:
      linear-gradient(45deg, rgba(255,255,255,.016) 25%, transparent 25%),
      linear-gradient(-45deg, rgba(255,255,255,.016) 25%, transparent 25%),
      linear-gradient(45deg, transparent 75%, rgba(255,255,255,.016) 75%),
      linear-gradient(-45deg, transparent 75%, rgba(255,255,255,.016) 75%);
    background-size:24px 24px;
    background-position:0 0,0 12px,12px -12px,-12px 0;
  }
  .source{
    position:absolute;
    width:14px;
    height:14px;
    border-radius:50%;
    border:2px solid rgba(255,255,255,.95);
    background:#000000;
    transform:translate(-50%,-50%);
    box-shadow:none;
    cursor:grab;
  }
  .source::after{
    content:"";
    position:absolute;
    inset:-7px;
    border-radius:50%;
    border:1px solid rgba(255,255,255,.16);
  }
  .source.dragging{cursor:grabbing}
  .source:focus-visible{
    outline:2px solid rgba(255,255,255,.9);
    outline-offset:3px;
  }
  .switches{
    display:flex;
    gap:18px;
    flex-wrap:wrap;
    margin:4px 0 2px;
  }
  .switches label{
    display:inline-flex;
    align-items:center;
    gap:8px;
    color:var(--soft);
  }
  input[type="checkbox"]{
    width:16px;
    height:16px;
    accent-color:#ffffff;
  }
  .section-note{
    margin-top:10px;
    padding-top:10px;
    border-top:1px solid var(--line);
  }
  .toolbar-wide{
    grid-column:1 / -1;
  }
  @media (max-width: 1120px){
    #app{grid-template-columns:360px minmax(0,1fr)}
    .panel::after{left:359px}
  }
  @media (max-width: 960px){
    #app{grid-template-columns:1fr;grid-template-rows:48vh 1fr}
    .panel{
      order:2;
      border-right:none;
      border-top:1px solid var(--line);
      padding-top:14px;
    }
    .panel::after{display:none}
    .viewer{order:1}
    .toolbar{grid-template-columns:1fr 1fr}
    .viewer-top{top:14px;left:14px;right:14px}
    .canvas-wrap{padding:18px}
  }

  /* ==== leary-noise-refine v1: bring Leary to the SHIPPED Noise standard ====
     Noise reference points: 56px centred thin title, frameless sections,
     text-style buttons (white fill = primary/active only), collapsible
     panel sections with saved state, 4px scrollbar, fills/blur/shadow stay. */

  /* 1. Frameless: remove every square frame / divider line. */
  .panel { border-right: 0; }
  .panel::after { display: none; }
  .section { border: 0; border-radius: 12px; background: rgba(255,255,255,.02); padding: 16px; margin-bottom: 20px; }
  .section-note { border-top: 0; padding-top: 2px; }
  .metric { border: 0; border-radius: 12px; background: rgba(255,255,255,.03); }
  .color-item { border: 0; border-radius: 12px; }
  .pill { border: 0; }
  .viewer::before { display: none; }
  /* explicit border:0 guard (Yayoi lesson: dropping the declaration alone
     can revive the UA default border on controls) */
  .panel button, .panel input, .panel select, .panel textarea { border: 0; }

  /* 2. Header: Noise's exact 56px, centred thin title only. */
  .panel-head {
    height: 56px; margin: 0 0 6px; padding: 0;
    display: flex; align-items: center; justify-content: center;
  }
  .eyebrow { font-size: 14px; font-weight: 300; letter-spacing: .2em; color: rgba(255,255,255,.78); }
  .eyebrow::before { display: none; }

  /* 2b. Panel tools (Noise: expand/collapse all), injected by the script below. */
  .leary-panel-tools { display: flex; gap: 4px; justify-content: flex-end; margin: 0 0 10px; }
  .leary-panel-tools button {
    border: 0; background: transparent; color: rgba(255,255,255,.45);
    font-size: 10px; letter-spacing: .12em; padding: 6px 10px; border-radius: 6px; cursor: pointer;
    transition: background-color .2s ease, color .2s ease;
  }
  .leary-panel-tools button:hover { color: #fff; background: rgba(255,255,255,.08); }

  /* 3. Buttons: Noise text style. No lift, no frame; fill only.
        Primary keeps its white fill (it is the main export action). */
  .btn {
    border: 0; border-radius: 8px; background: rgba(255,255,255,.04);
    padding: 10px 12px; font-size: 12px;
    transition: background-color .2s ease, color .2s ease;
  }
  .btn:hover { background: rgba(255,255,255,.09); border-color: transparent; transform: none; }
  .btn:active { transform: none; }
  .btn.primary { background: #f5f5f5; color: #000; border-color: transparent; }
  .btn.primary:hover { background: #ffffff; }
  .btn.small { border-radius: 8px; padding: 8px 10px; }
  .btn.danger:hover { background: rgba(255,107,107,.14); }

  /* 4. Inputs: frameless, Noise control fill (#171717), focus deepens the fill. */
  .row input[type="number"], .row input[type="text"], .row select,
  .color-item input[type="number"] {
    border: 0; border-radius: 8px; background: #171717; box-shadow: none;
  }
  .row input[type="number"]:focus, .row input[type="text"]:focus, .row select:focus,
  .color-item input:focus { border-color: transparent; background: #262626; box-shadow: none; }
  .row input[type="color"] { border: 0; border-radius: 8px; background: #171717; }
  button:focus-visible, input:focus-visible, select:focus-visible {
    outline: 2px solid rgba(255,255,255,.85); outline-offset: 2px;
  }

  /* 5. Section heads: Noise head treatment + collapsible (script toggles .collapsed). */
  .section h3 {
    display: flex; align-items: center; justify-content: space-between;
    font-size: 12px; letter-spacing: .12em; color: rgba(255,255,255,.72);
    cursor: pointer; user-select: none; margin-bottom: 14px;
  }
  .section h3::after {
    content: "\25BE"; font-size: 11px; color: rgba(255,255,255,.45);
    transition: transform .2s ease;
  }
  .section.collapsed h3 { margin-bottom: 0; }
  .section.collapsed h3::after { transform: rotate(-90deg); }
  .section.collapsed > *:not(h3) { display: none !important; }

  /* 6. Artwork first: canvas radius down to the Noise card radius,
        viewer pills smaller and quieter. */
  canvas { border-radius: 12px; }
  .pill { min-height: 34px; padding: 7px 12px; font-size: 11px; letter-spacing: .04em; background: rgba(0,0,0,.62); }

  /* 7. Thin scrollbar, Noise spec. */
  .panel { scrollbar-width: thin; scrollbar-color: #333 transparent; }
  .panel::-webkit-scrollbar { width: 4px; }
  .panel::-webkit-scrollbar-track { background: transparent; }
  .panel::-webkit-scrollbar-thumb { background: #333; border-radius: 2px; }
  .panel::-webkit-scrollbar-thumb:hover { background: #555; }

  /* 8. Mobile: the help pill wrapped character-by-character over the
        artwork. Drop it on small screens (the zoom readout stays,
        right-aligned) and give the canvas its room back. */
  @media (max-width: 960px) {
    .panel { border-top: 0; }
  }
  @media (max-width: 640px) {
    .viewer-top { justify-content: flex-end; }
    .viewer-top .pill:first-child { display: none; }
    .canvas-wrap { padding: 14px; }
  }
</style>

<style id="leary-lien-v2">
/* ==== leary-lien-v2: Lien layout — artwork first, panel floats ====
   Layout only. Generation core, state, export sizes untouched. */
#app{display:grid;grid-template-rows:56px minmax(0,1fr) 52px;grid-template-columns:minmax(0,1fr);height:100%;position:relative}
.leary2-header{grid-row:1;display:flex;align-items:center;justify-content:center;position:relative;background:#000;z-index:40;user-select:none}
.leary2-title{font-size:14px;font-weight:300;letter-spacing:.2em;color:rgba(255,255,255,.78)}
.viewer{grid-row:2;min-height:0}
.canvas-wrap{padding:0}
.viewer::before{display:none}
.viewer-top{top:12px;left:12px;right:12px;z-index:20}
.pill{min-height:30px;padding:5px 11px;font-size:10.5px}
/* Panel becomes a floating sheet above the 設定 button (Lien/TOPO pattern) */
.panel{position:absolute;left:24px;bottom:64px;top:auto;width:min(356px,calc(100vw - 32px));max-height:calc(100vh - 140px);z-index:60;border:0;border-radius:12px;background:rgba(8,8,8,.97);backdrop-filter:none;-webkit-backdrop-filter:none;box-shadow:0 25px 50px -12px rgba(0,0,0,.75);padding:14px 14px 26px;animation:leary2Up .2s ease-out}
@keyframes leary2Up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.panel::after{display:none}
body:not(.leary2-panel-open) .panel{display:none}
.panel-head{display:none}
.footer-space{display:none}
.panel .toolbar{display:none}
/* Bottom toolbar: text buttons only, primary keeps white fill */
.leary2-toolbar{grid-row:3;display:flex;align-items:center;gap:4px;padding:0 16px 0 24px;background:#000;z-index:40;overflow-x:auto;overflow-y:hidden;scrollbar-width:none;white-space:nowrap}
.leary2-toolbar::-webkit-scrollbar{display:none}
.leary2-toolbar .btn{border:0;background:transparent;border-radius:6px;padding:7px 10px;font-size:12px;letter-spacing:.08em;color:rgba(255,255,255,.85);transform:none;box-shadow:none;flex:0 0 auto}
.leary2-toolbar .btn:hover{background:rgba(255,255,255,.10);transform:none}
.leary2-toolbar .btn.primary{background:#fff;color:#000}
.leary2-toolbar .btn.primary:hover{background:#e8e8e8}
.leary2-toggle{font-weight:600}
.leary2-spacer{flex:1 0 12px}
.leary2-status{font-size:11px;color:rgba(255,255,255,.45);font-family:ui-monospace,SFMono-Regular,Menlo,monospace;flex:0 0 auto;padding-right:6px}
.panel{width:min(200px,calc(100vw - 32px))}
.panel .section{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:5px 6px;align-items:start;padding:9px 9px 10px;margin-bottom:8px}
.panel .section>h3{grid-column:1/-1;font-size:11px;margin-bottom:1px}
.panel .section>.row{display:flex;flex-direction:column;gap:2px;margin-bottom:0;min-width:0}
.panel .section>.row>*:first-child{font-size:8px;line-height:1.15;letter-spacing:-.02em;color:rgba(255,255,255,.55);white-space:normal;overflow-wrap:anywhere;min-width:0}
.panel .row input[type="number"],.panel .row input[type="text"],.panel .row select{width:100%;padding:2px 3px;font-size:10px;min-width:0}
.panel .section>.row input[type="color"]{width:100%;height:20px;padding:0}
.panel .section>.row:has(> select){grid-column:span 2}
.panel .metrics{grid-column:1/-1;grid-template-columns:repeat(4,minmax(0,1fr));gap:5px}
.panel .metric{padding:3px 4px;font-size:8px}
.panel .metric b,.panel .metric strong,.panel .metric .val{font-size:10px}
.panel .grid-preset{grid-column:1/-1;grid-template-columns:repeat(3,minmax(0,1fr));gap:5px}
.panel .grid-preset .btn,.panel .btn.small{padding:4px 2px;font-size:10.5px}
.panel .grid-2{grid-column:1/-1;gap:6px}
.panel .grid-2 .row{grid-template-columns:16px minmax(0,1fr);gap:4px}
.panel .switches{grid-column:1/-1}
.panel .section-note,.panel .hint{grid-column:1/-1;font-size:9px;line-height:1.5}
.panel .colors{grid-column:1/-1}
.panel .color-item{display:grid;grid-template-columns:24px minmax(0,1fr) minmax(0,1fr) 20px;gap:5px;align-items:center}
.panel .color-item input{padding:2px 3px;min-width:0}
.panel .color-item input[type="color"]{width:100%;min-width:0;padding:0;height:20px}
.panel .section>.inline{grid-column:1/-1}
.panel #vlBox{overflow:hidden;overflow-wrap:anywhere;font-size:10.5px}
@media (max-width:640px){
  .panel{left:16px;bottom:60px}
  .leary2-toolbar{padding:0 8px 0 16px}
  .leary2-status{display:none}
}
</style>

<body>
<div id="app">
  <aside class="panel">
    <div class="panel-head">
      <div class="eyebrow">Leary</div>
    </div>

    <div class="toolbar">
      <button class="btn primary" id="btnExportPng">PNG保存（全体）</button>
      <button class="btn" id="btnExportViewPng">PNG保存（表示中そのまま）</button>
      <button class="btn" id="btnExportSvg">SVG保存</button>
      <button class="btn" id="btnRandomize">Seed変更</button>
      <button class="btn toolbar-wide" id="btnResetView">表示リセット</button>
      <button class="btn" id="btnExportSettings">設定JSON保存</button>
      <button class="btn" id="btnImportSettings">設定JSON読込</button>
      <input type="file" id="settingsFile" accept="application/json,.json" hidden />
    </div>

    <div class="section">
      <h3>状態</h3>
      <div class="metrics">
        <div class="metric">
          <div class="metric-label">描画</div>
          <div class="metric-value" id="statusRender">待機</div>
        </div>
        <div class="metric">
          <div class="metric-label">進行</div>
          <div class="metric-value mono" id="statusProgress">0%</div>
        </div>
        <div class="metric">
          <div class="metric-label">線数</div>
          <div class="metric-value mono" id="statusCount">0</div>
        </div>
        <div class="metric">
          <div class="metric-label">ソース点</div>
          <div class="metric-value mono" id="statusSwirls">0</div>
        </div>
        <div class="metric" style="grid-column:1 / -1">
          <div class="metric-label">Seed（直接入力で再現可）</div>
          <input class="metric-value mono" id="seedInput" type="number" min="0" max="2147483647" step="1" style="width:100%;background:transparent;border:none;color:var(--text);padding:0" />
          <div class="metric-value mono" id="statusSeed" hidden>0</div>
        </div>
      </div>
    </div>

    <div class="section">
      <h3>プリセット</h3>
      <div class="grid-preset">
        <button class="btn small" data-preset="monoBlack">白 / 黒</button>
        <button class="btn small" data-preset="monoWhite">黒 / 白</button>

/* Varelser Link util (additive): SeedWorks-exact derivation + ?seed= param. */
(function(){
  'use strict';
  function hashSeedString(s){ let h=0x811C9DC5; for(let i=0;i<s.length;i++){ h^=s.charCodeAt(i); h=Math.imul(h,0x01000193); } return h>>>0; }
  function splitmix32(a){ return function(){ a|=0; a=(a+0x9E3779B9)|0; let x=(a^(a>>>16))>>>0; x=Math.imul(x,0x21F0AAAD); x=(x^(x>>>15))>>>0; x=Math.imul(x,0x735A2D97); x=(x^(x>>>15))>>>0; return x>>>0; }; }
  function mulberry32(seed){ let a=seed>>>0; return function(){ a=(a+0x6D2B79F5)|0; let x=a; x=Math.imul(x^(x>>>15),x|1); x^=x+Math.imul(x^(x>>>7),x|61); return ((x^(x>>>14))>>>0)/4294967296; }; }
  function streamFor(hash, tag){ const sm=splitmix32((hash^hashSeedString(tag))>>>0); return mulberry32(sm()); }
  function masterHash(raw){ const s=String(raw).trim(); if(/^-?\d+$/.test(s)) return (Number(s)>>>0)||1; return hashSeedString(s)||1; }
  window.__varelserLinkDerive=function(master){ const r=streamFor(masterHash(master),'leary'); return 1+Math.floor(r()*999999); };
  window.__vlSeedParam=function(){
    try{
      let raw=null;
      const q=new URLSearchParams(window.location.search||'');
      if(q.has('seed')) raw=q.get('seed');
      else { const mm=String(window.location.hash||'').match(/seed=(\d+)/); if(mm) raw=mm[1]; }
      if(raw===null) return null;
      const n=Number(raw);
      if(Number.isInteger(n) && n>=1 && n<=999999999) return n;
    }catch(e){}
    return null;
  };
})();

  }

  function finishBaseSurface(context, cfg){
    context.globalAlpha = 1;
    context.setTransform(1,0,0,1,0,0);
    if(cfg.renderShape === 'circle') context.restore();
  }

  function ensurePreviewCache(){
    const w = Math.max(64, Math.round(state.size.width * state.previewScale));
    const h = Math.max(64, Math.round(state.size.height * state.previewScale));
    if(state.previewCache.width !== w || state.previewCache.height !== h){
      state.previewCache.width = w;
      state.previewCache.height = h;
      state.geometryDirty = true;
    }
    return { width: w, height: h };
  }

  async function renderGeometryPreview(){
    const token = ++state.currentRenderToken;
    const startVersion = state.geometryVersion;
    const cfg = state.config;
    const { width, height } = ensurePreviewCache();
    const scaleX = width / state.size.width;
    const scaleY = height / state.size.height;
    const baseLines = generateRandomLinesSOA(width, height, cfg.lineCount, state.seed, cfg.generationWidth);
    const swirls = state.swirls.map(s => ({ id: s.id, x: s.x * scaleX, y: s.y * scaleY }));
    const previewCfg = { ...cfg, swirlRadius: cfg.swirlRadius * Math.max(scaleX, scaleY), turbulence: cfg.turbulence * Math.max(scaleX, scaleY), lineWidthMin: cfg.lineWidthMin * Math.max(scaleX, scaleY), lineWidthMax: cfg.lineWidthMax * Math.max(scaleX, scaleY) };
    const pctx = state.previewCache.getContext('2d', { alpha: true, desynchronized: true });

    state.rendering = true;
    updateStatus('描画中', 0);
    setupBaseSurface(pctx, width, height, previewCfg);

    const flowHalfLen = (height * previewCfg.flowCoverage) / 2;
    const renderYMin = -500 * scaleY;
    const renderYMax = height + 500 * scaleY;
    const { xs, yRatios, widths, normalizedPos, count } = baseLines;
    const batch = clamp(Math.round(cfg.batchLines), 10, 4000);
    // プレビュー専用の自動保護: 線が多すぎる場合は間引いて描き、応答性を保つ。
    // (PNG/SVG 書き出しは従来どおり全数を描画する)
    const MAX_PREVIEW_LINES = 6000;
    const stride = Math.max(1, Math.ceil(count / MAX_PREVIEW_LINES));

    for(let start=0; start<count; start += batch * stride){
      if(token !== state.currentRenderToken) return;
      const end = Math.min(count, start + batch * stride);
      for(let i=start;i<end;i+=stride){
        const colorDef = chooseColor(i, normalizedPos[i]);
        const yCenter = yRatios[i] * height;
        const startY = yCenter - flowHalfLen;
        const endY = yCenter + flowHalfLen;
        if(endY < renderYMin || startY > renderYMax) continue;
        pctx.strokeStyle = colorDef.hex;
        const baseW = previewCfg.lineWidthMin + widths[i] * (previewCfg.lineWidthMax - previewCfg.lineWidthMin);
        pctx.lineWidth = Math.max(0.01, baseW * colorWidthFactor(colorDef));
        strokeLine(pctx, xs[i], startY, endY, previewCfg, swirls);
      }
      updateStatus('描画中', end / count);
      compositePreview();
      await new Promise(requestAnimationFrame);
    }

    finishBaseSurface(pctx, previewCfg);
    // 描画中にソース点が動いていたら dirty を残し、追随描画を予約する
    state.geometryDirty = state.geometryVersion !== startVersion;
    state.rendering = false;
    updateStatus('待機', 1);
    compositePreview();
    if(stride > 1) $('statusRender').textContent = `待機 (プレビュー間引き 1/${stride})`;
    if(state.geometryDirty) scheduleAfterInteraction();
  }

  function compositePreview(){
    /* perf (bit-identical): setting canvas.width/height clears and
       reallocates the bitmap even when the value is unchanged, and this
       runs per animation frame during pan/zoom. Resize only on change;
       every state the reset used to clear is set explicitly below. */
    if(canvas.width !== state.size.width) canvas.width = state.size.width;
    if(canvas.height !== state.size.height) canvas.height = state.size.height;
    ctx.setTransform(1,0,0,1,0,0);
    ctx.clearRect(0,0,canvas.width,canvas.height);
    ctx.setTransform(state.view.zoom,0,0,state.view.zoom,state.view.x,state.view.y);
    ctx.imageSmoothingEnabled = true;
    ctx.drawImage(state.previewCache, 0, 0, state.size.width, state.size.height);
    ctx.setTransform(1,0,0,1,0,0);
    updateStageSize();
    updateOverlay();
  }

  function scheduleComposite(){
    if(state.compositeQueued) return;
    state.compositeQueued = true;
    requestAnimationFrame(() => {
      state.compositeQueued = false;
      compositePreview();
    });
  }

  // 描画中の変更を検出するための世代カウンタ付き dirty マーク。
  // ソース点の移動 (ドラッグ/キー) のように「描画を即時開始しない変更」ではこちらを使う。
  function markGeometryDirty(){
    state.geometryDirty = true;
    state.geometryVersion++;
  }

  function scheduleGeometryRender(){
    state.geometryDirty = true;
    renderGeometryPreview().catch(err => {
      console.error(err);
      state.rendering = false;
      updateStatus('エラー');
      alert('描画中にエラーが発生しました。コンソールを確認してください。');
    });
  }

  // パラメータ入力 (スライダ代わりの数値入力やカラーピッカー) は短時間に
  // 何度も発火するため、再描画を 140ms まとめてから1回だけ行う。
  function scheduleGeometryRenderDebounced(){
    window.clearTimeout(state.renderTimer);
    state.renderTimer = window.setTimeout(() => { scheduleGeometryRender(); }, 140);
  }

  function scheduleAfterInteraction(){
    window.clearTimeout(state.interactionTimer);
    state.interactionTimer = window.setTimeout(() => {
      if(!state.geometryDirty) return;
      // 描画中なら諦めずに再試行する (以前はここで取りこぼし、プレビューが古いまま残った)
      if(state.rendering){ scheduleAfterInteraction(); return; }
      scheduleGeometryRender();
    }, 120);
  }

  function updateStageSize(){
    const rect = viewer.getBoundingClientRect();
    const fit = Math.min(rect.width / state.size.width, rect.height / state.size.height);
    stage.style.width = (state.size.width * fit) + 'px';
    stage.style.height = (state.size.height * fit) + 'px';
    canvas.style.width = stage.style.width;
    canvas.style.height = stage.style.height;
    overlay.style.position = 'absolute';
    overlay.style.inset = '0';
    overlay.style.pointerEvents = 'none';
  }

  function worldToScreen(x, y){
    const rect = canvas.getBoundingClientRect();
    return {
      x: (x * state.view.zoom + state.view.x) * (rect.width / state.size.width),
      y: (y * state.view.zoom + state.view.y) * (rect.height / state.size.height),
    };
  }

  function clientToWorld(clientX, clientY){
    const rect = canvas.getBoundingClientRect();
    const localX = (clientX - rect.left) * (state.size.width / rect.width);
    const localY = (clientY - rect.top) * (state.size.height / rect.height);
    return { x: (localX - state.view.x) / state.view.zoom, y: (localY - state.view.y) / state.view.zoom };
  }

  function updateOverlay(){
    const activeEl = document.activeElement;
    const activeId = activeEl && activeEl.dataset && activeEl.dataset.id ? activeEl.dataset.id : null;
    $('statusSwirls').textContent = String(state.swirls.length);
    $('viewInfo').textContent = `zoom ${state.view.zoom.toFixed(2)} / x ${Math.round(state.view.x)} / y ${Math.round(state.view.y)}`;
    /* perf (bit-identical): rebuilding the source markers is wasted work
       when swirls, view and stage size are all unchanged. */
    const _ovSig = state.swirls.map(sw => sw.id + ':' + sw.x + ',' + sw.y).join('|') + '#' + state.view.x + ',' + state.view.y + ',' + state.view.zoom + '#' + stage.style.width + 'x' + stage.style.height;
    if(state._ovSig === _ovSig && overlay.childElementCount === state.swirls.length) return;
    state._ovSig = _ovSig;
    overlay.innerHTML = '';
    state.swirls.forEach((swirl, idx) => {
      const p = worldToScreen(swirl.x, swirl.y);
      const el = document.createElement('div');
      el.className = 'source';
      el.style.left = p.x + 'px';
      el.style.top = p.y + 'px';
      el.style.pointerEvents = 'auto';
      el.dataset.id = String(swirl.id);
      el.tabIndex = 0;
      el.setAttribute('role', 'button');
      el.setAttribute('aria-label', `ソース点${idx + 1}（矢印キーで移動、Shift同時押しで10px、Enterで中心へ戻す）`);
      el.addEventListener('pointerdown', onSwirlPointerDown);
      el.addEventListener('keydown', onSwirlKeyDown);
      overlay.appendChild(el);
      // 再描画で要素を作り直してもキーボードフォーカスを失わないようにする
      if(activeId && activeId === String(swirl.id)) el.focus();
    });
  }

  function onSwirlPointerDown(e){
    e.preventDefault();
    e.stopPropagation();
    const id = Number(e.currentTarget.dataset.id);
    state.drag.mode = 'swirl';
    state.drag.swirlId = id;
    e.currentTarget.classList.add('dragging');
    window.addEventListener('pointermove', onPointerMove);
    window.addEventListener('pointerup', onPointerUp, { once: true });
  }

  function onSwirlKeyDown(e){
    const s = state.swirls.find(v => v.id === Number(e.currentTarget.dataset.id));
    if(!s) return;
    if(e.key === 'Enter' || e.key === ' '){
      // ボタンとしての起動操作: ソース点をキャンバス中心へ戻す
      e.preventDefault();
      s.x = state.size.width / 2;
      s.y = state.size.height / 2;
      markGeometryDirty();
      scheduleComposite();
      scheduleAfterInteraction();
      return;
    }
    const step = e.shiftKey ? 10 : 1;
    let dx = 0, dy = 0;
    if(e.key === 'ArrowLeft') dx = -step;
    else if(e.key === 'ArrowRight') dx = step;
    else if(e.key === 'ArrowUp') dy = -step;
    else if(e.key === 'ArrowDown') dy = step;
    else return;
    e.preventDefault();
    s.x += dx;
    s.y += dy;
    markGeometryDirty();
    scheduleComposite();
    scheduleAfterInteraction();
  }

  function canvasPointFromClient(clientX, clientY){
    const rect = canvas.getBoundingClientRect();
    return {
      x: (clientX - rect.left) * (state.size.width / rect.width),
      y: (clientY - rect.top) * (state.size.height / rect.height),
    };
  }

  function onCanvasPointerDown(e){
    if(e.pointerType === 'mouse' && e.button !== 0) return;
    state.pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    window.addEventListener('pointermove', onPointerMove);
    window.addEventListener('pointerup', onPointerUp);
    window.addEventListener('pointercancel', onPointerUp);
    if(state.pointers.size === 2){
      // 2本目のポインタ: ピンチ開始。中点のワールド座標をアンカーにする
      const [p1, p2] = [...state.pointers.values()];
      const mid = canvasPointFromClient((p1.x + p2.x) / 2, (p1.y + p2.y) / 2);
      state.drag.mode = 'pinch';
      state.pinch = {
        dist: Math.max(1, Math.hypot(p1.x - p2.x, p1.y - p2.y)),
        worldX: (mid.x - state.view.x) / state.view.zoom,
        worldY: (mid.y - state.view.y) / state.view.zoom,
        zoom: state.view.zoom,
      };
    } else if(state.pointers.size === 1){
      state.drag.mode = 'pan';
      state.drag.startClientX = e.clientX;
      state.drag.startClientY = e.clientY;
      state.drag.startViewX = state.view.x;
      state.drag.startViewY = state.view.y;
    }
  }

  function onPointerMove(e){
    if(state.drag.mode === 'pinch'){
      if(!state.pointers.has(e.pointerId)) return;
      state.pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
      if(state.pointers.size === 2 && state.pinch){
        const [p1, p2] = [...state.pointers.values()];
        const dist = Math.max(1, Math.hypot(p1.x - p2.x, p1.y - p2.y));
        const mid = canvasPointFromClient((p1.x + p2.x) / 2, (p1.y + p2.y) / 2);
        const newZoom = clamp(state.pinch.zoom * (dist / state.pinch.dist), 0.1, 10);
        state.view.zoom = newZoom;
        state.view.x = mid.x - state.pinch.worldX * newZoom;
        state.view.y = mid.y - state.pinch.worldY * newZoom;
        scheduleComposite();
      }
      return;
    }
    if(state.drag.mode === 'pan'){
      const rect = canvas.getBoundingClientRect();
      const scaleX = state.size.width / rect.width;
      const scaleY = state.size.height / rect.height;
      state.view.x = state.drag.startViewX + (e.clientX - state.drag.startClientX) * scaleX;
      state.view.y = state.drag.startViewY + (e.clientY - state.drag.startClientY) * scaleY;
      scheduleComposite();
      return;
    }
    if(state.drag.mode === 'swirl'){
      const s = state.swirls.find(v => v.id === state.drag.swirlId);
      if(!s) return;
      const p = clientToWorld(e.clientX, e.clientY);
      s.x = p.x;
      s.y = p.y;
      markGeometryDirty();
      scheduleComposite();
      updateOverlay();
      scheduleAfterInteraction();
    }
  }

  function onPointerUp(e){
    if(state.drag.mode === 'swirl'){
      scheduleGeometryRender();
      state.drag.mode = null;
      state.drag.swirlId = null;
      window.removeEventListener('pointermove', onPointerMove);
      overlay.querySelectorAll('.source.dragging').forEach(el => el.classList.remove('dragging'));
      return;
    }
    if(e && e.pointerId != null) state.pointers.delete(e.pointerId);
    if(state.pointers.size === 1 && state.drag.mode === 'pinch'){
      // ピンチを離したら、残り1本でパンを引き継ぐ
      const [p] = [...state.pointers.values()];
      state.drag.mode = 'pan';
      state.pinch = null;
      state.drag.startClientX = p.x;
      state.drag.startClientY = p.y;
      state.drag.startViewX = state.view.x;
      state.drag.startViewY = state.view.y;
      return;
    }
    if(state.pointers.size === 0){
      state.drag.mode = null;
      state.pinch = null;
      window.removeEventListener('pointermove', onPointerMove);
      window.removeEventListener('pointerup', onPointerUp);
      window.removeEventListener('pointercancel', onPointerUp);
    }
  }

  function zoomViewAtCenter(factor){
    const mx = state.size.width / 2;
    const my = state.size.height / 2;
    const newZoom = clamp(state.view.zoom * factor, 0.1, 10);
    const worldX = (mx - state.view.x) / state.view.zoom;
    const worldY = (my - state.view.y) / state.view.zoom;
    state.view.x = mx - worldX * newZoom;
    state.view.y = my - worldY * newZoom;
    state.view.zoom = newZoom;
  }

  // Canvasにフォーカスがあるときのキーボード操作 (矢印=パン, +-=ズーム, 0=リセット)
  function onCanvasKeyDown(e){
    const panStep = e.shiftKey ? 120 : 24;
    let handled = true;
    if(e.key === 'ArrowLeft') state.view.x += panStep;
    else if(e.key === 'ArrowRight') state.view.x -= panStep;
    else if(e.key === 'ArrowUp') state.view.y += panStep;
    else if(e.key === 'ArrowDown') state.view.y -= panStep;
    else if(e.key === '+' || e.key === '=') zoomViewAtCenter(1.15);
    else if(e.key === '-' || e.key === '_') zoomViewAtCenter(1 / 1.15);
    else if(e.key === '0') state.view = { x: 0, y: 0, zoom: 1 };
    else handled = false;
    if(!handled) return;
    e.preventDefault();
    scheduleComposite();
  }

  function onWheel(e){
    e.preventDefault();
    const rect = canvas.getBoundingClientRect();
    const mx = (e.clientX - rect.left) * (state.size.width / rect.width);
    const my = (e.clientY - rect.top) * (state.size.height / rect.height);
    const delta = -Math.sign(e.deltaY) * 0.1;
    const newZoom = clamp(state.view.zoom * (1 + delta), 0.1, 10);
    const worldX = (mx - state.view.x) / state.view.zoom;
    const worldY = (my - state.view.y) / state.view.zoom;
    state.view.x = mx - worldX * newZoom;
    state.view.y = my - worldY * newZoom;
    state.view.zoom = newZoom;
    scheduleComposite();
  }

  function syncInputs(){
    const map = {
      seedInput: state.seed,
      width: state.size.width, height: state.size.height, exportScale: state.exportScale, previewScale: state.previewScale,
      exportQuality: state.exportQuality, exportSupersample: state.exportSupersample, exportBatchLines: state.exportBatchLines, exportAutoProtect: state.exportAutoProtect,
      bgTransparent: state.config.bgTransparent, bgColor: state.config.bgColor, colorMode: state.config.colorMode,
      lineCount: state.config.lineCount, lineWidthMin: state.config.lineWidthMin, lineWidthMax: state.config.lineWidthMax,
      opacity: state.config.opacity, flowCoverage: state.config.flowCoverage, generationWidth: state.config.generationWidth,
      segmentResolution: state.config.segmentResolution, batchLines: state.config.batchLines,
      swirlType: state.config.swirlType, swirlRadius: state.config.swirlRadius, swirlStrength: state.config.swirlStrength,
      curveTension: state.config.curveTension, turbulence: state.config.turbulence, turbulenceFreq: state.config.turbulenceFreq,
      verticalStretch: state.config.verticalStretch, renderShape: state.config.renderShape,
    };
    Object.entries(map).forEach(([id, value]) => {
      const el = $(id);
      if(!el) return;
      if(el.type === 'checkbox') el.checked = !!value;
      else el.value = String(value);
    });
    renderColorInputs();
  }

  function renderColorInputs(){
    const wrap = $('colors');
    wrap.innerHTML = '';
    state.config.colors.forEach((c, idx) => {
      const row = document.createElement('div');
      row.className = 'color-item';
      row.innerHTML = `
        <input type="color" value="${c.hex}" data-role="hex" data-idx="${idx}">
        <input type="number" min="0.01" max="10" step="0.01" value="${c.weight}" data-role="weight" data-idx="${idx}" title="出現の重み" aria-label="出現の重み">
        <input type="number" min="0.01" max="10" step="0.01" value="${c.width != null ? c.width : c.weight}" data-role="width" data-idx="${idx}" title="太さ係数" aria-label="太さ係数">
        <button class="btn small danger" data-role="delete" data-idx="${idx}">×</button>`;
      wrap.appendChild(row);
    });
    wrap.querySelectorAll('input,button').forEach(el => {
      el.addEventListener('input', onColorInput);
      el.addEventListener('click', onColorInput);
    });
  }

  function onColorInput(e){
    const role = e.target.dataset.role;
    const idx = Number(e.target.dataset.idx);
    if(role === 'hex') state.config.colors[idx].hex = e.target.value;
    if(role === 'weight') state.config.colors[idx].weight = clamp(Number(e.target.value) || 1, 0.01, 10);
    if(role === 'width') state.config.colors[idx].width = clamp(Number(e.target.value) || 1, 0.01, 10);
    if(role === 'delete'){
      if(state.config.colors.length <= 1) return;
      state.config.colors.splice(idx, 1);
      renderColorInputs();
      scheduleGeometryRender();
      return;
    }
    scheduleGeometryRenderDebounced();
  }

  function bindInputs(){
    [
      'width','height','exportScale','previewScale','exportQuality','exportSupersample','exportBatchLines','bgColor','colorMode','lineCount','lineWidthMin','lineWidthMax','opacity',
      'flowCoverage','generationWidth','segmentResolution','batchLines','swirlType','swirlRadius','swirlStrength','curveTension',
      'turbulence','turbulenceFreq','verticalStretch','renderShape'
    ].forEach(id => {
      $(id).addEventListener('input', () => {
        if(id === 'width' || id === 'height'){
          state.size[id] = clamp(Math.round(Number($(id).value) || 1), 64, 16384);
          rebuildBaseLines();
        } else if(id === 'exportScale') state.exportScale = clamp(Math.round(Number($(id).value) || 1), 1, 8);
        else if(id === 'previewScale') state.previewScale = clamp(Number($(id).value) || 1, 0.25, 1);
        else if(id === 'exportQuality') state.exportQuality = $(id).value;
        else if(id === 'exportSupersample') state.exportSupersample = clamp(Number($(id).value) || 1, 1, 2);
        else if(id === 'exportBatchLines') state.exportBatchLines = clamp(Math.round(Number($(id).value) || 180), 10, 4000);
        else {
          const numFields = new Set(['lineCount','lineWidthMin','lineWidthMax','opacity','flowCoverage','generationWidth','segmentResolution','batchLines','swirlRadius','swirlStrength','curveTension','turbulence','turbulenceFreq','verticalStretch']);
          if(numFields.has(id)){
            const v = readClampedNumber($(id), state.config[id]);
            state.config[id] = (id === 'lineCount' || id === 'batchLines') ? Math.round(v) : v;
          } else {
            state.config[id] = $(id).value;
          }
          if(id === 'lineCount' || id === 'generationWidth') rebuildBaseLines();
        }
        scheduleGeometryRenderDebounced();
        updateExportEstimate();
      });
    });

    // 確定時 (change) にクランプ後の実値を入力欄へ書き戻し、表示と実値を一致させる。
    // 入力途中 (input) では書き戻さないので、小数などのタイピングを妨げない。
    [
      'width','height','exportScale','previewScale','exportQuality','exportSupersample','exportBatchLines','bgColor','colorMode','lineCount','lineWidthMin','lineWidthMax','opacity',
      'flowCoverage','generationWidth','segmentResolution','batchLines','swirlType','swirlRadius','swirlStrength','curveTension',
      'turbulence','turbulenceFreq','verticalStretch','renderShape'
    ].forEach(id => {
      $(id).addEventListener('change', () => syncInputs());
    });

    $('exportAutoProtect').addEventListener('change', () => { state.exportAutoProtect = $('exportAutoProtect').checked; updateExportEstimate(); });
    $('bgTransparent').addEventListener('change', () => { state.config.bgTransparent = $('bgTransparent').checked; scheduleGeometryRender(); });
    $('btnAddColor').addEventListener('click', () => { state.config.colors.push({ hex: '#ffffff', weight: 1, width: 1 }); renderColorInputs(); scheduleGeometryRender(); });
    $('btnRemoveColor').addEventListener('click', () => { if(state.config.colors.length > 1) state.config.colors.pop(); renderColorInputs(); scheduleGeometryRender(); });
    $('btnAddSwirl').addEventListener('click', () => { state.swirls.push(...generateInitialSwirls(state.size.width, state.size.height, 1)); scheduleGeometryRender(); });
    $('btnRemoveSwirl').addEventListener('click', () => { if(state.swirls.length > 1) state.swirls.pop(); scheduleGeometryRender(); });
    $('btnResetSwirls').addEventListener('click', () => { state.swirls = generateInitialSwirls(state.size.width, state.size.height, Math.max(1, state.swirls.length)); scheduleGeometryRender(); });
    $('btnRandomize').addEventListener('click', () => { state.seed = Math.floor(Math.random() * 1000000); rebuildBaseLines(); scheduleGeometryRender(); });
    $('seedInput').addEventListener('change', () => {
      state.seed = Math.round(readClampedNumber($('seedInput'), state.seed));
      syncInputs();
      rebuildBaseLines();
      scheduleGeometryRender();
    });
    $('btnExportSettings').addEventListener('click', exportSettingsJSON);
    $('btnImportSettings').addEventListener('click', () => $('settingsFile').click());
    $('settingsFile').addEventListener('change', async () => {
      const file = $('settingsFile').files && $('settingsFile').files[0];
      $('settingsFile').value = '';
      if(file) await importSettingsJSON(file);
    });
    $('btnResetView').addEventListener('click', () => { state.view = { x: 0, y: 0, zoom: 1 }; scheduleComposite(); });
    document.querySelectorAll('[data-preset]').forEach(btn => {
      btn.addEventListener('click', () => {
        Object.assign(state.config, deepCopy(PRESETS[btn.dataset.preset]));
        syncInputs();
        updateExportEstimate();
        rebuildBaseLines();
        scheduleGeometryRender();
        updateExportEstimate();
      });
    });
    $('btnExportPng').addEventListener('click', exportPNG);

  function sanitizeImportedConfig(cfg){
    if(!cfg || typeof cfg !== 'object') return;
    const ranges = { lineCount:[1,30000], lineWidthMin:[0.1,50], lineWidthMax:[0.1,50], opacity:[0,1], flowCoverage:[0.1,20], generationWidth:[0.1,20], segmentResolution:[0.1,20], batchLines:[10,4000], swirlRadius:[1,10000], swirlStrength:[0,10], curveTension:[0,10], turbulence:[0,200], turbulenceFreq:[0.0001,1], verticalStretch:[0.1,10] };
    for(const [key, [min, max]] of Object.entries(ranges)){
      if(cfg[key] != null){
        const v = Number(cfg[key]);
        if(Number.isFinite(v)) state.config[key] = clamp(v, min, max);
      }
    }
    state.config.lineCount = Math.round(state.config.lineCount);
    state.config.batchLines = Math.round(state.config.batchLines);
    if(['sequence','linear','weighted'].includes(cfg.colorMode)) state.config.colorMode = cfg.colorMode;
    if(['vortex','attract','repel'].includes(cfg.swirlType)) state.config.swirlType = cfg.swirlType;
    if(['rect','circle'].includes(cfg.renderShape)) state.config.renderShape = cfg.renderShape;
    if(typeof cfg.bgColor === 'string' && /^#[0-9a-fA-F]{6}$/.test(cfg.bgColor)) state.config.bgColor = cfg.bgColor;
    if(cfg.bgTransparent != null) state.config.bgTransparent = !!cfg.bgTransparent;
    if(Array.isArray(cfg.colors)){
      const colors = cfg.colors
        .filter(c => c && typeof c.hex === 'string' && /^#[0-9a-fA-F]{6}$/.test(c.hex))
        .map(c => {
          const weight = clamp(Number(c.weight) || 1, 0.01, 10);
          // 旧形式 (width なし) では weight を太さ係数にも流用し、従来の見た目を再現する
          const width = Number.isFinite(Number(c.width)) && Number(c.width) > 0 ? clamp(Number(c.width), 0.01, 10) : weight;
          return { hex: c.hex, weight, width };
        });
      if(colors.length) state.config.colors = colors;
    }
  }

  async function importSettingsJSON(file){
    try {
      const data = JSON.parse(await file.text());
      if(!data || typeof data !== 'object' || !data.config) throw new Error('invalid settings file');
      if(data.size){
        if(Number.isFinite(Number(data.size.width))) state.size.width = clamp(Math.round(Number(data.size.width)), 64, 16384);
        if(Number.isFinite(Number(data.size.height))) state.size.height = clamp(Math.round(Number(data.size.height)), 64, 16384);
      }
      if(Number.isFinite(Number(data.seed))) state.seed = clamp(Math.round(Number(data.seed)), 0, 2147483647);
      if(Number.isFinite(Number(data.exportScale))) state.exportScale = clamp(Math.round(Number(data.exportScale)), 1, 8);
      if(Number.isFinite(Number(data.previewScale))) state.previewScale = clamp(Number(data.previewScale), 0.25, 1);
      if(['standard','high','ultra'].includes(data.exportQuality)) state.exportQuality = data.exportQuality;
      if(Number.isFinite(Number(data.exportSupersample))) state.exportSupersample = clamp(Number(data.exportSupersample), 1, 2);
      if(Number.isFinite(Number(data.exportBatchLines))) state.exportBatchLines = clamp(Math.round(Number(data.exportBatchLines)), 10, 4000);
      if(data.exportAutoProtect != null) state.exportAutoProtect = !!data.exportAutoProtect;
      sanitizeImportedConfig(data.config);
      if(Array.isArray(data.swirls)){
        const swirls = data.swirls
          .filter(s => s && Number.isFinite(Number(s.x)) && Number.isFinite(Number(s.y)))
          .map((s, i) => ({ id: Date.now() + i, x: Number(s.x), y: Number(s.y) }));
        if(swirls.length) state.swirls = swirls;
      }
      syncInputs();
      rebuildBaseLines();
      updateExportEstimate();
      scheduleGeometryRender();
      updateStatus('設定を読み込みました', 1);
    } catch(err) {
      console.error(err);
      alert('設定JSONの読み込みに失敗しました。ファイル内容を確認してください。');

  }

  function formatBytes(bytes){
    const units = ['B','KB','MB','GB'];
    let v = bytes;
    let i = 0;
    while(v >= 1024 && i < units.length - 1){ v /= 1024; i++; }
    return `${v >= 100 ? Math.round(v) : round(v, 1)} ${units[i]}`;
  }

  function estimateExportPlan(mode='full'){
    const targetWidth = Math.max(1, Math.round(state.size.width * state.exportScale));
    const targetHeight = Math.max(1, Math.round(state.size.height * state.exportScale));
    const requestedQuality = state.exportQuality;
    let effectiveQuality = requestedQuality;
    let effectiveSupersample = state.exportQuality === 'standard' ? 1 : Math.max(1, state.exportSupersample);
    let effectiveBatchLines = clamp(Math.round(state.exportBatchLines || 180), 10, 4000);

    const applyProfile = () => {
      if(effectiveQuality === 'ultra') return { detailMultiplier: 0.42, smoothing: 'high' };
      if(effectiveQuality === 'high') return { detailMultiplier: 0.6, smoothing: 'high' };
      effectiveSupersample = 1;
      effectiveQuality = 'standard';
      return { detailMultiplier: 1, smoothing: 'medium' };
    };

    let profile = applyProfile();

    const estimateBytesFor = (ssaa) => {
      const ww = Math.max(1, Math.round(targetWidth * ssaa));
      const wh = Math.max(1, Math.round(targetHeight * ssaa));
      const fullBytes = ww * wh * 4;
      const outBytes = targetWidth * targetHeight * 4;
      return Math.round(fullBytes * 3.2 + outBytes * 2.2 + state.config.lineCount * 96);
    };

    const warnings = [];
    let estimatedBytes = estimateBytesFor(effectiveSupersample);
    let risk = estimatedBytes > 900 * 1024 * 1024 ? 'critical' : estimatedBytes > 550 * 1024 * 1024 ? 'high' : estimatedBytes > 280 * 1024 * 1024 ? 'medium' : 'low';

    if(state.exportAutoProtect){
      while((estimatedBytes > 850 * 1024 * 1024 || targetWidth * targetHeight * effectiveSupersample * effectiveSupersample > 95_000_000) && (effectiveQuality !== 'standard' || effectiveSupersample > 1)){
        if(effectiveSupersample > 1.5) effectiveSupersample = 1.5;
        else if(effectiveSupersample > 1.25) effectiveSupersample = 1.25;
        else if(effectiveSupersample > 1) effectiveSupersample = 1;
        else if(effectiveQuality === 'ultra') effectiveQuality = 'high';
        else if(effectiveQuality === 'high') effectiveQuality = 'standard';
        profile = applyProfile();
        estimatedBytes = estimateBytesFor(effectiveSupersample);
      }
      if(estimatedBytes > 700 * 1024 * 1024){
        effectiveBatchLines = Math.min(effectiveBatchLines, 120);
        warnings.push('分割描画を強めます');
      }
      if(effectiveQuality !== requestedQuality) warnings.push(`品質 ${requestedQuality} → ${effectiveQuality}`);
      if(Math.abs(effectiveSupersample - (state.exportQuality === 'standard' ? 1 : Math.max(1, state.exportSupersample))) > 1e-9) warnings.push(`SSAA ${state.exportSupersample} → ${effectiveSupersample}`);
    }

    const workWidth = Math.max(1, Math.round(targetWidth * effectiveSupersample));
    const workHeight = Math.max(1, Math.round(targetHeight * effectiveSupersample));
    estimatedBytes = estimateBytesFor(effectiveSupersample);
    risk = estimatedBytes > 900 * 1024 * 1024 ? 'critical' : estimatedBytes > 550 * 1024 * 1024 ? 'high' : estimatedBytes > 280 * 1024 * 1024 ? 'medium' : 'low';
    if(mode === 'view' && state.view.zoom > 2.5) warnings.push('表示中保存では高ズームでエッジ負荷が増えます');
    return {
      targetWidth, targetHeight, workWidth, workHeight,
      requestedQuality, effectiveQuality,
      requestedSupersample: state.exportQuality === 'standard' ? 1 : Math.max(1, state.exportSupersample),
      effectiveSupersample, effectiveBatchLines,
      detailMultiplier: profile.detailMultiplier,
      smoothing: profile.smoothing,
      estimatedBytes, megapixels: (workWidth * workHeight) / 1_000_000,
      risk, warnings,
    };
  }

  function updateExportEstimate(){
    const el = $('exportEstimate');
    if(!el) return;
    const plan = estimateExportPlan('full');
    const riskMap = { low: '低', medium: '中', high: '高', critical: '危険' };
    const auto = state.exportAutoProtect ? 'ON' : 'OFF';
    const changed = [];
    if(plan.effectiveQuality !== plan.requestedQuality) changed.push(`品質 ${plan.effectiveQuality}`);
    if(Math.abs(plan.effectiveSupersample - plan.requestedSupersample) > 1e-9) changed.push(`SSAA ${plan.effectiveSupersample}`);
    let text = `推定: ${plan.targetWidth}×${plan.targetHeight} / 作業 ${plan.workWidth}×${plan.workHeight} / 約${formatBytes(plan.estimatedBytes)} / リスク ${riskMap[plan.risk]} / 自動保護 ${auto}`;
    if(changed.length) text += ` / 自動調整: ${changed.join(', ')}`;
    el.textContent = text;
    el.style.color = plan.risk === 'critical' ? '#ff8f8f' : plan.risk === 'high' ? '#ffbe78' : plan.risk === 'medium' ? '#e9d27a' : '#9a9a9a';
  }

  function getExportProfile(plan){
    // 自動保護で調整済みのプラン (estimateExportPlan の戻り値) をそのまま使う。
    // 以前はここで生の設定から取り直していたため、画面に表示される保護内容と
    // 実際の書き出し (作業キャンバス寸法だけがプラン由来) が食い違い、
    // 渦の位置や線幅の倍率だけ調整前の値で計算されていた。
    return {
      detailMultiplier: plan.detailMultiplier,
      supersample: plan.effectiveSupersample,
      batchLines: plan.effectiveBatchLines,
      smoothing: plan.smoothing,
    };
  }

  async function renderFullToContextBatched(context, width, height, cfg, baseLines, swirls, progressLabel){
    setupBaseSurface(context, width, height, cfg);
    const flowHalfLen = (height * cfg.flowCoverage) / 2;
    const renderYMin = -500;
    const renderYMax = height + 500;
    const { xs, yRatios, widths, normalizedPos, count } = baseLines;
    const batch = clamp(Math.round(cfg.batchLines || state.exportBatchLines || 180), 10, 4000);
    for(let start=0; start<count; start += batch){
      const end = Math.min(count, start + batch);
      for(let i=start;i<end;i++){
        const colorDef = chooseColor(i, normalizedPos[i]);
        const yCenter = yRatios[i] * height;
        const startY = yCenter - flowHalfLen;
        const endY = yCenter + flowHalfLen;
        if(endY < renderYMin || startY > renderYMax) continue;
        context.strokeStyle = colorDef.hex;
        const baseW = cfg.lineWidthMin + widths[i] * (cfg.lineWidthMax - cfg.lineWidthMin);
        context.lineWidth = Math.max(0.01, baseW * colorWidthFactor(colorDef));
        strokeLine(context, xs[i], startY, endY, cfg, swirls);
      }
      updateStatus(progressLabel, end / Math.max(1, count));
      await new Promise(requestAnimationFrame);
    }
    finishBaseSurface(context, cfg);
  }

  async function exportPNGAdvanced(mode){
    const preserveView = mode === 'view';

    const plan = estimateExportPlan(mode);
    const targetWidth = plan.targetWidth;

    const supersample = profile.supersample;
    const workWidth = plan.workWidth;
    const workHeight = plan.workHeight;
    if(plan.warnings.length) updateStatus(`${label} / ${plan.warnings.join(' / ')}`, 0);

    const full = document.createElement('canvas');
    full.width = workWidth;
    full.height = workHeight;
    const fullCtx = full.getContext('2d', { alpha: true });

    const baseLines = generateRandomLinesSOA(workWidth, workHeight, state.config.lineCount, state.seed, state.config.generationWidth);
    const swirls = state.swirls.map(s => ({ id: s.id, x: s.x * state.exportScale * supersample, y: s.y * state.exportScale * supersample }));
    const exportCfg = {
      ...state.config,
      segmentResolution: Math.max(0.08, state.config.segmentResolution * profile.detailMultiplier),
      swirlRadius: state.config.swirlRadius * state.exportScale * supersample,
      turbulence: state.config.turbulence * state.exportScale * supersample,

      lineWidthMax: Math.max(0.05, state.config.lineWidthMax * state.exportScale * supersample),
      batchLines: profile.batchLines,
    };

    await renderFullToContextBatched(fullCtx, workWidth, workHeight, exportCfg, baseLines, swirls, label);

    const out = document.createElement('canvas');
    out.width = targetWidth;
    out.height = targetHeight;
    const outCtx = out.getContext('2d', { alpha: true });

    outCtx.setTransform(1,0,0,1,0,0);
    outCtx.clearRect(0,0,targetWidth,targetHeight);
    if(!state.config.bgTransparent){
      outCtx.fillStyle = state.config.bgColor;
      outCtx.fillRect(0,0,targetWidth,targetHeight);
    }
    outCtx.imageSmoothingEnabled = true;
    outCtx.imageSmoothingQuality = profile.smoothing;
    if(preserveView){
      outCtx.setTransform(
        state.view.zoom,
        0,
        0,
        state.view.zoom,
        state.view.x * state.exportScale,
        state.view.y * state.exportScale
      );
      outCtx.drawImage(full, 0, 0, workWidth / supersample, workHeight / supersample);
      outCtx.setTransform(1,0,0,1,0,0);
    } else {
      outCtx.drawImage(full, 0, 0, targetWidth, targetHeight);
    }

    out.toBlob(blob => {
      if(!blob){ updateStatus('PNG失敗', 0); alert('PNG保存に失敗しました'); return; }
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = preserveView ? `Leary_fixed_v6_seed${state.seed}_view_${targetWidth}x${targetHeight}.png` : `Leary_fixed_v6_seed${state.seed}_${targetWidth}x${targetHeight}.png`;
      a.click();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
      updateStatus('待機', 1);
    }, 'image/png');
  }

  function svgEsc(str){ return String(str).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

  async function exportSVG(){
    updateStatus('SVG出力中', 0);
    const width = state.size.width;
    const height = state.size.height;
    const cfg = state.config;
    const baseLines = state.baseLines;
    const flowHalfLen = (height * cfg.flowCoverage) / 2;
    const renderYMin = -500;
    const renderYMax = height + 500;
    const { xs, yRatios, widths, normalizedPos, count } = baseLines;

    // まず少量の線で総点数を推定し、巨大なSVGになりそうなら確認する。
    // (以前は全量を同期生成していたため、大きな設定ではタブが固まっていた)
    const sampleCount = Math.min(count, 24);
    let samplePoints = 0;
    let sampleLines = 0;
    for(let i=0;i<sampleCount;i++){
      const yCenter = yRatios[i] * height;
      const startY = yCenter - flowHalfLen;
      const endY = yCenter + flowHalfLen;
      if(endY < renderYMin || startY > renderYMax) continue;
      samplePoints += linePoints(xs[i], startY, endY, cfg, state.swirls).length;
      sampleLines++;
    }
    if(sampleLines > 0){
      const estimatedPoints = Math.round(samplePoints / sampleLines * count);
      const estimatedBytes = estimatedPoints * 18;
      if(estimatedBytes > 32 * 1024 * 1024){
        const proceed = confirm(`SVGの推定サイズは約 ${formatBytes(estimatedBytes)}（約 ${estimatedPoints.toLocaleString()} 点）です。生成に時間がかかる場合があります。続行しますか？`);
        if(!proceed){ updateStatus('待機', 1); return; }
      }
    }

    const parts = [];
    parts.push(`<?xml version="1.0" encoding="UTF-8"?>\n`);
    parts.push(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${width} ${height}" width="${width}" height="${height}">`);
    if(cfg.renderShape === 'circle'){
      const r = Math.min(width, height) / 2 - 20;
      parts.push(`<defs><clipPath id="clipCircle"><circle cx="${width/2}" cy="${height/2}" r="${r}"/></clipPath></defs><g clip-path="url(#clipCircle)">`);
    }
    if(!cfg.bgTransparent) parts.push(`<rect width="100%" height="100%" fill="${svgEsc(cfg.bgColor)}"/>`);
    const batch = 150;
    for(let start=0; start<count; start += batch){
      const end = Math.min(count, start + batch);
      for(let i=start;i<end;i++){
        const colorDef = chooseColor(i, normalizedPos[i]);
        const yCenter = yRatios[i] * height;
        const startY = yCenter - flowHalfLen;
        const endY = yCenter + flowHalfLen;
        if(endY < renderYMin || startY > renderYMax) continue;
        const baseW = cfg.lineWidthMin + widths[i] * (cfg.lineWidthMax - cfg.lineWidthMin);
        const strokeW = Math.max(0.01, baseW * colorWidthFactor(colorDef));
        const points = linePoints(xs[i], startY, endY, cfg, state.swirls);
        if(points.length < 2) continue;
        const d = points.map((p, idx) => `${idx===0 ? 'M' : 'L'} ${round(p[0],2)} ${round(p[1],2)}`).join(' ');
        parts.push(`<path d="${d}" fill="none" stroke="${svgEsc(colorDef.hex)}" stroke-width="${round(strokeW,3)}" stroke-linecap="round" stroke-linejoin="round" opacity="${cfg.opacity}"/>`);
      }
      updateStatus('SVG出力中', end / Math.max(1, count));
      await new Promise(requestAnimationFrame);
    }
    if(cfg.renderShape === 'circle') parts.push(`</g>`);
    parts.push(`</svg>`);
    const blob = new Blob(parts, { type: 'image/svg+xml;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `Leary_fixed_v6_seed${state.seed}_${width}x${height}.svg`;
    a.click();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
    updateStatus('待機', 1);
  }
