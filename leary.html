<style>
  :root{
    --bg:#000000;
    --bg-2:#000000;
    --panel:rgba(0,0,0,.92);
    --panel-2:rgba(255,255,255,.02);
    --panel-3:rgba(255,255,255,.04);
    --line:rgba(255,255,255,.10);
    --line-strong:rgba(255,255,255,.18);
    --text:#f5f7fb;
    --muted:rgba(255,255,255,.56);
    --soft:rgba(255,255,255,.78);
    --accent:#ffffff;
    --shadow:none;
    --radius:18px;
    --radius-sm:12px;
  }
  *{box-sizing:border-box}
  html,body{
    height:100%;
    margin:0;
    background:#000;
    color:var(--text);
    font:13px/1.45 Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans JP",sans-serif;
    letter-spacing:.01em;
  }
  button,input,select{font:inherit}
  button,input,select{outline:none}
  ::selection{background:rgba(255,255,255,.10)}
  #app{
    height:100%;
    display:grid;
    grid-template-columns:390px minmax(0,1fr);
    gap:0;
    overflow:hidden;
  }
  .panel{
    position:relative;
    overflow:auto;
    padding:18px 16px 40px;
    background:var(--panel);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    border-right:1px solid var(--line);
  }
  .panel::after{
    content:"";
    position:fixed;
    top:0;
    left:389px;
    width:1px;
    height:100vh;
    background:rgba(255,255,255,.12);
    pointer-events:none;
  }
  .panel-head{
    margin-bottom:14px;
    padding:4px 2px 10px;
  }
  .eyebrow{
    display:inline-flex;
    align-items:center;
    gap:10px;
    color:var(--soft);
    font-size:10px;
    letter-spacing:.22em;
    text-transform:uppercase;
  }
  .eyebrow::before{
    content:"";
    width:24px;
    height:1px;
    background:rgba(255,255,255,.48);
  }
  .title,.subtitle{display:none}
  .toolbar{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
    margin:0 0 14px;
  }
  .btn{
    appearance:none;
    border:1px solid var(--line);
    background:rgba(255,255,255,.03);
    color:var(--text);
    border-radius:14px;
    padding:11px 12px;
    cursor:pointer;
    transition:transform .14s ease, background .14s ease, border-color .14s ease, box-shadow .14s ease, opacity .14s ease;
    box-shadow:none;
  }
  .btn:hover{
    background:rgba(255,255,255,.06);
    border-color:var(--line-strong);
    transform:translateY(-1px);
  }
  .btn:active{transform:translateY(0)}
  .btn.primary{
    color:#000000;
    background:#ffffff;
    border-color:#ffffff;
    box-shadow:none;
  }
  .btn.small{
    padding:9px 10px;
    border-radius:12px;
  }
  .section{
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:14px;
    background:var(--panel-2);
    box-shadow:var(--shadow);
    margin-bottom:12px;
  }
  .section h3{
    margin:0 0 12px;
    font-size:11px;
    font-weight:600;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:var(--soft);
  }
  .metrics{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px;
  }
  .metric{
    min-width:0;
    border:1px solid var(--line);
    border-radius:16px;
    padding:10px 11px;
    background:rgba(255,255,255,.015);
  }
  .metric-label{
    color:var(--muted);
    font-size:11px;
    margin-bottom:5px;
  }
  .metric-value{
    font-size:13px;
    color:var(--text);
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .row{
    display:grid;
    grid-template-columns:minmax(0,1fr) 96px;
    gap:12px;
    align-items:center;
    margin-bottom:10px;
  }
  .row:last-child{margin-bottom:0}
  .row > label{
    color:rgba(255,255,255,.88);
    min-width:0;
  }
  .row input[type="number"],
  .row input[type="text"],
  .row select{
    width:100%;
    padding:9px 10px;
    border-radius:12px;
    border:1px solid var(--line);
    background:#000000;
    color:var(--text);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.03);
  }
  .row input[type="number"]:focus,
  .row input[type="text"]:focus,
  .row select:focus,
  .color-item input:focus{
    border-color:rgba(255,255,255,.28);
    box-shadow:0 0 0 3px rgba(255,255,255,.06);
  }
  .row input[type="color"]{
    width:100%;
    height:40px;
    padding:3px;
    border-radius:12px;
    border:1px solid var(--line);
    background:#000000;
  }
  .stack{display:flex;flex-direction:column;gap:8px}
  .inline{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .muted{color:var(--muted)}
  .mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
  .grid-2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .grid-preset{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px;
  }
  .colors{display:flex;flex-direction:column;gap:8px}
  .color-item{
    display:grid;
    grid-template-columns:minmax(0,1fr) 62px 62px 32px;
    gap:8px;
    align-items:center;
    padding:6px;
    border:1px solid var(--line);
    border-radius:14px;
    background:rgba(255,255,255,.015);
  }
  .color-item input[type="number"]{
    padding:8px 7px;
    border-radius:10px;
    border:1px solid var(--line);
    background:#000000;
    color:var(--text);
  }
  .hint{
    font-size:12px;
    color:var(--muted);
    line-height:1.5;
  }
  .footer-space{height:24px}
  .viewer{
    position:relative;
    overflow:hidden;
    background:#000000;
  }
  .viewer::before{
    content:"";
    position:absolute;
    inset:22px;
    border-radius:28px;
    border:1px solid rgba(255,255,255,.08);
    pointer-events:none;
  }
  .viewer-top{
    position:absolute;
    top:20px;
    left:20px;
    right:20px;
    display:flex;
    justify-content:space-between;
    gap:10px;
    pointer-events:none;
  }
  .pill{
    pointer-events:auto;
    display:inline-flex;
    gap:10px;
    align-items:center;
    min-height:42px;
    padding:10px 14px;
    background:rgba(0,0,0,.72);
    border:1px solid rgba(255,255,255,.08);
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
    border-radius:999px;
    color:#ffffff;
    box-shadow:none;
  }
  .canvas-wrap{position:absolute;inset:0;display:grid;place-items:center;padding:30px}
  .stage{position:relative;max-width:100%;max-height:100%}
  canvas{
    display:block;
    background:transparent;
    border-radius:22px;
    box-shadow:none;
  }
  canvas:focus-visible{
    outline:2px solid rgba(255,255,255,.85);
    outline-offset:4px;
  }
  .checker{
    background-image:
      linear-gradient(45deg, rgba(255,255,255,.016) 25%, transparent 25%),
      linear-gradient(-45deg, rgba(255,255,255,.016) 25%, transparent 25%),
      linear-gradient(45deg, transparent 75%, rgba(255,255,255,.016) 75%),
      linear-gradient(-45deg, transparent 75%, rgba(255,255,255,.016) 75%);
    background-size:24px 24px;
    background-position:0 0,0 12px,12px -12px,-12px 0;
  }
  .source{
    position:absolute;
    width:14px;
    height:14px;
    border-radius:50%;
    border:2px solid rgba(255,255,255,.95);
    background:#000000;
    transform:translate(-50%,-50%);
    box-shadow:none;
    cursor:grab;
  }
  .source::after{
    content:"";
    position:absolute;
    inset:-7px;
    border-radius:50%;
    border:1px solid rgba(255,255,255,.16);
  }
  .source.dragging{cursor:grabbing}
  .source:focus-visible{
    outline:2px solid rgba(255,255,255,.9);
    outline-offset:3px;
  }
  .switches{
    display:flex;
    gap:18px;
    flex-wrap:wrap;
    margin:4px 0 2px;
  }
  .switches label{
    display:inline-flex;
    align-items:center;
    gap:8px;
    color:var(--soft);
  }
  input[type="checkbox"]{
    width:16px;
    height:16px;
    accent-color:#ffffff;
  }
  .section-note{
    margin-top:10px;
    padding-top:10px;
    border-top:1px solid var(--line);
  }
  .toolbar-wide{
    grid-column:1 / -1;
  }
  @media (max-width: 1120px){
    #app{grid-template-columns:360px minmax(0,1fr)}
    .panel::after{left:359px}
  }
  @media (max-width: 960px){
    #app{grid-template-columns:1fr;grid-template-rows:48vh 1fr}
    .panel{
      order:2;
      border-right:none;
      border-top:1px solid var(--line);
      padding-top:14px;
    }
    .panel::after{display:none}
    .viewer{order:1}
    .toolbar{grid-template-columns:1fr 1fr}
    .viewer-top{top:14px;left:14px;right:14px}
    .canvas-wrap{padding:18px}
  }

  /* ==== leary-noise-refine v1: bring Leary to the SHIPPED Noise standard ====
     Noise reference points: 56px centred thin title, frameless sections,
     text-style buttons (white fill = primary/active only), collapsible
     panel sections with saved state, 4px scrollbar, fills/blur/shadow stay. */

  /* 1. Frameless: remove every square frame / divider line. */
  .panel { border-right: 0; }
  .panel::after { display: none; }
  .section { border: 0; border-radius: 12px; background: rgba(255,255,255,.02); padding: 16px; margin-bottom: 20px; }
  .section-note { border-top: 0; padding-top: 2px; }
  .metric { border: 0; border-radius: 12px; background: rgba(255,255,255,.03); }
  .color-item { border: 0; border-radius: 12px; }
  .pill { border: 0; }
  .viewer::before { display: none; }
  /* explicit border:0 guard (Yayoi lesson: dropping the declaration alone
     can revive the UA default border on controls) */
  .panel button, .panel input, .panel select, .panel textarea { border: 0; }

  /* 2. Header: Noise's exact 56px, centred thin title only. */
  .panel-head {
    height: 56px; margin: 0 0 6px; padding: 0;
    display: flex; align-items: center; justify-content: center;
  }
  .eyebrow { font-size: 14px; font-weight: 300; letter-spacing: .2em; color: rgba(255,255,255,.78); }
  .eyebrow::before { display: none; }

  /* 2b. Panel tools (Noise: expand/collapse all), injected by the script below. */
  .leary-panel-tools { display: flex; gap: 4px; justify-content: flex-end; margin: 0 0 10px; }
  .leary-panel-tools button {
    border: 0; background: transparent; color: rgba(255,255,255,.45);
    font-size: 10px; letter-spacing: .12em; padding: 6px 10px; border-radius: 6px; cursor: pointer;
    transition: background-color .2s ease, color .2s ease;
  }
  .leary-panel-tools button:hover { color: #fff; background: rgba(255,255,255,.08); }

  /* 3. Buttons: Noise text style. No lift, no frame; fill only.
        Primary keeps its white fill (it is the main export action). */
  .btn {
    border: 0; border-radius: 8px; background: rgba(255,255,255,.04);
    padding: 10px 12px; font-size: 12px;
    transition: background-color .2s ease, color .2s ease;
  }
  .btn:hover { background: rgba(255,255,255,.09); border-color: transparent; transform: none; }
  .btn:active { transform: none; }
  .btn.primary { background: #f5f5f5; color: #000; border-color: transparent; }
  .btn.primary:hover { background: #ffffff; }
  .btn.small { border-radius: 8px; padding: 8px 10px; }
  .btn.danger:hover { background: rgba(255,107,107,.14); }

  /* 4. Inputs: frameless, Noise control fill (#171717), focus deepens the fill. */
  .row input[type="number"], .row input[type="text"], .row select,
  .color-item input[type="number"] {
    border: 0; border-radius: 8px; background: #171717; box-shadow: none;
  }
  .row input[type="number"]:focus, .row input[type="text"]:focus, .row select:focus,
  .color-item input:focus { border-color: transparent; background: #262626; box-shadow: none; }
  .row input[type="color"] { border: 0; border-radius: 8px; background: #171717; }
  button:focus-visible, input:focus-visible, select:focus-visible {
    outline: 2px solid rgba(255,255,255,.85); outline-offset: 2px;
  }

  /* 5. Section heads: Noise head treatment + collapsible (script toggles .collapsed). */
  .section h3 {
    display: flex; align-items: center; justify-content: space-between;
    font-size: 12px; letter-spacing: .12em; color: rgba(255,255,255,.72);
    cursor: pointer; user-select: none; margin-bottom: 14px;
  }
  .section h3::after {
    content: "\25BE"; font-size: 11px; color: rgba(255,255,255,.45);
    transition: transform .2s ease;
  }
  .section.collapsed h3 { margin-bottom: 0; }
  .section.collapsed h3::after { transform: rotate(-90deg); }
  .section.collapsed > *:not(h3) { display: none !important; }

  /* 6. Artwork first: canvas radius down to the Noise card radius,
        viewer pills smaller and quieter. */
  canvas { border-radius: 12px; }
  .pill { min-height: 34px; padding: 7px 12px; font-size: 11px; letter-spacing: .04em; background: rgba(0,0,0,.62); }

  /* 7. Thin scrollbar, Noise spec. */
  .panel { scrollbar-width: thin; scrollbar-color: #333 transparent; }
  .panel::-webkit-scrollbar { width: 4px; }
  .panel::-webkit-scrollbar-track { background: transparent; }
  .panel::-webkit-scrollbar-thumb { background: #333; border-radius: 2px; }
  .panel::-webkit-scrollbar-thumb:hover { background: #555; }

  /* 8. Mobile: the help pill wrapped character-by-character over the
        artwork. Drop it on small screens (the zoom readout stays,
        right-aligned) and give the canvas its room back. */
  @media (max-width: 960px) {
    .panel { border-top: 0; }
  }
  @media (max-width: 640px) {
    .viewer-top { justify-content: flex-end; }
    .viewer-top .pill:first-child { display: none; }
    .canvas-wrap { padding: 14px; }
  }
</style>

<style id="leary-lien-v2">
/* ==== leary-lien-v2: Lien layout — artwork first, panel floats ====
   Layout only. Generation core, state, export sizes untouched. */
#app{display:grid;grid-template-rows:56px minmax(0,1fr) 52px;grid-template-columns:minmax(0,1fr);height:100%;position:relative}
.leary2-header{grid-row:1;display:flex;align-items:center;justify-content:center;position:relative;background:#000;z-index:40;user-select:none}
.leary2-title{font-size:14px;font-weight:300;letter-spacing:.2em;color:rgba(255,255,255,.78)}
.viewer{grid-row:2;min-height:0}
.canvas-wrap{padding:0}
.viewer::before{display:none}
.viewer-top{top:12px;left:12px;right:12px;z-index:20}
.pill{min-height:30px;padding:5px 11px;font-size:10.5px}
/* Panel becomes a floating sheet above the 設定 button (Lien/TOPO pattern) */
.panel{position:absolute;left:24px;bottom:64px;top:auto;width:min(356px,calc(100vw - 32px));max-height:calc(100vh - 140px);z-index:60;border:0;border-radius:12px;background:rgba(8,8,8,.97);backdrop-filter:none;-webkit-backdrop-filter:none;box-shadow:0 25px 50px -12px rgba(0,0,0,.75);padding:14px 14px 26px;animation:leary2Up .2s ease-out}
@keyframes leary2Up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.panel::after{display:none}
body:not(.leary2-panel-open) .panel{display:none}
.panel-head{display:none}
.footer-space{display:none}
.panel .toolbar{display:none}
/* Bottom toolbar: text buttons only, primary keeps white fill */
.leary2-toolbar{grid-row:3;display:flex;align-items:center;gap:4px;padding:0 16px 0 24px;background:#000;z-index:40;overflow-x:auto;overflow-y:hidden;scrollbar-width:none;white-space:nowrap}
.leary2-toolbar::-webkit-scrollbar{display:none}
.leary2-toolbar .btn{border:0;background:transparent;border-radius:6px;padding:7px 10px;font-size:12px;letter-spacing:.08em;color:rgba(255,255,255,.85);transform:none;box-shadow:none;flex:0 0 auto}
.leary2-toolbar .btn:hover{background:rgba(255,255,255,.10);transform:none}
.leary2-toolbar .btn.primary{background:#fff;color:#000}
.leary2-toolbar .btn.primary:hover{background:#e8e8e8}
.leary2-toggle{font-weight:600}
.leary2-spacer{flex:1 0 12px}
.leary2-status{font-size:11px;color:rgba(255,255,255,.45);font-family:ui-monospace,SFMono-Regular,Menlo,monospace;flex:0 0 auto;padding-right:6px}
.panel{width:min(200px,calc(100vw - 32px))}
.panel .section{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:5px 6px;align-items:start;padding:9px 9px 10px;margin-bottom:8px}
.panel .section>h3{grid-column:1/-1;font-size:11px;margin-bottom:1px}
.panel .section>.row{display:flex;flex-direction:column;gap:2px;margin-bottom:0;min-width:0}
.panel .section>.row>*:first-child{font-size:8px;line-height:1.15;letter-spacing:-.02em;color:rgba(255,255,255,.55);white-space:normal;overflow-wrap:anywhere;min-width:0}
.panel .row input[type="number"],.panel .row input[type="text"],.panel .row select{width:100%;padding:2px 3px;font-size:10px;min-width:0}
.panel .section>.row input[type="color"]{width:100%;height:20px;padding:0}
.panel .section>.row:has(> select){grid-column:span 2}
.panel .metrics{grid-column:1/-1;grid-template-columns:repeat(4,minmax(0,1fr));gap:5px}
.panel .metric{padding:3px 4px;font-size:8px}
.panel .metric b,.panel .metric strong,.panel .metric .val{font-size:10px}
.panel .grid-preset{grid-column:1/-1;grid-template-columns:repeat(3,minmax(0,1fr));gap:5px}
.panel .grid-preset .btn,.panel .btn.small{padding:4px 2px;font-size:10.5px}
.panel .grid-2{grid-column:1/-1;gap:6px}
.panel .grid-2 .row{grid-template-columns:16px minmax(0,1fr);gap:4px}
.panel .switches{grid-column:1/-1}
.panel .section-note,.panel .hint{grid-column:1/-1;font-size:9px;line-height:1.5}
.panel .colors{grid-column:1/-1}
.panel .color-item{display:grid;grid-template-columns:24px minmax(0,1fr) minmax(0,1fr) 20px;gap:5px;align-items:center}
.panel .color-item input{padding:2px 3px;min-width:0}
.panel .color-item input[type="color"]{width:100%;min-width:0;padding:0;height:20px}
.panel .section>.inline{grid-column:1/-1}
.panel #vlBox{overflow:hidden;overflow-wrap:anywhere;font-size:10.5px}
@media (max-width:640px){
  .panel{left:16px;bottom:60px}
  .leary2-toolbar{padding:0 8px 0 16px}
  .leary2-status{display:none}
}
</style>
<style>/* share-icon 2026-11-17 (B) */
.share-icon-btn{width:32px!important;height:32px!important;min-width:32px!important;padding:0!important;border:0!important;border-radius:50%!important;background:transparent!important;box-shadow:none!important;backdrop-filter:none!important;-webkit-backdrop-filter:none!important;display:inline-flex!important;align-items:center;justify-content:center;cursor:pointer;color:inherit;flex:none!important;transition:background .18s,transform .18s}
.share-icon-btn svg{width:20px;height:20px;display:block}
.share-icon-btn .ic-check{display:none}
.share-icon-btn.copied .ic-share{display:none}
.share-icon-btn.copied .ic-check{display:block}
.share-icon-btn:hover{background:rgba(255,255,255,.12)!important;transform:translateY(-1px)}
.share-icon-btn:focus-visible{outline:2px solid currentColor;outline-offset:3px}
</style>

<body>
<div id="app">
  <aside class="panel">
    <div class="panel-head">
      <div class="eyebrow">Leary</div>
    </div>

    <div class="toolbar">
      <button class="btn primary" id="btnExportPng">PNG保存（全体）</button>
      <button class="btn" id="btnExportViewPng">PNG保存（表示中そのまま）</button>
      <button class="btn" id="btnExportSvg">SVG保存</button>
      <button class="btn" id="btnRandomize">Seed変更</button>
      <button class="btn toolbar-wide" id="btnResetView">表示リセット</button>
      <button class="btn" id="btnExportSettings">設定JSON保存</button>
      <button class="btn" id="btnImportSettings">設定JSON読込</button>
      <input type="file" id="settingsFile" accept="application/json,.json" hidden />
    </div>

    <div class="section">
      <h3>状態</h3>
      <div class="metrics">
        <div class="metric">
          <div class="metric-label">描画</div>
          <div class="metric-value" id="statusRender">待機</div>
        </div>
        <div class="metric">
          <div class="metric-label">進行</div>
          <div class="metric-value mono" id="statusProgress">0%</div>
        </div>
        <div class="metric">
          <div class="metric-label">線数</div>
          <div class="metric-value mono" id="statusCount">0</div>
        </div>
        <div class="metric">
          <div class="metric-label">ソース点</div>
          <div class="metric-value mono" id="statusSwirls">0</div>
        </div>
        <div class="metric" style="grid-column:1 / -1">
          <div class="metric-label">Seed（直接入力で再現可）</div>
          <input class="metric-value mono" id="seedInput" type="number" min="0" max="2147483647" step="1" style="width:100%;background:transparent;border:none;color:var(--text);padding:0" />
          <div class="metric-value mono" id="statusSeed" hidden>0</div>
        </div>
      </div>
    </div>

    <div class="section">
      <h3>プリセット</h3>
      <div class="grid-preset">
        <button class="btn small" data-preset="monoBlack">白 / 黒</button>
        <button class="btn small" data-preset="monoWhite">黒 / 白</button>
        <button class="btn small" data-preset="denseInk">高密度</button>
        <button class="btn small" data-preset="silverFog">薄層</button>
        <button class="btn small" data-preset="ghostField">霧面</button>
        <button class="btn small" data-preset="noirFlow">輪郭</button>
        <button class="btn small" data-preset="paperVeil">余白</button>
        <button class="btn small" data-preset="midnightMass">重層</button>
      </div>
    </div>

    <div class="section">
      <h3>出力</h3>
      <div class="grid-2">
        <div class="row"><label>幅</label><input id="width" type="number" min="64" step="1" /></div>
        <div class="row"><label>高さ</label><input id="height" type="number" min="64" step="1" /></div>
      </div>
      <div class="row"><label>PNG倍率</label><input id="exportScale" type="number" min="1" max="8" step="1" /></div>
      <div class="row"><label>プレビュー解像度</label><input id="previewScale" type="number" min="0.25" max="1" step="0.05" /></div>
      <div class="row"><label>保存品質</label><select id="exportQuality"><option value="standard">standard</option><option value="high">high</option><option value="ultra">ultra</option></select></div>
      <div class="row"><label>内部SSAA</label><input id="exportSupersample" type="number" min="1" max="2" step="0.25" /></div>
      <div class="row"><label>保存分割描画</label><input id="exportBatchLines" type="number" min="10" max="4000" step="10" /></div>
      <div class="switches">
        <label><input id="exportAutoProtect" type="checkbox" checked /> 自動保護</label>
        <label><input id="bgTransparent" type="checkbox" /> 背景透過</label>
      </div>
      <div class="section-note">
        <div class="hint" id="exportEstimate">推定: 計算中</div>
        <div class="hint">保存前に推定負荷を表示し、危険域では品質や内部倍率を自動で安全側へ落とします。</div>
      </div>
    </div>

    <div class="section">
      <h3>色</h3>
      <div class="row"><label>背景色</label><input id="bgColor" type="color" /></div>
      <div class="row"><label>色モード</label><select id="colorMode"><option value="sequence">順番</option><option value="linear">横位置グラデーション</option><option value="weighted">重みランダム</option></select></div>
      <div class="colors" id="colors"></div>
      <div class="hint" style="margin-bottom:8px">各色の数値: 左＝出現の重み（weightedモード時の選ばれやすさ）／ 右＝太さ係数</div>
      <div class="inline">
        <button class="btn small" id="btnAddColor">色追加</button>
        <button class="btn small" id="btnRemoveColor">色削除</button>
      </div>
    </div>

    <div class="section">
      <h3>線</h3>
      <div class="row"><label>lineCount</label><input id="lineCount" type="number" min="1" max="30000" step="1" /></div>
      <div class="row"><label>lineWidthMin</label><input id="lineWidthMin" type="number" min="0.1" max="50" step="0.1" /></div>
      <div class="row"><label>lineWidthMax</label><input id="lineWidthMax" type="number" min="0.1" max="50" step="0.1" /></div>
      <div class="row"><label>opacity</label><input id="opacity" type="number" min="0" max="1" step="0.01" /></div>
      <div class="row"><label>flowCoverage</label><input id="flowCoverage" type="number" min="0.1" max="20" step="0.1" /></div>
      <div class="row"><label>generationWidth</label><input id="generationWidth" type="number" min="0.1" max="20" step="0.1" /></div>
      <div class="row"><label>segmentResolution</label><input id="segmentResolution" type="number" min="0.1" max="20" step="0.1" /></div>
      <div class="row"><label>batchLines</label><input id="batchLines" type="number" min="10" max="4000" step="10" /></div>
    </div>

    <div class="section">
      <h3>変形</h3>
      <div class="row"><label>swirlType</label><select id="swirlType"><option value="vortex">vortex</option><option value="attract">attract</option><option value="repel">repel</option></select></div>
      <div class="row"><label>swirlRadius</label><input id="swirlRadius" type="number" min="1" max="10000" step="1" /></div>
      <div class="row"><label>swirlStrength</label><input id="swirlStrength" type="number" min="0" max="10" step="0.01" /></div>
      <div class="row"><label>curveTension</label><input id="curveTension" type="number" min="0" max="10" step="0.01" /></div>
      <div class="row"><label>turbulence</label><input id="turbulence" type="number" min="0" max="200" step="0.1" /></div>
      <div class="row"><label>turbulenceFreq</label><input id="turbulenceFreq" type="number" min="0.0001" max="1" step="0.0001" /></div>
      <div class="row"><label>verticalStretch</label><input id="verticalStretch" type="number" min="0.1" max="10" step="0.01" /></div>
      <div class="row"><label>renderShape</label><select id="renderShape"><option value="rect">rect</option><option value="circle">circle</option></select></div>
    </div>

    <div class="section">
      <h3>ソース点</h3>
      <div class="inline">
        <button class="btn small" id="btnAddSwirl">追加</button>
        <button class="btn small" id="btnRemoveSwirl">削除</button>
        <button class="btn small" id="btnResetSwirls">再配置</button>
      </div>
      <div class="section-note">
        <div class="hint">ソース点をドラッグして位置調整。ホイールで拡大縮小、ドラッグでパン。</div>
      </div>
    </div>

    <div class="footer-space"></div>
  </aside>

  <main class="viewer checker" id="viewer">
    <div class="viewer-top">
      <div class="pill"><span>ホイール: ズーム</span><span>ドラッグ: パン</span><span>キー: パン／ズーム（Canvasにフォーカス）</span></div>
      <div class="pill"><span id="viewInfo">zoom 1.00</span></div>
    </div>
    <div class="canvas-wrap">
      <div class="stage" id="stage">
        <canvas id="canvas" width="1920" height="1080" tabindex="0" aria-label="プレビューキャンバス（矢印キーでパン、+と-でズーム、0で表示リセット）"></canvas>
        <div id="overlay"></div>
      </div>
    </div>

<style id="leary-perfect-style">
/* Leary perfect-2026-11-17 (additive): palette / help / badge / mobile toolbar / a11y */
#lpPalette, #lpHelp { position: fixed; inset: 0; z-index: 100001; display: none; align-items: flex-start; justify-content: center; background: rgba(0,0,0,.55); padding: 12vh 16px 16px; box-sizing: border-box; }
.lp-k-box, .lp-h-box { width: min(560px, 94vw); max-height: 76vh; overflow: auto; background: #111; border: 1px solid rgba(255,255,255,.22); border-radius: 12px; padding: 14px; box-sizing: border-box; color: #eee; }
#lpKInput { width: 100%; box-sizing: border-box; background: #1d1d1d; color: #fff; border: 0; border-radius: 8px; padding: 11px 12px; font-size: 14px; margin-bottom: 8px; }
.lp-k-item { display: flex; justify-content: space-between; gap: 12px; padding: 8px 10px; border-radius: 8px; font-size: 13px; cursor: pointer; }
.lp-k-item.sel, .lp-k-item:hover { background: rgba(255,255,255,.10); }
.lp-k-hint { color: rgba(255,255,255,.45); font-size: 11px; flex: 0 0 auto; }
.lp-h-head { display: flex; justify-content: space-between; align-items: center; font-size: 14px; letter-spacing: .06em; margin-bottom: 8px; }
.lp-h-box h4 { margin: 16px 0 6px; font-size: 12px; letter-spacing: .1em; color: rgba(255,255,255,.75); }
.lp-t { width: 100%; border-collapse: collapse; font-size: 12.5px; }
.lp-t td { border-bottom: 1px solid rgba(255,255,255,.08); padding: 5px 4px; vertical-align: top; }
.lp-t td:first-child { white-space: nowrap; color: #fff; width: 38%; }
.lp-dim { color: rgba(255,255,255,.55); font-size: 12px; }
.leary2-toolbar .btn:focus-visible, #lpKInput:focus-visible, .lp-k-item:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
@media (max-width: 760px) {
  #app { grid-template-rows: 64px minmax(0, 1fr) auto !important; }
  .leary2-toolbar { flex-wrap: wrap; white-space: normal; overflow-x: visible; overflow-y: visible; row-gap: 2px; padding-top: 6px; padding-bottom: 6px; }
  .leary2-toolbar .btn { padding: 6px 8px; }
}
@media (prefers-reduced-motion: reduce) {
  #lpPalette *, #lpHelp *, #lpToast { transition: none !important; animation: none !important; }
}

<script id="studio-x-leary">
/* ═══ Studio Link 専用機能 for Leary (2026-11-19): BPM パルス渦 ═══
   Studio 接続中だけ、Meikyoshisui の BPM の位相で渦の強さ (swirlStrength)
   を脈動させる。Leary に連続回転はないため、提案の「シンクロ回転」は
   生きたパラメータである渦の脈動として実現した。本体コード・保存キーには
   触らない。自分の Link が OFF の間は無効。切断時は接続前の値を復元する。 */
(function(){
'use strict';
var LSKEY='leary.varelserLink.v1', FRESH_MS=6000;
var lastSeen=0, linked=false, busMeikyo=null;
var base=null, enabled=true, depthMul=1.0, phase=0, lastTick=Date.now(), pauseUntil=0, writing=false;
function ownOn(){ try{ return localStorage.getItem(LSKEY)==='1'; }catch(e){ return false; } }
var ch=null;
try{ ch=new BroadcastChannel('varelser-link-v1'); }catch(e){}
if(ch)ch.addEventListener('message',function(ev){
  var m=ev.data||{};
  if(m.app!=='studio')return;
  if(m.type==='presence'){ lastSeen=Date.now(); }
  else if(m.type==='session-bus'){ lastSeen=Date.now(); busMeikyo=m.meikyo||null; }
  else if(m.type==='studio-bye'){ lastSeen=0; busMeikyo=null; }
  else if(m.type==='sync-config'||m.type==='console'){ pauseUntil=Date.now()+1500; }
});
var st=document.createElement('style');
st.textContent='#sxBadge-leary{position:fixed;top:10px;right:10px;z-index:9990;display:none;padding:4px 10px;border:1px solid #e8e8ec;border-radius:999px;background:rgba(10,10,12,.85);color:#e8e8ec;font-size:11.5px;letter-spacing:.14em}'
 +'#sxPanel-leary{position:fixed;right:10px;bottom:10px;z-index:9990;display:none;width:250px;padding:10px 12px;border:1px solid #3a3a40;border-radius:10px;background:rgba(14,14,17,.93);color:#e8e8ec;font-size:12.5px;line-height:1.6}'
 +'#sxPanel-leary .t{letter-spacing:.08em}#sxPanel-leary .s{opacity:.85;font-size:11.5px}'
 +'#sxPanel-leary label{display:flex;align-items:center;gap:6px;margin-top:6px;cursor:pointer}'
 +'#sxPanel-leary select{background:#1c1c20;color:#e8e8ec;border:1px solid #3a3a40;border-radius:6px;font-size:12px;padding:2px 4px}';
document.head.appendChild(st);
var badge=document.createElement('div'); badge.id='sxBadge-leary'; badge.textContent='STUDIO LINKED';
var panel=document.createElement('div'); panel.id='sxPanel-leary';
panel.innerHTML='<div class="t">STUDIO PULSE — BPMパルス渦</div><div class="s" id="sxStatus-leary">Meikyoshisui の BPM を待っています</div>'
 +'<label><input type="checkbox" id="sxEnable-leary" checked> パルス有効</label>'
 +'<label>深さ <select id="sxDepth-leary"><option value="0.6">弱</option><option value="1" selected>中</option><option value="1.5">強</option></select></label>';
document.body.appendChild(badge); document.body.appendChild(panel);
panel.querySelector('#sxEnable-leary').addEventListener('change',function(){ enabled=this.checked; if(!enabled)restore(); });
panel.querySelector('#sxDepth-leary').addEventListener('change',function(){ depthMul=parseFloat(this.value)||1; });
function el(){ return document.getElementById('swirlStrength'); }
function setVal(v){ var e=el(); if(!e)return; writing=true; e.value=v; e.dispatchEvent(new Event('input',{bubbles:true})); e.dispatchEvent(new Event('change',{bubbles:true})); writing=false; }
document.addEventListener('input',function(ev){ if(ev.target===el()&&!writing)pauseUntil=Date.now()+3000; },true);
function restore(){ if(base==null)return; setVal(base); base=null; }
setInterval(function(){
  var t=Date.now(), dt=(t-lastTick)/1000; lastTick=t;
  var now=linked;
  linked=ownOn()&&(t-lastSeen<FRESH_MS);
  if(linked!==now){
    badge.style.display=linked?'block':'none';
    panel.style.display=linked?'block':'none';
    if(linked){ var e=el(); base=e?parseFloat(e.value):null; }
    else restore();
  }
  if(!linked||!enabled||base==null)return;
  var bpm=busMeikyo&&typeof busMeikyo.bpm==='number'?busMeikyo.bpm:null;
  var s=document.getElementById('sxStatus-leary');
  if(bpm==null){ if(s)s.textContent='Meikyoshisui の BPM を待っています'; return; }
  phase+=2*Math.PI*(bpm/60)*dt;
  var pulse=Math.pow(Math.max(0,Math.sin(phase)),2);
  if(t<pauseUntil)return;
  var target=base*(1+0.6*depthMul*pulse);
  var e2=el(); if(!e2)return;
  if(Math.abs(target-parseFloat(e2.value))>0.01)setVal(target.toFixed(3));
  if(s)s.textContent='BPM '+bpm+' に同期中 — 渦 '+target.toFixed(2)+' (基準 '+base.toFixed(2)+')';
},200);
window.__studioPulseLeary={version:'PhaseJ-1',
  get linked(){return linked;}, get base(){return base;}, get phase(){return phase;},
  get current(){var e=el(); return e?parseFloat(e.value):null;}};
})();

</script>
<script id="studio-fluid-leary">
/* ═══ Studio Link 専用機能 for Leary 第2弾 v2 (2026-11-19): STUDIO FLUID ═══
   流体モード (ChromaFlow) × 音連携 + カスタマイズ。
   Studio 接続中だけ、流体エンジン内蔵の音反応機構 (setAudioSampler) へ
   session-bus から合成した帯域データを流し、エンジン自身の変調で流体を
   音に反応させる。Meikyoshisui の拍ごとに衝撃波/渦を撃ち込み、Noise の
   音量に応じて染料の雨 (splat) を降らせる。
   カスタマイズ: 帯域ごとの効き倍率、拍パルス、雨の量、発射パターン、
   間引き、発射位置、雨の色、接続時の自動切替、プリセット3種。
   設定は localStorage 'leary.studioFluid.v1' に保存される。
   本体コード・既存の保存キーには触らない。自分の Link が OFF の間は無効。 */
(function(){
'use strict';
var LSKEY='leary.varelserLink.v1', SETKEY='leary.studioFluid.v1', FRESH_MS=6000;
var DEF={gainOverall:1,gainBass:1,gainTreble:1,beatPulse:1,rain:1,pattern:'alt',beatDiv:1,posMode:'drift',rainColor:'engine',autoFluid:true};
var PRESETS={
  calm:{gainOverall:0.6,gainBass:0.7,gainTreble:0.6,beatPulse:0.5,rain:0.4,pattern:'alt',beatDiv:2,posMode:'drift',rainColor:'engine'},
  standard:{gainOverall:1,gainBass:1,gainTreble:1,beatPulse:1,rain:1,pattern:'alt',beatDiv:1,posMode:'drift',rainColor:'engine'},
  wild:{gainOverall:1.5,gainBass:1.8,gainTreble:1.4,beatPulse:1.8,rain:1.8,pattern:'random',beatDiv:1,posMode:'circle',rainColor:'engine'}
};
var S={};
(function load(){ var raw=null; try{ raw=localStorage.getItem(SETKEY); }catch(e){}
  for(var k in DEF)S[k]=DEF[k];
  if(raw){ try{ var p=JSON.parse(raw); for(var k2 in DEF)if(typeof p[k2]===typeof DEF[k2])S[k2]=p[k2]; }catch(e){} } })();
function save(){ try{ localStorage.setItem(SETKEY,JSON.stringify(S)); }catch(e){} }
var lastSeen=0, linked=false, busNoise=null, busMeikyo=null;
var enabled=true, engaged=false, samplerOn=false, prevUiMode=null, switched=false;
var rmsT=0, rmsSm=0, peakSm=0, phase=0, lastTick=Date.now(), lastBeatAt=0;
var beatCount=0, fireCount=0, shockCount=0, vortexCount=0, splatCount=0, seq=0;
function ownOn(){ try{ return localStorage.getItem(LSKEY)==='1'; }catch(e){ return false; } }
var ch=null;
try{ ch=new BroadcastChannel('varelser-link-v1'); }catch(e){}
if(ch)ch.addEventListener('message',function(ev){
  var m=ev.data||{};
  if(m.app!=='studio')return;
  if(m.type==='presence'){ lastSeen=Date.now(); }
  else if(m.type==='session-bus'){ lastSeen=Date.now(); busNoise=m.noise||null; busMeikyo=m.meikyo||null; }
  else if(m.type==='studio-bye'){ lastSeen=0; busNoise=null; busMeikyo=null; }
});
function L(){ return window.__learyChromaFlow||null; }
function ENG(){ var l=L(); return (l&&l.engine)||null; }
function driftPos(k){ var a=k*2.399963; return [0.5+0.38*Math.cos(a), 0.5+0.38*Math.sin(a)]; }
function firePos(){
  if(S.posMode==='center')return [0.5,0.5];
  if(S.posMode==='circle'){ var a=fireCount*(Math.PI/4); return [0.5+0.3*Math.cos(a), 0.5+0.3*Math.sin(a)]; }
  return driftPos(seq++);
}
function bands(){
  var now=Date.now();
  var bp=(busMeikyo&&busMeikyo.playing)?Math.exp(-(now-lastBeatAt)/180):0;
  if(!engaged)return {bass:0,mid:0,treble:0,overall:0,beatDetected:false};
  return {
    bass:Math.min(1,rmsSm*1.15*S.gainBass+bp*0.5*S.beatPulse),
    mid:Math.min(1,rmsSm*S.gainOverall+bp*0.25*S.beatPulse),
    treble:Math.min(1,peakSm*0.9*S.gainTreble+bp*0.15*S.beatPulse),
    overall:Math.min(1,rmsSm*S.gainOverall),
    beatDetected:(now-lastBeatAt)<130&&(busMeikyo&&busMeikyo.playing)?true:false
  };
}
function engage(){
  var l=L(); if(!l)return false;
  if(S.autoFluid){
    if(prevUiMode===null)prevUiMode=l.uiMode||'leary';
    if(l.uiMode!=='fluid'){ try{ l.setUiMode('fluid'); switched=true; }catch(e){} }
    try{ l.setActive(true); }catch(e){}
  }
  else if(l.uiMode!=='fluid')return false;
  var eng=ENG(); if(!eng)return false;
  if(!samplerOn){ try{ eng.setAudioSampler(function(){ return bands(); }); samplerOn=true; }catch(e){} }
  engaged=true;
  return true;
}
function release(){
  var eng=ENG();
  if(eng&&samplerOn){ try{ eng.setAudioSampler(undefined); }catch(e){} samplerOn=false; }
  engaged=false;
  var l=L();
  if(l&&switched&&l.uiMode==='fluid'){ try{ l.setUiMode(prevUiMode||'leary'); }catch(e){} }
  switched=false; prevUiMode=null;
}
/* ── UI ── */
var st=document.createElement('style');
st.textContent='#sfPanel-leary{position:fixed;left:10px;bottom:10px;z-index:9990;display:none;width:264px;max-height:78vh;overflow-y:auto;padding:10px 12px;border:1px solid #3a3a40;border-radius:10px;background:rgba(14,14,17,.94);color:#e8e8ec;font-size:12.5px;line-height:1.55}'
 +'#sfPanel-leary .t{letter-spacing:.08em}#sfPanel-leary .s{opacity:.85;font-size:11.5px}'
 +'#sfPanel-leary .row{display:flex;align-items:center;gap:6px;margin-top:5px}'
 +'#sfPanel-leary .row label{flex:0 0 64px;font-size:11.5px;opacity:.9}'
 +'#sfPanel-leary .row output{flex:0 0 30px;text-align:right;font-size:11.5px}'
 +'#sfPanel-leary input[type=range]{flex:1;accent-color:#e8e8ec;height:14px}'
 +'#sfPanel-leary select{background:#1c1c20;color:#e8e8ec;border:1px solid #3a3a40;border-radius:6px;font-size:12px;padding:2px 4px;flex:1}'
 +'#sfPanel-leary .presets{display:flex;gap:6px;margin-top:8px}'

reflect();
/* ── 駆動 ── */
setInterval(function(){
  var t=Date.now(), dt=Math.min(0.1,(t-lastTick)/1000); lastTick=t;
  var now=linked;
  linked=ownOn()&&(t-lastSeen<FRESH_MS);
  if(linked!==now)panel.style.display=linked?'block':'none';
  if(!linked){ if(engaged)release(); rmsT=0; }
  rmsT=(linked&&busNoise&&typeof busNoise.rms==='number')?busNoise.rms:0;
  rmsSm+=(rmsT-rmsSm)*0.12;
  var pk=(linked&&busNoise&&typeof busNoise.peak==='number')?busNoise.peak:0;
  peakSm+=(pk-peakSm)*(pk>peakSm?0.5:0.06);
  if(linked&&enabled&&!engaged)engage();
  if(!engaged){ if(linked){ var s0=document.getElementById('sfStatus-leary'); if(s0)s0.textContent=S.autoFluid?'流体エンジン待機中':'流体モードで開くと連携します'; } return; }
  var eng=ENG(); if(!eng){ engaged=false; samplerOn=false; return; }
  var bpm=busMeikyo&&typeof busMeikyo.bpm==='number'?busMeikyo.bpm:null;
  if(bpm&&busMeikyo.playing){
    var prev=phase;
    phase+=2*Math.PI*(bpm/60)*dt;
    if(Math.floor(phase/(2*Math.PI))>Math.floor(prev/(2*Math.PI))){
      lastBeatAt=t; beatCount++;
      if(beatCount%S.beatDiv===0){
        fireCount++;
        var p=firePos();
        var kind=S.pattern;
        if(kind==='alt')kind=(fireCount%2===0)?'shock':'vortex';
        else if(kind==='random')kind=(((fireCount*2654435761)>>>8)%2===0)?'shock':'vortex';
        var mag=(0.6+0.4*S.beatPulse);
        try{
          if(kind==='shock'){ eng.triggerShockwave(p[0],p[1],(0.5+peakSm*0.8)*mag); shockCount++; }
          else { eng.splatVortex(p[0],p[1],(fireCount%4<2?1:-1)*(0.7+peakSm*0.6)*mag); vortexCount++; }
        }catch(e){}
      }
    }
  }
  if(rmsSm>0.15&&S.rain>0){
    var prob=(rmsSm-0.15)*0.85*S.rain;
    var r=((seq*2654435761)%1000)/1000; seq++;
    if(r<prob){
      var q=driftPos(seq);
      var ang=seq*2.399963+1.3, mag2=400+1600*rmsSm;
      var col=null;
      try{ col=(S.rainColor==='mono')?(function(){ var v=0.55+0.45*rmsSm; return [v,v,v]; })():eng.generateColor(); }catch(e){}
      try{ eng.splat(q[0],q[1],Math.cos(ang)*mag2,Math.sin(ang)*mag2,col); splatCount++; }catch(e){}
    }
  }
  var s=document.getElementById('sfStatus-leary');
  if(s)s.textContent='帯域 overall '+Math.min(1,rmsSm*S.gainOverall).toFixed(2)+' / 拍 '+beatCount+' / 発射 '+fireCount+' / splat '+splatCount+(bpm?(' / BPM '+bpm):'');
},33);
window.__studioFluidLeary={version:'PhaseL-2',
  get linked(){return linked;}, get engaged(){return engaged;},
  get beats(){return beatCount;}, get fires(){return fireCount;},
  get shocks(){return shockCount;}, get vortices(){return vortexCount;},
  get splats(){return splatCount;},
  bands:function(){ return bands(); },
  settings:function(){ var o={}; for(var k in S)o[k]=S[k]; return o; },
  applyPreset:applyPreset,
  get engineReady(){ return !!ENG(); }};
})();

/* ── パネル ── */
var st=document.createElement('style');
st.textContent='#fdPanel-leary{position:fixed;right:10px;bottom:118px;z-index:9989;width:284px;max-height:72vh;overflow-y:auto;padding:10px 12px;border:1px solid #3a3a40;border-radius:10px;background:rgba(14,14,17,.94);color:#e8e8ec;font-size:12.5px;line-height:1.55}'
 +'#fdPanel-leary .t{letter-spacing:.08em}#fdPanel-leary .sec{margin-top:9px;border-top:1px solid #2c2c31;padding-top:7px}'

panel.innerHTML='<div class="t">FREEDOM CONSOLE — 自由化</div>'
 +'<div class="sec"><b>コンソール（スライダー）</b>'

document.body.appendChild(panel);
/* ── M1/M4: ピン留めスライダー ── */

function sliderMax(p){ return (S.extRange&&p.extMax)?p.extMax:p.max; }

function snapshot(){ var o={};

var morphTimer=null;

}
panel.querySelector('#fdPresetSave').addEventListener('click',function(){
  var name=(panel.querySelector('#fdPresetName').value||'').trim()||('プリセット'+(Object.keys(S.presets).length+1));
  S.presets[name]=snapshot(); save(); buildPresetList(); });
/* ── M3: Studio連携 追加ターゲット ── */
var lastSeen=0, linked=false, busMeikyo=null;
var ch=null; try{ ch=new BroadcastChannel('varelser-link-v1'); }catch(e){}
if(ch)ch.addEventListener('message',function(ev){ var m=ev.data||{}; if(m.app!=='studio')return;

  else if(m.type==='session-bus'){ lastSeen=Date.now(); busMeikyo=m.meikyo||null; }

function ownOn(){ try{ return localStorage.getItem(LSKEY)==='1'; }catch(e){ return false; } }
var m3Base={}, m3HoldUntil=0, m3Phase=0, m3Last=Date.now(), m3Active=false;
['turbulence','flowCoverage','lineCount'].forEach(function(id){ var e=el(id); if(!e)return;
  e.addEventListener('input',function(){ if(writing)return; m3HoldUntil=Date.now()+3000;
    var v=getNum(id); if(v!==null)m3Base[id]=v; }); });
function waveSmooth(ph){ var s=Math.sin(ph); return s*s; }
function waveSharp(ph){ var s=Math.sin(ph); return Math.pow(Math.abs(s),6); }
function waveStep(ph){ return (ph%(2*Math.PI))<Math.PI?1:0.15; }
function wave(ph){ return S.m3.wave==='sharp'?waveSharp(ph):(S.m3.wave==='step'?waveStep(ph):waveSmooth(ph)); }
var m3StateEl=panel.querySelector('#fdM3State');
setInterval(function(){
  var t=Date.now(), dt=Math.min(0.1,(t-m3Last)/1000); m3Last=t;
  linked=ownOn()&&(t-lastSeen<FRESH_MS);
  var want=linked&&S.m3.enabled&&(busMeikyo&&busMeikyo.playing);
  if(want&&!m3Active){ ['turbulence','flowCoverage','lineCount'].forEach(function(id){ var v=getNum(id); if(v!==null)m3Base[id]=v; }); m3Active=true; }
  if(!want&&m3Active){ ['turbulence','flowCoverage','lineCount'].forEach(function(id){ if(S.m3.targets[id]&&m3Base[id]!==undefined)setVal(id,m3Base[id]); }); m3Active=false; }
  if(m3Active&&busMeikyo&&typeof busMeikyo.bpm==='number'){
    m3Phase+=2*Math.PI*(busMeikyo.bpm/60)*dt;
    var w=wave(m3Phase), d=S.m3.depth;
    if(t>=m3HoldUntil){
      if(S.m3.targets.turbulence&&m3Base.turbulence!==undefined)setVal('turbulence',Math.min(2000,m3Base.turbulence*(1+0.9*d*w)));
      if(S.m3.targets.flowCoverage&&m3Base.flowCoverage!==undefined)setVal('flowCoverage',Math.max(0.1,m3Base.flowCoverage*(1+0.9*d*w)));
      if(S.m3.targets.lineCount&&m3Base.lineCount!==undefined)setVal('lineCount',Math.max(1,Math.round(m3Base.lineCount*(1+0.5*d*w))));
    }
    m3StateEl.textContent='連携中 BPM '+busMeikyo.bpm+' / 波 '+w.toFixed(2);
  } else m3StateEl.textContent=linked?'接続中（再生待ち）':'未接続';
},120);
var m3e=panel.querySelector('#fdM3Enable'); m3e.checked=!!S.m3.enabled;
m3e.addEventListener('change',function(){ S.m3.enabled=this.checked; save(); });
[['fdM3Turb','turbulence'],['fdM3Flow','flowCoverage'],['fdM3Line','lineCount']].forEach(function(pair){
  var c=panel.querySelector('#'+pair[0]); c.checked=!!S.m3.targets[pair[1]];
  c.addEventListener('change',function(){ S.m3.targets[pair[1]]=this.checked; save(); }); });
var m3w=panel.querySelector('#fdM3Wave'); m3w.value=S.m3.wave;
m3w.addEventListener('change',function(){ S.m3.wave=this.value; save(); });
var m3d=panel.querySelector('#fdM3Depth'), m3dv=panel.querySelector('#fdM3DepthV');
m3d.value=Math.round(S.m3.depth*100); m3dv.textContent=S.m3.depth.toFixed(2);
m3d.addEventListener('input',function(){ S.m3.depth=parseInt(this.value,10)/100; m3dv.textContent=S.m3.depth.toFixed(2); save(); });
/* ── M4: ショートカット ── */
function clickByText(txt){ var bs=document.querySelectorAll('button');
  for(var i=0;i<bs.length;i++){ if(bs[i].textContent.trim()===txt&&!panel.contains(bs[i])){ bs[i].click(); return true; } } return false; }
document.addEventListener('keydown',function(ev){
  var t=ev.target; if(!t)return;
  var tag=(t.tagName||'').toLowerCase();
  if(tag==='input'||tag==='textarea'||tag==='select'||t.isContentEditable)return;
  if(ev.metaKey||ev.ctrlKey||ev.altKey)return;
  var k=ev.key.toLowerCase();
  if(k==='r')clickByText('ランダム設定');
  else if(k==='m')clickByText('微変異');
  else if(k==='u')clickByText('元に戻す');
  else if(k==='f')panel.style.display=(panel.style.display==='none')?'block':'none';
  else if(/^[1-9]$/.test(k)){ var names=Object.keys(S.presets); var nm=names[parseInt(k,10)-1];
    if(nm){ cancelMorph(); applySnap(S.presets[nm]); } }
});
buildPins(); buildPresetList();
/* ── 設定の書き出し/読み込み (Phase P) ── */
function exportData(){ return JSON.stringify({app:'varelser-freedom-settings',target:'leary',version:'PhaseP-2',settings:S},null,1); }
function importData(str){ try{ var o=JSON.parse(str);
  if(!o||o.target!=='leary'||!o.settings||typeof o.settings!=='object')return false;
  if(typeof o.settings.extRange==='boolean')S.extRange=o.settings.extRange;
  if(Array.isArray(o.settings.pins))S.pins=o.settings.pins;
  if(o.settings.presets&&typeof o.settings.presets==='object')S.presets=o.settings.presets;
  if(o.settings.m3&&typeof o.settings.m3==='object')S.m3=o.settings.m3;
  save(); setTimeout(function(){ location.reload(); },250); return true;
 }catch(e){ return false; } }
panel.querySelector('#fdExport').addEventListener('click',function(){
  var blob=new Blob([exportData()],{type:'application/json'});
  var a=document.createElement('a'); a.href=URL.createObjectURL(blob);
  a.download='leary-freedom-settings.json'; document.body.appendChild(a); a.click();
  setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); },400); });
panel.querySelector('#fdImport').addEventListener('click',function(){ panel.querySelector('#fdImportFile').click(); });
panel.querySelector('#fdImportFile').addEventListener('change',function(){ var f=this.files&&this.files[0]; if(!f)return;
  var rd=new FileReader();
  rd.onload=function(){ var ok=importData(String(rd.result||''));
    if(!ok)alert('読み込めませんでした（Leary の設定ファイルではありません）'); };
  rd.readAsText(f); this.value=''; });
window.__studioFreedomLeary={version:'PhaseP-2',
  exportData:exportData, importData:importData,
  settings:function(){ return JSON.parse(JSON.stringify(S)); },
  savePreset:function(name){ S.presets[name]=snapshot(); save(); buildPresetList(); },
  applyPreset:function(name){ cancelMorph(); applySnap(S.presets[name]); },
  morphTo:function(name,sec){ morphTo(name,sec); },
  get morphing(){ return !!morphTimer; },
  get m3Active(){ return m3Active; },
  setVal:setVal, getNum:getNum};
})();

</script>
<script id="studio-dock-leary">
/* Varelser Studio — Side Dock (Phase O)
   既存の追加パネル (Studio Link / STUDIO FLUID / FREEDOM CONSOLE) を
   右端の縦タブ・レールに集約する。パネルの中身・id・保存キーには触らず、
   DOM の置き場所と見せ方だけを引き受ける。
   Phase Q: ラップを Popover (manual) 化してトップレイヤー表示にし、
   ページ遷移の View Transitions を opt-in する。未対応環境では従来動作。 */
(function(){
'use strict';
var CFG = {"app": "leary", "tabs": [{"key": "link", "label": "連携", "panel": "sxPanel-leary", "badge": "sxBadge-leary", "api": "__studioPulseLeary"}, {"key": "fluid", "label": "流体", "panel": "sfPanel-leary", "badge": null, "api": "__studioFluidLeary"}, {"key": "free", "label": "自由化", "panel": "fdPanel-leary", "badge": null, "api": "__studioFreedomLeary"}]};
var LSKEY = CFG.app + '.studioDock.v1';
var state = { open: null };
try { var raw = localStorage.getItem(LSKEY); if (raw) { var p = JSON.parse(raw); if (p && typeof p.open === 'string') state.open = p.open; } } catch (e) {}
function save(){ try { localStorage.setItem(LSKEY, JSON.stringify({ open: state.open })); } catch (e) {} }

var css = ''
+ '#sdockRail{position:fixed;right:0;top:50%;transform:translateY(-50%);z-index:99997;display:flex;flex-direction:column;gap:6px;font-family:inherit;}'
+ '.sdock-tab{writing-mode:vertical-rl;letter-spacing:.14em;font-size:11.5px;padding:12px 6px;background:rgba(14,14,17,.93);color:#d7d7db;border:1px solid #3a3a40;border-right:none;border-radius:9px 0 0 9px;cursor:pointer;user-select:none;display:flex;align-items:center;gap:7px;}'
+ '.sdock-tab:hover{color:#fff;border-color:#6a6a72;}'
+ '.sdock-tab.active{background:#e9e9ec;color:#101013;border-color:#e9e9ec;font-weight:700;}'
+ '.sdock-tab .sdot{width:7px;height:7px;border-radius:50%;background:#8a8a91;flex:none;}'
+ '.sdock-tab .sdot.on{background:#f2f2f4;box-shadow:0 0 0 2px rgba(255,255,255,.22);}'
+ '.sdock-tab.active .sdot{background:#8a8a91;} .sdock-tab.active .sdot.on{background:#101013;box-shadow:none;}'
+ '.sdock-wrap{position:fixed;right:31px;top:50%;transform:translateY(-50%) translateX(118%);transition:transform .3s ease;z-index:99996;pointer-events:none;}'
+ '.sdock-wrap.open{transform:translateY(-50%) translateX(0);pointer-events:auto;}'
+ '.sdock-wrap>*{max-width:calc(100vw - 52px);}'
+ '.sdock-wrap[popover]{left:auto;bottom:auto;width:auto;height:auto;margin:0;padding:0;border:none;background:transparent;overflow:visible;color:inherit;}'
+ '@starting-style{.sdock-wrap[popover]:popover-open{transform:translateY(-50%) translateX(118%);}}'
+ '@media (max-width:640px){.sdock-tab{font-size:11px;padding:10px 5px;}}';
var POP = ('showPopover' in HTMLElement.prototype);
var VT_CSS = '@view-transition{navigation:auto}::view-transition-old(root),::view-transition-new(root){animation-duration:.28s}';

var rail = null, tabs = {}, wraps = {};
function ensureChrome(){
  if (document.getElementById('sdockStyle')) return;
  var st = document.createElement('style'); st.id = 'sdockStyle'; st.textContent = css; document.head.appendChild(st);
  var vt = document.createElement('style'); vt.id = 'sdockVt'; vt.textContent = VT_CSS; document.head.appendChild(vt);
  rail = document.createElement('div'); rail.id = 'sdockRail'; rail.setAttribute('role', 'tablist'); rail.setAttribute('aria-label', 'Studio panels');
  document.body.appendChild(rail);
  CFG.tabs.forEach(function(t){
    var b = document.createElement('button'); b.type = 'button'; b.className = 'sdock-tab'; b.id = 'sdockTab-' + t.key;
    b.setAttribute('role', 'tab'); b.setAttribute('aria-expanded', 'false');
    b.innerHTML = '<span class="sdot"></span>' + t.label;
    b.style.display = 'none';
    b.addEventListener('click', function(){ toggle(t.key); });
    rail.appendChild(b); tabs[t.key] = b;
  });
}
function adopt(t){
  var panel = document.getElementById(t.panel);
  if (!panel || panel.dataset.docked) return !!panel;
  ensureChrome();
  var wrap = document.createElement('div'); wrap.className = 'sdock-wrap'; wrap.id = 'sdockWrap-' + t.key;
  if (POP) wrap.setAttribute('popover', 'manual');
  document.body.appendChild(wrap);
  wrap.appendChild(panel);
  panel.dataset.docked = '1';
  ['position','left','right','top','bottom','margin','float'].forEach(function(prop){
    panel.style.setProperty(prop, prop === 'position' ? 'static' : 'auto', 'important');
  });
  panel.style.setProperty('margin', '0', 'important');
  wraps[t.key] = wrap;
  if (t.badge) { var bg = document.getElementById(t.badge); if (bg) bg.style.setProperty('display', 'none', 'important'); }
  return true;
}
function panelAvail(t){
  var panel = document.getElementById(t.panel);
  if (!panel) return false;
  return getComputedStyle(panel).display !== 'none';
}
function linkedNow(t){
  try { var a = t.api && window[t.api]; return !!(a && a.linked); } catch (e) { return false; }
}
var hideTimers = {};
function applyOpen(){
  CFG.tabs.forEach(function(t){
    var w = wraps[t.key], b = tabs[t.key];
    var open = (state.open === t.key);
    if (w) {
      w.classList.toggle('open', open);
      if (POP) {
        var isOpen = false; try { isOpen = w.matches(':popover-open'); } catch (e) {}
        if (open) {
          if (hideTimers[t.key]) { clearTimeout(hideTimers[t.key]); hideTimers[t.key] = null; }
          if (!isOpen) { try { w.showPopover(); } catch (e) {} }
        } else if (isOpen && !hideTimers[t.key]) {
          hideTimers[t.key] = setTimeout(function(){
            hideTimers[t.key] = null;
            if (state.open !== t.key) { try { w.hidePopover(); } catch (e) {} }
          }, 330);
        }
      }
    }
    if (b) { b.classList.toggle('active', open); b.setAttribute('aria-expanded', open ? 'true' : 'false'); }
  });
}
function toggle(key){
  state.open = (state.open === key) ? null : key;
  save(); applyOpen();
}
function tick(){
  ensureChrome();
  var anyAvail = false;
  CFG.tabs.forEach(function(t){
    adopt(t);
    var av = panelAvail(t);
    var b = tabs[t.key];
    if (b) {
      b.style.display = av ? '' : 'none';
      var dot = b.querySelector('.sdot');
      if (dot) dot.classList.toggle('on', linkedNow(t));
    }
    if (t.badge) { var bg = document.getElementById(t.badge); if (bg && bg.style.getPropertyValue('display') !== 'none') bg.style.setProperty('display', 'none', 'important'); }
    if (av) anyAvail = true;
    if (state.open === t.key && !av) { state.open = null; save(); }
  });
  if (rail) rail.style.display = anyAvail ? '' : 'none';
  applyOpen();
}
document.addEventListener('keydown', function(ev){
  if (ev.key === 'Escape' && state.open) { state.open = null; save(); applyOpen(); return; }
  if (ev.altKey && /^[1-9]$/.test(ev.key)) {
    var avail = CFG.tabs.filter(function(t){ return panelAvail(t); });
    var t = avail[parseInt(ev.key, 10) - 1];
    if (t) { ev.preventDefault(); toggle(t.key); }
  }
});
document.addEventListener('pointerdown', function(ev){
  if (!state.open) return;
  var w = wraps[state.open];
  if (w && w.contains(ev.target)) return;
  if (rail && rail.contains(ev.target)) return;
  state.open = null; save(); applyOpen();
}, true);
function boot(){ tick(); setInterval(tick, 700); }
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', function(){ setTimeout(boot, 300); });
else setTimeout(boot, 300);
window.__studioDock = { version: 'PhaseO-3', app: CFG.app, pop: POP, open: function(){ return state.open; }, toggle: toggle };
})();

</script>
</body>
