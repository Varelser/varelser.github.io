<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>B 3層モデル ― 『慈愛体系』</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#fff;color:#111;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif}
.wrap{max-width:1020px;margin:0 auto;padding:20px 16px 40px}h1{font-size:22px;letter-spacing:.1em;text-align:center}
canvas{width:100%;height:auto;display:block}.controls{text-align:center;margin:10px 0}
button{border:1px solid #111;background:#111;color:#fff;border-radius:999px;padding:7px 18px;font-size:14px;cursor:pointer}
.foot{border-top:1px solid rgba(0,0,0,.12);margin-top:12px;padding-top:10px;font-size:12.5px;color:rgba(0,0,0,.55);text-align:center;line-height:1.8}
</style><style>@view-transition{navigation:auto}::view-transition-old(root),::view-transition-new(root){animation-duration:.35s}</style><meta name="theme-color" content="#ffffff"></head><body><div class="wrap"><h1>『慈愛体系』3層モデル</h1>
<canvas id="cv" width="1600" height="900" aria-label="『慈愛体系』3層モデル のアニメーション"></canvas>
<div class="controls"><button id="btn">一時停止</button></div>
<div class="foot">図は原典の要約であり、医学的助言ではありません</div></div>
<script>

const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
let playing=true,t=0,last=performance.now();
if(matchMedia('(prefers-reduced-motion: reduce)').matches){playing=false;document.getElementById('btn').textContent='再生';}
document.getElementById('btn').onclick=e=>{playing=!playing;e.target.textContent=playing?'一時停止':'再生';last=performance.now();};
function smooth(a,b,x){if(x<=a)return 0;if(x>=b)return 1;const f=(x-a)/(b-a);return f*f*(3-2*f);}
function dot(x,y,r,o){ctx.beginPath();ctx.arc(x,y,r,0,6.2832);ctx.fillStyle='rgba(0,0,0,'+o+')';ctx.fill();}
function txt(s,x,y,size,bold,alpha,anchor){ctx.font=(bold?'700 ':'')+size+'px "Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif';ctx.fillStyle='rgba(17,17,17,'+(alpha===undefined?1:alpha)+')';ctx.textAlign=anchor||'center';ctx.fillText(s,x,y);}

const LAYERS=[{name:'物語層',intro:'物語',desc:'「私」という語り。注意・言語・自己意識。DMNと深く関連',band:300,amp:16,freq:2.6,rate:2.2,off:0},
{name:'自動層',intro:'自動反応',desc:'考える前に反応している。本能的反応・習慣・手続き記憶',band:460,amp:26,freq:1.7,rate:1.3,off:2.1},
{name:'からだ層',intro:'からだ',desc:'生体の現在。自律神経・内受容・ホルモン',band:620,amp:38,freq:1.1,rate:0.7,off:4.2}];
const COM={amp:26,freq:1.9,rate:1.0},N=56;
function divg(tt){tt%=20;if(tt<7)return 1;if(tt<12)return 1-smooth(7,12,tt);if(tt<17)return 0;return smooth(17,20,tt);}
function frame(now){const dt=Math.min(.05,(now-last)/1000);last=now;if(playing)t+=dt;
ctx.clearRect(0,0,1600,900);
txt('『慈愛体系』3層モデル',800,92,36);txt('3層＋2つのつまみ',800,128,20,false,.6);
const d=divg(t);
LAYERS.forEach(L=>{txt(L.name,66,L.band-8,26,true,1,'left');txt(L.intro,66,L.band+24,19,false,.6,'left');
for(let i=0;i<N;i++){const x=270+i*(1060/(N-1));
const amp=L.amp*d+COM.amp*(1-d),fr=L.freq*d+COM.freq*(1-d),ph=t*(L.rate*d+COM.rate*(1-d))+L.off*d;
dot(x,L.band+amp*Math.sin(fr*(x-270)/1060*6.2832+ph),5.5,.88);}
txt(L.desc,270,L.band+80,19,false,.66,'left');});
txt('頭ではわかっても心がついていかない ― 層の乖離',800,818,22,true);
requestAnimationFrame(frame);}
requestAnimationFrame(frame);

</script></body></html>
