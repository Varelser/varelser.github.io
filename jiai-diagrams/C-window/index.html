<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>C 可塑性ウィンドウ ― 『慈愛体系』</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#fff;color:#111;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif}
.wrap{max-width:1020px;margin:0 auto;padding:20px 16px 40px}h1{font-size:22px;letter-spacing:.1em;text-align:center}
canvas{width:100%;height:auto;display:block}.controls{text-align:center;margin:10px 0}
button{border:1px solid #111;background:#111;color:#fff;border-radius:999px;padding:7px 18px;font-size:14px;cursor:pointer}
.foot{border-top:1px solid rgba(0,0,0,.12);margin-top:12px;padding-top:10px;font-size:12.5px;color:rgba(0,0,0,.55);text-align:center;line-height:1.8}
</style><style>@view-transition{navigation:auto}::view-transition-old(root),::view-transition-new(root){animation-duration:.35s}</style><meta name="theme-color" content="#ffffff"></head><body><div class="wrap"><h1>『慈愛体系』可塑性ウィンドウと統合</h1>
<canvas id="cv" width="1600" height="900" aria-label="『慈愛体系』可塑性ウィンドウと統合 のアニメーション"></canvas>
<div class="controls"><button id="btn">一時停止</button></div>
<div class="foot">図は原典の要約であり、医学的助言ではありません</div></div>
<script>

const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
let playing=true,t=0,last=performance.now();
if(matchMedia('(prefers-reduced-motion: reduce)').matches){playing=false;document.getElementById('btn').textContent='再生';}
document.getElementById('btn').onclick=e=>{playing=!playing;e.target.textContent=playing?'一時停止':'再生';last=performance.now();};
function smooth(a,b,x){if(x<=a)return 0;if(x>=b)return 1;const f=(x-a)/(b-a);return f*f*(3-2*f);}
function dot(x,y,r,o){ctx.beginPath();ctx.arc(x,y,r,0,6.2832);ctx.fillStyle='rgba(0,0,0,'+o+')';ctx.fill();}
function txt(s,x,y,size,bold,alpha,anchor){ctx.font=(bold?'700 ':'')+size+'px "Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif';ctx.fillStyle='rgba(17,17,17,'+(alpha===undefined?1:alpha)+')';ctx.textAlign=anchor||'center';ctx.fillText(s,x,y);}

const NODES=[{"x": 210, "title": "準備期（体験前）", "detail": "", "dots": [[30.0, 0.0, 5.0, 0.92], [25.98076211353316, 14.999999999999998, 5.0, 0.92], [15.000000000000004, 25.980762113533157, 5.0, 0.92], [1.83697019872103e-15, 30.0, 5.0, 0.92], [-14.999999999999993, 25.98076211353316, 5.0, 0.92], [-25.98076211353316, 14.999999999999998, 5.0, 0.92], [-30.0, 3.67394039744206e-15, 5.0, 0.92], [-25.980762113533157, -15.000000000000004, 5.0, 0.92], [-15.000000000000014, -25.980762113533153, 5.0, 0.92], [-5.510910596163089e-15, -30.0, 5.0, 0.92], [15.000000000000004, -25.980762113533157, 5.0, 0.92], [25.980762113533153, -15.000000000000014, 5.0, 0.92]]}, {"x": 490, "title": "神経可塑性の窓", "detail": "開いている間に\n新しいパターンが刻まれやすい", "dots": [[7.640519817344938, 43.331541132537154, 5.0, 0.92], [-5.108088221510128, 43.702487740645495, 5.0, 0.92], [-17.42750970572289, 40.40150870273206, 5.0, 0.92], [-28.282654826207732, 33.70595549723503, 5.0, 0.92], [-36.761463702169195, 24.178395035115475, 5.0, 0.92], [-42.151538541881514, 12.619342239287969, 5.0, 0.92], [-44.0, 5.3884459162483544e-15, 5.0, 0.92], [-42.15153854188151, -12.619342239287976, 5.0, 0.92], [-36.761463702169216, -24.178395035115443, 5.0, 0.92], [-28.282654826207736, -33.705955497235024, 5.0, 0.92], [-17.4275097057229, -40.40150870273206, 5.0, 0.92], [-5.108088221510119, -43.702487740645495, 5.0, 0.92], [7.640519817344918, -43.331541132537154, 5.0, 0.92], [19.74716392882033, -39.31983617423014, 5.0, 0.92], [30.194632066224283, -32.00444022921414, 5.0, 0.92], [38.105117766515306, -21.999999999999986, 5.0, 0.92], [42.81397430551225, -10.14709831266738, 5.0, 0.92], [43.9255589639358, 2.5583724720609355, 5.0, 0.92]]}, {"x": 770, "title": "急性期（体験直後〜数日）", "detail": "ジャーナリング（24〜48時間以内）／静けさの確保／身体のケア", "dots": [[-57.33900756417751, -18.170748483765426, 5.2, 0.88], [-64.30186730548783, -12.441295686082078, 5.2, 0.88], [-49.589248012673025, -14.573920194933397, 5.2, 0.88], [-50.235169727407765, -32.01055885290896, 5.2, 0.88], [-56.361946933984086, -18.18500458096056, 5.2, 0.88], [-43.989341506076954, -20.914770230960755, 5.2, 0.88], [61.67643694711611, -26.759360172132403, 5.2, 0.88], [48.84347448261478, -33.51667425067429, 5.2, 0.88], [40.709527117834114, -22.66641960308347, 5.2, 0.88], [40.84136603295515, -21.099209578802324, 5.2, 0.88], [57.77484902227974, -26.95341096630368, 5.2, 0.88], [39.60800487005817, -30.53446652773192, 5.2, 0.88], [0.7134610032604769, 39.14943906925047, 5.2, 0.88], [-4.685829141784058, 50.97219475916752, 5.2, 0.88], [9.073946900294544, 27.050542886329392, 5.2, 0.88], [-5.1138766457515725, 34.93790639062447, 5.2, 0.88], [2.426711507013378, 41.992447575019966, 5.2, 0.88], [-5.898900810319566, 40.13990970935476, 5.2, 0.88]]}, {"x": 1050, "title": "長期統合（数週間〜数ヶ月）", "detail": "定期的な振り返り／行動への変換／コミュニティ", "dots": [[-59.88710013279726, 12.999966883926952, 5.2, 0.88], [-56.90347419141662, -11.265133640805363, 5.2, 0.88], [-54.76666691556753, 11.217055070903896, 5.2, 0.88], [-58.023284019362734, 4.9294407844820896, 5.2, 0.88], [-63.89736050169841, 11.779801395693472, 5.2, 0.88], [-66.5803770969087, 4.800279911972726, 5.2, 0.88], [-11.001013374112208, -2.2452847177154815, 5.2, 0.88], [1.5502144382975818, -12.860089297325434, 5.2, 0.88], [8.842140896296545, -9.26245136702014, 5.2, 0.88], [-5.076187080573606, -9.325706874351038, 5.2, 0.88], [4.131279899022996, -12.870692645493165, 5.2, 0.88], [9.137752189693938, -4.674693332731653, 5.2, 0.88], [45.21013831103941, 11.790184091889593, 5.2, 0.88], [63.734152867394066, -5.542603273278231, 5.2, 0.88], [50.61247929221896, 9.753741066255614, 5.2, 0.88], [61.091263273067696, 2.371011203044331, 5.2, 0.88], [49.227556779648125, 0.8853973535874307, 5.2, 0.88], [63.23385428872524, 11.338060726918357, 5.2, 0.88]]}, {"x": 1330, "title": "再固定化（Reconsolidation）", "detail": "新しい認知・行動パターンを定着させる", "dots": [[-36.0, -36.0, 4.6, 0.9], [-12.0, -36.0, 4.6, 0.9], [12.0, -36.0, 4.6, 0.9], [36.0, -36.0, 4.6, 0.9], [-36.0, -12.0, 4.6, 0.9], [-12.0, -12.0, 4.6, 0.9], [12.0, -12.0, 4.6, 0.9], [36.0, -12.0, 4.6, 0.9], [-36.0, 12.0, 4.6, 0.9], [-12.0, 12.0, 4.6, 0.9], [12.0, 12.0, 4.6, 0.9], [36.0, 12.0, 4.6, 0.9], [-36.0, 36.0, 4.6, 0.9], [-12.0, 36.0, 4.6, 0.9], [12.0, 36.0, 4.6, 0.9], [36.0, 36.0, 4.6, 0.9]]}],XS=NODES.map(n=>n.x);
function act22(tt){tt%=22;let pulse,act=[];
if(tt<11){const f=tt/11,e=f*f*(3-2*f);pulse=XS[0]+(XS[4]-XS[0])*e;}else pulse=XS[4];
XS.forEach(x=>act.push(pulse>=x?1:Math.max(0,1-(x-pulse)/130)));
if(tt>19){const fade=1-smooth(19,22,tt)*.85;act=act.map(a=>a*fade);}
const branch=tt>=11.5?smooth(11.5,14.5,tt)*(1-smooth(20.5,22,tt)*.6):0;
return [pulse,act,branch];}
function frame(now){const dt=Math.min(.05,Math.max(0,(now-last)/1000));last=now;if(playing)t+=dt;
ctx.clearRect(0,0,1600,900);
txt('『慈愛体系』可塑性ウィンドウと統合',800,92,36);
txt('統合の3段階 ― 準備期（体験前）／急性期（体験直後〜数日）／長期統合（数週間〜数ヶ月）',800,128,20,false,.6);
const [pulse,act,branch]=act22(t);
for(let i=0;i<48;i++){const fx=150+((i*26+t*16)%1248);dot(fx,400,2.2,fx<=pulse?.55:.30);}
if(t%22<11.6){dot(pulse-30,400,6,.28);dot(pulse-15,400,8,.5);dot(pulse,400,11,.95);}
NODES.forEach((n,idx)=>{const a=act[idx],g=.86+.18*a;
n.dots.forEach((d,j)=>{let dx=d[0]*g,dy=d[1]*g;
if(idx===1){const an=t*0.25,cs=Math.cos(an),sn=Math.sin(an);const rx=dx*cs-dy*sn,ry=dx*sn+dy*cs;dx=rx;dy=ry;}
const ph=(idx*13+j*7)%6.28;dot(n.x+dx+Math.cos(t*0.9+ph)*3.2,400+dy+Math.sin(t*0.7+ph)*3.2,d[2]*g,.22+.74*a);});
if(n.title.startsWith('再固定化')){txt('再固定化',n.x,528,21,true);txt('（Reconsolidation）',n.x,556,17,false,.62);}
else txt(n.title,n.x,528,21,true);
if(n.detail){const y0=n.title.startsWith('再固定化')?590:562;n.detail.split(/／|\n/).forEach((ln,j)=>txt(ln,n.x,y0+j*26,17,false,.62));}});
if(branch>.01){for(const yy of [452,478,636])dot(490,yy,2,.35*branch);
ctx.globalAlpha=branch;txt('統合がなければ',150,688,21,true,1,'left');ctx.globalAlpha=1;
const counts=[5,4,3,2],alphas=[.8,.65,.5,.35],items=['洞察の減衰','スピリチュアル・バイパシング','解離リスク','インフレーション'];
items.forEach((item,k)=>{const cx=430+k*270;for(let j=0;j<counts[k];j++)dot(cx+(j-(counts[k]-1)/2)*17,700,5,alphas[k]*branch);
txt(item,cx,748,17,false,.85*branch);});}
requestAnimationFrame(frame);}
requestAnimationFrame(frame);

</script></body></html>
