<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>第4章 変性意識の誘発法 ― 『慈愛体系』図版アニメーション</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#fff;color:#111;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif}
.wrap{max-width:1020px;margin:0 auto;padding:14px 12px 26px}
canvas{width:100%;height:auto;display:block}.controls{text-align:center;margin:8px 0}
button{border:1px solid #111;background:#111;color:#fff;border-radius:999px;padding:6px 16px;font-size:13.5px;cursor:pointer}
.foot{font-size:12.5px;color:rgba(0,0,0,.55);text-align:center}
</style><style>@view-transition{navigation:auto}::view-transition-old(root),::view-transition-new(root){animation-duration:.35s}</style><meta name="theme-color" content="#ffffff"><!-- Google tag (gtag.js) -->

<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());

  gtag('config', 'G-ZHGK3HRHX3');
</script>
</head><body><div class="wrap">
<canvas id="cv" width="1600" height="900" aria-label="第4章 変性意識の誘発法"></canvas>
<div class="controls"><button id="btn">一時停止</button></div>
<p class="foot">図は原典の要約であり、医学的助言ではありません。</p></div>
<script>
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
let playing=true,t=3.2,last=performance.now();
if(matchMedia('(prefers-reduced-motion: reduce)').matches){playing=false;document.getElementById('btn').textContent='再生';}
document.getElementById('btn').onclick=e=>{playing=!playing;e.target.textContent=playing?'一時停止':'再生';last=performance.now();};
const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
const ss=x=>{x=clamp(x,0,1);return x*x*(3-2*x);};
let seed=33; const rnd=()=>{seed=(seed*1103515245+12345)&0x7fffffff;return seed/0x7fffffff;};
function dot(x,y,r,o){ctx.beginPath();ctx.arc(x,y,r,0,6.2832);ctx.fillStyle='rgba(0,0,0,'+o+')';ctx.fill();}
function head(){
 ctx.font='700 34px "Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif';ctx.fillStyle='rgba(17,17,17,.95)';ctx.textAlign='center';ctx.textBaseline='top';
 ctx.fillText('第4章 変性意識の誘発法',800,46);
 ctx.font='20px "Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif';ctx.fillStyle='rgba(0,0,0,.6)';
 ctx.fillText('入口は一つではない ― 誘発法37種',800,94);
}

const DOORS=[];for(let i=0;i<6;i++){const cx=270+i*212,cy=580;const arc=[];for(let j=0;j<=12;j++){const a=Math.PI-j/12*Math.PI;arc.push([cx+Math.cos(a)*112,cy-Math.sin(a)*112]);}
 const stream=[];for(let j=0;j<5;j++)stream.push(j);DOORS.push({cx,cy,arc,stream});}
function render(t){DOORS.forEach((dr,i)=>{const b=0.45+0.55*Math.pow(0.5+0.5*Math.sin(t*2.2-i*0.9),2);
 dr.arc.forEach(q=>dot(q[0],q[1],2.4,0.25+0.7*b));
 dr.stream.forEach(j=>{const p=((t*0.8+j*0.21+i*0.13)%1);dot(dr.cx+Math.sin(p*9+i)*10,dr.cy-14-p*185,2.1,(0.15+0.75*b)*Math.sin(Math.PI*p));});
 dot(dr.cx,dr.cy,2.6,0.3+0.6*b);});}

function frame(now){const dt=Math.min(.05,Math.max(0,(now-last)/1000));last=now;if(playing)t+=dt;
ctx.clearRect(0,0,1600,900);head();render(t);requestAnimationFrame(frame);}
requestAnimationFrame(frame);
</script><script>/* jiai-fig-gate */
(function(){var orig=window.requestAnimationFrame.bind(window),pend=[],fDoc=!document.hidden,fIo=true,fPar=true,running=true;function eff(){return fDoc&&fIo&&fPar;}function upd(){var r=eff();if(r===running)return;running=r;if(running){var p=pend;pend=[];for(var i=0;i<p.length;i++)orig(p[i]);}}window.requestAnimationFrame=function(cb){if(eff())return orig(cb);pend.push(cb);return 0;};window.addEventListener('message',function(e){if(e.origin!==window.location.origin)return;var d=e.data;if(d&&d.type==='jiai-vis'){fPar=!!d.visible;upd();}});if('IntersectionObserver' in window){try{new IntersectionObserver(function(es){if(es[0]){fIo=es[0].isIntersecting;upd();}}).observe(document.documentElement);}catch(_){}}document.addEventListener('visibilitychange',function(){fDoc=!document.hidden;upd();});})();
</script>
</body></html>
