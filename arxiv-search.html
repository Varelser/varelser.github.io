<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Research Digest 全件検索 | VARELSER</title>
  <meta name="description" content="Research Digest の全ストック論文（本体＋月別アーカイブ）を横断検索できるページです。" />
  <meta property="og:title" content="Research Digest 全件検索 | VARELSER" />
  <meta property="og:description" content="Research Digest の全ストック論文（本体＋月別アーカイブ）を横断検索できるページです。" />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://varelser.github.io/arxiv-search.html" />
  <link rel="alternate" type="application/rss+xml" title="Research Digest RSS" href="arxiv-feed.xml" />
  <style>
    body{margin:0;background:#fff;color:#111;font-family:ui-sans-serif,system-ui,-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;line-height:1.8}
    .container{max-width:920px;margin:0 auto;padding:40px 18px 56px}
    .back{display:inline-block;margin-bottom:28px;color:#666;text-decoration:none;font-size:14px}
    h1{font-size:24px;margin:0 0 8px}.desc{color:#666;font-size:13px;margin:0 0 18px}
    .panel{border:1px solid #e5e7eb;border-radius:12px;padding:14px;background:#fff;margin-bottom:24px}
    .grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.count{font-size:13px;color:#666;margin:10px 2px}
    select,input{width:100%;height:42px;padding:0 12px;border:1px solid #d1d5db;border-radius:10px;background:#fff}
    .label{display:block;font-size:12px;color:#666;margin:0 0 6px}
    article{border-bottom:1px solid #e5e7eb;padding-bottom:24px;margin-bottom:24px}
    .src{font-size:12px;color:#666;margin-bottom:8px}
    .title{font-size:19px;line-height:1.5;font-weight:700;margin:0 0 10px}
    .title a{color:#111}
    .orig{font-size:13px;color:#666;margin:-6px 0 10px;line-height:1.6}
    .tags{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 12px}
    .tag{font-size:12px;padding:4px 10px;border:1px solid #e5e7eb;border-radius:999px;background:#f3f4f6}
    .summary{font-size:14px;color:#222;margin:0 0 10px}
    .links{font-size:13px;display:flex;gap:14px}
    a{color:#0f766e;text-decoration:none} a:hover{text-decoration:underline}
    mark{background:#fde68a;color:inherit;border-radius:2px;padding:0 1px}
    @media (max-width:720px){.grid{grid-template-columns:1fr}}
    @media (prefers-color-scheme: dark){
      body{background:#0f1216;color:#e8eaed}
      .back{color:#9aa3ad}.desc{color:#9aa3ad}.count{color:#9aa3ad}
      .panel{background:#171b21;border-color:#2b313a}
      select,input{background:#171b21;border-color:#3a4149;color:#e8eaed}
      .label{color:#9aa3ad}
      article{border-bottom-color:#2b313a}.src{color:#9aa3ad}
      .title a{color:#e8eaed}
      .orig{color:#9aa3ad}
      .tag{background:#232830;border-color:#2b313a;color:#d4d8dd}
      .summary{color:#dfe3e8}
      a{color:#2dd4bf}
      mark{background:#8a6d00;color:#fff}
    }
  </style>
</head>
<body>
  <div class="container">
    <a href="arxiv.html" class="back">← Research Digest に戻る</a>
    <h1>Research Digest 全件検索</h1>
    <p class="desc">最新80件だけでなく、月別アーカイブを含む全ストックを横断して検索できます。</p>
    <div class="panel">
      <div class="grid">
        <label><span class="label">キーワード</span><input id="q" type="search" placeholder="タイトル・著者・要約で検索" /></label>
        <label><span class="label">ジャンル</span><select id="genre"><option value="">すべて</option></select></label>
        <label><span class="label">月</span><select id="mon"><option value="">すべて</option></select></label>
      </div>
      <p class="count" id="count">読み込み中…</p>
    </div>
    <div id="results"></div>
  </div>
  <script>
    var articles = [];
    function esc(s) { return String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;"); }
    // Escape `text` for HTML, then wrap occurrences of the raw query `q`
    // (HTML-escaped the same way) in <mark>. Case-insensitive.
    function hl(text, q) {
      var out = esc(text);
      if (!q) return out;
      var pat = esc(q).replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
      if (!pat) return out;
      return out.replace(new RegExp("(" + pat + ")", "gi"), "<mark>$1</mark>");
    }
    function pageLabel(page) {
      if (page === "本体") return "本体";
      var m = /^arxiv-archive-(\d{4})-(\d{2})\.html$/.exec(page || "");
      return m ? "アーカイブ " + Number(m[1]) + "年" + Number(m[2]) + "月" : String(page || "");
    }
    function pageHref(page) { return page === "本体" ? "arxiv.html" : page; }
    function render() {
      var q = document.getElementById("q").value.trim().toLowerCase();
      var genre = document.getElementById("genre").value;
      var mon = document.getElementById("mon").value;
      var hits = [];
      for (var i = 0; i < articles.length; i++) {
        var a = articles[i];
        if (genre && a.genre !== genre) continue;
        if (mon && (a.publishedAt || "").slice(0, 7) !== mon) continue;
        if (q) {
          var hay = (a.titleJa + " " + a.title + " " + (a.authors || []).join(" ") + " " + (a.categories || []).join(" ") + " " + a.genre + " " + (a.text || "")).toLowerCase();
          if (hay.indexOf(q) === -1) continue;
        }
        hits.push(a);
      }
      document.getElementById("count").textContent = hits.length + "件ヒット / 全" + articles.length + "件" + (hits.length > 100 ? "（上位100件を表示）" : "");
      var html = "";
      hits.slice(0, 100).forEach(function (a) {
        var tags = (a.field ? [a.field] : []).map(function (t) { return '<span class="tag">' + esc(t) + "</span>"; }).join("");
        html += '<article><div class="src">' + esc((a.publishedAt || "").slice(0, 10)) + " ・ " + esc(a.source) + " ・ " + hl(a.genre, q) + " ・ 掲載: " + esc(pageLabel(a.page)) + '</div>'
          + '<h2 class="title"><a href="' + esc(a.url) + '" target="_blank" rel="noopener">' + hl(a.titleJa, q) + "</a></h2>"
          + (a.title && a.title !== a.titleJa ? '<p class="orig">' + hl(a.title, q) + "</p>" : "")
          + '<p class="summary">' + hl(a.excerpt, q) + (a.text && a.text.length > (a.excerpt || "").length ? "…" : "") + "</p>"
          + (tags ? '<div class="tags">' + tags + "</div>" : "")
          + '<div class="links"><a href="' + esc(a.url) + '" target="_blank" rel="noopener">原文を読む</a><a href="' + esc(pageHref(a.page)) + '">掲載ページで見る</a></div></article>';
      });
      document.getElementById("results").innerHTML = html || '<p class="count">該当する論文がありません。</p>';
    }
    function fill(id, values) {
      var sel = document.getElementById(id);
      values.forEach(function (v) { var o = document.createElement("option"); o.value = v; o.textContent = v; sel.appendChild(o); });
    }
    function finish() {
      articles.sort(function (x, y) { return String(y.publishedAt || "").localeCompare(String(x.publishedAt || "")); });
      fill("genre", Array.from(new Set(articles.map(function (a) { return a.genre; }).filter(Boolean))).sort());
      fill("mon", Array.from(new Set(articles.map(function (a) { return (a.publishedAt || "").slice(0, 7); }).filter(Boolean))).sort().reverse());
      ["q", "genre", "mon"].forEach(function (id) {
        document.getElementById(id).addEventListener("input", render);
        document.getElementById(id).addEventListener("change", render);
      });
      render();
    }
    fetch("arxiv-search-index.json").then(function (r) { return r.json(); }).then(function (data) {
      articles = Array.isArray(data) ? data : [];
      finish();
    }).catch(function () { document.getElementById("count").textContent = "データの読み込みに失敗しました。"; });
  </script>
</body>
</html>
