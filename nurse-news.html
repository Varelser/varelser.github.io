/10/261023002905.htm", "publishedAt": "2026-10-24T11:16:08.000Z", "publishedDateKey": "2026-10-24", "publishedMonthKey": "2026-10", "topics": ["糖尿病・代謝", "栄養"], "clinicalAreas": ["患者教育", "慢性疾患管理"], "audiences": ["成人", "慢性疾患患者", "医療従事者"], "evidenceType": "基礎研究", "practiceImpact": "medium", "actionPoint": "細胞レベルでのエネルギー代謝に着目した新たな肥満治療の可能性を理解し、患者への情報提供に活かす。"}, {"id": "107efa17e315ec6fb1a8c604031d913b", "sourceName": "ScienceDaily Health", "originalTitle": "Glioblastoma breakthrough reveals how brain cancer cells become more aggressive", "titleJa": "脳腫瘍の浸潤メカニズム解明：腫瘍周囲の粘性流体の影響", "summaryHtml": "神経膠芽腫（グリオーマ）は最も致死率の高い脳腫瘍の一つであり、その細胞が周囲の組織へ浸潤するメカニズムに新たな知見が得られました。<br><br>腫瘍の外縁部を取り囲む粘性の高い流体が、がん細胞を小さく、より柔軟にし、周囲組織への浸潤を促進することが発見されました。さらに、これらの変化の一部は細胞が粘性流体を離れた後も持続することが示唆されており、この致死的ながんの拡散に関わる、これまで見過ごされてきたメカニズムが明らかになりました。<br><br>研究チームは、腫瘍周囲の物理的環境を再現する革新的なマイクロ流体チップを作成し、粘性流体中で過ごす時間が細胞の形状変化や狭い隙間を通過する能力に影響を与えることを突き止めました。これは、粘性流体が単にがん細胞の移動を妨げるだけでなく、その行動を積極的に変化させ、より攻撃的にする可能性があることを示唆しています。<br><br>この発見は、脳腫瘍の治療戦略を立てる上で重要な示唆を与えます。粘性流体という物理的要因ががん細胞の振る舞いに影響を与える可能性を考慮することで、新たな治療法の開発につながるかもしれません。<br><br>看護実務への示唆：がん患者の病態理解を深め、治療法の開発に貢献する基礎研究の重要性を認識し、多角的な視点を持つことが求められます。", "url": "https://www.sciencedaily.com/releases/2026/10/261022081300.htm", "publishedAt": "2026-10-24T00:48:21.000Z", "publishedDateKey": "2026-10-24", "publishedMonthKey": "2026-10", "topics": ["がん", "神経"], "clinicalAreas": ["外来", "病棟"], "audiences": ["成人", "医療従事者"], "evidenceType": "基礎研究", "practiceImpact": "low", "actionPoint": "がん細胞の浸潤メカニズムに関する基礎研究の進展を注視し、将来的な治療法開発への貢献を理解することが重要です。"}, {"id": "e142e37ecace3694e7caed73208f982d", "sourceName": "ScienceDaily Health", "originalTitle": "Dental implants can hijack your immune system, scientists discover", "titleJa": "歯科インプラント感染、免疫細胞を介した新たなメカニズム発見", "summaryHtml": "歯科インプラント周囲炎の感染が抗生物質に抵抗性を示す原因として、インプラント自体が関与する新たなメカニズムが発見されました。<br><br>研究によると、細菌がチタン製インプラントを腐食させ、放出された微細な粒子が免疫細胞を乗っ取り、破壊的な炎症を引き起こし、顎骨の吸収を加速させることが明らかになりました。<br><br>この発見は、インプラント周囲炎の治療における新たな薬剤標的を提供する可能性があります。これまで抗生物質治療が奏効しにくかった理由が解明されつつあり、今後の治療法開発に繋がることが期待されます。<br><br>看護実務への示唆：インプラント周囲炎の治療抵抗性のメカニズム理解は、患者への説明や術後管理の重要性を再認識させ、感染予防策の徹底と早期発見・対応の必要性を示唆しています。", "url": "https://www.sciencedaily.com/releases/2026/10/261022081314.htm", "publishedAt": "2026-10-23T11:12:28.000Z", "publishedDateKey": "2026-10-23", "publishedMonthKey": "2026-10", "topics": ["感染症", "医薬品", "循環器"], "clinicalAreas": ["外来", "感染対策", "患者教育"], "audiences": ["成人", "医療従事者"], "evidenceType": "基礎研究", "practiceImpact": "medium", "actionPoint": "インプラント周囲炎の治療抵抗性のメカニズムを理解し、感染予防と早期発見・対応に努める。"}, {"id": "fb6ecfe99a134d6aaaf2fc549e5877d2", "sourceName": "ScienceDaily Health", "originalTitle": "Breakthrough PTSD treatment achieves 68% remission rate in clinical trial", "titleJa": "PTSD治療の新技術、68%の寛解率を達成", "summaryHtml": "米国で、心的外傷後ストレス障害（PTSD）に対する新たな治療法がFDAの承認を受けました。<br><br>この治療法は、個々の患者の脳活動を精密に測定し、磁気刺激を用いて異常な脳活動を標的とします。初期の臨床試験では、参加者の52%が症状の軽減を経験し、68%が寛解に至ったと報告されています。<br><br>従来の精神療法やSSRI（選択的セロトニン再取り込み阻害薬）による治療では十分な効果が得られない患者にとって、新たな選択肢となる可能性があります。この技術は、PTSD治療の変革をもたらし、他の精神疾患に対するより精密な治療法の開発につながることが期待されています。<br><br>看護実務への示唆：新たなPTSD治療法の登場により、患者のQOL向上と治療選択肢の拡大が期待されるため、最新の治療法に関する知識をアップデートし、患者への適切な情報提供とケアに努めることが重要です。", "url": "https://www.sciencedaily.com/releases/2026/10/261022081309.htm", "publishedAt": "2026-10-23T11:02:25.000Z", "publishedDateKey": "2026-10-23", "publishedMonthKey": "2026-10", "topics": ["神経", "精神・メンタルヘルス"], "clinicalAreas": ["外来"], "audiences": ["成人", "医療従事者"], "evidenceType": "RCT", "practiceImpact": "high", "actionPoint": "新たなPTSD治療法の登場を認識し、患者への情報提供とケアに努める。"}, {"id": "182a0555e20de704729dfcd9943ce82d", "sourceName": "ScienceDaily Health", "originalTitle": "Scientists discover a surprising double benefit of exercise for Parkinson’s", "titleJa": "パーキンソン病患者の運動習慣、認知機能低下抑制に二重の効果", "summaryHtml": "パーキンソン病患者を対象とした7年間の追跡調査により、身体活動量の多い患者ほど記憶力、思考力、運動能力の低下が緩やかであることが明らかになりました。<br><br>週8時間以上の運動を行っていた患者群では、認知機能の低下がほとんど見られず、病気の進行に伴う運動機能低下の抑制だけでなく、認知機能の維持にも寄与する可能性が示唆されました。<br><br>この研究は、パーキンソン病の進行と身体活動量の関連性を示唆するものであり、運動が直接的に病気の進行を遅らせることを証明するものではありませんが、患者のQOL維持に重要な役割を果たす可能性が期待されます。<br><br>看護実務においては、患者のADLやQOL維持のために、個々の患者の状態に合わせた運動習慣の確立を支援することが重要です。", "url": "https://www.sciencedaily.com/releases/2026/10/261022081306.htm", "publishedAt": "2026-10-23T10:10:11.000Z", "publishedDateKey": "2026-10-23", "publishedMonthKey": "2026-10", "topics": ["神経", "リハビリ"], "clinicalAreas": ["病棟", "外来", "リハビリ"], "audiences": ["成人", "高齢者", "慢性疾患患者"], "evidenceType": "観察研究", "practiceImpact": "medium", "actionPoint": "パーキンソン病患者に対し、運動習慣の維持・向上が認知機能および運動機能の維持に寄与する可能性を念頭に置いたケアを提供する。"}, {"id": "3e2c9ce58a1f6bb5e3770c0023763253", "sourceName": "ScienceDaily Health", "originalTitle": "Scientists discover a hidden messaging system deep inside the brain", "titleJa": "脳深部の神経細胞群、精密な情報伝達システムを発見", "summaryHtml": "脳幹深部にある小さな神経細胞群「青斑核（Locus Coeruleus: LC）」が、これまで考えられていたよりもはるかに洗練された情報伝達システムを持っていることがマウスを用いた研究で明らかになりました。<br><br>この青斑核は、学習、注意、行動制御に関わる神経伝達物質であるノルアドレナリンを産生しますが、研究チームは、青斑核が脳全体に均一な信号を送るのではなく、特定のターゲットに選択的にメッセージを届ける複数の経路を持っていることを発見しました。<br><br>この発見は、うつ病、不安障害、ADHDなどの治療に用いられるノルアドレナリンに作用する薬剤の開発に影響を与える可能性があります。特定の症状に関与する神経回路に選択的に作用する、より精密な治療法の開発につながることが期待されます。<br><br>看護実務への示唆：脳の精密な情報伝達メカニズムの解明は、精神疾患や神経疾患の病態理解を深め、個別化された治療アプローチの重要性を示唆しており、看護師は患者の状態に応じたきめ細やかなアセスメントと介入を心がける必要があります。", "url": "https://www.sciencedaily.com/releases/2026/10/261022081304.htm", "publishedAt": "2026-10-23T08:28:22.000Z", "publishedDateKey": "2026-10-23", "publishedMonthKey": "2026-10", "topics": ["神経", "精神・メンタルヘルス"], "clinicalAreas": ["外来", "患者教育"], "audiences": ["成人", "医療従事者"], "evidenceType": "基礎研究", "practiceImpact": "medium", "actionPoint": "脳の精密な情報伝達メカニズムの解明を踏まえ、患者の状態に応じたきめ細やかなアセスメントと介入を心がける。"}, {"id": "9e03bb9c94533f3a7ad73e527929009b", "sourceName": "ScienceDaily Health", "originalTitle": "Cambridge scientists create a $10 chip that could put a medical lab on your wrist", "titleJa": "10ドルのチップで実現？ 手首につけられる医療検査ラボ", "summaryHtml": "ケンブリッジ大学の研究者らが、わずか10ドル（約1500円）で製造可能な革新的な光学センサーを開発しました。このセンサーは、実験室レベルの精度を持ちながら、ウェアラブルデバイスに搭載できるほど小型です。食品、プラスチック、医薬品の識別において100%の精度を示し、さらに侵襲的な手続きなしに血糖値やアルコール濃度などの健康マーカーをモニタリングできる可能性が示されました。<br><br>この新しい光学センサーは、従来の分光計の小型化に伴う精度低下という課題を克服するものです。数学的な「畳み込み定理」を応用した独自の設計により、小型かつ低コストでありながら、高い精度とノイズ耐性を実現しています。これにより、リアルタイムでの健康状態のモニタリングや、物質の同定など、幅広い応用が期待されます。<br><br>将来的には、この技術がウェアラブルデバイスに組み込まれることで、糖尿病患者の血糖値管理がより簡便になる可能性があります。また、食品の安全性検査や環境モニタリングなど、医療分野以外への応用も考えられます。<br><br>看護実務への示唆：非侵襲的なバイタルサインや健康マーカーのモニタリング技術の進展は、患者の負担軽減や早期発見・介入に繋がる可能性があり、今後の動向に注目が必要です。", "url": "https://www.sciencedaily.com/releases/2026/10/261022081312.htm", "publishedAt": "2026-10-23T01:21:47.000Z", "publishedDateKey": "2026-10-23", "publishedMonthKey": "2026-10", "topics": ["医薬品", "糖尿病・代謝", "公衆衛生"], "clinicalAreas": ["外来", "在宅", "患者教育"], "audiences": ["成人", "医療従事者", "地域住民"], "evidenceType": "基礎研究", "practiceImpact": "medium", "actionPoint": "非侵襲的な健康モニタリング技術の進展に注目し、患者への情報提供や新たなケアの可能性を探る。"}, {"id": "ed6a4dffb4280d8be1a9bd1009ee3db3", "sourceName": "ScienceDaily Health", "originalTitle": "Scientists discover a hidden immune weapon against deadly lung cancer", "titleJa": "肺がん治療に新たな光明：免疫細胞の隠れた攻撃力を発見", "summaryHtml": "この度、科学者たちは、治療が困難なことで知られる小細胞肺がんに対し、免疫システムが持つ隠れた攻撃能力を発見しました。この特殊な免疫細胞は、がん細胞が免疫システムから巧妙に身を隠している状態でも、それらを認識し破壊する力を持つことが明らかになりました。<br><br>この発見は、がん細胞の「隠れ蓑」を見破る新たな免疫防御のメカニズムを示唆しており、これまで治療が難しいとされてきた腫瘍に対する新たな攻撃戦略につながる可能性があります。さらに、既存の薬剤がこれらの免疫細胞の殺がん能力を高めることも示されており、今後の免疫療法の進歩に期待が寄せられています。<br><br>小細胞肺がんは、非常に進行が早く、5年生存率が7%未満と、最も致死的ながんの一つです。免疫療法は他のがん種で大きな成果を上げていますが、小細胞肺がんに対する効果は限定的でした。この新たな発見は、より多くの患者が免疫療法の恩恵を受けられるようになる可能性を示しています。<br><br>看護実務への示唆：免疫療法の効果を高める可能性のある新たな免疫メカニズムの理解は、患者への説明やケアの質の向上に繋がります。", "url": "https://www.sciencedaily.com/releases/2026/10/261021231232.htm", "publishedAt": "2026-10-23T00:32:37.000Z", "publishedDateKey": "2026-10-23", "publishedMonthKey": "2026-10", "topics": ["がん", "呼吸器"], "clinicalAreas": ["病棟", "外来", "患者教育"], "audiences": ["成人", "医療従事者"], "evidenceType": "基礎研究", "practiceImpact": "medium", "actionPoint": "小細胞肺がんに対する新たな免疫療法の可能性を念頭に置き、患者への情報提供とケアに努める。"}, {"id": "1086e7496d751b56eb306fe1d38d365b", "sourceName": "ScienceDaily Health", "originalTitle": "Millions take fish oil for brain health. A two-year study found no benefit", "titleJa": "フィッシュオイルの脳への効果は限定的？ 2年間の研究で認知機能改善は見られず", "summaryHtml": "多くの人が脳の健康維持のために摂取しているフィッシュオイル（魚油）サプリメントですが、2年間にわたる臨床試験の結果、記憶力の改善やアルツハイマー病に関連する脳の萎縮を防ぐ効果は認められませんでした。この研究は、健康的な食事からのオメガ3脂肪酸摂取が、サプリメント単独では得られない利点をもたらす可能性を示唆しています。<br><br>この研究では、アルツハイマー病のリスクが高いとされる高齢者を対象に、高用量のフィッシュオイルサプリメントを毎日摂取してもらいました。その結果、脳内のオメガ3脂肪酸レベルは上昇したものの、記憶力、思考能力、または脳の萎縮に対する保護効果において、プラセボ（偽薬）群と比較して有意な差は認められませんでした。<br><br>研究者らは、オメガ3脂肪酸が脳細胞の接続形成に重要な役割を果たしていることは認めるものの、今回の結果からは、フィッシュオイルサプリメントがアルツハイマー病の予防策として推奨されるものではないと結論付けています。食事からの摂取の重要性が改めて示唆されています。<br><br>看護実務への示唆：患者がフィッシュオイルサプリメントを利用している場合、その効果に対する過度な期待を避け、バランスの取れた食事の重要性を伝えることが求められます。", "url": "https://www.sciencedaily.com/releases/2026/10/261020085427.htm", "publishedAt": "2026-10-22T12:46:24.000Z", "publishedDateKey": "2026-10-22", "publishedMonthKey": "2026-10", "topics": ["循環器", "神経", "栄養"], "clinicalAreas": ["外来", "高齢者ケア", "患者教育"], "audiences": ["高齢者", "成人", "医療従事者"], "evidenceType": "RCT", "practiceImpact": "low", "actionPoint": "フィッシュオイルサプリメントの効果については科学的根拠が限定的であることを理解し、患者にはバランスの取れた食事の重要性を伝える。"}, {"id": "baf168accfb3a66b3994e0f6cf50cb8f", "sourceName": "ScienceDaily Health", "originalTitle": "A revolutionary new microscope could reveal the hidden machinery of life", "titleJa": "革新的な新顕微鏡が生命の隠れた仕組みを解明する可能性", "summaryHtml": "研究者たちが、これまで見えにくかった細胞内の構造をより鮮明に観察できる、革新的な顕微鏡技術を開発しました。この技術は、従来の電子顕微鏡では捉えにくかった微細なタンパク質を観察可能にし、生命の隠れた仕組みを理解する上で大きな進歩をもたらす可能性があります。<br><br>開発されたレーザー位相板は、クライオ電子顕微鏡（cryo-EM）およびクライオ電子線トモグラフィー（cryo-ET）の性能を大幅に向上させることが期待されています。これにより、細胞内の分子マシンがどのように相互作用するかを詳細に調べることが可能になります。<br><br>この技術は、タンパク質の構造解析や創薬研究の加速に貢献するだけでなく、細胞内の分子レベルでの生命現象の理解を深めるための新たな道を開くものです。<br><br>看護実務への示唆：細胞レベルでの生命現象の理解が進むことで、将来的に疾患の病態解明や新たな治療法開発につながる可能性があり、最新の研究動向に関心を持つことが重要である。", "url": "https://www.sciencedaily.com/releases/2026/10/261021231230.htm", "publishedAt": "2026-10-22T11:30:49.000Z", "publishedDateKey": "2026-10-22", "publishedMonthKey": "2026-10", "topics": ["がん", "神経", "医薬品"], "clinicalAreas": ["外来", "病棟"], "audiences": ["医療従事者"], "evidenceType": "基礎研究", "practiceImpact": "low", "actionPoint": "生命科学分野の基礎研究の進展が、将来の医療に与える影響について関心を持ち続ける。"}, {"id": "52afb64154fa4d3ded9dede3b5f0dc5b", "sourceName": "ScienceDaily Health", "originalTitle": "Coffee calories have jumped nearly 40%. Sugar isn't the biggest culprit", "titleJa": "コーヒーのカロリー、4割近く増加：非乳製品クリーマーが主因か", "summaryHtml": "米国成人のコーヒー摂取カロリーが、2003年から2018年にかけて約40%増加したことが、タフツ大学の研究で明らかになりました。コーヒーの消費量はほぼ変わっていないにも関わらず、カロリーが増加した主な原因は、砂糖や牛乳ではなく、非乳製品クリーマーの使用増加であることが特定されました。<br><br>この研究では、3万人以上の米国成人を対象に、2003年から2018年までのコーヒーの摂取習慣とそれに含まれる成分に関するデータを分析しました。その結果、1日あたりの平均コーヒー摂取量は約13オンスで横ばいでしたが、コーヒーから摂取する平均カロリーは1日あたり43キロカロリーから60キロカロリーへと増加しました。特に、非乳製品クリーマーの摂取量がこの期間に倍増したことが、カロリー増加に大きく寄与していると推測されています。<br><br>コーヒー自体は健康上の利点と関連付けられることが多いですが、添加される砂糖やクリームが過剰なカロリー摂取や飽和脂肪酸の摂取につながる可能性があります。今回の研究結果は、栄養と健康全般との関連性を理解する上で、人々が実際に何を摂取しているかを知ることの重要性を示唆しています。<br><br>看護実務への示唆：患者の飲料摂取習慣における隠れたカロリー源（特に非乳製品クリーマーなど）に注意を払い、栄養指導に活かすことが重要です。", "url": "https://www.sciencedaily.com/releases/2026/10/261021231224.htm", "publishedAt": "2026-10-22T10:52:18.000Z", "publishedDateKey": "2026-10-22", "publishedMonthKey": "2026-10", "topics": ["栄養", "糖尿病・代謝"], "clinicalAreas": ["患者教育", "慢性疾患管理"], "audiences": ["成人", "医療従事者", "地域住民"], "evidenceType": "観察研究", "practiceImpact": "medium", "actionPoint": "患者のコーヒー摂取習慣における非乳製品クリーマーなどの添加物に着目し、過剰摂取のリスクについて指導する。"}, {"id": "254c527b4bd793da492b4915b258d3a3", "sourceName": "ScienceDaily Health", "originalTitle": "Natural compound could fight rheumatoid arthritis at its source", "titleJa": "天然化合物が関節リウマチの根源に作用する可能性", "summaryHtml": "薬用植物から抽出された天然化合物が、関節リウマチに対して有望な効果を示す可能性が示唆されています。<br><br>ラットを用いた実験では、この化合物が関節の腫れを軽減し、軟骨を保護し、慢性炎症の原因となる免疫応答を鎮静化することが確認されました。<br><br>研究者たちは、この化合物が特定のタンパク質を標的とし、脂肪酸代謝のバランスを回復させることで作用することを発見しました。これは、この疾患と闘うための、これまであまり探求されてこなかった新しいアプローチを示唆しています。<br><br>看護実務への示唆：関節リウマチ患者の治療において、新たな作用機序を持つ治療法の可能性について情報収集を継続することが重要です。", "url": "https://www.sciencedaily.com/releases/2026/10/261020085309.htm", "publishedAt": "2026-10-22T03:37:25.000Z", "publishedDateKey": "2026-10-22", "publishedMonthKey": "2026-10", "topics": ["循環器", "神経", "リハビリ"], "clinicalAreas": ["病棟", "外来", "慢性疾患管理"], "audiences": ["成人", "高齢者", "慢性疾患患者"], "evidenceType": "基礎研究", "practiceImpact": "low", "actionPoint": "関節リウマチ治療における新たな作用機序を持つ治療法の可能性について、最新情報を把握しておく。"}, {"id": "2f40975b40812822afadb40206f12e8e", "sourceName": "ScienceDaily Health", "originalTitle": "People are taking an unapproved weight-loss drug. AI found something surprising", "titleJa": "AIが未承認の減量薬に関する予期せぬ副作用報告を発見", "summaryHtml": "未承認の減量薬であるレタトルチド（retatrutide）の使用者によるRedditへの投稿をAIが分析した結果、臨床試験とは異なる予期せぬ症状が報告されていることが明らかになりました。<br><br>具体的には、食欲増加、睡眠障害、心拍数の増加などが報告されており、これは食欲抑制を目的とするこの薬剤の作用機序とは異なるものです。<br><br>研究者たちは、AIを活用することで、従来の医薬品安全性監視では見逃される可能性のあるシグナルを特定できる可能性を示しました。ただし、これらの報告は未承認薬の使用や個人差によるものであり、薬剤自体の新たな副作用を確定するものではないと強調しています。<br><br>看護実務への示唆：患者がインターネット上の情報に基づいて未承認薬を使用するリスクを認識し、適切な情報提供と指導を行う必要がある。", "url": "https://www.sciencedaily.com/releases/2026/10/261020085018.htm", "publishedAt": "2026-10-22T02:37:01.000Z", "publishedDateKey": "2026-10-22", "publishedMonthKey": "2026-10", "topics": ["糖尿病・代謝", "医薬品", "公衆衛生"], "clinicalAreas": ["外来", "患者教育", "慢性疾患管理"], "audiences": ["成人", "医療従事者", "地域住民"], "evidenceType": "観察研究", "practiceImpact": "medium", "actionPoint": "未承認薬に関する患者からの相談に対し、科学的根拠に基づいた情報提供とリスク説明を丁寧に行う。"}, {"id": "42f8b5d4df49dac2f542a6902c806649", "sourceName": "ScienceDaily Health", "originalTitle": "Massive study of 460,000 people challenges ultra-processed food cancer fears", "titleJa": "超加工食品と大腸がんリスクに関する大規模研究：リスク増加は一概には言えない", "summaryHtml": "46万人以上を対象とした米国の大規模研究により、超加工食品（UPF）の摂取と大腸がんリスクの全体的な増加との間に関連性は見出されませんでした。<br><br>しかし、食品の種類によっては異なる傾向が示され、一部の超加工食品（全粒穀物や乳製品）はがんリスクの低下と関連していた一方、加工肉はリスク増加との関連が指摘されました。<br><br>この結果は、超加工食品の健康への影響は、その内容によって大きく異なり、一律にリスクが高いと断定できないことを示唆しています。<br><br>看護実務への示唆として、患者への食事指導においては、食品の種類や加工度だけでなく、具体的な栄養成分や健康への影響を考慮した個別のアドバイスが求められます。", "url": "https://www.sciencedaily.com/releases/2026/10/261020085014.htm", "publishedAt": "2026-10-21T13:22:17.000Z", "publishedDateKey": "2026-10-21", "publishedMonthKey": "2026-10", "topics": ["がん", "栄養", "公衆衛生"], "clinicalAreas": ["患者教育", "予防", "慢性疾患管理"], "audiences": ["成人", "高齢者", "地域住民"], "evidenceType": "観察研究", "practiceImpact": "medium", "actionPoint": "超加工食品の摂取とがんリスクの関係は食品の種類により異なり、個別具体的な情報提供が重要であることを認識する。"}, {"id": "5c20cefa13126000c5bcb1c45e69ce96", "sourceName": "Europe PMC", "originalTitle": "A structured framework for assessment of rehabilitation and sick-listing (STARS) - experiences among healthcare professionals.", "titleJa": "リハビリと休業評価の構造化フレームワーク STARS：プライマリケア職員の経験", "summaryHtml": "病気休業（sick-listing）のプロセスは、患者にとっても職員にとっても不確かで分かりにくいと感じられがちである。スウェーデン南東部地域で開発された STARS は、リハビリと休業の評価を構造化する7つの方法論ツールからなるフレームワークである。本研究は、プライマリケア職員が STARS に沿って働く経験を質的に探究した。<br><br>休業プロセスに臨床的に関わる医師、リハビリコーディネーター、その他の医療専門職37名を対象に、7回のフォーカスグループ討論を行い、Braun & Clarke の主題分析で分析した。<br><br>職員の経験は「可能にする構造としての STARS」という上位テーマで表され、リハビリコーディネーター（RECO）機能による役割と責任の明確化などが抽出された。不透明だったプロセスに共通の型を持ち込むことが、多職種連携の土台になることを示唆している。<br><br>看護実務への示唆としては、評価や判断のプロセスが属人化している場面では、共通のフレームワークやツールを導入することで、役割の明確化と記録の一貫性が得られます。地域連携の場面でも応用できる視点です。", "url": "https://europepmc.org/article/MED/42900467", "publishedAt": "2026-10-20T00:00:00.000Z", "publishedDateKey": "2026-10-20", "publishedMonthKey": "2026-10", "topics": ["リハビリ"], "clinicalAreas": ["リハビリ"], "audiences": ["成人"], "evidenceType": "観察研究", "practiceImpact": "low", "actionPoint": "属人化した評価プロセスには共通フレームワークを導入し、役割と記録を標準化する。"}, {"id": "02f18dfb240e1570ad3146d368f1f257", "sourceName": "Europe PMC", "originalTitle": "Modelling the effect of interventions to prevent MRSA transmission within hospitals in Edmonton, Canada.", "titleJa": "院内 MRSA 伝播の数理モデル：手指衛生とスクリーニング、それぞれの効果を分けて測る", "summaryHtml": "メチシリン耐性黄色ブドウ球菌（MRSA）の院内感染は罹患率・死亡率が高く、複数の予防戦略が存在する。しかし従来の研究は複数の介入をまとめて評価することが多く、個別戦略の効果は明らかでなかった。本研究は、カナダ・エドモントンの医療施設を対象に、MRSA 伝播の新しいコンパートメントモデルを構築した。<br><br>モデルは、市中・院内由来の保菌・感染患者と隔離患者を区別し、ベイズ統計とマルコフ連鎖モンテカルロ法で実データからパラメータを推定した。その上で、医療者の手指衛生とスクリーニングという2つの介入の実施率を変え、保菌・感染患者数への影響を個別に検討した。<br><br>複合介入としてしか測れなかった感染対策を、要素ごとに分解して効果を見積もる枠組みを提示した点に意義がある。限られた資源の中でどの対策を優先すべきかという、感染管理の意思決定に資する知見である。<br><br>看護実務への示唆としては、手指衛生のような基本動作も、モデルで効果が可視化されると優先順位の根拠になります。自部署の対策を「全部大事」で終わらせず、効果の大きい要素から徹底する視点が有用です。", "url": "https://europepmc.org/article/MED/42953720", "publishedAt": "2026-10-19T00:00:00.000Z", "publishedDateKey": "2026-10-19", "publishedMonthKey": "2026-10", "topics": ["公衆衛生"], "clinicalAreas": ["病棟", "感染対策"], "audiences": ["成人", "高齢者"], "evidenceType": "観察研究", "practiceImpact": "medium", "actionPoint": "感染対策は要素ごとの効果を意識し、手指衛生など効果の大きい基本動作から徹底する。"}, {"id": "128cebdebee2d37d3e42d5961b481e69", "sourceName": "Europe PMC", "originalTitle": "Conservatism in clinical decision-making: a concept analysis.", "titleJa": "臨床意思決定における「保守主義」の概念分析：防御医療との違いを明確にする", "summaryHtml": "臨床意思決定における「保守主義（conservatism）」は多面的な概念だが、その意味と役割は十分に整理されておらず、防御医療との混同が不適切な判断や不要な介入につながる可能性が指摘されてきた。本研究は Walker & Avant の方法による概念分析である。<br><br>PubMed/MEDLINE、Scopus、Web of Science、CINAHL を期間制限なく検索し、スクリーニングされた2,401件から適格な19文献を分析対象として、定義属性、先行要件、関連概念、帰結を抽出・統合した。<br><br>臨床意思決定における保守主義の中核属性は、注意深い経過観察とモニタリング、リスクとベネフィットの衡量、共同意思決定、科学的根拠と臨床経験への依拠の4つだった。「何もしないこと」ではなく、根拠に基づいて見守る積極的な姿勢として概念が明確化され、看護実践における判断の言語化にも役立つ整理である。<br><br>看護実務への示唆としては、「介入しない」という判断も、観察計画と根拠を伴えば積極的な臨床判断であることをチームで共有し、記録に残すことが、過剰介入の防止と判断の質の担保につながります。", "url": "https://europepmc.org/article/MED/42965127", "publishedAt": "2026-10-11T00:00:00.000Z", "publishedDateKey": "2026-10-11", "publishedMonthKey": "2026-10", "topics": ["公衆衛生"], "clinicalAreas": ["患者教育"], "audiences": ["成人", "高齢者"], "evidenceType": "観察研究", "practiceImpact": "medium", "actionPoint": "「見守る」判断は観察計画と根拠をセットで記録し、積極的な臨床判断として共有する。"}, {"id": "863f5c8fb1c9217e1de33fd887b30b9e", "sourceName": "Europe PMC", "originalTitle": "Physicians' perspectives of palliative care quality in nursing homes: a cross-sectional study.", "titleJa": "介護施設の緩和ケアの質：ノルウェーの施設医師77名の評価と改善課題", "summaryHtml": "介護施設（ナーシングホーム）における緩和ケアの質について、医療治療の主たる責任を負う医師の視点は、サービスの評価と改善に重要な知見を与えるが、研究は少なかった。本研究はノルウェーの施設医師を対象に、緩和ケアの質の認識を調査した横断研究である。<br><br>2022年11月から2023年12月に、施設医師77名（回答率43.5%）が、患者視点の質評価尺度 QPP-PC の短縮版を医療者向けに適応した質問票に回答した。記述統計と Wilcoxon 符号順位検定で分析された。<br><br>医師たちは「医療技術的コンピテンス」と「社会文化的雰囲気」の2つの側面で、ケアの重要度に比べて実際の質を有意に低く評価していた。24項目中9項目、症状に特化した追加質問7つのうち3つでも同様の乖離が見られ、施設緩和ケアには改善の余地が大きいことが示された。<br><br>看護実務への示唆としては、施設の緩和ケアでは、症状緩和の技術面だけでなく、施設の雰囲気や文化といった側面も質として意識し、医師の評価とのギャップを多職種で共有することが改善の出発点になります。", "url": "https://europepmc.org/article/MED/42834000", "publishedAt": "2026-10-05T00:00:00.000Z", "publishedDateKey": "2026-10-05", "publishedMonthKey": "2026-10", "topics": ["公衆衛生"], "clinicalAreas": ["患者教育"], "audiences": ["高齢者"], "evidenceType": "観察研究", "practiceImpact": "medium", "actionPoint": "施設緩和ケアの質は技術面と雰囲気・文化の両面で振り返り、多職種でギャップを共有する。"}]};

    const list = document.getElementById('list');
    const meta = document.getElementById('meta');
    function esc(s){return (s||'').replace(/[&<>"]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));}
    function render(){
      const query = (q.value || '').trim().toLowerCase();
      const topic = topicSelect.value;
      const impactValue = impact.value;
      const filtered = (DATA.articles || []).filter(a => {
        const hay = [a.titleJa, a.originalTitle, a.sourceName, a.summaryHtml].join(' ').toLowerCase();
        if (query && !hay.includes(query)) return false;
        if (topic && !(a.topics || []).includes(topic)) return false;
        if (impactValue && a.practiceImpact !== impactValue) return false;
        return true;
      });
      meta.textContent = `更新: ${DATA.updatedAt || '-'} / 表示件数: ${filtered.length}件`;
      list.innerHTML = filtered.map(a => `
        <article>
          <div class="src">${esc(a.sourceName || '')} / ${esc((a.publishedAt || '').slice(0,10))}</div>
          <h2>${esc(a.titleJa || a.originalTitle || '')}</h2>
          <div class="tags">${(a.topics || []).map(t => `<span class="tag">${esc(t)}</span>`).join('')}${a.evidenceType ? `<span class="tag">${esc(a.evidenceType)}</span>` : ''}${a.practiceImpact ? `<span class="tag">impact:${esc(a.practiceImpact)}</span>` : ''}</div>
          <div class="summary">${a.summaryHtml || ''}</div>
          <div class="box">
            <strong>看護実務への示唆</strong><br>${esc(a.actionPoint || '要点を一次情報で確認し、現場文脈へ落とし込んで判断してください。')}<br><br>
            <a href="${esc(a.url || '#')}" target="_blank" rel="noopener">原文を開く</a>
          </div>
        </article>`).join('');
    }
    q.addEventListener('input', render); topicSelect.addEventListener('change', render); impact.addEventListener('change', render); render();
  </script>
</body>
</html>
