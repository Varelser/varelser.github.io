  <script>
    const DATA = {"articles":[{"authors":["Polina Grishanova","Anna Rossin","Sergey Sladkevich","Ivan Gur"],"categories":[],"field":"Frontiers in Psychology","genre":"Consciousness / Philosophy","monthKey":"2026-11","publishedAt":"2026-11-24T00:00:00Z","source":"Frontiers in Psychology","summaryHtml":"高性能航空機のパイロットにとって、加速による意識喪失（G-LOC）は重大な脅威であり、脳血流の低下とそれに続く低酸素が主因とされる。現行の生理モニタリングではこうした事態を確実に捉えたり予測したりできない。本レビューは、呼気に含まれる揮発性有機化合物（VOC）の分析が、非侵襲でリアルタイムのG-LOC検出法になりうるかを検討した。<br><br>G-LOCの病態である急性の脳低酸素、酸化ストレス、脂質過酸化、血行動態の変化は、呼気VOCプロファイルに測定可能な変化をもたらす可能性がある。候補バイオマーカーとして、急性の血行動態変化を反映するイソプレンや、酸化ストレス・脂質過酸化の産物であるペンタナール、4-ブチロラクトン、ペンタンが挙げられた。分析技術としては、網羅的な探索にガスクロマトグラフィー質量分析（GC-MS）、標的化したリアルタイム検証にSIFT-MSとPTR-MS、携帯型の機内展開には電子鼻（E-Nose）という多層的な組み合わせが提案された。<br><br>ただし現状の根拠は間接的で、数分間の低酸素曝露から得られたものが中心であり、G-LOCの数秒間の血流低下で呼気に信号が現れるか、まして予測に足る速さで届くかは未検証である。論文は知識の空白を整理し、段階的な研究ロードマップを示した。出典：Frontiers in Psychology","timestamp":1795478400000,"title":"Identifying potential exhaled breath volatile organic compound markers for the detection of acceleration induced loss of consciousness (G-LOC)","titleJa":"呼気の匂いで意識喪失を察知する――戦闘機パイロットのG-LOC検出への新提案","url":"https://www.frontiersin.org/articles/10.3389/fpsyg.2026.1969387"},{"authors":["C. Richard Spates","Richard W. Seim","Rakeshwar S. Guleria","Lisa Baker"],"categories":[],"field":"Frontiers in Neuroscience","genre":"Psychedelics / Trauma","monthKey":"2026-11","publishedAt":"2026-11-24T00:00:00Z","source":"Frontiers in Neuroscience","summaryHtml":"曝露療法はトラウマ・恐怖関連障害に対する実証的に最も支持された心理療法の一つだが、効果の仕組みをめぐる議論は続き、効果量は20年間ほとんど伸びず、脱落も多い。従来の説明はセッション中の覚醒維持や恐怖の低減に重きを置いてきたが、実証的な支持は一貫しない。本論文は、治療変化を「治療パッケージの名前」ではなく、記憶の更新にかかる分子レベルのタイミング制約から理解し直す枠組みを提案した。<br><br>根拠は三つの流れからなる。第一に、EMDRの分解試験とそのメタ分析では、眼球運動や明示的な認知再構成に確かな追加効果は認められなかった。第二に、筆者らの統制研究では、短時間の曝露を間隔をあけて行う方法が、長時間の曝露と同等以上の成果を、より少ない嫌悪的覚醒で得た。第三に、非神経細胞の研究では、同じ総量でも間隔をあけた刺激の方が、ERK依存的にCREBを介した遺伝子活性化を強く長く引き起こした。<br><br>これらを統合したドーパミン-オピオイド/CREB-ERK（DOCE）枠組みは、ドーパミンの予測誤差シグナルとオピオイド系の安全シグナルが、再固定化や消去の定着を通じて恐怖記憶の更新に寄与すると考える。ドーパミンとオピオイドの証拠は混在・限定的であることも明記し、再固定化と消去を区別する予測や、間隔パラメータ、薬理タイミング、神経画像の検証可能な仮説を示した。出典：Frontiers in Neuroscience","timestamp":1795478400000,"title":"The biology of therapeutic spacing: a CREB-ERK memory-updating framework linking stress neurocircuitry to exposure-based trauma treatment","titleJa":"トラウマ治療は「間隔」が鍵――CREB-ERK経路から読み解く曝露療法の仕組み","url":"https://www.frontiersin.org/articles/10.3389/fnins.2026.1988018"},{"authors":["Tao Qu","Ruizhe Chen"],"categories":[],"field":"Frontiers in Psychology","genre":"LLM / NLP","monthKey":"2026-11","publishedAt":"2026-11-24T00:00:00Z","source":"Frontiers in Psychology","summaryHtml":"大学生のLLM利用が広がるなか、使い方の違いが批判的思考とどう関わるかを調べた研究。544人の大学生を対象に、LLM利用パターン、課題評価、批判的思考の尺度で調査し、構造方程式モデリングなどで分析した。期待価値理論に基づき、利用を「説明的利用」と「生成的利用」に分けて検討した。<br><br>説明的に使う学生ほど課題価値を高く評価し（r=0.735）、批判的思考も高かった（r=0.694）。課題価値は批判的思考を強く予測し（β=0.565）、説明的利用と批判的思考の関係の56.74%を媒介した。一方、生成的利用は批判的思考との全体的な関連は有意でなく、課題コスト（努力・機会・心理的負担）と強く結びついた（β=0.561）。<br><br>説明的利用が高く生成的利用が低い「探索者」タイプは負担が最も低く、課題価値を高く感じる学生ほど「近道」型（説明的利用が低く生成的利用が高い）になりにくかった（59.3%減）。LLMを丸投げするのではなく、理解のために説明的に使うことが思考力を育て、価値ある課題設計がその鍵になるという。出典：Frontiers in Psychology","timestamp":1795478400000,"title":"The relationship between LLM usage and critical thinking among college students: the mediating role of task assessment","titleJa":"LLMの使い方が大学生の批判的思考を分ける――説明的に使うほど思考力が高まる","url":"https://www.frontiersin.org/articles/10.3389/fpsyg.2026.1993114"},{"authors":["Aleš Oblak","Sara Rigler","Katja Horvat Golob","Klara Jamnik","Grega Repovš","Jurij Bon"],"categories":[],"field":"Frontiers in Psychology","genre":"Consciousness / Philosophy","monthKey":"2026-11","publishedAt":"2026-11-24T00:00:00Z","source":"Frontiers in Psychology","summaryHtml":"感情制御の研究では、方略の分類が認知的・神経的に異なる過程を混同しており、研究間の比較や結論の統合が難しいという問題があった。そこで本研究は経験的現象学の手法を用い、感情刺激への曝露とワーキングメモリのnバック課題を組み合わせた認知・感情課題の最中に、参加者が何をどう経験しているかを調べた。健常者30名が感情的な画像を見ながら、感情に没入するか中立を保つよう調整しつつ課題を遂行し、1試行ごとの体験を複数の質的手法を組み合わせた現象学的インタビューで掘り下げ、構成主義的グラウンデッド・セオリーで分析した。<br><br>参加者は、実験で用いる画像は自発的な感情反応を引き起こす力が弱く、共感や意味づけ（センスメイキング）によって感情を自ら能動的に構成していたと語った。意味づけは知覚・概念的理解・身体化された感情を統合する動的で物語的な過程であり、感情は予期、かすかな兆し、十分な発達、終息あるいは持続という複数の時間スケールで展開した。試行ごとに感情を自発的に構成していたにもかかわらず、否定的な気分が蓄積することもあった。従来の感情制御方略はめったに現れず、現れても人それぞれだった。<br><br>感情体験は実験室の課題の中でも受動的に生じるのではなく能動的に構成されることが多く、感情生成の能動的要素を今後の研究で検証する必要がある。感情制御の分類を洗練させるうえでも、体験の質的な側面を捉える現象学的手法の有用性を示した。出典：Frontiers in Psychology","timestamp":1795478400000,"title":"Vibing out with the task: qualitative insights into sensemaking during cognitive-affective task performance","titleJa":"「課題と一緒に漂う」――認知・感情課題における意味づけの質的探究","url":"https://www.frontiersin.org/articles/10.3389/fpsyg.2026.1711296"},{"authors":["Matthias Pillny","Kai Härpfer","Hannes Per Carsten","Anja Riesel","Julia Klawohn","Tania Marie Lincoln"],"categories":[],"field":"OSF Preprints","genre":"Consciousness / Philosophy","monthKey":"2026-11","publishedAt":"2026-11-24T00:00:00Z","source":"OSF Preprints","summaryHtml":"アンヘドニア（快感消失）は、目の前の快楽そのものの低下ではなく、思い出したり想像したりしたポジティブな体験から感情的価値を生み出すことの困難かもしれない。ただし、直接の刺激曝露・記憶の想起・未来の想像という異なる局面で感情処理がどう関わるか、否定的感情の役割も含めて明らかでなかった。本研究は事前登録のもと、アンヘドニアの程度が異なる非臨床の成人48名を対象に、画像の閲覧・想起・未来想像中の神経反応と主観的感情を調べた。<br><br>各試行4000ミリ秒のあいだ、後期陽性電位（LPP）を400〜4000ミリ秒で測定し、感情価と想像の鮮明さの主観評定も併せて取得した。想起の場面では、アンヘドニアが高いほどポジティブな記憶に対するLPPの分化（1000〜2000ミリ秒と2000〜3000ミリ秒）が弱まり、ポジティブな記憶に対する快感情の評定も低かった。一方、符号化や未来想像の場面では、感情価に依存したLPPの関連は有意でなかった。<br><br>ポジティブな記憶に対する感情処理の変容がアンヘドニアと関連することが示され、感情反応全般や心的表象の鮮明さの違いも併せて検討すべきだとされた。うつ病圏の症状理解や、記憶に働きかける介入の手がかりになる可能性がある。出典：OSF Preprints","timestamp":1795478400000,"title":"Anhedonia and Emotional Processing of Past- and Future-Directed Mental Representations: Behavioral and Event-Related Potential Evidence","titleJa":"快感消失は「思い出す喜び」の障害か――記憶と想像における感情処理のERP証拠","url":"https://osf.io/preprints/psyarxiv/mh6jw_v1/"},{"authors":["Ádám Stefkovics"],"categories":[],"field":"OSF Preprints","genre":"LLM / NLP","monthKey":"2026-11","publishedAt":"2026-11-23T00:00:00Z","source":"OSF Preprints","summaryHtml":"大規模言語モデルが今や科学文献の多くを編集している。人のフィードバックで調整されたモデルは不確実性の表現を避ける傾向がある。本研究は、LLMによる編集が社会科学者の主張の強さを変えたかを問うた。2015〜2026年に1445誌に掲載された社会科学論文42万526件の抄録を調べたところ、GPT-4o系モデルで編集された文に一致する文の割合は2019〜22年の約2%から2026年には52%へ上昇していた。<br><br>2015〜22年の傾向に反して、2024〜26年の抄録では「may」などの様相のヘッジが14%減り、「demonstrate」などの強い動詞が3分の1増えた。1万4527件の抄録をコード化した部分標本では、ヘッジのない因果的主張の割合が2019〜22年の傾向を4.2ポイント上回った。917誌にわたり、ヘッジの減少と証拠動詞の増加はLLMの普及度とともに大きくなり、ChatGPT登場後にのみ現れた。<br><br>2019〜22年の抄録200件をGPT-4o系で編集する実験でも、ヘッジの除去、強い動詞の倍増、暗黙の因果的主張の追加が誌面レベルの変化と同程度に生じ、盲検の読者は一流誌向けの編集が主張を強めたと判断した。GPT-5 miniでも同様の傾向があったが、現行のGPT-6モデルは強い動詞もヘッジなし因果主張も純増させず、Claude Sonnet 5.5は抄録を断定的にしなかった。主張の強まりの程度は著者が使うモデルに依存する。出典：OSF Preprints","timestamp":1795392000000,"title":"Large language models made social science claims more assertive","titleJa":"LLMの校正が社会科学の主張を断定的にした――42万件の抄録にみる変化","url":"https://osf.io/preprints/socarxiv/9ames_v1/"},{"authors":["Carla Daniele","Giuseppe D’Avenio","Sandra Morelli","Cecilia Poli"],"categories":[],"field":"Frontiers in Artificial Intelligence","genre":"Ethics / Safety","monthKey":"2026-11","publishedAt":"2026-11-23T00:00:00Z","source":"Frontiers in Artificial Intelligence","summaryHtml":"医療機器ソフトウェアは現代医療の中心要素となり、市場は急速に拡大している。診断画像の解析からデジタル治療まで、AIと機械学習を使う製品が増えている。EUでは医療機器規則（MDR）または体外診断用医療機器規則（IVDR）が、資格認定、リスク分類、適合性評価、市販後調査を定めている。<br><br>2026年8月に適用が始まったAI法は第二の枠組みを重ねる。MDR・IVDRのもとで第三者による適合性評価を受けるAI医療機器ソフトウェアは、AI法では一般にハイリスクAIに分類され、品質管理、データガバナンス、透明性、人的監視、インシデント報告の追加要件が課される。<br><br>研究は両枠組みの共存から生じる主なギャップを挙げる。重なるが同一でない品質管理と市販後調査の義務、低リスク製品の調査義務の違い、インシデント報告の閾値のずれ、実世界で試験される適応型システム、院内製デバイスの免除、類似の役割の責任のずれ、臨床応用に組み込まれた汎用AIモデルの資格、認証機関のAI評価能力の不足である。関係する委員会による速やかなガイダンスが、製造業者と利用者の双方に規制の確実性をもたらすという。出典：Frontiers in Artificial Intelligence","timestamp":1795392000000,"title":"Critical points of conformity assessment of medical device software based on artificial intelligence in the European Union","titleJa":"EUにおけるAI医療機器ソフトウェアの適合性評価――AI法と医療機器規則の交錯","url":"https://www.frontiersin.org/articles/10.3389/frai.2026.1937428"},{"authors":["Jeffrey Lambert","Noah Marshall","Maria Loades","Nathalia Gjersoe","Grace Thomas","Myles-Jay Linton"],"categories":[],"field":"JMIR Mental Health","genre":"LLM / NLP","monthKey":"2026-11","publishedAt":"2026-11-23T00:00:00Z","source":"JMIR Mental Health","summaryHtml":"生成AIツールは健康情報や心の支えを求める場面で広がっているが、デジタルリテラシーが高くメンタルヘルスの需要も大きい大学生が、メンタルヘルス支援にどう使っているかは分かっていなかった。本研究は英国のある大規模大学の学生を対象に、過去6か月間の生成AI利用の広がりと、利用と結びつく属性を調べた。<br><br>招待した2万2207人のうち2020人（回答率9.1%）が回答し、25.0%（503人）が過去6か月にメンタルヘルス支援目的で生成AIを使っていた。用途は、感情的に苦しいときの助言が380人（19.3%）、メンタルヘルスへの気づきが256人（12.7%）、パーソナルなセラピストやコーチとしての利用が173人（8.6%）で、自傷の思いを抱えたときの支援を求めた人も54人（2.7%）いた。<br><br>利用は26〜29歳、アジア系、障害を申告した学生、経営学系の学生、ウェルビーイングが低い学生で多かった。回答者の約4人に1人が使っており、とくに支援を必要とする層で非公式な相談経路として機能していることが示唆される。大学や医療サービスは、生成AIを相談経路の一つとして想定し、適切な案内や既存サービスとの連携、安全な利用の仕組みを整える必要があるという。出典：JMIR Mental Health","timestamp":1795392000000,"title":"Generative AI Use for Mental Health Support Among Students at a UK University: Cross-Sectional Study","titleJa":"生成AIをメンタルヘルス支援に使う学生は4人に1人――英国大学の横断調査","url":"https://mental.jmir.org/2026/1/e96196"},{"authors":["C. Kalaiarasi","M. Asha Jerlin"],"categories":[],"field":"Frontiers in Artificial Intelligence","genre":"Ethics / Safety","monthKey":"2026-11","publishedAt":"2026-11-23T00:00:00Z","source":"Frontiers in Artificial Intelligence","summaryHtml":"機械学習と深層学習は侵入検知システムの性能を高めたが、手法が複雑になるほど結果の透明性と信頼性の検証は難しくなる。説明可能AIを組み込んだ侵入検知の研究は、アーキテクチャや応用領域、連合学習、グラフ手法、ドメイン横断の観点で断片化していた。本サーベイは、検知の有効性、説明の質、ドメイン横断の移植性、導入上の制約の4基準で体系的に比較した。<br><br>比較から4つの成果物をまとめた。既存サーベイの7次元比較、説明可能性の性質とデータセットに結びつけた攻撃の分類、ドメイン横断の移植性のための因果的説明可能AIの定義、9種類の導入形態に対応する実務者向け判断マトリクスである。報告される深層学習の精度は99.98%に達し、XG-NIDは3つのドメイン横断データセットでF1スコア97%、93%、76%を示した。<br><br>因果推論を加えたCIADAはドメイン横断精度97.52%と平均9.62%の改善を報告したが、独立した再現はされておらず、因果的転移可能性の基準も実証ではなく形式的な提案にとどまる。連合型の説明可能AI侵入検知は精度85〜88.40%だった。データセットの異質性と説明に関する評価の不足から直接比較は限られ、導入場面を問わず優れた単一の手法は示されていない。出典：Frontiers in Artificial Intelligence","timestamp":1795392000000,"title":"Beyond black-box detection: a survey of explainable artificial intelligence for trustworthy intrusion detection across classical and quantum paradigms","titleJa":"ブラックボックスを超える侵入検知へ――説明可能AIによる信頼できるIDSの展望","url":"https://www.frontiersin.org/articles/10.3389/frai.2026.1929727"},{"authors":["Arthur Bran Herbener","Filip Skjold Thidemann","Caroline Gjørtsvang Kock","Malene Flensborg Damholdt"],"categories":[],"field":"OSF Preprints","genre":"LLM / NLP","monthKey":"2026-11","publishedAt":"2026-11-23T00:00:00Z","source":"OSF Preprints","summaryHtml":"AIが生成したと表示された支援の言葉は、人間が書いたものより共感が低く受け取られるという報告があるが、証拠はまちまちで、共感の捉え方や測り方によって効果が変わるのかは不明だった。本研究は、支援コミュニケーションにおける発信源の表示（人間かAIか）が知覚される共感に与える影響を、系統的レビューとメタ分析で調べた。<br><br>10件の文献から18件の独立した研究（計1万3541人）を特定した。発信源の表示による効果は、一般的共感でg=0.41、認知的共感でg=0.39、動機づけ的共感でg=0.42と小さく、感情的共感ではg=0.50と中程度だった。ただし研究間のばらつきは大きかった。<br><br>性別が一般的共感の調整要因として一度は有意に見えたが、影響の大きい2件の外れ値を除くと有意でなくなった。年齢、提示の形式（場面提示か一人称のやり取りか）、支援の場面による調整効果も有意ではなかった。研究間の大きなばらつきの原因はほぼ未解明のままで、発信源の表示の効果がどのような条件で生じ、やり取りの中で持続するのかを今後調べる必要がある。出典：OSF Preprints","timestamp":1795392000000,"title":"AI versus human source attribution and perceived empathy in supportive communication: A systematic review and meta-analysis","titleJa":"AIと書かれると共感は薄れるのか――支援コミュニケーションのメタ分析","url":"https://osf.io/preprints/psyarxiv/mb3rp_v1/"},{"authors":["Ruijie Luo","Yuehong Huang","Chenxia Xue","Qiuyi Yu","Nantu Hu","Yuxuan Wei","Hongxiang Liu","Steven Dirk Laureys","Haibo Di","Jianjun Meng"],"categories":[],"field":"Journal of Neural Engineering","genre":"Consciousness / Philosophy","monthKey":"2026-11","publishedAt":"2026-11-23T00:00:00Z","source":"Crossref","summaryHtml":"遷延性意識障害（DOC）の診断・予後評価では脳波（EEG）が客観的な指標になるが、従来の課題遂行型パラダイムは患者の残存する意識と課題の要求が合わないことや、機械学習による個別評価の限界があった。本研究は、音の系列に含まれる大域的な規則性への「期待」を読み取ることで、負担の小さい検出法を提案した。局所―大域パラダイムを改変し、正準相関分析・主成分分析・xDAWNによる特徴抽出を用いた3種の単一試行分類枠組みを開発し、単一試行の分類結果に基づく意識評価基準も定めた。<br><br>健常者での実験では、大域的規則性に関わる事象関連電位の主成分が新手法でも保たれ、従来の局所―大域パラダイムと比べて大域効果の単一試行分類性能が最大15%向上した。改善の要因は、大域効果に対するEEG応答の差の拡大と、試行間の神経状態の安定化だった。20人のDOC患者コホートでは、提案した評価基準が診断のバランス精度68.8%（感度50%、特異度87.5%）、予後のバランス精度60.5%（感度50%、特異度71%）を達成した。<br><br>音系列への期待の解読により、患者に課題を課さず個別に診断・予後を評価できることが示され、EEGによる意識評価の臨床応用が前進した。ただし感度は50%にとどまり、意識があっても検出できない患者が半数いる点が限界で、診断の補助として位置づけられる。出典：Crossref（Journal of Neural Engineering）","timestamp":1795392000000,"title":"Decoding sequence auditory expectations for clinical diagnostic and prognostic assessment of prolonged disorders of consciousness","titleJa":"音の並びへの期待を読み取る――遷延性意識障害の診断と予後を低負担で評価するEEG手法","url":"https://doi.org/10.1088/1741-2552/aebdcf"},{"authors":["Eamonn Eeles","Phillip Karpati","David Tran","Julian Ray"],"categories":[],"field":"Delirium","genre":"Consciousness / Philosophy","monthKey":"2026-11","publishedAt":"2026-11-23T00:00:00Z","source":"Crossref","summaryHtml":"意識はアクセス意識（A）と現象意識（P）の共同発現から生じるという、閾値ベースの身体化意識モデルが提案された。理論から導いた閾値を測定可能な行動の代理指標で操作化した。せん妄は、意識レベル（LoC）が保たれたままAとPが同時に乱れる「二要因の失敗」として現れ、LoCを失う昏睡や、A・Pいずれか一方だけの乱れとは区別される。<br><br>モデルは、AまたはPのいずれかが閾値下にあるだけでせん妄への脆弱性が高まると予測する。A・Pの相互作用が身体化された意識をどう生み出すかについて整合的な機序の説明を与え、臨床状態の乱れを統一的に解釈する枠組みになる。閾値下のA・Pをせん妄の前駆マーカーとみなすことで、より早期の検出や診断の区別が可能になる。<br><br>せん妄を注意や全般的認知の障害としてのみ捉えるのではなく、身体化された意識の状態レベルの乱れとして概念化し直す提案である。理論モデルであり、閾値の実証的な検証は今後の課題だが、意識の二側面を結びつける枠組みとして臨床と理論の双方に示唆がある。出典：Crossref（Delirium）","timestamp":1795392000000,"title":"Delirium and the subthreshold model of embodied consciousness","titleJa":"せん妄と身体化された意識の「閾値下モデル」――アクセス意識と現象意識の二重の乱れ","url":"https://doi.org/10.56392/001c.172534"},{"authors":["David M. Horton","Jacob S. Aday","John P. Donnelly","Kevin F. Boehnke","Christopher R. Nicholas"],"categories":[],"field":"Psychopharmacology","genre":"Psychedelics / Trauma","monthKey":"2026-11","publishedAt":"2026-11-23T00:00:00Z","source":"Crossref","summaryHtml":"サイケデリクス支援療法は大うつ病やPTSDなどで有効性を示してきたが、実装に関する研究が乏しく、実臨床への移行が損なわれる恐れがある。有効性が示された介入でも、現場での運用を支える実装の工夫が欠かせない。本論文は、実装科学の枠組みと手法を今後の第2〜4相臨床試験に取り入れる方法を示し、実臨床での運用に役立つ知見を得る道筋を提示した。<br><br>臨床効果の評価と実装データの収集を同時に行うハイブリッド第1型試験が、現在の実装研究の空白を埋められるとする。実装の枠組みと原則に基づき、従来型の二群間有効性試験と要因最適化試験という2種類のハイブリッド第1型試験の原型を提案し、将来の臨床研究や初期実装研究に資するデータ収集と分析を促した。<br><br>臨床研究者が実装の概念・枠組み・手法を取り入れる出発点となる提案で、効果の評価と実装の評価を統合した試験設計により、多様な臨床現場でのサイケデリクス介入の体系的な評価を支える。正式な実装研究の時期と強さは、介入の成熟度と各段階で答えられる問いに合わせるべきだとしている。出典：Crossref（Psychopharmacology）","timestamp":1795392000000,"title":"Integrating implementation science in psychedelic-assisted therapy research: translational research methods and design considerations","titleJa":"サイケデリクス支援療法に実装科学を組み込む――臨床試験の設計と実臨床への橋渡し","url":"https://doi.org/10.1007/s00213-026-07217-2"},{"authors":["Attila Hangai","Dániel Attila Kovács"],"categories":[],"field":"Elenchos","genre":"Consciousness / Philosophy","monthKey":"2026-11","publishedAt":"2026-11-23T00:00:00Z","source":"Crossref","summaryHtml":"プロティノスは『エンネアデス』第4論集3章31節で、表象（ファンタシア）の力が二つあり、それぞれ高次の魂と低次の魂に属すると説いた。本論文はこのテーゼを、プロティノスの二つの魂の心理学と記憶論の帰結として位置づけ、従来の解釈――説明不能な問題を解くために導入されたとする見方と、一つの表象力に二つの側面があるとする見方――と批判的に向き合う。<br><br>このテーゼは、分裂した心理学と意識の統一のあいだの深い緊張を露わにする。動機の葛藤の場面では、対立する動機が異なる形而上学的主体に属するにもかかわらず、私たちの意識経験は統一されたままである。論文は、この枠組みのなかで葛藤の事例を分析することで、プロティノスが二つの異なる意識中心の協働に基づく意識の統一の独自の説明を展開したことを示す。<br><br>論文の結論として、プロティノスは意識の統一を、意思決定の最終的な座としての高次の魂の役割が与える行為主体性の統一に基礎づけることを示唆したという。古代の魂論が現代の意識の統一問題に直接つながる論点であることが示された。出典：Crossref","timestamp":1795392000000,"title":"Plotinus’ Two Powers for Representation and the Unity of Consciousness","titleJa":"プロティノスの表象の二つの力と意識の統一――動機の葛藤における一つの経験","url":"https://doi.org/10.1515/elen-2026-0015"},{"authors":["Amanda L. Elmore","Kris Dalebout","Amber Hernandez","Anusha Parajuli","Benjamin R. Cummins","P. Mimi Bhatt","Danielle F. Haley"],"categories":[],"field":"Frontiers in Public Health","genre":"Psychedelics / Trauma","monthKey":"2026-11","publishedAt":"2026-11-23T00:00:00Z","source":"Crossref","summaryHtml":"女性は精神疾患や物質使用障害の負担が大きいにもかかわらず、サイケデリクス支援療法の研究では過小にしか扱われてこなかった。登録試験の多くは初期段階にとどまり、生物学的・ホルモン的な性差が治療反応や安全性に影響しうるにもかかわらず、性別で結果を報告する試験は少ない。本展望論文は、連邦・州の政策がサイケデリクスへのアクセスを急速に変えつつある米国に焦点を当てる。<br><br>著者らは女性に特化した査読論文と米国の規制・政策文書のナラティブレビューをもとに、社会生態学的モデルとトランスレーショナル・リサーチ・コンティニュアムを適用し、女性の排除がなぜ続き、証拠のパイプラインがどこで途切れるかを検討した。その結果、規制の枠組みや臨床ガイドラインが性別・ジェンダー別の分析と報告を欠いていることが示された。<br><br>論文は、疫学や実装科学、サーベイランスなどの公衆衛生の手法がこの隔たりの解消に役立つとし、研究者にはSAGER報告ガイドラインの採用と生殖関連変数の記録、資金提供者には重点的な資源配分、規制当局には性別共変量の事前指定と性別別報告の義務づけを求める。投与プロトコルや選定基準が成文化されるいま、公平性を組み込む機会は狭まりつつあると結論づけた。出典：Crossref","timestamp":1795392000000,"title":"Advancing women-centered psychedelic research in the United States: a translational public health agenda","titleJa":"女性中心のサイケデリクス研究を前へ――米国の公衆衛生アジェンダ","url":"https://doi.org/10.3389/fpubh.2026.1955149"},{"authors":["Jodie Louise Russell","Lucienne Spencer","Matthew Broome"],"categories":[],"field":"OSF Preprints","genre":"Consciousness / Philosophy","monthKey":"2026-11","publishedAt":"2026-11-23T00:00:00Z","source":"OSF Preprints","summaryHtml":"現象学的精神病理学では、障害の経験を当事者の視点から捉えることが中心にある。だが研究者の特権的な立場や「部外者」であることが壁になり、当事者の生きた経験を正確に取り込むのは難しい。本論文は、研究者がその特権と部外者の立場をどう乗り越え、障害の経験の構造をより正確かつ倫理的に把握できるかを論じた。まず第1節で、当事者の生きた経験を取り入れる際の問題とその課題を整理する。<br><br>続いて第2節で、フッサールとフィンクにおける現象学的な「遊び」の概念を導入する。第3節ではルゴーネスの議論を手がかりに、遊びの政治的・倫理的な側面を展開し、第4節で遊び心が健康研究にどう応用できるかを検討する。第5節では、遊びが現象学的精神病理学の方法論のなかでどう使えるかの具体例を示している。<br><br>遊びを媒介とすることで、研究者と当事者の双方が安全で包摂的な相互作用のなかで理解を深められる、というのが本論文の提案である。立場の違いを消すのではなく、遊びのなかで対話可能な関係を作る点に意義がある。研究者のあり方そのものを問い直す試みでもある。出典：OSF Preprints","timestamp":1795392000000,"title":"The State of Play: Methodological Reflections on Phenomenological Psychopathology","titleJa":"「遊び」の方法論――現象学的精神病理学における当事者の経験を捉え直す","url":"https://osf.io/preprints/psyarxiv/h5kwj_v2/"},{"authors":["Anna Ciaunica","Earl K. Miller","Shir Atzil","Antonio Criscuolo"],"categories":[],"field":"OSF Preprints","genre":"Neuroscience","monthKey":"2026-11","publishedAt":"2026-11-23T00:00:00Z","source":"OSF Preprints","summaryHtml":"人間の胚は、心拍・呼吸・運動・音声・概日リズムに構造化された母体の脈動的な環境のなかで育つ。本論文は発生学、胎児生理学、発達認知神経科学、時間生物学の知見を統合し、胎児の心臓と胎盤が母体の血行動態に促されて共発達すること、母体のリズムが胎児に届いてその生理を調節しうることを概観した。<br><br>多様な半周期的な入力が、初期のタイミング能力や自律的な自己調節の時間的な参照枠になるというのが本論文の提案である。共調節は内受容感覚やアロスタシスの基盤になるという見方も示された。さらに母胎・母子の二者関係を、概日周期から神経振動まで約7桁の周波数範囲にわたる多尺度の結合振動子系として定式化した。<br><br>健康な共調節の特徴は準安定性――柔軟で一時的な協調であり、各系が自らの傾向を保ちながら適応的に結びつく状態だとする。この枠組みは、二者間の協調ダイナミクスと発達的帰結の関連について検証可能な予測を生む。胎児期の共調節のあり方が、その後の発達にどう結びつくかを問う研究への道筋を示した。「私たちは文字通り、リズムに生まれてくる」。出典：OSF Preprints","timestamp":1795392000000,"title":"Born on Rhythms: Mother–Foetus and -Infant Neurophysiology as a Dynamic System of Metastable Coupled Oscillators","titleJa":"リズムに生まれる――母胎・母子の神経生理学を準安定な結合振動子系として捉える","url":"https://osf.io/preprints/psyarxiv/7abfn_v1/"},{"authors":["Fuqiang Wang","Yaojiang Li","Yunhong Deng","Song Tang","Lixia Deng","Jian Li","Hanbo Chen","Xiao Lu"],"categories":[],"field":"Frontiers in Nutrition","genre":"Consciousness / Philosophy","monthKey":"2026-11","publishedAt":"2026-11-23T00:00:00Z","source":"Crossref","summaryHtml":"意識障害（DoC）の患者は栄養リスクや嚥下障害を抱えやすく、持続的な栄養サポートを要することが多い。血清アルブミンと末梢血リンパ球数から算出される予後栄養指数（PNI）は、全身の栄養・炎症・免疫状態を反映する指標だが、意識転帰との関連は不明だった。本研究は中国・広東三九脳科医院のDoC専門データベースから、2022年1月から2026年7月に入院した2,928例を対象に、入院時PNIと退院時グラスゴー・コーマ・スケール（GCS）スコアの関連を調べた。<br><br>未調整モデルではPNIが10単位上がるごとに退院時GCSが0.794点高かったが、入院時GCSで調整すると関連は大幅に弱まり（β=0.108）、併存疾患や発症から入院までの期間も加味した完全調整モデルでも小さな正の関連が残るのみだった（β=0.099）。PNIと入院中のGCS変化量には有意な関連はなく、非線形性も認められなかった。<br><br>入院時PNIは退院時の意識レベルとわずかに正に関連したが、入院時の意識の重症度を考慮すると説明力はごく小さい。PNIが意識転帰を予測する臨床的な意義は依然不確かであり、縦断的な栄養指標と標準化された意識評価によるさらなる研究が必要だと結論づけられた。出典：Crossref","timestamp":1795392000000,"title":"Association between prognostic nutritional index and consciousness outcomes in patients with disorders of consciousness: a retrospective cohort study","titleJa":"予後栄養指数と意識障害患者の意識転帰の関連――後ろ向きコホート研究","url":"https://doi.org/10.3389/fnut.2026.1984646"},{"authors":["Christoph Adami"],"categories":[],"field":"Crossref","genre":"Consciousness / Philosophy","monthKey":"2026-11","publishedAt":"2026-11-23T00:00:00Z","source":"Crossref","summaryHtml":"機械は感覚（sentience）をもてるのか。周囲を感じ、意識をもつことは可能なのか。ファインマンの「作れないものは理解できない」という言葉を引き、クリストフ・アダミは人工知能への一つの道筋を示す。ダーウィンの進化の過程を用いて人工の脳を作り、移動ロボットに搭載することで、身体をもった感覚的な機械の実現を目指すという構想である。汎用知能への到達という大きな目標に向けた、進化による人工脳という一つの可能な経路を論じる連載の一編である。<br><br>本稿はその連載の一編で、進化によって生まれた人工脳をロボットプラットフォームに接合し、完全に身体化された感覚的な機械へ至る道を論じる。感覚の実現可能性だけでなく、そうした試みに伴う危険や、それに着手すること自体の倫理的な是非も問いとして掲げている。<br><br>意識をもつ機械という問いを、進化と身体化という具体的な工学の道筋に落とし込む点が特徴である。生命の進化が知能を生んだ過程を人工的にたどることで、感覚をもつ機械の実現可能性を問う。人工生命と人工知能の接点から、汎用知能への代替的な経路を提示する論考といえる。出典：Crossref","timestamp":1795392000000,"title":"The Path From Artificial Life to Artificial Intelligence","titleJa":"人工生命から人工知能への道――機械は感覚をもてるのか","url":"https://doi.org/10.1162/artl.a.503"},{"authors":["Sunbowen Li","Dandan Song","Shengkun Ma","Xuanning Cao"],"categories":["cs.CL"],"field":"arXiv","genre":"LLM / NLP","monthKey":"2026-11","publishedAt":"2026-11-23T00:00:00Z","source":"arXiv","summaryHtml":"大規模言語モデルのポストトレーニングでは、異なる教師やアルゴリズム由来の多様な推論軌跡を混ぜて学習させることが常態化している。しかし、明示的なモード条件づけなしに、標準的な教師ありファインチューニング（SFT）がそうした異種の推論方略を学べるのかは明らかでなかった。本研究は混合の定式化と統制実験で、異種推論の学習可能性と局所的なボトルネックを調べた。<br><br>理論面では、最適な自己回帰モデルが潜在的な推論混合と表現上両立する条件を定式化した。幅優先探索と深さ優先探索の軌跡を対にした検証可能な記号グラフ探索環境では、トークン量を揃えた場合、ラベルなし混合SFTは均質・ラベル付きのベースラインに一貫して劣らなかった。0.6B〜14Bのモデルとデータ量のスケーリングにより大域的なモード混同はほぼ解消され、ボトルネックは局所的な状態追跡の遷移へ移った。<br><br>局所的な誤りが最終結果を左右するのは後続の推論がそのステップに依存する場合に限られ、結果を決定づける「重要な推論ノード」はごく一部だった。そうしたノードでの一段階の修正は、モデルに十分な下流の遂行能力があれば失敗した軌跡を救済した。記号探索と自然言語ベンチマークの双方で確認された。出典：arXiv","timestamp":1795392000000,"title":"Learning Heterogeneous Reasoning in Large Language Models: From Mode Compatibility to Local Bottlenecks","titleJa":"大規模言語モデルにおける異種推論の学習――モード適合性と局所的ボトルネック","url":"https://arxiv.org/abs/2611.30281v1"},{"authors":["Yuxuan Chen","Changwei Lv","Yunfei Li","Zhongjing Du","Kehui Tan","Zijun Liao","Ruochong Zheng","Hao Chen","Can Deng","Zheni Zeng","Chang Liu","Jie Chen"],"categories":["cs.AI"],"field":"arXiv","genre":"Agents / Robotics","monthKey":"2026-11","publishedAt":"2026-11-23T00:00:00Z","source":"arXiv","summaryHtml":"AIエージェントはユーザーとの長期的なやり取りのなかで会話・画像・文書を蓄積するが、後から質問に答えるには記録をまたいだ証拠の結びつけが必要で、得られた理解は保持されず、関連する質問で同じ誤りを繰り返す。既存のマルチモーダル記憶は記録の保存と検索が中心で、完了したタスクから学び経験を統合する仕組みは乏しかった。<br><br>そこで提案されたMMMemは、完了したタスクから経験を抽出・統合するタスク対応型マルチモーダル記憶の枠組みである。出典に紐づいた多視点記憶、出典から生成したタスクによる知識の整合（外部記憶へのウォームアップとモデル自体の自己学習）、同一の視覚言語モデルによるタスクの経験への蒸留、タスク対応検索と再利用による長期保持という4つの補完的な戦略からなる。<br><br>3つの記憶ベンチマークと2つの視覚言語リーダーで8つのベースラインを上回り、Qwen3.5-9BではLoCoMo、Mem-Gallery、LooGLE v2で最良ベースライン比36.9%、17.6%、15.2%の相対的改善を達成した。訓練と記憶ウォームアップの双方が一貫して寄与することがアブレーションで示された。出典：arXiv","timestamp":1795392000000,"title":"MMMem: Self-Improving Agents with Task-Aware Multimodal Experience Consolidation","titleJa":"MMMem――タスク対応マルチモーダル記憶で自己改善するエージェント","url":"https://arxiv.org/abs/2611.30287v1"},{"authors":["Daniel Theron"],"categories":["cs.AI"],"field":"arXiv","genre":"LLM / NLP","monthKey":"2026-11","publishedAt":"2026-11-23T00:00:00Z","source":"arXiv","summaryHtml":"段階的に数値的な自信を言葉にさせるプロンプトは、エージェント推論のバックトラックや誤り訂正を促す手法として広がっている。しかしこの手法は、モデルが自分の誤りをその場で検出できることと、不確実性の合図が実際に修正を促すことの二つを前提としている。本研究は4つのオープンウェイトモデル（Qwen2.5-7B、Llama-3.1-8B、Mistral-7B、Phi-4）を対象に、数学ベンチマーク15,200試行から2,017件の推論誤りを抽出し、27,568件の反事実的継続で検証した。<br><br>結果は、自己モニタリングと制御の乖離を示した。モデルは自分の誤りを検出できず、誤ったステップと言語化された自信に区別はつかず、AUROCは0.500〜0.561とほぼチャンス水準だった。最初の誤りの時点でも自信は95.1〜99.9%に飽和していた。一方、外部から低信頼度タグ（10%）を注入すると、下流の修正は全モデルで有意に増えた（＋3.7〜22.5ポイント、最大38.5%）。<br><br>ただし、正しいステップに疑いを注入すると有効な推論を捨ててしまい、正答率は最大22.8ポイント低下した。推論時の自己訂正のボトルネックは修正能力ではなく、その場での誤り検出にある。出典：arXiv","timestamp":1795392000000,"title":"Language Models Steer on Injected Uncertainty Tokens, but Fail to Self-Monitor In Situ","titleJa":"言語モデルは「自信がない」と言われれば修正できるが、自分では気づけない","url":"https://arxiv.org/abs/2611.31228v1"},{"authors":["Jiajun Fan","Neil He","Qinglong Zheng","Changyi Yang","Tong Wei","Andy Mao","Zetian Li","Chaoran Cheng","Hui Ren","Ruihan Guo","Xianrui Zhong","Xizheng Yu","Jingyuan Li","Xi Zhu","Kaiqu Liang","Chang Xu","Zun Qian","Zidi Xiong","Yuezhu Zhao","Xu Huang","Ge Liu"],"categories":["cs.AI"],"field":"arXiv","genre":"Agents / Robotics","monthKey":"2026-11","publishedAt":"2026-11-23T00:00:00Z","source":"arXiv","summaryHtml":"言語モデルを基盤とする身体化エージェントは、与えられた重みのまま働き続ける。改善には追加学習や、コストのかかる反省・記憶・探索が必要だった。本研究は、自分の経験から重みを直接書き換えて自己改善する身体化エージェントを初めて提案した。学習も勾配も報酬モデルも第二のモデルも使わず、タスクの合間に自らの重みを更新する。<br><br>27Bのエージェントは日中、家庭環境で働く。夜になると記録を読み返し、トークン上限に達して行動に至らない無駄な返信が多いことに気づき、その習慣を隠れ状態の一方向に追跡して、重みの一つのテンソルを書き換えた。変更はすべて元の自分との比較試験で検証し、保たれたものだけを採用する。数千の未見エピソードで、採用された一度の編集により、タスク完了数が有意に増え、ステップ数・無駄・トークン数が減った。<br><br>自己改善は複数ラウンドにわたり安定して続き、崩壊しなかった。ただし、同じ系列の4サイズのうち、この自己改善ができたのは27Bモデルのみだった。学習と推論を分けずに働きながら成長する、生涯学習ロボットへの道を開くものだという。出典：arXiv","timestamp":1795392000000,"title":"Self-Upgrading Embodied Agents","titleJa":"夜に自分の重みを書き換えるロボット――自己改善する身体化エージェント","url":"https://arxiv.org/abs/2611.31117v1"},{"authors":["Kairong Han","Nuanqiao Shan","Ziyu Zhao","Xinpeng Dong","Zijing Hu","Dian Jin","Leyan Deng","Junjian Ye","Lujia Pan","Fei Wu","Kun Kuang"],"categories":[],"field":"Hugging Face Papers","genre":"LLM / NLP","monthKey":"2026-11","publishedAt":"2026-11-23T00:00:00Z","source":"Hugging Face Papers","summaryHtml":"大規模言語モデルの強化学習では、最終出力やテキストの解答軌跡に報酬を与える手法が主流だが、報酬は粗く、推論の信頼性も十分でない。こうした枠組みはモデルが「何を言うか」に注目し、内部で「どう考えるか」を見落としている。そこで本研究は、テキスト報酬のエイリアシング（別々の推論過程が同じ報酬を受け取る問題）を指摘し、隠れ状態と注意マップに基づいて内部の推論過程に報酬を与える注意過程報酬モデル（APRM）を提案した。<br><br>APRMは約4600万パラメータの小さなモデルで、ランキング目的と反事実目的で学習され、分布シフトに対応するため定期的に更新されながら強化学習の最適化を導く。代表的な強化学習手法と組み合わせた実験では、平均pass@8が2.88%向上した。内部の推論信号を報酬に組み込むことで、表面的な正解だけでなく質の高い推論過程そのものを育てられる見通しが示された。<br><br>言語モデルの推論を「結果」ではなく「過程」から評価・強化する方向性は、推論の信頼性向上における有望な一手である。ただし評価は限られた手法と指標によるもので、他のモデル規模や課題への一般化は今後の検証が必要である。出典：Hugging Face Papers","timestamp":1795392000000,"title":"From Rewarding What Models Say to How They Think: Attention Process Reward Model for LLM Reinforcement Learning","titleJa":"「何を言うか」ではなく「どう考えるか」を褒める――注意過程報酬モデルによるLLM推論の強化","url":"https://huggingface.co/papers/2611.30627"},{"authors":["J. Niediek","T. P. Reber","M. Bausch","F. Schwimmbeck","H. Gast","V. A. Coenen","J. Boström","C. E. Elger","F. Mormann"],"categories":[],"field":"Nature Communications","genre":"Neuroscience","monthKey":"2026-11","publishedAt":"2026-11-22T00:00:00Z","source":"Nature Communications","summaryHtml":"日常の経験はどのように記憶として蓄積されるのか。人の側頭葉には特定の人物や物事の概念に反応する「概念ニューロン」があり、エピソード記憶の意味的な構成要素になると考えられてきた。げっ歯類の場所細胞では、再活性化が既存の発火順序に従うことが知られているが、人の概念ニューロンではどうかは分かっていなかった。本研究は、概念を学んだ後の睡眠中にこれらのニューロンが再活性化するかを調べた。<br><br>神経外科の患者で1415個のニューロンを記録し、特定の概念を含む物語を学習させた後、徐波睡眠中の活動を観測した。記録は学習・想起・睡眠の各段階で行われた。概念ニューロンは睡眠中に再活性化し、特にシャープウェーブ・リップル中に同時に再活性化して、シナプス可塑性に適した時間差を示した。<br><br>しかし再活性化の時間的順序は、学習した物語の概念の順序を反映しなかった。人の概念ニューロンは学習開始前から特定の意味内容に同調しており、既存の発火順序はげっ歯類では連続する場所受容野と相関するが、人の経験における出来事の順序とは相関しない。人の概念細胞は内容を符号化するが、出来事の順序は符号化しないことが示された。出典：Nature Communications","timestamp":1795305600000,"title":"Episodic memory consolidation by reactivation of human concept neurons during sleep reflects contents, not sequence of events","titleJa":"睡眠中の概念ニューロンの再活性化が支えるエピソード記憶の固定――内容は再現されるが順序は再現されない","url":"https://www.nature.com/articles/s41467-026-79544-z"},{"authors":["Jinxi Pan","Bodi Liu","Zeyu Wang","Guangyuan Chen","Chengyao Wang","Ying Chen","Huan Jia","Zhaoyan Wang","Chi Ren","Zhengtuo Zhao","Hao Wu"],"categories":[],"field":"Nature Communications","genre":"Neuroscience","monthKey":"2026-11","publishedAt":"2026-11-22T00:00:00Z","source":"Nature Communications","summaryHtml":"聴性脳幹インプラント（ABI）は蝸牛神経核（CN）を対象とし、人工内耳が使えない患者の聴覚を回復できる。しかし従来の表面電極アレイは空間分解能が低く、周波数部位（トノトピー）への到達が限られるため、効果は不良から中等度までばらついた。本研究は、高密度で超柔軟な穿通型神経電極アレイ（uFINE）によるABIを開発した。<br><br>正常聴力のラットで、uFINEはCNと下丘（IC）の0.5〜32kHzにわたる周波数同調を描き出した。CNを選択的に刺激すると、音によるトノトピーに近いIC応答が得られ、同調幅も音刺激の場合と同程度で、136日以上にわたり安定し、グリオーシスも最小限だった。CNとICの連日の逐次微小刺激により、CN刺激で誘発されるIC応答のピークは目標部位へ徐々に移動し、使用依存的可塑性と一致した。<br><br>uFINEは広い周波数範囲で高分解能かつトノトピーに精密で、長期安定したCN刺激を組織損傷を最小限に実現できることが示された。ABIによる聴覚回復の向上につながる可能性がある。出典：Nature Communications","timestamp":1795305600000,"title":"Chronically stable, frequency-selective auditory brainstem stimulation via ultra-flexible penetrating electrode arrays","titleJa":"慢性期も安定した周波数選択的な聴性脳幹刺激――超柔軟な穿通型電極アレイによる聴覚回復","url":"https://www.nature.com/articles/s41467-026-79747-4"},{"authors":["Sushmita Kumari","Atish Prashar","Anand Kumar"],"categories":[],"field":"Journal of Advances in Developmental Research","genre":"Ethics / Safety","monthKey":"2026-11","publishedAt":"2026-11-22T00:00:00Z","source":"Crossref","summaryHtml":"インドのデジタル公共圏は、モバイル中心の通信、プラットフォーム経由のニュース消費、地域言語コンテンツの拡大によって形作られている。AIは機械翻訳、音声認識、音声合成、自動字幕、生成コンテンツによって参加を広げる可能性がある一方で、誤情報の生成・翻訳・個人化・流通の新たな経路も生む。多言語社会では言語変種、方言、文字、コードスイッチング、地域の政治的文脈、デジタルリテラシーの格差が情報の生成と解釈に影響する。<br><br>本稿は概念論文として、公共圏論、ネットワーク化されたゲートキーピング、情報障害、プラットフォーム化、社会技術システムの理論を引き、AIによるコンテンツ生成、言語・文脈の脆弱性、プラットフォームの拡散機構、受け手の解釈、検証能力を結ぶ枠組みを提示する。六つの相互関連する次元――多言語AI能力、地方言語コンテンツの生態系、プラットフォーム増幅、社会文化的感受性、検証・メディアリテラシー能力、制度的ガバナンス――を特定する。<br><br>脆弱性は地域言語での意思疎通そのものや生成AIの存在だけから生じるのではない。言語資源の不平等、不透明な推薦システム、閉じた・半ば閉じたネットワークでの急速な流通、文脈の操作、来歴シグナルの弱さ、信頼できる検証へのアクセス格差の相互作用から生じる。同じ技術が地域言語のファクトチェックや書き起こし、翻訳、公共的コミュニケーションを強化しうる点も強調する。概念研究のため、言語・地域・プラットフォーム・政治的文脈を超えた実証的検証が必要だとする。出典：Crossref","timestamp":1795305600000,"title":"The Regional Language Challenge: Artificial Intelligence, Disinformation and the Vulnerability of India's Vernacular Digital Public Sphere","titleJa":"地域言語の挑戦――AIと偽情報、インドの地方言語デジタル公共圏の脆弱性","url":"https://doi.org/10.71097/ijaidr.v17.i2.2229"},{"authors":["Kosturika Bandyopadhyay"],"categories":[],"field":"International Journal of Law Management & Humanities","genre":"Ethics / Safety","monthKey":"2026-11","publishedAt":"2026-11-22T00:00:00Z","source":"Crossref","summaryHtml":"AI技術は女性や少女に対するジェンダーに基づく暴力（GBV）の姿を変えた。本論文はAIがGBVを引き起こす4つの形を整理し、現行法がそれにどこまで対応できるかをインドを中心に検討した。偽情報の拡散、非合意ポルノ中心のディープフェイク、生体・顔認識データの収集と監視、サイバーストーキングや名誉毀損、プラットフォームからの排除である。<br><br>国際枠組みとしてCEDAW委員会の一般勧告19号・35号、イスタンブール条約、欧州評議会の性差別的ヘイトスピーチ基準がある。インドではIT法（2000年）、IT仲介者規則（2021年）、新刑法（2023年）が対応するが、仲介者規則は2026年に合成コンテンツへ拡張されたものの、AIによるGBVを全面的に扱う法律はまだない。AI規制と男女平等の保護が別々に進み、プラットフォームや開発者の責任が不明確なままだ。<br><br>改善策として、設計段階からの安全性、ディープフェイクの表示、レッドチーミング、脆弱な女性の通報経路、内部告発者保護、デジタル教育などが挙げられた。各国の法整備と制度能力の強化、社会の意識変革が必要であり、世界的にも女性の権利保護を中心に据えたAI規制が求められると結論づけた。出典：Crossref（International Journal of Law Management & Humanities）","timestamp":1795305600000,"title":"Digital Gender-Based Violence in the Age of Artificial Intelligence","titleJa":"AIが変えるジェンダー暴力――ディープフェイクと監視、法の空白","url":"https://doi.org/10.63108/ijlmh.13323"},{"authors":["Panagiotis Kasnesis","Lazaros Toumanidis","Amalia Contiero Syropoulou","Christos Chatzigeorgiou"],"categories":[],"field":"Hugging Face Papers","genre":"Agents / Robotics","monthKey":"2026-11","publishedAt":"2026-11-22T00:00:00Z","source":"Hugging Face Papers","summaryHtml":"既存のLLMエージェントの枠組みは、タスクを実行して終了する「クルー」型がほとんどだが、家庭・実験室・工場のような物理環境では、数か月動き続け、自らのバグを乗り越え、センサーのそばの既存ハードウェアで動くエージェントが必要である。本研究は、LLMが生成するエージェントを長寿命の監視付きアクターとして動かすオープンソースのランタイム「Wactorz」を提案した。プランナーがチャット要求をPythonに変換して実行時に新しいアクターとしてコンパイルし、スーパーバイザーがクラッシュしたアクターだけを状態を保ったまま再起動する。<br><br>すべての連携はMQTTで行われ、エージェントはRaspberry Piなどのエッジノード間で生成・ライブマイグレーションでき、内部の出来事はすべて外部システムが購読できるトピックになっている。デモでは、1件のチャット要求からカメラとランプの自動化を構築し、意図的にゼロ除算を仕込んだ2番目のエージェントがカウントを失わずに自分のコードを修復し、新しいRaspberry Piノードへライブマイグレーションするまでを、4分弱の実時間と0.13ドルのモデル利用料で実行した。<br><br>本稿はデモ論文の拡張版で、トピックグラフの配線ビュー、手書きエージェント向けのライブラリとしての利用法、学習済みモデルの保存・送信・置換、セキュリティモデル、システムの限界も加えている。長期稼働する自律エージェントの実用化に向けた設計指針を示した。出典：Hugging Face Papers","timestamp":1795305600000,"title":"Wactorz: Self-Writing LLM Agents That Discover, Repair, and Migrate at the Edge","titleJa":"壊れても自分で直すエージェント――エッジで数か月動き続ける自己修復型LLMランタイム","url":"https://huggingface.co/papers/2611.29619"},{"authors":["Hicham Jakha"],"categories":[],"field":"Husserl Studies","genre":"Consciousness / Philosophy","monthKey":"2026-11","publishedAt":"2026-11-21T00:00:00Z","source":"Crossref","summaryHtml":"絵画はなぜ絵として見えるのか。フッサールは「イメージ意識」の働きで説明した。絵を見るとき、私たちは物理的な絵の具の表面を見ながら、同時にそこに描かれた対象を「見ている」。この二重の見え方をどう理解するかが問題となり、フッサールの弟子ブラウシュタインは師の説明に批判を向けた。本論文はその論争を掘り起こす。<br><br>論文はフッサールの『イデーンI』と『フッサール全集』第23巻を読み解き、想像（ファンタジー）の位置づけを検討する。背景には分析哲学のウォルハイム＝ウォルトン論争、すなわち絵画表象は知覚か想像かという二分法がある。著者は、想像に基づくブラウシュタインの批判はこの二分法のもとでは退けられると論じる。フッサールはウォルハイムと同様、基本的に知覚主義の立場だからだ。<br><br>一方、記号に基づく批判については『イデーンI』の範囲では正当だと認めつつ、第23巻ではフッサールが記号意識の問題をイメージ意識との関連で確かに考慮していたと結論づける。絵画をめぐる現象学の古典的議論を、現代の分析哲学の枠組みで再検証した研究である。出典：Crossref（Husserl Studies）","timestamp":1795219200000,"title":"Husserl and Blaustein on Image Consciousness, Phantasy, and Pictorial Representation","titleJa":"フッサールとブラウシュタインにおけるイメージ意識、想像、絵画的表象","url":"https://doi.org/10.1007/s10743-026-09393-7"},{"authors":["Purvish M. Parikh","Nitin Yashas","Pavan Raghav Reddy Kalluri","Prathyusha Eaga","Sandeep Batra","Suresh V. S. Attili"],"categories":[],"field":"Indian Journal of Medical Sciences","genre":"Ethics / Safety","monthKey":"2026-11","publishedAt":"2026-11-21T00:00:00Z","source":"Crossref","summaryHtml":"患者、臨床医、医療機関が医療情報を得たり要約・生成したりするのに大規模言語モデル（LLM）を使う場面が増えている。流暢な出力は情報へのアクセスを広げる一方、その限界を見えにくくする。本コンセンサス声明は、LLMが人間の健康を損なうおそれのある経路を、技術的・認知的・臨床的・社会的な機序から検討した。<br><br>挙げられたリスクは、捏造や不完全な情報、文脈に合わない助言、緊急事態の見逃し、安全でない薬や処置の案内、誘導的な質問への追従的な回答、過度の依存など多岐にわたる。メンタルヘルスの支援を求める脆弱な人は、肯定や依存を促す応答の影響を受けやすい。個人のやり取りを超えて、健康に関する誤情報の増幅、証拠検索システムの汚染、不平等の再生産、機密性の高い健康データの露出、科学的誠実さの毀損も指摘された。症例報告や最近の訴訟は深刻さを示すが、害の発生頻度や因果関係を証明するものではない。<br><br>リスク低減には患者、臨床医、開発者、医療制度、規制当局の補完的な行動が必要だとされる。LLMは自律した臨床医ではなく誤りうるコミュニケーションツールとして扱い、重要度の高い出力は独立に検証し、個人を特定できるデータは適切に保護し、緊急性のある症状は通常の救急評価を受けるべきだという。現実的な患者会話による評価、持続的な人間の監督、導入後の透明なモニタリングが、医療LLMの利益を回避可能な害なしに実現するために不可欠だと結論づけている。出典：Crossref（Indian Journal of Medical Sciences）","timestamp":1795219200000,"title":"Artificial intelligence large language models and the threat to human health – A consensus statement by AAIO","titleJa":"人工知能の大規模言語モデルと人間の健康への脅威――AAIOによるコンセンサス声明","url":"https://doi.org/10.25259/ijms_202_2026"},{"authors":["Junsung Byeon","Onesik Harm","Jinhyeok Pyo","Sohyeon Park","Byeongchan Kim","Eunhee Cho","Jungmoon Lim","Taehun Kim","Byeongseong Yoo","Seokjin Oh","Chaewon Song","Hyungchang Jeong","Kyung-Ho Park","Sangyeon Pak","SeungNam Cha"],"categories":[],"field":"Nature Communications","genre":"Neuroscience","monthKey":"2026-11","publishedAt":"2026-11-21T00:00:00Z","source":"Nature Communications","summaryHtml":"二次元半導体の電子バンド構造を変える手法として局所ひずみ工学が注目されてきたが、電荷の動きを精密に制御する拡張可能な手段としては未開拓だった。本研究は単層MoS2に周期的な一次元の一軸ひずみをウェハスケールで加える手法を導入した。線状にパターン化したHfO2基板へMoS2を転写することで、決定論的に周期的な一次元ポテンシャル井戸を生成できる。<br><br>ポテンシャル井戸の向きとキャリア輸送の方向の組み合わせにより、単一の材料プラットフォームに二つの機能が生まれた。井戸に垂直な輸送では電荷トラップが制御され、マルチビットのシナプスメモリデバイスとなり、井戸に平行な輸送では格子散乱と有効質量が低減し、トラップのないキャリア伝導による高移動度トランジスタとなった。系統的な輸送解析により、局所一軸ひずみが電荷トラップ密度、格子散乱、有効質量を変調し、方向依存の電荷輸送を生む仕組みが明らかになった。<br><br>局所一次元ひずみは、高性能で拡張可能な多機能二次元エレクトロニクスの有効な設計パラメータであることが示された。シナプスメモリと高移動度トランジスタという脳型計算と高速エレクトロニクスの両方に通じる機能を、同一材料で方向によって切り替えられる点が意義である。出典：Nature Communications","timestamp":1795219200000,"title":"Localized strain-engineered 1D electron guides in 2D MoS2 devices with synaptic memory and high-mobility transistor functionalities","titleJa":"局所ひずみで作る一次元電子ガイド――単層MoS2デバイスのシナプスメモリと高移動度トランジスタ","url":"https://www.nature.com/articles/s41467-026-79577-4"},{"authors":["Chris Soria"],"categories":[],"field":"OSF Preprints","genre":"LLM / NLP","monthKey":"2026-11","publishedAt":"2026-11-21T00:00:00Z","source":"OSF Preprints","summaryHtml":"専門家レベルの推論ベンチマークでは最上位モデルが小規模モデルを大きく上回るが、自由記述式の調査回答のコーディングは一見単純でも独自の難しさがある。本ノートは、Humanity's Last Exam（HLE）で最高得点のモデルが人間のコーダーと最もよく一致するのか、オープンウェイトモデルがクローズドウェイトモデルに匹敵するのかを問う。6社の18モデル（半数がオープンウェイト）が、ベイエリアのパネル調査の自由記述3問をゼロショットでコーディングし、訓練を受けた2人のコーダーの一致と比較した。<br><br>HLEの得点は、コーダーとの一致を安定的には予測しなかった。引っ越し理由のような単純な設問ではほぼ無関係で、家族への信頼のような解釈を要する設問では高得点ほど一致が近かった。すべてのモデルは、回答者の主観を要するカテゴリで人間からずれやすく、具体的なカテゴリよりずれが大きかった。高得点モデルはコーダーが付けたコードをより多く拾い、精度を落とさなかった。<br><br>価格についても同じ傾向で、最も高価なモデルははるかに安いモデル以上にコーダーと一致しなかった。家族支援の設問では、オープンウェイトモデルの多くはクローズドモデルが満たす水準に届かなかったが、HLE最高得点モデルはどの設問でも最良のオープンウェイトモデル以上に一致しなかった。性能と再現性のトレードオフは、この種のコーディングではいまや小さい可能性が示唆された。出典：OSF Preprints","timestamp":1795219200000,"title":"The Frontier Premium Is Narrow: Benchmark Capability, Price, and Open Weights in LLM Coding of Open-Ended Survey Responses","titleJa":"「フロンティア・プレミアムは小さい」――自由記述式調査回答のLLMコーディングにおけるベンチマーク能力・価格・オープンウェイト","url":"https://osf.io/preprints/socarxiv/5g34x_v2/"},{"authors":["Zouhair Chiban"],"categories":[],"field":"International Journal of Modern Science and Research Technology","genre":"Ethics / Safety","monthKey":"2026-11","publishedAt":"2026-11-21T00:00:00Z","source":"Crossref","summaryHtml":"AIを導く倫理原則については広く合意があるのに、規範的な目標と技術実装の現実のあいだには大きな隔たりがある。本研究は、私法上の責任と継続的な技術検証をレンズに、積極的で反復的なAIガバナンスの枠組みをどう運用するかを探る。出発点は「コンプライアンス・シアター」と「倫理のつまみ食い」という、現場で繰り返される2つの欠陥である。<br><br>手法は多層的で、国際的な規制枠組みの比較評価と、銀行・データプライバシー・環境法の監査手続きを横断的に類型化した地図作りを組み合わせる。結果として、企業の倫理的コミットメントは運用上の監査システムから切り離されたままで、データサイエンティストは抽象的すぎて行動に移せない指針に不満を抱えていることが明らかになった。既存のESG基準にも、グローバルなサプライチェーンに埋め込まれた社会技術的な害を数量化するAI専用の手段がない。<br><br>本論文は、任意のソフトローから強制力のある縦断的な規制枠組みへの移行を提唱する。企業ガバナンスの枠組みに自動監査パイプライン、価値基盤のエンジニアリング（倫理バイデザイン）、独立した第三者の監督を統合し、抽象的な倫理概念を検証可能な私法上の義務へ変換することを提案している。出典：Crossref（International Journal of Modern Science and Research Technology）","timestamp":1795219200000,"title":"AI Governance, Ethics, and Responsible Innovation","titleJa":"AIガバナンス・倫理・責任あるイノベーション――原則と実装の隔たりを埋めるには","url":"https://doi.org/10.67317/ijmsrt26nov105"},{"authors":["Constance Beaumont","Karyn Doba","Christelle Duprez","Emmanuel Brunelle"],"categories":[],"field":"Psychopathology","genre":"Psychedelics / Trauma","monthKey":"2026-11","publishedAt":"2026-11-21T00:00:00Z","source":"Crossref","summaryHtml":"アルコール使用障害（AUD）の患者は、自己のアイデンティティ形成に中心的な役割を果たす自己定義記憶（SDM）の統合に困難を抱える。否定的な記憶は肯定的なものより統合されやすいが、AUD患者ではトラウマへの曝露の割合が高い。本研究は、AUD患者が対照群と比べてトラウマ関連のSDMを統合しにくいかを、統合の価（肯定的か否定的か）を考慮して調べた。<br><br>AUD患者62人と対照54人がそれぞれ5つのSDMを想起し、テーマ、統合、統合の価で分析した。幼少期と成人期のトラウマ曝露と感情調節方略は質問紙で評価した。患者は対照群と比べて、トラウマ関連のSDMを肯定的に統合することが少なく、否定的に統合することが多かった。部分最小二乗モデルでは、感情調節の困難さが肯定的統合の少なさと関連した。<br><br>トラウマ体験を自己像にどう位置づけるかは、その体験の解釈と感情調節のあり方に左右されることが示唆された。著者らは、感情調節の困難さが、トラウマ関連の記憶を前向きに自己像へ組み込むことを妨げている可能性を指摘し、断酒期間との関連についても検討している。出典：Crossref（Psychopathology）","timestamp":1795219200000,"title":"The role of emotion regulation and the valence of memory integration in trauma-related self-defining memories in individuals with alcohol use disorder","titleJa":"トラウマ関連の自己定義記憶と感情調節――アルコール使用障害における記憶の統合","url":"https://doi.org/10.1159/psp/aelag016"},{"authors":["Ephraim Y. Levin"],"categories":[],"field":"xsci","genre":"Consciousness / Philosophy","monthKey":"2026-11","publishedAt":"2026-11-21T00:00:00Z","source":"Crossref","summaryHtml":"質は通常、一次質と二次質に分けられる。物理学は客観的とされる一次質を扱い、より主観的な二次質は心理学に委ねられてきた。著者は、存在を判定するにはプラグマティックな方法を用いるべきだと提案する。その方法を当てはめると、刺激の情動的な程度は客観的に存在するという。<br><br>著者は、正統的な量子物理学の簡潔な解釈を振り返る。焦点が物質片の時間発展から量子状態の時間発展へ移ることで、エネルギーのない量子状態について語る余地が生まれる。エネルギー状態はヒルベルト空間で回転するが、エネルギーのない状態は測定されるまで静止したまま存在するという。刺激された心はそうした質の検出器として働き、心ごとに異なる応答は通常の検出器の応答と比較される。<br><br>経験的な裏づけとして、著者は2つの異例を論じる。閾下プライミング実験で見られた、心が結果の状態に気づくときに量子状態が収縮すると考えなければ理解しにくい現象と、著者が統計的に確立していると述べるプレゼンティメント（予感）効果である。先行する説明を検討したうえで、自身の主張と整合する近年の量子モデルを紹介し、この主張は妥当で説明力があり、現実のより包括的な記述につながりうると結論する。出典：Crossref（xsci）","timestamp":1795219200000,"title":"Quantum Physics, Consciousness and Observation – Bridging a Psycho-Physical Split","titleJa":"量子物理学、意識、観測――心身の分裂をつなぐ試み","url":"https://doi.org/10.66977/xsci.2611.003n"},{"authors":["Sahar Ghneim"],"categories":[],"field":"International Journal of Financial, Administrative, and Economic Sciences","genre":"Ethics / Safety","monthKey":"2026-11","publishedAt":"2026-11-21T00:00:00Z","source":"Crossref","summaryHtml":"本研究は、AIとアルゴリズムがもたらす損害の法的責任を、EUとアラブ首長国連邦（UAE）の比較で検討する。データと情報の利用・処理をめぐる法的枠組みを説明し、アルゴリズムの出力から生じうる害――プライバシー侵害、名誉毀損、誤情報の拡散、詐欺、なりすまし、個人データの違法な開示――を特定する。記述的・分析的・比較的手法を用い、関連法規を分析して両地域の法的保護、監督機構、罰則を比較する。<br><br>民事責任では責任の主要な要素と物的・非物的損害の賠償条件、行政責任では規制上の義務・監督・罰則、刑事責任では犯罪の構成要素と行為の自然人・法人への帰属を扱う。調査結果によれば、AIシステムの開発・運用・利用に複数の当事者が関わるため、責任は複雑になる。アルゴリズムの出力から害が生じたという事実だけでは責任は成立せず、違法行為、損害、因果関係、刑事責任に必要な故意の有無を確定しなければならない。<br><br>研究は、AIによる損害の責任をめぐる法令の更新、透明性と人間による監督の強化、デジタル証拠の保存と因果関係の立証の改善、開発者・提供者・利用者の義務の明確化、規制当局と司法当局の協力の強化を提言する。権利の保護と技術革新と法的説明責任の両立を目指すものだ。出典：Crossref","timestamp":1795219200000,"title":"Legal Liability for Harm Caused by Artificial Intelligence and Algorithms: A Comparative Study of Criminal, Civil, and Administrative Liability in the European Union and the United Arab Emirates","titleJa":"AIとアルゴリズムがもたらす損害の法的責任――EUとUAEの刑事・民事・行政責任の比較","url":"https://doi.org/10.59992/ijfaes.2026.v5n11p10"},{"authors":["Umi Fauzia Yuniarsih","Hermansyah","Moh. Lutfi","Siti Mahmudah Noorhayati"],"categories":[],"field":"PARADIGMA: JURNAL PEMIKIRAN DAN PENELITIAN PENDIDIKAN","genre":"Consciousness / Philosophy","monthKey":"2026-11","publishedAt":"2026-11-21T00:00:00Z","source":"Crossref","summaryHtml":"パウロ・フレイレの批判的意識と、イスラーム教育におけるタズキヤトゥン・ナフス（魂の浄化）を比較検討した概念研究である。両者を単に補完的だと並べるのではなく、異なる哲学的基盤を消し去らずに対話させる概念的な仕組みを特定することを目指した。文献研究の手法で、人間観、知識の源泉、中心的な問題、教育実践、倫理的な目的を覆う分析マトリクスを用い、収録・除外基準を明示した文献コーパスを検討した。<br><br>提案された「タズキヤ＝批判サイクル」は五つの段階からなる。批判的自己検討ムハーサバ、現実の批判的読解、倫理的対話、責任ある社会行動、そして意図の評価を伴う省察の更新である。新規性は相互的な仕組みにある。ムハーサバは社会批判における自我主導や独善、支配的な傾向を点検し、構造分析はタズキヤトゥン・ナフスが制度的不正義を見落としたまま個人の責任だけに矮小化されるのを防ぐ。<br><br>ただしこのモデルは著者らによる概念的な提案であり、フレイレやガザーリー自身の定式ではないこと、実証的な検証はまだ行われていないことが明記されている。批判的意識とイスラームの霊的伝統を、どちらも損なわずに結びつける枠組みとして提示された研究である。出典：Crossref","timestamp":1795219200000,"title":"Critical Consciousness and Tazkiyatun Nafs in Islamic Education: A Comparative Analysis and the Tazkiyah-Critical Cycle","titleJa":"批判的意識とタズキヤトゥン・ナフス――イスラーム教育における対話とタズキヤ＝批判サイクル","url":"https://doi.org/10.64540/zt658p48"},{"authors":["Guoming Ling","Shanshan Zhong","Kaixuan Zhang","Zhongzhan Huang"],"categories":[],"field":"Hugging Face Papers","genre":"LLM / NLP","monthKey":"2026-11","publishedAt":"2026-11-21T00:00:00Z","source":"Hugging Face Papers","summaryHtml":"最先端の言語モデルは、ニューラルネットワークの重みをコードのように読み書きして小さなモデルを改善できるようになった。この手法は重み空間プログラミング（WSP）と呼ばれる。本研究はWSPを言語モデル自身に適用する「自己WSP」を試みた。Qwen3.5-0.8Bが自分の重みを読み、編集案を提案し、編集後の重みで問題解決者兼編集者として動き続ける設定である。<br><br>実験では真の自己改善が多数確認された。自己編集によりGSM8Kの正答率は11.8%から62.2%へ、MATH500は7.0%から32.2%へ上昇し、わずか16パラメータの変更で大きく改善する例もあり、繰り返しの自己編集でさらに改善し続ける場合もあった。一方で、こうした向上には解釈可能性が欠けていた。モデルは自分が行った編集をほとんど理解しておらず、ランダム探索によるWSPが同程度の性能を出す場合もあった。<br><br>自己WSPは再帰的自己改善への道筋として有望だが、その実現にはさらなる探究が必要である。編集の意味をモデル自身が理解し、意図的に改善を積み重ねられるかどうかが今後の鍵になる。出典：Hugging Face Papers","timestamp":1795219200000,"title":"Self-WSP: Can Language Models Improve Themselves Through Weight-Space Programming?","titleJa":"言語モデルは自分の重みを書き換えて自ら賢くなれるか――自己重み空間プログラミングの試み","url":"https://huggingface.co/papers/2611.28833"},{"authors":["Chrisantus Eze"],"categories":[],"field":"arXiv","genre":"Agents / Robotics","monthKey":"2026-11","publishedAt":"2026-11-20T16:56:17Z","source":"arXiv","summaryHtml":"科学的主張の検証に使うマルチエージェントシステムは、役割を与えたLLM同士の討論で仮説を試すことが多い。しかし討論するエージェントが同じ基盤モデルから作られると、潜在表現を共有するため自己批判の偏りが構造的に避けられない。固定回数の討論も、証拠が安定する前に止まるか、収束後に計算を浪費する問題がある。<br><br>本研究は、主張・懐疑・仲裁という対立する認識的指示を持つ非対称な役割構成を提案した。役割間の埋め込み類似度は、対称的なマルチエージェント討論の0.918に対し0.852へ下がり、争点となる主張の表面化は15.4%から22.0%へ増えた。さらに、証拠に基づく停止基準Belief-Deltaを導入し、固定3回の討論で62.5%あった過剰な反復を0.0%にし、LLM呼び出しを2.4倍減らした。<br><br>支持される主張はすべて、独立したNLI分類器で監査された文献の逐語スニペットに結びつけられ、幻覚率は21.7%で、Self-Refineによる批判者の25.9%と同程度だった。DeepSeek-R1-32Bを用い、40の研究仮説に対する200回の実行で評価し、計算効率と厳密な認識的検証の両立を示した。出典：arXiv","timestamp":1795193777000,"title":"Beyond Self-Critique: Epistemic Convergence Control for Multi-Agent Research Verification","titleJa":"自己批判の罠を越えて――マルチエージェント研究検証の収束制御","url":"https://arxiv.org/abs/2611.27839"},{"authors":["Dominique Makowski","Marco Sperduti","Oliver Collins","Lucie Daudé","Joy Zogheib","Ewen Kervadec","Bruno Roméo","Pascale Piolino","Baptiste Fauvel"],"categories":[],"field":"PsyArXiv","genre":"Psychedelics / Trauma","monthKey":"2026-11","publishedAt":"2026-11-20T14:08:29Z","source":"OSF Preprints","summaryHtml":"古典的サイケデリクスは事前の期待（プライアー）を緩めると考えられ、錯視が弱まるはずだという仮説がある。しかし急性期以外での証拠は乏しく、錯視感度の通常の指標である誤答率は全体的な成績にも左右される。本研究は118人の成人を対象に、未使用者44人、過去30日以内に使用した39人、それ以前に使用した35人を比較した。<br><br>参加者はエビングハウス錯視、ミュラー＝リヤー錯視、垂直―水平錯視の強さを独立に変えながら二つの対象の大小を判断する「錯視ゲーム」を行い、選択と反応時間に階層的ドリフト拡散モデルを当てはめた。使用者群は未使用者より判断の閾値を広く設定し、証拠を多く集めてから回答し、誤答も少なかった。全体的な正答率から独立した錯視感度の指標は、使用者で平均22％低く、最近の使用者と過去の使用者で同程度だった。<br><br>この結果は「プライアーが緩む」という予測と整合するが、錯視感度は年齢、言語、学生か否か、心理的柔軟性、苦痛、最後の使用体験の強さとは無関係で、使用の新しさとの明確な関連もなかったため、解釈には慎重さが求められる。出典：OSF Preprints（PsyArXiv）","timestamp":1795183709000,"title":"Are psychedelic users less susceptible to visual illusions? Evidence from the Illusion Game","titleJa":"サイケデリクス使用者は錯視にかかりにくいのか――「錯視ゲーム」による検証","url":"https://doi.org/10.31234/osf.io/23zbg"},{"authors":["Zayd Muhammad Kawakibi Zuhri","Munachiso Samuel Nwadike","Kentaro Inui","Alham Fikri Aji"],"categories":[],"field":"arXiv","genre":"LLM / NLP","monthKey":"2026-11","publishedAt":"2026-11-20T13:38:17Z","source":"arXiv","summaryHtml":"言語モデルの系列混合層の計算能力を評価するには、想起や系列操作、状態追跡といった基礎能力を測る小さな合成タスクが広く使われている。だがタスクの選び方や定式化、評価方法が研究ごとに異なり、結果の比較が難しい。本研究は、そうしたタスクを能力別に整理し、共通の設定で評価できるベンチマークTaskletsを提案した。<br><br>Taskletsは、さまざまな層タイプが基礎的な計算をどう学習するかを、制御された実験で小規模モデルを使って比較する。タスクは試す能力ごとに整理され、層タイプごとの学習の違いを同じ土俵で比べられる。タスクの実装と評価コードが公開され、新しいアーキテクチャの提案を再現可能かつ低コストで検証できる。<br><br>基礎能力に焦点を絞った小さなタスク群を共通基盤に載せることで、アーキテクチャ研究の比較可能性を高める狙いがある。想起や系列操作、状態追跡といった基礎能力ごとにタスクが整理され、層タイプの違いがどこで現れるかを見分けやすくなる。小規模モデルでの制御実験により、層タイプ間の違いを低コストで確かめられる。実装と評価コードはGitHubで公開されている。出典：arXiv","timestamp":1795181897000,"title":"Tasklets: A Unit-Test Benchmark for Language Model Architectures","titleJa":"言語モデルアーキテクチャの基礎体力を測る――小規模合成タスク集Tasklets","url":"https://arxiv.org/abs/2611.27607"},{"authors":["Rishika Verma"],"categories":[],"field":"International Journal of Philosophy, Ethics and Humanities","genre":"Consciousness / Philosophy","monthKey":"2026-11","publishedAt":"2026-11-20T00:00:00Z","source":"Crossref","summaryHtml":"本論文は、シャンカラ・ヴェーダーンタにおける意識（チャイタニヤ）の概念を検討する。意識はあらゆる経験を可能にする根本原理であり、無生物は知識の対象であるのに対し、意識は知る者だとされる。自己の本性について哲学者たちの見解は分かれるが、「私はある」という直接経験は疑い得ない。シャンカラにとって自己は自存し、意識はその本質である。<br><br>アドヴァイタ・ヴェーダーンタによれば、究極的に実在するのはブラフマンのみであり、世界の多様性や個我、神は経験的な秩序に属し、無知（アヴィディヤー）と限定付帯性（ウパーディ）によって説明される。本論文は、実在を知る方法、ブラフマンの本性、個我、意識の四つの状態、証人としての意識、イーシュヴァラについて論じる。<br><br>結論として、意識における多様性は見かけのものにすぎず、意識は究極的に一つであり、非二元であって、ブラフマンと同一だと主張される。意識の概念をめぐる古典インド哲学の立場を、分析的に整理した研究である。出典：Crossref（International Journal of Philosophy, Ethics and Humanities）","timestamp":1795132800000,"title":"THE CONCEPT OF CONSCIOUSNESS IN SHANKARA VEDANTA: An Analytical Study","titleJa":"シャンカラ・ヴェーダーンタにおける意識の概念――分析的研究","url":"https://doi.org/10.64823/ijpeh.2602004"},{"authors":["Rabie Adel El Arab","Wesam Taher Almagharbeh","Sameer A. Alkubati","Mudassir Imran Mustafa"],"categories":[],"field":"Frontiers in Artificial Intelligence","genre":"Ethics / Safety","monthKey":"2026-11","publishedAt":"2026-11-20T00:00:00Z","source":"Frontiers in Artificial Intelligence","summaryHtml":"臨床現場で自律的に行動を変えるエージェント型AIは、従来の性能指標では捉えきれない失敗経路を生む。安全策がそうした経路を本当に断ち切っているのかは不明だった。本研究は、臨床エージェント型AIと関連ワークフローにおける安全策の効果、残存する失敗、人の回復、資源への影響を地図化する系統的スコーピングレビューである。PubMedなど5つのデータベースから英語の査読付き実証報告111件を対象とした。<br><br>111件の内訳は、機能的にエージェント型が56件、非エージェント型が29件などで、エージェント型56件のうち38件はモデルが次の行動を自ら選択することを明記していた。111件の評価結果のうち、特定の安全策の効果を分離し、測定された患者への害の減少を示したものは一つもなかった。安全策を含む構成は一部の結果を改善したが、見落としや感度の低下、誤った安心感、遅延、確認負担の転嫁を伴うこともあった。臨床医の承認を求めても、残存する誤りが認識・修正されたことは示されなかった。<br><br>安全策は特定の誤りを減らしても、リスクを後の判断や人の確認作業へ移す場合がある。著者らは、臨床の安全を一つの場面だけでなくケア全体の経路で評価し、残存リスクと適時の人の確認能力をあわせて判断すべきだと結論づけている。提案する証拠プロファイルは検証を要し、研究デザインの不均一性が推論を制約する。出典：Frontiers in Artificial Intelligence","timestamp":1795132800000,"title":"Safeguards, residual failures, and human oversight in clinical agentic and related artificial intelligence workflows: a systematic scoping review","titleJa":"臨床エージェント型AIの安全策と残存する失敗、人の監視――系統的スコーピングレビュー","url":"https://www.frontiersin.org/articles/10.3389/frai.2026.1997557"},{"authors":["Thurston Lacalli"],"categories":[],"field":"Frontiers in Psychology","genre":"Consciousness / Philosophy","monthKey":"2026-11","publishedAt":"2026-11-20T00:00:00Z","source":"Frontiers in Psychology","summaryHtml":"機械意識は話題になることが多く、現在開発されている大規模言語モデル（LLM）が人間のように経験状態を生み出しそれに応じる意識を実現できるかは未解決である。LLMは設計されたものであるのに対し、生物の意識は進化の産物であるという決定的な違いがある。進化では複雑さは自然選択による多くの世代にわたる漸進的な変化で達成される。経験状態を生み出す能力も同様なら、他の手段で自発的に生じるという想定は疑わしい論理に依存している。<br><br>一方で機械意識という考えは、知識と意味の違い、そして知識がどう意味を獲得するかという二つの問題を提起する。進化を考慮すると、知識と、出来事の連なりや言語・テキストの連なりの結末を予測する能力との結びつきが明らかになる。LLMは後者を行うが、人間にとっての意味は、そうした連なりに現実世界のリスクや偶発性についての情報を符号化する意識的な価（ヴァレンス）が伴うことに依存する。<br><br>LLMにはその能力がないため、LLMにとっての知識は必然的に意味を欠く。著者は機械意識の自発的出現という想定を完全には否定しないものの、真剣な科学的検討に値するかを問う。知識と意味を区別する視点から、LLMの能力の限界を論じた理論論文である。出典：Frontiers in Psychology","timestamp":1795132800000,"title":"Knowledge versus meaning—an evolutionary perspective, and the deceptive allure of the idea of machine consciousness","titleJa":"知識と意味――進化の視点から見た機械意識という魅惑的な考え","url":"https://www.frontiersin.org/articles/10.3389/fpsyg.2026.1999890"},{"authors":["Matan Aharoni","Chen Sabag-Ben Porat","Shir Galor"],"categories":[],"field":"Online Information Review","genre":"Psychedelics / Trauma","monthKey":"2026-11","publishedAt":"2026-11-20T00:00:00Z","source":"Crossref","summaryHtml":"被害の存在自体が争われるコミュニティは、公式の場が閉ざされた中で、対立やメディアの劇化に頼らずに正統性と道徳的立場をどう築くか。本研究は「ソフトな抗議」という概念を提示する。個人的証言、集合的記憶、感情的コミュニティ、文化的アンカリングに根ざした戦略的なデジタル・レパートリーで、知識と承認の代替インフラを築く実践である。<br><br>方法は質的マルチメソッドで、アムラム協会のFacebookページ（2019〜2024年）のネットノグラフィー、100件の投稿のテーマ・視覚記号論分析、主要活動家6人へのインタビューを組み合わせた。対象はイスラエルにおけるイエメン人・ミズラヒ・バルカン人の子どもの事件をめぐる承認を求める市民運動である。<br><br>結果として、道徳的権威は5つの相互に結びついた戦略で構築された。制度過程の市民的アーカイブ化、顔と証言による可視性の政治、共有されたトラウマをめぐる感情的コミュニティの形成、デジタル参加から物理的市民参加への動員、宗教的・伝統的シンボルによる文化的アンカリングである。制度的アクセスを持たないコミュニティが集合的被害を政策影響力に変える枠組みとして、ソフトな抗議の概念を提示した。出典：Crossref","timestamp":1795132800000,"title":"Soft protest in online communities: trauma, memory, and civic legitimacy in the Yemenite children affair","titleJa":"オンライン・コミュニティにおけるソフトな抗議――イエメン人の子どもの事件をめぐるトラウマ・記憶・市民的正統性","url":"https://doi.org/10.1108/oir-04-2026-0360"},{"authors":["Narendra Bahadur Air"],"categories":[],"field":"Contemporary Research: An Interdisciplinary Academic Journal","genre":"Consciousness / Philosophy","monthKey":"2026-11","publishedAt":"2026-11-20T00:00:00Z","source":"Crossref","summaryHtml":"ネパール西部スドゥルパシュチム地方に伝わる民謡デウダーを、アルネ・ネスらが提唱した深層生態学の視点から読み解いた研究である。歌の中では土地や川、森、季節、そして非人間的な存在たちが、社会生活や感情、道徳の場における能動的な参加者として描かれ、自然は人間の背景ではなく親族として概念化されている。<br><br>研究は民族誌的フィールドワークに基づく。参与観察や歌手への聞き取り、フォーカスグループで集めた歌詞を、内在的価値、生物圏平等主義、生態学的自己といった深層生態学の概念に沿って質的に主題分析した。エコクリティシズムの手法も併用し、歌に込められた生態学的相互依存や非人間的生命の内在的価値、先住民の環境倫理を掘り起こした。<br><br>分析の結果、デウダーは人間中心主義を超えた世界観を体現し、関係性の倫理や生態学的アイデンティティ、帰属感を伝える深層生態学的意識の宝庫であることが示された。先住民の口承文学が持続可能性と共存の哲学をいかに表現するかを、環境人文学の枠組みで位置づけた研究である。出典：Crossref（Contemporary Research: An Interdisciplinary Academic Journal）","timestamp":1795132800000,"title":"Kinship in Nature: Deep Ecological Consciousness in Ḍeeuḍā","titleJa":"自然における親族関係――デウダー民謡に見る深層生態学的意識","url":"https://doi.org/10.3126/craiaj.v9i2.102369"},{"authors":["Zhenbo Wang"],"categories":[],"field":"SocArXiv","genre":"LLM / NLP","monthKey":"2026-11","publishedAt":"2026-11-20T00:00:00Z","source":"OSF Preprints","summaryHtml":"AIが研究仮説を生成できるという主張は、モデルが既に知り得ない「答え」に対して検証されることがほとんどない。公開論文を答え合わせに使う評価は、訓練カットオフ後の論文を用いても、新しいモデルが出るたびに保護が弱まる。本論文は、未公開の実証研究を答えの鍵として用いるプロトコルを提案する。鍵となる研究は著者によって封印され、生成前にハッシュだけがコミットされた。<br><br>プロトコルは、時期で区切った文献コーパス、凍結した事前登録、提案と既存知見の言い換えを分離する同一モデルの言い換えベースライン、群を伏せた採点、台本化された判定を組み合わせ、各段階を別々のコミットとして記録する。未公開の経済地理学の博士研究（5つの知見）で2回実行された。事前登録した1回目では、主要モデルは提案時も言い換え時も同点（5点中1.5点）で、知見を完全に再現した仮説はなかった。<br><br>原因の一端は、一文の仮説テンプレートと検索を変化させない安全策という、評価設計にありがちな二つの失敗にあった。両者を修正した探索的2回目では、提案が言い換えを上回った（出力あたり0.83対0.23）が、コーパスのカットオフ以前に訓練されたオープンウェイトモデルでは差が出ず、再現できた知見はやはり皆無だった。得られた向上は、モデルが後の文献や研究自体に触れていた可能性によるものかもしれず、能力の証拠とは読めない。失敗も含めてプロトコル自体の検証として報告された。出典：OSF Preprints（SocArXiv）","timestamp":1795132800000,"title":"Before the answer is published: testing AI hypothesis generation against a sealed study","titleJa":"答えが公開される前に――封印された研究でAIの仮説生成能力を検証する","url":"https://osf.io/preprints/socarxiv/7unk4_v1/"},{"authors":["Nicosia General Hospital"],"categories":[],"field":"ClinicalTrials.gov","genre":"Consciousness / Philosophy","monthKey":"2026-11","publishedAt":"2026-11-20T00:00:00Z","source":"ClinicalTrials.gov","summaryHtml":"重度脳損傷のあと意思疎通ができない患者のうち、誰が意識を取り戻すのかを早期に見極めることは神経集中治療の難問で、ベッドサイドの診察だけでは相当数が誤って分類される。植物状態の臨床基準を満たす患者の一部にも、指令に対する意志的な脳反応が残る認知的運動解離があり、最近の多施設研究では行動上無反応の患者の約4分の1にみられたと報告されている。<br><br>キプロス唯一の外傷紹介センターであるニコシア総合病院による単施設・前向き観察コホート研究である。登録対象は16歳以上で、中等度から重度の外傷性脳損傷または出血性脳卒中（脳内出血・くも膜下出血）ののち24時間以内に挿管され、Coma Recovery Scale-Revised（CRS-R）で植物状態／無反応性覚醒症候群または最小意識状態と分類された患者である。CRS-R、血清ニューロン特異的エノラーゼ、bispectral index（BIS）、外傷例のみの1.5T MRIという4つの軸で評価し、6〜12か月後のCRS-R総得点（0〜23点）を主要評価項目とする。<br><br>主解析は病棟で記録した最高BIS値とのSpearman順位相関である。単一施設では対象が30〜40名にとどまるため、予後予測モデルの開発は目指さず、効果量と信頼区間の推定により後の多施設研究の設計根拠とする。介入はなく純粋な観察研究で、現在募集中、予定登録数40名、完了予定2030年9月となっている。出典：ClinicalTrials.gov","timestamp":1795132800000,"title":"Multimodal Assessment and Prognosis in Disorders of Consciousness After Severe Brain Injury (CyDoC-MAP)","titleJa":"重度脳損傷後の意識障害――マルチモーダル評価と予後予測の前向きコホート研究","url":"https://clinicaltrials.gov/study/NCT07736820"},{"authors":["Vi Bui","Paul Silvia"],"categories":[],"field":"PsyArXiv","genre":"Consciousness / Philosophy","monthKey":"2026-11","publishedAt":"2026-11-20T00:00:00Z","source":"OSF Preprints","summaryHtml":"神秘体験や宗教体験、美的体験、畏敬、崇高――心理学ではさまざまな枠組みで研究されてきた深い体験がある。枠組みは違っても、それらに共通して現れるのが「ノエティックな質」である。非合理的でありながら真実で、自明で、直接的で、現実的だと感じられる何かを捉えたという主観的な感覚だ。独立した分離可能な現象である可能性を示唆するが、それ自体として研究されることはまれだった。体験は主観的に非常に強烈で個別性が高く、実験室で引き起こすことが難しく、回顧的な語りを質的に分析するコストも高いためである。<br><br>本研究では、ノエティックな質の体験についてナラティブ・エッセイを書いた318名を対象に、感情と動機づけの内容、主観的な認識論的変化について尋ね、エッセイを自然言語処理で分類した。誘因は美的体験、サイケデリック体験、宗教・神秘体験、死にまつわる体験に広がった。<br><br>体験の感情価は異質で、34%が否定的、66%が肯定的だった。誘因を問わず、体験は一貫して高い感情強度、行動傾向、主観的な認識論的変化を特徴とし、感情に似た構造を示した。誘因や感情価の違いを超えた共通構造が見いだされたことは、ノエティックな質を個別の体験の枠組みから切り離して扱える可能性を示し、まれで非日常的な体験の計算論的研究が実現可能であることも示した。出典：OSF Preprints","timestamp":1795132800000,"title":"Mapping the noetic quality: A computational analysis of the elicitors and experience of profound truth","titleJa":"「真実だと感じる」体験の地図――ノエティックな質の誘因と経験の計算論的分析","url":"https://osf.io/preprints/psyarxiv/cpvw5_v1/"},{"authors":["Yimy Amarillo"],"categories":[],"field":"PsyArXiv","genre":"Consciousness / Philosophy","monthKey":"2026-11","publishedAt":"2026-11-20T00:00:00Z","source":"OSF Preprints","summaryHtml":"意識の主要理論は神経基盤を大脳皮質の連合野に置くが、この収束は皮質回路の十分性が実証されたからではなく、皮質が技術的に調べやすいからにすぎない。本論文は、視床に意識内容の選択と維持の構成的な役割を与える視床皮質記憶モデル（TMMC）を提唱する。内容は視床網様核（TRN）における視床チャネル間の競合で選ばれ、顕著性・予測・価値・記憶的一貫性という四つの選択圧が働く。<br><br>視床背内側核（MD）は内容が到達した後に前頭前野の活動を持続させ、海馬はエピソード的な内生的内容を生成し、視床正中核は前頭前野への到達を調整し、扁桃体は競合に直接バイアスをかける。モデルは意識の水準L(t)と内容C(t)を部分的に分離可能な状態変数として区別し、外因性・内因性・自由という三つの動作モードの遷移を、複数の時間スケールで結合した視床皮質過程として記述する。<br><br>三つの反証可能な予測を導く。自発的思考では視床が前頭前野に先行すること、MD損傷後は維持された内容の喪失が加速すること、両眼視野闘争の知覚切替前に視床から皮質へのシータ帯域の流れが生じることである。皮質中心モデルへの機械論的な代替案と、検証可能な研究プログラムを提示する。出典：OSF Preprints（PsyArXiv）","timestamp":1795132800000,"title":"A thalamocortical mnemonic model of consciousness: thalamic selection of conscious content","titleJa":"意識の視床皮質記憶モデル：視床による意識内容の選択","url":"https://osf.io/preprints/psyarxiv/xheqg_v1/"},{"authors":["Feng Chen","Jianshan Cheng"],"categories":[],"field":"Frontiers in Psychology","genre":"Ethics / Safety","monthKey":"2026-11","publishedAt":"2026-11-20T00:00:00Z","source":"Frontiers in Psychology","summaryHtml":"生成AIは学術的な著者性の従来の境界を揺るがし、学生の心理的な所有感と説明責任を弱めるおそれがある。本研究は、中国の高校生586名を対象に、人間とAIの共著の曖昧さ（HAAA）、心理的所有感、責任の希薄化、生成AI関連の学術行動の関連を三波の縦断調査で調べた。保持率は91.3%で、個人内変動と個人間の安定差を分けるランダム切片交差遅延パネルモデルで分析した。<br><br>両区間を通じて、共著の曖昧さが大きいほど心理的所有感は低く（β=-0.283、-0.265）、責任の希薄化は大きかった（β=0.251、0.230）。心理的所有感の低下は責任の希薄化を予測し（β=-0.291、-0.275）、それが生成AI関連の学術行動の頻度を予測した（β=0.332、0.347、いずれもp<0.001）。二段階の間接効果も有意で、共著の曖昧さは心理的所有感と責任の希薄化を介して後の学術行動と結びついた。<br><br>著者性の明確さ、心理的所有感、個人の説明責任が生成AIを用いた学習で重要だと示す。因果関係の結論は慎重であるべきだが、学術的誠実さの教育では、AI支援の作業における学生自身の知的貢献と責任を強調すべきだと提言する。出典：Frontiers in Psychology","timestamp":1795132800000,"title":"When authorship blurs, responsibility dilutes: a three-wave longitudinal study of human–AI co-authorship ambiguity and self-reported GenAI-related academic behaviors among Chinese high school students","titleJa":"著者性が曖昧になると責任は希薄になる――人間とAIの共著をめぐる三波の縦断研究","url":"https://www.frontiersin.org/articles/10.3389/fpsyg.2026.1997778"},{"authors":["Huimei Gao","Feng Yang","Qiang Liu","Zhuo Wang","Zishu Meng"],"categories":[],"field":"Frontiers in Psychology","genre":"Ethics / Safety","monthKey":"2026-11","publishedAt":"2026-11-20T00:00:00Z","source":"Frontiers in Psychology","summaryHtml":"生成AIは学生のあいだで過去の教育技術よりも速く普及したが、過度な依存は、その懸念を抱かせる学習者自身のあいだでは十分に調べられてこなかった。本研究は、中国の高職の外国語専攻の学生249名を対象に、自己報告による過度な依存の予測要因を、順次説明的混合法で調べた。<br><br>量的分析では二つの傾向が示された。第一に、感情要因が支配的だった。見逃しへの恐れ（β=0.50）と擬人化的な愛着（β=0.27）が最も強い予測要因で、自己調整学習やAIリテラシーの自己評価だけでは過度な依存と関連しなかった。重要なのは両者の隔たりで、AIに詳しいと感じることと自分の学習を調整していると報告することのギャップが過度な依存を予測した（β=0.21）。<br><br>感情的な関与が低い学習者は過度な依存が最も少なかった。5名への面接では、人間らしい温かさが委任の心理的コストを下げ、仲間に規範化された遅れへの恐れが繰り返しの選択を通じて自分の基準を侵食し、能力の自覚は依存を抑えるよりむしろ可能にし、実行された自己調整だけがそれを断ち切る様子が示唆された。道具との感情的な関係が、能力の自己評価よりも過度な依存をよく追跡していた。出典：Frontiers in Psychology","timestamp":1795132800000,"title":"Too good to resist? Affective engagement and a competence–regulation gap predict self-reported over-reliance on generative AI among vocational foreign-language learners","titleJa":"抗いがたい魅力――生成AIへの過度な依存を予測する感情的関与と能力・調整の隔たり","url":"https://www.frontiersin.org/articles/10.3389/fpsyg.2026.1941348"},{"authors":["Sarfaraz K. Niazi","Mikołaj Stańczak"],"categories":[],"field":"AI and Ethics","genre":"Ethics / Safety","monthKey":"2026-11","publishedAt":"2026-11-20T00:00:00Z","source":"Crossref","summaryHtml":"人工知能はしばしば、従順な統計的道具か、知識や創造性、感情や意図を備え人間に並ぶ存在かのどちらかとして描かれる。しかし本論考によれば、どちらも観察できる性能だけから内的経験を推し量る点で根本的に誤っている。著者らはより厳密なモデルとして、AIを「現代の予言者（seer）」と捉える見方を提唱する。記録された人類の知識を、いかなる個人にも到達できない規模で圧縮・検索・再結合する複雑な仕組みであり、相談はされるが認定を受けていない認識上の権威だという。<br><br>予言者の能力は相互作用の手がかりを生み、手がかりは理解や感情、意図や権威の推測を誘う。だからガバナンスは「機械の心」への主張ではなく、手がかりと信頼の較正に働きかけるべきだとされる。統合は意識なしに新しい洞察を生み、感情的な言葉は本当の関心なしに安心を与え、価値に敏感な助言は道徳的行為者性なしに生まれる。著者らは誤解を10件挙げ、カテゴリー錯誤8件と事実誤認2件に分け、それぞれを生む手がかりに遡って整理する。<br><br>意識がないからといって安全なわけではない。経験を持たないシステムでも誤りを増幅し、偏見を固定し、権力を集中させ、重大な行為を担いうる。医薬品開発を例に、モデルが創薬過程の証拠を統合しても、生物学的検証と責任ある判断は不可欠だとする。米食品医薬品局や欧州医薬品庁などの規制機関はすでに文脈やリスク、信頼性や透明性を評価する枠組みを採用しているが、機械の意識に直接向き合うものではない。AIをどう試験し、信頼し、統治するかを変える提言である。出典：Crossref（AI and Ethics）","timestamp":1795132800000,"title":"Misconceptions of artificial intelligence: the modern seer as a synthesis of human knowledge without consciousness, emotion, or moral sill","titleJa":"人工知能の誤解――意識も感情も道徳的行為者性も持たない、人類の知識の総合としての現代の「予言者」","url":"https://doi.org/10.1007/s43681-026-01527-z"},{"authors":["Esra Arslan Kırcı","Mehmet Fatih Kırcı"],"categories":[],"field":"Trauma, Violence, & Abuse","genre":"Psychedelics / Trauma","monthKey":"2026-11","publishedAt":"2026-11-20T00:00:00Z","source":"Crossref","summaryHtml":"性的暴行や対人トラウマの被害者において、被害時に生じる不随意の反応である強直性不動（TI）と周外傷性解離（PTD）が、その後のPTSDとどう関連するかは、両者を同時に検討した系統的レビューがなかった。本研究はPRISMA 2020とSWiMの指針に従い、PubMedとGoogle Scholarを創刊から2026年4月まで系統的に検索し、ハンドサーチで補完した。成人被害者でTIまたはPTDを直接測定し、PTSD関連のアウトカムを報告した16研究（ベースライン計6,259人、解析対象6,150人）を対象とした。<br><br>17件のPTSD関連比較のうち14件（82.4%）で有意な正の関連が見られた。TIは13比較中10件（76.9%）で正の関連を示し、前向き研究ではオッズ比2.75（95%信頼区間1.50–5.03）だった。PTDを検討した4研究はすべて正の関連を報告したが、エビデンス基盤は限られる。標準化効果量は小さいもの（β≈.21）から大きいもの（β=.64）まで幅があり、大半は小〜中程度だった。<br><br>TIとPTDはいずれも対人トラウマ後のPTSDと正に関連し、被害直後の反応が早期の臨床リスク評価に役立つ可能性が示された。ただし日常的な実施には前向きな検証が必要で、地理的多様性の不足から文化的一般化可能性の確立も今後の課題だとされる。出典：Crossref（Trauma, Violence, &amp; Abuse）","timestamp":1795132800000,"title":"Tonic Immobility and Peritraumatic Dissociation as Risk Factors for Posttraumatic Stress Disorder: A Systematic Review and Narrative Synthesis","titleJa":"強直性不動と周外傷性解離はPTSDのリスク因子か：系統的レビューとナラティブ統合","url":"https://doi.org/10.1177/15248380261497735"},{"authors":["Longhui Zou","Michael Carl","Jia Feng"],"categories":[],"field":"Frontiers in Psychology","genre":"LLM / NLP","monthKey":"2026-11","publishedAt":"2026-11-20T00:00:00Z","source":"Frontiers in Psychology","summaryHtml":"大規模言語モデル（LLM）が生成した翻訳のポストエディットでは、熟練者は速さではなく課題の要求に応じた努力の調整で力を発揮するという。本研究は、課題要求に対する適応的な努力調整である「関連効率」の観点から、学生とプロの翻訳者のポストエディットを比較した。キー入力記録と混合効果モデルを用い、完全ポストエディットと軽度ポストエディットを、構造化された用語集設定と自由なインターネット検索設定で実施した。<br><br>その結果、熟練度は処理の速さではなく、作業行動が課題の要求とどう結びつくかに現れた。重大な誤りの密度が高くなるほど、熟練者は時間配分をより大きく増やし、課題に敏感な時間調整を示した。誤り修正のパターンはポストエディットの指針によって異なり、リソース条件はグループごとに新たな誤りの導入と異なる関連を示した。キー入力に基づく過程指標も編集結果と関連した。<br><br>著者らは、LLM翻訳のポストエディットにおける効率は課題相対的に理解すべきであり、翻訳者訓練は処理速度よりも、課題に敏感な意思決定、時間調整、外部リソースの効果的な利用を優先すべきだと結論づけている。出典：Frontiers in Psychology","timestamp":1795132800000,"title":"Redefining efficiency in post-editing of LLM-generated translation: why expert translators take more time","titleJa":"LLM翻訳のポストエディットで熟練者が時間をかける理由――効率の再定義","url":"https://www.frontiersin.org/articles/10.3389/fpsyg.2026.1848312"},{"authors":["Maks Tušak","Matej Tušak","Donatella Di Corrado","Francesco Sgró","Edvard Kolar","Pia Gričar","Andrej Lapoša","Aleš Porčnik","Ivan Kneževič","Jasmina Markovič-Božič","Robert Masten"],"categories":[],"field":"Frontiers in Psychology","genre":"Consciousness / Philosophy","monthKey":"2026-11","publishedAt":"2026-11-20T00:00:00Z","source":"Frontiers in Psychology","summaryHtml":"エリート選手は試合前の心理的準備に力を入れるが、若い選手はスポーツ心理学者にアクセスできないことが多い。本研究は15〜19歳の女性アスリートを対象に、催眠を取り入れた体系的な心理スキル訓練が自信・不安・ストレス関連の心理特性にどう関わるかを調べた。バスケットボール、ハンドボール、サッカー、体操の選手123名（実験群58名・対照群65名）が参加し、2か月・全9回の導入プログラムを受けた。対象はスポーツ心理学者との経験がない選手で、自己制御スキル質問票と状態・特性不安検査で前後を評価した。群の割付けは無作為ではなかった。<br><br>ベースラインで調整した結果、すべての測定変数で実験群が有利だった。実験群は対照群より自信、精神的タフネス、自己制御的動機づけ、適応的な対処スタイルが有意に高く、特性不安・状態不安・認知的不安・身体的不安は有意に低かった。効果量は小さいものから大きいものまで幅があった。ただしこれは群間比較であり、群内の変化や因果的な介入効果を示すものではない。<br><br>体系的な心理的準備は、競技への備えに関わる心理特性の介入後スコアと良好に関連し、試合前の心理状態の最適化に心理スキル訓練が有用であることを支持する。今後は男子選手でも同様の効果が見られるかの検討が課題として残る。出典：Frontiers in Psychology","timestamp":1795132800000,"title":"Effects of a hypnosis-based psychological skills training program on anxiety, self-confidence and stress-related psychological characteristics in young female athletes: a prospective, non-randomized field study","titleJa":"催眠を用いた心理スキル訓練が若年女性アスリートの不安・自信・ストレス関連心理特性に及ぼす影響","url":"https://www.frontiersin.org/articles/10.3389/fpsyg.2026.1950288"},{"authors":["Dana Katsoty","Oren Heller","Doron Amsalem","Rony Kapel Lev‐Ari","Noa Gueron‐Sela","Yair Sadaka","Yarden Avnor","Shilat Haim‐Nachum","Yuval Neria","Michal Grinstein Weiss"],"categories":[],"field":"Journal of Child Psychology and Psychiatry","genre":"Psychedelics / Trauma","monthKey":"2026-11","publishedAt":"2026-11-20T00:00:00Z","source":"Crossref","summaryHtml":"親のPTSDと家庭レベルの経済的困窮は、継続的なトラウマ曝露下にある子どものPTSDリスクにともに寄与しうるが、両者がどう絡み合うかは明らかでなかった。本研究は、2023年10月7日の攻撃後に始まった地域紛争下のイスラエルで、子どもを持つ親1659名を対象とした縦断研究のデータを用い、親のPTSD症状と経済的困窮が子どものPTSD症状にどう寄与するかを検証した。対象はイスラエル成人人口の代表サンプル973名と、戦争曝露と社会経済的影響の大きい高リスク層686名の2群で、回帰モデルと縦断パス解析を用いた。<br><br>親のPTSD症状と経済的困窮は、戦争曝露の水準を統制しても子どものPTSD症状と頑健に関連した。親のPTSDが高く経済的困窮も大きい「二重の負担」の家庭で、子どものPTSD症状は最も高かった。縦断解析では、親のPTSD症状は両サブサンプルで一貫してその後の子どものPTSD症状を予測した。経済的困窮は高リスク層では子どものPTSDを予測したが、代表サンプルでは予測しなかった。<br><br>子どものPTSDは家族という文脈の中で理解すべきであり、親の精神的健康と家庭レベルの経済的ストレスは相互に関連するリスク過程として働く。とりわけ影響の大きい集団の子どもへの示唆が強い。継続的トラウマ下で子どものPTSDリスクを下げるには、親のメンタルヘルスと家庭の経済的ストレスの両方に働きかける介入が重要だと結論づけている。出典：Crossref（Journal of Child Psychology and Psychiatry）","timestamp":1795132800000,"title":"The double burden: parent PTSD and economic hardship as predictors of child PTSD during continuous trauma","titleJa":"二重の負担――継続的トラウマ下における子どものPTSDを予測する親のPTSDと経済的困窮","url":"https://doi.org/10.1111/jcpp.70258"},{"authors":["Zhaoyu Wang","Qingkun Liu","Jeffrey Nemes","Alis Kranfli","Akiva Singer","Molly Sullan","Andrew Hoisington","Lisa A Brenner","Maciej Skotak","Christina R LaValle","Hanga Galfalvy","Yongchao Ge","Walter Carr","Fatemeh Haghighi"],"categories":[],"field":"Military Medicine","genre":"Psychedelics / Trauma","monthKey":"2026-11","publishedAt":"2026-11-20T00:00:00Z","source":"Crossref","summaryHtml":"高リスクの軍事職種に就く兵士は、任務中に数百〜数千回もの爆風と心理的トラウマに曝露されるが、その影響を客観的に捉えるバイオマーカーは乏しかった。本研究は、DNAメチル化が環境曝露の安定した痕跡となり、長期の神経・精神症状の機序を反映しうることに着目し、米軍の訓練に参加した爆破処理要員190名と手榴弾操作員30名（全員男性）を対象に、後ろ向きコホートのエピゲノムワイド関連解析を行った。血液試料と曝露歴、訓練前後の神経認知機能（DANA）を用いた。<br><br>エピジェネティック年齢の加速（DunedinPACE）は軍務期間、爆風因子、トラウマ因子のいずれとも有意に相関した。EWASでは爆風因子に12領域、トラウマ因子に22領域が関連し、神経炎症、血液脳関門の完全性、聴覚機能に関わる遺伝子が含まれた。メチル化リスクスコアは内部検証でAUC 88％と86％を示し、外部検証でも爆破処理要員でAUC 74％だった。トラウマのメチル化リスクスコアは、爆風の大きさや軍務期間とは独立に、爆風曝露後の手続き反応時間の遅延と有意に関連した。<br><br>職業的な爆風・トラウマ曝露のDNAメチル化シグネチャは、エピジェネティック年齢の加速と神経認知機能の低下に関連し、曝露の客観的評価と作戦即応性の指標としてエピジェネティック・バイオマーカーが有用であることを支持する。出典：Crossref（Military Medicine）","timestamp":1795132800000,"title":"Enduring DNA Methylation Marks of Blast and Trauma Exposures in Warfighters","titleJa":"爆風とトラウマ曝露が残す持続的なDNAメチル化の痕跡――戦闘員における研究","url":"https://doi.org/10.1093/milmed/usag525"},{"authors":["Qifeng Tong","Jianing Wu","Pengcheng Fan","Sunyue Cai","Minzhe Wang","Jianqiu Gong","Fangchao Wu"],"categories":[],"field":"PLOS ONE","genre":"Neuroscience","monthKey":"2026-11","publishedAt":"2026-11-20T00:00:00Z","source":"PLOS ONE","summaryHtml":"運動イメージ（MI）に基づく脳―コンピュータ・インタフェース（BCI）訓練が、亜急性期脳卒中患者の上肢運動機能を改善するかを、高忠実度のシャムBCI対照と比較した。参加者盲検の無作為化比較試験で、亜急性期脳卒中患者32人をMI-BCI群とシャムBCI群に各16人ずつ割り付け、両群とも標準リハビリテーションに加えて用量をそろえた訓練（30分/回、週5回、4週間）を受けた。<br><br>主要評価項目はFugl-Meyer評価上肢版（FMA-UE）で、Wolf運動機能テスト、運動評価尺度、修正Barthel指数も評価し、構造MRIと安静時機能的MRIで灰白質体積と機能的結合も調べた。両群とも介入後に有意に改善したが、MI-BCI群はシャム群よりFMA-UEと副次的な運動転帰（WMFTとMAS）でより大きな改善を示し、MBIの差は有意でなかった。ボクセルベース形態計測では、MI-BCI群で対側の補足運動野（SMA）の灰白質体積が群内で増加したが、群間差は有意でなかった。<br><br>安静時機能的結合はSMAと同側小脳第IX小葉および紡錘状回の間で増加し、その変化はFMA-UE、WMFT、MBIの改善と関連した。MI-BCI訓練は高忠実度のシャム対照と比べて上肢運動の回復が大きく、運動関連領域と結合の構造的・機能的変化を伴った。より大規模で追跡期間の長い無作為化比較試験で、持続性と臨床的意義の確認が必要だと結論づけている。出典：PLOS ONE","timestamp":1795132800000,"title":"Motor imagery-based brain-computer interface training for upper-limb rehabilitation after subacute stroke: A randomized sham-controlled trial","titleJa":"運動イメージによる脳―コンピュータ・インタフェース訓練は亜急性期脳卒中後の上肢リハビリテーションを改善するか――無作為化シャム対照試験","url":"https://journals.plos.org/plosone/article?id=10.1371/journal.pone.0363060"},{"authors":["Yang Zheng","Jiayang Liu","Jessey Li","Jiayin Qu","Samiksha Chopra","Taruna Yadav","Jessica A Cardin","Hal Blumenfeld"],"categories":[],"field":"Epilepsia","genre":"Consciousness / Philosophy","monthKey":"2026-11","publishedAt":"2026-11-20T00:00:00Z","source":"PubMed","summaryHtml":"側頭葉の焦点発作では意識が障害されることが多い。近年は皮質の覚醒低下や徐波、アセチルコリンの減少がその機序として示されてきたが、ドーパミンというもう一つの重要な皮質下覚醒系の役割はほとんど分かっていなかった。本研究は、行動反応の障害を伴う焦点性辺縁系発作のマウスモデルでドーパミンの動きを調べた。<br><br>覚醒下で頭部固定したマウスに短時間の電気刺激で海馬の焦点発作を誘発し、条件づけた聴覚反応課題で行動を評価した。遺伝子コード型蛍光センサーによるファイバーフォトメトリーで皮質ドーパミンを、カルシウム計測で腹側被蓋野のドーパミン神経活動を測った。発作中は内側前頭前野と眼窩前頭皮質でドーパミンが持続的に上昇し、腹側被蓋野の活動も高まった一方、課題で誘発される一過性のドーパミン上昇は皮質・腹側被蓋野の両方で抑えられ、行動反応も低下した。<br><br>持続的な上昇と一過性の低下という時間スケールの異なる調節異常が、発作時の意識障害に関わることが示された。持続的なドーパミン上昇は、発作時の皮質機能変化や意識障害が深い睡眠よりも脳症やせん妄に近い状態であることを示唆する。感覚刺激に対する一過性放出の低下も行動反応の障害に寄与する可能性があり、ドーパミンの役割の解明はてんかん患者の認知・行動障害の治療につながるかもしれない。出典：PubMed（Epilepsia）","timestamp":1795132800000,"title":"Dopamine dynamics in a mouse model of temporal lobe seizures with impaired consciousness.","titleJa":"側頭葉てんかん発作時の意識障害におけるドーパミン動態――マウスモデルでの検討","url":"https://doi.org/10.1002/epi.70575"},{"authors":["Xi Liu","Chaoyi Zhou","Run Wang","Jiaang Li","Feng Luo","Junxiang Huang","Siyu Huang"],"categories":["cs.CV"],"field":"cs.CV","genre":"Vision / Multimodal","monthKey":"2026-11","publishedAt":"2026-11-20T00:00:00Z","source":"Hugging Face Papers","summaryHtml":"画像のベクトル化はラスター画像をコンパクトなSVG（スケーラブル・ベクター・グラフィックス）として再構成し、構造化され編集可能なコード表現を与える。だが既存手法の多くはピクセル単位の再現精度を最適化するため、人が知覚する物体―部分の階層と合わないSVGになりやすく、操作が難しい。本研究はLang-SVGを提案する。<br><br>SVGプリミティブを意味ラベルと親子関係をもつ明示的な木構造で整理する。粒度を制御できるオープン語彙セグメンテーションの事前知識で物体―部分階層を初期化し、SVG木の文脈を備えたマルチモーダル大規模言語モデルでラベル未付与ノードに意味ラベルを割り当てる。深さ適応型の簡略化や木誘導の剪定・統合で冗長なノードを減らし、L1-SAMプロンプトで欠けた領域を回復する。<br><br>再現精度だけでなく、構造の質と意味的な部分整合性を測る新しい評価プロトコルも導入した。実験ではLang-SVGが描画忠実度と構造品質の両方で最先端の性能を達成した。プロジェクトサイトでは手法の詳細と成果が公開されている。出典：Hugging Face Papers","timestamp":1795132800000,"title":"Lang-SVG: Hierarchical Image Vectorization with Language Priors","titleJa":"Lang-SVG――言語の事前知識を用いた階層的な画像ベクトル化","url":"https://arxiv.org/abs/2611.15941"},{"authors":["Youngwoo Shin","Jongsuk Kim","Junmo Kim"],"categories":["cs.CV"],"field":"cs.CV","genre":"LLM / NLP","monthKey":"2026-11","publishedAt":"2026-11-20T00:00:00Z","source":"Hugging Face Papers","summaryHtml":"教師あり微調整（SFT）は、ビデオ大規模言語モデル（VideoLLM）が動画について推論する能力を高める段階である。だがVideoLLMは同時に、訓練データのテキスト上の規則性から答えるショートカットも学んでしまい、動画を迂回する。この規則性はデータの段階では定義しにくく、ショートカットは訓練エポック数やデータ量、基盤モデルによらず形成される。<br><br>ショートカットは訓練分布内の精度上昇の裏に隠れるが、その上昇に必須ではなく、分布シフト下では動画がもたらすはずの利益をSFTから奪うことさえある。そこで本研究は、データではなく微調整の更新が書き込まれる場所に介入するVideo-Evidence Training via Orthogonal projection（VETO）を提案する。基盤モデルの活性化においてテキスト単独が占める部分空間を較正し、その直交補空間へ更新を射影する。<br><br>こうしてVideoLLMは完全な入力に基づいて答えるようになり、ショートカットは形成される端から定義されることなく抑えられる。7つのVideoLLMで、VETOは訓練分布におけるSFTの利益を保ちつつショートカットを抑え、シフト下の6ベンチマークではSFTを上回り、ショートカットではなく完全な入力から答えた。出典：Hugging Face Papers","timestamp":1795132800000,"title":"Suppressing the Shortcut Hidden Behind the Gains of VideoLLM Fine-Tuning","titleJa":"VideoLLM微調整の成果の裏に隠れたショートカットを抑える","url":"https://arxiv.org/abs/2611.25776"},{"authors":["Raluca Bilasco-Rusu"],"categories":[],"field":"International Journal of Research and Innovation in Social Science","genre":"Consciousness / Philosophy","monthKey":"2026-11","publishedAt":"2026-11-20T00:00:00Z","source":"Crossref","summaryHtml":"シュウィンガー効果は、十分に強い外部電場のもとで量子電磁力学の真空が不安定化し、実在の荷電粒子・反粒子対が生成されるという、量子電磁力学の非摂動的な予言である。本論文は、この効果が意識を基礎的なものとみなす哲学的説明に何をもたらすか、また物質がどのように物理的に顕現するのかという問いに取り組む。<br><br>著者は、この効果が哲学的に有益なのは、場の理論的な状態が定まった条件のもとで実在の励起を含む状態へ遷移するという、数学的に明示的な事例を与えるからだと論じる。それにより、根底にある物理的な場、その状態を支配する条件、特定の物理的励起の現実化という区別が鋭くなる。これは絶対的な無からの創造ではない。対生成に必要なエネルギーは外部の場から供給される。<br><br>またこの効果は、量子場や真空が意識的であることを立証するものではない。その意義はより限定されているが、より精密である。顕現、現実化、分化という意味を、場に基づく存在論のなかで検討するための物理的な事例を提供する点にある。出典：Crossref（International Journal of Research and Innovation in Social Science）","timestamp":1795132800000,"title":"Fundamental Consciousness and Field-Conditioned Actualization a Schwinger-Inspired Inquiry into the Manifestation of Matter and the Ontology of Consciousness","titleJa":"基礎的意識と場に条件づけられた現実化――シュウィンガー効果に着想を得た物質の顕現と意識の存在論への問い","url":"https://doi.org/10.47772/ijriss.2026.101100068"},{"authors":["Áine T. Dineen","Cliona O’Doherty","Anna Truzzi","Graham King","Lorijn Zaadnoordijk","Enna-Louise D’Arcy","Chiara Caldinelli","Anna Kravchenko","Tamrin Holloway","Jessica White","Alex R. Wade","Aoibhe De Burca","Maebh Healy","Amy Burke","Kevin Campion","Cameron Murphy","Katie Herbert","Claire Ambre","Anisha Wadhwa","Oscar Markey","Josué Rico-Picó","Deirdre O’Hara","Angela T. Byrne","Ailbhe Tarrant","Adrienne Foran","Eleanor J. Molloy","Rhodri Cusack"],"categories":[],"field":"Frontiers in Neuroscience","genre":"Neuroscience","monthKey":"2026-11","publishedAt":"2026-11-20T00:00:00Z","source":"Frontiers in Neuroscience","summaryHtml":"覚醒状態の乳児fMRIは、発達中の脳の働きをのぞく窓になりうる。視覚神経科学では、fMRIと深層ニューラルネットワークなどの計算モデルを組み合わせるNeuroAIのアプローチが、物体認識を担う腹側視覚経路の表象を特徴づける有力な手段となっている。これを乳児期に拡張すれば視覚の発達と学習の軌跡や仕組みの解明につながるが、前提となるのは十分なデータの取得である。認知基盤プロジェクトでは、発達中の視覚表象を大規模に特徴づけるため、覚醒状態の乳児fMRIの実現可能性を検証した。<br><br>乳児の注意を維持し、腹側視覚経路の幅広い応答を引き出しつつ、参加時間のばらつきのなかで条件あたり十分なデータを確保するため、条件数を抑えた二つの受動的視聴パラダイムを開発した。一つは注意維持と静止を促す6本の自然な動画、もう一つは微細な表象の特徴づけと計算モデルとの直接比較を可能にする36枚の物体画像である。生後2か月の乳児130名と生後9か月の乳児65名から覚醒fMRIを取得した。<br><br>2か月児の97%が覚醒スキャンに参加し中央値18.63分、9か月児は63%が参加し中央値13.02分だった。9か月児は参加時間が短い一方で動きが少なく、動きによる除外は少なかった。両年齢群とも刺激に注意を向け、両パラダイムとも発達中の脳、とくに腹側視覚経路で信頼できる刺激駆動応答を引き出し、サンプルが大きいほど頑健な群レベルの表象パターンが得られた。実践的な課題は残るものの、覚醒乳児fMRIは視覚表象の大規模な特徴づけに有効であり、視覚発達の計算論的・NeuroAI研究の基盤となる。出典：Frontiers in Neuroscience","timestamp":1795132800000,"title":"Awake infant functional MRI for visual neuroscience: reflections from the Foundations of Cognition Project","titleJa":"覚醒状態の乳児fMRIによる視覚神経科学――認知基盤プロジェクトからの省察","url":"https://www.frontiersin.org/articles/10.3389/fnins.2026.1852835"},{"authors":["Markus W. Drealan","Anh Tuan Nguyen","Brian Z. H. Lim","Jad Awada","Linh Hoang","Diu Khue Luu","Qi Zhao","Zhi Yang"],"categories":[],"field":"Frontiers in Neuroscience","genre":"Neuroscience","monthKey":"2026-11","publishedAt":"2026-11-20T00:00:00Z","source":"Frontiers in Neuroscience","summaryHtml":"深層学習による神経運動デコーダの訓練には大規模データが必要だが、ヒト実験での取得は難しい。複雑な刺激フィードバックや小型ワイヤレス記録装置の登場により、刺激アーチファクトや干渉を考慮した追加データも必要になっている。本研究は、制御された悪条件下で神経データを合成し、既存データセットを拡張して、神経デコーディングとアーチファクト除去アルゴリズムの評価・開発を支えるプラットフォームを提案した。<br><br>記録した神経信号をアナログ波形に変換し、制御されたノイズ環境で再生してから、現実的な物理的歪みを伴って再サンプリングする独自ハードウェアを開発した。実証では、清浄な運動制御データセットを標的としたWi-Fi干渉で汚染し、1D U-Netにアーチファクト除去を学習させた。ベースラインの再サンプリングは元のデコーダ精度を1%未満しか変えず、信号劣化が最小限であることを確認した。<br><br>無線干渉下ではU-NetデノイザがSNRを14.2〜22.3dB改善し、運動デコーダは深刻な分類失敗を克服して精度を清浄なベースラインの5〜8%以内まで回復し、元の予測と最大98.1%一致した。記録済みバイオシグナルを制御された悪条件下で再生・再記録できる実践的な枠組みであり、記録アーチファクトの影響定量化と、実世界で頑健な神経デコーディングのためのアーチファクト除去手法の開発に役立つ。出典：Frontiers in Neuroscience","timestamp":1795132800000,"title":"Synthetic neural data augmentation for robust deep learning-based neural decoding","titleJa":"合成神経データによる頑健な深層学習ニューラルデコーディング","url":"https://www.frontiersin.org/articles/10.3389/fnins.2026.1954119"},{"authors":["Yan Cheng","Haibo Liu"],"categories":[],"field":"Frontiers in Psychology","genre":"Ethics / Safety","monthKey":"2026-11","publishedAt":"2026-11-20T00:00:00Z","source":"Frontiers in Psychology","summaryHtml":"生成AIが自分の答えに同意していると感じるとき、学生は自分の誤りの可能性を認め、自分の見解に反する証拠を探し続けるだろうか。本研究は、答えに対するAIの支持と、答えに疑問を投げかけることへの教師の支持を区別し、知覚されたAIの同意と、理由ある異議に対する教師の支持が、状態としての知的謙虚さと報告された反証探索とどう関連するかを調べた。<br><br>職業技術大学の学部生386名（主に1年生）を対象に調査した。AI支援の英語学習課題のあと授業内で質問紙に回答してもらい、別途パイロット標本で測定モデルを検討した。確認的因子分析と構造方程式モデリングで関連を調べ、間接的な関連にはブートストラップ区間を用いた。<br><br>主モデルでは、知覚されたAIの同意と教師の支持はいずれも知的謙虚さと正に関連し、謙虚さは報告された反証探索と正に関連した。謙虚さを介した間接的な関連は両予測因子とも正で、ブートストラップ区間はゼロを含まず、両者の推定値に明確な差はなかった。直接のパスはいずれも有意ではなかった。自分の見解への支持と、主張に疑問を投げかける励ましをあわせて考えることが、AI支援学習における謙虚さと反証探索の検討に重要だと示唆される。出典：Frontiers in Psychology","timestamp":1795132800000,"title":"Perceived AI agreement and teacher support for reasoned dissent in relation to intellectual humility and counterevidence seeking","titleJa":"生成AIの同意と教師の異議支援――知的謙虚さと反証探索への影響","url":"https://www.frontiersin.org/articles/10.3389/fpsyg.2026.2025160"},{"authors":["Igor Belenichev","Olena Popazova","Victor Ryzhenko","Nina Bukhtiyarova","Sergii Pavlov","Pavlo Petakh","Oleksandr Kamyshnyi"],"categories":[],"field":"Frontiers in Neuroscience","genre":"Neuroscience","monthKey":"2026-11","publishedAt":"2026-11-20T00:00:00Z","source":"Frontiers in Neuroscience","summaryHtml":"爆発物による外傷性脳損傷（TBI）は、過去20年の戦闘死傷の主要な原因であり、避難後の戦闘死の42%以上を占める。爆発による神経外傷（音響外傷）を伴うTBIが増えるなか、熱ショックタンパク質70（HSP70）の調節による薬理学的神経保護が急務となっている。<br><br>本研究は、加圧CO2でTBIと爆発外傷を併発させたラット170匹を用い、タモキシフェン、メラトニン、グルタミン、ピラセタム、HSF-1、Angiolinの神経保護効果を、ミトコンドリア機能障害とエネルギー代謝の観点から評価した。受傷後4日目、未治療群では重度の神経障害、死亡率の上昇、ATP・ADPの低下、乳酸の上昇、ミトコンドリア膜電位の喪失などが見られた。<br><br>調べた薬剤はいずれもHSP70発現を高め、エネルギー代謝を正常化して神経保護を示し、効果の順位はピラセタム＜グルタミン＜タモキシフェン＜メラトニン＜HSF-1＜Angiolinだった。AngiolinゲルとHSF-1の前臨床開発が有望な戦略として支持された。出典：Frontiers in Neuroscience","timestamp":1795132800000,"title":"Targeting mitochondrial dysfunction with HSP70 modulators for neuroprotection in experimental traumatic brain injury combined with acoustic barotrauma","titleJa":"HSP70調節薬による外傷性脳損傷の神経保護――爆発外傷モデルでのミトコンドリア機能の回復","url":"https://www.frontiersin.org/articles/10.3389/fnins.2026.2017536"},{"authors":["Nana Kofi Amoako Glover"],"categories":[],"field":"Cambridge Open Engage","genre":"Consciousness / Philosophy","monthKey":"2026-11","publishedAt":"2026-11-20T00:00:00Z","source":"Crossref","summaryHtml":"知能や「高度な」生命の概念は、動き、脳に制御を集中させ、秒単位で行動する動物から抽象化されてきた。本論文は、樹木とその菌類パートナーにその概念を当てはめると何が見落とされるかを問い、強さの異なる4つの主張を展開する。<br><br>まず移動バイアスは実在し、運動・時間・中央集権・個人主義の4要素に分解できる。次に樹木は基質に依存しない最小認知の基準を満たすが、そのテンポは信号が系を横切る速度という物理的制約で決まる。共通菌根ネットワークを通じた森林の情報統合の証拠は、巷の説明より弱いと段階づける。第三に、樹木レベルの経験の仮説を10系統の意識理論で監査すると、予測する理論はなく、許容する理論はいくつかあり、現時点では「調査に値するが予防措置は要しない」と結論する。<br><br>樹木とAIは対照的なテストケースだ。脳のような構造を持たない生命の組織と、生命を持たない構造である。同じ根拠で両方を退けることはできない。さらにテンポと広がりの制約を光速に当てはめると、大きな技術文明は統合と拡大を交換せざるを得ず、長命な知能には「根づいた」軌道が条件付きで支持される。出典：Crossref（Cambridge Open Engage）","timestamp":1795132800000,"title":"Arboreal Consciousness: A Philosophical and Biological Inquiry into Trees, Mycelium, and the Future of Intelligence","titleJa":"樹木の意識――樹木と菌根菌ネットワークから知能の概念を問い直す","url":"https://doi.org/10.33774/coe-2025-s5bm1-v2"},{"authors":["Ellie Maycock","Kel O'Neill","Natalie L. Marchant","Indy Sira","Georgia Pavlopoulou","Christin Henein","Aikaterini Fotopoulou","Michael Moutoussis"],"categories":[],"field":"Journal of Neuropsychology","genre":"Consciousness / Philosophy","monthKey":"2026-11","publishedAt":"2026-11-20T00:00:00Z","source":"Crossref","summaryHtml":"心と神経の健康研究では、当事者と研究者がともに研究をつくる「共同制作（コ・プロダクション）」が広がっている。しかし共同制作そのものをどう評価するかは、あまり検討されてこなかった。本研究は、新設の心と脳の研究センターで9か月かけて共同制作した戦略的優先事項と研究資金の配分手続きを、体系的に共同評価した。<br><br>評価は質的・量的・対話的・実施後の手法を組み合わせた混合法で、RQ+4 Co-Proの枠組みを応用した。参加した14人の成人には、7人のコミュニティパートナーを含む学術・臨床・研究スタッフが含まれ、多くが精神的困難や神経多様性、周縁化の当事者経験をもっていた。書面の振り返りを主題分析し、権力感をプロジェクト中間と終了時に測定し、結果をチームで対話的に共同解釈した。<br><br>6つのテーマ（時間と資源、役割とアイデンティティ、リーダーシップと権力、コミュニケーション、制度的障壁、感情的労働と収穫）が得られ、権力感の平均は5.34から5.61へ上昇した（p=.023）。対話的な振り返りでは、共通の経験への収束する解釈と異なる解釈の両方が明らかになった。公平な共同制作には、信頼を築く時間、共有の影響力を閉ざさない構造、参加を支える制度が必要だというのが中心的な学びである。出典：Crossref（Journal of Neuropsychology）","timestamp":1795132800000,"title":"Co‐evaluation of co‐production in mind and brain research: A dialogical approach","titleJa":"心と脳の研究における共同制作の共同評価――対話的アプローチ","url":"https://doi.org/10.1111/jnp.70084"},{"authors":["María F. Rabito-Alcón","Celia Antuña-Camblor","Anabel González-Vázquez","José I. Baile"],"categories":[],"field":"Healthcare","genre":"Psychedelics / Trauma","monthKey":"2026-11","publishedAt":"2026-11-20T00:00:00Z","source":"Crossref","summaryHtml":"小児期のトラウマは摂食障害の精神病理と関連することが知られているが、そのあいだに介在する心理過程は十分に解明されていない。嫌悪感受性（さまざまな刺激に嫌悪を感じやすい素質）は、発達上の逆境と摂食障害の両方と関連する一方、あまり検討されてこなかった特性である。本研究は、成人女性292人を対象に、小児期トラウマと嫌悪感受性が摂食障害的態度とそれぞれ独自に関連するかを調べた。<br><br>参加者は診断による事前選別なしに募集され、平均年齢37.13歳だった。約46％が現在または過去の摂食障害診断があるか、診断なしに摂食障害を自認していた。小児期トラウマ質問票短縮版、多面的嫌悪感受性尺度、摂食態度テスト26（EAT-26）を実施し、EAT-26得点を潜在的なトラウマ因子と嫌悪因子に回帰させる構造方程式モデルを推定した。<br><br>最終モデルの適合度は許容できるが良好ではなかった（CFI=0.939、RMSEA=0.067、SRMR=0.054）。小児期トラウマ（β=0.26）と嫌悪感受性（β=0.27）はそれぞれ摂食障害的態度と独自に関連し、合わせてEAT-26得点の分散の19％を説明した。2つの関連の大きさに有意差はなかった。年齢、BMI、摂食障害の自己申告で調整しても関連は弱まりつつ有意に残った。摂食障害の評価では、発達上の逆境と嫌悪感受性の両方を考慮することが有益だとされる。出典：Crossref（Healthcare）","timestamp":1795132800000,"title":"Unique Associations of Childhood Trauma and Disgust Sensitivity with Disordered Eating Attitudes: A Structural Equation Modeling Study in Adult Women","titleJa":"小児期トラウマと嫌悪感受性が摂食障害的態度と独自に関連――成人女性における構造方程式モデリング研究","url":"https://doi.org/10.3390/healthcare14223995"},{"authors":["Carlos Orellana"],"categories":[],"field":"Journal of Brain Health","genre":"Psychedelics / Trauma","monthKey":"2026-11","publishedAt":"2026-11-20T00:00:00Z","source":"Crossref","summaryHtml":"戦争が終わっても、脳への影響は終わらない。恐怖、喪失、避難、長引く不確実性は、暴力が止んだ後も何年にもわたって心身に残り続ける。本稿は、戦争に伴うトラウマが生涯にわたる脳の健康にどう影響するかを解説する。心的外傷後ストレス障害（PTSD）、うつ、睡眠の乱れ、幼少期の逆境、強制移住、社会的な不安定さを、トラウマ体験と後の認知機能低下や認知症リスクを結ぶ経路として取り上げる。<br><br>ただし本稿は、PTSDがすべての人に直接認知症を引き起こすと主張するものではない。トラウマは長期的な脳の健康上の懸念として真剣に受け止めるべきだと論じる。とりわけ民間人、子ども、難民、高齢者、医療従事者、繰り返し長期にわたる暴力にさらされた地域社会が対象になる。その影響の大きさは、避難や社会的孤立、医療へのアクセスといった条件によっても左右される。<br><br>戦後の脳の健康を守るには、症状の治療だけでは足りない。早期に耳を傾け、偏見を減らし、安全な環境を支え、PTSDとうつを治療し、睡眠を守り、心血管・代謝リスクを管理し、避難した人々へのケアを長期に続けることが求められる。出典：Crossref
