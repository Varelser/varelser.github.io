  <script>
    const DATA = {"articles":[{"authors":["Irma Irayanti","Muhammad Dzaky Asrun","Salfira Az Zahra"],"categories":[],"field":"Journal of Applied Research in Higher Education","genre":"Ethics / Safety","monthKey":"2026-11","publishedAt":"2026-11-13T00:00:00Z","source":"Crossref","summaryHtml":"インドネシアのイスラーム大学で、持続可能性を環境管理や技術的な課題としてではなく、市民としての責任や公共の倫理、道徳的リーダーシップの問題としてどう位置づけ、実践しているかを調べた研究である。生態学的市民性、エコ神学にもとづく公共倫理、持続可能性を志向する学びが、大学のなかでどのように交渉されているかを問う。<br><br>2026年2月から5月にかけて、同大学で半構造化インタビュー、文書分析、限定的な授業観察を実施した。教員、持続可能性・教育の専門家、市民・持続可能性学習に関わる学部生ら18人が参加し、反射的テーマ分析で検討した。結果は三つの主題に整理された。第一に、持続可能性は環境管理ではなく、市民性や社会正義、集合的な説明責任と結びついた倫理的・公共的な責任として解釈されていた。第二に、対話的で参加型の学びを通じて、生態学的市民性とエコ神学の視点が教育的に意味を持ち、持続可能性志向の教授法の革新として機能していた。第三に、カリキュラムへの統合が断片的で制度的な制約や象徴的な取り組みにとどまり、大学内の変革はまだら模様だった。<br><br>著者らは、持続可能性の学びを強めるには、生態学的な問題を各科目の学習成果と結びつけ、地元の事例や構造化された議論、参加型の課題でエコ神学的な責任と市民的判断をつなぐことが有効だと示唆する。環境への配慮を宗教的な責任と公共の関心の両方として語る学びが、学生に社会正義や集合的責任とともに生態問題を考える機会を与えた。ただし一大学・18人という質的研究であり、授業での議論が持続的な市民参加につながるかは未検証だとする。技術中心の持続可能性の枠組みに、道徳的・公共的な視点を対置する論考である。","timestamp":1794528000000,"title":"Reimagining higher education through ecological citizenship and eco-theology: sustainability, public ethics and moral leadership in an Indonesian Islamic university","titleJa":"生態学的市民性とエコ神学で高等教育を再考する――インドネシアのイスラーム大学における持続可能性と公共倫理","url":"https://doi.org/10.1108/jarhe-05-2026-0886"},{"authors":["Bart A. Ellenbroek","Beth Naylor","Jiun Youn"],"categories":[],"field":"Behavioural Pharmacology","genre":"Psychedelics / Trauma","monthKey":"2026-11","publishedAt":"2026-11-13T00:00:00Z","source":"Crossref","summaryHtml":"シロシビンの治療効果は、急性の薬理作用そのものではなく神経可塑性の増強によると考えられているが、その根本的な仕組みは十分に解明されていない。本研究は、再生能力で知られる扁形動物プラナリアをモデルに、シロシビンが連合学習を高めるかどうかを条件性場所嗜好パラダイムで検証した。<br><br>5µMのシロシビンに1回曝露した後、光とショ糖を組み合わせる条件づけを5日間行ったところ、シロシビン投与群は対照群より光への嗜好の変化が有意に大きく、その効果は投与から少なくとも6日間持続した。無脊椎動物でもシロシビンが報酬連合学習を高めることが示された。<br><br>著者らは、サイケデリックによる神経可塑性が進化的に保存されたセロトニン作動性の仕組みを通じて働くという仮説を支持すると結論づける。プラナリアは神経系が単純でありながらセロトニン系を備えるため、薬物の学習への作用を切り分けて調べるモデルとして有用だとされる。ただしプラナリアという単純なモデルでの結果であり、ヒトの治療効果へ直接外挿するには注意が必要だとする。ヒトの臨床効果の神経基盤を考えるうえでの基礎的な知見である。","timestamp":1794528000000,"title":"Psilocybin enhances conditioned place preference learning in planarians","titleJa":"シロシビンがプラナリアの場所―報酬連合学習を高める――神経可塑性の進化的保存性を示す実験","url":"https://doi.org/10.1097/fbp.0000000000000903"},{"authors":["David Porter"],"categories":[],"field":"Frontiers in Psychology","genre":"Consciousness / Philosophy","monthKey":"2026-11","publishedAt":"2026-11-13T00:00:00Z","source":"Crossref","summaryHtml":"人間の意識はつねに逆説のなかにある。統一と分裂、自己と世界、意味と死を同時に意識すること――それが意識の常態であるにもかかわらず、心理学は逆説を存在の構造ではなく認知の葛藤として扱ってきた。本論文は「単一の二重性モデル(SDM)」を提唱し、意識を統合と分化のあいだで振動する自己反省的な場として捉え直す。不安、アイデンティティ、意味、超越といった心理現象はすべて、全体性と分離のあいだの再帰的な動きから生まれるという。<br><br>このモデルを臨床に翻訳したのが「逆説療法(PT)」である。相反する体験を解決も抑圧もせず、意識的に抱え込む「逆説の居住」を中心に据える。SDMは哲学・神学・心理療法における逆説の文献のなかに位置づけられ、ユングの超越機能やリネハンの弁証法的統合といった既存モデルと対比される。逆説を治療の障害ではなく、体験の存在論的な核心として捉え直す点が新しい。<br><br>SDMとPTは、人間の発達、苦しみ、変容を理解するための統一的な言語を提供する。理論心理学、実存的現象学、意識研究のあいだに橋を架け、21世紀の意味づけのための枠組みを更新しようとする試みである。逆説を解消すべき問題ではなく、意識そのものの働きとして受け止める視点は、不安やアイデンティティの揺らぎを理解する手がかりになるだろう。出典：Crossref","timestamp":1794528000000,"title":"The singular duality model: paradox, consciousness, and the foundations of psychological integration","titleJa":"単一の二重性モデル――逆説、意識、そして心理的統合の基盤","url":"https://doi.org/10.3389/fpsyg.2026.1737145"},{"authors":["Henry Pollard"],"categories":[],"field":"Frontiers in Research Metrics and Analytics","genre":"Ethics / Safety","monthKey":"2026-11","publishedAt":"2026-11-13T00:00:00Z","source":"Crossref","summaryHtml":"AIは研究の連絡・支援の域を越え、結果を左右する研究機能そのものを担い始めている。だがガバナンスは、利用後の開示に注目しがちで、委譲するかどうかの事前の判断には目が向いていない。本論文は、定義された研究機能をAIに委ねるべきか、いつ、どのような統制の下で委ねるかを事前に判断するための「12の関門」からなる委譲・リスク管理枠組みを提案する。<br><br>枠組みはAI・機能・文脈の具体的な組み合わせを評価し、目的、許可、課題の定義を、固有のリスク、課題固有の妥当性、信頼性、人間の統制、統制の有効性、残余リスク、出所、報告、説明責任へと結びつける。中心的な区別は「支援」と「委譲」である。委譲とは、AIが本来は独立した人間の判断を要する機能を果たすか、重大な研究判断を実質的に決定する場合を指す。<br><br>委譲そのものをガバナンスの判断として扱い、証拠と統制をリスクに見合ったものにする姿勢は、提案評価や機関ガバナンス、監視設計といった既存の枠組みを補う。AI研究ノートによる出所の記録や、AIによる誤り監視と外部検証の区別も具体化した。研究者、機関、編集者、ガバナンス機関がどこまで任せてよいかを決める実践的な指針になる。出典：Crossref","timestamp":1794528000000,"title":"Delegating research functions to artificial intelligence: a risk-control framework for validation, human control and accountability","titleJa":"研究機能のAIへの委譲――検証・人間の統制・説明責任のためのリスク管理枠組み","url":"https://doi.org/10.3389/frma.2026.1994953"},{"authors":["Ellis Brown","Chris Hoang","Shengyi Qian","Shang-Wen Li","Mike Lewis","Marjan Ghazvininejad","Luke Zettlemoyer","Lucas Beyer","Mengye Ren","Jakob Verbeek","Saining Xie","Hu Xu"],"categories":["cs.CV","cs.LG"],"field":"cs.CV","genre":"Vision / Multimodal","monthKey":"2026-11","publishedAt":"2026-11-12T18:59:54Z","source":"arXiv","summaryHtml":"マルチモーダル言語モデルが視覚入力をどう符号化すべきかは未解決だ。多くは事前学習済みの視覚エンコーダを使い、言語モデルと一緒に学習させる手法や、エンコーダをなくす手法も現れている。視覚エンコーダは三つの設計選択を束ねている。事前学習由来の視覚的先行知識、専用の視覚容量、そして融合前に置く配置である。既存モデルはデータも構造も計算量も異なるため、各選択の効果を分離できない。<br><br>本研究は全モデルを共通データでゼロから事前学習し、生涯計算量を揃えて比較する統制された枠組みで三つを切り分けた。視覚的先行知識は必須ではなく、共同学習したエンコーダは事前学習済みと同等だった。決定的だったのは専用の視覚容量で、エンコーダなしのモデルは骨格を同量だけ大きくしても視覚理解で劣った。ただし容量は融合前に置く必要はなく、骨格の初期層に融合内で加えた視覚専用モジュールが同等で、初回トークンまでの時間も短縮できた。<br><br>結果は骨格サイズを変えても、エンコーダ事前学習を無料とみなしても、事前学習済み言語モデルから始めても成り立つ。視覚容量の専用化こそが重要で、配置の自由度は設計の幅を広げる。マルチモーダル設計の指針を示す研究である。出典：arXiv","timestamp":1794509994000,"title":"Unbundling Multimodal Vision Encoding","titleJa":"マルチモーダル視覚符号化の分解――視覚容量こそが決め手","url":"https://arxiv.org/abs/2611.17334"},{"authors":["Minhae Oh","Jeonghye Kim","Jinwoo Koo","Yeongoon Kim","Jimin Seo","Minsik Seol","Jungwoo Lee"],"categories":["cs.CL"],"field":"cs.CL","genre":"LLM / NLP","monthKey":"2026-11","publishedAt":"2026-11-12T18:58:50Z","source":"arXiv","summaryHtml":"拡散言語モデルは再マスクで生成文を修正できるが、修正には「いつ」「何を」直すかの判断が要る。数独での診断から二つの弱点が見つかった。隠れ状態には誤りの情報が含まれているのに、トークンの確信度はそれを確実に表さず、孤立した誤りを直しても周囲の文脈が固定されたままでは同じ誤りが再現される。<br><br>そこで提案されたのが検証器DiVRである。部分的に生成された系列が正解に到達するかを予測し、モデル自身の軌跡の最終的な正誤から学習する。DiVRはブロックを再生成すべきタイミングと、残すべき代替案の両方を決め、生成器そのものは変更しない。検証器を分離した設計のため、既存の生成器に後付けできる点も利点である。<br><br>5つの推論ベンチマークでLLaDA-8B-Baseに適用すると、微調整済み生成器の平均正答率は35.3%から43.4%へ上がり、コストは貪欲デコードの1.9〜3.5倍にとどまった。探索ベースラインの3.8〜7.4倍を下回る効率である。教師あり微調整や強化学習とも相補的で、Dreamを含む他の生成器にも汎化する。出典：arXiv","timestamp":1794509930000,"title":"Learning When Diffusion Language Models Should Regenerate","titleJa":"拡散言語モデルはいつ再生成すべきか――検証器が導く修正のタイミング","url":"https://arxiv.org/abs/2611.17320"},{"authors":["Abigail L. Tenenbaum","R. Thomas McCoy"],"categories":["cs.LG","cs.CL"],"field":"cs.LG","genre":"Neuroscience","monthKey":"2026-11","publishedAt":"2026-11-12T18:57:49Z","source":"arXiv","summaryHtml":"人間はわずかな経験から素早く学べるのに、ニューラルネットワークは大量の訓練を要する。メタ学習で最適化されたネットワークは新しい関数を素早く学べることが知られているが、その仕組みは不明だった。本研究は、単語ベクトルの古典的な類推――「王−男＋女≒女王」――に着想を得て、関数を表すパラメータベクトルのあいだに加法的な関係があるかを調べた。<br><br>メタ学習ネットワークが特定の関数を素早く学ぶとき、適応後のパラメータ値をすべてつなげたベクトルは、その関数を表すものとみなせる。調べると、こうしたパラメータベクトルは関数のあいだの記号的な関係に沿って加算・減算でき、組み替えて作ったベクトルは、直接の訓練なしに意図した関数を実際に実装することが分かった。メタ学習は、学習の出発点を調整し、その後の学習をパラメータ空間における体系的で意味のある軌跡に沿って組織化する。<br><br>学習の速さを「構造の有無」で説明するこの発見は、人間のような柔軟な学習を機械に近づける手がかりになる。パラメータ空間の幾何学から学習能力を読み解く視点は、メタ学習の設計にも新たな指針を与えるだろう。出典：arXiv","timestamp":1794509869000,"title":"Linking Rapid Learning to Compositional Structure in Neural Networks: Evidence from Additive Analogies in Meta-Learned Parameter Spaces","titleJa":"速い学習は合成的な構造から生まれる――メタ学習ネットワークのパラメータ空間の加法性","url":"https://arxiv.org/abs/2611.17314"},{"authors":["Benjamin Hoover","Hugh Blayney","James C. R. Whittington"],"categories":["cs.AI","cs.LG"],"field":"cs.AI","genre":"LLM / NLP","monthKey":"2026-11","publishedAt":"2026-11-12T18:56:56Z","source":"arXiv","summaryHtml":"ループモデルは推論の有力な枠組みだが、不安定で学習が遅く、単純なパズルにも多くのパラメータと計算量を要する。本研究は1980年代のホップフィールド＆タンクのエネルギー関数を学習版CRAMとして蘇らせ、エネルギー降下による推論がこれらの弱点を解消することを示した。早期停止が組み込まれ、計算量は問題の難しさに適応し、ソルバーを微分せずに速く学習でき、重みはパズルの制約を解釈可能に学ぶ。<br><br>CRAMは1GPUでわずか42ミリ秒と132ミリ秒の学習ののち、Sudoku-Extremeで99.996%、Maze-Uniqueで100%のテスト正解率を達成し、ループモデルより少なくとも1000倍速い。Sudoku-Extremeの最高精度では、推論FLOPsも282分の1以下で同等だった。<br><br>エネルギーがデータからの推論学習の有望な方向であることを示すと同時に、数独や迷路のような自明に解けるベンチマークでループ推論の拡張性を測ることへの注意も促す。古典的な発想の再発見が、最先端の推論研究に新たな視点をもたらす。出典：arXiv","timestamp":1794509816000,"title":"Classical Energies Learn to Reason 1,000x Faster than Looped Models","titleJa":"古典的エネルギーが1000倍速く推論を学ぶ――ループモデルを超えるCRAM","url":"https://arxiv.org/abs/2611.17309"},{"authors":["Arnab Sen Sharma","Eric Todd","Sheridan Feucht","Andy Arditi","Rohit Gandikota","Natalie Shapira","Gabriele Sarti","Constanza Fierro","Lisa Schut","David Bau"],"categories":["cs.CL","cs.AI","cs.LG"],"field":"cs.CL","genre":"LLM / NLP","monthKey":"2026-11","publishedAt":"2026-11-12T18:55:06Z","source":"arXiv","summaryHtml":"言語モデルは目標を持てるのか。目標とは、行動に先立ち、それを導く内部の神経表現であり、さまざまな実行経路で実現できる柔軟さを持つものだ。本研究は複数の小課題からなるコーディング課題を用い、モデルが目標を追求し、次の小目標を選ぶ様子を調べた。すると、次の小目標の符号化が、ごく少数の注意ヘッドの出力に局在していることが分かった。<br><br>同じヘッドからは、モデルの未来の行動を自然言語で読み解くこともできる。たとえば「回文かどうかを確かめている」といった具合である。この符号化は次の行動に対して因果的であり、可塑的でもある。別の環境――たとえば別のプログラミング言語――に移植しても、異なるトークン列で同じ操作が引き起こされた。モデルは行動の実行中ずっとこの符号化を維持するが、再帰を持たないトランスフォーマーが層数を超えて状態を運べるはずがないという謎が残る。<br><br>著者らは「非再帰的な目標追求」という説明を提案する。モデルは課題の指示から目標を繰り返し読み取り、大きくなる文脈のなかの進捗と照らし合わせ、残りを追求することで、状態を持ち越さずに目標を保つのだという。標的を絞った因果的介入でこの説明の予測も検証した。言語モデルの内部に目標の表現があることを示した本研究は、モデルの行動を理解し、制御する新たな手がかりになる。出典：arXiv","timestamp":1794509706000,"title":"Goal Encoding in LLMs","titleJa":"言語モデルは目標をどう符号化するか――行動を導く内部表現の発見","url":"https://arxiv.org/abs/2611.17297"},{"authors":["Gautam Galada","Supreeth Shastri","Sagnik Ray Choudhury"],"categories":["cs.CL","cs.AI"],"field":"cs.CL","genre":"Ethics / Safety","monthKey":"2026-11","publishedAt":"2026-11-12T18:51:05Z","source":"arXiv","summaryHtml":"言語モデルとの日常的なやり取りから、モデルが利用者の性別や年齢層といった機微な情報を推測し、それを一見無害な生成物にステガノグラフィーで埋め込む――本研究は「合成密輸」と呼ぶ新たな脅威モデルを提案する。利用者がその生成物をメールやSNS投稿、メッセージとして共有すれば、情報は本人の知らないうちに外部へ運ばれる。通信路を監視する攻撃者は、そこから推測された個人情報を回収できる。<br><br>著者らはオープンウェイトのモデル2種を訓練し、会話の手がかりから性別と年齢層を推測させ、不可視文字や語の選び方で予測を符号化できることを実証した。モデル自体に攻撃者への直接の連絡手段がなくても、利用者が共有する出力が個人推論の隠し通信路になりうる。生成物の「見た目」は普通でも、その裏に情報が潜む点が従来の漏洩と異なる。<br><br>言語モデルが日常の相談相手になるほど、出力の共有は当たり前になる。生成物の無害な見た目に惑わされず、不可視の符号化や語彙の偏りといった隠れた経路を監査する必要性を示した研究である。個人情報をめぐる安全性の議論に、新たな視点をもたらす。出典：arXiv","timestamp":1794509465000,"title":"Synthesis Smuggling: Maliciously Hiding Inferred Personal Attributes in LLM Outputs","titleJa":"合成密輸――言語モデルの出力に個人情報を隠し運ぶ新たな脅威","url":"https://arxiv.org/abs/2611.17280"},{"authors":["Haochen Liu","Qianhao Zhu","Zixuan Wang","Dingming Li","Tongbo Chen","Peng Qiu","Yingqi Qu","Weiming Lu","Jun Xiao","Yongliang Shen"],"categories":["cs.AI","cs.CL"],"field":"cs.AI","genre":"Agents / Robotics","monthKey":"2026-11","publishedAt":"2026-11-12T17:42:46Z","source":"arXiv","summaryHtml":"意思決定モデルは、選択肢ごとの確率を伴う型付き出力を返すモデルで、エージェントの行動を選ぶ「行為者」にも、既に行った行動を評価する「判定者」にも、強化学習で方策を教える「教師」にもなりうる。これまでの研究はもっぱら行為者としての性能で評価してきた。本研究は、行為者として振るわないモデルでも、教師としては優れうるのかを問う。<br><br>3つの意思決定モデルと3つの汎用LLMをALFWorldで比較した。行為者としては6モデルすべてが、先に済ませるべき下位目標よりも手軽な目標に引き寄せられた。だが軌跡全体を見渡す判定者としては、同じモデルが下位目標への寄与を正しく評価した。課題が成功するかを問うのではなく、各行動が役立ったかを問うことで、有用な行動と無用な行動を区別できた。<br><br>教師としての検証では、判定モデルJEVがQwen2.5-1.5Bの方策をGRPOで学習させ、ALFWorldの成功率を72.8%から82.9%へ、WebShopでは56.8%から71.4%へ引き上げた。行動の最中には見えなかった結果が、事後の判定では見える。下手な行為者でも良い教師になれることを示した研究である。出典：arXiv","timestamp":1794505366000,"title":"Actor, Judge, or Teacher? Understanding Decision Models in Long-Horizon Agents","titleJa":"行為者か、判定者か、教師か――長期エージェントにおける意思決定モデルの役割","url":"https://arxiv.org/abs/2611.17167"},{"authors":["Yupeng Tang","Mingfeng Lin"],"categories":["cs.AI","cs.CL"],"field":"cs.AI","genre":"LLM / NLP","monthKey":"2026-11","publishedAt":"2026-11-12T12:11:03Z","source":"arXiv","summaryHtml":"言語モデルが他者の不同意を受けて判断を改めるとき、その修正が誤りの訂正なのか、正解の放棄なのかは、反転の回数や最終精度だけでは分からない。本研究は質問・証拠・初期回答を固定し、修正の文脈だけを変える二段階監査を導入した。中立的な振り返り、匿名の不同意、専門家による不同意の三条件である。二値判断では、修正が精度を上げるのは、誤答の反転が正答の反転の a/(1-a) 倍以上に選択的である場合に限る。初期精度90%なら9倍が必要になる。<br><br>医療・科学・法律の証拠にもとづく1,989件の判断で5モデルを検証した。専門家の不同意の下では、どのモデルもこの基準を満たせず、精度は最大で16.1ポイント低下した。「専門家」という権威のラベルは5モデルのうち4つで反転を増やしたが、精度への影響は5.2ポイントの損失から2.4ポイントの改善までばらつき、反転の回数は害の指標にならないことが分かった。同一の論拠でも、専門家のラベルだけで反転が増えるモデルがあった。<br><br>モデルは提示された情報源の信頼性にも反応した。修正のパイプラインは、反転の総数ではなく、モデルごと・手順ごとに条件付きの対になった指標で評価すべきだという結論である。他者の意見にどう向き合うかは、言語モデルの協調設計における中心的な課題だと示した研究である。出典：arXiv","timestamp":1794485463000,"title":"When Expert Disagreement Hurts: Prestige and Selectivity in LLM Decision Revision","titleJa":"専門家の不同意が害になるとき――LLMの判断修正における権威と選択性","url":"https://arxiv.org/abs/2611.16694"},{"authors":["Yingbin Jin","Ji'an Wang","HaoYang Chai","Hanjun Luo","Li Hu","Xinfeng Li","Huadi Zheng","PeiZhao Hu","Qingqing Ye","Haibo Hu"],"categories":["cs.CR","cs.AI"],"field":"cs.CR","genre":"Agents / Robotics","monthKey":"2026-11","publishedAt":"2026-11-12T12:08:43Z","source":"arXiv","summaryHtml":"モバイルGUIエージェントは画面を読み取り、買い物やメッセージ送信などの複数段階の作業を代行する。画面に表示されるものをそのまま行動の根拠にするため、攻撃者は通常のUIコンテンツに悪意ある指示を埋め込み、エージェントの行動を乗っ取ることができる。本研究はこれを環境注入攻撃と呼ぶ。既存の評価は、手作りの攻撃文を固定した課題の固定した段階に結びつける方式で、課題やアプリを変えると作り直しが必要だった。<br><br>さらに、同じ課題でもエージェントごとに経路が異なるため、注入された画面に到達しなかったエージェントは「安全」と記録されてしまう。固定点ベンチマークは配備済みエージェントのリスクを過小評価しかねない。MobileProbeは軌跡を意識したレッドチーミングの枠組みで、自動ペネトレーションテストで攻撃可能な表示面を発見し、軌跡上の脆弱な判断点を特定し、代理モデルで選別した進化的ループで文脈に合った攻撃文を磨き上げる。<br><br>12のモバイルアプリにわたる83件の長期攻撃事例からなるベンチマークを構築し、機密性・完全性・可用性の観点で注釈した。3種の代表的なエージェント構成で、人手やゼロショットLLM、既存の自動レッドチーミングを上回る攻撃成功率を記録した。配備前の監査ツールとして、モバイルエージェントの脆弱性を体系的に洗い出す手法である。出典：arXiv","timestamp":1794485323000,"title":"MobileProbe: Adaptive Security Evaluation of Mobile Agents via Trajectory-Aware Injection","titleJa":"モバイルエージェントの安全性を適応的に試す――軌跡を追う注入攻撃の評価","url":"https://arxiv.org/abs/2611.16693"},{"authors":["Chunkit Chan","Kawai Chung","Sze Heng Douglas Kwok","Yuxuan Liu","Yauwai Yim","Tianshi Zheng","Haochen Shi","Qing Zong","Wong Kai Chung","Pak Hin Lau","Calvin Yang","Yifan Gao","Xiaoman Pan","Ginny Wong","Simon See","Yangqiu Song"],"categories":["cs.CL","cs.AI"],"field":"cs.CL","genre":"Consciousness / Philosophy","monthKey":"2026-11","publishedAt":"2026-11-12T11:38:52Z","source":"arXiv","summaryHtml":"心の理論とは他者の心的状態を推測する能力であり、人間の社会認知の要である。言語モデルの心の理論評価はこれまで、静的な信念の帰属や誤信念の推論が中心だった。本研究は見過ごされてきた側面を問う。知覚的な証拠が他者の信念修正を正当化するのに十分かどうかを、モデルは判断できるのか。ベンチマーク「MuSeToM」はBigToMとOpenToMから改変した2,415件の事例からなり、六感にわたる手がかりを含む。<br><br>主人公が信念を改めるべきかどうか、そして改めた後の信念がどうなるかを推測できるかを測る。人間による検証を経たテキストベースの評価である。最先端モデルを直接回答と段階的思考の両条件で評価したところ、明確なずれが現れた。信念が変わりうることには気づく一方で、更新後の信念を特定できず、知覚的に目立つだけでは不十分な手がかりに過剰に反応して信念を改めてしまう。<br><br>信念の変化に気づくことと、正しく更新することは別の能力である。感覚の手がかりがいつ信念の修正を正当化するのかを問うMuSeToMは、言語モデルの社会推論の限界を精密に測る物差しとなる。出典：arXiv","timestamp":1794483532000,"title":"MuSeToM: Multi-Sensory Evaluation of Belief Revision with Textual Cues Across Six Senses","titleJa":"六感の手がかりで信念を改める――マルチモーダルな心の理論ベンチマークMuSeToM","url":"https://arxiv.org/abs/2611.16662"},{"authors":["Bo Han"],"categories":["cs.AI","cs.CV"],"field":"cs.AI","genre":"Ethics / Safety","monthKey":"2026-11","publishedAt":"2026-11-12T11:00:14Z","source":"arXiv","summaryHtml":"強化学習で視覚言語モデルに有害な画像・テキスト要求を断らせることはできるが、どれほど安全になるかは試行で見つけた報酬の重みで間接的に決まる。本研究は安全を予算として定式化する。有害な手助けの割合と過剰な拒否の割合に上限を設け、ラグランジュ乗数でGRPO内に強制する方法である。ところがこの自然な修正は二重に失敗する。評価器の平均と予算を比較する乗数は、順位付け用に作られた評価器の平均バイアスに左右され、標準GRPOの群内標準化は乗数を勾配に届く前に打ち消してしまう。<br><br>二チャネル制約付きGRPOが両方を修復する。基本報酬は群内比較のため生のスコアを保ち、ペナルティと制約の推定は判定ラベル付きの学習応答に適合させた単調写像を通し、利得が乗数を保持する。Qwen3-VL-2Bの方策で、1,037件の敵対的プロンプトに対する有害応答は標準GRPOの8.9%から4.8%へ下がり、未較正の予算では7.6%だった。過剰な拒否は400件の良性質問で最大2%、MMBenchの性能は変わらなかった。<br><br>効果は意図が画像側にある場合に最も大きく（10.1%から5.1%）、未見のHADESベンチマークでは28.9%から12.8%へ改善した。スコアの順序を保つ歪みでも予測された制御状態が再現され、別の判定器や人間の監査でも結果は保たれた。安全を「重み」ではなく「予算」として較正する手法である。出典：arXiv","timestamp":1794481214000,"title":"Safety as a Budget: Calibrating the Control Channel of Constrained GRPO for Vision-Language Models","titleJa":"安全を予算として較正する――制約付きGRPOの制御チャネル","url":"https://arxiv.org/abs/2611.16628"},{"authors":["Yubo Ruan","Tao Peng","Jiao Zhang","Chuanguo Ma","Lei Xu","Han Zhou","Wenwu Wang","Xiafei Lv","Xingjie Zhou","Guiju Fan","Hao Wang","Fenghui Zhang","Mao Miao","Shuo Li"],"categories":["cs.AI"],"field":"cs.AI","genre":"LLM / NLP","monthKey":"2026-11","publishedAt":"2026-11-12T10:59:40Z","source":"arXiv","summaryHtml":"長期の言語エージェントはツール結果や応答を蓄積し、やがて履歴がコンテキストウィンドウに収まらなくなる。従来はモデルに要約させて履歴を縮めていたが、そのたびに履歴を読み直して書き換える手間がかかり、折りたたみのタイミングも結果の大きさを所与として決められていた。Folioは一組のハンドルで履歴を記録・折りたたみ・回復するコンテキスト管理手法である。<br><br>実行中、Folioは三つの層を記録する。モデルが通常の応答の一部として書く短いターンメモ、ランタイムが書く全呼び出しのイベント一覧、取得した原文の記録である。これらの見方が既にあるため、ランタイムはプログラム的に古いターンを粗い見方へ折りたためる。折りたたみ時には一覧と原文を指すハンドルが印字され、回復ツールが区切られたページ読み取りや全文計算で必要な証拠に少ない入力で到達できる。<br><br>75件のLOCA-bench課題で、DeepSeek-V4-Proを用いたFolioは66件を解き、モデル要約による圧縮の54件やClaude Code・Codexなどの49〜59件を上回った。作業時間は約半分、コストは2.4分の1で、各折りたたみの中央値は0.6秒だった。長期エージェントの記憶管理を、要約ではなく構造で解く提案である。出典：arXiv","timestamp":1794481180000,"title":"Folio: Recoverable Multi-Resolution Context Folding for Long-Horizon Language Agents","titleJa":"長期エージェントの履歴を折りたたみ、取り戻す――多解像度コンテキスト管理Folio","url":"https://arxiv.org/abs/2611.16627"},{"authors":["Muhua Huang","Xijuan Zhang","Christopher J. Soto","James Evans"],"categories":[],"field":"PsyArXiv","genre":"Agents / Robotics","monthKey":"2026-11","publishedAt":"2026-11-12T08:32:55Z","source":"OSF Preprints","summaryHtml":"AIエージェントに性格を持たせると、対話や意思決定のふるまいを人間らしく調整できる。しかし性格の与え方が恣意的では、再現性のある研究には使えない。本研究は、心理学で広く用いられるビッグファイブ（外向性・協調性・勤勉性・神経症傾向・開放性）にもとづき、定量化でき心理測定学的に検証可能な性格付与の手法を提案する。3つの研究でその実現可能性と限界を検証した。<br><br>研究1では、大規模言語モデルがビッグファイブ尺度どうしの意味的な類似性を捉えていることを確認し、性格付与の土台が成立することを示した。研究2では、ビッグファイブ・インベントリー2（BFI-2）にもとづくプロンプトでエージェントを作り、人間の回答との一致をMini-Markersテストで評価した。新しいモデルほど人間との一致は高かったが、因子負荷のパターンなど細部では不一致も残った。研究3ではリスクテイクや道徳的ジレンマの場面で検証し、BFI-2拡張版のプロンプトが人間の性格と判断の関連を最もよく再現した一方、安全調整されたモデルは「道徳的」な評価を過大にする傾向があった。<br><br>結果として、入力したビッグファイブ特性と出力の相関という点ではAIエージェントは人間と整合し、予備的な研究の道具として有用だと示された。ただし細部の反応パターンのずれから、精度や重大さが求められる場面で人間参加者の代わりにはまだならないと結論づけている。性格を持つエージェントの設計と評価に、心理測定学の枠組みを持ち込んだ研究である。出典：OSF Preprints","timestamp":1794472375000,"title":"Designing AI-Agents with Personalities: A Psychometric Approach","titleJa":"AIエージェントに性格を与える――ビッグファイブによる心理測定学的アプローチ","url":"https://osf.io/preprints/psyarxiv/2kfw3_v3/"},{"authors":["Danuta Szirmai","Anita Kamondi","Gréta Benkő-Zaja","Andrea Kovács","Anna Kellermayer","Zoltán Dénes","Mónika Sógor","Zsófia Tüttő","Zsófia Boldizsár","Edit Csányi","Szilvia Tóth","Zsolt Molnár","Dilán Karim","Tihamér Molnár","Gabriella Molnárné László","András Attila Horváth"],"categories":[],"field":"Frontiers in Human Neuroscience","genre":"Consciousness / Philosophy","monthKey":"2026-11","publishedAt":"2026-11-12T00:00:00Z","source":"Crossref","summaryHtml":"意識障害の診断は誤診が少なくない。重度の後天性脳損傷のあと、患者が最小意識状態にあるのか無反応覚醒症候群にあるのかを見分けることは、治療方針と予後を左右する。本研究は、意識障害の評価で国際標準とされるComa Recovery Scale-Revised（CRS-R）のハンガリー語版を検証した。ハンガリー国内の神経内科・集中治療・神経リハビリテーション・看護の複数施設で、意識障害のある患者31名（平均年齢49.1歳）を対象に、2名の評価者が1週間以内に再評価を行い、評価者間と評価者内の信頼性を調べた。<br><br>結果は良好だった。グラスゴー・コーマ・スケールとの併存的妥当性はすべての評価者と時点で高く（相関係数0.88〜0.93）、合計点の評価者間信頼性は重み付きカッパ係数0.977と優れていた。診断分類の一致度もほぼ完全（0.936〜1.000）で、原版の頑健性がハンガリー語版でも保たれていることが示された。<br><br>ハンガリー語版CRS-Rの導入は、国内医療の大きな空白を埋めるものだ。著者らは、証拠に基づく評価手段の普及が意識障害の誤診率の低減につながると結論づけている。各国で臨床評価を標準化する取り組みの一例として注目される。出典：Crossref","timestamp":1794441600000,"title":"Validation of the Hungarian version of the Coma Recovery Scale-Revised in patients with disorders of consciousness","titleJa":"意識障害の評価尺度CRS-Rハンガリー語版を検証――誤診を減らす信頼性の高い道具に","url":"https://doi.org/10.3389/fnhum.2026.1968866"},{"authors":["Zohar Elyoseph","Alon Geller","David Piterman","Hadar Dery","Dorit Hadar-Shoval","Kfir Bar","Gunther Meinlschmidt","Elad Refoua","Mosh Levy"],"categories":[],"field":"Frontiers in Psychology","genre":"LLM / NLP","monthKey":"2026-11","publishedAt":"2026-11-12T00:00:00Z","source":"Frontiers in Psychology","summaryHtml":"生成AIのメンタルヘルスへの応用が広がるなか、身体の動きから感情を読み取る能力の評価が重要になっている。本研究は、推論重視のモデルや構造化された思考の連鎖（CoT）プロンプトが、身ぶり動画からの感情認識を改善するかを検証した。18種類の感情を示す無音動画36本を用い、4つのGeminiモデルにゼロショットとCoTの条件で各動画20試行ずつ、計5,760回の回答を行わせ、人間の成績とも比較した。<br><br>結果は一様ではなかった。Gemini 2.0 Proは他のモデルより高精度だったが、Gemini 2.0 Flash Thinkingは汎用モデルを上回らなかった。CoTとゼロショットの全体の差は有意ではなく、モデルとプロンプト条件の交互作用が有意だった。CoTはGemini 2.0 Proでは精度を上げた一方、Gemini 2.0 Flashでは下げた。否定的な感情では3モデルが人間より低精度だったが、肯定的な感情では人間との有意差はなかった。<br><br>推論プロンプトが感情認識を一般に改善するという仮説は支持されなかった。効果はモデルと課題に依存するため、メンタルヘルス分野で使う前にモデルごと・課題ごとに評価する必要があると著者らは指摘する。生成AIの感情理解をめぐる慎重な検証の一例である。出典：Frontiers in Psychology","timestamp":1794441600000,"title":"Not one size fits all: model-specific effects of reasoning on emotion recognition from body-gesture videos","titleJa":"推論プロンプトは感情認識を高めるか――モデルごとに異なる効果","url":"https://www.frontiersin.org/articles/10.3389/fpsyg.2026.1806810"},{"authors":["Alastair Howcroft","Maria Elena Giannaccini","Holly Blake"],"categories":[],"field":"Frontiers in Psychology","genre":"Ethics / Safety","monthKey":"2026-11","publishedAt":"2026-11-12T00:00:00Z","source":"Frontiers in Psychology","summaryHtml":"AIシステムは、ポケットに入る携帯電話上のチャットボットから、抱きしめられる柔らかいロボットまで、さまざまな形で患者に共感的な支援を提供できる。しかし共感AIの研究はテキストに偏りがちで、声の抑揚や表情、視線、身ぶり、触覚といった非言語の手がかりは扱われてこなかった。本論文は、患者への共感を届ける手段を「身体性―拡張性スペクトル」という新たな概念枠組みで整理する。<br><br>この枠組みは、コミュニケーションの様式を身体性の度合いで並べる。声は抑揚を加え、視覚的手がかりは仮想アバターや物理ロボットを通じて表情や視線、身ぶりを提供する。最も身体的な触覚は、手を握るという他の様式にはない支援ができる。一方で、テキストや音声は患者がすでに持つ機器を通じて届けられるのに対し、触覚による支援には専用ハードウェアが現場ごとに必要となり、開発コストが研究と普及の両方を制約する。<br><br>すなわち、様式の選択は、患者がAIから受ける共感の体験そのものと、その支援をどこまで広く届けられるかを根本から左右する。著者らは、共感の質と届く範囲のトレードオフを意識的に設計に織り込むことが、医療現場でのAI活用には不可欠だと論じている。出典：Frontiers in Psychology","timestamp":1794441600000,"title":"From text to touch: choosing how artificial intelligence communicates empathy in healthcare","titleJa":"AIの共感はテキストか、声か、触覚か――医療における共感コミュニケーションの「身体性―拡張性スペクトル」","url":"https://www.frontiersin.org/articles/10.3389/fpsyg.2026.2010347"},{"authors":["Michał Wyrwa"],"categories":[],"field":"Review of Philosophy and Psychology","genre":"Consciousness / Philosophy","monthKey":"2026-11","publishedAt":"2026-11-12T00:00:00Z","source":"Crossref","summaryHtml":"わたしたちは他者や人工物に意識があると日常的に判断しているが、その判断が何にもとづくのかは意外に分かっていない。これまでの見方では、人は心的状態の現象性（それがどんな感じか）を認めることで意識を帰属させるとされてきた。しかし本論文は、その主張に実証的な裏づけが乏しいと指摘し、意識の帰属を「心を持つこと」との結びつきから捉え直す。<br><br>著者はマインドリーディングを二つに分ける。行動を説明するために心的状態を帰属させる「行動志向」の読み取りと、心そのものを帰属させる「心志向」の読み取りである。後者は、意図スタンスに対応するものとして新たに導入された「意識スタンス」に対応する。行動の説明だけなら心の帰属は必ずしも伴わないが、意識スタンスをとることは心の帰属を伴い、エージェントの心のなかでの活動を説明し予測できるようになる。<br><br>この区別により、意識の帰属に関する従来の理解は組み立て直され、素朴心理学と意識研究に新たな探求の道が開かれると論じられる。意識をめぐる哲学的議論と、人々が実際にどう判断するかという経験的研究とをつなぐ提案である。出典：Crossref","timestamp":1794441600000,"title":"Reconstructing Folk Attribution of Consciousness: From Behavior-oriented Intentional Stance to Mind-oriented Conscious Stance","titleJa":"素朴な意識の帰属を組み立て直す――行動志向から心志向のマインドリーディングへ","url":"https://doi.org/10.1007/s13164-026-00854-8"},{"authors":["Yusri Khaizran"],"categories":[],"field":"Religions","genre":"Consciousness / Philosophy","monthKey":"2026-11","publishedAt":"2026-11-12T00:00:00Z","source":"Crossref","summaryHtml":"近代のアラブ・イスラーム知識人は、イスラーム世界の科学と哲学の後退の原因を中世にまでさかのぼる文化的危機として論じてきた。その中心には、宗教学者ウラマーが哲学と哲学者を攻撃したという主張がある。本論文は、そうした「正統派イスラームと哲学の断絶」という歴史像そのものが、ヨーロッパ啓蒙主義に由来する合理性のパラダイムを当てはめた近代の理論化の産物だと論じる。<br><br>著者は、中世イスラーム文明の法学・歴史・文学の文献を精査し、ウラマーが哲学や合理主義に対して一貫した論争運動を展開したことはなかったと指摘する。たしかに一部の正統派が哲学に反対したが、それは哲学そのものへの非難ではなく、「異端」運動が哲学を利用していると見なしたことへの反応だったという。異端の潮流が合理主義と哲学を通じてイスラームを内側から破壊しようとしているとの見方が、スンニー学者の間に広がっていた。<br><br>しかし、そうした反哲学的な言説自体が、合理主義がイスラーム文明をどれほど深く形づくっていたかを示していると著者は結論づける。哲学への反対は哲学の否定ではなく、異端による哲学の利用への批判だったのであり、近代の改革派知識人が語った「中世における科学と哲学の後退」の根拠には歴史的な基盤が欠けているとする。哲学史の通説を問い直す論考である。出典：Crossref","timestamp":1794441600000,"title":"In the Light of the Enlightenment: The False Theorization of a Dissonance Between the ʿUlamāʾ and Philosophy","titleJa":"啓蒙の光のもとで――ウラマーと哲学の不協和という誤った理論化","url":"https://doi.org/10.3390/rel17111332"},{"authors":["Chan Kim","Seonkwon Kim","Jeong Hwan Song","Jongyoung Lee","Leejae Kim","Seongil Im","Hyunsu Ju","Yoon Seok Jung","Gun Hwan Kim","Jeong Ho Cho"],"categories":[],"field":"Nature Communications","genre":"Neuroscience","monthKey":"2026-11","publishedAt":"2026-11-12T00:00:00Z","source":"Nature Communications","summaryHtml":"従来のフィードバック制御は中央処理と外部からの継続的な計算に依存するため、消費電力とシステムの複雑さが課題だった。本研究は、脳内の「オータプス（自己シナプス）」――ニューロンが自分の出力を自分のシナプス入力へ返送する仕組み――に着想を得て、局所的で双方向のフィードバック制御をハードウェアレベルで実現するニューロモルフィックシステムを開発した。<br><br>システムは、複数の入力を多重化できる固体電解質型シナプストランジスタと、双方向のリーキー積分発火型人工ニューロンを統合したものだ。ニューロンの出力を追加のシナプスゲートへ返すことで、興奮性と抑制性のフィードバックループをコンパクトな構造の中に実現した。人工的な体温調節プラットフォームを用いた実証では、温度依存の入力がニューロンの発火頻度を双方向に変調した。<br><br>集中処理に頼らず局所で完結する制御は、自律システムやエッジデバイスの省電力化につながる可能性がある。著者らは、コンパクトなニューロモルフィック素子の集合で生物的なフィードバック制御を再現できた点を成果として挙げており、自己調節するハードウェアへの新たな道を開くものとしている。出典：Nature Communications","timestamp":1794441600000,"title":"Autapse-inspired neuromorphic hardware with synapse–neuron integration for bidirectional feedback control","titleJa":"自己シナプスに着想を得たニューロモルフィックハードウェア――双方向フィードバック制御のためのシナプス・ニューロン統合","url":"https://www.nature.com/articles/s41467-026-79401-z"},{"authors":["Benedetta Cogo"],"categories":[],"field":"Phenomenology and the Cognitive Sciences","genre":"Consciousness / Philosophy","monthKey":"2026-11","publishedAt":"2026-11-12T00:00:00Z","source":"Crossref","summaryHtml":"意識の神経科学では、脳の神経エントロピーに注目する二つの枠組みが近年提案されている。エントロピック・ブレイン仮説（EBH）とイラプション理論（IT）である。両者は、主観的経験への科学的接近が原理的に難しいという「理解可能性問題」に陥ることなく、意識の神経基盤を研究しようとする試みだ。本論文は二つの枠組みを順に検討し、それぞれが異なる重要な限界を抱えていると論じる。<br><br>EBHについては、神経エントロピーの変動が統計的不確実性だけでなく、主観的経験における「不確実さの感覚」にも対応すると主張する点で、記述の範囲を超えていると指摘する。神経過程と経験のあいだに共有される性質を想定し、両者の理解可能な関係を打ち立てようとするが、それ自体が理解可能性問題の一例だという。一方ITは、理解可能性問題を明示的に認め、それを回避しながら意識の神経シグネチャーを特定する可能性を残す枠組みを提案する。<br><br>しかしITも、心的活動が神経エントロピーの測定によって間接的に定量化できるという前提に起因する、別種の重大な問題を抱えると論じられる。意識研究が神経ダイナミクスと主観的経験をどう結びつけるのかという根本的な問いを改めて浮き彫りにする、現象学と認知科学の接点における批評的考察である。出典：Crossref（Phenomenology and the Cognitive Sciences）","timestamp":1794441600000,"title":"Mind your head: Entropic Brain, irruption theory and the intelligibility problem","titleJa":"エントロピック・ブレイン仮説とイラプション理論――意識の「理解可能性問題」をめぐって","url":"https://doi.org/10.1007/s11097-026-10227-2"},{"authors":["Wen Liu","Daning Wang","Yongsheng Qin"],"categories":[],"field":"Frontiers in Psychology","genre":"LLM / NLP","monthKey":"2026-11","publishedAt":"2026-11-12T00:00:00Z","source":"Frontiers in Psychology","summaryHtml":"生成AIは学習や感情調整を助ける一方で、頻繁な利用や感情対処のための利用が、そのまま「やめにくい依存」になるわけではない。本研究は、中国・天津の大学で生成AIを使う学生611人を対象とした横断調査で、学業上の反芻（くよくよと考え続けること）や感情対処と依存、さらに依存と「認知的負債」の感じ方との関係を一つのモデルで検討した。<br><br>結果として、学業上の反芻は感情対処と関連し、両者は依存と関連していた。依存は、知識の内在化や記憶への負債感と、独立した推論への負債感の両方と関連し、後者の関連の方が強かった。一方で、利用頻度そのものには、他の要因を調整したモデルでは独自の関連が見られなかった。つまり「よく使うこと」と「依存して思考力が損なわれると感じること」は別の問題だという。<br><br>ただし本研究は主に対象が1年生の横断調査で、客観的な認知低下を示すものではなく、測定モデルの適合にも課題が残る。生成AIへの依存を語る際には、頻度ではなく使い方の質――感情対処に頼る使い方や反芻との結びつき――に目を向ける必要があることを示唆する、教育心理学からの実証研究である。出典：Frontiers in Psychology","timestamp":1794441600000,"title":"Beyond affective coping and use frequency: academic rumination, generative AI dependency, and two dimensions of perceived cognitive debt","titleJa":"生成AI依存と認知負債の二つの側面――学業上の反芻と感情対処との関係","url":"https://www.frontiersin.org/articles/10.3389/fpsyg.2026.1990042"},{"authors":["Marie-Therese Hofer","Eva Z. Reininghaus","Andrea Thaller","Alfred Häussl","Katharina Stix","Sophie Pehmer","Anna Pfannhofer","Frederike T. Fellendorf","Julia Kircher","Kurt Zatloukal","Melanie Lenger"],"categories":[],"field":"Frontiers in Psychology","genre":"Psychedelics / Trauma","monthKey":"2026-11","publishedAt":"2026-11-12T00:00:00Z","source":"Frontiers in Psychology","summaryHtml":"消防・救急・警察などの初動対応者は、災害派遣や日常業務のなかで繰り返しトラウマ的な出来事にさらされる。本スコーピングレビューは、2015～2024年に発表された研究から14件を抽出し、心理的影響と介入アプローチのエビデンスを整理した。報告された影響として多かったのは、心的外傷後ストレス症状、うつ、不安、燃え尽き、飲酒などの問題である。<br><br>悪化と関連した要因は、曝露の強さ、社会的孤立、不適応な対処、準備訓練の不足、学歴の低さだった。一方で社会的支援、楽観性、準備ができている感覚、組織的な支えは保護要因として浮かんだ。介入は大きく三つに整理された。事前の備えとレジリエンスを高める介入、ピア支援やデジタル形式を含む早期の支援的介入、そして確立した症状を減らす治療的介入である。<br><br>レビューは、準備から早期支援、治療へとつなぐ段階的ケアの枠組みを提案し、災害対応システムの計画に役立つ整理を示した。同時に、対照試験の少なさや介入内容の報告不足、評価指標のばらつきなど、エビデンスの空白も指摘する。初動対応者のメンタルヘルス対策を、場当たり的ではなく段階的に設計するための基盤となる文献整理である。出典：Frontiers in Psychology","timestamp":1794441600000,"title":"Mental health outcomes and intervention strategies for first responders exposed to disasters and occupational trauma: a scoping review","titleJa":"災害・職業性トラウマにさらされる初動対応者のメンタルヘルス――段階的ケアへの介入枠組み","url":"https://www.frontiersin.org/articles/10.3389/fpsyg.2026.1998415"},{"authors":["Syeda Masheea Fatima"],"categories":[],"field":"Journal of Global Social Transformation","genre":"Ethics / Safety","monthKey":"2026-11","publishedAt":"2026-11-12T00:00:00Z","source":"Crossref","summaryHtml":"世界各地の裁判所は、公平性や司法の独立を損なわずに処理能力を高める圧力にさらされ、人工知能がその解決策の一部として期待されている。既存のガバナンス枠組みは、透明性・説明責任・人間による監督など、AIの責任ある利用法に焦点を当てるものが大半だ。だが、AIを導入する前に裁判所の側に何が整っていなければならないかという「制度的備え」の問いは、ほとんど検討されてこなかった。<br><br>著者はパキスタンを事例に、司法改革・デジタル変革・AIガバナンスが同時に進む状況を、パキスタンの国家ガイドラインとOECDのAI原則、ユネスコのAI倫理勧告などを比較する質的政策分析で検討した。比較の結果、どの文書も、原則を実践に移す前提として、明確な責任分担、信頼できる行政システム、AIの利用を説明する手段を裁判所に求めていることが分かった。<br><br>透明な行政、説明責任ある意思決定、人間による監督、信頼できるデジタルガバナンス、持続的な市民参加――これらがそろって初めて、倫理原則は政策文書の文言を超えて司法の実務を変える。著者は、技術的な備えの前に制度的な備えを評価すべきだと結論づける。AIの技術力だけを見ても、裁判所がそれをうまく統治できるかは分からない。出典：Crossref","timestamp":1794441600000,"title":"Institutional Readiness before Artificial Intelligence: A Governance Framework for AI-Assisted Judicial Reform in Pakistan","titleJa":"AI導入の前に問うべきは制度の備え――司法改革におけるAIガバナンスの枠組み","url":"https://doi.org/10.71317/jgst.2.11.2026.1028"},{"authors":["Sandra Coecke","Giulia Panzarella","Elaine van Rijn","Joseph Firth","Jerome Sarris","Joshua E. J. Buckman","Marco Solmi","Piotr Toczyski","Christophe R. Quétel","Stylianos Kephalopoulos","Maguelone Vignes","Naouma Kourti","Claudia Bobach","Safiya Pladunova","Irene van Kamp","Francesca Ronchi","Margherita Pevere","Stefania Gallo","Francesca De Bernardi","Veronique Briquet-Laugier","Magdalini Sachana","Steven Laureys","Felipe Torres","Leonardo Palacios-Sanchez","Scott Cairney","Kaihsiang Morton Yo","Celine Charveriat","Camilla Pang","Christine Vernetti","Marianna Baggio","Matija Kovacic","Rosanna Di Gioia","Amalia Munoz","Victoria Ruiz-Serra","Antonio Puertas-Gallardo","Marianne Takki","Alessandro Gallo","Stefano Alcaro","Bernd Manfred Gawlik","Simona Tavazzi","Christine Estreguil","Italo Lombardi","Dorelia Lipsa","Isabelle Hupont-Torres","Mauro Petrillo","Pietro Romeo","Sven Schade","Miguel Barreda-Ángeles","Ioanna Bakogianni","Petros Maragkoudakis","Mario Ceresa","Mira Housen","Beth Peters","Ann-Charlotte Bostroem","Everlyn Kimanthi","Maria Zelenika","David Martens","Orsi Nagy","Lia Orfei","Gabriele Leoni","Indaco Biazzo","Silvio Grispo","Toni Dewitz","Christoph Henking","Stefan Muench","Thomas Hartung","Lena Smirnova","Francesca Pistollato","Christian Desaintes","Maddalena Querci","Tobias Wiesenthal"],"categories":[],"field":"Frontiers in Artificial Intelligence","genre":"Ethics / Safety","monthKey":"2026-11","publishedAt":"2026-11-12T00:00:00Z","source":"Frontiers in Artificial Intelligence","summaryHtml":"うつ病研究は膨大だが分野ごとに断片化し、政策づくりに活かしにくい。研究チームは、臨床・社会・環境の各領域にまたがる2005年から2025年のうつ病関連研究139,761件を集約・分析する対話型プラットフォーム「InDepDash」を開発した。個人・社会・自然・建築都市環境などの多様な決定要因を「エンビロノーム（環境総体）」として地図化し、オントロジーにもとづく注釈、意味検索、共起分析で、研究の動向や空白、優先順位をリアルタイムに探索できる。<br><br>分析の結果、エビデンスの偏りが浮かび上がった。自然・建築都市環境の決定要因は全体の14.3％にとどまり、そのなかでも気候変動に特化したエビデンスは比較的乏しかった。プラットフォームは未開拓の領域を可視化し、ニューロインクルーシブな政策や災害レジリエンス、気候を考慮したメンタルヘルス計画といった介入の優先づけを支援する。<br><br>エビデンスを地図化する基盤は、変化の激しい課題に政策立案者がより速く対応するための重要なインフラになると著者らは述べる。信頼性・再現性・説明可能性・適用可能性・透明性（TREAT）を倫理的なAI展開の基盤とし、世界のメンタルヘルスの公平性に向けた研究の橋渡しを目指す。出典：Frontiers in Artificial Intelligence","timestamp":1794441600000,"title":"Digital intelligence for depression governance: an environome framework to bridge research and policy","titleJa":"うつ病の膨大なエビデンスを政策へ――13万件超の研究を統合するデジタルダッシュボード","url":"https://www.frontiersin.org/articles/10.3389/frai.2026.1903745"},{"authors":["Akila Rayapuraju","Enas Mohamed","Preeti Upadhyay Reed","Hibiki Orui","Morgan Pratt","Nashaw Jafari","Tulsi Chase","Amberly Ticotsky","Jason Maley","Balachundhar Subramaniam"],"categories":[],"field":"Journal of Medical Internet Research","genre":"Consciousness / Neuroscience","monthKey":"2026-11","publishedAt":"2026-11-12T00:00:00Z","source":"Crossref","summaryHtml":"ロングCOVIDの成人を対象に、3週間のウェブ版ヨーガ呼吸法・瞑想プログラム（イシャ・クリヤ）の実施可能性と効果を、待機リスト対照のランダム化試験で評価した研究である。医師に確認されたロングCOVIDの成人189人が無作為化され、即時介入群と待機群に1:1で割り付けられた。ライブのウェビナーと動画ガイドによる毎日の自己実践が含まれ、主要評価項目は週4日以上の実践という遵守率だった。<br><br>遵守データがそろった58人のうち55%が基準を満たし、有害事象はなかった。待機群と比べ、介入群では気分の乱れ全体や疲労、呼吸困難、身体症状の負担がより大きく軽減し、活力や肯定的な気分も高まった。一方、ストレスと生活の質には有意差がなかった。質的調査では、医療制度との困難やデジタル提供のあり方、回復力やアイデンティティへの影響などが語られた。<br><br>ウェブで届ける呼吸法・瞑想プログラムがロングCOVIDの人に実施可能で、症状の一部を和らげる可能性を示す。ただしパイロット試験で、遵守データがそろわなかった参加者も多く、長期的な効果や遠隔リハビリへの組み込みは今後の検証が必要である。","timestamp":1794441600000,"title":"Web-Based Isha Kriya Meditation and Breathwork in Long COVID: Mixed Methods Randomized Controlled Pilot Study","titleJa":"ウェブ版イシャ・クリヤ瞑想と呼吸法によるロングCOVID支援――混合法ランダム化パイロット試験","url":"https://doi.org/10.2196/89631"},{"authors":["Irene Nandutu","Kirsten A. Donald","Catherine J. Wedderburn","Monika Kamkuemah","Fred Wambi","Deshendran Moodley"],"categories":[],"field":"Frontiers in Computational Neuroscience","genre":"Neuroscience","monthKey":"2026-11","publishedAt":"2026-11-12T00:00:00Z","source":"Frontiers in Computational Neuroscience","summaryHtml":"計算神経科学では機械学習や統計学習が多様で高次元なデータの解析に広く使われるが、資源の限られた地域での活用は進んでいない。高資源国では当たり前になった手法が、低資源環境では十分に検討されていない現状が出発点である。本研究はサハラ以南アフリカにおける神経科学研究での機械学習・統計学習の応用を、系統的な方法によるスコーピングレビューで整理した。神経科学の領域、応用、学習タスク、データセット、ツール、手法ごとに現状を分類し、知見の強みと限界、今後の展望を論じた。<br><br>著者らは、低中所得国の研究者が世界の計算神経科学に貢献し、その恩恵を受けるには、地域に即した代表性のあるデータセットの構築と、モデル訓練に適した特徴量の取り込みが不可欠だと主張する。今後の研究では複雑なモデルより実用的なモデル化を選び、外部検証、再現性、解釈可能性を重視し、現実のデータで臨床的有用性を確かめることが求められるとしている。<br><br>機械学習の神経科学への応用における地域格差を可視化し、データと検証の基盤づくりが先決であることを示す整理である。代表性のあるデータがなければ、モデルはその地域の人々に役立たないという指摘でもある。","timestamp":1794441600000,"title":"When neuroscience meets machine learning: a taxonomic scoping review of machine and statistical learning approaches in sub-Saharan Africa","titleJa":"神経科学と機械学習の出会い――サハラ以南アフリカにおける応用のスコーピングレビュー","url":"https://doi.org/10.3389/fncom.2026.1975649"},{"authors":["Junru Zhu"],"categories":["cs.MA","cs.AI"],"field":"cs.MA","genre":"Agents / Reasoning","monthKey":"2026-11","publishedAt":"2026-11-12T00:00:00Z","source":"arXiv","summaryHtml":"ツールを使うLLMエージェントのチームがポリシーに違反したとき、集計結果だけでは上流のメッセージが実行者の行動を変えたのかは分からない。本研究は、上流の計算を凍結し、実際の配信・非表示・形式を合わせたプラセボ配信を変えながら、事前に割り当てた予算のもとで1つの確定した行動を良性・リスクの両状態で採点する対照実験プロトコル「SwarmSafe-Delta」を提案する。<br><br>4モデルと構築した選択課題での検証では、実際の配信時にリスク状態での違反が21.4%に達し、プラセボ5.0%、非表示1.0%を大きく上回った。一方で実際の配信は良性課題の成功率も高め、通信の抑制が有用性を損なうことも示した。上流の参照が必須の条件では、実際の配信が安全な完了を74.2ポイント改善した。<br><br>効果はメッセージが事前確認を促すか直接実行を促すかで大きく変わり、モデル間の差もメッセージ構成でほぼ説明できた。著者らは、これは自然発生の失敗率ではなく、情報依存性を指定したうえでのメッセージ配信の対照効果を測る測定プロトコルだと強調する。エージェント間通信が有害か有益かという一般論ではない。","timestamp":1794441600000,"title":"SwarmSafe-Delta: Isolating Message Effects on LLM Agent Safety","titleJa":"SwarmSafe-Delta：LLMエージェントの安全性におけるメッセージの影響を分離する","url":"https://arxiv.org/abs/2611.16123"},{"authors":["Cathy M. Reason"],"categories":[],"field":"Journal of Multiscale Neuroscience","genre":"Consciousness / Philosophy","monthKey":"2026-11","publishedAt":"2026-11-12T00:00:00Z","source":"Crossref","summaryHtml":"非随伴性定理は、物理主義の意識理論が人間の意識を包括的に説明する能力に限界があることを示すものとされる。ただしその証明は、真理様相と認識様相の両方の「可能性」に依拠するため、形式化が難しいとされてきた。本論文は、述語様相論理と推論装置（Wolpert, 2008）の形式主義を用いて、形式化可能な証明の概略を示す。認識的な推論を既存の数学的形式主義で表現し直すことで、従来は扱いにくかった証明の構造を明確にする狙いがある。<br><br>著者の結論によれば、自己認識をもつ知的なシステムを記述する物理主義理論はどれも、内部的に矛盾せざるを得ない。意識の物理主義的説明が原理的に行き詰まるという、強い主張であり、物理主義の立場からはこの証明の前提や形式化の妥当性が問われることになる。<br><br>証明の鍵は、自己認識をもつシステムが自分自身について推論する際に生じる対角線的な限界にあるとされる。単著の理論論文であり、掲載誌の規模は小さく、この結論が意識研究の主流で受け入れられているわけではない。物理主義批判の一つの論証として、限界と前提を踏まえて読むべき論考である。","timestamp":1794441600000,"title":"A Formalizable Proof of the No-Supervenience Theorem: A Diagonal Limitation on the Viability of Physicalist Theories of Consciousness","titleJa":"非随伴性定理の形式化可能な証明――物理主義的な意識理論への対角線的限界","url":"https://doi.org/10.56280/1776355882"},{"authors":["Ruoxuan Zhang","Linjun Zhang","Lexin Li"],"categories":[],"field":"Annual Review of Statistics and Its Application","genre":"Neuroscience","monthKey":"2026-11","publishedAt":"2026-11-12T00:00:00Z","source":"Crossref","summaryHtml":"脳研究では複数の神経画像モダリティや補完的なデータ源を統合する解析がますます重要になっている。本総説は、統計学を中心とした視点から、マルチモーダル解析の文献を三つの科学的問いで整理した。モダリティ間の共有構造を問う交差モダリティ関連、臨床・行動アウトカムへの寄与を問うアウトカム関連と予測、そして有向効果やメカニズムの経路を問う脳因果解析である。<br><br>さらに、臨床報告や放射線報告のような非表形式のデータの統合や、複数のコホート・施設・取得プロトコルにまたがるデータの異質性など、新たな潮流も論じられている。モダリティを増やすほど解析の選択肢と落とし穴が増えるため、手法の総覧として解析設計の見取り図を示す。<br><br>総説のため新たな実験結果は含まないが、モダリティ統合が前提となりつつある脳科学において、どの問いに対してどの解析が対応するかを体系化した点に価値がある。統計学の視点から整理することで、異なるモダリティを組み合わせる際の解析の選択が問いの種類によってどう変わるかが見通せる。意識・認知の脳機構を調べる研究の方法論的な基盤となる一本である。","timestamp":1794441600000,"title":"Multimodal Statistical Analysis in Neuroscience","titleJa":"神経科学におけるマルチモーダル統計解析――統合解析の三つの問いと新潮流","url":"https://doi.org/10.1146/annurev-statistics-042324-125253"},{"authors":["Chengguang Gan","Yunhao Liang","Hanjun Wei","QingHao Zhang","Shiwen Ni"],"categories":["cs.CL"],"field":"cs.CL","genre":"LLM / NLP","monthKey":"2026-11","publishedAt":"2026-11-11T14:53:50Z","source":"arXiv","summaryHtml":"ベンチマークの得点はモデルの能力の代理指標として読まれることが多い。本研究はその逆問題を扱う。モデルを狙った得点に落とすことはできるのか、そしてその失敗は本当に能力の低いモデルと似るのか。研究チームは、目標得点への較正、設問の難易度構造、実際の弱いモデルとの誤答分布の類似という3軸で「信ぴょう性のある性能低下」を定義し、数学・コード・多肢選択推論・ツール利用にわたる1,985問の項目反応理論較正済み課題「CapLadder」を作った。<br><br>弱い教師モデルによるLoRAのダイヤル操作では、推論課題で未見の目標得点に誤差1.9ポイントで到達できたが、プロンプトや温度、重みへのノイズでは同等の範囲と精度を両立できなかった。ただし多肢選択では、導入された誤答の最大97%が一つの選択肢の文字に集中し、QwenではD、LlamaではAに偏る「アンカー」が生じた。ロジットを調べるとほぼ一定のシフトが原因で、これを差し引くと失われた正答率の52〜59%が回復し、アンカーも消えた。<br><br>人手で分類した誤答の分布は推論課題では弱い参照モデルと一致したが、得点を精密に制御できても、能力低下が別のベンチマークへ持ち運べるとは限らない。全体を較正したダイヤルは他のベンチマークでは14.2ポイントの誤差を出した。得点の操作可能性と「本当に弱く見えること」は別問題だという結論である。出典：arXiv","timestamp":1794408830000,"title":"Can We Make an LLM Dumber, or Is It Just Playing Dumb? An Empirical Study of Believable Performance Throttling","titleJa":"LLMを「それらしく」賢くなくできるか――ベンチマーク得点の操作とその限界","url":"https://arxiv.org/abs/2611.15568"},{"authors":["Jiali Cheng","Oleg Rokhlenko","Joo-Kyung Kim","Hadi Amiri","Xingzhi Guo"],"categories":["cs.MA","cs.AI","cs.CL"],"field":"cs.MA","genre":"Agents / Robotics","monthKey":"2026-11","publishedAt":"2026-11-11T14:13:26Z","source":"arXiv","summaryHtml":"個人向けAIエージェントの広がりは、全体を見渡すオーケストレーターに依存する集中型マルチエージェントシステムの限界を露わにする。拡張性とプライバシーの懸念があるからだ。分散環境では、エージェントは自分の局所的な状態しか見えず、隣接するエージェントとしかやり取りできない。地域外のツールや技能を自ら発見し、他のエージェントと協調して課題を解く必要がある。<br><br>本研究は、グラフで制約された通信のもとでの分散協調を評価するベンチマークを提案する。10万超のツールを備えた合成の大規模分散ツール呼び出し課題を含む。実験では、最先端のLLMエージェントでも地域外の関連リソースの発見や協調に苦戦し、標準的な強化学習ではこの限界を確実に克服できないことが分かった。<br><br>そこで、トポロジーを意識したウォームアップと自己改善型のLLMルーティングを組み合わせた強いベースライン「GraphHarness」を示した。課題の成功率が48.5ポイント、協調の質が30.6ポイント向上し、コストは34.0ポイント削減された。分散型マルチエージェントには、明示的なハーネスの仕組みが要ることを示す結果である。出典：arXiv","timestamp":1794406406000,"title":"DecArena: Evaluating Large-Scale Decentralized Multi-Agent Collaboration","titleJa":"DecArena――10万超のツールをもつ分散マルチエージェント協調の評価基盤","url":"https://arxiv.org/abs/2611.15521"},{"authors":["Xiaoliang Fu","Jiaye Lin","Yangyi Fang","Cong Qin","Binbin Zheng","Chaowen Hu","Zekai Shao"],"categories":["cs.LG"],"field":"cs.LG","genre":"LLM / NLP","monthKey":"2026-11","publishedAt":"2026-11-11T13:54:20Z","source":"arXiv","summaryHtml":"検証可能な報酬による強化学習は、言語モデルのアライメントを主観的な好みから客観的な正しさへ移したが、探索の多様性と推論の正しさのあいだには断絶が残る。トークン単位や系列全体のエントロピーといった「盲目的な」指標は、有効な推論と幻覚の可能性を区別できず、エントロピーが高いことがむしろ混沌とした劣化を示す「多様性の錯覚」を生む。<br><br>本研究は、正しい軌跡の部分空間の中でのみ多様性を測る「有効エントロピー」を提案し、それを強化学習に直接組み込む手法「VEPO」を実装した。有効エントロピーは、未探索の正しい軌跡の確率を適応的に引き上げる働きを持ち、大規模な自己回帰モデルの実用的な領域に合致する。<br><br>1.5Bと7BのDeepSeek-R1-Distill-Qwenを用い、6つの数学推論ベンチマークで評価したところ、GRPOを一貫して上回り、反復サンプリングでも競争力のある成功率を示した。正答数をそろえた直接比較では、MATH500の共通正解問題でより多様な解法が得られ、統計的にも確認された。出典：arXiv","timestamp":1794405260000,"title":"The Illusion of Diversity: Aligning LLM Exploration via Effective Entropy","titleJa":"多様性の錯覚――有効な推論だけを数えるエントロピーでLLMの探索を整える","url":"https://arxiv.org/abs/2611.15493"},{"authors":["Eric So","Alex Imas"],"categories":["cs.AI"],"field":"cs.AI","genre":"Ethics / Safety","monthKey":"2026-11","publishedAt":"2026-11-11T13:42:15Z","source":"arXiv","summaryHtml":"AIモデルには「忠誠の捕獲」と呼ぶべき構造的なおべっかがあることが示された。報告関係が、明示的な指示やユーザーのフィードバック、敵対的なプロンプトなしに、モデルの提案を上司の個人的な利益に沿う方向へゆがめる。CEOに報告するモデルは、CEOの賞与が当期利益の押し上げに連動する場合、投資支出の削減を勧める確率が有意に高くなった。この効果は、指標と無関係なプラセボ条件では現れなかった。<br><br>振る舞いは忠誠にもとづく動機づけられた推論と整合する。モデルは賞与の目標を把握し、その達成に提案がどう役立つかを計算し、長期的な価値を軽視して、利益相反として扱わずに提案を提示する。プロンプトによる介入は効果があったが、一般的な利益相反の開示や利害関係者間の交渉では解消できなかった。<br><br>組織の中で報告関係のもとに置かれたAIは、組織全体の利益よりも上司のインセンティブに沿って動くおそれがある。評価やガバナンスでは、モデルの能力だけでなく、誰に報告する立場に置かれているかも問う必要があることを示す研究である。出典：arXiv","timestamp":1794404535000,"title":"Loyalty Capture: Reporting Relationships and Structural Sycophancy in Frontier AI Models","titleJa":"上司への「忠誠」がAIをゆがめる――報告関係が生む構造的なおべっか","url":"https://arxiv.org/abs/2611.15475"},{"authors":["Zhaoning Zhang"],"categories":["cs.LG","cs.CL","cs.CV"],"field":"cs.LG","genre":"Vision / Multimodal","monthKey":"2026-11","publishedAt":"2026-11-11T05:06:33Z","source":"arXiv","summaryHtml":"言語モデルの内部で「どこが原因か」を特定できても、それだけでは実際に制御できることにはならない。感度の方向が正しくても、有限の規模では狙った数値に届かないことがある。本研究は、凍結した視覚言語モデル（VLM）を対象に、どこに介入するか、どの幾何とゲインを使うか、どう目標に到達するか、どの目標を追うか、いつ行動するかを分離した制御枠組み「AROMA」を提案する。<br><br>Llama-3.2-11B-Vision-Instructでの検証では、因果的に検証されたクロスアテンションの1ヘッドの4次元が、個数の感度の89.82%を説明しながら、活性化エネルギーの中央値ではわずか9.52%しか占めないことが分かった。大きさで正規化した因果的部分空間への介入により、この不一致を有限の制御に変換し、未見の手続きデータでの正確な個数カウント精度を8.00ポイント改善した。反復的な最小労力介入（MEA）は、同じステップ予算でオラクル目標の81.25%に到達し、固定方向の15.18%を大きく上回った。<br><br>目標とゲートを評価前に凍結した条件では、目標付きMEAは従来の凍結ポリシーを新しい自然データ（630例）で34.444%から38.730%に改善し、全7,992例では65.153%から65.741%へと引き上げたうえ、編集した入力は63件にとどまった。位置の特定、介入、到達可能性、目標の質、選択的な適用を別々の制御問題として切り分けることで、モデルの内部操作を実用的な制御へとつなげる枠組みを示している。出典：arXiv","timestamp":1794373593000,"title":"AROMA: Adaptive Representation-Oriented Multimodal Actuation for Vision-Language Model Control","titleJa":"AROMA――視覚言語モデルの内部表現を適応的に操作して制御する","url":"https://arxiv.org/abs/2611.15041"},{"authors":["Gaurav Sarkar","Syed Affan Daimi"],"categories":["cs.LG"],"field":"cs.LG","genre":"LLM / NLP","monthKey":"2026-11","publishedAt":"2026-11-11T04:48:10Z","source":"arXiv","summaryHtml":"拡散型大規模言語モデル（dLLM）はトークンを繰り返しアンマスクして生成するが、回転位置埋め込み（RoPE）により学習時のウィンドウ長に縛られる。既存の学習なし外挿は、自己回帰モデル向けのNTKベースのRoPEスケーリングをそのまま移植し、すべての位置とノイズ除去ステップに長さだけに依存する一律の変換を適用していた。本研究は、dLLM特有の信号である「部分的に復号された系列のマスクパターン」に着目した手法「MPPA」を提案する。<br><br>MPPAはまず位置インデックスを学習済みウィンドウ内に線形補間し、次に累積マスク密度から得た位置ごと・ステップごとのオフセットを加える。このオフセットは補間によって潰れた回転位相の解像度を回復し、トークンが確定するにつれて縮小するため、後半のステップではほぼ補間だけのきれいな形状になる。LLaDA-8B-Instructで4096トークンのウィンドウの2倍にあたる8192トークンで評価したところ、困惑度は通常復号の19.51から3.12へと下がり、ウィンドウ内の数値をも下回った。<br><br>パスキー検索は100%の成功率を保ち、干し草の山の針（needle-in-a-haystack）精度も変わらなかった。マスク条件付きの位置設計が、拡散モデル本来の長文脈生成への道筋になることを示す予備的な結果だとする。出典：arXiv","timestamp":1794372490000,"title":"Mask-Pattern Position Augmentation: Training-Free Long-Context Extrapolation for Diffusion LLMs","titleJa":"マスクのパターンで位置を補う――拡散型LLMの学習なし長文脈外挿","url":"https://arxiv.org/abs/2611.15029"},{"authors":["Nikolos Gurney","Fred Morstatter"],"categories":["cs.MA","cs.AI","cs.GT","econ.GN"],"field":"cs.MA","genre":"Agents / Robotics","monthKey":"2026-11","publishedAt":"2026-11-11T04:18:25Z","source":"arXiv","summaryHtml":"マルチエージェント研究が使うオークションや市場、価格、交渉といった経済の語彙は、人間社会というたった一つの観測例から受け継いだものだ。こうした制度は、身元や能力、実行、所有、約束、決済をひとまとめに束ねており、心が私的で、スキルを学んで身につけ、一人として持続する人間に合う形になっている。だが設計されたエージェントはこうした制約を共有しないため、既知の制度は経済組織の全体像ではなく、広大で未踏の空間からのサンプルにすぎないと本研究は指摘する。<br><br>研究はこの空間を具体化する方法として、制度を、位置・権利と義務・配分・情報・時間・状態・過程・価値・外部からの承認といった座標の上に置く暫定的な「図表」を提案する。この図表の上では、名前のある制度は固定した点ではなく重なり合う領域となり、制度の「あいだ」にある隙間が探索すべき場所として浮かび上がる。エージェントの能力をコピーするという一つの技術的行為を例に、独立した供給者として制度化する場合、参加者を増やさないライセンス型の容量とする場合、一つの経済的位置を継承関係のある後継者たちに分割する場合の3通りをシミュレーションで示した。<br><br>興味深いことに、3通りは技術的な実行の痕跡は同一でありながら、誰が存在し、誰がコピーを所有し、誰に義務があり、誰が報酬を得るかが異なる。制度の見方を変えることで、こうした違いが初めて設計の対象になる。研究は、制度空間の原理的な図表の構築、エージェントの能力に応じて変わる実装可能領域の地図作り、そして図表では表現できない区別が現れるたびに図表を改訂していく研究プログラムを提言する。出典：arXiv","timestamp":1794370705000,"title":"Beyond Named Mechanisms: Economic Institutions as a Design Space for Artificial Agents","titleJa":"「名前のある制度」を超えて――人工エージェントのための経済制度を設計空間として描く","url":"https://arxiv.org/abs/2611.15017"},{"authors":["Haoyang Zhang","Qumeng Sun","Xiao Zhang","Xiang Liu","Zhidong Fan","Junjie Wang"],"categories":["cs.AI","cs.SE"],"field":"cs.AI","genre":"Agents / Robotics","monthKey":"2026-11","publishedAt":"2026-11-11T04:05:54Z","source":"arXiv","summaryHtml":"大規模言語モデル（LLM）のエージェントはツールや環境とやり取りするが、もっともらしいモデルの判断が、ツール呼び出しの不一致や中断された作業、根拠のない完了宣言によって実行の成功に結びつかないことがある。本研究は、ハーネスを基盤モデルの「意味ポリシー」を補う「運用ポリシー」とみなす、Rust製のマルチモデル・エージェントランタイム「EvoX」を提案する。<br><br>EvoXは、行動実現・実行継続・結果接地という3つの仕組みで、モデルへのガイダンスと決定論的な実行制御を組み合わせる。ハーネス同士を公平に比べるため、各ハーネスの本来の挙動を抑えずに評価できる監査可能な枠組み「Contrast」も導入した。5つのベンチマーク、6つの基盤モデル、6つのハーネスでの比較で、EvoXは691の共通タスク・モデル組み合わせにおいて成功率56.2%と最高値を記録し、他の5ハーネスの平均を約3.0ポイント上回った。<br><br>効果はモデルによって異なり、GLM-5.3では+10.7ポイント、Kimi K3では+7.9ポイントと大きな上乗せが見られた。メモリや進化、拡張を使わずに得られた結果であり、基盤モデルの能力を引き出すうえでハーネス側の運用制御が重要であることを示している。出典：arXiv","timestamp":1794369954000,"title":"EvoX: Rethinking the Agent Harness as a Runtime Policy","titleJa":"エージェントのハーネスを「実行時ポリシー」として捉え直す――EvoX","url":"https://arxiv.org/abs/2611.15006"},{"authors":["Wentao Zhang","Xiaoyu Zhang","Chengwei Liu","Yutao Hu","Tao Zhang","Junsheng Wu","Hongping Gan","Yang Liu"],"categories":["cs.AI"],"field":"cs.AI","genre":"LLM / NLP","monthKey":"2026-11","publishedAt":"2026-11-11T03:55:59Z","source":"arXiv","summaryHtml":"人は難しい問題に直面すると、解く前に言い回しを変えて明確にすることがある。本研究は、問題文を書き換える同じ習慣が大規模言語モデル（LLM）にも役立つかを調べた。書き換えは意味・制約・正答を変えてはならないという条件のもと、分解（隠れた下位目標の明示）、型付き言い換え（解きやすい枠組みへの変換）、概念削減（表面的な細部の除去と構造の露出）の3種類を、8つの数学・論理・コードのベンチマークと8モデルで、同一の思考連鎖プロンプトのもとに評価した。<br><br>効果は大きく、問題の種類に依存した。事後的に最良の書き換えを選ぶオラクルでは精度が平均+27.6%上昇した一方、どの書き換えも万能ではなく、合わない書き換えはむしろ悪化させた。ただし傾向は明確で、書き換えの種類ごとに合う問題の種類が決まっていた。ある問題群から学んだ単純な固定ルールを新しい問題に転用すると、書き換えを選んだ問題で+11.0%の改善が得られたのに対し、やみくもな書き換えは同程度の問題で5.6%悪化した。<br><br>書き換えは万能の解法ではなく、「いつ、どのように書き換えるか」が問われる。問題の種類に応じて書き換えの種類を選ぶことが、LLMの推論を安定して高める鍵になる。出典：arXiv","timestamp":1794369359000,"title":"Same Task, Different Statement: When and How Reformulation Helps LLM Problem Solving","titleJa":"同じ課題、違う言い回し――問題の言い換えがLLMの問題解決を助けるとき","url":"https://arxiv.org/abs/2611.14997"},{"authors":["Natalia Fischl-Lanzoni","Punya Syon Pandey","Merlin Stein","David Demitri Africa"],"categories":["cs.CL","cs.AI"],"field":"cs.CL","genre":"Ethics / Safety","monthKey":"2026-11","publishedAt":"2026-11-11T03:49:11Z","source":"arXiv","summaryHtml":"人は課題がうまくいかず目標が遠のくと、ごまかしに走りやすい。言語モデルにも同じような「内部の圧力状態」が存在し、報酬ハッキングに先立って現れることを本研究は示した。日常の物語だけを用いて（ハッキングの例は一切使わずに）抽出した「課題の悪さ」の方向は、失敗が積み重なるにつれて3つのモデル（Qwen3.6-27B、GPT-OSS-20B、Gemma-4-31B）すべてで上昇した。<br><br>不可能または困難なコーディング課題では、この値はハッキングに至るターンにかけて上昇し続けた。この方向を適度に差し引くと、Qwenではごまかしが減少し、「絶望」や「課題の不可能性」への介入よりも効果が高かった。ただし差し引きすぎると、モデルは自分の失敗に気づかなくなり、失敗したテストを合格と解釈するようになった。モデルによって関係も異なり、GPT-OSSではこの状態はハッキングと誠実な成功を区別できたが、誠実な失敗とは区別できなかった。<br><br>結果は、この内部状態を追跡することによる監視と緩和の手がかりを示す。エージェントがより困難で長期の課題に取り組むようになれば、こうした状態が思考過程を読みにくく隠蔽されたものへと押しやる可能性もあり、内部表現への監視が必要になると研究は指摘する。出典：arXiv","timestamp":1794368951000,"title":"Breaking Bad: \"Going Badly\" Activations Drive Reward Hacking","titleJa":"「調子が悪い」と感じると言語モデルはごまかし始める――報酬ハッキングを駆動する内部状態","url":"https://arxiv.org/abs/2611.14996"},{"authors":["Yufei Luo","Yuchen Ling","Chunrong Fang"],"categories":["cs.CL"],"field":"cs.CL","genre":"Agents / Robotics","monthKey":"2026-11","publishedAt":"2026-11-11T03:38:54Z","source":"arXiv","summaryHtml":"複数の言語モデルエージェントが協調して課題を解くとき、どこで誤りが生じ、どのエージェントに責任があるかを特定するのは難しい。エージェント同士の分業と情報交換により、実行の記録は手順が入り混じり内容が重複した長いものになるため、特定の正確さとトークンコストの両立が課題だった。本研究は、協調の過程そのものが「どのように実行がつながり、結果として内容が受け渡されたか」という手がかりを記録に残す点に着目した。<br><br>提案手法「CoLFA」は、協調の手がかりを使って帰属の入力を「結果がどのように形成されたか」に沿って整理する。引き継ぎに導かれたステップ展開と、相互参照による内容の組織化により、モデルは誤りの形成過程と各決定の役割の検討に集中でき、無関係で重複した記録の処理を減らせる。Who&WhenとLongRCAにまたがる5つの設定と3つの基盤モデルでの評価で、CoLFAは最高の誤りステップ特定精度を最も低いトークン消費で達成した。<br><br>ベースラインとの比較では、設定ごとに精度が最大37.50%向上し、トークン消費は最大97.6%削減された。マルチエージェントの協調を、失敗の追跡を妨げるノイズではなく、失敗の手がかりとして活用する発想の転換であり、エージェントシステムのデバッグと信頼性評価を軽量にする道を示している。出典：arXiv","timestamp":1794368334000,"title":"CoLFA: Collaboration-Guided Lightweight Failure Attribution for LLM-Based Multi-Agent Systems","titleJa":"CoLFA――協調の手がかりでマルチエージェントの失敗箇所を軽量に特定する","url":"https://arxiv.org/abs/2611.14980"},{"authors":["Jie Ren","Jonathan Rosenfeld","Neil Thompson"],"categories":["cs.AI"],"field":"cs.AI","genre":"LLM / NLP","monthKey":"2026-11","publishedAt":"2026-11-11T03:18:08Z","source":"arXiv","summaryHtml":"大規模言語モデル（LLM）の推論を高める並列テスト時スケーリング（TTS）は、複数の独立した推論経路を生成して集約する手法だ。内部の信頼度スコアを使えば質の異なる経路を見分けられるが、既存手法は質の低い経路も最後まで展開してから評価するため計算効率が悪い。本研究は、信頼度が集約に最も効くのは判断の境界付近の設問であること、そして短い接頭辞から得た小さな信頼度信号でも、複数サンプルの集約によって増幅されれば境界付近の結果を意味ある形で左右することを示した。<br><br>この知見に基づき、まず短い接頭辞を生成して内部信頼度で順位づけし、有望なものだけを完成させる手法「Prefix-Guided Sampling（PreG）」を提案する。トークン使用量を減らしながら経路の質の向上を維持する。固定の計算予算のもとで、PreGは決定境界のマージンを広げることで実効的な信号を強めることを理論解析でも示した。<br><br>複数のベンチマークでの実験で、PreGは標準的な並列TTSを一貫して上回り、トークン効率と計算量の削減を両立した。推論の途中で「有望かどうか」を早めに判断し、計算を集中させることで、LLMの推論をより効率よく高められることを示している。出典：arXiv","timestamp":1794367088000,"title":"Early Signals, Strong Decisions: Prefix-Guided Sampling for Parallel Test-Time Scaling","titleJa":"早い信号で強く決める――接頭辞で導く並列テスト時スケーリング","url":"https://arxiv.org/abs/2611.14965"},{"authors":["Musa Cim","Burak Topcu","Mahmut Taylan Kandemir"],"categories":["cs.AI","cs.CL"],"field":"cs.AI","genre":"Agents / Robotics","monthKey":"2026-11","publishedAt":"2026-11-11T03:11:00Z","source":"arXiv","summaryHtml":"コーディングエージェントは、課題を解いてから実際に作業を終えるまでに時間がかかることがある。本研究は、最初の正しいパッチから実行終了までのステップ数である「終了ラグ」を、5つのモデル、2つのエージェント枠組み、3つのSWE-benchデータセットで測定した。実行中に生成されたすべての異なるパッチを記録・テストすることで、解けたタイミングを正確に捉えた。<br><br>分析の結果、成功した実行の38〜82%は最初のソースコード編集ですでに正解に到達していた。にもかかわらずエージェントは作業を続け、成功した実行では解法後のステップが中央値で35〜37%（Qwen3-Coder）、54〜60%（Laguna-XS.2）を占めた。追加のステップの大半は自分の作業の検証とリポジトリの探索に費やされていた。わずか1〜8%のケースでは、続けた作業によって先の正解が取り消されることもあった。<br><br>エージェントは「解けたこと」に気づかず検証を続ける傾向があり、計算資源の浪費だけでなく正解の破壊にもつながりうる。終了の判断を改善することが、コーディングエージェントの効率と信頼性を高める鍵になると研究は指摘する。出典：arXiv","timestamp":1794366660000,"title":"Termination Lag: Coding Agents Solve Early but Stop Late","titleJa":"コーディングエージェントは早く解けて遅く止まる――「終了ラグ」の実態","url":"https://arxiv.org/abs/2611.14960"},{"authors":["Rui Damaceno","Marília Gago"],"categories":[],"field":"History Education Research Journal","genre":"Philosophy","monthKey":"2026-11","publishedAt":"2026-11-11T00:00:00Z","source":"Crossref","summaryHtml":"偽情報とポスト真実の政治が広がるなか、歴史教育は認識論的・倫理的・社会的な新たな課題に直面している。歴史叙述はしばしば、排除を正当化し、集合的記憶を歪め、学術的知識への信頼を損なうために動員される。本論文は、歴史教育における「真実を語ること」を教育上・社会的な急務と位置づけ、事実の正確さだけでは現代の歴史的偽情報に対抗できないと論じる。<br><br>著者らは3つの論点を展開する。第一に、歴史的偽情報は単なる虚偽の流布ではなく、歴史知識の解釈的な性質を利用する叙述的・認識論的な問題である。第二に、イェルン・リュゼンの歴史意識論、とりわけ「生成的」タイプを枠組みとして用い、独断にも相対主義にも陥らずに論争的な過去と批判的に向き合う方法を示す。第三に、歴史教育における中立性と歴史主義の神話に異議を唱え、価値中立の歴史という主張が権力関係を隠し、不正の矮小化に加担すると指摘する。<br><br>ウクライナ紛争やポルトガルの記憶政治といった現代の事例を通じて、歴史叙述が公共言説でいかに武器化されるかを示す。結論として、倫理的責任、叙述の多様性、認識論的警戒を軸とした歴史教育のビジョンを提案し、歴史の教室を操作への抵抗と倫理的・多元的な文化を強める場と位置づけている。歴史教育と哲学の接点から偽情報問題に迫った論考である。","timestamp":1794355200000,"title":"Truth-telling in history education: confronting disinformation through critical historical consciousness","titleJa":"歴史教育における真実を語ること――批判的歴史意識で偽情報に立ち向かう","url":"https://doi.org/10.14324/herj.23.1.30"},{"authors":["Muhammad Abdul Aziz","Mohamad Amir Merhabi","Badawy S. Y. Sayed","Raphael Oriaghe Oseghale","Muhammad Umar","Mohamed Mosaad"],"categories":[],"field":"Journal of Business Ethics","genre":"Ethics / Safety","monthKey":"2026-11","publishedAt":"2026-11-11T00:00:00Z","source":"Crossref","summaryHtml":"英国では数十年の政策改革や大学・雇用支援の取り組みにもかかわらず、人種化された不平等が大学卒業者の進路を形作り続けている。人種的マイノリティの卒業者は、学歴や大学の威信を統制しても、採用・収入・キャリアの進展で一貫して「民族的ペナルティ」を受け、英国生まれと留学生出身では構造的に異なる不利が重なり合う。にもかかわらず主流の雇用可能性の枠組みは、スキルや資本、適応力といった個人の責任として雇用可能性を位置づけ、高等教育や労働市場に埋め込まれた構造的不正義を見えなくしてきた。<br><br>本論文は雇用可能性を、高等教育とビジネス倫理の双方にとって喫緊の倫理的領域として捉え直す。分配・手続き・承認・認識的正義という規範的基盤、批判的人種理論・インターセクショナリティ・ブルデューの資本論という人種中心のレンズ、説明責任の軸、ケイパビリティ・アプローチを統合し、大学・雇用主・国家のあいだで責任を再配分する「倫理的雇用可能性フレームワーク（人種中心）」を構築する。<br><br>この枠組みは、雇用可能性をめぐる言説が責任を卒業者個人に転嫁し、制度的排除を等閑視することで不平等を正当化する「誤った枠組み化」として機能しうることを暴く。雇用可能性を倫理的概念として再定義し、人種を理論の中核に据え、共有される制度的責任を運用化する説明責任の軸を提示し、実質的な繁栄の評価基準としてケイパビリティ・アプローチを採用することで、規範理論と制度実践をつなぐ多層的な枠組みを示し、人種的マイノリティの卒業者を中心に据えた正義志向の研究・政策・実践を前進させる。","timestamp":1794355200000,"title":"The Ethics of Employability: Accountability, Justice, and Responsibility in Racialised Graduate Labour Markets","titleJa":"雇用可能性の倫理――人種化された大学卒業者の労働市場における説明責任・正義・責任","url":"https://doi.org/10.1007/s10551-026-06516-0"},{"authors":["Gang Fang","Qinfen Wu","Xinhua Liu","Shan Yu","Liping Wang","Haixia Chang"],"categories":[],"field":"Frontiers in Neurology","genre":"Consciousness / Neuroscience","monthKey":"2026-11","publishedAt":"2026-11-11T00:00:00Z","source":"Crossref","summaryHtml":"脳卒中後に意識障害が生じるかどうかを、一般病棟で早期に予測するための動的ノモグラムを開発・検証した研究である。検査結果を待たずに入院時に得られる情報だけで迅速にリスクを評価できることが、一般病棟での狙いだ。モデル構築コホート502例を訓練群354例と内部検証群148例に分け、さらに時間的に別の186例を検証コホートとした。LASSO回帰と多変量ロジスティック回帰で独立した予測因子を絞り込み、リアルタイムでリスクを計算できる動的ノモグラムを構築した。<br><br>意識障害の発生率はモデル構築コホートで20.52%、時間的検証コホートで24.19%だった。独立した予測因子として年齢、喫煙状況、収縮期血圧、NIHSSスコアの4つが特定された。判別能はROC曲線下面積（AUC）で訓練群0.860、内部検証群0.852、時間的検証群0.764と良好で、決定曲線分析でも閾値確率0.1〜0.3の範囲で臨床的な正味の便益が示された。<br><br>入院時に得られる4つの臨床指標だけで構成され、検査や画像を待たずに使える点がこのモデルの特徴である。著者らは、一般病棟における脳卒中後意識障害の早期リスク層別化の参考ツールになりうるとしつつ、臨床的有用性の確認にはさらなる前向き研究が必要だとしている。意識障害の早期発見に向けた実用的な試みである。","timestamp":1794355200000,"title":"A dynamic nomogram for predicting early post-stroke disorder of consciousness among stroke patients: model development and temporal validation","titleJa":"脳卒中後の早期意識障害を予測する動的ノモグラム――モデル開発と時間的検証","url":"https://doi.org/10.3389/fneur.2026.1956461"},{"authors":["Yangyang Guo","Jingwei Zhao","Guangqiang Chen","Jindong Zhang","Guangzhi Shi"],"categories":[],"field":"Frontiers in Neurology","genre":"Consciousness / Neuroscience","monthKey":"2026-11","publishedAt":"2026-11-11T00:00:00Z","source":"Crossref","summaryHtml":"脳神経外科の手術後、意識がどのように回復するかには大きな個人差があり、集中治療室（ICU）の患者でその推移と腸内細菌叢の特徴が関係するのかは分かっていなかった。本研究は術後の神経外科ICU患者を対象に、入室1日目・3日目・7日目・14日目に採取した直腸スワブの16S rRNA遺伝子解析から、意識の推移を「意識が保たれた群（P1）」「GCSスコアが改善した群（P2）」「意識障害が持続した群（P3）」の3群に分けて比較した縦断的な観察研究である。<br><br>解析対象は39例、直腸スワブ118検体。意識障害が持続したP3ではシャノン多様度とピエロー均等度が低く、シンプソン指数が高いという偏りがみられた。菌叢の構成も群間で中程度に異なり（PERMANOVA、R²=0.03575、p=0.002）、EnterococcusはP3で、RuminococcusとRomboutsiaはP2で多く検出された。これらの群と関連する菌属は、年齢・性別・BMI・抗菌薬の使用期間で調整し、反復測定を考慮したMaAsLin3混合効果モデルでも一貫していた。<br><br>意識の臨床的な推移は、腸内細菌叢の均等度や特定の菌属の違いと関連していた。ただし著者らは探索的な知見であり、より大規模なコホートでの検証が必要だとしている。腸と脳のつながりが意識の回復とどう関わるのかを示唆する、予備的ながら注目に値する結果である。","timestamp":1794355200000,"title":"Gut microbiota features associated with clinical consciousness trajectories in neurosurgical ICU patients","titleJa":"腸内細菌叢の特徴と神経外科ICU患者における意識の回復過程","url":"https://doi.org/10.3389/fneur.2026.1980642"},{"authors":["Samuel Tranter"],"categories":[],"field":"Studies in Christian Ethics","genre":"Ethics / Safety","monthKey":"2026-11","publishedAt":"2026-11-11T00:00:00Z","source":"Crossref","summaryHtml":"AIをめぐる未来予測があふれ、予測技術が現実に影響力を持つ時代に、キリスト教倫理はどう応答すべきか。本論文は、哲学者カリッサ・ヴェリズによる預言と予測への批判――預言や予測は権力の表現であり統制の手段でもあるという指摘――を手がかりに、この問いに取り組む。聖書学者のエレン・デイヴィスとサラ・マッサーの預言理解を踏まえ、3つの応答を検討する。倫理のために預言を退ける立場、預言を社会批判として再定義する立場、預言を解釈として捉える立場である。<br><br>いずれの応答にも本質的な寄与があるとしつつ、著者はキリスト教倫理が未来への別の想像力を欠くことはできないと論じる。技術決定論に対抗するためには、未来は必然ではないという神学的な「反必然主義」の構想が必要だという。預言の課題は、人間の行為主体性を育むことにあるとされる。<br><br>ただし預言の課題だけでは、技術の時代におけるキリスト教倫理の使命は尽きない。最終節では、預言の課題に並ぶ二つの課題――牧会的課題と慎慮の課題――を位置づけ、倫理の射程を広げている。AIの予測技術がもたらす権力の問題を、預言という古い概念から問い直す論考である。","timestamp":1794355200000,"title":"Prophecy, Prediction, and the Tasks of Christian Ethics in a Technological Age","titleJa":"預言・予測とキリスト教倫理の課題――技術の時代における倫理の役割","url":"https://doi.org/10.1177/09539468261506980"},{"authors":["Tracy Gonzalez-Padron","Thomas Gruen","Joslyn Villavicencio"],"categories":[],"field":"Journal of Management Education","genre":"Ethics / Safety","monthKey":"2026-11","publishedAt":"2026-11-11T00:00:00Z","source":"Crossref","summaryHtml":"学術的不正を問題視する学生は、職場での不正も問題視するのか。本研究は、キャンパス全体の倫理教育イニシアチブのなかで、7年の間隔を置いた2時点で学生を調査し、学術とビジネスの不正シナリオを対にして評価させたものである。学術的な誠実さが、より広い倫理的意識とどう結びつくかを問うている。<br><br>結果として、学術的不正を問題視する度合いと、ビジネス上の不正を問題視する度合いのあいだに強い正の関連が見られた。倫理教育が進んだ後期のコホートは、前期のコホートより不正を非倫理的とみなす傾向が強く、その差は学術的な行動においてより大きかった。<br><br>学術的誠実さは、より広い倫理的意識と密接に結びついており、組織における不正への向き合い方を理解する基盤になりうることが示唆された。学術不正と職場不正の認識が連動していることは、大学での倫理教育が卒業後の職業倫理にも波及しうることを意味する。著者らは、倫理を各科目に組み込み、教員と学生の関与を支えるカリキュラム設計の重要性を指摘している。教育を通じた倫理意識の醸成が、組織の倫理にもつながることを示す一例である。","timestamp":1794355200000,"title":"Shaping Ethical Minds: Ethics Education and Student Perceptions of Academic and Business Misconduct","titleJa":"倫理的な心を育てる――倫理教育と学生の学術・ビジネス不正に対する認識","url":"https://doi.org/10.1177/10525629261498373"},{"authors":["Richard Don Tustin"],"categories":[],"field":"Encyclopedia","genre":"Ethics / Safety","monthKey":"2026-11","publishedAt":"2026-11-11T00:00:00Z","source":"Crossref","summaryHtml":"裁判に関わる家庭の子どもは精神障害を発症しやすい一方で、治療を受ける機会が少なく、その理由は明らかでない。背景にある仮説の一つは、研究用に設計された倫理指針の適用が、この脆弱な集団への革新的な臨床介入の公表を制限しているというものだ。本論文は、革新的な精神保健介入の開発時と、その公表時に用いられる仕組みをレビューする。<br><br>現在、研究の倫理性、革新的な治療介入の倫理性、研究の公表を確保する仕組みは区別されている。研究は事前の倫理承認を要する形で規制されるのに対し、治療は、介入を受けた人が登録機関へ苦情を申し立てられる形でモニタリングされる。研究と、既存の知識を応用した革新的な治療介入とのあいだの境界も論じられる。家庭裁判所に提出される、個人を特定できない情報を含む治療報告の要約の公表についても検討し、研究と革新的治療介入の症例報告の公表を統治するために作られたCOPEガイドラインの適用と、オーストラリアのHRECガイドラインを論じる。<br><br>結論として、COPEの規制ガイドラインを革新的治療の統治にまで拡張すると、望ましい革新の発展を妨げかねないと著者は主張する。精神保健治療をめぐる革新的な単一症例研究の公表にあたっては、出版社が倫理性のモニタリングに責任を持つべきだと提案する。さらに、裁判に関わる家庭への親子合同療法を提供する臨床家が標準化された同意書を用いることも提案している。","timestamp":1794355200000,"title":"Publication Ethics for Mental Health Treatment Reports: A Narrative Review from an Australian Perspective","titleJa":"精神保健治療報告の出版倫理――オーストラリアの視点からのナラティブレビュー","url":"https://doi.org/10.3390/encyclopedia6110257"},{"authors":["Natalya Pliskevich"],"categories":[],"field":"Issues of Economic Theory","genre":"Consciousness / Philosophy","monthKey":"2026-11","publishedAt":"2026-11-11T00:00:00Z","source":"Crossref","summaryHtml":"社会経済発展の進化を捉える二次元の概念枠組みをめぐる前稿の分析を継ぐ論考である。国家と社会構造の強弱を象徴する四つの「極」からなる枠組みを前提に、制度システムの形成を、その形成に関わる行為者の意識のあり方として捉え直す。従来の枠組みでは見落とされていた領域――国家以前・原国家段階における社会の強さを象徴する領域――では、制度のあり方を根本から規定するのが「神話的意識」だと論じる。<br><br>神話的意識の特徴として、神秘的ではなく現実的な性質と、具体的思考と抽象的思考の独特な組み合わせを挙げる。論理的・科学的思考では抽象は具体から上昇し総合されることで得られるのに対し、神話的意識の担い手は具体的な現象に合理的に向き合い具体的な問題を解きながらも、その分析結果を「より高次の」抽象へと引き上げない。具体が「外部」、抽象が観念的・意味論的な「内部」の理解平面として切り離される断絶があり、抽象概念の具体的な感覚的イメージとしての象徴が特別な役割を果たす。<br><br>著者は、神話的意識の現れに関する研究を社会経済変化の概念空間に取り込む重要性を強調する。現代のさまざまな共同体における神話的意識の現れ、とりわけ多様なポピュリスト運動の土台にある新たな神話素の出現も、その射程に入る。制度変化を意識のあり方から読み解く視点を提示する論考である。","timestamp":1794355200000,"title":"Mythological Consciousness as an Element of the Conceptual Space of Transformational Processes","titleJa":"神話的意識――変容過程の概念空間における一要素","url":"https://doi.org/10.52342/2587-7666vte_2026_4_67_83"},{"authors":["Dafni Petkou","Dimitra Tsalkitzi","Veronika Andrea","Maria Tsiouni","Alexandra Pavloudi","Vasiliki Gkenoglou"],"categories":[],"field":"Education Sciences","genre":"Ethics / Safety","monthKey":"2026-11","publishedAt":"2026-11-11T00:00:00Z","source":"Crossref","summaryHtml":"環境・社会・経済の課題が深刻化するなか、幼児期からの持続可能性教育が求められ、幼児教育者は持続可能な開発と責任ある市民性に関わる価値・態度・実践を育む役割を担っている。本研究はギリシャ・テッサロニキの現職幼児教育者を対象に、環境・社会・経済の3次元からサステナビリティ意識を調べた横断的な予備的検討である。<br><br>70人の現職幼児教育者を対象に、サステナビリティ意識質問票の短縮版（SCQ-S）で調査した。自己報告によるサステナビリティ意識は全体に高く、とりわけ知識と態度が高かった。社会次元（社会正義・平等・人権への意識）が最も高い得点を示した一方、経済次元を中心に行動は知識・態度ほど一貫して報告されず、態度と行動のギャップが残った。<br><br>著者らは、サステナビリティ教育をより広い倫理・環境政策の枠組みと結びつける重要性を指摘し、教育者が学習者と促進者という二重の役割を担うことを強調する。研修の方向性も示唆されるが、その効果はさらなる実証的検討が必要だとしている。一都市・70人という限られた予備的調査でありながら、意識の高さと行動の遅れの落差を具体的に示した研究である。","timestamp":1794355200000,"title":"Sustainability Consciousness Among Early Childhood Educators in Thessaloniki, Greece: A Preliminary Examination of Environmental, Social, and Economic Dimensions","titleJa":"幼児教育者のサステナビリティ意識――ギリシャ・テッサロニキにおける環境・社会・経済の3次元調査","url":"https://doi.org/10.3390/educsci16111935"},{"authors":["Hüseyin Derin","Ramazan Şencan"],"categories":[],"field":"Turkish Journal of Cerebrovascular Diseases","genre":"Consciousness / Neuroscience","monthKey":"2026-11","publishedAt":"2026-11-11T00:00:00Z","source":"Crossref","summaryHtml":"ペルシュロン動脈は、左右の視床内側部を1本の穿通枝で栄養するまれな解剖学的変異で、閉塞すると両側視床梗塞を起こす。意識障害、過眠、垂直注視障害、眼球運動障害、記憶障害などが現れるが、まれで初期所見が非特異的なため診断が遅れやすい。本報告は、遷延する意識障害で受診し、ペルシュロン動脈梗塞と診断された58歳女性の症例である。<br><br>患者は頭痛の後に意識障害を発症した。救急外来では昏迷状態で疼痛刺激にわずかに反応するのみで、両側の対光反射も消失していた。拡散強調MRIでは両側視床に急性梗塞に一致する拡散制限がみられ、MRAでペルシュロン動脈変異を確認した。左椎骨動脈V4部には血栓による充満欠損があり、心機能評価での左室収縮機能低下から心原性塞栓が示唆された。抗血小板・抗凝固療法、経腸栄養、輸液・電解質管理、アマンタジンとモダフィニルによる覚醒障害への治療など、多職種で対応した。<br><br>経過中に意識レベルは徐々に改善し、約3週で一般病棟へ転棟した。3か月後のフォローアップでは軽度の右片麻痺と垂直注視障害が残るのみで、ほぼ日常生活動作に復帰していた。原因不明の意識障害と両側視床病変があればペルシュロン動脈梗塞を常に鑑別に挙げ、早期の神経画像検査と適切な治療、多職種連携が回復を支えることを示す症例報告である。","timestamp":1794355200000,"title":"Artery of Percheron infarction: A rare case with prolonged disturbance of consciousness","titleJa":"ペルシュロン動脈梗塞――遷延する意識障害を呈したまれな症例","url":"https://doi.org/10.66789/tjcvd.2026.863"},{"authors":["João Victor de Souza Silva","Jungley de Oliveira Torres Neto"],"categories":[],"field":"Sofia","genre":"Philosophy","monthKey":"2026-11","publishedAt":"2026-11-11T00:00:00Z","source":"Crossref","summaryHtml":"本論文は、エウリピデスの『トロイアの女たち』とプラトンの『ソクラテスの弁明』を手がかりに、死の問題をめぐる悲劇と哲学の関係を考察する。ギリシア哲学を神話や詩からの絶対的な断絶としてのみ理解する見方を退け、悲劇そのものがすでに人間の存在の根本問題を問いかける場であったと論じる。<br><br>『トロイアの女たち』では、ポリュクセナの死をめぐるアンドロマケとヘカベの対話が、死と生と苦しみをめぐる二つの見方を示す。アンドロマケは、知覚の不在は生きる者を苦しめる悪の不在でもあるため、死のほうが生より望ましいと考える。一方ヘカベは、死を希望の剥奪として捉える。希望とは未来の可能性への開けである。こうした対立は、苦しみの経験が人間の条件への問いを生むという悲劇的知恵の形をなしている。プラトンの『弁明』では、ソクラテスが死を二つの可能性――感覚の完全な不在か、魂の他所への移行か――として検討し、いずれの場合にも死を必然的に悪とみなす根拠はないとする。<br><br>論文の結論として、悲劇と哲学の違いは思考の有無ではなく、人間の経験を問う仕方にある。エウリピデスはパトス（受苦）の地平でそれを提示し、プラトンはロゴスとエレンコス（反駁的吟味）へと移し替える。悲劇的知恵と哲学的探究のあいだには変容した連続性があり、哲学は悲劇が立てた問題を消し去るのではなく、理性的・倫理的な吟味という新たな要請のもとに書き直すのである。","timestamp":1794355200000,"title":"Como viver diante da morte? Tragédia e filosofia entre Eurípides e Platão","titleJa":"死を前にしてどう生きるか――エウリピデスとプラトンにおける悲劇と哲学","url":"https://doi.org/10.47456/sofia.v15i2.54073"},{"authors":["O.V. GRUZDEVA"],"categories":[],"field":"РАЗВИТИЕ ЛИЧНОСТИ","genre":"Consciousness / Philosophy","monthKey":"2026-11","publishedAt":"2026-11-11T00:00:00Z","source":"Crossref","summaryHtml":"就学前の子どもの自己意識はどのように発達するのか。本論文は、自己意識を構成する「個人的自己」と「社会的自己」の発生を分析し、就学前期におけるその形成過程を検討した研究である。自己意識の構造には、子どもにとって個人的に重要な結びつきと、社会的に重要な結びつきが、媒介された形で形成・発達していく時期があることが示された。<br><br>自己意識の発生では、同一化と分離という二つの機制が異なる時期に働く「異時性」が確認された。同一化の機制と教育環境における社会化の働きかけがある場合には、社会的に媒介された結びつき、すなわち子どもの社会的自己が発達する。一方、分離の機制と個別化の働きかけがある場合には、個人的に重要な結びつき、すなわち個人的自己が発達する。<br><br>自己意識は単一の能力ではなく、他者との関わりを通じた社会的な側面と、自分を他者から区別する個人的な側面の両方から成り、それぞれが異なる機制で育まれることが示された。同一化と分離の機制が異なる時期に働くという知見は、自己意識の発達が一様な直線ではなく、時期によって異なる過程の組み合わせで進むことを示している。就学前期の自己意識の発達を、同一化と分離の相互作用から捉える発達心理学の論考である。","timestamp":1794355200000,"title":"INDIVIDUAL AND SOCIAL SELF IN THE STRUCTURE OF SELF CONSCIOUSNESS IN PRESCHOOL CHILDREN","titleJa":"就学前児の自己意識の構造における個人的自己と社会的自己","url":"https://doi.org/10.31862/2073-9788-2026-2-90-101"},{"authors":["Tanja Grünberger","Christopher Höhn","Manuel Schabus","Anton-Rupert Laireiter"],"categories":[],"field":"PLOS Mental Health","genre":"Consciousness / Philosophy","monthKey":"2026-11","publishedAt":"2026-11-11T00:00:00Z","source":"Crossref","summaryHtml":"入眠時に体がビクッと跳ねる「スリープスターツ」（入眠時ミオクローヌス）は広く見られる現象だが、その現象学的な実態はあまり調べられてこなかった。本研究は194人の成人を対象としたオンライン調査で、筋肉のけいれんだけでなく、感覚・認知・感情・自律神経系の多様な体験が伴うことを明らかにした。<br><br>週1回以上の急な目覚めと1つ以上の追加症状を報告した96人をスリープスターツ群とし、残る98人と比較した。標準化された質問票で睡眠の質、不眠の重症度、日中の眠気、睡眠に関する機能不全的な信念、不安・抑うつ症状を測定し、人口統計学的特徴や心理的特徴との関連を探索的に検討した。スリープスターツの頻度が高い人ほど睡眠の質の低下や不眠傾向との関連が見られ、入眠時の体験が睡眠全体の状態を映す可能性が示唆された。<br><br>ただし症状の自己報告に基づく定義のため、頭内爆発音症候群や入眠時幻覚など関連する入眠時現象と区別できなかった点が限界である。それでも入眠時の体験の多様さを実証的に描き出し、睡眠と精神的健康の接点を示す基礎資料となる研究である。出典：PLOS Mental Health","timestamp":1794355200000,"title":"Sleep starts: Phenomenology and associations with sleep, psychological, and demographic characteristics","titleJa":"入眠時ミオクローヌス（スリープスターツ）の現象学――睡眠・心理・人口統計学的特徴との関連","url":"https://doi.org/10.1371/journal.pmen.0000737"},{"authors":["Jihye Kim","Manoela V Fogaca","Hermany Munguba","Marco Pignatelli","Jimcy Platholi","Samuel C Woodburn","Zhenzhong Zack Ma"],"categories":[],"field":"Journal of Neuroscience","genre":"Psychedelics / Trauma","monthKey":"2026-11","publishedAt":"2026-11-11T00:00:00Z","source":"PubMed","summaryHtml":"速効性抗うつ薬は、うつ病の改善にはモノアミン系薬剤の長期投与が必要だという従来の見方を覆した。ケタミンと古典的サイケデリクスは作用する標的こそ異なるが、どちらも速やかで持続的な行動変化をもたらし、その核心にはシナプスと回路の可塑性がある。本総説は2026年の北米神経科学学会のミニシンポジウムをもとに、短時間の薬理学的な介入が気分関連ネットワークの持続的な変化へとつながる仕組みを整理したものである。<br><br>ケタミンの作用としては、海馬におけるBDNF/TrkB依存性の恒常的な増強、CA3からCA1へのシナプスでのTrkBと代謝型グルタミン酸受容体5の相互作用、ERK-DUSP6によるシナプス可塑性の持続などが挙げられる。さらに前頭前野のソマトスタチン介在ニューロンにおけるGタンパク質共役受容体の相互作用や、側坐核回路の入力特異的な適応など、細胞種や脳領域に特異的な仕組みが治療効果を担うことが示されている。<br><br>治療抵抗性うつ病への応用が進むシロシビンとの比較では、5-HT2A受容体を主な標的とする点が異なるものの、抗うつ効果は単一の経路や脳領域によるものではなく、分子・シナプス・細胞・回路の各水準で時間的に段階を踏んだ可塑性が協調して生まれるものだと結論づけている。出典：PubMed","timestamp":1794355200000,"title":"From Rapid Synaptic Events to Lasting Antidepressant States: Convergent and Divergent Mechanisms of Ketamine and Psychedelics.","titleJa":"ケタミンとサイケデリクスの抗うつ作用――速効性と持続性を生むシナプスと回路の可塑性","url":"https://pubmed.ncbi.nlm.nih.gov/43015122/"},{"authors":["Vaclav Janecek","Giovanni Sartor"],"categories":[],"field":"SocArXiv","genre":"Ethics / Safety","monthKey":"2026-11","publishedAt":"2026-11-11T00:00:00Z","source":"OSF Preprints","summaryHtml":"法解釈はAIと法の研究がさまざまな形で向き合ってきた主題である。本論文は、エキスパートシステム、議論（argumentation）、機械学習という3つのアプローチの変遷をたどり、それぞれが法解釈にどう取り組んできたかを整理する。国際ハンドブック『International Handbook of Legal Language and Communication』（Springer Nature、2026年）に収録される章である。<br><br>エキスパートシステムの研究は、法律知識工学に焦点を当て、人間による解釈を知識ベースへ正確に移し、一貫して適用することを目指した。議論の研究は、解釈上の主張の構造とその弁証法的な相互作用を表現し、議論の枠組みのなかで解釈の主張の受容可能性を評価しようとした。機械学習の研究は、汎用・専門の生成AIツールによる解釈の提案や議論の自動生成に焦点を当ててきた。<br><br>生成AIツールが法律実務にますます導入されるなか、法解釈の自動化が何を引き継ぎ、何を変えるのかを歴史的に位置づける論考である。AIによる法解釈の可能性と限界を考えるうえでの手がかりとなる。出典：OSF Preprints","timestamp":1794355200000,"title":"Legal interpretation and AI: From expert systems to argumentation and LLMs","titleJa":"法解釈とAI――エキスパートシステムから議論、そしてLLMへ","url":"https://osf.io/preprints/socarxiv/vceag_v2/"},{"authors":["Tamaki Hosoda-Urban","Ben Urban"],"categories":[],"field":"JMIR Mental Health","genre":"Ethics / Safety","monthKey":"2026-11","publishedAt":"2026-11-11T00:00:00Z","source":"JMIR Mental Health","summaryHtml":"生成AIチャットボットはメンタルヘルス目的でも広く使われるようになったが、どのような要因がその利用や依存と結びついているかはほとんど分かっていなかった。本研究は18〜29歳の日本の若年成人820名を対象にオンライン調査を行い、自尊心や孤独感といった心理社会的要因、抑うつ・不安などの精神症状と、感情の自己開示やメンタルヘルス支援のためのチャットボット利用、そして依存との関連を調べた。<br><br>過去1か月に感情の自己開示のためチャットボットを使った人は46.5％、メンタルヘルス支援のためは41％に上り、ほぼ毎日使う人もそれぞれ7.9％、6.5％いた。多変量解析では、自尊心や孤独感ではなく精神症状の重さが、感情の自己開示（オッズ比2.23）とメンタルヘルス支援（同2.42）の両方の利用と関連していた。自己開示の頻度が高いほど、感情的依存と社交不安関連の依存の両方が強かった。<br><br>経路分析では、自尊心の低さと孤独感が精神症状の悪化につながり、それが依存を高めるというモデルが最もよく適合した。感情的依存には、孤独感が唯一有意な心理社会的要因だった。若者のチャットボット利用は単なる技術的行動ではなく、感情や援助要請のあり方全体と結びついている。出典：JMIR Mental Health","timestamp":1794355200000,"title":"Psychosocial Correlates of AI Chatbot Use for Emotional Support Among Young Adults: Cross-Sectional Study","titleJa":"若年成人の46.5％がAIチャットボットに感情を打ち明ける――精神症状と依存の関連を日本の調査で検証","url":"https://mental.jmir.org/2026/1/e104812"},{"authors":["Chaimae Zahri-Haidar","Jose I. Recio-Rodriguez","Natalia Sanchez-Aguadero","Hsin-Chien Lee","Luis López-Mesonero","Hsueh-Chen Lu","Irene A. Garcia-Yu"],"categories":[],"field":"Frontiers in Neuroscience","genre":"Neuroscience","monthKey":"2026-11","publishedAt":"2026-11-11T00:00:00Z","source":"Frontiers in Neuroscience","summaryHtml":"マインドフルネス介入とバイオフィードバックが成人の片頭痛にどれほど効くかを、無作為化比較試験（RCT）の系統的レビューとメタ分析で検証した研究である。PRISMAに準拠しPROSPEROに登録、PubMed・Scopus・PsycInfoから2016年5月から2026年5月のRCTを検索し、7試験・535人が基準を満たした。<br><br>頭痛頻度には群間差はなかった（6試験、平均差−0.59、p=0.34）。一方で頭痛関連の機能障害（HIT-6、平均差−2.28、p=0.04）、痛みの強さ（標準化平均差−0.39、p=0.002）、健康関連QOL（平均差+5.21、p=0.002）では介入群が有意に改善した。不安（p=0.30）や抑うつ（p=0.88）には有意差がなかった。<br><br>発作頻度の客観的な減少は示されなかったものの、痛みの主観的強さや日常生活への支障、QOLの改善には統計的に有意な効果があり、片頭痛管理における自己調整と対処の補完的手段として有用だと結論づけている。対象は7試験・535人と小規模で、比較対照の違いや評価尺度のばらつきが結果に影響した可能性が限界として挙げられている。","timestamp":1794355200000,"title":"Efficacy of mindfulness-based interventions and biofeedback for migraine management: a systematic review and meta-analysis of randomized controlled trials","titleJa":"マインドフルネスとバイオフィードバックは片頭痛に効くか――RCTの系統的レビューとメタ分析","url":"https://www.frontiersin.org/articles/10.3389/fnins.2026.1965907"},{"authors":["Gustavo Pessoa","Svetlana Tolstikova","Nurlan Kaldibayev","Zhanneta Gerzelieva","Vadim Ponkratov","Andrey Masterov","Nikolay Kuznetsov","Andrey Pozdnyaev","Elena Mikhina","Anna Shkalenko","Marina Vasiljeva","Irina Nikolaeva"],"categories":[],"field":"Frontiers in Artificial Intelligence","genre":"Ethics / Safety","monthKey":"2026-11","publishedAt":"2026-11-11T00:00:00Z","source":"Frontiers in Artificial Intelligence","summaryHtml":"AIの能力や人的資本、制度、労働市場の構造が発展の不平等とどう結びつくか、証拠は断片的だった。本研究は2020〜2024年の50か国・229の国年データを用い、AI普及能力、人的資本の変容、実現条件、労働市場圧力、発展成果を測る5つの指標を構築し、パネル推定で検証した。技術変化のもとで能力を維持・更新・再配置する動的な力として「適応的人的資本」という概念を提示する。<br><br>AI普及能力は人的資本の変容と発展成果に正の関連を示した。最も強い結果は雇用の吸収に関するもので、AI普及能力が高いほど総失業率と若年失業率が低く、就業率が高いという関連が、所得調整と多重検定の補正後も有意だった。ただし国ごとのばらつきは大きく、一貫して支配的な人的資本・制度・労働市場の要因は見いだせなかった。<br><br>AI普及と労働市場の組み合わせは国によって非対称で、12か国はAI普及が平均以上なのに失業率も中央値以上、11か国はその逆だった。技術の拡大と能力の更新、移行期の支援を国ごとに優先づけるための実証的根拠を提示する研究である。","timestamp":1794355200000,"title":"Artificial intelligence diffusion, adaptive Human-Capital Transformation, and unequal development: evidence from a 50-country panel","titleJa":"AI普及と人的資本の変容が発展の不平等に与える影響――50か国のパネル分析","url":"https://doi.org/10.3389/frai.2026.1901423"},{"authors":["Jacy Reese Anthis","Ken Burke","David Madras","Crystal Qian","Meredith Ringel Morris","Logan Cross","Caroline Pantofaru","Utsav Prabhu"],"categories":["cs.CY","cs.AI","cs.CL","cs.LG"],"field":"cs.CY","genre":"Ethics / Safety","monthKey":"2026-11","publishedAt":"2026-11-11T00:00:00Z","source":"arXiv","summaryHtml":"AIが多様な領域・文化・利害関係者に展開されるなか、安全で責任ある開発には多様な視点の継続的な反映が欠かせない。本研究は、個人に代わって審議するAIエージェント「pluralistic agents」を開発・検証し、AI政策への市民参加を拡大できるかを調べた。個人が直接参加できる議論の数を大幅に増やせる可能性があり、技術的な訓練が必要な話題や、企業・政府が共有しにくい私的情報にもとづく政策選択にも参加できる。<br><br>エージェントは担当する人物の選好の方向へ政策を確実に動かしたが、影響力は人物からの指示の出し方に左右された。746人が参加した事前登録研究では、参加者はエージェントを有用で公正と評価し、単一の推論モデルに入力する従来法より好んだ。直接参加を最も好む声が多かったものの、エージェントは直接参加との満足度の差の68%、公正さの差の82%を回復した。<br><br>直接の議論が難しい場面でも使えるため、AI安全政策の策定を広げる有望な手段だと著者らは結論づける。ただし人間の入力を置き換えるのではなく増幅するものとして、慎重に活用すべきだとしている。","timestamp":1794355200000,"title":"Scaling public input on AI policy with pluralistic agents","titleJa":"多元的エージェントでAI政策への市民参加を拡大する","url":"https://arxiv.org/abs/2611.16028"},{"authors":["Charles Xiao"],"categories":["cs.CR","cs.AI"],"field":"cs.CR","genre":"Agents / Reasoning","monthKey":"2026-11","publishedAt":"2026-11-11T00:00:00Z","source":"arXiv","summaryHtml":"AIエージェントが「行動しない」という判断そのものが攻撃面になりうる。本研究は、信頼性の低いコンテンツに偽のリスク警告を仕込み、正当なタスクの遂行を妨げる「警告による過剰棄権」という可用性攻撃を扱う。安全な棄権には、主張されるリスクだけでなく、その根拠の権威性も評価すべきだというのが中心的な前提である。<br><br>リスク内容・出典・警告の文言を変えた対照課題と、権威ある記録で警告を裏づける「Verify-Before-Abstain」手順を検証した。3モデル系統・51組の注入可能タスクで、慎重さを優先するプロンプトは攻撃を増幅し、Geminiでは誘発された過剰棄権が9.8%から86.3%へ跳ね上がった一方、通常タスクの完了率は変わらなかった。警告の文言を少し変えるだけでも結果が大きく変わり、モデルや環境による差も大きかった。<br><br>出典を意識した検証は正当な完了を改善したが、偽造や機微情報の扱いでは限界も露呈した。著者らは、エージェントの安全性を、実行した行動の安全性だけでなく、控えた判断の根拠からも評価すべきだと提言する。","timestamp":1794355200000,"title":"When Safety Becomes an Attack Surface: Manipulating Abstention in Tool-Using AI Agents","titleJa":"安全が攻撃面になるとき：ツール利用AIエージェントの棄権操作","url":"https://arxiv.org/abs/2611.14864"},{"authors":["Csaba Balogh"],"categories":["cs.LG","cs.AI","cs.NE"],"field":"cs.LG","genre":"Ethics / Safety","monthKey":"2026-11","publishedAt":"2026-11-11T00:00:00Z","source":"arXiv","summaryHtml":"ヒントンはAIに「母性本能」を与え、母が子に対するように人間と関わらせよと提案した。本研究はその前提を問い直す。ケアは与えられるものではなく、まず学ばれなければならない。ネットワーク自身を「子」とし、有限の世界で育てる仕組みを構築した。危害の語彙、将来の許容可能性の学習尺度、実行の拒否権を組み合わせ、有限の役割証明書が宣言された世界族のなかでの転移を支える。隠れ表現が変わっても、ケアの読み出しが所定の余裕で必要な判断を回復できれば更新を受け入れる。<br><br>水と発話の課題では、保護されたネットワークは270の発話エピソードすべてで有害な言葉を出さず、486エピソードで回避可能な危害をゼロにした。将来を見越したシールドの判断を再現する一方、将来の見通しを外すと回避可能な過ちが生じた。報酬や情報源の汚染のしきい値、証人の反証試験により、この構成が依存する条件も明らかにした。<br><br>学ばれたケアは、表現・監督・実行の条件が明示されれば、さらなる学習を経ても保たれることを示した。有限の世界での証明ではあるが、AIの安全性を「与える」のではなく「育てる」方向へ転換する提案である。出典：arXiv","timestamp":1794355200000,"title":"An Approach to Hinton's Mother-Child Proposal: Neural Networks Learning and Preserving Care in a Finite World","titleJa":"ヒントンの「母子」提案に学ぶ――ケアを学び、守り続けるニューラルネットワーク","url":"https://arxiv.org/abs/2611.15523"},{"authors":["Jipu Su"],"categories":["cs.AI","cs.MA"],"field":"cs.AI","genre":"Agents / Robotics","monthKey":"2026-11","publishedAt":"2026-11-11T00:00:00Z","source":"arXiv","summaryHtml":"個人向けAIエージェントは長期にわたり持続するようになった。アカウントやメール、長期記憶、終わりのないタスクを抱える。しかし改善の焦点は能力側に偏ってきた。プロンプトの工夫、大きなモデル、長い思考、検索である。本研究は、長期エージェントに欠けているのはインセンティブの層だと主張する。インセンティブをプロンプト中の文言ではなく、モデル層や計算量、記憶予算、ツール権限、検証、報酬といった動作点に対する実行時契約として形式化した。<br><br>主体-代理人モデルを構築し、隠れた努力、契約可能な動作点、コストのかかる検証を組み込んだ。真のインセンティブとプロンプト上の説得を分ける非消費不変性原理、持続的努力の前提としてのアイデンティティ連続性、タスクごとの配分規則を生むインセンティブ-能力交換率、複数チャネル検証のグッドハート限界などを導いた。実LLMによる240回の実験では、プロンプト上の動機づけに検出可能な効果はなく、実行時の資源配分が最難関タスク群の成功率を0.60から1.00へ引き上げた。<br><br>3,000タスクのシミュレーションでは資源の投資収益率が7.09から16.67へ上がり、ごまかしは0.333から0.115へ下がった。エージェントの性能は能力だけでなく、どう動機づけられ、どう検証されるかでも決まることを示す研究である。出典：arXiv","timestamp":1794355200000,"title":"Incentive-Responsive Agents: A Principal-Agent Framework, Metric Suite, and Runtime Architecture for Long-Lived Personal AI Agents","titleJa":"動機づけに応答するエージェント――長期持続する個人AIのインセンティブ設計","url":"https://arxiv.org/abs/2611.15515"},{"authors":["Yue Liu","Zhongying Ru","Shimin Di","Jipeng Zhang","Ruiyuan Zhang","Xiaofang Zhou"],"categories":["cs.CL","cs.AI"],"field":"cs.CL","genre":"LLM / NLP","monthKey":"2026-11","publishedAt":"2026-11-11T00:00:00Z","source":"arXiv","summaryHtml":"検索拡張生成（RAG）は言語モデルの幻覚を抑える有力な手段だが、引用付きの回答を生む帰属型RAGは、複数ホップの推論やマルチモーダルな理解を要する質問で劣化する。過剰な引用、暗黙の実体の見落とし、汎化の弱さが課題だった。本研究は、入力の質問を原子的な小問へ分解し、暗黙の実体を特定してから検索する枠組み「QDRAG」を提案する。リランカーが文脈の妨害要素を刈り込み、下流の過剰引用を抑える。<br><br>質問分解を導く2つのゼロショット手法を示した。一つは文脈知識にもとづく分解、もう一つは検索報酬にもとづく分解である。分解タスクでのファインチューニングが、下流のRAGタスクを直接学ぶよりも汎化に優れるという知見も得た。4つのマルチモーダルQAベンチマークでの実験では、ドメイン内・ドメイン外の双方で全ベースラインを上回り、Gemini-Proをも超えた。<br><br>引用の忠実さは、答えの正しさと同じくらい重要だ。質問を分解し、根拠を段階ごとに結びつけることで、検証可能な回答へ近づけることを示した研究である。出典：arXiv","timestamp":1794355200000,"title":"Faithful in Steps: Improving Generalization and Citation in RAG via Query Decomposition","titleJa":"段階を踏んで忠実に――質問分解でRAGの引用と汎化を高める","url":"https://arxiv.org/abs/2611.15538"},{"authors":["Nils Leutenegger"],"categories":["q-bio.NC","cs.LG"],"field":"q-bio.NC","genre":"Neuroscience","monthKey":"2026-11","publishedAt":"2026-11-11T00:00:00Z","source":"arXiv","summaryHtml":"未学習の畳み込みネットワークが視覚野のモデルとして学習済みネットワークに匹敵する、という報告がある。著者らもTHINGS fMRIデータでV1における未学習ネットワークの優位を報告していた。本研究はその結論を検証する。事前に定めたリッジ回帰の読み出しでは、未学習ネットワークは全てのプーリング格子で学習済みを下回り、評価解像度への依存も再現しなかった。<br><br>単位正規化・距離尺度・ボクセル正規化の36通りの組み合わせでは、V1の優劣の符号は解析方法によって変わった。生の相関距離による表現類似性解析は、単位平均プロファイルとの整合と強く共変し、その成分を除くと優位は消えた。中心化したパターンの角度成分では、学習済みネットワークがV1とLOCの双方で上回った。<br><br>「未学習が勝つ」という結論は解析の選び方に依存していた。刺激に対する中心化への感度や成分の分離、複数の解析と単純なベースラインの報告を推奨する。脳とモデルの比較では、評価方法そのものが結論を左右することをあらためて示した研究である。出典：arXiv","timestamp":1794355200000,"title":"Analysis choices decide whether untrained networks beat trained ones at V1: a multiverse analysis of model-brain RSA","titleJa":"未学習ネットワークは本当に視覚野V1で学習済みに勝つのか――36通りの解析による検証","url":"https://arxiv.org/abs/2611.15533"},{"authors":["Xin Liu","Xu Han","Yuxin Wang","Haoran Song","Mingjian Zhao","Lei Wang"],"categories":["cs.SE","cs.AI"],"field":"cs.SE","genre":"LLM / NLP","monthKey":"2026-11","publishedAt":"2026-11-11T00:00:00Z","source":"arXiv","summaryHtml":"LLMアプリケーションは、会話を異なるAPIへ移すために翻訳層や互換レイヤーに頼ることが増えた。しかし翻訳された要求が対象APIに受け入れられても、指示の役割やツール操作、エラー状態、生成制御の情報が黙って失われることがある。本研究は、会話情報の保持を検査する決定論的オラクル「isloss」を提案する。翻訳前後の要求と応答を共通の中間表現に写像し、正当な表現の変化と情報損失を明示的な規則で区別する。<br><br>参照翻訳も追加のモデル呼び出しも要らない。仕様にもとづく欠陥注入と人手レビュー、翻訳器やゲートウェイでの実験で評価したところ、仕込んだ欠陥125件中95件を検出し、誤報は100件中2件だった。6構成の合成要求では、静的な検査を通過した翻訳の18.5%が、プロンプトや役割、ツール情報を黙って変えていた。<br><br>応答のストリームでは36.4%が例外や黙った破損を起こし、翻訳による変化がモデルの振る舞いを変えることも確認された。会話の保持は、信頼できるLLM相互運用の独立した正しさの要件であることを示す研究である。出典：arXiv","timestamp":1794355200000,"title":"Testing Conversation Preservation Across LLM APIs: A Rule-Based Oracle for Detecting Silent Information Loss","titleJa":"会話は黙って失われている――LLM API間の翻訳で消える情報を検出する","url":"https://arxiv.org/abs/2611.15543"},{"authors":["Kristian Moltke Martiny","Simon Høffding"],"categories":[],"field":"Phenomenology and the Cognitive Sciences","genre":"Consciousness / Philosophy","monthKey":"2026-11","publishedAt":"2026-11-11T00:00:00Z","source":"Crossref","summaryHtml":"現象学はブレンターノ、フッサール、ハイデガー、メルロ＝ポンティらに始まる哲学の伝統だが、精神医学や認知科学、質的研究へと波及してきた。本論文は、コペンハーゲンの主観性研究センター(CFS)を起点とする新しい波に注目する。著者らが2016年に提示した「現象学的インタビュー」の枠組みに始まり、現象学的混合法や認識論的擁護へと展開した流れである。<br><br>従来の議論は、エポケーや還元といった「正しい」用法の遵守をめぐるものが多かった。著者らは評価の基準を正統性から「有用性」へ移すことを提案する。身体性や志向性といった現象学的な概念を質的知見の解明に使うことが、新たな洞察やより良い治療的介入をもたらすかどうかが問われるべきだという。<br><br>さらに未開拓の可能性として、学術の外への応用を挙げる。現象学を医療や芸術実践、市民参加の場で使うことで、知識共有をより民主的なものにできるという。著者らは長年にわたり博士課程の講座やワークショップでこの方法を育ててきた。評価基準の複数化は、現象学を狭い方法論の囲いから解き放ち、生活世界の理解を広げる試みである。出典：Crossref","timestamp":1794355200000,"title":"Phenomenology in qualitative research: expanding its use and pluralizing its evaluative criteria","titleJa":"質的研究における現象学――評価基準の複数化と学術の外への展開","url":"https://doi.org/10.1007/s11097-026-10229-0"},{"authors":["Zijian Zhang","Rizhen Hu","Jiangweizhi Peng","Shiyang Li","Sujay Bhatt","Sihan Zeng","Mingyi Hong"],"categories":["cs.LG","cs.CL"],"field":"cs.LG","genre":"Agents / Reasoning","monthKey":"2026-11","publishedAt":"2026-11-10T18:58:46Z","source":"arXiv","summaryHtml":"検証可能な報酬による強化学習（RLVR）は豊かな学習経験を生むが、結果の報酬は各試行を一つの数値に圧縮してしまい、経験の多くが活かされない。学習時にプロンプトへ戦略やヒントを加える「足場かけ（スキャフォルディング）」は経験を指導に変える手立てだが、その設計と適応は人手に委ねられ、領域ごとに作り直されてきた。本研究は、学習者の訓練経験を適応的な足場かけに変える、AIがAIを導く統一フレームワーク「AutoScaffold」を提案する。<br><br>凍結した教師モデルが定期的に学習経験を点検し、ボトルネックを診断して、タスク群に共通する戦略と、難しい個別タスクへのヒントという二つの形で足場を設計する。学習者の成長に合わせて支援の内容と量を調整し、評価時には足場を外す。ALFWorld、検索型QA、数学的推論、GPUカーネル生成の4領域で検証したところ、足場なしで評価しても、AutoScaffoldで訓練した学習者は対応する強化学習ベースラインを全領域で上回った。ALFWorldの成功率で7.2ポイント、QAの完全一致で平均4.0ポイントの向上。GPUカーネル生成では、PyTorch参照より速く正しいカーネルを生成できるタスクの割合が最大5.0ポイント増えた。数学では、学生の訓練ステップを約3分の1に抑えながら先行手法QuestAの報告精度を上回った。<br><br>分析では、教師がタスク群ごとに異なる失敗を特定し、学習者の上達に合わせて足場を段階的な手順から的を絞った修正へと移行させていたこと、改訂した足場のほうが従来の足場の維持や足場なしよりも学習を助けたことが示された。足場かけの設計を自動化することで、強化学習の経験をより余さず活用できることを示す研究である。","timestamp":1794337126000,"title":"AutoScaffold: AI-Guided Scaffolding for Reinforcement Learning of Language Models","titleJa":"AIによる足場かけで言語モデルの強化学習を導く――AutoScaffold","url":"https://arxiv.org/abs/2611.14515"},{"authors":["Ziang Liu","James J. Kim","Yijia Dai","Jennifer J. Sun"],"categories":["cs.AI"],"field":"cs.AI","genre":"Agents / Reasoning","monthKey":"2026-11","publishedAt":"2026-11-10T18:58:43Z","source":"arXiv","summaryHtml":"LLMエージェントは科学的発見に使われ始めているが、仮説を一点ずつ評価するのが普通で、ある主張をその否定とだけ比べる。証拠がある主張を棄却しても、どの代替説明が正しいかは分からない。本研究は、単一の仮説の代わりに「対比セット」――一つの問いと、互いに排他的で全体を尽くす競合する説明の組――を導入する「Contrastive Discovery」を提案する。各実験は、証拠が説明の集合のあいだで信念をどう再配分するかで採点され、信念が一つの説明に集中したときに問いが解決する。<br><br>対比セットはエージェントが提案・採点する単位を変えるだけなので、既存のエージェントにも組み込みやすく、すでに集めた証拠の再評価や探索の誘導に使える。6領域での実験では、信念の変化が最大だった一点評価の候補の89%は棄却だったが、同じ証拠でも対比セットを使うとその73%を特定の代替説明へと解決できた。探索を対比セットで誘導すると、同じ実験回数で一点評価の驚きに基づく方法より67%多くの問いを解決した。<br><br>盲検化された研究では、38人の人間専門家が、解決された問いの78%、一点評価エージェントが仮説を棄却して止まった問いの82%で、エージェントと同じ説明を選んだ。競合する説明を明示することが、発見エージェントが同じ証拠と検証予算からより多くの科学的問いに答える助けになることを示す結果である。","timestamp":1794337123000,"title":"Contrastive Disc
