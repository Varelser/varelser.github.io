    const DATA = {"version": 1, "updatedAt": "2026-11-06T03:34:14Z", "articles": [{"source": "arXiv cs.CY", "title": "Technohybridism: Recursive Semantic Normalization in AI-Mediated Societies", "titleJa": "テクノハイブリディズム――AIが媒介する社会における再帰的な意味の正規化", "summaryHtml": "言語生成AIはもはや言語的やり取りの対象にとどまらない。その出力は、訓練データの源となったコミュニケーションや制度的実践のなかへ再び入り込み、定着していく。本論文は社会理論、社会認識論、言語哲学を手がかりに、この再流入の社会技術的な説明を展開する。<br><br>著者らは「再帰的意味の正規化」という概念を導入する。機械生成の表現が繰り返し取り上げられ、評価され、再利用され、制度的に保持されることで、意味の規則性の再生産と変容に関与していく過程である。「テクノハイブリディズム」のもとで分析の単位となるのは、人間の実践、計算機による生成、制度的な取り込みが再帰的に結びついたハイブリッドな意味システムだという。<br><br>論文は生成・選択・取り込み・持続を区別する分析モデルを示し、機械に帰属できる変化と、そうでなくとも起きた変化とを切り分ける。さらに、取り込みが制度的に拡散し社会的に層化する実践であることを分析し、機械由来の規則性が規範になるときの条件を述べる。社会的・認識論的な帰結として、出所の洗浄による認識的警戒の弱まり、集合的探究を支える認知的多様性の浸食、共有された解釈資源の狭まりを指摘する。機械の出力に規範的な権威を認めるものではなく、変化するのは人間と制度の取り込みが働く場そのものだという。", "url": "https://arxiv.org/abs/2611.07984", "publishedAt": "2026-11-05T13:14:00Z", "authors": ["Charalampos M. Liapis", "Epameinondas Panagopoulos"], "categories": ["cs.CY", "cs.AI", "cs.HC"], "field": "cs.CY", "genre": "Consciousness / Philosophy", "timestamp": 1793884440000, "monthKey": "2026-11"}, {"source": "arXiv cs.AI", "title": "A Behavioural Framework for Predicting and Understanding Loss of Control in Frontier Artificial Intelligence Systems", "titleJa": "フロンティアAIの制御喪失リスクを予測する行動学的枠組み", "summaryHtml": "フロンティアAIシステムは人間の監督が薄れるなかでますます長期間にわたって動作するようになり、制御の喪失――人間の実効的な制御を超えて、取り返しのつかない結果を招くふるまい――のリスクが高まっている。こうした失敗は封じ込めが難しくなってから初めて顕在化するおそれがあるため、事後ではなく事前に評価する必要がある。<br><br>本論文は制御喪失リスクを「動機のミスアライメント」「危害を可能にする能力」「監視の回避」という三つの要因に分解する行動学的枠組みを提案する。これらを13の測定可能な側面と29の評価タスクとして操作化し、統合して制御喪失（LoC）スコアを算出する。13のフロンティアモデルで検証したところ、LoCスコアは封じ込められた長期リスクシナリオでの失敗率と強く相関し（ピアソン r = 0.84）、将来の失敗を予測する妥当性が示された。リスクはモデルごとに系統的に異なり、能力の高さだけでは説明できなかった。<br><br>さらに、診断された脆弱性に狙いを定めたファインチューニングや監視によって失敗率を下げられることも示され、汎用性能をほぼ維持したまま緩和できるという。制御喪失が現実化する前に予測・理解・緩和するための実践的な基盤となる研究である。", "url": "https://arxiv.org/abs/2611.07953", "publishedAt": "2026-11-05T12:49:20Z", "authors": ["Yao Huang", "Yichi Zhang", "Yifan Wang", "Yitong Sun", "Haoyu Dong", "Jifan Ma", "Jinzhe Tu", "Xiaojian Li", "Sören Mindermann", "Wei Xu", "Yinpeng Dong"], "categories": ["cs.AI", "cs.CL", "cs.LG"], "field": "cs.AI", "genre": "Ethics / Safety", "timestamp": 1793882960000, "monthKey": "2026-11"}, {"source": "Crossref", "title": "Rethinking the Concept of Consciousness", "titleJa": "意識という概念の再考――エーテルやフロギストンのように消えゆくのか", "summaryHtml": "意識の研究は神経科学、哲学、心理学、物理学、計算機科学にまたがっているが、その多くは意識の本質そのものではなく、意識がもたらす効果を示すことに向けられている。意識は思考過程を覆う包括的な概念として使われながら、その本質は依然として明らかになっておらず、将来的により精密に定義されることが期待されている。なかには意識がニューロンや細胞骨格のなかに宿ると考える理論もある。<br><br>著者は科学史を振り返り、かつて広く受け入れられながら後に存在しないことが判明した概念があることを指摘する。論文の主張は、意識はエーテルやフロギストンと似ているというものだ。これらはかつて科学的真理とみなされたが、最終的には棄却された。意識が根本的な実在なのか、それとも錯覚なのかをめぐる論争は続いているが、著者は意識はたんなる用語にすぎず、実在でも錯覚でもないと断じる。<br><br>脳機能の分子レベルの理解が深まるにつれて、意識という概念もエーテルやフロギストンと同じように、やがて科学の言説から姿を消すだろうというのが本論文の結論である。意識をめぐる問いを概念そのものの問い直しへと転換させる、挑発的な一論である。", "url": "https://doi.org/10.1111/meta.70054", "publishedAt": "2026-11-05T01:01:01Z", "authors": ["Emrah Yücesan"], "categories": ["philosophy of mind", "consciousness"], "field": "Metaphilosophy", "genre": "Consciousness / Philosophy", "timestamp": 1793840461000, "monthKey": "2026-11"}, {"source": "Crossref", "title": "Leveraging AI: Research ethics in action by design", "titleJa": "AIを活用する研究の倫理を設計段階から組み込む", "summaryHtml": "人工知能は発見の加速や効率化、複雑なデータの新たな活用を通じて科学研究を大きく変えつつある。その一方で、説明責任や説明可能性、プライバシー、データの完全性、バイアスといった倫理的課題も生んでいる。科学的妥当性や参加者の保護、公共の信頼が直接かかっているからこそ、研究におけるこれらの懸念は重要だ。<br><br>本論文は、倫理を後付けのコンプライアンス作業として扱うのではなく、AIを活用した研究のごく初期段階から倫理的な省察と意思決定を組み込む「倫理バイ・デザイン」のアプローチを提唱する。責任あるAIに関する国際的な指針に沿い、人々、プロセス、ガバナンス、コミュニティという互いに補強し合う四つの次元からなる実践的な枠組みを示す。AIシステムは動的で文脈に依存するため、適応的な監督や部門横断的な説明責任、関係者の実質的な関与が求められる。<br><br>倫理を設計、導入、評価の各段階に統合することで、研究機関は革新と責任のバランスを取りやすくなり、信頼でき、社会的に正当な科学の進歩を支えることができると著者は結論づけている。", "url": "https://doi.org/10.56012/cgqc1793", "publishedAt": "2026-11-05T01:01:01Z", "authors": ["Uma Swaminathan"], "categories": ["research ethics", "AI governance"], "field": "Medical Writing", "genre": "Ethics / Safety", "timestamp": 1793840461000, "monthKey": "2026-11"}, {"source": "OSF Preprints", "title": "Changing moral beliefs and behaviors using human-AI dialogues", "titleJa": "人間とAIの対話で道徳的信念と行動は変わるか", "summaryHtml": "道徳的信念は変わりにくいと考えられてきたが、対話型AIの登場は道徳的説得の新たな手段をもたらした。本研究では事前登録された実験で500人の参加者を無作為に割り付け、肉食または慈善への寄付をしないことが道徳的に誤っていると説得するよう促されたAIエージェントと5ラウンドの対話を行わせた。<br><br>対話の結果、道徳的信念は意図した方向へ大きく即時的に変化し、効果量はコーエンのdで0.37〜0.48だった。行動面の変化もみられ、慈善について対話した参加者はボーナスのうち慈善へ寄付する割合が16.35%高く、肉食について対話した参加者は牛肉バーガーではなく植物性バーガーのバウチャーを選ぶ割合が25.04ポイント高かった。1か月後もバーガー選択への効果は残ったが、他の効果は持続しなかった。<br><br>参加者の道徳的正当化とAIの説得方略の自然言語分析からは、直接的な道徳的議論と並んで、事実の訂正が説得を部分的に後押ししていたことが示唆された。とくに肉食の領域では、肉食の自然さや生物学的必要性への訴えが参加者側に最も多かった。対話型AIが人間の価値観を大規模に形作る可能性について、重要な問いを投げかける結果である。", "url": "https://osf.io/preprints/psyarxiv/6qf9p_v3/", "publishedAt": "2026-11-05T00:00:00Z", "authors": [], "categories": ["moral psychology", "human-AI interaction"], "field": "PsyArXiv", "genre": "Ethics / Safety", "timestamp": 1793836800000, "monthKey": "2026-11"}, {"source": "arXiv cs.CV", "title": "From Pixels to Actions - Towards Native Vision-Language-Action Policies", "titleJa": "From Pixels to Actions - Towards Native Vision-Language-Action Policies", "summaryHtml": "本論文は、From Pixels to Actions - Towards Native Vision-Language-Action Policies を扱います。<br><br>Vision-language-action models are typically built on a simple premise: perception is first compressed by visual encoders, and action reasoning begins only afterwards. Yet manipulation often hinges on precisely the visual signals most vulnerable to this abstraction, e.g., local geometry, boundaries, depth, and subtle state changes. This raises a fundamental question: should action policies inherit a fixed visual endpoint, or directly access evolving visual computation? We introduce NEO-VLA, a structurally encoder-free vision-language-action framework. Images are tokenized by lightweight patch convolutional layers and evolve jointly with language throughout the backbone, allowing a flow-matching action expert to draw from instruction-conditioned visual representations at different depths. This simple change reveals a consistent pattern. Native architectures outperform encoder-based counter<br><br>利用時は原文抄録と本文を確認し、研究目的・方法・限界を一次情報で確認してください。", "url": "http://arxiv.org/abs/2611.06918v1", "publishedAt": "2026-11-04T18:59:58Z", "timestamp": 1793818798000, "monthKey": "2026-11", "field": "cs.CV", "genre": "Vision / Multimodal", "authors": ["Weichen Fan", "Haiwen Diao", "Penghao Wu", "Siyuan Hu", "Ziqi Huang", "Tianqi Liu", "Mingze Sun", "Ziyi Wang", "Zhongang Cai", "Hanming Deng", "Quan Wang", "Lei Yang", "Lewei Lu", "Fangzhou Hong", "Zhaoxi Chen", "Dahua Lin", "Ziwei Liu"], "categories": ["cs.CV"]}, {"source": "arXiv cs.MA", "title": "A Framework for Context Enrichment and Selective Robustness in LLM Social Agents", "titleJa": "A Framework for Context Enrichment and Selective Robustness in LLM Social Agents", "summaryHtml": "本論文は、A Framework for Context Enrichment and Selective Robustness in LLM Social Agents を扱います。<br><br>Researchers use large language models as agents in social simulations, where agents are prompted with observations and background information intended to shape their actions. Yet LLM agents have been shown to substantially change their behavior under meaning-preserving prompt variations, creating a validation problem for social simulation. One plausible hypothesis is that this brittleness reflects a lack of grounding and can be reduced by enriching the context provided to the agents. Whether richer context improves robustness remains unclear, in part because context richness and robustness are rarely defined in ways that support controlled comparisons. We address the first need with controlled context enrichment, a set of prompt substitution rules that systematically enriches distinct types of context: neutral padding, generic social background, descriptive decision grounding, and normat<br><br>利用時は原文抄録と本文を確認し、研究目的・方法・限界を一次情報で確認してください。", "url": "http://arxiv.org/abs/2611.06914v1", "publishedAt": "2026-11-04T18:58:23Z", "timestamp": 1793818703000, "monthKey": "2026-11", "field": "cs.MA", "genre": "LLM / NLP", "authors": ["Mattia Greiche", "Reihaneh Rabbany", "Maximilian Puelma Touzel"], "categories": ["cs.MA", "cs.CL", "cs.LG"]}, {"source": "arXiv cs.RO", "title": "cuRoboV2-Fast: Fast Torque-Limited Collision-Free Motion Planning", "titleJa": "cuRoboV2-Fast: Fast Torque-Limited Collision-Free Motion Planning", "summaryHtml": "本論文は、cuRoboV2-Fast: Fast Torque-Limited Collision-Free Motion Planning を扱います。<br><br>We present cuRoboV2-Fast, a GPU-accelerated planner that reduces both planning latency and execution time for collision-free, payload-aware, torque-limited motions. B-spline trajectory optimization reduces the required iterations, while accelerated robot computations and differentiable inverse dynamics reduce refinement cost and accommodate changing payloads. TimeOpt optimizes traversal speed along the fixed path under sampled velocity, acceleration, jerk, and torque constraints, exploiting local spline support to solve banded Newton systems efficiently on the GPU. With a 3,kg payload, cuRoboV2-Fast achieves 4.4 ms mean planning time on RTX 5090, 14.7x faster than cuRoboV2. Our method on Jetson AGX Orin plans faster than cuRoboV1 + TOPPRA on RTX 5090. A stereo-camera-based deployment on YAM achieves 5.93 s mean completed pick-and-drop cycles, 34.6% shorter than cuRoboV2. Code (Apache 2.0<br><br>利用時は原文抄録と本文を確認し、研究目的・方法・限界を一次情報で確認してください。", "url": "http://arxiv.org/abs/2611.06913v1", "publishedAt": "2026-11-04T18:58:20Z", "timestamp": 1793818700000, "monthKey": "2026-11", "field": "cs.RO", "genre": "Agents / Reasoning", "authors": ["Balakumar Sundaralingam", "Adithyavairavan Murali", "Stan Birchfield"], "categories": ["cs.RO"]}, {"source": "arXiv physics.flu-dyn", "title": "FlowReconBench: Accuracy, calibration and cost of learned and classical flow reconstruction from spar neralizable abstractions across conceptually related reasoning tasks. The Abstraction and Reasoning Corpus (ARC) provides a controlled testbed for studying abstraction, requiring solvers to infer transformation rules over two-dimensional grids from a small set of examples. While ARC evaluates rule abstraction within individual tasks, different tasks may share higher-level structure despite requiring different transformations$\\unicode{x2014}$for example, several tasks may involve reasoning about objects contained within other objects. Benchmarks such as ConceptARC capture this structure by grouping ARC-style tasks into recurring spatial and semantic concepts, but they often contain only a few manually constructed tasks per concept. We introduce ConceptARC at Scale, a generator <br><br>利用時は原文抄録と本文を確認し、研究目的・方法・限界を一次情報で確認してください。", "url": "http://arxiv.org/abs/2611.06732v1", "publishedAt": "2026-11-04T16:17:36Z", "timestamp": 1793809056000, "monthKey": "2026-11", "field": "cs.AI", "genre": "Agents / Reasoning", "authors": ["Philipp Mondorf", "Adrien Deliège", "Solim LeGris", "Claas Beger", "Ryan Yi", "Barbara Plank", "Brenden M. Lake", "Todd M. Gureckis"], "categories": ["cs.AI", "cs.LG"]}, {"source": "arXiv cs.LG", "title": "Template Gap Reconstruction for Shell Output Simulation with Small Language Models", "titleJa": "Template Gap Reconstruction for Shell Output Simulation with Small Language Models", "summaryHtml": "本論文は、Template Gap Reconstruction for Shell Output Simulation with Small Language Models を扱います。<br><br>Small language models offer a compact basis for shell simulation without executing submitted commands, but full-output decoding requires them to predict recurring utility structure alongside content that varies across executions. We introduce template gap reconstruction (TGR), which supplies reusable output literals interspersed with sentinels to be interleaved with autoregressively generated gaps. A template selector chooses which template to be reconstructed, with the empty template retaining full-output decoding. We construct a template bank from 18.7 million outputs collected across heterogeneous execution environments and train a template selector and five reconstruction models initialized from various small language model checkpoints on a target environment excluded from bank construction. Evaluation demonstrates that TGR improves output edit similarity (O-ES) over full-output deco<br><br>利用時は原文抄録と本文を確認し、研究目的・方法・限界を一次情報で確認してください。", "url": "http://arxiv.org/abs/2611.06731v1", "publishedAt": "2026-11-04T16:17:28Z", "timestamp": 1793809048000, "monthKey": "2026-11", "field": "cs.LG", "genre": "LLM / NLP", "authors": ["Jarrod Ragsdale", "Rajendra Boppana"], "categories": ["cs.LG", "cs.CL"]}, {"source": "arXiv cs.CV", "title": "Turns Matter: Advancing Streaming Video RL via Turn-Level Credit", "titleJa": "Turns Matter: Advancing Streaming Video RL via Turn-Level Credit", "summaryHtml": "本論文は、Turns Matter: Advancing Streaming Video RL via Turn-Level Credit を扱います。<br><br>Streaming video understanding requires models to repeatedly decide whether to respond or continue observing. Recently, Group Relative Policy Optimization (GRPO) has been applied to this setting, with existing approaches emphasizing reward design while retaining a single trajectory-level advantage across turns. Such shared credit can reinforce redundant replies after earlier successes and discourage useful follow-ups after earlier failures. We propose TurnWise, a turn-level GRPO framework that aligns learning with individual streaming decisions. TurnWise addresses the mismatch between trajectory-level feedback and turn-level interaction, promoting informative responses and reducing redundancy. Specifically, turn-level credit assignment uses silence-completed prefix scoring to construct group-relative advantages from each decision&#x27;s remaining return, separating its learning signal from ear<br><br>利用時は原文抄録と本文を確認し、研究目的・方法・限界を一次情報で確認してください。", "url": stic to the underlying governing equations, often violating fundamental physical constraints during inference. Existing zero-shot approaches designed to enforce these constraints typically rely on rigid algebraic projections. While effective for sparse boundary conditions, applying such discrete geometric corrections to dense, full-domain PDEs may disrupt the probability path, \\rev{potentially deviating from the learned manifold and introducing substantial computational overhead}. To address these challenges, we introduce Energy-Guided Transport, a novel training-free framework that formulates non-linear physical constraints as a smooth potential energy landscape. Rather than int<br><br>利用時は原文抄録と本文を確認し、研究目的・方法・限界を一次情報で確認してください。", "url": "http://arxiv.org/abs/2611.06711v1", "publishedAt": "2026-11-04T16:09:05Z", "timestamp": 1793808545000, "monthKey": "2026-11", "field": "cs.LG", "genre": "Agents / Reasoning", "authors": ["Giuliano Galadini", "Aurelio Uncini", "Danilo Comminiello"], "categories": ["cs.LG", "physics.comp-ph"]}, {"source": "arXiv cs.RO", "title": "Where Is VLA Inference Time Spent? Bottlenecks and Optimization Interactions Across GPUs", "titleJa": "Where Is VLA Inference Time Spent? Bottlenecks and Optimization Interactions Across GPUs", "summaryHtml": "本論文は、Where Is VLA Inference Time Spent? Bottlenecks and Optimization Interactions Across GPUs を扱います。<br><br>Vision-language-action (VLA) models map camera observations and language instructions to robot actions. However, their large backbones and repeated action generation can make inference take longer than the robot&#x27;s real-time requirements for its next action. To reduce the load of VLA computations, researchers have proposed multiple optimization approaches, including quantization and pruning. These optimizations can be combined with other general optimizations such as better kernel compilation or using CUDA graphs instead of the eager mode. However, most of these optimization results are usually reported on a single GPU type, typically for a few VLA models, with no analysis of what the real bottlenecks are for a model on a particular hardware or how these optimizations would generalize beyond the reported results. In this paper, we provide a comprehensive measurement study of seven familie<br><br>利用時は原文抄録と本文を確認し、研究目的・方法・限界を一次情報で確認してください。", "url": "http://arxiv.org/abs/2611.06710v1", "publishedAt": "2026-11-04T16:09:02Z", "timestamp": 1793808542000, "monthKey": "2026-11", "field": "cs.RO", "genre": "Vision / Multimodal", "authors": ["Muhammad Danish Waseem", "Ahmed Ali-Eldin Hassan"], "categories": ["cs.RO"]}]};
