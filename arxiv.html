。","timestamp":1794268800000,"title":"Saudi Digital Media Ethics and the Effectiveness of National Strategic Communication: An Analytical Study of Digital Content Related to Saudi Vision 2030","titleJa":"サウジのデジタルメディア倫理と国家戦略コミュニケーションの実効性――ビジョン2030関連コンテンツの分析","url":"https://doi.org/10.32996/ijahs.2026.6.5.4"},{"authors":["RunDong Wang","JiuXia Guo","ChangQi Yang"],"categories":[],"field":"World Journal of Educational Studies","genre":"Ethics / Safety","monthKey":"2026-11","publishedAt":"2026-11-10T00:00:00Z","source":"Crossref","summaryHtml":"安全が命綱となる職業の航空法教育では、法規の暗記だけでなく、法的義務や公共の安全、職業的責任について推論する力が求められる。中国ではカリキュラムに組み込まれた思想政治教育が、こうした価値に関わる目標を専門科目のなかで扱うことを促しているが、目標・授業課題・評価の整合を具体的に示した報告は少ない。本研究は、中国民用航空飛行学院で航空交通管理の学生を対象とした学部科目「航空法」について、実践志向のカリキュラム設計を提示するものである。<br><br>著者らは科目目標・シラバス・教材の文書分析により、目標を3つの成果領域に分解し、8章を6モジュールにまとめて12の教授事例とその価値テーマに対応づけた。さらに、マレーシア航空MH370便の消息不明と2010年の伊春事故を題材に、捜索救助と事故調査をめぐる4段階の授業を再構成した。法的知識・規制推論・倫理的判断を、目標とモジュール・事例の対応表、4段階の授業系列、4つの実施方針、規制に基づく専門的判断を測る5次元のルーブリックで結びつける設計である。<br><br>学習者の成果データは収集しておらず、効果は主張されていない。独立に評定された事例への回答を用いた評価が今後の課題として提案されている。安全が関わる専門職の養成プログラムにも転用できる枠組みとして、職業倫理と安全責任を専門教育に組み込むためのテンプレートを示す研究である。","timestamp":1794268800000,"title":"EMBEDDING PROFESSIONAL ETHICS AND SAFETY RESPONSIBILITY IN AVIATION LAW EDUCATION: A CASE-BASED CURRICULUM DESIGN IN CHINESE HIGHER EDUCATION","titleJa":"航空法教育に職業倫理と安全責任を組み込む――事例に基づくカリキュラム設計","url":"https://doi.org/10.61784/wjes3221"},{"authors":["Hugh Willmott"],"categories":[],"field":"Management Learning","genre":"Philosophy","monthKey":"2026-11","publishedAt":"2026-11-10T00:00:00Z","source":"Crossref","summaryHtml":"経営学・組織研究では「抵抗」と呼ばれる行為を扱う文献が数多くある一方、倫理を正面から論じる文献も豊富にある。しかし抵抗が理論化される際、倫理への明示的な言及は例外的だという。本論文はこの断絶を埋めるため、レヴィナスの思想――「他者への責任」を根底に置く倫理学――に依拠し、抵抗における倫理の力学を理論化する。<br><br>レヴィナスの射程を示す具体例として、ダニエル・エルズバーグによるペンタゴン・ペーパーズの公表と、ソフォクレスの『アンティゴネー』におけるクレオンへのアンティゴネーの反抗が取り上げられる。これらを通じて、抵抗における倫理は「偶然性・コミットメント・普遍性」という三つの契機からなると論じられる。さらに、それぞれの契機を阻むものとして「独断主義・動機の欠如・利己主義」という三つの障害が示される。<br><br>抵抗を単なる権力への反発ではなく、他者への責任に根ざした倫理的行為として捉え直す試みであり、組織研究におけるレヴィナス研究の蓄積に連なる論文である。抵抗の現場で倫理がどう働くかを考える枠組みとして、経営学と哲学の接点に新たな視点を与える。","timestamp":1794268800000,"title":"Ethics in resistance? From Totality to Infinity","titleJa":"抵抗の倫理とは何か――レヴィナス『全体性と無限』から読み解く","url":"https://doi.org/10.1177/13505076261500093"},{"authors":["Diana Maddah","Rana Elmanufi","Ajisha Nayeem","Leen Baddoura","Yasmine Attia","Junaid Qadir","Kwalombota Kwalombota","Alaa Ali Abd-Alrazaq"],"categories":[],"field":"AI","genre":"Ethics / Safety","monthKey":"2026-11","publishedAt":"2026-11-10T00:00:00Z","source":"Crossref","summaryHtml":"人道支援の現場でAIの利用が広がる一方、バイアスや透明性、プライバシー、説明責任をめぐる倫理的な懸念が高まっている。倫理原則やガバナンスの仕組み、運用ツールはそれぞれ議論されてきたが、それらがどう関係し、実施に関する証拠がどれだけあるのかは明らかになっていなかった。<br><br>著者らはArkseyとO'Malleyの枠組みに沿い、PRISMA-ScRに準拠したスコーピングレビューを実施し、Open Science Frameworkに事後登録した。2015〜2025年の文献を6つの書誌データベースとGoogle Scholar、グレー文献から検索し、2名のレビュアーが独立して選別・抽出を行った結果、32件の文書（査読付き論文15件、グレー文献17件）が対象となった。公平性・非差別・包摂のテーマは全文書に、透明性・説明可能性・説明責任のテーマは93.8%にみられ、グレー文献のほうが扱うテーマ数が多かった（8テーマ中平均6.4対5.0）。<br><br>文書の71.9%は倫理を手続き的な水準で扱うにとどまり、運用・実施の水準で扱ったものは21.9%、実施の証拠を報告したものは31.3%だった。中東・北アフリカに言及した文書は12.5%にすぎない。著者らは、これらの知見は文書が何を報告しているかを示すものであって、組織が実際に何をしているかを示すものではないと注意を促す。原則と実践のあいだの隔たりを埋めることが、人道支援におけるAI倫理の次の課題である。","timestamp":1794268800000,"title":"A Scoping Review of the Ethics of AI in Humanitarian Contexts: Principles, Governance, and the Path to Practice","titleJa":"人道支援におけるAI倫理のスコーピングレビュー――原則・ガバナンス・実践への道筋","url":"https://doi.org/10.3390/ai7110469"},{"authors":["Qiaoyue Ren","Andreea M. Gui-Bordeianu","Olaf Blanke"],"categories":[],"field":"Philosophical Transactions of the Royal Society B: Biological Sciences","genre":"Consciousness / Neuroscience","monthKey":"2026-11","publishedAt":"2026-11-10T00:00:00Z","source":"Crossref","summaryHtml":"エピソード記憶は、自分が体験した出来事を、そのときの視覚や聴覚、感情といった文脈とともに意識的に思い出す能力である。ところが記憶研究では、符号化や保持、想起の場面で豊かな文脈を与える身体からの信号の役割は、これまでほとんど注目されてこなかった。本論文は、身体のあり方が自己意識に与える「身体的自己意識」という概念を紹介し、それがエピソード記憶にどう影響するかを、近年の実験パラダイムと行動・神経科学の証拠から整理する。<br><br>身体的自己意識の操作は、後の記憶成績だけでなく、過去の出来事を主観的に再体験する感覚（自伝的意識）にも影響を及ぼすことが示されている。こうした効果は、後頭頂皮質（とりわけ側頭頭頂接合部と楔前部）、運動野（運動前野と補足運動野）、前頭前野が、海馬複合体と結びついて働く脳メカニズムに支えられているという。身体経験と記憶の再体験が神経レベルで結びついていることが示された。<br><br>本論文は、符号化や想起の最中の主観的な身体経験が、過去の出来事の主観的な再体験と結びつくことを示し、自己と記憶の関係をめぐる今後の研究課題を提示する。記憶を脳だけの働きではなく身体を含めたものとして捉え直す視点を与え、意識と記憶の接点を考えるうえでの示唆に富む総説である。","timestamp":1794268800000,"title":"Body in memory: the role of bodily self-consciousness in episodic memory and autonoetic consciousness","titleJa":"身体の自己意識がエピソード記憶を形づくる――身体が支える過去の再体験","url":"https://doi.org/10.1098/rstb.2025.0167"},{"authors":["Rani Haerani","Merry Lapasau","Filarius Bedi Lado","Kenhayati Dwi Rahmini","Lia Lestari","Kamilia Nur Umamah"],"categories":[],"field":"Indonesian Journal of Innovation Studies","genre":"Consciousness / Philosophy","monthKey":"2026-11","publishedAt":"2026-11-10T00:00:00Z","source":"Crossref","summaryHtml":"デジタル技術とソーシャルメディアは、若い世代に向けたサステナビリティ・コミュニケーションの重要な場になっている。本研究は、TikTokという動画共有プラットフォーム上で、映像と音声を組み合わせたマルチモーダルな言語戦略によって環境保全のメッセージが若い視聴者にどう届けられるかを、批判的エコ言語学の視点から分析したものである。従来の研究はデジタル・アクティビズムの全体像を描いてきたが、多様な語りが知識や集合的行動、批判的意識をどう構築するかを比較する分析は限られていた。<br><br>4つの批判的事例の分析から、3つの異なる言説の方向性が明らかになった。第一はアイデンティティを際立たせる地域の知恵の再活性化、第二は汚染への関心を軸とする大衆向け科学教育、第三は企業の隠蔽を解体して法的責任を要求する構造的批判である。それぞれが、娯楽の媒体から持続可能性の教育と正義の提唱のための参加型エコシステムへと、マルチモーダルなデジタルネットワークが変容する過程を示している。<br><br>本研究の新規性は、こうした多様な語りの比較総合にある。教育機関や政策立案者は、こうしたマルチモーダルな言説戦略を活用し、参加型の気候行動を促すとともに、企業に対する制度的な説明責任を求めるべきだと結論づけている。SNS上の環境言説が若者の生態学的意識を形づくる仕組みを、言説分析から照らし出した研究である。","timestamp":1794268800000,"title":"TikTok Environmental Discourse Innovations Construct Generation Z Ecological Consciousness","titleJa":"TikTokが育むZ世代の生態学的意識――環境言説の3つの型を読み解く","url":"https://doi.org/10.21070/ijins.v28i1.2466"},{"authors":["Jitka Annen","Willemijn Sabien van Erp","Lionel Naccache","Daniele Marinazzo"],"categories":[],"field":"Imaging Neuroscience","genre":"Consciousness / Neuroscience","monthKey":"2026-11","publishedAt":"2026-11-10T00:00:00Z","source":"Crossref","summaryHtml":"意思疎通のできない患者の意識を正確に評価することは、神経科学と臨床ケアの大きな課題である。Coma Recovery Scale–Revised（CRS-R）のような行動尺度は標準的な診断手段だが、患者の運動障害や主観的報告の欠如によって限界がある。EEG・fMRI・PETなどの神経画像や電気生理学的手法はこの状況を変え、無反応と判断されていた患者の最大40%に隠れた意識があることを明らかにしてきた。ただしこれらの手法は主として認知的な気づき（sapience）を対象とし、感じ取る能力（sentience）を見落としがちである。<br><br>近年の証拠によれば、心臓–脳、呼吸–脳、腸–脳といった脳と身体の相互作用は、意識や感情に関する臨床的に重要な情報を、動的かつ状態依存的な形で含んでいる。自律神経系や内受容感覚の指標は、意識体験の身体化された情動的側面を反映し、診断や予後予測にさらなる価値をもたらす可能性があるという。<br><br>こうした指標を確立された神経画像の相関と統合すれば、神経・行動・情動の領域をつなぐ、より包括的で個別化された意識のプロファイルが得られる。本論文は単一の「ゴールドスタンダード」を求めるのではなく、行動観察・神経画像・身体生理学を統合した複合的な枠組みを提案する。診断精度の向上、個別化治療の指針、長期の意識障害における感覚（sentience）の理解深化につながるアプローチである。","timestamp":1794268800000,"title":"Toward a Composite Framework of Consciousness: Integrating Brain–Body Interactions, Sentience, and Neuroimaging in Disorders of Consciousness","titleJa":"意識の複合的枠組み――脳と身体の相互作用・感覚・神経画像の統合","url":"https://doi.org/10.1162/imag.a.1477"},{"authors":["Jason K Day","Dan Zahavi"],"categories":[],"field":"Philosophical Transactions of the Royal Society B: Biological Sciences","genre":"Consciousness / Philosophy","monthKey":"2026-11","publishedAt":"2026-11-10T00:00:00Z","source":"PubMed","summaryHtml":"自我溶解（ego-dissolution）は、サイケデリック研究における中心的な現象の一つである。本論文は、自我溶解によって現象的な自己感覚をまったく欠いた意識状態が生じうるという主張に対する、哲学的・質的な批判である。クリス・レセビーとラファエル・ミリエールは、5-MeO-DMTによる体験の報告を「完全に自己なき体験状態」の証拠とみなすが、著者らは彼らの「自己」や「自己意識」の概念が過度に膨らんでいると指摘する。よりミニマルな自己意識の形態があり、それが5-MeO-DMTの体験にも残っている可能性があるという。<br><br>著者らは411件の5-MeO-DMT体験報告を対象に、質的な主題分析を行った。報告の言語の曖昧さ、記述が不十分であることを体験者自身が認めている点、そして報告される体験の感情的側面に注目し、「完全な自己なき状態」という主張は根拠が不十分だと論じる。<br><br>代替の解釈として、極端な自我溶解においても自己意識は根底的なミニマルな形で残り、主体の同一性がなじみのない不確定なものとして体験される、と提案する。本論文は王立協会の討論集会号「From being to identity」に収録されたもので、意識における自己のあり方をめぐる議論に、哲学的・実証的な再検討を迫る論考である。","timestamp":1794268800000,"title":"Psychedelic ego-dissolution: a philosophical and qualitative critique.","titleJa":"サイケデリックの自我溶解を問い直す――「自己なき意識」は本当に存在するのか","url":"https://pubmed.ncbi.nlm.nih.gov/43007826/"},{"authors":["Terezija Gložinić","Odilon Gbènoukpo Singbo","Marta Čivljak"],"categories":[],"field":"Nursing Ethics","genre":"Ethics / Safety","monthKey":"2026-11","publishedAt":"2026-11-10T00:00:00Z","source":"Crossref","summaryHtml":"倫理的に難しい場面に頻繁にさらされる看護師は、道徳的苦悩を抱え、やがて道徳的傷害に至ることがある。倫理的信念に従い、個人的・職業的リスクを冒して行動する「道徳的勇気」は、その保護要因として提案されてきたが、概念は断片的なままだった。本研究は、看護における道徳的勇気の研究を地図化するスコーピングレビューである。<br><br>Joanna Briggs Instituteの方法論とPRISMA-ScRの報告指針に沿い、Web of Science、PubMed/MEDLINE、Scopusなどから2000年以降の文献を検索し、65件の研究（2019〜2026年、11か国）を対象とした。測定尺度は6種類が確認され、Professional Moral Courage Scale（49%）とNurses' Moral Courage Scale（33%）が多く使われていた。道徳的勇気は、アリストテレス的な安定した徳と捉える立場と、学習可能な倫理的能力と捉える立場に分かれた。<br><br>年齢、経験、倫理的風土、倫理的リーダーシップは道徳的勇気と一貫して正の関連を示し、構造化された倫理教育は一貫して道徳的勇気を高めた。一方、道徳的苦悩やバーンアウトとの関連は研究によってばらついた。COVID-19以降、研究は急増したが、エビデンスは地理的に偏り、尺度も概念も未整理なままである。縦断研究や媒介分析による多様な地域での検証が必要だと結論づけている。","timestamp":1794268800000,"title":"Conceptualization, measurement, and factors associated with moral courage in nursing: A scoping review","titleJa":"看護における道徳的勇気――概念・測定・関連要因のスコーピングレビュー","url":"https://doi.org/10.1177/09697330261503762"},{"authors":["Michael Cevering"],"categories":[],"field":"AGATHEOS – European Journal for Philosophy of Religion","genre":"Philosophy","monthKey":"2026-11","publishedAt":"2026-11-10T00:00:00Z","source":"Crossref","summaryHtml":"仏教倫理はこれまで、帰結主義、現象学、徳倫理として分類されたり、道徳的反実在論を伴うとみなされたりしてきた。こうした分類は中世の禅僧・道元の倫理思想にも当てはめられてきた。本論文は道元の主著『正法眼蔵』に即して読み直し、そうした分類が部分的には当てはまると認めつつも、道元の倫理は結局のところ「一如」の倫理だと論じる。倫理の命令は一如の理解そのものから導かれるというのが中心的な主張である。<br><br>著者によれば、道元の著作にみられる倫理的命令は、すべての存在者は仏であるとする仏性一元論という形而上学的な立場から論理的に導かれる。すべての存在者が互いに仏性であることに目覚め合うという相互覚醒の理論と、面授によるその実践的な実現に、倫理の根拠が置かれている。形而上学と倫理が切り離せない形で結びついている点が、道元の思想の特徴として描き出される。<br><br>仏性という存在論から倫理を直接に導く読み筋を示した点が本論文の特徴である。道元研究における従来の分類を相対化し、一如の思想を倫理の基礎として位置づけ直す試みであり、仏教哲学と倫理学の接点を考えるうえで示唆を与える論考である。","timestamp":1794268800000,"title":"Eihei Dogen's Ethics of Oneness","titleJa":"道元の「一如」の倫理――仏性一元論から導かれる倫理","url":"https://doi.org/10.69574/aejpr.v3i2.61219"}],"updatedAt":"2026-11-13T02:41:04Z","version":1};
    const byId = id => document.getElementById(id);
    const norm = s => String(s||'').toLowerCase().normalize('NFKC').replace(/\s+/g,' ').trim();
    const esc = s => String(s||'').replace(/[&<>"]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
    const plainText = h => String(h||'').replace(/<br><br>/g,' ').replace(/<[^>]+>/g,'');
    const months = [...new Set((DATA.articles||[]).map(a => a.monthKey).filter(Boolean))].sort().reverse();
    const genres = [...new Set((DATA.articles||[]).map(a => a.genre).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'ja'));
    const fields = [...new Set((DATA.articles||[]).map(a => a.field).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'ja'));
    function fill(select, values){ values.forEach(v=>{ const o=document.createElement('option'); o.value=v; o.textContent=v; select.appendChild(o); }); }
    fill(byId('month'), months); fill(byId('genre'), genres); fill(byId('field'), fields);
    // ---- filter persistence: URL query params win over localStorage ----
    const FILTER_IDS = ['month','genre','field','sort','pageSize'];
    const LS_KEY = 'rd-filters-v1';
    function readUrlState(){ try { const p = new URLSearchParams(location.search); const s = {}; let any = false; FILTER_IDS.concat(['keyword']).forEach(id=>{ if (p.has(id)) { s[id] = p.get(id); any = true; } }); return any ? s : null; } catch(e){ return null; } }
    function readLsState(){ try { return JSON.parse(localStorage.getItem(LS_KEY) || 'null'); } catch(e){ return null; } }
    function applyState(s){ if (!s) return; FILTER_IDS.forEach(id=>{ if (s[id] != null) byId(id).value = s[id]; }); if (s.keyword != null) byId('keyword').value = s.keyword; }
    function currentState(){ const s = {}; FILTER_IDS.forEach(id=>{ s[id] = byId(id).value; }); s.keyword = byId('keyword').value; return s; }
    function persist(){ const s = currentState(); try { localStorage.setItem(LS_KEY, JSON.stringify(s)); } catch(e){} try { const p = new URLSearchParams(); Object.keys(s).forEach(k=>{ if (s[k]) p.set(k, s[k]); }); const q = p.toString(); history.replaceState(null, '', q ? '?' + q : location.pathname); } catch(e){} }
    applyState(readUrlState() || readLsState());
    // ---- summary folding ----
    const FOLD_CHARS = 180;
    const expanded = new Set();
    let currentPage = 1;
    function render(){
      const month=byId('month').value, genre=byId('genre').value, field=byId('field').value, sort=byId('sort').value, kw=norm(byId('keyword').value);
      let rows=(DATA.articles||[]).filter(a=>{
        if(month&&a.monthKey!==month) return false; if(genre&&a.genre!==genre) return false; if(field&&a.field!==field) return false;
        const hay=norm([a.titleJa,a.title,a.summaryHtml,a.authors.join(' '),a.categories.join(' ')].join(' '));
        if(kw&& !hay.includes(kw)) return false; return true;
      });
      rows = rows.slice().sort((a,b)=> sort==='oldest' ? a.timestamp-b.timestamp : sort==='title' ? a.titleJa.localeCompare(b.titleJa,'ja') : b.timestamp-a.timestamp);
      const pageSize = parseInt(byId('pageSize').value, 10) || 0;
      const totalPages = pageSize ? Math.max(1, Math.ceil(rows.length / pageSize)) : 1;
      if (currentPage > totalPages) currentPage = totalPages;
      if (currentPage < 1) currentPage = 1;
      const pageRows = pageSize ? rows.slice((currentPage - 1) * pageSize, currentPage * pageSize) : rows;
      byId('pageInfo').textContent = rows.length ? `${currentPage} / ${totalPages} ページ` : '0 / 0 ページ';
      byId('prevPage').disabled = currentPage <= 1;
      byId('nextPage').disabled = currentPage >= totalPages;
      byId('meta').textContent = `更新: ${DATA.updatedAt || '-'} / 表示件数: ${rows.length}件`;
      byId('emptyState').style.display = rows.length ? 'none' : 'block';
      byId('list').innerHTML = pageRows.map(a=>{
        const plain = plainText(a.summaryHtml);
        const isLong = plain.length > FOLD_CHARS;
        const open = expanded.has(a.url);
        const summaryHtml = (!isLong || open) ? (a.summaryHtml || '') : esc(plain.slice(0, FOLD_CHARS)) + '…';
        const btn = isLong ? `<button type="button" class="summary-toggle" data-url="${esc(a.url)}" aria-expanded="${open}">${open ? '閉じる' : '続きを読む'}</button>` : '';
        return `
        <article>
          <p class="meta">${esc(a.source)}　${esc(a.publishedAt.slice(0,10))}</p>
          <h2 class="article-title">${esc(a.titleJa)}</h2>
          <div class="taxonomy"><span class="chip">${esc(a.genre)}</span><span class="chip">${esc(a.field)}</span>${a.categories.slice(0,4).map(c=>`<span class="chip">${esc(c)}</span>`).join('')}</div>
          <div class="summary">${summaryHtml}</div>${btn}
          <div class="source-box"><strong>ソース・引用元</strong>配信元：${esc(a.source)}<br>原題：${esc(a.title)}<br>著者：${esc(a.authors.join(', '))}<br>原文URL：<a href="${esc(a.url)}" target="_blank" rel="noopener">${esc(a.url)}</a></div>
        </article>`;
      }).join('');
    }
    function resetAndRender(){ currentPage = 1; persist(); render(); }
    ['month','genre','field','sort','pageSize'].forEach(id=>byId(id).addEventListener('change',resetAndRender)); byId('keyword').addEventListener('input',resetAndRender);
    byId('prevPage').addEventListener('click',()=>{ if(currentPage>1){ currentPage--; render(); } });
    byId('nextPage').addEventListener('click',()=>{ currentPage++; render(); });
    byId('list').addEventListener('click',e=>{
      const btn = e.target && e.target.closest ? e.target.closest('.summary-toggle') : null;
      if (!btn) return;
      const u = btn.getAttribute('data-url');
      if (expanded.has(u)) expanded.delete(u); else expanded.add(u);
      render();
    });
    byId('resetFilters').addEventListener('click',()=>{
      byId('month').value=''; byId('genre').value=''; byId('field').value=''; byId('sort').value='newest'; byId('keyword').value=''; byId('pageSize').value='20';
      try { localStorage.removeItem(LS_KEY); } catch(e){}
      try { history.replaceState(null, '', location.pathname); } catch(e){}
      currentPage = 1; render();
    });
    render();
  </script>
