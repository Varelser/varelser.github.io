:"https://arxiv.org/abs/2611.31228v1"},{"authors":["Jiajun Fan","Neil He","Qinglong Zheng","Changyi Yang","Tong Wei","Andy Mao","Zetian Li","Chaoran Cheng","Hui Ren","Ruihan Guo","Xianrui Zhong","Xizheng Yu","Jingyuan Li","Xi Zhu","Kaiqu Liang","Chang Xu","Zun Qian","Zidi Xiong","Yuezhu Zhao","Xu Huang","Ge Liu"],"categories":["cs.AI"],"field":"arXiv","genre":"Agents / Robotics","monthKey":"2026-11","publishedAt":"2026-11-23T00:00:00Z","source":"arXiv","summaryHtml":"言語モデルを基盤とする身体化エージェントは、与えられた重みのまま働き続ける。改善には追加学習や、コストのかかる反省・記憶・探索が必要だった。本研究は、自分の経験から重みを直接書き換えて自己改善する身体化エージェントを初めて提案した。学習も勾配も報酬モデルも第二のモデルも使わず、タスクの合間に自らの重みを更新する。<br><br>27Bのエージェントは日中、家庭環境で働く。夜になると記録を読み返し、トークン上限に達して行動に至らない無駄な返信が多いことに気づき、その習慣を隠れ状態の一方向に追跡して、重みの一つのテンソルを書き換えた。変更はすべて元の自分との比較試験で検証し、保たれたものだけを採用する。数千の未見エピソードで、採用された一度の編集により、タスク完了数が有意に増え、ステップ数・無駄・トークン数が減った。<br><br>自己改善は複数ラウンドにわたり安定して続き、崩壊しなかった。ただし、同じ系列の4サイズのうち、この自己改善ができたのは27Bモデルのみだった。学習と推論を分けずに働きながら成長する、生涯学習ロボットへの道を開くものだという。出典：arXiv","timestamp":1795392000000,"title":"Self-Upgrading Embodied Agents","titleJa":"夜に自分の重みを書き換えるロボット――自己改善する身体化エージェント","url":"https://arxiv.org/abs/2611.31117v1"},{"authors":["Kairong Han","Nuanqiao Shan","Ziyu Zhao","Xinpeng Dong","Zijing Hu","Dian Jin","Leyan Deng","Junjian Ye","Lujia Pan","Fei Wu","Kun Kuang"],"categories":[],"field":"Hugging Face Papers","genre":"LLM / NLP","monthKey":"2026-11","publishedAt":"2026-11-23T00:00:00Z","source":"Hugging Face Papers","summaryHtml":"大規模言語モデルの強化学習では、最終出力やテキストの解答軌跡に報酬を与える手法が主流だが、報酬は粗く、推論の信頼性も十分でない。こうした枠組みはモデルが「何を言うか」に注目し、内部で「どう考えるか」を見落としている。そこで本研究は、テキスト報酬のエイリアシング（別々の推論過程が同じ報酬を受け取る問題）を指摘し、隠れ状態と注意マップに基づいて内部の推論過程に報酬を与える注意過程報酬モデル（APRM）を提案した。<br><br>APRMは約4600万パラメータの小さなモデルで、ランキング目的と反事実目的で学習され、分布シフトに対応するため定期的に更新されながら強化学習の最適化を導く。代表的な強化学習手法と組み合わせた実験では、平均pass@8が2.88%向上した。内部の推論信号を報酬に組み込むことで、表面的な正解だけでなく質の高い推論過程そのものを育てられる見通しが示された。<br><br>言語モデルの推論を「結果」ではなく「過程」から評価・強化する方向性は、推論の信頼性向上における有望な一手である。ただし評価は限られた手法と指標によるもので、他のモデル規模や課題への一般化は今後の検証が必要である。出典：Hugging Face Papers","timestamp":1795392000000,"title":"From Rewarding What Models Say to How They Think: Attention Process Reward Model for LLM Reinforcement Learning","titleJa":"「何を言うか」ではなく「どう考えるか」を褒める――注意過程報酬モデルによるLLM推論の強化","url":"https://huggingface.co/papers/2611.30627"},{"authors":["Terry Ma","Aidan Zhang"],"categories":["cs.AI"],"field":"arXiv","genre":"LLM / NLP","monthKey":"2026-11","publishedAt":"2026-11-23T00:00:00Z","source":"arXiv","summaryHtml":"言語モデルの推論では、多数決で得た答えを、追加の推論や検証で置き換えることがある。本研究はそうした置き換えを「上書き」と呼び、いつ上書きすべきかを検討した。障害は2つある。正しい代替案がそもそも存在するかどうかと、それを生み出す・選び出す方法の信頼性である。多数決の出発点として16件の回答を用い、追加の推論、プログラムの実行、他モデルによる推論の3つの方法を、3つのオープンな推論モデルと150問の数学競技問題で比較した。<br><br>多数決が誤っている場合、正しい答えは元の回答群にそもそも含まれていないことが多かった。同じモデルによる追加の推論はめったに上書きせず、プログラムの実行は評価したすべての合意しきい値で、誤りを増やすより正す方が多かった。他モデルによる上書きは弱いベースラインの一部を改善したが、より正確なモデル単体に対する優位は確立できなかった。合意のしきい値を厳しくすると上書きの頻度は下がるが、正す割合が一貫して上がるわけではなかった。<br><br>最も厳しいしきい値では上書きが起きる問題自体が少なく、信頼性についての結論は限られる。多数決の答えを覆すには、正しい代替案の存在と検証方法の信頼性の両方が鍵になることが示された。出典：arXiv","timestamp":1795392000000,"title":"When Does Overriding the Majority Vote Help?","titleJa":"多数決の答えをいつ覆すべきか――推論・プログラム実行・他モデルによる上書きの検証","url":"https://arxiv.org/abs/2611.31165v1"},{"authors":["Nicolas Bolouri","Gaya Mehenni","Daniel Toyama"],"categories":["cs.AI"],"field":"arXiv","genre":"Agents / Robotics","monthKey":"2026-11","publishedAt":"2026-11-23T00:00:00Z","source":"arXiv","summaryHtml":"エージェントに何を最適化させるかを設計することは、エージェント自体を最適化することと同じくらい難しい。既存の言語モデルによる報酬生成は、あらかじめ決められた課題の目的を洗練させるものが多く、「何を探索するか」と「どう実装するか」が結びついて、結果として得られる行動の幅を狭めがちだった。本研究は、実行可能なエージェント目的をオープンエンドに進化させるフレームワーク「Habitats」を提案した。<br><br>Habitatsは報酬と方策のペアの集団を維持し、すべての方策を集団のすべての報酬で評価してクロス適合度行列を作り、自己習熟・転移・機能的多様性を可視化する。集団レベルのPlannerがこの情報をもとに親となる報酬を選び、的を絞った変異の指示を出し、別のMutatorがその指示を検証済みの報酬プログラムに翻訳する。カードサンドボックスと3つの連続制御環境（カートポール、ホッパー、チーター）で評価した結果、Habitatsは専門性と行動多様性の両方で既存手法を上回り、最終的な多様性は直接変異の1.8倍、独立生成の2.5倍に達した。<br><br>進化中に見ていない10の下流目的でも、凍結したHabitatsの方策ライブラリは適応の勝率で既存手法を上回り、2万エピソード学習した課題専用方策をも上回った。集団レベルの計画と報酬合成を分離することで、多様で学習可能・再利用可能な行動を発見できることが示された。出典：arXiv","timestamp":1795392000000,"title":"Habitats: A Framework for Open-Ended Evolution of Agent Objectives","titleJa":"エージェントの「目的」自体を進化させる――オープンエンドな目的進化フレームワークHabitats","url":"https://arxiv.org/abs/2611.31160v1"},{"authors":["Qinyue Li","Weijie Qiao","Qingyi Tao","Zerui Gong","Zhe Yang","Quanzhou Li","Taolin Zhang","Jinglin He","Zhonghua Wu","Chen Change Loy"],"categories":[],"field":"Hugging Face Papers","genre":"Agents / Robotics","monthKey":"2026-11","publishedAt":"2026-11-23T00:00:00Z","source":"Hugging Face Papers","summaryHtml":"一人称視点の人間の動画や多様なロボットの記録には豊かな力学が含まれるが、行動ラベルがないか、共通の行動空間がない。潜在行動モデル（LAM）はこうした力学を回復できるが、逆動力学モデルと順動力学モデルをゼロから学習するため、画素再構成と潜在容量・精度のトレードオフを抱える。一方、学習済みの動画ワールドモデルは高忠実度の力学を生成できるが、その表現は全層に絡み合っている。本研究はワールドモデルをLAMとみなし、最小限の変更で力学を抽出できることを示した。<br><br>Native LAMは1つの学習済み動画拡散トランスフォーマーを逆・順動力学の両方として動かし、学習可能な力学レジスタだけを因果的な橋渡しとして、動きだけが異なる反事実的な時間ペアで学習し、動画の力学をコンパクトな潜在行動に蒸留する。さらにNative LAMを力学の教師とする視覚言語行動方策の事前学習パラダイムPAWlicyも提案した。Native LAMの潜在行動はLARYベンチマークで既存LAMを上回り、転移の学習なしに新しいロボット・新しい場面・人間の手からロボットへと同じ動きを再現した。<br><br>3.8BモデルでPAWlicyはRoboTwin 2.0で平均成功率93.6%を達成し、実機ロボットでもpi_0.5を上回った。両段階とも公開データと公開ワールドモデルのみを用いている。出典：Hugging Face Papers","timestamp":1795392000000,"title":"World Models as Native Latent Action Models","titleJa":"ワールドモデルをそのまま潜在行動モデルに――動画の力学を抽出するNative LAM","url":"https://huggingface.co/papers/2611.30898"},{"authors":["Yikai Zhang","Mai Xu","Yunbei Zhang","Qirui Jin","Kenan Li","Yuwen Jia","Jinwei Yao","Xiangyu Zhang","Jielun Tan","Jin Pan","Zijian Jin","Xiao Sun"],"categories":[],"field":"Hugging Face Papers","genre":"LLM / NLP","monthKey":"2026-11","publishedAt":"2026-11-23T00:00:00Z","source":"Hugging Face Papers","summaryHtml":"強化学習でコーディングエージェントを訓練する際、隠れたテストが報酬を決めるが、課題集はそのテストを参照修正に対してしか検証していない。本研究は、報酬ラベルの正しさに焦点を当て、SWE-Gymを2つのLLMファミリーで監査した。9Bベースモデルが一度も解けない課題の74%は、正しい修正を却下するテスト（偽陰性）を含んでいた。誤ったラベルの課題を修正・除去すると、残った監査済み課題で訓練したモデルの方が、同じ規模・同じ難易度でSWE-bench VerifiedとSWE-bench Proの保留課題で2.4ポイントと2.7ポイント高く得点した。<br><br>単に解けない課題を落とすだけではこの効果はなかった。さらに、誤ったパッチが通る偽陽性は全合格パッチの約4分の1を占めるが、それを捕捉する新テストを追加しても保留課題の得点は検出できるほど変わらなかった。合格率は課題が報酬を生むかどうかを示すだけで、その報酬が正しいかは示さない。研究チームは監査済み1087課題のSWE-Gym-Verifiedと、実行証拠付きの判定、訓練セット、監査パイプライン全体を公開した。<br><br>コーディングエージェントの学習データでは、課題の難しさだけでなく報酬ラベルの正しさを検証することが重要であり、監査済みデータが学習効率を高めることが示された。出典：Hugging Face Papers","timestamp":1795392000000,"title":"What Makes Good Data for Training Coding Agents? A Systematic Study on SWE-Gym","titleJa":"コーディングエージェントの良い学習データとは――SWE-Gymの報酬ラベル監査","url":"https://huggingface.co/papers/2611.30207"}],"updatedAt":"2026-11-25T20:36:29Z","version":1};

    function readUrlState(){ try { const p = new URLSearchParams(location.search); const s = {}; let any = false; FILTER_IDS.concat(['keyword']).forEach(id=>{ if (p.has(id)) { s[id] = p.get(id); any = true; } }); return any ? s : null; } catch(e){ return null; } }
    function readLsState(){ try { return JSON.parse(localStorage.getItem(LS_KEY) || 'null'); } catch(e){ return null; } }
    function applyState(s){ if (!s) return; FILTER_IDS.forEach(id=>{ if (s[id] != null) byId(id).value = s[id]; }); if (s.keyword != null) byId('keyword').value = s.keyword; }
    function currentState(){ const s = {}; FILTER_IDS.forEach(id=>{ s[id] = byId(id).value; }); s.keyword = byId('keyword').value; return s; }
    function persist(){ const s = currentState(); try { localStorage.setItem(LS_KEY, JSON.stringify(s)); } catch(e){} try { const p = new URLSearchParams(); Object.keys(s).forEach(k=>{ if (s[k]) p.set(k, s[k]); }); const q = p.toString(); history.replaceState(null, '', q ? '?' + q : location.pathname); } catch(e){} }
    applyState(readUrlState() || readLsState());
    // ---- summary folding ----
    const FOLD_CHARS = 180;
    const expanded = new Set();
    let currentPage = 1;
    function render(){
      const month=byId('month').value, genre=byId('genre').value, field=byId('field').value, sort=byId('sort').value, kw=norm(byId('keyword').value);
      let rows=(DATA.articles||[]).filter(a=>{
        if(month&&a.monthKey!==month) return false; if(genre&&a.genre!==genre) return false; if(field&&a.field!==field) return false;
        const hay=norm([a.titleJa,a.title,a.summaryHtml,a.authors.join(' '),a.categories.join(' ')].join(' '));
        if(kw&& !hay.includes(kw)) return false; return true;
      });
      rows = rows.slice().sort((a,b)=> sort==='oldest' ? a.timestamp-b.timestamp : sort==='title' ? a.titleJa.localeCompare(b.titleJa,'ja') : b.timestamp-a.timestamp);
      const pageSize = parseInt(byId('pageSize').value, 10) || 0;
      const totalPages = pageSize ? Math.max(1, Math.ceil(rows.length / pageSize)) : 1;
      if (currentPage > totalPages) currentPage = totalPages;
      if (currentPage < 1) currentPage = 1;
      const pageRows = pageSize ? rows.slice((currentPage - 1) * pageSize, currentPage * pageSize) : rows;
      byId('pageInfo').textContent = rows.length ? `${currentPage} / ${totalPages} ページ` : '0 / 0 ページ';
      byId('prevPage').disabled = currentPage <= 1;
      byId('nextPage').disabled = currentPage >= totalPages;
      byId('meta').textContent = `更新: ${DATA.updatedAt || '-'} / 表示件数: ${rows.length}件`;
      byId('emptyState').style.display = rows.length ? 'none' : 'block';
      byId('list').innerHTML = pageRows.map(a=>{
        const plain = plainText(a.summaryHtml);
        const isLong = plain.length > FOLD_CHARS;
        const open = expanded.has(a.url);
        const summaryHtml = (!isLong || open) ? (a.summaryHtml || '') : esc(plain.slice(0, FOLD_CHARS)) + '…';
        const btn = isLong ? `<button type="button" class="summary-toggle" data-url="${esc(a.url)}" aria-expanded="${open}">${open ? '閉じる' : '続きを読む'}</button>` : '';
        return `
        <article>
          <p class="meta">${esc(a.source)}　${esc(a.publishedAt.slice(0,10))}</p>
          <h2 class="article-title">${esc(a.titleJa)}</h2>
          <div class="taxonomy"><span class="chip">${esc(a.genre)}</span><span class="chip">${esc(a.field)}</span>${a.categories.slice(0,4).map(c=>`<span class="chip">${esc(c)}</span>`).join('')}</div>
          <div class="summary">${summaryHtml}</div>${btn}
          <div class="source-box"><strong>ソース・引用元</strong>配信元：${esc(a.source)}<br>原題：${esc(a.title)}<br>著者：${esc(a.authors.join(', '))}<br>原文URL：<a href="${esc(a.url)}" target="_blank" rel="noopener">${esc(a.url)}</a></div>
        </article>`;
      }).join('');
    }
    function resetAndRender(){ currentPage = 1; persist(); render(); }
    ['month','genre','field','sort','pageSize'].forEach(id=>byId(id).addEventListener('change',resetAndRender)); byId('keyword').addEventListener('input',resetAndRender);
    byId('prevPage').addEventListener('click',()=>{ if(currentPage>1){ currentPage--; render(); } });
    byId('nextPage').addEventListener('click',()=>{ currentPage++; render(); });
    byId('list').addEventListener('click',e=>{
      const btn = e.target && e.target.closest ? e.target.closest('.summary-toggle') : null;
      if (!btn) return;
      const u = btn.getAttribute('data-url');
      if (expanded.has(u)) expanded.delete(u); else expanded.add(u);
      render();
    });
    byId('resetFilters').addEventListener('click',()=>{
      byId('month').value=''; byId('genre').value=''; byId('field').value=''; byId('sort').value='newest'; byId('keyword').value=''; byId('pageSize').value='20';
      try { localStorage.removeItem(LS_KEY); } catch(e){}
      try { history.replaceState(null, '', location.pathname); } catch(e){}
      currentPage = 1; render();
    });
    render();
  </script>
</body>
</html>
