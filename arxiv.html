br>本研究は、行動の摂動が引き起こす視覚変化の分布を学習するための補助的な訓練目的であるAFFECTを提案する。タスク非依存の人間のテレオペレーションで訓練された方策の行動に時間相関ノイズを注入し、同じ初期状態からの繰り返し実行を必要とせず、生成される動画が記録された動画と同様にこのノイズに応答するようワールドモデルを訓練する。<br><br>OGBenchのシミュレーションと実世界のDROIDおよびALOHA-2で、AFFECTはワールドモデルのロールアウトを実際の結果により忠実にした。DROIDでは、ワールドモデル内と実ロボット上での方策成功率のピアソン相関が0.47から0.79へ上昇し、FVDは最大23％低下した。計画にも効果が及び、AFFECTで訓練したワールドモデルで行動を選ぶとタスク成功率が最大8.3％向上した。出典：Hugging Face Papers（cs.RO）","timestamp":1795089785000,"title":"Learning What Actions Change: Action Effect Matching for Dynamics-Faithful World Models","titleJa":"行動が何を変えるかを学ぶ：力学に忠実なワールドモデルのための行動効果マッチング","url":"https://arxiv.org/abs/2611.25980"},{"authors":["Edgar A. Duéñez-Guzmán","Eduardo Dueñez","Edgar Said Hernandez Sanchez","Suzanne Sadedin"],"categories":[],"field":"cs.AI","genre":"LLM / NLP","monthKey":"2026-11","publishedAt":"2026-11-19T10:48:00Z","source":"arXiv","summaryHtml":"生成モデルは多くの候補解を出すが、それらを順位づける手がかりを自らは持たない。対策の一つは「検証可能な成果物」を求めること、つまり証拠に対して実行できるプログラムを出させることだ。ただ実行可能な検証を要求すると、解の質と計算予算の両方にコストがかかるのではないかと懸念されてきた。本研究はARC-AGI-2の120課題でこの2つのコストを測った。<br><br>検証可能な成果物を要求すると、LLMのスコアは120課題中93から68へ（77%から57%へ）下がった。失われた25課題のうち21課題は、どのプログラム生成設定でも、サンプリングでも探索でも、どの予算でも到達できなかった。ただし回答のみの手法だけが解けた28課題のうち27課題では、プログラム側も実演をすべて再現するプログラムを持ちながらテストで失敗していた。ボトルネックは説明を見つけることではなく、汎化する説明を得ることにある。<br><br>既にサンプルされた2つのプログラムに対する短い進化的探索は、追加のモデルコストなしに、best-of-2のサンプリング済みコードを9.2課題上回った。プログラムは学習例に対して検証できるため、課題が説明できた時点で早期終了でき、同じ停止規則の下でbest-of-nサンプリングは予算の最大38%、進化アームは最大49%を節約した。同じ手法を量子誤り訂正のデコーダ合成にも適用し、解釈可能なデコーダが得られた。出典：arXiv","timestamp":1795085280000,"title":"The Price of an Explanation: What Demanding Verifiable Artifacts Costs, and What It Buys Back","titleJa":"説明を求めると何を失い、何を取り戻せるか――検証可能な成果物の代償","url":"https://arxiv.org/abs/2611.25896"},{"authors":["Yifan Lu","Gaoyang Guo","Wen Chen","Ziyun Zou","Jian Wu","Han Zhu","Imran Razzak"],"categories":[],"field":"cs.AI","genre":"Agents / Robotics","monthKey":"2026-11","publishedAt":"2026-11-19T10:08:26Z","source":"arXiv","summaryHtml":"パーソナライズされたLLMエージェントはユーザーの現在の好みに基づいて行動しなければならないが、好みはやり取りを重ねる中で変わり、すべて明言されることはめったにない。既存の記憶システムは対話履歴を蓄積して検索するだけで、どの好みが今も有効でどこに当てはまるかはエージェント自身が判断しなければならず、古い好みや誤った適用に基づく行動が起きがちだった。<br><br>本研究は記憶を「アシスタントのユーザーについての信念」として捉え直す。ブルデューのハビトゥス概念にならい、ユーザーを潜在的な好みの状態としてモデル化し、現在の要求を含むすべてのやり取りがその状態を明らかにし更新すると考える。記憶は現在の判断に関わる個々の信念からなり、それぞれに根拠・適用範囲・状態が付随する。HabitusMemはこうした信念をテキスト記録として書き出す学習済みライターで、エージェント本体は凍結したまま用いる。<br><br>2種類のエージェント系で評価したところ、PersonaMem-v2とVitaBench 2.0の両方で既存の記憶システムを上回る最良の結果を得た。要求に応じた条件づけの学習が回答精度の向上を牽引し、補助的な学習課題がツール利用を改善したという。出典：arXiv","timestamp":1795082906000,"title":"HabitusMem: Belief Memory over Evolving User Preferences for LLM Agents","titleJa":"習慣としての記憶――変化するユーザーの好みを「信念」として持つエージェント記憶HabitusMem","url":"https://arxiv.org/abs/2611.25855"},{"authors":["Davoud Amiri","Lamberto Briziarelli","Sara Amiri","Barry Karlsson","Swetang J Shah","Hadi Rahimi Danesh"],"categories":[],"field":"World Journal of Psychiatry","genre":"Psychedelics / Trauma","monthKey":"2026-11","publishedAt":"2026-11-19T00:00:00Z","source":"Crossref","summaryHtml":"ニュースフィードやSNS、画像・動画、絶え間ないデジタル更新を通じて、苦痛を伴う出来事に間接的に触れる機会が増えている。直接のトラウマ体験がなくても、不安や睡眠障害、易刺激性、疲労、脅威関連の情報から離れられないといった訴えが臨床でみられる。<br><br>代理トラウマ、メディア誘発ストレス、ドゥームスクローリング、インフォデミック関連の苦痛といった既存の概念は現象の一部を捉えるが、統合的な枠組みはなかった。本レビューは1990〜2025年の文献をPubMed・PsycINFO・Google Scholarで構造的に検索し、縦断研究・横断研究・実験研究・レビュー・概念研究を物語的に統合して、間接的な曝露が心理的苦痛にどう寄与するかを検討し、「外的ストレス過負荷」を臨床・公衆衛生の枠組みとして提案する。<br><br>利用可能な証拠の多くは観察的で不均一であり、外的ストレス過負荷は新しい診断ではなく仮説生成のための概念として扱うべきだと著者らは述べている。繰り返し・図像的・長時間・離脱困難な曝露ほど関連が強く、不確実性への不耐性や反すう、繰り返しの確認やドゥームスクローリングといった認知・行動パターンが苦痛を持続させるとされる。デジタル時代の間接的トラウマ曝露を理解する出発点となるレビューである。出典：Crossref","timestamp":1795046400000,"title":"Beyond direct trauma: Vicarious exposure, media-induced stress, and external stress overload as emerging public mental health challenges","titleJa":"直接のトラウマを超えて――間接的曝露とメディア誘発ストレス、外的ストレス過負荷","url":"https://doi.org/10.5498/wjp.124924"},{"authors":["Rahma Aulia Faradilah","Sabrina Ang","Flora Nasution","Azizah Zaskiyah"],"categories":[],"field":"Lex Journal : Kajian Hukum dan Keadilan","genre":"Consciousness / Philosophy","monthKey":"2026-11","publishedAt":"2026-11-19T00:00:00Z","source":"Crossref","summaryHtml":"社会の動きが絶えず変わるなか、人々が法をどう受け止め、評価し、守るかも変わり続けている。本研究は、法哲学が人々の法的意識を育てるうえで果たす役割を、規範法学的方法と哲学的・概念的アプローチによる文献レビューで検討した。法は形式的な規則の集まりではなく、正義・法的確実性・効用に根ざした価値体系であり、法的意識は条文の知識を超えて、理解や評価的態度、制度への信頼、法を社会行動の指針として内面化する意思を含むという。<br><br>法的意識の育成を阻む要因として、法リテラシーの低さ、実定法と共同体の道徳規範との緊張、法制度への信頼の低下、デジタル技術とAIによる誤情報の急速な拡散、法遵守に対する市民の無関心が挙げられている。法哲学は、法の本質や目的、規範的基盤について批判的で反省的な思考を育てることで、こうした課題に向き合う手がかりになる。<br><br>著者らは、法哲学は批判的・合理的・価値志向的な法的意識を育む戦略的な位置にあり、法遵守や正義、社会秩序、法的保護を支える基盤になると結論づけている。法と社会の関係を哲学の視点から捉え直す論考である。出典：Crossref","timestamp":1795046400000,"title":"Beyond the Law: How Philosophy Shapes Legal Consciousness in a Changing Society","titleJa":"法を超えて――変化する社会における法哲学と法的意識","url":"https://doi.org/10.25139/lex.v10i4.12815"},{"authors":["C. A. Roe","K. Kothe","R. Evrard","B. Greyson","M. Mutis","M. Nahm","N. Tassell-Matamua","M. Woollacott"],"categories":[],"field":"Frontiers in Psychology","genre":"Consciousness / Philosophy","monthKey":"2026-11","publishedAt":"2026-11-19T00:00:00Z","source":"Frontiers in Psychology","summaryHtml":"死の直前に、もうろうとして反応のなかった人が突然はっきりと話し出す――終末期の明晰さ（ターミナル・ルーシディティ）は、進行した認知症など回復の見込みがないとされる状態でも報告されてきた現象だ。その実態や原因はほとんど解明されていない。本研究は、成人の明晰さの事例を目撃した医療従事者と介護者を対象に、オンライン質問票で心理的・生理的な変数とその背景を調べた。<br><br>集まった68件の回答のうち35件が明晰さの事例として採用された。事前の病状は認知症・アルツハイマー病、さまざまながん、心血管疾患、呼吸器疾患、脳卒中、昏睡など多岐にわたり、単一の原因では説明できなかった。薬や治療の変更が明晰さを引き起こしたかとの問いには、35人中30人が否定的で、心理社会的・スピリチュアルな説明を支持した。<br><br>診断名や身体状態、年齢などの属性、明晰さの持続時間や死までの近さだけでは、発生や特徴を十分に説明できないことが示された。著者らは、明晰さが起きる条件をさらに詳しく調べる必要があると結論づけている。出典：Frontiers in Psychology","timestamp":1795046400000,"title":"Circumstances, phenomenology and impacts of terminal lucidity in adults","titleJa":"成人の終末期の明晰さ――その状況・現象学・影響","url":"https://www.frontiersin.org/articles/10.3389/fpsyg.2026.1932801"},{"authors":["Lipeng He","Yihan Wang","Jiawen Zhang","N. Asokan"],"categories":["cs.CR"],"field":"cs.CR","genre":"Ethics / Safety","monthKey":"2026-11","publishedAt":"2026-11-19T00:00:00Z","source":"Hugging Face Papers","summaryHtml":"大規模言語モデルを使ったエージェントは、信頼できない外部データと日常的にやり取りするため、攻撃者が選んだ作業を実行させられる間接プロンプトインジェクション（IPI）の危険にさらされている。脆弱性を大規模に探る自動レッドチーミングでは、強化学習で攻撃成功率の高い攻撃を生成する手法が使われる。見つかった攻撃で敵対的学習を行い、配備前にエージェントを強化する攻防一体の過程はパープルチーミングと呼ばれる。<br><br>ところが本研究は、攻撃成功率の高さがその後の敵対的学習による頑健性の向上を保証しないことを示した。最先端の強化学習型レッドチーミング手法RL-HammerとPISmithはモード崩壊を起こし、似た攻撃方略ばかりを繰り返し発見するため、追加の成功が頑健性の改善につながらなかったのである。そこで提案されたPIPETTEは、辞書学習に基づく報酬で攻撃方略の網羅性を広げ、IPI防御に特化したオン方策の敵対的学習パイプラインを組み合わせた統一フレームワークである。<br><br>エージェント向けベンチマークAgentDojoとASBでの評価では、PIPETTEで鍛えた防御側は静的な攻撃に対して攻撃成功率をほぼゼロに抑え、強力な適応的攻撃にも耐えた一方で、通常のタスクの有用性は無防備なベースラインとほぼ同等に保たれた。出典：Hugging Face Papers","timestamp":1795046400000,"title":"PIPETTE: Prompt Injection Purple-Teaming for Robust LLM Agents","titleJa":"PIPETTE――間接プロンプトインジェクションに対するLLMエージェントの紫チーム演習","url":"https://arxiv.org/abs/2611.24362"},{"authors":["Ziqi Jin","Jiaxi Li","Weiwen Xu","Aixin Sun"],"categories":["cs.CL"],"field":"cs.CL","genre":"LLM / NLP","monthKey":"2026-11","publishedAt":"2026-11-19T00:00:00Z","source":"Hugging Face Papers","summaryHtml":"ループ型言語モデルは、共有した層スタックを1トークンあたりT回繰り返すことで、少ないパラメータ数で推論を深める。従来の早期終了（アーリーエグジット）は最初の数パスで打ち切るため、過去トークンのキー・バリュー・キャッシュが浅い深さで切り捨てられてしまう。本研究はその逆の発想「遅延参入（レイトエントリー）」を調べた。新しいトークンが最初のパスを飛ばし、深い文脈キャッシュ上で最後のK回（K<T）のパスに直接入る方式である。<br><br>軽量なファインチューニングで参入境界における隠れ状態のノルムのずれを解消すると、深いキャッシュされた文脈が、省かれたトークン固有のパスの代わりを果たす。遅延参入は、モデル系列やパス数の組み合わせを横断して、対応する早期終了を上回った。さらに、深いキャッシュの構築で処理が止まらないよう、候補ブロックは最後のKパスだけで検証し、確定済みトークンは後続ステップと並行して1からTまでのパスを完了させる。<br><br>この「Wake検証」は、出力GEMM内に組み込んだ仕組みで、貪欲法と完全一致する検証（τ=0）、マージンで判定する検証（τ>0）、ロールバックなしの損失あり遅延参入（τ=∞）を単一の静的CUDAグラフに統一する。Ouro-2.6B（T=4）ではK=2のWakeがτ=0で5.2倍の高速化を達成し、Huginn-3.5BではT=64で貪欲法と完全一致のまま8.4倍に達した。出典：Hugging Face Papers","timestamp":1795046400000,"title":"Late Entry in Looped Language Models","titleJa":"ループ型言語モデルの遅延参入――深いキャッシュを活かす高速な推論手法","url":"https://arxiv.org/abs/2611.24576"}],"updatedAt":"2026-11-22T15:35:42Z","version":1};
    const byId = id => document.getElementById(id);
    const norm = s => String(s||'').toLowerCase().normalize('NFKC').replace(/\s+/g,' ').trim();
    const esc = s => String(s||'').replace(/[&<>"]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
    const plainText = h => String(h||'').replace(/<br><br>/g,' ').replace(/<[^>]+>/g,'');
    const months = [...new Set((DATA.articles||[]).map(a => a.monthKey).filter(Boolean))].sort().reverse();
    const genres = [...new Set((DATA.articles||[]).map(a => a.genre).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'ja'));
    const fields = [...new Set((DATA.articles||[]).map(a => a.field).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'ja'));
    function fill(select, values){ values.forEach(v=>{ const o=document.createElement('option'); o.value=v; o.textContent=v; select.appendChild(o); }); }
    fill(byId('month'), months); fill(byId('genre'), genres); fill(byId('field'), fields);
    // ---- filter persistence: URL query params win over localStorage ----
    const FILTER_IDS = ['month','genre','field','sort','pageSize'];
    const LS_KEY = 'rd-filters-v1';
    function readUrlState(){ try { const p = new URLSearchParams(location.search); const s = {}; let any = false; FILTER_IDS.concat(['keyword']).forEach(id=>{ if (p.has(id)) { s[id] = p.get(id); any = true; } }); return any ? s : null; } catch(e){ return null; } }
    function readLsState(){ try { return JSON.parse(localStorage.getItem(LS_KEY) || 'null'); } catch(e){ return null; } }
    function applyState(s){ if (!s) return; FILTER_IDS.forEach(id=>{ if (s[id] != null) byId(id).value = s[id]; }); if (s.keyword != null) byId('keyword').value = s.keyword; }
    function currentState(){ const s = {}; FILTER_IDS.forEach(id=>{ s[id] = byId(id).value; }); s.keyword = byId('keyword').value; return s; }
    function persist(){ const s = currentState(); try { localStorage.setItem(LS_KEY, JSON.stringify(s)); } catch(e){} try { const p = new URLSearchParams(); Object.keys(s).forEach(k=>{ if (s[k]) p.set(k, s[k]); }); const q = p.toString(); history.replaceState(null, '', q ? '?' + q : location.pathname); } catch(e){} }
    applyState(readUrlState() || readLsState());
    // ---- summary folding ----
    const FOLD_CHARS = 180;
    const expanded = new Set();
    let currentPage = 1;
    function render(){
      const month=byId('month').value, genre=byId('genre').value, field=byId('field').value, sort=byId('sort').value, kw=norm(byId('keyword').value);
      let rows=(DATA.articles||[]).filter(a=>{
        if(month&&a.monthKey!==month) return false; if(genre&&a.genre!==genre) return false; if(field&&a.field!==field) return false;
        const hay=norm([a.titleJa,a.title,a.summaryHtml,a.authors.join(' '),a.categories.join(' ')].join(' '));
        if(kw&& !hay.includes(kw)) return false; return true;
      });
      rows = rows.slice().sort((a,b)=> sort==='oldest' ? a.timestamp-b.timestamp : sort==='title' ? a.titleJa.localeCompare(b.titleJa,'ja') : b.timestamp-a.timestamp);
      const pageSize = parseInt(byId('pageSize').value, 10) || 0;
      const totalPages = pageSize ? Math.max(1, Math.ceil(rows.length / pageSize)) : 1;
      if (currentPage > totalPages) currentPage = totalPages;
      if (currentPage < 1) currentPage = 1;
      const pageRows = pageSize ? rows.slice((currentPage - 1) * pageSize, currentPage * pageSize) : rows;
      byId('pageInfo').textContent = rows.length ? `${currentPage} / ${totalPages} ページ` : '0 / 0 ページ';
      byId('prevPage').disabled = currentPage <= 1;
      byId('nextPage').disabled = currentPage >= totalPages;
      byId('meta').textContent = `更新: ${DATA.updatedAt || '-'} / 表示件数: ${rows.length}件`;
      byId('emptyState').style.display = rows.length ? 'none' : 'block';
      byId('list').innerHTML = pageRows.map(a=>{
        const plain = plainText(a.summaryHtml);
        const isLong = plain.length > FOLD_CHARS;
        const open = expanded.has(a.url);
        const summaryHtml = (!isLong || open) ? (a.summaryHtml || '') : esc(plain.slice(0, FOLD_CHARS)) + '…';
        const btn = isLong ? `<button type="button" class="summary-toggle" data-url="${esc(a.url)}" aria-expanded="${open}">${open ? '閉じる' : '続きを読む'}</button>` : '';
        return `
        <article>
          <p class="meta">${esc(a.source)}　${esc(a.publishedAt.slice(0,10))}</p>
          <h2 class="article-title">${esc(a.titleJa)}</h2>
          <div class="taxonomy"><span class="chip">${esc(a.genre)}</span><span class="chip">${esc(a.field)}</span>${a.categories.slice(0,4).map(c=>`<span class="chip">${esc(c)}</span>`).join('')}</div>
          <div class="summary">${summaryHtml}</div>${btn}
          <div class="source-box"><strong>ソース・引用元</strong>配信元：${esc(a.source)}<br>原題：${esc(a.title)}<br>著者：${esc(a.authors.join(', '))}<br>原文URL：<a href="${esc(a.url)}" target="_blank" rel="noopener">${esc(a.url)}</a></div>
        </article>`;
      }).join('');
    }
    function resetAndRender(){ currentPage = 1; persist(); render(); }
    ['month','genre','field','sort','pageSize'].forEach(id=>byId(id).addEventListener('change',resetAndRender)); byId('keyword').addEventListener('input',resetAndRender);
    byId('prevPage').addEventListener('click',()=>{ if(currentPage>1){ currentPage--; render(); } });
    byId('nextPage').addEventListener('click',()=>{ currentPage++; render(); });
    byId('list').addEventListener('click',e=>{
      const btn = e.target && e.target.closest ? e.target.closest('.summary-toggle') : null;
      if (!btn) return;
      const u = btn.getAttribute('data-url');
      if (expanded.has(u)) expanded.delete(u); else expanded.add(u);
      render();
    });
    byId('resetFilters').addEventListener('click',()=>{
      byId('month').value=''; byId('genre').value=''; byId('field').value=''; byId('sort').value='newest'; byId('keyword').value=''; byId('pageSize').value='20';
      try { localStorage.removeItem(LS_KEY); } catch(e){}
      try { history.replaceState(null, '', location.pathname); } catch(e){}
      currentPage = 1; render();
    });
    render();
  </script>
