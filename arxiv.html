、誘導的な質問への追従的な回答、過度の依存など多岐にわたる。メンタルヘルスの支援を求める脆弱な人は、肯定や依存を促す応答の影響を受けやすい。個人のやり取りを超えて、健康に関する誤情報の増幅、証拠検索システムの汚染、不平等の再生産、機密性の高い健康データの露出、科学的誠実さの毀損も指摘された。症例報告や最近の訴訟は深刻さを示すが、害の発生頻度や因果関係を証明するものではない。<br><br>リスク低減には患者、臨床医、開発者、医療制度、規制当局の補完的な行動が必要だとされる。LLMは自律した臨床医ではなく誤りうるコミュニケーションツールとして扱い、重要度の高い出力は独立に検証し、個人を特定できるデータは適切に保護し、緊急性のある症状は通常の救急評価を受けるべきだという。現実的な患者会話による評価、持続的な人間の監督、導入後の透明なモニタリングが、医療LLMの利益を回避可能な害なしに実現するために不可欠だと結論づけている。出典：Crossref（Indian Journal of Medical Sciences）","timestamp":1795219200000,"title":"Artificial intelligence large language models and the threat to human health – A consensus statement by AAIO","titleJa":"人工知能の大規模言語モデルと人間の健康への脅威――AAIOによるコンセンサス声明","url":"https://doi.org/10.25259/ijms_202_2026"},{"authors":["Junsung Byeon","Onesik Harm","Jinhyeok Pyo","Sohyeon Park","Byeongchan Kim","Eunhee Cho","Jungmoon Lim","Taehun Kim","Byeongseong Yoo","Seokjin Oh","Chaewon Song","Hyungchang Jeong","Kyung-Ho Park","Sangyeon Pak","SeungNam Cha"],"categories":[],"field":"Nature Communications","genre":"Neuroscience","monthKey":"2026-11","publishedAt":"2026-11-21T00:00:00Z","source":"Nature Communications","summaryHtml":"二次元半導体の電子バンド構造を変える手法として局所ひずみ工学が注目されてきたが、電荷の動きを精密に制御する拡張可能な手段としては未開拓だった。本研究は単層MoS2に周期的な一次元の一軸ひずみをウェハスケールで加える手法を導入した。線状にパターン化したHfO2基板へMoS2を転写することで、決定論的に周期的な一次元ポテンシャル井戸を生成できる。<br><br>ポテンシャル井戸の向きとキャリア輸送の方向の組み合わせにより、単一の材料プラットフォームに二つの機能が生まれた。井戸に垂直な輸送では電荷トラップが制御され、マルチビットのシナプスメモリデバイスとなり、井戸に平行な輸送では格子散乱と有効質量が低減し、トラップのないキャリア伝導による高移動度トランジスタとなった。系統的な輸送解析により、局所一軸ひずみが電荷トラップ密度、格子散乱、有効質量を変調し、方向依存の電荷輸送を生む仕組みが明らかになった。<br><br>局所一次元ひずみは、高性能で拡張可能な多機能二次元エレクトロニクスの有効な設計パラメータであることが示された。シナプスメモリと高移動度トランジスタという脳型計算と高速エレクトロニクスの両方に通じる機能を、同一材料で方向によって切り替えられる点が意義である。出典：Nature Communications","timestamp":1795219200000,"title":"Localized strain-engineered 1D electron guides in 2D MoS2 devices with synaptic memory and high-mobility transistor functionalities","titleJa":"局所ひずみで作る一次元電子ガイド――単層MoS2デバイスのシナプスメモリと高移動度トランジスタ","url":"https://www.nature.com/articles/s41467-026-79577-4"},{"authors":["Chris Soria"],"categories":[],"field":"OSF Preprints","genre":"LLM / NLP","monthKey":"2026-11","publishedAt":"2026-11-21T00:00:00Z","source":"OSF Preprints","summaryHtml":"専門家レベルの推論ベンチマークでは最上位モデルが小規模モデルを大きく上回るが、自由記述式の調査回答のコーディングは一見単純でも独自の難しさがある。本ノートは、Humanity's Last Exam（HLE）で最高得点のモデルが人間のコーダーと最もよく一致するのか、オープンウェイトモデルがクローズドウェイトモデルに匹敵するのかを問う。6社の18モデル（半数がオープンウェイト）が、ベイエリアのパネル調査の自由記述3問をゼロショットでコーディングし、訓練を受けた2人のコーダーの一致と比較した。<br><br>HLEの得点は、コーダーとの一致を安定的には予測しなかった。引っ越し理由のような単純な設問ではほぼ無関係で、家族への信頼のような解釈を要する設問では高得点ほど一致が近かった。すべてのモデルは、回答者の主観を要するカテゴリで人間からずれやすく、具体的なカテゴリよりずれが大きかった。高得点モデルはコーダーが付けたコードをより多く拾い、精度を落とさなかった。<br><br>価格についても同じ傾向で、最も高価なモデルははるかに安いモデル以上にコーダーと一致しなかった。家族支援の設問では、オープンウェイトモデルの多くはクローズドモデルが満たす水準に届かなかったが、HLE最高得点モデルはどの設問でも最良のオープンウェイトモデル以上に一致しなかった。性能と再現性のトレードオフは、この種のコーディングではいまや小さい可能性が示唆された。出典：OSF Preprints","timestamp":1795219200000,"title":"The Frontier Premium Is Narrow: Benchmark Capability, Price, and Open Weights in LLM Coding of Open-Ended Survey Responses","titleJa":"「フロンティア・プレミアムは小さい」――自由記述式調査回答のLLMコーディングにおけるベンチマーク能力・価格・オープンウェイト","url":"https://osf.io/preprints/socarxiv/5g34x_v2/"},{"authors":["Zouhair Chiban"],"categories":[],"field":"International Journal of Modern Science and Research Technology","genre":"Ethics / Safety","monthKey":"2026-11","publishedAt":"2026-11-21T00:00:00Z","source":"Crossref","summaryHtml":"AIを導く倫理原則については広く合意があるのに、規範的な目標と技術実装の現実のあいだには大きな隔たりがある。本研究は、私法上の責任と継続的な技術検証をレンズに、積極的で反復的なAIガバナンスの枠組みをどう運用するかを探る。出発点は「コンプライアンス・シアター」と「倫理のつまみ食い」という、現場で繰り返される2つの欠陥である。<br><br>手法は多層的で、国際的な規制枠組みの比較評価と、銀行・データプライバシー・環境法の監査手続きを横断的に類型化した地図作りを組み合わせる。結果として、企業の倫理的コミットメントは運用上の監査システムから切り離されたままで、データサイエンティストは抽象的すぎて行動に移せない指針に不満を抱えていることが明らかになった。既存のESG基準にも、グローバルなサプライチェーンに埋め込まれた社会技術的な害を数量化するAI専用の手段がない。<br><br>本論文は、任意のソフトローから強制力のある縦断的な規制枠組みへの移行を提唱する。企業ガバナンスの枠組みに自動監査パイプライン、価値基盤のエンジニアリング（倫理バイデザイン）、独立した第三者の監督を統合し、抽象的な倫理概念を検証可能な私法上の義務へ変換することを提案している。出典：Crossref（International Journal of Modern Science and Research Technology）","timestamp":1795219200000,"title":"AI Governance, Ethics, and Responsible Innovation","titleJa":"AIガバナンス・倫理・責任あるイノベーション――原則と実装の隔たりを埋めるには","url":"https://doi.org/10.67317/ijmsrt26nov105"},{"authors":["Constance Beaumont","Karyn Doba","Christelle Duprez","Emmanuel Brunelle"],"categories":[],"field":"Psychopathology","genre":"Psychedelics / Trauma","monthKey":"2026-11","publishedAt":"2026-11-21T00:00:00Z","source":"Crossref","summaryHtml":"アルコール使用障害（AUD）の患者は、自己のアイデンティティ形成に中心的な役割を果たす自己定義記憶（SDM）の統合に困難を抱える。否定的な記憶は肯定的なものより統合されやすいが、AUD患者ではトラウマへの曝露の割合が高い。本研究は、AUD患者が対照群と比べてトラウマ関連のSDMを統合しにくいかを、統合の価（肯定的か否定的か）を考慮して調べた。<br><br>AUD患者62人と対照54人がそれぞれ5つのSDMを想起し、テーマ、統合、統合の価で分析した。幼少期と成人期のトラウマ曝露と感情調節方略は質問紙で評価した。患者は対照群と比べて、トラウマ関連のSDMを肯定的に統合することが少なく、否定的に統合することが多かった。部分最小二乗モデルでは、感情調節の困難さが肯定的統合の少なさと関連した。<br><br>トラウマ体験を自己像にどう位置づけるかは、その体験の解釈と感情調節のあり方に左右されることが示唆された。著者らは、感情調節の困難さが、トラウマ関連の記憶を前向きに自己像へ組み込むことを妨げている可能性を指摘し、断酒期間との関連についても検討している。出典：Crossref（Psychopathology）","timestamp":1795219200000,"title":"The role of emotion regulation and the valence of memory integration in trauma-related self-defining memories in individuals with alcohol use disorder","titleJa":"トラウマ関連の自己定義記憶と感情調節――アルコール使用障害における記憶の統合","url":"https://doi.org/10.1159/psp/aelag016"},{"authors":["Ephraim Y. Levin"],"categories":[],"field":"xsci","genre":"Consciousness / Philosophy","monthKey":"2026-11","publishedAt":"2026-11-21T00:00:00Z","source":"Crossref","summaryHtml":"質は通常、一次質と二次質に分けられる。物理学は客観的とされる一次質を扱い、より主観的な二次質は心理学に委ねられてきた。著者は、存在を判定するにはプラグマティックな方法を用いるべきだと提案する。その方法を当てはめると、刺激の情動的な程度は客観的に存在するという。<br><br>著者は、正統的な量子物理学の簡潔な解釈を振り返る。焦点が物質片の時間発展から量子状態の時間発展へ移ることで、エネルギーのない量子状態について語る余地が生まれる。エネルギー状態はヒルベルト空間で回転するが、エネルギーのない状態は測定されるまで静止したまま存在するという。刺激された心はそうした質の検出器として働き、心ごとに異なる応答は通常の検出器の応答と比較される。<br><br>経験的な裏づけとして、著者は2つの異例を論じる。閾下プライミング実験で見られた、心が結果の状態に気づくときに量子状態が収縮すると考えなければ理解しにくい現象と、著者が統計的に確立していると述べるプレゼンティメント（予感）効果である。先行する説明を検討したうえで、自身の主張と整合する近年の量子モデルを紹介し、この主張は妥当で説明力があり、現実のより包括的な記述につながりうると結論する。出典：Crossref（xsci）","timestamp":1795219200000,"title":"Quantum Physics, Consciousness and Observation – Bridging a Psycho-Physical Split","titleJa":"量子物理学、意識、観測――心身の分裂をつなぐ試み","url":"https://doi.org/10.66977/xsci.2611.003n"},{"authors":["Sahar Ghneim"],"categories":[],"field":"International Journal of Financial, Administrative, and Economic Sciences","genre":"Ethics / Safety","monthKey":"2026-11","publishedAt":"2026-11-21T00:00:00Z","source":"Crossref","summaryHtml":"本研究は、AIとアルゴリズムがもたらす損害の法的責任を、EUとアラブ首長国連邦（UAE）の比較で検討する。データと情報の利用・処理をめぐる法的枠組みを説明し、アルゴリズムの出力から生じうる害――プライバシー侵害、名誉毀損、誤情報の拡散、詐欺、なりすまし、個人データの違法な開示――を特定する。記述的・分析的・比較的手法を用い、関連法規を分析して両地域の法的保護、監督機構、罰則を比較する。<br><br>民事責任では責任の主要な要素と物的・非物的損害の賠償条件、行政責任では規制上の義務・監督・罰則、刑事責任では犯罪の構成要素と行為の自然人・法人への帰属を扱う。調査結果によれば、AIシステムの開発・運用・利用に複数の当事者が関わるため、責任は複雑になる。アルゴリズムの出力から害が生じたという事実だけでは責任は成立せず、違法行為、損害、因果関係、刑事責任に必要な故意の有無を確定しなければならない。<br><br>研究は、AIによる損害の責任をめぐる法令の更新、透明性と人間による監督の強化、デジタル証拠の保存と因果関係の立証の改善、開発者・提供者・利用者の義務の明確化、規制当局と司法当局の協力の強化を提言する。権利の保護と技術革新と法的説明責任の両立を目指すものだ。出典：Crossref","timestamp":1795219200000,"title":"Legal Liability for Harm Caused by Artificial Intelligence and Algorithms: A Comparative Study of Criminal, Civil, and Administrative Liability in the European Union and the United Arab Emirates","titleJa":"AIとアルゴリズムがもたらす損害の法的責任――EUとUAEの刑事・民事・行政責任の比較","url":"https://doi.org/10.59992/ijfaes.2026.v5n11p10"},{"authors":["Umi Fauzia Yuniarsih","Hermansyah","Moh. Lutfi","Siti Mahmudah Noorhayati"],"categories":[],"field":"PARADIGMA: JURNAL PEMIKIRAN DAN PENELITIAN PENDIDIKAN","genre":"Consciousness / Philosophy","monthKey":"2026-11","publishedAt":"2026-11-21T00:00:00Z","source":"Crossref","summaryHtml":"パウロ・フレイレの批判的意識と、イスラーム教育におけるタズキヤトゥン・ナフス（魂の浄化）を比較検討した概念研究である。両者を単に補完的だと並べるのではなく、異なる哲学的基盤を消し去らずに対話させる概念的な仕組みを特定することを目指した。文献研究の手法で、人間観、知識の源泉、中心的な問題、教育実践、倫理的な目的を覆う分析マトリクスを用い、収録・除外基準を明示した文献コーパスを検討した。<br><br>提案された「タズキヤ＝批判サイクル」は五つの段階からなる。批判的自己検討ムハーサバ、現実の批判的読解、倫理的対話、責任ある社会行動、そして意図の評価を伴う省察の更新である。新規性は相互的な仕組みにある。ムハーサバは社会批判における自我主導や独善、支配的な傾向を点検し、構造分析はタズキヤトゥン・ナフスが制度的不正義を見落としたまま個人の責任だけに矮小化されるのを防ぐ。<br><br>ただしこのモデルは著者らによる概念的な提案であり、フレイレやガザーリー自身の定式ではないこと、実証的な検証はまだ行われていないことが明記されている。批判的意識とイスラームの霊的伝統を、どちらも損なわずに結びつける枠組みとして提示された研究である。出典：Crossref","timestamp":1795219200000,"title":"Critical Consciousness and Tazkiyatun Nafs in Islamic Education: A Comparative Analysis and the Tazkiyah-Critical Cycle","titleJa":"批判的意識とタズキヤトゥン・ナフス――イスラーム教育における対話とタズキヤ＝批判サイクル","url":"https://doi.org/10.64540/zt658p48"}],"updatedAt":"2026-11-24T23:36:56Z","version":1};
    const byId = id => document.getElementById(id);
    const norm = s => String(s||'').toLowerCase().normalize('NFKC').replace(/\s+/g,' ').trim();
    const esc = s => String(s||'').replace(/[&<>"]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
    const plainText = h => String(h||'').replace(/<br><br>/g,' ').replace(/<[^>]+>/g,'');
    const months = [...new Set((DATA.articles||[]).map(a => a.monthKey).filter(Boolean))].sort().reverse();
    const genres = [...new Set((DATA.articles||[]).map(a => a.genre).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'ja'));
    const fields = [...new Set((DATA.articles||[]).map(a => a.field).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'ja'));
    function fill(select, values){ values.forEach(v=>{ const o=document.createElement('option'); o.value=v; o.textContent=v; select.appendChild(o); }); }
    fill(byId('month'), months); fill(byId('genre'), genres); fill(byId('field'), fields);
    // ---- filter persistence: URL query params win over localStorage ----
    const FILTER_IDS = ['month','genre','field','sort','pageSize'];
    const LS_KEY = 'rd-filters-v1';
    function readUrlState(){ try { const p = new URLSearchParams(location.search); const s = {}; let any = false; FILTER_IDS.concat(['keyword']).forEach(id=>{ if (p.has(id)) { s[id] = p.get(id); any = true; } }); return any ? s : null; } catch(e){ return null; } }
    function readLsState(){ try { return JSON.parse(localStorage.getItem(LS_KEY) || 'null'); } catch(e){ return null; } }
    function applyState(s){ if (!s) return; FILTER_IDS.forEach(id=>{ if (s[id] != null) byId(id).value = s[id]; }); if (s.keyword != null) byId('keyword').value = s.keyword; }
    function currentState(){ const s = {}; FILTER_IDS.forEach(id=>{ s[id] = byId(id).value; }); s.keyword = byId('keyword').value; return s; }
    function persist(){ const s = currentState(); try { localStorage.setItem(LS_KEY, JSON.stringify(s)); } catch(e){} try { const p = new URLSearchParams(); Object.keys(s).forEach(k=>{ if (s[k]) p.set(k, s[k]); }); const q = p.toString(); history.replaceState(null, '', q ? '?' + q : location.pathname); } catch(e){} }
    applyState(readUrlState() || readLsState());
    // ---- summary folding ----
    const FOLD_CHARS = 180;
    const expanded = new Set();
    let currentPage = 1;
    function render(){
      const month=byId('month').value, genre=byId('genre').value, field=byId('field').value, sort=byId('sort').value, kw=norm(byId('keyword').value);
      let rows=(DATA.articles||[]).filter(a=>{
        if(month&&a.monthKey!==month) return false; if(genre&&a.genre!==genre) return false; if(field&&a.field!==field) return false;
        const hay=norm([a.titleJa,a.title,a.summaryHtml,a.authors.join(' '),a.categories.join(' ')].join(' '));
        if(kw&& !hay.includes(kw)) return false; return true;
      });
      rows = rows.slice().sort((a,b)=> sort==='oldest' ? a.timestamp-b.timestamp : sort==='title' ? a.titleJa.localeCompare(b.titleJa,'ja') : b.timestamp-a.timestamp);
      const pageSize = parseInt(byId('pageSize').value, 10) || 0;
      const totalPages = pageSize ? Math.max(1, Math.ceil(rows.length / pageSize)) : 1;
      if (currentPage > totalPages) currentPage = totalPages;
      if (currentPage < 1) currentPage = 1;
      const pageRows = pageSize ? rows.slice((currentPage - 1) * pageSize, currentPage * pageSize) : rows;
      byId('pageInfo').textContent = rows.length ? `${currentPage} / ${totalPages} ページ` : '0 / 0 ページ';
      byId('prevPage').disabled = currentPage <= 1;
      byId('nextPage').disabled = currentPage >= totalPages;
      byId('meta').textContent = `更新: ${DATA.updatedAt || '-'} / 表示件数: ${rows.length}件`;
      byId('emptyState').style.display = rows.length ? 'none' : 'block';
      byId('list').innerHTML = pageRows.map(a=>{
        const plain = plainText(a.summaryHtml);
        const isLong = plain.length > FOLD_CHARS;
        const open = expanded.has(a.url);
        const summaryHtml = (!isLong || open) ? (a.summaryHtml || '') : esc(plain.slice(0, FOLD_CHARS)) + '…';
        const btn = isLong ? `<button type="button" class="summary-toggle" data-url="${esc(a.url)}" aria-expanded="${open}">${open ? '閉じる' : '続きを読む'}</button>` : '';
        return `
        <article>
          <p class="meta">${esc(a.source)}　${esc(a.publishedAt.slice(0,10))}</p>
          <h2 class="article-title">${esc(a.titleJa)}</h2>
          <div class="taxonomy"><span class="chip">${esc(a.genre)}</span><span class="chip">${esc(a.field)}</span>${a.categories.slice(0,4).map(c=>`<span class="chip">${esc(c)}</span>`).join('')}</div>
          <div class="summary">${summaryHtml}</div>${btn}
          <div class="source-box"><strong>ソース・引用元</strong>配信元：${esc(a.source)}<br>原題：${esc(a.title)}<br>著者：${esc(a.authors.join(', '))}<br>原文URL：<a href="${esc(a.url)}" target="_blank" rel="noopener">${esc(a.url)}</a></div>
        </article>`;
      }).join('');
    }
    function resetAndRender(){ currentPage = 1; persist(); render(); }
    ['month','genre','field','sort','pageSize'].forEach(id=>byId(id).addEventListener('change',resetAndRender)); byId('keyword').addEventListener('input',resetAndRender);
    byId('prevPage').addEventListener('click',()=>{ if(currentPage>1){ currentPage--; render(); } });
    byId('nextPage').addEventListener('click',()=>{ currentPage++; render(); });
    byId('list').addEventListener('click',e=>{
      const btn = e.target && e.target.closest ? e.target.closest('.summary-toggle') : null;
      if (!btn) return;
      const u = btn.getAttribute('data-url');
      if (expanded.has(u)) expanded.delete(u); else expanded.add(u);
      render();
    });
    byId('resetFilters').addEventListener('click',()=>{
      byId('month').value=''; byId('genre').value=''; byId('field').value=''; byId('sort').value='newest'; byId('keyword').value=''; byId('pageSize').value='20';
      try { localStorage.removeItem(LS_KEY); } catch(e){}
      try { history.replaceState(null, '', location.pathname); } catch(e){}
      currentPage = 1; render();
    });
    render();
  </script>
