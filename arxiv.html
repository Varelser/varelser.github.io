  <script>
    const DATA = {"articles":[{"authors":["Octavio Islas Carmona","Amaia Arribas Urrutia"],"categories":[],"field":"Online Media and Global Communication","genre":"Consciousness / Philosophy","monthKey":"2026-11","publishedAt":"2026-11-16T00:00:00Z","source":"Crossref","summaryHtml":"AIは人間の「副操縦士」から、自律的にふるまうエージェントへと移行しつつある。本論文はメディア・エコロジーの視点から、この変化が人間のアイデンティティ、著者性、思考の自律性をどう組み替えるかを分析する。火の制御から現在までの人間とインターフェースの進化をたどり、マクルーハンのテトラッドでAIが何を拡張し、何を陳腐化し、何を取り戻し、何へ反転するかを診断する。<br><br>著者らはAIを脳処理の外部層「エクソコーテックス」と呼ぶ。AIは決定や趣味、分析を形作り直し、従来のメディアが人間の反映であったのに対し、文化や物語を自律的に生み出すモデルへと変わった。ニューラルネットワークのブラックボックス性は司法や医療など重要分野での透明性と監督を妨げ、判断はアルゴリズムへと委ねられ、人間の批判的判断は次第に麻痺していくという。<br><br>判断と技術的労働を機械に委ねれば、人間の批判力と創造力は萎縮するおそれがある。AIは言語という文明のOSをハックし、「真実」をアルゴリズムの副産物に変える「現実の泡」を生む。効率の独裁が民主的制度の応答能力を上回るなか、著者らは「選択的切断の倫理」を提唱し、不完全さや曖昧さ、沈黙を守るべき人間の要素として擁護する。出典：Crossref","timestamp":1794787200000,"title":"From extension to the reconfiguration of the human: artificial intelligence as an environment in media ecology","titleJa":"AIは人間の「拡張」から「再構成」へ――エージェント化するAIとメディア・エコロジー","url":"https://doi.org/10.1515/omgc-2026-0022"},{"authors":["Maruša Ferjan","Marina Trkman"],"categories":[],"field":"Journal of Information, Communication and Ethics in Society","genre":"Ethics / Safety","monthKey":"2026-11","publishedAt":"2026-11-16T00:00:00Z","source":"Crossref","summaryHtml":"生成AIの急速な普及は大きな機会をもたらす一方で倫理的な懸念も呼ぶ。AI倫理の指針や理論枠組みでは「善行」と「無害」という二つの原則が、生成AIの開発と利用を最大の価値と最小の害へ導くものとされる。だが一般の人々がこれらをどう受け止めているかは十分に分かっていなかった。<br><br>本研究は生成AIシステムに対する「知覚された善行」と「知覚された無害」の二つの構成概念を測る尺度を開発・検証した。若年成人を対象とした探索的因子分析では2因子構造が得られ、分散の約64%を説明した。EU在住の成人を対象とした確認的因子分析でも2因子構造が確認され、標準化負荷量はすべて0.70を超えた。<br><br>開発された尺度は、構造モデルに組み込んでさまざまな利用文脈における生成AIの利用行動を分析できる実用的な手段だ。政策立案者が利用者の受け止めをより深く理解し、生成AIの開発と利用を統治するより堅固な政策を設計する助けになると著者らは述べる。倫理原則を人々の実感に即して測る試みとして、AIガバナンスの議論にもつながる。出典：Crossref","timestamp":1794787200000,"title":"Scales to measure the perceived beneficence and non-maleficence of generative artificial intelligence systems","titleJa":"生成AIは「善い」か「害がない」か――人々の受け止めを測る尺度の開発と検証","url":"https://doi.org/10.1108/jices-11-2025-0319"},{"authors":["Christina Chwyl","Malena Donas","Angelica Spata","Gabriella Gatto","Akeesha Simmons","Kim Hoffman","M. Kati Lear","Brian Pilecki","Jenna LeJeune","Jason Luoma"],"categories":[],"field":"PsyArXiv","genre":"Psychedelics / Trauma","monthKey":"2026-11","publishedAt":"2026-11-15T00:27:04Z","source":"OSF Preprints","summaryHtml":"社交不安症に対するMDMA支援療法（MDMA-AT）の体験を質的に調べた初めての研究。2回のMDMAセッションを受けた参加者20人に半構造化インタビューを行い、治療的利益に寄与したと感じられた側面を反省的テーマ分析で抽出した。<br><br>5つのテーマが得られた。困難な体験に穏やかに向き合うことで癒しが進むこと（自己批判から好奇心と慈しみへ、感情へのアクセスと処理の向上）、自己と他者への広がった視点による意味づけ（苦悩の起源の明確化、本来の自己の理解、つながりと一体感）、身体化された状態を通じた頭の理解から体感の知への移行（感情の体験と解放、自分とともに安心していられる感覚）、脆弱な自己表現を通じた新しい関係パターンの学習、MDMA体験が継続的な自己発見の拠り所になること。<br><br>参加者は、安全な治療的枠組みの中でのMDMAが、感情と向き合い深く感じ身体で味わうことを促し、新たな洞察と癒しを触媒したと感じていた。自分自身や他者とよりつながり安心できることで、関係の中で本来の自分として現れる意欲が高まったという。出典：OSF Preprints","timestamp":1794702424000,"title":"MDMA-Assisted Therapy for Social Anxiety Disorder: A Qualitative Analysis of Patient Experiences of Change","titleJa":"MDMA支援療法は社交不安に何をもたらすか――患者20人の語りから見えた変化の5テーマ","url":"https://osf.io/preprints/psyarxiv/7kx2p_v1/"},{"authors":["Sophia R Ottofaro","Jessica L Maltman","Javier González-Maeso"],"categories":[],"field":"Neuroscience Letters","genre":"Psychedelics / Trauma","monthKey":"2026-11","publishedAt":"2026-11-15T00:00:00Z","source":"PubMed","summaryHtml":"トラウマ体験は、特定の恐怖記憶だけでなく、新しい刺激への過敏さや中立的な場面での持続的な防衛状態といった、非連合的な変化を残す。セロトニン系サイケデリクスであるシロシビンは、連合的な恐怖の消去を促すことが知られていたが、トラウマ後の非連合的なストレス適応にどう働くかは分かっていなかった。本研究は、文脈的な恐怖想起とストレス感受性・感作を同じ個体で分離して測れるマウスの行動パラダイムを作った。<br><br>雄のC57BL/6Jマウスに急性の足ショックを与え、トラウマ想起を評価したのちシロシビン1mg/kgまたは溶媒を投与し、新しい音刺激と新しい文脈への反応を調べた。トラウマを受けたマウスは強い連合的恐怖と、新しい音へのすくみ増加を示したが、シロシビンはこの刺激誘発性の反応を有意に変えなかった。<br><br>一方、刺激のない新しい文脈での持続的なすくみ（ストレス感作）には、経験依存の両方向の効果が出た。非トラウマ群ではすくみが減ったが、トラウマ群では増えた。シロシビンはトラウマ関連行動を一律に弱めるのではなく、経験に応じて非連合的な防衛反応を調節する。サイケデリクスによる可塑性が、条件によっては潜在的なトラウマ状態を増幅しうることを示す。出典：PubMed","timestamp":1794700800000,"title":"Prior trauma shapes the effects of psilocybin on stress sensitization in mice.","titleJa":"トラウマの有無でシロシビンの効果は逆転する――マウスで見えたストレス感作への両方向作用","url":"https://pubmed.ncbi.nlm.nih.gov/42767398/"},{"authors":["Shaila Islam Nipa"],"categories":[],"field":"Philosophy and Progress","genre":"Consciousness / Philosophy","monthKey":"2026-11","publishedAt":"2026-11-15T00:00:00Z","source":"Crossref","summaryHtml":"自己を知るとはどういうことか。文明の始まりから人間の心の中心的な問いであり続けてきた自己意識の本性を、サルトル、シャンカラ、アヴィケンナ（イブン・シーナー）の3人の哲学者の視点から比較する論文。実存主義、アドヴァイタ・ヴェーダーンタ、イスラーム哲学という異なる伝統が、自己をどう理解してきたかをたどる。<br><br>サルトルは自己意識を選択・責任・絶対的自由の観点から捉える。シャンカラは自己意識をアートマンとブラフマンの非二元性・一体性の自覚とし、解脱への道と結びつける。イブン・シーナーは、身体から独立した魂の内在的な自己認識として自己意識を説明する。質的・概念的な手法で3者の解釈を深く読み解き、共通点と相違点を比較する。<br><br>3人の洞察を並べる比較分析はこれまであまり行われてこなかったという。現代の物質主義的な世界で人間の意識を理解するうえでの意義も検討し、自己意識の涵養が自己実現や倫理的責任、有意義な関係に結びつくと論じる。3人の思想を横断することで、自己意識が単なる自己観察ではなく、生き方そのものを方向づける働きであることが浮かび上がる。出典：Crossref","timestamp":1794700800000,"title":"The Nature of Self-Consciousness: Exploration through Sartre, Shankaracharya and Sina","titleJa":"自己意識とは何か――サルトル、シャンカラ、アヴィケンナが語る自己の本性","url":"https://doi.org/10.3329/pp.v75i1.93271"},{"authors":["Patrizio Tressoldi"],"categories":[],"field":"PsyArXiv","genre":"Consciousness / Philosophy","monthKey":"2026-11","publishedAt":"2026-11-15T00:00:00Z","source":"OSF Preprints","summaryHtml":"臨死体験は心停止や昏睡など生命の危機にともなって語られることが多いが、失神や深い瞑想、催眠、サイケデリクス状態など、生命の脅威がない場面でもよく似た体験が報告される。本総説は、こうした「臨死様体験」と本物の臨死体験とで、体験の内容や心理的な特徴、その後の変化に違いがあるのかを検証した。<br><br>最大規模の回顧調査、混合法のオンライン研究、同一人物内でのサイケデリクス比較を横断した結果、中核的な特徴は文脈を越えて広く重なっていた。一方で、亡くなった人や霊的存在との遭遇は臨死体験の34.7%にみられたのに対し、臨死様体験25例では0件で、人生回顧や「引き返せない地点」も臨死体験にのみ現れた単一事例があった。<br><br>ただし等価性を検証するよう設計された研究はなく、対象は自己選択的で回顧的、測定の等価性も未検証のため、両者が同一だと結論づけるのは早い。著者らは神経生理学的・心理学的・進化的・形而上学的な解釈への含意を整理し、前向きで事前登録された十分な規模の研究を今後の課題に挙げる。出典：OSF Preprints","timestamp":1794700800000,"title":"Near-Death Experiences and Near-Death-Like Experiences: A Comparative Synthesis and Implications for Their Interpretation","titleJa":"臨死体験と臨死様体験はどこが違うのか――現象・心理・後遺効果の比較統合","url":"https://osf.io/preprints/psyarxiv/tu64g_v1/"},{"authors":["Jiaju Justin Yan","Xiaqing Nancy He","Alan Boss"],"categories":[],"field":"SocArXiv","genre":"Other","monthKey":"2026-11","publishedAt":"2026-11-14T23:11:31Z","source":"OSF Preprints","summaryHtml":"起業家は苦境にある事業を続けるかどうかの判断でAIに頼るようになった。だが粘り強さの理論は、その要因を起業家本人の内面か人間同士のネットワークに求めてきた。本論文はAIを、人間ではない第三の要因として位置づける理論枠組みを提示する。心理的資源アプローチやエスカレーション理論、閾値理論、AI起業エージェンシー枠組みを土台に、二つの経路を区別する。<br><br>資源経路では、AIが心理的資源を補い、粘り強さの強度を高め、起業家自身の内的資源への依存を緩める。認識経路では、AIが判断の土台となるフィードバックそのものを形づくり、反証的な証拠への応答性として定義される「粘り強さの較正」を左右する。5つの命題は、二つの経路が組み合わさってAIによるエスカレーション増幅が生じる条件や、不確実性が自信と較正の乖離を広げる仕組み、エージェンシー型AIが逆境と向き合う決断の場面を減らす過程を具体化する。<br><br>時間的な拡張として、持続的なAIの支えが粘り強さをもろくする可能性も論じる。AIをめぐる楽観論と悲観論の双方を調停し、小規模事業主や助言者、AI設計者に向けた検証可能な示唆を提示する。起業の現場でAIが「続ける力」をどう変えるかを考えるための枠組みである。出典：OSF Preprints","timestamp":1794697891000,"title":"Keep on Keeping On, With a Machine: Artificial Intelligence and the Calibration of Entrepreneurial Persistence","titleJa":"AIに相談して続けるかやめるか――起業家の「粘り強さ」をAIがどう変えるか","url":"https://osf.io/preprints/socarxiv/gtd4z_v1/"},{"authors":["Tonglin Yan","Jules Tsukahara","Kenneth Williford","David Rudrauf","Grégoire Sergeant-Perthuis"],"categories":[],"field":"Biological Cybernetics","genre":"Consciousness / Philosophy","monthKey":"2026-11","publishedAt":"2026-11-14T00:00:00Z","source":"Crossref","summaryHtml":"意識の主要理論――統合情報理論（IIT）、グローバル・ワークスペース理論（GWT）、能動的推論（AIF）、高次表象（HOR）、射影意識モデル（PCM）――は、それぞれ異なる数学的言葉で語られ、互いに通じ合わないものと見なされがちだった。本論文は確率論・情報理論・幾何学にもとづく共通の数学的言語で5理論を書き直し、マー（Marr）の階層に沿って計算論とアルゴリズムの水準で厳密に比較する。<br><br>比較から各理論の力点が浮かび上がる。GWTは情報の全体への開放性、IITは還元不能な因果的統合、AIFとHORは不確実性の下での階層的推論と意識的アクセス、PCMは意識経験における視点の幾何学を重視する。理論間の見かけの対立の多くは直接の矛盾ではなく、説明する水準の違いによるものだと論じられる。<br><br>著者らは統合・放送・高次アクセス・視点変換を同じエージェント構造の中で調べられる共通テストベッドを提案し、理論の重なりや食い違い、経験的含意をより体系的に比較する道筋を示す。意識科学におけるモデル比較を一段と厳密にする試みである。出典：Crossref","timestamp":1794614400000,"title":"Formalizing consciousness: a comparative mathematical analysis of leading theories","titleJa":"意識の数理化――主要5理論を共通の数学言語で比較する","url":"https://doi.org/10.1007/s00422-026-01068-y"},{"authors":["Joshua A. Brown","Yijia Ma","Yifan Wang","John J. Massa","Peter Kuan-Hao Cheng","Chaowen Chen","Mingzhou Ding","Norman B. Schmidt","Mohammed R. Milad","Jair C. Soares","Raymond J. Dolan","Chenyu You","Wen Li"],"categories":[],"field":"Nature Communications","genre":"Neuroscience","monthKey":"2026-11","publishedAt":"2026-11-14T00:00:00Z","source":"Nature Communications","summaryHtml":"一時的な脅威が、なぜ消えない恐怖の記憶になるのか。感覚野は従来、刺激の特徴を受け取るだけの受動的な部位とみなされてきたが、近年は恐怖処理にも積極的に関わることが分かってきた。本研究は、高精細α波経頭蓋交流電気刺激とEEG-fMRI同時計測、トランスフォーマーによる神経デコーディングを組み合わせ、恐怖条件づけ後の記憶形成・固定・長期保持を15分後、24時間後、7日後にわたって追跡した。<br><br>記憶の痕跡は3回の評価すべてで確認され、刺激後40〜60ミリ秒という早期の感覚段階から始まり、視覚野と辺縁系に分布していた。条件づけにより後頭部のα波脱同期（視覚野の脱抑制の指標）が強まり、それが長期記憶痕跡の強さを予測した。さらに早期視覚野へのα波刺激で視覚野を抑制すると、条件づけによるα脱同期が消失し、恐怖記憶の固定と保持が選択的に阻害された一方、最初の獲得は保たれた。<br><br>感覚野の脱抑制がヒトの長期恐怖記憶に必要な仕組みであることが示され、早期感覚野が一過性の恐怖体験を持続する記憶へ変える要所であること、非侵襲的な脳刺激でその過程に介入できる可能性が開かれた。不安やトラウマ関連障害の治療への応用が期待される。出典：Nature Communications","timestamp":1794614400000,"title":"Sensory cortical disinhibition underlies long-term fear memory in humans","titleJa":"恐怖の記憶は感覚野から生まれる――視覚野の脱抑制が長期記憶を形づくる","url":"https://www.nature.com/articles/s41467-026-79372-1"},{"authors":["Lynn V. Monrouxe"],"categories":[],"field":"Advances in Health Sciences Education","genre":"Ethics / Safety","monthKey":"2026-11","publishedAt":"2026-11-14T00:00:00Z","source":"Crossref","summaryHtml":"生成AIは学術不正の新しい形を生んだのではない。著者は、もっとも取り締まりの緩かった不正――手抜き――が、生き延びるための3つの性質を奪われたのだと論じる。手抜きは努力と結びつき、1本の論文に収まり、怠慢な誰かのものとして帰属できた。流暢な文章は偽るのにコストがかかったため「正直なシグナル」であり、査読の仕組みはそのコストの上に築かれていた。生成AIはそのシグナルを壊した。<br><br>壊れたのはそれだけではない。証拠の連鎖も損なわれている。捏造された主張が、実在する出典に結びつけて一度引用されることで、参照照合ではたどれないのに来歴を獲得する「引用ロンダリング」が起きる。医療専門職教育の研究では、読んでいない文献を引用したと認める著者もおり、生成AIの利用申告はほぼ未較正の道具だという。総合研究が指針を作り、指針がカリキュラムを作るため、捏造された主張はプロンプトから臨床のベッドサイドで教えられる内容へと伝わりうる。<br><br>査読の現場は検証を担う仕組みをもたず、責任はしばしば装備の乏しい査読者に押しつけられる。著者は、認知的な努力を書く行為から、意図を証明するのではなく実践を記述する、意図的な判断の行為へ移すべきだと結論づける。本論文自体も生成AIを使って作られ、努力と範囲と帰属を取り戻す開示の実例として提示されている。出典：Crossref","timestamp":1794614400000,"title":"A fair amount of slop: generative artificial intelligence and carelessness made cheap, unbounded and unattributable","titleJa":"かなりのスロップ――生成AIが「手抜き」を安く、際限なく、無署名にした","url":"https://doi.org/10.1007/s10459-026-10600-5"},{"authors":["Melissa G Zandstra","Metten Somers","Milou Angevaare","Tom Birkenhager","Birit F P Broekman","Rieky Dikmans","Philip van Eijndhoven","Milou A van Eldik","Eric van Exel","Frank L Gerritse","Johanna M Hegeman","Willemijn Heijnen","Rob M Kok","Dore Loef","Roel J T Mocking","Jasper O Nuninga","Mardien L Oudega","Didi Rhebergen","Jordy Rovers","Bart P F Rutten","Bart Schut","Iris E Sommer","Indira Tendolkar","Esmée Verwijk","Hanneke van Welie","Annemiek Dols","Floortje E Scheepers","Edwin van Dellen"],"categories":[],"field":"Journal of Affective Disorders","genre":"Neuroscience","monthKey":"2026-11","publishedAt":"2026-11-14T00:00:00Z","source":"PubMed","summaryHtml":"電気けいれん療法（ECT）は重症うつ病に有効だが、寛解しない例もあり、認知の副作用も懸念される。全体の重症度だけでなく、個々の抑うつ症状が予後を予測する手がかりになる可能性がある。オランダECTコンソーシアムの多施設コホートで、ハミルトンうつ病評価尺度とMADRSから統合した7症状について、ネットワーク解析で寛解（792人）と認知副作用（100人）との関連を調べた。<br><br>自殺念慮は寛解の確率低下（オッズ比0.77）と認知副作用の確率上昇（同1.34）の両方と関連し、ブートストラップでも頑健だった。食欲低下は寛解の確率上昇と、緊張・不安は認知副作用の上昇とそれぞれ関連した。既知の臨床予測因子の調整、別の寛解定義、多変量ロジスティック回帰による感度分析でも、自殺念慮と両転帰の関連、および緊張・不安と認知副作用の関連は支持された。<br><br>治療前の個々の症状がECTの転帰を予測しうることが示された。特に自殺念慮のある患者では、治療効果と副作用の両面で注意深いモニタリングと説明が重要になるという。出典：PubMed","timestamp":1794614400000,"title":"Baseline suicidal thoughts are associated with ECT non-remission and cognitive side effects: A network outcome analysis.","titleJa":"自殺念慮があるとECTは効きにくく副作用も多い――うつ病792人の多施設データが示す症状別の予後","url":"https://pubmed.ncbi.nlm.nih.gov/43033988/"},{"authors":["Jeffrey D Johnson"],"categories":[],"field":"PsyArXiv","genre":"Neuroscience","monthKey":"2026-11","publishedAt":"2026-11-13T19:09:50Z","source":"OSF Preprints","summaryHtml":"エピソード記憶は、出来事内の刺激同士や出来事と時空間文脈との結びつきで成り立ち、想起の探索を導く。関係記憶の神経基盤は広く調べられてきたが、連続する出来事の結びつきや、過去の時間の表象に想起がどう依存するかは十分に分かっていなかった。時間に沿った記憶の移動そのものが、脳内でどう表されているのかが問いだった。順方向と逆方向では、同じ記憶をたどる経路が違うはずである。<br><br>本研究は、単語リスト学習で直後の単語を思い出す順方向想起と、直前の単語を思い出す逆方向想起を、行動と脳波で直接比べた。想起の直前に記録した頭皮脳波を多変量パターン分類で解析し、熟慮と探索に関わる神経活動を区別した。手がかり語から次・前の単語を思い出す課題である。<br><br>行動成績をそろえても、高周波のガンマ帯振動が順方向と逆方向の想起を区別することが示された。時間の方向が記憶探索の神経動態に刻まれている証拠であり、系列想起や自由想起、過去と未来の時間表象の研究にもつながる。記憶の時間的な向きが脳波に表れるという新しい知見である。出典：OSF Preprints","timestamp":1794596990000,"title":"Traveling back and forth through time: oscillatory brain patterns distinguish directional cued recall","titleJa":"時間を往復する脳――順方向と逆方向の想起を分けるガンマ波","url":"https://osf.io/preprints/psyarxiv/v5w3f_v1/"},{"authors":["Irma Irayanti","Muhammad Dzaky Asrun","Salfira Az Zahra"],"categories":[],"field":"Journal of Applied Research in Higher Education","genre":"Ethics / Safety","monthKey":"2026-11","publishedAt":"2026-11-13T00:00:00Z","source":"Crossref","summaryHtml":"インドネシアのイスラーム大学で、持続可能性を環境管理や技術的な課題としてではなく、市民としての責任や公共の倫理、道徳的リーダーシップの問題としてどう位置づけ、実践しているかを調べた研究である。生態学的市民性、エコ神学にもとづく公共倫理、持続可能性を志向する学びが、大学のなかでどのように交渉されているかを問う。<br><br>2026年2月から5月にかけて、同大学で半構造化インタビュー、文書分析、限定的な授業観察を実施した。教員、持続可能性・教育の専門家、市民・持続可能性学習に関わる学部生ら18人が参加し、反射的テーマ分析で検討した。結果は三つの主題に整理された。第一に、持続可能性は環境管理ではなく、市民性や社会正義、集合的な説明責任と結びついた倫理的・公共的な責任として解釈されていた。第二に、対話的で参加型の学びを通じて、生態学的市民性とエコ神学の視点が教育的に意味を持ち、持続可能性志向の教授法の革新として機能していた。第三に、カリキュラムへの統合が断片的で制度的な制約や象徴的な取り組みにとどまり、大学内の変革はまだら模様だった。<br><br>著者らは、持続可能性の学びを強めるには、生態学的な問題を各科目の学習成果と結びつけ、地元の事例や構造化された議論、参加型の課題でエコ神学的な責任と市民的判断をつなぐことが有効だと示唆する。環境への配慮を宗教的な責任と公共の関心の両方として語る学びが、学生に社会正義や集合的責任とともに生態問題を考える機会を与えた。ただし一大学・18人という質的研究であり、授業での議論が持続的な市民参加につながるかは未検証だとする。技術中心の持続可能性の枠組みに、道徳的・公共的な視点を対置する論考である。","timestamp":1794528000000,"title":"Reimagining higher education through ecological citizenship and eco-theology: sustainability, public ethics and moral leadership in an Indonesian Islamic university","titleJa":"生態学的市民性とエコ神学で高等教育を再考する――インドネシアのイスラーム大学における持続可能性と公共倫理","url":"https://doi.org/10.1108/jarhe-05-2026-0886"},{"authors":["Bart A. Ellenbroek","Beth Naylor","Jiun Youn"],"categories":[],"field":"Behavioural Pharmacology","genre":"Psychedelics / Trauma","monthKey":"2026-11","publishedAt":"2026-11-13T00:00:00Z","source":"Crossref","summaryHtml":"シロシビンの治療効果は、急性の薬理作用そのものではなく神経可塑性の増強によると考えられているが、その根本的な仕組みは十分に解明されていない。本研究は、再生能力で知られる扁形動物プラナリアをモデルに、シロシビンが連合学習を高めるかどうかを条件性場所嗜好パラダイムで検証した。<br><br>5µMのシロシビンに1回曝露した後、光とショ糖を組み合わせる条件づけを5日間行ったところ、シロシビン投与群は対照群より光への嗜好の変化が有意に大きく、その効果は投与から少なくとも6日間持続した。無脊椎動物でもシロシビンが報酬連合学習を高めることが示された。<br><br>著者らは、サイケデリックによる神経可塑性が進化的に保存されたセロトニン作動性の仕組みを通じて働くという仮説を支持すると結論づける。プラナリアは神経系が単純でありながらセロトニン系を備えるため、薬物の学習への作用を切り分けて調べるモデルとして有用だとされる。ただしプラナリアという単純なモデルでの結果であり、ヒトの治療効果へ直接外挿するには注意が必要だとする。ヒトの臨床効果の神経基盤を考えるうえでの基礎的な知見である。","timestamp":1794528000000,"title":"Psilocybin enhances conditioned place preference learning in planarians","titleJa":"シロシビンがプラナリアの場所―報酬連合学習を高める――神経可塑性の進化的保存性を示す実験","url":"https://doi.org/10.1097/fbp.0000000000000903"},{"authors":["David Porter"],"categories":[],"field":"Frontiers in Psychology","genre":"Consciousness / Philosophy","monthKey":"2026-11","publishedAt":"2026-11-13T00:00:00Z","source":"Crossref","summaryHtml":"人間の意識はつねに逆説のなかにある。統一と分裂、自己と世界、意味と死を同時に意識すること――それが意識の常態であるにもかかわらず、心理学は逆説を存在の構造ではなく認知の葛藤として扱ってきた。本論文は「単一の二重性モデル(SDM)」を提唱し、意識を統合と分化のあいだで振動する自己反省的な場として捉え直す。不安、アイデンティティ、意味、超越といった心理現象はすべて、全体性と分離のあいだの再帰的な動きから生まれるという。<br><br>このモデルを臨床に翻訳したのが「逆説療法(PT)」である。相反する体験を解決も抑圧もせず、意識的に抱え込む「逆説の居住」を中心に据える。SDMは哲学・神学・心理療法における逆説の文献のなかに位置づけられ、ユングの超越機能やリネハンの弁証法的統合といった既存モデルと対比される。逆説を治療の障害ではなく、体験の存在論的な核心として捉え直す点が新しい。<br><br>SDMとPTは、人間の発達、苦しみ、変容を理解するための統一的な言語を提供する。理論心理学、実存的現象学、意識研究のあいだに橋を架け、21世紀の意味づけのための枠組みを更新しようとする試みである。逆説を解消すべき問題ではなく、意識そのものの働きとして受け止める視点は、不安やアイデンティティの揺らぎを理解する手がかりになるだろう。出典：Crossref","timestamp":1794528000000,"title":"The singular duality model: paradox, consciousness, and the foundations of psychological integration","titleJa":"単一の二重性モデル――逆説、意識、そして心理的統合の基盤","url":"https://doi.org/10.3389/fpsyg.2026.1737145"},{"authors":["Henry Pollard"],"categories":[],"field":"Frontiers in Research Metrics and Analytics","genre":"Ethics / Safety","monthKey":"2026-11","publishedAt":"2026-11-13T00:00:00Z","source":"Crossref","summaryHtml":"AIは研究の連絡・支援の域を越え、結果を左右する研究機能そのものを担い始めている。だがガバナンスは、利用後の開示に注目しがちで、委譲するかどうかの事前の判断には目が向いていない。本論文は、定義された研究機能をAIに委ねるべきか、いつ、どのような統制の下で委ねるかを事前に判断するための「12の関門」からなる委譲・リスク管理枠組みを提案する。<br><br>枠組みはAI・機能・文脈の具体的な組み合わせを評価し、目的、許可、課題の定義を、固有のリスク、課題固有の妥当性、信頼性、人間の統制、統制の有効性、残余リスク、出所、報告、説明責任へと結びつける。中心的な区別は「支援」と「委譲」である。委譲とは、AIが本来は独立した人間の判断を要する機能を果たすか、重大な研究判断を実質的に決定する場合を指す。<br><br>委譲そのものをガバナンスの判断として扱い、証拠と統制をリスクに見合ったものにする姿勢は、提案評価や機関ガバナンス、監視設計といった既存の枠組みを補う。AI研究ノートによる出所の記録や、AIによる誤り監視と外部検証の区別も具体化した。研究者、機関、編集者、ガバナンス機関がどこまで任せてよいかを決める実践的な指針になる。出典：Crossref","timestamp":1794528000000,"title":"Delegating research functions to artificial intelligence: a risk-control framework for validation, human control and accountability","titleJa":"研究機能のAIへの委譲――検証・人間の統制・説明責任のためのリスク管理枠組み","url":"https://doi.org/10.3389/frma.2026.1994953"},{"authors":["Alexander Maier"],"categories":[],"field":"OSF Preprints","genre":"Consciousness / Philosophy","monthKey":"2026-11","publishedAt":"2026-11-13T00:00:00Z","source":"Crossref","summaryHtml":"意識の神経科学の最終的な目標は、意識体験（クオリア）とそれを支える脳状態の関係を導き出すことだ。意識の神経相関（NCC）を特定することや、意識体験の構造を記述することだけでは足りず、特定の神経状態や神経メカニズムと特定の意識体験を結びつける必要がある。科学における二つの現象の関係づけは、しばしば数式のような数学的写像の形をとる。本論文は、意識状態と脳状態の間にも同じような写像が存在しうるという展望のもと、関連する実証研究を整理する。<br><br>レビューはまず、神経のスパイク活動を意識内容へ写像する研究を概観する。意識の「橋渡し地点」としてのNCCを探す先駆的なパラダイムと、心理測定関数と神経測定関数を結びつける「橋渡し法則」を探すパラダイムを対比する。さらに、意識体験の構造記述と神経活動の構造記述を写像によって結ぶ試みが、両方のパラダイムをどのように補強するかを検討する。<br><br>意識研究を「相関の発見」から「法則の定式化」へ進めるための枠組みを提示するもので、クオリアと脳状態の対応関係を数学的に記述する道筋を示している。出典：Crossref","timestamp":1794528000000,"title":"Mathematical Relationships Between Brains and Consciousness","titleJa":"脳と意識の数学的関係――クオリアと脳状態を結ぶ写像を求めて","url":"https://doi.org/10.31234/osf.io/k46ad"},{"authors":["Najma Cherrad","Georgios Foustoukos","Laura MJ Fernandez","Alejandro Osorio-Forero","Julie Buron","Nadine Eliasson","Yann Emmenegger","Paola Milanese","João Pedro Ferreira Morais","Virginie Mansuy-Aubert","Paul Franken","Anita Lüthi"],"categories":[],"field":"Nature Communications","genre":"Neuroscience","monthKey":"2026-11","publishedAt":"2026-11-13T00:00:00Z","source":"Nature Communications","summaryHtml":"副交感神経の活動は回復的な睡眠に欠かせないが、迷走神経の感覚性求心路が睡眠と覚醒の脳・身体相関をどう形づくるかは未解明だった。本研究はマウスで迷走神経感覚ニューロン（VSN）を化学遺伝学的に刺激し、脳波・筋電図、心拍数、脳・身体温、ノルアドレナリン作動性の青斑核（LC）ニューロン集団の活動を同時に計測した。<br><br>休息期のVSN刺激は、徐波（0.75〜4 Hz）成分に富み恒常性に制御されたノンレム睡眠様状態を誘発し、レム睡眠を抑制した。同時に脳・身体温は低下したのに、LC活動は上昇した。外部から温めると正常なノンレム・レム睡眠サイクルへの回復が加速し、体温低下が重要な寄与因子であることが分かった。<br><br>睡眠様の脳波・徐脈・体温低下と、覚醒を促す前脳へのノルアドレナリン調節が共存するという、従来は両立しないとされた睡眠と覚醒の特徴が一つの状態に現れることを示した。睡眠と覚醒を分ける境界が末梢からの信号によって揺らぐことを示し、意識状態の制御における身体からの入力の重要性を裏づける成果である。出典：Nature Communications","timestamp":1794528000000,"title":"Vagal afferent activation induces a dissociated NREM sleep-like state with wake-related locus coeruleus activity","titleJa":"迷走神経の活性化がもたらす解離したノンレム睡眠様状態――眠りながら覚醒する脳","url":"https://www.nature.com/articles/s41467-026-79135-y"},{"authors":["Gaetano Rametta"],"categories":[],"field":"Nóema","genre":"Consciousness / Philosophy","monthKey":"2026-11","publishedAt":"2026-11-13T00:00:00Z","source":"Crossref","summaryHtml":"意識と意味（センス）の関係は、ドゥルーズの超越論的哲学における中心問題の一つである。『意味の論理学』を手がかりに、特異性・意味・出来事の概念が、非人称的で前個体的な超越論的場の基盤として検討される。フッサールの現象学と、サルトル『自我の超越』における意識論との対話を通じて、この構想が問い直される。論文は、超越論的な場を自我の座ではなく、意味と出来事の生成の場として捉え直す。<br><br>ドゥルーズの読みでは、意識への訴えはつねに超越論的自我の存在を前提するとされる。だが本論文は、フッサールの『論理学研究』第5研究と若きサルトルの再読により、意識を自我とは別のものとしてではなく、自己組織化する非人称的な場として考える道を開く。自我なき意識という構想である。<br><br>そこから浮かび上がるのは、内在の原理を捨てることなく意識を位置づける、超越論的場の別の構想である。意識を主観の所有物ではなく、出来事と意味が織りなす場そのものとして捉え直す試みであり、心の哲学と現象学の接点に重要な新たな視点を与える。出典：Crossref","timestamp":1794528000000,"title":"Between Consciousness and Sense","titleJa":"意識と意味のあいだ――ドゥルーズの超越論的場を問い直す","url":"https://doi.org/10.54103/2239-5474/32766"},{"authors":["Lana K. Porter","Ece Kaya","Kamlesh Chalise","Janina Klarmann","Armin Goffin","Muad Abd El Hay"],"categories":[],"field":"bioRxiv","genre":"Psychedelics / Trauma","monthKey":"2026-11","publishedAt":"2026-11-13T00:00:00Z","source":"bioRxiv","summaryHtml":"過呼吸を伴う呼吸法（HVB）は、薬物を使わずにサイケデリクス体験に似た変性意識状態を引き起こすことが知られている。だがセッション中の神経活動と主観体験がどう連動するのかは未解明だった。呼吸だけで薬物に匹敵する意識変容が起きる仕組みは、長く謎のままだった。本研究は経験豊富な実践者25名を対象に、自然なHVBセッションの合間に安静時記録を挟み、64チャンネルEEGと体験の深さ・内容を追跡した。<br><br>その結果、HVBが引き起こす神経動態は古典的サイケデリクス状態の最も頑健な神経署名をなぞることが分かった。時間構造のゆるみ――広帯域の皮質脱同期、信号複雑性の増加、アルファ波（8〜13Hz）パワーの低下――と、空間構造の再編――皮質処理階層の平坦化――である。これらの効果は分単位の解像度で主観的な体験の深さと直接相関した。<br><br>音楽聴取や能動的内受容といったHVBの個別要素だけでは説明できないことも示された。薬物によらない経路でもサイケデリクス的な皮質状態に到達できること、誘導法を問わず共通する変性意識状態の神経的特徴が存在することが示唆される。出典：bioRxiv","timestamp":1794528000000,"title":"Neural and Experiential Dynamics of High-Ventilation Breathwork Mirror Psychedelic States","titleJa":"高換気呼吸法の神経・体験ダイナミクスはサイケデリクス状態を映し出す","url":"https://www.biorxiv.org/content/10.64898/2026.11.11.765965"},{"authors":["Xin Cheng","Meiqi Song","Hu Zhao","Xiaojing Ye"],"categories":[],"field":"Legal Medicine Research","genre":"Psychedelics / Trauma","monthKey":"2026-11","publishedAt":"2026-11-13T00:00:00Z","source":"Crossref","summaryHtml":"トラウマに関する語りは、出来事の感情的な意味や中心的な意義を伝えながらも、いつ・どこで・どのように起きたかという具体的な詳細を欠くことがある。本総説は「記憶の般化」という概念を手がかりに、このばらつきを解釈するための神経認知的な枠組みを法精神医学的評価に向けて提示する。<br><br>海馬のパターン分離とパターン完成、前頭前野と扁桃体・分界条床核との相互作用、記憶アンサンブル間の重なりや脅威への反応を形づくる細胞・分子レベルの過程に関する知見を統合する。さらにトラウマ関連の精神病理、反復体験、遅延や繰り返しの想起、事後情報が、自伝的記憶の特異性やエピソードの区別、情報源の帰属にどう影響するかを検討する。<br><br>自伝的想起や記憶弁別、恐怖の般化、情報源記憶を測る行動課題は、これらの過程を相補的に調べる手段になる。機能的画像や電気生理、分子レベルの指標も手がかりになるが、集団レベルの知見だけでは個人の語りの正確さを断定できない。法実務への応用には信頼できる課題や規範データ、誤差率の把握が不可欠だと結論づけている。出典：Crossref","timestamp":1794528000000,"title":"Memory generalization: neural mechanisms and implications for trauma-related accounts in forensic psychiatry","titleJa":"記憶の般化――トラウマの語りのばらつきを読み解く神経認知の枠組み","url":"https://doi.org/10.20517/lmr.2026.12"},{"authors":["Vuyisile Msila"],"categories":[],"field":"The International Journal of Interdisciplinary Civic and Political Studies","genre":"Consciousness / Philosophy","monthKey":"2026-11","publishedAt":"2026-11-13T00:00:00Z","source":"Crossref","summaryHtml":"1973年のダーバン・ストライキは「ダーバン・モーメント」とも呼ばれ、南アフリカの政治地図を大きく塗り替えた労働不安の高まりだった。アパルトヘイト体制下でアフリカ人労働者が労働条件の改善を勝ち取ったことが最大の意義であり、政府は自発的で無統制な紛争の連鎖と見なして動揺した。本稿はその思想的意義をいま問い直す。<br><br>ストライキは職場の不満を超え、やがてアパルトヘイトへの政治闘争と結びついた。一見自発的に見えたが、組織化されていない労働者たちは集団的な決意で構造的不正義に挑んだ。本論文は、ブラック・コンシャスネス運動（BCM）の思想的影響と組織的な推進力がなければ、黒人労働者は広範な社会・経済闘争へ効果的に動員されなかっただろうと論じる。<br><br>ブラック・コンシャスネス哲学は労働者の連帯と地域の動員を鼓舞するうえで決定的な役割を果たした。労働運動は職場の要求を超え、社会変革の触媒になりうる。ダーバン・ストライキは解放闘争における抵抗と成功の新たな現場を示し、政治的動員と産業的動員が不可分であることを浮き彫りにした。出典：Crossref","timestamp":1794528000000,"title":"The Role of Black Consciousness Philosophy in the 1973 Durban Strikes","titleJa":"ブラック・コンシャスネス哲学と1973年ダーバン・ストライキの役割","url":"https://doi.org/10.18848/2327-0071/cgp/a175"},{"authors":["Mélody Boudilmi","Lauriane Landais","Tamara Guenoun","Barbara Smaniotto","Svetoslava Urgese","Aziz Essadek"],"categories":[],"field":"Trauma, Violence, & Abuse","genre":"Psychedelics / Trauma","monthKey":"2026-11","publishedAt":"2026-11-13T00:00:00Z","source":"Crossref","summaryHtml":"消防士や警察官、救急隊員らファーストレスポンダーは、直接・間接にトラウマへ繰り返しさらされる。しかしその影響を指す言葉――二次的外傷性ストレス、代理トラウマ、共感疲労、心的外傷後ストレス障害――は現場でも研究でも混同されがちだった。本レビューはPsycINFO、PubMed、Web of Scienceなど6つのデータベースを2026年1月まで調べ、PRISMAの指針に沿って76件の査読付き研究を抽出し、これらの概念の整理を試みた。2人の研究者が抽出と質の評価を担った。<br><br>分析の結果、概念の境界は症状の重なりや、他の職種向けに作られた測定道具の限界によって曖昧に保たれていることが分かった。トラウマの発生には、さらされる出来事の性質や累積的な負担、個人の経験や職務上の役割に加え、組織的な制約が中心的な役割を果たすことも示された。曝露のあり方を切り分けて考えることの重要性が浮かび上がる。<br><br>著者らは、ファーストレスポンダーのトラウマ曝露を公衆衛生の問題として捉えるべきだと結論づける。言葉の整理は、支援や予防の設計の出発点になるという指摘である。出典：Crossref","timestamp":1794528000000,"title":"Toward a Definition and Differentiation of Secondary Traumatic Stress, Vicarious Trauma, Post-Traumatic Stress, and Compassion Fatigue in Relation to First Responders: An Integrative Literature Review","titleJa":"二次的外傷性ストレスと共感疲労――消防・警察・救急の現場で言葉を整理する","url":"https://doi.org/10.1177/15248380261476699"},{"authors":["Ashraf Fatehi Al-Rai","Ahmed Ibrahim Hassan","Mohamad Albakjaj","Maya Khater"],"categories":[],"field":"Interpersona An International Journal on Personal Relationships","genre":"Ethics / Safety","monthKey":"2026-11","publishedAt":"2026-11-13T00:00:00Z","source":"Crossref","summaryHtml":"人工知能は脱税の手口にも、税務行政の側にも影響を及ぼし始めている。本研究はAI技術と脱税の関係を調べ、脱税の多様な形態、関連する法制度と経済的影響、そして新興デジタル技術がもたらす規制上の課題を検討する。個人や組織が高度なAIシステムを使って脱税を容易にしたり実行したりする能力が高まっていることが問題の出発点である。<br><br>研究は記述的・分析的手法と批判的法学アプローチを用い、AIが脱税にどう関わるかを包括的に把握しようとした。分析の結果、AIはデータ分析や不正検出、自動監査、コンプライアンス監視を通じて税務管理の効率を高めうる一方で、高度な脱税スキームの構築にも使われ、歳入減少や財政赤字、投資の縮小、所得格差の拡大につながりうることが示された。<br><br>著者らは、政府がデジタル時代に対応して税法を更新し、データを保護し、人材を育成し、AIを活用した税務プラットフォームを導入して持続可能で効果的な税務ガバナンスを支えるべきだと提言する。AIによる脱税は従来型の脱税の技術的変形ではなく、帰属やデジタル証拠、データガバナンス、人の監督をめぐる規制課題だと位置づけられる。出典：Crossref","timestamp":1794528000000,"title":"Artificial Intelligence and tax evasion: legal and economic challenges in the digital era","titleJa":"AIと脱税――デジタル時代の法的・経済的課題","url":"https://doi.org/10.54899/iij.v20i4.1392"},{"authors":["Ishika K. Kanakath"],"categories":[],"field":"Frontiers in Neuroscience","genre":"Neuroscience","monthKey":"2026-11","publishedAt":"2026-11-13T00:00:00Z","source":"Frontiers in Neuroscience","summaryHtml":"筋電・神経義肢は実験室では成功しても、日常の臨床利用ではしばしば失敗する。この翻訳の溝はドメインシフトが原因で、神経可塑性や運動学習、筋疲労、電極のずれによって生体信号が非定常になることが背景にある。本レビューは、ドメインシフトの神経生理学的・技術的な起源を総合し、それに対応するアルゴリズム戦略を評価する。<br><br>ドメインシフトは、セッション間のドリフトや解剖学的な個人差など、生物学的過程と技術的過程が結びついて生じる。対策として、閉ループのデコーダ適応、適応フィルタ、アンサンブルモデリング、強化学習、転移学習などがあり、それぞれ適応速度とシステム安定性のバランスが異なる。とりわけ重要なのは、デコーダの更新が進行中の神経・運動可塑性と直接やり取りする「共適応システム」である。<br><br>利用者を受動的な信号源とみなすと長期的な制御は限られる。利用者を能動的な学習パートナーとみなすことが必要だ。複数の適応戦略を、生物学的な時間尺度を尊重する翻訳神経工学の枠組みに統合することで、義肢の長期的な放棄を減らし、臨床で使える頑健な支援神経技術へつながると結論づける。出典：Frontiers in Neuroscience","timestamp":1794528000000,"title":"Co-adaptive learning and domain adaptation bridge the translational gap in neuroprosthetic control: a review","titleJa":"神経義肢の臨床応用へ――共適応学習とドメイン適応のレビュー","url":"https://www.frontiersin.org/articles/10.3389/fnins.2026.1974861"},{"authors":["Bhargavi Anumula","Anil V. Turukmane"],"categories":[],"field":"Frontiers in Artificial Intelligence","genre":"Ethics / Safety","monthKey":"2026-11","publishedAt":"2026-11-13T00:00:00Z","source":"Frontiers in Artificial Intelligence","summaryHtml":"音声ディープフェイクは音声認証や音声システムのセキュリティ上の脅威になっている。本論文は、感情の手がかりを組み込んだ深層学習フレームワーク「Enhanced FusionNet」を提案する。Log-Melの音響表現にMultiScaleCNN、双方向LSTM、マルチヘッドクロスアテンション、残差特徴融合、適応ゲート融合を組み合わせ、真正音声と合成音声を識別する。<br><br>感情表現はRAVDESSデータセットから話者非依存のエンコーダで別途学習し、FoRデータセットによる検出に転移させた。独立したホールドアウト試験では精度98.67％、ROC-AUC 99.88％を達成し、5分割交差検証でも平均精度99.08±0.35％と高い安定性を示した。アブレーションにより各構成要素の寄与も確認されている。<br><br>ただし感情表現の転移は補完的な情報を与えたものの、評価プロトコル下では全体の検出性能をさらに押し上げなかった。著者らはベンチマーク条件での有効性を示しつつ、感情の手がかりが常に上積みになるわけではない点も率直に報告している。音声ディープフェイク対策の設計指針となる成果である。出典：Frontiers in Artificial Intelligence","timestamp":1794528000000,"title":"Enhanced FusionNet: a deep learning structure for multimodal input-based emotion-aware deepfake speech identification","titleJa":"感情の手がかりで音声ディープフェイクを見破る――Enhanced FusionNet","url":"https://www.frontiersin.org/articles/10.3389/frai.2026.1978052"},{"authors":["Yanke Song","Shuo Chen","Chris Rockwell","Guande He","Nan Liu","Desai Xie","Tianpei Gu","Yong-Hyun Park","Aryan V S","Dennis Yuren Menn","Ming-Hsuan Yang","Xun Huang"],"categories":["cs.CV"],"field":"cs.CV","genre":"Vision / Multimodal","monthKey":"2026-11","publishedAt":"2026-11-12T18:59:55Z","source":"arXiv","summaryHtml":"最先端の動画生成モデルは、動画を空間・時間の両方向で圧縮するVAEの潜在空間で動作してきた。圧縮は学習を現実的にしたが、高解像度化や細かな制御、対話的な生成の妨げになっていた。解像度を2倍にすればトークン数は4倍になり、条件はフレーム群まとめてしか適用できず、応答も複数フレームのブロックが揃うまで待たねばならない。本論文は学習済みの潜在動画モデルを画素空間へ引き上げる手法「PixVid」を提案する。<br><br>PixVidは拡散トランスフォーマーをそのままに、VAEデコーダーを畳み込みヘッドに置き換え、すべてのフレームを画素空間で直接生成する。速度ではなくクリーンな動画を予測することと、ノイズシフトを大きく取ることが品質の鍵だった。Wan2.1-14Bからファインチューニングし、約130万クリップで潜在ベースラインと競合する性能を示した。<br><br>フレーム単位で画素を扱うため、同じフレームあたりトークン数で2倍の解像度を生成でき、速い動きの下でも深さ条件付きの動画編集がずれず、操作への応答も次のフレームで返せる。動画生成を潜在空間から画素空間へ戻すことで、制御性と即応性を両立させる試みである。出典：arXiv","timestamp":1794509995000,"title":"Back to Pixels: Lifting Latent Video Diffusion into Pixel Space","titleJa":"動画生成を潜在空間から画素空間へ――フレーム単位で描くPixVid","url":"https://arxiv.org/abs/2611.17336"},{"authors":["Ellis Brown","Chris Hoang","Shengyi Qian","Shang-Wen Li","Mike Lewis","Marjan Ghazvininejad","Luke Zettlemoyer","Lucas Beyer","Mengye Ren","Jakob Verbeek","Saining Xie","Hu Xu"],"categories":["cs.CV","cs.LG"],"field":"cs.CV","genre":"Vision / Multimodal","monthKey":"2026-11","publishedAt":"2026-11-12T18:59:54Z","source":"arXiv","summaryHtml":"マルチモーダル言語モデルが視覚入力をどう符号化すべきかは未解決だ。多くは事前学習済みの視覚エンコーダを使い、言語モデルと一緒に学習させる手法や、エンコーダをなくす手法も現れている。視覚エンコーダは三つの設計選択を束ねている。事前学習由来の視覚的先行知識、専用の視覚容量、そして融合前に置く配置である。既存モデルはデータも構造も計算量も異なるため、各選択の効果を分離できない。<br><br>本研究は全モデルを共通データでゼロから事前学習し、生涯計算量を揃えて比較する統制された枠組みで三つを切り分けた。視覚的先行知識は必須ではなく、共同学習したエンコーダは事前学習済みと同等だった。決定的だったのは専用の視覚容量で、エンコーダなしのモデルは骨格を同量だけ大きくしても視覚理解で劣った。ただし容量は融合前に置く必要はなく、骨格の初期層に融合内で加えた視覚専用モジュールが同等で、初回トークンまでの時間も短縮できた。<br><br>結果は骨格サイズを変えても、エンコーダ事前学習を無料とみなしても、事前学習済み言語モデルから始めても成り立つ。視覚容量の専用化こそが重要で、配置の自由度は設計の幅を広げる。マルチモーダル設計の指針を示す研究である。出典：arXiv","timestamp":1794509994000,"title":"Unbundling Multimodal Vision Encoding","titleJa":"マルチモーダル視覚符号化の分解――視覚容量こそが決め手","url":"https://arxiv.org/abs/2611.17334"},{"authors":["Jie Wang","Tong Zhu","JiaHao Kuang","Zhe Xu","Yunkai Chai","Dehong Zheng","Yu Cheng","Tao Ji","ZhouHan Lin","Qi Zhang","Bowen Zhou"],"categories":[],"field":"cs.CL","genre":"LLM / NLP","monthKey":"2026-11","publishedAt":"2026-11-12T18:59:52Z","source":"arXiv","summaryHtml":"大規模言語モデルのアーキテクチャは、モデルのスケーリングの挙動や学習効率、推論コストを左右する中心的な研究対象だが、産業界ではDeepSeekやQwen、Kimiなどのチームが導入した工夫のうち何が成功し何が捨てられたかが公開されにくく、学術界では計算資源や評価基準のばらつきから小規模で単発の比較にとどまりがちだ。<br><br>本研究はこうした隔たりを埋める公開プラットフォームArchSpaceを提案する。各提案を実験と推論の記録とともに登録し、コミュニティが査読し、後の研究が参照できる仕組みで、コストの高い大規模学習の前にスケーリング則で大規模時の損失を予測して着想を評価する。Qwen3.5とOLMo3のベースライン、適合させたスケーリング則、再利用可能な学習レシピを初期参照として用意した。<br><br>査読を経て検証された着想は新たなベースラインとなり、次世代モデルを形づくる発想の幅を広げることを目指す。産業界の暗黙知と学術界の検証を同じ土俵に載せ、アーキテクチャ研究の知見を蓄積し共有する基盤として設計されている。出典：arXiv","timestamp":1794509992000,"title":"ArchSpace: Recording, Reviewing, and Referencing LLM Architecture Research","titleJa":"LLMアーキテクチャ研究を記録・査読・参照する公開プラットフォームArchSpace","url":"https://arxiv.org/abs/2611.17332"},{"authors":["Chin-Yang Lin","Ryo Hachiuma","Jaesung Choe","Min-Hung Chen","Yu-Chiang Frank Wang","Yen-Yu Lin","Wei-Chen Chiu","Yu-Lun Liu","Cheng Sun"],"categories":["cs.CV"],"field":"cs.CV","genre":"Vision / Multimodal","monthKey":"2026-11","publishedAt":"2026-11-12T18:59:52Z","source":"arXiv","summaryHtml":"KVキャッシュ付きのデコーダのみの大規模視点合成モデル（LVSM）は、3D形状を再構成せずに新しい視点を回帰することで最高水準の品質を達成してきた。一方、テスト時学習（TTT）の層は計算を節約する代わりに品質を犠牲にする。本論文は、複数視点のアテンションから得た場面全体の情報を軽量MLPへ「焼き付ける」手法TTBを提案する。<br><br>第一の鍵は、TTTの高速重みMLPを流用し、アテンションの入出力ペアから複数視点間のアテンション写像そのものを明示的に学ばせることだ。アテンションを置き換えるのではなく学ぶことで、TTT並みの描画効率を保ちながら大幅に高い品質を実現する。第二の鍵は、文脈の前処理と新視点の描画の間のモダリティのずれを解消するため、文脈トークンをカメラ情報のみのものと画像内容を含むものに分離することだ。<br><br>複数のベンチマークで最大23倍の描画高速化を達成し、品質は最高水準と同等だった。3D再構成なしで高速・高精細な新視点合成を両立させる道が開かれ、実時間の視点合成や没入型メディアへの応用が期待される。出典：arXiv","timestamp":1794509992000,"title":"TTB: Test-time Baking for Efficient Rendering of Decoder-only View Synthesis Models","titleJa":"「焼き付け」で速く美しく――新視点合成を軽くするTTB","url":"https://arxiv.org/abs/2611.17331"},{"authors":["Guangyuan Sui","Yunzhong Hou","Chi Harold Liu"],"categories":["cs.RO","cs.CV"],"field":"cs.RO","genre":"Agents / Robotics","monthKey":"2026-11","publishedAt":"2026-11-12T18:59:49Z","source":"arXiv","summaryHtml":"言語指示でドローンを誘導する視覚言語航行（VLN）は、3Dの動き予測のわずかな誤差が衝突や航行ミスにつながる難題だ。実行の結果を3D環境で思い描けない既存手法は、言語指示から正確な経由点を予測するのに苦労してきた。ドローンの航行では、小さな予測のずれがそのまま衝突につながるため、言葉の指示と見える景色を正確に結びつける仕組みが欠かせない。本論文は「プロトタイプ視覚想像」にもとづく枠組みProtoVis-Navを提案する。<br><br>モデルはまず、次に進むべき場所の局所的な視覚表現を「想像」する。特徴プロトタイプを予測し、その線形結合で目標領域の視覚特徴を推定するのだ。想像した視覚表現を文脈として最終行動を生成することで、視覚文脈と経由点の出力の整合が高まる。行く先の見え方を先に思い描いてから動く、という人間の進み方に近い推論をモデルに組み込んだ形だ。<br><br>広範な実験で既存のベースラインを大きく上回る性能が示された。ドローンが言葉の指示を、見える景色と結びつけて理解する仕組みが具体化し、災害調査や点検、物流など自律飛行の応用が期待される。出典：arXiv","timestamp":1794509989000,"title":"ProtoVis-Nav: Prototypical Visual Imagination for Visual-Spatial Aligned UAV Navigation","titleJa":"ドローンは「想像」して飛ぶ――視覚と言語を結ぶ航行モデル","url":"https://arxiv.org/abs/2611.17330"},{"authors":["Felix O'Mahony","Daniel Olmeda Reino","Roberto Cipolla","Ayush Tewari"],"categories":["cs.CV"],"field":"cs.CV","genre":"Vision / Multimodal","monthKey":"2026-11","publishedAt":"2026-11-12T18:59:09Z","source":"arXiv","summaryHtml":"動画拡散モデルは見た目の質では優れているが、物理的におかしい動きを生みやすい。従来の設定では物理的な推論のすべてを拡散過程の中で同時に行わなければならず、それが破綻の原因だった。本論文は物理推論の役割を、言語モデルに支えられたキーフレーム生成モジュールへ移す手法「K2V」を提案する。<br><br>キーフレーム生成では言語による明示的な推論が働き、動画の重要な瞬間の見た目を細かく制御できる。キーフレームは言語で書かれた物理の筋書きとして働き、各場面で何が起きるべきかを明示する。生成されたキーフレームを条件として動画生成モデルに渡すことで、拡散モデルの役割は物理的に正しい中間状態のあいだを補間するだけの単純な作業になる。全体の系列を拡散だけで推論する必要がなくなる。<br><br>その結果、物理的正確さを測るベンチマークPhysics-IQ VerifiedとPhyGenBenchで従来手法を大きく上回り、最先端の性能を達成した。言語モデルの推論力と拡散モデルの生成力を分業させることで、見た目だけでなく物理的にもっともらしい動画生成へ近づく試みである。出典：arXiv","timestamp":1794509949000,"title":"K2V: Generative Keyframing For Physically Plausible Video Generation","titleJa":"物理的に正しい動画生成へ――言語モデルが描くキーフレーム「K2V」","url":"https://arxiv.org/abs/2611.17324"},{"authors":["Ethan Lin","Akanksha Sarkar","Ziang Liu","Kristin Branson","Jennifer J. Sun"],"categories":["cs.AI","cs.LG"],"field":"cs.AI","genre":"Agents / Robotics","monthKey":"2026-11","publishedAt":"2026-11-12T18:59:06Z","source":"arXiv","summaryHtml":"機械学習を新しい分野に持ち込むとき、ラベル付きデータの確保とパイプラインの手作業が壁になる。ラベル付きデータは乏しいのにラベルなしデータは豊富にある現実的な状況で、機械学習パイプラインを自動設計するMLEエージェントがどこまで使えるかは、これまで検証されてこなかった。本研究は半教師あり学習をプログラム探索の問題として捉え直し、エージェントが限られた監督のもとでどう振る舞うかを調べた。<br><br>弱いフィードバックと同等の計算量でも、エージェントは既存の半教師あり学習手法を組み合わせ・適応させたコードを合成し、12設定中8設定で人間が設計した最強のベースラインを最大21.8%上回った。一方で、プログラム選択が大きなボトルネックになることも判明した。エージェント自身の評価指標で選ぶと性能が最大47%落ちる。研究チームはこの問題を体系的に調べるため、エージェント生成と人間設計のプログラム計16,977件を集めたベンチマークProgramSelectBenchを構築し、教師なし選択と能動的選択の手法を評価した。<br><br>さらに現実の生態学の検出タスクにも適用し、制御された環境の外でもエージェント発見の戦略が移転する可能性と課題を示した。ラベルなしデータを活かすエージェントは、データの乏しい現場で機械学習を広げる道を開く一方、どのプログラムを採用するかの判断が今後の鍵になる。出典：arXiv","timestamp":1794509946000,"title":"AgentSSL: Can MLE Agents Leverage Unlabeled Data?","titleJa":"ラベルなしデータを活かせるか――機械学習エージェントの半教師あり学習","url":"https://arxiv.org/abs/2611.17323"},{"authors":["Minhae Oh","Jeonghye Kim","Jinwoo Koo","Yeongoon Kim","Jimin Seo","Minsik Seol","Jungwoo Lee"],"categories":["cs.CL"],"field":"cs.CL","genre":"LLM / NLP","monthKey":"2026-11","publishedAt":"2026-11-12T18:58:50Z","source":"arXiv","summaryHtml":"拡散言語モデルは再マスクで生成文を修正できるが、修正には「いつ」「何を」直すかの判断が要る。数独での診断から二つの弱点が見つかった。隠れ状態には誤りの情報が含まれているのに、トークンの確信度はそれを確実に表さず、孤立した誤りを直しても周囲の文脈が固定されたままでは同じ誤りが再現される。<br><br>そこで提案されたのが検証器DiVRである。部分的に生成された系列が正解に到達するかを予測し、モデル自身の軌跡の最終的な正誤から学習する。DiVRはブロックを再生成すべきタイミングと、残すべき代替案の両方を決め、生成器そのものは変更しない。検証器を分離した設計のため、既存の生成器に後付けできる点も利点である。<br><br>5つの推論ベンチマークでLLaDA-8B-Baseに適用すると、微調整済み生成器の平均正答率は35.3%から43.4%へ上がり、コストは貪欲デコードの1.9〜3.5倍にとどまった。探索ベースラインの3.8〜7.4倍を下回る効率である。教師あり微調整や強化学習とも相補的で、Dreamを含む他の生成器にも汎化する。出典：arXiv","timestamp":1794509930000,"title":"Learning When Diffusion Language Models Should Regenerate","titleJa":"拡散言語モデルはいつ再生成すべきか――検証器が導く修正のタイミング","url":"https://arxiv.org/abs/2611.17320"},{"authors":["Ethan Lin","Yang Song"],"categories":["cs.CV"],"field":"cs.CV","genre":"Vision / Multimodal","monthKey":"2026-11","publishedAt":"2026-11-12T18:58:36Z","source":"arXiv","summaryHtml":"空間知能には、目にした光景を環境の幾何や物体、持続する状態と結びつける能力が要る。画像だけではこうした関係は暗黙のままで、ばらばらの注釈では見た目とカメラの動き、場面変化を共通の基準で扱えない。本研究は、家具付き住宅の3Dシーン構成5,280件を集めたデータセット「Spatial Foundry」を提案し、視覚・幾何・時間の情報を一つの基準で結びつける。<br><br>間取り図、透視・パノラマRGB、メートル単位の深度、点群、メッシュ、物体単位の3Dバウンディングボックス、映像と対になったカメラ軌跡を備え、共通のシーン座標が視点や時間をまたいで観測をつなぐ。編集可能なシーンからは新たなカメラ経路や物体変化も作れるため、同じ部屋の見え方を系統的に変えながら学べる。<br><br>間取り条件付き3D生成、幾何再構成、物体単位の知覚、カメラ条件付き動画生成、共有ワールドモデル、シーン編集への応用が示され、制御されたカメラ・場面変化が空間知覚とワールドモデルの研究を支える。公開ページでは動画と色付き点群のプレビューが見られる。出典：arXiv","timestamp":1794509916000,"title":"Spatial Foundry: A Multimodal Dataset for Spatial Intelligence","titleJa":"空間知能の土台――5,280の3D住空間がつなぐ視覚・幾何・時間","url":"https://arxiv.org/abs/2611.17318"},{"authors":["Christopher Liaw","Aranyak Mehta","Grigoris Velegkas","Felix Zhou"],"categories":["cs.DS","cs.AI","cs.LG","stat.ML"],"field":"cs.DS","genre":"LLM / NLP","monthKey":"2026-11","publishedAt":"2026-11-12T18:58:22Z","source":"arXiv","summaryHtml":"プロンプトの一部を取り除くとモデルの出力がどう変わるか――これが文脈帰属の問いである。nトークンのプロンプトで全てのleave-one-out値を直接計算するにはn回のモデル評価が必要になる。本研究は安定性の仮定のもと、評価回数を大幅に減らして全ての帰属値を推定するアルゴリズムを示した。<br><br>提案手法は誤差εに対してO(√log(1/ε)/ε)回の評価で全てのleave-one-out値を推定し、オラクルモデルにおける下限も同じオーダーであることを証明した。鍵は、安定性条件を満たす算術回路に対するスケッチ手法を、順方向微分の回路ではなく逆伝播の回路に適用した点で、スケッチの分散を抑えて評価回数を削減した。小規模な言語モデルの検索タスクで係数の減衰が安定性と整合することも実証した。<br><br>プロンプトのどの部分が出力に寄与したかを安く測れるようになれば、検索拡張生成の根拠提示やモデルの挙動の監査が現実的になる。理論的な最適性と実用性の両面から、文脈帰属の計算コストを大きく引き下げる成果である。出典：arXiv","timestamp":1794509902000,"title":"Sketching Language Models for Context Attribution","titleJa":"言語モデルの文脈帰属をスケッチで高速化――どのプロンプト断片が出力を決めたか","url":"https://arxiv.org/abs/2611.17313"},{"authors":["Peiwen Li","Harshit Verma","Sophia Zhou","Haiwen Wang","Ngoc Bui","Heng Chang","Fei Fei","David van Dijk","Rex Ying"],"categories":["cs.AI","cs.CL","cs.SE"],"field":"cs.AI","genre":"Agents / Robotics","monthKey":"2026-11","publishedAt":"2026-11-12T18:58:22Z","source":"arXiv","summaryHtml":"コーディングエージェントは変化し続けるリポジトリ上で次々とタスクをこなすが、次のタスクが何か分からないうちに記憶を書き残さなければならない。将来役立つかどうか分からない記憶に、書き込みと読み込みのコストがかかる。本研究は、記憶の設計とエージェントのふるまいを、次タスクで実際に測った記憶の価値で導く枠組みCoReMemを提案した。<br><br>見込み評価では、同じ状態から次タスクを実行し、個々の軌跡断片がある場合とない場合を比べることで、リポジトリ内の場所と実行可能なチェックを軸にした簡潔な記憶を作る。アクター側は記憶あり・なしのロールアウト群で方策上の記憶価値を推定し、解決を優先して成功時のステップ数を抑える報酬で適応する。記憶由来の手がかりを使ったステップにのみ追加の価値を与える工夫もある。<br><br>ベンチマークChainSWEでは、27Bのアクターの解決率が21.0%から25.7%へ上がり、ステップ数は17%減、キャッシュを考慮した総トークン数も記憶モジュール呼び出しを含めて11%減った。記憶を「ため込むもの」から「価値で選ぶもの」へ変えることで、連続するコーディング作業の効率と成功率を両立させる成果である。出典：arXiv","timestamp":1794509902000,"title":"CoReMem: Cost-Internalizing Memory for Successive Coding Tasks with Prospective Valuation","titleJa":"記憶はため込むものではない――コーディングエージェントの価値を測る記憶","url":"https://arxiv.org/abs/2611.17316"},{"authors":["Abigail L. Tenenbaum","R. Thomas McCoy"],"categories":["cs.LG","cs.CL"],"field":"cs.LG","genre":"Neuroscience","monthKey":"2026-11","publishedAt":"2026-11-12T18:57:49Z","source":"arXiv","summaryHtml":"人間はわずかな経験から素早く学べるのに、ニューラルネットワークは大量の訓練を要する。メタ学習で最適化されたネットワークは新しい関数を素早く学べることが知られているが、その仕組みは不明だった。本研究は、単語ベクトルの古典的な類推――「王−男＋女≒女王」――に着想を得て、関数を表すパラメータベクトルのあいだに加法的な関係があるかを調べた。<br><br>メタ学習ネットワークが特定の関数を素早く学ぶとき、適応後のパラメータ値をすべてつなげたベクトルは、その関数を表すものとみなせる。調べると、こうしたパラメータベクトルは関数のあいだの記号的な関係に沿って加算・減算でき、組み替えて作ったベクトルは、直接の訓練なしに意図した関数を実際に実装することが分かった。メタ学習は、学習の出発点を調整し、その後の学習をパラメータ空間における体系的で意味のある軌跡に沿って組織化する。<br><br>学習の速さを「構造の有無」で説明するこの発見は、人間のような柔軟な学習を機械に近づける手がかりになる。パラメータ空間の幾何学から学習能力を読み解く視点は、メタ学習の設計にも新たな指針を与えるだろう。出典：arXiv","timestamp":1794509869000,"title":"Linking Rapid Learning to Compositional Structure in Neural Networks: Evidence from Additive Analogies in Meta-Learned Parameter Spaces","titleJa":"速い学習は合成的な構造から生まれる――メタ学習ネットワークのパラメータ空間の加法性","url":"https://arxiv.org/abs/2611.17314"},{"authors":["Benjamin Hoover","Hugh Blayney","James C. R. Whittington"],"categories":["cs.AI","cs.LG"],"field":"cs.AI","genre":"LLM / NLP","monthKey":"2026-11","publishedAt":"2026-11-12T18:56:56Z","source":"arXiv","summaryHtml":"ループモデルは推論の有力な枠組みだが、不安定で学習が遅く、単純なパズルにも多くのパラメータと計算量を要する。本研究は1980年代のホップフィールド＆タンクのエネルギー関数を学習版CRAMとして蘇らせ、エネルギー降下による推論がこれらの弱点を解消することを示した。早期停止が組み込まれ、計算量は問題の難しさに適応し、ソルバーを微分せずに速く学習でき、重みはパズルの制約を解釈可能に学ぶ。<br><br>CRAMは1GPUでわずか42ミリ秒と132ミリ秒の学習ののち、Sudoku-Extremeで99.996%、Maze-Uniqueで100%のテスト正解率を達成し、ループモデルより少なくとも1000倍速い。Sudoku-Extremeの最高精度では、推論FLOPsも282分の1以下で同等だった。<br><br>エネルギーがデータからの推論学習の有望な方向であることを示すと同時に、数独や迷路のような自明に解けるベンチマークでループ推論の拡張性を測ることへの注意も促す。古典的な発想の再発見が、最先端の推論研究に新たな視点をもたらす。出典：arXiv","timestamp":1794509816000,"title":"Classical Energies Learn to Reason 1,000x Faster than Looped Models","titleJa":"古典的エネルギーが1000倍速く推論を学ぶ――ループモデルを超えるCRAM","url":"https://arxiv.org/abs/2611.17309"},{"authors":["Tosca Lechner","Vinayak Pathak","Sivan Sabato","Ruth Urner"],"categories":["cs.LG"],"field":"cs.LG","genre":"LLM / NLP","monthKey":"2026-11","publishedAt":"2026-11-12T18:55:58Z","source":"arXiv","summaryHtml":"ディベートは、モデルがますます高性能になるなかでもアライメントを保つ訓練プロトコルとして提案されてきた。人間がラベルを与える代わりに、二つのモデルが正反対のラベルを証明し合う討論を判定する。計算量の高い関数でも、弱い判定者なら正しく判定できることが示されており、非常に複雑な関数をモデルに教えられる可能性が指摘されてきた。<br><br>しかし従来の研究はこれを訓練プロトコルとして捉えず、既知の判定者のもとで二人の討論者が行うゲームだけを分析してきた。本研究はディベートに内在する学習問題をオンライン学習として定式化し、判定者へのアクセスがある場合の最適な学習方法が、敵対的なディベートの実施とは限らない場合があることを示した。そこで協調版のプロトコルを定義し、その学習可能性を組合せ次元で特徴づけた。<br><br>さらに人間判定者が誤りを犯す場合も検討し、少数の判定ミスが学習の大きな誤りにつながりうることを示した。ディベートによるアライメントという構想を、ゲームの分析から学習の理論へと進める重要な一歩である。出典：arXiv","timestamp":1794509758000,"title":"Towards a Theory of Learnability via Debate","titleJa":"ディベートで学べるのか――アライメント訓練プロトコルの学習理論","url":"https://arxiv.org/abs/2611.17303"},{"authors":["Gaurav Parmar","Zhengqi Li","Richard Zhang","Jun-Yan Zhu","Srinivasa Narasimhan","Eli Shechtman","Yotam Nitzan"],"categories":["cs.CV","cs.AI","cs.GR","cs.LG"],"field":"cs.CV","genre":"Vision / Multimodal","monthKey":"2026-11","publishedAt":"2026-11-12T18:55:09Z","source":"arXiv","summaryHtml":"対話的な動画変換では、リアルタイムに生成しながら長い時間の一貫性を保つことが求められる。近年の高速な手法はアテンションを固定長の因果ウィンドウに制限することで速度を稼ぐが、関連する履歴がウィンドウの外に出ると長期の一貫性が損なわれる。本論文は、動画変換には明示的なフレーム間参照があることに着目した対応付け型の手法vid2vid-longを提案する。入力動画で一致する領域は、出力動画でも一致すべきだという考え方だ。<br><br>具体的には入力動画のパッチ単位の対応を計算し、その対応にもとづいて過去に生成した出力の対応する領域を検索し、対応クロスアテンションでモデルに条件づける。固定ウィンドウに縛られないため、遠い過去の履歴も生成に生かせる。実験では近年の動画モデルに適用して長期の時間的一貫性が一貫して改善し、生成品質とリアルタイム性を保った。<br><br>対応付けという素朴な観察が、速度と一貫性の両立という動画生成の難題に実用的な解を与える。対話的な映像編集やライブの動画変換など、即応性と安定性の両方が求められる場面への応用が期待される。出典：arXiv","timestamp":1794509709000,"title":"Consistent Video-to-Video Translation via Explicit Correspondences","titleJa":"対応付けで動画をずらさない――長時間の一貫性を保つ動画変換vid2vid-long","url":"https://arxiv.org/abs/2611.17298"},{"authors":["Arnab Sen Sharma","Eric Todd","Sheridan Feucht","Andy Arditi","Rohit Gandikota","Natalie Shapira","Gabriele Sarti","Constanza Fierro","Lisa Schut","David Bau"],"categories":["cs.CL","cs.AI","cs.LG"],"field":"cs.CL","genre":"LLM / NLP","monthKey":"2026-11","publishedAt":"2026-11-12T18:55:06Z","source":"arXiv","summaryHtml":"言語モデルは目標を持てるのか。目標とは、行動に先立ち、それを導く内部の神経表現であり、さまざまな実行経路で実現できる柔軟さを持つものだ。本研究は複数の小課題からなるコーディング課題を用い、モデルが目標を追求し、次の小目標を選ぶ様子を調べた。すると、次の小目標の符号化が、ごく少数の注意ヘッドの出力に局在していることが分かった。<br><br>同じヘッドからは、モデルの未来の行動を自然言語で読み解くこともできる。たとえば「回文かどうかを確かめている」といった具合である。この符号化は次の行動に対して因果的であり、可塑的でもある。別の環境――たとえば別のプログラミング言語――に移植しても、異なるトークン列で同じ操作が引き起こされた。モデルは行動の実行中ずっとこの符号化を維持するが、再帰を持たないトランスフォーマーが層数を超えて状態を運べるはずがないという謎が残る。<br><br>著者らは「非再帰的な目標追求」という説明を提案する。モデルは課題の指示から目標を繰り返し読み取り、大きくなる文脈のなかの進捗と照らし合わせ、残りを追求することで、状態を持ち越さずに目標を保つのだという。標的を絞った因果的介入でこの説明の予測も検証した。言語モデルの内部に目標の表現があることを示した本研究は、モデルの行動を理解し、制御する新たな手がかりになる。出典：arXiv","timestamp":1794509706000,"title":"Goal Encoding in LLMs","titleJa":"言語モデルは目標をどう符号化するか――行動を導く内部表現の発見","url":"https://arxiv.org/abs/2611.17297"},{"authors":["Haozhe Wang","Lina Chen","Fanqi Wan","Qi Han","Yinmin Zhang","Zheng Ge","Daxin Jiang","Junchi Yan"],"categories":["cs.LG","cs.AI","cs.CL","cs.DC"],"field":"cs.AI","genre":"Agents / Robotics","monthKey":"2026-11","publishedAt":"2026-11-12T18:54:42Z","source":"arXiv","summaryHtml":"オンデバイス推論では、ローカルの加速器を活かすカーネルの生成が欠かせない。Apple Metalカーネルを生成するモデルの学習や評価にはmacOSネイティブの道具と並行するエージェント実行が必要だが、モデルへの問い合わせ、開発コマンド、GPU実行が交互に現れるため、ロールアウトの大半でGPUが遊んでしまう。<br><br>本研究が提案するMetal Sandboxは、インスタンスごとのファイルアクセス制限、ネイティブなコマンド実行、複数Macにまたがるコマンド単位のスケジューリングを組み合わせた基盤だ。各エージェントは自分の作業領域と開発環境を保ちつつ、並行可能なコマンドは同時に走り、直列コマンドはノードごとに1枠を共有する。待機中のコマンドは空きのあるMacへ移って結果を持ち帰ることもできる。Harborとの統合でタスク実行、自動検証、ロールアウト収集を共通の流れで行える。<br><br>Mac mini M4を4台使った実験では、需要が集中する場面でコマンド処理量が1.68〜2.05倍に向上した。16件の静的なエージェント軌跡からは、ノードあたり4セッションで1セッション比2.14倍の持続スループットが見込まれ、動的スケジューリングでは平均の道具待ち時間が18.8%、バッチ全体の所要時間が22.3%短縮された。Metal SandboxとHarbor統合はオープンソースで公開されている。出典：arXiv","timestamp":1794509682000,"title":"Metal Sandbox: Isolated Execution and Command Scheduling for GPU Coding Agents on Apple Silicon","titleJa":"Metal Sandbox――Apple SiliconでGPUコーディングエージェントを隔離実行・分散させる基盤","url":"https://arxiv.org/abs/2611.17294"},{"authors":["Jiacheng Xu","Shuo He","Fuxiang Zhang","Chaojie Wang","Bo An"],"categories":["cs.LG","cs.CL"],"field":"cs.LG","genre":"LLM / NLP","monthKey":"2026-11","publishedAt":"2026-11-12T18:52:33Z","source":"arXiv","summaryHtml":"検証可能な報酬による強化学習（RLVR）は、検証器が解の正しさを確実に判定できることを前提とする。だが現実には完全な検証は得られず、安価な検査では失敗を反証できるだけの場合が多い。本研究はこの状況を「片側検証可能性」として定式化する。検証済みの否定は信頼できる反例だが、検証済みの肯定は反証されなかった候補にすぎず、多くの偽陽性を含みうる。<br><br>標準的なRLVRでは、検証をすり抜けた近道を強化してしまう危険がある。提案手法NOPOは、検証済みの肯定をラベルなしとして扱い、信頼できる検証済みの否定だけを抑えることで方策を更新する。参照モデルに対する否定抑制損失と、反証されなかった応答の割合で更新量を調整するグループ単位のアダプターを組み合わせる。<br><br>単体テスト、制約チェック、LLMによる自己検証という三つの検証器のもとで、コード・論理・数学のベンチマークでベースラインを上回るpass@kを達成した。効果は推論時のスケーリングやベンチマーク間の転移でも持続し、検証が不完全な場面での強化学習に実用的な道を示す。出典：arXiv","timestamp":1794509553000,"title":"Negative-Only Policy Optimization for One-Sided Verifiable Rewards","titleJa":"否定だけから学ぶ方策最適化――片側検証のもとで誤った成功を強化学習しない","url":"https://arxiv.org/abs/2611.17287"},{"authors":["Gautam Galada","Supreeth Shastri","Sagnik Ray Choudhury"],"categories":["cs.CL","cs.AI"],"field":"cs.CL","genre":"Ethics / Safety","monthKey":"2026-11","publishedAt":"2026-11-12T18:51:05Z","source":"arXiv","summaryHtml":"言語モデルとの日常的なやり取りから、モデルが利用者の性別や年齢層といった機微な情報を推測し、それを一見無害な生成物にステガノグラフィーで埋め込む――本研究は「合成密輸」と呼ぶ新たな脅威モデルを提案する。利用者がその生成物をメールやSNS投稿、メッセージとして共有すれば、情報は本人の知らないうちに外部へ運ばれる。通信路を監視する攻撃者は、そこから推測された個人情報を回収できる。<br><br>著者らはオープンウェイトのモデル2種を訓練し、会話の手がかりから性別と年齢層を推測させ、不可視文字や語の選び方で予測を符号化できることを実証した。モデル自体に攻撃者への直接の連絡手段がなくても、利用者が共有する出力が個人推論の隠し通信路になりうる。生成物の「見た目」は普通でも、その裏に情報が潜む点が従来の漏洩と異なる。<br><br>言語モデルが日常の相談相手になるほど、出力の共有は当たり前になる。生成物の無害な見た目に惑わされず、不可視の符号化や語彙の偏りといった隠れた経路を監査する必要性を示した研究である。個人情報をめぐる安全性の議論に、新たな視点をもたらす。出典：arXiv","timestamp":1794509465000,"title":"Synthesis Smuggling: Maliciously Hiding Inferred Personal Attributes in LLM Outputs","titleJa":"合成密輸――言語モデルの出力に個人情報を隠し運ぶ新たな脅威","url":"https://arxiv.org/abs/2611.17280"},{"authors":["Pengcheng Zhou","Xuanyu Liu","Yanchen Yin","Tianjie Ju","Bobo Li","Shengqiong Wu","Hao Fei","Mong-Li Lee","Wynne Hsu"],"categories":["cs.AI"],"field":"cs.AI","genre":"Agents / Robotics","monthKey":"2026-11","publishedAt":"2026-11-12T18:45:58Z","source":"arXiv","summaryHtml":"地理的な課題に取り組むLLMエージェントの評価は、これまで固定された地図状態の上での推論や計画が中心だった。しかし現実の世界は動き続けており、過去の判断を支えた証拠が今も成り立つかを確認し、必要なら計画を改める力が求められる。研究チームは、現実の地理構造に根ざしつつ外部の世界状態が独自の時間過程で変化し続ける環境プラットフォームGeoWorldと、その上で動く評価ベンチマークLiveGeoを提案した。<br><br>LiveGeoでは、エージェントは課題に関連する情報を自ら集め、以前の決定を支えた証拠が今も有効かを確かめ、必要に応じて計画を修正しなければならない。実験の結果、最先端のLLMでさえ静的な課題に苦戦し、どのモデルも全課題で一貫して優れることはなく、静的な場面での高性能が動的な信頼性を保証しないことも分かった。<br><br>さらなる分析で、鍵となるボトルネックも明らかになった。エージェントは関連する証拠を集めて有効な判断に結びつけることと、世界が変化する中でその正しさを保ち続けることに苦戦している。LiveGeoとGeoWorldを公開することで、変化する世界で確実に行動できる次世代エージェントの研究基盤を提供する。出典：arXiv","timestamp":1794509158000,"title":"LiveGeo: Benchmarking Geographic Agents in Continuously Evolving Worlds","titleJa":"LiveGeo――刻々と変わる現実世界で地理エージェントの判断を試すベンチマーク","url":"https://arxiv.org/abs/2611.17267"},{"authors":["Tiago de Souza Farias","Caio Moraes Porto","Matheus da Silva Fonseca","Nicolas Armando Cabrera Carpi","Anderson de Araujo Oliveira","Celso Jorge Villas-Boas"],"categories":["quant-ph","cs.LG"],"field":"quant-ph","genre":"LLM / NLP","monthKey":"2026-11","publishedAt":"2026-11-12T18:34:23Z","source":"arXiv","summaryHtml":"大規模言語モデル（LLM）は、従来の最適化なしに変分量子回路のパラメータを生成できることが示されてきた。ただし、どんな条件でうまくいくのかは明らかでなかった。本論文は、汎用の凍結LLMに回路とハミルトニアンの記号記述を与え、回路パラメータのベクトル全体を生成させる手法を調べる。エネルギーへのフィードバックを繰り返す変種も試し、ランダムなハミルトニアン、構造のある親ハミルトニアン、分子系で評価した。<br><br>一般のハミルトニアンでは、LLMが生成したパラメータは従来のAdam最適化よりエネルギー誤差が大きく、フィードバックによる改善も限定的だった。一方、構造のあるハミルトニアンでは有望な低エネルギー配置を生成でき、物理的・数学的な構造が読み取れるときにパラメータ推論が働くことが示された。最小エネルギーの直接予測はハミルトニアンのスペクトル下限を破ることもあるが、生成した回路パラメータなら物理的に実現可能なエネルギー期待値を独立に評価できる。<br><br>さらに、回路の盲目的な解釈では、LLMは背後の量子アルゴリズムを特定できなくても測定結果を予測できることが分かった。問題の構造が鍵を握ること、反復的なLLM最適化の限界、独立に検証できる予測の重要性を示す成果である。出典：arXiv","timestamp":1794508463000,"title":"Programming Quantum Circuit Parameters with Large Language Models","titleJa":"大規模言語モデルで量子回路のパラメータを決める","url":"https://arxiv.org/abs/2611.17246"},{"authors":["Samidha Verma","Ankit Anand","Sayan Ranu"],"categories":["cs.AI"],"field":"cs.AI","genre":"LLM / NLP","monthKey":"2026-11","publishedAt":"2026-11-12T18:28:08Z","source":"arXiv","summaryHtml":"大規模言語モデルを使って解法を繰り返し変異・改良する自動ヒューリスティック発見では、より強力で高価なモデルが常に良い解を生むと思われがちだ。本研究は複数のNP困難な組合せ最適化問題で検証し、大きく高価なモデルに一貫した優位性がないことを示した。では、性能も価格も異なる複数のLLMを抱えるとき、探索の各段階でどのモデルを呼ぶべきか。<br><br>最適なモデルは実行中に変わりうるうえ、あるモデルの出力が次の呼び出しの文脈の種になるため、報酬信号は非定常で絡み合っており、古典的なオンライン意思決定の独立性の仮定は成り立たない。そこで提案されたBalladは、オンラインのバンディット手法でLLMのプールを編成し、どの単独モデルにも匹敵し、ときに上回るアンサンブルを学習する。<br><br>その仕組みは、安定した平均ではなく稀な高スコアの発見を重視する選択方針、発見の系譜を通じた有向非循環グラフによる信用伝播、古い観測を割り引いて各モデルの現在の有用性に追従する工夫からなる。5つのNP困難問題と4モデルでの実験では、事後的に最良の単独モデルに匹敵するか上回りつつ、最強モデルを使い続ける場合と比べてAPIコストを最大65.6%削減した。出典：arXiv","timestamp":1794508088000,"title":"Ballad: Bandit-Based LLM Routing for Automated Heuristic Discovery","titleJa":"Ballad――バンディットで複数LLMを操り発見的解法の探索を強める","url":"https://arxiv.org/abs/2611.17241"},{"authors":["Hannah Li"],"categories":["stat.ME","cs.AI"],"field":"stat.ME","genre":"LLM / NLP","monthKey":"2026-11","publishedAt":"2026-11-12T18:26:51Z","source":"arXiv","summaryHtml":"対話型システムでは、ユーザーはLLMの応答を見てプロンプトの立て方や課題の種類・難しさを変える。つまりモデルの応答が、その後に評価されるプロンプトの集合そのものを左右する。本研究は、このユーザーの適応性とプロンプトの内生性がLLMの評価に与える影響を分析した。<br><br>モデル比較の推定量として、同じプロンプト分布で比べる「共通分布効果」と、対話を通じて生まれた分布で比べる「誘導分布効果」の二つを定義した。オフラインのベンチマーク評価とライブのA/Bテストは異なる量を測っており、標準的な差分推定量はそれぞれ別の効果に収束する。この区別は実務にも響く。二つの比較がモデルの順位を逆転させ、導入の判断を変えうるのだ。順位が一致する十分条件も示し、オフライン評価で十分かを判断する実用的な指針を与えた。<br><br>さらに相互作用の線形モデルで、ユーザーの適応性が推定の分散を増やすことも示した。対話型LLMの評価は、静的なベンチマークの成績だけでは決まらない。ユーザーが適応する現実を織り込んだ評価設計が必要になる。出典：arXiv","timestamp":1794508011000,"title":"When Both Sides Adapt: The Challenges of Evaluating Interactive LLM Systems","titleJa":"両方が適応するとき――対話型LLMシステムの評価はなぜ難しいのか","url":"https://arxiv.org/abs/2611.17239"},{"authors":["Yichi Zhang","Bo Wang","Zhenghan Zhu","Yutong Han","Jiayin Zou","Gao Kejun","Chang Liu","Shaoxuan Xie","Chi Zhang","Shi Haoyang","Zongxuan Lai","Sen Cui","Guocai Yao","Miao Liu"],"categories":["cs.RO"],"field":"cs.RO","genre":"Agents / Robotics","monthKey":"2026-11","publishedAt":"2026-11-12T18:25:41Z","source":"arXiv","summaryHtml":"ロボットが人を助け、協働するには、言葉による依頼だけでなく視線や一人称映像などの多様な意図の手がかりを読み取り、移動と操作が入り混じる長期の課題を遂行しなければならない。本論文が提案するHEIRは、こうした一人称の意図を活かした人間-ロボット相互作用を研究するためのリソースである。<br><br>HEIRは人間の発話、計測した視線、一人称映像を、ロボットの観測と遠隔操作による移動・操作の軌跡と組み合わせる。各セッションは連続するエピソードを保ち、一つの依頼が複数の実行サブタスクで果たされる。データと人間による注釈は、意図の接地、実行計画、課題完遂を統一的な相互作用の場で研究する土台になる。<br><br>著者らは人間中心の文脈を追加することが各課題のモデル性能にどう寄与するかをオフライン実験で広範に検証し、実ロボット実験で実行課題の完遂度を評価した。家庭という日常の場で人がロボットと協働する未来を支える基盤になる。自然な家庭環境におけるユーザー中心のロボット相互作用を研究する貴重なリソースとして、デモとデータセットがオンラインで公開されている。出典：arXiv","timestamp":1794507941000,"title":"HEIR: Harness Egocentric Intent for Human-Robot Interactions","titleJa":"HEIR――一人称の意図を活かす人間-ロボット相互作用のリソース","url":"https://arxiv.org/abs/2611.17238"},{"authors":["Audrey Xie","Ludwig Schmidt","John Duchi"],"categories":["cs.LG"],"field":"cs.LG","genre":"LLM / NLP","monthKey":"2026-11","publishedAt":"2026-11-12T18:21:37Z","source":"arXiv","summaryHtml":"知識蒸留がなぜうまくいくのか、多くの仮説が競い合っている。本論文は蒸留の数理モデルを提案・分析し、蒸留の性能はより良いモデルが得られるからではなく、最適化の景観が簡単になるからだと示唆する。教師モデルの出力を目標に学習する生徒モデルは、ラベルだけを目標にする場合と何が違うのか。確率的勾配降下法で学習する一般化線形モデルでは、蒸留を用いた学習は蒸留なしより漸近的に速く性能の良い生徒モデルに到達することが証明された。<br><br>ランク1の行列近似では、蒸留付き勾配降下法が教師あり目的関数での学習より厳密に速く収束する条件が、対象行列の性質として特徴づけられた。蒸留が学習を速めるのは、教師の出力が最適化の道筋をなだらかにし、勾配の進むべき方向を安定させるからだと分析される。理論は、蒸留がもたらす利点が汎化性能の向上ではなく最適化速度の改善にあることを切り分け、実データでの実験も理論の予測を裏づけた。<br><br>蒸留の効果を「何を学ぶか」ではなく「いかに速く学べるか」に位置づけ直す結果であり、大規模言語モデルなどで広く使われる蒸留の理解を深める。蒸留の設計や温度設定を最適化の観点から見直す手がかりにもなる。最適化の観点から蒸留を捉え直す試みである。出典：arXiv","timestamp":1794507697000,"title":"Two mathematical models of knowledge distillation","titleJa":"知識蒸留の数理モデル――速さの源は最適化のしやすさ","url":"https://arxiv.org/abs/2611.17230"},{"authors":["Geoffrey Challen","Craig Zilles"],"categories":["cs.CY","cs.AI"],"field":"cs.CY","genre":"LLM / NLP","monthKey":"2026-11","publishedAt":"2026-11-12T18:16:37Z","source":"arXiv","summaryHtml":"口頭試験は、学生に答えの根拠を述べさせ、やり取りの中で曖昧な回答を掘り下げられる点で優れている。だが規模を広げにくい。本研究は、LLMによる対話型の試験システムを提案する。学生とテキストで対話しながら、主張を立てて支える力を評価する。二つのエージェントに役割を分けた設計で、答えの漏えいを防ぐ。<br><br>面接官エージェントは学生と直接対話し、次の質問の指針だけを受け取る。裏側の評価者エージェントは活動全体の目標とルーブリックを把握し、進捗を追いながら、現在の質問を掘り下げるか次へ進むかを面接官に指示する。検証には能力レベルや戦術の異なるLLMペルソナの模擬学生を用いた。答えを引き出そうとする手口、プロンプトインジェクション、自信満々の捏造といった敵対的な振る舞いにも対応できるかを確認した。<br><br>架空の評価テーマを用いることで、ペルソナが既知の知識に頼るのを防いだ点も工夫である。口頭試験の良さを保ちながら人数の壁を越える設計で、対話による評価を大規模に展開する道筋を示す。教育におけるLLM活用の新しい形を提示している。出典：arXiv","timestamp":1794507397000,"title":"Scalable Conversational Assessment: Chat-Based Exams with a Two-Agent LLM Pipeline","titleJa":"会話型試験を拡張する――二つのLLMエージェントによる口頭試問","url":"https://arxiv.org/abs/2611.17220"},{"authors":["Tomohiro Sawada","Kartik Goyal"],"categories":["cs.LG","cs.CL"],"field":"cs.LG","genre":"LLM / NLP","monthKey":"2026-11","publishedAt":"2026-11-12T17:55:33Z","source":"arXiv","summaryHtml":"LoRAによる低ランク適応は、特に不均一な環境や継続学習ではフルファインチューニングに及ばず、大きな忘却を伴う。学習と忘却のトレードオフがつきまとう。本論文はその一因を特定する。高ランクのLoRAアダプタほど、設定したランクが与える容量を活かしきれていない。標準的なLoRAの更新は実効ランクが設定ランクをはるかに下回り、更新エネルギーの広がりが限られていたのである。<br><br>そこで著者は、元の目的関数を最適化しながらアダプタの実効ランクを最大化する学習手法を提案する。中心となるのは、言語モデリング損失に加える単純で安定、微分可能でSVD不要なレニー2実効ランク正則化項である。容量最大化とノルム制約つき更新の関係も示される。3モデルでの混合ドメインのランク掃引では、ペナルティ重みλ=0.01がランク16以上のすべての設定で未ペナルティのLoRAより平均Wikiパープレキシティを下げた。<br><br>単一タスクやスケジューリングの実験では、学習と保持のバランスが設定次第で変わることも示された。文献にある複数のLoRA変種も同じ容量問題を抱えており、本手法はそれらと補完的に使える。実効ランクはアダプタ品質の事後的な診断にとどまらず、学習と忘却のフロンティアを改善する訓練可能な目的だという結論である。出典：arXiv","timestamp":1794506133000,"title":"Maximizing Capacity Utilization of LoRA Adapters for Mitigating the Learning-Forgetting Trade-off","titleJa":"LoRAの容量を使い切る――学習と忘却のトレードオフを緩和する","url":"https://arxiv.org/abs/2611.17191"},{"authors":["Robert Fonod","Nikolas Geroliminis"],"categories":["cs.CV"],"field":"cs.CV","genre":"Vision / Multimodal","monthKey":"2026-11","publishedAt":"2026-11-12T17:55:06Z","source":"arXiv","summaryHtml":"ホバリングするドローンの映像では、すべてのフレームを1枚の参照フレームに位置合わせする参照フレーム安定化が使われ、物体の位置を比較可能にする。その基盤となる位置合わせパイプラインは、カメラだけが動く特徴マッチングのベンチマークで選ばれてきた。しかし忙しい交差点では、一緒に動く車両群が互いに整合する対応点を与え、頑健なホモグラフィ推定を車両の動きへ引きずる。これが「コンセンサス・キャプチャ」で、インライア統計では検出できない。<br><br>著者らは、この現象と、それを防ぐはずの物体マスキングを測る2部構成のベンチマークを構築した。静的プロトコルでは、既知のホモグラフィの下で10のパイプラインを4K航空フレームで評価する。動的プロトコルでは、映像だけから選んだホバー場面で、オフラインとリアルタイムの予算のもと、背景の位置合わせ、物体の位置誤差、動く群れの変位に推定がどれだけ追従するかを測る。<br><br>静的場面では、調整済みのAKAZE、RootSIFT、SIFT、BRISKが先行し、マッチャー閾値の再調整による平均精度の改善は最大0.0062、マスキングのコストは0.005未満だった。マスクなしのORBは、リアルタイムの動的ペア304組中28組でキャプチャされ、捕捉された推定の角誤差の中央値は18.8ピクセルに達した。マスキングは全パイプラインでキャプチャを除去し、先行パイプラインの性能を変えなかった。出典：arXiv","timestamp":1794506106000,"title":"Consensus Capture in Reference-Based UAV Video Stabilization: A Benchmark on Dynamic Urban Scenes","titleJa":"ドローン映像の安定化をだます「コンセンサス・キャプチャ」――動的な都市シーンでのベンチマーク","url":"https://arxiv.org/abs/2611.17190"},{"authors":["Rui Sun","Jinfeng Peng","Zehua Cheng","Jiahao Sun","Zhipeng Wang"],"categories":["cs.AI","cs.MA"],"field":"cs.AI","genre":"Agents / Robotics","monthKey":"2026-11","publishedAt":"2026-11-12T17:52:51Z","source":"arXiv","summaryHtml":"連合学習は、生データを集約せずに複数の保有者が協調してモデルを学習できる。だが協力相手の発見、学習タスクの準備、実行と報酬の調整が専門知識のない組織には重荷だった。本研究は、エージェントを中心に据えた連合学習システムCortex-FLを提案する。利用者は学習目標を自然言語で述べるだけで、エージェントが協調に必要な手続きを代行する。<br><br>エージェントは目標を共有タスクに翻訳し、協力者を探索して参加合意を交渉する。エージェントによる調整とローカルな実行権限を分離した設計で、保有者はデータや計算、資金の管理権を手放さずに調整を委任できる。4ノードの実証では、自然言語の要求から協調形成、契約に基づく学習、検証済みモデルの納品までの一連の流れが動いた。報酬の支払いにはx402決済を用い、ブロックチェーンのテストネット上で貢献に応じた決済まで含めて確認した。<br><br>データの主権を保ちながら協調学習へ参加できる仕組みは、専門チームをもたない中小の組織や研究機関が分散学習を使う道を開く。エージェントが調整を担うことで連合学習の導入障壁を下げる具体例であり、分散学習の実用化に向けた一歩である。出典：arXiv","timestamp":1794505971000,"title":"Cortex-FL: Agent-Mediated Collaboration for Federated Learning","titleJa":"エージェントが仲介する連合学習――自然言語の指示で協調学習を編成する","url":"https://arxiv.org/abs/2611.17186"},{"authors":["Umar Ahmed","Maxim Dunaev","Mohammad Nour Al Awad","Sergey Ivanov","Ivan Khodnenko"],"categories":["cs.CL","cs.LG"],"field":"cs.CL","genre":"LLM / NLP","monthKey":"2026-11","publishedAt":"2026-11-12T17:43:44Z","source":"arXiv","summaryHtml":"小規模なファインチューニング済みパーサーが、整った形式で誤った構文木を出力すると、後段は何も気づけないまま処理が進む。本研究は、自由に選べるはずの出力形式が、こうした無言の誤りの頻度を左右するかを問う。注文内容の構文解析ベンチマークPIZZAで、10億未満のパラメータをもつ2モデルを、同一の構文木の6種類の可逆な符号化で学習させた。<br><br>300回に及ぶ実験の結果、短縮だけでは改善せず、目標を日常的な言葉で書く符号化が最も正確だった。Qwen3.5-0.8Bでは正解率87.5％で、ネイティブのS式を上回りつつトークンは4.1分の1に減り、無言の誤り率は2.3倍下がった。誤りの分析では、否定表現の扱いの改善が寄与の多くを占めた。<br><br>全実験で、モデルはメニュー外の入力を拒否し（95.9〜99.0％を処理）、発話内の自己訂正も学んだ。ただし厳格な拒否には代償があり、実際の注文の2.1〜10.1％が誤って拒否された。小規模モデルの実用では、出力形式そのものが信頼性の設計変数になることを示す。出典：arXiv","timestamp":1794505424000,"title":"Parsed, Plausible, Wrong: Output Format Controls Silent Errors in Small-Model Semantic Parsing","titleJa":"解析できて、もっともらしくて、間違っている――出力形式が決める小規模モデルの無言の誤り","url":"https://arxiv.org/abs/2611.17169"},{"authors":["Haochen Liu","Qianhao Zhu","Zixuan Wang","Dingming Li","Tongbo Chen","Peng Qiu","Yingqi Qu","Weiming Lu","Jun Xiao","Yongliang Shen"],"categories":["cs.AI","cs.CL"],"field":"cs.AI","genre":"Agents / Robotics","monthKey":"2026-11","publishedAt":"2026-11-12T17:42:46Z","source":"arXiv","summaryHtml":"意思決定モデルは、選択肢ごとの確率を伴う型付き出力を返すモデルで、エージェントの行動を選ぶ「行為者」にも、既に行った行動を評価する「判定者」にも、強化学習で方策を教える「教師」にもなりうる。これまでの研究はもっぱら行為者としての性能で評価してきた。本研究は、行為者として振るわないモデルでも、教師としては優れうるのかを問う。<br><br>3つの意思決定モデルと3つの汎用LLMをALFWorldで比較した。行為者としては6モデルすべてが、先に済ませるべき下位目標よりも手軽な目標に引き寄せられた。だが軌跡全体を見渡す判定者としては、同じモデルが下位目標への寄与を正しく評価した。課題が成功するかを問うのではなく、各行動が役立ったかを問うことで、有用な行動と無用な行動を区別できた。<br><br>教師としての検証では、判定モデルJEVがQwen2.5-1.5Bの方策をGRPOで学習させ、ALFWorldの成功率を72.8%から82.9%へ、WebShopでは56.8%から71.4%へ引き上げた。行動の最中には見えなかった結果が、事後の判定では見える。下手な行為者でも良い教師になれることを示した研究である。出典：arXiv","timestamp":1794505366000,"title":"Actor, Judge, or Teacher? Understanding Decision Models in Long-Horizon Agents","titleJa":"行為者か、判定者か、教師か――長期エージェントにおける意思決定モデルの役割","url":"https://arxiv.org/abs/2611.17167"},{"authors":["Donglin Yang","Xiangyu Wang","Yantong Zhong","Wenhao Zheng","Zihan Ding","Yue Liao","Hongsheng Li","Ke Xu","Si Liu"],"categories":["cs.RO","cs.CV"],"field":"cs.RO","genre":"Agents / Robotics","monthKey":"2026-11","publishedAt":"2026-11-12T17:39:43Z","source":"arXiv","summaryHtml":"言葉で誘導するドローン飛行の研究は長距離の経路計画が中心で、対象に対する近距離の機動は手つかずだった。本論文は短い自然言語指示・一人称視点の観測・現在の飛行状態から連続的な飛行行動へ変換する課題Flying-on-a-Word（Flow）を定式化する。基本的な移動指示から対象との複雑な相互作用までを扱う。<br><br>学習と閉ループ評価のため、実機で操縦した8つの動作カテゴリ・30,692件の軌跡からなるデータセットUAV-Flowと、タスクごとの完了基準を備えたシミュレーション環境UAV-Flow-Simの10,109件の軌跡を構築した。さらに模倣による事前学習と、グループ報酬分布を活かして高報酬の行動列を強化するTail-Aware GRPOによるオンライン事後訓練を組み合わせたFlowVLAを開発した。<br><br>273件の保留エピソードで、事前学習済みFlowVLAは平均成功率75.58%で最強のベースラインを6.72ポイント上回り、TGRPOによる事後訓練で93.16%まで伸び、サンプル効率にも優れた。実機実験でも屋内外で対象相対の指示を堅実に実行したという。出典：arXiv","timestamp":1794505183000,"title":"UAV-Flow++: A Unified Suite for Benchmarking and Learning Language-Guided UAV Flight","titleJa":"言葉ひとつでドローンを飛ばす――言語誘導飛行のベンチマークと学習スイート","url":"https://arxiv.org/abs/2611.17163"},{"authors":["Anif N. Shikder","Ramit Dey","Jan Minac","Lyle E. Muller"],"categories":["cs.LG","cs.NE","math.RT"],"field":"cs.LG","genre":"LLM / NLP","monthKey":"2026-11","publishedAt":"2026-11-12T17:39:35Z","source":"arXiv","summaryHtml":"状態空間モデル（SSM）は、線形時間の推論と並列訓練を両立するトランスフォーマーの代替として注目される。だが多くの実装は、並列スキャンを効率化するために回帰を対角化しており、隠れ状態の各チャンネルは入力依存の数で掛けられるだけだ。こうした数は可換なため、状態は「何が起きたか」は記録できても「どの順序で起きたか」を記録できない。<br><br>本論文は、表現論でこの問題を定式化する。状態更新を入力系列のモノイドの線形表現とみなし、SSMがある群をあらゆる系列長で追跡できるのは、その群が遷移行列の生成する群の商である場合に限ると示す。帰結として、対角の実数・複素数SSMが追跡できるのは可換群のみであり、群を追跡できるSSMの遷移行列は実数・複素数・四元数上で独立したブロックに分解されなければならない。<br><br>この理論に基づき、四元数チャンネルを加えたHyperSSMを提案する。線形時間の推論と並列訓練を保ったまま、最終答えだけの訓練で状態追跡ベンチマークの群課題を、最大で5個の状態数で厳密に解く。学習した重みは直接解釈でき、実際のジャイロスコープの較正や量子ビットゲートの回転、タンパク質骨格の幾何学の復元にも使える。出典：arXiv","timestamp":1794505175000,"title":"Symmetry in Time: A Representation Theory of Linear Recurrent Memory","titleJa":"時間の対称性――線形回帰メモリの表現論が解く状態追跡の謎","url":"https://arxiv.org/abs/2611.17162"},{"authors":["Tanzeel Abbas","Tehseen Zia","David Windridge"],"categories":["cs.AI"],"field":"cs.AI","genre":"Ethics / Safety","monthKey":"2026-11","publishedAt":"2026-11-12T17:39:14Z","source":"arXiv","summaryHtml":"検索拡張生成（RAG）のシステムは、主張の出所を示すため引用を付ける。だが引用が典拠を誤って示すことがあり、標準的な検証では検出できない。本研究は、検索された文章中の事実を偽の内容に置き換えてモデルに再質問する反事実的な手法で、引用可能な主張のうちどれだけが検索文脈ではなくモデルのパラメトリックな記憶に由来するかを測った。<br><br>5サイズのモデル群と別の比較モデル群で、引用可能な主張の1.2〜15.7％が記憶由来だった。最も保守的な置き換え条件でも2モデルで4.6％と8.5％に達し、同一モデル群内では規模が大きいほど割合が上がった。標準的な自然言語推論による検証は、引用箇所に限定しても偶然と区別できない結果しか出さなかった。<br><br>原因は構造的である。記憶から答えるモデルは、自分の出力に合う引用を選ぶ。10種の帰属手法を同じ主張で比べると、文脈あり・なしでのモデルの分布の違いが典拠を最もよく分けた。だがその信号で対処しても、低い基礎率のもとでは引用の正直さは改善しない。何を知っていたかと何を使ったかを分けることが、残された課題である。出典：arXiv","timestamp":1794505154000,"title":"Cited but Unused: Parametric Provenance in Retrieval-Augmented Generation","titleJa":"引用されても使われていない――RAGの引用がモデルの記憶に由来する割合","url":"https://arxiv.org/abs/2611.17161"},{"authors":["Kerui Gu","Xing Fu","Shuoyang Sun","Cheng Peng","Jingru Duan","Huayu Gu"],"categories":["cs.RO"],"field":"cs.RO","genre":"Vision / Multimodal","monthKey":"2026-11","publishedAt":"2026-11-12T17:38:57Z","source":"arXiv","summaryHtml":"身体を持つエージェントが意図を伝えるには、言葉だけでなく音声や身体の動き、表情といった非言語の振る舞いを統合する必要がある。本研究は、Omniパラダイムをロボットの身体表現まで広げたXBot-Omniを提案する。Thinker–Talker–Actorの三層構造で、Thinkerがテキスト・画像・音声・映像から応答を組み立て、TalkerとActorがそれぞれ音声と身体表現で実現する。<br><br>新しいのはActorを専用モジュールとして設けた点だ。ThinkerとTalkerの内部表現を直接使い、段階的な設計で生じる情報損失を避けながら、身体の動きと表情をストリーミングで生成する。遅延の増加はわずかに抑えられた。万能な入力を条件としてマルチモーダルな生成を一つの流れで行う統一設計で、7種のベンチマークで評価し、マルチモーダル理解の性能を示した。<br><br>言葉と身体を一つの流れで扱う設計は、身体を持つAIの対話をより自然にする方向を示す。音声・映像・身体表現を統合したロボットとの協働や対話の研究に資する成果である。出典：arXiv","timestamp":1794505137000,"title":"XBot-Omni: An Omni-Modal Model for Embodied Understanding and Interaction","titleJa":"身体を持つ万能モデル――音声・動作・表情を統合するXBot-Omni","url":"https://arxiv.org/abs/2611.17160"},{"authors":["Liangjun Xing","Ke Fan","Kailin Li","Bin Wang","Xiaojie Niu","Qingwei Ben","Jiafei Cao","Wei Yao","Yebin Liu","Jingbo Wang","Weinan Zhang"],"categories":["cs.RO"],"field":"cs.RO","genre":"Agents / Robotics","monthKey":"2026-11","publishedAt":"2026-11-12T17:30:11Z","source":"arXiv","summaryHtml":"ヒューマノイドが歩きながら物を扱うには、移動とバランス調整と操作を接触の多い状況で同時にこなす必要がある。遠隔操作による実演の収集も難しく、実用的な制御器には精度と安定性と接触への気づきが同時に求められる。本論文は、速度ナビゲーション、平面の足配置、手首姿勢の追従、任意の力条件を粗い指示から細かい指示へとつなぐ命令空間をもつ、力覚対応の多粒度制御システムFORGEを提案する。<br><br>学習に全身の人間の動作軌跡や関節角の参照は不要で、実行時に必要なのは骨盤に対する両手首のまばらな姿勢と粗い動作指示、任意の手首荷重だけだ。持続的な接触では運動量オブザーバと、シミュレータの接触力で学習した補正を組み合わせ、手首の力覚センサなしに固有感覚と腕のPDトルクから低周波の手首等価相互作用力を推定する。準静的な仮想目標ループがこの推定と希望する加力をもとに手首目標を適応させる。<br><br>凍結した移動の事前知識と非対称な残差動作が、操作による全身の補正を安定させる。剛体の箱への持続接触時の絞る力や、荷重条件を変えたしゃがみ持ち上げ課題での拡散ポリシーの実行などで評価され、統一制御の安定性と課題空間の追従が示された。力の感覚を備えたヒューマノイド制御の実用化に近づく成果である。出典：arXiv","timestamp":1794504611000,"title":"FORGE: Force-Aware Multi-Granularity Control for Efficient Humanoid Loco-Manipulation","titleJa":"力加減がわかるヒューマノイド――接触を感じながら動く制御FORGE","url":"https://arxiv.org/abs/2611.17142"},{"authors":["Tanzeel Abbas","Ahmad Kamran Malik","Nafees Qamar","Sana Liaqat"],"categories":["cs.CL","cs.AI"],"field":"cs.CL","genre":"LLM / NLP","monthKey":"2026-11","publishedAt":"2026-11-12T17:21:12Z","source":"arXiv","summaryHtml":"小規模言語モデル（SLM）は、大規模な専有モデルが高コストな現場で臨床の自然言語処理を動かせるようにする。パラメータ効率的な微調整で汎用機でも特化できる。だが訓練後も一つの壁が残る。医療タスクでは、臨床の問いに対して必要以上に長い答えを返してしまう。意思決定支援や診療現場では時間が短く、推論が正しくても冗長な答えは扱いにくい。既存の長さ制御は選好最適化や報酬モデル、専有の教師モデルに依存し、SLMの手軽さを損なう。<br><br>本論文はPECA（Parameter-Efficient Conciseness Adaptation）を提案する。QLoRAによる教師あり微調整の目的関数に、微分可能な簡潔さの項を一つ加えるだけの手法である。トークン数は離散的で微分できないため、生成がトークン予算を超えたら文末確率を上げる滑らかな信号で代用し、通常の訓練の中で最適化する。選好データも補助モデルも不要で、汎用GPU1台で動く。<br><br>医療推論コーパスで微調整した17億パラメータのモデルでは、平均応答長が72.8%短くなりながら、多肢選択の診断精度は40.8%から44.0%へ上がった。簡潔さの強さを変える掃引では、簡潔さと診断の完全性のバランスを示す解釈可能なフロンティアが得られた。短さと正確さは両立しうるという成果である。出典：arXiv","timestamp":1794504072000,"title":"Parameter-Efficient Conciseness Adaptation: Differentiable Length Control for Concise Clinical Reasoning in Smaller Language Models","titleJa":"小さい言語モデルの臨床推論を短く正確に――PECA","url":"https://arxiv.org/abs/2611.17128"},{"authors":["Zimo Xu","Wenzhuo Liu","Hideki Nakayama"],"categories":["cs.AI","cs.CL","cs.CR"],"field":"cs.AI","genre":"Ethics / Safety","monthKey":"2026-11","publishedAt":"2026-11-12T17:07:22Z","source":"arXiv","summaryHtml":"プロンプトインジェクションに対する強制型の防御は、エージェント自身のモデルにプログラムや権限方針、依存グラフといったセキュリティ成果物を書かせ、それをコードで強制する仕組みだ。しかし小さな言語モデルにその成果物を正しく書けるだろうか。15のオープンウェイトモデルを調べたところ、1.7Bから12Bの13モデルを含め、書かれた方針やグラフは攻撃を許し、CaMeLのプログラムは最大68%のエピソードで実行すらできなかった。<br><br>そこで提案されたCapLiteは、方針をモデルの文章ではなくツールのスキーマから導き、書き込み呼び出しをツール結果を読む前に確定させる。さらに、誰に・何に影響するかを決める引数は、ユーザーの要求に明記されたものだけを認める。こうして書き込みの完全性が保証される。注入された文言が書き込みを追加することはなく、ユーザーが言及しなかった相手や金額、対象への書き込みは一切届かない。<br><br>AgentDojoの13,935件の攻撃エピソードでは、攻撃は一度も成功しなかった。攻撃下での有用性はCaMeLと同等（29.0%対27.2%）でありながら、トークン使用量はエピソードあたり17.1kとCaMeLの18%にとどまり、強制型防御の中で最も高いトークンあたり有用性を示した。出典：arXiv","timestamp":1794503242000,"title":"CapLite: Prompt-Injection Defense for Small Language Model Agents without Model-Written Security Artifacts","titleJa":"CapLite――小さな言語モデルエージェントのためのプロンプトインジェクション防御","url":"https://arxiv.org/abs/2611.17115"},{"authors":["Petter Törnberg"],"categories":["cs.SI","cs.AI"],"field":"cs.SI","genre":"Ethics / Safety","monthKey":"2026-11","publishedAt":"2026-11-12T17:06:54Z","source":"arXiv","summaryHtml":"自律AIエージェントが持続的な集団で相互作用する時代、その集団の能力とアラインメントは個々のモデルだけでなく、相互作用を律する制度にかかっている。にもかかわらずAI研究は個々のエージェントにほぼ集中してきた。本パースペクティブは、制度設計をAI研究の独立した焦点とすべきだと論じる。<br><br>制度政治経済学、社会認識論、組織論を引き、協調を維持し、信頼できる集合的判断を可能にし、正統な人間の目的に説明責任を果たすAI制度のための7原則を展開する。相互的貢献、説明責任ある権威、機能分化、認識的多元性、批判と訂正、人間の方向づけ、制度的適応である。機械科学への適用で具体化する。<br><br>さらに、異なる制度配置の下で対応するエージェント集団を動かす実験的研究プログラムを提案し、自律研究エージェント向けのAPIファーストな学術誌MoltJournalを、制度をプログラム可能・観察可能にする実例として紹介する。制度設計は個々のエージェントをそろえるだけでなく、集団の能力そのものを形づくり、信頼できる有能な集団へ変える研究課題だという。出典：arXiv","timestamp":1794503214000,"title":"Designing Institutions for Autonomous AI","titleJa":"自律AIをそろえるのは制度設計だ――エージェント集団を協調させる7原則","url":"https://arxiv.org/abs/2611.17114"},{"authors":["Jiachun Jin","Zetong Zhou","Haonan Wang","Xiao Yang","Jun Zhu","Zhijie Deng"],"categories":["cs.RO","cs.AI","cs.LG"],"field":"cs.RO","genre":"Agents / Robotics","monthKey":"2026-11","publishedAt":"2026-11-12T17:04:50Z","source":"arXiv","summaryHtml":"身体を持つ基盤モデルの学習には、多様なロボットの相互作用データが欠かせないが、収集コストが高い。一方、一人称視点の人間動画は豊富な経験源であり、潜在行動モデル（LAM）はそれを方策学習の教師信号に使う手段として注目されてきた。ただし既存のLAMは動画の再構成だけから潜在行動を学ぶため、表現が行動そのものではなく見た目でまとまってしまい、人間の行動とロボットの行動の対応づけが難しい。<br><br>本研究が提案するSALAは、潜在行動の意味的な対応づけを重視する。ペアデータを必要とせず、人間とロボットのクリップの言語記述から意味的類似度を推定し、ソフトな近傍構造として人間側の潜在行動を意味的に近いロボット側へ導く。ロボットの行動再構成が潜在空間を制御に根ざしたものにする。<br><br>こうして得られた共有の潜在行動空間は、人間動画とロボット動画の両方で身体基盤モデルを訓練する統一的な教師信号になる。汎用的な人間動画を増やすほど下流課題の行動予測誤差が下がり、課題特化の人間動画を増やすほど実世界でのロボットの成功率が上がるという、二軸のスケーリングが示された。出典：arXiv","timestamp":1794503090000,"title":"SALA: Semantically Aligned Latent Actions Enable Dual-Axis Scaling of Embodied Foundation Models","titleJa":"意味でそろえる潜在行動――人間動画とロボット動画を一つの行動空間へ","url":"https://arxiv.org/abs/2611.17110"},{"authors":["Arnab Sanyal","Gourav Datta","Sandeep P. Chinchali"],"categories":["cs.LG","cs.AR","cs.CL","cs.IT"],"field":"cs.LG","genre":"LLM / NLP","monthKey":"2026-11","publishedAt":"2026-11-12T17:03:40Z","source":"arXiv","summaryHtml":"エッジデバイスでどのLLMが動くか、どれだけ速く動くかはメモリが決める。4GBのJetson Nanoでは容量が、8GBのJetson Orin Nano Superでは帯域が制約になる。GPTQやAWQ、llama.cppの量子化形式は行列の整数コードすべてに同じビット数を割くが、コードの分布は一様ではない。本論文は既存形式を保ったままGPTQを調整してコードを圧縮しやすくし、ハフマン符号で可逆圧縮して、DRAMとL2の間の小さな復号器で必要なときにだけ復号するLazyWeightsを提案する。<br><br>復号はGPUカーネルに手を加えず、DRAMを移動するのは符号化されたバイトだけだ。パープレキシティの許容を1%と3.5%としたとき、Phi-3-mini、Mistral-7B、SmolLM-1.7Bは最良のllama.cpp形式より5.7〜31.4%小さくなった。0.21mm²のASIC復号器はOrinでトークンあたり遅延とエネルギーを最大36%と38%削減し、プロンプト照合の推測を併用すると54%と44%に達する。Nanoではllama.cppのCPU実行より時間とエネルギーを58〜64%と53〜57%削減し、Mistral-7Bを3.89ビットで6.6倍速く流す。<br><br>ハフマン復号器は同じスループットでrANS復号器より符号化率と面積で優れ、ASIC復号器はFPGA上でもビット単位で正確に動作した。重みを必要な分だけ復号する設計が、エッジでのLLM実行を小さく速くする道を示す。出典：arXiv","timestamp":1794503020000,"title":"LazyWeights: Decode-on-Demand Edge LLMs","titleJa":"エッジでLLMを動かす――重みを必要なときだけ復号するLazyWeights","url":"https://arxiv.org/abs/2611.17108"},{"authors":["Paul Grunenwald","Benoît Crabbé","Guillaume Wisniewski","Pirmin Lemberger"],"categories":["cs.CL","stat.ML"],"field":"cs.CL","genre":"LLM / NLP","monthKey":"2026-11","publishedAt":"2026-11-12T17:03:05Z","source":"arXiv","summaryHtml":"経験リスク最小化で訓練された言語モデルは、方言マーカーのような見せかけの相関に頼り、分布外での汎化を損ないがちだ。表層の手がかりに依存すると、訓練データの分布から外れた途端に性能が落ちる。不変リスク最小化（IRM）は環境をまたいで安定する予測関係を見つけて近道を抑える狙いだが、NLPでの実用性は議論が分かれてきた。本論文は因果の枠組みで、ラベル生成特徴・交絡・選択バイアスという三つの近道メカニズムのもとでIRMを評価する。<br><br>結果としてIRMは、因果・反因果の構造いずれでも近道を退け、環境のばらつきが少なくラベルノイズが増える条件でも有効だった。さらに人工的な設定を超え、職業と性別の関連を扱うBias in Biosや、意味を帯びた俳優名の近道を扱うActorCorrという現実に近い場面でも検証した。<br><br>不変学習は現実的なテキストの近道も緩和できる一方、意味のある特徴については不変性ペナルティの慎重な調整が必要だという。見せかけの手がかりに頼らず、環境が変わっても崩れない言語モデルの設計に指針を与える研究だ。出典：arXiv","timestamp":1794502985000,"title":"Disentangling Spurious Correlations: How IRM Handles Diverse Shortcuts in Text Classification","titleJa":"近道に頼る言語モデルを正す――不変リスク最小化がテキスト分類の見せかけの相関を断つ","url":"https://arxiv.org/abs/2611.17107"},{"authors":["Saleh Ashkboos","Dhruv Desai","Lavinia Ghita"],"categories":["cs.AI","cs.CL","cs.LG"],"field":"cs.AI","genre":"LLM / NLP","monthKey":"2026-11","publishedAt":"2026-11-12T16:45:12Z","source":"arXiv","summaryHtml":"基盤モデルを金融データで微調整すると、ニュースからのイベント種別判定やリスク・コンプライアンス言語の監視、決算資料への質問応答など幅広い用途が開ける。課題は、課題性能を上げながらモデルの汎化能力を落とさないことだ。本研究はQwen3-8Bの低ランク適応（LoRA）について、3つの学習方法を広範に比較した。<br><br>比較したのは、ラベルのみを教師とする応答限定LoRA、教師モデルの推論過程をラベルとともに損失に含める単一アダプター推論、推論とラベルで別々のアダプターを学習する二重アダプター複合学習だ。応答限定LoRAはドメイン内性能を上げ、汎用能力は凍結モデルとほぼ同等に保った。単一アダプター推論ではドメイン内指標が応答限定に及ばず、MMLU-Proはわずかに上がる程度で、他の維持指標も通常の変動範囲内だった。二重アダプターもさらなる改善はなかった。<br><br>さらに教師の推論過程を要約して短くしてから学習すると、較正は応答限定の側に近づくが届かないことも分かった。推論過程を入れることが常に得になるとは限らず、目的に応じて学習方法を選ぶ必要がある。出典：arXiv","timestamp":1794501912000,"title":"Reasoning Supervision and Capability Retention in LoRA Domain Adaptation","titleJa":"推論の教師あり学習と能力維持――金融分野へのLoRA適用の検証","url":"https://arxiv.org/abs/2611.17072"},{"authors":["Xinheng Ding","Seyyed Saeid Cheshmi","Ziyang Zhang","Tairan Chen","Wenya Xie","Yu Hou"],"categories":["cs.CL","cs.AI"],"field":"cs.CL","genre":"Agents / Robotics","monthKey":"2026-11","publishedAt":"2026-11-12T16:42:04Z","source":"arXiv","summaryHtml":"LLMエージェントが長期の対話や作業をこなすには、過去の経験をどう記憶し、必要なときに引き出すかが決め手になる。だが記憶の設計はこれまで職人芸に頼ってきた。本研究は、記憶の仕組みそのものをプログラムとして進化させる枠組みMAPEを提案する。最小限の種から出発し、標準化されたライフサイクルと診断・提案の反復によって記憶プログラム全体を探索する。<br><br>長期記憶ベンチマークLoCoMoとLongMemEvalで評価したところ、手作業の設計と比べて精度が最大で12ポイント向上し、提供コストは35%に抑えられた。分析からは二つの型が浮かんだ。生の会話をそのまま検索可能な証拠として残すことと、取得した証拠を質問の意図に合わせて組み立てることである。組み立てモジュールを既存の記憶システム5種に移植すると、すべてで精度が上がった。<br><br>さらに、最適化の目標が計算の配分を変えることも分かった。精度とコストを同時に最適化すると、計算はLLMによる記憶構築から問い合わせ時の選択的処理へ移った。記憶の設計原則を実証的に掘り起こす手法として、エージェントの長期記憶研究に新しい道を開く。出典：arXiv","timestamp":1794501724000,"title":"Discovering Effective Agent Memory Designs through Program Evolution","titleJa":"エージェント記憶の設計をプログラム進化で発見する――MAPEが示す二つの型","url":"https://arxiv.org/abs/2611.17068"},{"authors":["Ashvin Gupta","Brendan Delaney","Alessandra Russo"],"categories":["cs.CL","cs.LG"],"field":"cs.CL","genre":"LLM / NLP","monthKey":"2026-11","publishedAt":"2026-11-12T16:34:49Z","source":"arXiv","summaryHtml":"構造化電子カルテ（EHR）のモデルは通常、各臨床概念をデータセット固有のトークンとして扱い、出来事に結びついた自然言語の意味を捨ててしまう。そのため概念間の関係は共起から学ぶしかなく、既存の意味知識は活かされない。言語モデルが持つ医学の常識は、予測には届かないままだった。本論文は、事前学習済みの因果言語モデルを縦断的EHR予測に適応させるtEHRを開発する。<br><br>出来事を自然言語の記述で表し、そのテキスト流にEHR適応の継続事前学習を施したうえ、LoRAによるタスク別識別ファインチューニングでLLMを縦断的患者エンコーダとして使う。MIMIC-IVの4予測タスクとCPRDでの膵がん予測（1〜12か月）で評価し、Mistral-7B-v0.3を土台とするtEHRが最も強い性能を示した。<br><br>臨床記述を除く・ずらす、数値を省く、適応のどちらかの段階を省くと性能が落ち、経過時間の明示はほとんど効かなかった。学習された患者表現には、疾患リスクや病歴のパターンと対応する臨床的に整合した構造も見られたという。出典：arXiv","timestamp":1794501289000,"title":"Evaluating Pretrained Language Semantics for Structured EHR Prediction Tasks","titleJa":"診療記録を言葉として読む――言語モデルの意味知識で電子カルテ予測を強くする","url":"https://arxiv.org/abs/2611.17053"},{"authors":["Íñigo Zubeldia","Boris Bolliet","Francisco Villaescusa-Navarro","Pablo Villanueva-Domingo","Miles Cranmer"],"categories":["cs.CL","astro-ph.IM","cs.AI","cs.DL"],"field":"cs.CL","genre":"Ethics / Safety","monthKey":"2026-11","publishedAt":"2026-11-12T16:33:51Z","source":"arXiv","summaryHtml":"大規模言語モデルによる査読はすでに実用規模で使われているが、その評価は限られてきた。本研究は、実際の論文に4種類（一般的な問題、数学、数値、引用）の誤りを3段階の重症度で混入させ、各査読システムの誤り検出率を種類・重症度別に測るとともに、誤りのない論文に対する誤検出率も測るベンチマークを提案する。引用主張を文献検索で検証するマルチエージェント査読者Skepthicalも提示した。<br><br>天体物理学と機械学習の各15編の最新arXiv論文に計357件の誤りを混入し、単独LLM査読者6種、Claude Codeの2構成、公開済み査読者3種、Skepthicalの計12システムを評価した。検出率を最も左右したのはモデルの選択で、同じプロンプトでも最先端LLM3種の合計検出率には約50ポイントの差があった。道具や足場は、モデルに欠けるものを補うときに有効で、Skepthicalは天体物理学で引用誤りの検出率が全システム中最大だった。<br><br>誤検出率は大半のシステムで10%未満だったが、プロンプトや足場で変動し、数学のフラグが主な誤検出源だった。評価パイプライン、混入した誤り、判定ログはベンチマークとして公開されている。出典：arXiv","timestamp":1794501231000,"title":"Auditing AI peer reviewers: a benchmark on real scientific papers","titleJa":"AI査読者を監査する――実際の論文に誤りを混入させたベンチマーク","url":"https://arxiv.org/abs/2611.17052"},{"authors":["Yihan Xia","Wenxin Xu","Taotao Wang"],"categories":["cs.AR","cs.CR","cs.LG"],"field":"cs.AR","genre":"Ethics / Safety","monthKey":"2026-11","publishedAt":"2026-11-12T16:27:07Z","source":"arXiv","summaryHtml":"AIサービスの利用者は、推論や学習が宣言どおりの計算で行われたという保証を、モデルやデータを公開せずに得たいと考える。ゼロ知識証明はその保証を与えられるが、証明の生成コストが高い。ハードウェア加速の研究は個々の暗号操作の高速化を報告することが多く、ニューラルネットワーク全体、とりわけ大規模トランスフォーマーの証明コストにどう効くかは明らかでなかった。<br><br>本論文は、検証可能なAIワークロード、証明システム、暗号カーネル、ハードウェアという4層の枠組みを導入し、文献を整理したうえで、6つの証明器と7つのカーネルを実測した。支配的なコストは証明システムと入力長によって変わる。低ランク微調整では、固定されたモデル重みへのコミットメント開示のコストは入力長64から2048までほぼ一定で、中間値に伴う作業が増えていく。<br><br>130億パラメータの微調整設定は40GBメモリのGPUでは容量を超えたが、80GBのデバイスでは完了し、実行時間だけでなく容量の評価も必要だと示した。カーネル計測では、帯域幅だけのモデルでは見落とされる命令発行と同期の限界も特定した。証明に適した数値形式や固定重みコミットメントの再利用、異種実行、共有ベンチマークへとつなぐ研究課題を提示する。出典：arXiv","timestamp":1794500827000,"title":"Infrastructure for Verifiable AI: Where Proof Costs Go and How Hardware Can Help","titleJa":"AIの計算を検証可能にするには――ゼロ知識証明のコスト構造とハードウェアの役割","url":"https://arxiv.org/abs/2611.17042"},{"authors":["Yuyang Wu","Yang Liu","Zequn Xie","Junjie Wang","Dan Yang","Zehao Tan","Ding-Chu Zhang","Junming Yang","Yue Shen","Jian Wang","Jinjie Gu"],"categories":["cs.MA","cs.AI"],"field":"cs.MA","genre":"Agents / Robotics","monthKey":"2026-11","publishedAt":"2026-11-12T16:26:27Z","source":"arXiv","summaryHtml":"マルチエージェントの深層調査システムは、委任によって検索を並列化し、長いツール履歴を主エージェントの文脈から外す。だが委任が効くのは、タスク配分と下位タスク実行が協調しているときだけだ。主エージェントは有用な下位タスクを出し、サブエージェントは信頼できる証拠を返さなければならない。両者の協調がなければ、並列化の利点は目減りする。<br><br>従来の学習は主エージェントだけを最適化するか、同じチーム報酬を全エージェントに配り、誤解を招く報告を褒め、有用な報告を罰してしまうこともあった。本論文のLEAD-RLは主エージェントとサブエージェントを共同で訓練し、訓練時のルーブリックで各報告の調査上の有用性を評価し、継承するチーム利得を調整する。最終回答の正しさだけがチーム報酬だ。<br><br>5ベンチマーク・2モデル系列で回答品質が向上し、BrowseCompでは精度が2.49ポイント上がり、重要経路コストが24.5%減った。検証中はほぼ同じコストで精度が6.78ポイント上昇した。貢献に応じた信用割当が、品質と効率の両立を進めるという。出典：arXiv","timestamp":1794500787000,"title":"From Delegation to Coordination: Learning Efficient Multi-Agent Deep Research","titleJa":"任せるだけでは足りない――マルチエージェント深層調査を協調で学ぶ","url":"https://arxiv.org/abs/2611.17041"},{"authors":["Kuancheng Ye"],"categories":[],"field":"stat.ML","genre":"Ethics / Safety","monthKey":"2026-11","publishedAt":"2026-11-12T16:21:31Z","source":"arXiv","summaryHtml":"透かし検出器は1文書が透かし入りの言語モデル由来かを判定するが、監査で必要なのは別の数値、すなわちコーパス全体のうち透かし入り文書の割合である。本研究は、すべての文書が未知の量だけ編集されている場合に、Gumbel-max方式とグリーンリスト（KGW）方式の透かしでこの割合をどう推定できるかを調べた。<br><br>編集に制限がなければ識別可能な上限は1になる。既知の最悪な次トークン分布と逐次カップリングを組み合わせ、保持率の下限、エントロピー予算、置換予算の三つで指標づけた検出力包絡線を導き、識別集合が鋭いこと、有限標本での境界、ストリーム向けの信頼系列を示した。Gumbel-maxのシミュレーションでは境界がカバーし、OPT-1.3BとQwen3-1.7Bのテキスト、1万2千件の人手文書では正確な帰無仮説からの頑健な逸脱は見られなかった。<br><br>割合0.2の場合、正確な帰無仮説にもとづく境界はおよそ0.14〜0.38となった。ただし結果は二つの点で脆いことも精密に示されている。AI生成テキストの監査に、編集への耐性を織り込んだ統計的枠組みを与える研究である。出典：arXiv","timestamp":1794500491000,"title":"Prevalence Bounds for Edited Watermarked Text: Power Envelopes and Calibration Sensitivity","titleJa":"編集された透かし入りテキストの普及率を測る――検出力包絡線と較正感度","url":"https://arxiv.org/abs/2611.17035"},{"authors":["Guoan Wang","Feng Liu"],"categories":["cs.AI"],"field":"cs.AI","genre":"Neuroscience","monthKey":"2026-11","publishedAt":"2026-11-12T16:17:16Z","source":"arXiv","summaryHtml":"脳波（EEG）の基盤モデルは数千時間の記録で事前学習されるが、凍結した特徴は下流タスクへの転移が弱く、規模やデータを増やしても一貫して改善しない。専門化のわりに汎用性が低い。本論文は、EEGを一度も見たことのない視覚基盤モデルが、信号を画像として描けば専門モデルより強い凍結EEGエンコーダになることを示す。<br><br>手法SeeEEGは視覚バックボーンを凍結したまま、EEGの見せ方だけを学ぶ。各チャンネルをパッチ行に割り当て、波形またはスペクトログラムとして描き、表示のモンタージュやフィルタ、コントラストをタスク損失で最適化する。学習対象はビューあたり最大1,113パラメータにすぎない。<br><br>8つの臨床・睡眠・感情・BCIデータセットで、凍結DINOv3 ViT-Bを用いたSeeEEGは7つのEEG基盤モデルすべてを上回り、平均順位1.3を記録した。学習した表示は動画エンコーダV-JEPA 2.1にも転移した。ランダム初期化のViTでは15.2ポイント落ちるため、この能力は視覚事前学習に由来するという。出典：arXiv","timestamp":1794500236000,"title":"Your Vision Foundation Model Is Secretly an EEG Foundation Model","titleJa":"視覚の基盤モデルはひそかに脳波の基盤モデルだった――EEGを画像化して読む","url":"https://arxiv.org/abs/2611.17031"},{"authors":["Ekta U. Samani","Christopher G. Atkeson"],"categories":["cs.RO"],"field":"cs.RO","genre":"LLM / NLP","monthKey":"2026-11","publishedAt":"2026-11-12T16:09:49Z","source":"arXiv","summaryHtml":"大規模言語モデルは自律システムに計画や予測、判断を与えられるが、その出力はときに誤る。本レビューは、誤りを抱えたままLLMの有用性をどう最大化するかを問う。答えは、LLMの性能に関する証拠が積み上がるにつれて、システムのLLMへの依存度を適応させることだ。ノイズの多いセンサーや不具合のあるソフトウェアで構成されたシステムが長年そうしてきたように、古典的な手法をLLMにも適用できるという。<br><br>依存度の変え方は、LLMの役割と貢献の種類によって決まる。変化させるにはLLMの信頼度の見積もりが必要で、決定理論や推定、オンライン学習の手法がその見積もりを依存度の決定へ変換する。こうした決定により、LLMの誤りがシステムに及ぶ頻度を減らせる。ただし、まれでも重大な誤りは別で、独立に検証された仕組みで実行を防ぐ必要がある。<br><br>信頼度の見積もりだけでは防げない誤りがあることを認めたうえで、検証機構との組み合わせを提唱する。LLMを部品として組み込む自律システムの設計に、誤り管理の体系的な視点を与えるレビューである。出典：arXiv","timestamp":1794499789000,"title":"Maximizing LLM Utility While Managing LLM Fallibility","titleJa":"LLMの有用性を最大化し、誤りを管理する――信頼度に応じた依存度の調整","url":"https://arxiv.org/abs/2611.17020"},{"authors":["Tian Cai","Andrew Kleist","Jaimin Patel","Duccio Malinverni","Alexander K. Taylor","Malvika Sharan","Renato Umeton","M. Madan Babu"],"categories":["q-bio.BM","cs.AI"],"field":"q-bio.BM","genre":"Other","monthKey":"2026-11","publishedAt":"2026-11-12T16:08:33Z","source":"arXiv","summaryHtml":"生物学の基盤モデルは数百万の塩基配列やタンパク質、単一細胞の測定値から学習し、タンパク質構造や変異の影響、遺伝子操作への細胞応答を予測する。さらに大規模言語モデルにもとづくエージェント型システムは、平易な言葉の依頼から多段階の解析を実行し、基盤モデルを道具として呼び出せるようになった。だがこれらの出力がいつ信頼できるのかは、しばしば不明確なままだった。<br><br>本レビューはこの問題をモデルの「知識の境界」として捉え直す。出力が信頼できる入力・課題・条件の範囲を指す概念で、データ、アーキテクチャ、学習方式、評価方式、事後解析という5つの設計要素が境界を定めると提案する。現在のモデルがどこで成功しどこで失敗するかの証拠を検討し、限界を標準化された形で記述する方法を示す。<br><br>境界を明示することで、研究者自身も、その代理として働くエージェントも、ツールを頼れる場面と頼れない場面を見分けられるようになる。基盤モデルとエージェントの利用が広がるなかで、性能の宣伝ではなく限界の記述が、信頼できる科学的利用の出発点になるという。出典：arXiv","timestamp":1794499713000,"title":"AI for Biologists: The Knowledge Boundaries of Foundation Models in the Age of Agentic Systems","titleJa":"生物学のための基盤モデルはどこまで信じられるか――「知識の境界」を定める5要素","url":"https://arxiv.org/abs/2611.17015"},{"authors":["Qijia Zhuang","Yanyi Gou","Wenbin Ma","Yuxiang Ren"],"categories":["cs.AI"],"field":"cs.AI","genre":"Agents / Robotics","monthKey":"2026-11","publishedAt":"2026-11-12T16:05:23Z","source":"arXiv","summaryHtml":"大規模言語モデル（LLM）のエージェントは、外部の「スキル」を使ってタスクの手順やツール利用の経験を再利用する。汎用スキルは共通の実行手順を記すが、具体的なツールの選び方や運用方法、求められる出力は利用者ごとに異なる。長期のタスクでは、サブゴールや利用可能な入力、環境の状態が実行とともに変わるため、エージェントは拡大し続けるスキルプールから今使えるスキルを選び、次の手順の候補も用意しなければならない。<br><br>本研究は、汎用スキルを個人向けに修正し、オンラインで振り分ける「Skill Adapter」を提案する。利用者の要求と実行フィードバックから局所的な調整を抽出し、汎用スキルに結びついたAdapterとして蓄積する。ルーティングエージェントは、現在のサブタスクや実行の進捗、環境からのフィードバックをもとに、汎用スキルと適用可能なAdapterを選び、タスク単位のオンラインスキルライブラリを少しずつ整え、メインのLLMが必要に応じて読み取る。<br><br>次のノードの候補はあらかじめ読み込まれ、実際の入力が決まった時点で適用可能性が再確認される。修正と振り分けの2種類の判断は、それぞれ修正による利得と振り分けの結果で強化学習により最適化される。ALFWorld、WebShop、SkillsBenchでの評価では、SkillRLと比べてタスク成功率が平均11.43ポイント向上し、3ベンチマークすべてで平均実行時間が短縮された。スキルプールが1000件に増えても優位性は保たれた。出典：arXiv","timestamp":1794499523000,"title":"Skill Adapter: Personalized Modification and Online Routing of General-Purpose Skills","titleJa":"汎用スキルを自分仕様に変える――LLMエージェントのSkill Adapter","url":"https://arxiv.org/abs/2611.17007"},{"authors":["Zhengxu Yu","Ke Xu","Meng Fang","Haitham Ammar","Weilin Luo","Jun Wang"],"categories":["cs.AI"],"field":"cs.AI","genre":"LLM / NLP","monthKey":"2026-11","publishedAt":"2026-11-12T15:32:47Z","source":"arXiv","summaryHtml":"適応的推論の既存手法は、モデルが書き出す明示的な推論を短くするか、モード切替で省略するかだった。いずれも答えはトークン単位で書き出される。本研究は「どれだけ考えるか」ではなく「考えるか否か」を問う、ゼロかTかの思考という別の枠組みを提案する。一度の順伝播のなかの暗黙の思考だけで答えるか、Tトークンのコストを払って完全な自己回帰推論を行うかを選択する。<br><br>実現にはハイブリッド決定モデル（HDM）を用いる。凍結した一つのバックボーンが両モードを担い、軽量な自己ルーティングブロックが切り替える。このブロックは、暗黙の思考がすでに生んだものから「考えることの価値」――遅いモードが速いモードにもたらす効用の期待値――を推定し、要求ごとに設定される価格λを超える場合にのみ遅いモードを走らせる。逐次決定のラベルがないエージェント課題向けに、エピソード単位の報酬からブロックを訓練するCDPOという強化学習法も導入する。<br><br>MMLU-ProやGPQA-Diamond、エージェント課題MiniWoBなどで評価した結果、JevBenchではHDM-4Bが精度0.857でベースラインを上回り、中央値の応答時間は72.5%短縮された。MiniWoBではHDM-27Bがトークンコストを80.1%削減した。推論の量ではなく、推論する価値そのものを学ぶ方向性を示した。出典：arXiv","timestamp":1794497567000,"title":"The Value of Thinking: Learning When to Reason in Hybrid Decision Models","titleJa":"考えることの価値――いつ推論すべきかを学ぶハイブリッド決定モデル","url":"https://arxiv.org/abs/2611.16961"}],"updatedAt":"2026-11-15T21:26:21Z","version":1};
    const byId = id => document.getElementById(id);
    const norm = s => String(s||'').toLowerCase().normalize('NFKC').replace(/\s+/g,' ').trim();
    const esc = s => String(s||'').replace(/[&<>"]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
    const plainText = h => String(h||'').replace(/<br><br>/g,' ').replace(/<[^>]+>/g,'');
    const months = [...new Set((DATA.articles||[]).map(a => a.monthKey).filter(Boolean))].sort().reverse();
