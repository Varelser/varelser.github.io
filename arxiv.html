  <script>
    const DATA = {"articles":[{"authors":["Hongsin Ahn","Ji Sun Hong","Doug Hyun Han"],"categories":[],"field":"Psychiatry Investigation","genre":"Psychedelics / Trauma","monthKey":"2026-11","publishedAt":"2026-11-25T00:00:00Z","source":"Crossref","summaryHtml":"対人トラウマの心理的負担は世界的な問題だが、低・中所得国（LMICs）ではトラウマ関連障害の発見と治療に大きな空白がある。ICD-11で複合性PTSD（CPTSD）が導入され、PTSDとの区別が重要になった。慢性的なトラウマが多い資源制約下の環境でこそ区別が要る。本レビューはPRISMAガイドラインに沿い、LMICsにおける対人トラウマとPTSD／CPTSDの有病率、利用可能な介入を調べ、35研究を抽出して質を評価した。<br><br>結果として、高いトラウマ曝露と臨床的な認識のあいだに大きな隔たりがあった。最も脆弱なのは子ども・思春期・女性で、家庭内暴力や性暴力に繰り返し曝されていた。PTSDの有病率は高かったが、ICD-11基準でCPTSDを扱った研究は3件のみだった。トラウマ焦点化認知行動療法やナラティブ・エクスポージャー・セラピーといった根拠ある介入は導入されているものの、負担の大きさに比べて評価研究は限られていた。<br><br>結論として、LMICsでは診断の遅れと、研究から実践への橋渡しの不足が目立つ。著者らは実装科学の枠組みを優先し、タスク・シフティング（非専門職への移管）や文化に合わせた介入の調整、デジタルヘルスとの統合によって、脆弱な生存者への持続可能なケアを確保すべきだと提言する。出典：Psychiatry Investigation","timestamp":1795564800000,"title":"Prevalence and Intervention Gaps for PTSD and CPTSD Following Interpersonal Trauma in Low- and Middle-Income Countries: A Systematic Review","titleJa":"低・中所得国における対人トラウマ後のPTSD・複合性PTSD――有病率と介入のギャップをめぐる系統的レビュー","url":"https://doi.org/10.30773/pi.2026.0169"},{"authors":["Achim Hecker"],"categories":[],"field":"Frontiers in Psychology","genre":"Consciousness / Philosophy","monthKey":"2026-11","publishedAt":"2026-11-25T00:00:00Z","source":"Crossref","summaryHtml":"意識の科学理論は「意識は何かの役に立つ」という機能的主張を日常的に行うが、その主張が何を意味するのかは曖昧なままだ。本論文は、グローバル・ワークスペース理論、高次理論、統合情報理論、再帰処理理論という意識の主要4理論を概念分析し、対立の裏に4つの共通の前提があることを示した。すなわち、意識状態には最小限の十分な神経相関があること、意識が機能的な利得をもたらすこと、神経・生物学的状態が物理状態に随伴すること、物理領域が因果的に完結していることである。<br><br>この4前提を合わせると、現象的経験そのものが、その十分な物理的実現者がすでにもたらしている行動上の違いを超えて、さらに別の行動上の違いを生むと帰属することは制約を受ける。論文はここに「機能の誤謬」を見出す。神経実現者や付随するアクセス機構の機能を示す証拠だけから、現象的経験そのものの機能を推論してしまう誤りである。回避のため、機能帰属の対象・因果的証拠・説明レベルを特定し、弱・中・強の機能的主張を区別する証拠の梯子を備えた診断枠組みを提示した。<br><br>この枠組みを機能的説明や実証パラダイムに適用することで、意識経験の精密な操作化や実験解釈の統制、理論間の比較がしやすくなるという。意識の機能をめぐる議論を、証拠の水準を明確にしたうえで進めるための道具立てを提案した論文である。出典：Crossref","timestamp":1795564800000,"title":"The functional fallacy: a diagnostic framework for functional claims in the psychology of consciousness","titleJa":"「機能の誤謬」――意識の心理学における機能的主張の診断枠組み","url":"https://doi.org/10.3389/fpsyg.2026.1976104"},{"authors":["Qiong Yu"],"categories":[],"field":"Frontiers in Psychology","genre":"Consciousness / Philosophy","monthKey":"2026-11","publishedAt":"2026-11-25T00:00:00Z","source":"Crossref","summaryHtml":"意識の流れ（ストリーム・オブ・コンシャスネス）の文章構造が、読者の共感処理にリアルタイムでどう影響するかは、認知物語論と実験心理学の接点にある問いである。本研究は意識の流れの言説を、深い内的焦点化、多主体の意識移行、時間的モンタージュという3つの次元に分解し、ヴァージニア・ウルフ『ダロウェイ夫人』から抽出した120の未改変の文章を用いて、成人読者180名の生理・行動データを収集した。<br><br>結果として、深い内的焦点化が最も大きな効果を示し（b=0.51）、多主体の意識移行（b=0.27）、時間的モンタージュ（b=0.13）が続いた。意識移行点への最初の注視に時間固定した解析では、眼球の再検査が約340ミリ秒でピークに達し、心拍の減速、皮膚電気反応のピークへと続く時間順序のある反応列が確認された。登場人物の区別は、主体移行と共感の関連の39.6%を媒介し、時間的モンタージュは認知負荷が低い場合にのみ共感と関連した。<br><br>結果は、読書中の共感を登場人物の意識のオンライン・シミュレーションに帰する「意識モデリング仮説」と整合的だという。文学的テクストの構造が身体反応の時間経過にまで刻まれることを示し、意識の表象が共感をどう運ぶかについての実証的な手がかりを与えた研究である。出典：Crossref","timestamp":1795564800000,"title":"Hierarchical effects of three stream-of-consciousness structural features on real-time empathic processing","titleJa":"意識の流れの三つの構造特徴がリアルタイムの共感処理に与える階層的効果","url":"https://doi.org/10.3389/fpsyg.2026.1957882"},{"authors":["Wilhelmina M. Botes","Artur Mendes","Bart Huffman","Madison Fleischaker","Ciara Staunton","Beverley Townsend","Paul Ogendi","Lukman Abdulrauf","Andrea Parziale","Gabriela Skoczylas-Kizak","Tiffany Hong","Damian Eke","Ricardo Chavarriaga","Blaire Morgan Porter","Thomas Nichols","Franco Pestilli"],"categories":[],"field":"OSF Preprints","genre":"Ethics / Safety","monthKey":"2026-11","publishedAt":"2026-11-25T00:00:00Z","source":"OSF Preprints","summaryHtml":"現代のヒト神経科学は、国境を越えた神経データの交換と分析に依存している。しかし規制の枠組みは、分散した研究環境のなかで保護の継続性を保てていない。本研究は、アフリカ・欧州・中南米とカリブ・北米にわたる93か国と10の運用中のガバナンス単位を比較した。その結果、神経データが独自の規制対象として認識されることはまれで、通常はより広い法的分類のなかに吸収されていることが分かった。<br><br>国際的な共有は原則として認められているが、派生物や埋め込み、AIモデルへの変換が、継続的な保護の範囲と実施方法を問う。研究は、国際交換が「条件付き相互運用性」によって定義されることを示した。すなわち実効的な保護には、法的・制度的・技術的な統制を整合させる必要があるという。<br><br>知見を実務化するため、データからモデルまでのライフサイクルを対象とするモジュール型のガバナンス・ツールキットを導入した。神経データ・リスク分類枠組み、移転と変換のための意思決定支援ツール、世界的な法の調和なしに保護を維持するための神経データ移転・アクセス合意を含む。AI時代における脳データの扱い方を設計する提案である。出典：OSF Preprints","timestamp":1795564800000,"title":"A decision support toolkit for AI-ready neuroscience data governance","titleJa":"AI時代の神経科学データ・ガバナンスのための意思決定支援ツールキット","url":"https://osf.io/preprints/psyarxiv/5ewsk_v2/"},{"authors":["Wanxin Wen","Ruihong Wang","Kaiqi Lin","Shibiao Wu","Hongji Lu","Aili Lu"],"categories":[],"field":"Frontiers in Systems Neuroscience","genre":"Consciousness / Philosophy","monthKey":"2026-11","publishedAt":"2026-11-25T00:00:00Z","source":"Crossref","summaryHtml":"意識障害（DOC）の患者管理は臨床上の難題であり、鍼は千年以上にわたり意識障害の治療に用いられてきたが、その臨床的意義は十分に検証されていない。本研究はDOC患者30名を対象に、電気鍼刺激の即時効果を、パワースペクトル密度・エントロピー・フラクタル次元・マイクロステートを含む多次元評価で調べた予備的観察研究である。<br><br>その結果、電気鍼刺激はデルタ帯パワーを有意に低下させ、アルファ帯とベータ帯のパワーを高めた。同時にデルタ帯とシータ帯のエントロピー指標が上昇し、Katzフラクタル次元も高まり、マイクロステートのパラメータにも特徴的な変化がみられた。刺激後のEEG指標の一部は、最小意識状態（MCS）と無反応覚醒症候群（UWS）の区別に役立つ可能性を示した。<br><br>14日間の包括的治療後、患者の40%で意識レベルの改善がみられた。ベースラインのEEG指標と刺激後のEEG指標は、14日後の意識改善の予測力で同程度だった。電気鍼刺激後のEEG動態はMCSの診断補助となり、ベースラインEEGは短期的な臨床改善の予測に役立つ可能性がある。出典：Frontiers in Systems Neuroscience","timestamp":1795564800000,"title":"Acute EEG changes associated with electroacupuncture in disorders of consciousness: a preliminary observational study","titleJa":"電気鍼刺激による意識障害患者の急性EEG変化――予備的観察研究","url":"https://doi.org/10.3389/fnsys.2026.1971214"},{"authors":["Ziang Wang","Linghong Kong"],"categories":[],"field":"Frontiers in Psychology","genre":"Consciousness / Philosophy","monthKey":"2026-11","publishedAt":"2026-11-25T00:00:00Z","source":"Frontiers in Psychology","summaryHtml":"瞑想の伝統は存在論や語彙、制度、実践が異なるが、限られた過程の次元で比較できるのではないか。本論文は、身体の落ち着き、内受容-意味の組織化、非強制的情動調整、規範-関係的志向という4つの候補次元を提示し、仏教のマインドフルネス、道教・中国養生、ヨーガ・ヒンドゥー瞑想、そして正気（zhengqi）に基づく試作モデルに例示的に当てはめた。比較の地図は仮説生成のための文献統合であり、伝統が存在論や効能を共有することの証拠ではない。<br><br>著者らは正気に基づく瞑想を、歴史的に実証された伝統ではなく、テクスト・医学・実践の資源から設計した現代の試作モデルとして構築した。その統合がもたらしうるとされるのは「生命統合（vital integrity）」の経験、すなわち身体的一貫性と方向づけの文化的に形づくられた状態であり、生理状態や一般的リラクセーション、肯定的気分、気への信念とは区別されるという。理論は道教の自己の太極モデルを、自己構造の広い説明から、構成概念の境界や競合メカニズム、反証経路を備えた実践レベルの枠組みへと拡張する。<br><br>独自のヒトデータは報告されていない。5つの命題と段階的研究計画により、比較次元や文化的意味、調整の姿勢、価値の教示、安全の境界を検証・改訂・棄却する方法が示された。文化的に構成された人格のあり方を、一般的手法に平坦化することも、実証的挑戦から守ることもなく研究できるかを問う論文である。出典：Frontiers in Psychology","timestamp":1795564800000,"title":"Zhengqi-informed meditation as vital-integrity cultivation: a cultural-psychological model of embodied self-regulation","titleJa":"正気に基づく瞑想を生命統合の涵養として捉える――身体的自己調整の文化心理学的モデル","url":"https://www.frontiersin.org/articles/10.3389/fpsyg.2026.1980659"},{"authors":["Gregoris Mentzas"],"categories":[],"field":"Frontiers in Artificial Intelligence","genre":"Ethics / Safety","monthKey":"2026-11","publishedAt":"2026-11-25T00:00:00Z","source":"Frontiers in Artificial Intelligence","summaryHtml":"AIは受動的なコンテンツ生成から、自律性・適応性・目標志向的推論を備えたエージェント型AI（AgAI）へと進化している。知覚・計画・独立した行動が可能になる一方で、目標の不一致、連鎖する運用エラー、セキュリティ脆弱性など、社会技術的なリスクの新たな類型が生まれる。本論文はAgAIの全体像を概観し、計画・記憶・行動・マルチエージェント協調という構成要素と、医療・教育・製造・ロボティクス・ソフトウェア開発への変革的可能性を検討した。<br><br>既存の企業・規制ガバナンス枠組みを分析し、説明責任・法的責任・リアルタイム介入の面での空白を指摘した。信頼できるAgAIには、コンテンツの規制から自律的な結果の制約への転換が必要だと論じる。動的アライメント、責任帰属、検証可能な仕様、標準化されたベンチマークに焦点を当てた7つの研究・ガバナンス課題を提案した。<br><br>エージェント型AIが人間の価値と整合したままでいるための課題を整理し、ガバナンスの焦点を「何を生成するか」から「何を引き起こすか」へ移すべきだと提言するレビュー論文である。出典：Frontiers in Artificial Intelligence","timestamp":1795564800000,"title":"Trustworthy agentic AI systems: navigating the risks and governance of autonomous AI","titleJa":"信頼できるエージェント型AIシステム――自律型AIのリスクとガバナンスをめぐって","url":"https://www.frontiersin.org/articles/10.3389/frai.2026.1984864"},{"authors":["Marc Wittmann","Julie Papastamatelou","Sepideh Ravahi","Liane Hofmann","Cecilia Bastos"],"categories":[],"field":"PLOS ONE","genre":"Consciousness / Philosophy","monthKey":"2026-11","publishedAt":"2026-11-25T00:00:00Z","source":"PLOS ONE","summaryHtml":"ドイツの代表サンプル440人を対象に、非日常的体験がどれほど広く、どのような現象として現れるかを調べた研究。こうした体験は文化や時代を問わず広く報告され、しばしば文化的にも価値づけられてきた。強い畏敬や愛、喪失といった感情体験から、テレパシーや何者かの存在を感じる体験までを、現象学的に基礎づけられた尺度INOEで捉え、例外的体験の質問票PExE-IIと、肯定的な自己変容を測るWAKE-16を併用した。<br><br>結果として、非日常的体験は広く分布していた。最も多かったのは強い感情体験で、テレパシーや存在の感覚といった明示的に例外的とされる現象も、頻度は低いものの10〜30%にのぼった。集団で一般的な体験ほど、個人の中でも頻繁に生じる傾向がみられた。<br><br>構造方程式モデリングでは、INOEが自己超越的な人格発達の有意な正の予測因子となり、非日常的体験が人間の経験における広範で意味のある側面であることが示唆された。超常現象の真偽ではなく、体験そのものの現象学と変容的意義に焦点を当てた点が特徴である。出典：PLOS ONE","timestamp":1795564800000,"title":"Mapping nonordinary experiences in a representative German sample: Phenomenology, prevalence and links to self-transcendence","titleJa":"非日常的体験はどれほど一般的か――ドイツ代表サンプルにおける現象学・有病率と自己超越との関連","url":"https://journals.plos.org/plosone/article?id=10.1371/journal.pone.0363555"},{"authors":["Anies M. Al-Hroub","Itab A. Shuayb"],"categories":[],"field":"Frontiers in Psychology","genre":"Psychedelics / Trauma","monthKey":"2026-11","publishedAt":"2026-11-25T00:00:00Z","source":"Crossref","summaryHtml":"戦争、教育の破壊、避難、デジタル断絶が続く中で、高潜在性学生の学業不振はどう生じるのか。本研究はパレスチナの大学教員9名への半構造化インタビューをもとに、2023〜2025年のガザ戦争中とその後の状況を質的に探った。浮かび上がった6つのテーマは、トラウマと困難による学習能力の寸断、デジタル継続の限定的な効果、AIの条件付き支援、技術による回復、インフラとデジタルの不平等、回復のための柔軟なモデルである。教員らは成績の低下を能力の低下ではなく、潜在能力を発揮する機会の剥奪と捉えていた。<br><br>AIについては、説明・要約・執筆支援といった既存の用途と、適応的フィードバックや進捗モニタリング、メンタリングといった回復支援のための提案用途とを区別した。デジタル基盤は学びの継続を部分的に支えたものの、インフラ格差が参加そのものを制約していた。<br><br>知見をもとに、教育資本の毀損と、制約下での自己調整、技術による回復を結ぶ暫定的枠組み「Disrupted Potential-Conditional Technological Reactivation Model」を提案した。技術による回復は公平なアクセス、インフラ、教育的指導、人間関係、倫理的ガバナンスに依存するというもので、関係の実証にはさらなる研究が必要だとしている。出典：Frontiers in Psychology","timestamp":1795564800000,"title":"Potential under siege: palestinians faculty perspectives on underachievement, trauma, and AI-supported learning among high-potential students in Gaza","titleJa":"包囲下の学び――ガザの高潜在性学生の学業不振・トラウマ・AI支援学習をめぐる大学教員の視点","url":"https://doi.org/10.3389/fpsyg.2026.1952607"},{"authors":["Crystal Broj","Kali Arduini Ihde","Laura Marquez"],"categories":[],"field":"Management in Healthcare","genre":"Agents / Robotics","monthKey":"2026-11","publishedAt":"2026-11-25T00:00:00Z","source":"Crossref","summaryHtml":"医療機関はアクセスの改善、事務負担の軽減、より個別化された患者体験への圧力に直面しながら、人手不足とコスト上昇にも対処している。AIは長く解決策と位置づけられてきたが、多くの導入は狭い用途にとどまり、測定可能な価値の実証や意味のある拡張に苦戦してきた。そこに現れたのがAIエージェントという新たなパラダイムで、洞察やコンテンツの生成だけでなく、定められたワークフロー内で実際に行動できる。エージェント型モデルにより、医療機関は単なる自動化から複雑な業務プロセスの編成へと進みつつある。<br><br>本論文は主要な医療システムにおける実装経験に基づき、AIエージェントを医療に導入する実践的枠組みを示す。適切なユースケースの見極め、安全な試行、効果の測定、ガバナンスを伴う拡張という観点から、運用上の重要な考慮点を整理する。アクセスの改善、業務の効率化、患者と職員の体験向上にエージェントを適用した事例も紹介する。<br><br>中心的な主張は明確で、AIエージェントは実験的な道具ではなく、医療運営インフラの新たな構成要素になりつつあるということだ。出典：Management in Healthcare","timestamp":1795564800000,"title":"Beyond the bot: A practical framework for deploying artificial intelligence agents in healthcare workflows","titleJa":"ボットを超えて――医療現場のワークフローにAIエージェントを導入する実践的枠組み","url":"https://doi.org/10.69554/mskj7723"},{"authors":["Galileo Sartor","Enrico Francesconi","Adam Wyner"],"categories":[],"field":"Frontiers in Artificial Intelligence","genre":"LLM / NLP","monthKey":"2026-11","publishedAt":"2026-11-25T00:00:00Z","source":"Frontiers in Artificial Intelligence","summaryHtml":"大規模言語モデル（LLM）は法規範を機械可読なオントロジーへ翻訳する助けになるが、その出力には構造的・意味的な一貫性を保つための検証が欠かせない。本研究は、自然言語の規範をOWLクラス制限として符号化し、適合行動と非適合行動を区別するモジュール型パイプラインを提示する。生成されたオントロジーは、構文チェック、SHACLによる構造チェック、コンピテンシー質問テスト、オントロジー・ピットフォール分析によって反復的に検証される。<br><br>英国ハイウェイ・コードの交差点規則から3つの例示規則を用い、6つのLLM構成でパイプラインを評価した。各検証層は異なる種類の誤りを検出し、フィードバックが構造的問題の修正に役立ち、コンピテンシー質問が意味的な違いを明らかにすることが分かった。検証は反復的に行われ、誤りの検出と修正を繰り返しながらオントロジーを磨き上げる。<br><br>結果はパイプラインの実現可能性を示し、著者らはこの枠組みが法オントロジー構築の信頼性向上に寄与するとしたうえで、今後の発展とより広範な定量評価の可能性を示唆している。出典：Frontiers in Artificial Intelligence","timestamp":1795564800000,"title":"Modeling legal ontologies with a validation based LLM pipeline","titleJa":"検証付きLLMパイプラインによる法オントロジーのモデル化","url":"https://www.frontiersin.org/articles/10.3389/frai.2026.1931148"},{"authors":["Polina Grishanova","Anna Rossin","Sergey Sladkevich","Ivan Gur"],"categories":[],"field":"Frontiers in Psychology","genre":"Consciousness / Philosophy","monthKey":"2026-11","publishedAt":"2026-11-24T00:00:00Z","source":"Frontiers in Psychology","summaryHtml":"高性能航空機のパイロットにとって、加速による意識喪失（G-LOC）は重大な脅威であり、脳血流の低下とそれに続く低酸素が主因とされる。現行の生理モニタリングではこうした事態を確実に捉えたり予測したりできない。本レビューは、呼気に含まれる揮発性有機化合物（VOC）の分析が、非侵襲でリアルタイムのG-LOC検出法になりうるかを検討した。<br><br>G-LOCの病態である急性の脳低酸素、酸化ストレス、脂質過酸化、血行動態の変化は、呼気VOCプロファイルに測定可能な変化をもたらす可能性がある。候補バイオマーカーとして、急性の血行動態変化を反映するイソプレンや、酸化ストレス・脂質過酸化の産物であるペンタナール、4-ブチロラクトン、ペンタンが挙げられた。分析技術としては、網羅的な探索にガスクロマトグラフィー質量分析（GC-MS）、標的化したリアルタイム検証にSIFT-MSとPTR-MS、携帯型の機内展開には電子鼻（E-Nose）という多層的な組み合わせが提案された。<br><br>ただし現状の根拠は間接的で、数分間の低酸素曝露から得られたものが中心であり、G-LOCの数秒間の血流低下で呼気に信号が現れるか、まして予測に足る速さで届くかは未検証である。論文は知識の空白を整理し、段階的な研究ロードマップを示した。出典：Frontiers in Psychology","timestamp":1795478400000,"title":"Identifying potential exhaled breath volatile organic compound markers for the detection of acceleration induced loss of consciousness (G-LOC)","titleJa":"呼気の匂いで意識喪失を察知する――戦闘機パイロットのG-LOC検出への新提案","url":"https://www.frontiersin.org/articles/10.3389/fpsyg.2026.1969387"},{"authors":["C. Richard Spates","Richard W. Seim","Rakeshwar S. Guleria","Lisa Baker"],"categories":[],"field":"Frontiers in Neuroscience","genre":"Psychedelics / Trauma","monthKey":"2026-11","publishedAt":"2026-11-24T00:00:00Z","source":"Frontiers in Neuroscience","summaryHtml":"曝露療法はトラウマ・恐怖関連障害に対する実証的に最も支持された心理療法の一つだが、効果の仕組みをめぐる議論は続き、効果量は20年間ほとんど伸びず、脱落も多い。従来の説明はセッション中の覚醒維持や恐怖の低減に重きを置いてきたが、実証的な支持は一貫しない。本論文は、治療変化を「治療パッケージの名前」ではなく、記憶の更新にかかる分子レベルのタイミング制約から理解し直す枠組みを提案した。<br><br>根拠は三つの流れからなる。第一に、EMDRの分解試験とそのメタ分析では、眼球運動や明示的な認知再構成に確かな追加効果は認められなかった。第二に、筆者らの統制研究では、短時間の曝露を間隔をあけて行う方法が、長時間の曝露と同等以上の成果を、より少ない嫌悪的覚醒で得た。第三に、非神経細胞の研究では、同じ総量でも間隔をあけた刺激の方が、ERK依存的にCREBを介した遺伝子活性化を強く長く引き起こした。<br><br>これらを統合したドーパミン-オピオイド/CREB-ERK（DOCE）枠組みは、ドーパミンの予測誤差シグナルとオピオイド系の安全シグナルが、再固定化や消去の定着を通じて恐怖記憶の更新に寄与すると考える。ドーパミンとオピオイドの証拠は混在・限定的であることも明記し、再固定化と消去を区別する予測や、間隔パラメータ、薬理タイミング、神経画像の検証可能な仮説を示した。出典：Frontiers in Neuroscience","timestamp":1795478400000,"title":"The biology of therapeutic spacing: a CREB-ERK memory-updating framework linking stress neurocircuitry to exposure-based trauma treatment","titleJa":"トラウマ治療は「間隔」が鍵――CREB-ERK経路から読み解く曝露療法の仕組み","url":"https://www.frontiersin.org/articles/10.3389/fnins.2026.1988018"},{"authors":["Tao Qu","Ruizhe Chen"],"categories":[],"field":"Frontiers in Psychology","genre":"LLM / NLP","monthKey":"2026-11","publishedAt":"2026-11-24T00:00:00Z","source":"Frontiers in Psychology","summaryHtml":"大学生のLLM利用が広がるなか、使い方の違いが批判的思考とどう関わるかを調べた研究。544人の大学生を対象に、LLM利用パターン、課題評価、批判的思考の尺度で調査し、構造方程式モデリングなどで分析した。期待価値理論に基づき、利用を「説明的利用」と「生成的利用」に分けて検討した。<br><br>説明的に使う学生ほど課題価値を高く評価し（r=0.735）、批判的思考も高かった（r=0.694）。課題価値は批判的思考を強く予測し（β=0.565）、説明的利用と批判的思考の関係の56.74%を媒介した。一方、生成的利用は批判的思考との全体的な関連は有意でなく、課題コスト（努力・機会・心理的負担）と強く結びついた（β=0.561）。<br><br>説明的利用が高く生成的利用が低い「探索者」タイプは負担が最も低く、課題価値を高く感じる学生ほど「近道」型（説明的利用が低く生成的利用が高い）になりにくかった（59.3%減）。LLMを丸投げするのではなく、理解のために説明的に使うことが思考力を育て、価値ある課題設計がその鍵になるという。出典：Frontiers in Psychology","timestamp":1795478400000,"title":"The relationship between LLM usage and critical thinking among college students: the mediating role of task assessment","titleJa":"LLMの使い方が大学生の批判的思考を分ける――説明的に使うほど思考力が高まる","url":"https://www.frontiersin.org/articles/10.3389/fpsyg.2026.1993114"},{"authors":["Aleš Oblak","Sara Rigler","Katja Horvat Golob","Klara Jamnik","Grega Repovš","Jurij Bon"],"categories":[],"field":"Frontiers in Psychology","genre":"Consciousness / Philosophy","monthKey":"2026-11","publishedAt":"2026-11-24T00:00:00Z","source":"Frontiers in Psychology","summaryHtml":"感情制御の研究では、方略の分類が認知的・神経的に異なる過程を混同しており、研究間の比較や結論の統合が難しいという問題があった。そこで本研究は経験的現象学の手法を用い、感情刺激への曝露とワーキングメモリのnバック課題を組み合わせた認知・感情課題の最中に、参加者が何をどう経験しているかを調べた。健常者30名が感情的な画像を見ながら、感情に没入するか中立を保つよう調整しつつ課題を遂行し、1試行ごとの体験を複数の質的手法を組み合わせた現象学的インタビューで掘り下げ、構成主義的グラウンデッド・セオリーで分析した。<br><br>参加者は、実験で用いる画像は自発的な感情反応を引き起こす力が弱く、共感や意味づけ（センスメイキング）によって感情を自ら能動的に構成していたと語った。意味づけは知覚・概念的理解・身体化された感情を統合する動的で物語的な過程であり、感情は予期、かすかな兆し、十分な発達、終息あるいは持続という複数の時間スケールで展開した。試行ごとに感情を自発的に構成していたにもかかわらず、否定的な気分が蓄積することもあった。従来の感情制御方略はめったに現れず、現れても人それぞれだった。<br><br>感情体験は実験室の課題の中でも受動的に生じるのではなく能動的に構成されることが多く、感情生成の能動的要素を今後の研究で検証する必要がある。感情制御の分類を洗練させるうえでも、体験の質的な側面を捉える現象学的手法の有用性を示した。出典：Frontiers in Psychology","timestamp":1795478400000,"title":"Vibing out with the task: qualitative insights into sensemaking during cognitive-affective task performance","titleJa":"「課題と一緒に漂う」――認知・感情課題における意味づけの質的探究","url":"https://www.frontiersin.org/articles/10.3389/fpsyg.2026.1711296"},{"authors":["Matthias Pillny","Kai Härpfer","Hannes Per Carsten","Anja Riesel","Julia Klawohn","Tania Marie Lincoln"],"categories":[],"field":"OSF Preprints","genre":"Consciousness / Philosophy","monthKey":"2026-11","publishedAt":"2026-11-24T00:00:00Z","source":"OSF Preprints","summaryHtml":"アンヘドニア（快感消失）は、目の前の快楽そのものの低下ではなく、思い出したり想像したりしたポジティブな体験から感情的価値を生み出すことの困難かもしれない。ただし、直接の刺激曝露・記憶の想起・未来の想像という異なる局面で感情処理がどう関わるか、否定的感情の役割も含めて明らかでなかった。本研究は事前登録のもと、アンヘドニアの程度が異なる非臨床の成人48名を対象に、画像の閲覧・想起・未来想像中の神経反応と主観的感情を調べた。<br><br>各試行4000ミリ秒のあいだ、後期陽性電位（LPP）を400〜4000ミリ秒で測定し、感情価と想像の鮮明さの主観評定も併せて取得した。想起の場面では、アンヘドニアが高いほどポジティブな記憶に対するLPPの分化（1000〜2000ミリ秒と2000〜3000ミリ秒）が弱まり、ポジティブな記憶に対する快感情の評定も低かった。一方、符号化や未来想像の場面では、感情価に依存したLPPの関連は有意でなかった。<br><br>ポジティブな記憶に対する感情処理の変容がアンヘドニアと関連することが示され、感情反応全般や心的表象の鮮明さの違いも併せて検討すべきだとされた。うつ病圏の症状理解や、記憶に働きかける介入の手がかりになる可能性がある。出典：OSF Preprints","timestamp":1795478400000,"title":"Anhedonia and Emotional Processing of Past- and Future-Directed Mental Representations: Behavioral and Event-Related Potential Evidence","titleJa":"快感消失は「思い出す喜び」の障害か――記憶と想像における感情処理のERP証拠","url":"https://osf.io/preprints/psyarxiv/mh6jw_v1/"},{"authors":["Piergiuseppe Liuzzi","Maenia Scarpino","Ester Marra","Benedetta Piccardi","Peiman Nazerian","Emma Giardi","Andrea Nencioni","Maria Chiara Carrozza","Antonello Grippo","Andrea Mannini"],"categories":[],"field":"Frontiers in Artificial Intelligence","genre":"LLM / NLP","monthKey":"2026-11","publishedAt":"2026-11-24T00:00:00Z","source":"Frontiers in Artificial Intelligence","summaryHtml":"救急脳波レポートは多面的な臨床情報を含むが、自由記述でばらばらに書かれることが多い。本研究は、イタリア語の救急脳波レポートを8つの閉じた記述子に正規化する、自己ホスト型のオープンウェイトLLMパイプラインを開発した。目的は波形の再解釈ではなく、記述の正規化である。100報で8つのQwenモデル・プロンプト構成を比較し、5ショットの例を付けた構成（6月時点の平均マクロF1は0.778）が最上位となり、280報の追加配備用に固定した。<br><br>配備時の完全一致精度は、回答済みペアで83.7％（1,109/1,325）だった。全ペアを厳密に数えると49.5％（1,109/2,240）で、未回答の915ペアのうち844件はキーワードによる未検証の代理分類で「言及なし」とされた。既定値による補完後の精度は83.2％で、分野の多数派ベースライン78.8％、キーワードベースライン58.1％を上回った。回答済みペアの誤りは、レポートが長いほど多い傾向があった。<br><br>9月の再検証では、同じQwen3.6モデルでも5ショットの平均マクロF1が0.642と変動し、モデルの特定と評価の分母の扱いが重要だと示された。記述の正規化は実現可能だが、符号化の慣例とモデル成果物の識別が課題として残る。出典：Frontiers in Artificial Intelligence","timestamp":1795478400000,"title":"Making multi-clinician emergency EEG reports machine-readable through local LLM-based semantic normalization","titleJa":"救急脳波レポートを機械可読に――ローカルLLMによる意味的正規化","url":"https://www.frontiersin.org/articles/10.3389/frai.2026.1971487"},{"authors":["Richard Ambron"],"categories":[],"field":"Brain Sciences","genre":"Consciousness / Philosophy","monthKey":"2026-11","publishedAt":"2026-11-24T00:00:00Z","source":"Brain Sciences","summaryHtml":"痛みは意識のなかで経験されるもので、従来は脳の活動と意識は切り離せないと考えられ、薬物療法が中心になってきた。オピオイドをはじめ薬物は多くの痛みに有効だが、副作用の問題があり、慢性痛の多くは治療に抵抗する。近年の痛みの研究は、この従来の見方が正しくないことを示している。<br><br>傷害を受けると、傷害の重さを符号化した活動電位が、前帯状皮質の痛み中枢にある大型錐体ニューロンのシナプスを活性化する。活性化は長期増強を引き起こしてシナプス伝達を感作し、アロディニアや痛覚過敏を生むと同時に、錐体ニューロンの周囲に電磁波を生み出す。傷害が重い場合はNMDA受容体を介して転写因子CREBが活性化し、ニューロンの表現型が変わって感作と痛みと電磁波が持続し、痛みは慢性化する。<br><br>最も重要な主張は、侵害受容の情報が活動電位から電磁波へ変換され、その電磁波が情報を意識へ運ぶことで初めて痛みが経験される、という点だ。経頭蓋磁気刺激のプロトコルは、既存の内因性電磁波を打ち消したり、その形成を防いだりできることが示されており、薬物に代わる非侵襲的な疼痛管理の選択肢になるという。出典：Brain Sciences","timestamp":1795478400000,"title":"Experiencing Pain Requires Communication Between the Brain and Consciousness via Electromagnetic Waves: Implications for Pain Management","titleJa":"痛みは電磁波で意識に届く――前帯状皮質の錐体ニューロンと慢性痛の新仮説","url":"https://doi.org/10.3390/brainsci16121292"},{"authors":["David Quezada","Xueyuan Li","Tracy L. Luks","Thomas J. Hoffmann","Phillip Yang","Cherry Y. Leung","Angela Jakary","Po-Hung Wu","Tara E. Samson","Roma S. Kidambi","Sarbodaya Singh Thakuri","Jeffrey E. Max","Duan Xu","Erik Ekbäck","Eva Henje","Tony T. Yang"],"categories":[],"field":"Frontiers in Child and Adolescent Psychiatry","genre":"Consciousness / Philosophy","monthKey":"2026-11","publishedAt":"2026-11-24T00:00:00Z","source":"Frontiers in Child and Adolescent Psychiatry","summaryHtml":"思春期は前頭前野によるトップダウン調節が未発達で、抑うつのリスクが高い。心身介入（MBI）は思春期の抑うつに有望だが、感情改善の背後にある神経機序は不明だった。本研究は14〜18歳の地域サンプル100人を、12週間の完全リモート型プログラムTARAによる介入群と待機群に無作為に割り付けた。抑うつ尺度RADS-2、共感的関与尺度CEAS-Y、困難度質問票SDQと、動脈スピンラベリングMRIによる脳血流を、開始時と12週時点で測定した。<br><br>有意な交互作用が4つ現れた。RADS-2の陰性感情と無快感症の改善は、TARA群では右被殻の血流低下と関連し、対照群では関連がなかった。CEAS-Yの改善は左海馬の血流増加と関連し、尾状核の血流とは関連がなかった。SDQの総困難スコアの改善は、TARA群では右中前頭回の血流低下と関連し、対照群では血流増加と関連した。<br><br>これらの結果は、TARAが思春期うつに関わる前頭前野・辺縁系・報酬系の回路において、脳血流と感情機能の関係を変えうるという予備的証拠だ。完全リモートで届けられる心身介入が、脳の働きと感情の結びつきそのものに影響する可能性が示された。出典：Frontiers in Child and Adolescent Psychiatry","timestamp":1795478400000,"title":"A fully remotely delivered mind and body intervention alters the relationship between MRI-measured cerebral blood flow and emotional functioning in adolescents: a randomized controlled trial","titleJa":"完全リモートの心身介入が思春期うつの脳を変える――脳血流と感情の結びつきを変えたRCT","url":"https://doi.org/10.3389/frcha.2026.1980001"},{"authors":["Mariana Velykodna","Igor Romanov","Igor Marchetti","Vladyslav Deputatov"],"categories":[],"field":"European Psychologist","genre":"Psychedelics / Trauma","monthKey":"2026-11","publishedAt":"2026-11-24T00:00:00Z","source":"European Psychologist","summaryHtml":"代理トラウマや二次トラウマが精神保健専門職に及ぼす影響は、戦時下も含め多くの研究で指摘されてきた。こうしたトラウマは「仕事に関連する心の傷」と分類できる。本研究は、ロシアのウクライナ侵攻下でウクライナ人を支援する精神保健専門職291人を対象に、仕事関連トラウマの予測因子を明らかにした横断研究だ。<br><br>修正版国際トラウマ質問票とその下位尺度を従属変数とし、居住地の種類と場所、勤務経験、クライエントの属性（年齢・職業・避難状況）、週あたりの勤務時間・スーパービジョン時間・セラピーや支援グループの時間、料金の減免、心理療法研修の修了、職能団体の会員資格、メンタライゼーション質問票で測ったメンタライゼーション水準などを独立変数とした回帰モデルを構築した。モデルが説明できた分散は全体で17%にとどまり、回避症状の予測が最も成功して21.7%だった。<br><br>より重い仕事関連トラウマ症状を予測した最も強い変数は、メンタライゼーションの困難さ、クライエントの年齢、通常・危機対応セッションの時間数、週あたりの心理療法受診時間だった。逆に、症状の緩和を最も強く予測したのは職能団体の会員資格であり、専門職社会を通じた社会的支援や知識共有と関連している可能性があるという。出典：European Psychologist","timestamp":1795478400000,"title":"Work-Related Trauma in Ukrainian Mental Health Professionals","titleJa":"戦時下の支援者を蝕む「仕事のトラウマ」――ウクライナの精神保健専門職291人の調査","url":"https://doi.org/10.1027/1016-9040/a000601"},{"authors":["Rongbin Chen","Lu Lu","Mingyue Liu","Mengya Liu","Guosheng Wang","Jia Ye","Sujian Zhou","Xiahua Liu","Xiang Qiu","Pengkun Xue","Xinyuan Qiu","Zhe Li","Zhiyong Wang","Chenxia Guan","Lei Zhang"],"categories":[],"field":"Frontiers in Neurology","genre":"Consciousness / Philosophy","monthKey":"2026-11","publishedAt":"2026-11-24T00:00:00Z","source":"Crossref","summaryHtml":"重度の後天性脳損傷後に遷延性意識障害（pDoC）が続く患者では、診断と治療が難しい。反復経頭蓋磁気刺激（rTMS）や間欠的シータバースト刺激（iTBS）は補助的な神経調整法として使われているが、日常的な刺激法どうしを直接比べた研究は少なかった。中国2施設の後ろ向きコホート研究で、2023年1月から2026年3月に治療を受けた成人pDoC患者を対象に、左背外側前頭前野へのrTMS、左一次運動野へのrTMS、左背外側前頭前野へのiTBSの3法を比較した。<br><br>治療を開始した174人のうち160人が10セッション以上を完了し、123人が解析対象となった（75人・32人・16人）。意識の評価尺度CRS-Rの平均は9.86から11.66へと1.80点上昇し、3点以上改善した患者は33.3%、診断区分が一段階上がった患者は16.3%にのぼった。しかし調整後のCRS-R平均は3法でほぼ同じ（11.59・11.66・11.96）で、全体検定もペア比較も有意差はなく、どの刺激法が優れているかは示されなかった。重篤な有害事象の記録はなかったが、後ろ向きの把握には限界がある。<br><br>結論として、3種のTMS戦略の短期効果に明確な差はない。等価性を証明したわけでも、固定の優先順位を支持したわけでもない。著者らは今後の前向き比較研究では、刺激法の割り付け、CRS-Rの反復評価、刺激条件の記録、安全性の監視を標準化すべきだとしている。出典：Frontiers in Neurology","timestamp":1795478400000,"title":"Comparative short-term outcomes of three transcranial magnetic stimulation strategies in patients with prolonged disorders of consciousness following severe acquired brain injury: a two-center retrospective cohort study","titleJa":"遷延性意識障害に対する3種の経頭蓋磁気刺激法の短期効果を比較――2施設の後ろ向きコホート研究","url":"https://doi.org/10.3389/fneur.2026.1970664"},{"authors":["Yu‐Qin Zhao","Lin‐Xi Li","Nuan Yang","Zi‐Xin Li","Yu‐Ting Zhang","Xiao‐Guang Lang","Yue‐Min Gao","Zhi‐Xing Yao","Sui Tian","Ying Lv","Hong‐Ling Li","Xue‐Hai Lv"],"categories":[],"field":"Brain and Behavior","genre":"Consciousness / Philosophy","monthKey":"2026-11","publishedAt":"2026-11-24T00:00:00Z","source":"Crossref","summaryHtml":"遷延性意識障害（pDoC）の患者の覚醒を促す治療として、反復経頭蓋磁気刺激（rTMS）が用いられる。ただ刺激周波数は一律10Hzとされることが多く、患者ごとの違いへの対応は課題だった。本研究は、ミスマッチ陰性波（MMN）の振幅を指標に患者ごとに最適な周波数を選ぶ個別化rTMSの効果を、二重盲検ランダム化比較試験で検証した。29人のpDoC患者を登録し、実験群はMMNの反応が最も高まる5・10・15Hzのいずれか、対照群は固定10Hzで、左乳様突起部へ4週間刺激し、通常のリハビリテーションを併用した。<br><br>治療後、すべての群で臨床スコアは改善した。なかでも15Hz群（7人）は意識回復尺度CRS-Rが4.71から9.29、グラスゴー・コーマ・スケール（GCS）が5.57から8.71へと最も大きく回復し、対照群（8人）と比べてCRS-Rの変化量（p=0.046）とGCSの変化量（p=0.030）で有意に優れていた。神経生理学的には、5Hz群（p=0.048）と10Hz群（p=0.020）で中心部のMMN振幅が対照群より有意に増大した。<br><br>MMN振幅に基づく個別周波数の選択は、意識の回復と皮質興奮性の向上を促す可能性があり、とくに15Hzが行動の改善に有望だと示された。MMNは精密な神経調節のパラメータを導く客観的なバイオマーカーになりうる。ただし29人の予備的研究であり、長期効果や最適周波数の再現性は今後の大規模な検証が必要である。出典：Brain and Behavior","timestamp":1795478400000,"title":"Efficacy Evaluation of Repetitive Transcranial Magnetic Stimulation at Individual Frequency for Patients With Prolonged Disorders of Consciousness: A Preliminary Study Based on Mismatch Negative Amplitude","titleJa":"個別周波数の反復経頭蓋磁気刺激で遷延性意識障害の覚醒を促す――ミスマッチ陰性波を指標にした予備的研究","url":"https://doi.org/10.1002/brb3.71939"},{"authors":["Nicolas Michinov","Marinette Bouet","Eric Jamet","Axel Mascaro","Muriel Noël","Albane Pechard","Farouk Toumani","Zineddine Zahouani","Estelle Michinov"],"categories":[],"field":"OSF Preprints","genre":"Agents / Robotics","monthKey":"2026-11","publishedAt":"2026-11-24T00:00:00Z","source":"OSF Preprints","summaryHtml":"協働の場にAIファシリテーション・エージェントを組み込み、議論の流れに応じてリアルタイムで助言を出す仕組みが広がりつつある。本研究は、そうしたエージェントが集団のコミュニケーションと成果にどう影響し、参加者にどう受け止められるかを実験で調べた。心理学部の学生187人が50グループ（3〜4人）に分かれ、同期テキストチャットのあるデジタル・プラットフォームで協働課題に取り組んだ。25グループには情報共有を促すAIエージェントを付け、残りの25グループはエージェントなしとした。<br><br>エージェント付きの参加者は、プラットフォームの受容性と支援感を低く評価したが、侵入的だとか不快だという評価は高まらなかった。一方でエージェント付きのグループは、課題をより速く、少ないコミュニケーション量で終えた。エージェントの介入前後3分間のやり取りをみると、情報提供から情報要求・意見表明・同意へと発話の型が移り、全体の発話量は変わらなかった。<br><br>客観的な効率と主観的な評価のあいだにギャップがあることが示された。AIエージェントの設計では、集団を効率化しつつ、参加者に支援されている感覚と受容感をもたらす工夫が要る。学生を対象とした実験室的な課題であり、職場など実場面への一般化は今後の課題である。出典：OSF Preprints","timestamp":1795478400000,"title":"The Unappreciated Helper: When an AI Facilitation Agent Improves Group Efficiency Despite Poorer User Perceptions","titleJa":"AIファシリテーターは集団を効率化するが好まれない――協働実験による検証","url":"https://osf.io/preprints/psyarxiv/c54ze_v2/"},{"authors":["Shameer Mohamed Naleer","Safras Mohamed Naleer"],"categories":[],"field":"Frontiers in Ophthalmology","genre":"Ethics / Safety","monthKey":"2026-11","publishedAt":"2026-11-24T00:00:00Z","source":"Crossref","summaryHtml":"人工知能（AI）、AI誘導の手術ロボット、仮想現実・拡張現実などの没入型技術が、眼科の診断・手術・教育・患者対応を変えつつある。各領域で臨床的エビデンスが積み上がる一方、ガバナンスの空白も露呈しており、放置すれば格差の固定化や患者安全の低下、臨床への信頼の毀損につながりかねない。本ミニレビューは3領域を横断するガバナンスの現状を整理したものだ。<br><br>方法は2018〜2026年の一次エビデンス、規制枠組み、ガバナンス文献のナラティブレビューである。結果として3領域に共通する5つのガバナンス不全が挙げられた。学習・検証データにおける過小代表、導入後モニタリングでの公平性監視の不在、臨床現場での解釈可能性のギャップ、エージェント型・継続学習システムに対する規制枠組みの欠如、臨床教育におけるAIリテラシーの不足である。<br><br>著者らはAI・ロボット・没入型技術に共通して適用できる5領域の統合ガバナンス枠組みを提案する。ガバナンスはイノベーションの制約ではなく、安全に拡大するための基盤であるべきだというのが結論だ。出典：Frontiers in Ophthalmology","timestamp":1795478400000,"title":"Governing the next generation: a framework for the safe and equitable deployment of artificial intelligence, robotics, and immersive technologies in ophthalmology","titleJa":"次世代技術のガバナンス――眼科におけるAI・ロボット・没入型技術の安全で公平な展開に向けた枠組み","url":"https://doi.org/10.3389/fopht.2026.1971746"},{"authors":["Karnig Kazazian","Danelle Czink","Alla Iansavitchene","Adrian M. Owen","Loretta Norton"],"categories":[],"field":"Neurology","genre":"Consciousness / Philosophy","monthKey":"2026-11","publishedAt":"2026-11-24T00:00:00Z","source":"Crossref","summaryHtml":"重度脳損傷後の急性意識障害では、患者の評価と予後予測が今も難しい課題だ。安静時fMRIは外部刺激なしの自発的な脳活動の時間相関を測り、意識を支える大規模脳ネットワークの保全状態を客観的に捉えられる。本系統的レビューは、急性期の重度脳損傷患者における安静時fMRIの評価ツールとしての根拠を、PRISMAに沿って2006年1月から2026年3月までのMEDLINEとEmbaseから整理した。<br><br>396研究をスクリーニングし、30研究が適格とされた。計800人（平均48歳、男性69%）がICU入室から加重平均9.31日後に撮影されていた。外傷性脳損傷のみ10研究、心停止8研究、脳症2研究、混合10研究。最も調べられたネットワークはデフォルトモード（20研究）と実行制御ネットワーク（11研究）で、視覚・顕著性・感覚運動・聴覚ネットワークが続いた。方法の異質性にもかかわらず、安静時fMRI指標と転帰の有意な関連は一貫して報告された。<br><br>急性期の安静時fMRIは、意識障害患者の神経学的・機能的転帰と関連し、意識回復の見込みが高い患者の同定にも役立つ可能性がある。一方で、研究間の異質性と小規模なサンプルが比較を制限する。標準化された取得・解析の枠組みと大規模な前向き研究が、臨床応用への検証に必要だ。出典：Neurology","timestamp":1795478400000,"title":"Resting-State Functional MRI and Clinical Outcomes After Acute Disorders of Consciousness","titleJa":"急性意識障害の転帰を安静時fMRIで予測できるか――30研究の系統的レビュー","url":"https://doi.org/10.1212/wnl.0000000000218674"},{"authors":["Lingwei Gu","Jimmy Lin"],"categories":["cs.AI","cs.CL"],"field":"arXiv","genre":"Agents / Robotics","monthKey":"2026-11","publishedAt":"2026-11-24T00:00:00Z","source":"arXiv","summaryHtml":"フロンティア言語モデルで動くエージェントは高コストだ。毎ステップで全コンテキストを読み直し、難易度にかかわらず全サブタスクをフロンティアモデルが実行する。本論文は、そのコストの大半は、簡単なサブタスクを手元のハードウェアで動く小言語モデル（SLM）に委譲することで除けるとする。検証のため、Claude Code上に構築したハーネスDelegentを作った。<br><br>Delegentではフロンティアモデルが常に全タスクを主導し、コード調査・テスト実行・コーパス検索といった焦点の絞られたサブタスクだけをSLMサブエージェントに渡す。タスク全体を振り分けるカスケードやルーターとは異なり、ルーターも学習も不要で、どちらのモデルも自由に交換できる。27B FP8のSLMを用いると、長期コーディングのフロンティア費用は67%、エージェント検索は59%削減され、タスク性能の低下はなかった。<br><br>ノートPCに収まる2BのSLMでもコーディング費用は66%削減された。削減幅はフロンティアモデルが担っていた雑務の量とともに大きくなり、主要なコーディングをフロンティアモデルに残す短い指示が、削減の大半を占めつつ2B SLMの取りこぼしを防ぐという。出典：arXiv","timestamp":1795478400000,"title":"Delegent: A Multi-Agent Harness That Reduces Cost without Sacrificing Performance","titleJa":"Delegent――フロンティアモデル主導のまま小モデルへ委譲しエージェント費用を削減","url":"https://arxiv.org/abs/2611.33098"},{"authors":["Yuxing Liu","Wei Zuo","Walid Krichene","Tong Zhang","Li Zhang"],"categories":["cs.CL","cs.LG"],"field":"arXiv","genre":"LLM / NLP","monthKey":"2026-11","publishedAt":"2026-11-24T00:00:00Z","source":"arXiv","summaryHtml":"投機的デコーディングは、軽量なドラフトモデルがトークンを提案し、目標モデルが並列に検証することで大規模言語モデルの推論を高速化する。高速化の鍵はドラフトトークンの採択率であり、それは目標分布pとドラフト分布qの隔たり‖p−q‖₁に直接関係する。本論文は、事後的な方法でドラフト分布を較正し、この隔たりを緩和することで高速化を高める「ドラフト較正」を検討した。<br><br>観察によれば、現在のオープンソースのドラフトモデルは最有力トークンを正しく学ぶ一方で、目標モデルと比べて総じて過小に自信をもつ傾向があり、一貫した分布の不一致が存在した。この不一致の影響を緩和するため、標準的な温度スケーリングやトークンごとの較正など複数の事後較正法を試したところ、ドラフト分布への標準的な温度スケーリングだけで、ほぼ追加コストなしに採択長が最大で約10%改善した。<br><br>スループットの分析でもこの serving 効率の改善が確認された。さらに一般的な較正法の分析からは、なお改善の余地があることも示された。較正という軽い一手で推論の無駄を減らせることを示した研究である。出典：arXiv","timestamp":1795478400000,"title":"Draft Calibration for Speculative Decoding: Accelerating LLM Serving by Matching Draft and Target Distributions","titleJa":"ドラフト較正による投機的デコーディングの高速化――ドラフト分布と目標分布の一致","url":"https://arxiv.org/abs/2611.33111"},{"authors":["Hamin Koo","Chanjoo Jung","Fangzhao Wu","Jaehyung Kim"],"categories":["cs.CL","cs.AI"],"field":"arXiv","genre":"Ethics / Safety","monthKey":"2026-11","publishedAt":"2026-11-24T00:00:00Z","source":"arXiv","summaryHtml":"大規模言語モデル（LLM）が評価や学習パイプラインの自動評価者として使われる場面が増える一方、その判断は人間の選好と衝突する系統的なバイアスにしばしば影響される。先行研究はバイアスの発見や緩和を提案してきたが、人間の選好を手がかりにすることや、バイアスの強さの定量化、コストの低い介入への関心は乏しく、既知のバイアス一覧への依存が大きかった。本論文は、人間由来のバイアス要因に基づく統合枠組みHUB-Jを提案する。<br><br>HUB-Jは、人間とLLMの判断が食い違う事例から解釈可能なバイアス要因を自動で発見し、一致事例を用いて、入力を制御的に改変した際の判断の変化からバイアスの強さを定量化する。そのうえで、各バイアス要因が判断に与える影響を推定し、その推定効果を差し引いて判断を補正する、学習不要の軽量な回帰ベースの緩和策を導入した。<br><br>実験では、HUB-Jが既知のものと新規のバイアス要因の両方を発見し、モデルごとの感受性の違いを明らかにし、バイアスに起因する判断の反転を一貫して減らし、モデルを越えて汎化することが示された。LLMによる評価の信頼性を人間の選好から点検する枠組みである。出典：arXiv","timestamp":1795478400000,"title":"Auditing the Judge: Human-Derived Bias Discovery, Quantification, and Mitigation in LLM Judges","titleJa":"審判を監査する――人間の選好からLLMジャッジのバイアスを発見・定量化・軽減","url":"https://arxiv.org/abs/2611.33065"},{"authors":["Zehan Zheng","Yanyuan Chen","Deming Li","Yutao Tang","Jianwen Xie","Alan Yuille","Jieneng Chen","Cheng Peng"],"categories":["cs.CV","cs.AI"],"field":"arXiv","genre":"Vision / Multimodal","monthKey":"2026-11","publishedAt":"2026-11-24T00:00:00Z","source":"arXiv","summaryHtml":"身体化空間推論（ESR）は視覚言語モデル（VLM）を実世界の身体化タスクに展開するうえで中心的な能力だが、その評価は不十分なままだった。既存のベンチマークは静止画や合成の屋内環境が中心で、意味的な近道で済んでしまい、実環境での空間推論を忠実に測れなかった。本論文は、3Dガウススプラッティングで再構成した大規模な実世界屋外3D環境でESRを評価するベンチマーク「Lost on Campus」を提案する。<br><br>このベンチマークは、個別の推論を測る診断的QAと、マルチモーダルな指示のもとで能動的に推論する閉ループの対話型ナビゲーションを統合した、推論と行動を結ぶ統一的な評価枠組みを導入する。評価は6つの側面に細分化される。行動の接地、空間的先見性、メートル感覚、目標指向の計画、自己中心・他者中心の位置特定、時空間の一貫性である。<br><br>実験では、屋内と比べて実世界の屋外環境が空間推論にはるかに高い要求を課し、既存モデルは低調だった。VLMは細粒度の視覚的アライメントに苦戦し、空間的先見性と自己中心・他者中心の位置特定の失敗が主なボトルネックだった。身体化知能の前進には、マルチモーダルな対話能力と長期の空間推論の改善が重要だという。出典：arXiv","timestamp":1795478400000,"title":"Lost on Campus: Evaluating Embodied Spatial Reasoning of Vision-Language Models in the Wild","titleJa":"キャンパスで迷う――実世界の屋外3D環境における視覚言語モデルの身体化空間推論評価","url":"https://arxiv.org/abs/2611.33145"},{"authors":["Haewoon Kwak"],"categories":[],"field":"Nature","genre":"Consciousness / Philosophy","monthKey":"2026-11","publishedAt":"2026-11-24T00:00:00Z","source":"Crossref","summaryHtml":"「AIは意識をもつ可能性が低く、現行の開発軌道では今後もそうならないだろう」――Seth・Block・TononiによるNature誌の論考の主張に対し、インディアナ大学ブルーミントンのHaewoon Kwakは書簡で反論した。シリコンベースのシステムにおける主観的経験をめぐる彼らの論拠は、見出しが示すほど断定的ではない、というのが要点である。<br><br>AI意識の議論では、言語モデルの振る舞いが知的に見えることと、内的な主観的経験があることとは別問題である。意識があると誤って認めることにも、あるのに見逃すことにもコストがあり、証拠の水準を明確にしないまま断定すれば、議論はあらぬ方向へ進む。書簡は、そうした不確実性を認めたうえで議論を進めるべきだという姿勢を示している。<br><br>本書簡は短いながら、意識科学の最前線での論争に一石を投じるものだ。AIが意識をもちうるかという問いは哲学的な問題であるだけでなく、AIへの権利や保護、ガバナンスのあり方にも直結する。科学は結論を急がず、不確実性を明示しながら検証を重ねるべきだという呼びかけである。出典：Nature","timestamp":1795478400000,"title":"The science on AI consciousness must acknowledge uncertainty","titleJa":"AI意識の科学は不確実性を認めるべきだ","url":"https://doi.org/10.1038/d41586-026-03822-5"},{"authors":["Xuanchen Liu","Hejun Zhang","Boxuan Dong","Ying Wu","Heshuai Li","Wen Gao","Yonghong Tian","Weihao Yu"],"categories":["cs.CV","cs.AI","cs.RO"],"field":"arXiv","genre":"Agents / Robotics","monthKey":"2026-11","publishedAt":"2026-11-24T00:00:00Z","source":"arXiv","summaryHtml":"鏡は動物の自己認識を測るテストとして知られるが、ロボットの操作方策にとっても落とし穴になる。本研究は、鏡のある場面でロボットが物体を確実に操作できるかを調べ、RoboDojoを基盤とするベンチマークRoboDojo-Mirrorを導入した。鏡なしの基準条件と、1枚鏡・2枚鏡・鏡面テーブルトップの条件で、タスク目標と成功基準を変えずに比較した。<br><br>視覚言語行動モデル、世界行動モデル、エージェント型方策の5つの方策すべてで、鏡条件は成功率を下げた。3条件平均の低下幅は方策により10.8〜56.7ポイントに及び、鏡面テーブルトップでは最大62.5ポイントに達した。鏡は物理的な障害物でもあるため、形状を合わせた非反射パネルと比較したところ、鏡特有の失敗の50〜88%はロボットとパネルの接触なしに起きており、衝突だけでは説明できない。<br><br>軌道と接触の分析では、映り込んだ物体を実在と誤認する「幻影ターゲティング」や、実在物体の位置の誤認といった振る舞いが繰り返しみられた。実機実験（π0.5とFastWAM）でも鏡条件下で成功率が低下した。多様なロボット方策に共通する反射環境への脆弱性を示し、身体化知能の評価に反射への配慮が必要だと結論づけている。出典：arXiv","timestamp":1795478400000,"title":"Embodied AI Fails the Mirror Test: How a Simple Mirror Breaks Robot Policies","titleJa":"身体化AIは鏡像テストに失敗する――鏡がロボットの方策を壊す","url":"https://arxiv.org/abs/2611.33010"},{"authors":["Richmond Sin Jing Xuan","Peilin Feng","Wenbin Wang","Soujanya Poria"],"categories":["cs.AI"],"field":"arXiv","genre":"Agents / Robotics","monthKey":"2026-11","publishedAt":"2026-11-24T00:00:00Z","source":"arXiv","summaryHtml":"長いタスクに取り組むAIエージェントは、証拠が不十分なまま答えにコミットしてしまう「怠惰」な振る舞いをみせる。評価では、エージェントは自分の述べた信念がまだ複数の答えを挙げている段階でも、しばしばコミットしていた。エピソード末の結果報酬は最終的な答えだけを評価するため、まぐれの正解と根拠のある正解を区別できず、いつコミットすべきかを教えられない。<br><br>そこで本研究は「検証可能な信念による強化学習（RLVB）」を提案した。訓練時にはシミュレータが各ステップで答えの事後確率を正確に計算できるため、事後確率がまだ複数の答えを許す間はさらに行動を続け、証拠が十分になったらコミットするよう報酬を与える。判定器や批評家、報酬モデルは不要で、エージェントが行動前に書く信念の行を読み取ることもない。あわせて、狭い窓から大きな世界を眺める視覚パズルのベンチマークPro Worldsも導入した。<br><br>3つの視覚言語モデルと3つのベンチマークで評価した結果、RLVBは9設定すべてでベースモデルを改善し、平均17.1%の向上を示した。結果報酬のみのGRPOやPPOは平均でベースモデルを下回った。訓練後のエージェントは、十分な証拠がある状態で答える割合が大幅に上がり、証拠不足のままコミットする割合は0.1〜2.2%にとどまった。出典：arXiv","timestamp":1795478400000,"title":"Lazy Agents Answer Against Their Own Beliefs: Reinforcement Learning with Verifiable Beliefs Teaches Them to Act on What They Believe","titleJa":"怠惰なエージェントは自分の信念に反して答える――検証可能な信念による強化学習","url":"https://arxiv.org/abs/2611.32884"},{"authors":["Hussamuddin Syed"],"categories":["cs.LG","cs.CL"],"field":"arXiv","genre":"LLM / NLP","monthKey":"2026-11","publishedAt":"2026-11-24T00:00:00Z","source":"arXiv","summaryHtml":"小さな言語モデルQwen3.5-0.8Bは思考モードで推論を終えられないことが多い。4096トークンの予算で、MATH-500の500問のうちthinkブロックを閉じられたのはわずか1〜2問で、正答率は15.4%にとどまった。先行するデモでは、GPT-6 Astraが勾配なしでモデルの131,072個の重みを編集し、MATH-500が7.9%から48.1%に上がったと報告されていた。本論文は、欠けていた勾配ベースの比較対象を示し、2つの編集を組み合わせた。<br><br>勾配が最大の重みだけを微調整すると、140〜139,750個の重みをモデルの自己正解例で学習させるだけで、4kトークンでのMATH-500は39.0〜45.5%に上がった。訓練は1枚のGPUで2〜9分、訓練例は50件で十分だった。勾配は最初の3層の各層で最も定数に近いチャネルに集中する。モデルにバイアス項がないため、そうしたチャネルに限った編集は残差ストリームへの定数ベクトルの加算と等価で、未編集モデルに3つの固定ベクトルを加えるだけで編集と同等の正答率が得られた。<br><br>Astraのプロトコル（32kトークン）での再現ではAstra編集は52.1%だったが、筆者らの編集は16kトークンまでのすべての予算で上回った（4kでは39.5%対6.7%）。2つの編集は相補的で、組み合わせると32kで62.2%に達し、Astra編集単独を10ポイント上回った。出典：arXiv","timestamp":1795478400000,"title":"A Bias in Disguise: Tiny Gradient Edits Stop a Small Language Model's Thinking Loops and Complement a Frontier Model's Weight Edit","titleJa":"見せかけのバイアス――小さな勾配編集が小言語モデルの思考ループを止める","url":"https://arxiv.org/abs/2611.33133"},{"authors":["Xiang Fan","Yuheng Wang","Jiayuan Yan","Bohan Fang","Wisdom Oluchi Ikezogwo","Ainaz Eftekhar","Max Argus","Jason Ren","Jiafei Duan","Ranjay Krishna"],"categories":["cs.RO","cs.AI","cs.CV","cs.LG"],"field":"arXiv","genre":"Agents / Robotics","monthKey":"2026-11","publishedAt":"2026-11-24T00:00:00Z","source":"arXiv","summaryHtml":"多様なロボットを1つの方策で制御するには、タスク知識の転移だけでなく、各ロボットの能力に合わせた振る舞いの適応が必要である。既存手法は共有された行動表現で転移を促すが、ロボットの形態の違いが操作戦略をどう形づくるかは捉えきれない。本論文は、各ロボットの運動学に直接条件づけて身体固有の振る舞いを生み出す、異種身体横断の操作方策OmniActを提案する。<br><br>運動学グラフはロボットの関節位置・運動軸・接続性を視覚観測に結びつけ、身体と場面内の物体・表面の関係を方策が考慮できるようにする。フローマッチング方策が各ノードの相対関節運動を予測し、自由度や運動学構成の異なるロボットを制御できる。物理的構造が振る舞いをどう形づくるかを大規模に学ぶため、物理的に実現可能なロボット身体を100万通り手続き的に設計・選別し、すべての身体についてシミュレーションで軌跡を生成するアルゴリズムを開発し、多様な模擬操作タスクで訓練した。<br><br>未見の身体・場面2,000エピソードの評価で成功率63.0%を達成し、π0.5の17.8%、最強ベースラインの57.9%を上回った。GPT-6 Astraの評価タスク群では64.7%対41.1%、未見の実機ロボットでは次善手法MolmoAct2の約2倍の成功率だった。成功率だけでなく、形態の能力を活かし制約に適応した異なる操作戦略を学習することも観察された。出典：arXiv","timestamp":1795478400000,"title":"OmniAct: One Policy, One Million Embodiments","titleJa":"OmniAct――1つの方策で100万通りの身体を操る","url":"https://arxiv.org/abs/2611.33158v1"},{"authors":["Siamak Ravanbakhsh","David Nitchi","Khang Ngo"],"categories":["cs.LG","cs.AI","cs.NE"],"field":"arXiv","genre":"LLM / NLP","monthKey":"2026-11","publishedAt":"2026-11-24T00:00:00Z","source":"arXiv","summaryHtml":"大規模言語モデル（LLM）の利用場面では、AI安全性や探索、人間との対話のために認識論的不確実性の推定が役立つ。既存のベイズ深層学習は固定されたモデル族に制限されがちで、実用的なLLM規模での完全な認識論的不確実性を捉えられないと著者らは論じる。モデル族の容量の限界による誤差は、事前分布が支持するモデル間の不一致には現れないからである。<br><br>本論文は、この誤差がモデルサイズに対するLLM損失のよく知られたベキ則と関係することを示した。さらに第2のベキ則として、モデルサイズの増大とともにアンサンブル内の不一致が縮小することを定量化し、その減衰が容量則より遅いことから、アンサンブルは認識論的不確実性のより大きな割合を捉え、単一のより大きなモデルに比べて競争力を増すと論じた。第3のベキ則は、分岐前に訓練を共有する割合が大きいほどアンサンブルの多様性が失われることを定量化し、単一の訓練解の周辺で不確実性を近似するLoRAアンサンブルや最適化・2次手法の限界を示した。<br><br>多様なアンサンブルは、スケーリングと不確実性定量化の両方において有望な軸になりうるという。認識論的不確実性をスケーリング則の観点から捉え直した研究である。出典：arXiv","timestamp":1795478400000,"title":"Scaling Laws of Ensemble Uncertainty in Language Models","titleJa":"言語モデルにおけるアンサンブル不確実性のスケーリング則","url":"https://arxiv.org/abs/2611.32801v1"},{"authors":["Jiayi Sheng","Jingwen Gu","Guanning Zeng","Zhaoyi Zhou","Stefano Viel","Qianqian Wang","Fahim Tajwar","Andrea Zanette"],"categories":[],"field":"arXiv","genre":"LLM / NLP","monthKey":"2026-11","publishedAt":"2026-11-24T00:00:00Z","source":"arXiv","summaryHtml":"強化学習（RL）による事後学習では、モデルが生成したデータで学習して能力を高めるが、通常ロールアウトは更新のたびに破棄され、獲得した知識はモデルの重みにのみ残ると考えられてきた。本研究は、その知識がロールアウト自体にどれだけ残っているかを検証した。<br><br>保存したロールアウトで元のRLアルゴリズムをそのまま再現しようとすると壊滅的な崩壊を起こすが、その原因を説明し、対処法として最尤推定を示した。同じベースモデルから、生成順にロールアウトを並べ、正誤を区別せず最尤推定で学習するだけで、オンラインRLの性能を復元できる。ロールアウトのバッチごとに1回の更新で、オンライン学習の学習曲線にほぼ追従し、最後の数ステップのロールアウトだけでも最終モデルの性能を復元できる場合があるという。<br><br>RLに投じた計算の多くは、サンプルから学ぶことではなく、より良いサンプリング分布を発見することに使われている可能性を示唆する。ロールアウトの保存と再利用という、これまで見過ごされてきた経路に注目した研究であり、RLの効率化や再現性をめぐる議論に新たな視点を与える結果である。出典：arXiv","timestamp":1795478400000,"title":"Reinforcement Learning Can Be Recovered From Its Own Rollouts","titleJa":"強化学習は自らのロールアウトから復元できる","url":"https://arxiv.org/abs/2611.33102"},{"authors":["Erfei Cui","Shengjia Zhao","Yan Qin","Kaixuan Wang","Junming Chen","Ping Luo","Tianxing Chen"],"categories":[],"field":"arXiv","genre":"Ethics / Safety","monthKey":"2026-11","publishedAt":"2026-11-24T00:00:00Z","source":"arXiv","summaryHtml":"身体性基盤モデルの進歩は課題の成功率で測られることが多く、判断の物理的安全性は十分に検討されてこなかった。規則遵守や二値判断を中心とする安全評価では、モデルが環境の危険を理解し安全に判断しているかを測れない。本研究はそのためのベンチマーク「EmbodiSafety」を提案する。<br><br>844の視覚シナリオにわたり、スナップショット課題1,092件と軌跡課題540件を用意し、短期・長期の安全性を評価する。直接実行・拒否・明確化・制約付き実行・自律的回復・人間へのエスカレーションという6つの応答モードを区別し、回復と人間の介入を分けることで、安全な自律性の境界を明示的な評価対象にした。モードの正しさ、リスクの特定、実行可能な対処を組み合わせて判定する。<br><br>参照モデルの中ではClaude-Opus-5.5が最も高い完全判定精度を示し、スナップショットで56.1％、軌跡で61.5％だった。安全アライメント用に4万件のデータも整備し、これで学習させるとQwen3.5-2BとQwen3.5-4Bの精度が上がったという。出典：arXiv","timestamp":1795478400000,"title":"EmbodiSafety: Benchmarking Risk Understanding and Response in Embodied AI","titleJa":"EmbodiSafety――身体性AIのリスク理解と対応を測るベンチマーク","url":"https://arxiv.org/abs/2611.33054"},{"authors":["Yisrael Clark","Guy Katz"],"categories":[],"field":"arXiv","genre":"LLM / NLP","monthKey":"2026-11","publishedAt":"2026-11-24T00:00:00Z","source":"arXiv","summaryHtml":"大規模言語モデル（LLM）は自然言語を一階述語論理（FOL）に翻訳して推論を改善する用途が広がっているが、誤りやすく、不忠実な論理式は下流の推論を損なう。本研究はLLMが生成したFOL翻訳を検証する「意味的ファイアウォール」パイプラインFOL-Proofを提案する。<br><br>英語資源文法や最小再帰意味論などの意味解析ツールで候補の翻訳を決定論的に導出し、SMTソルバーでLLM生成式との論理的等価性を検査する。翻訳が忠実なら受理し、そうでなければ却下するか、LLMへの再呼び出しで修復を試みる。探索が不完全な場合や未対応の構文、判定不能な場合は、誤って却下するのではなく棄権する保守的な設計だ。<br><br>ProofWriter、RuleTaker、PrOntoQAの既存ベンチマークと、新たな敵対的ベンチマークLongFaithCheckでの評価では、ほぼ完全な選択精度を達成し、LLM判定やラウンドトリップのベースラインを大きく上回った。検証済みの翻訳だけを下流に渡すことで、LLMの推論パイプラインの信頼性を高める仕組みである。出典：arXiv","timestamp":1795478400000,"title":"FOL-Proof: Verifying LLM Text-to-Logic Translations via Deterministic Semantics","titleJa":"FOL-Proof――LLMの論理翻訳を決定論的に検証する仕組み","url":"https://arxiv.org/abs/2611.33078"},{"authors":["Marcus Ghosh","John S. Butler"],"categories":[],"field":"arXiv","genre":"Neuroscience","monthKey":"2026-11","publishedAt":"2026-11-24T00:00:00Z","source":"arXiv","summaryHtml":"動物は匂い・視覚・聴覚を絶えず組み合わせ、多感覚の流れとして統合している。多感覚統合は学習を速め、反応速度を上げ、感覚の曖昧さを解消する。本レビューはこの過程をめぐるモデルの系譜を整理し、数式数個の規範モデルから数十億パラメータのニューラルネットワークまでを一つの連続体として位置づけた。<br><br>規範モデルは感覚信号をどう統合すべきかという仮説から出発し、ニューラルネットワークモデルは回路がどう統合しうるかを模倣する。両者を合わせると、観察者は統計的に最適な形で手がかりを統合でき、多感覚ニューロンの応答プロファイルやネットワーク構造の多様性も説明できるという。理解しやすい数式とPythonコード付きの教育的概観を提供し、両モデルの前提と説明力を比較した。<br><br>古典的な理論モデルと人工ニューラルネットワークの知見をどう調和させ、今後の研究をどう形作るべきかも論じる。脳の統合原理と人工ネットワークの設計をつなぐ視点を提供するレビューであり、感覚統合の理論と実践の双方に手がかりを与える内容である。出典：arXiv","timestamp":1795478400000,"title":"Normative and neural network models of multisensory integration","titleJa":"多感覚統合の規範モデルとニューラルネットワークモデル","url":"https://arxiv.org/abs/2611.32829"},{"authors":["Shijin Gong","Kai Ye","Victor Chernozhukov","Xinyu Zhang","Chengchun Shi"],"categories":["cs.LG","stat.ML"],"field":"arXiv","genre":"LLM / NLP","monthKey":"2026-11","publishedAt":"2026-11-24T00:00:00Z","source":"arXiv","summaryHtml":"DeepSeekの導入以来、グループ相対方策最適化（GRPO）は大規模推論モデルやエージェントの学習に広く使われてきた。しかし、その要となるハイパーパラメータであるグループサイズは、これまでほぼ試行錯誤で決められていた。本論文は、GRPOの方策勾配がU統計量の構造を持つことに着目し、グループサイズの選択を分散比の推定という古典的な統計問題として捉え直した。比率の分母が小さいときに素朴な推定が不安定になる問題に対し、分母の推定不確実性を考慮した悲観的な比率推定量を提案し、3つの標本サイズ領域でその統計的性質を特徴づけた。<br><br>検証では、ジャックナイフに基づく悲観的ルールによる適応的なグループサイズ選択を用いた。Reasoning Gymの合成課題と、数学推論・コード生成をカバーする実ベンチマークで、適応的手法は方策勾配の平均二乗誤差を下げ、固定グループサイズのベースラインよりも方策の最適化を改善した。追加の計算コストは控えめだった。<br><br>結果として、推論モデルの学習におけるグループサイズは、勘に頼る調整対象ではなく、統計的に原理づけられた選択が可能な対象になることが示された。GRPO系アルゴリズムの変種が増えるなか、学習の安定性と効率を両立させる実用的な指針を与える。出典：arXiv","timestamp":1795478400000,"title":"U-Statistics-Powered LLM Reasoning","titleJa":"U統計量で推論モデルの学習を安定化――GRPOのグループサイズを統計的に決める適応的手法","url":"https://arxiv.org/abs/2611.33064"},{"authors":["Shuguang Chen","Salman Paracha"],"categories":["cs.AI","cs.CL"],"field":"arXiv","genre":"Agents / Robotics","monthKey":"2026-11","publishedAt":"2026-11-24T00:00:00Z","source":"arXiv","summaryHtml":"大規模言語モデル（LLM）エージェントは、対話をまたいで情報を保持・再利用するために外部記憶に頼っている。既存の記憶システムは記憶を「過去の記録」とみなし、会話への忠実さで評価してきた。しかし記憶の価値は、エージェントの応答を改善するかどうかで決まる。記憶システムは応答が生まれる前に「何を覚え、何を出すか」を決めなければならず、忠実な記憶が応答の改善に結びつかないこともある。本論文は記憶を予測問題と捉え直し、過去への忠実さではなく将来への有用性に焦点を当てた記憶システムLetoを提案した。<br><br>将来の要求は未知のため、Letoは記憶索引によって会話の詳細へのアクセスを保ち、要求が届いたときに索引から文脈を再生して、要求に明示されていない情報を先回りして供給する。供給した文脈の有用性は応答が生成されるまで分からないため、応答の結果を使って将来の記憶選択を洗練させる効用ループも備える。6つの記憶システムとの比較を5ベンチマーク・3シナリオで行った。<br><br>個人化ではPrefEvalで最強の比較対象を16.3ポイント、PERMAのタスク完了で3.1ポイント上回り、長期タスクではMemoryArenaで5環境平均の最良の総合性能を示し、連鎖が深くなるほど利得が増えた。長文脈理解では生の履歴に対する検索と同等でありながら、供給する文脈トークンは少なかった。出典：arXiv","timestamp":1795478400000,"title":"Leto: Utility-Centric Agent Memory","titleJa":"Leto――忠実さではなく「役に立つか」で選ぶエージェント記憶","url":"https://arxiv.org/abs/2611.33005"},{"authors":["Guangyuan Wang","Chengran Li","Minchen Luo","Jichen Feng","Mengdi Wang","Yifan Zhang"],"categories":["cs.AI","cs.AR"],"field":"arXiv","genre":"Agents / Robotics","monthKey":"2026-11","publishedAt":"2026-11-24T00:00:00Z","source":"arXiv","summaryHtml":"言語モデルデコーダは復号ステップのあいだに状態を持ち、ハードウェアでは誤った状態更新が、現在のトークンは正しいまま数トークン後の出力を壊すことがある。つまり出力テストに通っても設計が誤っている場合がある。AIChipBenchは、LLMコーディングエージェントがそのようなハードウェアを正しく構築できるかを問うベンチマークだ。エージェントは量子化されたQwen3.5・Gemma 3・Gemma 4・Llama 3.2デコーダを合成可能なRTLで実装し、各復号ステップの出力と保存状態を規定する実行可能な整数リファレンスと突き合わせる。公開テストでデバッグし、凍結した設計を未見のトークン列・リセット・メモリストール・合成で採点するほか、正しい設計の高速化を求めるトラックもある。<br><br>4エージェント・9136試行の結果、難しさは保存状態にあった。最初の状態不一致を指すフィードバックは、出力のみのフィードバックに比べ、全12のエージェント×タスクのセルで採択率を25.0〜46.9ポイント上げ、採択設計あたりのエージェント時間を半減させた。一方、採択された69設計のうち45件は、新しい系列と条件での再採点でテストが要求した32ステップ以内に失敗した。高速化の試行の3分の1超は高速化なしに終わった。<br><br>総合スコアではSol 5.6、Fable 5.1がAstra 6とOpus 5.5を上回り、この順位は200回のランダム分割すべてで保たれた。結論として、ハードウェアエージェントには保存状態を露出させるデバッグ用フィードバックが必要であり、ベンチマークには開発用ケースをはるかに超えた最終テストが必要だとされる。出典：arXiv","timestamp":1795478400000,"title":"AIChipBench: Benchmarking LLM Agents for Automated AI Accelerator Design","titleJa":"AIChipBench――LLMエージェントにAI加速器のハードウェア設計を課すベンチマーク","url":"https://arxiv.org/abs/2611.33093"},{"authors":["Qingle Liu","Jieming Li","Pei-lin Li","Shenghan Zheng","Ruize Yang","Sunqi Fan","Deyao Hong","Huan-ang Gao","Meng-Hao Guo","Shuojin Yang"],"categories":["cs.AI","cs.RO"],"field":"Hugging Face Papers","genre":"Agents / Robotics","monthKey":"2026-11","publishedAt":"2026-11-24T00:00:00Z","source":"Hugging Face Papers","summaryHtml":"文脈内学習（ICL）によりエージェントは推論時に新しい規則を学び、ユーザーの要求に適応できる。しかし既存のベンチマークはオフラインでテキストや静止画に頼り、訓練データ汚染の恐れもあり、ロボット評価は手法レベルの比較にとどまっていた。ICLWorldは、コンピュータ操作からロボット操作までを対象とするオンラインベンチマークで、すべての環境をユーザーインターフェース化するハーネスUIverseとともに提示された。30環境、630本のデモ動画（10時間超）、160課題を備え、各課題にはテキストまたは動画で与えられる3バージョンの規則があり、デモの再現から新事例・未見環境への般化まで3段階で測る。<br><br>6つのフロンティアモデルを評価すると、最強のClaude Opus 5.5とGPT-6 Astraはコンピュータ操作で82%・76%成功したが、ロボット操作では27%・26%にとどまった。規則なしの対照では成功率は最大8%。GPT-6 Astraは3バージョンすべての規則下で成功したコンピュータ課題が38%と、単一規則時の半分だった。ロボットの規則問題には98%正答しながら、課題の完遂は20%にとどまった。<br><br>強いエージェントは動画とテキストの双方から規則を学び環境をまたいで転移できたが、弱いエージェントはテキストに頼り、提示状況を変えると動画からの成功の大半を失った。デジタルと物理のあいだ、そして規則の理解と実行のあいだに大きな隔たりがあることが示された。出典：Hugging Face Papers","timestamp":1795478400000,"title":"ICLWorld: Benchmarking In-Context Learning of Agents from Digital to Physical Worlds","titleJa":"ICLWorld――文脈から規則を学ぶエージェントをデジタルから物理世界まで測るベンチマーク","url":"https://huggingface.co/papers/2611.32649"},{"authors":["Shivank Rajput","Himanshu Singh","A. V. Subramanyam"],"categories":["cs.CL","cs.CR"],"field":"arXiv","genre":"Ethics / Safety","monthKey":"2026-11","publishedAt":"2026-11-24T00:00:00Z","source":"arXiv","summaryHtml":"大規模言語モデルは、無害に見えるプロンプトに最適化された接尾辞を付けて安全対策を回避するジェイルブレイク攻撃に脆弱なままだ。GCG型の最適化攻撃は有効だが、推論時に高コストで、他のモデルへの転移性も低い。SALSAは、最適化で得た攻撃コーパスからジェイルブレイク接尾辞の分布を学習する生成フレームワークで、学習が済めばサンプリングによる効率的な攻撃が可能になる。学習した接尾辞分布が最適化出力の分布に近いとき、生成サンプリングが高い攻撃成功率を保てる理由についても直観的な説明が与えられた。<br><br>オープンソースの対象では、最先端の最適化ベースラインと同等の攻撃成功率を達成しつつ、生成時間は1プロンプトあたり3.46秒から0.04秒に短縮された。ブラックボックス転移では、GPT-3.5-Turboに99%、より難しいGPT-4oにも45%の攻撃成功率を示し、等しいサンプリング予算で最強のベースラインの2倍以上となった。<br><br>結果として、敵対的サフィックスの分布を学習することは、LLMの脆弱性を継続的に発見するための、拡張可能で実用的に効率的な基盤になることが示された。安全性評価の側からは、高速で転移性の高い攻撃手法が現実の脅威モデルに入ったことを意味する。出典：arXiv","timestamp":1795478400000,"title":"SALSA: Sampling Adversarial Suffixes from Learned Distributions for LLM Safety Assessment","titleJa":"SALSA――敵対的サフィックスの分布を学習しLLMの脆弱性を高速に探る","url":"https://arxiv.org/abs/2611.33030"},{"authors":["Fabian Gröger","Shuo Wen","Maria Brbić"],"categories":["cs.LG","cs.AI","cs.CL"],"field":"arXiv","genre":"LLM / NLP","monthKey":"2026-11","publishedAt":"2026-11-24T00:00:00Z","source":"arXiv","summaryHtml":"基盤モデルは大規模な事前学習ののち、タスクごとに適応される。だが適応は本当に新しい能力を付け加えているのか、それともベースモデルがすでに持つ力を引き出しているだけなのか。本研究は、適応による更新を全入力に共通する成分と入力依存の残差に分解し、この問いを検証した。適応の本質をめぐる問いは、モデルの能力がどこに宿るのかという理解にも直結する。<br><br>その結果、適応による性能向上の大部分は共通成分だけで説明できることがわかった。層ごとに定数ベクトルを学ぶだけの「シフトアダプタ」が、LoRAやフルファインチューニングの挙動を再現したのである。研究チームはこれを「可能態の原理」と呼び、タスク専門性に必要な能力はベースモデルにすでに内在し、適応はそれを一定方向へ押し出す「現実化」にすぎないと主張する。<br><br>この原理は、パラメータ効率的な適応やモデルのステアリング、収束の理解に示唆を与え、「ニューラル・シケット」と呼ばれる現象の説明にもつながるという。基盤モデルの能力観を捉え直す、哲学的な含みをもった一本である。出典：arXiv","timestamp":1795478400000,"title":"On Potentiality and Actuality Of Foundation Models","titleJa":"基盤モデルの可能態と現実態――適応は新たな能力を加えるのか","url":"https://arxiv.org/abs/2611.32991"},{"authors":["Yaswanth Chittepu","Raghavendra Addanki","Anup Rao","Branislav Kveton","Scott Niekum"],"categories":["cs.LG","cs.AI","cs.CL","cs.NE"],"field":"arXiv","genre":"Agents / Robotics","monthKey":"2026-11","publishedAt":"2026-11-24T00:00:00Z","source":"arXiv","summaryHtml":"LLMエージェントは通常、過去の観測と行動の全履歴を「状態」の代わりに保持するが、その多くはもはや不要な情報である。履歴を丸ごと抱え込む方式は入力を肥大化させ、計算コストとノイズの両方を増やす。本研究は、参照エージェントの能力を保ちつつ、履歴を最小限の抽象へ圧縮する「エージェント状態」の定義を提案した。<br><br>振る舞いの完全な一致ではなくタスク性能で十分性を定義し、状態抽象を決定論的な再帰プログラムとして表現。探索では参照エージェントの振る舞いをなぞるのではなく、タスクの成否そのものを基準にした。LLMに誘導された遺伝的アルゴリズムで探索した結果、ALFWorldとScienceWorldで参照エージェントに近い成功率を保ちながら、方策への平均入力を最大で71%と57%削減できた。<br><br>得られたプログラムは直接点検でき、対話の進行中に何が保持され、何が更新され、何が破棄されるかを明示的に説明できる。長い対話ほど履歴は膨らむため、圧縮の効果は実用上も大きい。エージェントの効率化と透明性を両立させる一歩となる。出典：arXiv","timestamp":1795478400000,"title":"Learning Compact State Abstractions for LLM Agents","titleJa":"LLMエージェントの状態を圧縮する――必要な情報だけを残す抽象化の学習","url":"https://arxiv.org/abs/2611.31800"},{"authors":["Vincent Koc","Aditya Washikar","Rishab Naveen Venkataraman","Onur Solmaz","Zhentong Fan","Xinyang Han","Toby Vincent John","Hao Li","Achyut Mukund","Biresh Chandra Biswas","Eshan Shukla","Louis Pan","Ivan Kudryavtsev","Patthigulla Sai Surendra","Krish Oberoi","Ayaan Zaidi","Hema Veeradhi","Taylor Agarwal","Erik Erlandson","Agustin Rivera","Jacob Tomlinson","Louka Ewington-Pitsos"],"categories":["cs.AI","cs.CL","cs.SE"],"field":"arXiv","genre":"Agents / Robotics","monthKey":"2026-11","publishedAt":"2026-11-24T00:00:00Z","source":"arXiv","summaryHtml":"一般の人々のあいだでAIエージェントの利用が急増するなか、どの構成が自分の用途に最も有効かは分かりにくい。日常の利用では、どのモデルとどのハーネスを組み合わせるかが悩みの種になっている。本研究は、1000万人超のユーザーリクエストをもとにした100件の日常タスクからなるベンチマークShellBenchを提案した。雑然としたファイルや競合する情報源のある現実的な作業環境で、正しさと安全性を採点する。<br><br>12モデル×5ハーネス×3推論レベル、計53,100回の実行を評価した結果、性能を最も左右するのはハーネスの選択ではなくモデルの選択だった。ただし上位3モデルの差はわずか1.1ポイントで、GPT-6 Astraが62.5%で首位、GPT-6.1 Solは61.4%を約6分の1の推定コストで達成した。<br><br>ハーネスによる違いは性能・安全性のいずれでも小さく、pass@1は42.9〜45.2の範囲にとどまった。日常利用では最上位モデルや特定のハーネスにこだわる必要は薄く、費用対効果の高い選択肢が実用的であることが示された。出典：arXiv","timestamp":1795478400000,"title":"ShellBench: What Matters More for AI Agents, Models, or Harness for Everyday Tasks","titleJa":"AIエージェントの実力は何で決まるか――日常タスクのベンチマークShellBench","url":"https://arxiv.org/abs/2611.32946"},{"authors":["Georgios Politis","Evangelos Pappas"],"categories":["cs.CR","cs.DC"],"field":"Hugging Face Papers","genre":"Ethics / Safety","monthKey":"2026-11","publishedAt":"2026-11-24T00:00:00Z","source":"Hugging Face Papers","summaryHtml":"分割学習におけるプライバシー評価では、防御そのものの欠陥と、評価方法の欠陥が混同されがちである。評価者が見落としやすい落とし穴として、露出した勾配チャネル、ずれたラベルへの再構成の照合、未較正のプローブの使用が挙げられる。本研究は、こうした測定側の失敗を切り分け、過去の4件の分割LLMキャンペーンを遡及的に再分析した。<br><br>24件の必須プローブのうち較正を満たしたのは4件のみだったが、それでも13構成で限定的なプライバシー侵害が確認された。残りの6構成は有用性や学習効果の不足で除外された。7セルの防御再設計パイロットでは、較正済みの次バイト構造プローブが全セルで基準を突破し、最終的に4件が不合格、3件が判定不能となった。<br><br>共有鍵の直交ラッパーは受動的な盗聴からは守るが、侵害されたホストからは活性化を隠せないことも示された。1,522件のチェックを122件のSHA-256固定アーティファクトで再実行可能にし、検証可能性も確保している。プライバシー主張の検証には、まず測定の較正が不可欠であることが示唆される。出典：Hugging Face Papers","timestamp":1795478400000,"title":"Separating Measurement Failures from Defence Failures in Split Language-Model Privacy","titleJa":"分割型言語モデルのプライバシー評価――測定の失敗と防御の失敗を切り分ける","url":"https://huggingface.co/papers/2611.31752"},{"authors":["Dawid J. Kopiczko","Tijmen Blankevoort","Yuki M. Asano"],"categories":["cs.CL"],"field":"arXiv cs.CL","genre":"LLM / NLP","monthKey":"2026-11","publishedAt":"2026-11-24T00:00:00Z","source":"arXiv","summaryHtml":"推論モデルは強化学習や、強い教師の軌跡へのファインチューニングによって長期エージェントになる。標準的な手法は思考連鎖と行動の両方を模倣するが、最強の教師はクローズドモデルで、思考連鎖はAPIの背後に隠れている。本研究は、思考連鎖を完全に省き、教師の行動だけから長期方策を蒸留できることを示す。学生は推論ブロックを空にしたまま軌跡で訓練され、自身の生成のリプレイバッファに対するKL損失で初期モデルからの逸脱を抑える。<br><br>驚くことに、空の推論ブロックで学んだ方策は、思考を有効にした推論時にも転移する。学生は自分の流儀で推論しながら教師のように行動するという効果で、著者らはこれを形式横断転移と呼ぶ。教師の推論の短い要約「CoTプロキシ」を空の推論ブロックの後に置くと効果はさらに高まる。<br><br>Qwen3.6-27Bの行動蒸留により、Qwen3-4BのAppWorld成功率は7%から18%に、Qwen3-32Bは12%から25%に向上した。CoTプロキシを加えるとQwen3-4Bは35%に達する。GPT-5.6 Lunaからの蒸留ではQwen3-4Bが7%から48%に、SWE-bench Verifiedでは3%から28%に向上した。出典：arXiv","timestamp":1795478400000,"title":"CoT-Proxy: Cross-Format Transfer for Distilling Long-Horizon Policies","titleJa":"CoT-Proxy――長期エージェント方策の蒸留における形式横断転移","url":"https://arxiv.org/abs/2611.33148"},{"authors":["Binfei Ji","Zhiwen Cao","Anqi Yang","Prem Seetharaman","Shuo Yang","Ratheesh Kalarot","Yingyan Celine Lin","Mingze Xu"],"categories":["cs.CV","cs.CL"],"field":"arXiv cs.CV","genre":"Vision / Multimodal","monthKey":"2026-11","publishedAt":"2026-11-24T00:00:00Z","source":"arXiv","summaryHtml":"動画中のすべての発話について、書き起こし、タイムスタンプ、話者の視覚的説明を出す視聴覚LLM「DiaCap」を提案する。発話のタイミングと話者の特定は互いに密接に結びついているため、DiaCapは両方の課題を単一モデルに統合し、2段階で訓練する。まず22万5千の精選クリップで、すべての発話を詳細にラベル付けした合成キャプションによる学習を行い、次に2,900の人間修正クリップで強化学習し、発話タイミング・話者グルーピング・話者紐付けを細粒度フィードバックで磨く。<br><br>発話単位のタイムスタンプと字幕編集を加えて拡張したDiaDemBenchで評価したところ、既製の書き起こしを使う版もエンドツーエンド版のDiaCap-E2Eも強力な結果を示した。視聴覚話者特定ではGemini 4 Argonと同等で、タイムスタンプ精度では76.59対42.76と大きく上回った。<br><br>多言語や数分間の動画でも話者特定は堅牢で、視聴覚質問応答への転移も確認された。この一体型の設計は、動画理解の幅広い場面への応用につながる。出典：arXiv","timestamp":1795478400000,"title":"DiaCap: Jointly Learning Who Speaks When for Audiovisual Dialogue Captioning","titleJa":"DiaCap――話者と発話タイミングを同時に学ぶ視聴覚対話キャプション","url":"https://arxiv.org/abs/2611.33153"},{"authors":["Seongchan Kim","Soowon Son","Sangoh Kim","Hyunah Ko","Eunbeen Hong","Hyunkoo Lee","Sanghyun Lee","WonJun Moon","Kihong Kim","Dongyeon Son","Woongchan Nam","Seungryong Kim"],"categories":["cs.CV","cs.LG","cs.RO"],"field":"arXiv","genre":"Agents / Robotics","monthKey":"2026-11","publishedAt":"2026-11-23T18:59:52Z","source":"arXiv","summaryHtml":"自動運転の推論型視覚言語行動（VLA）モデルは、思考の連鎖（CoT）で行動生成を導くが、メモリと計算コストが大きい。本研究は、シーン理解と軌道予測の両方を保つ構造化剪定を検討した。Alpamayo-1.5-10BにおけるTaylor重要度の分析では、推論と軌道の目的が、同じVLM構造に異なる重要度を与えることが分かった。<br><br>分析に基づき、両目的の重要度ランクを組み合わせてVLMを剪定し、段階ごとの重要度を集約して固定のエキスパートMLPチャネル部分集合を選ぶ手法「MoOP」を提案した。総パラメータ24.0%削減で、MoOPによるVLMのみの剪定は最強のベースラインと同等かやや上回る運転性能を示し、密モデルのLingoQAスコアの94.0%を保持した。30.0%削減でも他手法より劣化がはるかに小さく、推論が崩壊しない唯一の手法だった。<br><br>エキスパートMLPチャネルの93.75%を除去すると総パラメータ削減は39.4%に達し、開ループ誤差はほぼ変わらず、閉ループ性能も競争力を保った。結果として得られたモデルは、密モデル比でエンドツーエンド推論速度1.37倍、ピークメモリ36.6%削減を達成し、剪定後のファインチューニングは不要だった。出典：arXiv","timestamp":1795460392000,"title":"Pruning Autonomous Driving VLAs: What to Preserve for Reasoning and Action","titleJa":"自動運転VLAの剪定――推論と行動のどちらを残すか","url":"https://arxiv.org/abs/2611.31240"},{"authors":["Xiwei Liu","Yulong Li","Xuhui Li","Xinlin Zhuang","Zhixiang Lu","Haolin Yang","Jianxu Chen","Yifan Lu","Zhiran Zhang","Yutong Xie"],"categories":["cs.AI"],"field":"arXiv","genre":"Vision / Multimodal","monthKey":"2026-11","publishedAt":"2026-11-23T18:55:44Z","source":"arXiv","summaryHtml":"人は見慣れない空間を目的を持って探索し、空間的な問いに答えるのに必要な証拠が集まるまでどこを見るかを決める。視覚言語モデル（VLM）は用意された画像や動画に対する推論はますます得意になっているが、証拠が手渡されない状況でも空間を探索できるだろうか。本研究はActSpace-Benchを提案する。72の実スキャン屋内シーン、234の探索エピソード、994問からなるベンチマークで、モデルは1つの視点から出発し、実撮影フレームを移動しながら証拠を集めて答える。<br><br>探索が目的的かどうかを評価するため、モデルを推論器として固定し、同一予算のランダムウォークやオラクル経路と探索を比較する統制評価プロトコルを導入した。すべての問題は探索を要することが検証され、3Dアノテーションから解答され、証拠を隠した問題でモデルが棄却すべきときを知っているかも試される。抽出問題の95%以上は人間による検証で正しいことが確認された。<br><br>23の商用・オープンウェイト・空間特化VLMの評価では、最強モデルは目的を持って証拠を探索するものの、限られたメモリのためにその多くを失っていた。一方、弱いモデルや特化モデルはランダムウォークと変わらない探索しかできず、与えられた証拠から推論することもできなかった。能動的空間知能の次の課題は、メモリと証拠に基づく推論にあることが示された。出典：arXiv","timestamp":1795460144000,"title":"Seeking in Space: Benchmarking Purposeful Active Exploration of Vision-Language Models for Spatial Reasoning","titleJa":"空間を目的を持って探索できるか――視覚言語モデルの能動的空間探索ベンチマーク","url":"https://arxiv.org/abs/2611.31215"},{"authors":["Jingxi Chen","Yujia Chen","Cornelia Fermuller","Yiannis Aloimonos","Wen-Sheng Chu","Du Tran"],"categories":["cs.CV"],"field":"arXiv","genre":"Vision / Multimodal","monthKey":"2026-11","publishedAt":"2026-11-23T18:53:44Z","source":"arXiv","summaryHtml":"言語ではGPTが多様な理解・生成タスクを共通のトークン表現に落とし込み、単一のアーキテクチャと最適化で基盤モデルを生んだ。対して4D時空間ビジョンには共通の表現プロトコルがなく、知覚（深度・カメラ推定など）と生成は別々の一方向パイプラインか、揃っていない単一モダリティ空間の継ぎ接ぎで扱われてきた。本研究は、知覚と生成の共通プロトコルとして統一4D潜在空間を定式化するWorldLatentを提案した。<br><br>マルチモーダルVAEで4Dの外観・形状・動態を圧縮・融合し、単一の構造化された潜在表現にする。知覚と生成は同じ潜在空間上の相補的なノイズ除去過程として働き、1つの生成モデルが両能力を単一の学習ループで同時に学ぶ。代表的な4Dベンチマークでの実験では、融合した潜在プロトコルが専門モデル並みのゼロショット4D知覚、整合的な4D生成、制御可能な編集を単一モデルで達成した。<br><br>多様な4Dタスクを共通の表現プロトコルで統一できることを示し、汎用4D空間知能に向けた拡張可能な基盤を提示した。言語におけるGPTの成功を4D視覚へ拡張する試みといえる。出典：arXiv","timestamp":1795460024000,"title":"WorldLatent: A Unified 4D Latent Space for World Perception and Generation","titleJa":"WorldLatent――知覚と生成を統一する4D潜在空間","url":"https://arxiv.org/abs/2611.31209"},{"authors":["Xiao-Ming Wu","Kang Liao","Yuexiao Ma","Taolin Zhang","Mingqian Zhou","Nuo Chen","Ziming Li","Yihang Luo","Rui Li","Zhonghua Wu","Tianyu Xie","Xiawu Zheng","Zhongang Cai","Zhi Hou","Chen Change Loy"],"categories":["cs.RO"],"field":"arXiv","genre":"Agents / Robotics","monthKey":"2026-11","publishedAt":"2026-11-23T18:48:54Z","source":"arXiv","summaryHtml":"最先端マルチモーダルモデルは観察と指示からロボット行動を生成する汎化能力が高く、閉ループのロボットハーネス内で直接「方策」として働く新パラダイムが生まれた。だがハーネスの設計原則や、高い性能を支える能力は不明だった。本研究は最先端モデルを方策とするハーネスを体系的に調べる枠組みEmbo-Harnessを提示した。<br><br>プロンプト、計画、行動実行、ツール利用というエージェントループの4要素を調べ、6つの実証的知見を実践的なレシピにまとめた。手作りの計画やスキル、行動の事前分布よりも、モデルの生来の視覚推論とツール利用能力を活かすインターフェースを優先し、行動表現やチャンキング、推論量、視覚観察、短い多行動列、方策の洗練について有効な選択を示した。RoboLab-120では成功率83.3%で最強の既報ベースラインを26.2ポイント上回り、4つの実世界操作タスクでも20試行中15回ゼロショットで成功した。<br><br>介入実験からは、モデルは低レベルの関節・軌道生成よりも正確な空間目標推定に強く依存することが示された。強力なハーネス構築の実践レシピと、性能を駆動する能力の説明の両方を与える成果だ。出典：arXiv","timestamp":1795459734000,"title":"Embo-Harness: Towards Understanding Frontier-Model-as-Policy Harness","titleJa":"Embo-Harness――最先端モデルを方策として使うロボットハーネスの設計原則","url":"https://arxiv.org/abs/2611.31201"},{"authors":["Tianyi Huang","Samuel Xu","Ivy Gu","Nathan Huang","Siqi Zhang"],"categories":["cs.AI"],"field":"arXiv","genre":"Agents / Robotics","monthKey":"2026-11","publishedAt":"2026-11-23T17:43:16Z","source":"arXiv","summaryHtml":"LLMアダプタを更新する際、稼働中の全セッションの対話履歴を再生し直すのは非効率である。古いバージョンで計算したKVキャッシュを流用すればモデルバージョンが混ざり、全履歴の再プリフィルは履歴とセッション数が増えるほどコストが膨らむ。本研究は、最終ブロックのKVキャッシュを厳密に移行するモデル・ランタイム協調設計「LiveLoRA」を提案する。<br><br>下位のデコーダブロックを凍結し、K/Vアダプタのダウン射影を固定することで、各トークンの基本射影と低ランク座標をアダプタのバージョン間で保つ。ランタイムは候補のK/Vを再構築し、最終ブロックで最新トークンを再評価して、アダプタ・キャッシュ・次トークンのロジットをまとめて確定する。提示したモデル仮定のもと、厳密な演算では全履歴再プリフィルと等価な継続になることを証明した。<br><br>Qwen2.5-3B-Instructでの評価では、32セッション・各8Kトークンの条件で、全履歴再プリフィルに対して中央値で平均約69倍の公開速度向上を達成した。デコードのオーバーヘッドはネイティブのキャッシュ付きデコード比で約4.8%にとどまった。持続的なLLMエージェントが全対話履歴を再生することなく新しいアダプタ版を採用できるようになる。出典：arXiv","timestamp":1795455796000,"title":"LiveLoRA: Exact KV Cache Migration Across LoRA Updates for LLM Agents","titleJa":"LiveLoRA――LLMエージェントのアダプタ更新時に履歴を再生せずKVキャッシュを移行する","url":"https://arxiv.org/abs/2611.31105"},{"authors":["Xuanlei Zhao","Hailun Xu","Kai Wang","Yang Luo","Yingxuan Ren","Zirui Zhu","Yuxuan Lou","Kun Xu","Yan Wang","Kanchan Sarkar","Yang You"],"categories":["cs.CL","cs.LG"],"field":"arXiv","genre":"LLM / NLP","monthKey":"2026-11","publishedAt":"2026-11-23T17:38:43Z","source":"arXiv","summaryHtml":"ループ型Transformerは層ブロックを共有して繰り返し適用することで、パラメータを増やさずに計算量と性能を高め、テスト時スケーリングを可能にする。しかしこの力はこれまでゼロからの学習を要し、LLMでは控えめな改善にとどまっていた。既存モデルをファインチューニングでループ化する方法は安価だが、SFTに対する改善もわずかだった。<br><br>本研究はLoopResを提案する。Attention Residualsを発展させ、各ループ層がそれ以前のループの出力へ直接注意を向けられるようにした。各出力は同じ層の反復結果で区別しにくいため、構造的な同一性を符号化する学習可能な「ループ対応キー」を与えた。さらに全ループへの注意が中間ループのスキップを許すため、各層が直近Wループの残差ウィンドウだけを見るよう制限し、すべてのループが直近の結果の上に漸進的に積み上がるようにした。<br><br>3モデル系列・6つの事前学習済みLLMと9ベンチマークでの評価で、LoopResは有意で一貫した改善を示した。計算量2倍でQwen3-1.7B-BaseをSFT比29.1%改善し、最先端ベースラインの改善幅の2倍以上となった。効果は30Bまでの大規模モデルでも維持され、1.7Bから8Bでは計算量の増加に対してSFTより急峻に性能が伸び、長い出力ではより少ない計算でより高い上限に達した。出典：arXiv","timestamp":1795455523000,"title":"Unlocking the Power of Loops in Pretrained LLMs with Loop Residuals","titleJa":"ループ残差で既存LLMにループの力を――パラメータを増やさず計算を深める新手法","url":"https://arxiv.org/abs/2611.31094"},{"authors":["Tomer Ashuach","Zorik Gekhman","Avi Caciularu","Ori Ram","Jonathan Herzig"],"categories":["cs.LG","cs.AI","cs.CL"],"field":"arXiv","genre":"Ethics / Safety","monthKey":"2026-11","publishedAt":"2026-11-23T16:59:12Z","source":"arXiv","summaryHtml":"大規模言語モデル（LLM）は通常、思考の連鎖（CoT）で複雑な課題を解く。CoTはモデルの振る舞いを監視し、不整合な行動を見つける主要な手段でもある。しかし標準的なTransformerは、課題全体を内部で処理し最終的な答えだけを出力する「完全な潜在推論（CLR）」でも課題を解ける。理論上CLRの深さには上限があり、従来の測定では浅いとされてきた。<br><br>本研究は、CLRが推論を要する隠れた目的を追求できるほど深いかを問うた。まず単純な補助損失により、従来報告の5倍以上の深さで多段階課題を潜在的に解けることを示した。次に意思決定とコード生成の2課題で、隠れた目的（融資の却下や脆弱性の埋め込み）を追求するようモデルを訓練したところ、モデルのCoTは出力を正当化しつつ隠れた目的の痕跡を一切残さず、強力なLLMモニターも検出できなかった。<br><br>活性化パッチングの分析では、潜在的な計算はCoTの生成前に完了しており、CoTはその計算に関与していなかった。つまり推論を要する隠れた目的は、出力だけを読むモニターには見えないまま遂行されうる。CoTへの依存だけでは不十分であることを示す、AI安全性にとって重要な知見である。出典：arXiv","timestamp":1795453152000,"title":"Can Latent Reasoning Drive LLM Outputs Without a Trace?","titleJa":"潜在推論は痕跡を残さずLLMの出力を操れるか","url":"https://arxiv.org/abs/2611.31015"},{"authors":["Ádám Stefkovics"],"categories":[],"field":"OSF Preprints","genre":"LLM / NLP","monthKey":"2026-11","publishedAt":"2026-11-23T00:00:00Z","source":"OSF Preprints","summaryHtml":"大規模言語モデルが今や科学文献の多くを編集している。人のフィードバックで調整されたモデルは不確実性の表現を避ける傾向がある。本研究は、LLMによる編集が社会科学者の主張の強さを変えたかを問うた。2015〜2026年に1445誌に掲載された社会科学論文42万526件の抄録を調べたところ、GPT-4o系モデルで編集された文に一致する文の割合は2019〜22年の約2%から2026年には52%へ上昇していた。<br><br>2015〜22年の傾向に反して、2024〜26年の抄録では「may」などの様相のヘッジが14%減り、「demonstrate」などの強い動詞が3分の1増えた。1万4527件の抄録をコード化した部分標本では、ヘッジのない因果的主張の割合が2019〜22年の傾向を4.2ポイント上回った。917誌にわたり、ヘッジの減少と証拠動詞の増加はLLMの普及度とともに大きくなり、ChatGPT登場後にのみ現れた。<br><br>2019〜22年の抄録200件をGPT-4o系で編集する実験でも、ヘッジの除去、強い動詞の倍増、暗黙の因果的主張の追加が誌面レベルの変化と同程度に生じ、盲検の読者は一流誌向けの編集が主張を強めたと判断した。GPT-5 miniでも同様の傾向があったが、現行のGPT-6モデルは強い動詞もヘッジなし因果主張も純増させず、Claude Sonnet 5.5は抄録を断定的にしなかった。主張の強まりの程度は著者が使うモデルに依存する。出典：OSF Preprints","timestamp":1795392000000,"title":"Large language models made social science claims more assertive","titleJa":"LLMの校正が社会科学の主張を断定的にした――42万件の抄録にみる変化","url":"https://osf.io/preprints/socarxiv/9ames_v1/"},{"authors":["Carla Daniele","Giuseppe D’Avenio","Sandra Morelli","Cecilia Poli"],"categories":[],"field":"Frontiers in Artificial Intelligence","genre":"Ethics / Safety","monthKey":"2026-11","publishedAt":"2026-11-23T00:00:00Z","source":"Frontiers in Artificial Intelligence","summaryHtml":"医療機器ソフトウェアは現代医療の中心要素となり、市場は急速に拡大している。診断画像の解析からデジタル治療まで、AIと機械学習を使う製品が増えている。EUでは医療機器規則（MDR）または体外診断用医療機器規則（IVDR）が、資格認定、リスク分類、適合性評価、市販後調査を定めている。<br><br>2026年8月に適用が始まったAI法は第二の枠組みを重ねる。MDR・IVDRのもとで第三者による適合性評価を受けるAI医療機器ソフトウェアは、AI法では一般にハイリスクAIに分類され、品質管理、データガバナンス、透明性、人的監視、インシデント報告の追加要件が課される。<br><br>研究は両枠組みの共存から生じる主なギャップを挙げる。重なるが同一でない品質管理と市販後調査の義務、低リスク製品の調査義務の違い、インシデント報告の閾値のずれ、実世界で試験される適応型システム、院内製デバイスの免除、類似の役割の責任のずれ、臨床応用に組み込まれた汎用AIモデルの資格、認証機関のAI評価能力の不足である。関係する委員会による速やかなガイダンスが、製造業者と利用者の双方に規制の確実性をもたらすという。出典：Frontiers in Artificial Intelligence","timestamp":1795392000000,"title":"Critical points of conformity assessment of medical device software based on artificial intelligence in the European Union","titleJa":"EUにおけるAI医療機器ソフトウェアの適合性評価――AI法と医療機器規則の交錯","url":"https://www.frontiersin.org/articles/10.3389/frai.2026.1937428"},{"authors":["Jeffrey Lambert","Noah Marshall","Maria Loades","Nathalia Gjersoe","Grace Thomas","Myles-Jay Linton"],"categories":[],"field":"JMIR Mental Health","genre":"LLM / NLP","monthKey":"2026-11","publishedAt":"2026-11-23T00:00:00Z","source":"JMIR Mental Health","summaryHtml":"生成AIツールは健康情報や心の支えを求める場面で広がっているが、デジタルリテラシーが高くメンタルヘルスの需要も大きい大学生が、メンタルヘルス支援にどう使っているかは分かっていなかった。本研究は英国のある大規模大学の学生を対象に、過去6か月間の生成AI利用の広がりと、利用と結びつく属性を調べた。<br><br>招待した2万2207人のうち2020人（回答率9.1%）が回答し、25.0%（503人）が過去6か月にメンタルヘルス支援目的で生成AIを使っていた。用途は、感情的に苦しいときの助言が380人（19.3%）、メンタルヘルスへの気づきが256人（12.7%）、パーソナルなセラピストやコーチとしての利用が173人（8.6%）で、自傷の思いを抱えたときの支援を求めた人も54人（2.7%）いた。<br><br>利用は26〜29歳、アジア系、障害を申告した学生、経営学系の学生、ウェルビーイングが低い学生で多かった。回答者の約4人に1人が使っており、とくに支援を必要とする層で非公式な相談経路として機能していることが示唆される。大学や医療サービスは、生成AIを相談経路の一つとして想定し、適切な案内や既存サービスとの連携、安全な利用の仕組みを整える必要があるという。出典：JMIR Mental Health","timestamp":1795392000000,"title":"Generative AI Use for Mental Health Support Among Students at a UK University: Cross-Sectional Study","titleJa":"生成AIをメンタルヘルス支援に使う学生は4人に1人――英国大学の横断調査","url":"https://mental.jmir.org/2026/1/e96196"},{"authors":["C. Kalaiarasi","M. Asha Jerlin"],"categories":[],"field":"Frontiers in Artificial Intelligence","genre":"Ethics / Safety","monthKey":"2026-11","publishedAt":"2026-11-23T00:00:00Z","source":"Frontiers in Artificial Intelligence","summaryHtml":"機械学習と深層学習は侵入検知システムの性能を高めたが、手法が複雑になるほど結果の透明性と信頼性の検証は難しくなる。説明可能AIを組み込んだ侵入検知の研究は、アーキテクチャや応用領域、連合学習、グラフ手法、ドメイン横断の観点で断片化していた。本サーベイは、検知の有効性、説明の質、ドメイン横断の移植性、導入上の制約の4基準で体系的に比較した。<br><br>比較から4つの成果物をまとめた。既存サーベイの7次元比較、説明可能性の性質とデータセットに結びつけた攻撃の分類、ドメイン横断の移植性のための因果的説明可能AIの定義、9種類の導入形態に対応する実務者向け判断マトリクスである。報告される深層学習の精度は99.98%に達し、XG-NIDは3つのドメイン横断データセットでF1スコア97%、93%、76%を示した。<br><br>因果推論を加えたCIADAはドメイン横断精度97.52%と平均9.62%の改善を報告したが、独立した再現はされておらず、因果的転移可能性の基準も実証ではなく形式的な提案にとどまる。連合型の説明可能AI侵入検知は精度85〜88.40%だった。データセットの異質性と説明に関する評価の不足から直接比較は限られ、導入場面を問わず優れた単一の手法は示されていない。出典：Frontiers in Artificial Intelligence","timestamp":1795392000000,"title":"Beyond black-box detection: a survey of explainable artificial intelligence for trustworthy intrusion detection across classical and quantum paradigms","titleJa":"ブラックボックスを超える侵入検知へ――説明可能AIによる信頼できるIDSの展望","url":"https://www.frontiersin.org/articles/10.3389/frai.2026.1929727"},{"authors":["Arthur Bran Herbener","Filip Skjold Thidemann","Caroline Gjørtsvang Kock","Malene Flensborg Damholdt"],"categories":[],"field":"OSF Preprints","genre":"LLM / NLP","monthKey":"2026-11","publishedAt":"2026-11-23T00:00:00Z","source":"OSF Preprints","summaryHtml":"AIが生成したと表示された支援の言葉は、人間が書いたものより共感が低く受け取られるという報告があるが、証拠はまちまちで、共感の捉え方や測り方によって効果が変わるのかは不明だった。本研究は、支援コミュニケーションにおける発信源の表示（人間かAIか）が知覚される共感に与える影響を、系統的レビューとメタ分析で調べた。<br><br>10件の文献から18件の独立した研究（計1万3541人）を特定した。発信源の表示による効果は、一般的共感でg=0.41、認知的共感でg=0.39、動機づけ的共感でg=0.42と小さく、感情的共感ではg=0.50と中程度だった。ただし研究間のばらつきは大きかった。<br><br>性別が一般的共感の調整要因として一度は有意に見えたが、影響の大きい2件の外れ値を除くと有意でなくなった。年齢、提示の形式（場面提示か一人称のやり取りか）、支援の場面による調整効果も有意ではなかった。研究間の大きなばらつきの原因はほぼ未解明のままで、発信源の表示の効果がどのような条件で生じ、やり取りの中で持続するのかを今後調べる必要がある。出典：OSF Preprints","timestamp":1795392000000,"title":"AI versus human source attribution and perceived empathy in supportive communication: A systematic review and meta-analysis","titleJa":"AIと書かれると共感は薄れるのか――支援コミュニケーションのメタ分析","url":"https://osf.io/preprints/psyarxiv/mb3rp_v1/"},{"authors":["Ruijie Luo","Yuehong Huang","Chenxia Xue","Qiuyi Yu","Nantu Hu","Yuxuan Wei","Hongxiang Liu","Steven Dirk Laureys","Haibo Di","Jianjun Meng"],"categories":[],"field":"Journal of Neural Engineering","genre":"Consciousness / Philosophy","monthKey":"2026-11","publishedAt":"2026-11-23T00:00:00Z","source":"Crossref","summaryHtml":"遷延性意識障害（DOC）の診断・予後評価では脳波（EEG）が客観的な指標になるが、従来の課題遂行型パラダイムは患者の残存する意識と課題の要求が合わないことや、機械学習による個別評価の限界があった。本研究は、音の系列に含まれる大域的な規則性への「期待」を読み取ることで、負担の小さい検出法を提案した。局所―大域パラダイムを改変し、正準相関分析・主成分分析・xDAWNによる特徴抽出を用いた3種の単一試行分類枠組みを開発し、単一試行の分類結果に基づく意識評価基準も定めた。<br><br>健常者での実験では、大域的規則性に関わる事象関連電位の主成分が新手法でも保たれ、従来の局所―大域パラダイムと比べて大域効果の単一試行分類性能が最大15%向上した。改善の要因は、大域効果に対するEEG応答の差の拡大と、試行間の神経状態の安定化だった。20人のDOC患者コホートでは、提案した評価基準が診断のバランス精度68.8%（感度50%、特異度87.5%）、予後のバランス精度60.5%（感度50%、特異度71%）を達成した。<br><br>音系列への期待の解読により、患者に課題を課さず個別に診断・予後を評価できることが示され、EEGによる意識評価の臨床応用が前進した。ただし感度は50%にとどまり、意識があっても検出できない患者が半数いる点が限界で、診断の補助として位置づけられる。出典：Crossref（Journal of Neural Engineering）","timestamp":1795392000000,"title":"Decoding sequence auditory expectations for clinical diagnostic and prognostic assessment of prolonged disorders of consciousness","titleJa":"音の並びへの期待を読み取る――遷延性意識障害の診断と予後を低負担で評価するEEG手法","url":"https://doi.org/10.1088/1741-2552/aebdcf"},{"authors":["Eamonn Eeles","Phillip Karpati","David Tran","Julian Ray"],"categories":[],"field":"Delirium","genre":"Consciousness / Philosophy","monthKey":"2026-11","publishedAt":"2026-11-23T00:00:00Z","source":"Crossref","summaryHtml":"意識はアクセス意識（A）と現象意識（P）の共同発現から生じるという、閾値ベースの身体化意識モデルが提案された。理論から導いた閾値を測定可能な行動の代理指標で操作化した。せん妄は、意識レベル（LoC）が保たれたままAとPが同時に乱れる「二要因の失敗」として現れ、LoCを失う昏睡や、A・Pいずれか一方だけの乱れとは区別される。<br><br>モデルは、AまたはPのいずれかが閾値下にあるだけでせん妄への脆弱性が高まると予測する。A・Pの相互作用が身体化された意識をどう生み出すかについて整合的な機序の説明を与え、臨床状態の乱れを統一的に解釈する枠組みになる。閾値下のA・Pをせん妄の前駆マーカーとみなすことで、より早期の検出や診断の区別が可能になる。<br><br>せん妄を注意や全般的認知の障害としてのみ捉えるのではなく、身体化された意識の状態レベルの乱れとして概念化し直す提案である。理論モデルであり、閾値の実証的な検証は今後の課題だが、意識の二側面を結びつける枠組みとして臨床と理論の双方に示唆がある。出典：Crossref（Delirium）","timestamp":1795392000000,"title":"Delirium and the subthreshold model of embodied consciousness","titleJa":"せん妄と身体化された意識の「閾値下モデル」――アクセス意識と現象意識の二重の乱れ","url":"https://doi.org/10.56392/001c.172534"},{"authors":["David M. Horton","Jacob S. Aday","John P. Donnelly","Kevin F. Boehnke","Christopher R. Nicholas"],"categories":[],"field":"Psychopharmacology","genre":"Psychedelics / Trauma","monthKey":"2026-11","publishedAt":"2026-11-23T00:00:00Z","source":"Crossref","summaryHtml":"サイケデリクス支援療法は大うつ病やPTSDなどで有効性を示してきたが、実装に関する研究が乏しく、実臨床への移行が損なわれる恐れがある。有効性が示された介入でも、現場での運用を支える実装の工夫が欠かせない。本論文は、実装科学の枠組みと手法を今後の第2〜4相臨床試験に取り入れる方法を示し、実臨床での運用に役立つ知見を得る道筋を提示した。<br><br>臨床効果の評価と実装データの収集を同時に行うハイブリッド第1型試験が、現在の実装研究の空白を埋められるとする。実装の枠組みと原則に基づき、従来型の二群間有効性試験と要因最適化試験という2種類のハイブリッド第1型試験の原型を提案し、将来の臨床研究や初期実装研究に資するデータ収集と分析を促した。<br><br>臨床研究者が実装の概念・枠組み・手法を取り入れる出発点となる提案で、効果の評価と実装の評価を統合した試験設計により、多様な臨床現場でのサイケデリクス介入の体系的な評価を支える。正式な実装研究の時期と強さは、介入の成熟度と各段階で答えられる問いに合わせるべきだとしている。出典：Crossref（Psychopharmacology）","timestamp":1795392000000,"title":"Integrating implementation science in psychedelic-assisted therapy research: translational research methods and design considerations","titleJa":"サイケデリクス支援療法に実装科学を組み込む――臨床試験の設計と実臨床への橋渡し","url":"https://doi.org/10.1007/s00213-026-07217-2"},{"authors":["Attila Hangai","Dániel Attila Kovács"],"categories":[],"field":"Elenchos","genre":"Consciousness / Philosophy","monthKey":"2026-11","publishedAt":"2026-11-23T00:00:00Z","source":"Crossref","summaryHtml":"プロティノスは『エンネアデス』第4論集3章31節で、表象（ファンタシア）の力が二つあり、それぞれ高次の魂と低次の魂に属すると説いた。本論文はこのテーゼを、プロティノスの二つの魂の心理学と記憶論の帰結として位置づけ、従来の解釈――説明不能な問題を解くために導入されたとする見方と、一つの表象力に二つの側面があるとする見方――と批判的に向き合う。<br><br>このテーゼは、分裂した心理学と意識の統一のあいだの深い緊張を露わにする。動機の葛藤の場面では、対立する動機が異なる形而上学的主体に属するにもかかわらず、私たちの意識経験は統一されたままである。論文は、この枠組みのなかで葛藤の事例を分析することで、プロティノスが二つの異なる意識中心の協働に基づく意識の統一の独自の説明を展開したことを示す。<br><br>論文の結論として、プロティノスは意識の統一を、意思決定の最終的な座としての高次の魂の役割が与える行為主体性の統一に基礎づけることを示唆したという。古代の魂論が現代の意識の統一問題に直接つながる論点であることが示された。出典：Crossref","timestamp":1795392000000,"title":"Plotinus’ Two Powers for Representation and the Unity of Consciousness","titleJa":"プロティノスの表象の二つの力と意識の統一――動機の葛藤における一つの経験","url":"https://doi.org/10.1515/elen-2026-0015"},{"authors":["Amanda L. Elmore","Kris Dalebout","Amber Hernandez","Anusha Parajuli","Benjamin R. Cummins","P. Mimi Bhatt","Danielle F. Haley"],"categories":[],"field":"Frontiers in Public Health","genre":"Psychedelics / Trauma","monthKey":"2026-11","publishedAt":"2026-11-23T00:00:00Z","source":"Crossref","summaryHtml":"女性は精神疾患や物質使用障害の負担が大きいにもかかわらず、サイケデリクス支援療法の研究では過小にしか扱われてこなかった。登録試験の多くは初期段階にとどまり、生物学的・ホルモン的な性差が治療反応や安全性に影響しうるにもかかわらず、性別で結果を報告する試験は少ない。本展望論文は、連邦・州の政策がサイケデリクスへのアクセスを急速に変えつつある米国に焦点を当てる。<br><br>著者らは女性に特化した査読論文と米国の規制・政策文書のナラティブレビューをもとに、社会生態学的モデルとトランスレーショナル・リサーチ・コンティニュアムを適用し、女性の排除がなぜ続き、証拠のパイプラインがどこで途切れるかを検討した。その結果、規制の枠組みや臨床ガイドラインが性別・ジェンダー別の分析と報告を欠いていることが示された。<br><br>論文は、疫学や実装科学、サーベイランスなどの公衆衛生の手法がこの隔たりの解消に役立つとし、研究者にはSAGER報告ガイドラインの採用と生殖関連変数の記録、資金提供者には重点的な資源配分、規制当局には性別共変量の事前指定と性別別報告の義務づけを求める。投与プロトコルや選定基準が成文化されるいま、公平性を組み込む機会は狭まりつつあると結論づけた。出典：Crossref","timestamp":1795392000000,"title":"Advancing women-centered psychedelic research in the United States: a translational public health agenda","titleJa":"女性中心のサイケデリクス研究を前へ――米国の公衆衛生アジェンダ","url":"https://doi.org/10.3389/fpubh.2026.1955149"},{"authors":["Jodie Louise Russell","Lucienne Spencer","Matthew Broome"],"categories":[],"field":"OSF Preprints","genre":"Consciousness / Philosophy","monthKey":"2026-11","publishedAt":"2026-11-23T00:00:00Z","source":"OSF Preprints","summaryHtml":"現象学的精神病理学では、障害の経験を当事者の視点から捉えることが中心にある。だが研究者の特権的な立場や「部外者」であることが壁になり、当事者の生きた経験を正確に取り込むのは難しい。本論文は、研究者がその特権と部外者の立場をどう乗り越え、障害の経験の構造をより正確かつ倫理的に把握できるかを論じた。まず第1節で、当事者の生きた経験を取り入れる際の問題とその課題を整理する。<br><br>続いて第2節で、フッサールとフィンクにおける現象学的な「遊び」の概念を導入する。第3節ではルゴーネスの議論を手がかりに、遊びの政治的・倫理的な側面を展開し、第4節で遊び心が健康研究にどう応用できるかを検討する。第5節では、遊びが現象学的精神病理学の方法論のなかでどう使えるかの具体例を示している。<br><br>遊びを媒介とすることで、研究者と当事者の双方が安全で包摂的な相互作用のなかで理解を深められる、というのが本論文の提案である。立場の違いを消すのではなく、遊びのなかで対話可能な関係を作る点に意義がある。研究者のあり方そのものを問い直す試みでもある。出典：OSF Preprints","timestamp":1795392000000,"title":"The State of Play: Methodological Reflections on Phenomenological Psychopathology","titleJa":"「遊び」の方法論――現象学的精神病理学における当事者の経験を捉え直す","url":"https://osf.io/preprints/psyarxiv/h5kwj_v2/"},{"authors":["Anna Ciaunica","Earl K. Miller","Shir Atzil","Antonio Criscuolo"],"categories":[],"field":"OSF Preprints","genre":"Neuroscience","monthKey":"2026-11","publishedAt":"2026-11-23T00:00:00Z","source":"OSF Preprints","summaryHtml":"人間の胚は、心拍・呼吸・運動・音声・概日リズムに構造化された母体の脈動的な環境のなかで育つ。本論文は発生学、胎児生理学、発達認知神経科学、時間生物学の知見を統合し、胎児の心臓と胎盤が母体の血行動態に促されて共発達すること、母体のリズムが胎児に届いてその生理を調節しうることを概観した。<br><br>多様な半周期的な入力が、初期のタイミング能力や自律的な自己調節の時間的な参照枠になるというのが本論文の提案である。共調節は内受容感覚やアロスタシスの基盤になるという見方も示された。さらに母胎・母子の二者関係を、概日周期から神経振動まで約7桁の周波数範囲にわたる多尺度の結合振動子系として定式化した。<br><br>健康な共調節の特徴は準安定性――柔軟で一時的な協調であり、各系が自らの傾向を保ちながら適応的に結びつく状態だとする。この枠組みは、二者間の協調ダイナミクスと発達的帰結の関連について検証可能な予測を生む。胎児期の共調節のあり方が、その後の発達にどう結びつくかを問う研究への道筋を示した。「私たちは文字通り、リズムに生まれてくる」。出典：OSF Preprints","timestamp":1795392000000,"title":"Born on Rhythms: Mother–Foetus and -Infant Neurophysiology as a Dynamic System of Metastable Coupled Oscillators","titleJa":"リズムに生まれる――母胎・母子の神経生理学を準安定な結合振動子系として捉える","url":"https://osf.io/preprints/psyarxiv/7abfn_v1/"},{"authors":["Fuqiang Wang","Yaojiang Li","Yunhong Deng","Song Tang","Lixia Deng","Jian Li","Hanbo Chen","Xiao Lu"],"categories":[],"field":"Frontiers in Nutrition","genre":"Consciousness / Philosophy","monthKey":"2026-11","publishedAt":"2026-11-23T00:00:00Z","source":"Crossref","summaryHtml":"意識障害（DoC）の患者は栄養リスクや嚥下障害を抱えやすく、持続的な栄養サポートを要することが多い。血清アルブミンと末梢血リンパ球数から算出される予後栄養指数（PNI）は、全身の栄養・炎症・免疫状態を反映する指標だが、意識転帰との関連は不明だった。本研究は中国・広東三九脳科医院のDoC専門データベースから、2022年1月から2026年7月に入院した2,928例を対象に、入院時PNIと退院時グラスゴー・コーマ・スケール（GCS）スコアの関連を調べた。<br><br>未調整モデルではPNIが10単位上がるごとに退院時GCSが0.794点高かったが、入院時GCSで調整すると関連は大幅に弱まり（β=0.108）、併存疾患や発症から入院までの期間も加味した完全調整モデルでも小さな正の関連が残るのみだった（β=0.099）。PNIと入院中のGCS変化量には有意な関連はなく、非線形性も認められなかった。<br><br>入院時PNIは退院時の意識レベルとわずかに正に関連したが、入院時の意識の重症度を考慮すると説明力はごく小さい。PNIが意識転帰を予測する臨床的な意義は依然不確かであり、縦断的な栄養指標と標準化された意識評価によるさらなる研究が必要だと結論づけられた。出典：Crossref","timestamp":1795392000000,"title":"Association between prognostic nutritional index and consciousness outcomes in patients with disorders of consciousness: a retrospective cohort study","titleJa":"予後栄養指数と意識障害患者の意識転帰の関連――後ろ向きコホート研究","url":"https://doi.org/10.3389/fnut.2026.1984646"},{"authors":["Christoph Adami"],"categories":[],"field":"Crossref","genre":"Consciousness / Philosophy","monthKey":"2026-11","publishedAt":"2026-11-23T00:00:00Z","source":"Crossref","summaryHtml":"機械は感覚（sentience）をもてるのか。周囲を感じ、意識をもつことは可能なのか。ファインマンの「作れないものは理解できない」という言葉を引き、クリストフ・アダミは人工知能への一つの道筋を示す。ダーウィンの進化の過程を用いて人工の脳を作り、移動ロボットに搭載することで、身体をもった感覚的な機械の実現を目指すという構想である。汎用知能への到達という大きな目標に向けた、進化による人工脳という一つの可能な経路を論じる連載の一編である。<br><br>本稿はその連載の一編で、進化によって生まれた人工脳をロボットプラットフォームに接合し、完全に身体化された感覚的な機械へ至る道を論じる。感覚の実現可能性だけでなく、そうした試みに伴う危険や、それに着手すること自体の倫理的な是非も問いとして掲げている。<br><br>意識をもつ機械という問いを、進化と身体化という具体的な工学の道筋に落とし込む点が特徴である。生命の進化が知能を生んだ過程を人工的にたどることで、感覚をもつ機械の実現可能性を問う。人工生命と人工知能の接点から、汎用知能への代替的な経路を提示する論考といえる。出典：Crossref","timestamp":1795392000000,"title":"The Path From Artificial Life to Artificial Intelligence","titleJa":"人工生命から人工知能への道――機械は感覚をもてるのか","url":"https://doi.org/10.1162/artl.a.503"},{"authors":["Sunbowen Li","Dandan Song","Shengkun Ma","Xuanning Cao"],"categories":["cs.CL"],"field":"arXiv","genre":"LLM / NLP","monthKey":"2026-11","publishedAt":"2026-11-23T00:00:00Z","source":"arXiv","summaryHtml":"大規模言語モデルのポストトレーニングでは、異なる教師やアルゴリズム由来の多様な推論軌跡を混ぜて学習させることが常態化している。しかし、明示的なモード条件づけなしに、標準的な教師ありファインチューニング（SFT）がそうした異種の推論方略を学べるのかは明らかでなかった。本研究は混合の定式化と統制実験で、異種推論の学習可能性と局所的なボトルネックを調べた。<br><br>理論面では、最適な自己回帰モデルが潜在的な推論混合と表現上両立する条件を定式化した。幅優先探索と深さ優先探索の軌跡を対にした検証可能な記号グラフ探索環境では、トークン量を揃えた場合、ラベルなし混合SFTは均質・ラベル付きのベースラインに一貫して劣らなかった。0.6B〜14Bのモデルとデータ量のスケーリングにより大域的なモード混同はほぼ解消され、ボトルネックは局所的な状態追跡の遷移へ移った。<br><br>局所的な誤りが最終結果を左右するのは後続の推論がそのステップに依存する場合に限られ、結果を決定づける「重要な推論ノード」はごく一部だった。そうしたノードでの一段階の修正は、モデルに十分な下流の遂行能力があれば失敗した軌跡を救済した。記号探索と自然言語ベンチマークの双方で確認された。出典：arXiv","timestamp":1795392000000,"title":"Learning Heterogeneous Reasoning in Large Language Models: From Mode Compatibility to Local Bottlenecks","titleJa":"大規模言語モデルにおける異種推論の学習――モード適合性と局所的ボトルネック","url":"https://arxiv.org/abs/2611.30281v1"},{"authors":["Yuxuan Chen","Changwei Lv","Yunfei Li","Zhongjing Du","Kehui Tan","Zijun Liao","Ruochong Zheng","Hao Chen","Can Deng","Zheni Zeng","Chang Liu","Jie Chen"],"categories":["cs.AI"],"field":"arXiv","genre":"Agents / Robotics","monthKey":"2026-11","publishedAt":"2026-11-23T00:00:00Z","source":"arXiv","summaryHtml":"AIエージェントはユーザーとの長期的なやり取りのなかで会話・画像・文書を蓄積するが、後から質問に答えるには記録をまたいだ証拠の結びつけが必要で、得られた理解は保持されず、関連する質問で同じ誤りを繰り返す。既存のマルチモーダル記憶は記録の保存と検索が中心で、完了したタスクから学び経験を統合する仕組みは乏しかった。<br><br>そこで提案されたMMMemは、完了したタスクから経験を抽出・統合するタスク対応型マルチモーダル記憶の枠組みである。出典に紐づいた多視点記憶、出典から生成したタスクによる知識の整合（外部記憶へのウォームアップとモデル自体の自己学習）、同一の視覚言語モデルによるタスクの経験への蒸留、タスク対応検索と再利用による長期保持という4つの補完的な戦略からなる。<br><br>3つの記憶ベンチマークと2つの視覚言語リーダーで8つのベースラインを上回り、Qwen3.5-9BではLoCoMo、Mem-Gallery、LooGLE v2で最良ベースライン比36.9%、17.6%、15.2%の相対的改善を達成した。訓練と記憶ウォームアップの双方が一貫して寄与することがアブレーションで示された。出典：arXiv","timestamp":1795392000000,"title":"MMMem: Self-Improving Agents with Task-Aware Multimodal Experience Consolidation","titleJa":"MMMem――タスク対応マルチモーダル記憶で自己改善するエージェント","url":"https://arxiv.org/abs/2611.30287v1"},{"authors":["Daniel Theron"],"categories":["cs.AI"],"field":"arXiv","genre":"LLM / NLP","monthKey":"2026-11","publishedAt":"2026-11-23T00:00:00Z","source":"arXiv","summaryHtml":"段階的に数値的な自信を言葉にさせるプロンプトは、エージェント推論のバックトラックや誤り訂正を促す手法として広がっている。しかしこの手法は、モデルが自分の誤りをその場で検出できることと、不確実性の合図が実際に修正を促すことの二つを前提としている。本研究は4つのオープンウェイトモデル（Qwen2.5-7B、Llama-3.1-8B、Mistral-7B、Phi-4）を対象に、数学ベンチマーク15,200試行から2,017件の推論誤りを抽出し、27,568件の反事実的継続で検証した。<br><br>結果は、自己モニタリングと制御の乖離を示した。モデルは自分の誤りを検出できず、誤ったステップと言語化された自信に区別はつかず、AUROCは0.500〜0.561とほぼチャンス水準だった。最初の誤りの時点でも自信は95.1〜99.9%に飽和していた。一方、外部から低信頼度タグ（10%）を注入すると、下流の修正は全モデルで有意に増えた（＋3.7〜22.5ポイント、最大38.5%）。<br><br>ただし、正しいステップに疑いを注入すると有効な推論を捨ててしまい、正答率は最大22.8ポイント低下した。推論時の自己訂正のボトルネックは修正能力ではなく、その場での誤り検出にある。出典：arXiv","timestamp":1795392000000,"title":"Language Models Steer on Injected Uncertainty Tokens, but Fail to Self-Monitor In Situ","titleJa":"言語モデルは「自信がない」と言われれば修正できるが、自分では気づけない","url"
