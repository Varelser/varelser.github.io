  <script>
    const DATA = {"articles":[{"authors":["J. Niediek","T. P. Reber","M. Bausch","F. Schwimmbeck","H. Gast","V. A. Coenen","J. Boström","C. E. Elger","F. Mormann"],"categories":[],"field":"Nature Communications","genre":"Neuroscience","monthKey":"2026-11","publishedAt":"2026-11-22T00:00:00Z","source":"Nature Communications","summaryHtml":"日常の経験はどのように記憶として蓄積されるのか。人の側頭葉には特定の人物や物事の概念に反応する「概念ニューロン」があり、エピソード記憶の意味的な構成要素になると考えられてきた。げっ歯類の場所細胞では、再活性化が既存の発火順序に従うことが知られているが、人の概念ニューロンではどうかは分かっていなかった。本研究は、概念を学んだ後の睡眠中にこれらのニューロンが再活性化するかを調べた。<br><br>神経外科の患者で1415個のニューロンを記録し、特定の概念を含む物語を学習させた後、徐波睡眠中の活動を観測した。記録は学習・想起・睡眠の各段階で行われた。概念ニューロンは睡眠中に再活性化し、特にシャープウェーブ・リップル中に同時に再活性化して、シナプス可塑性に適した時間差を示した。<br><br>しかし再活性化の時間的順序は、学習した物語の概念の順序を反映しなかった。人の概念ニューロンは学習開始前から特定の意味内容に同調しており、既存の発火順序はげっ歯類では連続する場所受容野と相関するが、人の経験における出来事の順序とは相関しない。人の概念細胞は内容を符号化するが、出来事の順序は符号化しないことが示された。出典：Nature Communications","timestamp":1795305600000,"title":"Episodic memory consolidation by reactivation of human concept neurons during sleep reflects contents, not sequence of events","titleJa":"睡眠中の概念ニューロンの再活性化が支えるエピソード記憶の固定――内容は再現されるが順序は再現されない","url":"https://www.nature.com/articles/s41467-026-79544-z"},{"authors":["Jinxi Pan","Bodi Liu","Zeyu Wang","Guangyuan Chen","Chengyao Wang","Ying Chen","Huan Jia","Zhaoyan Wang","Chi Ren","Zhengtuo Zhao","Hao Wu"],"categories":[],"field":"Nature Communications","genre":"Neuroscience","monthKey":"2026-11","publishedAt":"2026-11-22T00:00:00Z","source":"Nature Communications","summaryHtml":"聴性脳幹インプラント（ABI）は蝸牛神経核（CN）を対象とし、人工内耳が使えない患者の聴覚を回復できる。しかし従来の表面電極アレイは空間分解能が低く、周波数部位（トノトピー）への到達が限られるため、効果は不良から中等度までばらついた。本研究は、高密度で超柔軟な穿通型神経電極アレイ（uFINE）によるABIを開発した。<br><br>正常聴力のラットで、uFINEはCNと下丘（IC）の0.5〜32kHzにわたる周波数同調を描き出した。CNを選択的に刺激すると、音によるトノトピーに近いIC応答が得られ、同調幅も音刺激の場合と同程度で、136日以上にわたり安定し、グリオーシスも最小限だった。CNとICの連日の逐次微小刺激により、CN刺激で誘発されるIC応答のピークは目標部位へ徐々に移動し、使用依存的可塑性と一致した。<br><br>uFINEは広い周波数範囲で高分解能かつトノトピーに精密で、長期安定したCN刺激を組織損傷を最小限に実現できることが示された。ABIによる聴覚回復の向上につながる可能性がある。出典：Nature Communications","timestamp":1795305600000,"title":"Chronically stable, frequency-selective auditory brainstem stimulation via ultra-flexible penetrating electrode arrays","titleJa":"慢性期も安定した周波数選択的な聴性脳幹刺激――超柔軟な穿通型電極アレイによる聴覚回復","url":"https://www.nature.com/articles/s41467-026-79747-4"},{"authors":["Sushmita Kumari","Atish Prashar","Anand Kumar"],"categories":[],"field":"Journal of Advances in Developmental Research","genre":"Ethics / Safety","monthKey":"2026-11","publishedAt":"2026-11-22T00:00:00Z","source":"Crossref","summaryHtml":"インドのデジタル公共圏は、モバイル中心の通信、プラットフォーム経由のニュース消費、地域言語コンテンツの拡大によって形作られている。AIは機械翻訳、音声認識、音声合成、自動字幕、生成コンテンツによって参加を広げる可能性がある一方で、誤情報の生成・翻訳・個人化・流通の新たな経路も生む。多言語社会では言語変種、方言、文字、コードスイッチング、地域の政治的文脈、デジタルリテラシーの格差が情報の生成と解釈に影響する。<br><br>本稿は概念論文として、公共圏論、ネットワーク化されたゲートキーピング、情報障害、プラットフォーム化、社会技術システムの理論を引き、AIによるコンテンツ生成、言語・文脈の脆弱性、プラットフォームの拡散機構、受け手の解釈、検証能力を結ぶ枠組みを提示する。六つの相互関連する次元――多言語AI能力、地方言語コンテンツの生態系、プラットフォーム増幅、社会文化的感受性、検証・メディアリテラシー能力、制度的ガバナンス――を特定する。<br><br>脆弱性は地域言語での意思疎通そのものや生成AIの存在だけから生じるのではない。言語資源の不平等、不透明な推薦システム、閉じた・半ば閉じたネットワークでの急速な流通、文脈の操作、来歴シグナルの弱さ、信頼できる検証へのアクセス格差の相互作用から生じる。同じ技術が地域言語のファクトチェックや書き起こし、翻訳、公共的コミュニケーションを強化しうる点も強調する。概念研究のため、言語・地域・プラットフォーム・政治的文脈を超えた実証的検証が必要だとする。出典：Crossref","timestamp":1795305600000,"title":"The Regional Language Challenge: Artificial Intelligence, Disinformation and the Vulnerability of India's Vernacular Digital Public Sphere","titleJa":"地域言語の挑戦――AIと偽情報、インドの地方言語デジタル公共圏の脆弱性","url":"https://doi.org/10.71097/ijaidr.v17.i2.2229"},{"authors":["Hicham Jakha"],"categories":[],"field":"Husserl Studies","genre":"Consciousness / Philosophy","monthKey":"2026-11","publishedAt":"2026-11-21T00:00:00Z","source":"Crossref","summaryHtml":"絵画はなぜ絵として見えるのか。フッサールは「イメージ意識」の働きで説明した。絵を見るとき、私たちは物理的な絵の具の表面を見ながら、同時にそこに描かれた対象を「見ている」。この二重の見え方をどう理解するかが問題となり、フッサールの弟子ブラウシュタインは師の説明に批判を向けた。本論文はその論争を掘り起こす。<br><br>論文はフッサールの『イデーンI』と『フッサール全集』第23巻を読み解き、想像（ファンタジー）の位置づけを検討する。背景には分析哲学のウォルハイム＝ウォルトン論争、すなわち絵画表象は知覚か想像かという二分法がある。著者は、想像に基づくブラウシュタインの批判はこの二分法のもとでは退けられると論じる。フッサールはウォルハイムと同様、基本的に知覚主義の立場だからだ。<br><br>一方、記号に基づく批判については『イデーンI』の範囲では正当だと認めつつ、第23巻ではフッサールが記号意識の問題をイメージ意識との関連で確かに考慮していたと結論づける。絵画をめぐる現象学の古典的議論を、現代の分析哲学の枠組みで再検証した研究である。出典：Crossref（Husserl Studies）","timestamp":1795219200000,"title":"Husserl and Blaustein on Image Consciousness, Phantasy, and Pictorial Representation","titleJa":"フッサールとブラウシュタインにおけるイメージ意識、想像、絵画的表象","url":"https://doi.org/10.1007/s10743-026-09393-7"},{"authors":["Purvish M. Parikh","Nitin Yashas","Pavan Raghav Reddy Kalluri","Prathyusha Eaga","Sandeep Batra","Suresh V. S. Attili"],"categories":[],"field":"Indian Journal of Medical Sciences","genre":"Ethics / Safety","monthKey":"2026-11","publishedAt":"2026-11-21T00:00:00Z","source":"Crossref","summaryHtml":"患者、臨床医、医療機関が医療情報を得たり要約・生成したりするのに大規模言語モデル（LLM）を使う場面が増えている。流暢な出力は情報へのアクセスを広げる一方、その限界を見えにくくする。本コンセンサス声明は、LLMが人間の健康を損なうおそれのある経路を、技術的・認知的・臨床的・社会的な機序から検討した。<br><br>挙げられたリスクは、捏造や不完全な情報、文脈に合わない助言、緊急事態の見逃し、安全でない薬や処置の案内、誘導的な質問への追従的な回答、過度の依存など多岐にわたる。メンタルヘルスの支援を求める脆弱な人は、肯定や依存を促す応答の影響を受けやすい。個人のやり取りを超えて、健康に関する誤情報の増幅、証拠検索システムの汚染、不平等の再生産、機密性の高い健康データの露出、科学的誠実さの毀損も指摘された。症例報告や最近の訴訟は深刻さを示すが、害の発生頻度や因果関係を証明するものではない。<br><br>リスク低減には患者、臨床医、開発者、医療制度、規制当局の補完的な行動が必要だとされる。LLMは自律した臨床医ではなく誤りうるコミュニケーションツールとして扱い、重要度の高い出力は独立に検証し、個人を特定できるデータは適切に保護し、緊急性のある症状は通常の救急評価を受けるべきだという。現実的な患者会話による評価、持続的な人間の監督、導入後の透明なモニタリングが、医療LLMの利益を回避可能な害なしに実現するために不可欠だと結論づけている。出典：Crossref（Indian Journal of Medical Sciences）","timestamp":1795219200000,"title":"Artificial intelligence large language models and the threat to human health – A consensus statement by AAIO","titleJa":"人工知能の大規模言語モデルと人間の健康への脅威――AAIOによるコンセンサス声明","url":"https://doi.org/10.25259/ijms_202_2026"},{"authors":["Junsung Byeon","Onesik Harm","Jinhyeok Pyo","Sohyeon Park","Byeongchan Kim","Eunhee Cho","Jungmoon Lim","Taehun Kim","Byeongseong Yoo","Seokjin Oh","Chaewon Song","Hyungchang Jeong","Kyung-Ho Park","Sangyeon Pak","SeungNam Cha"],"categories":[],"field":"Nature Communications","genre":"Neuroscience","monthKey":"2026-11","publishedAt":"2026-11-21T00:00:00Z","source":"Nature Communications","summaryHtml":"二次元半導体の電子バンド構造を変える手法として局所ひずみ工学が注目されてきたが、電荷の動きを精密に制御する拡張可能な手段としては未開拓だった。本研究は単層MoS2に周期的な一次元の一軸ひずみをウェハスケールで加える手法を導入した。線状にパターン化したHfO2基板へMoS2を転写することで、決定論的に周期的な一次元ポテンシャル井戸を生成できる。<br><br>ポテンシャル井戸の向きとキャリア輸送の方向の組み合わせにより、単一の材料プラットフォームに二つの機能が生まれた。井戸に垂直な輸送では電荷トラップが制御され、マルチビットのシナプスメモリデバイスとなり、井戸に平行な輸送では格子散乱と有効質量が低減し、トラップのないキャリア伝導による高移動度トランジスタとなった。系統的な輸送解析により、局所一軸ひずみが電荷トラップ密度、格子散乱、有効質量を変調し、方向依存の電荷輸送を生む仕組みが明らかになった。<br><br>局所一次元ひずみは、高性能で拡張可能な多機能二次元エレクトロニクスの有効な設計パラメータであることが示された。シナプスメモリと高移動度トランジスタという脳型計算と高速エレクトロニクスの両方に通じる機能を、同一材料で方向によって切り替えられる点が意義である。出典：Nature Communications","timestamp":1795219200000,"title":"Localized strain-engineered 1D electron guides in 2D MoS2 devices with synaptic memory and high-mobility transistor functionalities","titleJa":"局所ひずみで作る一次元電子ガイド――単層MoS2デバイスのシナプスメモリと高移動度トランジスタ","url":"https://www.nature.com/articles/s41467-026-79577-4"},{"authors":["Chris Soria"],"categories":[],"field":"OSF Preprints","genre":"LLM / NLP","monthKey":"2026-11","publishedAt":"2026-11-21T00:00:00Z","source":"OSF Preprints","summaryHtml":"専門家レベルの推論ベンチマークでは最上位モデルが小規模モデルを大きく上回るが、自由記述式の調査回答のコーディングは一見単純でも独自の難しさがある。本ノートは、Humanity's Last Exam（HLE）で最高得点のモデルが人間のコーダーと最もよく一致するのか、オープンウェイトモデルがクローズドウェイトモデルに匹敵するのかを問う。6社の18モデル（半数がオープンウェイト）が、ベイエリアのパネル調査の自由記述3問をゼロショットでコーディングし、訓練を受けた2人のコーダーの一致と比較した。<br><br>HLEの得点は、コーダーとの一致を安定的には予測しなかった。引っ越し理由のような単純な設問ではほぼ無関係で、家族への信頼のような解釈を要する設問では高得点ほど一致が近かった。すべてのモデルは、回答者の主観を要するカテゴリで人間からずれやすく、具体的なカテゴリよりずれが大きかった。高得点モデルはコーダーが付けたコードをより多く拾い、精度を落とさなかった。<br><br>価格についても同じ傾向で、最も高価なモデルははるかに安いモデル以上にコーダーと一致しなかった。家族支援の設問では、オープンウェイトモデルの多くはクローズドモデルが満たす水準に届かなかったが、HLE最高得点モデルはどの設問でも最良のオープンウェイトモデル以上に一致しなかった。性能と再現性のトレードオフは、この種のコーディングではいまや小さい可能性が示唆された。出典：OSF Preprints","timestamp":1795219200000,"title":"The Frontier Premium Is Narrow: Benchmark Capability, Price, and Open Weights in LLM Coding of Open-Ended Survey Responses","titleJa":"「フロンティア・プレミアムは小さい」――自由記述式調査回答のLLMコーディングにおけるベンチマーク能力・価格・オープンウェイト","url":"https://osf.io/preprints/socarxiv/5g34x_v2/"},{"authors":["Zouhair Chiban"],"categories":[],"field":"International Journal of Modern Science and Research Technology","genre":"Ethics / Safety","monthKey":"2026-11","publishedAt":"2026-11-21T00:00:00Z","source":"Crossref","summaryHtml":"AIを導く倫理原則については広く合意があるのに、規範的な目標と技術実装の現実のあいだには大きな隔たりがある。本研究は、私法上の責任と継続的な技術検証をレンズに、積極的で反復的なAIガバナンスの枠組みをどう運用するかを探る。出発点は「コンプライアンス・シアター」と「倫理のつまみ食い」という、現場で繰り返される2つの欠陥である。<br><br>手法は多層的で、国際的な規制枠組みの比較評価と、銀行・データプライバシー・環境法の監査手続きを横断的に類型化した地図作りを組み合わせる。結果として、企業の倫理的コミットメントは運用上の監査システムから切り離されたままで、データサイエンティストは抽象的すぎて行動に移せない指針に不満を抱えていることが明らかになった。既存のESG基準にも、グローバルなサプライチェーンに埋め込まれた社会技術的な害を数量化するAI専用の手段がない。<br><br>本論文は、任意のソフトローから強制力のある縦断的な規制枠組みへの移行を提唱する。企業ガバナンスの枠組みに自動監査パイプライン、価値基盤のエンジニアリング（倫理バイデザイン）、独立した第三者の監督を統合し、抽象的な倫理概念を検証可能な私法上の義務へ変換することを提案している。出典：Crossref（International Journal of Modern Science and Research Technology）","timestamp":1795219200000,"title":"AI Governance, Ethics, and Responsible Innovation","titleJa":"AIガバナンス・倫理・責任あるイノベーション――原則と実装の隔たりを埋めるには","url":"https://doi.org/10.67317/ijmsrt26nov105"},{"authors":["Constance Beaumont","Karyn Doba","Christelle Duprez","Emmanuel Brunelle"],"categories":[],"field":"Psychopathology","genre":"Psychedelics / Trauma","monthKey":"2026-11","publishedAt":"2026-11-21T00:00:00Z","source":"Crossref","summaryHtml":"アルコール使用障害（AUD）の患者は、自己のアイデンティティ形成に中心的な役割を果たす自己定義記憶（SDM）の統合に困難を抱える。否定的な記憶は肯定的なものより統合されやすいが、AUD患者ではトラウマへの曝露の割合が高い。本研究は、AUD患者が対照群と比べてトラウマ関連のSDMを統合しにくいかを、統合の価（肯定的か否定的か）を考慮して調べた。<br><br>AUD患者62人と対照54人がそれぞれ5つのSDMを想起し、テーマ、統合、統合の価で分析した。幼少期と成人期のトラウマ曝露と感情調節方略は質問紙で評価した。患者は対照群と比べて、トラウマ関連のSDMを肯定的に統合することが少なく、否定的に統合することが多かった。部分最小二乗モデルでは、感情調節の困難さが肯定的統合の少なさと関連した。<br><br>トラウマ体験を自己像にどう位置づけるかは、その体験の解釈と感情調節のあり方に左右されることが示唆された。著者らは、感情調節の困難さが、トラウマ関連の記憶を前向きに自己像へ組み込むことを妨げている可能性を指摘し、断酒期間との関連についても検討している。出典：Crossref（Psychopathology）","timestamp":1795219200000,"title":"The role of emotion regulation and the valence of memory integration in trauma-related self-defining memories in individuals with alcohol use disorder","titleJa":"トラウマ関連の自己定義記憶と感情調節――アルコール使用障害における記憶の統合","url":"https://doi.org/10.1159/psp/aelag016"},{"authors":["Ephraim Y. Levin"],"categories":[],"field":"xsci","genre":"Consciousness / Philosophy","monthKey":"2026-11","publishedAt":"2026-11-21T00:00:00Z","source":"Crossref","summaryHtml":"質は通常、一次質と二次質に分けられる。物理学は客観的とされる一次質を扱い、より主観的な二次質は心理学に委ねられてきた。著者は、存在を判定するにはプラグマティックな方法を用いるべきだと提案する。その方法を当てはめると、刺激の情動的な程度は客観的に存在するという。<br><br>著者は、正統的な量子物理学の簡潔な解釈を振り返る。焦点が物質片の時間発展から量子状態の時間発展へ移ることで、エネルギーのない量子状態について語る余地が生まれる。エネルギー状態はヒルベルト空間で回転するが、エネルギーのない状態は測定されるまで静止したまま存在するという。刺激された心はそうした質の検出器として働き、心ごとに異なる応答は通常の検出器の応答と比較される。<br><br>経験的な裏づけとして、著者は2つの異例を論じる。閾下プライミング実験で見られた、心が結果の状態に気づくときに量子状態が収縮すると考えなければ理解しにくい現象と、著者が統計的に確立していると述べるプレゼンティメント（予感）効果である。先行する説明を検討したうえで、自身の主張と整合する近年の量子モデルを紹介し、この主張は妥当で説明力があり、現実のより包括的な記述につながりうると結論する。出典：Crossref（xsci）","timestamp":1795219200000,"title":"Quantum Physics, Consciousness and Observation – Bridging a Psycho-Physical Split","titleJa":"量子物理学、意識、観測――心身の分裂をつなぐ試み","url":"https://doi.org/10.66977/xsci.2611.003n"},{"authors":["Sahar Ghneim"],"categories":[],"field":"International Journal of Financial, Administrative, and Economic Sciences","genre":"Ethics / Safety","monthKey":"2026-11","publishedAt":"2026-11-21T00:00:00Z","source":"Crossref","summaryHtml":"本研究は、AIとアルゴリズムがもたらす損害の法的責任を、EUとアラブ首長国連邦（UAE）の比較で検討する。データと情報の利用・処理をめぐる法的枠組みを説明し、アルゴリズムの出力から生じうる害――プライバシー侵害、名誉毀損、誤情報の拡散、詐欺、なりすまし、個人データの違法な開示――を特定する。記述的・分析的・比較的手法を用い、関連法規を分析して両地域の法的保護、監督機構、罰則を比較する。<br><br>民事責任では責任の主要な要素と物的・非物的損害の賠償条件、行政責任では規制上の義務・監督・罰則、刑事責任では犯罪の構成要素と行為の自然人・法人への帰属を扱う。調査結果によれば、AIシステムの開発・運用・利用に複数の当事者が関わるため、責任は複雑になる。アルゴリズムの出力から害が生じたという事実だけでは責任は成立せず、違法行為、損害、因果関係、刑事責任に必要な故意の有無を確定しなければならない。<br><br>研究は、AIによる損害の責任をめぐる法令の更新、透明性と人間による監督の強化、デジタル証拠の保存と因果関係の立証の改善、開発者・提供者・利用者の義務の明確化、規制当局と司法当局の協力の強化を提言する。権利の保護と技術革新と法的説明責任の両立を目指すものだ。出典：Crossref","timestamp":1795219200000,"title":"Legal Liability for Harm Caused by Artificial Intelligence and Algorithms: A Comparative Study of Criminal, Civil, and Administrative Liability in the European Union and the United Arab Emirates","titleJa":"AIとアルゴリズムがもたらす損害の法的責任――EUとUAEの刑事・民事・行政責任の比較","url":"https://doi.org/10.59992/ijfaes.2026.v5n11p10"},{"authors":["Dominique Makowski","Marco Sperduti","Oliver Collins","Lucie Daudé","Joy Zogheib","Ewen Kervadec","Bruno Roméo","Pascale Piolino","Baptiste Fauvel"],"categories":[],"field":"PsyArXiv","genre":"Psychedelics / Trauma","monthKey":"2026-11","publishedAt":"2026-11-20T14:08:29Z","source":"OSF Preprints","summaryHtml":"古典的サイケデリクスは事前の期待（プライアー）を緩めると考えられ、錯視が弱まるはずだという仮説がある。しかし急性期以外での証拠は乏しく、錯視感度の通常の指標である誤答率は全体的な成績にも左右される。本研究は118人の成人を対象に、未使用者44人、過去30日以内に使用した39人、それ以前に使用した35人を比較した。<br><br>参加者はエビングハウス錯視、ミュラー＝リヤー錯視、垂直―水平錯視の強さを独立に変えながら二つの対象の大小を判断する「錯視ゲーム」を行い、選択と反応時間に階層的ドリフト拡散モデルを当てはめた。使用者群は未使用者より判断の閾値を広く設定し、証拠を多く集めてから回答し、誤答も少なかった。全体的な正答率から独立した錯視感度の指標は、使用者で平均22％低く、最近の使用者と過去の使用者で同程度だった。<br><br>この結果は「プライアーが緩む」という予測と整合するが、錯視感度は年齢、言語、学生か否か、心理的柔軟性、苦痛、最後の使用体験の強さとは無関係で、使用の新しさとの明確な関連もなかったため、解釈には慎重さが求められる。出典：OSF Preprints（PsyArXiv）","timestamp":1795183709000,"title":"Are psychedelic users less susceptible to visual illusions? Evidence from the Illusion Game","titleJa":"サイケデリクス使用者は錯視にかかりにくいのか――「錯視ゲーム」による検証","url":"https://doi.org/10.31234/osf.io/23zbg"},{"authors":["Rishika Verma"],"categories":[],"field":"International Journal of Philosophy, Ethics and Humanities","genre":"Consciousness / Philosophy","monthKey":"2026-11","publishedAt":"2026-11-20T00:00:00Z","source":"Crossref","summaryHtml":"本論文は、シャンカラ・ヴェーダーンタにおける意識（チャイタニヤ）の概念を検討する。意識はあらゆる経験を可能にする根本原理であり、無生物は知識の対象であるのに対し、意識は知る者だとされる。自己の本性について哲学者たちの見解は分かれるが、「私はある」という直接経験は疑い得ない。シャンカラにとって自己は自存し、意識はその本質である。<br><br>アドヴァイタ・ヴェーダーンタによれば、究極的に実在するのはブラフマンのみであり、世界の多様性や個我、神は経験的な秩序に属し、無知（アヴィディヤー）と限定付帯性（ウパーディ）によって説明される。本論文は、実在を知る方法、ブラフマンの本性、個我、意識の四つの状態、証人としての意識、イーシュヴァラについて論じる。<br><br>結論として、意識における多様性は見かけのものにすぎず、意識は究極的に一つであり、非二元であって、ブラフマンと同一だと主張される。意識の概念をめぐる古典インド哲学の立場を、分析的に整理した研究である。出典：Crossref（International Journal of Philosophy, Ethics and Humanities）","timestamp":1795132800000,"title":"THE CONCEPT OF CONSCIOUSNESS IN SHANKARA VEDANTA: An Analytical Study","titleJa":"シャンカラ・ヴェーダーンタにおける意識の概念――分析的研究","url":"https://doi.org/10.64823/ijpeh.2602004"},{"authors":["Rabie Adel El Arab","Wesam Taher Almagharbeh","Sameer A. Alkubati","Mudassir Imran Mustafa"],"categories":[],"field":"Frontiers in Artificial Intelligence","genre":"Ethics / Safety","monthKey":"2026-11","publishedAt":"2026-11-20T00:00:00Z","source":"Frontiers in Artificial Intelligence","summaryHtml":"臨床現場で自律的に行動を変えるエージェント型AIは、従来の性能指標では捉えきれない失敗経路を生む。安全策がそうした経路を本当に断ち切っているのかは不明だった。本研究は、臨床エージェント型AIと関連ワークフローにおける安全策の効果、残存する失敗、人の回復、資源への影響を地図化する系統的スコーピングレビューである。PubMedなど5つのデータベースから英語の査読付き実証報告111件を対象とした。<br><br>111件の内訳は、機能的にエージェント型が56件、非エージェント型が29件などで、エージェント型56件のうち38件はモデルが次の行動を自ら選択することを明記していた。111件の評価結果のうち、特定の安全策の効果を分離し、測定された患者への害の減少を示したものは一つもなかった。安全策を含む構成は一部の結果を改善したが、見落としや感度の低下、誤った安心感、遅延、確認負担の転嫁を伴うこともあった。臨床医の承認を求めても、残存する誤りが認識・修正されたことは示されなかった。<br><br>安全策は特定の誤りを減らしても、リスクを後の判断や人の確認作業へ移す場合がある。著者らは、臨床の安全を一つの場面だけでなくケア全体の経路で評価し、残存リスクと適時の人の確認能力をあわせて判断すべきだと結論づけている。提案する証拠プロファイルは検証を要し、研究デザインの不均一性が推論を制約する。出典：Frontiers in Artificial Intelligence","timestamp":1795132800000,"title":"Safeguards, residual failures, and human oversight in clinical agentic and related artificial intelligence workflows: a systematic scoping review","titleJa":"臨床エージェント型AIの安全策と残存する失敗、人の監視――系統的スコーピングレビュー","url":"https://www.frontiersin.org/articles/10.3389/frai.2026.1997557"},{"authors":["Thurston Lacalli"],"categories":[],"field":"Frontiers in Psychology","genre":"Consciousness / Philosophy","monthKey":"2026-11","publishedAt":"2026-11-20T00:00:00Z","source":"Frontiers in Psychology","summaryHtml":"機械意識は話題になることが多く、現在開発されている大規模言語モデル（LLM）が人間のように経験状態を生み出しそれに応じる意識を実現できるかは未解決である。LLMは設計されたものであるのに対し、生物の意識は進化の産物であるという決定的な違いがある。進化では複雑さは自然選択による多くの世代にわたる漸進的な変化で達成される。経験状態を生み出す能力も同様なら、他の手段で自発的に生じるという想定は疑わしい論理に依存している。<br><br>一方で機械意識という考えは、知識と意味の違い、そして知識がどう意味を獲得するかという二つの問題を提起する。進化を考慮すると、知識と、出来事の連なりや言語・テキストの連なりの結末を予測する能力との結びつきが明らかになる。LLMは後者を行うが、人間にとっての意味は、そうした連なりに現実世界のリスクや偶発性についての情報を符号化する意識的な価（ヴァレンス）が伴うことに依存する。<br><br>LLMにはその能力がないため、LLMにとっての知識は必然的に意味を欠く。著者は機械意識の自発的出現という想定を完全には否定しないものの、真剣な科学的検討に値するかを問う。知識と意味を区別する視点から、LLMの能力の限界を論じた理論論文である。出典：Frontiers in Psychology","timestamp":1795132800000,"title":"Knowledge versus meaning—an evolutionary perspective, and the deceptive allure of the idea of machine consciousness","titleJa":"知識と意味――進化の視点から見た機械意識という魅惑的な考え","url":"https://www.frontiersin.org/articles/10.3389/fpsyg.2026.1999890"},{"authors":["Matan Aharoni","Chen Sabag-Ben Porat","Shir Galor"],"categories":[],"field":"Online Information Review","genre":"Psychedelics / Trauma","monthKey":"2026-11","publishedAt":"2026-11-20T00:00:00Z","source":"Crossref","summaryHtml":"被害の存在自体が争われるコミュニティは、公式の場が閉ざされた中で、対立やメディアの劇化に頼らずに正統性と道徳的立場をどう築くか。本研究は「ソフトな抗議」という概念を提示する。個人的証言、集合的記憶、感情的コミュニティ、文化的アンカリングに根ざした戦略的なデジタル・レパートリーで、知識と承認の代替インフラを築く実践である。<br><br>方法は質的マルチメソッドで、アムラム協会のFacebookページ（2019〜2024年）のネットノグラフィー、100件の投稿のテーマ・視覚記号論分析、主要活動家6人へのインタビューを組み合わせた。対象はイスラエルにおけるイエメン人・ミズラヒ・バルカン人の子どもの事件をめぐる承認を求める市民運動である。<br><br>結果として、道徳的権威は5つの相互に結びついた戦略で構築された。制度過程の市民的アーカイブ化、顔と証言による可視性の政治、共有されたトラウマをめぐる感情的コミュニティの形成、デジタル参加から物理的市民参加への動員、宗教的・伝統的シンボルによる文化的アンカリングである。制度的アクセスを持たないコミュニティが集合的被害を政策影響力に変える枠組みとして、ソフトな抗議の概念を提示した。出典：Crossref","timestamp":1795132800000,"title":"Soft protest in online communities: trauma, memory, and civic legitimacy in the Yemenite children affair","titleJa":"オンライン・コミュニティにおけるソフトな抗議――イエメン人の子どもの事件をめぐるトラウマ・記憶・市民的正統性","url":"https://doi.org/10.1108/oir-04-2026-0360"},{"authors":["Narendra Bahadur Air"],"categories":[],"field":"Contemporary Research: An Interdisciplinary Academic Journal","genre":"Consciousness / Philosophy","monthKey":"2026-11","publishedAt":"2026-11-20T00:00:00Z","source":"Crossref","summaryHtml":"ネパール西部スドゥルパシュチム地方に伝わる民謡デウダーを、アルネ・ネスらが提唱した深層生態学の視点から読み解いた研究である。歌の中では土地や川、森、季節、そして非人間的な存在たちが、社会生活や感情、道徳の場における能動的な参加者として描かれ、自然は人間の背景ではなく親族として概念化されている。<br><br>研究は民族誌的フィールドワークに基づく。参与観察や歌手への聞き取り、フォーカスグループで集めた歌詞を、内在的価値、生物圏平等主義、生態学的自己といった深層生態学の概念に沿って質的に主題分析した。エコクリティシズムの手法も併用し、歌に込められた生態学的相互依存や非人間的生命の内在的価値、先住民の環境倫理を掘り起こした。<br><br>分析の結果、デウダーは人間中心主義を超えた世界観を体現し、関係性の倫理や生態学的アイデンティティ、帰属感を伝える深層生態学的意識の宝庫であることが示された。先住民の口承文学が持続可能性と共存の哲学をいかに表現するかを、環境人文学の枠組みで位置づけた研究である。出典：Crossref（Contemporary Research: An Interdisciplinary Academic Journal）","timestamp":1795132800000,"title":"Kinship in Nature: Deep Ecological Consciousness in Ḍeeuḍā","titleJa":"自然における親族関係――デウダー民謡に見る深層生態学的意識","url":"https://doi.org/10.3126/craiaj.v9i2.102369"},{"authors":["Zhenbo Wang"],"categories":[],"field":"SocArXiv","genre":"LLM / NLP","monthKey":"2026-11","publishedAt":"2026-11-20T00:00:00Z","source":"OSF Preprints","summaryHtml":"AIが研究仮説を生成できるという主張は、モデルが既に知り得ない「答え」に対して検証されることがほとんどない。公開論文を答え合わせに使う評価は、訓練カットオフ後の論文を用いても、新しいモデルが出るたびに保護が弱まる。本論文は、未公開の実証研究を答えの鍵として用いるプロトコルを提案する。鍵となる研究は著者によって封印され、生成前にハッシュだけがコミットされた。<br><br>プロトコルは、時期で区切った文献コーパス、凍結した事前登録、提案と既存知見の言い換えを分離する同一モデルの言い換えベースライン、群を伏せた採点、台本化された判定を組み合わせ、各段階を別々のコミットとして記録する。未公開の経済地理学の博士研究（5つの知見）で2回実行された。事前登録した1回目では、主要モデルは提案時も言い換え時も同点（5点中1.5点）で、知見を完全に再現した仮説はなかった。<br><br>原因の一端は、一文の仮説テンプレートと検索を変化させない安全策という、評価設計にありがちな二つの失敗にあった。両者を修正した探索的2回目では、提案が言い換えを上回った（出力あたり0.83対0.23）が、コーパスのカットオフ以前に訓練されたオープンウェイトモデルでは差が出ず、再現できた知見はやはり皆無だった。得られた向上は、モデルが後の文献や研究自体に触れていた可能性によるものかもしれず、能力の証拠とは読めない。失敗も含めてプロトコル自体の検証として報告された。出典：OSF Preprints（SocArXiv）","timestamp":1795132800000,"title":"Before the answer is published: testing AI hypothesis generation against a sealed study","titleJa":"答えが公開される前に――封印された研究でAIの仮説生成能力を検証する","url":"https://osf.io/preprints/socarxiv/7unk4_v1/"},{"authors":["Nicosia General Hospital"],"categories":[],"field":"ClinicalTrials.gov","genre":"Consciousness / Philosophy","monthKey":"2026-11","publishedAt":"2026-11-20T00:00:00Z","source":"ClinicalTrials.gov","summaryHtml":"重度脳損傷のあと意思疎通ができない患者のうち、誰が意識を取り戻すのかを早期に見極めることは神経集中治療の難問で、ベッドサイドの診察だけでは相当数が誤って分類される。植物状態の臨床基準を満たす患者の一部にも、指令に対する意志的な脳反応が残る認知的運動解離があり、最近の多施設研究では行動上無反応の患者の約4分の1にみられたと報告されている。<br><br>キプロス唯一の外傷紹介センターであるニコシア総合病院による単施設・前向き観察コホート研究である。登録対象は16歳以上で、中等度から重度の外傷性脳損傷または出血性脳卒中（脳内出血・くも膜下出血）ののち24時間以内に挿管され、Coma Recovery Scale-Revised（CRS-R）で植物状態／無反応性覚醒症候群または最小意識状態と分類された患者である。CRS-R、血清ニューロン特異的エノラーゼ、bispectral index（BIS）、外傷例のみの1.5T MRIという4つの軸で評価し、6〜12か月後のCRS-R総得点（0〜23点）を主要評価項目とする。<br><br>主解析は病棟で記録した最高BIS値とのSpearman順位相関である。単一施設では対象が30〜40名にとどまるため、予後予測モデルの開発は目指さず、効果量と信頼区間の推定により後の多施設研究の設計根拠とする。介入はなく純粋な観察研究で、現在募集中、予定登録数40名、完了予定2030年9月となっている。出典：ClinicalTrials.gov","timestamp":1795132800000,"title":"Multimodal Assessment and Prognosis in Disorders of Consciousness After Severe Brain Injury (CyDoC-MAP)","titleJa":"重度脳損傷後の意識障害――マルチモーダル評価と予後予測の前向きコホート研究","url":"https://clinicaltrials.gov/study/NCT07736820"},{"authors":["Vi Bui","Paul Silvia"],"categories":[],"field":"PsyArXiv","genre":"Consciousness / Philosophy","monthKey":"2026-11","publishedAt":"2026-11-20T00:00:00Z","source":"OSF Preprints","summaryHtml":"神秘体験や宗教体験、美的体験、畏敬、崇高――心理学ではさまざまな枠組みで研究されてきた深い体験がある。枠組みは違っても、それらに共通して現れるのが「ノエティックな質」である。非合理的でありながら真実で、自明で、直接的で、現実的だと感じられる何かを捉えたという主観的な感覚だ。独立した分離可能な現象である可能性を示唆するが、それ自体として研究されることはまれだった。体験は主観的に非常に強烈で個別性が高く、実験室で引き起こすことが難しく、回顧的な語りを質的に分析するコストも高いためである。<br><br>本研究では、ノエティックな質の体験についてナラティブ・エッセイを書いた318名を対象に、感情と動機づけの内容、主観的な認識論的変化について尋ね、エッセイを自然言語処理で分類した。誘因は美的体験、サイケデリック体験、宗教・神秘体験、死にまつわる体験に広がった。<br><br>体験の感情価は異質で、34%が否定的、66%が肯定的だった。誘因を問わず、体験は一貫して高い感情強度、行動傾向、主観的な認識論的変化を特徴とし、感情に似た構造を示した。誘因や感情価の違いを超えた共通構造が見いだされたことは、ノエティックな質を個別の体験の枠組みから切り離して扱える可能性を示し、まれで非日常的な体験の計算論的研究が実現可能であることも示した。出典：OSF Preprints","timestamp":1795132800000,"title":"Mapping the noetic quality: A computational analysis of the elicitors and experience of profound truth","titleJa":"「真実だと感じる」体験の地図――ノエティックな質の誘因と経験の計算論的分析","url":"https://osf.io/preprints/psyarxiv/cpvw5_v1/"},{"authors":["Yimy Amarillo"],"categories":[],"field":"PsyArXiv","genre":"Consciousness / Philosophy","monthKey":"2026-11","publishedAt":"2026-11-20T00:00:00Z","source":"OSF Preprints","summaryHtml":"意識の主要理論は神経基盤を大脳皮質の連合野に置くが、この収束は皮質回路の十分性が実証されたからではなく、皮質が技術的に調べやすいからにすぎない。本論文は、視床に意識内容の選択と維持の構成的な役割を与える視床皮質記憶モデル（TMMC）を提唱する。内容は視床網様核（TRN）における視床チャネル間の競合で選ばれ、顕著性・予測・価値・記憶的一貫性という四つの選択圧が働く。<br><br>視床背内側核（MD）は内容が到達した後に前頭前野の活動を持続させ、海馬はエピソード的な内生的内容を生成し、視床正中核は前頭前野への到達を調整し、扁桃体は競合に直接バイアスをかける。モデルは意識の水準L(t)と内容C(t)を部分的に分離可能な状態変数として区別し、外因性・内因性・自由という三つの動作モードの遷移を、複数の時間スケールで結合した視床皮質過程として記述する。<br><br>三つの反証可能な予測を導く。自発的思考では視床が前頭前野に先行すること、MD損傷後は維持された内容の喪失が加速すること、両眼視野闘争の知覚切替前に視床から皮質へのシータ帯域の流れが生じることである。皮質中心モデルへの機械論的な代替案と、検証可能な研究プログラムを提示する。出典：OSF Preprints（PsyArXiv）","timestamp":1795132800000,"title":"A thalamocortical mnemonic model of consciousness: thalamic selection of conscious content","titleJa":"意識の視床皮質記憶モデル：視床による意識内容の選択","url":"https://osf.io/preprints/psyarxiv/xheqg_v1/"},{"authors":["Feng Chen","Jianshan Cheng"],"categories":[],"field":"Frontiers in Psychology","genre":"Ethics / Safety","monthKey":"2026-11","publishedAt":"2026-11-20T00:00:00Z","source":"Frontiers in Psychology","summaryHtml":"生成AIは学術的な著者性の従来の境界を揺るがし、学生の心理的な所有感と説明責任を弱めるおそれがある。本研究は、中国の高校生586名を対象に、人間とAIの共著の曖昧さ（HAAA）、心理的所有感、責任の希薄化、生成AI関連の学術行動の関連を三波の縦断調査で調べた。保持率は91.3%で、個人内変動と個人間の安定差を分けるランダム切片交差遅延パネルモデルで分析した。<br><br>両区間を通じて、共著の曖昧さが大きいほど心理的所有感は低く（β=-0.283、-0.265）、責任の希薄化は大きかった（β=0.251、0.230）。心理的所有感の低下は責任の希薄化を予測し（β=-0.291、-0.275）、それが生成AI関連の学術行動の頻度を予測した（β=0.332、0.347、いずれもp<0.001）。二段階の間接効果も有意で、共著の曖昧さは心理的所有感と責任の希薄化を介して後の学術行動と結びついた。<br><br>著者性の明確さ、心理的所有感、個人の説明責任が生成AIを用いた学習で重要だと示す。因果関係の結論は慎重であるべきだが、学術的誠実さの教育では、AI支援の作業における学生自身の知的貢献と責任を強調すべきだと提言する。出典：Frontiers in Psychology","timestamp":1795132800000,"title":"When authorship blurs, responsibility dilutes: a three-wave longitudinal study of human–AI co-authorship ambiguity and self-reported GenAI-related academic behaviors among Chinese high school students","titleJa":"著者性が曖昧になると責任は希薄になる――人間とAIの共著をめぐる三波の縦断研究","url":"https://www.frontiersin.org/articles/10.3389/fpsyg.2026.1997778"},{"authors":["Huimei Gao","Feng Yang","Qiang Liu","Zhuo Wang","Zishu Meng"],"categories":[],"field":"Frontiers in Psychology","genre":"Ethics / Safety","monthKey":"2026-11","publishedAt":"2026-11-20T00:00:00Z","source":"Frontiers in Psychology","summaryHtml":"生成AIは学生のあいだで過去の教育技術よりも速く普及したが、過度な依存は、その懸念を抱かせる学習者自身のあいだでは十分に調べられてこなかった。本研究は、中国の高職の外国語専攻の学生249名を対象に、自己報告による過度な依存の予測要因を、順次説明的混合法で調べた。<br><br>量的分析では二つの傾向が示された。第一に、感情要因が支配的だった。見逃しへの恐れ（β=0.50）と擬人化的な愛着（β=0.27）が最も強い予測要因で、自己調整学習やAIリテラシーの自己評価だけでは過度な依存と関連しなかった。重要なのは両者の隔たりで、AIに詳しいと感じることと自分の学習を調整していると報告することのギャップが過度な依存を予測した（β=0.21）。<br><br>感情的な関与が低い学習者は過度な依存が最も少なかった。5名への面接では、人間らしい温かさが委任の心理的コストを下げ、仲間に規範化された遅れへの恐れが繰り返しの選択を通じて自分の基準を侵食し、能力の自覚は依存を抑えるよりむしろ可能にし、実行された自己調整だけがそれを断ち切る様子が示唆された。道具との感情的な関係が、能力の自己評価よりも過度な依存をよく追跡していた。出典：Frontiers in Psychology","timestamp":1795132800000,"title":"Too good to resist? Affective engagement and a competence–regulation gap predict self-reported over-reliance on generative AI among vocational foreign-language learners","titleJa":"抗いがたい魅力――生成AIへの過度な依存を予測する感情的関与と能力・調整の隔たり","url":"https://www.frontiersin.org/articles/10.3389/fpsyg.2026.1941348"},{"authors":["Sarfaraz K. Niazi","Mikołaj Stańczak"],"categories":[],"field":"AI and Ethics","genre":"Ethics / Safety","monthKey":"2026-11","publishedAt":"2026-11-20T00:00:00Z","source":"Crossref","summaryHtml":"人工知能はしばしば、従順な統計的道具か、知識や創造性、感情や意図を備え人間に並ぶ存在かのどちらかとして描かれる。しかし本論考によれば、どちらも観察できる性能だけから内的経験を推し量る点で根本的に誤っている。著者らはより厳密なモデルとして、AIを「現代の予言者（seer）」と捉える見方を提唱する。記録された人類の知識を、いかなる個人にも到達できない規模で圧縮・検索・再結合する複雑な仕組みであり、相談はされるが認定を受けていない認識上の権威だという。<br><br>予言者の能力は相互作用の手がかりを生み、手がかりは理解や感情、意図や権威の推測を誘う。だからガバナンスは「機械の心」への主張ではなく、手がかりと信頼の較正に働きかけるべきだとされる。統合は意識なしに新しい洞察を生み、感情的な言葉は本当の関心なしに安心を与え、価値に敏感な助言は道徳的行為者性なしに生まれる。著者らは誤解を10件挙げ、カテゴリー錯誤8件と事実誤認2件に分け、それぞれを生む手がかりに遡って整理する。<br><br>意識がないからといって安全なわけではない。経験を持たないシステムでも誤りを増幅し、偏見を固定し、権力を集中させ、重大な行為を担いうる。医薬品開発を例に、モデルが創薬過程の証拠を統合しても、生物学的検証と責任ある判断は不可欠だとする。米食品医薬品局や欧州医薬品庁などの規制機関はすでに文脈やリスク、信頼性や透明性を評価する枠組みを採用しているが、機械の意識に直接向き合うものではない。AIをどう試験し、信頼し、統治するかを変える提言である。出典：Crossref（AI and Ethics）","timestamp":1795132800000,"title":"Misconceptions of artificial intelligence: the modern seer as a synthesis of human knowledge without consciousness, emotion, or moral sill","titleJa":"人工知能の誤解――意識も感情も道徳的行為者性も持たない、人類の知識の総合としての現代の「予言者」","url":"https://doi.org/10.1007/s43681-026-01527-z"},{"authors":["Esra Arslan Kırcı","Mehmet Fatih Kırcı"],"categories":[],"field":"Trauma, Violence, & Abuse","genre":"Psychedelics / Trauma","monthKey":"2026-11","publishedAt":"2026-11-20T00:00:00Z","source":"Crossref","summaryHtml":"性的暴行や対人トラウマの被害者において、被害時に生じる不随意の反応である強直性不動（TI）と周外傷性解離（PTD）が、その後のPTSDとどう関連するかは、両者を同時に検討した系統的レビューがなかった。本研究はPRISMA 2020とSWiMの指針に従い、PubMedとGoogle Scholarを創刊から2026年4月まで系統的に検索し、ハンドサーチで補完した。成人被害者でTIまたはPTDを直接測定し、PTSD関連のアウトカムを報告した16研究（ベースライン計6,259人、解析対象6,150人）を対象とした。<br><br>17件のPTSD関連比較のうち14件（82.4%）で有意な正の関連が見られた。TIは13比較中10件（76.9%）で正の関連を示し、前向き研究ではオッズ比2.75（95%信頼区間1.50–5.03）だった。PTDを検討した4研究はすべて正の関連を報告したが、エビデンス基盤は限られる。標準化効果量は小さいもの（β≈.21）から大きいもの（β=.64）まで幅があり、大半は小〜中程度だった。<br><br>TIとPTDはいずれも対人トラウマ後のPTSDと正に関連し、被害直後の反応が早期の臨床リスク評価に役立つ可能性が示された。ただし日常的な実施には前向きな検証が必要で、地理的多様性の不足から文化的一般化可能性の確立も今後の課題だとされる。出典：Crossref（Trauma, Violence, &amp; Abuse）","timestamp":1795132800000,"title":"Tonic Immobility and Peritraumatic Dissociation as Risk Factors for Posttraumatic Stress Disorder: A Systematic Review and Narrative Synthesis","titleJa":"強直性不動と周外傷性解離はPTSDのリスク因子か：系統的レビューとナラティブ統合","url":"https://doi.org/10.1177/15248380261497735"},{"authors":["Longhui Zou","Michael Carl","Jia Feng"],"categories":[],"field":"Frontiers in Psychology","genre":"LLM / NLP","monthKey":"2026-11","publishedAt":"2026-11-20T00:00:00Z","source":"Frontiers in Psychology","summaryHtml":"大規模言語モデル（LLM）が生成した翻訳のポストエディットでは、熟練者は速さではなく課題の要求に応じた努力の調整で力を発揮するという。本研究は、課題要求に対する適応的な努力調整である「関連効率」の観点から、学生とプロの翻訳者のポストエディットを比較した。キー入力記録と混合効果モデルを用い、完全ポストエディットと軽度ポストエディットを、構造化された用語集設定と自由なインターネット検索設定で実施した。<br><br>その結果、熟練度は処理の速さではなく、作業行動が課題の要求とどう結びつくかに現れた。重大な誤りの密度が高くなるほど、熟練者は時間配分をより大きく増やし、課題に敏感な時間調整を示した。誤り修正のパターンはポストエディットの指針によって異なり、リソース条件はグループごとに新たな誤りの導入と異なる関連を示した。キー入力に基づく過程指標も編集結果と関連した。<br><br>著者らは、LLM翻訳のポストエディットにおける効率は課題相対的に理解すべきであり、翻訳者訓練は処理速度よりも、課題に敏感な意思決定、時間調整、外部リソースの効果的な利用を優先すべきだと結論づけている。出典：Frontiers in Psychology","timestamp":1795132800000,"title":"Redefining efficiency in post-editing of LLM-generated translation: why expert translators take more time","titleJa":"LLM翻訳のポストエディットで熟練者が時間をかける理由――効率の再定義","url":"https://www.frontiersin.org/articles/10.3389/fpsyg.2026.1848312"},{"authors":["Maks Tušak","Matej Tušak","Donatella Di Corrado","Francesco Sgró","Edvard Kolar","Pia Gričar","Andrej Lapoša","Aleš Porčnik","Ivan Kneževič","Jasmina Markovič-Božič","Robert Masten"],"categories":[],"field":"Frontiers in Psychology","genre":"Consciousness / Philosophy","monthKey":"2026-11","publishedAt":"2026-11-20T00:00:00Z","source":"Frontiers in Psychology","summaryHtml":"エリート選手は試合前の心理的準備に力を入れるが、若い選手はスポーツ心理学者にアクセスできないことが多い。本研究は15〜19歳の女性アスリートを対象に、催眠を取り入れた体系的な心理スキル訓練が自信・不安・ストレス関連の心理特性にどう関わるかを調べた。バスケットボール、ハンドボール、サッカー、体操の選手123名（実験群58名・対照群65名）が参加し、2か月・全9回の導入プログラムを受けた。対象はスポーツ心理学者との経験がない選手で、自己制御スキル質問票と状態・特性不安検査で前後を評価した。群の割付けは無作為ではなかった。<br><br>ベースラインで調整した結果、すべての測定変数で実験群が有利だった。実験群は対照群より自信、精神的タフネス、自己制御的動機づけ、適応的な対処スタイルが有意に高く、特性不安・状態不安・認知的不安・身体的不安は有意に低かった。効果量は小さいものから大きいものまで幅があった。ただしこれは群間比較であり、群内の変化や因果的な介入効果を示すものではない。<br><br>体系的な心理的準備は、競技への備えに関わる心理特性の介入後スコアと良好に関連し、試合前の心理状態の最適化に心理スキル訓練が有用であることを支持する。今後は男子選手でも同様の効果が見られるかの検討が課題として残る。出典：Frontiers in Psychology","timestamp":1795132800000,"title":"Effects of a hypnosis-based psychological skills training program on anxiety, self-confidence and stress-related psychological characteristics in young female athletes: a prospective, non-randomized field study","titleJa":"催眠を用いた心理スキル訓練が若年女性アスリートの不安・自信・ストレス関連心理特性に及ぼす影響","url":"https://www.frontiersin.org/articles/10.3389/fpsyg.2026.1950288"},{"authors":["Dana Katsoty","Oren Heller","Doron Amsalem","Rony Kapel Lev‐Ari","Noa Gueron‐Sela","Yair Sadaka","Yarden Avnor","Shilat Haim‐Nachum","Yuval Neria","Michal Grinstein Weiss"],"categories":[],"field":"Journal of Child Psychology and Psychiatry","genre":"Psychedelics / Trauma","monthKey":"2026-11","publishedAt":"2026-11-20T00:00:00Z","source":"Crossref","summaryHtml":"親のPTSDと家庭レベルの経済的困窮は、継続的なトラウマ曝露下にある子どものPTSDリスクにともに寄与しうるが、両者がどう絡み合うかは明らかでなかった。本研究は、2023年10月7日の攻撃後に始まった地域紛争下のイスラエルで、子どもを持つ親1659名を対象とした縦断研究のデータを用い、親のPTSD症状と経済的困窮が子どものPTSD症状にどう寄与するかを検証した。対象はイスラエル成人人口の代表サンプル973名と、戦争曝露と社会経済的影響の大きい高リスク層686名の2群で、回帰モデルと縦断パス解析を用いた。<br><br>親のPTSD症状と経済的困窮は、戦争曝露の水準を統制しても子どものPTSD症状と頑健に関連した。親のPTSDが高く経済的困窮も大きい「二重の負担」の家庭で、子どものPTSD症状は最も高かった。縦断解析では、親のPTSD症状は両サブサンプルで一貫してその後の子どものPTSD症状を予測した。経済的困窮は高リスク層では子どものPTSDを予測したが、代表サンプルでは予測しなかった。<br><br>子どものPTSDは家族という文脈の中で理解すべきであり、親の精神的健康と家庭レベルの経済的ストレスは相互に関連するリスク過程として働く。とりわけ影響の大きい集団の子どもへの示唆が強い。継続的トラウマ下で子どものPTSDリスクを下げるには、親のメンタルヘルスと家庭の経済的ストレスの両方に働きかける介入が重要だと結論づけている。出典：Crossref（Journal of Child Psychology and Psychiatry）","timestamp":1795132800000,"title":"The double burden: parent PTSD and economic hardship as predictors of child PTSD during continuous trauma","titleJa":"二重の負担――継続的トラウマ下における子どものPTSDを予測する親のPTSDと経済的困窮","url":"https://doi.org/10.1111/jcpp.70258"},{"authors":["Zhaoyu Wang","Qingkun Liu","Jeffrey Nemes","Alis Kranfli","Akiva Singer","Molly Sullan","Andrew Hoisington","Lisa A Brenner","Maciej Skotak","Christina R LaValle","Hanga Galfalvy","Yongchao Ge","Walter Carr","Fatemeh Haghighi"],"categories":[],"field":"Military Medicine","genre":"Psychedelics / Trauma","monthKey":"2026-11","publishedAt":"2026-11-20T00:00:00Z","source":"Crossref","summaryHtml":"高リスクの軍事職種に就く兵士は、任務中に数百〜数千回もの爆風と心理的トラウマに曝露されるが、その影響を客観的に捉えるバイオマーカーは乏しかった。本研究は、DNAメチル化が環境曝露の安定した痕跡となり、長期の神経・精神症状の機序を反映しうることに着目し、米軍の訓練に参加した爆破処理要員190名と手榴弾操作員30名（全員男性）を対象に、後ろ向きコホートのエピゲノムワイド関連解析を行った。血液試料と曝露歴、訓練前後の神経認知機能（DANA）を用いた。<br><br>エピジェネティック年齢の加速（DunedinPACE）は軍務期間、爆風因子、トラウマ因子のいずれとも有意に相関した。EWASでは爆風因子に12領域、トラウマ因子に22領域が関連し、神経炎症、血液脳関門の完全性、聴覚機能に関わる遺伝子が含まれた。メチル化リスクスコアは内部検証でAUC 88％と86％を示し、外部検証でも爆破処理要員でAUC 74％だった。トラウマのメチル化リスクスコアは、爆風の大きさや軍務期間とは独立に、爆風曝露後の手続き反応時間の遅延と有意に関連した。<br><br>職業的な爆風・トラウマ曝露のDNAメチル化シグネチャは、エピジェネティック年齢の加速と神経認知機能の低下に関連し、曝露の客観的評価と作戦即応性の指標としてエピジェネティック・バイオマーカーが有用であることを支持する。出典：Crossref（Military Medicine）","timestamp":1795132800000,"title":"Enduring DNA Methylation Marks of Blast and Trauma Exposures in Warfighters","titleJa":"爆風とトラウマ曝露が残す持続的なDNAメチル化の痕跡――戦闘員における研究","url":"https://doi.org/10.1093/milmed/usag525"},{"authors":["Qifeng Tong","Jianing Wu","Pengcheng Fan","Sunyue Cai","Minzhe Wang","Jianqiu Gong","Fangchao Wu"],"categories":[],"field":"PLOS ONE","genre":"Neuroscience","monthKey":"2026-11","publishedAt":"2026-11-20T00:00:00Z","source":"PLOS ONE","summaryHtml":"運動イメージ（MI）に基づく脳―コンピュータ・インタフェース（BCI）訓練が、亜急性期脳卒中患者の上肢運動機能を改善するかを、高忠実度のシャムBCI対照と比較した。参加者盲検の無作為化比較試験で、亜急性期脳卒中患者32人をMI-BCI群とシャムBCI群に各16人ずつ割り付け、両群とも標準リハビリテーションに加えて用量をそろえた訓練（30分/回、週5回、4週間）を受けた。<br><br>主要評価項目はFugl-Meyer評価上肢版（FMA-UE）で、Wolf運動機能テスト、運動評価尺度、修正Barthel指数も評価し、構造MRIと安静時機能的MRIで灰白質体積と機能的結合も調べた。両群とも介入後に有意に改善したが、MI-BCI群はシャム群よりFMA-UEと副次的な運動転帰（WMFTとMAS）でより大きな改善を示し、MBIの差は有意でなかった。ボクセルベース形態計測では、MI-BCI群で対側の補足運動野（SMA）の灰白質体積が群内で増加したが、群間差は有意でなかった。<br><br>安静時機能的結合はSMAと同側小脳第IX小葉および紡錘状回の間で増加し、その変化はFMA-UE、WMFT、MBIの改善と関連した。MI-BCI訓練は高忠実度のシャム対照と比べて上肢運動の回復が大きく、運動関連領域と結合の構造的・機能的変化を伴った。より大規模で追跡期間の長い無作為化比較試験で、持続性と臨床的意義の確認が必要だと結論づけている。出典：PLOS ONE","timestamp":1795132800000,"title":"Motor imagery-based brain-computer interface training for upper-limb rehabilitation after subacute stroke: A randomized sham-controlled trial","titleJa":"運動イメージによる脳―コンピュータ・インタフェース訓練は亜急性期脳卒中後の上肢リハビリテーションを改善するか――無作為化シャム対照試験","url":"https://journals.plos.org/plosone/article?id=10.1371/journal.pone.0363060"},{"authors":["Yang Zheng","Jiayang Liu","Jessey Li","Jiayin Qu","Samiksha Chopra","Taruna Yadav","Jessica A Cardin","Hal Blumenfeld"],"categories":[],"field":"Epilepsia","genre":"Consciousness / Philosophy","monthKey":"2026-11","publishedAt":"2026-11-20T00:00:00Z","source":"PubMed","summaryHtml":"側頭葉の焦点発作では意識が障害されることが多い。近年は皮質の覚醒低下や徐波、アセチルコリンの減少がその機序として示されてきたが、ドーパミンというもう一つの重要な皮質下覚醒系の役割はほとんど分かっていなかった。本研究は、行動反応の障害を伴う焦点性辺縁系発作のマウスモデルでドーパミンの動きを調べた。<br><br>覚醒下で頭部固定したマウスに短時間の電気刺激で海馬の焦点発作を誘発し、条件づけた聴覚反応課題で行動を評価した。遺伝子コード型蛍光センサーによるファイバーフォトメトリーで皮質ドーパミンを、カルシウム計測で腹側被蓋野のドーパミン神経活動を測った。発作中は内側前頭前野と眼窩前頭皮質でドーパミンが持続的に上昇し、腹側被蓋野の活動も高まった一方、課題で誘発される一過性のドーパミン上昇は皮質・腹側被蓋野の両方で抑えられ、行動反応も低下した。<br><br>持続的な上昇と一過性の低下という時間スケールの異なる調節異常が、発作時の意識障害に関わることが示された。持続的なドーパミン上昇は、発作時の皮質機能変化や意識障害が深い睡眠よりも脳症やせん妄に近い状態であることを示唆する。感覚刺激に対する一過性放出の低下も行動反応の障害に寄与する可能性があり、ドーパミンの役割の解明はてんかん患者の認知・行動障害の治療につながるかもしれない。出典：PubMed（Epilepsia）","timestamp":1795132800000,"title":"Dopamine dynamics in a mouse model of temporal lobe seizures with impaired consciousness.","titleJa":"側頭葉てんかん発作時の意識障害におけるドーパミン動態――マウスモデルでの検討","url":"https://doi.org/10.1002/epi.70575"},{"authors":["Xi Liu","Chaoyi Zhou","Run Wang","Jiaang Li","Feng Luo","Junxiang Huang","Siyu Huang"],"categories":["cs.CV"],"field":"cs.CV","genre":"Vision / Multimodal","monthKey":"2026-11","publishedAt":"2026-11-20T00:00:00Z","source":"Hugging Face Papers","summaryHtml":"画像のベクトル化はラスター画像をコンパクトなSVG（スケーラブル・ベクター・グラフィックス）として再構成し、構造化され編集可能なコード表現を与える。だが既存手法の多くはピクセル単位の再現精度を最適化するため、人が知覚する物体―部分の階層と合わないSVGになりやすく、操作が難しい。本研究はLang-SVGを提案する。<br><br>SVGプリミティブを意味ラベルと親子関係をもつ明示的な木構造で整理する。粒度を制御できるオープン語彙セグメンテーションの事前知識で物体―部分階層を初期化し、SVG木の文脈を備えたマルチモーダル大規模言語モデルでラベル未付与ノードに意味ラベルを割り当てる。深さ適応型の簡略化や木誘導の剪定・統合で冗長なノードを減らし、L1-SAMプロンプトで欠けた領域を回復する。<br><br>再現精度だけでなく、構造の質と意味的な部分整合性を測る新しい評価プロトコルも導入した。実験ではLang-SVGが描画忠実度と構造品質の両方で最先端の性能を達成した。プロジェクトサイトでは手法の詳細と成果が公開されている。出典：Hugging Face Papers","timestamp":1795132800000,"title":"Lang-SVG: Hierarchical Image Vectorization with Language Priors","titleJa":"Lang-SVG――言語の事前知識を用いた階層的な画像ベクトル化","url":"https://arxiv.org/abs/2611.15941"},{"authors":["Youngwoo Shin","Jongsuk Kim","Junmo Kim"],"categories":["cs.CV"],"field":"cs.CV","genre":"LLM / NLP","monthKey":"2026-11","publishedAt":"2026-11-20T00:00:00Z","source":"Hugging Face Papers","summaryHtml":"教師あり微調整（SFT）は、ビデオ大規模言語モデル（VideoLLM）が動画について推論する能力を高める段階である。だがVideoLLMは同時に、訓練データのテキスト上の規則性から答えるショートカットも学んでしまい、動画を迂回する。この規則性はデータの段階では定義しにくく、ショートカットは訓練エポック数やデータ量、基盤モデルによらず形成される。<br><br>ショートカットは訓練分布内の精度上昇の裏に隠れるが、その上昇に必須ではなく、分布シフト下では動画がもたらすはずの利益をSFTから奪うことさえある。そこで本研究は、データではなく微調整の更新が書き込まれる場所に介入するVideo-Evidence Training via Orthogonal projection（VETO）を提案する。基盤モデルの活性化においてテキスト単独が占める部分空間を較正し、その直交補空間へ更新を射影する。<br><br>こうしてVideoLLMは完全な入力に基づいて答えるようになり、ショートカットは形成される端から定義されることなく抑えられる。7つのVideoLLMで、VETOは訓練分布におけるSFTの利益を保ちつつショートカットを抑え、シフト下の6ベンチマークではSFTを上回り、ショートカットではなく完全な入力から答えた。出典：Hugging Face Papers","timestamp":1795132800000,"title":"Suppressing the Shortcut Hidden Behind the Gains of VideoLLM Fine-Tuning","titleJa":"VideoLLM微調整の成果の裏に隠れたショートカットを抑える","url":"https://arxiv.org/abs/2611.25776"},{"authors":["Raluca Bilasco-Rusu"],"categories":[],"field":"International Journal of Research and Innovation in Social Science","genre":"Consciousness / Philosophy","monthKey":"2026-11","publishedAt":"2026-11-20T00:00:00Z","source":"Crossref","summaryHtml":"シュウィンガー効果は、十分に強い外部電場のもとで量子電磁力学の真空が不安定化し、実在の荷電粒子・反粒子対が生成されるという、量子電磁力学の非摂動的な予言である。本論文は、この効果が意識を基礎的なものとみなす哲学的説明に何をもたらすか、また物質がどのように物理的に顕現するのかという問いに取り組む。<br><br>著者は、この効果が哲学的に有益なのは、場の理論的な状態が定まった条件のもとで実在の励起を含む状態へ遷移するという、数学的に明示的な事例を与えるからだと論じる。それにより、根底にある物理的な場、その状態を支配する条件、特定の物理的励起の現実化という区別が鋭くなる。これは絶対的な無からの創造ではない。対生成に必要なエネルギーは外部の場から供給される。<br><br>またこの効果は、量子場や真空が意識的であることを立証するものではない。その意義はより限定されているが、より精密である。顕現、現実化、分化という意味を、場に基づく存在論のなかで検討するための物理的な事例を提供する点にある。出典：Crossref（International Journal of Research and Innovation in Social Science）","timestamp":1795132800000,"title":"Fundamental Consciousness and Field-Conditioned Actualization a Schwinger-Inspired Inquiry into the Manifestation of Matter and the Ontology of Consciousness","titleJa":"基礎的意識と場に条件づけられた現実化――シュウィンガー効果に着想を得た物質の顕現と意識の存在論への問い","url":"https://doi.org/10.47772/ijriss.2026.101100068"},{"authors":["Áine T. Dineen","Cliona O’Doherty","Anna Truzzi","Graham King","Lorijn Zaadnoordijk","Enna-Louise D’Arcy","Chiara Caldinelli","Anna Kravchenko","Tamrin Holloway","Jessica White","Alex R. Wade","Aoibhe De Burca","Maebh Healy","Amy Burke","Kevin Campion","Cameron Murphy","Katie Herbert","Claire Ambre","Anisha Wadhwa","Oscar Markey","Josué Rico-Picó","Deirdre O’Hara","Angela T. Byrne","Ailbhe Tarrant","Adrienne Foran","Eleanor J. Molloy","Rhodri Cusack"],"categories":[],"field":"Frontiers in Neuroscience","genre":"Neuroscience","monthKey":"2026-11","publishedAt":"2026-11-20T00:00:00Z","source":"Frontiers in Neuroscience","summaryHtml":"覚醒状態の乳児fMRIは、発達中の脳の働きをのぞく窓になりうる。視覚神経科学では、fMRIと深層ニューラルネットワークなどの計算モデルを組み合わせるNeuroAIのアプローチが、物体認識を担う腹側視覚経路の表象を特徴づける有力な手段となっている。これを乳児期に拡張すれば視覚の発達と学習の軌跡や仕組みの解明につながるが、前提となるのは十分なデータの取得である。認知基盤プロジェクトでは、発達中の視覚表象を大規模に特徴づけるため、覚醒状態の乳児fMRIの実現可能性を検証した。<br><br>乳児の注意を維持し、腹側視覚経路の幅広い応答を引き出しつつ、参加時間のばらつきのなかで条件あたり十分なデータを確保するため、条件数を抑えた二つの受動的視聴パラダイムを開発した。一つは注意維持と静止を促す6本の自然な動画、もう一つは微細な表象の特徴づけと計算モデルとの直接比較を可能にする36枚の物体画像である。生後2か月の乳児130名と生後9か月の乳児65名から覚醒fMRIを取得した。<br><br>2か月児の97%が覚醒スキャンに参加し中央値18.63分、9か月児は63%が参加し中央値13.02分だった。9か月児は参加時間が短い一方で動きが少なく、動きによる除外は少なかった。両年齢群とも刺激に注意を向け、両パラダイムとも発達中の脳、とくに腹側視覚経路で信頼できる刺激駆動応答を引き出し、サンプルが大きいほど頑健な群レベルの表象パターンが得られた。実践的な課題は残るものの、覚醒乳児fMRIは視覚表象の大規模な特徴づけに有効であり、視覚発達の計算論的・NeuroAI研究の基盤となる。出典：Frontiers in Neuroscience","timestamp":1795132800000,"title":"Awake infant functional MRI for visual neuroscience: reflections from the Foundations of Cognition Project","titleJa":"覚醒状態の乳児fMRIによる視覚神経科学――認知基盤プロジェクトからの省察","url":"https://www.frontiersin.org/articles/10.3389/fnins.2026.1852835"},{"authors":["Markus W. Drealan","Anh Tuan Nguyen","Brian Z. H. Lim","Jad Awada","Linh Hoang","Diu Khue Luu","Qi Zhao","Zhi Yang"],"categories":[],"field":"Frontiers in Neuroscience","genre":"Neuroscience","monthKey":"2026-11","publishedAt":"2026-11-20T00:00:00Z","source":"Frontiers in Neuroscience","summaryHtml":"深層学習による神経運動デコーダの訓練には大規模データが必要だが、ヒト実験での取得は難しい。複雑な刺激フィードバックや小型ワイヤレス記録装置の登場により、刺激アーチファクトや干渉を考慮した追加データも必要になっている。本研究は、制御された悪条件下で神経データを合成し、既存データセットを拡張して、神経デコーディングとアーチファクト除去アルゴリズムの評価・開発を支えるプラットフォームを提案した。<br><br>記録した神経信号をアナログ波形に変換し、制御されたノイズ環境で再生してから、現実的な物理的歪みを伴って再サンプリングする独自ハードウェアを開発した。実証では、清浄な運動制御データセットを標的としたWi-Fi干渉で汚染し、1D U-Netにアーチファクト除去を学習させた。ベースラインの再サンプリングは元のデコーダ精度を1%未満しか変えず、信号劣化が最小限であることを確認した。<br><br>無線干渉下ではU-NetデノイザがSNRを14.2〜22.3dB改善し、運動デコーダは深刻な分類失敗を克服して精度を清浄なベースラインの5〜8%以内まで回復し、元の予測と最大98.1%一致した。記録済みバイオシグナルを制御された悪条件下で再生・再記録できる実践的な枠組みであり、記録アーチファクトの影響定量化と、実世界で頑健な神経デコーディングのためのアーチファクト除去手法の開発に役立つ。出典：Frontiers in Neuroscience","timestamp":1795132800000,"title":"Synthetic neural data augmentation for robust deep learning-based neural decoding","titleJa":"合成神経データによる頑健な深層学習ニューラルデコーディング","url":"https://www.frontiersin.org/articles/10.3389/fnins.2026.1954119"},{"authors":["Yan Cheng","Haibo Liu"],"categories":[],"field":"Frontiers in Psychology","genre":"Ethics / Safety","monthKey":"2026-11","publishedAt":"2026-11-20T00:00:00Z","source":"Frontiers in Psychology","summaryHtml":"生成AIが自分の答えに同意していると感じるとき、学生は自分の誤りの可能性を認め、自分の見解に反する証拠を探し続けるだろうか。本研究は、答えに対するAIの支持と、答えに疑問を投げかけることへの教師の支持を区別し、知覚されたAIの同意と、理由ある異議に対する教師の支持が、状態としての知的謙虚さと報告された反証探索とどう関連するかを調べた。<br><br>職業技術大学の学部生386名（主に1年生）を対象に調査した。AI支援の英語学習課題のあと授業内で質問紙に回答してもらい、別途パイロット標本で測定モデルを検討した。確認的因子分析と構造方程式モデリングで関連を調べ、間接的な関連にはブートストラップ区間を用いた。<br><br>主モデルでは、知覚されたAIの同意と教師の支持はいずれも知的謙虚さと正に関連し、謙虚さは報告された反証探索と正に関連した。謙虚さを介した間接的な関連は両予測因子とも正で、ブートストラップ区間はゼロを含まず、両者の推定値に明確な差はなかった。直接のパスはいずれも有意ではなかった。自分の見解への支持と、主張に疑問を投げかける励ましをあわせて考えることが、AI支援学習における謙虚さと反証探索の検討に重要だと示唆される。出典：Frontiers in Psychology","timestamp":1795132800000,"title":"Perceived AI agreement and teacher support for reasoned dissent in relation to intellectual humility and counterevidence seeking","titleJa":"生成AIの同意と教師の異議支援――知的謙虚さと反証探索への影響","url":"https://www.frontiersin.org/articles/10.3389/fpsyg.2026.2025160"},{"authors":["Igor Belenichev","Olena Popazova","Victor Ryzhenko","Nina Bukhtiyarova","Sergii Pavlov","Pavlo Petakh","Oleksandr Kamyshnyi"],"categories":[],"field":"Frontiers in Neuroscience","genre":"Neuroscience","monthKey":"2026-11","publishedAt":"2026-11-20T00:00:00Z","source":"Frontiers in Neuroscience","summaryHtml":"爆発物による外傷性脳損傷（TBI）は、過去20年の戦闘死傷の主要な原因であり、避難後の戦闘死の42%以上を占める。爆発による神経外傷（音響外傷）を伴うTBIが増えるなか、熱ショックタンパク質70（HSP70）の調節による薬理学的神経保護が急務となっている。<br><br>本研究は、加圧CO2でTBIと爆発外傷を併発させたラット170匹を用い、タモキシフェン、メラトニン、グルタミン、ピラセタム、HSF-1、Angiolinの神経保護効果を、ミトコンドリア機能障害とエネルギー代謝の観点から評価した。受傷後4日目、未治療群では重度の神経障害、死亡率の上昇、ATP・ADPの低下、乳酸の上昇、ミトコンドリア膜電位の喪失などが見られた。<br><br>調べた薬剤はいずれもHSP70発現を高め、エネルギー代謝を正常化して神経保護を示し、効果の順位はピラセタム＜グルタミン＜タモキシフェン＜メラトニン＜HSF-1＜Angiolinだった。AngiolinゲルとHSF-1の前臨床開発が有望な戦略として支持された。出典：Frontiers in Neuroscience","timestamp":1795132800000,"title":"Targeting mitochondrial dysfunction with HSP70 modulators for neuroprotection in experimental traumatic brain injury combined with acoustic barotrauma","titleJa":"HSP70調節薬による外傷性脳損傷の神経保護――爆発外傷モデルでのミトコンドリア機能の回復","url":"https://www.frontiersin.org/articles/10.3389/fnins.2026.2017536"},{"authors":["Nana Kofi Amoako Glover"],"categories":[],"field":"Cambridge Open Engage","genre":"Consciousness / Philosophy","monthKey":"2026-11","publishedAt":"2026-11-20T00:00:00Z","source":"Crossref","summaryHtml":"知能や「高度な」生命の概念は、動き、脳に制御を集中させ、秒単位で行動する動物から抽象化されてきた。本論文は、樹木とその菌類パートナーにその概念を当てはめると何が見落とされるかを問い、強さの異なる4つの主張を展開する。<br><br>まず移動バイアスは実在し、運動・時間・中央集権・個人主義の4要素に分解できる。次に樹木は基質に依存しない最小認知の基準を満たすが、そのテンポは信号が系を横切る速度という物理的制約で決まる。共通菌根ネットワークを通じた森林の情報統合の証拠は、巷の説明より弱いと段階づける。第三に、樹木レベルの経験の仮説を10系統の意識理論で監査すると、予測する理論はなく、許容する理論はいくつかあり、現時点では「調査に値するが予防措置は要しない」と結論する。<br><br>樹木とAIは対照的なテストケースだ。脳のような構造を持たない生命の組織と、生命を持たない構造である。同じ根拠で両方を退けることはできない。さらにテンポと広がりの制約を光速に当てはめると、大きな技術文明は統合と拡大を交換せざるを得ず、長命な知能には「根づいた」軌道が条件付きで支持される。出典：Crossref（Cambridge Open Engage）","timestamp":1795132800000,"title":"Arboreal Consciousness: A Philosophical and Biological Inquiry into Trees, Mycelium, and the Future of Intelligence","titleJa":"樹木の意識――樹木と菌根菌ネットワークから知能の概念を問い直す","url":"https://doi.org/10.33774/coe-2025-s5bm1-v2"},{"authors":["Ellie Maycock","Kel O'Neill","Natalie L. Marchant","Indy Sira","Georgia Pavlopoulou","Christin Henein","Aikaterini Fotopoulou","Michael Moutoussis"],"categories":[],"field":"Journal of Neuropsychology","genre":"Consciousness / Philosophy","monthKey":"2026-11","publishedAt":"2026-11-20T00:00:00Z","source":"Crossref","summaryHtml":"心と神経の健康研究では、当事者と研究者がともに研究をつくる「共同制作（コ・プロダクション）」が広がっている。しかし共同制作そのものをどう評価するかは、あまり検討されてこなかった。本研究は、新設の心と脳の研究センターで9か月かけて共同制作した戦略的優先事項と研究資金の配分手続きを、体系的に共同評価した。<br><br>評価は質的・量的・対話的・実施後の手法を組み合わせた混合法で、RQ+4 Co-Proの枠組みを応用した。参加した14人の成人には、7人のコミュニティパートナーを含む学術・臨床・研究スタッフが含まれ、多くが精神的困難や神経多様性、周縁化の当事者経験をもっていた。書面の振り返りを主題分析し、権力感をプロジェクト中間と終了時に測定し、結果をチームで対話的に共同解釈した。<br><br>6つのテーマ（時間と資源、役割とアイデンティティ、リーダーシップと権力、コミュニケーション、制度的障壁、感情的労働と収穫）が得られ、権力感の平均は5.34から5.61へ上昇した（p=.023）。対話的な振り返りでは、共通の経験への収束する解釈と異なる解釈の両方が明らかになった。公平な共同制作には、信頼を築く時間、共有の影響力を閉ざさない構造、参加を支える制度が必要だというのが中心的な学びである。出典：Crossref（Journal of Neuropsychology）","timestamp":1795132800000,"title":"Co‐evaluation of co‐production in mind and brain research: A dialogical approach","titleJa":"心と脳の研究における共同制作の共同評価――対話的アプローチ","url":"https://doi.org/10.1111/jnp.70084"},{"authors":["María F. Rabito-Alcón","Celia Antuña-Camblor","Anabel González-Vázquez","José I. Baile"],"categories":[],"field":"Healthcare","genre":"Psychedelics / Trauma","monthKey":"2026-11","publishedAt":"2026-11-20T00:00:00Z","source":"Crossref","summaryHtml":"小児期のトラウマは摂食障害の精神病理と関連することが知られているが、そのあいだに介在する心理過程は十分に解明されていない。嫌悪感受性（さまざまな刺激に嫌悪を感じやすい素質）は、発達上の逆境と摂食障害の両方と関連する一方、あまり検討されてこなかった特性である。本研究は、成人女性292人を対象に、小児期トラウマと嫌悪感受性が摂食障害的態度とそれぞれ独自に関連するかを調べた。<br><br>参加者は診断による事前選別なしに募集され、平均年齢37.13歳だった。約46％が現在または過去の摂食障害診断があるか、診断なしに摂食障害を自認していた。小児期トラウマ質問票短縮版、多面的嫌悪感受性尺度、摂食態度テスト26（EAT-26）を実施し、EAT-26得点を潜在的なトラウマ因子と嫌悪因子に回帰させる構造方程式モデルを推定した。<br><br>最終モデルの適合度は許容できるが良好ではなかった（CFI=0.939、RMSEA=0.067、SRMR=0.054）。小児期トラウマ（β=0.26）と嫌悪感受性（β=0.27）はそれぞれ摂食障害的態度と独自に関連し、合わせてEAT-26得点の分散の19％を説明した。2つの関連の大きさに有意差はなかった。年齢、BMI、摂食障害の自己申告で調整しても関連は弱まりつつ有意に残った。摂食障害の評価では、発達上の逆境と嫌悪感受性の両方を考慮することが有益だとされる。出典：Crossref（Healthcare）","timestamp":1795132800000,"title":"Unique Associations of Childhood Trauma and Disgust Sensitivity with Disordered Eating Attitudes: A Structural Equation Modeling Study in Adult Women","titleJa":"小児期トラウマと嫌悪感受性が摂食障害的態度と独自に関連――成人女性における構造方程式モデリング研究","url":"https://doi.org/10.3390/healthcare14223995"},{"authors":["Carlos Orellana"],"categories":[],"field":"Journal of Brain Health","genre":"Psychedelics / Trauma","monthKey":"2026-11","publishedAt":"2026-11-20T00:00:00Z","source":"Crossref","summaryHtml":"戦争が終わっても、脳への影響は終わらない。恐怖、喪失、避難、長引く不確実性は、暴力が止んだ後も何年にもわたって心身に残り続ける。本稿は、戦争に伴うトラウマが生涯にわたる脳の健康にどう影響するかを解説する。心的外傷後ストレス障害（PTSD）、うつ、睡眠の乱れ、幼少期の逆境、強制移住、社会的な不安定さを、トラウマ体験と後の認知機能低下や認知症リスクを結ぶ経路として取り上げる。<br><br>ただし本稿は、PTSDがすべての人に直接認知症を引き起こすと主張するものではない。トラウマは長期的な脳の健康上の懸念として真剣に受け止めるべきだと論じる。とりわけ民間人、子ども、難民、高齢者、医療従事者、繰り返し長期にわたる暴力にさらされた地域社会が対象になる。その影響の大きさは、避難や社会的孤立、医療へのアクセスといった条件によっても左右される。<br><br>戦後の脳の健康を守るには、症状の治療だけでは足りない。早期に耳を傾け、偏見を減らし、安全な環境を支え、PTSDとうつを治療し、睡眠を守り、心血管・代謝リスクを管理し、避難した人々へのケアを長期に続けることが求められる。出典：Crossref","timestamp":1795132800000,"title":"War, Trauma, and Dementia Risk: A Brain Health Perspective on Conflict","titleJa":"戦争、トラウマ、認知症リスク――紛争を脳の健康の視点から捉える","url":"https://doi.org/10.65104/001c.175477"},{"authors":["Maria Nikoloudi","Petros Galanis","Ioanna Tsatsou","Kyriaki Mystakidou"],"categories":[],"field":"Indian Journal of Palliative Care","genre":"Psychedelics / Trauma","monthKey":"2026-11","publishedAt":"2026-11-20T00:00:00Z","source":"Crossref","summaryHtml":"がんの診断や治療は患者に深い心理的負担をもたらすが、苦難を経て肯定的な変化が生じる「心的外傷後成長（PTG）」が、希望や意気消沈とどう関わるかは十分に調べられていなかった。本研究は112人のがん患者を対象に、PTGと希望、意気消沈の関係を検討した。性別、年齢、教育水準、婚姻状態、就労、がん種、転移、ECOG全身状態、治療法といった人口統計学的・臨床的な交絡因子で調整し、3つの尺度の内的整合性もクロンバックのαで確認した。<br><br>PTGはPTGインベントリ（PTGI）、希望はハース希望指数（HHI）、意気消沈は意気消沈尺度II（DS-II）で測定され、変数間の相関はピアソンの相関係数で、関連は単変量および多変量の線形回帰で検討された。PTGIの合計得点は希望と正の相関（r=0.45、p<0.01）、意気消沈と負の相関（r=-0.37、p<0.01）を示した。調整済みの多変量モデルでは、PTGが高いほど希望が高く（B=0.094、95%信頼区間0.047～0.140、p<0.001、R2=23.3%）、意気消沈が低かった（B=-0.130、95%信頼区間-0.199～-0.061、p<0.001、R2=13.0%）。<br><br>結果は、PTGががん患者の心理的適応における資源となりうることを示唆する。ただし本研究は横断研究であり、臨床的意義を明らかにするには縦断研究や介入研究が必要だと著者らは述べている。出典：Crossref（Indian Journal of Palliative Care）","timestamp":1795132800000,"title":"From Trauma to Transformation: The Role of Post-Traumatic Growth in Hope and Demoralisation among Cancer Patients","titleJa":"トラウマから変容へ――がん患者における心的外傷後成長と希望・意気消沈の関係","url":"https://doi.org/10.25259/ijpc_373_2025"},{"authors":["Rebecca Bates"],"categories":[],"field":"The Gerontologist","genre":"Psychedelics / Trauma","monthKey":"2026-11","publishedAt":"2026-11-20T00:00:00Z","source":"Crossref","summaryHtml":"認知症の行動・心理症状はよくみられる臨床的に重要な問題だが、行動的苦痛は神経学的・医学的・心理的・関係的・環境的・社会的要因の相互作用から生じる多因子性のものである。現代の認知症ケアでは包括的評価や本人中心ケア、生活史や環境への配慮が重視されるが、行動の定式化やケア計画にトラウマインフォームドな視点が明示されないこともある。<br><br>本フォーラム論文は、既存の行動評価にトラウマインフォームドな視点を組み込む認知症特化の概念枠組み「トラウマインフォームド行動評価（TIBA）」を提案する。逆境やトラウマ歴、行動の文脈と引き金、トラウマ関連の反応、感覚・環境条件、関係的・伝記的意味、安全とコントロールの源を構造化された視点で検討する。多因子評価や本人中心ケア、DICEアプローチを置き換えるものではなく、トラウマが行動を引き起こすと仮定するものでもない。<br><br>TIBAは検証済みの評価尺度や診断ツールではなく概念的な臨床定式化の枠組みであり、日常的な臨床実装の前に参加型の精緻化、運用化、実現可能性の検証、実証的評価が必要だと著者は述べている。出典：Crossref（The Gerontologist）","timestamp":1795132800000,"title":"Beyond Behaviour: A Trauma-Informed Behaviour Assessment Framework for Understanding and Preventing Behavioural Distress in Dementia","titleJa":"行動の奥にあるもの――認知症の行動的苦痛をとらえるトラウマインフォームドな評価枠組み","url":"https://doi.org/10.1093/geront/gnag263"},{"authors":["Hidir Yesiltepe","Julius Berner","Arash Vahdat","Pinar Yanardag"],"categories":["cs.CV"],"field":"cs.CV","genre":"Vision / Multimodal","monthKey":"2026-11","publishedAt":"2026-11-19T18:59:57Z","source":"arXiv","summaryHtml":"拡散蒸留は、学習済み教師モデルの反復サンプリングを数回のネットワーク評価に圧縮し、画像・動画生成を高速化する。分布ベースの手法は学生の出力分布を教師に一致させるが、逆KL目的関数によるモード探索バイアスのため、教師の支配的なモードが優先され、サンプルの多様性が失われがちだった。<br><br>本論文は分布ベース蒸留の新しい一員「事後分布マッチング蒸留（PMD）」を提案する。モードを覆う事後サンプリングと任意ステップ生成を組み合わせ、母集団損失がゼロのとき、各ノイズレベルで教師のクリーン画像の完全な事後分布を回復する。確率的な学生モデルは追加学習なしに、学習した時間ステップ格子内の任意のサンプリング回数に対応できる。<br><br>学習では、固定されたノイズ状態を条件として学生サンプルの指数重み付き平均を教師の事後平均に一致させる。ガウスノイズ下では、指数的に傾けた事後平均はシフトした入力に対する1回の教師評価に等しく、開近傍での傾き平均の一致が完全な事後分布を一意に定めることが証明された。SDXLとFLUX.2 [klein] 4Bでの実験では、4ステップ手法の中で最良のFIDを達成し、プロンプト整合性や知覚品質でも競争力のある結果を示した。出典：arXiv（cs.CV）","timestamp":1795114797000,"title":"Posterior Matching Distillation","titleJa":"事後分布マッチング蒸留――拡散モデルの多様性を保ったまま高速化する新手法","url":"https://arxiv.org/abs/2611.26629"},{"authors":["Jinbin Luo","Xiaozhe Yao","Shang Yang","Zhijian Liu","Song Han","Qinghao Hu"],"categories":["cs.DC","cs.LG"],"field":"cs.DC","genre":"LLM / NLP","monthKey":"2026-11","publishedAt":"2026-11-19T18:58:31Z","source":"arXiv","summaryHtml":"ハイブリッド・アーキテクチャはオープンウェイト言語モデルの主流となった。大域的注意層と有界状態層は、文脈長や同時実行数に応じて需要が変わる異種のキャッシュを維持する。本研究はCPU–GPUスーパーチップ上のサービング・システムTideCacheを提案する。<br><br>TideCacheは3つの要素からなる。透過的キャッシュプールは固定された仮想アドレスの背後で物理ページをキャッシュ要素間で再配分し、キャッシュの配置とバックエンドのインターフェースを保つ。キャッシュストリーマーは有界状態層の計算間隔を利用して次の大域的注意層の接頭辞をプリフェッチし、GPU常駐量を減らしながら層ごとの転送と計算を重ねる。生成されたKVは常駐したままとなる。リクエストスケジューラは常駐実行かストリーム実行かを選び、要求サイズとキュー状態に応じて容量を調整する。<br><br>SGLangに実装し、GB300とGH200で7つのモデル／プラットフォーム構成を評価した結果、HiCache付きSGLangと比べてエージェントのターン完了数が最大2.04倍、トークンあたりP50レイテンシが全体で20〜59％低減、エージェントの初回トークンまでのP50時間が1.40〜3.05倍改善した。出典：arXiv（cs.DC）","timestamp":1795114711000,"title":"TideCache: Efficient Hybrid LLM Serving with Transparent Cache Management and Layer-Wise Streaming","titleJa":"TideCache：透過的キャッシュ管理と層別ストリーミングによる効率的なハイブリッドLLMサービング","url":"https://arxiv.org/abs/2611.26619"},{"authors":["Yansong Qu","Wesker Zheng","Quanjian Song","Zhiyuan Zhang","Xiao Cao","Shengchuan Zhang","Liujuan Cao"],"categories":["cs.CV"],"field":"cs.CV","genre":"Vision / Multimodal","monthKey":"2026-11","publishedAt":"2026-11-19T18:58:04Z","source":"arXiv","summaryHtml":"高解像度の動画ワールドモデルは、場面の細かな構造や質感を描き出せるが、直接生成するには計算とメモリのコストが大きい。ScaleWorldは、低解像度の世界予測と高解像度の精緻化を、単一の共有バックボーンに統合した因果的動画モデルである。各動画チャンクで、共有バックボーンがまず低解像度の予測を完了し、それを条件に一段階の高解像度精緻化を行う。自分の予測を自分で精緻化するため、別途の精緻化モデルは要らない。<br><br>効率的なストリーミング生成のため、予測用には長い低解像度履歴、精緻化用には短い高解像度履歴と、別々の因果状態を保持する。蒸留時のタスク干渉に対処するため、専門家の最適化と能力の統合を分離し、タスク非対称オン・ポリシー蒸留（TA-OPD）を導入した。専門教師の予測と精緻化の振る舞いを、それぞれのサンプリング方針と履歴方針の下での局所速度マッチングにより、共有の生徒へ移す。<br><br>広範な実験により、ScaleWorldは計算とメモリの効率を改善しつつ高品質なワールド生成を達成した。予測と精緻化を一つの骨格で共有する設計が、高解像度ワールドモデルの実用化を近づける。出典：arXiv（cs.CV）","timestamp":1795114684000,"title":"ScaleWorld: High-Resolution World Generation through Shared Prediction and Refinement","titleJa":"高解像度ワールド生成を一つの骨格で――予測と精緻化を共有するScaleWorld","url":"https://arxiv.org/abs/2611.26615"},{"authors":["Peiyun Hu","Marko Mihajlovic","Lyndon Duong","Lahav Lipson","Wei Dong","Amaël Delaunoy","Stephan R. Richter","Vladlen Koltun"],"categories":["cs.CV","cs.LG"],"field":"cs.CV","genre":"Vision / Multimodal","monthKey":"2026-11","publishedAt":"2026-11-19T18:55:41Z","source":"arXiv","summaryHtml":"単眼深度推定の従来手法は、時間的一貫性と境界の鮮明さを両立できない。従来手法の分析では、複数フレームを用いる手法は一貫性を、単一フレームの手法は鮮明さを優先する傾向が明らかになった。Depth Pro 2は、画像と動画の両方を処理し、ネイティブ解像度で深度マップを予測する単一のスケーラブルなネットワークで、このトレードオフを解消する。<br><br>一つのネットワークが画像と動画の両方を扱い、解像度を落とさずに予測するため、深度マップはメートル単位で正確で、鮮明かつ時間的に一貫しており、従来手法をあらゆる面で上回る。フル解像度での推定により、境界の細部まで保たれる。動画でも画像でも、同じネットワークが深度を推定する。メートル精度、鮮明さ、時間的一貫性、実行速度の面で新たなパレートフロンティアを画すモデル群を公開する。<br><br>コードと重みは公開ページで入手でき、画像・動画の深度推定を実用的な精度と速度で利用できる。ロボットやARのように、鮮明さと一貫性を同時に求める応用で、フル解像度の深度推定が使えるようになる。出典：arXiv（cs.CV）","timestamp":1795114541000,"title":"Depth Pro 2: Sharp and Temporally Consistent Metric Monocular Depth","titleJa":"鮮明さと時間的一貫性を両立――単眼深度推定Depth Pro 2","url":"https://arxiv.org/abs/2611.26603"},{"authors":["Yiyan Ji","Qixun Wang","Yang Shi","Zhuoran Zhang","Yifan Xu","Tengfei Liu","Yuqi Tang","Xiaohan Zhang","Shujie Li","Jiafu Tang","Xuanyu Zhu","Xinyu Liu","Yan He","Yushuo Guan","Zihao Wang","Xianghua Ying","Shixuan Liu","Haotian Wang","Wenjing Yang","Zhaoxiang Zhang","Yuanxing Zhang","Pengfei Wan","Jiaheng Liu"],"categories":["cs.CV"],"field":"cs.CV","genre":"Vision / Multimodal","monthKey":"2026-11","publishedAt":"2026-11-19T18:51:58Z","source":"arXiv","summaryHtml":"Code2Videoはエージェントが作る3Dプロキシで動画生成を導き、構造と動きを明示的に制御できる。しかし、最適な下流品質のためにプロキシとプロンプトをどう構築すべきかや、この枠組みの能力と限界は十分に調べられていなかった。本研究は、制御実験と盲検の人間評価により、プロキシの粒度、物理シミュレーション、プロンプトを検討した。粗いプロキシは自然な動きに、中程度の粒度のプロキシは整合性に有利という課題依存のトレードオフが明らかになり、物理シミュレーションとプロキシ整合プロンプトが平均品質をさらに高めた。<br><br>知見に基づき、課題適応型のエージェント枠組みCoda-DaVinciを提案する。プロキシ誘導生成と直接生成を使い分け、エンティティごとにモデリング粒度を適応させ、シミュレーションとプロキシ基盤プロンプトを協調させる。マルチエージェントのハーネスがシーン資産を保持し、目視検査と独立レビューで修正を導く。<br><br>実験では、VTRでの指示追従とR2Mでのシーン整合性で最先端、直接生成より物理的妥当性が向上し、比較したCode2Videoベースラインより視覚的リアリズムが高いことが示された。長尺動画でも事象構造と連続する相互作用の整合性が改善したが、遷移の安定性とシーン設定への忠実さには限界が残った。出典：arXiv","timestamp":1795114318000,"title":"Coda-DaVinci: Reimagining Video Generation with Code2Video","titleJa":"Coda-DaVinci――Code2Videoによる動画生成の再構想","url":"https://arxiv.org/abs/2611.26595"},{"authors":["Adrià Ciurana Lanau","Harleen Hanspal","Lusine Abrahamyan","Emilio Tylson Baixauli","Yu Cao","Danai Triantafyllidou","Stefano Zorzi","Gustavo Zanoni Felipe","Peter Griger","Stefan Sietzen","Petru-Daniel Tudosiu"],"categories":["cs.AI"],"field":"cs.AI","genre":"Vision / Multimodal","monthKey":"2026-11","publishedAt":"2026-11-19T18:45:31Z","source":"arXiv","summaryHtml":"グラフィックデザインはRGBA層の順序ある合成であり、層の分離が選択・移動・再利用を可能にする。既存の多層モデルは各層を全画面または領域サイズの空間潜在グリッドで表すため、表現サイズは層の空間範囲の合計とともに増大する。本研究は、多層変分オートエンコーダProtoVAEに基づく潜在拡散フレームワークProtoDiffusionを提案する。<br><br>ProtoVAEはデザインを1つの共有空間プロトタイプと層ごとの候補ベクトル1つに符号化し、各候補が共有デコーダを条件づけて対応するRGBA層を再構成する。N層の表現はバックボーン固有のパッキング前でHW+Nトークンとなり、層ごとの全グリッド表現のNHWと比べて大幅に小さい。ProtoDiffusionはプロトタイプと固定数の候補スロットを画像またはテキストを条件として共同でノイズ除去し、境界ボックスを任意のレイアウト指示として使える。不要なスロットは空のままにし、層数とレイアウトを入力なしに決定する。<br><br>画像からデザインへの生成とテキストからデザインへの生成の両方に対応する。ProtoVAEは層クロップで40.43dBのPSNRを達成し、LayerD評価では画像からの生成でRGB L1が境界ボックスあり0.040、なし0.057、ボックス誘導のアルファsoft IoUは0.850で最強の微調整ベースライン（0.871）に匹敵した。テキストからの生成では統合画像のFIDが66.41でFLUX.2の86.84を上回り、テキスト精度0.860、生成後分解カスケードの19.1倍の速度で動作した。出典：arXiv","timestamp":1795113931000,"title":"ProtoDiffusion: Token-per-Layer Generative Modeling of Multi-Layer Images","titleJa":"ProtoDiffusion――層ごとのトークンで多層画像を生成する拡散モデル","url":"https://arxiv.org/abs/2611.26586v1"},{"authors":["Sean Tang","Peiran Wang","Ying Li","Esha Shivakumar","Tao Meng","Yuan Tian"],"categories":["cs.CR","cs.AI","cs.SI"],"field":"cs.CR","genre":"Ethics / Safety","monthKey":"2026-11","publishedAt":"2026-11-19T18:33:42Z","source":"arXiv","summaryHtml":"生成エンジンは検索したウェブページを合成して回答や推薦、順位付けを作る。生成エンジン最適化（GEO）サービスは、ユーザー生成コンテンツ（UGC）プラットフォームに宣伝記事を載せ、依頼主の可視性をその回答の中で売る。医療や金融の分野では、誤解を招く助言が害を及ぼすおそれがある。<br><br>本研究は、中国の主要UGCプラットフォーム3つで、そうした有料コンテンツ運用の1件を測定した。関連アカウント1,985件、推定46万6,357件の宣伝配置を発見。ネットワークは多様な商品を扱い、数か月にわたり複数プラットフォームで連携キャンペーンを展開し、リスト記事の内容を進化させていた。米中9つの生成エンジンで、引用可能なページの4.5〜20%が同ネットワークに由来した。<br><br>8つのエンジンでは回答の52%で依頼主が名指しされ、カテゴリ首位の68%に迫る。UGCへのGEO配置が生成エンジンの結果に影響を与える実効性が示され、内容レベルの防御だけでは不十分で、アカウント単位・プラットフォーム単位の信号が必要だと結論づけている。出典：arXiv（cs.CR）","timestamp":1795113222000,"title":"GEOHunter: Mapping a Generative Engine Optimization Network in the Wild","titleJa":"生成エンジン最適化の闇市場を暴く――1,985アカウント・46万件の宣伝配置","url":"https://arxiv.org/abs/2611.26564"},{"authors":["Jinzhe Li","Qi Wang","Dandan Guo","Li Liu","Yuan Wu","Yi Chang"],"categories":["cs.AI"],"field":"cs.AI","genre":"Vision / Multimodal","monthKey":"2026-11","publishedAt":"2026-11-19T18:25:41Z","source":"arXiv","summaryHtml":"マルチモーダル意思決定モデルが行動やモデレーション、品質判断を担うとき、その信頼性は、提示の仕方が変わっても意味的な判断を保ち、無関係な追加情報を無視し、証拠と整合する情報と矛盾する情報を見分けられるかにかかっている。既存の評価は意思決定インターフェースの偏りとマルチモーダルモデルの挙動を別々に扱ってきた。<br><br>MM-SystemOneBiasは9つの公開データセットから集めた5323事例、11タスク場面で13モデルを評価し、選択肢の順序・ラベル、外部判断、画像とテキストの記述、無関係情報、評価尺度の6種の介入を対で与える。7組の決定モデルとバックボーンの比較では、決定モデルのほうが順序・ラベル・無関係情報・評価尺度の変化に対して安定していた。<br><br>一方で、意味的な判断が変わらない組でも回答確率の平均絶対変化は4.56〜11.55ポイントに及び、正答率だけでは見えない入力の影響が残ることが示された。決定モデルは正しい外部判断から得る精度の伸びも小さく、整合的な記述による好ましい変化も小さいという両面があった。出典：arXiv","timestamp":1795112741000,"title":"MM-SystemOneBias: Evaluating Bias in Multimodal Jev-Style System One Decision Models","titleJa":"MM-SystemOneBias――マルチモーダル意思決定モデルの偏りを6種の介入で測る","url":"https://arxiv.org/abs/2611.26557"},{"authors":["Yunqi Zhao","Run Peng","Ze Dong","Ryan Lu","Yinpei Dai","Joyce Chai"],"categories":[],"field":"cs.AI","genre":"Agents / Robotics","monthKey":"2026-11","publishedAt":"2026-11-19T17:45:07Z","source":"arXiv","summaryHtml":"リアルタイムのタスク誘導は本質的に柔軟である。エージェントがユーザーを作業へ導くとき、複数の応答やタイミングが適切であり、時には黙っていることが最善になる場合もある。ところが既存のベンチマークは、合成された対話を何を言うべきか・いつ言うべきかの固定された目標として扱い、この柔軟さを見落としてきた。<br><br>FLUIDは、マルチモーダルなタスク誘導における柔軟な相互作用をモデル化・評価・実現する統一フレームワークである。実際の人間同士の誘導記録（WTaGとHoloAssist）を用い、介入をその根拠・必要性・タイミングの柔軟性に結びつける。この表現を、柔軟な誘導の評価とリアルタイムエージェントの構築の両方に用いた。エージェントは応答の正しさ・介入の精度・タイミングのよさ・遅延の総合バランスで、評価したシステムの中で最も優れていた。一方で、発話の重なりを避ける点にはまだ改善の余地があるという。<br><br>FLUIDは状況に応じたタスク誘導を、硬直した参照マッチングから、より自然で適応的な人間とAIの相互作用へと進めるものだ。出典：arXiv","timestamp":1795110307000,"title":"FLUID: Flexible, Evidence-Grounded Situated Task Guidance","titleJa":"「FLUID」――状況に応じた柔軟なタスク誘導――黙るべき時を知るエージェント","url":"https://arxiv.org/abs/2611.26491"},{"authors":["Leah von der Heyde","Florian Keusch","Trent D Buskirk","Adam Eck"],"categories":[],"field":"SocArXiv","genre":"LLM / NLP","monthKey":"2026-11","publishedAt":"2026-11-19T17:23:25Z","source":"OSF Preprints","summaryHtml":"大規模言語モデル（LLM）は調査・世論研究の全過程を急速に変えているが、既存の概観は非体系的だったり、範囲が狭かったり、理論中心だったりした。本システマティックレビューは実証文献136件を定量・定性の両面から評価し、データ収集の前・中・後でLLMが何に使われ、どの用途に適し、どれが未開拓かを整理した。2025年までの研究はテキスト分類、調査データの生成、調査票の開発に集中していた。<br><br>多様な研究デザインがありえたにもかかわらず、多くの研究はGPT系モデルをゼロショットで英語圏に適用しており、個別研究の一般化可能性と再現性に疑問が残る。それでもLLMは、細かな個人の態度や構成概念より、広く代表された集計パターンの近似に適していた。LLMは人間を置き換えるのではなく支援するものと位置づけられる。<br><br>今後は慎重なモデル選択、報告基準、調査専用ベンチマークが分野を前進させる。モデル公開の速さと丁寧な評価に要する時間のあいだに緊張はあるが、調査方法論者は人間がキュレーションした入力と検証に依存しつつLLMを採用できる立場にある。出典：OSF Preprints","timestamp":1795109005000,"title":"AI in the Loop?! A Systematic Review of the Use of Large Language Models in Survey and Public Opinion Research","titleJa":"調査・世論研究における大規模言語モデルの利用――システマティックレビュー","url":"https://osf.io/preprints/socarxiv/eubj4_v2/"},{"authors":["Shihan Wu","You Liu","Chunyu He","Minghui Qin","Longhan Jiao","Jinbang Guo","Shaoxuan Xie","Kaixi Tian","Wenjie Chen","Jingrui Pang","Yuanhang Zhang","Yichi Zhan"],"categories":["cs.CV","cs.RO"],"field":"cs.CV","genre":"Agents / Robotics","monthKey":"2026-11","publishedAt":"2026-11-19T17:09:25Z","source":"arXiv","summaryHtml":"一人称の操作データセットは、観察と行動のペアを原子単位として扱い、意図の状態をポリシーネットワークの重みに圧縮してしまうため、意図は観測できなかった。人の運動制御の研究では、意図が観察と行動のあいだを媒介し、決定から効果までの経路に痕跡を残すことが知られている。視線は手より先に目標へ届き、筋負荷は接触前に高まり、皮質活動は運動指令に先行する。<br><br>HumanCOINは、この意図の経路を大規模に記録する一人称操作データセットで、38の場面クラスにわたり計12,500時間に及ぶ。出力側のL1注意層（10,000時間）はヘッドバンドカメラの映像から視線を推定し、次に注意・到達する対象を手の動きの前に示す。中間のL2負荷層（2,000時間）はアームバンドの表面筋電を記録し、実行完了前の負荷期待を読み取れる。起点のL3認知層（500時間）は頭皮脳波を記録し、課題決定の早期読み取りを可能にする。各層は下位層のプロキシをすべて継承する。<br><br>さらに多視点RGB画像・深度マップ・点群、頭部と手首の6自由度ポーズ、ステップ単位の行動・物体アノテーションを備える。統制されたL3環境では視線・手の姿勢・指の運動学も直接測定し、時計と較正データも公開する。視覚と行動のペアの背後にある過程を、データセット規模でモデル化できるようにする。出典：arXiv（cs.CV）","timestamp":1795108165000,"title":"HumanCOIN: A 12,500-Hour Dataset for Human Intent in Egocentric Manipulation","titleJa":"人の「意図」を12,500時間記録――一人称操作データセットHumanCOIN","url":"https://arxiv.org/abs/2611.26434"},{"authors":["Vishesh Kumar Singh","Sayak Ray Chowdhury"],"categories":["cs.LG"],"field":"cs.LG","genre":"LLM / NLP","monthKey":"2026-11","publishedAt":"2026-11-19T17:00:42Z","source":"arXiv","summaryHtml":"Best-of-Nなどの推論時アライメントは、プロンプトごとに複数の候補を生成して報酬モデルで選ぶことで言語モデルの出力を改善する。しかしプロンプトごとに必要な計算量は大きく違うのに固定の予算を使うため、コストの多くが無駄になる。回答が収束したと見えたら止める適応的手法もあるが、閾値はヒューリスティックで、早期停止の誤りを統計的に制御できない。<br><br>本研究は、誤り許容度αを入力として受け取り、ある回答が生成分布の下で過半数（θ＞1/2）を占めると証明できた時点でのみ停止する、anytime-validな停止規則を提案する。候補を最終回答ごとに集約し、報酬重み付き自己整合性（RWSC）スコアで評価して、停止を逐次検定として扱う。Waldの逐次確率比検定（SPRT-RWSC）は経験的には良好だが、先頭の回答がサンプリング途中で変わるため保証が崩れる。<br><br>主提案のe-RWSCは、Waldの検定を各回答に対するベッティング・スーパーマルチンゲール（e-process）で置き換え、優位でない回答を証明してしまう確率を、時間と回答全体にわたりα以下に抑える。RWSCスコアは証明の速さにのみ影響し、妥当性には影響しない。証明に必要な標本数はO(log(1/α)/d_KL)で、複数の言語モデル・データセット・報酬モデルでの実験が1/d_KLスケーリングを確認し、大幅に少ないトークンコストでベースラインより高い精度を示した。出典：arXiv（cs.LG）","timestamp":1795107642000,"title":"Sequential Anytime Valid Tests for Efficient Inference-Time Alignment","titleJa":"推論時アライメントを効率化する逐次 anytime-valid 検定","url":"https://arxiv.org/abs/2611.26413"},{"authors":["Weile Li","Yunfan Lou","Muqing Shi","Zihao Zhang","Zhenbiao Huang","Boxian Yao","Xiyu Zhu","Zhibo Pang"],"categories":["cs.RO","cs.CV"],"field":"cs.RO","genre":"Agents / Robotics","monthKey":"2026-11","publishedAt":"2026-11-19T16:53:19Z","source":"arXiv","summaryHtml":"視覚言語行動（VLA）モデルには、視覚では捉えにくい接触を捉えるため触覚センサが加えられてきた。しかし触覚入力の追加は効果がまちまちで、触覚にほとんど頼らないモデルもある。グリッパー閉鎖時のゲル変形など、触覚変化の多くは視覚観察と実行した行動から予測できるためだ。<br><br>TacInnoは、視覚と実行行動では説明できない接触ダイナミクスだけを「触覚イノベーション」として切り出し、訓練目標として用いる。視覚観察と実行行動を条件とするトークナイザが、将来の触覚変化を離散コードに圧縮し、ポリシーTacInno-VLAがそのコードを予測する。展開時にコード用のモジュールを追加しない。<br><br>シミュレーション6課題で平均成功率87.5%、実世界4課題で70.5%を達成し、最強の視触覚ベースラインをそれぞれ10.7ポイント、9.0ポイント上回った。アブレーションにより、視覚・行動条件付け、多フレーム符号化、補助コード予測の寄与が確認された。触覚イノベーションが接触の多い操作の監督信号として有効だと示された。出典：arXiv（cs.RO）","timestamp":1795107199000,"title":"TacInno: Teaching Vision-Language-Action Models the Contact Dynamics Beyond Vision and Action","titleJa":"視覚と言語と触覚のあいだ――接触の「予測できない変化」だけを学ぶTacInno","url":"https://arxiv.org/abs/2611.26405"},{"authors":["Oriol Alàs","Ian Palacín","Iván Cester","Edgar Rubión"],"categories":["cs.IR","cs.AI","cs.CL"],"field":"cs.IR","genre":"Agents / Robotics","monthKey":"2026-11","publishedAt":"2026-11-19T16:49:04Z","source":"arXiv","summaryHtml":"EUの資金提供プロジェクトは成果物や報告書、事例研究の形で膨大なエビデンスを生むが、知識はプロジェクトや文書構造をまたいで散在し、意思決定の場面で関連する文脈情報を探すのが難しい。本論文は、異種のプロジェクト文書をドメイン認識の知識ベースに統合し、エージェント型の検索拡張生成パイプラインで適応的にアクセスするエージェント型AIエコシステムを提案する。IMPETUS、NATALIE、InnWaterの3プロジェクトの文書を階層的なセクションツリーに再構成し、構造化メタデータ付きで索引化した。<br><br>検索は水と気候のドメインデータで微調整した2つのドメイン特化埋め込みモデルで支える。ReAct式のコントローラーがドメインコレクション間で検索予算を配分し、停止条件を満たすまで証拠を蓄積しながら検索行動を反復調整する。<br><br>コーパスに対する検索ベンチマークで、単一ドメイン埋め込みのベースラインと比べ平均逆順位が26.7%（相対値）改善し、プロジェクト横断の知識統合と気候レジリエンスに資する意思決定を支える関連エビデンスをより安定的に取り出せることが示された。出典：arXiv","timestamp":1795106944000,"title":"Democratizing Cross-Project Knowledge for Transforming Water Governance and Climate Resilience: an Agentic AI Ecosystem","titleJa":"プロジェクト横断知識の民主化――水ガバナンスと気候レジリエンスを変えるエージェント型AIエコシステム","url":"https://arxiv.org/abs/2611.26398"},{"authors":["Ziyang Xu","Peng Han","Hai Zhou"],"categories":["cs.RO"],"field":"cs.RO","genre":"Agents / Robotics","monthKey":"2026-11","publishedAt":"2026-11-19T16:44:10Z","source":"arXiv","summaryHtml":"多様な将来行動をカバーしつつ力学的整合性を保つことが、マルチモーダルな軌跡予測の課題だ。既存の生成型予測器はフレームごとの位置を直接進化させるため、位置・速度・加速度の関係が暗黙のままになる。本研究は、将来の加速度の離散コサイン変換（DCT）係数を生成状態とする条件付きフローマッチング枠組みSpecFlowを提案する。ガウスノイズから加速度スペクトルへの輸送を学習し、最後の観測状態を起点とする固定の解析的積分で速度と位置を再構成する。<br><br>行き先の不確実性には、観測文脈だけから候補行き先と信頼度を出すエンドポイント予測器を用い、最も信頼度の高い候補がスペクトル・デノイザーの条件になる。軌跡仮説とエージェントに対する交互アテンションが多様性と相互作用を捉える。位相空間全体を監督する統合目的関数が運動学の3水準すべてを学習する。<br><br>best-of-20評価で、ETH/UCYで平均minADE/minFDE 0.15/0.22、NBAで4秒先0.69/0.86、SDDで7.38/11.57を達成した。ETH/UCYの全5シーンで最先端、NBAの4秒ADEで最小を記録した。歩行者の滑らかな動きからスポーツの協調動態、屋外の多様な軌跡まで、加速度スペクトルの生成状態が有効だと示された。出典：arXiv","timestamp":1795106650000,"title":"SpecFlow: Flow Matching in the Acceleration Spectrum for Multi-Agent Trajectory Forecasting","titleJa":"SpecFlow――加速度スペクトルでのフローマッチングによるマルチエージェント軌跡予測","url":"https://arxiv.org/abs/2611.26390"},{"authors":["Ziyue Wang","Yaopeng Yang","Liyi Zhou"],"categories":["cs.RO"],"field":"cs.RO","genre":"Agents / Robotics","monthKey":"2026-11","publishedAt":"2026-11-19T16:37:10Z","source":"arXiv","summaryHtml":"視覚・言語モデル（VLM）はタスクや領域をまたいで広く汎化するが、ロボット操作では同等の汎化が難しい。ロボットの身体、タスクの定式化、幾何学的な慣習、行動インタフェースの異質性が、ベンチマークやハードウェアをまたいだ相互作用の経験を分断している。本研究はロボット技能の学習を「アライメント」から捉え直す。ベンチマークや身体をまたいだ異種の相互作用が、ロボット操作の共有スキルセットを共同で改善できるかを問う。<br><br>提案するUniCraftは、異種の設定を揃えることでロボット操作技能を学ぶ枠組みである。観測した場面の幾何学を一貫した座標慣習で表現し、ロボットをまたいで知覚と制御のインタフェースを揃える。異なるベンチマークのタスクを正準形式で整理し、デモンストレーションやモデルの重み更新なしに、相互作用のフィードバックで共有技能と、それらの選択・合成を導く編成ポリシーを共同で洗練させる。<br><br>3つのベンチマークと6つの身体でタスクを交互に実行し、エージェントモデルあたり2,700回の学習ロールアウトを収集した。訓練中、未見の場面とタスクでのタスク成功率は、LIBERO-PROで9〜28ポイント、RoboTwin 2.0で10.8〜13.3、RoboCasa365で3.1〜14.4向上した（エポック1〜3）。訓練後、学習した技能を凍結した状態で、robosuiteとRoboDojoにおいて4つの新しいロボット身体と5つの追加エージェントモデルへのゼロショット転移を示した。出典：arXiv（cs.RO）","timestamp":1795106230000,"title":"Alignment Drives Reuse: Learning Generalizable Robot-Use Agents from Heterogeneous Experience","titleJa":"アライメントが再利用を駆動する――異種の経験から汎用的なロボット操作エージェントを学ぶ","url":"https://arxiv.org/abs/2611.26376"},{"authors":["Han Xiao","Zhiyong Bao","Xiaotong Liu","Yanhao Chen","Qingqiang Wu"],"categories":["cs.AI"],"field":"cs.AI","genre":"Vision / Multimodal","monthKey":"2026-11","publishedAt":"2026-11-19T16:33:02Z","source":"arXiv","summaryHtml":"ワールドモデルは物理的相互作用のシミュレーションに使われているが、環境ごとに別々のモデルを訓練する方法では拡張性に限界がある。環境をまたいで予測するには現在の物理法則を特定する必要があるが、外見だけでは分からないこともある。本研究は「視覚的キャリブレーション」を検討する。短い動画の中の物体の動きと相互作用を直接の証拠として現在の法則を推論し、別の初期状態での運動を予測する。<br><br>ただし物理条件ごとのデータ量の違いがロングテール分布を生み、証拠が珍しい法則を支持していても、モデルが一般的な法則へ偏ってしまう。そこで、実演された法則の転移を初期状態をまたいで評価し、訓練の不均衡とキャリブレーションの情報量を独立に制御できるベンチマークTailWorldを導入した。同じ予測初期状態から、実演された法則に従う未来と一般的な法則に従う未来という2つの参照未来と比較し、一般的な動力学への予測バイアスを測る。<br><br>さらに、法則が物体の動きにどう影響するかを学び、キャリブレーションの相互作用から現在の法則を推論して新しい初期状態に適用するRule Inference for Transfer（RIFT）を提案する。RIFTは訓練頻度が法則推論に与える影響を明示的に制御し、十分に情報のある観測証拠が珍しい法則を支持できるようにする。TailWorldでの実験では、訓練の不均衡や分布シフトが変化しても、RIFTは予測精度と物理的一貫性を改善し、特に珍しい動力学の予測で向上した。出典：arXiv（cs.AI）","timestamp":1795105982000,"title":"World Models Favor Learned Priors over Visual Evidence","titleJa":"ワールドモデルは視覚的証拠より学習済みの事前分布を優先する","url":"https://arxiv.org/abs/2611.26366"},{"authors":["Ambroise Borbely","Mathieu Salzmann","Olivier Verscheure"],"categories":[],"field":"cs.LG","genre":"LLM / NLP","monthKey":"2026-11","publishedAt":"2026-11-19T16:31:46Z","source":"arXiv","summaryHtml":"大規模言語モデルの注意機構は、すべてのクエリとキーを完全な内積で照合する。本研究はその内積をすべて計算する必要があるのかを問い、隠れ次元で疎にする手法HiSA（Hidden Sparse Attention）を提案する。クエリとキーの射影はそのままに、トークン位置で決まる静的な無パラメータ規則に従って内積の一部だけを計算する。<br><br>回転位置埋め込み（RoPE）の構造に基づき、キーとクエリを省略可能な部分へ分解する。HiSAでゼロからLLMを学習させたところ、クエリ・キー積の約3分の1だけの計算で、完全な内積と比べて性能が損なわれるどころか向上した。推論時にはデコードが高速化し、メモリ使用量も削減される。FlashAttention-3カーネルへの拡張も行われた。<br><br>密な注意機構は、HiSAが落とすスコア成分を自ら抑制するように学習することも示された。トークン単位ではなく隠れ次元での疎性という、これまであまり探られていなかった軸に着目した点が新しい。計算量を約3分の1に抑えながら性能を上げる、効率と性能の両立が示された。出典：arXiv","timestamp":1795105906000,"title":"HiSA: Sparsifying the Hidden Dimension of RoPE Attention in LLMs","titleJa":"注意機構を隠れ次元で疎にする――LLMの高速化と性能向上を両立するHiSA","url":"https://arxiv.org/abs/2611.26363"},{"authors":["Reflection Team"],"categories":[],"field":"cs.CL","genre":"LLM / NLP","monthKey":"2026-11","publishedAt":"2026-11-19T16:28:23Z","source":"arXiv","summaryHtml":"大規模言語モデルの推論コストを下げつつ最先端の推論性能を狙う、スパースMixture-of-Expertsモデル「Beam」の技術報告である。総パラメータ5013億、推論時に活性化するのは234億で、コーディング・推論・エージェント作業に特化して設計された。23.8兆トークンで事前学習し、検証可能な正解データを用いた2段階の中間学習により100万トークンの文脈長を実現した。<br><br>学習後の強化学習は1万500基のGB300 GPU上で完全非同期に行われ、4週間で1億回以上のロールアウトを生成した。評価では強化学習の計算量を増やすほど能力が向上し続け、頭打ちの兆しは見られなかったという。FP8とNVFP4の量子化、19.3億パラメータの投機的デコーディング用ドラフター「DFlash 2」により、供給スループットも高めている。<br><br>安全性の評価では、有害な要求の88.9%を拒否または回避し、無害な要求の81.5%に応答した。オープンウェイトモデルの中では最良の拒否・回避率だとされる。同クラスのモデルと比べて3〜4分の1の推論計算量で最先端レベルの推論を実現した点が特徴である。出典：arXiv","timestamp":1795105703000,"title":"Beam Model Technical Report","titleJa":"「Beam」――コーディング・推論・エージェント特化の5010億パラメータMoEモデル","url":"https://arxiv.org/abs/2611.26358"},{"authors":["Xufei Tian","Han Hu","Wenli Du"],"categories":["cs.AI"],"field":"cs.AI","genre":"Agents / Robotics","monthKey":"2026-11","publishedAt":"2026-11-19T16:19:56Z","source":"arXiv","summaryHtml":"複数のタスクを別々のエージェントセッションで並行管理すると、人の注意力はすぐに尽きる。そこで常駐型パーソナルエージェントが一つの連続インターフェースの背後で動く構想がある。だが交錯する対話や外部イベントを一つの直線セッションに流し込むと、話題間の制約が漏れ出し、先頭の処理が詰まる。逆にルーター階層では散文的な引き継ぎで情報が失われ、真の競合があるリポジトリマージの成功率は3回平均33.3％まで落ちる。<br><br>本論文は、擬人化された役割のスケジューリングではなく、コンテキストブロックそのものを仮想化するルーターレスアーキテクチャ「ClonAct」を提案する。単一パスの非生成的なContext MMU、インプレースのContext Cell、フットプリントを意識したSynaptic Bus、隔離された試行マージゲート、波状フラッシュされるShared Trunkからなる。<br><br>3種のプログラム型マルチストリームベンチマークと3モデルファミリーでの評価で、試行マージゲートは真の競合マージを63.3％まで引き上げ、ClonActはその上限を45.9％少ないプロンプトトークンで達成し、小型モデルのルーター崩壊も防いだ。連続する急増ストリーム下でも最高水準の完了率95.0％を維持し、待機時間の中央値は最も低く、タイムアウトした状態確認はゼロだった。出典：arXiv","timestamp":1795105196000,"title":"Context as a Resource","titleJa":"コンテキストを資源として――常駐パーソナルエージェントのためのルーターレス仮想化アーキテクチャClonAct","url":"https://arxiv.org/abs/2611.26346"},{"authors":["Handa Li","Pengxiang Li","Mingyu Cao","Xilu Wang","Li Shen","Da Li","Lu Yin"],"categories":["cs.CL"],"field":"cs.CL","genre":"LLM / NLP","monthKey":"2026-11","publishedAt":"2026-11-19T15:40:24Z","source":"arXiv","summaryHtml":"拡散言語モデルは並列生成ができるが、1ステップで確定できるトークンは一部だけで、多数のノイズ除去ステップが必要になる。既存の高速化は確信度の学習や確定ポリシーの最適化に頼ってきたが、1回の順伝播の出力だけを操作するため、プロンプトや未確定トークンの情報が十分に統合されていないまま確定判断が下される問題があった。<br><br>dLoopは事前学習済み拡散言語モデルをPrelude-Loop-Coda構造に組み替え、パラメータ共有の中間ブロックを同じ部分的マスク状態に繰り返し適用する。ノイズ除去を進めるのではなく、ループごとに潜在計算を重ね、未確定位置の情報を統合してから確定させる仕組みである。<br><br>GSM8K、MATH、MBPP、HumanEvalのすべてで最高または同点最高の精度を達成し、Fast-dLLMやdParallel、d3LLMとの比較でも精度と計算効率の両面で優位を示した。ループを増やすほど不安定な軌跡での改善が大きく、未確定位置の更新が後の生成に影響することも確認された。確信度を強制するのではなく、確定前の潜在計算を増やすという別方向の高速化である。出典：arXiv","timestamp":1795102824000,"title":"dLoop: Looped Diffusion Language Models via Recurrent Latent Refinement","titleJa":"dLoop――ループする拡散言語モデル、潜在状態の反復精緻化で推論を加速する","url":"https://arxiv.org/abs/2611.26275"},{"authors":["Zheyuan Liu","Chuhan Wang","Jinduo Guo","Yue Huang","Xiangchi Yuan","Ningshan Ma","Meng Jiang"],"categories":["cs.RO"],"field":"cs.RO","genre":"Agents / Robotics","monthKey":"2026-11","publishedAt":"2026-11-19T15:14:55Z","source":"arXiv","summaryHtml":"視覚・言語・行動（VLA）モデルは、視覚観察と言語指示から多様なロボット作業を可能にする。これまで禁止された行動の抑制や拒否は研究されてきたが、実行が始まった後で禁止行動を止め、その後の物理的な反応を制御することは難しいままだった。本研究の評価では、初期状態からタスクを抑制できるポリシーでも、実行途中で引き継ぐとタスクを完遂してしまうことが判明した。<br><br>さらに、タスクが未完に終わってもロボットが把持物を落とす恐れがあり、「完遂しなかった」だけでは安全性の尺度として不十分だった。そこで本研究は、把持を維持することが適切な代替応答になるタスクを対象に、State-Aware Fallback Imitation（SAFI）を提案する。2段階からなり、（1）禁止タスクのデモンストレーション全体に静止アーム指令と一貫したグリッパー目標を割り当てるフォールバック目標構築、（2）それを保持タスク本来の行動と同時に学習する共同ポリシー適応である。<br><br>この監督により、実行途中の状態でも明示的な代替応答を学びつつ、ロボットの他の技能を維持できる。OpenVLA-OFTを用いたLIBEROとBadLIBEROでの広範な実験では、禁止タスクの完遂、物理的事故、保持タスクの性能を評価した。評価したLIBEROタスクでは、引き継ぎ後の目標達成率は合計1.3％まで下がり、物理的事故や動作飽和は記録されず、保持タスクの成功率も高く維持された。出典：arXiv（cs.RO）","timestamp":1795101295000,"title":"Teaching Vision-Language-Action Models to Stop Safely","titleJa":"視覚・言語・行動モデルに安全な停止を教える","url":"https://arxiv.org/abs/2611.26239"},{"authors":["Jiaming Li","Lingzhen Li","Xiaze Yang","Chenyu Zhu","Kaiqi Liu","Xiaotong Zhao","Songlian Li","Toyota Li","Alan Zhao","Haobin Zhong","Yue Ma","Zhiyuan Ma"],"categories":["cs.CV"],"field":"cs.CV","genre":"Vision / Multimodal","monthKey":"2026-11","publishedAt":"2026-11-19T14:50:59Z","source":"Hugging Face Papers","summaryHtml":"動画ワールドモデルは対話的生成を進歩させ、大規模モデルは高品質を、小規模モデルは高速な推論をもたらす。既存の投機的手法は、高速なドラフト生成と、デコードされたフレームへの報酬に基づく選択的なターゲット再生成で両者の長所を組み合わせる。だが検証は外部スコアラーの評価次元だけを覆い、デコードと採点のコストが加わる。さらにスコアは修正を与えず、棄却されたドラフトにはコストの高いターゲット再生成が必要だった。<br><br>本研究は、学習不要の統合推論フレームワークであるSpeculative World Model（SpecWM）を提案する。ターゲットの潜在速度場を用いてドラフトのチャンクを検証する。検証は再利用可能な修正も生み出し、2つのしきい値が受理・洗練・棄却を選ぶ。1ステップの洗練は知覚品質を高め、3ステップの洗練はカメラ追従と軌跡の一貫性を強化する。<br><br>WBench Navigationでは、ターゲットに対して1.63倍の速度で視覚品質を改善し、NavScoreをドラフトの75.99から85.63へ引き上げ、品質・速度・制御の最良のトレードオフを達成した。長期・多ターンのロールアウトでも品質と制御が持続し、Hy-Nomasでの実験により複数のバックボーンとノイズ除去予算にわたる有効性が確認された。出典：Hugging Face Papers（cs.CV）","timestamp":1795099859000,"title":"SpecWM: Turning Verification into Refinement for Streaming World Models","titleJa":"SpecWM：検証を洗練へ変えるストリーミング・ワールドモデル","url":"https://arxiv.org/abs/2611.26211"},{"authors":["Yu Zhao","Jiaxin Zhang","Rohit Saxena","Fazl Barez","Pasquale Minervini","Yiwen Guo"],"categories":[],"field":"cs.CV","genre":"Vision / Multimodal","monthKey":"2026-11","publishedAt":"2026-11-19T14:43:17Z","source":"arXiv","summaryHtml":"画像で考える（TwI）は、視覚言語モデルが細部を切り取ってズームすることで知覚のボトルネックを越え、精度と解釈可能な領域接地推論の両方を約束する手法である。しかし精度の向上は、ツール使用の誠実さを保証しない。モデルはズームした領域に実際には頼らずにツールを呼ぶことが多く、ツール支援推論の信頼性を損なっていた。<br><br>原因は学習データにある。ズームなしで答えられる問いでは、モデルは返された証拠を無視しても正解でき、学習が進むほどこの問題は悪化する。そこで本研究は、モデルの能力の変化に合わせて学習データを適応させ、ズームした証拠が正解に今も役立つ問いで学習する。小さな物体を特定して細部の検証可能な問いを作るデータ合成パイプラインと、ズームが不要なときはツールなしの回答を好む適応的報酬を組み合わせた。<br><br>その結果、推論の誠実さは大幅に向上し、視覚探索ベンチマークで最先端の性能を示した。V*で11.6%、HR-Bench 4Kで7.9%、8Kで9.4%の向上である。マルチモーダル幻覚ベンチマークでも既存のTwIベースラインを上回った。誠実さの向上は精度を犠牲にせず、推論過程を直接監督しなくても正しい学習データから両立できることが示された。出典：arXiv","timestamp":1795099397000,"title":"Learning to Think with Images Faithfully via Adaptive Data Selection","titleJa":"画像で考える推論の「誠実さ」を取り戻す――ズームの証拠を本当に使う学習法","url":"https://arxiv.org/abs/2611.26199"},{"authors":["Wei Dai","Jinkun Liu","Jiayi Chen","Han Liu","Wenbo Ding","Shaolun Huang"],"categories":["cs.RO"],"field":"cs.RO","genre":"Agents / Robotics","monthKey":"2026-11","publishedAt":"2026-11-19T14:41:34Z","source":"arXiv","summaryHtml":"視覚言語モデル（VLM）はツール経由で制御コードを書いて実行することで、閉ループのロボット利用エージェントとして動ける。しかしオープンウェイトのVLMを高性能な身体化エージェントにするには完全な事後学習スタックが必要だ。既成のオープンVLMは対話的なツール契約にまったく対応できず、強力な教師モデルは重みもトークン確率も出さないブラックボックスで、教師あり模倣だけではロールアウトの分布ずれで頭打ちになる。<br><br>本論文は3つの密接に結びついたパイプラインからなる「EmbodyAgent」を提案する。思考してからコードを書く契約のもとで強力な教師に問い、タスク成功で軌跡を選別するブラックボックス型データ合成、説明とプログラムを9BのオープンVLMに蒸留するSFT、実行時エラーを罰する報酬で学生のエピソードを最適化するオンライン強化学習である。3段階とも、視覚観察と7次元のエンドエフェクタ制御だけを出す原始関数なしのPython実行ツールで統一されている。<br><br>LIBERO Spatialの10課題での厳密な評価で、100のテスト状態に対する成功率はベースの0/100からSFT後14/100、強化学習後84/100へ上昇し、学習ロールアウトの成功率は8.4％から87.7％へ、エピソードあたりのモデル呼び出し回数の中央値は36回から11回へ減った。成果報酬型の強化学習が自己強化的な実行時エラーを生む問題も特定し、失敗分類の監視とサンプリング側のキュレーションで訓練を安定化させた。出典：arXiv","timestamp":1795099294000,"title":"EmbodyAgent: Post-Training Embodied VLM Agents via Distillation, SFT, and RL","titleJa":"EmbodyAgent――蒸留・SFT・強化学習による身体化VLMエージェントの事後学習","url":"https://arxiv.org/abs/2611.26196"},{"authors":["Ilia Zavidnyi","Alexander Kovrigin","Arina Puchkova","Kirill Gelvan","Sergey Titov"],"categories":["cs.LG","cs.AI"],"field":"cs.LG","genre":"LLM / NLP","monthKey":"2026-11","publishedAt":"2026-11-19T14:20:41Z","source":"arXiv","summaryHtml":"推論モデルはテスト時に長い回答を生成できるほど正確になる「テスト時スケーリング」が知られる。しかし検証可能な報酬による強化学習（RLVR）は通常、学習時のロールアウト長に固定の上限を設ける。本論文は、この上限が単なる学習コストの制御ではなく、モデルの振る舞いそのものを変えてしまうことを示した。<br><br>学習後、モデルは学習時の予算をほとんど超えてトークンを使わなくなる。予算付近ではベースモデルを上回るが、それ以上の予算では精度の伸びが止まり、ベースモデルを下回る。著者らはこの効果を「予算の内面化」と名づけた。Qwen3.5-4B、Gemma4-E2B、Nemotron-3-Nano-4Bの3モデルと、数学推論と手続き生成問題の2課題で確認され、数学で学んだ効果は科学やコーディングにも転移した。<br><br>対策の検討では、強いKL正則化や学習データの打ち切りを減らすことでスケーリングが一部保たれるが、予算内精度とのトレードオフがある。打ち切られたロールアウトに無理やり回答させる方法は内面化をほぼ消すが、予算内の利得も失われる。人工的に切り詰めた軌跡でのSFTでも同じ効果が再現され、RL特有ではなく長さで打ち切る事後学習一般の問題だと結論づけている。出典：arXiv","timestamp":1795098041000,"title":"Budget Internalization: Fixed-Budget RLVR Trades Test-Time Scaling for In-Budget Accuracy","titleJa":"予算の内面化――固定予算のRLVRはテスト時スケーリングと引き換えに予算内精度を上げる","url":"https://arxiv.org/abs/2611.26172"},{"authors":["Jiawei Xing","Li Wang","Xiangtao Meng","Chuanchao Zang","Rui Wen","Zheng Li"],"categories":["cs.CR","cs.AI"],"field":"cs.CR","genre":"Ethics / Safety","monthKey":"2026-11","publishedAt":"2026-11-19T13:45:20Z","source":"arXiv","summaryHtml":"視覚言語モデル（VLM）は生成型推論サービスとして広く使われており、自己回帰デコーディングでは応答の長さが遅延と計算コストを決める。敵対的な視覚入力で生成を長引かせ、サーバーの負荷を上げる可用性リスクが生じる。従来のエネルギー・遅延攻撃は勾配やロジット、トークン単位のフィードバックに依存しており、攻撃者が最終応答しか見られない場合にリスクが残るかは不明だった。<br><br>本論文は、最終応答だけを手がかりにVLMの生成を長引かせるブラックボックス攻撃「ChronoPatch」を提案する。応答長に導かれた進化的探索で視覚的な遅延アンカーを見つけ、部分空間で較正した決定ベース最適化で摂動の大きさを最小化する。4つのオープンソースVLMでは、5％の空間予算のもとで推論遅延が47.86％から293.34％、GPUエネルギー消費が41.44％から249.70％増加し、出力の繰り返しも増えた。<br><br>3つの商用VLM APIでも、APIあたり500クエリの予算で応答長が37.6％から81.5％、クライアントが観測する遅延が1.82倍から2.29倍に増えた。最終応答のみのアクセスでも成立する生成ベースの可用性リスクが示され、デプロイされた生成AIサービスには生成を意識した防御が必要だと結論づけている。出典：arXiv","timestamp":1795095920000,"title":"ChronoPatch: Black-Box Energy-Latency Attacks on Vision-Language Models","titleJa":"ChronoPatch――視覚言語モデルに対するブラックボックス型エネルギー・遅延攻撃","url":"https://arxiv.org/abs/2611.26117"},{"authors":["Jiahao Hu","Jingdong Du","Yichen Zhang","Yi Song","Zhenyu Zhang","Jiaxin Niu","Ruihang Li","Xiangzhao Hao"],"categories":["cs.CV"],"field":"cs.CV","genre":"Vision / Multimodal","monthKey":"2026-11","publishedAt":"2026-11-19T13:37:47Z","source":"Hugging Face","summaryHtml":"統一マルチモーダルモデルは視覚理解と生成を1つの枠組みで支えることを目指すが、従来手法は2つの課題の異なる要求に応えるため視覚表現やバックボーン計算を分離することが多く、統一の度合いが制限されていた。本研究は、事前学習済みの視覚言語モデルを広範なパラメータ共有のもとで直接統一モデルへ拡張できるかを検討するHiUniを提案する。<br><br>HiUniは言語整合済みViTと密なTransformerバックボーンを両能力で再利用し、課題固有の計算を出力側に限定する。ただしこの設計には2つの課題がある。ピクセル空間での生成は最適化が難しく、事前学習済みViTの意味的抽象化は合成に必要な細かい空間詳細を捨ててしまう。これに対処するため、直接的なピクセル空間最適化のためのPixel Diffusion Headと、出力段階近くで細粒度の空間詳細を与える軽量なHiGate経路を導入した。<br><br>実験では、HiUniは事前学習済みVLMと同程度の平均理解スコアを達成しつつ、画像生成と編集で競争力のある性能を示した。制御比較と分析により、課題固有のバックボーン計算なしに単一の密なバックボーンが両能力を効果的に支えられることが示され、統一マルチモーダルモデルへのより単純な道筋が示された。出典：Hugging Face","timestamp":1795095467000,"title":"HiUni: Harmonizing Understanding and Generation in Shared Visual Space","titleJa":"HiUni――理解と生成を共有の視覚空間で調和させる統一マルチモーダルモデル","url":"https://huggingface.co/papers/2611.26107"},{"authors":["John Won","Yonghoon Dong","Jinwoo Shin"],"categories":["cs.RO","cs.CV"],"field":"cs.RO","genre":"Agents / Robotics","monthKey":"2026-11","publishedAt":"2026-11-19T12:03:05Z","source":"Hugging Face Papers","summaryHtml":"ワールドモデルは行動のもとでの環境の力学を予測し、現実世界で実行することなく行動の結果を予測できるようにする。だが動画がますます現実的になる一方で、現在のワールドモデルは小さな行動変化が将来の観測にどう影響するかを捉えられないことが多い。ロボットの方策評価やモデルベース計画では、ほぼ同一の行動が質的に異なる結果を生むため、この欠点が利用を制限する。<br><
