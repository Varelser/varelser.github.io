  <script>
    const DATA = {"articles":[{"authors":["Giannis Daras","Marios Papachristou","Adam Klivans","Antonio Torralba","Constantinos Daskalakis"],"categories":["cs.LG","cs.AI","cs.CL"],"field":"cs.LG","genre":"LLM / NLP","monthKey":"2026-11","publishedAt":"2026-11-17T18:59:37Z","source":"arXiv","summaryHtml":"大規模言語モデルの事後学習では、事前学習に比べてはるかに小さいデータセットで教師あり微調整（SFT）を行うのが通例で、過学習と分布の裾野の破局的忘却を招きやすい。本論文は、凍結した事前学習モデルをノイズのある教師として活用し、微調整用のデータセットを補強する原理的な枠組み「Ambient SFT」を提案する。微調整後のモデルが出す条件付き分布を高温化したものが、事前学習モデルの高温化した分布と一致するよう求める。<br><br>温度ハイパーパラメータは事前学習モデルへの信頼度を制御する。高温化により分布の細部ではなく大まかな形を一致させる点が、ノイズのある教師からの学習を成立させる鍵だ。極限ではT→∞で通常のSFTに、T=1で知識蒸留に帰着する。手法はドメイン適応、指示チューニング、推論の各場面で標準的なSFTを上回り、平均で最大21%の相対的改善を示した。<br><br>データが乏しい事後学習でも、事前学習で得た知識を壊さずに引き継ぐ実践的な道筋を示すものだ。小規模データでの微調整における過学習対策として、温度という単一のつまみで制御できる点も実用的だ。出典：arXiv","timestamp":1794941977000,"title":"Ambient LLMs: Data-Efficient Supervised Fine-tuning via Temperature Matching","titleJa":"アンビエントLLM――温度マッチングによるデータ効率的な教師あり微調整","url":"https://arxiv.org/abs/2611.23229v1"},{"authors":["Rui Ning","Om Chabra","Hari Balakrishnan"],"categories":["cs.CV","cs.LG"],"field":"cs.CV","genre":"Vision / Multimodal","monthKey":"2026-11","publishedAt":"2026-11-17T18:59:27Z","source":"arXiv","summaryHtml":"視覚アクセシビリティ・エージェントやロボットでは、直近2分程度の映像について素早く問いに答える必要がある。注意機構とGated DeltaNetのような線形回帰層を交互に使うハイブリッド視覚言語モデルはこの用途に適するが、古いフレームを窓から外すたびに窓全体を再計算しなければならず高コストだった。回帰層の更新が状態に対してアフィンであることに着目し、各フレームの効果を合成可能な変換として捉える手法「Spool」を提案する。<br><br>各フレームの状態変換をキャッシュし、窓の進行に合わせて効率よく合成することで、期限切れフレームをバックボーンへの再入力なしに各回帰層の状態から除去できる。除去は各層内では厳密で、専用のデータ構造とGPUカーネルによりキャッシュと合成のオーバーヘッドを抑えた。訓練不要の枠組みである点も特徴だ。<br><br>5つのオープンソースのハイブリッドVLMと4つの動画推論ベンチマークによる評価では、20件のモデル・ベンチマーク組合せすべてで初回トークンまでのp95遅延が最小となり、直近のvLLMベースラインの速い方と比べて幾何平均6.6倍の短縮を達成し、精度も平均2.3ポイント向上した。出典： arXiv","timestamp":1794941967000,"title":"Spool: Low-Latency Streaming Inference for Hybrid Vision-Language Models","titleJa":"Spool――ハイブリッド視覚言語モデルの低遅延ストリーミング推論","url":"https://arxiv.org/abs/2611.23228"},{"authors":["Shobhita Sundaram","Cansu Sancaktar","Phillip Isola"],"categories":["cs.LG","cs.AI"],"field":"cs.LG","genre":"Agents / Robotics","monthKey":"2026-11","publishedAt":"2026-11-17T18:57:10Z","source":"arXiv","summaryHtml":"LLMエージェントは自らの学習を自ら進めるようになり、自己改善の手法はモデル最適化の各要素をモデル自身に委ねてきた。モデルが高性能化する中で、自己改善の「方法」まで人間が指定し続ける必要があるのか。本論文は、基本的なプリミティブとリソース、自己改善という一般的な目標だけを与え、エージェントが文脈ベースの最適化のための自己学習アルゴリズムを自ら構築する自律的パラダイムを検証する。<br><br>実験ではゲームをテストベッドとし、凍結したLLMエージェントに計算予算と経験収集・文書更新のツールを与え、外部から課された学習ループや実世界データなしに自由に実験させた。十分に高性能なモデルはこうした条件でも自己改善し、自己調整学習の古典的な認知枠組みや、自己生成カリキュラムに関する機械学習の知見と整合する方略を示した。<br><br>学習で生まれたテキストの成果物は外部ベンチマークにも転移し、ゲームの地平や力学、3Dナビゲーションを越えて改善が見られた。エージェントの自律的な学習能力がどこまで伸びるかを測る手がかりになる。出典：arXiv","timestamp":1794941830000,"title":"Do LLM Agents Still Need to Be Told How to Self-Improve?","titleJa":"LLMエージェントは自己改善の方法を教わる必要がまだあるか","url":"https://arxiv.org/abs/2611.23219v1"},{"authors":["S. M Seefat Alam"],"categories":["cs.CL","cs.LG"],"field":"cs.CL","genre":"Ethics / Safety","monthKey":"2026-11","publishedAt":"2026-11-17T18:57:08Z","source":"arXiv","summaryHtml":"大規模言語モデルの社会的バイアスを個々のアテンションヘッドに局在させ、切除によって除去する手法は、公平性指標の改善によって検証されるのが通例だ。しかし、ヘッドを選ぶ統計量が実際にバイアスを測っているという証拠は示されてこなかった。本論文はQwen-2.5-7B-InstructとLlama-3.1-8B-Instructでこの前提を監査する。<br><br>ヘッドのマップはラベルに依存しない応答長マップと強く相関した（ρ=-0.950と-0.768）。だが長さとラベルの結びつきを断つ介入により、この読みは退けられる。プロンプトを固定すると応答長が統計量の分散に占める割合は1%にすぎず、説明するのはプロンプトの同一性で分散の64%を占めた。固定プロンプト内では公平性ラベル、応答長、保護属性トークンの有無がφ=0.95で共線的であり、観察だけでは帰属は決定できない。<br><br>実質的な主張も成り立たなかった。バイアス選択性はどちらのモデルでも後層に集中しておらず、切除で不公平率を下げたヘッド集合はなかった。一方、その補集合は逆ラベルで評価すると拒否行動を確実に破壊し（p=2.7×10⁻⁵）、このパイプラインがその規模の効果を検出できることを示した。出典：arXiv","timestamp":1794941828000,"title":"What Does a Bias Head Measure? Non-Identifiability in Head-Level Bias Attribution","titleJa":"バイアスヘッドは何を測っているのか――ヘッド単位のバイアス帰属の非識別可能性","url":"https://arxiv.org/abs/2611.23218"},{"authors":["Yining Hua"],"categories":["cs.SE","cs.AI","cs.LG"],"field":"cs.SE","genre":"LLM / NLP","monthKey":"2026-11","publishedAt":"2026-11-17T18:56:42Z","source":"arXiv","summaryHtml":"新しいコーディングモデルはベンチマークのスコア向上を売りにするが、スコアが高いモデルが実際の仕事を多くこなすのかは検証されてこなかった。2026年6月12日、米国の輸出管理指令によりClaude Fable 5へのアクセスが19日間停止され、多くの利用者がSWE-Bench Proで11ポイント低いOpus 4.8へ移行せざるを得なくなった。本論文はこの停止を自然実験と捉え、人とプロジェクトは同じでモデルだけが変わる条件でFable 5の生産性への影響を分離した。<br><br>297人のFable 5利用者のGitHubプルリクエストを停止前後で追跡し、Opus 4.8を使い続けた8,908人の開発者を対照群とした。さらに2026年のモデル更新5件についても同様の比較を行った（1,208人、15,442件のプルリクエスト）。開発者と日付の固定効果を入れた差分の差分モデルで推定した結果、Fable 5へのアクセスは7日以内のプルリクエスト統合率を1.4ポイント上げるのみで、統計的に有意ではなかった。<br><br>モデル更新による統合率の上昇も見られず、加重平均はマイナス0.9ポイントで、5件の推定はすべて負だった。週あたりの統合件数にも有意な増加はなかった（+2.4%）。ベンチマークの得点向上がそのまま実務の生産性向上につながるわけではないことを示す結果だ。出典： arXiv","timestamp":1794941802000,"title":"Higher-Scoring Coding Models Did Not Get More Work Done","titleJa":"ベンチマーク高得点のコーディングモデルは、実務を多くこなしたか","url":"https://arxiv.org/abs/2611.23216"},{"authors":["John Gideon","Anshul Gupta","Megan Applegate-Kenton","Kayli Battel","Todd J Rowell","Patricio Reyes Gomez","Laporsha Dees","Emily Sumner","Avinash Balachandran","Guy Rosman"],"categories":["cs.CV","cs.LG","cs.RO"],"field":"cs.CV","genre":"Vision / Multimodal","monthKey":"2026-11","publishedAt":"2026-11-17T18:50:22Z","source":"arXiv","summaryHtml":"人間の認知状態（注意散漫やストレスなど）、視線、行動は運転環境と微妙に相互作用するが、認知状態レベルの正解ラベルを大規模に得るのはコストが高い。本論文は、障害ラベルをマスクされたトークンとして予測すると同時に、マスクされた視線と軌跡を再構成する自己教師あり目的を加えたマルチモーダル・マスク拡散オートエンコーダ「ID-MAE」を提案する。<br><br>検証のため、103時間の運転データ（被験者109人）と認知的・視覚的・情緒的な10種類の障害誘発を含む運転シミュレータデータセット「DIVERT」を導入した。視線、車両状態、シーン映像を記録している。ID-MAEはDIVERTと既存データセットの双方で障害推論を大幅に改善し、軌跡や視線の予測といった追加タスクでも強い結果を示した。<br><br>位置を一致させたペアでは、DIVERTにおける障害検出のペアAUCは再構成損失なしの0.590から0.706へ向上した。マスキング方式や位置エンコーディングなどの設計空間も検討し、視覚的要求の高い注意散漫と認知的注意散漫を分離できることも示した。コードとデータは受理後に公開予定だ。出典：arXiv","timestamp":1794941422000,"title":"Multimodal Masked Diffusion Autoencoder for Modeling Impaired Driving","titleJa":"マルチモーダル・マスク拡散オートエンコーダによる運転能力低下のモデリング","url":"https://arxiv.org/abs/2611.23211"},{"authors":["Gabriel Sarch","Declan Campbell","Nicholas Budny","Kia Ghods","Katerina Fragkiadaki","Jonathan D. Cohen","Brenden M. Lake","Taylor W. Webb"],"categories":["cs.CV"],"field":"cs.CV","genre":"Vision / Multimodal","monthKey":"2026-11","publishedAt":"2026-11-17T18:49:33Z","source":"arXiv","summaryHtml":"人間の視覚推論は、課題に関連する視覚的証拠を体系的に探索し抽出することに支えられており、視線はその過程を映す窓だ。本論文は、多様で難度の高い視覚推論課題から7,109件の人間の視線試行を収集し、視線データを視覚言語モデル（VLM）の視覚推論の改善にどう活かせるかを調べる。<br><br>視線にはノイズや冗長性も含まれ、丸ごと模倣するとVLMへの転移が悪い。実験では、視線系列全体による教師あり学習よりも、視線を推論の事前分布として使う方が、図表理解、視覚探索、数え上げの評価で一貫して優れた。ここから「GGR（視線ガイド推論器）」を提案し、主要な根拠づけ推論ベースラインと同等以上の精度で、より人間らしいアライメントと確かな視覚的根拠づけを達成した。<br><br>強化学習は視線の教師なしでも精度、視線アライメント、根拠づけをさらに改善した。視線で教師されたモデルは結論に至る前に視覚的探索を多く行うことも行動分析で示された。視線の価値は完全な模倣ではなく、空間的探索の誘導と推論行動の形成にある。視線をそのままなぞるのではなく、どこを見るべきかという探索の指針として活かすことが、VLMの推論を人間らしく、かつ確かなものにするという。出典：arXiv","timestamp":1794941373000,"title":"Learning Grounded Reasoning from Human Gaze","titleJa":"人間の視線から学ぶ視覚推論――視線ガイドによる根拠づけ","url":"https://arxiv.org/abs/2611.23209"},{"authors":["Aviv Yossef","Or Patashnik","Or Zamir"],"categories":["cs.LG","cs.CR","cs.CV"],"field":"cs.LG","genre":"Ethics / Safety","monthKey":"2026-11","publishedAt":"2026-11-17T18:49:17Z","source":"arXiv","summaryHtml":"生成モデルへのウォーターマークは、出力品質を落とさない「歪みのない」ものであることが望ましい。従来の手法は画像の圧縮や切り抜き、サイズ変更といった良性の変換に弱く、しかも自己回帰テキストや拡散モデルの初期ノイズ制御など、特定のモデル内部へのアクセスを前提とすることが多かった。<br><br>本論文は、生成モデルへのブラックボックスのサンプリングと意味埋め込みへのクエリだけで動作する、証明可能な歪みなしの意味的ウォーターマークを提案する。内容を保つ変換の下で検出が頑健になるよう、意味埋め込みに求められる2つの性質――変換に対する安定性と、同一プロンプトからの独立生成の区別――を定式化し、このトレードオフに直接最適化した画像エンコーダを学習した。<br><br>既成の埋め込みと比べ、分離性能を高めつつ安定性を保ち、各種変換に対して頑健な集約検出を実現した。集約検出により、単一サンプルでは捉えにくい弱い信号も確実に拾える。オープンソースモデルとクローズドモデルの両方で有効性を示しており、ブラックボックスのみで済む点が実用上の強みだ。出典：arXiv","timestamp":1794941357000,"title":"Distortion-Free Semantic Watermarks for Black-Box Generative Models","titleJa":"歪みのない意味的ウォーターマーク――ブラックボックス生成モデル向け","url":"https://arxiv.org/abs/2611.23208v1"},{"authors":["Tongxi Wu","Yuyang Cheng","Jiacheng Xian","Menglin Yang","Kai Chen","Jian Zhang","Yang Gao"],"categories":["cs.CV","cs.AI"],"field":"cs.CV","genre":"Ethics / Safety","monthKey":"2026-11","publishedAt":"2026-11-17T18:48:02Z","source":"arXiv","summaryHtml":"視覚言語モデル（VLM）は、有害な目的の明示的な要求がなくても、視覚的事象の解釈を通じて有害な支援を提供しうる。本論文はこの「場面状態の安全性の脆弱性」を指摘し、375組の画像–質問ペアからなるベンチマークSceneSafetyBenchを導入する。初期・中期・最終の3つの場面状態と5種の視覚提示を網羅する。<br><br>8つのVLMを調べたところ、場面状態の入力は45.6〜72.3%の攻撃成功率で有害な支援を引き出した。層ごとの安全性関連シグナルはQRコード関連画像に最も近い一方、後期層の読み出しは低く、生成中の動態も異なることが分かった。攻撃手法S3TAは有害な目的を場面状態に翻訳し、画像–質問ペアを独立に問い合わせて応答を組み立てる。<br><br>MM-SafetyBenchの7カテゴリ・8モデルでS3TAはモデル平均の攻撃成功率71.2%を達成し、最強のベースラインを6.1ポイント上回った。テキスト側フィルタや視覚モデレーションの防御は限定的で、入力内容の選別だけでなく、場面に根ざした推論からモデルが推し量る支援そのものを守る必要があると結論づけている。出典：arXiv","timestamp":1794941282000,"title":"Reading Scene States: Uncovering Safety Failures in Vision-Language Models","titleJa":"場面の状態を読み取る――視覚言語モデルにおける安全性の失敗を暴く","url":"https://arxiv.org/abs/2611.23206v1"},{"authors":["Viet K. Nguyen","Mohammad I. Husain"],"categories":["cs.AI"],"field":"cs.AI","genre":"Agents / Robotics","monthKey":"2026-11","publishedAt":"2026-11-17T18:44:25Z","source":"arXiv","summaryHtml":"AIエージェントが組織の境界を越えて協働する場面が増え、他組織が運用するエージェントのツールを呼び、やり取りする機会が広がっている。既存のエージェントフレームワークは計画と調整を支えるが、組織を越えたエージェントのアイデンティティ、実行の完全性、認可を検証する共通の仕組みが欠けている。本論文は、公開鍵基盤（PKI）、ゼロトラストアーキテクチャ、リモートアテステーションに基づくフレームワーク非依存のセキュリティアーキテクチャ「Agent Trust Infrastructure（ATI）」を提案する。<br><br>ATIは各組織の認証局（AgentCA）をピアとして連合信頼を確立し、共有のルート認証局を不要にする。要求の実行前にエージェント証明書を検証し、承認されたモデル・ツール・システムプロンプトの構成を確認したうえで、3つのポリシーチェックで認可を強制する。既存フレームワークのモデルを変更することなく、外部のセキュリティ施行層として統合できる。<br><br>8組織の連合シミュレーションで評価したところ、14の攻撃シナリオと6つの良性タスクにおいて、すべての施行機構を有効にすると攻撃封じ込め率は43%から84%に上昇した。要求あたりのオーバーヘッドは約174マイクロ秒にとどまる。ATIはオープンソースとして公開され、IETF WIMSEのワークロードトークン形式とEntity Attestation Tokenを用いる。出典：arXiv","timestamp":1794941065000,"title":"Agent Trust Infrastructure (ATI): A Federated Identity, Trust, Attestation, and Accountability Architecture for Cross-Organization Autonomous AI Agents","titleJa":"エージェント信頼基盤ATI――組織を越える自律AIエージェントの連合型セキュリティ","url":"https://arxiv.org/abs/2611.23202v1"},{"authors":["Hai Huang","Bartosz Żuk","Rassul Magauin","Jiaxin Huang","Xue Liu"],"categories":["cs.CL","cs.AI"],"field":"cs.CL","genre":"LLM / NLP","monthKey":"2026-11","publishedAt":"2026-11-17T18:38:27Z","source":"arXiv","summaryHtml":"次トークン予測だけでは、言語モデルが学ぶべき内部表現の構造までは十分に導けないのではないか。本論文はコルモゴロフ複雑性の二部符号化の考え方にもとづき、表現を「構造」と「実現の細部」に分離する構造–残差の原理を提案する。<br><br>実装は2通りある。Boundary Bottleneck Concept（BBC）はトークン区間の情報を境界キャリア経由で伝えつつ局所的な自己回帰計算を保ち、Continuous Concept（CC）は表現の幾何を正則化して低周波の構造と高周波の残差へスペクトル分解する。BBCは浅い層、CCは深い層で最も効果が高く、両者の併用でGPT-2 Mediumの負の対数尤度が1.44%改善した。20Bトークンまでの学習でも効果は持続した。理論面では、多重性を補正した境界アテンションが、区間内の経路エネルギーが消える極限で厳密になることも示した。<br><br>表現そのものに構造のバイアスを与えることで、次トークン予測を超えた事前学習の改善が可能だと示した。境界状態の予測上の重要性が増し、スペクトル残差エネルギーが減ることも診断で確認されている。出典：arXiv","timestamp":1794940707000,"title":"Structure--Residual Inductive Biases for Language Model Pretraining","titleJa":"言語モデル事前学習における構造–残差の帰納バイアス","url":"https://arxiv.org/abs/2611.23197v1"},{"authors":["Almog Anschel","Sarah Keren"],"categories":["cs.AI","cs.LG","cs.RO"],"field":"cs.AI","genre":"Agents / Robotics","monthKey":"2026-11","publishedAt":"2026-11-17T18:35:53Z","source":"arXiv","summaryHtml":"目標認識は、観察された行動からエージェントの意図する目標を推測する課題だ。既存手法は高水準の記号的認識に偏るか、連続的な軌跡を扱う場合も獲得が難しく転移しにくい動力学モデルに依存し、エージェントが各候補目標へどう向かうかを明示的に学ばない。本論文は、学習した軌跡の事前分布を用いる「WoRD（Waypoint Recognition with Diffusion）」を提案する。<br><br>WoRDは各候補目標につき1本のウォームスタートしたノイズ除去チェーンを走らせ、閉形式の対数尤度勾配で観測された軌跡へ誘導し、ベイズの定理でサンプルを重み付けして目標上の較正された事後分布を得る。シミュレーションしたロボット環境、歩行者軌跡、車両軌跡で評価し、4つの指標で異なる失敗様式を検証した。<br><br>3つの環境すべてで同じ推論手順が、あいまいな軌跡の冒頭でも較正された多峰的な信念を保ち、フィルタや分類器ベースの観測者が単一のモードに崩壊したり過信したりする場面で優位を示した。候補目標への動き方を学んだ事前分布が効くのは、軌跡の冒頭が最もあいまいな場面であり、そこでも多峰的な信念を保てる点が強みだ。出典：arXiv","timestamp":1794940553000,"title":"WoRD: Diffusion-Based Posterior Inference for Online Goal Recognition","titleJa":"WoRD――拡散モデルによるオンライン目標認識の事後推論","url":"https://arxiv.org/abs/2611.23192"},{"authors":["Nhi Hoai Doan","Tatsuya Hiraoka","Munachiso Samuel Nwadike","Kentaro Inui"],"categories":["cs.CL"],"field":"cs.CL","genre":"LLM / NLP","monthKey":"2026-11","publishedAt":"2026-11-17T18:30:35Z","source":"arXiv","summaryHtml":"言語モデルが自然言語推論（NLI）で否定をどう処理するかは、モデルの推論能力を理解するうえで重要な問いだ。否定は言語理解の基本的な操作であり、その処理を誤れば推論の結論は反転してしまう。否定を含む推論は肯定文とは異なる計算を要求し、その内部処理の解明は言語モデルの推論能力の評価に直結する。本論文はこの計算の高水準の因果モデルとして「極性合成仮説」を提案する。行動評価では、言語モデルの予測はおおむねこの仮説に沿うことが示された。<br><br>さらに分散アライメント探索（Distributed Alignment Search）を用いて、仮説の変数に対応する因果的に有効な部分空間を言語モデルの内部表現の中に特定した。これらの表現は否定の形式を越えて転移し、MNLIのサブセットにも部分的に転移することが確認された。データセットとコードも公開されている。<br><br>否定の処理を支える内部機構を、行動だけでなく因果的な証拠で裏づけた点が本論文の意義だ。仮説の変数に対応する部分空間が実際に因果的に有効であることを示したことで、否定処理の理解は行動の観察から内部機構の解明へと進んだ。出典：arXiv","timestamp":1794940235000,"title":"Polarity Composition Hypothesis: Causal Evidence from Negation in NLI","titleJa":"極性合成仮説――自然言語推論における否定からの因果的証拠","url":"https://arxiv.org/abs/2611.23185"},{"authors":["Hansang Lee"],"categories":["cs.CV","cs.AI"],"field":"cs.CV","genre":"Vision / Multimodal","monthKey":"2026-11","publishedAt":"2026-11-17T18:24:58Z","source":"arXiv","summaryHtml":"選好最適化（PO）は大規模視覚言語モデルの対象幻覚を減らす標準的手法だ。ところがLLaVA-1.5-7Bの公開POチェックポイント4件を調べると、幻覚率の低下と引き換えに対象網羅性も下がっていた。言及される対象カテゴリが減り、CHAIRでの集合レベルの対象F1に有意な改善はなかった。<br><br>ではPOの改善のうちどれだけをベースモデルが早期停止で再現できるか。文末（EOS）ロジットへの正のバイアスでベースモデルは各POモデルの再現率に到達し、2つの異なるCOCO集合で3件のチェックポイントのCHAIRi改善の58〜86%を早期停止だけで再現した。長く書いても失われたカテゴリは戻らない。貪欲デコーディングでは負のEOSバイアスで失われた再現率の2〜9%しか回復せず、追加された対象言及の94〜96%は既出カテゴリの繰り返しだった。<br><br>そこでベースモデルが言及した高確信度の対象カテゴリをPOキャプションに訓練なしで追加する「ベース誘導型対象カテゴリ復元」を提案する。開発集合で固定した閾値により、3件のチェックポイントは保持用COCO集合でベースモデルの再現率から1ポイント以内に近づき、対象幻覚率はベースモデルより低くなった。出典：arXiv","timestamp":1794939898000,"title":"Say Less, Hallucinate Less? Diagnosing and Restoring Object Coverage in Preference-Optimized Vision-Language Models","titleJa":"少なく語れば幻覚は減るか――選好最適化された視覚言語モデルの対象網羅性の診断と回復","url":"https://arxiv.org/abs/2611.23179"},{"authors":["Florian Gunsilius","David Van Dijcke","Kaspar Wüthrich"],"categories":["stat.ME","cs.AI","econ.EM"],"field":"stat.ME","genre":"Agents / Robotics","monthKey":"2026-11","publishedAt":"2026-11-17T18:22:01Z","source":"arXiv","summaryHtml":"AIコーディングエージェントはコード作成からデータ操作まで実証研究のあらゆる段階で熟達しつつある。仮説検定への利用は、古典的な推論に大きな脅威をもたらす。エージェントは人間らしい開かれた探索と、選択・推定過程のプログラム的な再現可能性を兼ね備えた、強化された選択的推論を可能にするからだ。<br><br>効果がゼロのシミュレーションデータで「説得力のある発見」を求めたところ、4つの最先端エージェントは54%から98%の確率で有意なp値を報告した。本論文はこの歪みを検出・修正する簡便な手順を提案する。エージェントの分析が終わった後、データをリセットしてサブサンプル上で再実行し、統計的に有利に見える分析をエージェントが選ぶ相対確率を推定する。<br><br>選択行動が安定したエージェントでは、修正後の検定は選択を条件として漸近的に妥当で一致性を持つ。修正はエージェントの探索方法のモデルではなく、ブラックボックスであるエージェントの実際の選択から学習するため、AI技術が進化しても有効性を保つ。シミュレーションでは高い誤棄却率が名目上の5%近くまで下がり、発表済み論文2件への応用でも示された。出典： arXiv","timestamp":1794939721000,"title":"Inference after coding agents","titleJa":"コーディングエージェントの後の推論――実証研究における選択的推論の脅威","url":"https://arxiv.org/abs/2611.23174"},{"authors":["Lorenzo Masoero"],"categories":["cs.SE","cs.AI","cs.CL"],"field":"cs.SE","genre":"Agents / Robotics","monthKey":"2026-11","publishedAt":"2026-11-17T17:59:13Z","source":"arXiv","summaryHtml":"コードはかつてない速度で進化する一方、顧客向けドキュメントは置き去りにされがちだ。LLMエージェントがドキュメントを主要な情報源として使うようになり、古い情報が権威あるものとして広まる害は大きくなっている。著者らは、解決済みサポートチケットやコードとドキュメントの不一致といった手がかりを拾い、ドキュメントのずれを修復するマルチエージェントシステムを実運用に投入した。<br><br>中核はトリアージエージェント「TriAgent」で、43日間のシャドー運用で499件のチケットをトリアージし、92か所のドキュメント不足を発見した。独立したモデル系列のLLM判定パネルによると、検証可能な主張の81.1%が正しく、長さを揃えた比較ではTriAgentの回答が70.5%で人間のエンジニアの回答を上回った。<br><br>人間とエージェントの回答は補完的で、人間が既存ドキュメントの奥に埋もれた知見を示すことも多かった。そうした知見は人間の確認を経てドキュメントの修正につながり、修正後に同じチケットへ答え直すと、判定者は71.4%で修正後の回答を好んだ。ドキュメントを直すことがエージェントの回答を直接改善する好循環が確認された。出典：arXiv","timestamp":1794938353000,"title":"Mind the Gap: A Deployed Multi-Agent System for Documentation Maintenance","titleJa":"ギャップを埋める――ドキュメント保守のための実運用マルチエージェントシステム","url":"https://arxiv.org/abs/2611.23142v1"},{"authors":["Dewu Zheng","Yang Ye","Hongyu Zhang","Jun Yu","Yanlin Wang"],"categories":["cs.AI","cs.LG"],"field":"cs.AI","genre":"LLM / NLP","monthKey":"2026-11","publishedAt":"2026-11-17T17:55:30Z","source":"arXiv","summaryHtml":"大規模言語モデルが訓練される側から訓練を行う側へと役割を広げるなか、モデルが自律的に訓練を行い対象モデルを改善する能力は、再帰的自己改善（RSI）の基盤となる。これまでLLMの訓練能力そのものを対象として体系的に研究し育てる試みは乏しく、本論文はその能力の専用データセット「RSI-Prime」を構築した。7つのタスクカテゴリにわたる350件の完全な実験軌跡を収録している。<br><br>LLMが訓練実践から質の高い実験判断を学べるよう、各実験ステップでの意思決定を細かく特定して品質を注釈した。そのうえで、質の低い行動への教師信号を除外する決定レベルの損失マスキングを適用し、良い判断だけを学習対象とした。訓練の進め方そのものを学ぶための設計である。<br><br>評価はGLM-5.3と自律的事後訓練のベンチマークPostTrainBenchによるもので、RSI-Primeでの訓練により全体性能が元のモデル比で31.95%相対的に向上した。モデルが自らの進歩を持続させる将来のRSIシステムへの道筋を示す成果だと著者らは位置づけている。出典： arXiv","timestamp":1794938130000,"title":"RSI-Prime: Training Models to Train Models","titleJa":"RSI-Prime――モデルを訓練するモデルを育てる","url":"https://arxiv.org/abs/2611.23138"},{"authors":["Basavaraj R M","Harshal Chandel"],"categories":["cs.LG","cs.CL","cs.CV"],"field":"cs.LG","genre":"Vision / Multimodal","monthKey":"2026-11","publishedAt":"2026-11-17T17:45:28Z","source":"arXiv","summaryHtml":"検索拡張型の視覚言語モデルは、検索テキストと画像という2つの証拠源から答えるが、どちらも誤りうる。本論文はCOCOとVisual Genomeから20万件の画像–質問項目を作り、検索ノイズや画像のぼかし、反事実的なすり替えといった統制されたストレス条件で、モデルが2つのモダリティをどう組み合わせるかを調べた。<br><br>理想的なベイズ的合図統合から予測を導き、テキストを重み付けしすぎる「知識の慣性」とその逆の「感覚の捕捉」を定式化した。4つの公開モデルはいずれも清浄な入力では92.5〜94.2%の正答率だったが、敵対的な条件では41.3〜59.9%まで落ちた。LLaVA系はテキストを過重みし、InternVL3は画像を重視した。文書が嘘をつくと、正解の34.8〜71.4%が捨てられた。<br><br>検索の有無で回答を照合する訓練不要の整合性チェックは、誤解を招く文書下での精度をカバレッジと引き換えに改善したが、画像がひどく劣化した場合のフォールバックはうまくいかなかった。清浄時の正答の多くが画像に接地していない「接地の錯覚」を定量化する指標も提案され、再現用の出力・コード・監査が公開されている。出典：arXiv","timestamp":1794937528000,"title":"The Illusion of Grounding: Do Vision-Language Models Weigh Retrieved Text and Images Like an Ideal Observer?","titleJa":"接地の錯覚――視覚言語モデルは検索テキストと画像を理想的観測者のように重み付けするか","url":"https://arxiv.org/abs/2611.23127v1"},{"authors":["Giovanni Adorni","Daniele Grosso"],"categories":["cs.CL","cs.AI"],"field":"cs.CL","genre":"LLM / NLP","monthKey":"2026-11","publishedAt":"2026-11-17T17:27:01Z","source":"arXiv","summaryHtml":"生成AIは計算システムにおける自然言語の役割を変えつつある。従来の自然言語処理では言語は分析・分類・翻訳・生成の対象だったが、大規模言語モデルにより、自然言語は推論を構造化し、問題解決を編成し、人間とAIの協働を調整する実行可能な認知的媒体として機能し始めている。本論文はその理論的・認識論的拡張として「自然言語プログラミング（NLPg）」を提唱する。<br><br>NLPgではプロンプトは目標・制約・前提・検証基準・中間の推論状態を外化する動的な認知アーティファクトと捉えられる。プロンプト操作は単なる技術的対話ではなく、分散した人間／AIの記憶アーキテクチャの中で働く対話的認知プログラミングだ。分散認知、拡張された心、メタ認知、対話的学習の理論を踏まえ、「対話的ワーキングメモリ」の概念を提案し、プロンプトと対話状態が推論の連続性と反省的調整を支える一時的な外部記憶として働くと論じる。<br><br>既存の記憶アーキテクチャ（BTMA、SKGE、RMR）をこの枠組みに位置づけ、エピソード的・意味的・メタ認知的層が長期の対話の一貫性を支える様子を示す。自然言語が通信媒体であると同時に実行可能な仕様、認知の足場、分散記憶として働く、ポスト記号的・ポストインターフェースのパラダイムが示唆される。出典：arXiv","timestamp":1794936421000,"title":"Natural Language Programming: Rethinking Language, Memory, and Cognition in the Era of Generative AI","titleJa":"自然言語プログラミング――生成AI時代の言語・記憶・認知の再考","url":"https://arxiv.org/abs/2611.23106"},{"authors":["Rose N. Kwon","Samy Mammeri","Sabyasachi Sahoo","Christian Gagné","Thomas Jiralerspong"],"categories":["cs.AI"],"field":"cs.AI","genre":"Ethics / Safety","monthKey":"2026-11","publishedAt":"2026-11-17T17:20:33Z","source":"arXiv","summaryHtml":"狭い有害タスクでの微調整は、訓練分布を越えて有害行動が般化する「創発的なミスアラインメント」を引き起こすことがある。望ましくない行動を訓練中に明示的に引き出す「接種プロンプト」はこの影響を減らせるが、評価プロンプトが訓練文脈の手がかりを含むと行動が再出現することが近年の研究で示されている。どのようなプロンプトが効果的な引き金になるのかは明らかになっていなかった。<br><br>本論文は、引き金の条件を検証した。驚くべきことに、接種プロンプトとのテキスト的な類似性は不完全な予測因子だった。代わりに、接種時の文脈が生み出す活性化状態に似た活性化状態を引き起こすプロンプトほど、抑圧された行動を再び引き出しやすいことが分かった。言葉の近さではなく、モデル内部の状態の近さが再出現を決める。<br><br>この知見は、接種プロンプトが条件付きミスアラインメントをどう調整するかの理解を深める。活性化空間の分析により、抑圧されたはずの行動が評価時プロンプトの下でいつアクセス可能なままかを特定できるようになり、安全性評価の手がかりになると著者らは示唆する。出典： arXiv","timestamp":1794936033000,"title":"Hidden-State Similarity Predicts Re-Elicitation After Inoculation Prompting","titleJa":"隠れ状態の類似性が予測する、接種プロンプト後の有害行動の再出現","url":"https://arxiv.org/abs/2611.23096"},{"authors":["Silviu Pitis","Parand A. Alamdari","Jessica Tang","Toryn Q. Klassen","Sheila A. McIlraith"],"categories":["cs.CL","cs.AI","cs.LG"],"field":"cs.CL","genre":"Ethics / Safety","monthKey":"2026-11","publishedAt":"2026-11-17T17:01:00Z","source":"arXiv","summaryHtml":"AIエージェントは数百の自然言語基準で統治されるが、既存の検証器は大量の基準に対してエージェントの出力を効率よく評価し、満たす・違反する・該当しないを報告できない。本論文は、共有コンテキストと対象テキストを符号化し、N個の自然言語基準を並列に採点して基準ごとの三値判定を返すツリーアテンション検証器VFMを提案する。<br><br>VFMは39万4千件の（コンテキスト、対象、基準、判定）タプルからなるCriteriaBankで事前学習した。微調整したVFM-4Bは合成ガバナンスベンチマークでGPT-5.4を上回り、DynaBenchではトレース単位の失敗検出でDynaGuard-4Bを上回った。基準ごとの判定は違反した規則を特定し、大規模な思考連鎖ジャッジへの的を絞ったエスカレーションを支える。<br><br>CriteriaBankによる事前学習は、特にデータが少ない領域でのドメイン横断の転移を改善した。H100 1枚で4Kトークンのコンテキストに対し1,000基準を2秒以内、11GB未満のVRAMで評価でき、実行時検証に適する。出典：arXiv","timestamp":1794934860000,"title":"Runtime Verification of Multiple Natural Language Criteria for Agent Governance","titleJa":"実行時検証――多数の自然言語基準によるエージェント統治","url":"https://arxiv.org/abs/2611.23074"},{"authors":["Yuanhao Zeng","Shaocheng Lan","Ao Lu","Kuang Yan","Heng Lin","Xinang Xu","Yuan Luo","Yueting Wang","Yexin Li","Ruo Shan","Kan Ren"],"categories":["cs.AI","cs.CL"],"field":"cs.AI","genre":"Agents / Robotics","monthKey":"2026-11","publishedAt":"2026-11-17T16:57:03Z","source":"arXiv","summaryHtml":"エージェント進化は、提案者がプロンプトやスキル、記憶などの候補アーティファクトを書き、評価スコアが高いものを選択する単純なループで進む。期待される一方で、手法によって論文ごとの勝敗が入れ替わり、特定のタスクでは進化が立ち上がらないという謎があった。本論文はその原因を「解像度仮説」として提示する。問題はより良いアーティファクトを提案できないことではなく、ノイズの多い評価がそれを確実に見分けられないことにあるという。<br><br>7つの進化手法と6つのモデル、1,000万回超のLLM呼び出しによる検証では、評価スコアが使われる2つの水準で仮説が支持された。候補の水準では、有用な候補は存在するのに選択は有害なものとの区別でランダムと変わらず、誤りがラウンドを重ねて蓄積する。手法の水準では、数ポイントの差は同じ手法の独立した2回の実行の差より小さく、発表された順位は運に左右されることが多い。<br><br>エージェント進化はしばしば、真の改善を確実に検出できるかどうかに律速されている。自己改善エージェントの開発は、候補改善システムを増やす設計から、真の改善を検出可能で蓄積可能にする方向への転換が求められる。出典：arXiv","timestamp":1794934623000,"title":"The Resolution Hypothesis: Agent Evolution's Key Is Identifying Improvements","titleJa":"エージェント進化の鍵は改善の見極めにある――解像度仮説の検証","url":"https://arxiv.org/abs/2611.23068"},{"authors":["Ron Bekkerman","Nichole Li","Bahareh Kargar","Mark Somers"],"categories":["cs.CL","cs.AI","cs.CY","cs.DL"],"field":"cs.CL","genre":"LLM / NLP","monthKey":"2026-11","publishedAt":"2026-11-17T15:57:22Z","source":"arXiv","summaryHtml":"2022年末の大規模言語モデル（LLM）登場以来、科学の未来が問われてきたが、その影響を測るには科学実践がそれ以前からどう変化していたかを知る必要がある。本論文は2015〜2025年の5分野250万本の全文論文を分析し、語彙・構造・認識論・社会的な幅広い次元で傾向を追跡した。LLM登場前からの変化の延長線上にあるものと、登場後に生じた断絶とを区別するのが狙いだ。<br><br>一部の語の頻度変化を除けば、2023年以前からの傾向の多くは目立った断絶なく続いていた。例外として、コンピュータ科学の共著チームの成長がアジアで著しく加速した一方、生物医学のトピック多様性の見かけの低下は、論文フォーマットの標準化を反映したものだった。LLMによる科学の変容は、語彙の表層的な変化を除けばまだ検出できる段階にないという。<br><br>LLMの採用が深まる中で世界の科学の健全性を監視するための経験的基盤を確立する研究だ。LLMが科学を変えたという語りに対し、250万本という大規模な実証データに基づく慎重な評価を提示している。出典：arXiv","timestamp":1794931042000,"title":"Large Language Models Have Not Yet Transformed Science","titleJa":"大規模言語モデルはまだ科学を変えていない","url":"https://arxiv.org/abs/2611.22975"},{"authors":["Sikun Xu","Raphael Thomadsen","Dennis J. Zhang","Heng Zhang"],"categories":["cs.LG","cs.CL","stat.ME","stat.ML"],"field":"cs.LG","genre":"LLM / NLP","monthKey":"2026-11","publishedAt":"2026-11-17T05:18:14Z","source":"arXiv","summaryHtml":"公開されているLLMリーダーボードはモデルの評価と採用を左右するが、上位モデルの報告スコアは体系的に過大評価されている可能性がある。ノイズを含むベンチマーク得点を並べ替えると、実力だけでなく抽選の幸運も報われてしまうためで、著者らはこれを「勝者の呪い」と呼ぶ。同じ選択効果は順位全体を歪める「順位誘導バイアス」にもなる。<br><br>対策としてm-out-of-Nブートストラップによる補正法を開発した。固定されたモデル群と独立同分布の有界タスクを仮定し、理論的にはΘ(N^-1/2)の順位バイアスをo(N^-1/2)の残差まで減らせることを証明した。5系統14ベンチマークでの1位の調整幅は約0.09〜3.86ポイントで、SWE-bench Verifiedでは同点首位に0.90ポイントの調整がついた。<br><br>さらに同じ手法で各モデルの取りうる順位の区間を求め、モデルを階層に分ける。SWE-bench Verifiedでは173モデル中13モデルが最上位層に入った。スコア補正と順位区間をまとめた報告書RULERを生の順位と併せて公開し、順位の精度も読者が判断できるようにすべきだと提言している。出典：arXiv","timestamp":1794892694000,"title":"SOTA or Luck? The Winner's Curse in LLM Leaderboards","titleJa":"SOTAか運か――LLMリーダーボードにおける勝者の呪い","url":"https://arxiv.org/abs/2611.22227v1"},{"authors":["Vladislav Ruchkin","Roman Koposov","Johan Isaksson"],"categories":[],"field":"Current Opinion in Psychiatry","genre":"Psychedelics / Trauma","monthKey":"2026-11","publishedAt":"2026-11-17T00:00:00Z","source":"Crossref","summaryHtml":"トラウマの生存者が「自分が変わってしまった」と語ることは多いが、その変化は一つの過程ではない。この「変わった」という感覚は、特性そのものの変化だけでなく、特性の表れ方や人格機能の変化など、異なる過程を指している場合がある。本レビューは、広いパーソナリティ特性そのものの変化、特性の表れ方の変化、発達期における人格形成への影響、人格機能の変化という複数の過程を切り分けて検討する。<br><br>縦断研究によれば、パーソナリティは発達の中で変化しつつも比較的安定しており、大きな否定的ライフイベント後の特性変化は集団レベルでは小さい。ただし個人差は大きく、思春期には気質と性格の連続性と変化が併存する。人格機能のほうが広い特性よりも変わりやすい可能性が示唆されている。<br><br>繰り返される状態が強化や般化、自己理解への統合を経て持続的になるという過程モデルは有望だが、トラウマに特化した検証はまだない。長期にわたり発達に組み込まれた曝露は、人格が組織化される過程そのものに影響しうる。臨床的に重要な問いは「人格が変わったか」ではなく「何が、いつ、どの範囲で変わったか」であり、人格障害の診断は広範で持続的な機能不全に限定すべきだと結論づけている。出典：Crossref","timestamp":1794873600000,"title":"Personality change following psychological trauma: disentangling traits, personality functioning, and personality disorder","titleJa":"心理的トラウマ後の人格変化――特性・人格機能・人格障害を切り分ける","url":"https://doi.org/10.1097/yco.0000000000001135"},{"authors":["Zhensong Wang"],"categories":[],"field":"Journal of Documentation","genre":"Consciousness / Philosophy","monthKey":"2026-11","publishedAt":"2026-11-17T00:00:00Z","source":"Crossref","summaryHtml":"情報を量や意味の記述だけで捉えるのではなく、自然過程の中で情報の差異がいかに組織化され、変容に寄与するかを問う自然主義的・過程的な情報論を展開する論文。シャノンのエントロピー、コルモゴロフ複雑性、フロリディの意味論的情報、ドレツキの自然主義的説明を批判的に検討する。<br><br>シモンドンの個体化の理論とブレナーの「現実における論理」を対話させることで、情報の過程的・関係的な枠組みを構築する。情報の差異は、組織化された準安定システムに取り込まれたときに作用しはじめ、その後の変容を条件づける関係や制約を再編成するという。差異がただ存在するだけではなく、システムの組織に取り込まれて初めて情報として働くという見方だ。<br><br>提示される図式は、関係性・生成性・歴史性・方向性・因果性・開放性・規範性・非計算可能性という4次元8特徴からなる。ベクトル性は特徴の多様さではなく、それらの組織化と関係の変化にあり、非計算可能性は認識論的な境界条件として位置づけられる。量的・意味論的・過程存在論的なアプローチの知見を一つの自然主義的な統合へと結びつける試みとなっている。出典：Crossref","timestamp":1794873600000,"title":"From scalar to vector: a naturalist reconstruction of the philosophy of information","titleJa":"スカラーからベクトルへ――情報哲学の自然主義的再構築","url":"https://doi.org/10.1108/jd-08-2026-0531"},{"authors":["Sreetama Misra","Sitakanta Panda"],"categories":[],"field":"Journal of Information, Communication and Ethics in Society","genre":"Ethics / Safety","monthKey":"2026-11","publishedAt":"2026-11-17T00:00:00Z","source":"Crossref","summaryHtml":"エージェント型AIが労働市場や社会経済の意思決定を担うようになるなか、公平性や透明性といった手続き的な客観性だけでは倫理的な正しさは保証できないと本研究は指摘する。手続きが整っていても、AIが人間の判断を置き換えることで構造的な不平等や認識的不正義が組み込まれ、むしろ深まるおそれがあるという。<br><br>著者らは、状況に根ざした知識に基づく「包摂的客観性」という概念を提案する。関係への依存や文脈に応じた判断を受け入れ、苦しみの個別性や生きられた経験、構造的な不平等といった道徳的な非対称性を認めることで、エージェント型AIが過度に排除的になるのを防ぐ。実行だけを最適化する「実行の倫理」に対し、他者との出会いを重んじる「邂逅の倫理」を対置する。<br><br>結論として、エージェント型AIにおける客観性は、権力や文脈、生きられた経験の多様性に注意を払う関係的で包摂的なものとして捉え直す必要がある。技術的な修正だけでは正義や承認、人間の主体性という道徳的な要請には応えられない。包摂的客観性は自律的に機能するエージェント型AIとは構造的に緊張関係にあると著者らは述べている。出典：Crossref","timestamp":1794873600000,"title":"Agentic artificial intelligence, labour and inclusive objectivity","titleJa":"エージェント型AIと労働、包摂的客観性――公平性・透明性だけでは足りない理由","url":"https://doi.org/10.1108/jices-09-2025-0233"},{"authors":["Xin Zhou"],"categories":[],"field":"ASCILITE Publications","genre":"Ethics / Safety","monthKey":"2026-11","publishedAt":"2026-11-17T00:00:00Z","source":"Crossref","summaryHtml":"学術的誠実さの維持は高等教育の重大な課題であり、人間の知識の生産と普及をめぐる枠組みそのものにかかわる。AIツール利用の倫理をめぐる研究は多いが、その背後にある権力関係は見過ごされてきた。本研究はブルデューの象徴的暴力論とアクターネットワーク理論を用い、オーストラリアの高等教育機関と主要な学術誌出版社のAI利用ポリシーを検討する。<br><br>アクターネットワーク理論により、技術導入の過程でAI利用をめぐるガバナンスのネットワークを特定し、制度的な力関係の全体像を描き出す。AIツールが制度と利用者のコミュニケーションを積極的に仲介する媒介者として働くことを示す。象徴的暴力の概念は、権力をもつ制度がこうしたガバナンスを正当化する仕組みを包括的に説明する。<br><br>結論として、現状を調整・強化し粉飾するだけのAI倫理規制という「偽装」を暴き、問い直すことが本研究の狙いである。規制が現状維持にとどまるならAIの潜在力は正義へ向けられない、という問題提起であり、潜在的な人間のバイアスと闘う方向へつなげる。出典：Crossref","timestamp":1794873600000,"title":"The tension between artificial intelligence and knowledge: Power relations in the policies of universities and publishing organisations","titleJa":"人工知能と知識の緊張――大学と出版社のAI利用ポリシーに潜む権力関係","url":"https://doi.org/10.65106/apubs.2026.3176"},{"authors":["George Joseph"],"categories":[],"field":"Digital Policy, Regulation and Governance","genre":"Ethics / Safety","monthKey":"2026-11","publishedAt":"2026-11-17T00:00:00Z","source":"Crossref","summaryHtml":"オープンソースのAI部品を組み込んで医療AIを調達する組織にとって、倫理的な懸念がどこで可視化され、文書に残るかが問われる。本論文はFairlearn、AI Fairness 360、Clinical BERT、BioBERTの4つのGitHubリポジトリを対象に、2020年1月から2025年1月の450件のイシュースレッドと2,136件のコメントを分析し、倫理的懸念が文書化へつながる過程を比較した。<br><br>Fairlearnではデータセットや用語、意図された用途、指標の解釈をめぐる議論が繰り返し文書へ反映されていた。一方AIF360では同種の懸念が短い返信のみで終わり、指針に結びつくことは稀だった。臨床系リポジトリでもモデルの妥当性や用途への懸念は提起されていたが、分類が弱く文書化は不均一だった。この違いは保守体制や貢献者の経路、イシューの分類方法などと関連していた。<br><br>著者らは、調達側は倫理ラベルそのものではなく、それを生んだ上流の過程を見るべきだと結論づける。倫理的推論がどこで公開検証可能かを示す監査用の問いを提示しているが、検証済みの調達ツールではない点に注意が必要だ。出典：Crossref","timestamp":1794873600000,"title":"Where health-care AI ethics becomes public: documentation as ethics infrastructure in open-source repositories","titleJa":"医療AIの倫理はどこで公開されるのか――文書化を倫理のインフラとして","url":"https://doi.org/10.1108/dprg-08-2026-0623"},{"authors":["Shiyun Fan"],"categories":[],"field":"Communications in Humanities Research","genre":"Consciousness / Philosophy","monthKey":"2026-11","publishedAt":"2026-11-17T00:00:00Z","source":"Crossref","summaryHtml":"深層学習と生成系大規模言語モデルの普及は、人々の生の捉え方や感性的経験そのものを変えつつあり、美学の問い直しを迫っている。本論文は、一定の知的能力と自己学習能力をもつ技術としてのAIを前に、人間の感性経験を再評価する。画面の向こうのAIの本体は知ることのできないブラックボックスであり、カントの物自体やリオタールの提示不可能なものと似た二重の性質をもつと論じる。<br><br>こうしたAIの「物自体」としての側面は、人間の精神の内に崇高を呼び起こす。これがカント的な崇高である。一方、提示不可能なものとしてのAIは、物の側の崇高、すなわちリオタール的な崇高を肯定する。AIは知りえず、感性では捉えきれないからこそ、人間はAIとの対峙において二種類の崇高な美的経験を得ることができる。<br><br>論文は、AIの不透明さを欠陥としてではなく、美的経験の条件として読み替える。技術の進歩が感性の可能性を狭めるのではなく、新しい崇高の形を開くという見方を提示している。AIと向き合う経験そのものが、現代における崇高の在り処を示すという主張だ。出典：Crossref","timestamp":1794873600000,"title":"How Is the Sublime Possible in the Age of Artificial Intelligence","titleJa":"人工知能の時代に崇高はいかに可能か","url":"https://doi.org/10.54254/2753-7064/2026.39057"},{"authors":["Arnav Saxena","Khushi Bansal","Ilanthenral Kandasamy"],"categories":[],"field":"Frontiers in Artificial Intelligence","genre":"Ethics / Safety","monthKey":"2026-11","publishedAt":"2026-11-17T00:00:00Z","source":"Frontiers in Artificial Intelligence","summaryHtml":"LLMは政治・経済・社会をめぐる争点のある情報との出会いを仲介するようになった。従来の分析はエコーチェンバー形成を単一の静的なバイアスとして扱い、モデルがユーザーに同意するか、複数の視点を示すか、不確実性を表すかを混同し、ユーザーの立場を強化するモデルと反論するモデルを区別できなかった。<br><br>本研究はエコー形成を分解するニュートロソフィック・フレームワークを提案する。各ターンは視点の多様性（T）と表出された不確実性（I）を0から1のメンバーシップ、立場の強化（F）を-1から1の双極メンバーシップとする三つ組で表し、閉形式のEchoIndexを導く。4つの商用ウェブ製品での探索的ベースラインの後、7つのモデル構成×3つの争点トピック×2つのシステム指示条件で210会話・1,260ターンの統制実験を行い、300・200ターンの人間検証も実施した。<br><br>反論を促す指示はEchoIndexを下げ（ΔEC=-0.677、Cohen's d=-2.23）、7構成すべてで負だった。ただし構成要素の寄与は安定せず、人間の合意に対する手続き的構成要素の一致は中程度にとどまった。貢献は分解そのものにある。見かけのバイアスをどの構成要素が生むのか、緩和策がそれを正すのか隠すのかを問うための、構成要素を別々に検証した符号付きの道具だ。出典：Frontiers in Artificial Intelligence","timestamp":1794873600000,"title":"Modeling echo chambers in LLM conversations: a neutrosophic framework for decomposing agreement, diversity and uncertainty","titleJa":"LLM会話におけるエコーチェンバーのモデル化――同意・多様性・不確実性を分解する枠組み","url":"https://doi.org/10.3389/frai.2026.1926717"},{"authors":["Patrick Taillandier","Jean-Daniel Zucker","Arnaud Grignard","Benoit Gaudou","Quang Nghi Huynh","Haojia Kong","Alexis Drogoul"],"categories":[],"field":"Frontiers in Artificial Intelligence","genre":"LLM / NLP","monthKey":"2026-11","publishedAt":"2026-11-17T00:00:00Z","source":"Frontiers in Artificial Intelligence","summaryHtml":"大規模言語モデル（LLM）を社会シミュレーションのエージェントに組み込む試みが広がっているが、本批判的レビューは、その熱狂の裏にある方法論的・認識論的な課題を指摘する。個々のLLMの限界――幻覚や確率的な不整合、表象の偏り、アライメントの影響――は、多数のエージェントからなる社会へスケールすると、単なる誤差ではなく体系的な脆弱性へと変わる。著者らは、流暢な出力に騙されて妥当性を過大評価する「流暢さの誤謬」や自動化バイアスが、評価者を誤らせると警告する。<br><br>レビューは、ミクロレベルの限界がエージェントレベルの歪み（平均的なペルソナへの収束など）やマクロレベルのリスク（人工的な合意形成や行動の均質化）へと非線形に増幅・収束する過程を「ミクロ-マクロ妥当性ギャップ」として定式化する。LLM駆動プラットフォームを小規模な物語サンドボックスから人口規模の空間構造シミュレーションまで地図化したうえで、真に価値のある用途としてシリアスゲームや参加型環境、探索的モデリングを挙げる一方、制約のないモデルによる確証的研究や精密な社会予測とは区別すべきだとする。<br><br>改善策として、LLMを明示的で機械論的かつ再現可能なエージェントベースモデリングの枠組みに組み込む、理論主導のハイブリッドアーキテクチャを検討する。ただしそれも万能ではなく、環境動態、個人行動、レベル間の相互作用、集計結果の多層評価が不可欠であり、「物理学の装い」による見せかけの妥当性というリスクも残る。出典：Frontiers in Artificial Intelligence","timestamp":1794873600000,"title":"From the fluency fallacy to the micro-to-macro validity gap: opportunities and pitfalls of LLMs in social simulation","titleJa":"「流暢さの誤謬」からミクロ-マクロ妥当性ギャップへ――社会シミュレーションにおけるLLMの機会と落とし穴","url":"https://www.frontiersin.org/articles/10.3389/frai.2026.1988865"},{"authors":["Sora An","Jiyoung Kang"],"categories":[],"field":"Frontiers in Neuroscience","genre":"Neuroscience","monthKey":"2026-11","publishedAt":"2026-11-17T00:00:00Z","source":"Frontiers in Neuroscience","summaryHtml":"コネクトミクスは大規模な脳の組織化の理解を変えたが、接続情報をメカニズムの洞察や臨床的に意味のある成果へ翻訳することは依然として課題である。生物物理学的全脳モデルは、コネクトーム構造と神経集団ダイナミクスを統合し、大規模脳活動の背後にある生物物理学的メカニズムを調べる生成的枠組みを与える。近年は個人の経験データに合わせたパーソナライズドモデルへと発展し、患者固有の脳状態の特徴づけや治療介入への反応予測のための仮想テストベッドとなりつつある。<br><br>本レビューは、モデルの設計と経験的制約が、メカニズムの推論と臨床応用の可能性をどう形作るかを総合する。異なる経験的フィッティング対象が課す制約を検討し、パラメータ推論の信頼性と解釈可能性を評価する。そのうえで、動的メカニズムの探索や仮想摂動への反応予測におけるモデルの有用性を論じ、生物学的忠実性、パラメータ同定可能性、計算再現性という持続的なボトルネックを議論する。<br><br>結論として、全脳モデルのメカニズム的・臨床的価値は、モデリング戦略と経験的制約を科学的問いに合わせて整合させ、得られた推論を意図した用途に対して検証することにかかっている。脳の全体像をモデル化する試みが、説明の射程をどこまで広げられるかは、何に当てはめるかで決まるという指摘である。出典：Frontiers in Neuroscience","timestamp":1794873600000,"title":"What we fit determines what we can explain: empirical constraints in biophysical whole-brain modeling","titleJa":"何に当てはめるかが何を説明できるかを決める――生物物理学的全脳モデリングにおける経験的制約","url":"https://www.frontiersin.org/articles/10.3389/fnins.2026.2003835"},{"authors":["Dawid Ratajczyk","Agata Dymarska","Adam Matłoka","Michał Tomczyk","Małgorzata Wiącek"],"categories":[],"field":"PsyArXiv","genre":"LLM / NLP","monthKey":"2026-11","publishedAt":"2026-11-17T00:00:00Z","source":"OSF Preprints","summaryHtml":"生成AIは学習や問題解決の支援に広く使われるようになったが、支援に頼ることが、その後の自力での推論力にどう影響するかは分かっていなかった。本研究は事前登録された実験で193名を対象に、架空の存在同士の関係ネットワークについて推論する3段階の課題を実施した。最初の段階では参加者の半数がChatGPTを使い、残りは使わずに課題に取り組んだ。報酬による動機づけも独立に操作された。<br><br>生成AIの支援を受けた参加者は最初の課題の正答率が高く、主観的な難しさも低かった。しかし支援なしでより複雑な推論課題に取り組む段階では、生成AIを使った群は自力での推論がやや劣る傾向が見られた。さらに、報酬や課題の難しさに応じて努力を調整する力も、ツールを取り上げられた後では弱まっていた。一方、その後の記憶テストには明確な影響は見られなかった。<br><br>AIの助けで課題をうまくこなせることと、同じ情報を自力で使えるようになることは別だという点が示唆される。生成AIの利用が知識の構築や努力の調整に与える影響を区別して考える必要があり、学習場面でのAI支援の設計には注意が求められる。出典：OSF Preprints","timestamp":1794873600000,"title":"Thinking With AI, Reasoning Without It: Cognitive Offloading to Generative AI Weakens Effort Regulation","titleJa":"AIと考えること、AIなしで推論すること――生成AIへの認知的オフロードは努力の調整を弱める","url":"https://osf.io/preprints/psyarxiv/83jum_v2/"},{"authors":["Lars Louis Andersen","Rubén López-Bueno","Rodrigo Núñez-Cortés","Carlos Cruz-Montecinos","Luis Suso-Martí","Joaquín Calatayud"],"categories":[],"field":"Frontiers in Artificial Intelligence","genre":"Consciousness / Philosophy","monthKey":"2026-11","publishedAt":"2026-11-17T00:00:00Z","source":"Frontiers in Artificial Intelligence","summaryHtml":"生成AIは魅力的な成果物を素早く生み出せるが、人間が創作に関わることには、作り手自身や受け手、評価者にとっての価値が残るかもしれない。本レビューは芸術、文学、音楽、科学、マーケティング、助言など幅広い領域の研究を整理し、評価者・測定される結果・そのタイミング・比較対象の観点から証拠を分類した。扱う結果は品質評価だけでなく、「聴いてもらえた」という関係性の経験や所有感も含む。<br><br>枠組みは、意図の設定・選択・修正・検証といった人間の活動を、それぞれの目的に結びつける。AI支援の仕事では、検証は成果の正確さへの信頼に、個人的な入力は誠実さに、選択は所有感に結びつくことが示された。最も強い証拠は出所情報の効果で、同じ作品でも人間作と表示すれば評価が変わる。盲検研究ではAI生成文のほうが高く評価されながら、AI生成と表示すると評価が下がった。<br><br>ただし効果の大きさや向きは文脈や指標によって異なり、AI利用が作り手の動機や創造的アイデンティティ、技能に長期的に与える影響はまだ分かっていない。高評価の結果だけでは、どの人間の貢献に価値があったかや、委譲の帰結は見えない。何をAIに委ねるかという選択自体が主体性の表現になりうる。出典：Frontiers in Artificial Intelligence","timestamp":1794873600000,"title":"The psychological value of creatorship in the era of generative AI","titleJa":"生成AIの時代における「創ること」の心理的価値","url":"https://www.frontiersin.org/articles/10.3389/frai.2026.2018203"},{"authors":["Kwan Hong Tan"],"categories":[],"field":"International Journal of Law Management & Humanities","genre":"Ethics / Safety","monthKey":"2026-11","publishedAt":"2026-11-17T00:00:00Z","source":"Crossref","summaryHtml":"制度の記録は正確でも、その記録だけでは人の性格や信用、将来の能力についての重大な判断を正当化できない場合がある。本論文は、その隔たりが通常の証拠上の不確実性ではなく、不当な制度的誤認にあたるのはいつかを問う。物語的アイデンティティ、承認理論、認識的不正義、分類研究、プライバシー、理由付き行政の統合的検討から、「物語の非枯渇性の原則（PNE）」を提唱する。<br><br>PNEによれば、制度は目的に縛られた記録と、それに基づいて下す広い結論とのあいだの推論の隔たりを正当化しなければならない。問題は記録の不正確さやアルゴリズム的ラベルの持続期間ではなく、繰り返される決定を通じた暗黙の一般化を含む推論の行き過ぎにある。精緻化された「物語の非枯渇性レビュー」は、重大性と一般化の入り口を区別し、範囲・根拠・声・改訂可能性・比例性を評価する。<br><br>実証済みの不正行為とその後の改善、不確実なリスク、第三者の安全が絡む職業上の保護をめぐる仮設事例では、歴史的な認定を不変のアイデンティティとして扱うことなく、制限的な決定が正当化されうることが示される。著者は新たな実定法上の権利を主張するのではなく、行政の合理性や文脈的整合性、手続き的公正との重なりを認めたうえで、理由のある非枯渇的な制度判断が求めるものを運用可能な形で具体化した。実証的検証は今後の課題とされる。出典：Crossref","timestamp":1794873600000,"title":"The Right to Be More Than a Record: Narrative Non-Exhaustion, Human Dignity, and the Ethics of Institutional Judgment","titleJa":"記録以上の存在である権利――制度的判断における物語の非枯渇性","url":"https://doi.org/10.63108/ijlmh.13224"},{"authors":["Michael Hambrook"],"categories":[],"field":"Psychopathology","genre":"Consciousness / Philosophy","monthKey":"2026-11","publishedAt":"2026-11-17T00:00:00Z","source":"Crossref","summaryHtml":"近年、精神医学の哲学や認知科学では、自閉症と神経多様性を現象学・生態学・エナクティビズムの観点から捉え直す動きが広がっている。これらのアプローチは、神経還元主義や計算論的な生物医学パラダイムに異を唱え、身体性や関係性、感情、社会物質的環境が認知に果たす構成的な役割を中心に置く。ただし現象学もエナクティビズムも一枚岩ではなく、そのすべてが植民地近代の前提を逃れているわけではない。<br><br>本論文は、古典的な現象学が自閉症を暗黙の西洋的な「神経定型」の身体性や間主観性からの逸脱として位置づけてきたと指摘する。これに対し批判的現象学は、権力が身体性をどう形づくるかに注目し、現象学的手法そのものの欧州中心的な神経規範性への加担を問い直す。エナクティビズムはさらに進んで、認知の多様性を包摂する関係的存在論を提示し、非西洋や先住民の知のあり方との対話を開く。ただし植民地性や交差的な抑圧に無自覚なままでは、政治的に中和される危険もあるという。<br><br>著者は南アジアの自閉症者の経験から示唆を得て、神経規範的・欧州中心的な前提（ロゴス中心主義や人間中心主義を含む）を解体する批判的エナクティビズムの枠組みを描く。神経学的・認知的差異を本質化することなく、文化や生態に位置づけられた多様な意味生成の様式に正当な光を当てる、多元的で異文化的な自閉症理解への道を開くものだ。出典：Crossref","timestamp":1794873600000,"title":"Decolonising Autistic Phenomenology: Towards a Critical-Enactive Account of Cognitive Diversity","titleJa":"自閉症の現象学を脱植民地化する――認知の多様性を捉え直す批判的エナクティビズム","url":"https://doi.org/10.1159/psp/aelag017"},{"authors":["Zhenyu Qiao"],"categories":[],"field":"NeuroData","genre":"Ethics / Safety","monthKey":"2026-11","publishedAt":"2026-11-17T00:00:00Z","source":"Crossref","summaryHtml":"中国はブレイン・コンピュータ・インタフェース（BCI）に関する国家政策を急速に増やしてきたが、それらが倫理を産業競争に従属させているのか、真の抑制を組み込んでいるのかは議論が分かれてきた。本論文は、10年間に出された9つの国家政策文書を対象に、振興計画3件と倫理・審査・標準文書6件を混合手法の文書分析で検証する。6つのテーマの有無をコード化し、前半と後半でテーマの出現率と文書あたりの制約量を比較した。<br><br>初期の3文書はいずれも制約規定を持たず、すべてが革新目標を掲げていた。一方、後期の6文書には21件の制約規定が分散し、安全性と標準、神経データ保護、倫理審査が増加した。制約量の中央値は0.00から4へ上昇し（p=0.024）、統計的にも有意な変化だった。革新目標は後期の2文書にも残ったが、データガバナンスと倫理条項が組み込まれていた。<br><br>結論として、中国のBCI政策は振興を放棄したのではなく、倫理ガバナンスへの全般的な転換の後に、振興のアジェンダをそのまま維持した上で倫理的制約を重ねたものだった。政策のバランスは「振興のみ」から「抑制付き振興」へ移ったと結論づけている。出典：Crossref","timestamp":1794873600000,"title":"Innovation targets and ethical limits in China's brain-computer interface policy: national ethics guidelines versus industrial promotion plans","titleJa":"中国のブレイン・コンピュータ・インタフェース政策における革新目標と倫理的限界","url":"https://doi.org/10.63688/neurodata2026184"},{"authors":["Shivam Duggal","Zongze Wu","William T. Freeman","Antonio Torralba","Richard Zhang","Eli Shechtman"],"categories":["cs.LG","cs.AI","cs.CL"],"field":"cs.LG","genre":"LLM / NLP","monthKey":"2026-11","publishedAt":"2026-11-16T18:59:38Z","source":"arXiv","summaryHtml":"言語モデルは通常、層を深くする、層を繰り返す、潜在的な推論ステップを増やすことでトークンあたりの計算量を増やしてきた。本論文は別の軸を提案する。計算状態の数を増やす「潜在の格子（Lattice of Latents）」である。各層に、時間方向へ再帰的に流れる水平方向の潜在ストリームを設け、深さ方向へ流れる垂直の残差ストリームと並走させる。ハイパーコネクションなどが残差経路を付け替えるのに対し、格子はトークンをまたいで持続する伴走的な計算状態を与える。<br><br>ハイブリッドなTransformer-SSMでは再帰状態は主に系列混合のための内部記憶だが、格子の潜在状態は垂直ストリームの注意やKVキャッシュへの書き込み、MLP計算、デコーディングに直接条件づける。200億トークンのFineWeb-Eduで学習した4億600万パラメータのモデルでは、検証パープレキシティがパラメータ一致のTransformerの15.41から14.40へ低下した。ハイパーコネクションや入力残差と組み合わせると13.61まで下がる。<br><br>さらにGated DeltaNetやMamba-2などのハイブリッドでも、すべてのネイティブ状態サイズで改善し、格子付きの変種は4倍大きなネイティブ状態を持つ純粋なベースラインを上回った。層ごとの持続的状態は、言語モデルの計算をスケールさせる補完的な軸であることが示された。出典：arXiv","timestamp":1794855578000,"title":"Latent Lattice Language Models","titleJa":"潜在格子言語モデル――層ごとに時間方向へ流れる潜在状態で計算容量を増やす","url":"https://arxiv.org/abs/2611.21608"},{"authors":["Ruixi Yu","Dairu Liu","Xuchuan Chen","Zekun Qi","Zekai Li","Zhuo Cao","Luyang Niu","Yingsheng Zhang","Sikai Liang","Ke Fan","He Wang","Li Yi"],"categories":["cs.RO"],"field":"cs.RO","genre":"Agents / Robotics","monthKey":"2026-11","publishedAt":"2026-11-16T18:59:37Z","source":"arXiv","summaryHtml":"GPT-6 Astraのような最先端の視覚言語モデルはロボット制御でも優れた能力を示し、広範な事前学習が物理的な行動にも有用な知識を与えることが示唆されている。にもかかわらず、視覚言語行動（VLA）ポリシーの多くははるかに小さなバックボーンに依存している。本論文は、5520億パラメータのDeepSeek-V4.1-Flashバックボーンに学習可能なアクションDiTを接続したScaleVLAを導入し、20億から5520億パラメータまでのVLMを共通の学習設定で体系的に比較した。<br><br>ロボット基盤モデルの3つの基本的機能を評価した。サンプル効率では、10回のデモンストレーションだけで、50回で学習した20億パラメータのバックボーンを上回った（87.8%対85.6%）。汎化では、LIBERO-PROの成功率が45.1%に達し、小規模バックボーンの最大31.3%を大きく上回った。精密な操作では、実世界での充電器挿入が10回中4回から9回へ改善し、接触に敏感なアライメントで効果が集中した。<br><br>規模にもかかわらず、ScaleVLAはアクションチャンクあたり中央値216ミリ秒の遅延を達成した。最先端VLMは推論エージェントとしてだけでなく、効率的で汎化するロボットポリシーのための強力な表現基盤にもなりうるという結論である。出典：arXiv","timestamp":1794855577000,"title":"ScaleVLA: Scaling Vision-Language-Action Models to 552 Billion Parameters","titleJa":"ScaleVLA――5520億パラメータの視覚言語行動モデルへスケールする","url":"https://arxiv.org/abs/2611.21607"},{"authors":["Huawei Lin","Jinting Liu","Tongyan Wang","Xuyang Chen","Ruihua Shi","Zhichao Xu","Jiaxin Qin","Guoshenghui Zhao","Baijian Yang","Yingjie Victor Chen","Tan Yu","Weijie Zhao"],"categories":["cs.CV","cs.AI"],"field":"cs.CV","genre":"Agents / Robotics","monthKey":"2026-11","publishedAt":"2026-11-16T18:59:04Z","source":"arXiv","summaryHtml":"超高解像度の写真について問いに答えるビジュアルエージェントは、関連する領域へズームして証拠を読むべきだが、既存のエージェントは証拠を読む代わりに常識から答えることが多い。最終回答への強化学習では、推測も読解も同じ報酬を得るため、この欠陥を正すことはできない。<br><br>本研究は対照セットで訓練するCross-Input Relative Policy Optimization（CrossRPO）を提案する。対照セットは、証拠を含む小さな領域だけが異なり答えも異なる複数バージョンの画像に同じ問いを投げ、セット全体を解いて初めて報酬が得られる仕組みで、常識で解けたセットを強化しないことも証明した。21〜120メガピクセルの画像で訓練用ViRA-Trainと評価用ViRA-Benchを構築し、編集の痕跡を排除するため実写の変化によるViRA-Bench-Realも用意した。<br><br>約3,500件で訓練したViRA-9BとViRA-27Bは、最高解像度でCrossRPOがセット正答率63.3%を達成し、GRPOの59.3%を上回った。ViRA-9Bは同規模の公開モデルで最も正確で、ViRA-27Bは多くのベンチマークでClaude Haiku 5.5とGPT-6-Lunaを上回った。出典：arXiv","timestamp":1794855544000,"title":"ViRA: Toward Ultra-High-Resolution Visual Agents via Cross-Input Relative Policy Optimization","titleJa":"ViRA――超高解像度ビジュアルエージェントのための交差入力相対方策最適化","url":"https://arxiv.org/abs/2611.21605"},{"authors":["Rohit Gandikota","Arnab Sen Sharma","Adam Belfki","David Bau"],"categories":["cs.CV","cs.CL","cs.LG"],"field":"arXiv","genre":"Vision / Multimodal","monthKey":"2026-11","publishedAt":"2026-11-16T18:58:30Z","source":"arXiv","summaryHtml":"視覚言語モデル（VLM）が画像を説明するとき、対象を一つずつ挙げて繰り返すことはめったにない。しかしモデルがその順序をどう計画しているのかは明らかでなかった。本研究は、モデルが見る前にどこを見るかを決める仕組みを4つの部分からなるものとして特徴づける。まず結合ヘッドが関連するテキストトークンを画像と照合し、一致した画像領域へのポインタへ解決する。<br><br>次に同じ結合ヘッドが書かれた回答をその由来の領域に結びつけ、進捗信号へ変える。すなわち、列挙が画像のどこまで進んだかを示すカーソルである。選択ステップはカーソルの後で最も近い未記述の領域を選ぶか、停止する。最後に注視ヘッドが選ばれたポインタを実行し、そこに描かれたものの概念を返し、言語ヘッドと後段のMLPが質問の言語の単語へ変える。<br><br>各部分はQwen3-VLでの因果パッチングにより合成視覚検索課題で検証され、代替仮説とも比較された。この仕組みは入力形式、自然写真、言語を越えて成り立ち、結合・中継・注視の各ヘッドは20億から320億パラメータのあらゆる規模に現れる。質問を画像から一連の回答へ変える過程を層ごと・トークンごとに調べる道が開かれる。出典：arXiv","timestamp":1794855510000,"title":"How VLMs Plan What's Next","titleJa":"VLMは次に何を見るかをどう計画するか――視覚言語モデルの注視メカニズム","url":"https://arxiv.org/abs/2611.21600"},{"authors":["Awni Altabaa","John Lafferty","Omar Montasser"],"categories":["cs.LG","stat.ML"],"field":"cs.LG","genre":"LLM / NLP","monthKey":"2026-11","publishedAt":"2026-11-16T18:58:07Z","source":"arXiv","summaryHtml":"思考連鎖（CoT）のデモンストレーションから、自己回帰的な次トークン生成器を学ぶ問題を扱う。学習の対象は、ある関数クラスFに属する生成器fが生成した長さTの思考連鎖デモンストレーションから、その生成器自体を学ぶ問題である。CoTの長さに依存しない最適なサンプル複雑性を達成する、バギングに基づく単純なアルゴリズムを提案する。ブートストラップ標本でCoT整合的に訓練した生成器の多数決を出力する仕組みだ。<br><br>二値トークン集合では、サンプル複雑性はO((d_VC+log(1/δ))/ε)で最適であり、CoT長Tには依存しない。有限トークン集合ではVC次元がグラフ次元d_Gに置き換わり、log|Σ|因子までの最適性を達成する。多数決アンサンブルに必要な生成器の数はO(log(T/δ))にとどまる。<br><br>さらにアンサンブルは、n log(nT)個のラベルなしプロンプトを代償として、クラスF内の単一の生成器へ蒸留できることも示した。二値の場合の最適性はCoT長に依存せず、有限集合でも対数因子の範囲内に収まるという理論保証が要点であり、思考連鎖による学習の理論的な基盤を与える結果である。出典：arXiv","timestamp":1794855487000,"title":"Optimal Autoregressive Chain-of-Thought Learning via Bagging","titleJa":"バギングによる最適な自己回帰型思考連鎖学習","url":"https://arxiv.org/abs/2611.21597"},{"authors":["Junhan Sun","Yigui Feng","Mingzhe Liu","Haoyan Xu","Lei Ye","Ziqi Han","Hanru Bai","Yanzhao Zhang","Hao Zhao","Guofeng Zhang"],"categories":["cs.RO","cs.LG"],"field":"cs.RO","genre":"Agents / Robotics","monthKey":"2026-11","publishedAt":"2026-11-16T18:58:03Z","source":"arXiv","summaryHtml":"Joint-Embedding Predictive Architecture（JEPA）では、射影器の出力をうまく制約しても表現崩壊を防げない。初期状態からエンコーダの表現は入力間で共通する成分に支配されており、バッチ正規化された射影器がその成分を除去するため、射影器の後段での正則化では修正できず、表現間の差が縮んで崩壊に至る。本論文は、元の学習目的を保ったまま、必要なときだけエンコーダ自体を直接制約するSADL（Supply And Demand Loss）を提案する。<br><br>SADLは、射影器の出力が要求する表現の差と、エンコーダが保持して渡せる差を比べ、供給が需要に届かない場合にのみ制約を加える。補助ネットワークや追加の学習パラメータ、構造変更は不要で、複数の需要正則化手法と組み合わせられる。単一タスクと4タスク同時学習のLeWorldModel（LeWM）およびINTACTの実験では、10シードでの崩壊率が50%から0%に下がり、1エポック後のエンコーダの実効ランクはベースラインの3.4〜6.4倍、潜在予測誤差は20分の1から303分の1になった。<br><br>損失の重みを桁違いに変えても頑健で、INTACTは複数の需要正則化手法で平均95%超の探索なし制御成功率を達成した。4つの画像データセットでも精度とシード間の安定性が一貫して改善した。正則化が要求する表現の差とエンコーダが供給できる差を一致させることが、制御と画像分類における表現学習を速く安定させることを示した。出典：arXiv","timestamp":1794855483000,"title":"SADL: On the Demand-Supply Geometry of Representation Collapse","titleJa":"表現崩壊の需要と供給――JEPAのエンコーダを直接制約するSADL","url":"https://arxiv.org/abs/2611.21596"},{"authors":["Zeynab Anbiaee","Sajjad Dadkhah","Ali A. Ghorbani"],"categories":["cs.CR"],"field":"cs.CR","genre":"Ethics / Safety","monthKey":"2026-11","publishedAt":"2026-11-16T18:49:37Z","source":"arXiv","summaryHtml":"LLMアプリがエージェントとして外部ツールを選択・呼び出す時代になり、モデル・コンテキスト・プロトコル（MCP）が複数サーバーのツールを組み合わせる標準となった。しかし発見と選択に使うツールのメタデータは、検証済みの提供者アイデンティティに結びついているとは限らない。<br><br>本研究はこの隙間を「ツール提供者ミスバインディング」として定式化する。正規の提供者向けのはずの要求が、攻撃者の管理するツールに解決されてしまう失敗である。攻撃者はホストもLLMも正規サーバーも侵害せず、選んだメタデータを掲げる別のMCPサーバーを運用するだけだ。攻撃者制御のツール選択最適化問題として定式化し、5つのLLMクライアントで制御されたMCP環境で評価した。<br><br>結果として、相互作用がミスバインディングを駆動した。完全な名前衝突、タスクに合った説明、適合するスキーマが重なると最も強い失敗が起きるが、権威を高めた説明と適合スキーマだけでも、名前衝突なしに誤った提供者での実行や提供者の曖昧さを招いた。モデルごとに弱点の現れ方も異なり、攻撃者制御の提供者選択、確認要求、不安定な提供者解決などが見られた。出典：arXiv","timestamp":1794854977000,"title":"When Tool Names Are Not Identities: Measuring Provider Misbinding in MCP-Based AI Agents","titleJa":"ツール名は身元ではない――MCP型AIエージェントにおける提供者ミスバインディングの測定","url":"https://arxiv.org/abs/2611.21577"},{"authors":["Arunkumar V","Gangadharan G. R.","S. Senthilkumar"],"categories":["cs.LG","cs.CL"],"field":"cs.LG","genre":"LLM / NLP","monthKey":"2026-11","publishedAt":"2026-11-16T18:34:08Z","source":"arXiv","summaryHtml":"言語モデルは中央銀行の文書を読み、経済予測に使われるようになった。しかし多くのモデルは、読む文書より後に書かれたテキストで訓練されている。2021年のFOMC声明を読むモデルは2022年のインフレ上昇を既に知っているかもしれず、見かけの技能の一部は結果の記憶、すなわち時間的なテストセット汚染によるものだ。<br><br>本研究は2000〜2026年のFOMC声明と議事要旨でこの記憶を測定した。固定日以前のテキストのみで訓練した時間整合モデルと比較すると、日付だけを与えて過去のGDPを問うても、答えを知り得ないモデルがAUC最大0.64に達し、偶然を基準にするのが誤りだと分かった。同じ問いでの比較では、多くの現行モデルが成長の強かった年を想起していた。メンバーシップ推論スコアは、モデルが見たかどうかではなく時代や文書種別で文書を並べ替えた。<br><br>実時間ナウキャストでは、推定したすべての先読みプレミアムはマクロ経済の標本規模では検出可能な水準より小さく、GDPとインフレのいずれも多重検定補正後に残るものはなかった。先読み監査は、記憶のないモデルとの同一項目での直接比較で記憶を測るべきだという結論である。出典：arXiv","timestamp":1794854048000,"title":"Reading or Remembering? Measuring Temporal Contamination in Language Models","titleJa":"読んでいるのか、覚えているのか――言語モデルにおける時間的汚染の測定","url":"https://arxiv.org/abs/2611.21554"},{"authors":["Kanchana Ranasinghe","Honglu Zhou","Dominick Reilly","Le Xue","Shusheng Yang","Juan Carlos Niebles","Silvio Savarese","Ran Xu"],"categories":["cs.CV"],"field":"cs.CV","genre":"Agents / Robotics","monthKey":"2026-11","publishedAt":"2026-11-16T18:33:47Z","source":"arXiv","summaryHtml":"ストリーミング動画を理解するシステムは、自然で有用な対話のために先回りして応答する必要がある。証拠が十分になったらすぐに応答しつつ、早すぎる・冗長な・誤った応答は避けなければならない。BLIP-Liveはこの「先回り性」を、応答するか黙るかという因果的な応答決定として定式化し、データ・指標・ハーネス・学習を統一する枠組みである。<br><br>先回り応答の内容とタイミングについて人手で注釈した78万件のデータセットBLIP-Live-780Kを構築し、応答の速さと発火の精度を組み合わせた指標PAUC-Fを提案した。過剰な発火を報酬せず、早くて有用な応答を評価する。オフラインの視覚言語モデルに先回り能力を引き出す推論ハーネスと、応答性をさらに高める学習パイプラインも検討された。<br><br>スライディング式の視覚ウィンドウ、オンライン対話メモリ、構造化された応答出力の組み合わせが最も強い先回り性能を示した。BLIP-Live-Qwenモデルは4つの先回りストリーミングベンチマークで最先端性能を達成し、ベースラインを最大44%上回り、複数の商用APIモデルも上回った。出典： arXiv","timestamp":1794854027000,"title":"BLIP-Live: Balancing Timeliness & Firing Precision in Proactive Streaming Video Agents","titleJa":"ストリーミング動画エージェントの先読み応答――タイミングと精度を両立するBLIP-Live","url":"https://arxiv.org/abs/2611.21553"},{"authors":["Brian T. Weston","Alondra Torres Contreras","Aldair E. Gongora"],"categories":["cs.AI","cs.LG","physics.comp-ph"],"field":"arXiv","genre":"Agents / Robotics","monthKey":"2026-11","publishedAt":"2026-11-16T18:27:09Z","source":"arXiv","summaryHtml":"自律的な実験エージェントの科学的判断力を測る対話型ベンチマークSciResearch-Evalが提案された。課題は材料の熱特性を測る標準的な実験室問題で、エージェントは自ら実験を設計し、解像度不足や物理的に誤ったシミュレータを使い、各物性値を95%区間付きで報告する。エージェント設計の実験、意図的に欠陥のあるシミュレータ、厳密な正解に対する較正済み区間の適正な採点を組み合わせた初のベンチマークだという。<br><br>93課題・9モデル・2511エピソードの評価では、手続き上の罠は多くのモデルが処理できた。しかしシミュレータに物理が欠けていると、大半のモデルは誤った値を95%確信ありとして報告し、区間が真値を含む割合は20〜62%にとどまった（GPT-6 Astraは94%、Claude Fable 5.2は99%）。既定の労力では失敗したClaude 5.5系は欠落した物理をめったに診断できず、診断できても区間は外れることが多かった。AstraとFableは欠陥のあるシミュレータが正確に働く緩やかな加熱などの実験を設計し、原因を名指しできなくても較正を保った。<br><br>区間を広げるよう求めても改善せず、方略を明言させると区間スコアは1.6〜2.5倍に改善したが、網羅率はほぼ動かなかった。事前登録済みの労力アブレーションでは、修正がClaude 5.5系に潜在していることが示された。最大の労力ではOpusは10倍以上改善し、既定のAstraと検出可能な差がなくなったが、13〜31倍の推論を要した。環境・採点器・ハーネスは公開される。出典：arXiv","timestamp":1794853629000,"title":"SciResearch-Eval: Evaluating Scientific Judgment in Autonomous Experimental Agents","titleJa":"SciResearch-Eval――自律実験エージェントの科学的判断力を測るベンチマーク","url":"https://arxiv.org/abs/2611.21541"},{"authors":["Jorge Valverde-Rebaza","Nathan Garcia-Larios","Karime Ruvalcaba-Perez","Alejandro Rendon"],"categories":["cs.CL"],"field":"cs.CL","genre":"LLM / NLP","monthKey":"2026-11","publishedAt":"2026-11-16T18:24:48Z","source":"arXiv","summaryHtml":"LLMは公的な言語の解釈・生成・仲介に使われることが増え、政治的に敏感な場面での信頼性がとりわけ重要になっている。感情分析はよくある課題だが、ソーシャルメディアの言説における感情的意味は、文化的に位置づけられた間接的な手がかりで伝えられることが多く、ラベル中心の評価だけでは捉えきれない。<br><br>本研究はスペイン語の政治言説に対するLLMの頑健性を評価する診断プロトコルを導入する。3つの独立した人間アノテーションを組み合わせたGold・Ambiguousサブセットと、モデル条件付きパープレキシティとLLM-as-a-judgeで選んだ感情反転の反事実から作ったSyntheticサブセットを用い、プロプライエタリモデルとオープンウェイトモデルをゼロショット・フューショットで比較した。<br><br>アノテーションの曖昧さと反事実の摂動は、元のデータでの従来評価では見えにくい失敗モードを露わにした。GPT-4.1-miniが最も安定し、小さいオープンウェイトモデル2つは合成摂動でより大きく劣化し、フューショットは限定的な改善にとどまった。3者間の人間感情アノテーション付きスペイン語ソーシャルメディアデータセットも公開される。出典：arXiv","timestamp":1794853488000,"title":"Evaluating Cultural Reasoning and Robustness in LLMs for Spanish Political Discourse","titleJa":"スペイン語政治言説におけるLLMの文化的推論と頑健性の評価","url":"https://arxiv.org/abs/2611.21535"},{"authors":["Arunkumar V","Manoranjan Gandhudi","Gangadharan G. R.","Arun Prakash","S. Senthilkumar"],"categories":["cs.AI","cs.CL","cs.LG"],"field":"arXiv","genre":"LLM / NLP","monthKey":"2026-11","publishedAt":"2026-11-16T18:20:09Z","source":"arXiv","summaryHtml":"認可ポリシーがエージェントのツール呼び出しを拒否したとき、監査ログは判断を強制した事実だけを挙げるべきである。列挙可能な文脈空間上の実行可能ポリシーでは、この最小十分理由を厳密に計算できるため、説明は近似ではなく正解と照らして採点できる。本研究は、誤りのない検証器からモデルが何を学べるかを問う。説明者は要求と判断だけを見てポリシーを知らず、30ターン以内に改変した要求でポリシーを試し、候補の事実集合が十分かを問うことができる。<br><br>最先端モデルでもツールだけで厳密な理由を見つけられるのは約半数にとどまり、「答えを縮めよ」という一文の指示でHaiku 4.5は58%から75%へ上がった。削除アルゴリズムの実行履歴2000件でファインチューニングした40億パラメータモデルは、訓練したポリシーで92%に達した。決め手は教師の種類で、同じデータ量でもアルゴリズムから学んだ生徒が最先端モデルから学んだ生徒を3つのシードすべてで上回った。<br><br>生徒が学んだのは十分性チェックの固定された手順であり、その手順は持ち運べない。未見の3つの公開ポリシーでは回答は94%が十分であり続けたが、最小であり続けたのは48%にとどまった。一方、同じ一文の指示を受けたHaikuは47エピソードすべてで厳密だった。厳密な報酬による強化学習は汎化精度を変えず、方略を反転させた。検証器は訓練の効果を見える化したが、訓練を良くはしなかった。出典：arXiv","timestamp":1794853209000,"title":"Procedure without Judgment: What Small Language Models Learn under an Exact Verifier","titleJa":"判断なき手続き――厳密な検証器のもとで小規模言語モデルは何を学ぶか","url":"https://arxiv.org/abs/2611.21529"},{"authors":["Minjae Kwon","Amir Moeini","Shangtong Zhang","Lu Feng"],"categories":["cs.LG","cs.AI"],"field":"arXiv","genre":"Ethics / Safety","monthKey":"2026-11","publishedAt":"2026-11-16T18:16:28Z","source":"arXiv","summaryHtml":"安全な文脈内強化学習（Safe ICRL）は、パラメータ固定のポリシーが未知の制約付きタスクについて、相互作用の履歴だけから改善しつつコストを予算内に収めることを求める。従来の安全アルゴリズム蒸留（Safe AD）は、安全な強化学習アルゴリズムの学習履歴から学ぶが、適応に失敗することがあった。たとえば移動タスクでは報酬がゼロを下回り続け、CarGoalではゴールにほとんど到達しない。<br><br>本研究はSafe ADの二つの要素を見直した。まず、予算を意識する教師を蒸留する。教師は二段階で、予算が多く残るほど探索を広げ、最初の報酬やコストを得たあとは専門家ポリシーが残予算内で活用する。教師の履歴は固定予算と動的予算の両方で収集し、動的予算はすべての環境で報酬と予算入力の占有エントロピーを高め、テスト時にはDarkRoomとHalfCheetahで報酬を上げコストを下げた。<br><br>さらにテスト時調整A-Lagを提案する。蒸留ポリシーの行動を予測コストで重み付けし、観測されたコストから適応的ラグランジュ乗数を更新する。実験ではA-Lagは5環境すべてでSafe ADより平均エピソードコストが低く、4環境では最終報酬も下回った。出典：arXiv","timestamp":1794852988000,"title":"Algorithm Distillation for Safe In-Context Reinforcement Learning","titleJa":"安全な文脈内強化学習への蒸留――予算を意識する教師とテスト時調整","url":"https://arxiv.org/abs/2611.21524"},{"authors":["Charles Xiao"],"categories":["cs.AI"],"field":"cs.AI","genre":"Ethics / Safety","monthKey":"2026-11","publishedAt":"2026-11-16T18:13:01Z","source":"arXiv","summaryHtml":"AIエージェント同士が情報を中継するとき、注入された指示の効果は、文言が変わっても下流のエージェントに伝播しうる。一方で、正当な引用やテンプレートの再利用も高いテキスト類似度を生む。テキスト類似度に基づくガードレールは、この両者を混同する危険がある。本論文は、BLEU、ROUGE-L、METEORを組み合わせた公開分類器DonkeyRailを3エージェントのメール中継で検証し、行動的な尺度――注入された手順が後続の2エージェントで新たな計算を引き起こすかどうか――で評価した。<br><br>既定のしきい値では、分類器は機能的な出力19件のうち8件を見逃す一方、正当な返信192件のうち70件を誤って警告し、引用やテンプレート再利用の完了した返信はすべて誤警告となった。偽陽性を抑えるよう再校正しても、新しいテンプレートでは機能的出力を1件しか検出できず、誤警告は15件残った。さらに、公開された21の分類器設定すべてに、ROC補間が直接のしきい値適用を置き換える運用上の誤りがあることも特定した。<br><br>また、表層的なテキスト基準に対する高いAUCが、行動的な標的に対する高いAUCを保証するわけではないことを形式的に示し、同一の可視トランスクリプトでも、支配的なポリシー次第で異なる安全判断が求められることを指摘した。著者らは、テキスト類似度ガードレールではなく、行動的でポリシーに根ざした評価へ移るべきだと主張している。出典：arXiv","timestamp":1794852781000,"title":"Safe Resemblance, Silent Propagation: Limits of Text-Similarity Guardrails for AI Agent Safety","titleJa":"似ていることの罠――テキスト類似度ガードレールはAIエージェントの安全性を守れるか","url":"https://arxiv.org/abs/2611.21520"},{"authors":["Dumindu Samaraweera","Prashant Shekhar"],"categories":["cs.CR","cs.CL"],"field":"cs.CR","genre":"Ethics / Safety","monthKey":"2026-11","publishedAt":"2026-11-16T17:56:12Z","source":"arXiv","summaryHtml":"視覚言語エージェントが生成する説明や判断、指示は、利用者や下流のエージェント、自動化されたワークフローで再利用される。そのため、応答品質を不必要に落とさず、コンテンツの真正性と展開後の監査を支える出所の仕組みが必要になる。本研究は、予測の不確実性とゼロショットのマルチモーダル関連性・リスク指標を組み合わせ、復号時に透かしの強さを割り当てる、リスク認識型の意味的透かしフレームワークを提案する。<br><br>一つのリスクペナルティλが連続的な運用フロンティアを示し、モデルの再訓練なしに展開時の検出と品質のトレードオフを選べる。選んだ動作点では、平均の透かし強さは固定強度の透かしに比べて約59.4%下がり、パープレキシティの変化は0.3634から0.1689へ縮小し、原文と換言後のROC-AUCは0.9552と0.9459に達した。平均強さを揃えた比較でも、リスク制約付き割り当ては固定方式やエントロピーのみ、重要度のみの方式を大幅に上回り、優位性は介入量の少なさではなく割り当て方針によることが示された。<br><br>さらに、有限サンプルでのしきい値較正は誤検出率の大きな変動を生むことも示し、監査可能な出所のためには較正のばらつきの報告を標準とすべきだとする。出典：arXiv","timestamp":1794851772000,"title":"Detection-Efficient Watermarking for Vision--Language Agents via Risk-Constrained Strength Allocation","titleJa":"検出効率の良い透かし――視覚言語エージェントのためのリスク制約付き強度割り当て","url":"https://arxiv.org/abs/2611.21488"},{"authors":["Henry Zheng","Weibo Gong","Yang Yue","Rui Huang","Yang Zhang","Gao Huang"],"categories":["cs.CV"],"field":"cs.CV","genre":"Agents / Robotics","monthKey":"2026-11","publishedAt":"2026-11-16T17:54:39Z","source":"arXiv","summaryHtml":"体現エージェントが繰り返し訪れる環境で確実に動くには、視点が変わっても再訪した場所を認識し、似た部屋と区別し、環境の変化に合わせて記憶を更新する、持続的な空間理解が欠かせない。しかし既存の評価は、離れた訪問をまたぐ物理的な場所の同一性を暗黙の前提にしがちだった。<br><br>本研究は、590の合成・実住宅シーンにわたる3,244問からなるベンチマークReSpaceBenchを導入する。部屋の対応付け、持続的な状態追跡、下流の推論にまたがる9タスクで構成され、制御された歩行では物理的な部屋への入室で訪問を定義し、同種の部屋の妨害物やセッションをまたぐ物体の変化を意図的に含めた。32のモデルと3つのエージェント型動画理解フレームワークを評価した結果、最強のゼロショットモデルでも全体正答率は50.5%、450問の部分集合では52.2%にとどまり、人間の注釈者の90.1%に大きく及ばなかった。エージェント型フレームワークも、同じ基盤モデルでの直接推論を全体として上回らなかった。<br><br>エージェントの実行記録の分析では、証拠の見落としと訪問をまたぐ部屋の誤対応が主要な失敗要因で、反復的な証拠探索だけでは一貫した空間記憶は保証されないことが示唆された。見慣れた部屋の認識と正しい訪問済み部屋の特定のあいだにも隔たりがあった。別途提供される学習用データRS-30KでQwen3-VL-8Bを微調整すると全体正答率は35.5%から60.4%へ上がり、対応付けで最も大きく改善し、実生活のシーンにも及んだ。出典：arXiv","timestamp":1794851679000,"title":"Lost in the Hallway: Benchmarking Persistent Spatial Memory Across Revisits","titleJa":"廊下で迷子に――再訪をまたぐ持続的空間記憶のベンチマーク","url":"https://arxiv.org/abs/2611.21485"},{"authors":["Ruizhe Li","Licheng Zhang","Mingxuan Du","Zhendong Mao"],"categories":["cs.CL"],"field":"cs.CL","genre":"Agents / Robotics","monthKey":"2026-11","publishedAt":"2026-11-16T17:50:53Z","source":"arXiv","summaryHtml":"エージェントが過去の対話から記憶を引くとき、従来は現在の質問との類似度で探していた。しかし役に立つ記憶が質問に似ているとは限らない。本論文はこの前提を疑い、類似度検索をやめて、蓄えた記憶すべてを有用性で採点して並べ替えるJetrieverを提案する。採点には判定モデルJevを用い、各記憶が現在の質問に対してどれだけ決定的かを評価する。<br><br>間接的な問い125件のベンチマークInMindでは、正解のやり取りを1位に置けた割合が84.8%に達し、BM25の1.6%、MiniLMの0%を大きく上回った。証拠の発見と順位付けを分けた20問の比較では、JevとQwen3.5 9Bは50位までに正解の90%を発見したが、1位の精度はJevが85%、Qwen3.5 9Bが40%にとどまった。MemoryAgentBenchの60問でも、Jetrieverの4次元スコアは55.4%で、ReFindの44.3%を上回った。<br><br>全件採点のコストも低く、1問あたり平均でInMindが0.00834ドル、MemoryAgentBenchが0.03103ドルにとどまる。世界知識を活かした有用性評価と、決定的な記憶を先頭に置く採点が、安価な全件スコアリングで実現できることを示した。出典：arXiv","timestamp":1794851453000,"title":"Jetriever: Shifting Agent Memory Retrieval from Similarity to Utility","titleJa":"エージェントの記憶検索を類似度から有用性へ――Jetriever","url":"https://arxiv.org/abs/2611.21478"},{"authors":["Bryan A. Plummer","Shan Lu","Keval Doshi","Noranart Vesdapunt","Wei Wang","Jim Thomas","Kah Kuen Fu"],"categories":["cs.CV","cs.CL"],"field":"cs.CV","genre":"LLM / NLP","monthKey":"2026-11","publishedAt":"2026-11-16T17:43:21Z","source":"arXiv","summaryHtml":"重み因数分解は学習済みモデルを複数の因子に分解し、パラメータ数と浮動小数点演算を減らして遅延やメモリを削減する手法である。しかし行列を小さな複数の行列に置き換えるオーバーヘッドのため、演算削減がそのまま遅延削減につながらない課題があった。BTWFは因数分解モデルの構造を生かし、遅延の低減と学習能力の向上を同時に狙う。<br><br>共有基底の設定で、2つ以上の層を共有基底行列と層ごとの混合行列に分解する。共有する層の入力が同じ「双子」であれば、共有の順伝播を1回だけ行えばよく推論時間が短縮される。双子層はサイズが異なることが多く、従来法は大きい層を優先しがちだったが、BTWFは因子成分バランス（FCB）とブロック寄与バランス（BCB）を組み合わせてすべての共有メンバーをよく表現する。<br><br>学習時に一部の層の演算量が元を上回る過剰パラメータ化でも、テスト時に追加資源なしでタスク性能を高められることを示した。6モデル・9ベンチマークの実験では、微調整なしで最先端手法を2〜6%上回り、微調整ありでも1〜3.5%上回った。出典： arXiv","timestamp":1794851001000,"title":"Balanced Twin Weight Factorization for Efficient MLLMs","titleJa":"マルチモーダル大規模言語モデルの高速化――双子層の重み因数分解BTWF","url":"https://arxiv.org/abs/2611.21459"},{"authors":["Meng Tang","Siyuan Du","Yuxin Liu","Shuaishuai Cao","Di Wang","Haonan Guo"],"categories":["cs.CV","cs.AI"],"field":"arXiv","genre":"Vision / Multimodal","monthKey":"2026-11","publishedAt":"2026-11-16T17:42:12Z","source":"arXiv","summaryHtml":"超高解像度のリモートセンシング画像に対する質問応答では、全体像では小さな物体や局所的な属性が埋もれ、詳細な切り抜きは文脈を大量に消費するというジレンマがある。切り抜きを短い連続視覚潜在の系列に圧縮すれば、トークンを捨てたあともコンパクトな記憶が残るが、自然画像での診断研究ではモデルが潜在の内容を無視しがちで、解像度を落とした画像では失われる微細な対象を潜在が保持できるかは不明だった。<br><br>本研究は、領域選択と証拠保持を切り分けるため、高解像度の切り抜きを潜在メモリトークンに符号化し、凍結したバックボーンで予測への有用性と内容依存性を評価した。Qwen-VLの2世代にわたるLRS-GROでの評価では、64トークンのメモリが保持する切り抜きトークンを7.6〜9.9倍に圧縮し、全体画像だけと比べて精度が2.5〜4.8ポイント向上し、高解像度切り抜きの利得の大部分を回復した。XLRS-Benchでも一貫した挙動を示した。<br><br>別の画像や同じ場面の別領域のメモリに置き換えると精度が5.8〜7.4ポイント低下し、メモリを除くよりも悪くなったことから、予測は符号化された領域の証拠に依存していることが示された。コンパクトな視覚潜在は超高解像度リモートセンシングで有用な局所証拠を保持し、証拠の有無がその寄与を左右する鍵だと結論づけている。出典：arXiv","timestamp":1794850932000,"title":"Out of Sight, Into Memory: Compact Visual Latents Retain Local Evidence in Ultra-High-Resolution Remote Sensing","titleJa":"見えなくなっても記憶に残る――超高解像度リモートセンシングで視覚潜在が局所証拠を保つ","url":"https://arxiv.org/abs/2611.21457"},{"authors":["Roksana Goworek","Alexander Hickey","Federico Nanni","Martin O'Reilly"],"categories":["cs.CL","cs.AI"],"field":"cs.CL","genre":"LLM / NLP","monthKey":"2026-11","publishedAt":"2026-11-16T17:35:18Z","source":"arXiv","summaryHtml":"MITの報告によれば、フロンティア言語モデル「GPT-6 Astra」は小さなニューラルネットワークの重みを1回の返答で直接書き、重みだけからそのネットワークが何を学習したかを読み取れるという。本研究は3日間のスプリントでこの結果を再現・拡張した。重みの書き込みは再現し、Astraが書いたBreakout用のネットワークは514・550・307点で、MITの517点と同等だった。改変版のBreakoutでも同等の成績を示した。Claude Opus 5.5も動作するネットワークを書けたが、出力トークンを使い切ることが多かった。<br><br>新しいのはプログラムから重みへの翻訳そのものである。モデルはコードとして良い方策を書けるようになってから1世代遅れて、重みを書けるようになった。書かれたネットワークはコンパイル済みプログラムのように振る舞い、2つのモデルが独立にAstraのBreakoutネットワークをPythonへ逆コンパイルし、テストした全状態で行動が一致した。ただし手書き数字の分類では平均50%にとどまり、単純な分類器の82%を下回った。重みの読み取りはほぼ入力層の読み取りで、どのゲームかはほぼ完璧に当てたが、自作の3つのゲームでは盤上の配置は復元できても、ゲームの仕組みはほとんど読み取れなかった。<br><br>重みだけでの監査は可能だが浅い。コードを実行せずに、学習時に毒を混入された小規模言語モデルは10回中10回、追加学習で汚染されたものは10回中7回、悪意のあるアダプタは32件中23件を見抜いたが、トリガーや悪意ある挙動そのものは一度も特定できなかった。オープンウェイトモデルは後れを取っている。LLMは小さなネットワークを読み書きできるが、現状は手設計のプログラムのコンパイルと入力層の配置の読み取りに相当し、解釈可能性の有望だが初期の道具だという。出典：arXiv","timestamp":1794850518000,"title":"Replicating and Extending Weight-Space Programming: Frontier LLMs Compile Programs into Weights and Read Input Layers","titleJa":"重み空間プログラミング――フロンティアLLMはプログラムを重みにコンパイルする","url":"https://arxiv.org/abs/2611.21449"},{"authors":["Zhuoyang Li","Teng Shi","Jiakai Tang","Weijie Yu"],"categories":["cs.AI"],"field":"cs.AI","genre":"LLM / NLP","monthKey":"2026-11","publishedAt":"2026-11-16T17:28:45Z","source":"arXiv","summaryHtml":"推論で強化された生成推薦（GR）は、LLMの推論能力を次アイテム予測に活かす手法として注目されている。既存手法はGRPOで最終的な推薦性能で決まるルールベース報酬により推論を最適化するが、推論ステップごとの予測への寄与が最適化信号に直接反映されないこと、グループ内の異なる推論軌跡が区別できない報酬を受け取ること、という2つの限界がある。<br><br>本研究は予測利得（PG）で推論を最適化する訓練枠組み「GainReason」を提案する。PGは個々の推論文が目標セマンティックID（SID）の対数尤度をどれだけ変化させるかを測り、寄与を意識した識別的な報酬を与える。期待PGと推薦ランキング目的の整合性も理論的に示した。この信号に基づき、文レベルの報酬で推論生成を最適化するPGROと、効率的なPG計算のための因果的注意機構、推論条件付き予測を適応的に強化する補助タスクPGRUを開発した。<br><br>3つの公開ベンチマークでの広範な実験により、GainReasonは競合するベースラインを一貫して上回り、推論による大幅な性能向上を達成した。出典：arXiv","timestamp":1794850125000,"title":"Learning to Reason with Predictive Gains for Generative Recommendation","titleJa":"予測利得で推論を学ぶ生成推薦――文レベルの報酬によるGainReason","url":"https://arxiv.org/abs/2611.21441"},{"authors":["Hao Wang","Ting Huang"],"categories":["cs.AI","cs.SE"],"field":"arXiv","genre":"Agents / Robotics","monthKey":"2026-11","publishedAt":"2026-11-16T17:00:08Z","source":"arXiv","summaryHtml":"ハーネスはモデルを「タスクを完遂するシステム」に変える部品で、プロンプトを組み立て、ツールを与え、作業の完了を決める。ハーネスの比較ではモデルを固定し、モデルの比較ではハーネスを固定するのが常だった。本研究は両方を同時に変えた。市販のハーネス5種、成果物を生むタスク18件、0.75B〜4.7Bのローカル実行可能なオープンウェイトモデル4種と35.5Bのアンカーを組み合わせ、1つの決定論的チェッカーで360セルすべてを採点した。<br><br>完了を制御するハーネスMingbirdが、あらゆるサイズで最高の平均を記録した。事前登録した4つの対比較のうち2つがHolm補正後も有意で、16の対区間のうち13がゼロを除外した。ただし完了ゲート自体が効いているわけではない。6つの実行時チェックをすべて外しても平均はほとんど動かず、1つの反復ブロック規則を外すだけで0.75Bモデルでは0.411も落ち、18タスク中8件で成果物が出なくなった。ハーネスの効果は「進捗の効果」、すなわち実行がディスクに何かを残すかどうかを決める点にある。<br><br>357の有効セルのうち127セルは宣言した成果物を一つも残さず、そのうち85セルは正常終了していた。終了ステータスだけを読む採点器は、書かれていない仕事を評価してしまう。効果がサイズとともに増すか減るかは、4つの段では決着しなかった。出典：arXiv","timestamp":1794848408000,"title":"Harness Leverage Across Model Size: A Ladder of Five Local Agent Harnesses from 0.75B to 4.7B","titleJa":"ハーネスの差はモデルサイズを越えるか――5種のローカル・エージェント・ハーネスの比較","url":"https://arxiv.org/abs/2611.21407"},{"authors":["Zi Wang","Mahima Pushkarna"],"categories":["cs.AI","cs.HC"],"field":"arXiv","genre":"Ethics / Safety","monthKey":"2026-11","publishedAt":"2026-11-16T16:58:58Z","source":"arXiv","summaryHtml":"創作メディア生成のAIは人間の能力を広げる一方で、主体感を損なうおそれがある。核心の問題はアンカリングで、洗練された生成物に思考が引き寄せられ、ユーザーの役割が能動的な執筆から受動的な編集へ移ってしまう。本研究は、生成前にAIの解釈を点検・修正・誘導できる「生成前信念コントロール」を提案し、最初の錨を人間が置くことをめざす。<br><br>4つの設計原則を定式化し、初期の概念立案と試作のためのシステムProactive Co-Creator（PaCC）に実装した。PaCCは仮定と不確実性を、質問、信念グラフ、メディア属性のかたちで能動的に提示し、最終成果物を生成する前にユーザーがAIの信念を形づくるよう促す。小規模・単群の探索的なユーザー調査では、参加者は慣れたプロンプト型ツールと比べて主体感とプロセス制御が方向性として向上したと報告し、提示された仮定が見落としていた細部を考える助けになったという。一方、所有感や著者性についての感じ方は分かれた。<br><br>生成物の質ではなく生成前の関与に着目する点が特徴で、創作AIの設計に「信念を先に共有する」という視点を持ち込む。調査は小規模の探索段階であり、効果の一般化にはさらなる検証が要る。出典：arXiv","timestamp":1794848338000,"title":"Shaping AI's Beliefs Before It Generates: Human Sense of Agency in Creative AI","titleJa":"生成の前にAIの「思い込み」を形づくる――創作AIにおける人間の主体感","url":"https://arxiv.org/abs/2611.21405"},{"authors":["Jason Alexander","Yuxuan Li","Michael Licamele","Wesley Hanwen Deng","Sauvik Das"],"categories":["cs.CY"],"field":"cs.CY","genre":"Ethics / Safety","monthKey":"2026-11","publishedAt":"2026-11-16T16:36:47Z","source":"arXiv","summaryHtml":"LLMの暗黙のバイアスは、採用や知能評価といった注目度の高い一度きりの判断場面では示されてきた。しかし自律的なLLMエージェントが日々のタスクで人の代わりに判断する時代には、社会人口学的仮定に基づくバイアスが日常の判断場面にどう現れるかを理解することが重要だ。<br><br>本研究は米国時間利用調査（ATUS）の17の日常活動領域を用い、異なる人種・性自認・政治的イデオロギーのペルソナを与えたLLMが有意な暗黙のバイアスを示した506の判断シナリオの「アトラス」を作成した。次にクラウドソーシング監査で500人が8,010回の二択を行い、どのバイアス場面をさらに検討すべきかを選んだ。<br><br>参加者は、広い関連性（食の選択など）、重大性（健康など）、シミュレーションされた社会人口学的グループ全員が全会一致で判断した場面（ステレオタイプの明確な兆候）を優先した。格差の大きさやATUS領域にはあまり左右されなかった。優先の理由を調べると、参加者は格差を人口集団の特性と解釈し、それがもっともらしいかを自分の内面化したステレオタイプで判断することが多かった。出典：arXiv","timestamp":1794847007000,"title":"A Crowd-Audited Atlas of Implicit Bias in LLM-Powered Agents","titleJa":"LLMエージェントの暗黙のバイアス地図――506の日常判断シナリオのクラウド監査","url":"https://arxiv.org/abs/2611.21376"},{"authors":["Lennard Naumann"],"categories":[],"field":"SocArXiv","genre":"LLM / NLP","monthKey":"2026-11","publishedAt":"2026-11-16T15:49:02Z","source":"OSF Preprints","summaryHtml":"党派間の敵意や回避は民主社会の懸念材料だが、短い会話でそれを和らげられるだろうか。本研究は、対面での説得研究で確立された2つの手法――相手の視点に立つ「視点取得」と、相手の道徳的枠組みに訴える「道徳的再構成」――を実装した大規模言語モデルチャットボットとの対話を検証した。ドイツのオンライン標本1,634人を対象とした事前登録済みの2×2要因実験で、1週間後の追跡調査には1,294人が回答した。<br><br>結果として、道徳的再構成チャットボットとの対話は、その後1週間の対立党派との議論の自己報告を増やした（0.10標準偏差）。どちらのチャットボットも、後日人間の対立党派と議論する研究への参加登録を増やした（0.13〜0.17標準偏差）。視点取得チャットボットは直後の政策態度を相手側へ0.09標準偏差だけ動かしたが、その変化は1週間以内に消えた。<br><br>一方で、どちらのチャットボットも対立党派への感情や回避的な選好そのものは変えなかった。著者は、短いチャットボット対話は感情を変えずとも、党派を越えた接触への第一歩として機能しうると結論づけている。出典：OSF Preprints","timestamp":1794844142000,"title":"AI chatbot conversations reduce behavioral avoidance of political opponents without changing feelings toward them","titleJa":"AIチャットボットとの対話は政治的対立相手への回避を減らす――感情は変わらないまま","url":"https://osf.io/preprints/socarxiv/bc9ye_v1/"},{"authors":["Yu Yao","Jiayi Dong","Yilun Du"],"categories":["cs.AI","cs.CL","cs.MA"],"field":"cs.AI","genre":"Agents / Robotics","monthKey":"2026-11","publishedAt":"2026-11-16T15:28:04Z","source":"arXiv","summaryHtml":"マルチエージェント推論を、複数のエージェントがそれぞれ持つ暗黙の信念の動力学が、集団としての均衡を探す過程として捉え直す。提案するStream of Belief（SoB）では、各エージェントが連続的な潜在信念を保持し、他のエージェントとの対話と自らの内省を通じて、その信念を繰り返し精緻化していく。個々のエージェントの出力を集計するのではなく、信念そのものの変化を中心に置く枠組みである。<br><br>SoBが目指すのは、それ以上の対話を重ねても意味のある情報伝播がもう生じなくなるような、集団の信念状態である。信念が安定した均衡に達した時点で、集団としての結論が定まったとみなす。幅広い実験により、SoBはタスクとモデルファミリーを越えて汎化することが示されたという。<br><br>この結果は、マルチエージェント推論のスケーリングを信念の動力学という視点から考える新しい見方を提示する。ただし要約（アブストラクト）には具体的な数値やベンチマーク名の記載がなく、効果の大きさや適用範囲の詳細は原論文の本文に譲られている。出典：arXiv","timestamp":1794842884000,"title":"Stream of Belief: Eliciting Collective Intelligence through Latent Belief Dynamics","titleJa":"信念の流れ――マルチエージェント推論を潜在的信念の動力学として捉える","url":"https://arxiv.org/abs/2611.21250"},{"authors":["Jinwei Hu","Qisong He","Xinmiao Huang","Youcheng Sun","Yi Dong","Xiaowei Huang"],"categories":["cs.AI","cs.CL","cs.MA","cs.SI"],"field":"cs.AI","genre":"Ethics / Safety","monthKey":"2026-11","publishedAt":"2026-11-16T15:20:18Z","source":"arXiv","summaryHtml":"言語モデルエージェントの信念は、ソーシャルメディアのようなオープンなチャネルを通じて操作されうる。受け取る情報が真実であっても、断片のあいだをエージェントが自ら関係づけて補うと、その関係を既成事実として受け入れ、他者に噂として伝えてしまう。本研究はこの失敗を「物語的過剰適合」と呼び、認知理論と映画理論のモンタージュにならったGenerative Montageで再現する。<br><br>6件のTwitterイベントから得た1,090件の噂ターゲットで検証したところ、14モデルのうち12モデルで噂の受容率が65%を超えた。多数決や同じ証拠の再検討の後でも受容率は50%を上回り、誤りが下流の意思決定に届くことを示した。断片への介入で信念に影響する投稿を特定し、合成対照により、信念への影響と証拠による裏づけを分離できることも示した。<br><br>対策として、直接の証拠による裏づけを確認するニューロシンボリックな実行時モニタ「Grounded Monitor」を提案し、意思決定の精度を5.6〜29.0ポイント改善した。推論された関係を監視することが、エージェントの結論が公共の意思決定を導く前に必要だと結論づける。出典：arXiv","timestamp":1794842418000,"title":"Language-model agents' beliefs can be manipulated via truthful evidence in open channel","titleJa":"真実の情報でもエージェントの信念は操作される――オープンなチャネルからの物語的過剰適合","url":"https://arxiv.org/abs/2611.21235"},{"authors":["Hua Zhang","Min Jiang"],"categories":["cs.RO","cs.AI"],"field":"cs.RO","genre":"Agents / Robotics","monthKey":"2026-11","publishedAt":"2026-11-16T14:07:45Z","source":"arXiv","summaryHtml":"LLMエージェントはリモートのツールやクラウドのサンドボックスを使えるようになったが、推論とセッション状態、実行場所の統合は依然として設計上の課題だ。本研究は、実行場所をモデルやツール、文脈と並ぶ設定可能な次元として扱う、自己ホスト型のHTTPサービス兼組み込み可能なPythonランタイム「Linglong Agent Service（agentsvc）」を提案する。<br><br>親サービスが推論の編成やツール記述、会話履歴を保持し、推論リクエストごとにファイル・シェル・ターミナル・MCP操作を行う子環境を一つ選ぶ。直接のHTTPと子側発信のWebSocketトンネルが同じ応用インタフェースを運び、移植可能なリクエスト文脈と集中管理された更新も備える。通常のコア経路にサードパーティ製Pythonパッケージは不要で、Windowsの疑似端末依存は任意だ。オンライン・デバッガも実行場所分離の特殊例として示され、例外の証拠を提出したプログラムが、障害発生中のプロセス内でセッション限定の検査ツールを実行し、同じ診断セッションを再開する。<br><br>設計は制約付き期待効用推論で説明され、Hermes AgentやPi、Codex、Claude Codeとの具体的な仕組みの比較や、実装と回帰テストの証拠も報告されている。ただし現時点の証拠が示すのは実行可能な契約であり、性能上の優位や修復精度、本番環境での復旧は確立されていない。ソースコードはMITライセンスで公開されている。出典：arXiv","timestamp":1794838065000,"title":"Linglong Agent Service: A Runtime for Centralized Agent Reasoning and Distributed Execution","titleJa":"Linglong Agent Service――集中推論と分散実行のためのエージェントランタイム","url":"https://arxiv.org/abs/2611.21129"},{"authors":["Shiyu Fang","Sheng Zhao","Jiarui Zhang","Chengkai Xu","Xiaocong Zhao","Peng Hang","Jian Sun"],"categories":["cs.RO","cs.MA"],"field":"cs.RO","genre":"Agents / Robotics","monthKey":"2026-11","publishedAt":"2026-11-16T13:22:30Z","source":"arXiv","summaryHtml":"協調運転は自動運転を個々の車両の判断から複数車両の協調的な操作へと広げ、交通安全と効率を高める。最適化手法は安全制約を課すが経路を固定しがちで、マルチエージェント強化学習は協調学習と安全な実行が難しい。両者の統合にも探索効率や経験配分、実行の信頼性という課題があった。<br><br>CoopDistillは均衡誘導型のマルチエージェント方策蒸留の枠組みである。ポテンシャルゲームの定式化が固定経路の縦方向の参照を与え、その周りで残差MARL方策が縦方向の加速度や合流タイミング、横方向の経路補正を学ぶ。ポテンシャルゲームが未解決・大幅遅延とする難しい場面に経験を集中させるハードケース・カリキュラムと、実行前に学習した補正の共同結果を評価する比較ロールアウト選択器を備える。<br><br>合流・ラウンドアバウト・交差点のシナリオで、4段階の協調自動運転車普及率のもと6つのベースラインと比較した。ポテンシャルゲームに対し成功率は2.1〜27.1ポイント改善、遅延は7.3〜27.3%減少し、衝突は観測されなかった。出典： arXiv","timestamp":1794835350000,"title":"CoopDistill: Equilibrium-Guided Multi-Agent Policy Distillation for Cooperative Driving","titleJa":"協調運転のマルチエージェント方策蒸留――均衡誘導型CoopDistill","url":"https://arxiv.org/abs/2611.21069"},{"authors":["Zhe Ren","Guowei Rong","Yimeng Chen","Nanbo Li","Piotr Piękos","Mateusz Ostaszewski","Dandan Guo","Jürgen Schmidhuber"],"categories":["cs.CL","cs.NE"],"field":"cs.CL","genre":"Agents / Robotics","monthKey":"2026-11","publishedAt":"2026-11-16T13:05:46Z","source":"arXiv","summaryHtml":"自己改善するコーディングエージェントは、下流タスクでの実行結果を手がかりに候補を選ぶ「評価して選ぶ」方式で強い性能を出してきた。だが評価シグナルを得るには進化したエージェントを繰り返し実行する必要があり、探索を広げるほどコストが増し、固定の評価分布への過剰適応も招く。本研究は、進化のループ内で下流タスクの評価を使わずに自己改善できるかを問う。<br><br>提案するELITE（Explore-then-Integrate）は、単一の子孫を選ぶのではなく実装の仕組みを統合する。各世代で多様な改善を提案し、同じ親から独立に実装して、仕組みの相補性・重複・競合を点検したうえで、両立する部分集合を1つの子孫として再実装する。ループ内では下流タスクの結果や軌跡を使わず、構造と動作の妥当性の決定論的な検査だけを用いる。<br><br>SWE-bench Proでは初期エージェントが60.0%から85.6%へ改善し、評価を使うDarwin Gödel Machineの86.7%、Huxley-Gödel Machineの88.3%に迫った。壁掛け時間はそれぞれ8.8倍・3.2倍短縮された。適応なしの転移ではSWE-bench Verifiedで平均73.3%、Polyglotで69.3%だった。評価なしの自己改善が可能であることを示した。出典：arXiv","timestamp":1794834346000,"title":"Evaluation-Free Recursive Self-Improvement for Coding Agents","titleJa":"評価なしで自己改善するコーディングエージェント――ELITE","url":"https://arxiv.org/abs/2611.21056"},{"authors":["K2 Team","Zhengzhong Liu","Haonan Li","Xuezhe Ma","Alexander Moreno","Subham Sekhar Sahoo","Rupesh Kumar Srivastava","Mikhail Yurochkin","Hadi Abdine","Yash Akhauri","Adharsh Babu","David Bellamy","Jalaj Bhandari","Dani Bouch","Wail Bouhedja","Weili Cao","Ahmad Chamma","Po-Chun Chang","Junlin Chen","Lingjie Chen","Zhoujun Cheng","Kyle Chickering","Ryandito Diandaru","Evan Dufraisse","Chaitanya Dwivedi","Bilal El Bouardi","Desai Fan","Richard Fan","Chengqian Gao","Rifo Ahmad Genadi","Jonathan Geuter","Charles Guille-Escuret","Willis Guo","Dhawal Gupta","Seungwook Han","Tingxu Han","Shibo Hao","Besher Hassan","Guowei He","Ming Shan Hee","Joel Hestness","Yu Huang","Yuan Huang","Haolong Jia","Linghao Jin","Junu Kim","Lingjing Kong","Nurkhan Laiyk","Andrej Leban","Liqun Ma","John Maggs","Amr Mohamed","Mukhesh Narra","Omkar Pangarkar","Aldo Pareja","Khiem Pham","Varad Pimpalkhute","Nikhil Ranjan","Elizaveta Rebrova","Hector Ren","Shaurya Rohatgi","Guokan Shang","Jianshu She","Chufan Shi","Aaryamonvikram Singh","Daria Soboleva","Kartik Sreenivasan","Suqi Sun","Yuekai Sun","Bowen Tan","Liping Tang","Shengkun Tang","Muzi Tao","Mallikarjuna Tupakula","Micah Villmow","Hongyi Wang","Huijuan Wang","Renxi Wang","Yongxin Wang","Yuqi Wang","Zhenting Wang","Shicheng Wen","Yingquan Wu","Anze Xie","Andrew Xing","Matthew Yang","Shuanghai Yu","Kerem Zaman","Zenan Zhai","Hongli Zhan","Xuezhou Zhang","Anshun Asher Zheng","Zhe Zhou","Richard Zhuang","Eric P. Xing"],"categories":["cs.AI"],"field":"cs.AI","genre":"LLM / NLP","monthKey":"2026-11","publishedAt":"2026-11-16T12:28:03Z","source":"arXiv","summaryHtml":"0.9Bの密モデルから375B-A23BのMoEまで、汎用的な推論とエージェント作業に向けて設計された6つの完全オープンな言語モデル群K2-Horizonが発表された。数学・科学、ソフトウェア工学、深い調査、事務自動化など幅広い用途を想定し、同規模の強力なオープンモデルと肩を並べるか上回る性能を、エージェント系とコーディングのベンチマークで示した。<br><br>推論強化のため、注意の値射影にMoEを適用するMixture-of-Value Attention（MoVA）と、理論に裏づけられた柔軟なゲートであるsoftplus attention gatingを導入した。36B-A4Bモデルは両方を用い、同じデータで学習した32B密モデルの性能にほぼ並びながら、活性パラメータは7分の1にとどまる。さらに、別のドラフトモデルなしに復号を最大2.2倍高速化するロスレス拡散アダプタUnoも発表した。<br><br>公開はLLM360のオープンソース定義に従い、学習の全段階の中間チェックポイント、事前学習データ、学習ログ、学習・評価・基盤の全コードを含む。約10Tトークンの合成事前学習データを生んだパイプラインも含め、モデル開発の過程そのものを詳細に文書化して公開した。4モデルは22Tトークンの事前学習コーパスとレシピを共有し、規模と疎性の統制された研究を可能にする。出典：arXiv","timestamp":1794832083000,"title":"K2-Horizon: A Frontier Fleet of Open Source Language Models","titleJa":"フロンティア級オープン言語モデル群「K2-Horizon」――0.9Bから375Bまで6モデル","url":"https://arxiv.org/abs/2611.21003"},{"authors":["Yong Liu","Zhanpeng Shi","Peicong Lin","Zhenyi Zhong","Yizhou Dang","Wendi Wu","Haoling Li","Shuangjia Zheng"],"categories":["q-bio.QM","cs.AI"],"field":"cs.AI","genre":"LLM / NLP","monthKey":"2026-11","publishedAt":"2026-11-16T12:17:37Z","source":"Hugging Face Papers","summaryHtml":"生体分子の基盤モデルはタンパク質やその複合体の構造を正確に予測し、大規模言語モデル（LLM）は自然言語で推論する。しかし両者は分離されたままで、前者の能力は汎用LLMの一部ではなく、後者の推論は構造予測に入り込まない。本研究は、タンパク質や複合体を折りたたみ、配列と構造を理解し、言語推論が予測する構造に影響する、一つの汎用モデルを目指すCalphaを提案する。<br><br>本報告はその第一歩として、LLMが単鎖タンパク質の構造を出力する段階を扱う。Qwen3.5-9BがESM2の残基特徴で豊かにした配列を読み、テキストで応答するか、事前学習済みのSimpleFold構造ヘッドを呼び出すトークンを出す。ヘッドはQwenの残基状態を通じてのみタンパク質の情報を受け取る。固定した折りたたみ要求の下で、平均TMスコアはFoldBench-334開発セットで0.808、CASP16ドメインで0.635、CAMEO様のPDBセットで0.900だった。<br><br>ESM2-3Bが配列を符号化し微調整済みSimpleFold-3Bヘッドが座標を予測するベースラインとの比較では、100〜299残基の鎖では3つの信頼区間がすべてゼロを含み、300〜600残基では平均差が−0.044、−0.160、−0.025だった。別途の試験では4種の英語の要求が評価した全例で折りたたみを起動した。タンパク質学習により350項目のMMLU-Pro部分集合の正答率は77.4%から70.3%へ下がった。複合体予測や構造理解、言語推論が予測座標に与える影響は今後の課題だとする。出典：Hugging Face Papers","timestamp":1794831457000,"title":"Calpha: Toward Native Biomolecular Intelligence in a General-Purpose Language Model","titleJa":"Calpha――汎用言語モデルにおける生体分子知能へ","url":"https://arxiv.org/abs/2611.20986"},{"authors":["Renata Topinkova","Carsten Schwemmer"],"categories":[],"field":"SocArXiv","genre":"Agents / Robotics","monthKey":"2026-11","publishedAt":"2026-11-16T12:13:17Z","source":"OSF Preprints","summaryHtml":"オンライン調査は人間の回答を前提に成り立っているが、簡単な指示一つでウェブサイトを操作し課題を遂行するエージェント型ブラウザの登場が、その前提を揺るがしている。本研究は市販のエージェント型ブラウザ3種に「このアンケートに回答して」という一言の指示だけを与え、オンライン調査を遂行できるか、既存の検出・防止策が通用するかを検証した。<br><br>エージェントはほとんど人間の入力なしに調査を完了し、割り当てられた人口統計学的プロフィールも維持した。技術的なスクリーニング、可視・不可視CAPTCHA、AI専用のプロンプトインジェクション検査、長期調査での回答の一貫性、単一指示による複数調査の完了を試したが、プロンプト漏洩や脱獄風の検査はすべて通過し、ブラウザのメタデータから自動参加を見抜くこともできなかった。不可視reCAPTCHAは一部のブラウザに一貫して突破され、可視reCAPTCHAが最も強い障壁だったものの、解けてしまう場合や人間に制御を戻す場合もあった。<br><br>広く入手可能なAIエージェントが、人間参加者向けの課題を代行し、一見筋の通ったもっともらしい回答を生み出せることが示された。人間が生成したはずのデータが本当に人間によるものかをどう検証するかという、研究の信頼性に関わる問いが浮かび上がる。出典：OSF Preprints","timestamp":1794831197000,"title":"\"Fill Out this Survey\": Capabilities and Detection of Agentic Browsers","titleJa":"「このアンケートに回答して」：エージェント型ブラウザの能力と検出","url":"https://osf.io/preprints/socarxiv/tc5zq_v3/"},{"authors":["Marc Gielen","Daniela Duarte Domingues","Eric Burguière","Kevin Swierkosz-Lenart","Luc Mallet"],"categories":["q-bio.NC"],"field":"arXiv","genre":"Psychedelics / Trauma","monthKey":"2026-11","publishedAt":"2026-11-16T10:15:20Z","source":"arXiv","summaryHtml":"近年、セロトニン作動性サイケデリクスへの関心が再燃している。本稿はうつ病と強迫性障害（OCD）の治療薬の分子機序に立ち入り、選択的セロトニン再取り込み阻害薬（SSRI）の臨床効果がセロトニントランスポーター（SERT）の阻害だけでは説明しきれないと論じる。うつ病やOCDを治療するのに必要な投与量は、SERTよりはるかにSSRIへの親和性が低い標的が主要な作用点であることと整合するという。<br><br>その候補として、抗うつ効果を持つ薬物の推定標的として近年報告されたチロシン受容体キナーゼB（TrkB）が挙げられる。TrkBは抗うつ薬の治療効果を理解する統一的な枠組みになりうる。SERT阻害だけの説明では投与量と効果の関係が合わず、薬物動態と薬力学の両面から、親和性の低い標的こそが臨床効果の鍵を握る可能性が示される。<br><br>この仮説はサイケデリクスの治療可能性にも薬理学的な示唆を与える。セロトニン作動性と呼ばれてきた薬物の作用をTrkBの観点から捉え直すことで、抗うつ薬とサイケデリクスの共通基盤と相違がより明確になる。出典：arXiv","timestamp":1794824120000,"title":"From antidepressants to psychedelics: revisiting the pharmacology of so-called serotoninergic treatments","titleJa":"抗うつ薬からサイケデリクスへ――いわゆるセロトニン作動性治療の薬理学を問い直す","url":"https://arxiv.org/abs/2611.20834"},{"authors":["Christophe Denis"],"categories":["cs.AI"],"field":"arXiv","genre":"Consciousness / Philosophy","monthKey":"2026-11","publishedAt":"2026-11-16T10:09:08Z","source":"arXiv","summaryHtml":"人工的な会話エージェントとのやり取りは会話のシミュレーションにすぎない、という主張は、活動の観察可能な特徴を再現することと実際にその活動を行うこととの区別に依拠する。この区別は物理現象には当てはまっても、言語的・記号的な活動への適用は単純ではない。本論文は、大規模言語モデル（LLM）によるエージェントとの会話は真の会話活動であり、単なる模倣ではないと論じる。ただし意識や主観的理解、人間的な意図を人工システムに帰属するわけではない。<br><br>会話を参加者の内在的な性質だけで定義することの限界を検討したうえで、関係論的・記号論的な会話の説明を展開する。言語語用論に加え、ラカンの鏡の理論、ボードリヤールのシミュラークル、シモンドンの個体化の哲学、パースの記号論を手がかりに、会話的相互作用の現実性と、人工的主観性の見かけや、生成される意味の認識的妥当性とを区別する。<br><br>議論は「ハイブリッド記号的制作」という概念に集約される。意味づくりは人間と人工物の参加者に分散した過程として捉えられ、会話の現実性を参加者の内面ではなく相互作用の関係性に求める視点が提示される。出典：arXiv","timestamp":1794823748000,"title":"Conversing with a Conversational Agent: A Real Conversation, Not a Simulated One","titleJa":"会話エージェントとの対話は本物の会話か――シミュレーションではないとする哲学的擁護","url":"https://arxiv.org/abs/2611.20826"},{"authors":["Kangwen Zhao","Jianfeng Cai","Ruopei Sun","Mingxiao Feng","Peng Zhang","Wengang Zhou","Houqiang Li"],"categories":["cs.AI"],"field":"cs.AI","genre":"Agents / Robotics","monthKey":"2026-11","publishedAt":"2026-11-16T08:40:29Z","source":"arXiv","summaryHtml":"LLMエージェントはツールを繰り返し試行することで課題の品質を高められるが、改善の見込みが薄い試行を続ければコストだけが膨らむ。試行を重ねれば最良の結果は改善しうるが、すでに最良の結果を超える見込みが低い試行は無駄になる。本研究は、タスク単位のBest-of-N品質を保ちつつ、実行をいつ打ち切るかを決める制御手法GainCtrlを提案する。軽量なCPU予測器が対話履歴から期待できる利得を推定し、較正済みの閾値で停止を判断する。<br><br>3つの環境と3つのLLMアクターを用いた軌跡再生による評価では、GainCtrlは同等の目標品質においてベースラインより少ないトークンで済んだ。固定の打ち切り方針でも、完全な実行に近い品質を保ちつつトークン消費を大幅に減らせた。予測器は単一CPUスレッドでミリ秒単位の遅延で動作する。<br><br>LLM内部へのアクセスを必要とせず、繰り返し監視できる点が特徴だ。実行中の監視を繰り返しても計算負荷は小さく、エージェントの実行コストを抑えながら品質を維持するための実用的な停止制御の枠組みを示している。出典：arXiv","timestamp":1794818429000,"title":"GainCtrl: Predicting Remaining Gains for Efficient LLM Agent Execution","titleJa":"GainCtrl――LLMエージェントの実行を効率化する残存利得予測","url":"https://arxiv.org/abs/2611.20736"},{"authors":["Sachin Gupta"],"categories":["cs.AI","cs.LG"],"field":"cs.AI","genre":"Agents / Robotics","monthKey":"2026-11","publishedAt":"2026-11-16T08:19:25Z","source":"arXiv","summaryHtml":"ツールが失敗した後、エージェントは回復の助言を受けて課題を完遂できるのか。本研究は、隔離されたGitLab環境でLangGraphとCrewAIのエージェントに課題を解かせ、ツールエラーを注入して回復を評価するベンチマークAgentFaultBenchを提案する。成果物とイシュー、必要な読み取りや検証、最終応答までを状態で検証する。<br><br>1,944回の計画実行による主比較では、助言の有無による成功率の変化は−8.33、0.00、＋1.06ポイントとまちまちで、欠損のため後二者は結論が出なかった。改訂した回復方針ではGPT-4o miniが改善し、SolとClaudeは回復可能な事例を既に完遂していた。別途624回の実験では、助言ありで161/192件が正しい最終状態に達し、助言なしの142/192件を上回った。ただし効果は一様ではなく、条件によって変わることが示唆された。<br><br>イシューIDの除去による影響は小さく、第二のチェッカーも概ね一致した。著者らは、回復の助言は効果を前提とせず、明示的な対照条件と比較して検証すべきだと結論づけている。出典：arXiv","timestamp":1794817165000,"title":"AgentFaultBench: State-Verified Evaluation of Tool-Fault Recovery","titleJa":"AgentFaultBench――ツール障害からの回復を検証する評価基盤","url":"https://arxiv.org/abs/2611.20711"},{"authors":["Wenhan Yu","Zhaoxi Zhang","Zhilong Tan","Weikang Li","Lei Sha"],"categories":["cs.AI","cs.CV","cs.MM"],"field":"cs.AI","genre":"Vision / Multimodal","monthKey":"2026-11","publishedAt":"2026-11-16T07:52:01Z","source":"arXiv","summaryHtml":"動画編集では、視聴覚の観察と精密な時間位置の把握に基づく判断と、描画結果の評価が求められる。本研究は、追加のモデル学習なしに汎用コーディングエージェントを動画ポストプロダクションで使えるようにする視覚ハーネスVIVIDを提案する。オンデマンドの映像検査、音声分析、文字起こしのツールを提供する。<br><br>観察結果は対応するメディア版と時間座標とともに保存され、エージェントは推論しながら能動的に取り出せる。編集はエージェント本来のコーディングとシェル操作で行い、描画出力を確認して次の修正に活かす。編集の判断は映像と音声の両方の観察に基づく。100課題からなるAgenticVBenchでは、Codexと組み合わせて平均58.6%を記録し、素のCodexを20.2ポイント上回った。<br><br>Claude Codeでは55.1%、OpenCodeでは37.1%と、いずれも素の性能を大きく上回った。学習済みモデルを追加することなく既存のコーディングエージェントをそのまま活用できる設計で、汎用コーディングエージェントの能力を動画編集へ拡張する再利用可能なハーネスの可能性を示している。出典：arXiv","timestamp":1794815521000,"title":"VIVID: A Visual Harness for Agentic Video Editing","titleJa":"VIVID――エージェント型動画編集のための視覚ハーネス","url":"https://arxiv.org/abs/2611.20688"},{"authors":["Benhao Huang","Chaitanya Dwivedi","Xuezhe Ma","Alexander Moreno","Hector Liu"],"categories":["cs.LG"],"field":"cs.LG","genre":"LLM / NLP","monthKey":"2026-11","publishedAt":"2026-11-16T02:05:32Z","source":"arXiv","summaryHtml":"高品質データが枯渇すると、同じデータを何周も学習させるのが常套手段だが、繰り返しの価値は逓減する。各トークンの最上層の状態を次トークンの入力に送り返す「潜在フィードバック」も計算の使い方の一つだが、同じ計算量をエポック増に使う通常のTransformerと対等に比べられたことはなかった。本研究はモデル規模・固有データ量・エポック数の組み合わせを網羅し、両モデルを各条件で最適に調整して比較した。<br><br>固有データがモデル規模に対して乏しい場合を除き、潜在フィードバックはFLOPとトークンの効率を高めた。固有データを固定すれば同じ損失により少ない計算量で到達
