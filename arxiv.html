va"], "categories": ["cs.AI"]}, {"source": "arXiv cs.SE", "title": "GH-AWTrace: A Large-Scale Dataset of GitHub Agentic Workflow Execution Logs", "titleJa": "GH-AWTrace――GitHubのエージェンティックワークフロー実行ログ大規模データセット", "summaryHtml": "エージェンティックワークフローは、AIエージェントがスケジュールやリポジトリのイベントに応じて繰り返しのリポジトリ作業を行う仕組みである。既存研究はワークフローの定義と出力を調べるが、実行中に何が起きているかの証拠は限られていた。本論文は、その実行証拠を結びつけたデータセット「GH-AWTrace」を提示する。<br><br>データセットは、検証済みのGitHub Agentic Workflows 25,014件（5,051リポジトリ）を、4,112,526件の実行記録と562,877件の空でない実行ログアーカイブへ結びつける。実行証拠はGitHubのログ保持制限の範囲で保存され、リポジトリのメタデータと生成されたワークフロー設定にもリンクされる。<br><br>事例からは、ツール拒否、プロバイダ障害、エージェントの方針変更、エージェント間の委任といった、ログでなければ見えない事象が読み取れる。実行の失敗、ツール使用、報告された実行結果と実際のタスク進捗との関係を研究する土台となる。なおカバレッジはワークフローごとに異なり、ログは部分的な観測にとどまる。", "url": "https://arxiv.org/abs/2611.06866", "publishedAt": "2026-11-04T18:20:41Z", "timestamp": 1793816441000, "monthKey": "2026-11", "field": "cs.SE", "genre": "Vision / Multimodal", "authors": ["Jasem Khelifi", "Hao Li", "Ali Ouni", "Mohammed Sayagh", "Mohamed Aymen Saied"], "categories": ["cs.SE"]}, {"source": "arXiv cs.CV", "title": "CounterFactual Retrieval for Evidence-Aware Individual Animal Identification", "titleJa": "反事実的検索――動物個体識別の「証拠」を問う評価プロトコル", "summaryHtml": "動物の個体識別の自動化は、小規模な curated 研究から、共有ベンチマークや再利用可能な基盤モデルへと進みつつある。しかし現在の評価は、マッチの背後にある証拠を未解決のままにしている。高い検索精度は、モデルが動物の特徴を使ったのか、個体と相関する近道（ショートカット）を使ったのかを示さない。<br><br>本論文は、証拠を意識した評価プロトコル「反事実的前景検索（CFR）」を提案する。CFRは同じクエリ―ギャラリー課題を、全面画像、前景のみ、近道のみという異なる見え方で評価する。全面画像は標準の検索性能を、前景のみは前景に支えられた検索を、近道のみは背景やシルエットからどれだけ個体信号が回復できるかを測る。<br><br>これにより、検索スコアは「証拠プロファイル」へと変わる。元の画像でどれだけ性能が出るか、その性能のどれだけが動物自体を見たときに残るか、そしてどれだけが背景などの近道に依存していたか――識別モデルの信頼性を吟味する枠組みである。", "url": "https://arxiv.org/abs/2611.06864", "publishedAt": "2026-11-04T18:19:26Z", "timestamp": 1793816366000, "monthKey": "2026-11", "field": "cs.CV", "genre": "Vision / Multimodal", "authors": ["Ankit K. Upadhyay", "Aleksandr Algasov", "Ekaterina Nepovinnykh", "Fedor Zolotarev", "Tuomas Eerola", "Heikki Kälviäinen", "Charles V. Stewart", "Lukas Picek"], "categories": ["cs.CV", "cs.AI", "cs.LG"]}, {"source": "arXiv cs.RO", "title": "Rethinking Self-Repair in Code-as-Policy Agents: What Drives Retry Success?", "titleJa": "コード型ポリシーエージェントの自己修復――再試行の成功を左右するのは何か", "summaryHtml": "コードを方策とするエージェントは、実行フィードバックを使って失敗したプログラムを再試行することが多い。追加のサンプリングやタスクガイダンスも成功率を上げるため、失敗に特化したフィードバックの寄与は不明瞭だった。本研究はこの問いを、シミュレーション上のロボット操作で検証する。<br><br>固定のルックアップが失敗ラベルとAPIの種類からフィードバックテンプレートを選び、凍結されたコードモデルが場面リセットのたびに新しいプログラムを生成する。同じ252件の初期失敗に対して、Qwen2.5-Coder-7Bは5回までの再試行で85.3%を回復し、同じ再試行上限での再サンプリング（68.3%）を上回った。この優位は総トークン予算を固定しても持続した。<br><br>一方、他のエピソードからのフィードバックや固定のタスクガイダンスでも同程度の回復率が得られ、粗い失敗ラベルを一致させる利益は検出されなかった。別の検証では、最初から誘導プロンプトを使う方法がテンプレート式フィードバックと同程度の成功率を示した。「失敗特化フィードバックが効いている」という想定への実証的な問い直しである。", "url": "https://arxiv.org/abs/2611.06863", "publishedAt": "2026-11-04T18:19:24Z", "timestamp": 1793816364000, "monthKey": "2026-11", "field": "cs.RO", "genre": "Agents / Reasoning", "authors": ["Siddharth Aphale", "Ayushman Singh"], "categories": ["cs.RO"]}, {"source": "arXiv cs.CL", "title": "Balancing hierarchical representation and quantization: A performance trade-off in text embeddings", "titleJa": "階層表現と量子化のバランス――テキスト埋め込みの性能トレードオフ", "summaryHtml": "階層型テキスト埋め込みモデルは可変長の表現を提供し、量子化は数値精度を下げて計算効率を高める。両者は直交する既存の技術だが、その相互作用は十分に調べられてこなかった。本研究は、この2つの効率化手法がどう干渉するかを実証的にベンチマークする。<br><br>評価はMTEBの38タスクで、4つのTransformer系埋め込みモデルを用い、1次元・2次元の階層表現と32ビット・8ビット・バイナリ量子化を組み合わせた、タスクあたり168構成を検証する。効率の次元は分けて報告され、理論上のベクトルあたり記憶量と、エンドツーエンドの評価時間が示される。<br><br>Friedman検定とNemenyi事後分析では、int8量子化はペア分類と再ランキングでfloat32と統計的に区別がつかず、全体でも最大1.5ポイントのコストにとどまった。一方、バイナリ量子化は全タスクカテゴリで有意に悪かった。埋め込み次元を半分にすることの影響もあわせて検討されている。", "url": "https://arxiv.org/abs/2611.06859", "publishedAt": "2026-11-04T18:15:08Z", "timestamp": 1793816108000, "monthKey": "2026-11", "field": "cs.CL", "genre": "LLM / NLP", "authors": ["Kai Ponel", "Marco Polignano", "Erasmo Purificato", "Aylin Julia Temizkan", "Marco Levantesi", "Giovanni Semeraro", "Ernesto William De Luca"], "categories": ["cs.CL", "cs.IR", "cs.LG"]}, {"source": "arXiv cs.AI", "title": "CompressionBench: How can your coding agents compress LLMs?", "titleJa": "CompressionBench――コーディングエージェントにLLM圧縮を任せられるか", "summaryHtml": "再帰的自己改善には、後続のシステムが使うモデルや基盤をAIシステム自身が改善することが求められる。LLM圧縮はその具体的な効率化目標となる。事前学習済みモデルの振る舞いを、より小さなモデル記憶予算の中に保持することである。本研究は、コーディングエージェントがこの工程を自律的に遂行できるかを問う。<br><br>圧縮はターミナルタスクとして定式化される。エージェントはソースのチェックポイント、記憶容量の上限、推論環境、時間予算を与えられ、圧縮された重みと実行可能な推論コードを構築する。アルゴリズムと実験の進め方はエージェントが握り、パープレキシティのフィードバックが探索を導き、独立した検証が最終モデルを確認する。<br><br>6つのエージェントと6つのモデル×サイズ設定で、36件の提出のうち29件が検証に合格した。タスクごとに最もパープレキシティの低い設計を選ぶと、BF16比で平均3.4%のパープレキシティ増、下流精度77.33%（BF16は79.56%）となった。記録された実験の過程も分析されている。", "url": "https://arxiv.org/abs/2611.06858", "publishedAt": "2026-11-04T18:14:50Z", "timestamp": 1793816090000, "monthKey": "2026-11", "field": "cs.AI", "genre": "Vision / Multimodal", "authors": ["Xinrui Zhong", "Zhifeng Li", "Zhiming Wang", "Yongqi Liu", "Shanglin Yang", "Yang Zhou", "Zikun Li", "Zhuoming Chen", "Beidi Chen"], "categories": ["cs.AI"]}, {"source": "arXiv cs.CV", "title": "LongBanana: An Expert-Verified Benchmark for Long-Context Multi-Reference Image Synthesis", "titleJa": "LongBanana――長文脈・複数参照の画像合成を測る専門家検証ベンチマーク", "summaryHtml": "エージェント駆動の画像生成の時代に向け、本論文は長文脈・複数参照の画像合成のための、おそらく初の専門家設計・専門家検証ベンチマーク「LongBanana」を提案する。このタスクは、散らばった視覚的証拠を検索し、妨害要素を退け、実体と関係を結びつけ、複数の参照から1枚の一貫した最終画像を構成することを要求する。<br><br>LongBananaは3×3の分類体系で編成された90件の入念に設計されたタスクを含み、各タスクは約32枚の参照画像、20の制約、50の評価項目を持ち、専門家が指定した原子的評価項目は合計4,670件に上る。グラフに基づく評価設計は、各タスクを参照画像と実体―関係グラフで具体化し、ノード・エッジ・グラフ全体への義務を、内容の忠実性、関係の結合、全体制約の充足のチェックリスト項目へ変換する。<br><br>専門家のラベルには15%の二重ラベル付きサブセットが含まれ、完全一致率は89.4%だった。参照を束ねて一貫した画像を作る現行モデルの能力と限界を、細粒度に測る物差しである。", "url": "https://arxiv.org/abs/2611.06856", "publishedAt": "2026-11-04T18:11:56Z", "timestamp": 1793815916000, "monthKey": "2026-11", "field": "cs.CV", "genre": "Vision / Multimodal", "authors": ["Haoxiang Cao", "Yuxuan Zhang", "Penghui Du", "Bo Li", "Jiajiong Cao", "Yingying Fan", "Zimeng Wu", "Yifu Luo", "Mingzhe Zheng", "Junwen Miao", "Huaisong Zhang", "Yang Yao", "Yu Wang", "Dongfu Jiang", "Ping Nie", "Wenhu Chen", "Chaoqun Wang", "Changqian Yu", "Kelsey R. Allen"], "categories": ["cs.CV", "cs.CL"]}, {"source": "arXiv econ.EM", "title": "Regression with Many Generated Controls", "titleJa": "生成された統制変数が多い回帰――潜在変数の代理を大量に使う推定", "summaryHtml": "一部の共変量が内生的である線形回帰では、内生性を統制するのに十分な変数が存在しても、それ自体は観測できない潜在変数である場合がある。たとえば、異なるAI・機械学習手法でその潜在変数を安価に、しかし不完全に補完すれば、手法ごとに異なる代理変数（プロキシ）が得られる状況がこれにあたる。実務家はそうした代理変数を大量に生成できる。本研究は、そうした状況で実務家が取りうる選択肢――すべての代理変数やそこから計算した因子を統制に含める方法、操作変数推定、その非線形の変種――を、透明なモデルで比較する。<br><br>各アプローチが暗黙に狙う推定対象（エスティマンド）を導出し、それが関心のあるパラメータを回復する条件を明らかにしたうえで、実務的な推奨を示す。代理変数の扱い方によって狙う対象が変わるため、手法の選択は単なる実装の違いではなく、推定しているものの違いになる。<br><br>十分に豊かな生成統制変数の集合があれば、検証データに頼らずとも関心パラメータを一致推定できることが示された。AIが生成した代理変数を計量分析に組み込む際の理論的な足場となる研究である。", "url": "https://arxiv.org/abs/2611.06855", "publishedAt": "2026-11-04T18:10:56Z", "timestamp": 1793815856000, "monthKey": "2026-11", "field": "econ.EM", "genre": "Generative Models", "authors": ["Timothy Christensen", "Daniel Vebman"], "categories": ["econ.EM", "stat.ML"]}]};
    const byId = id => document.getElementById(id);
    const norm = s => String(s||'').toLowerCase().normalize('NFKC').replace(/\s+/g,' ').trim();
    const esc = s => String(s||'').replace(/[&<>"]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
    const months = [...new Set((DATA.articles||[]).map(a => a.monthKey).filter(Boolean))].sort().reverse();
    const genres = [...new Set((DATA.articles||[]).map(a => a.genre).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'ja'));
    const fields = [...new Set((DATA.articles||[]).map(a => a.field).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'ja'));
    function fill(select, values){ values.forEach(v=>{ const o=document.createElement('option'); o.value=v; o.textContent=v; select.appendChild(o); }); }
    fill(byId('month'), months); fill(byId('genre'), genres); fill(byId('field'), fields);
    function render(){
      const month=byId('month').value, genre=byId('genre').value, field=byId('field').value, sort=byId('sort').value, kw=norm(byId('keyword').value);
      let rows=(DATA.articles||[]).filter(a=>{
        if(month&&a.monthKey!==month) return false; if(genre&&a.genre!==genre) return false; if(field&&a.field!==field) return false;
        const hay=norm([a.titleJa,a.title,a.summaryHtml,a.authors.join(' '),a.categories.join(' ')].join(' '));
        if(kw&& !hay.includes(kw)) return false; return true;
      });
      rows = rows.slice().sort((a,b)=> sort==='oldest' ? a.timestamp-b.timestamp : sort==='title' ? a.titleJa.localeCompare(b.titleJa,'ja') : b.timestamp-a.timestamp);
      byId('meta').textContent = `更新: ${DATA.updatedAt || '-'} / 表示件数: ${rows.length}件`;
      byId('list').innerHTML = rows.map(a=>`
        <article>
          <div class="src">${esc(a.source)} / ${esc(a.publishedAt.slice(0,10))}</div>
          <h2 class="title">${esc(a.titleJa)}</h2>
          <div class="tags"><span class="tag">AI</span><span class="tag">${esc(a.genre)}</span><span class="tag">${esc(a.field)}</span>${a.categories.slice(0,4).map(c=>`<span class=\"tag\">${esc(c)}</span>`).join('')}</div>
          <div class="summary">${a.summaryHtml}</div>
          <div class="box"><strong>ソース・引用元</strong><br>配信元：${esc(a.source)}<br>原題：${esc(a.title)}<br>著者：${esc(a.authors.join(', '))}<br>原文URL：<a href="${esc(a.url)}" target="_blank" rel="noopener">${esc(a.url)}</a></div>
        </article>`).join('');
    }
    ['month','genre','field','sort'].forEach(id=>byId(id).addEventListener('change',render)); byId('keyword').addEventListener('input',render); render();
  </script>
