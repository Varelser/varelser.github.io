  <script>
    const DATA = {"articles":[{"authors":["Vladislav Ruchkin","Roman Koposov","Johan Isaksson"],"categories":[],"field":"Current Opinion in Psychiatry","genre":"Psychedelics / Trauma","monthKey":"2026-11","publishedAt":"2026-11-17T00:00:00Z","source":"Crossref","summaryHtml":"トラウマの生存者が「自分が変わってしまった」と語ることは多いが、その変化は一つの過程ではない。この「変わった」という感覚は、特性そのものの変化だけでなく、特性の表れ方や人格機能の変化など、異なる過程を指している場合がある。本レビューは、広いパーソナリティ特性そのものの変化、特性の表れ方の変化、発達期における人格形成への影響、人格機能の変化という複数の過程を切り分けて検討する。<br><br>縦断研究によれば、パーソナリティは発達の中で変化しつつも比較的安定しており、大きな否定的ライフイベント後の特性変化は集団レベルでは小さい。ただし個人差は大きく、思春期には気質と性格の連続性と変化が併存する。人格機能のほうが広い特性よりも変わりやすい可能性が示唆されている。<br><br>繰り返される状態が強化や般化、自己理解への統合を経て持続的になるという過程モデルは有望だが、トラウマに特化した検証はまだない。長期にわたり発達に組み込まれた曝露は、人格が組織化される過程そのものに影響しうる。臨床的に重要な問いは「人格が変わったか」ではなく「何が、いつ、どの範囲で変わったか」であり、人格障害の診断は広範で持続的な機能不全に限定すべきだと結論づけている。出典：Crossref","timestamp":1794873600000,"title":"Personality change following psychological trauma: disentangling traits, personality functioning, and personality disorder","titleJa":"心理的トラウマ後の人格変化――特性・人格機能・人格障害を切り分ける","url":"https://doi.org/10.1097/yco.0000000000001135"},{"authors":["Zhensong Wang"],"categories":[],"field":"Journal of Documentation","genre":"Consciousness / Philosophy","monthKey":"2026-11","publishedAt":"2026-11-17T00:00:00Z","source":"Crossref","summaryHtml":"情報を量や意味の記述だけで捉えるのではなく、自然過程の中で情報の差異がいかに組織化され、変容に寄与するかを問う自然主義的・過程的な情報論を展開する論文。シャノンのエントロピー、コルモゴロフ複雑性、フロリディの意味論的情報、ドレツキの自然主義的説明を批判的に検討する。<br><br>シモンドンの個体化の理論とブレナーの「現実における論理」を対話させることで、情報の過程的・関係的な枠組みを構築する。情報の差異は、組織化された準安定システムに取り込まれたときに作用しはじめ、その後の変容を条件づける関係や制約を再編成するという。差異がただ存在するだけではなく、システムの組織に取り込まれて初めて情報として働くという見方だ。<br><br>提示される図式は、関係性・生成性・歴史性・方向性・因果性・開放性・規範性・非計算可能性という4次元8特徴からなる。ベクトル性は特徴の多様さではなく、それらの組織化と関係の変化にあり、非計算可能性は認識論的な境界条件として位置づけられる。量的・意味論的・過程存在論的なアプローチの知見を一つの自然主義的な統合へと結びつける試みとなっている。出典：Crossref","timestamp":1794873600000,"title":"From scalar to vector: a naturalist reconstruction of the philosophy of information","titleJa":"スカラーからベクトルへ――情報哲学の自然主義的再構築","url":"https://doi.org/10.1108/jd-08-2026-0531"},{"authors":["Sreetama Misra","Sitakanta Panda"],"categories":[],"field":"Journal of Information, Communication and Ethics in Society","genre":"Ethics / Safety","monthKey":"2026-11","publishedAt":"2026-11-17T00:00:00Z","source":"Crossref","summaryHtml":"エージェント型AIが労働市場や社会経済の意思決定を担うようになるなか、公平性や透明性といった手続き的な客観性だけでは倫理的な正しさは保証できないと本研究は指摘する。手続きが整っていても、AIが人間の判断を置き換えることで構造的な不平等や認識的不正義が組み込まれ、むしろ深まるおそれがあるという。<br><br>著者らは、状況に根ざした知識に基づく「包摂的客観性」という概念を提案する。関係への依存や文脈に応じた判断を受け入れ、苦しみの個別性や生きられた経験、構造的な不平等といった道徳的な非対称性を認めることで、エージェント型AIが過度に排除的になるのを防ぐ。実行だけを最適化する「実行の倫理」に対し、他者との出会いを重んじる「邂逅の倫理」を対置する。<br><br>結論として、エージェント型AIにおける客観性は、権力や文脈、生きられた経験の多様性に注意を払う関係的で包摂的なものとして捉え直す必要がある。技術的な修正だけでは正義や承認、人間の主体性という道徳的な要請には応えられない。包摂的客観性は自律的に機能するエージェント型AIとは構造的に緊張関係にあると著者らは述べている。出典：Crossref","timestamp":1794873600000,"title":"Agentic artificial intelligence, labour and inclusive objectivity","titleJa":"エージェント型AIと労働、包摂的客観性――公平性・透明性だけでは足りない理由","url":"https://doi.org/10.1108/jices-09-2025-0233"},{"authors":["Xin Zhou"],"categories":[],"field":"ASCILITE Publications","genre":"Ethics / Safety","monthKey":"2026-11","publishedAt":"2026-11-17T00:00:00Z","source":"Crossref","summaryHtml":"学術的誠実さの維持は高等教育の重大な課題であり、人間の知識の生産と普及をめぐる枠組みそのものにかかわる。AIツール利用の倫理をめぐる研究は多いが、その背後にある権力関係は見過ごされてきた。本研究はブルデューの象徴的暴力論とアクターネットワーク理論を用い、オーストラリアの高等教育機関と主要な学術誌出版社のAI利用ポリシーを検討する。<br><br>アクターネットワーク理論により、技術導入の過程でAI利用をめぐるガバナンスのネットワークを特定し、制度的な力関係の全体像を描き出す。AIツールが制度と利用者のコミュニケーションを積極的に仲介する媒介者として働くことを示す。象徴的暴力の概念は、権力をもつ制度がこうしたガバナンスを正当化する仕組みを包括的に説明する。<br><br>結論として、現状を調整・強化し粉飾するだけのAI倫理規制という「偽装」を暴き、問い直すことが本研究の狙いである。規制が現状維持にとどまるならAIの潜在力は正義へ向けられない、という問題提起であり、潜在的な人間のバイアスと闘う方向へつなげる。出典：Crossref","timestamp":1794873600000,"title":"The tension between artificial intelligence and knowledge: Power relations in the policies of universities and publishing organisations","titleJa":"人工知能と知識の緊張――大学と出版社のAI利用ポリシーに潜む権力関係","url":"https://doi.org/10.65106/apubs.2026.3176"},{"authors":["George Joseph"],"categories":[],"field":"Digital Policy, Regulation and Governance","genre":"Ethics / Safety","monthKey":"2026-11","publishedAt":"2026-11-17T00:00:00Z","source":"Crossref","summaryHtml":"オープンソースのAI部品を組み込んで医療AIを調達する組織にとって、倫理的な懸念がどこで可視化され、文書に残るかが問われる。本論文はFairlearn、AI Fairness 360、Clinical BERT、BioBERTの4つのGitHubリポジトリを対象に、2020年1月から2025年1月の450件のイシュースレッドと2,136件のコメントを分析し、倫理的懸念が文書化へつながる過程を比較した。<br><br>Fairlearnではデータセットや用語、意図された用途、指標の解釈をめぐる議論が繰り返し文書へ反映されていた。一方AIF360では同種の懸念が短い返信のみで終わり、指針に結びつくことは稀だった。臨床系リポジトリでもモデルの妥当性や用途への懸念は提起されていたが、分類が弱く文書化は不均一だった。この違いは保守体制や貢献者の経路、イシューの分類方法などと関連していた。<br><br>著者らは、調達側は倫理ラベルそのものではなく、それを生んだ上流の過程を見るべきだと結論づける。倫理的推論がどこで公開検証可能かを示す監査用の問いを提示しているが、検証済みの調達ツールではない点に注意が必要だ。出典：Crossref","timestamp":1794873600000,"title":"Where health-care AI ethics becomes public: documentation as ethics infrastructure in open-source repositories","titleJa":"医療AIの倫理はどこで公開されるのか――文書化を倫理のインフラとして","url":"https://doi.org/10.1108/dprg-08-2026-0623"},{"authors":["Shiyun Fan"],"categories":[],"field":"Communications in Humanities Research","genre":"Consciousness / Philosophy","monthKey":"2026-11","publishedAt":"2026-11-17T00:00:00Z","source":"Crossref","summaryHtml":"深層学習と生成系大規模言語モデルの普及は、人々の生の捉え方や感性的経験そのものを変えつつあり、美学の問い直しを迫っている。本論文は、一定の知的能力と自己学習能力をもつ技術としてのAIを前に、人間の感性経験を再評価する。画面の向こうのAIの本体は知ることのできないブラックボックスであり、カントの物自体やリオタールの提示不可能なものと似た二重の性質をもつと論じる。<br><br>こうしたAIの「物自体」としての側面は、人間の精神の内に崇高を呼び起こす。これがカント的な崇高である。一方、提示不可能なものとしてのAIは、物の側の崇高、すなわちリオタール的な崇高を肯定する。AIは知りえず、感性では捉えきれないからこそ、人間はAIとの対峙において二種類の崇高な美的経験を得ることができる。<br><br>論文は、AIの不透明さを欠陥としてではなく、美的経験の条件として読み替える。技術の進歩が感性の可能性を狭めるのではなく、新しい崇高の形を開くという見方を提示している。AIと向き合う経験そのものが、現代における崇高の在り処を示すという主張だ。出典：Crossref","timestamp":1794873600000,"title":"How Is the Sublime Possible in the Age of Artificial Intelligence","titleJa":"人工知能の時代に崇高はいかに可能か","url":"https://doi.org/10.54254/2753-7064/2026.39057"},{"authors":["Arnav Saxena","Khushi Bansal","Ilanthenral Kandasamy"],"categories":[],"field":"Frontiers in Artificial Intelligence","genre":"Ethics / Safety","monthKey":"2026-11","publishedAt":"2026-11-17T00:00:00Z","source":"Frontiers in Artificial Intelligence","summaryHtml":"LLMは政治・経済・社会をめぐる争点のある情報との出会いを仲介するようになった。従来の分析はエコーチェンバー形成を単一の静的なバイアスとして扱い、モデルがユーザーに同意するか、複数の視点を示すか、不確実性を表すかを混同し、ユーザーの立場を強化するモデルと反論するモデルを区別できなかった。<br><br>本研究はエコー形成を分解するニュートロソフィック・フレームワークを提案する。各ターンは視点の多様性（T）と表出された不確実性（I）を0から1のメンバーシップ、立場の強化（F）を-1から1の双極メンバーシップとする三つ組で表し、閉形式のEchoIndexを導く。4つの商用ウェブ製品での探索的ベースラインの後、7つのモデル構成×3つの争点トピック×2つのシステム指示条件で210会話・1,260ターンの統制実験を行い、300・200ターンの人間検証も実施した。<br><br>反論を促す指示はEchoIndexを下げ（ΔEC=-0.677、Cohen's d=-2.23）、7構成すべてで負だった。ただし構成要素の寄与は安定せず、人間の合意に対する手続き的構成要素の一致は中程度にとどまった。貢献は分解そのものにある。見かけのバイアスをどの構成要素が生むのか、緩和策がそれを正すのか隠すのかを問うための、構成要素を別々に検証した符号付きの道具だ。出典：Frontiers in Artificial Intelligence","timestamp":1794873600000,"title":"Modeling echo chambers in LLM conversations: a neutrosophic framework for decomposing agreement, diversity and uncertainty","titleJa":"LLM会話におけるエコーチェンバーのモデル化――同意・多様性・不確実性を分解する枠組み","url":"https://doi.org/10.3389/frai.2026.1926717"},{"authors":["Zeynab Anbiaee","Sajjad Dadkhah","Ali A. Ghorbani"],"categories":["cs.CR"],"field":"cs.CR","genre":"Ethics / Safety","monthKey":"2026-11","publishedAt":"2026-11-16T18:49:37Z","source":"arXiv","summaryHtml":"LLMアプリがエージェントとして外部ツールを選択・呼び出す時代になり、モデル・コンテキスト・プロトコル（MCP）が複数サーバーのツールを組み合わせる標準となった。しかし発見と選択に使うツールのメタデータは、検証済みの提供者アイデンティティに結びついているとは限らない。<br><br>本研究はこの隙間を「ツール提供者ミスバインディング」として定式化する。正規の提供者向けのはずの要求が、攻撃者の管理するツールに解決されてしまう失敗である。攻撃者はホストもLLMも正規サーバーも侵害せず、選んだメタデータを掲げる別のMCPサーバーを運用するだけだ。攻撃者制御のツール選択最適化問題として定式化し、5つのLLMクライアントで制御されたMCP環境で評価した。<br><br>結果として、相互作用がミスバインディングを駆動した。完全な名前衝突、タスクに合った説明、適合するスキーマが重なると最も強い失敗が起きるが、権威を高めた説明と適合スキーマだけでも、名前衝突なしに誤った提供者での実行や提供者の曖昧さを招いた。モデルごとに弱点の現れ方も異なり、攻撃者制御の提供者選択、確認要求、不安定な提供者解決などが見られた。出典：arXiv","timestamp":1794854977000,"title":"When Tool Names Are Not Identities: Measuring Provider Misbinding in MCP-Based AI Agents","titleJa":"ツール名は身元ではない――MCP型AIエージェントにおける提供者ミスバインディングの測定","url":"https://arxiv.org/abs/2611.21577"},{"authors":["Jorge Valverde-Rebaza","Nathan Garcia-Larios","Karime Ruvalcaba-Perez","Alejandro Rendon"],"categories":["cs.CL"],"field":"cs.CL","genre":"LLM / NLP","monthKey":"2026-11","publishedAt":"2026-11-16T18:24:48Z","source":"arXiv","summaryHtml":"LLMは公的な言語の解釈・生成・仲介に使われることが増え、政治的に敏感な場面での信頼性がとりわけ重要になっている。感情分析はよくある課題だが、ソーシャルメディアの言説における感情的意味は、文化的に位置づけられた間接的な手がかりで伝えられることが多く、ラベル中心の評価だけでは捉えきれない。<br><br>本研究はスペイン語の政治言説に対するLLMの頑健性を評価する診断プロトコルを導入する。3つの独立した人間アノテーションを組み合わせたGold・Ambiguousサブセットと、モデル条件付きパープレキシティとLLM-as-a-judgeで選んだ感情反転の反事実から作ったSyntheticサブセットを用い、プロプライエタリモデルとオープンウェイトモデルをゼロショット・フューショットで比較した。<br><br>アノテーションの曖昧さと反事実の摂動は、元のデータでの従来評価では見えにくい失敗モードを露わにした。GPT-4.1-miniが最も安定し、小さいオープンウェイトモデル2つは合成摂動でより大きく劣化し、フューショットは限定的な改善にとどまった。3者間の人間感情アノテーション付きスペイン語ソーシャルメディアデータセットも公開される。出典：arXiv","timestamp":1794853488000,"title":"Evaluating Cultural Reasoning and Robustness in LLMs for Spanish Political Discourse","titleJa":"スペイン語政治言説におけるLLMの文化的推論と頑健性の評価","url":"https://arxiv.org/abs/2611.21535"},{"authors":["Zhuoyang Li","Teng Shi","Jiakai Tang","Weijie Yu"],"categories":["cs.AI"],"field":"cs.AI","genre":"LLM / NLP","monthKey":"2026-11","publishedAt":"2026-11-16T17:28:45Z","source":"arXiv","summaryHtml":"推論で強化された生成推薦（GR）は、LLMの推論能力を次アイテム予測に活かす手法として注目されている。既存手法はGRPOで最終的な推薦性能で決まるルールベース報酬により推論を最適化するが、推論ステップごとの予測への寄与が最適化信号に直接反映されないこと、グループ内の異なる推論軌跡が区別できない報酬を受け取ること、という2つの限界がある。<br><br>本研究は予測利得（PG）で推論を最適化する訓練枠組み「GainReason」を提案する。PGは個々の推論文が目標セマンティックID（SID）の対数尤度をどれだけ変化させるかを測り、寄与を意識した識別的な報酬を与える。期待PGと推薦ランキング目的の整合性も理論的に示した。この信号に基づき、文レベルの報酬で推論生成を最適化するPGROと、効率的なPG計算のための因果的注意機構、推論条件付き予測を適応的に強化する補助タスクPGRUを開発した。<br><br>3つの公開ベンチマークでの広範な実験により、GainReasonは競合するベースラインを一貫して上回り、推論による大幅な性能向上を達成した。出典：arXiv","timestamp":1794850125000,"title":"Learning to Reason with Predictive Gains for Generative Recommendation","titleJa":"予測利得で推論を学ぶ生成推薦――文レベルの報酬によるGainReason","url":"https://arxiv.org/abs/2611.21441"},{"authors":["Jason Alexander","Yuxuan Li","Michael Licamele","Wesley Hanwen Deng","Sauvik Das"],"categories":["cs.CY"],"field":"cs.CY","genre":"Ethics / Safety","monthKey":"2026-11","publishedAt":"2026-11-16T16:36:47Z","source":"arXiv","summaryHtml":"LLMの暗黙のバイアスは、採用や知能評価といった注目度の高い一度きりの判断場面では示されてきた。しかし自律的なLLMエージェントが日々のタスクで人の代わりに判断する時代には、社会人口学的仮定に基づくバイアスが日常の判断場面にどう現れるかを理解することが重要だ。<br><br>本研究は米国時間利用調査（ATUS）の17の日常活動領域を用い、異なる人種・性自認・政治的イデオロギーのペルソナを与えたLLMが有意な暗黙のバイアスを示した506の判断シナリオの「アトラス」を作成した。次にクラウドソーシング監査で500人が8,010回の二択を行い、どのバイアス場面をさらに検討すべきかを選んだ。<br><br>参加者は、広い関連性（食の選択など）、重大性（健康など）、シミュレーションされた社会人口学的グループ全員が全会一致で判断した場面（ステレオタイプの明確な兆候）を優先した。格差の大きさやATUS領域にはあまり左右されなかった。優先の理由を調べると、参加者は格差を人口集団の特性と解釈し、それがもっともらしいかを自分の内面化したステレオタイプで判断することが多かった。出典：arXiv","timestamp":1794847007000,"title":"A Crowd-Audited Atlas of Implicit Bias in LLM-Powered Agents","titleJa":"LLMエージェントの暗黙のバイアス地図――506の日常判断シナリオのクラウド監査","url":"https://arxiv.org/abs/2611.21376"},{"authors":["Lennard Naumann"],"categories":[],"field":"SocArXiv","genre":"LLM / NLP","monthKey":"2026-11","publishedAt":"2026-11-16T15:49:02Z","source":"OSF Preprints","summaryHtml":"党派間の敵意や回避は民主社会の懸念材料だが、短い会話でそれを和らげられるだろうか。本研究は、対面での説得研究で確立された2つの手法――相手の視点に立つ「視点取得」と、相手の道徳的枠組みに訴える「道徳的再構成」――を実装した大規模言語モデルチャットボットとの対話を検証した。ドイツのオンライン標本1,634人を対象とした事前登録済みの2×2要因実験で、1週間後の追跡調査には1,294人が回答した。<br><br>結果として、道徳的再構成チャットボットとの対話は、その後1週間の対立党派との議論の自己報告を増やした（0.10標準偏差）。どちらのチャットボットも、後日人間の対立党派と議論する研究への参加登録を増やした（0.13〜0.17標準偏差）。視点取得チャットボットは直後の政策態度を相手側へ0.09標準偏差だけ動かしたが、その変化は1週間以内に消えた。<br><br>一方で、どちらのチャットボットも対立党派への感情や回避的な選好そのものは変えなかった。著者は、短いチャットボット対話は感情を変えずとも、党派を越えた接触への第一歩として機能しうると結論づけている。出典：OSF Preprints","timestamp":1794844142000,"title":"AI chatbot conversations reduce behavioral avoidance of political opponents without changing feelings toward them","titleJa":"AIチャットボットとの対話は政治的対立相手への回避を減らす――感情は変わらないまま","url":"https://osf.io/preprints/socarxiv/bc9ye_v1/"},{"authors":["Renata Topinkova","Carsten Schwemmer"],"categories":[],"field":"SocArXiv","genre":"Agents / Robotics","monthKey":"2026-11","publishedAt":"2026-11-16T12:13:17Z","source":"OSF Preprints","summaryHtml":"オンライン調査は人間の回答を前提に成り立っているが、簡単な指示一つでウェブサイトを操作し課題を遂行するエージェント型ブラウザの登場が、その前提を揺るがしている。本研究は市販のエージェント型ブラウザ3種に「このアンケートに回答して」という一言の指示だけを与え、オンライン調査を遂行できるか、既存の検出・防止策が通用するかを検証した。<br><br>エージェントはほとんど人間の入力なしに調査を完了し、割り当てられた人口統計学的プロフィールも維持した。技術的なスクリーニング、可視・不可視CAPTCHA、AI専用のプロンプトインジェクション検査、長期調査での回答の一貫性、単一指示による複数調査の完了を試したが、プロンプト漏洩や脱獄風の検査はすべて通過し、ブラウザのメタデータから自動参加を見抜くこともできなかった。不可視reCAPTCHAは一部のブラウザに一貫して突破され、可視reCAPTCHAが最も強い障壁だったものの、解けてしまう場合や人間に制御を戻す場合もあった。<br><br>広く入手可能なAIエージェントが、人間参加者向けの課題を代行し、一見筋の通ったもっともらしい回答を生み出せることが示された。人間が生成したはずのデータが本当に人間によるものかをどう検証するかという、研究の信頼性に関わる問いが浮かび上がる。出典：OSF Preprints","timestamp":1794831197000,"title":"\"Fill Out this Survey\": Capabilities and Detection of Agentic Browsers","titleJa":"「このアンケートに回答して」：エージェント型ブラウザの能力と検出","url":"https://osf.io/preprints/socarxiv/tc5zq_v3/"},{"authors":["Kangwen Zhao","Jianfeng Cai","Ruopei Sun","Mingxiao Feng","Peng Zhang","Wengang Zhou","Houqiang Li"],"categories":["cs.AI"],"field":"cs.AI","genre":"Agents / Robotics","monthKey":"2026-11","publishedAt":"2026-11-16T08:40:29Z","source":"arXiv","summaryHtml":"LLMエージェントはツールを繰り返し試行することで課題の品質を高められるが、改善の見込みが薄い試行を続ければコストだけが膨らむ。試行を重ねれば最良の結果は改善しうるが、すでに最良の結果を超える見込みが低い試行は無駄になる。本研究は、タスク単位のBest-of-N品質を保ちつつ、実行をいつ打ち切るかを決める制御手法GainCtrlを提案する。軽量なCPU予測器が対話履歴から期待できる利得を推定し、較正済みの閾値で停止を判断する。<br><br>3つの環境と3つのLLMアクターを用いた軌跡再生による評価では、GainCtrlは同等の目標品質においてベースラインより少ないトークンで済んだ。固定の打ち切り方針でも、完全な実行に近い品質を保ちつつトークン消費を大幅に減らせた。予測器は単一CPUスレッドでミリ秒単位の遅延で動作する。<br><br>LLM内部へのアクセスを必要とせず、繰り返し監視できる点が特徴だ。実行中の監視を繰り返しても計算負荷は小さく、エージェントの実行コストを抑えながら品質を維持するための実用的な停止制御の枠組みを示している。出典：arXiv","timestamp":1794818429000,"title":"GainCtrl: Predicting Remaining Gains for Efficient LLM Agent Execution","titleJa":"GainCtrl――LLMエージェントの実行を効率化する残存利得予測","url":"https://arxiv.org/abs/2611.20736"},{"authors":["Sachin Gupta"],"categories":["cs.AI","cs.LG"],"field":"cs.AI","genre":"Agents / Robotics","monthKey":"2026-11","publishedAt":"2026-11-16T08:19:25Z","source":"arXiv","summaryHtml":"ツールが失敗した後、エージェントは回復の助言を受けて課題を完遂できるのか。本研究は、隔離されたGitLab環境でLangGraphとCrewAIのエージェントに課題を解かせ、ツールエラーを注入して回復を評価するベンチマークAgentFaultBenchを提案する。成果物とイシュー、必要な読み取りや検証、最終応答までを状態で検証する。<br><br>1,944回の計画実行による主比較では、助言の有無による成功率の変化は−8.33、0.00、＋1.06ポイントとまちまちで、欠損のため後二者は結論が出なかった。改訂した回復方針ではGPT-4o miniが改善し、SolとClaudeは回復可能な事例を既に完遂していた。別途624回の実験では、助言ありで161/192件が正しい最終状態に達し、助言なしの142/192件を上回った。ただし効果は一様ではなく、条件によって変わることが示唆された。<br><br>イシューIDの除去による影響は小さく、第二のチェッカーも概ね一致した。著者らは、回復の助言は効果を前提とせず、明示的な対照条件と比較して検証すべきだと結論づけている。出典：arXiv","timestamp":1794817165000,"title":"AgentFaultBench: State-Verified Evaluation of Tool-Fault Recovery","titleJa":"AgentFaultBench――ツール障害からの回復を検証する評価基盤","url":"https://arxiv.org/abs/2611.20711"},{"authors":["Wenhan Yu","Zhaoxi Zhang","Zhilong Tan","Weikang Li","Lei Sha"],"categories":["cs.AI","cs.CV","cs.MM"],"field":"cs.AI","genre":"Vision / Multimodal","monthKey":"2026-11","publishedAt":"2026-11-16T07:52:01Z","source":"arXiv","summaryHtml":"動画編集では、視聴覚の観察と精密な時間位置の把握に基づく判断と、描画結果の評価が求められる。本研究は、追加のモデル学習なしに汎用コーディングエージェントを動画ポストプロダクションで使えるようにする視覚ハーネスVIVIDを提案する。オンデマンドの映像検査、音声分析、文字起こしのツールを提供する。<br><br>観察結果は対応するメディア版と時間座標とともに保存され、エージェントは推論しながら能動的に取り出せる。編集はエージェント本来のコーディングとシェル操作で行い、描画出力を確認して次の修正に活かす。編集の判断は映像と音声の両方の観察に基づく。100課題からなるAgenticVBenchでは、Codexと組み合わせて平均58.6%を記録し、素のCodexを20.2ポイント上回った。<br><br>Claude Codeでは55.1%、OpenCodeでは37.1%と、いずれも素の性能を大きく上回った。学習済みモデルを追加することなく既存のコーディングエージェントをそのまま活用できる設計で、汎用コーディングエージェントの能力を動画編集へ拡張する再利用可能なハーネスの可能性を示している。出典：arXiv","timestamp":1794815521000,"title":"VIVID: A Visual Harness for Agentic Video Editing","titleJa":"VIVID――エージェント型動画編集のための視覚ハーネス","url":"https://arxiv.org/abs/2611.20688"},{"authors":["Octavio Islas Carmona","Amaia Arribas Urrutia"],"categories":[],"field":"Online Media and Global Communication","genre":"Consciousness / Philosophy","monthKey":"2026-11","publishedAt":"2026-11-16T00:00:00Z","source":"Crossref","summaryHtml":"AIは人間の「副操縦士」から、自律的にふるまうエージェントへと移行しつつある。本論文はメディア・エコロジーの視点から、この変化が人間のアイデンティティ、著者性、思考の自律性をどう組み替えるかを分析する。火の制御から現在までの人間とインターフェースの進化をたどり、マクルーハンのテトラッドでAIが何を拡張し、何を陳腐化し、何を取り戻し、何へ反転するかを診断する。<br><br>著者らはAIを脳処理の外部層「エクソコーテックス」と呼ぶ。AIは決定や趣味、分析を形作り直し、従来のメディアが人間の反映であったのに対し、文化や物語を自律的に生み出すモデルへと変わった。ニューラルネットワークのブラックボックス性は司法や医療など重要分野での透明性と監督を妨げ、判断はアルゴリズムへと委ねられ、人間の批判的判断は次第に麻痺していくという。<br><br>判断と技術的労働を機械に委ねれば、人間の批判力と創造力は萎縮するおそれがある。AIは言語という文明のOSをハックし、「真実」をアルゴリズムの副産物に変える「現実の泡」を生む。効率の独裁が民主的制度の応答能力を上回るなか、著者らは「選択的切断の倫理」を提唱し、不完全さや曖昧さ、沈黙を守るべき人間の要素として擁護する。出典：Crossref","timestamp":1794787200000,"title":"From extension to the reconfiguration of the human: artificial intelligence as an environment in media ecology","titleJa":"AIは人間の「拡張」から「再構成」へ――エージェント化するAIとメディア・エコロジー","url":"https://doi.org/10.1515/omgc-2026-0022"},{"authors":["Maruša Ferjan","Marina Trkman"],"categories":[],"field":"Journal of Information, Communication and Ethics in Society","genre":"Ethics / Safety","monthKey":"2026-11","publishedAt":"2026-11-16T00:00:00Z","source":"Crossref","summaryHtml":"生成AIの急速な普及は大きな機会をもたらす一方で倫理的な懸念も呼ぶ。AI倫理の指針や理論枠組みでは「善行」と「無害」という二つの原則が、生成AIの開発と利用を最大の価値と最小の害へ導くものとされる。だが一般の人々がこれらをどう受け止めているかは十分に分かっていなかった。<br><br>本研究は生成AIシステムに対する「知覚された善行」と「知覚された無害」の二つの構成概念を測る尺度を開発・検証した。若年成人を対象とした探索的因子分析では2因子構造が得られ、分散の約64%を説明した。EU在住の成人を対象とした確認的因子分析でも2因子構造が確認され、標準化負荷量はすべて0.70を超えた。<br><br>開発された尺度は、構造モデルに組み込んでさまざまな利用文脈における生成AIの利用行動を分析できる実用的な手段だ。政策立案者が利用者の受け止めをより深く理解し、生成AIの開発と利用を統治するより堅固な政策を設計する助けになると著者らは述べる。倫理原則を人々の実感に即して測る試みとして、AIガバナンスの議論にもつながる。出典：Crossref","timestamp":1794787200000,"title":"Scales to measure the perceived beneficence and non-maleficence of generative artificial intelligence systems","titleJa":"生成AIは「善い」か「害がない」か――人々の受け止めを測る尺度の開発と検証","url":"https://doi.org/10.1108/jices-11-2025-0319"},{"authors":["Askar Garad","Hosam Alden Riyadh","Abdullah M. Al-Ansi","Mohammed Jaboob","Ali Ateeq"],"categories":[],"field":"Journal of Information, Communication and Ethics in Society","genre":"Ethics / Safety","monthKey":"2026-11","publishedAt":"2026-11-16T00:00:00Z","source":"Crossref","summaryHtml":"AIは気候モデリングや予測、エネルギー最適化、廃棄物管理、生物多様性保全、水資源管理など、環境サステナビリティの幅広い領域に応用されている。本論文は査読付き研究の構造的な文献レビューを通じ、AIの活用実態と倫理・ガバナンス上の論点を整理した。AIは主に予測・監視・最適化・モデルにもとづく意思決定といった分析機能を担っている。<br><br>ただしAIの導入が自動的に持続可能性をもたらすわけではない。AIシステム自体のエネルギー需要、インフラの整備状況、ガバナンス能力、透明性・公平性・説明責任をめぐる倫理的懸念が、成果を左右する条件になる。著者らはAIを「本質的に持続可能な技術」ではなく、条件付きの実現手段として捉えるべきだと論じる。<br><br>政策への示唆として、AIガバナンスへの持続可能性基準の組み込み、気候関連AIの透明性・説明責任の強化、エネルギー効率を重視する「グリーンAI」の推進、能力開発とデータ基盤の整備を挙げる。測定と評価に関する短期・中期・長期の研究アジェンダも提案され、応用研究と倫理・ガバナンス研究を一つの枠組みで統合した点が本論文の貢献である。出典：Crossref","timestamp":1794787200000,"title":"Artificial intelligence for environmental sustainability: opportunities, ethical challenges and future research directions","titleJa":"環境の持続可能性にAIを活かす――機会と倫理的課題、将来の研究方向","url":"https://doi.org/10.1108/jices-08-2025-0229"},{"authors":["Tessa Cunningham","Kate Seymour","Sarah Wendt","Tabitha Lean","David Chikwuba"],"categories":[],"field":"International Journal for Crime, Justice and Social Democracy","genre":"Psychedelics / Trauma","monthKey":"2026-11","publishedAt":"2026-11-16T00:00:00Z","source":"Crossref","summaryHtml":"若者の犯罪化をめぐる研究は、個人のリスク要因を探る個別化・実証主義の枠組みに支配されてきた。そのなかでトラウマへの言及は増えたものの、分析は対人関係や家庭内の被害にほぼ限られ、人種差別や貧困、警察対応、収監といった社会的・構造的・言説的な逆境は見えにくくされてきた。<br><br>本論文は、犯罪化された若者を対象ではなく共同研究者として扱う博士研究にもとづき、共同設計のナラティブ手法で調査を行った。人種化された参加者10人の語りに焦点を当て、植民地主義がつくり出した人種の構築と、そこから生じる暴力が、参加者の人生における中心的で持続的なトラウマであることを描き出す。参加者は日常の人種差別や警察との遭遇、投獄の経験を、単発の出来事ではなく人生を貫く害として語った。<br><br>語られた経験は、支配的なトラウマ理解の枠組みを揺さぶる。個人的・家庭的な被害も、人種化された危害や構造的不平等、国家による暴力という広い地平の中に位置づけ直される。若者を研究の対象ではなく共に知をつくる相手とする手法そのものも、トラウマを個人の問題として切り取るのではなく社会的文脈のなかで捉え直す視点を示している。出典：Crossref","timestamp":1794787200000,"title":"Whose Trauma Counts? Racism as an Enduring Trauma in the Lives of Criminalised Young People","titleJa":"誰のトラウマが数えられるのか――犯罪化された若者の生における持続するトラウマとしての人種差別","url":"https://doi.org/10.5204/ijcjsd.4763"},{"authors":["Ellen J. Langer","Philip Z. Maymin"],"categories":[],"field":"Frontiers in Artificial Intelligence","genre":"Consciousness / Philosophy","monthKey":"2026-11","publishedAt":"2026-11-16T00:00:00Z","source":"Crossref","summaryHtml":"機械はいま、書くことも計算することも助言することもほぼ無料でこなす。知能がそれほど安くなったとき、人間に金を払う価値があるのは何か。本論文の答えは「マインドフルネス」、すなわち新しいことに能動的に気づくという単純な行為だ。この答えは2つの主張に立つ。機械は気づかないこと、そして人は気づくことに対価を払うことだ。著者らは両方を検証した。<br><br>機械は気づくか。2026年にネットで広まった問い「洗車したい。洗車場は50m先。歩くべきか車で行くべきか」では、多くの主要モデルが「歩け」と答え、車を家に置き去りにした。4,240件の回答アーカイブでの9問のテストでは、GPT-5.5とFable 5だけが全90試行に合格した。他のモデルは1問を解いて次の問を逃し、エージェントのハーネス内ではコマンドラインより成績が落ちるものもあった。失敗した5モデルに「気づくよう」指示しても、400試行中わずか9回しか合格しなかった。<br><br>人は気づくことに対価を払うか。事前登録した2つの実験（N=1,006と589）では、AI製と人間製の6つの製品にいくら払うかを尋ねた。人間の作り手は支払意思額を約2倍（+103%）にし、能動的な判断を働かせる人間と説明するとさらに20.9%上がった。手順どおりに作るだけの人間でもAIより53.8%高かった。機械のマインドフルネスは特性というより地図であり、評価は各モデルがどの細部を使うかを描くべきだという。人間の仕事は、機械の失敗がなくても価値を保つ。出典：Crossref","timestamp":1794787200000,"title":"When intelligence is cheap, mindfulness is priceless: AI performance and the value of human production","titleJa":"知能が安くなれば、マインドフルネスは貴重になる――AI時代の人間の価値","url":"https://doi.org/10.3389/frai.2026.1914761"},{"authors":["R. Manjupriya","A. Anny Leema"],"categories":[],"field":"Frontiers in Artificial Intelligence","genre":"Neuroscience","monthKey":"2026-11","publishedAt":"2026-11-16T00:00:00Z","source":"Frontiers in Artificial Intelligence","summaryHtml":"てんかんは脳の異常な電気活動による発作の反復を特徴とする慢性神経疾患だが、既存の自動検出手法はノイズの多い脳波（EEG）信号中の複雑な時空間依存性を十分に捉えられず、頑健性や信頼性に欠けた。本論文はEEGによる自動発作検出のための新しい枠組みEPI-SPA Netを提案する。経験的ウェーブレット変換でノイズやアーチファクトを抑えつつ発作関連の周波数成分を保ち、時空間ハイパーグラフニューラルネットワークで高次の空間結合と長距離の時間依存性を同時に学習し、カプセルネットワークで4秒ごとのEEG区間を発作・非発作に分類する。さらに時間畳み込みセグメンテーションネットワークで区間スコアを発作イベントへ変換し、葉レベルの伝播解析も行う。<br><br>評価の結果、全体の正解率は93.1%、適合率96.0%、再現率55.7%、F1スコア70.5%、コーエンのκは0.669だった。葉の動員順序は患者内では患者間より一貫していた（ケンドールのτは0.371対0.008、p &lt; 0.001）。<br><br>再現率が55.7%と低い点には注意が必要だが、発作検出と頭皮EEGからの伝播解析を組み合わせた本手法は、てんかん発作の臨床評価を支援する可能性があると著者らは述べる。出典：Frontiers in Artificial Intelligence","timestamp":1794787200000,"title":"EPI-SPA Net: hypergraph-based deep learning framework for seizure detection and propagation analysis in EEG signals","titleJa":"EPI-SPA Net：ハイパーグラフ深層学習によるEEGてんかん発作の検出と伝播解析","url":"https://www.frontiersin.org/articles/10.3389/frai.2026.1962680"},{"authors":["Geert E. Smid","Joren R. W. Ramaekers","Chesron R. J. Mersie","Hassan Pazira"],"categories":[],"field":"Frontiers in Psychiatry","genre":"Psychedelics / Trauma","monthKey":"2026-11","publishedAt":"2026-11-16T00:00:00Z","source":"Crossref","summaryHtml":"消防・警察などのファーストレスポンダーは、業務に関連したPTSDを発症するリスクが高い。治療を受けている当事者において、トラウマ関連の恥や自己スティグマ、セルフ・コンパッションがどう関わるかは、治療と予防を考えるうえで重要になる。本研究は業務関連PTSDで治療中の30人を対象に、自己スティグマの高さとその関連要因を横断的に調べた。<br><br>対象者の41.4%が自己スティグマの高い水準にあった。自己スティグマが高いほどトラウマ関連の恥が強く（r=0.75）、セルフ・コンパッションは低かった（r=-0.67）。セルフ・コンパッションの低さと恥の高さはPTSD症状の重さとも関連していた。自由記述からは「社会的な判断にさらされること」と「支え合い、力を与えてくれる関係」という二つのテーマが浮かんだ。<br><br>自己スティグマ、恥、セルフ・コンパッションの低さ、PTSD症状の重さは相互に関連している。自己スティグマと恥を減らし、セルフ・コンパッションを育てることが、援助要請やPTSDの転帰を改善するかどうかは、今後の研究課題だと著者らは述べている。出典：Crossref","timestamp":1794787200000,"title":"Exploring self-stigma, trauma-related shame, and self-compassion among treatment-seeking first responders with work-related PTSD","titleJa":"治療を求めるファーストレスポンダーのPTSD――自己スティグマ、トラウマ関連の恥、セルフ・コンパッション","url":"https://doi.org/10.3389/fpsyt.2026.2010901"},{"authors":["Matjaz Kovac"],"categories":[],"field":"Journal of Advanced Research in Social Sciences","genre":"Consciousness / Philosophy","monthKey":"2026-11","publishedAt":"2026-11-16T00:00:00Z","source":"Crossref","summaryHtml":"生きた経験がどのように知識の主張となり、行動を導くのかを問う学際的アプローチ「ノエティクス」を検討した物語的総説である。歴史哲学を、認知科学、現代の意識理論、瞑想的伝統、人工知能との対話に置く。主眼は、経験・メカニズム・認識論的正当化・責任ある行動という四つの領域からなる枠組みの提案にある。経験が知識の主張となり、行動を形づくる過程を一つの枠組みで捉えようとする試みだ。<br><br>この枠組みは、主観的報告から因果的説明へ、正当化された信念へ、実践的決定へという移行を明示しつつ、それぞれの証拠要件を区別する。競合する理論を相互に裏づけ合うものとして扱うことはせず、経験される現実の構築と「意識が物理的世界を生み出す」という主張とを切り分ける点も特徴だ。主観的な経験と客観的な説明のあいだの橋渡しを、証拠の水準を混同せずに行おうとする。<br><br>教育、メンタルヘルス、組織の意思決定、AIガバナンスへの応用が示され、観察可能な成果と、過信や擬人化への防護策が添えられる。ただし統合は概念的なもので実験的検証はなく、メタ認知や神経現象学的アプローチとの比較で漸進的価値を試す必要があるという。出典：Crossref","timestamp":1794787200000,"title":"Noetics, a New but Old Understanding of Mind and Reality","titleJa":"ノエティクス――心と現実への古くて新しい理解","url":"https://doi.org/10.33422/jarss.v9i3.1955"},{"authors":["National Institute on Aging"],"categories":[],"field":"ClinicalTrials.gov","genre":"Psychedelics / Trauma","monthKey":"2026-11","publishedAt":"2026-11-16T00:00:00Z","source":"ClinicalTrials.gov","summaryHtml":"加齢やアルツハイマー病による記憶・注意・思考の変化に対し、定期的な認知トレーニングが脳機能を改善できるか、さらにシロシビンがその効果を後押しできるかを検証するランダム化非盲検並行群間試験である。米国国立老化研究所が主導し、65歳以上の健常高齢者と早期アルツハイマー病患者を対象とする。<br><br>参加者は4週間の認知トレーニングのみの群と、25mgのシロシビン経口投与を2週間隔で2回受けたうえで認知トレーニングを行う群に分けられる。主要評価項目は、初回投与から4週間後の新規神経可塑性複合スコア（NPCS）のベースラインからの変化である。副次評価には安全性・忍容性、認知機能検査、心理的ウェルビーイング、生活の質、睡眠が含まれる。<br><br>MRIや睡眠時EEG、血漿バイオマーカーによる神経可塑性の多層的評価も行われ、神経可塑性や脳ネットワーク結合、神経化学の変化が調べられる。シロシビン群は最大9回の通院で、投与後は24時間の院内観察がある。2026年11月16日に登録情報が更新され、募集が続いている。結果はまだ公表されていない。出典：ClinicalTrials.gov","timestamp":1794787200000,"title":"Neuroplasticity Enhancement From Cognitive Training Reinforced by Psilocybin","titleJa":"シロシビンが認知トレーニングの神経可塑性効果を高めるか――高齢者と早期アルツハイマー病の試験","url":"https://clinicaltrials.gov/study/NCT07721467"},{"authors":["Ronja F. Held","Ruud Hortensius"],"categories":[],"field":"Proceedings of the National Academy of Sciences","genre":"Consciousness / Philosophy","monthKey":"2026-11","publishedAt":"2026-11-16T00:00:00Z","source":"Crossref","summaryHtml":"人や物に心があるかどうかをどう判断するかは、心理学・生物学・哲学の中心的な問いであり、個人の社会的なやり取りから道徳や倫理といった社会レベルの過程までを形づくる。しかし、人が心の能力を帰属させる際にどのような内的モデルを使っているのかは明らかでなかった。本研究は、日常で出会う人間・ペット・ロボット・音声アシスタント・道具など、生命性や社会性の異なる対象への行為主体性（エージェンシー）と経験の帰属を、4つの実験（計256名）で調べた。<br><br>表象類似性分析と実験室実験、6週間の社会的相互作用介入、実生活での長期的な接触を組み合わせ、観測された評価データを理論モデルと比較した。その結果、経験の帰属の表象構造の背後には生命性の区別があり、行為主体性の帰属の内的モデルはより個別的で柔軟であることが示された。ある対象について明示的な情報を得ると行為主体性のモデルは変化し、その情報は対象のカテゴリ全体へ一般化された。<br><br>一方、ロボットや音声アシスタントなどの無生物テクノロジーへの長期的な接触や所有、ペットとの関わりが、経験や行為主体性のモデルを組み替える証拠は得られなかった。心を知覚する際の内的モデルとその柔軟性を明らかにし、心の知覚の根源と帰結を理解する手がかりを与える成果である。出典：Crossref","timestamp":1794787200000,"title":"Short-term flexibility and long-term stability in models of mind perception","titleJa":"心の知覚のモデルは短期的には柔軟、長期的には安定――4実験による検証","url":"https://doi.org/10.1073/pnas.2625583123"},{"authors":["Pierre J. Amiel","Shalini Suresh","Abdulaziz Almuhanna","Pratik Chhetri","John Pateña","Joyce Gyamfi","Dorice Vieira","Chukwuemeka Iloegbu","Emmanuel Peprah"],"categories":[],"field":"PLOS ONE","genre":"Psychedelics / Trauma","monthKey":"2026-11","publishedAt":"2026-11-16T00:00:00Z","source":"PLOS ONE","summaryHtml":"世界の避難民は深刻なメンタルヘルスの課題に直面し、難民・庇護希望の女性は不安・うつ・心的外傷後ストレス障害（PTSD）のリスクがとりわけ高い。PHQ-9、GAD-7、PCL-5といったスクリーニング尺度は広く使われているが、難民女性への導入実態は十分に検討されてこなかった。本システマティックレビューは、米国における成人女性難民・庇護希望者へのメンタルヘルス・スクリーニング導入について、採用・適切性・受容性・忠実度の四つの観点から検証した。<br><br>10のデータベースを検索し、2,011件の文献から重複を除いて921件を精査した結果、37件が組み入れ基準を満たした。しかし対象集団そのものを扱った研究はわずか3件で、いずれも適切性と受容性に関する質的データを示し、肯定的な結果だった。<br><br>全体として、導入に関するデータは限られ、採用・適切性・受容性・忠実度の報告も一貫していなかった。著者らは、文化的配慮のあるケアを実現するには、導入の過程と結果を明示的に調べる研究が必要だと結論づけている。出典：PLOS ONE","timestamp":1794787200000,"title":"Implementation of mental health screening tools among women refugees and asylum seekers in the United States: A systematic review","titleJa":"米国における難民・庇護希望の女性へのメンタルヘルス・スクリーニング導入――システマティックレビュー","url":"https://journals.plos.org/plosone/article?id=10.1371/journal.pone.0362807"},{"authors":["Parsa Mirtaheri","Mohammadreza Armandpour","Keivan Alizadeh","Iman Mirzadeh"],"categories":["cs.LG"],"field":"cs.LG","genre":"Agents / Robotics","monthKey":"2026-11","publishedAt":"2026-11-15T01:07:23Z","source":"arXiv","summaryHtml":"同じ環境（コードリポジトリ、データベース、アプリ群）で繰り返し働くLLMエージェントは、タスク間に潜む共通構造から学べるはずだ。経験を活かす適応には、文脈に保持する方法と、重みを更新する方法の2つの経路があるが、これまで別々に研究されており、それぞれの寄与や相補性は明らかでなかった。<br><br>本研究は文脈内学習（ICL）、検証可能な報酬による強化学習（GRPO）、自己蒸留（SDPO）を単独・併用で比較した。Qwen3.5-9Bを用い、SWE-bench Verified、AppWorld、ScienceWorld、BIRD-Critic-SQLiteの4環境・109タスクで14の適応手法を評価した。ICL単独の最良ポリシーは平均成功率を28.8%から49.4%へ引き上げ、GRPOを加えると最高の51.6%に達した。<br><br>ただしICLは参照回数や試行を減らす一方で、目の前のタスクの検査や検証を飛ばしがちになる。GRPOを併用するとその行動が回復し、参照の削減は保たれた。検証可能な報酬による強化学習が、保持した経験の使い方を洗練できることを示し、文脈管理と重み更新の統合的研究を促す。出典：arXiv","timestamp":1794704843000,"title":"Where Should LLM Agents Adapt at Test Time? In Context, in Weights, or Both","titleJa":"LLMエージェントはテスト時にどこで適応すべきか――文脈か、重みか、その両方か","url":"https://arxiv.org/abs/2611.19700"},{"authors":["Christina Chwyl","Malena Donas","Angelica Spata","Gabriella Gatto","Akeesha Simmons","Kim Hoffman","M. Kati Lear","Brian Pilecki","Jenna LeJeune","Jason Luoma"],"categories":[],"field":"PsyArXiv","genre":"Psychedelics / Trauma","monthKey":"2026-11","publishedAt":"2026-11-15T00:27:04Z","source":"OSF Preprints","summaryHtml":"社交不安症に対するMDMA支援療法（MDMA-AT）の体験を質的に調べた初めての研究。2回のMDMAセッションを受けた参加者20人に半構造化インタビューを行い、治療的利益に寄与したと感じられた側面を反省的テーマ分析で抽出した。<br><br>5つのテーマが得られた。困難な体験に穏やかに向き合うことで癒しが進むこと（自己批判から好奇心と慈しみへ、感情へのアクセスと処理の向上）、自己と他者への広がった視点による意味づけ（苦悩の起源の明確化、本来の自己の理解、つながりと一体感）、身体化された状態を通じた頭の理解から体感の知への移行（感情の体験と解放、自分とともに安心していられる感覚）、脆弱な自己表現を通じた新しい関係パターンの学習、MDMA体験が継続的な自己発見の拠り所になること。<br><br>参加者は、安全な治療的枠組みの中でのMDMAが、感情と向き合い深く感じ身体で味わうことを促し、新たな洞察と癒しを触媒したと感じていた。自分自身や他者とよりつながり安心できることで、関係の中で本来の自分として現れる意欲が高まったという。出典：OSF Preprints","timestamp":1794702424000,"title":"MDMA-Assisted Therapy for Social Anxiety Disorder: A Qualitative Analysis of Patient Experiences of Change","titleJa":"MDMA支援療法は社交不安に何をもたらすか――患者20人の語りから見えた変化の5テーマ","url":"https://osf.io/preprints/psyarxiv/7kx2p_v1/"},{"authors":["Sophia R Ottofaro","Jessica L Maltman","Javier González-Maeso"],"categories":[],"field":"Neuroscience Letters","genre":"Psychedelics / Trauma","monthKey":"2026-11","publishedAt":"2026-11-15T00:00:00Z","source":"PubMed","summaryHtml":"トラウマ体験は、特定の恐怖記憶だけでなく、新しい刺激への過敏さや中立的な場面での持続的な防衛状態といった、非連合的な変化を残す。セロトニン系サイケデリクスであるシロシビンは、連合的な恐怖の消去を促すことが知られていたが、トラウマ後の非連合的なストレス適応にどう働くかは分かっていなかった。本研究は、文脈的な恐怖想起とストレス感受性・感作を同じ個体で分離して測れるマウスの行動パラダイムを作った。<br><br>雄のC57BL/6Jマウスに急性の足ショックを与え、トラウマ想起を評価したのちシロシビン1mg/kgまたは溶媒を投与し、新しい音刺激と新しい文脈への反応を調べた。トラウマを受けたマウスは強い連合的恐怖と、新しい音へのすくみ増加を示したが、シロシビンはこの刺激誘発性の反応を有意に変えなかった。<br><br>一方、刺激のない新しい文脈での持続的なすくみ（ストレス感作）には、経験依存の両方向の効果が出た。非トラウマ群ではすくみが減ったが、トラウマ群では増えた。シロシビンはトラウマ関連行動を一律に弱めるのではなく、経験に応じて非連合的な防衛反応を調節する。サイケデリクスによる可塑性が、条件によっては潜在的なトラウマ状態を増幅しうることを示す。出典：PubMed","timestamp":1794700800000,"title":"Prior trauma shapes the effects of psilocybin on stress sensitization in mice.","titleJa":"トラウマの有無でシロシビンの効果は逆転する――マウスで見えたストレス感作への両方向作用","url":"https://pubmed.ncbi.nlm.nih.gov/42767398/"},{"authors":["Shaila Islam Nipa"],"categories":[],"field":"Philosophy and Progress","genre":"Consciousness / Philosophy","monthKey":"2026-11","publishedAt":"2026-11-15T00:00:00Z","source":"Crossref","summaryHtml":"自己を知るとはどういうことか。文明の始まりから人間の心の中心的な問いであり続けてきた自己意識の本性を、サルトル、シャンカラ、アヴィケンナ（イブン・シーナー）の3人の哲学者の視点から比較する論文。実存主義、アドヴァイタ・ヴェーダーンタ、イスラーム哲学という異なる伝統が、自己をどう理解してきたかをたどる。<br><br>サルトルは自己意識を選択・責任・絶対的自由の観点から捉える。シャンカラは自己意識をアートマンとブラフマンの非二元性・一体性の自覚とし、解脱への道と結びつける。イブン・シーナーは、身体から独立した魂の内在的な自己認識として自己意識を説明する。質的・概念的な手法で3者の解釈を深く読み解き、共通点と相違点を比較する。<br><br>3人の洞察を並べる比較分析はこれまであまり行われてこなかったという。現代の物質主義的な世界で人間の意識を理解するうえでの意義も検討し、自己意識の涵養が自己実現や倫理的責任、有意義な関係に結びつくと論じる。3人の思想を横断することで、自己意識が単なる自己観察ではなく、生き方そのものを方向づける働きであることが浮かび上がる。出典：Crossref","timestamp":1794700800000,"title":"The Nature of Self-Consciousness: Exploration through Sartre, Shankaracharya and Sina","titleJa":"自己意識とは何か――サルトル、シャンカラ、アヴィケンナが語る自己の本性","url":"https://doi.org/10.3329/pp.v75i1.93271"},{"authors":["Patrizio Tressoldi"],"categories":[],"field":"PsyArXiv","genre":"Consciousness / Philosophy","monthKey":"2026-11","publishedAt":"2026-11-15T00:00:00Z","source":"OSF Preprints","summaryHtml":"臨死体験は心停止や昏睡など生命の危機にともなって語られることが多いが、失神や深い瞑想、催眠、サイケデリクス状態など、生命の脅威がない場面でもよく似た体験が報告される。本総説は、こうした「臨死様体験」と本物の臨死体験とで、体験の内容や心理的な特徴、その後の変化に違いがあるのかを検証した。<br><br>最大規模の回顧調査、混合法のオンライン研究、同一人物内でのサイケデリクス比較を横断した結果、中核的な特徴は文脈を越えて広く重なっていた。一方で、亡くなった人や霊的存在との遭遇は臨死体験の34.7%にみられたのに対し、臨死様体験25例では0件で、人生回顧や「引き返せない地点」も臨死体験にのみ現れた単一事例があった。<br><br>ただし等価性を検証するよう設計された研究はなく、対象は自己選択的で回顧的、測定の等価性も未検証のため、両者が同一だと結論づけるのは早い。著者らは神経生理学的・心理学的・進化的・形而上学的な解釈への含意を整理し、前向きで事前登録された十分な規模の研究を今後の課題に挙げる。出典：OSF Preprints","timestamp":1794700800000,"title":"Near-Death Experiences and Near-Death-Like Experiences: A Comparative Synthesis and Implications for Their Interpretation","titleJa":"臨死体験と臨死様体験はどこが違うのか――現象・心理・後遺効果の比較統合","url":"https://osf.io/preprints/psyarxiv/tu64g_v1/"},{"authors":["David Hason Rudd","Dennis Singh","Cesar Sanin","Bryn James"],"categories":["cs.CY","cs.AI"],"field":"cs.CY","genre":"Ethics / Safety","monthKey":"2026-11","publishedAt":"2026-11-14T23:48:47Z","source":"arXiv","summaryHtml":"AIが中核業務に組み込まれるにつれ、倫理・法務・運用の複雑なリスクを管理する企業ガバナンス基盤の必要性が高まっている。多くの組織がAI倫理の原則を掲げる一方、AIガバナンスを取締役会の優先事項とする組織の半数未満しか正式な枠組みを持たないという実施の隔たりがある。本論文はその隔たりを埋める構造化された企業AIガバナンス・アーキテクチャ（CAIGA）を提案する。<br><br>柱は二つある。一つは、最高プライバシー責任者（CPO）や最高倫理責任者（ChEO）といった専門のC-suite職の役割の進化で、企業全体のAI利用に対する説明責任を制度化する。もう一つは、法務・技術・データサイエンス・サイバーセキュリティ・事業部門を横断するAIガバナンス委員会で、倫理原則を運用上の決定へ翻訳し、新規AI施策の戦略的なゴー／ノーゴー承認を含む仕組みを担う。<br><br>査読文献やEU AI法を含む規制枠組み、業界実務の概念的検討に基づき、明確な説明責任ポリシー、構造化されたリスク管理ワークフロー、組織全体の倫理的AI文化を組み込んだ再現可能な枠組みを示し、金融サービス部門への適用で例示した。企業リーダーやリスク専門家、政策立案者への直接の示唆を持つ。出典：arXiv","timestamp":1794700127000,"title":"Architecting the Corporate AI Infrastructure: The Evolving Roles of AI Governance Committees and Chief Ethics Officers","titleJa":"企業のAIガバナンス基盤を設計する――AIガバナンス委員会と最高倫理責任者の役割","url":"https://arxiv.org/abs/2611.19670"},{"authors":["Jiaju Justin Yan","Xiaqing Nancy He","Alan Boss"],"categories":[],"field":"SocArXiv","genre":"Other","monthKey":"2026-11","publishedAt":"2026-11-14T23:11:31Z","source":"OSF Preprints","summaryHtml":"起業家は苦境にある事業を続けるかどうかの判断でAIに頼るようになった。だが粘り強さの理論は、その要因を起業家本人の内面か人間同士のネットワークに求めてきた。本論文はAIを、人間ではない第三の要因として位置づける理論枠組みを提示する。心理的資源アプローチやエスカレーション理論、閾値理論、AI起業エージェンシー枠組みを土台に、二つの経路を区別する。<br><br>資源経路では、AIが心理的資源を補い、粘り強さの強度を高め、起業家自身の内的資源への依存を緩める。認識経路では、AIが判断の土台となるフィードバックそのものを形づくり、反証的な証拠への応答性として定義される「粘り強さの較正」を左右する。5つの命題は、二つの経路が組み合わさってAIによるエスカレーション増幅が生じる条件や、不確実性が自信と較正の乖離を広げる仕組み、エージェンシー型AIが逆境と向き合う決断の場面を減らす過程を具体化する。<br><br>時間的な拡張として、持続的なAIの支えが粘り強さをもろくする可能性も論じる。AIをめぐる楽観論と悲観論の双方を調停し、小規模事業主や助言者、AI設計者に向けた検証可能な示唆を提示する。起業の現場でAIが「続ける力」をどう変えるかを考えるための枠組みである。出典：OSF Preprints","timestamp":1794697891000,"title":"Keep on Keeping On, With a Machine: Artificial Intelligence and the Calibration of Entrepreneurial Persistence","titleJa":"AIに相談して続けるかやめるか――起業家の「粘り強さ」をAIがどう変えるか","url":"https://osf.io/preprints/socarxiv/gtd4z_v1/"},{"authors":["Ziwei Gu","Michael S. Lee","Drew Rein","Yash Maurya"],"categories":["cs.CL"],"field":"cs.CL","genre":"LLM / NLP","monthKey":"2026-11","publishedAt":"2026-11-14T22:16:38Z","source":"arXiv","summaryHtml":"シンガポールはLLMの法律推論を試す独特の舞台だ。継承した英コモンローと現地特有の法令が組み合わさり、モデルは一般的なコモンローの直観と現地の法理を区別しなければならない。また一般の法律相談では事実が不足しがちで、結論を左右する事実は準拠する法理次第で変わる。既存の法律ベンチマークはシンガポール法も、この種のあいまいさ認識もほとんど扱ってこなかった。<br><br>本研究はシンガポール法の自由記述式法律推論とあいまいさ認識のための大規模ベンチマーク「SG-LegalClarify」を提案する。弁護士が作成した1100問（10法領域、完全指定340問・不足指定760問）からなり、不足指定の各問には隠れた事実と完全指定版の対応問があり、計1860の評価事例になる。回答は弁護士作成のIRAC（争点・準則・適用・結論）ルーブリックで採点される。<br><br>19のLLMをクローズドブックとウェブ検索付きで評価した結果、最良モデルでも必須ルーブリック項目の充足率はクローズドブックで69.8%（平均53.8%）、ウェブ検索付きで77.8%（平均63.0%）にとどまり、ベンチマークは未飽和である。モデルは明確化が必要な場面の認識にも苦労した。公開スプリットと評価パイプラインが公開される。出典：arXiv","timestamp":1794694598000,"title":"SG-LegalClarify: A Large-Scale Benchmark for Legal Reasoning and Ambiguity Recognition in Singapore Law","titleJa":"シンガポール法の法律推論ベンチマーク――あいまいさを見抜く力を測る","url":"https://arxiv.org/abs/2611.19643"},{"authors":["Mirco Milletarì","Tuhin Kundu"],"categories":["cs.AI"],"field":"cs.AI","genre":"Agents / Robotics","monthKey":"2026-11","publishedAt":"2026-11-14T20:45:31Z","source":"arXiv","summaryHtml":"複雑な場面で働くエージェントは、環境情報の不完全さ、曖昧なユーザー指示、複雑な業務ルール、方策の確率的ゆらぎに直面する。LLMエージェントのベンチマークは増えているが、実運用での信頼性を評価するには、条件ごとに性能を定量化する体系的な枠組みが必要だ。Thinkingboxベンチマークでも最強モデルが業務シナリオで一貫した性能を出せずにいる。<br><br>本論文はエージェントシステムの不確実性と信頼性を評価する統計的フレームワークを提案する。シナリオ・事例・サンプルの階層を定義し、平均合格率、pass@k、pasŝ^kといった既存の指標に不確実性の推定を付与する。指標ごとにサンプリングのばらつきを明示し、条件別の性能を体系的に比較できるようにする。階層の異なる水準で集計すると、方策モデルの異なる構造や性質が見えてくる。<br><br>著者らはこの階層的集計を、物理学や統計学の「粗視化（coarse-graining）」と結びつけ、階層的な不確実性伝播を構成的に導出した。不偏なpass@k推定量の有限標本での分散の厳密な式も独自に導き、実行ノイズとタスクの異質性を分離する。出典：arXiv","timestamp":1794689131000,"title":"A Hierarchical Statistical Framework for Evaluating Agent Reliability","titleJa":"エージェントの信頼性を測る階層的統計フレームワーク","url":"https://arxiv.org/abs/2611.19614"},{"authors":["Jackson Wang"],"categories":["cs.AI"],"field":"cs.AI","genre":"Agents / Robotics","monthKey":"2026-11","publishedAt":"2026-11-14T17:57:11Z","source":"arXiv","summaryHtml":"LLM取引エージェントがユーザーの代わりに株式を売買する時代になったが、1回の実行のリターンだけでは腕前は分からない。同じモデルでも乱数シードが違うだけで平均5.2ポイントの差が出る。腕前と運を分けるには多数のバックテストが必要だが、既存の評価は先読み（ルックアヘッド）の混入や、モデルの学習済み期間での検証という問題を抱える。<br><br>本研究は3つの米国市場（上昇・下落・暴落）でのバックテスト「rta-bench-1」を提案する。各ヘッドラインは公開時刻の分単位で提示され、期間はブラインドで再生され、すべての実行で先読みが検査される。リターンをファクター曝露とアルファに分解し、各判断を同日・同セクターのランダム選択と比較する。6モデル・91回の実行で、有意なアルファは一つもなく、リターンの中央値78%は市場とスタイルへの曝露で説明され、判断はランダムと変わらなかった。<br><br>エージェントは好材料の多い銘柄を買ったが、ヘッドラインなしでも同程度稼いだ。一方でルールの実行は確実で、プロンプトの現金ルール一つでGPT系エージェントの株式比率が30.3ポイント下がった。開発者は優位性を自ら与え、曝露とアルファを報告すべきだという結論である。出典：arXiv","timestamp":1794679031000,"title":"LLM Trading Agents Earn Beta, Not Alpha: A Look-Ahead-Free Benchmark","titleJa":"LLM取引エージェントが稼ぐのはベータであってアルファではない――先読みなしのベンチマーク","url":"https://arxiv.org/abs/2611.19530"},{"authors":["Youngseok Yoon","Peng Li"],"categories":["cs.AI"],"field":"arXiv","genre":"LLM / NLP","monthKey":"2026-11","publishedAt":"2026-11-14T07:14:23Z","source":"arXiv","summaryHtml":"ベイズ最適化は高コストなブラックボックス問題を少ない試行で探索できる手法だが、性能はサロゲートモデルと獲得関数の組み合わせに強く依存し、最適な組み合わせは問題や最適化の段階ごとに変わる。本研究は、LLMが探索行動の戦略立案と設定選択を担うタスク非依存のメタコントローラ「STaSBO」を提案する。数値的なベイズ最適化は確率モデリングと候補生成を担い続け、LLMはその上位の戦略を管理する。<br><br>STaSBOは戦略立案と戦略に基づく設定選択の二段階で構成される。構造化メモリが過去の計画・設定選択・候補の振る舞いを最適化状態と結びつけ、軌跡の要約と行動計画を改訂できる。広大な設定空間ではサロゲートの適合度を根拠に候補を絞り込み、将来のベイズ最適化アクションの診断で候補の振る舞いを可視化してから行動計画に照らして最終選択する。<br><br>12の合成数学課題と10の科学・工学応用課題で評価した結果、STaSBOは11のベースライン中最良の平均順位2.17と2.60を達成し、各課題群の最強ベースライン（4.08と4.10）を大きく上回った。出典：arXiv","timestamp":1794640463000,"title":"STaSBO: LLM-Guided Strategy Planning and Configuration Selection for Bayesian Optimization","titleJa":"STaSBO――LLMが戦略立案と設定選択を担うベイズ最適化","url":"http://arxiv.org/abs/2611.19214v1"},{"authors":["Zane Fu","Yanzhao Zheng","Ziting Qin","Qianshan Wei","Yi Yu","Gongli Xi","Jihuai Zhu","Baohua Dong","Hangcheng Zhu","Ruohui Huang","Gang Yu"],"categories":["cs.LG","cs.AI"],"field":"arXiv","genre":"Ethics / Safety","monthKey":"2026-11","publishedAt":"2026-11-14T06:57:27Z","source":"arXiv","summaryHtml":"大規模言語モデルの事後学習で注目されるオンポリシー蒸留（OPD）は、教師モデルがオンラインで生成する教師信号で生徒モデルを改善する手法だが、この過程で教師の潜在的なセキュリティリスクも生徒へ移るかどうかは十分に検討されてこなかった。本研究は、攻撃者が教師モデルに教師ありファインチューニングで条件付きバックドアを仕込んだ場合、OPDが生徒モデルへバックドアを転移させる新たなリスクを明らかにした。<br><br>わずかな割合のトリガー付きプロンプトへの曝露だけでバックドアが転移し、その転移は従来の蒸留手法よりもOPDで著しく強いことが分かった。仕組みの分析では、トリガー付き入力と通常入力に対する教師モデルの条件付き確率の異常な差がバックドア信号の本体であり、学習の過程で生徒モデルの内部表現へ徐々に取り込まれることが示された。<br><br>研究チームはこの知見に基づき、蒸留の教師信号の発生源で異常な条件付き確率信号を抑制する方法と、この条件付きバックドア伝播の設定に合わせたOPD学習法を提案し、信頼できない教師によるバックドア転移のリスクを緩和する道筋を示した。出典：arXiv","timestamp":1794639447000,"title":"On-policy distillation as a Backdoor Propagation Channel","titleJa":"オンポリシー蒸留によるバックドアの伝播――教師モデルの脆弱性が生徒モデルへ移る経路","url":"http://arxiv.org/abs/2611.19207v1"},{"authors":["Yuhao Wang","Yucheng Zhao","Yiran Zhong","Feida Zhu","Hongcheng Liu","Qichao Wang","Ming Ma","Yu Wang"],"categories":["cs.CL"],"field":"arXiv","genre":"Vision / Multimodal","monthKey":"2026-11","publishedAt":"2026-11-14T06:49:09Z","source":"arXiv","summaryHtml":"オムニモーダル・エージェントには、マルチモーダルな理解を超えて現実的な作業空間で複雑なタスクを完結させることが求められる。情報は異種ファイルやモダリティに分散し、ファイル間・モダリティ間の依存関係を扱いながら知覚・推論・ツール利用を調整する必要がある。しかし既存のベンチマークは知覚・理解中心で、持続的な対話を通じたタスク完結は十分に評価されてこなかった。<br><br>本研究は、4種のマルチモーダル作業空間と2段階の難易度にわたる380の深掘り調査型タスクからなるベンチマーク「Omni-Workspace」を提案する。タスクは作業空間ファイルの点検・処理、外部情報の取得、ファイルとモダリティを横断した証拠の統合、要件を満たす成果物の作成を要求する。代表的な18モデルを評価した結果、最良モデルでも平均65.93点にとどまり、長時間のマルチモーダル作業実行の限界が明らかになった。<br><br>分析では、マルチモーダル文脈の膨張とタスク状態のドリフトが繰り返し現れる課題だと特定された。著者らは、マルチモーダル作業記憶の管理と明示的なタスク状態追跡を組み合わせた軽量手法「OmniFocus」も提案し、性能と効率の改善を示した。出典：arXiv","timestamp":1794638949000,"title":"Omni-Workspace: Benchmarking Omni-Modal AI Assistants on Multimodal Workspace Tasks","titleJa":"Omni-Workspace――マルチモーダル作業空間でのオムニモーダルAIアシスタントのベンチマーク","url":"http://arxiv.org/abs/2611.19202v1"},{"authors":["Chen Liu","Nikolaus Correll"],"categories":["cs.RO"],"field":"arXiv","genre":"Agents / Robotics","monthKey":"2026-11","publishedAt":"2026-11-14T06:32:12Z","source":"arXiv","summaryHtml":"視覚運動ポリシーの模倣学習は通常、訓練された操作者が実機を遠隔操作するデモに依存し、コストが高い。エゴセントリックグラスはロボットなしで人間のデモを記録できるが、頭部と手元しか追跡できず、体格や腕の長さ、手の形が異なるロボットへ人間の動きをそのまま写すと実現可能な接触が得られない。本研究の「Ego2Sim2Humanoid」は、グラスの記録を物理的に検証済みのロボット訓練軌道へ変換する手法である。<br><br>エージェント型Real-to-Simの段階で、記録されたRGB-Dと頭部ストリームから衝突・テクスチャ付きアセットを再構成し、見えていない面を補完して、操作対象への目標接触帯を予測する。把持プランナーが接触帯を手首姿勢と指の閉じ方へ変換し、二層の姿勢最適化が衝突のない立ち姿勢を計画、全身動作生成器が下半身の移動と視野外の腕の動きを合成する。二段階の動作補正と強化学習による追従ポリシーで、対象が視野から外れても操作を完結させる。<br><br>再構成した場面をロボットの搭載カメラ視点で描画し、同期した画像・固有受容感覚・検証済み行動ラベルを得た。変換データのみでファインチューニングしたGR00T N1.7は、実機デモなしでUnitree G1による移動操作タスクを自律的に遂行した。出典：arXiv","timestamp":1794637932000,"title":"Ego2Sim2Humanoid: Agentic Real-to-Sim for Learning Loco-Manipulation VLAs without Robot Demonstrations","titleJa":"Ego2Sim2Humanoid――実機デモなしでヒューマノイドの移動操作VLAを学ぶエージェント型Real-to-Sim","url":"http://arxiv.org/abs/2611.19196v1"},{"authors":["Tonglin Yan","Jules Tsukahara","Kenneth Williford","David Rudrauf","Grégoire Sergeant-Perthuis"],"categories":[],"field":"Biological Cybernetics","genre":"Consciousness / Philosophy","monthKey":"2026-11","publishedAt":"2026-11-14T00:00:00Z","source":"Crossref","summaryHtml":"意識の主要理論――統合情報理論（IIT）、グローバル・ワークスペース理論（GWT）、能動的推論（AIF）、高次表象（HOR）、射影意識モデル（PCM）――は、それぞれ異なる数学的言葉で語られ、互いに通じ合わないものと見なされがちだった。本論文は確率論・情報理論・幾何学にもとづく共通の数学的言語で5理論を書き直し、マー（Marr）の階層に沿って計算論とアルゴリズムの水準で厳密に比較する。<br><br>比較から各理論の力点が浮かび上がる。GWTは情報の全体への開放性、IITは還元不能な因果的統合、AIFとHORは不確実性の下での階層的推論と意識的アクセス、PCMは意識経験における視点の幾何学を重視する。理論間の見かけの対立の多くは直接の矛盾ではなく、説明する水準の違いによるものだと論じられる。<br><br>著者らは統合・放送・高次アクセス・視点変換を同じエージェント構造の中で調べられる共通テストベッドを提案し、理論の重なりや食い違い、経験的含意をより体系的に比較する道筋を示す。意識科学におけるモデル比較を一段と厳密にする試みである。出典：Crossref","timestamp":1794614400000,"title":"Formalizing consciousness: a comparative mathematical analysis of leading theories","titleJa":"意識の数理化――主要5理論を共通の数学言語で比較する","url":"https://doi.org/10.1007/s00422-026-01068-y"},{"authors":["Joshua A. Brown","Yijia Ma","Yifan Wang","John J. Massa","Peter Kuan-Hao Cheng","Chaowen Chen","Mingzhou Ding","Norman B. Schmidt","Mohammed R. Milad","Jair C. Soares","Raymond J. Dolan","Chenyu You","Wen Li"],"categories":[],"field":"Nature Communications","genre":"Neuroscience","monthKey":"2026-11","publishedAt":"2026-11-14T00:00:00Z","source":"Nature Communications","summaryHtml":"一時的な脅威が、なぜ消えない恐怖の記憶になるのか。感覚野は従来、刺激の特徴を受け取るだけの受動的な部位とみなされてきたが、近年は恐怖処理にも積極的に関わることが分かってきた。本研究は、高精細α波経頭蓋交流電気刺激とEEG-fMRI同時計測、トランスフォーマーによる神経デコーディングを組み合わせ、恐怖条件づけ後の記憶形成・固定・長期保持を15分後、24時間後、7日後にわたって追跡した。<br><br>記憶の痕跡は3回の評価すべてで確認され、刺激後40〜60ミリ秒という早期の感覚段階から始まり、視覚野と辺縁系に分布していた。条件づけにより後頭部のα波脱同期（視覚野の脱抑制の指標）が強まり、それが長期記憶痕跡の強さを予測した。さらに早期視覚野へのα波刺激で視覚野を抑制すると、条件づけによるα脱同期が消失し、恐怖記憶の固定と保持が選択的に阻害された一方、最初の獲得は保たれた。<br><br>感覚野の脱抑制がヒトの長期恐怖記憶に必要な仕組みであることが示され、早期感覚野が一過性の恐怖体験を持続する記憶へ変える要所であること、非侵襲的な脳刺激でその過程に介入できる可能性が開かれた。不安やトラウマ関連障害の治療への応用が期待される。出典：Nature Communications","timestamp":1794614400000,"title":"Sensory cortical disinhibition underlies long-term fear memory in humans","titleJa":"恐怖の記憶は感覚野から生まれる――視覚野の脱抑制が長期記憶を形づくる","url":"https://www.nature.com/articles/s41467-026-79372-1"},{"authors":["Lynn V. Monrouxe"],"categories":[],"field":"Advances in Health Sciences Education","genre":"Ethics / Safety","monthKey":"2026-11","publishedAt":"2026-11-14T00:00:00Z","source":"Crossref","summaryHtml":"生成AIは学術不正の新しい形を生んだのではない。著者は、もっとも取り締まりの緩かった不正――手抜き――が、生き延びるための3つの性質を奪われたのだと論じる。手抜きは努力と結びつき、1本の論文に収まり、怠慢な誰かのものとして帰属できた。流暢な文章は偽るのにコストがかかったため「正直なシグナル」であり、査読の仕組みはそのコストの上に築かれていた。生成AIはそのシグナルを壊した。<br><br>壊れたのはそれだけではない。証拠の連鎖も損なわれている。捏造された主張が、実在する出典に結びつけて一度引用されることで、参照照合ではたどれないのに来歴を獲得する「引用ロンダリング」が起きる。医療専門職教育の研究では、読んでいない文献を引用したと認める著者もおり、生成AIの利用申告はほぼ未較正の道具だという。総合研究が指針を作り、指針がカリキュラムを作るため、捏造された主張はプロンプトから臨床のベッドサイドで教えられる内容へと伝わりうる。<br><br>査読の現場は検証を担う仕組みをもたず、責任はしばしば装備の乏しい査読者に押しつけられる。著者は、認知的な努力を書く行為から、意図を証明するのではなく実践を記述する、意図的な判断の行為へ移すべきだと結論づける。本論文自体も生成AIを使って作られ、努力と範囲と帰属を取り戻す開示の実例として提示されている。出典：Crossref","timestamp":1794614400000,"title":"A fair amount of slop: generative artificial intelligence and carelessness made cheap, unbounded and unattributable","titleJa":"かなりのスロップ――生成AIが「手抜き」を安く、際限なく、無署名にした","url":"https://doi.org/10.1007/s10459-026-10600-5"},{"authors":["Melissa G Zandstra","Metten Somers","Milou Angevaare","Tom Birkenhager","Birit F P Broekman","Rieky Dikmans","Philip van Eijndhoven","Milou A van Eldik","Eric van Exel","Frank L Gerritse","Johanna M Hegeman","Willemijn Heijnen","Rob M Kok","Dore Loef","Roel J T Mocking","Jasper O Nuninga","Mardien L Oudega","Didi Rhebergen","Jordy Rovers","Bart P F Rutten","Bart Schut","Iris E Sommer","Indira Tendolkar","Esmée Verwijk","Hanneke van Welie","Annemiek Dols","Floortje E Scheepers","Edwin van Dellen"],"categories":[],"field":"Journal of Affective Disorders","genre":"Neuroscience","monthKey":"2026-11","publishedAt":"2026-11-14T00:00:00Z","source":"PubMed","summaryHtml":"電気けいれん療法（ECT）は重症うつ病に有効だが、寛解しない例もあり、認知の副作用も懸念される。全体の重症度だけでなく、個々の抑うつ症状が予後を予測する手がかりになる可能性がある。オランダECTコンソーシアムの多施設コホートで、ハミルトンうつ病評価尺度とMADRSから統合した7症状について、ネットワーク解析で寛解（792人）と認知副作用（100人）との関連を調べた。<br><br>自殺念慮は寛解の確率低下（オッズ比0.77）と認知副作用の確率上昇（同1.34）の両方と関連し、ブートストラップでも頑健だった。食欲低下は寛解の確率上昇と、緊張・不安は認知副作用の上昇とそれぞれ関連した。既知の臨床予測因子の調整、別の寛解定義、多変量ロジスティック回帰による感度分析でも、自殺念慮と両転帰の関連、および緊張・不安と認知副作用の関連は支持された。<br><br>治療前の個々の症状がECTの転帰を予測しうることが示された。特に自殺念慮のある患者では、治療効果と副作用の両面で注意深いモニタリングと説明が重要になるという。出典：PubMed","timestamp":1794614400000,"title":"Baseline suicidal thoughts are associated with ECT non-remission and cognitive side effects: A network outcome analysis.","titleJa":"自殺念慮があるとECTは効きにくく副作用も多い――うつ病792人の多施設データが示す症状別の予後","url":"https://pubmed.ncbi.nlm.nih.gov/43033988/"},{"authors":["Roberto De Filippo"],"categories":[],"field":"Psychedelic medicine (New Rochelle, N.Y.)","genre":"Psychedelics / Trauma","monthKey":"2026-11","publishedAt":"2026-11-14T00:00:00Z","source":"PubMed","summaryHtml":"1950年代半ば、統合失調症治療薬クロルプロマジンがLSDの主観的効果を部分的に打ち消すことが臨床で観察された。本論考は、その出発点となった1955年のジベルティとグレゴレッティによる研究を初めて英訳し、忘れられた知見を掘り起こす。当時の並行する研究には、CIAのMKULTRA計画による倫理的に問題のある人体実験も含まれていたが、薬理学的な遮断そのものは複数の筋から確認されていた。<br><br>1970年代のサイケデリクス研究の抑圧により、この薬物相互作用の知見は文献から切り離され、仕組みの説明もないまま孤立した臨床的事実として数十年放置された。現代の神経薬理学は、クロルプロマジンがLSDの主要な分子標的である5-HT2A受容体のアンタゴニストとして働くことを明らかにしている。<br><br>受容体レベルの知識が、半世紀以上前の臨床的洞察を裏づけ、説明を与えたことになる。「解毒剤」の探索という古い問いが、受容体薬理学の言葉でようやく答えを得た例でもある。サイケデリクス研究の歴史に埋もれた知見を再評価し、過去の観察が現代の理解とどう接続するかを示す一編である。出典：PubMed","timestamp":1794614400000,"title":"The Forgotten Search for an LSD \"Antidote\".","titleJa":"LSDの「解毒剤」を求めた忘れられた探索――1955年の臨床知見と5-HT2A受容体","url":"https://pubmed.ncbi.nlm.nih.gov/43036336/"},{"authors":["Jeffrey D Johnson"],"categories":[],"field":"PsyArXiv","genre":"Neuroscience","monthKey":"2026-11","publishedAt":"2026-11-13T19:09:50Z","source":"OSF Preprints","summaryHtml":"エピソード記憶は、出来事内の刺激同士や出来事と時空間文脈との結びつきで成り立ち、想起の探索を導く。関係記憶の神経基盤は広く調べられてきたが、連続する出来事の結びつきや、過去の時間の表象に想起がどう依存するかは十分に分かっていなかった。時間に沿った記憶の移動そのものが、脳内でどう表されているのかが問いだった。順方向と逆方向では、同じ記憶をたどる経路が違うはずである。<br><br>本研究は、単語リスト学習で直後の単語を思い出す順方向想起と、直前の単語を思い出す逆方向想起を、行動と脳波で直接比べた。想起の直前に記録した頭皮脳波を多変量パターン分類で解析し、熟慮と探索に関わる神経活動を区別した。手がかり語から次・前の単語を思い出す課題である。<br><br>行動成績をそろえても、高周波のガンマ帯振動が順方向と逆方向の想起を区別することが示された。時間の方向が記憶探索の神経動態に刻まれている証拠であり、系列想起や自由想起、過去と未来の時間表象の研究にもつながる。記憶の時間的な向きが脳波に表れるという新しい知見である。出典：OSF Preprints","timestamp":1794596990000,"title":"Traveling back and forth through time: oscillatory brain patterns distinguish directional cued recall","titleJa":"時間を往復する脳――順方向と逆方向の想起を分けるガンマ波","url":"https://osf.io/preprints/psyarxiv/v5w3f_v1/"},{"authors":["Jianjun Zhou","Hua Geng","Haoyu Guo"],"categories":["cs.CV"],"field":"arXiv","genre":"Vision / Multimodal","monthKey":"2026-11","publishedAt":"2026-11-13T18:55:25Z","source":"arXiv","summaryHtml":"高次元の生ビデオデータを直接拡散モデリングすることは難しく、既存のピクセル空間手法は特殊なアーキテクチャに頼ることが多かった。本論文は、事前学習済みオートエンコーダや補助的な詳細化器、カスケード、U-Net式スキップ接続を用いない、シンプルな大パッチDiT式Transformer「JVT」を提案する。設計の指針を明確にすることを狙った研究である。<br><br>ビデオパッチ埋め込み、レジスタートークン、適応的層正規化といった設計選択を体系的に検討し、生成品質と計算効率のバランスを取る構成を特定した。その結果、JVTはクラス条件付き・無条件の両設定で、潜在拡散ベースラインに匹敵する生成品質を達成した。<br><br>ピクセル空間での定式化により、ピクセル単位で対応するモダリティの同時生成も自然に可能になる。カメラ条件付きRGB-視差生成の実証では、RGBのみのベースラインよりカメラ追従が改善し、推論時に追加の再構成モデルなしで明示的なシーン形状が得られた。シンプルなDiT式Transformerがピクセル空間ビデオ拡散にも有効であることを示す知見である。出典：arXiv","timestamp":1794596125000,"title":"JVT: Just Video Transformer makes pixel-space video diffusion simple","titleJa":"JVT――ピクセル空間ビデオ拡散をシンプルにするビデオTransformer","url":"https://arxiv.org/abs/2611.18549"},{"authors":["Tony H. Zhang","Connor Mattson","Daniel S. Brown"],"categories":["cs.AI","cs.MA"],"field":"cs.AI","genre":"Agents / Robotics","monthKey":"2026-11","publishedAt":"2026-11-13T18:50:05Z","source":"arXiv","summaryHtml":"実演は単体エージェントの強化学習を加速する有効な手段だが、マルチエージェント強化学習への拡張は容易ではない。1人の実演者が複数のエージェントを同時に遠隔操作することは難しく、しばしば不可能だからだ。ラウンドロビン行動クローニング（R2BC）は、実演者が一度に1体を操作し、他のエージェントは現在の方策で動かすことでこの問題に対処する。しかし得られる模倣方策は、実演の質に縛られるという限界があった。<br><br>本研究は、単体向けの模倣ブートストラップ強化学習（IBRL）を協調チームへ拡張した「IBMARL」を提案する。各時刻、各エージェントは模倣方策と強化学習方策の2つの行動提案を受け、中央集権的な批評家のアンサンブルがその組み合わせを選ぶ。ゲート付き模倣ペナルティとソフトなQフィルタ行動クローニング損失により、強化学習方策は批評家が模倣行動を高く評価する場面でのみ模倣方策へ引き寄せられる。学習後は各エージェントが強化学習方策だけで動き、中央の批評家は不要になる。<br><br>4つの協調マルチエージェント・ベンチマークでの評価では、IBMARLは2つのタスクで実演ベースのベースラインより2.6〜4.2倍速く模倣方策を上回り、残る2つのタスクでも唯一それを上回った。4タスク中2つでは実演者自身をも超えた。実際の人間の実演を用いた場合も、模倣学習単独を上回り、最良のベースラインの2倍以上の速さで達成した。出典：arXiv","timestamp":1794595805000,"title":"Imitation Bootstrapped Multi-Agent Reinforcement Learning","titleJa":"実演から学ぶマルチエージェント強化学習――IBMARL","url":"https://arxiv.org/abs/2611.18543"},{"authors":["Mohammed Efaz","Udo Bub","Itilekha Podder"],"categories":["cs.IR","cs.AI","cs.CL"],"field":"arXiv","genre":"LLM / NLP","monthKey":"2026-11","publishedAt":"2026-11-13T18:29:51Z","source":"arXiv","summaryHtml":"大規模言語モデルを使った読書支援は、文書全体をオンラインで一度に処理するため、物語の先の展開を漏らしてしまうおそれがある。MeReaderは、消費者向けハードウェア上で動く、プライバシーを守りオフラインで動作する、読書の進行状況を意識したAIアシスタントである。検索と生成を読者の現在位置に限定することで、ネタバレを防ぎながら文脈に沿った伴走者として機能する。<br><br>ベクトル類似度、BM25、要約埋め込みを組み合わせたハイブリッド検索により、読者の現在の文脈への忠実度を高めている。古典的な英語の書籍で評価し、定量的な理解度指標と、LLMによる独立した定性的判定の両方を用いた。その結果、品質と遅延のフロンティアが明らかになり、中規模のローカルモデル（2B〜4Bパラメータ）でも大型モデル（5B以上）と同等の理解度を達成しつつ、許容できる応答品質を維持できた。<br><br>進行状況を意識した境界の仕組みにより、検索品質や正確さを損なうことなく、未来の内容の漏洩を防げることも示された。ローカルでプライバシーを中心に据えたアプローチが、デジタル読書体験を置き換えるのではなく補強しうることが示唆され、クラウド依存のサービスに代わる選択肢となる。出典：arXiv","timestamp":1794594591000,"title":"MeReader: An Offline, Privacy-Preserving, Progress-Aware AI Assistant for Narrative eBook Reading","titleJa":"MeReader――ネタバレなしで物語を読む、オフラインのプライバシー重視AI読書アシスタント","url":"https://arxiv.org/abs/2611.18513"},{"authors":["Sicheng Feng","Zigeng Chen","Song Wang","Gongfan Fang","Xinchao Wang"],"categories":["cs.CV"],"field":"cs.CV","genre":"Vision / Multimodal","monthKey":"2026-11","publishedAt":"2026-11-13T17:54:28Z","source":"arXiv","summaryHtml":"投機的デコーディングは、小さなドラフトモデルがトークンを先読みし、対象モデルがまとめて検証することで生成を高速化する。ドラフトモデルが提案したトークンを対象モデルが並列に検証し、受け入れられたものだけを採用する仕組みだ。拡散型ドラフターは1回の順伝播でトークンブロック全体を提案できるが、対象はテキスト中心で、画像や動画を伴う生成の高速化は手つかずのままだった。<br><br>本研究はまず、視覚入力の有無による次トークン分布のKLダイバージェンスから、トークンごとの「視覚依存度」を測る指標を導入した。視覚依存度が最も低い四分位では採択率46％だったのに対し、最も高い四分位では22％まで下がり、この差はマルチモーダル学習後も残った。そこで提案するMMFlashは、ドラフターが苦手とする視覚依存度の高いトークンを適応的に重みづけし、長い動画入力にはスパースアテンションも用いる。<br><br>複数のマルチモーダルベンチマークでの評価では、MMFlashは出力を変えないロスレスな高速化として最大3.58倍を達成し、EAGLE-3を最大195.4％、DFlashを最大17.1％上回った。出典：arXiv","timestamp":1794592468000,"title":"MMFlash: Faster Speculative Decoding for Vision-Language Models","titleJa":"視覚言語モデルの推論を速くするMMFlash――視覚依存度に応じた投機的デコーディング","url":"https://arxiv.org/abs/2611.18482"},{"authors":["Disha Sheshanarayana","Sai Linisha Reddy Goli"],"categories":["cs.CL","cs.AI"],"field":"cs.CL","genre":"Agents / Robotics","monthKey":"2026-11","publishedAt":"2026-11-13T17:44:01Z","source":"arXiv","summaryHtml":"LLMによる検証者はエージェントの実行結果を評価するのに広く使われているが、その信頼性は通常、実行履歴の一つの見え方のもとでしか測られていない。実際のシステムでは、同じ実行がツールの合成や委任の境界、履歴の圧縮を経て異なる形で検証者に提示され、何が観察できるかが変わる。検証者の正しい判断がそうした抽象化の境界を越えて保たれるかは不明だった。<br><br>本研究は、抽象化による観察可能性の変化のもとでの判断の安定性を測る「検証輸送」という信頼性テストを提案する。同一の実行について、元の表示・抽象化した表示・復元した表示を揃え、課題や軌跡、結果、正解、評価基準、検証者を固定したうえで比較した。4つのベンチマーク、7つの検証モデル、4つの検証プロトコル、3つの抽象化境界での実験では、輸送の失敗が最大で約31％に達した。<br><br>検証プロトコルごとに失敗の仕方も異なり、直接検証は誤った判定を出しやすく、根拠に基づく検証や熟慮型は観察情報が乏しいと判断を控える傾向があった。実行の来歴を復元すると失敗の85.5％が回復した。元の表示での精度だけでは、抽象化を越えた検証者の信頼性は測れないと著者らは結論づけている。出典：arXiv","timestamp":1794591841000,"title":"Do Verifier Judgments Survive Abstraction? Measuring Verification Transport for LLM Agent Evaluation","titleJa":"検証者の判断は抽象化を越えて生き残るか――LLMエージェント評価の「検証輸送」を測る","url":"https://arxiv.org/abs/2611.18471"},{"authors":["Wang Ma","Debarun Bhattacharjya","Junkyu Lee","Nhan H Pham","Harsha Kokel","Qiang Ji"],"categories":["cs.LG","cs.AI"],"field":"cs.LG","genre":"LLM / NLP","monthKey":"2026-11","publishedAt":"2026-11-13T17:26:39Z","source":"arXiv","summaryHtml":"大規模言語モデル（LLM）を信頼して使うには、プロンプト自体の曖昧さに由来する不確実性と、モデルの知識不足に由来する不確実性を区別して測る必要がある。ベイズ手法や深層アンサンブルは原理的にはこの分解を与えられるが、LLMの規模では計算コストが高すぎ、ホワイトボックスでのアクセスも必要になる。一方、既存のブラックボックス手法は1つのスカラー値にまとめてしまい、この区別ができない。<br><br>本研究はこの隔たりを埋める2層アンサンブルを提案する。固定したプロンプトの確率的デコードを内側のアンサンブルとし、意味を保ったままプロンプトを摂動させたものを外側のアンサンブルとする。変動を連続的な埋め込み空間で測り、全共分散の法則によって偶然的不確実性と認識的不確実性へと正確に分解する。ブラックボックスでのサンプリングだけで済む。さらに有限標本バイアスの恒等式、ベイズ的な橋渡し、整合性だけの手法では検出できない失敗モードの分離という3つの理論的結果で枠組みを裏づけた。<br><br>5つの短答QAベンチマークと、2ファミリー・2規模にわたる4つの指示チューニング済みLLMでの評価では、強力なホワイトボックスのベースラインと競合し、同じ生成予算では主要なブラックボックス手法と誤りランキングで並びながら不確実性の分解も実現した。制御された介入実験では、2種の不確実性がプロンプトの曖昧さとモデルの知識不足という別々の失敗要因に選択的に反応した。長文の試験では請求レベルの事実性にも再学習なしで拡張できることを示した。出典：arXiv","timestamp":1794590799000,"title":"Black-Box Uncertainty Quantification for Large Language Models via Ensemble-of-Ensembles","titleJa":"ブラックボックスでも不確実性を測る――LLMの不確実性定量化","url":"https://arxiv.org/abs/2611.18453"},{"authors":["Run Luo","Kuan Zhang","Qi Deng","Yukun Chen","Zhihao Yang","Yufei Zhang","Renrong Hu","Yi Zhang","Guiyu Ma","Tianyu Fan","Longze Chen","Hao Sun","Jiaming Li","Jiaming Yang","Xiaohao Liu","Tao Tan","Minzheng Wang","Hangtian Jia","Shuai Yuan","Lvdi Wang","Xiao Liu","Chao Ma","Yuting Zou","Yinhe Zheng","Xiaobo Xia","Dawei Jiang","Shaoqing Ren"],"categories":["cs.CL","cs.AI","cs.CV"],"field":"cs.CL","genre":"Agents / Robotics","monthKey":"2026-11","publishedAt":"2026-11-13T16:39:30Z","source":"arXiv","summaryHtml":"複雑な対話環境で長期のタスクをこなす汎用エージェント「Gamer」を提案する。知覚、記憶管理、多段階の推論を一体化したエンドツーエンドのアーキテクチャで、従来の2Dグラフィカル・インターフェースと複雑な3Dシミュレーション世界の両方とやり取りできる。まず数万時間分のキーボード・マウス操作の軌跡で継続事前学習を行い、シミュレーション・ゲームと身体化環境の双方から環境のダイナミクスを学ばせた。<br><br>冗長な計算を減らしながら複雑な判断に必要な推論を保つ「スパース思考」による指示チューニングを施し、長期の対話向けに安定した多ターン強化学習で方策を訓練した。有限のコンテキストウィンドウ、蓄積するロールアウト誤差、疎な報酬という課題に対処している。リアルタイムの対話にはクラウド・エッジ推論エンジンを用い、多数のシミュレーション環境を並行して動かし、無制限のコンテキスト実行を支えながらオンライン推論の遅延を抑えた。<br><br>複数の難易度の高い3Dオープンワールド・ゲームで、熟練プレイヤーに匹敵する汎化性能と運用効率を示し、従来の2Dゲーム・ベンチマークでも競争力のある結果を出した。繰り返しのキーボード・マウス軌跡からでも、データと学習アルゴリズムのスケーリングで大きな性能向上が得られることを示唆する。デジタルと物理の両方の性質を持つ環境で複雑なスキルを着実に学ぶ、汎用エージェントへの道筋を提示する。出典：arXiv","timestamp":1794587970000,"title":"Gamer: A Generalist Vision-Language-Action Foundation Model for Long-Horizon Real-Time Game Agent","titleJa":"ゲームを極める汎用エージェント――視覚・言語・行動の基盤モデルGamer","url":"https://arxiv.org/abs/2611.18397"},{"authors":["Hoang Tran Vuong","Linh Ngo Van","Dang Nguyen","Thin Nguyen","Phuoc Nguyen","Mehrtash Harandi","Trung Le"],"categories":["cs.LG","cs.CL"],"field":"arXiv","genre":"LLM / NLP","monthKey":"2026-11","publishedAt":"2026-11-13T16:16:03Z","source":"arXiv","summaryHtml":"表形式データの異常検知は、数値・カテゴリ・テキストが混ざる不均質な特徴量のため、正常の意味のある表現を学ぶのが難しい。近年の研究は表の行をテキスト列として直列化し大規模言語モデルを適用してきたが、一度の教師ありファインチューニングに頼るため、正常の記述を締め上げる信号が限られていた。<br><br>本研究は、正常データへの理解を強める自己対局ファインチューニングの枠組みDiSPaTを提案する。fダイバージェンス最小化の理論に基づき、訓練目的と、実際の正常データとモデル生成サンプルの分布間ギャップの縮小とを結ぶ近似を導いた。各反復で現在のポリシーが疑似異常となる合成サンプルを生成し、批評家となる識別器がそれを実際の正常サンプルから区別することで、ポリシーを更新してモデル分布を真の正常データ分布へ近づける。<br><br>多様なベンチマークでの広範な実験により、DiSPaTは従来のLLMベース手法、深層学習手法、古典的な教師なし検知器を一貫して上回ることが示された。表形式データにおけるLLMの活用を、単発のファインチューニングから自己対局による分布整合へ進める成果である。出典：arXiv","timestamp":1794586563000,"title":"f-Divergence Self-Play for Tabular Anomaly Detection via Large Language Models","titleJa":"fダイバージェンス自己対局によるLLMの表形式異常検知――DiSPaT","url":"https://arxiv.org/abs/2611.18370"},{"authors":["Jiayu Feng"],"categories":["cs.CL"],"field":"cs.CL","genre":"LLM / NLP","monthKey":"2026-11","publishedAt":"2026-11-13T15:11:11Z","source":"arXiv","summaryHtml":"言語モデルの答えが正しいかどうかは、文脈によって変わることがある。同じ数値でも、管轄や日付、法的な定義によって正解にも誤答にもなる。本研究は、そうした文脈・時間依存の正しさと、誤りがどの規則に起因するかの帰属を統一的に扱う初の一般的枠組み「GT-FENG」を提案する。法や政策など規則で運営される領域を対象とする。<br><br>GT-FENGは、モデルの答えを適用される規則と照合し、誤答に一致する文書化された規則を特定する。複数の規則が同じ値を導く場合、答えだけではモデルがどの規則を使ったかは分からないことも示した。2つのモデルによるメディケイドの所得制限に関する回答では、問われた州自身の記録を示すことで、他の州の値にだけ一致する誤答が68〜78％減った。<br><br>さらに、安定した誤答の半数以上は2つ以上の文書化された情報源に一致していた。GT-FENGは、規則で運営される領域における言語モデルの評価や、今後のベンチマーク・評価ツールの基盤になる。オープンソースのPythonパッケージ「gtfeng」として公開されている。出典：arXiv","timestamp":1794582671000,"title":"GT-FENG: General Theory of Factual Evaluation and Normative Grounding in Language Models *Author(s)","titleJa":"言語モデルの「正しさ」は文脈で変わる――事実評価と規範的根拠づけの一般理論GT-FENG","url":"https://arxiv.org/abs/2611.18279"},{"authors":["Ibrahim Memon","Armin Karamzade","M. Hanif Jhaveri","Roy Fox"],"categories":["cs.CL","cs.AI","cs.DB","cs.LG"],"field":"Hugging Face Papers","genre":"Agents / Robotics","monthKey":"2026-11","publishedAt":"2026-11-13T05:44:08Z","source":"Hugging Face","summaryHtml":"ツールでデータベースを問い合わせる最先端LLMエージェントは最も正確なテキストtoSQLシステムの一つだが、ホスト型モデルへの問い合わせごとの呼び出しは遅く高コストで、組織の機微なクエリを外部APIに晒す。たとえばClaude Opus 5.5のエージェントが1日1万件のクエリを処理すると年間7万ドル以上かかる。組織が既に持つローカルハードウェアでこの負担をどこまで肩代わりできるかが問いである。<br><br>提案されたLuthorSQLは、遅いLLMエージェント（システム2）のための高速なシステム1の役割を果たす、非自己回帰の70億パラメータのテキストtoSQLモデルである。不確かな場合にのみ上位へ委譲する。1回のフォワードパスでクエリプランのスロットスコアを予測し、最大32件の候補プランをコンパイル・実行して、訓練済みの検証器で回答を選ぶ。<br><br>単体でBIRD隠しテストセットで実行精度68.03%、1問あたり0.84秒（単一GPU）を達成し、8ビット量子化で9GBでも精度を維持、SnowflakeやBigQueryなどへのゼロショット転送も可能だった。Claude Opus 5.5との事前登録済みの信頼度カスケードでは、227問のうちほぼ半数をローカルで回答し、同じ精度でAPIコストを33.3%削減した。出典：Hugging Face","timestamp":1794548648000,"title":"LuthorSQL: A One-Pass Text-to-SQL Model as System 1 for a Slower LLM Agent","titleJa":"LuthorSQL――遅いLLMエージェントのための高速テキストtoSQLモデル","url":"https://huggingface.co/papers/2611.17780"},{"authors":["Irma Irayanti","Muhammad Dzaky Asrun","Salfira Az Zahra"],"categories":[],"field":"Journal of Applied Research in Higher Education","genre":"Ethics / Safety","monthKey":"2026-11","publishedAt":"2026-11-13T00:00:00Z","source":"Crossref","summaryHtml":"インドネシアのイスラーム大学で、持続可能性を環境管理や技術的な課題としてではなく、市民としての責任や公共の倫理、道徳的リーダーシップの問題としてどう位置づけ、実践しているかを調べた研究である。生態学的市民性、エコ神学にもとづく公共倫理、持続可能性を志向する学びが、大学のなかでどのように交渉されているかを問う。<br><br>2026年2月から5月にかけて、同大学で半構造化インタビュー、文書分析、限定的な授業観察を実施した。教員、持続可能性・教育の専門家、市民・持続可能性学習に関わる学部生ら18人が参加し、反射的テーマ分析で検討した。結果は三つの主題に整理された。第一に、持続可能性は環境管理ではなく、市民性や社会正義、集合的な説明責任と結びついた倫理的・公共的な責任として解釈されていた。第二に、対話的で参加型の学びを通じて、生態学的市民性とエコ神学の視点が教育的に意味を持ち、持続可能性志向の教授法の革新として機能していた。第三に、カリキュラムへの統合が断片的で制度的な制約や象徴的な取り組みにとどまり、大学内の変革はまだら模様だった。<br><br>著者らは、持続可能性の学びを強めるには、生態学的な問題を各科目の学習成果と結びつけ、地元の事例や構造化された議論、参加型の課題でエコ神学的な責任と市民的判断をつなぐことが有効だと示唆する。環境への配慮を宗教的な責任と公共の関心の両方として語る学びが、学生に社会正義や集合的責任とともに生態問題を考える機会を与えた。ただし一大学・18人という質的研究であり、授業での議論が持続的な市民参加につながるかは未検証だとする。技術中心の持続可能性の枠組みに、道徳的・公共的な視点を対置する論考である。","timestamp":1794528000000,"title":"Reimagining higher education through ecological citizenship and eco-theology: sustainability, public ethics and moral leadership in an Indonesian Islamic university","titleJa":"生態学的市民性とエコ神学で高等教育を再考する――インドネシアのイスラーム大学における持続可能性と公共倫理","url":"https://doi.org/10.1108/jarhe-05-2026-0886"},{"authors":["Bart A. Ellenbroek","Beth Naylor","Jiun Youn"],"categories":[],"field":"Behavioural Pharmacology","genre":"Psychedelics / Trauma","monthKey":"2026-11","publishedAt":"2026-11-13T00:00:00Z","source":"Crossref","summaryHtml":"シロシビンの治療効果は、急性の薬理作用そのものではなく神経可塑性の増強によると考えられているが、その根本的な仕組みは十分に解明されていない。本研究は、再生能力で知られる扁形動物プラナリアをモデルに、シロシビンが連合学習を高めるかどうかを条件性場所嗜好パラダイムで検証した。<br><br>5µMのシロシビンに1回曝露した後、光とショ糖を組み合わせる条件づけを5日間行ったところ、シロシビン投与群は対照群より光への嗜好の変化が有意に大きく、その効果は投与から少なくとも6日間持続した。無脊椎動物でもシロシビンが報酬連合学習を高めることが示された。<br><br>著者らは、サイケデリックによる神経可塑性が進化的に保存されたセロトニン作動性の仕組みを通じて働くという仮説を支持すると結論づける。プラナリアは神経系が単純でありながらセロトニン系を備えるため、薬物の学習への作用を切り分けて調べるモデルとして有用だとされる。ただしプラナリアという単純なモデルでの結果であり、ヒトの治療効果へ直接外挿するには注意が必要だとする。ヒトの臨床効果の神経基盤を考えるうえでの基礎的な知見である。","timestamp":1794528000000,"title":"Psilocybin enhances conditioned place preference learning in planarians","titleJa":"シロシビンがプラナリアの場所―報酬連合学習を高める――神経可塑性の進化的保存性を示す実験","url":"https://doi.org/10.1097/fbp.0000000000000903"},{"authors":["David Porter"],"categories":[],"field":"Frontiers in Psychology","genre":"Consciousness / Philosophy","monthKey":"2026-11","publishedAt":"2026-11-13T00:00:00Z","source":"Crossref","summaryHtml":"人間の意識はつねに逆説のなかにある。統一と分裂、自己と世界、意味と死を同時に意識すること――それが意識の常態であるにもかかわらず、心理学は逆説を存在の構造ではなく認知の葛藤として扱ってきた。本論文は「単一の二重性モデル(SDM)」を提唱し、意識を統合と分化のあいだで振動する自己反省的な場として捉え直す。不安、アイデンティティ、意味、超越といった心理現象はすべて、全体性と分離のあいだの再帰的な動きから生まれるという。<br><br>このモデルを臨床に翻訳したのが「逆説療法(PT)」である。相反する体験を解決も抑圧もせず、意識的に抱え込む「逆説の居住」を中心に据える。SDMは哲学・神学・心理療法における逆説の文献のなかに位置づけられ、ユングの超越機能やリネハンの弁証法的統合といった既存モデルと対比される。逆説を治療の障害ではなく、体験の存在論的な核心として捉え直す点が新しい。<br><br>SDMとPTは、人間の発達、苦しみ、変容を理解するための統一的な言語を提供する。理論心理学、実存的現象学、意識研究のあいだに橋を架け、21世紀の意味づけのための枠組みを更新しようとする試みである。逆説を解消すべき問題ではなく、意識そのものの働きとして受け止める視点は、不安やアイデンティティの揺らぎを理解する手がかりになるだろう。出典：Crossref","timestamp":1794528000000,"title":"The singular duality model: paradox, consciousness, and the foundations of psychological integration","titleJa":"単一の二重性モデル――逆説、意識、そして心理的統合の基盤","url":"https://doi.org/10.3389/fpsyg.2026.1737145"},{"authors":["Henry Pollard"],"categories":[],"field":"Frontiers in Research Metrics and Analytics","genre":"Ethics / Safety","monthKey":"2026-11","publishedAt":"2026-11-13T00:00:00Z","source":"Crossref","summaryHtml":"AIは研究の連絡・支援の域を越え、結果を左右する研究機能そのものを担い始めている。だがガバナンスは、利用後の開示に注目しがちで、委譲するかどうかの事前の判断には目が向いていない。本論文は、定義された研究機能をAIに委ねるべきか、いつ、どのような統制の下で委ねるかを事前に判断するための「12の関門」からなる委譲・リスク管理枠組みを提案する。<br><br>枠組みはAI・機能・文脈の具体的な組み合わせを評価し、目的、許可、課題の定義を、固有のリスク、課題固有の妥当性、信頼性、人間の統制、統制の有効性、残余リスク、出所、報告、説明責任へと結びつける。中心的な区別は「支援」と「委譲」である。委譲とは、AIが本来は独立した人間の判断を要する機能を果たすか、重大な研究判断を実質的に決定する場合を指す。<br><br>委譲そのものをガバナンスの判断として扱い、証拠と統制をリスクに見合ったものにする姿勢は、提案評価や機関ガバナンス、監視設計といった既存の枠組みを補う。AI研究ノートによる出所の記録や、AIによる誤り監視と外部検証の区別も具体化した。研究者、機関、編集者、ガバナンス機関がどこまで任せてよいかを決める実践的な指針になる。出典：Crossref","timestamp":1794528000000,"title":"Delegating research functions to artificial intelligence: a risk-control framework for validation, human control and accountability","titleJa":"研究機能のAIへの委譲――検証・人間の統制・説明責任のためのリスク管理枠組み","url":"https://doi.org/10.3389/frma.2026.1994953"},{"authors":["Alexander Maier"],"categories":[],"field":"OSF Preprints","genre":"Consciousness / Philosophy","monthKey":"2026-11","publishedAt":"2026-11-13T00:00:00Z","source":"Crossref","summaryHtml":"意識の神経科学の最終的な目標は、意識体験（クオリア）とそれを支える脳状態の関係を導き出すことだ。意識の神経相関（NCC）を特定することや、意識体験の構造を記述することだけでは足りず、特定の神経状態や神経メカニズムと特定の意識体験を結びつける必要がある。科学における二つの現象の関係づけは、しばしば数式のような数学的写像の形をとる。本論文は、意識状態と脳状態の間にも同じような写像が存在しうるという展望のもと、関連する実証研究を整理する。<br><br>レビューはまず、神経のスパイク活動を意識内容へ写像する研究を概観する。意識の「橋渡し地点」としてのNCCを探す先駆的なパラダイムと、心理測定関数と神経測定関数を結びつける「橋渡し法則」を探すパラダイムを対比する。さらに、意識体験の構造記述と神経活動の構造記述を写像によって結ぶ試みが、両方のパラダイムをどのように補強するかを検討する。<br><br>意識研究を「相関の発見」から「法則の定式化」へ進めるための枠組みを提示するもので、クオリアと脳状態の対応関係を数学的に記述する道筋を示している。出典：Crossref","timestamp":1794528000000,"title":"Mathematical Relationships Between Brains and Consciousness","titleJa":"脳と意識の数学的関係――クオリアと脳状態を結ぶ写像を求めて","url":"https://doi.org/10.31234/osf.io/k46ad"},{"authors":["Najma Cherrad","Georgios Foustoukos","Laura MJ Fernandez","Alejandro Osorio-Forero","Julie Buron","Nadine Eliasson","Yann Emmenegger","Paola Milanese","João Pedro Ferreira Morais","Virginie Mansuy-Aubert","Paul Franken","Anita Lüthi"],"categories":[],"field":"Nature Communications","genre":"Neuroscience","monthKey":"2026-11","publishedAt":"2026-11-13T00:00:00Z","source":"Nature Communications","summaryHtml":"副交感神経の活動は回復的な睡眠に欠かせないが、迷走神経の感覚性求心路が睡眠と覚醒の脳・身体相関をどう形づくるかは未解明だった。本研究はマウスで迷走神経感覚ニューロン（VSN）を化学遺伝学的に刺激し、脳波・筋電図、心拍数、脳・身体温、ノルアドレナリン作動性の青斑核（LC）ニューロン集団の活動を同時に計測した。<br><br>休息期のVSN刺激は、徐波（0.75〜4 Hz）成分に富み恒常性に制御されたノンレム睡眠様状態を誘発し、レム睡眠を抑制した。同時に脳・身体温は低下したのに、LC活動は上昇した。外部から温めると正常なノンレム・レム睡眠サイクルへの回復が加速し、体温低下が重要な寄与因子であることが分かった。<br><br>睡眠様の脳波・徐脈・体温低下と、覚醒を促す前脳へのノルアドレナリン調節が共存するという、従来は両立しないとされた睡眠と覚醒の特徴が一つの状態に現れることを示した。睡眠と覚醒を分ける境界が末梢からの信号によって揺らぐことを示し、意識状態の制御における身体からの入力の重要性を裏づける成果である。出典：Nature Communications","timestamp":1794528000000,"title":"Vagal afferent activation induces a dissociated NREM sleep-like state with wake-related locus coeruleus activity","titleJa":"迷走神経の活性化がもたらす解離したノンレム睡眠様状態――眠りながら覚醒する脳","url":"https://www.nature.com/articles/s41467-026-79135-y"},{"authors":["Gaetano Rametta"],"categories":[],"field":"Nóema","genre":"Consciousness / Philosophy","monthKey":"2026-11","publishedAt":"2026-11-13T00:00:00Z","source":"Crossref","summaryHtml":"意識と意味（センス）の関係は、ドゥルーズの超越論的哲学における中心問題の一つである。『意味の論理学』を手がかりに、特異性・意味・出来事の概念が、非人称的で前個体的な超越論的場の基盤として検討される。フッサールの現象学と、サルトル『自我の超越』における意識論との対話を通じて、この構想が問い直される。論文は、超越論的な場を自我の座ではなく、意味と出来事の生成の場として捉え直す。<br><br>ドゥルーズの読みでは、意識への訴えはつねに超越論的自我の存在を前提するとされる。だが本論文は、フッサールの『論理学研究』第5研究と若きサルトルの再読により、意識を自我とは別のものとしてではなく、自己組織化する非人称的な場として考える道を開く。自我なき意識という構想である。<br><br>そこから浮かび上がるのは、内在の原理を捨てることなく意識を位置づける、超越論的場の別の構想である。意識を主観の所有物ではなく、出来事と意味が織りなす場そのものとして捉え直す試みであり、心の哲学と現象学の接点に重要な新たな視点を与える。出典：Crossref","timestamp":1794528000000,"title":"Between Consciousness and Sense","titleJa":"意識と意味のあいだ――ドゥルーズの超越論的場を問い直す","url":"https://doi.org/10.54103/2239-5474/32766"},{"authors":["Lana K. Porter","Ece Kaya","Kamlesh Chalise","Janina Klarmann","Armin Goffin","Muad Abd El Hay"],"categories":[],"field":"bioRxiv","genre":"Psychedelics / Trauma","monthKey":"2026-11","publishedAt":"2026-11-13T00:00:00Z","source":"bioRxiv","summaryHtml":"過呼吸を伴う呼吸法（HVB）は、薬物を使わずにサイケデリクス体験に似た変性意識状態を引き起こすことが知られている。だがセッション中の神経活動と主観体験がどう連動するのかは未解明だった。呼吸だけで薬物に匹敵する意識変容が起きる仕組みは、長く謎のままだった。本研究は経験豊富な実践者25名を対象に、自然なHVBセッションの合間に安静時記録を挟み、64チャンネルEEGと体験の深さ・内容を追跡した。<br><br>その結果、HVBが引き起こす神経動態は古典的サイケデリクス状態の最も頑健な神経署名をなぞることが分かった。時間構造のゆるみ――広帯域の皮質脱同期、信号複雑性の増加、アルファ波（8〜13Hz）パワーの低下――と、空間構造の再編――皮質処理階層の平坦化――である。これらの効果は分単位の解像度で主観的な体験の深さと直接相関した。<br><br>音楽聴取や能動的内受容といったHVBの個別要素だけでは説明できないことも示された。薬物によらない経路でもサイケデリクス的な皮質状態に到達できること、誘導法を問わず共通する変性意識状態の神経的特徴が存在することが示唆される。出典：bioRxiv","timestamp":1794528000000,"title":"Neural and Experiential Dynamics of High-Ventilation Breathwork Mirror Psychedelic States","titleJa":"高換気呼吸法の神経・体験ダイナミクスはサイケデリクス状態を映し出す","url":"https://www.biorxiv.org/content/10.64898/2026.11.11.765965"},{"authors":["Xin Cheng","Meiqi Song","Hu Zhao","Xiaojing Ye"],"categories":[],"field":"Legal Medicine Research","genre":"Psychedelics / Trauma","monthKey":"2026-11","publishedAt":"2026-11-13T00:00:00Z","source":"Crossref","summaryHtml":"トラウマに関する語りは、出来事の感情的な意味や中心的な意義を伝えながらも、いつ・どこで・どのように起きたかという具体的な詳細を欠くことがある。本総説は「記憶の般化」という概念を手がかりに、このばらつきを解釈するための神経認知的な枠組みを法精神医学的評価に向けて提示する。<br><br>海馬のパターン分離とパターン完成、前頭前野と扁桃体・分界条床核との相互作用、記憶アンサンブル間の重なりや脅威への反応を形づくる細胞・分子レベルの過程に関する知見を統合する。さらにトラウマ関連の精神病理、反復体験、遅延や繰り返しの想起、事後情報が、自伝的記憶の特異性やエピソードの区別、情報源の帰属にどう影響するかを検討する。<br><br>自伝的想起や記憶弁別、恐怖の般化、情報源記憶を測る行動課題は、これらの過程を相補的に調べる手段になる。機能的画像や電気生理、分子レベルの指標も手がかりになるが、集団レベルの知見だけでは個人の語りの正確さを断定できない。法実務への応用には信頼できる課題や規範データ、誤差率の把握が不可欠だと結論づけている。出典：Crossref","timestamp":1794528000000,"title":"Memory generalization: neural mechanisms and implications for trauma-related accounts in forensic psychiatry","titleJa":"記憶の般化――トラウマの語りのばらつきを読み解く神経認知の枠組み","url":"https://doi.org/10.20517/lmr.2026.12"},{"authors":["Vuyisile Msila"],"categories":[],"field":"The International Journal of Interdisciplinary Civic and Political Studies","genre":"Consciousness / Philosophy","monthKey":"2026-11","publishedAt":"2026-11-13T00:00:00Z","source":"Crossref","summaryHtml":"1973年のダーバン・ストライキは「ダーバン・モーメント」とも呼ばれ、南アフリカの政治地図を大きく塗り替えた労働不安の高まりだった。アパルトヘイト体制下でアフリカ人労働者が労働条件の改善を勝ち取ったことが最大の意義であり、政府は自発的で無統制な紛争の連鎖と見なして動揺した。本稿はその思想的意義をいま問い直す。<br><br>ストライキは職場の不満を超え、やがてアパルトヘイトへの政治闘争と結びついた。一見自発的に見えたが、組織化されていない労働者たちは集団的な決意で構造的不正義に挑んだ。本論文は、ブラック・コンシャスネス運動（BCM）の思想的影響と組織的な推進力がなければ、黒人労働者は広範な社会・経済闘争へ効果的に動員されなかっただろうと論じる。<br><br>ブラック・コンシャスネス哲学は労働者の連帯と地域の動員を鼓舞するうえで決定的な役割を果たした。労働運動は職場の要求を超え、社会変革の触媒になりうる。ダーバン・ストライキは解放闘争における抵抗と成功の新たな現場を示し、政治的動員と産業的動員が不可分であることを浮き彫りにした。出典：Crossref","timestamp":1794528000000,"title":"The Role of Black Consciousness Philosophy in the 1973 Durban Strikes","titleJa":"ブラック・コンシャスネス哲学と1973年ダーバン・ストライキの役割","url":"https://doi.org/10.18848/2327-0071/cgp/a175"},{"authors":["Mélody Boudilmi","Lauriane Landais","Tamara Guenoun","Barbara Smaniotto","Svetoslava Urgese","Aziz Essadek"],"categories":[],"field":"Trauma, Violence, & Abuse","genre":"Psychedelics / Trauma","monthKey":"2026-11","publishedAt":"2026-11-13T00:00:00Z","source":"Crossref","summaryHtml":"消防士や警察官、救急隊員らファーストレスポンダーは、直接・間接にトラウマへ繰り返しさらされる。しかしその影響を指す言葉――二次的外傷性ストレス、代理トラウマ、共感疲労、心的外傷後ストレス障害――は現場でも研究でも混同されがちだった。本レビューはPsycINFO、PubMed、Web of Scienceなど6つのデータベースを2026年1月まで調べ、PRISMAの指針に沿って76件の査読付き研究を抽出し、これらの概念の整理を試みた。2人の研究者が抽出と質の評価を担った。<br><br>分析の結果、概念の境界は症状の重なりや、他の職種向けに作られた測定道具の限界によって曖昧に保たれていることが分かった。トラウマの発生には、さらされる出来事の性質や累積的な負担、個人の経験や職務上の役割に加え、組織的な制約が中心的な役割を果たすことも示された。曝露のあり方を切り分けて考えることの重要性が浮かび上がる。<br><br>著者らは、ファーストレスポンダーのトラウマ曝露を公衆衛生の問題として捉えるべきだと結論づける。言葉の整理は、支援や予防の設計の出発点になるという指摘である。出典：Crossref","timestamp":1794528000000,"title":"Toward a Definition and Differentiation of Secondary Traumatic Stress, Vicarious Trauma, Post-Traumatic Stress, and Compassion Fatigue in Relation to First Responders: An Integrative Literature Review","titleJa":"二次的外傷性ストレスと共感疲労――消防・警察・救急の現場で言葉を整理する","url":"https://doi.org/10.1177/15248380261476699"},{"authors":["Ashraf Fatehi Al-Rai","Ahmed Ibrahim Hassan","Mohamad Albakjaj","Maya Khater"],"categories":[],"field":"Interpersona An International Journal on Personal Relationships","genre":"Ethics / Safety","monthKey":"2026-11","publishedAt":"2026-11-13T00:00:00Z","source":"Crossref","summaryHtml":"人工知能は脱税の手口にも、税務行政の側にも影響を及ぼし始めている。本研究はAI技術と脱税の関係を調べ、脱税の多様な形態、関連する法制度と経済的影響、そして新興デジタル技術がもたらす規制上の課題を検討する。個人や組織が高度なAIシステムを使って脱税を容易にしたり実行したりする能力が高まっていることが問題の出発点である。<br><br>研究は記述的・分析的手法と批判的法学アプローチを用い、AIが脱税にどう関わるかを包括的に把握しようとした。分析の結果、AIはデータ分析や不正検出、自動監査、コンプライアンス監視を通じて税務管理の効率を高めうる一方で、高度な脱税スキームの構築にも使われ、歳入減少や財政赤字、投資の縮小、所得格差の拡大につながりうることが示された。<br><br>著者らは、政府がデジタル時代に対応して税法を更新し、データを保護し、人材を育成し、AIを活用した税務プラットフォームを導入して持続可能で効果的な税務ガバナンスを支えるべきだと提言する。AIによる脱税は従来型の脱税の技術的変形ではなく、帰属やデジタル証拠、データガバナンス、人の監督をめぐる規制課題だと位置づけられる。出典：Crossref","timestamp":1794528000000,"title":"Artificial Intelligence and tax evasion: legal and economic challenges in the digital era","titleJa":"AIと脱税――デジタル時代の法的・経済的課題","url":"https://doi.org/10.54899/iij.v20i4.1392"},{"authors":["Ishika K. Kanakath"],"categories":[],"field":"Frontiers in Neuroscience","genre":"Neuroscience","monthKey":"2026-11","publishedAt":"2026-11-13T00:00:00Z","source":"Frontiers in Neuroscience","summaryHtml":"筋電・神経義肢は実験室では成功しても、日常の臨床利用ではしばしば失敗する。この翻訳の溝はドメインシフトが原因で、神経可塑性や運動学習、筋疲労、電極のずれによって生体信号が非定常になることが背景にある。本レビューは、ドメインシフトの神経生理学的・技術的な起源を総合し、それに対応するアルゴリズム戦略を評価する。<br><br>ドメインシフトは、セッション間のドリフトや解剖学的な個人差など、生物学的過程と技術的過程が結びついて生じる。対策として、閉ループのデコーダ適応、適応フィルタ、アンサンブルモデリング、強化学習、転移学習などがあり、それぞれ適応速度とシステム安定性のバランスが異なる。とりわけ重要なのは、デコーダの更新が進行中の神経・運動可塑性と直接やり取りする「共適応システム」である。<br><br>利用者を受動的な信号源とみなすと長期的な制御は限られる。利用者を能動的な学習パートナーとみなすことが必要だ。複数の適応戦略を、生物学的な時間尺度を尊重する翻訳神経工学の枠組みに統合することで、義肢の長期的な放棄を減らし、臨床で使える頑健な支援神経技術へつながると結論づける。出典：Frontiers in Neuroscience","timestamp":1794528000000,"title":"Co-adaptive learning and domain adaptation bridge the translational gap in neuroprosthetic control: a review","titleJa":"神経義肢の臨床応用へ――共適応学習とドメイン適応のレビュー","url":"https://www.frontiersin.org/articles/10.3389/fnins.2026.1974861"},{"authors":["Bhargavi Anumula","Anil V. Turukmane"],"categories":[],"field":"Frontiers in Artificial Intelligence","genre":"Ethics / Safety","monthKey":"2026-11","publishedAt":"2026-11-13T00:00:00Z","source":"Frontiers in Artificial Intelligence","summaryHtml":"音声ディープフェイクは音声認証や音声システムのセキュリティ上の脅威になっている。本論文は、感情の手がかりを組み込んだ深層学習フレームワーク「Enhanced FusionNet」を提案する。Log-Melの音響表現にMultiScaleCNN、双方向LSTM、マルチヘッドクロスアテンション、残差特徴融合、適応ゲート融合を組み合わせ、真正音声と合成音声を識別する。<br><br>感情表現はRAVDESSデータセットから話者非依存のエンコーダで別途学習し、FoRデータセットによる検出に転移させた。独立したホールドアウト試験では精度98.67％、ROC-AUC 99.88％を達成し、5分割交差検証でも平均精度99.08±0.35％と高い安定性を示した。アブレーションにより各構成要素の寄与も確認されている。<br><br>ただし感情表現の転移は補完的な情報を与えたものの、評価プロトコル下では全体の検出性能をさらに押し上げなかった。著者らはベンチマーク条件での有効性を示しつつ、感情の手がかりが常に上積みになるわけではない点も率直に報告している。音声ディープフェイク対策の設計指針となる成果である。出典：Frontiers in Artificial Intelligence","timestamp":1794528000000,"title":"Enhanced FusionNet: a deep learning structure for multimodal input-based emotion-aware deepfake speech identification","titleJa":"感情の手がかりで音声ディープフェイクを見破る――Enhanced FusionNet","url":"https://www.frontiersin.org/articles/10.3389/frai.2026.1978052"},{"authors":["Xilong Wang","Xiaoxing Chen","Neil Gong"],"categories":["cs.CR","cs.AI","cs.CL"],"field":"cs.CR","genre":"Agents / Robotics","monthKey":"2026-11","publishedAt":"2026-11-13T00:00:00Z","source":"arXiv","summaryHtml":"複数のエージェントが課題を分割し、それぞれの応答を集約して解くマルチエージェントシステムでは、一部のエージェントが悪意ある応答を返すことで最終的な解を操作できてしまう。本論文はこの脅威を「応答操作攻撃（ReMA）」として定式化した。標的あり・なしの攻撃を最適化問題として扱い、代理のマルチエージェントシステムからのフィードバックをもとに悪意ある応答を反復的に磨き上げることで、攻撃効果を最大化する手法を示している。<br><br>防御として、エージェントの応答間の意味的な類似性を手がかりに、十分に多くの他の応答と一致する応答を選ぶ安全な集約ルール「SecMAS」を提案した。標的あり・なしの攻撃に対する理論的な安全性保証も与えている。評価では既存の集約ルールがReMAに対して脆弱だったのに対し、SecMASは評価したすべての攻撃を防御できた。<br><br>エージェント同士の協調が前提のシステムでは、個々のエージェントの正しさだけでなく、集約の仕組みそのものの頑健性が安全性を決める。本研究は攻撃と防御をセットで示すことで、設計段階から安全性を組み込む方向性を提示している。出典：arXiv","timestamp":1794528000000,"title":"Securing Multi-Agent Systems by Design","titleJa":"マルチエージェントの協調を壊す応答操作攻撃――防御集約ルールSecMASの提案","url":"https://arxiv.org/abs/2611.17883"},{"authors":["Mike He","Ankush Desai","Sharad Malik","Aarti Gupta"],"categories":["cs.AI","cs.SE"],"field":"cs.AI","genre":"Ethics / Safety","monthKey":"2026-11","publishedAt":"2026-11-13T00:00:00Z","source":"arXiv","summaryHtml":"複数ステップのツール呼び出しを行うLLMエージェントには、利用者の課題を達成する有用性と、領域のポリシーや正しさの制約を守る安全性の両方が求められる。有用性を優先すれば危険な操作を見逃し、安全性を優先すれば課題が途中で止まる。危険な操作を止めれば違反は防げるが、エージェントは先へ進めず立ち往生してしまう。従来の手法はどちらか一方を犠牲にしてきた。<br><br>本論文が提案するSoteriaは、検証済みの階層的計画と実行時の強制を組み合わせてこの緊張を解消する。実行前にエージェントが生成した構造化された計画を仕様に対して形式的に検証し、ツール呼び出しの前に適合を確認する。実行中は検証済みの計画が仕様に沿った軌跡を保証するとともに、危険な操作が止められたときの回復の指針にもなる。<br><br>多様なツール利用タスクのベンチマークで、Soteriaは最良のベースラインと比べて平均タスク成功率が1.7倍となり、ポリシー違反はゼロだった。安全性と有用性はトレードオフにしなくてよく、検証済みの計画が現場でも機能することを示す結果である。出典：arXiv","timestamp":1794528000000,"title":"Soteria: Formally Verified Planning with Runtime Enforcement for Safe LLM Agents","titleJa":"安全性と有用性を両立するLLMエージェント――形式検証された計画と実行時強制のSoteria","url":"https://arxiv.org/abs/2611.17880"},{"authors":["Tiantong Wang","Zhiren Gong","Yixin Wang","Tiantong Wu","Wei Yang Bryan Lim"],"categories":["cs.LG","cs.AI"],"field":"cs.LG","genre":"LLM / NLP","monthKey":"2026-11","publishedAt":"2026-11-13T00:00:00Z","source":"arXiv","summaryHtml":"Mixture-of-Expertsモデルは、層や計算ステップをまたいでエキスパートを共有することで、さまざまな文脈から学習情報を集約できる。各ステップでの局所的な予測誤差は下がるが、多段階システムが評価されるのは最終出力である。局所的な改善が最後まで生き残るのはいつなのかを本論文は理論的に問う。<br><br>指定された線形回帰モデルにおいて、分散の削減と共有によるバイアスを天秤にかけ、共有と統合の正確な基準を導出した。共通の固定された線形伝播写像のもとでは、最終出力の期待二乗リスクを特徴づけ、共有が平均の局所誤差を下げながら最終出力の誤差を増やす場合があることを示した。等方性ノイズのもとでの直交する完全なプールは、局所的な改善をすべて最終出力に保つことも分かった。<br><br>一般のルーティング計算については、分布シフトや周囲の誤差、エキスパート選択の変化を織り込んだ端から端までの誤差の上限を導出している。正しい予測とルートのラベルだけでは、個々のエキスパートが帰属された操作を実装していることの証拠にはならないという指摘も含む。出典：arXiv","timestamp":1794528000000,"title":"From Local Prediction Error to Final Outputs: A Theory of Expert Sharing in Multi-Step Reasoning","titleJa":"局所的な誤差の改善は最終出力に届くか――エキスパート共有の理論","url":"https://arxiv.org/abs/2611.17879"},{"authors":["Siddarth Srinivasan","Morgan Jane Matthews","Jascha Sohl-Dickstein","Erik Jones"],"categories":["cs.AI"],"field":"cs.AI","genre":"Ethics / Safety","monthKey":"2026-11","publishedAt":"2026-11-13T00:00:00Z","source":"arXiv","summaryHtml":"個々のLLMエージェントに対するアライメント訓練は、複数エージェントのチームではうまく機能しないことがある。本論文はその仕組みを調べ、チームでもアライメントを維持する介入を探った。敗血症トリアージとニュース推薦という2つのソフトウェア工学タスクと、10件のコンサルティング提案書作成タスクを用いている。<br><br>4つの知見が示された。単体とチームの安全ギャップはモデルの能力と明確な関係がなく、AnthropicのMythos Previewはあるタスクで最大のギャップを示し、別のタスクでは最小だった。互いの批判やグループチャットでの調整といった自然な介入は、チームを単体のふるまいに確実に戻せない。責任の分散がギャップの大きな要因で、チーム内のエージェントはシステム全体の安全上の失敗を積極的に確認しなくなり、問題を無視・合理化・転嫁しやすくなる。<br><br>一方で、システム全体の安全を担う専任の安全責任エージェントを置くことと、調整役のエージェントが安全仕様書を公開することは、単体のアライメントを取り戻すのに有効だった。研究チームはマルチエージェントの実験枠組みmagelabも公開している。出典：arXiv","timestamp":1794528000000,"title":"Aligning AI Teams","titleJa":"AIチームのアライメントはなぜ崩れるか――責任分散がもたらす安全ギャップ","url":"https://arxiv.org/abs/2611.17820"},{"authors":["Lihuan Li","Ruiyi Yang","Jiru Wang","Yifan Duan","Xiachong Lin","Hao Xue","Yang Song","Flora Salim"],"categories":["cs.CL","cs.AI"],"field":"cs.CL","genre":"Agents / Robotics","monthKey":"2026-11","publishedAt":"2026-11-13T00:00:00Z","source":"arXiv","summaryHtml":"長期にわたるLLMエージェントはツールやアプリを連携させて複雑な多段階タスクをこなすが、対話履歴が伸びるほど文脈の管理が信頼性と効率を左右する。要約や剪定、履歴選択で文脈を短くする方法はあるが、短い文脈が良い判断につながるとは限らない。要約は後で必要な細部を落とし、履歴の丸ごと保持は無関係な情報を大量に含む。<br><br>本論文が提案するCarryOnは、コンパクトな実行状態と、出典に紐づいた細粒度の証拠を組み合わせる軽量な文脈マネージャーである。学習済みの選択器と適応的な保持ポリシーが、文脈管理のための追加のLLM呼び出しなしに関連する証拠を手元に残す。評価指標として、資源利用を加味したタスク成功度S_αと、成功あたりの正規化コストNCSの2つも導入した。<br><br>AppWorld、OfficeBench、Tau2 Telecomの3ベンチマークで3種のLLMアクターを用いた評価では、CarryOnはマクロ平均タスク成功率75.7%を達成し、最強のベースラインを6.7ポイント上回った。2つの指標でも平均で最良の成績だった。出典：arXiv","timestamp":1794528000000,"title":"CarryOn: Learning What to Keep in Context for Long-Horizon LLM Agents","titleJa":"長期タスクのエージェントは何を文脈に残すか――軽量な文脈管理CarryOn","url":"https://arxiv.org/abs/2611.17808"},{"authors":["Grid Robotics","Qingfeng Lan","Duo Li","Siyao Li","Yiheng Lyu","Shijian Lu","Zhenghao Qi","Shizun Wang","Xinchao Wang","Ming Yang","Zhiqin Yang","Zuhao Yang","Tao Yu"],"categories":["cs.RO"],"field":"cs.RO","genre":"Agents / Robotics","monthKey":"2026-11","publishedAt":"2026-11-13T00:00:00Z","source":"arXiv","summaryHtml":"GPT-6 Astraの登場により、フロンティアモデルにエージェント的ハーネスを組み合わせたシステムが、多くの身体化ベンチマークでタスク専用ポリシーに匹敵し、ときに凌駕するようになった。タスクの種類ごとに専用ポリシーを訓練するのではなく、基盤モデルを実世界の身体化タスクへ直接適用するのがエージェント型ロボティクスである。環境を観測し、利用者の意図を解釈し、課題を推論し、スキルとツールを呼び出し、結果を検証して戦略を適応させる閉ループで動く。<br><br>だがこの新しいパラダイムには、共有された定義も、信頼できる評価枠組みも、研究のロードマップもまだない。著者らは、基盤モデルと身体化ハーネスからなる「Embodied System 2」こそがエージェント型ロボティクスの意思決定の中核だと主張する。中心の課題は、汎用的な推論を、反応時間の制限、機械的な限界、予測不能な環境変化、不可逆な結果といった物理的制約のもとで、効果的かつ検証可能な行動へ翻訳することだ。モデルそのものの能力と、閉ループのシステム性能の両方を測る評価枠組みを提案する。<br><br>さらにデジタルから物理のエージェントへ引き継がれる原則と、信頼できる物理的自律の実現に向けて対処すべき課題を特定したうえで、個別のプリミティブの実行から常駐的な役割の遂行へと、責任範囲を広げながら安全で信頼できる持続的自律をめざす研究ロードマップを描く。身体をもつAIの設計図を整理した展望論文である。出典：arXiv","timestamp":1794528000000,"title":"Envisioning Agentic Robotics: A New Era of Robotic Systems","titleJa":"エージェント型ロボティクスの到来――基盤モデルが身体を動かす新時代","url":"https://arxiv.org/abs/2611.18359"},{"authors":["Jonathan D. McCart","Pranav I. Deevi","Mehdi Azabou","Nanda H. Krishna","Caleb A. McKinney","Nicholas S. Card","Sergey D. Stavisky","Chethan Pandarinath"],"categories":["q-bio.NC","cs.LG"],"field":"q-bio.NC","genre":"Neuroscience","monthKey":"2026-11","publishedAt":"2026-11-13T00:00:00Z","source":"arXiv","summaryHtml":"話す能力を失った人のための音声神経補綴は、脳活動からテキストを解読できるようになった。だが高精度の裏側では、重い言語モデルのスタックが計算コストと遅延のばらつきを生み、自然な会話への参加を妨げていた。とりわけ遅延が読めないことは、相手とのやり取りのリズムを崩す大きな障害だった。本研究は、音声認識（ASR）モデルの速度と軽さを活かしたエンドツーエンドの脳-テキスト解読フレームワークFETTUCCINEを提案する。<br><br>公開データによる評価では、単語誤り率は4.39%まで
