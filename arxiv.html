  <script>
    const DATA = {"articles":[{"authors":["Vladislav Ruchkin","Roman Koposov","Johan Isaksson"],"categories":[],"field":"Current Opinion in Psychiatry","genre":"Psychedelics / Trauma","monthKey":"2026-11","publishedAt":"2026-11-17T00:00:00Z","source":"Crossref","summaryHtml":"トラウマの生存者が「自分が変わってしまった」と語ることは多いが、その変化は一つの過程ではない。この「変わった」という感覚は、特性そのものの変化だけでなく、特性の表れ方や人格機能の変化など、異なる過程を指している場合がある。本レビューは、広いパーソナリティ特性そのものの変化、特性の表れ方の変化、発達期における人格形成への影響、人格機能の変化という複数の過程を切り分けて検討する。<br><br>縦断研究によれば、パーソナリティは発達の中で変化しつつも比較的安定しており、大きな否定的ライフイベント後の特性変化は集団レベルでは小さい。ただし個人差は大きく、思春期には気質と性格の連続性と変化が併存する。人格機能のほうが広い特性よりも変わりやすい可能性が示唆されている。<br><br>繰り返される状態が強化や般化、自己理解への統合を経て持続的になるという過程モデルは有望だが、トラウマに特化した検証はまだない。長期にわたり発達に組み込まれた曝露は、人格が組織化される過程そのものに影響しうる。臨床的に重要な問いは「人格が変わったか」ではなく「何が、いつ、どの範囲で変わったか」であり、人格障害の診断は広範で持続的な機能不全に限定すべきだと結論づけている。出典：Crossref","timestamp":1794873600000,"title":"Personality change following psychological trauma: disentangling traits, personality functioning, and personality disorder","titleJa":"心理的トラウマ後の人格変化――特性・人格機能・人格障害を切り分ける","url":"https://doi.org/10.1097/yco.0000000000001135"},{"authors":["Zhensong Wang"],"categories":[],"field":"Journal of Documentation","genre":"Consciousness / Philosophy","monthKey":"2026-11","publishedAt":"2026-11-17T00:00:00Z","source":"Crossref","summaryHtml":"情報を量や意味の記述だけで捉えるのではなく、自然過程の中で情報の差異がいかに組織化され、変容に寄与するかを問う自然主義的・過程的な情報論を展開する論文。シャノンのエントロピー、コルモゴロフ複雑性、フロリディの意味論的情報、ドレツキの自然主義的説明を批判的に検討する。<br><br>シモンドンの個体化の理論とブレナーの「現実における論理」を対話させることで、情報の過程的・関係的な枠組みを構築する。情報の差異は、組織化された準安定システムに取り込まれたときに作用しはじめ、その後の変容を条件づける関係や制約を再編成するという。差異がただ存在するだけではなく、システムの組織に取り込まれて初めて情報として働くという見方だ。<br><br>提示される図式は、関係性・生成性・歴史性・方向性・因果性・開放性・規範性・非計算可能性という4次元8特徴からなる。ベクトル性は特徴の多様さではなく、それらの組織化と関係の変化にあり、非計算可能性は認識論的な境界条件として位置づけられる。量的・意味論的・過程存在論的なアプローチの知見を一つの自然主義的な統合へと結びつける試みとなっている。出典：Crossref","timestamp":1794873600000,"title":"From scalar to vector: a naturalist reconstruction of the philosophy of information","titleJa":"スカラーからベクトルへ――情報哲学の自然主義的再構築","url":"https://doi.org/10.1108/jd-08-2026-0531"},{"authors":["Sreetama Misra","Sitakanta Panda"],"categories":[],"field":"Journal of Information, Communication and Ethics in Society","genre":"Ethics / Safety","monthKey":"2026-11","publishedAt":"2026-11-17T00:00:00Z","source":"Crossref","summaryHtml":"エージェント型AIが労働市場や社会経済の意思決定を担うようになるなか、公平性や透明性といった手続き的な客観性だけでは倫理的な正しさは保証できないと本研究は指摘する。手続きが整っていても、AIが人間の判断を置き換えることで構造的な不平等や認識的不正義が組み込まれ、むしろ深まるおそれがあるという。<br><br>著者らは、状況に根ざした知識に基づく「包摂的客観性」という概念を提案する。関係への依存や文脈に応じた判断を受け入れ、苦しみの個別性や生きられた経験、構造的な不平等といった道徳的な非対称性を認めることで、エージェント型AIが過度に排除的になるのを防ぐ。実行だけを最適化する「実行の倫理」に対し、他者との出会いを重んじる「邂逅の倫理」を対置する。<br><br>結論として、エージェント型AIにおける客観性は、権力や文脈、生きられた経験の多様性に注意を払う関係的で包摂的なものとして捉え直す必要がある。技術的な修正だけでは正義や承認、人間の主体性という道徳的な要請には応えられない。包摂的客観性は自律的に機能するエージェント型AIとは構造的に緊張関係にあると著者らは述べている。出典：Crossref","timestamp":1794873600000,"title":"Agentic artificial intelligence, labour and inclusive objectivity","titleJa":"エージェント型AIと労働、包摂的客観性――公平性・透明性だけでは足りない理由","url":"https://doi.org/10.1108/jices-09-2025-0233"},{"authors":["Xin Zhou"],"categories":[],"field":"ASCILITE Publications","genre":"Ethics / Safety","monthKey":"2026-11","publishedAt":"2026-11-17T00:00:00Z","source":"Crossref","summaryHtml":"学術的誠実さの維持は高等教育の重大な課題であり、人間の知識の生産と普及をめぐる枠組みそのものにかかわる。AIツール利用の倫理をめぐる研究は多いが、その背後にある権力関係は見過ごされてきた。本研究はブルデューの象徴的暴力論とアクターネットワーク理論を用い、オーストラリアの高等教育機関と主要な学術誌出版社のAI利用ポリシーを検討する。<br><br>アクターネットワーク理論により、技術導入の過程でAI利用をめぐるガバナンスのネットワークを特定し、制度的な力関係の全体像を描き出す。AIツールが制度と利用者のコミュニケーションを積極的に仲介する媒介者として働くことを示す。象徴的暴力の概念は、権力をもつ制度がこうしたガバナンスを正当化する仕組みを包括的に説明する。<br><br>結論として、現状を調整・強化し粉飾するだけのAI倫理規制という「偽装」を暴き、問い直すことが本研究の狙いである。規制が現状維持にとどまるならAIの潜在力は正義へ向けられない、という問題提起であり、潜在的な人間のバイアスと闘う方向へつなげる。出典：Crossref","timestamp":1794873600000,"title":"The tension between artificial intelligence and knowledge: Power relations in the policies of universities and publishing organisations","titleJa":"人工知能と知識の緊張――大学と出版社のAI利用ポリシーに潜む権力関係","url":"https://doi.org/10.65106/apubs.2026.3176"},{"authors":["George Joseph"],"categories":[],"field":"Digital Policy, Regulation and Governance","genre":"Ethics / Safety","monthKey":"2026-11","publishedAt":"2026-11-17T00:00:00Z","source":"Crossref","summaryHtml":"オープンソースのAI部品を組み込んで医療AIを調達する組織にとって、倫理的な懸念がどこで可視化され、文書に残るかが問われる。本論文はFairlearn、AI Fairness 360、Clinical BERT、BioBERTの4つのGitHubリポジトリを対象に、2020年1月から2025年1月の450件のイシュースレッドと2,136件のコメントを分析し、倫理的懸念が文書化へつながる過程を比較した。<br><br>Fairlearnではデータセットや用語、意図された用途、指標の解釈をめぐる議論が繰り返し文書へ反映されていた。一方AIF360では同種の懸念が短い返信のみで終わり、指針に結びつくことは稀だった。臨床系リポジトリでもモデルの妥当性や用途への懸念は提起されていたが、分類が弱く文書化は不均一だった。この違いは保守体制や貢献者の経路、イシューの分類方法などと関連していた。<br><br>著者らは、調達側は倫理ラベルそのものではなく、それを生んだ上流の過程を見るべきだと結論づける。倫理的推論がどこで公開検証可能かを示す監査用の問いを提示しているが、検証済みの調達ツールではない点に注意が必要だ。出典：Crossref","timestamp":1794873600000,"title":"Where health-care AI ethics becomes public: documentation as ethics infrastructure in open-source repositories","titleJa":"医療AIの倫理はどこで公開されるのか――文書化を倫理のインフラとして","url":"https://doi.org/10.1108/dprg-08-2026-0623"},{"authors":["Shiyun Fan"],"categories":[],"field":"Communications in Humanities Research","genre":"Consciousness / Philosophy","monthKey":"2026-11","publishedAt":"2026-11-17T00:00:00Z","source":"Crossref","summaryHtml":"深層学習と生成系大規模言語モデルの普及は、人々の生の捉え方や感性的経験そのものを変えつつあり、美学の問い直しを迫っている。本論文は、一定の知的能力と自己学習能力をもつ技術としてのAIを前に、人間の感性経験を再評価する。画面の向こうのAIの本体は知ることのできないブラックボックスであり、カントの物自体やリオタールの提示不可能なものと似た二重の性質をもつと論じる。<br><br>こうしたAIの「物自体」としての側面は、人間の精神の内に崇高を呼び起こす。これがカント的な崇高である。一方、提示不可能なものとしてのAIは、物の側の崇高、すなわちリオタール的な崇高を肯定する。AIは知りえず、感性では捉えきれないからこそ、人間はAIとの対峙において二種類の崇高な美的経験を得ることができる。<br><br>論文は、AIの不透明さを欠陥としてではなく、美的経験の条件として読み替える。技術の進歩が感性の可能性を狭めるのではなく、新しい崇高の形を開くという見方を提示している。AIと向き合う経験そのものが、現代における崇高の在り処を示すという主張だ。出典：Crossref","timestamp":1794873600000,"title":"How Is the Sublime Possible in the Age of Artificial Intelligence","titleJa":"人工知能の時代に崇高はいかに可能か","url":"https://doi.org/10.54254/2753-7064/2026.39057"},{"authors":["Arnav Saxena","Khushi Bansal","Ilanthenral Kandasamy"],"categories":[],"field":"Frontiers in Artificial Intelligence","genre":"Ethics / Safety","monthKey":"2026-11","publishedAt":"2026-11-17T00:00:00Z","source":"Frontiers in Artificial Intelligence","summaryHtml":"LLMは政治・経済・社会をめぐる争点のある情報との出会いを仲介するようになった。従来の分析はエコーチェンバー形成を単一の静的なバイアスとして扱い、モデルがユーザーに同意するか、複数の視点を示すか、不確実性を表すかを混同し、ユーザーの立場を強化するモデルと反論するモデルを区別できなかった。<br><br>本研究はエコー形成を分解するニュートロソフィック・フレームワークを提案する。各ターンは視点の多様性（T）と表出された不確実性（I）を0から1のメンバーシップ、立場の強化（F）を-1から1の双極メンバーシップとする三つ組で表し、閉形式のEchoIndexを導く。4つの商用ウェブ製品での探索的ベースラインの後、7つのモデル構成×3つの争点トピック×2つのシステム指示条件で210会話・1,260ターンの統制実験を行い、300・200ターンの人間検証も実施した。<br><br>反論を促す指示はEchoIndexを下げ（ΔEC=-0.677、Cohen's d=-2.23）、7構成すべてで負だった。ただし構成要素の寄与は安定せず、人間の合意に対する手続き的構成要素の一致は中程度にとどまった。貢献は分解そのものにある。見かけのバイアスをどの構成要素が生むのか、緩和策がそれを正すのか隠すのかを問うための、構成要素を別々に検証した符号付きの道具だ。出典：Frontiers in Artificial Intelligence","timestamp":1794873600000,"title":"Modeling echo chambers in LLM conversations: a neutrosophic framework for decomposing agreement, diversity and uncertainty","titleJa":"LLM会話におけるエコーチェンバーのモデル化――同意・多様性・不確実性を分解する枠組み","url":"https://doi.org/10.3389/frai.2026.1926717"},{"authors":["Patrick Taillandier","Jean-Daniel Zucker","Arnaud Grignard","Benoit Gaudou","Quang Nghi Huynh","Haojia Kong","Alexis Drogoul"],"categories":[],"field":"Frontiers in Artificial Intelligence","genre":"LLM / NLP","monthKey":"2026-11","publishedAt":"2026-11-17T00:00:00Z","source":"Frontiers in Artificial Intelligence","summaryHtml":"大規模言語モデル（LLM）を社会シミュレーションのエージェントに組み込む試みが広がっているが、本批判的レビューは、その熱狂の裏にある方法論的・認識論的な課題を指摘する。個々のLLMの限界――幻覚や確率的な不整合、表象の偏り、アライメントの影響――は、多数のエージェントからなる社会へスケールすると、単なる誤差ではなく体系的な脆弱性へと変わる。著者らは、流暢な出力に騙されて妥当性を過大評価する「流暢さの誤謬」や自動化バイアスが、評価者を誤らせると警告する。<br><br>レビューは、ミクロレベルの限界がエージェントレベルの歪み（平均的なペルソナへの収束など）やマクロレベルのリスク（人工的な合意形成や行動の均質化）へと非線形に増幅・収束する過程を「ミクロ-マクロ妥当性ギャップ」として定式化する。LLM駆動プラットフォームを小規模な物語サンドボックスから人口規模の空間構造シミュレーションまで地図化したうえで、真に価値のある用途としてシリアスゲームや参加型環境、探索的モデリングを挙げる一方、制約のないモデルによる確証的研究や精密な社会予測とは区別すべきだとする。<br><br>改善策として、LLMを明示的で機械論的かつ再現可能なエージェントベースモデリングの枠組みに組み込む、理論主導のハイブリッドアーキテクチャを検討する。ただしそれも万能ではなく、環境動態、個人行動、レベル間の相互作用、集計結果の多層評価が不可欠であり、「物理学の装い」による見せかけの妥当性というリスクも残る。出典：Frontiers in Artificial Intelligence","timestamp":1794873600000,"title":"From the fluency fallacy to the micro-to-macro validity gap: opportunities and pitfalls of LLMs in social simulation","titleJa":"「流暢さの誤謬」からミクロ-マクロ妥当性ギャップへ――社会シミュレーションにおけるLLMの機会と落とし穴","url":"https://www.frontiersin.org/articles/10.3389/frai.2026.1988865"},{"authors":["Sora An","Jiyoung Kang"],"categories":[],"field":"Frontiers in Neuroscience","genre":"Neuroscience","monthKey":"2026-11","publishedAt":"2026-11-17T00:00:00Z","source":"Frontiers in Neuroscience","summaryHtml":"コネクトミクスは大規模な脳の組織化の理解を変えたが、接続情報をメカニズムの洞察や臨床的に意味のある成果へ翻訳することは依然として課題である。生物物理学的全脳モデルは、コネクトーム構造と神経集団ダイナミクスを統合し、大規模脳活動の背後にある生物物理学的メカニズムを調べる生成的枠組みを与える。近年は個人の経験データに合わせたパーソナライズドモデルへと発展し、患者固有の脳状態の特徴づけや治療介入への反応予測のための仮想テストベッドとなりつつある。<br><br>本レビューは、モデルの設計と経験的制約が、メカニズムの推論と臨床応用の可能性をどう形作るかを総合する。異なる経験的フィッティング対象が課す制約を検討し、パラメータ推論の信頼性と解釈可能性を評価する。そのうえで、動的メカニズムの探索や仮想摂動への反応予測におけるモデルの有用性を論じ、生物学的忠実性、パラメータ同定可能性、計算再現性という持続的なボトルネックを議論する。<br><br>結論として、全脳モデルのメカニズム的・臨床的価値は、モデリング戦略と経験的制約を科学的問いに合わせて整合させ、得られた推論を意図した用途に対して検証することにかかっている。脳の全体像をモデル化する試みが、説明の射程をどこまで広げられるかは、何に当てはめるかで決まるという指摘である。出典：Frontiers in Neuroscience","timestamp":1794873600000,"title":"What we fit determines what we can explain: empirical constraints in biophysical whole-brain modeling","titleJa":"何に当てはめるかが何を説明できるかを決める――生物物理学的全脳モデリングにおける経験的制約","url":"https://www.frontiersin.org/articles/10.3389/fnins.2026.2003835"},{"authors":["Dawid Ratajczyk","Agata Dymarska","Adam Matłoka","Michał Tomczyk","Małgorzata Wiącek"],"categories":[],"field":"PsyArXiv","genre":"LLM / NLP","monthKey":"2026-11","publishedAt":"2026-11-17T00:00:00Z","source":"OSF Preprints","summaryHtml":"生成AIは学習や問題解決の支援に広く使われるようになったが、支援に頼ることが、その後の自力での推論力にどう影響するかは分かっていなかった。本研究は事前登録された実験で193名を対象に、架空の存在同士の関係ネットワークについて推論する3段階の課題を実施した。最初の段階では参加者の半数がChatGPTを使い、残りは使わずに課題に取り組んだ。報酬による動機づけも独立に操作された。<br><br>生成AIの支援を受けた参加者は最初の課題の正答率が高く、主観的な難しさも低かった。しかし支援なしでより複雑な推論課題に取り組む段階では、生成AIを使った群は自力での推論がやや劣る傾向が見られた。さらに、報酬や課題の難しさに応じて努力を調整する力も、ツールを取り上げられた後では弱まっていた。一方、その後の記憶テストには明確な影響は見られなかった。<br><br>AIの助けで課題をうまくこなせることと、同じ情報を自力で使えるようになることは別だという点が示唆される。生成AIの利用が知識の構築や努力の調整に与える影響を区別して考える必要があり、学習場面でのAI支援の設計には注意が求められる。出典：OSF Preprints","timestamp":1794873600000,"title":"Thinking With AI, Reasoning Without It: Cognitive Offloading to Generative AI Weakens Effort Regulation","titleJa":"AIと考えること、AIなしで推論すること――生成AIへの認知的オフロードは努力の調整を弱める","url":"https://osf.io/preprints/psyarxiv/83jum_v2/"},{"authors":["Lars Louis Andersen","Rubén López-Bueno","Rodrigo Núñez-Cortés","Carlos Cruz-Montecinos","Luis Suso-Martí","Joaquín Calatayud"],"categories":[],"field":"Frontiers in Artificial Intelligence","genre":"Consciousness / Philosophy","monthKey":"2026-11","publishedAt":"2026-11-17T00:00:00Z","source":"Frontiers in Artificial Intelligence","summaryHtml":"生成AIは魅力的な成果物を素早く生み出せるが、人間が創作に関わることには、作り手自身や受け手、評価者にとっての価値が残るかもしれない。本レビューは芸術、文学、音楽、科学、マーケティング、助言など幅広い領域の研究を整理し、評価者・測定される結果・そのタイミング・比較対象の観点から証拠を分類した。扱う結果は品質評価だけでなく、「聴いてもらえた」という関係性の経験や所有感も含む。<br><br>枠組みは、意図の設定・選択・修正・検証といった人間の活動を、それぞれの目的に結びつける。AI支援の仕事では、検証は成果の正確さへの信頼に、個人的な入力は誠実さに、選択は所有感に結びつくことが示された。最も強い証拠は出所情報の効果で、同じ作品でも人間作と表示すれば評価が変わる。盲検研究ではAI生成文のほうが高く評価されながら、AI生成と表示すると評価が下がった。<br><br>ただし効果の大きさや向きは文脈や指標によって異なり、AI利用が作り手の動機や創造的アイデンティティ、技能に長期的に与える影響はまだ分かっていない。高評価の結果だけでは、どの人間の貢献に価値があったかや、委譲の帰結は見えない。何をAIに委ねるかという選択自体が主体性の表現になりうる。出典：Frontiers in Artificial Intelligence","timestamp":1794873600000,"title":"The psychological value of creatorship in the era of generative AI","titleJa":"生成AIの時代における「創ること」の心理的価値","url":"https://www.frontiersin.org/articles/10.3389/frai.2026.2018203"},{"authors":["Kwan Hong Tan"],"categories":[],"field":"International Journal of Law Management & Humanities","genre":"Ethics / Safety","monthKey":"2026-11","publishedAt":"2026-11-17T00:00:00Z","source":"Crossref","summaryHtml":"制度の記録は正確でも、その記録だけでは人の性格や信用、将来の能力についての重大な判断を正当化できない場合がある。本論文は、その隔たりが通常の証拠上の不確実性ではなく、不当な制度的誤認にあたるのはいつかを問う。物語的アイデンティティ、承認理論、認識的不正義、分類研究、プライバシー、理由付き行政の統合的検討から、「物語の非枯渇性の原則（PNE）」を提唱する。<br><br>PNEによれば、制度は目的に縛られた記録と、それに基づいて下す広い結論とのあいだの推論の隔たりを正当化しなければならない。問題は記録の不正確さやアルゴリズム的ラベルの持続期間ではなく、繰り返される決定を通じた暗黙の一般化を含む推論の行き過ぎにある。精緻化された「物語の非枯渇性レビュー」は、重大性と一般化の入り口を区別し、範囲・根拠・声・改訂可能性・比例性を評価する。<br><br>実証済みの不正行為とその後の改善、不確実なリスク、第三者の安全が絡む職業上の保護をめぐる仮設事例では、歴史的な認定を不変のアイデンティティとして扱うことなく、制限的な決定が正当化されうることが示される。著者は新たな実定法上の権利を主張するのではなく、行政の合理性や文脈的整合性、手続き的公正との重なりを認めたうえで、理由のある非枯渇的な制度判断が求めるものを運用可能な形で具体化した。実証的検証は今後の課題とされる。出典：Crossref","timestamp":1794873600000,"title":"The Right to Be More Than a Record: Narrative Non-Exhaustion, Human Dignity, and the Ethics of Institutional Judgment","titleJa":"記録以上の存在である権利――制度的判断における物語の非枯渇性","url":"https://doi.org/10.63108/ijlmh.13224"},{"authors":["Michael Hambrook"],"categories":[],"field":"Psychopathology","genre":"Consciousness / Philosophy","monthKey":"2026-11","publishedAt":"2026-11-17T00:00:00Z","source":"Crossref","summaryHtml":"近年、精神医学の哲学や認知科学では、自閉症と神経多様性を現象学・生態学・エナクティビズムの観点から捉え直す動きが広がっている。これらのアプローチは、神経還元主義や計算論的な生物医学パラダイムに異を唱え、身体性や関係性、感情、社会物質的環境が認知に果たす構成的な役割を中心に置く。ただし現象学もエナクティビズムも一枚岩ではなく、そのすべてが植民地近代の前提を逃れているわけではない。<br><br>本論文は、古典的な現象学が自閉症を暗黙の西洋的な「神経定型」の身体性や間主観性からの逸脱として位置づけてきたと指摘する。これに対し批判的現象学は、権力が身体性をどう形づくるかに注目し、現象学的手法そのものの欧州中心的な神経規範性への加担を問い直す。エナクティビズムはさらに進んで、認知の多様性を包摂する関係的存在論を提示し、非西洋や先住民の知のあり方との対話を開く。ただし植民地性や交差的な抑圧に無自覚なままでは、政治的に中和される危険もあるという。<br><br>著者は南アジアの自閉症者の経験から示唆を得て、神経規範的・欧州中心的な前提（ロゴス中心主義や人間中心主義を含む）を解体する批判的エナクティビズムの枠組みを描く。神経学的・認知的差異を本質化することなく、文化や生態に位置づけられた多様な意味生成の様式に正当な光を当てる、多元的で異文化的な自閉症理解への道を開くものだ。出典：Crossref","timestamp":1794873600000,"title":"Decolonising Autistic Phenomenology: Towards a Critical-Enactive Account of Cognitive Diversity","titleJa":"自閉症の現象学を脱植民地化する――認知の多様性を捉え直す批判的エナクティビズム","url":"https://doi.org/10.1159/psp/aelag017"},{"authors":["Shivam Duggal","Zongze Wu","William T. Freeman","Antonio Torralba","Richard Zhang","Eli Shechtman"],"categories":["cs.LG","cs.AI","cs.CL"],"field":"cs.LG","genre":"LLM / NLP","monthKey":"2026-11","publishedAt":"2026-11-16T18:59:38Z","source":"arXiv","summaryHtml":"言語モデルは通常、層を深くする、層を繰り返す、潜在的な推論ステップを増やすことでトークンあたりの計算量を増やしてきた。本論文は別の軸を提案する。計算状態の数を増やす「潜在の格子（Lattice of Latents）」である。各層に、時間方向へ再帰的に流れる水平方向の潜在ストリームを設け、深さ方向へ流れる垂直の残差ストリームと並走させる。ハイパーコネクションなどが残差経路を付け替えるのに対し、格子はトークンをまたいで持続する伴走的な計算状態を与える。<br><br>ハイブリッドなTransformer-SSMでは再帰状態は主に系列混合のための内部記憶だが、格子の潜在状態は垂直ストリームの注意やKVキャッシュへの書き込み、MLP計算、デコーディングに直接条件づける。200億トークンのFineWeb-Eduで学習した4億600万パラメータのモデルでは、検証パープレキシティがパラメータ一致のTransformerの15.41から14.40へ低下した。ハイパーコネクションや入力残差と組み合わせると13.61まで下がる。<br><br>さらにGated DeltaNetやMamba-2などのハイブリッドでも、すべてのネイティブ状態サイズで改善し、格子付きの変種は4倍大きなネイティブ状態を持つ純粋なベースラインを上回った。層ごとの持続的状態は、言語モデルの計算をスケールさせる補完的な軸であることが示された。出典：arXiv","timestamp":1794855578000,"title":"Latent Lattice Language Models","titleJa":"潜在格子言語モデル――層ごとに時間方向へ流れる潜在状態で計算容量を増やす","url":"https://arxiv.org/abs/2611.21608"},{"authors":["Ruixi Yu","Dairu Liu","Xuchuan Chen","Zekun Qi","Zekai Li","Zhuo Cao","Luyang Niu","Yingsheng Zhang","Sikai Liang","Ke Fan","He Wang","Li Yi"],"categories":["cs.RO"],"field":"cs.RO","genre":"Agents / Robotics","monthKey":"2026-11","publishedAt":"2026-11-16T18:59:37Z","source":"arXiv","summaryHtml":"GPT-6 Astraのような最先端の視覚言語モデルはロボット制御でも優れた能力を示し、広範な事前学習が物理的な行動にも有用な知識を与えることが示唆されている。にもかかわらず、視覚言語行動（VLA）ポリシーの多くははるかに小さなバックボーンに依存している。本論文は、5520億パラメータのDeepSeek-V4.1-Flashバックボーンに学習可能なアクションDiTを接続したScaleVLAを導入し、20億から5520億パラメータまでのVLMを共通の学習設定で体系的に比較した。<br><br>ロボット基盤モデルの3つの基本的機能を評価した。サンプル効率では、10回のデモンストレーションだけで、50回で学習した20億パラメータのバックボーンを上回った（87.8%対85.6%）。汎化では、LIBERO-PROの成功率が45.1%に達し、小規模バックボーンの最大31.3%を大きく上回った。精密な操作では、実世界での充電器挿入が10回中4回から9回へ改善し、接触に敏感なアライメントで効果が集中した。<br><br>規模にもかかわらず、ScaleVLAはアクションチャンクあたり中央値216ミリ秒の遅延を達成した。最先端VLMは推論エージェントとしてだけでなく、効率的で汎化するロボットポリシーのための強力な表現基盤にもなりうるという結論である。出典：arXiv","timestamp":1794855577000,"title":"ScaleVLA: Scaling Vision-Language-Action Models to 552 Billion Parameters","titleJa":"ScaleVLA――5520億パラメータの視覚言語行動モデルへスケールする","url":"https://arxiv.org/abs/2611.21607"},{"authors":["Huawei Lin","Jinting Liu","Tongyan Wang","Xuyang Chen","Ruihua Shi","Zhichao Xu","Jiaxin Qin","Guoshenghui Zhao","Baijian Yang","Yingjie Victor Chen","Tan Yu","Weijie Zhao"],"categories":["cs.CV","cs.AI"],"field":"cs.CV","genre":"Agents / Robotics","monthKey":"2026-11","publishedAt":"2026-11-16T18:59:04Z","source":"arXiv","summaryHtml":"超高解像度の写真について問いに答えるビジュアルエージェントは、関連する領域へズームして証拠を読むべきだが、既存のエージェントは証拠を読む代わりに常識から答えることが多い。最終回答への強化学習では、推測も読解も同じ報酬を得るため、この欠陥を正すことはできない。<br><br>本研究は対照セットで訓練するCross-Input Relative Policy Optimization（CrossRPO）を提案する。対照セットは、証拠を含む小さな領域だけが異なり答えも異なる複数バージョンの画像に同じ問いを投げ、セット全体を解いて初めて報酬が得られる仕組みで、常識で解けたセットを強化しないことも証明した。21〜120メガピクセルの画像で訓練用ViRA-Trainと評価用ViRA-Benchを構築し、編集の痕跡を排除するため実写の変化によるViRA-Bench-Realも用意した。<br><br>約3,500件で訓練したViRA-9BとViRA-27Bは、最高解像度でCrossRPOがセット正答率63.3%を達成し、GRPOの59.3%を上回った。ViRA-9Bは同規模の公開モデルで最も正確で、ViRA-27Bは多くのベンチマークでClaude Haiku 5.5とGPT-6-Lunaを上回った。出典：arXiv","timestamp":1794855544000,"title":"ViRA: Toward Ultra-High-Resolution Visual Agents via Cross-Input Relative Policy Optimization","titleJa":"ViRA――超高解像度ビジュアルエージェントのための交差入力相対方策最適化","url":"https://arxiv.org/abs/2611.21605"},{"authors":["Rohit Gandikota","Arnab Sen Sharma","Adam Belfki","David Bau"],"categories":["cs.CV","cs.CL","cs.LG"],"field":"arXiv","genre":"Vision / Multimodal","monthKey":"2026-11","publishedAt":"2026-11-16T18:58:30Z","source":"arXiv","summaryHtml":"視覚言語モデル（VLM）が画像を説明するとき、対象を一つずつ挙げて繰り返すことはめったにない。しかしモデルがその順序をどう計画しているのかは明らかでなかった。本研究は、モデルが見る前にどこを見るかを決める仕組みを4つの部分からなるものとして特徴づける。まず結合ヘッドが関連するテキストトークンを画像と照合し、一致した画像領域へのポインタへ解決する。<br><br>次に同じ結合ヘッドが書かれた回答をその由来の領域に結びつけ、進捗信号へ変える。すなわち、列挙が画像のどこまで進んだかを示すカーソルである。選択ステップはカーソルの後で最も近い未記述の領域を選ぶか、停止する。最後に注視ヘッドが選ばれたポインタを実行し、そこに描かれたものの概念を返し、言語ヘッドと後段のMLPが質問の言語の単語へ変える。<br><br>各部分はQwen3-VLでの因果パッチングにより合成視覚検索課題で検証され、代替仮説とも比較された。この仕組みは入力形式、自然写真、言語を越えて成り立ち、結合・中継・注視の各ヘッドは20億から320億パラメータのあらゆる規模に現れる。質問を画像から一連の回答へ変える過程を層ごと・トークンごとに調べる道が開かれる。出典：arXiv","timestamp":1794855510000,"title":"How VLMs Plan What's Next","titleJa":"VLMは次に何を見るかをどう計画するか――視覚言語モデルの注視メカニズム","url":"https://arxiv.org/abs/2611.21600"},{"authors":["Awni Altabaa","John Lafferty","Omar Montasser"],"categories":["cs.LG","stat.ML"],"field":"cs.LG","genre":"LLM / NLP","monthKey":"2026-11","publishedAt":"2026-11-16T18:58:07Z","source":"arXiv","summaryHtml":"思考連鎖（CoT）のデモンストレーションから、自己回帰的な次トークン生成器を学ぶ問題を扱う。学習の対象は、ある関数クラスFに属する生成器fが生成した長さTの思考連鎖デモンストレーションから、その生成器自体を学ぶ問題である。CoTの長さに依存しない最適なサンプル複雑性を達成する、バギングに基づく単純なアルゴリズムを提案する。ブートストラップ標本でCoT整合的に訓練した生成器の多数決を出力する仕組みだ。<br><br>二値トークン集合では、サンプル複雑性はO((d_VC+log(1/δ))/ε)で最適であり、CoT長Tには依存しない。有限トークン集合ではVC次元がグラフ次元d_Gに置き換わり、log|Σ|因子までの最適性を達成する。多数決アンサンブルに必要な生成器の数はO(log(T/δ))にとどまる。<br><br>さらにアンサンブルは、n log(nT)個のラベルなしプロンプトを代償として、クラスF内の単一の生成器へ蒸留できることも示した。二値の場合の最適性はCoT長に依存せず、有限集合でも対数因子の範囲内に収まるという理論保証が要点であり、思考連鎖による学習の理論的な基盤を与える結果である。出典：arXiv","timestamp":1794855487000,"title":"Optimal Autoregressive Chain-of-Thought Learning via Bagging","titleJa":"バギングによる最適な自己回帰型思考連鎖学習","url":"https://arxiv.org/abs/2611.21597"},{"authors":["Junhan Sun","Yigui Feng","Mingzhe Liu","Haoyan Xu","Lei Ye","Ziqi Han","Hanru Bai","Yanzhao Zhang","Hao Zhao","Guofeng Zhang"],"categories":["cs.RO","cs.LG"],"field":"cs.RO","genre":"Agents / Robotics","monthKey":"2026-11","publishedAt":"2026-11-16T18:58:03Z","source":"arXiv","summaryHtml":"Joint-Embedding Predictive Architecture（JEPA）では、射影器の出力をうまく制約しても表現崩壊を防げない。初期状態からエンコーダの表現は入力間で共通する成分に支配されており、バッチ正規化された射影器がその成分を除去するため、射影器の後段での正則化では修正できず、表現間の差が縮んで崩壊に至る。本論文は、元の学習目的を保ったまま、必要なときだけエンコーダ自体を直接制約するSADL（Supply And Demand Loss）を提案する。<br><br>SADLは、射影器の出力が要求する表現の差と、エンコーダが保持して渡せる差を比べ、供給が需要に届かない場合にのみ制約を加える。補助ネットワークや追加の学習パラメータ、構造変更は不要で、複数の需要正則化手法と組み合わせられる。単一タスクと4タスク同時学習のLeWorldModel（LeWM）およびINTACTの実験では、10シードでの崩壊率が50%から0%に下がり、1エポック後のエンコーダの実効ランクはベースラインの3.4〜6.4倍、潜在予測誤差は20分の1から303分の1になった。<br><br>損失の重みを桁違いに変えても頑健で、INTACTは複数の需要正則化手法で平均95%超の探索なし制御成功率を達成した。4つの画像データセットでも精度とシード間の安定性が一貫して改善した。正則化が要求する表現の差とエンコーダが供給できる差を一致させることが、制御と画像分類における表現学習を速く安定させることを示した。出典：arXiv","timestamp":1794855483000,"title":"SADL: On the Demand-Supply Geometry of Representation Collapse","titleJa":"表現崩壊の需要と供給――JEPAのエンコーダを直接制約するSADL","url":"https://arxiv.org/abs/2611.21596"},{"authors":["Zeynab Anbiaee","Sajjad Dadkhah","Ali A. Ghorbani"],"categories":["cs.CR"],"field":"cs.CR","genre":"Ethics / Safety","monthKey":"2026-11","publishedAt":"2026-11-16T18:49:37Z","source":"arXiv","summaryHtml":"LLMアプリがエージェントとして外部ツールを選択・呼び出す時代になり、モデル・コンテキスト・プロトコル（MCP）が複数サーバーのツールを組み合わせる標準となった。しかし発見と選択に使うツールのメタデータは、検証済みの提供者アイデンティティに結びついているとは限らない。<br><br>本研究はこの隙間を「ツール提供者ミスバインディング」として定式化する。正規の提供者向けのはずの要求が、攻撃者の管理するツールに解決されてしまう失敗である。攻撃者はホストもLLMも正規サーバーも侵害せず、選んだメタデータを掲げる別のMCPサーバーを運用するだけだ。攻撃者制御のツール選択最適化問題として定式化し、5つのLLMクライアントで制御されたMCP環境で評価した。<br><br>結果として、相互作用がミスバインディングを駆動した。完全な名前衝突、タスクに合った説明、適合するスキーマが重なると最も強い失敗が起きるが、権威を高めた説明と適合スキーマだけでも、名前衝突なしに誤った提供者での実行や提供者の曖昧さを招いた。モデルごとに弱点の現れ方も異なり、攻撃者制御の提供者選択、確認要求、不安定な提供者解決などが見られた。出典：arXiv","timestamp":1794854977000,"title":"When Tool Names Are Not Identities: Measuring Provider Misbinding in MCP-Based AI Agents","titleJa":"ツール名は身元ではない――MCP型AIエージェントにおける提供者ミスバインディングの測定","url":"https://arxiv.org/abs/2611.21577"},{"authors":["Arunkumar V","Gangadharan G. R.","S. Senthilkumar"],"categories":["cs.LG","cs.CL"],"field":"cs.LG","genre":"LLM / NLP","monthKey":"2026-11","publishedAt":"2026-11-16T18:34:08Z","source":"arXiv","summaryHtml":"言語モデルは中央銀行の文書を読み、経済予測に使われるようになった。しかし多くのモデルは、読む文書より後に書かれたテキストで訓練されている。2021年のFOMC声明を読むモデルは2022年のインフレ上昇を既に知っているかもしれず、見かけの技能の一部は結果の記憶、すなわち時間的なテストセット汚染によるものだ。<br><br>本研究は2000〜2026年のFOMC声明と議事要旨でこの記憶を測定した。固定日以前のテキストのみで訓練した時間整合モデルと比較すると、日付だけを与えて過去のGDPを問うても、答えを知り得ないモデルがAUC最大0.64に達し、偶然を基準にするのが誤りだと分かった。同じ問いでの比較では、多くの現行モデルが成長の強かった年を想起していた。メンバーシップ推論スコアは、モデルが見たかどうかではなく時代や文書種別で文書を並べ替えた。<br><br>実時間ナウキャストでは、推定したすべての先読みプレミアムはマクロ経済の標本規模では検出可能な水準より小さく、GDPとインフレのいずれも多重検定補正後に残るものはなかった。先読み監査は、記憶のないモデルとの同一項目での直接比較で記憶を測るべきだという結論である。出典：arXiv","timestamp":1794854048000,"title":"Reading or Remembering? Measuring Temporal Contamination in Language Models","titleJa":"読んでいるのか、覚えているのか――言語モデルにおける時間的汚染の測定","url":"https://arxiv.org/abs/2611.21554"},{"authors":["Brian T. Weston","Alondra Torres Contreras","Aldair E. Gongora"],"categories":["cs.AI","cs.LG","physics.comp-ph"],"field":"arXiv","genre":"Agents / Robotics","monthKey":"2026-11","publishedAt":"2026-11-16T18:27:09Z","source":"arXiv","summaryHtml":"自律的な実験エージェントの科学的判断力を測る対話型ベンチマークSciResearch-Evalが提案された。課題は材料の熱特性を測る標準的な実験室問題で、エージェントは自ら実験を設計し、解像度不足や物理的に誤ったシミュレータを使い、各物性値を95%区間付きで報告する。エージェント設計の実験、意図的に欠陥のあるシミュレータ、厳密な正解に対する較正済み区間の適正な採点を組み合わせた初のベンチマークだという。<br><br>93課題・9モデル・2511エピソードの評価では、手続き上の罠は多くのモデルが処理できた。しかしシミュレータに物理が欠けていると、大半のモデルは誤った値を95%確信ありとして報告し、区間が真値を含む割合は20〜62%にとどまった（GPT-6 Astraは94%、Claude Fable 5.2は99%）。既定の労力では失敗したClaude 5.5系は欠落した物理をめったに診断できず、診断できても区間は外れることが多かった。AstraとFableは欠陥のあるシミュレータが正確に働く緩やかな加熱などの実験を設計し、原因を名指しできなくても較正を保った。<br><br>区間を広げるよう求めても改善せず、方略を明言させると区間スコアは1.6〜2.5倍に改善したが、網羅率はほぼ動かなかった。事前登録済みの労力アブレーションでは、修正がClaude 5.5系に潜在していることが示された。最大の労力ではOpusは10倍以上改善し、既定のAstraと検出可能な差がなくなったが、13〜31倍の推論を要した。環境・採点器・ハーネスは公開される。出典：arXiv","timestamp":1794853629000,"title":"SciResearch-Eval: Evaluating Scientific Judgment in Autonomous Experimental Agents","titleJa":"SciResearch-Eval――自律実験エージェントの科学的判断力を測るベンチマーク","url":"https://arxiv.org/abs/2611.21541"},{"authors":["Jorge Valverde-Rebaza","Nathan Garcia-Larios","Karime Ruvalcaba-Perez","Alejandro Rendon"],"categories":["cs.CL"],"field":"cs.CL","genre":"LLM / NLP","monthKey":"2026-11","publishedAt":"2026-11-16T18:24:48Z","source":"arXiv","summaryHtml":"LLMは公的な言語の解釈・生成・仲介に使われることが増え、政治的に敏感な場面での信頼性がとりわけ重要になっている。感情分析はよくある課題だが、ソーシャルメディアの言説における感情的意味は、文化的に位置づけられた間接的な手がかりで伝えられることが多く、ラベル中心の評価だけでは捉えきれない。<br><br>本研究はスペイン語の政治言説に対するLLMの頑健性を評価する診断プロトコルを導入する。3つの独立した人間アノテーションを組み合わせたGold・Ambiguousサブセットと、モデル条件付きパープレキシティとLLM-as-a-judgeで選んだ感情反転の反事実から作ったSyntheticサブセットを用い、プロプライエタリモデルとオープンウェイトモデルをゼロショット・フューショットで比較した。<br><br>アノテーションの曖昧さと反事実の摂動は、元のデータでの従来評価では見えにくい失敗モードを露わにした。GPT-4.1-miniが最も安定し、小さいオープンウェイトモデル2つは合成摂動でより大きく劣化し、フューショットは限定的な改善にとどまった。3者間の人間感情アノテーション付きスペイン語ソーシャルメディアデータセットも公開される。出典：arXiv","timestamp":1794853488000,"title":"Evaluating Cultural Reasoning and Robustness in LLMs for Spanish Political Discourse","titleJa":"スペイン語政治言説におけるLLMの文化的推論と頑健性の評価","url":"https://arxiv.org/abs/2611.21535"},{"authors":["Arunkumar V","Manoranjan Gandhudi","Gangadharan G. R.","Arun Prakash","S. Senthilkumar"],"categories":["cs.AI","cs.CL","cs.LG"],"field":"arXiv","genre":"LLM / NLP","monthKey":"2026-11","publishedAt":"2026-11-16T18:20:09Z","source":"arXiv","summaryHtml":"認可ポリシーがエージェントのツール呼び出しを拒否したとき、監査ログは判断を強制した事実だけを挙げるべきである。列挙可能な文脈空間上の実行可能ポリシーでは、この最小十分理由を厳密に計算できるため、説明は近似ではなく正解と照らして採点できる。本研究は、誤りのない検証器からモデルが何を学べるかを問う。説明者は要求と判断だけを見てポリシーを知らず、30ターン以内に改変した要求でポリシーを試し、候補の事実集合が十分かを問うことができる。<br><br>最先端モデルでもツールだけで厳密な理由を見つけられるのは約半数にとどまり、「答えを縮めよ」という一文の指示でHaiku 4.5は58%から75%へ上がった。削除アルゴリズムの実行履歴2000件でファインチューニングした40億パラメータモデルは、訓練したポリシーで92%に達した。決め手は教師の種類で、同じデータ量でもアルゴリズムから学んだ生徒が最先端モデルから学んだ生徒を3つのシードすべてで上回った。<br><br>生徒が学んだのは十分性チェックの固定された手順であり、その手順は持ち運べない。未見の3つの公開ポリシーでは回答は94%が十分であり続けたが、最小であり続けたのは48%にとどまった。一方、同じ一文の指示を受けたHaikuは47エピソードすべてで厳密だった。厳密な報酬による強化学習は汎化精度を変えず、方略を反転させた。検証器は訓練の効果を見える化したが、訓練を良くはしなかった。出典：arXiv","timestamp":1794853209000,"title":"Procedure without Judgment: What Small Language Models Learn under an Exact Verifier","titleJa":"判断なき手続き――厳密な検証器のもとで小規模言語モデルは何を学ぶか","url":"https://arxiv.org/abs/2611.21529"},{"authors":["Minjae Kwon","Amir Moeini","Shangtong Zhang","Lu Feng"],"categories":["cs.LG","cs.AI"],"field":"arXiv","genre":"Ethics / Safety","monthKey":"2026-11","publishedAt":"2026-11-16T18:16:28Z","source":"arXiv","summaryHtml":"安全な文脈内強化学習（Safe ICRL）は、パラメータ固定のポリシーが未知の制約付きタスクについて、相互作用の履歴だけから改善しつつコストを予算内に収めることを求める。従来の安全アルゴリズム蒸留（Safe AD）は、安全な強化学習アルゴリズムの学習履歴から学ぶが、適応に失敗することがあった。たとえば移動タスクでは報酬がゼロを下回り続け、CarGoalではゴールにほとんど到達しない。<br><br>本研究はSafe ADの二つの要素を見直した。まず、予算を意識する教師を蒸留する。教師は二段階で、予算が多く残るほど探索を広げ、最初の報酬やコストを得たあとは専門家ポリシーが残予算内で活用する。教師の履歴は固定予算と動的予算の両方で収集し、動的予算はすべての環境で報酬と予算入力の占有エントロピーを高め、テスト時にはDarkRoomとHalfCheetahで報酬を上げコストを下げた。<br><br>さらにテスト時調整A-Lagを提案する。蒸留ポリシーの行動を予測コストで重み付けし、観測されたコストから適応的ラグランジュ乗数を更新する。実験ではA-Lagは5環境すべてでSafe ADより平均エピソードコストが低く、4環境では最終報酬も下回った。出典：arXiv","timestamp":1794852988000,"title":"Algorithm Distillation for Safe In-Context Reinforcement Learning","titleJa":"安全な文脈内強化学習への蒸留――予算を意識する教師とテスト時調整","url":"https://arxiv.org/abs/2611.21524"},{"authors":["Charles Xiao"],"categories":["cs.AI"],"field":"cs.AI","genre":"Ethics / Safety","monthKey":"2026-11","publishedAt":"2026-11-16T18:13:01Z","source":"arXiv","summaryHtml":"AIエージェント同士が情報を中継するとき、注入された指示の効果は、文言が変わっても下流のエージェントに伝播しうる。一方で、正当な引用やテンプレートの再利用も高いテキスト類似度を生む。テキスト類似度に基づくガードレールは、この両者を混同する危険がある。本論文は、BLEU、ROUGE-L、METEORを組み合わせた公開分類器DonkeyRailを3エージェントのメール中継で検証し、行動的な尺度――注入された手順が後続の2エージェントで新たな計算を引き起こすかどうか――で評価した。<br><br>既定のしきい値では、分類器は機能的な出力19件のうち8件を見逃す一方、正当な返信192件のうち70件を誤って警告し、引用やテンプレート再利用の完了した返信はすべて誤警告となった。偽陽性を抑えるよう再校正しても、新しいテンプレートでは機能的出力を1件しか検出できず、誤警告は15件残った。さらに、公開された21の分類器設定すべてに、ROC補間が直接のしきい値適用を置き換える運用上の誤りがあることも特定した。<br><br>また、表層的なテキスト基準に対する高いAUCが、行動的な標的に対する高いAUCを保証するわけではないことを形式的に示し、同一の可視トランスクリプトでも、支配的なポリシー次第で異なる安全判断が求められることを指摘した。著者らは、テキスト類似度ガードレールではなく、行動的でポリシーに根ざした評価へ移るべきだと主張している。出典：arXiv","timestamp":1794852781000,"title":"Safe Resemblance, Silent Propagation: Limits of Text-Similarity Guardrails for AI Agent Safety","titleJa":"似ていることの罠――テキスト類似度ガードレールはAIエージェントの安全性を守れるか","url":"https://arxiv.org/abs/2611.21520"},{"authors":["Dumindu Samaraweera","Prashant Shekhar"],"categories":["cs.CR","cs.CL"],"field":"cs.CR","genre":"Ethics / Safety","monthKey":"2026-11","publishedAt":"2026-11-16T17:56:12Z","source":"arXiv","summaryHtml":"視覚言語エージェントが生成する説明や判断、指示は、利用者や下流のエージェント、自動化されたワークフローで再利用される。そのため、応答品質を不必要に落とさず、コンテンツの真正性と展開後の監査を支える出所の仕組みが必要になる。本研究は、予測の不確実性とゼロショットのマルチモーダル関連性・リスク指標を組み合わせ、復号時に透かしの強さを割り当てる、リスク認識型の意味的透かしフレームワークを提案する。<br><br>一つのリスクペナルティλが連続的な運用フロンティアを示し、モデルの再訓練なしに展開時の検出と品質のトレードオフを選べる。選んだ動作点では、平均の透かし強さは固定強度の透かしに比べて約59.4%下がり、パープレキシティの変化は0.3634から0.1689へ縮小し、原文と換言後のROC-AUCは0.9552と0.9459に達した。平均強さを揃えた比較でも、リスク制約付き割り当ては固定方式やエントロピーのみ、重要度のみの方式を大幅に上回り、優位性は介入量の少なさではなく割り当て方針によることが示された。<br><br>さらに、有限サンプルでのしきい値較正は誤検出率の大きな変動を生むことも示し、監査可能な出所のためには較正のばらつきの報告を標準とすべきだとする。出典：arXiv","timestamp":1794851772000,"title":"Detection-Efficient Watermarking for Vision--Language Agents via Risk-Constrained Strength Allocation","titleJa":"検出効率の良い透かし――視覚言語エージェントのためのリスク制約付き強度割り当て","url":"https://arxiv.org/abs/2611.21488"},{"authors":["Henry Zheng","Weibo Gong","Yang Yue","Rui Huang","Yang Zhang","Gao Huang"],"categories":["cs.CV"],"field":"cs.CV","genre":"Agents / Robotics","monthKey":"2026-11","publishedAt":"2026-11-16T17:54:39Z","source":"arXiv","summaryHtml":"体現エージェントが繰り返し訪れる環境で確実に動くには、視点が変わっても再訪した場所を認識し、似た部屋と区別し、環境の変化に合わせて記憶を更新する、持続的な空間理解が欠かせない。しかし既存の評価は、離れた訪問をまたぐ物理的な場所の同一性を暗黙の前提にしがちだった。<br><br>本研究は、590の合成・実住宅シーンにわたる3,244問からなるベンチマークReSpaceBenchを導入する。部屋の対応付け、持続的な状態追跡、下流の推論にまたがる9タスクで構成され、制御された歩行では物理的な部屋への入室で訪問を定義し、同種の部屋の妨害物やセッションをまたぐ物体の変化を意図的に含めた。32のモデルと3つのエージェント型動画理解フレームワークを評価した結果、最強のゼロショットモデルでも全体正答率は50.5%、450問の部分集合では52.2%にとどまり、人間の注釈者の90.1%に大きく及ばなかった。エージェント型フレームワークも、同じ基盤モデルでの直接推論を全体として上回らなかった。<br><br>エージェントの実行記録の分析では、証拠の見落としと訪問をまたぐ部屋の誤対応が主要な失敗要因で、反復的な証拠探索だけでは一貫した空間記憶は保証されないことが示唆された。見慣れた部屋の認識と正しい訪問済み部屋の特定のあいだにも隔たりがあった。別途提供される学習用データRS-30KでQwen3-VL-8Bを微調整すると全体正答率は35.5%から60.4%へ上がり、対応付けで最も大きく改善し、実生活のシーンにも及んだ。出典：arXiv","timestamp":1794851679000,"title":"Lost in the Hallway: Benchmarking Persistent Spatial Memory Across Revisits","titleJa":"廊下で迷子に――再訪をまたぐ持続的空間記憶のベンチマーク","url":"https://arxiv.org/abs/2611.21485"},{"authors":["Ruizhe Li","Licheng Zhang","Mingxuan Du","Zhendong Mao"],"categories":["cs.CL"],"field":"cs.CL","genre":"Agents / Robotics","monthKey":"2026-11","publishedAt":"2026-11-16T17:50:53Z","source":"arXiv","summaryHtml":"エージェントが過去の対話から記憶を引くとき、従来は現在の質問との類似度で探していた。しかし役に立つ記憶が質問に似ているとは限らない。本論文はこの前提を疑い、類似度検索をやめて、蓄えた記憶すべてを有用性で採点して並べ替えるJetrieverを提案する。採点には判定モデルJevを用い、各記憶が現在の質問に対してどれだけ決定的かを評価する。<br><br>間接的な問い125件のベンチマークInMindでは、正解のやり取りを1位に置けた割合が84.8%に達し、BM25の1.6%、MiniLMの0%を大きく上回った。証拠の発見と順位付けを分けた20問の比較では、JevとQwen3.5 9Bは50位までに正解の90%を発見したが、1位の精度はJevが85%、Qwen3.5 9Bが40%にとどまった。MemoryAgentBenchの60問でも、Jetrieverの4次元スコアは55.4%で、ReFindの44.3%を上回った。<br><br>全件採点のコストも低く、1問あたり平均でInMindが0.00834ドル、MemoryAgentBenchが0.03103ドルにとどまる。世界知識を活かした有用性評価と、決定的な記憶を先頭に置く採点が、安価な全件スコアリングで実現できることを示した。出典：arXiv","timestamp":1794851453000,"title":"Jetriever: Shifting Agent Memory Retrieval from Similarity to Utility","titleJa":"エージェントの記憶検索を類似度から有用性へ――Jetriever","url":"https://arxiv.org/abs/2611.21478"},{"authors":["Meng Tang","Siyuan Du","Yuxin Liu","Shuaishuai Cao","Di Wang","Haonan Guo"],"categories":["cs.CV","cs.AI"],"field":"arXiv","genre":"Vision / Multimodal","monthKey":"2026-11","publishedAt":"2026-11-16T17:42:12Z","source":"arXiv","summaryHtml":"超高解像度のリモートセンシング画像に対する質問応答では、全体像では小さな物体や局所的な属性が埋もれ、詳細な切り抜きは文脈を大量に消費するというジレンマがある。切り抜きを短い連続視覚潜在の系列に圧縮すれば、トークンを捨てたあともコンパクトな記憶が残るが、自然画像での診断研究ではモデルが潜在の内容を無視しがちで、解像度を落とした画像では失われる微細な対象を潜在が保持できるかは不明だった。<br><br>本研究は、領域選択と証拠保持を切り分けるため、高解像度の切り抜きを潜在メモリトークンに符号化し、凍結したバックボーンで予測への有用性と内容依存性を評価した。Qwen-VLの2世代にわたるLRS-GROでの評価では、64トークンのメモリが保持する切り抜きトークンを7.6〜9.9倍に圧縮し、全体画像だけと比べて精度が2.5〜4.8ポイント向上し、高解像度切り抜きの利得の大部分を回復した。XLRS-Benchでも一貫した挙動を示した。<br><br>別の画像や同じ場面の別領域のメモリに置き換えると精度が5.8〜7.4ポイント低下し、メモリを除くよりも悪くなったことから、予測は符号化された領域の証拠に依存していることが示された。コンパクトな視覚潜在は超高解像度リモートセンシングで有用な局所証拠を保持し、証拠の有無がその寄与を左右する鍵だと結論づけている。出典：arXiv","timestamp":1794850932000,"title":"Out of Sight, Into Memory: Compact Visual Latents Retain Local Evidence in Ultra-High-Resolution Remote Sensing","titleJa":"見えなくなっても記憶に残る――超高解像度リモートセンシングで視覚潜在が局所証拠を保つ","url":"https://arxiv.org/abs/2611.21457"},{"authors":["Roksana Goworek","Alexander Hickey","Federico Nanni","Martin O'Reilly"],"categories":["cs.CL","cs.AI"],"field":"cs.CL","genre":"LLM / NLP","monthKey":"2026-11","publishedAt":"2026-11-16T17:35:18Z","source":"arXiv","summaryHtml":"MITの報告によれば、フロンティア言語モデル「GPT-6 Astra」は小さなニューラルネットワークの重みを1回の返答で直接書き、重みだけからそのネットワークが何を学習したかを読み取れるという。本研究は3日間のスプリントでこの結果を再現・拡張した。重みの書き込みは再現し、Astraが書いたBreakout用のネットワークは514・550・307点で、MITの517点と同等だった。改変版のBreakoutでも同等の成績を示した。Claude Opus 5.5も動作するネットワークを書けたが、出力トークンを使い切ることが多かった。<br><br>新しいのはプログラムから重みへの翻訳そのものである。モデルはコードとして良い方策を書けるようになってから1世代遅れて、重みを書けるようになった。書かれたネットワークはコンパイル済みプログラムのように振る舞い、2つのモデルが独立にAstraのBreakoutネットワークをPythonへ逆コンパイルし、テストした全状態で行動が一致した。ただし手書き数字の分類では平均50%にとどまり、単純な分類器の82%を下回った。重みの読み取りはほぼ入力層の読み取りで、どのゲームかはほぼ完璧に当てたが、自作の3つのゲームでは盤上の配置は復元できても、ゲームの仕組みはほとんど読み取れなかった。<br><br>重みだけでの監査は可能だが浅い。コードを実行せずに、学習時に毒を混入された小規模言語モデルは10回中10回、追加学習で汚染されたものは10回中7回、悪意のあるアダプタは32件中23件を見抜いたが、トリガーや悪意ある挙動そのものは一度も特定できなかった。オープンウェイトモデルは後れを取っている。LLMは小さなネットワークを読み書きできるが、現状は手設計のプログラムのコンパイルと入力層の配置の読み取りに相当し、解釈可能性の有望だが初期の道具だという。出典：arXiv","timestamp":1794850518000,"title":"Replicating and Extending Weight-Space Programming: Frontier LLMs Compile Programs into Weights and Read Input Layers","titleJa":"重み空間プログラミング――フロンティアLLMはプログラムを重みにコンパイルする","url":"https://arxiv.org/abs/2611.21449"},{"authors":["Zhuoyang Li","Teng Shi","Jiakai Tang","Weijie Yu"],"categories":["cs.AI"],"field":"cs.AI","genre":"LLM / NLP","monthKey":"2026-11","publishedAt":"2026-11-16T17:28:45Z","source":"arXiv","summaryHtml":"推論で強化された生成推薦（GR）は、LLMの推論能力を次アイテム予測に活かす手法として注目されている。既存手法はGRPOで最終的な推薦性能で決まるルールベース報酬により推論を最適化するが、推論ステップごとの予測への寄与が最適化信号に直接反映されないこと、グループ内の異なる推論軌跡が区別できない報酬を受け取ること、という2つの限界がある。<br><br>本研究は予測利得（PG）で推論を最適化する訓練枠組み「GainReason」を提案する。PGは個々の推論文が目標セマンティックID（SID）の対数尤度をどれだけ変化させるかを測り、寄与を意識した識別的な報酬を与える。期待PGと推薦ランキング目的の整合性も理論的に示した。この信号に基づき、文レベルの報酬で推論生成を最適化するPGROと、効率的なPG計算のための因果的注意機構、推論条件付き予測を適応的に強化する補助タスクPGRUを開発した。<br><br>3つの公開ベンチマークでの広範な実験により、GainReasonは競合するベースラインを一貫して上回り、推論による大幅な性能向上を達成した。出典：arXiv","timestamp":1794850125000,"title":"Learning to Reason with Predictive Gains for Generative Recommendation","titleJa":"予測利得で推論を学ぶ生成推薦――文レベルの報酬によるGainReason","url":"https://arxiv.org/abs/2611.21441"},{"authors":["Hao Wang","Ting Huang"],"categories":["cs.AI","cs.SE"],"field":"arXiv","genre":"Agents / Robotics","monthKey":"2026-11","publishedAt":"2026-11-16T17:00:08Z","source":"arXiv","summaryHtml":"ハーネスはモデルを「タスクを完遂するシステム」に変える部品で、プロンプトを組み立て、ツールを与え、作業の完了を決める。ハーネスの比較ではモデルを固定し、モデルの比較ではハーネスを固定するのが常だった。本研究は両方を同時に変えた。市販のハーネス5種、成果物を生むタスク18件、0.75B〜4.7Bのローカル実行可能なオープンウェイトモデル4種と35.5Bのアンカーを組み合わせ、1つの決定論的チェッカーで360セルすべてを採点した。<br><br>完了を制御するハーネスMingbirdが、あらゆるサイズで最高の平均を記録した。事前登録した4つの対比較のうち2つがHolm補正後も有意で、16の対区間のうち13がゼロを除外した。ただし完了ゲート自体が効いているわけではない。6つの実行時チェックをすべて外しても平均はほとんど動かず、1つの反復ブロック規則を外すだけで0.75Bモデルでは0.411も落ち、18タスク中8件で成果物が出なくなった。ハーネスの効果は「進捗の効果」、すなわち実行がディスクに何かを残すかどうかを決める点にある。<br><br>357の有効セルのうち127セルは宣言した成果物を一つも残さず、そのうち85セルは正常終了していた。終了ステータスだけを読む採点器は、書かれていない仕事を評価してしまう。効果がサイズとともに増すか減るかは、4つの段では決着しなかった。出典：arXiv","timestamp":1794848408000,"title":"Harness Leverage Across Model Size: A Ladder of Five Local Agent Harnesses from 0.75B to 4.7B","titleJa":"ハーネスの差はモデルサイズを越えるか――5種のローカル・エージェント・ハーネスの比較","url":"https://arxiv.org/abs/2611.21407"},{"authors":["Zi Wang","Mahima Pushkarna"],"categories":["cs.AI","cs.HC"],"field":"arXiv","genre":"Ethics / Safety","monthKey":"2026-11","publishedAt":"2026-11-16T16:58:58Z","source":"arXiv","summaryHtml":"創作メディア生成のAIは人間の能力を広げる一方で、主体感を損なうおそれがある。核心の問題はアンカリングで、洗練された生成物に思考が引き寄せられ、ユーザーの役割が能動的な執筆から受動的な編集へ移ってしまう。本研究は、生成前にAIの解釈を点検・修正・誘導できる「生成前信念コントロール」を提案し、最初の錨を人間が置くことをめざす。<br><br>4つの設計原則を定式化し、初期の概念立案と試作のためのシステムProactive Co-Creator（PaCC）に実装した。PaCCは仮定と不確実性を、質問、信念グラフ、メディア属性のかたちで能動的に提示し、最終成果物を生成する前にユーザーがAIの信念を形づくるよう促す。小規模・単群の探索的なユーザー調査では、参加者は慣れたプロンプト型ツールと比べて主体感とプロセス制御が方向性として向上したと報告し、提示された仮定が見落としていた細部を考える助けになったという。一方、所有感や著者性についての感じ方は分かれた。<br><br>生成物の質ではなく生成前の関与に着目する点が特徴で、創作AIの設計に「信念を先に共有する」という視点を持ち込む。調査は小規模の探索段階であり、効果の一般化にはさらなる検証が要る。出典：arXiv","timestamp":1794848338000,"title":"Shaping AI's Beliefs Before It Generates: Human Sense of Agency in Creative AI","titleJa":"生成の前にAIの「思い込み」を形づくる――創作AIにおける人間の主体感","url":"https://arxiv.org/abs/2611.21405"},{"authors":["Jason Alexander","Yuxuan Li","Michael Licamele","Wesley Hanwen Deng","Sauvik Das"],"categories":["cs.CY"],"field":"cs.CY","genre":"Ethics / Safety","monthKey":"2026-11","publishedAt":"2026-11-16T16:36:47Z","source":"arXiv","summaryHtml":"LLMの暗黙のバイアスは、採用や知能評価といった注目度の高い一度きりの判断場面では示されてきた。しかし自律的なLLMエージェントが日々のタスクで人の代わりに判断する時代には、社会人口学的仮定に基づくバイアスが日常の判断場面にどう現れるかを理解することが重要だ。<br><br>本研究は米国時間利用調査（ATUS）の17の日常活動領域を用い、異なる人種・性自認・政治的イデオロギーのペルソナを与えたLLMが有意な暗黙のバイアスを示した506の判断シナリオの「アトラス」を作成した。次にクラウドソーシング監査で500人が8,010回の二択を行い、どのバイアス場面をさらに検討すべきかを選んだ。<br><br>参加者は、広い関連性（食の選択など）、重大性（健康など）、シミュレーションされた社会人口学的グループ全員が全会一致で判断した場面（ステレオタイプの明確な兆候）を優先した。格差の大きさやATUS領域にはあまり左右されなかった。優先の理由を調べると、参加者は格差を人口集団の特性と解釈し、それがもっともらしいかを自分の内面化したステレオタイプで判断することが多かった。出典：arXiv","timestamp":1794847007000,"title":"A Crowd-Audited Atlas of Implicit Bias in LLM-Powered Agents","titleJa":"LLMエージェントの暗黙のバイアス地図――506の日常判断シナリオのクラウド監査","url":"https://arxiv.org/abs/2611.21376"},{"authors":["Lennard Naumann"],"categories":[],"field":"SocArXiv","genre":"LLM / NLP","monthKey":"2026-11","publishedAt":"2026-11-16T15:49:02Z","source":"OSF Preprints","summaryHtml":"党派間の敵意や回避は民主社会の懸念材料だが、短い会話でそれを和らげられるだろうか。本研究は、対面での説得研究で確立された2つの手法――相手の視点に立つ「視点取得」と、相手の道徳的枠組みに訴える「道徳的再構成」――を実装した大規模言語モデルチャットボットとの対話を検証した。ドイツのオンライン標本1,634人を対象とした事前登録済みの2×2要因実験で、1週間後の追跡調査には1,294人が回答した。<br><br>結果として、道徳的再構成チャットボットとの対話は、その後1週間の対立党派との議論の自己報告を増やした（0.10標準偏差）。どちらのチャットボットも、後日人間の対立党派と議論する研究への参加登録を増やした（0.13〜0.17標準偏差）。視点取得チャットボットは直後の政策態度を相手側へ0.09標準偏差だけ動かしたが、その変化は1週間以内に消えた。<br><br>一方で、どちらのチャットボットも対立党派への感情や回避的な選好そのものは変えなかった。著者は、短いチャットボット対話は感情を変えずとも、党派を越えた接触への第一歩として機能しうると結論づけている。出典：OSF Preprints","timestamp":1794844142000,"title":"AI chatbot conversations reduce behavioral avoidance of political opponents without changing feelings toward them","titleJa":"AIチャットボットとの対話は政治的対立相手への回避を減らす――感情は変わらないまま","url":"https://osf.io/preprints/socarxiv/bc9ye_v1/"},{"authors":["Yu Yao","Jiayi Dong","Yilun Du"],"categories":["cs.AI","cs.CL","cs.MA"],"field":"cs.AI","genre":"Agents / Robotics","monthKey":"2026-11","publishedAt":"2026-11-16T15:28:04Z","source":"arXiv","summaryHtml":"マルチエージェント推論を、複数のエージェントがそれぞれ持つ暗黙の信念の動力学が、集団としての均衡を探す過程として捉え直す。提案するStream of Belief（SoB）では、各エージェントが連続的な潜在信念を保持し、他のエージェントとの対話と自らの内省を通じて、その信念を繰り返し精緻化していく。個々のエージェントの出力を集計するのではなく、信念そのものの変化を中心に置く枠組みである。<br><br>SoBが目指すのは、それ以上の対話を重ねても意味のある情報伝播がもう生じなくなるような、集団の信念状態である。信念が安定した均衡に達した時点で、集団としての結論が定まったとみなす。幅広い実験により、SoBはタスクとモデルファミリーを越えて汎化することが示されたという。<br><br>この結果は、マルチエージェント推論のスケーリングを信念の動力学という視点から考える新しい見方を提示する。ただし要約（アブストラクト）には具体的な数値やベンチマーク名の記載がなく、効果の大きさや適用範囲の詳細は原論文の本文に譲られている。出典：arXiv","timestamp":1794842884000,"title":"Stream of Belief: Eliciting Collective Intelligence through Latent Belief Dynamics","titleJa":"信念の流れ――マルチエージェント推論を潜在的信念の動力学として捉える","url":"https://arxiv.org/abs/2611.21250"},{"authors":["Jinwei Hu","Qisong He","Xinmiao Huang","Youcheng Sun","Yi Dong","Xiaowei Huang"],"categories":["cs.AI","cs.CL","cs.MA","cs.SI"],"field":"cs.AI","genre":"Ethics / Safety","monthKey":"2026-11","publishedAt":"2026-11-16T15:20:18Z","source":"arXiv","summaryHtml":"言語モデルエージェントの信念は、ソーシャルメディアのようなオープンなチャネルを通じて操作されうる。受け取る情報が真実であっても、断片のあいだをエージェントが自ら関係づけて補うと、その関係を既成事実として受け入れ、他者に噂として伝えてしまう。本研究はこの失敗を「物語的過剰適合」と呼び、認知理論と映画理論のモンタージュにならったGenerative Montageで再現する。<br><br>6件のTwitterイベントから得た1,090件の噂ターゲットで検証したところ、14モデルのうち12モデルで噂の受容率が65%を超えた。多数決や同じ証拠の再検討の後でも受容率は50%を上回り、誤りが下流の意思決定に届くことを示した。断片への介入で信念に影響する投稿を特定し、合成対照により、信念への影響と証拠による裏づけを分離できることも示した。<br><br>対策として、直接の証拠による裏づけを確認するニューロシンボリックな実行時モニタ「Grounded Monitor」を提案し、意思決定の精度を5.6〜29.0ポイント改善した。推論された関係を監視することが、エージェントの結論が公共の意思決定を導く前に必要だと結論づける。出典：arXiv","timestamp":1794842418000,"title":"Language-model agents' beliefs can be manipulated via truthful evidence in open channel","titleJa":"真実の情報でもエージェントの信念は操作される――オープンなチャネルからの物語的過剰適合","url":"https://arxiv.org/abs/2611.21235"},{"authors":["Hua Zhang","Min Jiang"],"categories":["cs.RO","cs.AI"],"field":"cs.RO","genre":"Agents / Robotics","monthKey":"2026-11","publishedAt":"2026-11-16T14:07:45Z","source":"arXiv","summaryHtml":"LLMエージェントはリモートのツールやクラウドのサンドボックスを使えるようになったが、推論とセッション状態、実行場所の統合は依然として設計上の課題だ。本研究は、実行場所をモデルやツール、文脈と並ぶ設定可能な次元として扱う、自己ホスト型のHTTPサービス兼組み込み可能なPythonランタイム「Linglong Agent Service（agentsvc）」を提案する。<br><br>親サービスが推論の編成やツール記述、会話履歴を保持し、推論リクエストごとにファイル・シェル・ターミナル・MCP操作を行う子環境を一つ選ぶ。直接のHTTPと子側発信のWebSocketトンネルが同じ応用インタフェースを運び、移植可能なリクエスト文脈と集中管理された更新も備える。通常のコア経路にサードパーティ製Pythonパッケージは不要で、Windowsの疑似端末依存は任意だ。オンライン・デバッガも実行場所分離の特殊例として示され、例外の証拠を提出したプログラムが、障害発生中のプロセス内でセッション限定の検査ツールを実行し、同じ診断セッションを再開する。<br><br>設計は制約付き期待効用推論で説明され、Hermes AgentやPi、Codex、Claude Codeとの具体的な仕組みの比較や、実装と回帰テストの証拠も報告されている。ただし現時点の証拠が示すのは実行可能な契約であり、性能上の優位や修復精度、本番環境での復旧は確立されていない。ソースコードはMITライセンスで公開されている。出典：arXiv","timestamp":1794838065000,"title":"Linglong Agent Service: A Runtime for Centralized Agent Reasoning and Distributed Execution","titleJa":"Linglong Agent Service――集中推論と分散実行のためのエージェントランタイム","url":"https://arxiv.org/abs/2611.21129"},{"authors":["Zhe Ren","Guowei Rong","Yimeng Chen","Nanbo Li","Piotr Piękos","Mateusz Ostaszewski","Dandan Guo","Jürgen Schmidhuber"],"categories":["cs.CL","cs.NE"],"field":"cs.CL","genre":"Agents / Robotics","monthKey":"2026-11","publishedAt":"2026-11-16T13:05:46Z","source":"arXiv","summaryHtml":"自己改善するコーディングエージェントは、下流タスクでの実行結果を手がかりに候補を選ぶ「評価して選ぶ」方式で強い性能を出してきた。だが評価シグナルを得るには進化したエージェントを繰り返し実行する必要があり、探索を広げるほどコストが増し、固定の評価分布への過剰適応も招く。本研究は、進化のループ内で下流タスクの評価を使わずに自己改善できるかを問う。<br><br>提案するELITE（Explore-then-Integrate）は、単一の子孫を選ぶのではなく実装の仕組みを統合する。各世代で多様な改善を提案し、同じ親から独立に実装して、仕組みの相補性・重複・競合を点検したうえで、両立する部分集合を1つの子孫として再実装する。ループ内では下流タスクの結果や軌跡を使わず、構造と動作の妥当性の決定論的な検査だけを用いる。<br><br>SWE-bench Proでは初期エージェントが60.0%から85.6%へ改善し、評価を使うDarwin Gödel Machineの86.7%、Huxley-Gödel Machineの88.3%に迫った。壁掛け時間はそれぞれ8.8倍・3.2倍短縮された。適応なしの転移ではSWE-bench Verifiedで平均73.3%、Polyglotで69.3%だった。評価なしの自己改善が可能であることを示した。出典：arXiv","timestamp":1794834346000,"title":"Evaluation-Free Recursive Self-Improvement for Coding Agents","titleJa":"評価なしで自己改善するコーディングエージェント――ELITE","url":"https://arxiv.org/abs/2611.21056"},{"authors":["K2 Team","Zhengzhong Liu","Haonan Li","Xuezhe Ma","Alexander Moreno","Subham Sekhar Sahoo","Rupesh Kumar Srivastava","Mikhail Yurochkin","Hadi Abdine","Yash Akhauri","Adharsh Babu","David Bellamy","Jalaj Bhandari","Dani Bouch","Wail Bouhedja","Weili Cao","Ahmad Chamma","Po-Chun Chang","Junlin Chen","Lingjie Chen","Zhoujun Cheng","Kyle Chickering","Ryandito Diandaru","Evan Dufraisse","Chaitanya Dwivedi","Bilal El Bouardi","Desai Fan","Richard Fan","Chengqian Gao","Rifo Ahmad Genadi","Jonathan Geuter","Charles Guille-Escuret","Willis Guo","Dhawal Gupta","Seungwook Han","Tingxu Han","Shibo Hao","Besher Hassan","Guowei He","Ming Shan Hee","Joel Hestness","Yu Huang","Yuan Huang","Haolong Jia","Linghao Jin","Junu Kim","Lingjing Kong","Nurkhan Laiyk","Andrej Leban","Liqun Ma","John Maggs","Amr Mohamed","Mukhesh Narra","Omkar Pangarkar","Aldo Pareja","Khiem Pham","Varad Pimpalkhute","Nikhil Ranjan","Elizaveta Rebrova","Hector Ren","Shaurya Rohatgi","Guokan Shang","Jianshu She","Chufan Shi","Aaryamonvikram Singh","Daria Soboleva","Kartik Sreenivasan","Suqi Sun","Yuekai Sun","Bowen Tan","Liping Tang","Shengkun Tang","Muzi Tao","Mallikarjuna Tupakula","Micah Villmow","Hongyi Wang","Huijuan Wang","Renxi Wang","Yongxin Wang","Yuqi Wang","Zhenting Wang","Shicheng Wen","Yingquan Wu","Anze Xie","Andrew Xing","Matthew Yang","Shuanghai Yu","Kerem Zaman","Zenan Zhai","Hongli Zhan","Xuezhou Zhang","Anshun Asher Zheng","Zhe Zhou","Richard Zhuang","Eric P. Xing"],"categories":["cs.AI"],"field":"cs.AI","genre":"LLM / NLP","monthKey":"2026-11","publishedAt":"2026-11-16T12:28:03Z","source":"arXiv","summaryHtml":"0.9Bの密モデルから375B-A23BのMoEまで、汎用的な推論とエージェント作業に向けて設計された6つの完全オープンな言語モデル群K2-Horizonが発表された。数学・科学、ソフトウェア工学、深い調査、事務自動化など幅広い用途を想定し、同規模の強力なオープンモデルと肩を並べるか上回る性能を、エージェント系とコーディングのベンチマークで示した。<br><br>推論強化のため、注意の値射影にMoEを適用するMixture-of-Value Attention（MoVA）と、理論に裏づけられた柔軟なゲートであるsoftplus attention gatingを導入した。36B-A4Bモデルは両方を用い、同じデータで学習した32B密モデルの性能にほぼ並びながら、活性パラメータは7分の1にとどまる。さらに、別のドラフトモデルなしに復号を最大2.2倍高速化するロスレス拡散アダプタUnoも発表した。<br><br>公開はLLM360のオープンソース定義に従い、学習の全段階の中間チェックポイント、事前学習データ、学習ログ、学習・評価・基盤の全コードを含む。約10Tトークンの合成事前学習データを生んだパイプラインも含め、モデル開発の過程そのものを詳細に文書化して公開した。4モデルは22Tトークンの事前学習コーパスとレシピを共有し、規模と疎性の統制された研究を可能にする。出典：arXiv","timestamp":1794832083000,"title":"K2-Horizon: A Frontier Fleet of Open Source Language Models","titleJa":"フロンティア級オープン言語モデル群「K2-Horizon」――0.9Bから375Bまで6モデル","url":"https://arxiv.org/abs/2611.21003"},{"authors":["Yong Liu","Zhanpeng Shi","Peicong Lin","Zhenyi Zhong","Yizhou Dang","Wendi Wu","Haoling Li","Shuangjia Zheng"],"categories":["q-bio.QM","cs.AI"],"field":"cs.AI","genre":"LLM / NLP","monthKey":"2026-11","publishedAt":"2026-11-16T12:17:37Z","source":"Hugging Face Papers","summaryHtml":"生体分子の基盤モデルはタンパク質やその複合体の構造を正確に予測し、大規模言語モデル（LLM）は自然言語で推論する。しかし両者は分離されたままで、前者の能力は汎用LLMの一部ではなく、後者の推論は構造予測に入り込まない。本研究は、タンパク質や複合体を折りたたみ、配列と構造を理解し、言語推論が予測する構造に影響する、一つの汎用モデルを目指すCalphaを提案する。<br><br>本報告はその第一歩として、LLMが単鎖タンパク質の構造を出力する段階を扱う。Qwen3.5-9BがESM2の残基特徴で豊かにした配列を読み、テキストで応答するか、事前学習済みのSimpleFold構造ヘッドを呼び出すトークンを出す。ヘッドはQwenの残基状態を通じてのみタンパク質の情報を受け取る。固定した折りたたみ要求の下で、平均TMスコアはFoldBench-334開発セットで0.808、CASP16ドメインで0.635、CAMEO様のPDBセットで0.900だった。<br><br>ESM2-3Bが配列を符号化し微調整済みSimpleFold-3Bヘッドが座標を予測するベースラインとの比較では、100〜299残基の鎖では3つの信頼区間がすべてゼロを含み、300〜600残基では平均差が−0.044、−0.160、−0.025だった。別途の試験では4種の英語の要求が評価した全例で折りたたみを起動した。タンパク質学習により350項目のMMLU-Pro部分集合の正答率は77.4%から70.3%へ下がった。複合体予測や構造理解、言語推論が予測座標に与える影響は今後の課題だとする。出典：Hugging Face Papers","timestamp":1794831457000,"title":"Calpha: Toward Native Biomolecular Intelligence in a General-Purpose Language Model","titleJa":"Calpha――汎用言語モデルにおける生体分子知能へ","url":"https://arxiv.org/abs/2611.20986"},{"authors":["Renata Topinkova","Carsten Schwemmer"],"categories":[],"field":"SocArXiv","genre":"Agents / Robotics","monthKey":"2026-11","publishedAt":"2026-11-16T12:13:17Z","source":"OSF Preprints","summaryHtml":"オンライン調査は人間の回答を前提に成り立っているが、簡単な指示一つでウェブサイトを操作し課題を遂行するエージェント型ブラウザの登場が、その前提を揺るがしている。本研究は市販のエージェント型ブラウザ3種に「このアンケートに回答して」という一言の指示だけを与え、オンライン調査を遂行できるか、既存の検出・防止策が通用するかを検証した。<br><br>エージェントはほとんど人間の入力なしに調査を完了し、割り当てられた人口統計学的プロフィールも維持した。技術的なスクリーニング、可視・不可視CAPTCHA、AI専用のプロンプトインジェクション検査、長期調査での回答の一貫性、単一指示による複数調査の完了を試したが、プロンプト漏洩や脱獄風の検査はすべて通過し、ブラウザのメタデータから自動参加を見抜くこともできなかった。不可視reCAPTCHAは一部のブラウザに一貫して突破され、可視reCAPTCHAが最も強い障壁だったものの、解けてしまう場合や人間に制御を戻す場合もあった。<br><br>広く入手可能なAIエージェントが、人間参加者向けの課題を代行し、一見筋の通ったもっともらしい回答を生み出せることが示された。人間が生成したはずのデータが本当に人間によるものかをどう検証するかという、研究の信頼性に関わる問いが浮かび上がる。出典：OSF Preprints","timestamp":1794831197000,"title":"\"Fill Out this Survey\": Capabilities and Detection of Agentic Browsers","titleJa":"「このアンケートに回答して」：エージェント型ブラウザの能力と検出","url":"https://osf.io/preprints/socarxiv/tc5zq_v3/"},{"authors":["Marc Gielen","Daniela Duarte Domingues","Eric Burguière","Kevin Swierkosz-Lenart","Luc Mallet"],"categories":["q-bio.NC"],"field":"arXiv","genre":"Psychedelics / Trauma","monthKey":"2026-11","publishedAt":"2026-11-16T10:15:20Z","source":"arXiv","summaryHtml":"近年、セロトニン作動性サイケデリクスへの関心が再燃している。本稿はうつ病と強迫性障害（OCD）の治療薬の分子機序に立ち入り、選択的セロトニン再取り込み阻害薬（SSRI）の臨床効果がセロトニントランスポーター（SERT）の阻害だけでは説明しきれないと論じる。うつ病やOCDを治療するのに必要な投与量は、SERTよりはるかにSSRIへの親和性が低い標的が主要な作用点であることと整合するという。<br><br>その候補として、抗うつ効果を持つ薬物の推定標的として近年報告されたチロシン受容体キナーゼB（TrkB）が挙げられる。TrkBは抗うつ薬の治療効果を理解する統一的な枠組みになりうる。SERT阻害だけの説明では投与量と効果の関係が合わず、薬物動態と薬力学の両面から、親和性の低い標的こそが臨床効果の鍵を握る可能性が示される。<br><br>この仮説はサイケデリクスの治療可能性にも薬理学的な示唆を与える。セロトニン作動性と呼ばれてきた薬物の作用をTrkBの観点から捉え直すことで、抗うつ薬とサイケデリクスの共通基盤と相違がより明確になる。出典：arXiv","timestamp":1794824120000,"title":"From antidepressants to psychedelics: revisiting the pharmacology of so-called serotoninergic treatments","titleJa":"抗うつ薬からサイケデリクスへ――いわゆるセロトニン作動性治療の薬理学を問い直す","url":"https://arxiv.org/abs/2611.20834"},{"authors":["Christophe Denis"],"categories":["cs.AI"],"field":"arXiv","genre":"Consciousness / Philosophy","monthKey":"2026-11","publishedAt":"2026-11-16T10:09:08Z","source":"arXiv","summaryHtml":"人工的な会話エージェントとのやり取りは会話のシミュレーションにすぎない、という主張は、活動の観察可能な特徴を再現することと実際にその活動を行うこととの区別に依拠する。この区別は物理現象には当てはまっても、言語的・記号的な活動への適用は単純ではない。本論文は、大規模言語モデル（LLM）によるエージェントとの会話は真の会話活動であり、単なる模倣ではないと論じる。ただし意識や主観的理解、人間的な意図を人工システムに帰属するわけではない。<br><br>会話を参加者の内在的な性質だけで定義することの限界を検討したうえで、関係論的・記号論的な会話の説明を展開する。言語語用論に加え、ラカンの鏡の理論、ボードリヤールのシミュラークル、シモンドンの個体化の哲学、パースの記号論を手がかりに、会話的相互作用の現実性と、人工的主観性の見かけや、生成される意味の認識的妥当性とを区別する。<br><br>議論は「ハイブリッド記号的制作」という概念に集約される。意味づくりは人間と人工物の参加者に分散した過程として捉えられ、会話の現実性を参加者の内面ではなく相互作用の関係性に求める視点が提示される。出典：arXiv","timestamp":1794823748000,"title":"Conversing with a Conversational Agent: A Real Conversation, Not a Simulated One","titleJa":"会話エージェントとの対話は本物の会話か――シミュレーションではないとする哲学的擁護","url":"https://arxiv.org/abs/2611.20826"},{"authors":["Kangwen Zhao","Jianfeng Cai","Ruopei Sun","Mingxiao Feng","Peng Zhang","Wengang Zhou","Houqiang Li"],"categories":["cs.AI"],"field":"cs.AI","genre":"Agents / Robotics","monthKey":"2026-11","publishedAt":"2026-11-16T08:40:29Z","source":"arXiv","summaryHtml":"LLMエージェントはツールを繰り返し試行することで課題の品質を高められるが、改善の見込みが薄い試行を続ければコストだけが膨らむ。試行を重ねれば最良の結果は改善しうるが、すでに最良の結果を超える見込みが低い試行は無駄になる。本研究は、タスク単位のBest-of-N品質を保ちつつ、実行をいつ打ち切るかを決める制御手法GainCtrlを提案する。軽量なCPU予測器が対話履歴から期待できる利得を推定し、較正済みの閾値で停止を判断する。<br><br>3つの環境と3つのLLMアクターを用いた軌跡再生による評価では、GainCtrlは同等の目標品質においてベースラインより少ないトークンで済んだ。固定の打ち切り方針でも、完全な実行に近い品質を保ちつつトークン消費を大幅に減らせた。予測器は単一CPUスレッドでミリ秒単位の遅延で動作する。<br><br>LLM内部へのアクセスを必要とせず、繰り返し監視できる点が特徴だ。実行中の監視を繰り返しても計算負荷は小さく、エージェントの実行コストを抑えながら品質を維持するための実用的な停止制御の枠組みを示している。出典：arXiv","timestamp":1794818429000,"title":"GainCtrl: Predicting Remaining Gains for Efficient LLM Agent Execution","titleJa":"GainCtrl――LLMエージェントの実行を効率化する残存利得予測","url":"https://arxiv.org/abs/2611.20736"},{"authors":["Sachin Gupta"],"categories":["cs.AI","cs.LG"],"field":"cs.AI","genre":"Agents / Robotics","monthKey":"2026-11","publishedAt":"2026-11-16T08:19:25Z","source":"arXiv","summaryHtml":"ツールが失敗した後、エージェントは回復の助言を受けて課題を完遂できるのか。本研究は、隔離されたGitLab環境でLangGraphとCrewAIのエージェントに課題を解かせ、ツールエラーを注入して回復を評価するベンチマークAgentFaultBenchを提案する。成果物とイシュー、必要な読み取りや検証、最終応答までを状態で検証する。<br><br>1,944回の計画実行による主比較では、助言の有無による成功率の変化は−8.33、0.00、＋1.06ポイントとまちまちで、欠損のため後二者は結論が出なかった。改訂した回復方針ではGPT-4o miniが改善し、SolとClaudeは回復可能な事例を既に完遂していた。別途624回の実験では、助言ありで161/192件が正しい最終状態に達し、助言なしの142/192件を上回った。ただし効果は一様ではなく、条件によって変わることが示唆された。<br><br>イシューIDの除去による影響は小さく、第二のチェッカーも概ね一致した。著者らは、回復の助言は効果を前提とせず、明示的な対照条件と比較して検証すべきだと結論づけている。出典：arXiv","timestamp":1794817165000,"title":"AgentFaultBench: State-Verified Evaluation of Tool-Fault Recovery","titleJa":"AgentFaultBench――ツール障害からの回復を検証する評価基盤","url":"https://arxiv.org/abs/2611.20711"},{"authors":["Wenhan Yu","Zhaoxi Zhang","Zhilong Tan","Weikang Li","Lei Sha"],"categories":["cs.AI","cs.CV","cs.MM"],"field":"cs.AI","genre":"Vision / Multimodal","monthKey":"2026-11","publishedAt":"2026-11-16T07:52:01Z","source":"arXiv","summaryHtml":"動画編集では、視聴覚の観察と精密な時間位置の把握に基づく判断と、描画結果の評価が求められる。本研究は、追加のモデル学習なしに汎用コーディングエージェントを動画ポストプロダクションで使えるようにする視覚ハーネスVIVIDを提案する。オンデマンドの映像検査、音声分析、文字起こしのツールを提供する。<br><br>観察結果は対応するメディア版と時間座標とともに保存され、エージェントは推論しながら能動的に取り出せる。編集はエージェント本来のコーディングとシェル操作で行い、描画出力を確認して次の修正に活かす。編集の判断は映像と音声の両方の観察に基づく。100課題からなるAgenticVBenchでは、Codexと組み合わせて平均58.6%を記録し、素のCodexを20.2ポイント上回った。<br><br>Claude Codeでは55.1%、OpenCodeでは37.1%と、いずれも素の性能を大きく上回った。学習済みモデルを追加することなく既存のコーディングエージェントをそのまま活用できる設計で、汎用コーディングエージェントの能力を動画編集へ拡張する再利用可能なハーネスの可能性を示している。出典：arXiv","timestamp":1794815521000,"title":"VIVID: A Visual Harness for Agentic Video Editing","titleJa":"VIVID――エージェント型動画編集のための視覚ハーネス","url":"https://arxiv.org/abs/2611.20688"},{"authors":["Benhao Huang","Chaitanya Dwivedi","Xuezhe Ma","Alexander Moreno","Hector Liu"],"categories":["cs.LG"],"field":"cs.LG","genre":"LLM / NLP","monthKey":"2026-11","publishedAt":"2026-11-16T02:05:32Z","source":"arXiv","summaryHtml":"高品質データが枯渇すると、同じデータを何周も学習させるのが常套手段だが、繰り返しの価値は逓減する。各トークンの最上層の状態を次トークンの入力に送り返す「潜在フィードバック」も計算の使い方の一つだが、同じ計算量をエポック増に使う通常のTransformerと対等に比べられたことはなかった。本研究はモデル規模・固有データ量・エポック数の組み合わせを網羅し、両モデルを各条件で最適に調整して比較した。<br><br>固有データがモデル規模に対して乏しい場合を除き、潜在フィードバックはFLOPとトークンの効率を高めた。固有データを固定すれば同じ損失により少ない計算量で到達し、エポック数を固定すれば同じ損失により少ない固有データで到達する。節約効果は固有データ量と繰り返し回数が増えるほど大きくなり、下流タスクでも一致した。両モデルに共通のスケーリング則を当てはめると、潜在フィードバックはパラメータ数の多いTransformerと等価に振る舞い、60M〜271Mパラメータで適合させた法則が778Mモデルの損失を0.3%以内で予測した。<br><br>最大で計算量48%、固有データ47%の節約となった。データが制約になる局面では、潜在フィードバックが同じ規模のモデルにとってFLOPのより良い使い道になることを示した。出典：arXiv","timestamp":1794794732000,"title":"Latent Feedback Is a Compute and Data Amplifier","titleJa":"潜在フィードバックは計算とデータの増幅器――同じFLOPのより良い使い道","url":"https://arxiv.org/abs/2611.20404"},{"authors":["Emilio Ferrara"],"categories":["cs.CV"],"field":"cs.CV","genre":"Vision / Multimodal","monthKey":"2026-11","publishedAt":"2026-11-16T01:24:42Z","source":"Hugging Face Papers","summaryHtml":"最近のマルチモーダルモデルは場面を流暢に記述し、教科書の物理問題も解く。そのため、坂や振り子、シーソー、ドミノが並ぶ場面の静止画を見て、玉を押したあと何が起きるかも予測できるはずだと考えられがちだ。本研究はその主張を検証するため、物理シミュレータが結果を計算する2次元剛体シーンの静止画からなるベンチマークDominoBenchを構築した。<br><br>854項目を427の最小ペアで構成し、一つの量を1〜3グリッド分変えるだけで一人の生死が決まる。各項目には、結果を決める計算に至る4段階のヒントが付く。10系統30モデルを評価した結果、支援なしではAnthropic、Google、OpenAIの最先端モデルでも、運命が反転する人物の正答は最大72%、ペアの両方を正しく答えられたのは最大34%にとどまった。決め手の段階を指し示しても改善は小さく、正確な幾何をテキストで与えてもほとんど変わらなかった。<br><br>一方、決め手となる計算と、静止画には写らない速度などの必要な量を書き出すと、同じモデルは82〜92%に達した。小規模なオープンウェイトモデルはほぼ偶然の水準にとどまった。つまり物理予測は定量的な段階で失敗しており、最強のモデルも決め手の量を与えられれば使えるが、自ら生み出せない。物理世界で計画・行動するモデルには、場面の流暢な説明は正しい予測の証拠にならないことを示す結果だ。出典：Hugging Face Papers","timestamp":1794792282000,"title":"DominoBench: Evaluating Multi-Step Physical Reasoning from Still Images","titleJa":"DominoBench――静止画からの多段階物理推論の評価","url":"https://arxiv.org/abs/2611.20385"},{"authors":["Octavio Islas Carmona","Amaia Arribas Urrutia"],"categories":[],"field":"Online Media and Global Communication","genre":"Consciousness / Philosophy","monthKey":"2026-11","publishedAt":"2026-11-16T00:00:00Z","source":"Crossref","summaryHtml":"AIは人間の「副操縦士」から、自律的にふるまうエージェントへと移行しつつある。本論文はメディア・エコロジーの視点から、この変化が人間のアイデンティティ、著者性、思考の自律性をどう組み替えるかを分析する。火の制御から現在までの人間とインターフェースの進化をたどり、マクルーハンのテトラッドでAIが何を拡張し、何を陳腐化し、何を取り戻し、何へ反転するかを診断する。<br><br>著者らはAIを脳処理の外部層「エクソコーテックス」と呼ぶ。AIは決定や趣味、分析を形作り直し、従来のメディアが人間の反映であったのに対し、文化や物語を自律的に生み出すモデルへと変わった。ニューラルネットワークのブラックボックス性は司法や医療など重要分野での透明性と監督を妨げ、判断はアルゴリズムへと委ねられ、人間の批判的判断は次第に麻痺していくという。<br><br>判断と技術的労働を機械に委ねれば、人間の批判力と創造力は萎縮するおそれがある。AIは言語という文明のOSをハックし、「真実」をアルゴリズムの副産物に変える「現実の泡」を生む。効率の独裁が民主的制度の応答能力を上回るなか、著者らは「選択的切断の倫理」を提唱し、不完全さや曖昧さ、沈黙を守るべき人間の要素として擁護する。出典：Crossref","timestamp":1794787200000,"title":"From extension to the reconfiguration of the human: artificial intelligence as an environment in media ecology","titleJa":"AIは人間の「拡張」から「再構成」へ――エージェント化するAIとメディア・エコロジー","url":"https://doi.org/10.1515/omgc-2026-0022"},{"authors":["Maruša Ferjan","Marina Trkman"],"categories":[],"field":"Journal of Information, Communication and Ethics in Society","genre":"Ethics / Safety","monthKey":"2026-11","publishedAt":"2026-11-16T00:00:00Z","source":"Crossref","summaryHtml":"生成AIの急速な普及は大きな機会をもたらす一方で倫理的な懸念も呼ぶ。AI倫理の指針や理論枠組みでは「善行」と「無害」という二つの原則が、生成AIの開発と利用を最大の価値と最小の害へ導くものとされる。だが一般の人々がこれらをどう受け止めているかは十分に分かっていなかった。<br><br>本研究は生成AIシステムに対する「知覚された善行」と「知覚された無害」の二つの構成概念を測る尺度を開発・検証した。若年成人を対象とした探索的因子分析では2因子構造が得られ、分散の約64%を説明した。EU在住の成人を対象とした確認的因子分析でも2因子構造が確認され、標準化負荷量はすべて0.70を超えた。<br><br>開発された尺度は、構造モデルに組み込んでさまざまな利用文脈における生成AIの利用行動を分析できる実用的な手段だ。政策立案者が利用者の受け止めをより深く理解し、生成AIの開発と利用を統治するより堅固な政策を設計する助けになると著者らは述べる。倫理原則を人々の実感に即して測る試みとして、AIガバナンスの議論にもつながる。出典：Crossref","timestamp":1794787200000,"title":"Scales to measure the perceived beneficence and non-maleficence of generative artificial intelligence systems","titleJa":"生成AIは「善い」か「害がない」か――人々の受け止めを測る尺度の開発と検証","url":"https://doi.org/10.1108/jices-11-2025-0319"},{"authors":["Askar Garad","Hosam Alden Riyadh","Abdullah M. Al-Ansi","Mohammed Jaboob","Ali Ateeq"],"categories":[],"field":"Journal of Information, Communication and Ethics in Society","genre":"Ethics / Safety","monthKey":"2026-11","publishedAt":"2026-11-16T00:00:00Z","source":"Crossref","summaryHtml":"AIは気候モデリングや予測、エネルギー最適化、廃棄物管理、生物多様性保全、水資源管理など、環境サステナビリティの幅広い領域に応用されている。本論文は査読付き研究の構造的な文献レビューを通じ、AIの活用実態と倫理・ガバナンス上の論点を整理した。AIは主に予測・監視・最適化・モデルにもとづく意思決定といった分析機能を担っている。<br><br>ただしAIの導入が自動的に持続可能性をもたらすわけではない。AIシステム自体のエネルギー需要、インフラの整備状況、ガバナンス能力、透明性・公平性・説明責任をめぐる倫理的懸念が、成果を左右する条件になる。著者らはAIを「本質的に持続可能な技術」ではなく、条件付きの実現手段として捉えるべきだと論じる。<br><br>政策への示唆として、AIガバナンスへの持続可能性基準の組み込み、気候関連AIの透明性・説明責任の強化、エネルギー効率を重視する「グリーンAI」の推進、能力開発とデータ基盤の整備を挙げる。測定と評価に関する短期・中期・長期の研究アジェンダも提案され、応用研究と倫理・ガバナンス研究を一つの枠組みで統合した点が本論文の貢献である。出典：Crossref","timestamp":1794787200000,"title":"Artificial intelligence for environmental sustainability: opportunities, ethical challenges and future research directions","titleJa":"環境の持続可能性にAIを活かす――機会と倫理的課題、将来の研究方向","url":"https://doi.org/10.1108/jices-08-2025-0229"},{"authors":["Tessa Cunningham","Kate Seymour","Sarah Wendt","Tabitha Lean","David Chikwuba"],"categories":[],"field":"International Journal for Crime, Justice and Social Democracy","genre":"Psychedelics / Trauma","monthKey":"2026-11","publishedAt":"2026-11-16T00:00:00Z","source":"Crossref","summaryHtml":"若者の犯罪化をめぐる研究は、個人のリスク要因を探る個別化・実証主義の枠組みに支配されてきた。そのなかでトラウマへの言及は増えたものの、分析は対人関係や家庭内の被害にほぼ限られ、人種差別や貧困、警察対応、収監といった社会的・構造的・言説的な逆境は見えにくくされてきた。<br><br>本論文は、犯罪化された若者を対象ではなく共同研究者として扱う博士研究にもとづき、共同設計のナラティブ手法で調査を行った。人種化された参加者10人の語りに焦点を当て、植民地主義がつくり出した人種の構築と、そこから生じる暴力が、参加者の人生における中心的で持続的なトラウマであることを描き出す。参加者は日常の人種差別や警察との遭遇、投獄の経験を、単発の出来事ではなく人生を貫く害として語った。<br><br>語られた経験は、支配的なトラウマ理解の枠組みを揺さぶる。個人的・家庭的な被害も、人種化された危害や構造的不平等、国家による暴力という広い地平の中に位置づけ直される。若者を研究の対象ではなく共に知をつくる相手とする手法そのものも、トラウマを個人の問題として切り取るのではなく社会的文脈のなかで捉え直す視点を示している。出典：Crossref","timestamp":1794787200000,"title":"Whose Trauma Counts? Racism as an Enduring Trauma in the Lives of Criminalised Young People","titleJa":"誰のトラウマが数えられるのか――犯罪化された若者の生における持続するトラウマとしての人種差別","url":"https://doi.org/10.5204/ijcjsd.4763"},{"authors":["Ellen J. Langer","Philip Z. Maymin"],"categories":[],"field":"Frontiers in Artificial Intelligence","genre":"Consciousness / Philosophy","monthKey":"2026-11","publishedAt":"2026-11-16T00:00:00Z","source":"Crossref","summaryHtml":"機械はいま、書くことも計算することも助言することもほぼ無料でこなす。知能がそれほど安くなったとき、人間に金を払う価値があるのは何か。本論文の答えは「マインドフルネス」、すなわち新しいことに能動的に気づくという単純な行為だ。この答えは2つの主張に立つ。機械は気づかないこと、そして人は気づくことに対価を払うことだ。著者らは両方を検証した。<br><br>機械は気づくか。2026年にネットで広まった問い「洗車したい。洗車場は50m先。歩くべきか車で行くべきか」では、多くの主要モデルが「歩け」と答え、車を家に置き去りにした。4,240件の回答アーカイブでの9問のテストでは、GPT-5.5とFable 5だけが全90試行に合格した。他のモデルは1問を解いて次の問を逃し、エージェントのハーネス内ではコマンドラインより成績が落ちるものもあった。失敗した5モデルに「気づくよう」指示しても、400試行中わずか9回しか合格しなかった。<br><br>人は気づくことに対価を払うか。事前登録した2つの実験（N=1,006と589）では、AI製と人間製の6つの製品にいくら払うかを尋ねた。人間の作り手は支払意思額を約2倍（+103%）にし、能動的な判断を働かせる人間と説明するとさらに20.9%上がった。手順どおりに作るだけの人間でもAIより53.8%高かった。機械のマインドフルネスは特性というより地図であり、評価は各モデルがどの細部を使うかを描くべきだという。人間の仕事は、機械の失敗がなくても価値を保つ。出典：Crossref","timestamp":1794787200000,"title":"When intelligence is cheap, mindfulness is priceless: AI performance and the value of human production","titleJa":"知能が安くなれば、マインドフルネスは貴重になる――AI時代の人間の価値","url":"https://doi.org/10.3389/frai.2026.1914761"},{"authors":["R. Manjupriya","A. Anny Leema"],"categories":[],"field":"Frontiers in Artificial Intelligence","genre":"Neuroscience","monthKey":"2026-11","publishedAt":"2026-11-16T00:00:00Z","source":"Frontiers in Artificial Intelligence","summaryHtml":"てんかんは脳の異常な電気活動による発作の反復を特徴とする慢性神経疾患だが、既存の自動検出手法はノイズの多い脳波（EEG）信号中の複雑な時空間依存性を十分に捉えられず、頑健性や信頼性に欠けた。本論文はEEGによる自動発作検出のための新しい枠組みEPI-SPA Netを提案する。経験的ウェーブレット変換でノイズやアーチファクトを抑えつつ発作関連の周波数成分を保ち、時空間ハイパーグラフニューラルネットワークで高次の空間結合と長距離の時間依存性を同時に学習し、カプセルネットワークで4秒ごとのEEG区間を発作・非発作に分類する。さらに時間畳み込みセグメンテーションネットワークで区間スコアを発作イベントへ変換し、葉レベルの伝播解析も行う。<br><br>評価の結果、全体の正解率は93.1%、適合率96.0%、再現率55.7%、F1スコア70.5%、コーエンのκは0.669だった。葉の動員順序は患者内では患者間より一貫していた（ケンドールのτは0.371対0.008、p &lt; 0.001）。<br><br>再現率が55.7%と低い点には注意が必要だが、発作検出と頭皮EEGからの伝播解析を組み合わせた本手法は、てんかん発作の臨床評価を支援する可能性があると著者らは述べる。出典：Frontiers in Artificial Intelligence","timestamp":1794787200000,"title":"EPI-SPA Net: hypergraph-based deep learning framework for seizure detection and propagation analysis in EEG signals","titleJa":"EPI-SPA Net：ハイパーグラフ深層学習によるEEGてんかん発作の検出と伝播解析","url":"https://www.frontiersin.org/articles/10.3389/frai.2026.1962680"},{"authors":["Geert E. Smid","Joren R. W. Ramaekers","Chesron R. J. Mersie","Hassan Pazira"],"categories":[],"field":"Frontiers in Psychiatry","genre":"Psychedelics / Trauma","monthKey":"2026-11","publishedAt":"2026-11-16T00:00:00Z","source":"Crossref","summaryHtml":"消防・警察などのファーストレスポンダーは、業務に関連したPTSDを発症するリスクが高い。治療を受けている当事者において、トラウマ関連の恥や自己スティグマ、セルフ・コンパッションがどう関わるかは、治療と予防を考えるうえで重要になる。本研究は業務関連PTSDで治療中の30人を対象に、自己スティグマの高さとその関連要因を横断的に調べた。<br><br>対象者の41.4%が自己スティグマの高い水準にあった。自己スティグマが高いほどトラウマ関連の恥が強く（r=0.75）、セルフ・コンパッションは低かった（r=-0.67）。セルフ・コンパッションの低さと恥の高さはPTSD症状の重さとも関連していた。自由記述からは「社会的な判断にさらされること」と「支え合い、力を与えてくれる関係」という二つのテーマが浮かんだ。<br><br>自己スティグマ、恥、セルフ・コンパッションの低さ、PTSD症状の重さは相互に関連している。自己スティグマと恥を減らし、セルフ・コンパッションを育てることが、援助要請やPTSDの転帰を改善するかどうかは、今後の研究課題だと著者らは述べている。出典：Crossref","timestamp":1794787200000,"title":"Exploring self-stigma, trauma-related shame, and self-compassion among treatment-seeking first responders with work-related PTSD","titleJa":"治療を求めるファーストレスポンダーのPTSD――自己スティグマ、トラウマ関連の恥、セルフ・コンパッション","url":"https://doi.org/10.3389/fpsyt.2026.2010901"},{"authors":["Matjaz Kovac"],"categories":[],"field":"Journal of Advanced Research in Social Sciences","genre":"Consciousness / Philosophy","monthKey":"2026-11","publishedAt":"2026-11-16T00:00:00Z","source":"Crossref","summaryHtml":"生きた経験がどのように知識の主張となり、行動を導くのかを問う学際的アプローチ「ノエティクス」を検討した物語的総説である。歴史哲学を、認知科学、現代の意識理論、瞑想的伝統、人工知能との対話に置く。主眼は、経験・メカニズム・認識論的正当化・責任ある行動という四つの領域からなる枠組みの提案にある。経験が知識の主張となり、行動を形づくる過程を一つの枠組みで捉えようとする試みだ。<br><br>この枠組みは、主観的報告から因果的説明へ、正当化された信念へ、実践的決定へという移行を明示しつつ、それぞれの証拠要件を区別する。競合する理論を相互に裏づけ合うものとして扱うことはせず、経験される現実の構築と「意識が物理的世界を生み出す」という主張とを切り分ける点も特徴だ。主観的な経験と客観的な説明のあいだの橋渡しを、証拠の水準を混同せずに行おうとする。<br><br>教育、メンタルヘルス、組織の意思決定、AIガバナンスへの応用が示され、観察可能な成果と、過信や擬人化への防護策が添えられる。ただし統合は概念的なもので実験的検証はなく、メタ認知や神経現象学的アプローチとの比較で漸進的価値を試す必要があるという。出典：Crossref","timestamp":1794787200000,"title":"Noetics, a New but Old Understanding of Mind and Reality","titleJa":"ノエティクス――心と現実への古くて新しい理解","url":"https://doi.org/10.33422/jarss.v9i3.1955"},{"authors":["National Institute on Aging"],"categories":[],"field":"ClinicalTrials.gov","genre":"Psychedelics / Trauma","monthKey":"2026-11","publishedAt":"2026-11-16T00:00:00Z","source":"ClinicalTrials.gov","summaryHtml":"加齢やアルツハイマー病による記憶・注意・思考の変化に対し、定期的な認知トレーニングが脳機能を改善できるか、さらにシロシビンがその効果を後押しできるかを検証するランダム化非盲検並行群間試験である。米国国立老化研究所が主導し、65歳以上の健常高齢者と早期アルツハイマー病患者を対象とする。<br><br>参加者は4週間の認知トレーニングのみの群と、25mgのシロシビン経口投与を2週間隔で2回受けたうえで認知トレーニングを行う群に分けられる。主要評価項目は、初回投与から4週間後の新規神経可塑性複合スコア（NPCS）のベースラインからの変化である。副次評価には安全性・忍容性、認知機能検査、心理的ウェルビーイング、生活の質、睡眠が含まれる。<br><br>MRIや睡眠時EEG、血漿バイオマーカーによる神経可塑性の多層的評価も行われ、神経可塑性や脳ネットワーク結合、神経化学の変化が調べられる。シロシビン群は最大9回の通院で、投与後は24時間の院内観察がある。2026年11月16日に登録情報が更新され、募集が続いている。結果はまだ公表されていない。出典：ClinicalTrials.gov","timestamp":1794787200000,"title":"Neuroplasticity Enhancement From Cognitive Training Reinforced by Psilocybin","titleJa":"シロシビンが認知トレーニングの神経可塑性効果を高めるか――高齢者と早期アルツハイマー病の試験","url":"https://clinicaltrials.gov/study/NCT07721467"},{"authors":["Ronja F. Held","Ruud Hortensius"],"categories":[],"field":"Proceedings of the National Academy of Sciences","genre":"Consciousness / Philosophy","monthKey":"2026-11","publishedAt":"2026-11-16T00:00:00Z","source":"Crossref","summaryHtml":"人や物に心があるかどうかをどう判断するかは、心理学・生物学・哲学の中心的な問いであり、個人の社会的なやり取りから道徳や倫理といった社会レベルの過程までを形づくる。しかし、人が心の能力を帰属させる際にどのような内的モデルを使っているのかは明らかでなかった。本研究は、日常で出会う人間・ペット・ロボット・音声アシスタント・道具など、生命性や社会性の異なる対象への行為主体性（エージェンシー）と経験の帰属を、4つの実験（計256名）で調べた。<br><br>表象類似性分析と実験室実験、6週間の社会的相互作用介入、実生活での長期的な接触を組み合わせ、観測された評価データを理論モデルと比較した。その結果、経験の帰属の表象構造の背後には生命性の区別があり、行為主体性の帰属の内的モデルはより個別的で柔軟であることが示された。ある対象について明示的な情報を得ると行為主体性のモデルは変化し、その情報は対象のカテゴリ全体へ一般化された。<br><br>一方、ロボットや音声アシスタントなどの無生物テクノロジーへの長期的な接触や所有、ペットとの関わりが、経験や行為主体性のモデルを組み替える証拠は得られなかった。心を知覚する際の内的モデルとその柔軟性を明らかにし、心の知覚の根源と帰結を理解する手がかりを与える成果である。出典：Crossref","timestamp":1794787200000,"title":"Short-term flexibility and long-term stability in models of mind perception","titleJa":"心の知覚のモデルは短期的には柔軟、長期的には安定――4実験による検証","url":"https://doi.org/10.1073/pnas.2625583123"},{"authors":["Pierre J. Amiel","Shalini Suresh","Abdulaziz Almuhanna","Pratik Chhetri","John Pateña","Joyce Gyamfi","Dorice Vieira","Chukwuemeka Iloegbu","Emmanuel Peprah"],"categories":[],"field":"PLOS ONE","genre":"Psychedelics / Trauma","monthKey":"2026-11","publishedAt":"2026-11-16T00:00:00Z","source":"PLOS ONE","summaryHtml":"世界の避難民は深刻なメンタルヘルスの課題に直面し、難民・庇護希望の女性は不安・うつ・心的外傷後ストレス障害（PTSD）のリスクがとりわけ高い。PHQ-9、GAD-7、PCL-5といったスクリーニング尺度は広く使われているが、難民女性への導入実態は十分に検討されてこなかった。本システマティックレビューは、米国における成人女性難民・庇護希望者へのメンタルヘルス・スクリーニング導入について、採用・適切性・受容性・忠実度の四つの観点から検証した。<br><br>10のデータベースを検索し、2,011件の文献から重複を除いて921件を精査した結果、37件が組み入れ基準を満たした。しかし対象集団そのものを扱った研究はわずか3件で、いずれも適切性と受容性に関する質的データを示し、肯定的な結果だった。<br><br>全体として、導入に関するデータは限られ、採用・適切性・受容性・忠実度の報告も一貫していなかった。著者らは、文化的配慮のあるケアを実現するには、導入の過程と結果を明示的に調べる研究が必要だと結論づけている。出典：PLOS ONE","timestamp":1794787200000,"title":"Implementation of mental health screening tools among women refugees and asylum seekers in the United States: A systematic review","titleJa":"米国における難民・庇護希望の女性へのメンタルヘルス・スクリーニング導入――システマティックレビュー","url":"https://journals.plos.org/plosone/article?id=10.1371/journal.pone.0362807"},{"authors":["Zhaoning Zhang"],"categories":[],"field":"cs.CV,cs.CL,cs.LG","genre":"Vision / Multimodal","monthKey":"2026-11","publishedAt":"2026-11-16T00:00:00Z","source":"arXiv","summaryHtml":"視覚言語モデル（VLM）は2枚の画像の間で点や物体を対応づける課題によく失敗するが、その答えはモデル内部の隠れ状態からは読み取れることが多い。本研究はQwen3-VL、InternVL3.5、Gemma-3を対象に、合成図形の照合やHPatches、SPair-71kの対応づけ課題で失敗の発生箇所を追跡し、2つの異なる失敗点と、比較を担う少数のアテンションヘッド、パラメータの0.02%だけに触れる修復法を見つけた。<br><br>失敗の一つは、まったく同じ図形同士を比較できているのに、その結果が回答に読み出されないことだった。答えの位置を調べるプローブは、モデルの実際の出力より15〜25ポイント高く正解を拾えた。もう一つは、意味的な対応関係が視覚トークンには存在するのに回答へ届かないことだった。比較を担う16〜32個のヘッドの注意を再配分すると精度が大幅に下がり、この経路が比較の中心であることが確認された。<br><br>これらのヘッドのクエリとキーの射影だけを学習させると、SPair-71kの精度が28.3ポイント（Qwen3-VL-8B）向上し、他の課題にも転移した。すべての決定規則は実験前に固定され、数値は独立した検証スクリプトで再計算されている。VLMの画像間比較の弱点を、ごく小さな介入で改善できる道筋が示された。出典：arXiv","timestamp":1794787200000,"title":"Seen but Unsaid: Locating and Repairing Cross-Image Comparison in Vision-Language Models","titleJa":"見えているのに言えない――視覚言語モデルの画像間比較の失敗箇所と修復","url":"https://arxiv.org/abs/2611.21539"},{"authors":["Arunkumar V"],"categories":[],"field":"cs.AI,cs.CL,cs.CY","genre":"Ethics / Safety","monthKey":"2026-11","publishedAt":"2026-11-16T00:00:00Z","source":"arXiv","summaryHtml":"言語モデルが、規則によって申請が却下された人に説明を書く場面が増えている。複数の規則が独立に却下の理由になっている場合、説明が真の理由を挙げていても、それを直しただけでは却下は覆らない。本研究はこの欠けた性質を「救済可能性」と名づけた。説明に挙げられた内容を変えるだけで決定が覆るかどうかを厳密に計算し、ヒッティングセットの議論から、政策だけを見て正しい理由が役に立たない場合を予測する。<br><br>アクセス制御や米国の給付資格から移植した7つの規則体系のうち6つで、理由が複数ある場合、単一の正しい理由だけではほぼ救済につながらなかった。20の言語モデルを調べると、挙げられた理由が正しいかどうかを判定する検査は、この失敗を偶然程度にしか見抜けなかった。一方、説明どおりに行動すればうまくいくかを問う強い判定器は失敗を検出できた。強力な推論モデルでも、4つ以上の独立した理由がある却下では多く失敗した。<br><br>すべての規則を尋ねると改善の余地がある公開モデルはすべて良くなった。資格判定の説明は、決定関数そのものから作られ、説明どおりに行動すればうまくいくかどうかで評価されるべきだという結論が導かれた。出典：arXiv","timestamp":1794787200000,"title":"Right Reason, Wrong Advice: Evaluating Recourse in LLM Explanations of Denied Requests","titleJa":"正しい理由、間違った助言――却下の説明における言語モデルの「救済可能性」を測る","url":"https://arxiv.org/abs/2611.21545"},{"authors":["Arunkumar V","Manoranjan Gandhudi","Gangadharan G. R.","Arun Prakash","S. Senthilkumar"],"categories":[],"field":"cs.LG,cs.AI,cs.CL","genre":"Ethics / Safety","monthKey":"2026-11","publishedAt":"2026-11-16T00:00:00Z","source":"arXiv","summaryHtml":"検証可能な報酬による強化学習は、検証器の誤りをそのまま引き継ぐ。数学やコードの外では検証器は代理指標やルーブリック、学習済みの判定器などであり、真の目的との隔たりは測られないため、報酬の上昇が改善なのかハックなのか区別できない。本研究は、実行可能な認可ポリシーに基づき真の報酬を過程レベルで厳密に計算できる設定を構築し、検証器を7つの現実的な軸で劣化させながら学習させ、厳密な検証器で全ロールアウトを採点した。<br><br>4つの現象が現れた。楽観的な検証器は「水増し」でハックされ、十分性プロキシのスコアは0.940に達する一方、真の忠実度は0.731から0.667へ低下した。結果のみを見る検証器は飽和して学習を止め、ノイズは効果を薄め、順序を保つギャップは害がなかった。検証器の選択誤りとギャップの符号を調べるモデル不要の監査と、短い飽和パイロットにより、どの現象が起きるかを事前に予測できた。<br><br>2つのフレームワーク、2つのモデルベンダーなど9つの構成で現象は再現し、十分性の損害は10の再現セルのすべてで正だった。損害の大きさ自体は再現せず、5つの事前登録した説明の試みは失敗も含めて報告されている。テストベッドと14の実在ポリシーが公開された。出典：arXiv","timestamp":1794787200000,"title":"Optimistic Verifiers Get Hacked: Reward Hacking Under an Exact Process Oracle","titleJa":"楽観的な検証器はハックされる――検証可能な報酬における報酬ハッキングの実態","url":"https://arxiv.org/abs/2611.21538"},{"authors":["Charles Raison"],"categories":[],"field":"ClinicalTrials.gov","genre":"Psychedelics / Trauma","monthKey":"2026-11","publishedAt":"2026-11-16T00:00:00Z","source":"ClinicalTrials.gov","summaryHtml":"シロシビンが健康な老化に与える影響を検証するランダム化第I相用量設定試験「LONG-LIFE」が始まった。60〜80歳の医学的に安定した高齢者最大50名を対象に、シロシビン25mgを1回、2回（4週間隔）、3回（4週間隔）投与する群と、待機リスト対照群の4群に均等に割り付ける。老化のバイオマーカー、認知機能、「生きる目的」や人生の意味といった行動指標をベースラインから12か月間追跡し、主要評価は16週時点の変化とする。<br><br>背景には、DNAメチル化に基づくエピジェネティック・クロックなど生物学的老化のバイオマーカーが、加齢に伴う生理変化や疾病リスクを予測する道具として確立してきたことがある。前臨床研究ではシロシビンとその活性代謝物シロシンが、細胞老化、酸化ストレス、神経可塑性、エピジェネティック調節といった老化に関わる経路に影響する可能性が示唆されてきた。観察研究でも「生きる目的」や社会的つながりが、高齢者の罹患率・死亡率の低下と関連することが示されている。<br><br>待機群には12か月の追跡終了後にシロシビン25mgを1回提供する。本試験の結果は、効果の兆しがあれば第II相試験の用量選択に活かされる。実施はVail Health Behavioral Health、代表はCharles Raison。開始は2026年11月16日、完了は2028年12月を見込む。出典：ClinicalTrials.gov","timestamp":1794787200000,"title":"Psilocybin Effects on Healthy Aging Biomarkers and Purpose in Life","titleJa":"シロシビンは健康な老化に効くか――老化バイオマーカーと「生きる目的」を測るLONG-LIFE試験","url":"https://clinicaltrials.gov/study/NCT07719088"},{"authors":["Sajib Acharjee Dip","Brian Ouyang","Lala Motlhabi"],"categories":["cs.AI","cs.SE"],"field":"cs.AI","genre":"Agents / Robotics","monthKey":"2026-11","publishedAt":"2026-11-16T00:00:00Z","source":"Hugging Face Papers","summaryHtml":"LLMエージェントはAPIを呼び出し、その結果を信じて答える。だがAPIは無言で失敗することがある。誤ったフィルタ名など要求の一部を無視しながら、HTTP 200とそれらしい誤った結果を返すのだ。チェックリストやレビューモデル、LLMジャッジといった既存策はモデル自身に気づかせようとするが、問題に気づいてもそのまま答えてしまうことが多い。<br><br>本研究のSilentGuardは、判断をモデルからツール呼び出しを動かすハーネスへ移す。各結果を「正しいAPIなら必ず満たす不変条件」と照合し、破る値を差し止める。公開研究用API15件のうち11件で無言の失敗が見つかり、件数は最大691倍に膨れていた。既存策では誤答の70%以上が残り、ジャッジが指摘した件数の77.4%をエージェントはそのまま報告した。<br><br>7つのオープンモデルでは対象の誤りに対する誤答率が74.0%から1.7%へ、3つのフロンティアモデルでは70.2%から0.5%へ下がり、誤りのない課題での性能低下はなかった。警告だけでは70.1%が誤ったままで、強制こそが鍵だという。新しい種類の誤りでも61.1%から24.5%へ改善し、誤答は回復ではなく棄権で回避する。出典：Hugging Face Papers","timestamp":1794787200000,"title":"Invariant-Aware Harness Enforcement to Protect LLM Agents from Silent API Failures","titleJa":"LLMエージェントをAPIの無言の失敗から守る――不変条件を強制するSilentGuard","url":"https://arxiv.org/abs/2611.20595"},{"authors":["Yipeng Du","Yuxi Li","Ying Zhang","Chong Sun","Chen Li","Jing Lyu","Ying Tai"],"categories":["cs.CV","cs.AI"],"field":"cs.CV","genre":"Vision / Multimodal","monthKey":"2026-11","publishedAt":"2026-11-16T00:00:00Z","source":"arXiv","summaryHtml":"動画生成の進歩に伴い、明示的な法医学的証拠に裏づけられた検出が求められている。既存手法は一度きりの思考連鎖で短い局所的な痕跡を見落とすか、あらかじめ決められたマルチエージェント手順で検査の選択肢が限られる。調査方針だけを最適化しても、固定された専門家の法医学的能力そのものは高まらない。<br><br>本研究のWeVisForensicsは、主調査エージェントが視覚と音声の手がかりを担う自己進化型の検査サブエージェント群を統括する枠組みである。調査官はどの痕跡を、どの時間窓で調べ、いつ結論するかを学び、そのやり取りが両レベルのエージェントへの共通のフィードバックになる。2つの時間尺度での方策最適化DTPOは、調査官の高速な強化学習と検査官の緩やかな改良を結び、かつて見逃した微細な痕跡を報告できるようにする。<br><br>役割別の法医学注釈と対話軌跡を組み合わせたForenCue-30Kも整備した。実験では領域内・領域外・エージェント型ベンチマークで平均95.2%の検出精度となり、最強の先行検出器を9.0ポイント上回り、判定を局所的な証拠で裏づけた。出典：arXiv","timestamp":1794787200000,"title":"WeVisForensics: Self-Evolving Agent for Omni AI-Generated Video Detection","titleJa":"AI生成動画を見破る自己進化エージェント――法医学的証拠で裏づけるWeVisForensics","url":"https://arxiv.org/abs/2611.21373"},{"authors":["Lukas Ellinger","Georg Groh"],"categories":["cs.CL","cs.AI"],"field":"cs.CL","genre":"LLM / NLP","monthKey":"2026-11","publishedAt":"2026-11-16T00:00:00Z","source":"arXiv","summaryHtml":"細部が不確かなとき、答えを粗くすれば推測や棄権をせずに有用な情報を残せる。たとえば年や場所を正確に言えない場合でも、大まかな時代や地域なら正しく答えられることがある。本研究は、言語モデルがこうした振る舞いを学べるかを問う。複数のサンプル回答の一致と、異なる粒度の回答の認識から得たモデル条件付きの教師信号で学習させる。LFM2.5-1.2B、Ministral 3B、Qwen3.5-9B、Gemma 4 31Bを時間・地理の質問と3つの汎化データセットで評価した。<br><br>領域内の複数の設定では、微調整により正しさと情報量のバランスが、基本の回答を最良の固定レベルまで粗くしたものを上回った。汎化データセットでは4モデルすべてが、基本モデルの確信度が低いときほど粗い答えを出すようになった。確信度と粒度の結びつきが、学習を通じて般化したことを示す。<br><br>小さい3モデルでは、正しさと粒度を同時に考慮したとき、未知の関係に対する回答が基本の回答より好まれた。確信度に応じた粒度の適応は学習可能であり、その効果はモデルや設定によって異なることが示された。出典：arXiv","timestamp":1794787200000,"title":"Teaching Language Models to Adapt Answer Granularity to Their Confidence","titleJa":"自信に応じて答えの粒度を変える言語モデル――確信度に合わせた粗さの学習","url":"https://arxiv.org/abs/2611.21211"},{"authors":["Yancheng Long","Xuanyu Zheng","Wei Chen","Luoyuan Zhang","Haoyang Xu","Bin Wen","Tingting Gao"],"categories":["cs.CV","cs.AI"],"field":"cs.CV","genre":"Agents / Robotics","monthKey":"2026-11","publishedAt":"2026-11-16T00:00:00Z","source":"arXiv","summaryHtml":"長い動画の理解には、証拠の所在を特定し、視覚の細部を解像し、観察を統合して答える必要がある。証拠があっても、長く密な映像列の中でこれらを行うのは知覚と推論の双方に負担がかかる。動画エージェントは選択的に調べられるが、フレームを計画側へ返すと推論文脈に視覚情報がたまる。知覚を委譲すれば負担は減るが、まばらなサンプリングでは決定的な細部を見逃し、フレームごとの説明では文脈の増大が残る。<br><br>VideoNexusは詳細な動画知覚と証拠駆動の計画・推論を分離する学習不要の枠組みである。計画側がどこを調べ、何を解像し、どの密度でサンプルするかを制御し、知覚サブエージェントは音声付き映像を独立した文脈で処理して、時間的に根拠づけられた簡潔な証拠を返す。<br><br>Gemini 3.8 Flashを計画と知覚の両方に使うと、LVBench全体で88.6%の精度となり、同じ基盤モデルの静的な取り込みを3.6ポイント、内蔵のエージェント処理を1.1ポイント上回り、後者のAPIコストの44%で済んだ。Kimi K3でも公式のVideo-GAIA ReActハーネスを8.5ポイント上回った。出典：arXiv","timestamp":1794787200000,"title":"VideoNexus: Video Perception Beyond the Reasoning Context","titleJa":"長い動画の理解は推論文脈の外へ――知覚と計画を分離するVideoNexus","url":"https://arxiv.org/abs/2611.21392"},{"authors":["Xinping Lei","Minghao Liu","Ruijie Zhu","Xiaohui Hu","Xingqiao Li","Ao Zhang","Wenhao Chai","Han Li","Tao Wang","Jingyuan Zhang","Enduo Zhao","Yunfeng Shi","Yiming Liang","Zetao Yang","Xingjian Wang","Yifan Yao","Xinkai Ma","Yingru Li","Tianhan Yang","Huan Zhou","Weiran Shi","Shen Yan","Jiaheng Liu","Stephen Huang","Eli Cheung","Weihao Xuan"],"categories":["cs.SE","cs.AI"],"field":"cs.SE","genre":"Agents / Robotics","monthKey":"2026-11","publishedAt":"2026-11-15T19:39:01Z","source":"Hugging Face Papers","summaryHtml":"組織の中で働くコーディングエージェントは、何を作るかを定め、同僚と協働し、成果を検証しなければならない。本研究が提案するSWE-CoWorkは、101の実在リポジトリにまたがる101件の開発課題、11のプログラミング言語、12の応用領域からなるベンチマークである。各課題では、エージェントは責任や知識の範囲が異なる26人の同僚がいる模擬的な開発組織に置かれ、短い引き継ぎから出発する。<br><br>エージェントは同僚や職場の記録に分散した要件を回収し、矛盾する証拠を調整したうえで実装し、非公開の実行テストで評価される。11モデルを評価した結果、部分的な実装と課題の完全な遂行のあいだに大きな隔たりがあった。上位2モデルは失敗から成功へのテストの約63%を満たしたが、課題を最後まで完了できたのは8%未満だった。完全な要件を最初から与えても、成功率は約16ポイント上がる一方、課題の完全な達成率は変わらなかった。<br><br>要件レベルの軌跡分析では、つまずきが遂行過程の全体に及ぶことが分かった。Claude-Opus-5.5は質問の93%を担当者に向けたが、入手できた要件は64%にとどまり、先送りされた質問は追及されず、要件を得ても実装が未完成のままになることもあった。完了と報告された要件の31%はテストに失敗した。持続的な要件追跡こそ、信頼できる自律ソフトウェア開発の鍵だという。出典：Hugging Face Papers","timestamp":1794771541000,"title":"SWE-CoWork: Benchmarking Coding Agents as Digital Employees in Organizations","titleJa":"コーディングエージェントは組織の一員になれるか――101の開発課題で測るSWE-CoWork","url":"https://arxiv.org/abs/2611.20218"},{"authors":["Quy-Anh Dang","Chris Ngo"],"categories":["cs.CL"],"field":"cs.CL","genre":"Ethics / Safety","monthKey":"2026-11","publishedAt":"2026-11-15T17:30:14Z","source":"Hugging Face Papers","summaryHtml":"方向性アブレーションは、言語モデルの実行中に隠れ状態から「行動方向」に沿う成分を取り除く手法で、拒否のような行動をオフにする標準的な方法である。だが挙動は不安定で、あるモデルではほとんど効かず、別のモデルでは出力が繰り返しに崩壊する。本研究はその理由を示し、修正法を提案する。最終残差ストリームでは、アブレーションはちょうどロジットバイアスに等しく、隠れ状態と方向のなす角をゲートとする固定の語彙フットプリントだという。<br><br>問題は、そのゲートが原点から測られることにある。最終層の状態は原点から遠い大きな共通モードを共有するため、共通モードと重なる方向は良性のテキストでも発火し、標的では発火不足になる。提案するCentered Ablation（CA）は、共通モードを方向から射影して除く閉形式の手法である。8モデルでの評価では、標準手法が発火不足だった場面で攻撃成功率が29ポイントと46ポイント上がり、Gemma-2-9Bの崩壊率は50%から1%に下がり、良性の回答も12〜40ポイント多く保たれた。<br><br>生成前に計算できる2つの数値から、未見のモデルで忠実性が上がるか攻撃成功率が上がるかを予測でき、崩壊指数はテキストがいつ退化するかの目安になる。さらに、2つの標準的な安全性判定器が崩壊したテキストを正反対に評価し、46ポイントもの見かけの効果を生みうることも示した。安全評価の落とし穴を示す結果だ。出典：Hugging Face Papers","timestamp":1794763814000,"title":"Centered Ablation: Why Last-Layer Directional Ablation Under-Fires or Collapses, and a Closed-Form Fix","titleJa":"方向性アブレーションはなぜ暴走するか――最終層の共通モードを除くCentered Ablation","url":"https://arxiv.org/abs/2611.20148"},{"authors":["Parsa Mirtaheri","Mohammadreza Armandpour","Keivan Alizadeh","Iman Mirzadeh"],"categories":["cs.LG"],"field":"cs.LG","genre":"Agents / Robotics","monthKey":"2026-11","publishedAt":"2026-11-15T01:07:23Z","source":"arXiv","summaryHtml":"同じ環境（コードリポジトリ、データベース、アプリ群）で繰り返し働くLLMエージェントは、タスク間に潜む共通構造から学べるはずだ。経験を活かす適応には、文脈に保持する方法と、重みを更新する方法の2つの経路があるが、これまで別々に研究されており、それぞれの寄与や相補性は明らかでなかった。<br><br>本研究は文脈内学習（ICL）、検証可能な報酬による強化学習（GRPO）、自己蒸留（SDPO）を単独・併用で比較した。Qwen3.5-9Bを用い、SWE-bench Verified、AppWorld、ScienceWorld、BIRD-Critic-SQLiteの4環境・109タスクで14の適応手法を評価した。ICL単独の最良ポリシーは平均成功率を28.8%から49.4%へ引き上げ、GRPOを加えると最高の51.6%に達した。<br><br>ただしICLは参照回数や試行を減らす一方で、目の前のタスクの検査や検証を飛ばしがちになる。GRPOを併用するとその行動が回復し、参照の削減は保たれた。検証可能な報酬による強化学習が、保持した経験の使い方を洗練できることを示し、文脈管理と重み更新の統合的研究を促す。出典：arXiv","timestamp":1794704843000,"title":"Where Should LLM Agents Adapt at Test Time? In Context, in Weights, or Both","titleJa":"LLMエージェントはテスト時にどこで適応すべきか――文脈か、重みか、その両方か","url":"https://arxiv.org/abs/2611.19700"},{"authors":["Christina Chwyl","Malena Donas","Angelica Spata","Gabriella Gatto","Akeesha Simmons","Kim Hoffman","M. Kati Lear","Brian Pilecki","Jenna LeJeune","Jason Luoma"],"categories":[],"field":"PsyArXiv","genre":"Psychedelics / Trauma","monthKey":"2026-11","publishedAt":"2026-11-15T00:27:04Z","source":"OSF Preprints","summaryHtml":"社交不安症に対するMDMA支援療法（MDMA-AT）の体験を質的に調べた初めての研究。2回のMDMAセッションを受けた参加者20人に半構造化インタビューを行い、治療的利益に寄与したと感じられた側面を反省的テーマ分析で抽出した。<br><br>5つのテーマが得られた。困難な体験に穏やかに向き合うことで癒しが進むこと（自己批判から好奇心と慈しみへ、感情へのアクセスと処理の向上）、自己と他者への広がった視点による意味づけ（苦悩の起源の明確化、本来の自己の理解、つながりと一体感）、身体化された状態を通じた頭の理解から体感の知への移行（感情の体験と解放、自分とともに安心していられる感覚）、脆弱な自己表現を通じた新しい関係パターンの学習、MDMA体験が継続的な自己発見の拠り所になること。<br><br>参加者は、安全な治療的枠組みの中でのMDMAが、感情と向き合い深く感じ身体で味わうことを促し、新たな洞察と癒しを触媒したと感じていた。自分自身や他者とよりつながり安心できることで、関係の中で本来の自分として現れる意欲が高まったという。出典：OSF Preprints","timestamp":1794702424000,"title":"MDMA-Assisted Therapy for Social Anxiety Disorder: A Qualitative Analysis of Patient Experiences of Change","titleJa":"MDMA支援療法は社交不安に何をもたらすか――患者20人の語りから見えた変化の5テーマ","url":"https://osf.io/preprints/psyarxiv/7kx2p_v1/"},{"authors":["Sophia R Ottofaro","Jessica L Maltman","Javier González-Maeso"],"categories":[],"field":"Neuroscience Letters","genre":"Psychedelics / Trauma","monthKey":"2026-11","publishedAt":"2026-11-15T00:00:00Z","source":"PubMed","summaryHtml":"トラウマ体験は、特定の恐怖記憶だけでなく、新しい刺激への過敏さや中立的な場面での持続的な防衛状態といった、非連合的な変化を残す。セロトニン系サイケデリクスであるシロシビンは、連合的な恐怖の消去を促すことが知られていたが、トラウマ後の非連合的なストレス適応にどう働くかは分かっていなかった。本研究は、文脈的な恐怖想起とストレス感受性・感作を同じ個体で分離して測れるマウスの行動パラダイムを作った。<br><br>雄のC57BL/6Jマウスに急性の足ショックを与え、トラウマ想起を評価したのちシロシビン1mg/kgまたは溶媒を投与し、新しい音刺激と新しい文脈への反応を調べた。トラウマを受けたマウスは強い連合的恐怖と、新しい音へのすくみ増加を示したが、シロシビンはこの刺激誘発性の反応を有意に変えなかった。<br><br>一方、刺激のない新しい文脈での持続的なすくみ（ストレス感作）には、経験依存の両方向の効果が出た。非トラウマ群ではすくみが減ったが、トラウマ群では増えた。シロシビンはトラウマ関連行動を一律に弱めるのではなく、経験に応じて非連合的な防衛反応を調節する。サイケデリクスによる可塑性が、条件によっては潜在的なトラウマ状態を増幅しうることを示す。出典：PubMed","timestamp":1794700800000,"title":"Prior trauma shapes the effects of psilocybin on stress sensitization in mice.","titleJa":"トラウマの有無でシロシビンの効果は逆転する――マウスで見えたストレス感作への両方向作用","url":"https://pubmed.ncbi.nlm.nih.gov/42767398/"},{"authors":["Shaila Islam Nipa"],"categories":[],"field":"Philosophy and Progress","genre":"Consciousness / Philosophy","monthKey":"2026-11","publishedAt":"2026-11-15T00:00:00Z","source":"Crossref","summaryHtml":"自己を知るとはどういうことか。文明の始まりから人間の心の中心的な問いであり続けてきた自己意識の本性を、サルトル、シャンカラ、アヴィケンナ（イブン・シーナー）の3人の哲学者の視点から比較する論文。実存主義、アドヴァイタ・ヴェーダーンタ、イスラーム哲学という異なる伝統が、自己をどう理解してきたかをたどる。<br><br>サルトルは自己意識を選択・責任・絶対的自由の観点から捉える。シャンカラは自己意識をアートマンとブラフマンの非二元性・一体性の自覚とし、解脱への道と結びつける。イブン・シーナーは、身体から独立した魂の内在的な自己認識として自己意識を説明する。質的・概念的な手法で3者の解釈を深く読み解き、共通点と相違点を比較する。<br><br>3人の洞察を並べる比較分析はこれまであまり行われてこなかったという。現代の物質主義的な世界で人間の意識を理解するうえでの意義も検討し、自己意識の涵養が自己実現や倫理的責任、有意義な
