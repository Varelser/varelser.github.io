起きていなくても時間は過ぎるため、こうした記憶は「待つこと」と「働くこと」を区別できない可能性がある。<br><br>本研究はそれを実証した。RoboMMEの数え上げ課題で、ロボットに短く停止させたり手首をそらしたりする無意味な出来事を挿入すると、課題の成否に関係ないはずの出来事にもかかわらず、公開済みの記憶付きVLAはその区間を作業済みと数えて早期に停止した。著者らはこの失敗を「幻の進捗」と呼ぶ。ある課題では成功数が50件中47件から16件へ、もう一方では44件から10件へ落ちた。<br><br>原因は時間的な近道にある。実演が一定のペースで進むため、経過時間が進捗を予測してしまうのだ。時刻の刻みだけを伸縮させても方策は早く止まったり繰り返したりし、時間符号を除去しても直らない。診断が示す修正のうち、停止を注入した学習は失敗を除去できず数え上げを損なったが、記憶を出来事で索引づけると再学習なしに損失の半分以上が回復した。出典：Hugging Face Papers","timestamp":1794182400000,"title":"Is Your Robot's Memory Just a Clock? Temporal Shortcuts in Memory-Augmented VLA Policies","titleJa":"ロボットの記憶はただの時計か――記憶付きVLAポリシーの時間的近道","url":"https://arxiv.org/abs/2611.14488"},{"authors":["Chenghao Gao","Zhi Zhang","Dian Jin","Yihe Pan","Doudou Zhou"],"categories":["cs.AI"],"field":"cs.AI","genre":"Agents / Robotics","monthKey":"2026-11","publishedAt":"2026-11-09T00:00:00Z","source":"Hugging Face Papers","summaryHtml":"終端報酬だけがまばらに与えられる課題では、エージェントは自分の各行動が正しかったのかを知る手がかりに乏しい。環境のダイナミクスには成功条件の変化が暗に含まれており、世界モデルは実際の遷移から学習して各行動が何を変えるかを予測できる。だが予測された観測だけでは、成功の見込みが高まったかどうかは分からない。<br><br>本研究のWM-PPOは、世界モデルとPPOのクリティックを組み合わせる。方策がサンプリングした各行動について、世界モデルが次の観測を予測し、クリティックがその予測された後継状態を評価する。方策チャネルではこれらの価値の比較が補助的なアドバンテージを与え、価値チャネルではその平均がクリティックの補助的な目標となる。両チャネルの重みは、過去の予測の信頼性に応じて調整されるゲートが決める。<br><br>実環境との相互作用の回数を同程度にした比較では、ALFWorldでの成功率がPPOの63.5%から87.5%へ、ScienceWorldでは39.3%から52.9%へ向上した。教師や特権情報なしに方策・クリティック・世界モデルが自らの相互作用だけから学び、推論時に使うのは方策のみである。出典：Hugging Face Papers","timestamp":1794182400000,"title":"Learning to Act with World Models by Valuing What Comes Next","titleJa":"世界モデルで「次に何が起きるか」を評価する――エージェント学習法WM-PPO","url":"https://arxiv.org/abs/2611.12200"},{"authors":["Vikash Singh","Weicong Chen","Debargha Ganguly","Yanyan Zhang","Mohsen Hariri","Sreehari Sankar","Wang Yang","Chaoda Song","Alexander Nemecek","Osama Zafar","Yuting Shao","Kai Ye","Biyao Zhang","Xinpeng Li","Shouren Wang","Erman Ayday","Jing Ma","Sanmukh Rao Kuppannagari","Vipin Chaudhary"],"categories":["cs.CL","cs.AI"],"field":"cs.CL","genre":"LLM / NLP","monthKey":"2026-11","publishedAt":"2026-11-09T00:00:00Z","source":"Hugging Face Papers","summaryHtml":"言語モデルの推論力を強化学習で鍛えるRLVRでは、正解した最終回答に報酬を与える。広く使われるGRPOは解答の全トークンに同じ信用を与えるため、中間ステップを評価する密なプロセス報酬が提案されてきた。モンテカルロ報酬は各ステップから続きをサンプリングして採点するが、その生成コストは見過ごされがちで、本研究の設定では生成トークンの91%を続きの生成が占めた。<br><br>著者らは生成トークン数と学習GPU時間で予算を揃える「matched-compute」プロトコルを導入し、事前登録した研究で6モデル・計1,668回の学習により比較した。更新回数あたりではモンテカルロ報酬が標準GRPOを上回るが、計算量を揃えると順位は逆転する。Qwen2.5-1.5Bでは同トークンで14.3ポイント、同時間で7.8ポイント下回り、4種の密な報酬はいずれもGRPOを上回らなかった。<br><br>一方、成功予測が2分の1に最も近いプロンプトで学習させると、計算量を揃えた条件で精度が向上した。介入の効果は計算量を揃えて検証すべきであり、見かけの改善が覆ることも、確かな改善が確認されることもあると著者らは主張する。出典：Hugging Face Papers","timestamp":1794182400000,"title":"Are Dense Rewards Worth Their Tokens in GRPO?","titleJa":"GRPOの密な報酬はトークンに見合うか――計算量を揃えた1,668回の検証","url":"https://arxiv.org/abs/2611.13560"},{"authors":["Tomer Solberg"],"categories":["cs.CR","cs.AI","cs.LG"],"field":"cs.CR","genre":"LLM / NLP","monthKey":"2026-11","publishedAt":"2026-11-09T00:00:00Z","source":"Hugging Face Papers","summaryHtml":"量子化されたTransformerが、与えられたプロンプトから特定のトークン列を生成したことをビット単位で正確に証明する仕組み「Sable」が提案された。Sableは浮動小数点演算を一切含まない整数関数としてモデルを固定し、丸めや正規化、ソフトマックス、サンプリングのすべての決定が入力から定まるようにする。証明はゼロチェックと参照を1ドメインあたり1回のsumcheckにまとめ、重みや証人テンソルを一つの多重線形コミットメントに束ねる。<br><br>1枚のGPUでモデルを層ごとにストリーミングしながら証明を生成し、RTX PRO 6000 BlackwellではQwen2.5-32Bの全64層について4,096トークンを92.5秒、16,384トークンを398秒で証明した。証明コストはサービング時間の41〜50倍、公開GPU価格で4,096トークンあたり6.4セントで、zkLLMと比べてパラメータ・トークンあたりの時間は40〜64分の1である。検証者は1 CPUコアで19〜56秒で証明を確認できる。<br><br>整数関数の貪欲なトークン選択はWikiText-2でBF16モデルの86.3%の位置で一致し、Qwen3ではMMLUで1.6ポイント、GSM8Kで1.7ポイント以内の差にとどまった。証明はゼロ知識ではないため、対象はオープンウェイトモデルである。言語モデルの出力を第三者がビット単位で検証できるようにすることで、推論の監査可能性を高める仕組みだと位置づけられる。出典：Hugging Face Papers","timestamp":1794182400000,"title":"Sable: A Small-Field Sumcheck Argument for Bit-Exact Inference of Large Language Models","titleJa":"Sable――大規模言語モデルの推論をビット単位で証明する仕組み","url":"https://arxiv.org/abs/2611.14083"},{"authors":["Adam Nalgiev"],"categories":[],"field":"Журнал ВШЭ по международному праву (HSE University Journal of International Law)","genre":"Ethics / Safety","monthKey":"2026-11","publishedAt":"2026-11-09T00:00:00Z","source":"Crossref","summaryHtml":"現代の国際難民保護制度は、1951年難民条約の理念を掲げながらも、実際の保護は理念に届いていない。本論文はその原因を制度の運用面ではなく、制度を支える規範的・哲学的基盤に求める。自由主義思想が築いた保護体制の前提を問い直し、「国民」という根本概念そのものが現状の根底にあると論じる。<br><br>対照事例として取り上げるのは、19世紀後半のオスマン帝国による北カフカス難民（ムハージル）の受け入れである。カフカス戦争のさなかとその後に流入した前例のない規模の難民に対し、オスマン帝国は数十万人の統合に成功した。その制度は、信仰を守るための移住を意味するヒジュラ、ムスリム共同体（ウンマ）全体への保護というカリフの霊的義務、喜捨（ザカート）など信徒の宗教的義務といった宗教的レトリックに貫かれていた。<br><br>著者は、このオスマン的制度の思想基盤と、実証主義的な枠組みからの分離や国民国家への帰属を問わず個人そのものの主体性を認めようとするコスモポリタン的アプローチとの平行関係を指摘する。イスラムに根ざした制度は難民に主体性と一定の自律を与えたが、それはまさにコスモポリタン論者が目指すものだった。ただし国際法制度が完全に世俗化した現在、その目的を達成できるかどうかは、依然として開かれた問いとして残されている。","timestamp":1794172800000,"title":"Ethics and refugees: North Caucasian muhajirs in the Ottoman Empire and ethics of the modern refugee protection","titleJa":"難民保護の倫理――19世紀オスマン帝国のムハージル受け入れと現代制度の哲学的基盤","url":"https://doi.org/10.17323/jil.2026.43869"},{"authors":["Yuyan Wang","Yuechen Jiang","Zhiwei Liu","Jimin Huang","Sophia Ananiadou"],"categories":["cs.CL"],"field":"cs.CL","genre":"Agents / Reasoning","monthKey":"2026-11","publishedAt":"2026-11-08T16:29:09Z","source":"arXiv cs.CL","summaryHtml":"LLMに特定のペルソナ（性格や行動傾向）を与えたとき、そのペルソナが長期にわたる意思決定のなかでどれだけ持続するかを測るベンチマーク「THEATRON」を提案する研究である。従来の評価はペルソナの表出だけを測ることが多く、長期の意思決定にペルソナ情報が生き続けるかは問われてこなかった。本研究は金融の履歴再生環境を用い、行動ファイナンスのペルソナを与えたモデルが、共有の日次市場データと口座状態のフィードバックを受けながら数か月にわたって逐次的に意思決定を行う設定で評価する。<br><br>ゼロショット、ワンショット、思考の連鎖（CoT）によるペルソナ注入を4つのLLMで比較し、累積リターンと行動軌跡から、同一ペルソナ内の安定性、ペルソナ間の分離性、行動の崩壊を診断した。その結果、ペルソナ条件付けはペルソナなしのベースラインを超えて行動を体系的に変化させ、ペルソナ間の分離は意味的に等価な記述の違いによる揺らぎを概ね上回った。<br><br>しかし、その変化が一貫したペルソナ固有の方策になっているとは限らない。見かけ上安定した分離が、ステレオタイプな行動への崩壊によって生じている場合もあれば、多様な方策がノイズの多い軌跡の切り替えを示す場合もあった。観察可能なペルソナ的行動と、文脈に敏感で持続的なペルソナ条件付き方策とのあいだに隔たりがあることを明らかにした。コードとベンチマークデータは公開されている。","timestamp":1794155349000,"title":"THEATRON: A Benchmark for Evaluating Persona Persistence in Long-Horizon LLM Decision-Making","titleJa":"THEATRON――長期の意思決定におけるLLMのペルソナ持続性を測るベンチマーク","url":"https://arxiv.org/abs/2611.11487"},{"authors":["Yujun Huang","Yuwei Zhang","Yi Zhou","Shanshan Wu","Xiang Chen","Lina Gong"],"categories":["cs.AI"],"field":"cs.AI","genre":"LLM / NLP","monthKey":"2026-11","publishedAt":"2026-11-08T16:05:31Z","source":"arXiv cs.AI","summaryHtml":"大規模言語モデルは一般的なコーディング課題では高い性能を示すが、アプリケーション層の組み込みソフトウェア開発における能力は十分に調べられていなかった。既存の組み込み向けベンチマークは、シミュレーション環境でのハードウェア・イン・ザ・ループ検証が中心である。本研究は、コード生成・補完、状態機械のモデリングと実装、OS間のコード翻訳という三つの実務課題を対象に、5,142件のサンプルからなるベンチマーク「RealEmbedBench」を提案する。<br><br>代表的な6つのLLMを評価した結果、課題やモデルによる性能差が大きいことが分かった。プロジェクトの文脈、とりわけ局所的なコードウィンドウがコード生成・補完に大きく影響した。状態機械のモデリング自体は比較的よくこなす一方、それを実行可能なコードへ落とし込むのは苦手だった。OS間翻訳の性能は方向によって大きく異なり、HarmonyからRT-Threadへの翻訳は平均合格率0.1667と特に難しかった。<br><br>著者らは、LLMをコード生成に使う際は局所的なコード文脈を考慮し、翻訳方向に応じてモデルを選ぶべきだと提言する。モデリングと実行コードのあいだの隔たりを埋めるには、現実の状態機械実装データをもっと学習に取り入れる必要があるという、実務に直結した結論である。","timestamp":1794153931000,"title":"RealEmbedBench: Benchmarking LLMs on Real-World Application-Layer Embedded Software Tasks","titleJa":"RealEmbedBench――実務の組み込みソフトウェア課題でLLMを測るベンチマーク","url":"https://arxiv.org/abs/2611.11469"},{"authors":["Cong Yu","Ziting Wang","Songlin Jiang","Sitong Zhang","Chengliang Chai","Youhe Jiang","Eiko Yoneki","Tuo Shi"],"categories":["cs.LG","cs.AI"],"field":"cs.LG","genre":"LLM / NLP","monthKey":"2026-11","publishedAt":"2026-11-08T15:22:47Z","source":"arXiv cs.LG","summaryHtml":"オンポリシー蒸留（OPD）は、学生モデルが自らの生成した応答を、固定された教師モデルの指導のもとで学習する手法である。応答生成にはコストがかかるため、量子化推論や非同期ロールアウトで効率化が図られるが、どちらも学習中のモデルとロールアウト実行時のモデルとのあいだに「学習・推論の不一致」を生む。こうした不一致は強化学習を不安定化させることが知られているが、OPDへの影響は明らかになっていなかった。本研究は、不一致の発生源をすべて同一尺度で測り、3組の学生・教師ペアで量子化の影響を、1組では重みの陳腐化とノイズ注入の影響も調べた。<br><br>結果として、OPDはかなりの不一致には学習品質を実質的に損なわずに耐えるが、一定水準を超えると品質が低下し、経験的な「不一致の予算」が存在することが分かった。不一致による品質コストも、量子化がもたらす不一致の大きさもモデルに依存し、精度低下に特に敏感な層もあった。統制された比較では、強化学習を不安定化させるロールアウト設定のもとでもOPDは安定を保った。一方、重みノイズのもとでは不一致が生成中に到達する接頭辞そのものをずらし、トークン単位の補正では対処できない誤差を生むことも示された。<br><br>実用化として、研究チームは各候補設定を本格的な学習なしに較正済み予算と照合する軽量な許容チェックを提案する。モデル固有のFP8レシピは学習品質を保ったまま、BF16比で少なくとも1.93倍のKVキャッシュトークンを扱える容量を確保し、FP8と非同期ロールアウトの併用は同期BF16学習と同じ品質に1.62倍速く到達した。","timestamp":1794151367000,"title":"How Much Training-Inference Mismatch Can On-Policy Distillation Tolerate?","titleJa":"オンポリシー蒸留はどれだけの学習・推論の不一致に耐えられるか","url":"https://arxiv.org/abs/2611.11450"}],"updatedAt":"2026-11-12T05:31:13Z","version":1};
    const byId = id => document.getElementById(id);
    const norm = s => String(s||'').toLowerCase().normalize('NFKC').replace(/\s+/g,' ').trim();
    const esc = s => String(s||'').replace(/[&<>"]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
    const plainText = h => String(h||'').replace(/<br><br>/g,' ').replace(/<[^>]+>/g,'');
    const months = [...new Set((DATA.articles||[]).map(a => a.monthKey).filter(Boolean))].sort().reverse();
    const genres = [...new Set((DATA.articles||[]).map(a => a.genre).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'ja'));
    const fields = [...new Set((DATA.articles||[]).map(a => a.field).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'ja'));
    function fill(select, values){ values.forEach(v=>{ const o=document.createElement('option'); o.value=v; o.textContent=v; select.appendChild(o); }); }
    fill(byId('month'), months); fill(byId('genre'), genres); fill(byId('field'), fields);
    // ---- filter persistence: URL query params win over localStorage ----
    const FILTER_IDS = ['month','genre','field','sort','pageSize'];
    const LS_KEY = 'rd-filters-v1';
    function readUrlState(){ try { const p = new URLSearchParams(location.search); const s = {}; let any = false; FILTER_IDS.concat(['keyword']).forEach(id=>{ if (p.has(id)) { s[id] = p.get(id); any = true; } }); return any ? s : null; } catch(e){ return null; } }
    function readLsState(){ try { return JSON.parse(localStorage.getItem(LS_KEY) || 'null'); } catch(e){ return null; } }
    function applyState(s){ if (!s) return; FILTER_IDS.forEach(id=>{ if (s[id] != null) byId(id).value = s[id]; }); if (s.keyword != null) byId('keyword').value = s.keyword; }
    function currentState(){ const s = {}; FILTER_IDS.forEach(id=>{ s[id] = byId(id).value; }); s.keyword = byId('keyword').value; return s; }
    function persist(){ const s = currentState(); try { localStorage.setItem(LS_KEY, JSON.stringify(s)); } catch(e){} try { const p = new URLSearchParams(); Object.keys(s).forEach(k=>{ if (s[k]) p.set(k, s[k]); }); const q = p.toString(); history.replaceState(null, '', q ? '?' + q : location.pathname); } catch(e){} }
    applyState(readUrlState() || readLsState());
    // ---- summary folding ----
    const FOLD_CHARS = 180;
    const expanded = new Set();
    let currentPage = 1;
    function render(){
      const month=byId('month').value, genre=byId('genre').value, field=byId('field').value, sort=byId('sort').value, kw=norm(byId('keyword').value);
      let rows=(DATA.articles||[]).filter(a=>{
        if(month&&a.monthKey!==month) return false; if(genre&&a.genre!==genre) return false; if(field&&a.field!==field) return false;
        const hay=norm([a.titleJa,a.title,a.summaryHtml,a.authors.join(' '),a.categories.join(' ')].join(' '));
        if(kw&& !hay.includes(kw)) return false; return true;
      });
      rows = rows.slice().sort((a,b)=> sort==='oldest' ? a.timestamp-b.timestamp : sort==='title' ? a.titleJa.localeCompare(b.titleJa,'ja') : b.timestamp-a.timestamp);
      const pageSize = parseInt(byId('pageSize').value, 10) || 0;
      const totalPages = pageSize ? Math.max(1, Math.ceil(rows.length / pageSize)) : 1;
      if (currentPage > totalPages) currentPage = totalPages;
      if (currentPage < 1) currentPage = 1;
      const pageRows = pageSize ? rows.slice((currentPage - 1) * pageSize, currentPage * pageSize) : rows;
      byId('pageInfo').textContent = rows.length ? `${currentPage} / ${totalPages} ページ` : '0 / 0 ページ';
      byId('prevPage').disabled = currentPage <= 1;
      byId('nextPage').disabled = currentPage >= totalPages;
      byId('meta').textContent = `更新: ${DATA.updatedAt || '-'} / 表示件数: ${rows.length}件`;
      byId('list').innerHTML = pageRows.map(a=>{
        const plain = plainText(a.summaryHtml);
        const isLong = plain.length > FOLD_CHARS;
        const open = expanded.has(a.url);
        const summaryHtml = (!isLong || open) ? (a.summaryHtml || '') : esc(plain.slice(0, FOLD_CHARS)) + '…';
        const btn = isLong ? `<button type="button" class="foldbtn" data-url="${esc(a.url)}">${open ? '閉じる' : '続きを読む'}</button>` : '';
        return `
        <article>
          <div class="src">${esc(a.source)} / ${esc(a.publishedAt.slice(0,10))}</div>
          <h2 class="title">${esc(a.titleJa)}</h2>
          <div class="tags"><span class="tag">${esc(a.genre)}</span><span class="tag">${esc(a.field)}</span>${a.categories.slice(0,4).map(c=>`<span class="tag">${esc(c)}</span>`).join('')}</div>
          <div class="summary">${summaryHtml}</div>${btn}
          <div class="box"><strong>ソース・引用元</strong><br>配信元：${esc(a.source)}<br>原題：${esc(a.title)}<br>著者：${esc(a.authors.join(', '))}<br>原文URL：<a href="${esc(a.url)}" target="_blank" rel="noopener">${esc(a.url)}</a></div>
        </article>`;
      }).join('');
    }
    function resetAndRender(){ currentPage = 1; persist(); render(); }
    ['month','genre','field','sort','pageSize'].forEach(id=>byId(id).addEventListener('change',resetAndRender)); byId('keyword').addEventListener('input',resetAndRender);
    byId('prevPage').addEventListener('click',()=>{ if(currentPage>1){ currentPage--; render(); } });
    byId('nextPage').addEventListener('click',()=>{ currentPage++; render(); });
    byId('list').addEventListener('click',e=>{
      const btn = e.target && e.target.closest ? e.target.closest('.foldbtn') : null;
      if (!btn) return;
      const u = btn.getAttribute('data-url');
      if (expanded.has(u)) expanded.delete(u); else expanded.add(u);
      render();
    });
    render();
  </script>
