  <script>
    const DATA = {"version": 1, "updatedAt": "2026-11-07T16:29:01Z", "articles": [{"source": "Crossref", "title": "How We Pay Matters: The Ethics of Payment Mechanisms for Research Participants", "titleJa": "支払い方が問う倫理――研究参加者への報酬支払いの仕組み", "summaryHtml": "研究参加者への報酬の支払い方には倫理的な問題がある。従来は現金やギフトカード、小切手で支払われてきたが、この10年で多くの研究機関がプリペイド式のリチャージ可能なデビットカードへ移行した。この変化は参加者に多くの問題をもたらしている。資金へのアクセスの遅れ、引き出し手数料、現金が必要な買い物ができないこと、カード凍結のリスクなどである。<br><br>障害給付を受けている人にとっては、プリペイドカードで支払いを受けるために社会保障番号の提出が必要になり、支払いが内国歳入庁に報告されるため、給付の喪失や予期せぬ税負担を招くおそれがある。新型コロナ禍には、VenmoやCash App、PayPalといったフィンテックで遠隔から支払う研究者もいた。参加者の多くは、その即時性や使いやすさ、監視の少なさをプリペイドカードより好んだ。<br><br>それにもかかわらず、多くの大学は管理やコンプライアンスを理由にフィンテックを禁じ、プリペイドカード中心のパンデミック前の方針に戻っている。著者らは、この硬直性がすでに脆弱な参加者に経済的なストレスを課しているとし、研究機関が支払い方法を見直し、参加者のニーズと現代の金融包摂の現実に合わせる道徳的な責務があると主張する。", "url": "https://doi.org/10.1002/eahr.70026", "publishedAt": "2026-11-07T03:37:11Z", "authors": ["Annie Harper", "Anthony Pavlo", "Steven Olsen"], "categories": ["research ethics", "payment mechanisms", "marginalized populations"], "field": "Ethics & Human Research", "genre": "Ethics / Safety", "timestamp": 1794022631000, "monthKey": "2026-11"}, {"source": "Crossref", "title": "Hospital-based clinical ethics support in Latin America: a scoping review of committee, consultation, and hybrid models", "titleJa": "ラテンアメリカにおける病院の臨床倫理支援――委員会・コンサルテーション・ハイブリッド型のスコーピングレビュー", "summaryHtml": "ラテンアメリカの病院では、臨床倫理支援が委員会やコンサルテーション、統合サービスなど多様な形で提供されているが、その組織実態を示す証拠は各地に散らばっていた。本研究は、そうしたサービスがどのように構成され、どのように利用・提供されているか、また患者固有の倫理的ジレンマにどう貢献しているかを地図化するスコーピングレビューである。JBIの指針とPRISMA-ScRに従い、BVS/VHL、Scopus、PubMed/MEDLINE、Web of Science、SciELOを検索し、引用の前後追跡やグレー文献も補った。<br><br>収集された119件の報告のうち実証研究が50件、制度・記述的なものが27件、概念・理論的なものが42件だった。実際に稼働中のサービスを記述した67件からは重複を除いた47の分析単位が抽出され、委員会中心が41、統合サービスが3、ハイブリッド型・チームコンサルテーション・個人コンサルテーションが各1だった。繰り返し現れたテーマは、終末期の意思決定、治療の比例性、自律性、臨床と家族の意見の対立である。<br><br>一方で、アクセス方法や対応時間、患者・家族の参加、評価されたアウトカムに関するデータは報告がまちまちだった。地域の証拠は臨床倫理支援の多様な組織モデルとその貢献を示す一方で、患者レベルのアウトカムや臨床的有効性についての証拠は限られていると、レビューは結論づけている。", "url": "https://doi.org/10.1007/s11019-026-10420-9", "publishedAt": "2026-11-07T02:40:11Z", "authors": ["Valeria L. Maucaylli-Campos", "Claudia A. Maucaylli-Campos", "E. Yahir Tongombol-Cholán", "José S. Herrada-Torres", "Jazmín A. León-Huamán"], "categories": ["clinical ethics", "Latin America", "scoping review"], "field": "Medicine, Health Care and Philosophy", "genre": "Ethics / Safety", "timestamp": 1794019211000, "monthKey": "2026-11"}, {"source": "Crossref", "title": "The use of Virtual Reality (VR) and Extended Reality (XR) in medical ethics education", "titleJa": "VR・XRを用いた医学倫理教育――没入型ツールは倫理的熟慮を育めるか", "summaryHtml": "仮想現実（VR）や拡張現実（XR）は医学教育の道具として広がりつつあるが、医学倫理の教育への応用はまだ十分に探られていない。英国の医学倫理教育は今も事例検討やセミナー形式が中心で、倫理的熟慮を実際に練習する機会は限られている。卒業したばかりの医師の多くが、倫理的な意思決定に自信がなく、十分に支えられていないと感じている。安全で没入感のある対話的な体験を提供するXRの教材は、こうした不足を補う可能性を秘めている。<br><br>本論文は、医学倫理の指導にXRを用いた効果を測った文献を調べるスコーピングレビューである。対象となった研究はまだ少なく、その多くはサンプル数の小さいパイロット研究で、統計的な検出力にも限りがあった。得られた限られた証拠からは、XRが学習者の知識や自信の自己評価を高める可能性が示唆される一方で、測定された知識の向上については証拠が一致していない。<br><br>対象研究の数が少なく、内容もばらつきがあり、探索的なものが中心だったため、教育効果についての結論は暫定的なものにとどまる。XRが医学倫理教育にどこまで寄与できるかは、今後の検証にかかっている。", "url": "https://doi.org/10.1186/s12909-026-10723-8", "publishedAt": "2026-11-07T00:00:00Z", "authors": ["Ariana Teodora Minea", "Angeliki Kerasidou", "Charalampia Kerasidou", "Mehrunisha Suleman"], "categories": ["medical ethics education", "virtual reality", "extended reality", "scoping review"], "field": "BMC Medical Education", "genre": "Ethics / Safety", "timestamp": 1794009600000, "monthKey": "2026-11"}, {"source": "Crossref", "title": "Afrocentric Participatory Methods for Climate Adaptation Research in Africa: Reflections on Indigenous Data-Generation Tools and Relational Ethics", "titleJa": "アフロセントリックな参加型手法――アフリカの気候適応研究における先住民の知の生成と関係的倫理", "summaryHtml": "アフリカの気候適応研究では先住民の知識体系への言及が増えているが、知識の生産・解釈・検証の方法論的条件までは変わっていないことが多い。先住民コミュニティは地域知の提供を求められながら、研究設問やサンプリング、倫理手続き、証拠基準、分析カテゴリーは欧米中心・技術主義的な前提のままである。本論文は、こうした不一致を正す枠組みとして、アフロセントリックな参加型手法を提唱する。ジンバブエのチマニマニ地区での質的フィールドワークに基づき、アフロセントリシティを理論のレンズとしながら方法論ではアフリカの認識論を周縁に置く矛盾を指摘する。<br><br>論文が焦点を当てるのは三つの先住民的なデータ生成ツールである。トーキング・サークルは、口承伝統や記憶、ことわざ、共有経験を通じて気候変動を語り・議論・解釈する共同体の認識論的フォーラムとして検討される。トランセクト・ウォークは、川や森、聖地、農地、サイクロンで変貌した地形、生態学的指標から状況に即した気候史を生成する「生きたアーカイブとしての景観」との関わりとして再概念化される。哲学的賢者との対話は、長老や伝統的指導者、知の保持者を省察的な思考者として迎え、適応の倫理的・精神的・哲学的基盤を照らし出す。<br><br>さらに、災害後かつ政治的に微妙な現場において、関係的倫理が中心的な役割を果たしたことが示される。国家・伝統両当局との重層的な関わり、個別に調整された同意、記録の抑制、参加者の保護などがその具体策である。結論として、アフロセントリックな参加型手法は、学術的に信頼でき、倫理的に説明責任を果たし、アフリカのコミュニティに応答する気候適応知識を生み出す厳密な道筋だという。", "url": "https://doi.org/10.1177/16094069261507189", "publishedAt": "2026-11-07T00:00:00Z", "authors": ["Happy Mathew Tirivangasi"], "categories": ["Afrocentricity", "participatory methods", "Indigenous knowledge", "climate adaptation", "relational ethics"], "field": "International Journal of Qualitative Methods", "genre": "Philosophy", "timestamp": 1794009600000, "monthKey": "2026-11"}, {"source": "Crossref", "title": "From Goodness of the Will to Ironic Consciousness: A Hegelian Critique of Subjective Ethics in Philosophy of Right", "titleJa": "「意志の善」からアイロニー的意識へ――『法の哲学』における主観的倫理へのヘーゲル的批判", "summaryHtml": "ヘーゲルは『法の哲学』第140節の注釈（d）（f）と『精神現象学』の良心（Gewissen）の議論を手がかりに、「意志の善」への批判を展開する。本論文はその批判を、フリードリヒ・シュレーゲルの「アイロニー的意識」概念と、比較の軸となるフリードリヒ・ヤコービの仕事と並べて検討する。意志の善から主観的確信を経てロマン的アイロニーへ至る、概念の展開をたどる試みである。<br><br>ヘーゲルによれば「意志の善」の問題は、客観的な倫理規範よりも主観的な意図を優先させる点にある。同じ構図は、ヤコービの小説『ヴォルデマール』に描かれた「道徳的天才」にも見られるという。シュレーゲルは、主観的確信への偏重に対するヘーゲルの批判には同意しつつ、そこからヤコービが「ニヒリズム」と呼んだ帰結へ進む。倫理的・法的規範の究極的な基礎づけは不可能であり、規範は客観的でありながら、その妥当性は歴史的なものだという立場である。<br><br>論文は、シュレーゲルのアイロニー的意識が、意志の善のうちにすでに含まれていた主観主義の、最も高度で最も明示的な形態であると示す。結論として浮かび上がるのは、客観的な倫理の枠組みを欠いたまま個人の主観性だけに基礎を置く倫理体系の危うさである。ヘーゲルの分析が、主観性に閉じた倫理の限界を照らし出す。", "url": "https://doi.org/10.70244/reh.v23i42.620", "publishedAt": "2026-11-06T22:22:02Z", "authors": ["Carlos Alfaro"], "categories": ["Hegel", "ethics", "irony"], "field": "Revista Eletrônica Estudos Hegelianos", "genre": "Philosophy", "timestamp": 1794003722000, "monthKey": "2026-11"}, {"source": "OSF Preprints", "title": "Cognitive Offloading to Generative AI: A Theoretical Framework for Memory, Metacognition, and Consumer Decision-Making", "titleJa": "生成AIへの認知的オフロード――記憶・メタ認知・消費者意思決定の理論的枠組み", "summaryHtml": "生成AIが商品の検索・評価・選択をますます媒介するようになり、消費者の認知は人間とAIのあいだに分散しつつある。本論文は、認知心理学の認知的オフロード研究を手がかりに、消費者がいつ認知的作業を生成AIに委ねるのか、そしてその結果何が起きるのかを説明する「CogOffload」枠組みを提案する。広告理論が暗黙に前提してきた、説得は個人の消費者内部での認知的精緻化を通じて働くという想定に、正面から疑問を投げかける。<br><br>枠組みの中心にあるのは、オフロードの度合いが段階的に深まる7段階の委譲連続体と、価値に基づく費用便益の枠組みである。予測される結果は3つのまとまりに整理される。第一に、オフロードはブランドや製品属性の記憶を弱める一方で、AIが生成した要約の記憶を強める。第二に、メタ認知的な自己評価と意思決定への自信を膨らませ、AIによる過信を生み、さらなる情報探索を減らす。第三に、意思決定の質への影響はAIの信頼性に依存し、AIが信頼できない場合、AIの推奨を検証することは認知的・感情的なコストを伴うが、損なわれた記憶を回復し、膨らんだ自信を調整しうる。<br><br>さらに7つの命題と3つの長期的予想が、消費者としての自律性、能力の衰え、ブランドへの忠誠心にまで影響を広げる。CogOffload枠組みは、生成AI時代の広告を、人間と人工の認知からなる分散システムのなかで捉え直すものである。", "url": "https://osf.io/preprints/psyarxiv/79fza_v2/", "publishedAt": "2026-11-06T19:51:11Z", "authors": ["Chen Chen", "Kristy Hamilton", "Jacob T. Fisher"], "categories": ["cognitive offloading", "generative AI", "metacognition"], "field": "PsyArXiv", "genre": "Consciousness / Philosophy", "timestamp": 1793994671000, "monthKey": "2026-11"}, {"source": "OSF Preprints", "title": "Menstrual Cycle Status and the Acute Subjective Psychedelic Experience", "titleJa": "月経周期と急性サイケデリック体験――自我溶解の高まりと体験後の危害リスク", "summaryHtml": "サイケデリック体験の主観的な内容には個人差があるが、月経周期の影響はこれまでほとんど調べられてこなかった。本研究は169人を対象とした2か月間の縦断観察研究で、最も強烈だった体験時の月経周期の状態によって参加者を4群に分けた。体験中に月経中だった15人、月経はあるが体験時には月経中でなかった60人、月経のない25人、男性69人である。自我溶解（EDI）、神秘体験（MEQ）、困難な体験（CEQ）を、用量と年齢で調整して比較した。<br><br>体験中に月経中だった群は、月経中でなかった群と男性群より自我溶解スコアが高かった（β=-0.89、-0.68、p≤.011）。神秘体験や困難な体験の全体スコアには周期との関連はみられなかった。探索的な分析では、身体的苦痛と死のサブスケールも体験中の月経群で高く（β=-0.77、-0.80、p≤.005）、体験後に自分や他者を傷つけるリスクも、月経はあるが体験時に月経中でなかった群より高かった（オッズ比6.41、p=.022）。<br><br>月経周期のタイミングが、急性サイケデリック体験の一部、とくに自我溶解や体験後の危害リスクと関連する可能性が示された。ただし月経中の体験群は15人にとどまる予備的な知見であり、著者らもサイケデリック研究における月経周期のさらなる検討が必要だと結論づけている。", "url": "https://osf.io/preprints/psyarxiv/734yn_v1/", "publishedAt": "2026-11-06T18:26:04Z", "authors": ["Alaina Srivastav", "Sunjuri Sun", "Peter Hendricks", "Walter Osika", "Cecilia U. D. Stenfors", "Sankalp Chaturvedi", "Michelle Olofsson", "Gabriella Smedfors", "Simon Goldberg", "Otto Simonsson"], "categories": ["psychedelics", "menstrual cycle", "ego dissolution"], "field": "PsyArXiv", "genre": "Psychedelics / Therapy", "timestamp": 1793989564000, "monthKey": "2026-11"}, {"source": "OSF Preprints", "title": "Territorial stigma and the moral politics of place: Boundary work and social distance in disadvantaged neighbourhoods", "titleJa": "場所のスティグマと道徳の政治――不利な地域における境界づくりと社会的距離", "summaryHtml": "地域に貼られたスティグマに住民はどう応答するのか。本研究はオランダの不利な地域3か所で216件の聞き取り調査を行い、住民が用いる4つの道徳的対処戦略を明らかにした。「まともな」住民と「乱れた」住民を区別する道徳的境界づくり、貧しい人々を「ふさわしい／ふさわしくない」に分ける道徳的な分類、問題行動を苦境への反応として人間的に捉え直す共感的な再枠づけ、そして共同体からの離脱とスティグマの内面化である。<br><br>これらの戦略は民族の境界を越えて見られ、個人の尊厳を主張し、象徴的資本を蓄積し、スティグマをやり過ごす手立てとなる。一方で共同体内部の分断を生み、ブルデューのいう象徴的暴力を再生産する側面もある。内面化されたスティグマは私的な恥にとどまらず、仲間同士の監視や水平的な非難、社会的引きこもりとして現れるという。<br><br>境界づくりは排除の源であると同時に、共感や集団的な誇りが示すように連帯の土台にもなりうる。道徳的な境界づくりの両義性を描き出し、スティグマへの応答を個人の心理ではなく社会関係のなかで捉え直す研究である。", "url": "https://osf.io/c24ru_v3/", "publishedAt": "2026-11-06T05:49:28Z", "authors": ["F. Noordhoff"], "categories": ["territorial stigma", "moral boundary work", "sociology"], "field": "Sociological Research Online", "genre": "Philosophy", "timestamp": 1793944168000, "monthKey": "2026-11"}, {"source": "Crossref", "title": "Legal Ethics of Generative Artificial Intelligence Training Data Usage in Large Language Models: Copyright and Personal Data Perspective", "titleJa": "生成AIの学習データ利用をめぐる法と倫理――LLMにおける著作権と個人データ保護の視点", "summaryHtml": "生成AIの大規模言語モデル（LLM）は、学習に使うデータの著作権や個人データ保護をめぐるリスクを抱えている。本研究は、インドネシア、韓国、EU、日本の法制度の検討と、LLMへのプロンプトの直接検証を組み合わせ、既存の規制ガイダンスを調べ、利用者のプライバシーと知的財産権を守る国家的な枠組みの構築を目指す。<br><br>調査の結果、LLMは利用者の入力プロンプトや修正を継続的に吸収して学習に活かしており、個人データ保護法のもとで大きな脆弱性が生じることが示された。人の創造的な関与や予測可能性が弱い場合、入力されるデータの一つひとつがプライバシーや著作権を侵害しかねず、原作者に損害を与えうるという。<br><br>著者らは、法的なガバナンスを明示的なライセンス、公正な補償、出所表示などの技術的検証基準へ向けるべきだと提言する。人間中心の監督、明示的な同意、選択の自由が不可欠な法的制約であり、技術者による透明性と苦情対応、利用者による法にかなったプラットフォーム選択という共有責任のモデルこそ、有効なAIガバナンスの鍵だと結論づけている。", "url": "https://doi.org/10.14710/jphi.v8i2.393-425", "publishedAt": "2026-11-06T01:01:01Z", "authors": ["Galih Dwi Ramadhan", "Damar Sugeng Utomo", "Jihyun Park"], "categories": ["AI ethics", "copyright", "personal data protection"], "field": "Jurnal Pembangunan Hukum Indonesia", "genre": "Ethics / Safety", "timestamp": 1793926861000, "monthKey": "2026-11"}, {"source": "Crossref", "title": "Beyond self, time, and space: exceptional experiences and altered states of consciousness", "titleJa": "自己・時間・空間を超えて――例外的体験と変性意識状態", "summaryHtml": "予知やテレパシー的印象、意味のある偶然など、超常的・超感覚的と呼ばれる例外的体験は、意識研究のなかでも最も議論の多い主題の一つである。人口調査では、こうした体験は文化を越えて広く見られ、通常の空間や時間の制約を超えるように見えるという。本批判的レビューは、非局所的な意識の可能性を示唆する現象を調べる際の方法論的課題と理論的含意に焦点を当てる。<br><br>実験研究ではいくつかの領域で、小さいながら統計的に有意な効果が得られている。だが再現の不安定さ、効果量の小ささ、効果の捉えにくさが、解釈を難しくしている。中心的な困難は、自発的な例外的体験が、実験室では再現しにくい感情的に意味のある個人的文脈のなかで生じることが多い点だ。著者はこの限界に対し、現象学的方法を含む質的アプローチが、体験の豊かさや文脈、時間的ダイナミクスを捉えるうえで果たしうる貢献を強調する。<br><br>特に焦点となるのは、例外的体験と変性意識状態（ASC）の関係である。瞑想、サイケデリック体験、フローテーションRESTなどASCを誘発する実践では、身体境界の溶解、無時間感、合一体験といった神秘的変容がしばしば報告され、その現象学的特徴は非局所的意識の記述とよく似ている。著者は、進展には厳密な定量実験と一人称体験の質的調査を統合する方法論的多元主義が必要であり、それが例外的体験を認知的構築物とみるか、意識のより根源的な性質の表れとみるかを明らかにする手がかりになると論じている。", "url": "https://doi.org/10.3389/fpsyg.2026.1980354", "publishedAt": "2026-11-06T01:01:01Z", "authors": ["Marc Wittmann"], "categories": ["consciousness", "altered states of consciousness", "parapsychology"], "field": "Frontiers in Psychology", "genre": "Consciousness / Philosophy", "timestamp": 1793926861000, "monthKey": "2026-11"}, {"source": "Crossref", "title": "The transformation of the concept БОГ (GOD) in the Russian linguistic consciousness", "titleJa": "「神」概念の変容――ロシア語の言語意識における宗教的社会化の違い", "summaryHtml": "「神」という言葉を聞いて何を思い浮かべるかは、人によって大きく異なる。本研究は、世俗系と宗教系の高等教育機関の学生を対象に、刺激語「Бог（神）」に対する自由連想実験を行い、得られた連想場を比較することで、宗教的社会化のタイプによって「神」概念がどのように変容するかを調べた。認知・談話の枠組みのもと、変容の5つのベクトル――「規範」「脱人格化」「内在の聖化」「主体化」「形式の脱聖化」――を特定し、分析している。<br><br>制度的な宗教社会化を受けた回答者では、「神」概念は単中心的な規範構造を保っていた。一方、自分を宗教的ではないと考える回答者では、概念は多中心的で断片的なものとなり、形式の脱聖化や、異なる談話コードが内的に混ざり合うことを示すマーカーが優勢だった。<br><br>宗教的社会化のタイプに応じた「神」概念の変容指数を、連想実験のデータに基づいて初めて記述し定量化した点が、本研究の新規性である。世俗系と宗教系の学生の連想場を比べることで、同じ「神」という語が異なる社会化のもとでどう異なる意味のまとまりを持つかが浮かび上がった。宗教的概念が言語意識のなかでどう形を変えるかを実証的に捉えた研究といえる。", "url": "https://doi.org/10.30853/phil20260519", "publishedAt": "2026-11-06T01:01:01Z", "authors": ["Evgeniya Sergeevna Sukhareva"], "categories": ["consciousness", "linguistic consciousness", "religion"], "field": "Philology. Theory & Practice", "genre": "Consciousness / Philosophy", "timestamp": 1793926861000, "monthKey": "2026-11"}, {"source": "Crossref", "title": "Creative Ethics From Design x Philosophy of Technology", "titleJa": "デザイン×技術哲学からの創造的倫理――ボトムアップで倫理を実践する", "summaryHtml": "よりよい未来をデザインで想像し、実現しようという呼びかけは、すぐに「何がよりよいのか」という問いを突きつける。その問いへの答えを探る営みこそデザイン倫理である。だが、倫理を上から与える古典的なアプローチでは、倫理は創造の過程を遅らせる負担や制約と受け取られがちで、現場では敬遠されやすい。本論文は、デザインの実践における倫理的な問題に、下から積み上げるボトムアップの方法で取り組むことを提案する。<br><br>この方法は技術哲学における実践的転回に根ざし、「創造的倫理（Creative Ethics）」と呼ばれる。倫理を創造的に行い、創造的な成果へつなげるという考え方だ。論文ではデザイン教育の事例――ジェンダーニュートラルなトイレ設備をめぐる設計課題――を通してこのアプローチを示し、倫理の問いを設計の現場の具体的な判断のなかで扱う様子を描く。<br><br>創造的倫理は、デザインを通して「私たちがどう生きたいか、どう生きたくないか」を探り、望ましい未来を思い描き、振り返る過程として位置づけられる。倫理を制約ではなく、未来を想像し、より望ましい生き方をともに考えるための創造的な実践として捉え直す提案である。", "url": "https://doi.org/10.1177/30497671261504079", "publishedAt": "2026-11-06T00:00:00Z", "authors": ["Wouter Eggink"], "categories": ["design ethics", "philosophy of technology", "creative ethics"], "field": "Designing", "genre": "Ethics / Safety", "timestamp": 1793923200000, "monthKey": "2026-11"}, {"source": "Crossref", "title": "From face consciousness to ethical reflection: a Taoist interpretation of counterfeit luxury consumption in China", "titleJa": "面子意識から倫理的省察へ――中国における偽物高級品消費の道教的解釈", "summaryHtml": "偽物の高級品を買うのはなぜか。本研究は、かつて中国で偽物の高級品を購入した経験のある中国人留学生9名への現象学的インタビューをもとに、その動機を調べた。先行研究では金銭的・社会的・象徴的・体験的な動機が挙げられてきたが、本研究はそれらの動機が文化に根ざした倫理の視点からどう評価し直されるかを問う。見出された動機は4つ――「面子」と社会的承認、ファッションへの関心、ブランドの象徴的体験への憧れ、そして好奇心である。手の届く価格が購入を可能にしたが、それだけでは購入を説明できないという。<br><br>研究ではさらに、道教の消費価値観を提示して参加者に振り返ってもらった。すると、外的承認や繰り返しの購入に結びつく動機ほど省察が促され、好奇心による動機では省察が弱いことがわかった。倫理的な振り返りが促される度合いは、提示された価値観と、その動機を支える知覚された便益との関係によって変わるという。<br><br>本研究は道教の消費価値観を、参加者がもともと購入した理由の説明ではなく、文化に根ざした倫理的省察を促す枠組みとして位置づけている。消費者の動機を文化的価値観のレンズで捉え直すことで、偽物消費の倫理をめぐる議論に新たな視角を加える研究である。", "url": "https://doi.org/10.1007/s13520-026-00275-x", "publishedAt": "2026-11-06T00:00:00Z", "authors": ["Binbin Yu", "Madeleine Ogilvie", "Claire Lambert"], "categories": ["counterfeit luxury consumption", "face consciousness", "Taoist consumption values", "ethical reflection"], "field": "Asian Journal of Business Ethics", "genre": "Ethics / Safety", "timestamp": 1793923200000, "monthKey": "2026-11"}, {"source": "PubMed", "title": "MDMA-assisted therapy for social anxiety disorder: A randomized, open-label, wait-list controlled trial.", "titleJa": "社交不安症に対するMDMA補助療法――無作為化・非盲検・待機リスト対照試験", "summaryHtml": "MDMAには社会情動処理への好ましい作用があり、MDMA補助療法（MDMA-AT）は社交不安症（SAD）の治療に有望だとする先行のプラセボ対照試験があった。本研究は、待機リストと比較したMDMA-ATの臨床反応と安全性を予備的に評価する、無作為化・非盲検・待機リスト対照試験である。2022年4月から2024年3月にSADと診断された成人20名を登録し、即時治療群と16週間の待機後に同等の治療を受ける群に無作為に割り付けた。<br><br>MDMA-ATは90分の準備セッション3回、MDMAセッション2回、90分の統合セッション6回で構成された。主要評価項目はリーボヴィッツ社交不安尺度（LSAS）で、副次項目として機能、羞恥、受容、帰属感、自己隠蔽、自己慈悲を調べた。16週時点のLSASの平均差は−43.3（95%信頼区間−29.5〜−57.1、p<.0001、Hedges' g=2.8）で、MDMA-AT群の改善が大きかった。重篤な有害事象はなく、有害事象は軽度から中等度で一過性だった。<br><br>結論として、MDMA-ATは待機リストと比べて社交不安の症状を有意に軽減し、機能を改善した。標準化された心理療法マニュアルの精緻化と、治療プロセスの候補の評価という副次目的も進められた。小規模な予備試験ではあるが、社交不安症へのサイケデリック補助療法のエビデンスを広げる結果である。", "url": "https://pubmed.ncbi.nlm.nih.gov/42994762/", "publishedAt": "2026-11-06T00:00:00Z", "authors": ["Jason B Luoma", "M Kati Lear", "Brian Pilecki", "Jenna LeJeune", "Kyong Yi", "Christina Chwyl", "Seth Mehr", "Aryan Sarparast", "Liliana Kennedy", "Will Lucas", "Angelica Spata", "Christopher S Stauffer"], "categories": ["MDMA", "social anxiety disorder", "psychedelic therapy"], "field": "Journal of Affective Disorders", "genre": "Psychedelics / Therapy", "timestamp": 1793923200000, "monthKey": "2026-11"}, {"source": "Crossref", "title": "Fostering critical consciousness online", "titleJa": "オンラインで批判的意識を育む――96件のシステマティックレビュー", "summaryHtml": "批判的意識とは、構造的な不平等について批判的に考え、是正に向けて行動する力を育むことであり、批判的・解放的教育学の中心的な考え方である。そうした活動に参加した学生は、学業や社会情動、市民性のアウトカムが高いことが知られている。だが、オンライン環境で批判的意識をどう育てるかの記録は限られており、埋め込まれた規範的前提やアルゴリズムのバイアス、監視の仕組みによって、技術が格差を和らげるどころか悪化させるおそれも指摘されている。<br><br>本論文は、2010年から2023年に発表された96件の研究を対象に、オンラインおよびブレンド型の学習環境で批判的意識を育む方略と要素を調べたシステマティックレビューである。最もよく見られた方略は、学生が権力と向き合う活動であり、最も記録が少なかったのは教室の内外で変化を実現する実践だった。オンライン環境とツールならではの利点としては、デジタルコンテンツの作成と共有、批判的なメディア探究、オンラインでの提言やコミュニティ参加、デジタル文化リポジトリやシミュレーション、異文化間の協働が挙げられた。<br><br>レビューは、オンラインでの解放的教育学を支えるため、教員研修や専門職開発、インストラクショナルデザイン、政策におけるベストプラクティスを示している。心を動かし、コミュニティを変える学びをオンラインで実現するための指針となる研究である。", "url": "https://doi.org/10.24059/olj.v30isi2.5781", "publishedAt": "2026-11-06T00:00:00Z", "authors": ["Jennifer Darling", "Qurrat ul Ain Rasheed", "Ijeoma Mbaezue", "Kristin Hemingway"], "categories": ["critical consciousness", "online learning", "systematic review"], "field": "Online Learning", "genre": "Consciousness / Philosophy", "timestamp": 1793923200000, "monthKey": "2026-11"}, {"source": "arXiv cs.LG", "title": "User Embeddings are Superpositions of Interpretable Behavioral Modes", "titleJa": "ユーザ埋め込みは解釈可能な行動モードの重ね合わせである", "summaryHtml": "推薦やパーソナライゼーション、行動モデリングの中心にあるユーザ埋め込みは、豊富な行動情報をコンパクトに符号化できる一方で、密で不透明なため解釈が難しい。本研究は、ユーザ埋め込みを「解釈可能な行動モードの疎な重ね合わせ」として理解できると主張する。この構造は、線形埋め込みにおけるユーザ行動の生成モデルから直接予測され、深層学習による表現にも重ね合わせ仮説を通じて近似的に当てはまるという。<br><br>重ね合わされたモードは、スパースオートエンコーダ（SAE）などの疎な辞書学習で自然に回収でき、回収したモードには自然言語で自動的に名前を付けて問い合わせることができる。合成データで既知の真値と照合した検証では、SAEは古典的な疎なベースラインよりモードをよく回収し、トランスフォーマーで符号化した埋め込みでも有効だった。さらに2つの実データの古典的・トランスフォーマー型ユーザ埋め込みにも適用した。<br><br>自然言語ラベルにより、テキストで訓練されていない埋め込みに対しても、ゼロショットでのオーディエンス検索や特性記述が可能になる。枠組みは事後的でモデル非依存であり、上流の埋め込みシステムに変更を加える必要がない。ユーザ埋め込みの解釈可能性を開く手法である。", "url": "https://arxiv.org/abs/2611.08487", "publishedAt": "2026-11-05T18:59:42Z", "authors": ["Jonathan Kozaczuk", "Zheng Dong", "Noyan Evirgen", "Keivan Majidi", "Eddie K. H. Ng", "Chris Porter", "Qi Zhao", "Jia Geng", "Changmao Li", "Brandon R. Feng"], "categories": ["cs.LG"], "field": "cs.LG", "genre": "LLM / NLP", "timestamp": 1793905182000, "monthKey": "2026-11"}, {"source": "arXiv cs.AI", "title": "SwarmEvolve: Latent Agent Swarms for Evolutionary Discovery and Optimization", "titleJa": "SwarmEvolve――潜在空間で推論するエージェント群による進化的発見と最適化", "summaryHtml": "LLMに導かせた進化的探索は、プログラムを反復的に改良して数学や計算の問題を解く手法だが、1ラウンドごとに長い思考の文章を生成し、集団の多様性を保つために生成を何度も繰り返す必要があるため、処理が遅くなりがちだ。本研究は、1ラウンドあたり数百の低コストエージェントが群れで働き、テキストへデコードせず潜在空間で推論し、KVキャッシュを渡し合って情報を共有する枠組み「SwarmEvolve」を提案する。各群れが異なる角度から問題を検討する。<br><br>新規性フィルタは、エージェントの隠れ状態ベクトル間の距離を直接測ることで、最も異なるアイデアだけを残す。アイデアの交叉は潜在空間で自然に起きる。複数の群れメンバーのKVキャッシュを組み合わせたものを要約エージェントが受け取る仕組みだ。<br><br>数学的発見と科学計算の21問で、SwarmEvolveは最高の平均スコアを獲得し、他の最先端手法が60分かけて到達する最良スコアに、中央値で3〜8分で到達した。いくつかの問題では、Qwen3 8Bを用いたSwarmEvolveが、フロンティアLLMを使ったAlphaEvolveが初めて見出した解を上回った。潜在空間で通信するエージェント群が、科学的問題のプログラム探索を高速かつ低コストにする道を示す研究である。", "url": "https://arxiv.org/abs/2611.08483", "publishedAt": "2026-11-05T18:59:29Z", "authors": ["Qile Jiang", "George Em Karniadakis"], "categories": ["cs.AI", "cs.NE"], "field": "cs.AI", "genre": "Agents / Reasoning", "timestamp": 1793905169000, "monthKey": "2026-11"}, {"source": "arXiv cs.AI", "title": "Scientist World: Grow a Research World for AI-Scientists", "titleJa": "Scientist World――AI科学者のための「研究の世界」を育てる", "summaryHtml": "AI科学者は登場したが、彼らが成長するための世界はなかった。人間の科学者には、文献に蓄積された何世紀もの未解決問題と共有されたアイデアという世界があるのが当たり前だが、AI科学者にとってその世界は読めても実行できないものだった。本論文は「Scientist World」を構築する。すべての研究論文を実行可能な環境に変える試みである。<br><br>自律的なパイプラインが各論文の未解決の研究課題を抽出し、提案された手法をベースラインとして再現する。環境に入ったAI科学者は、人間の著者が達成したことと対比して評価される。検証済みの環境を最初に1,000件公開した。この世界を評価の場として使った結果、最先端のAI科学者はすでに74%の場合に人間の研究者を上回ることが分かった。<br><br>AIが科学を行う記録として、6,400時間分の研究の軌跡が収められている。すべてのアイデア、実験、失敗、成功が記録されている。訓練の場としては、小規模モデルを鍛え上げることで、研究アイデアの創出において最先端モデルに並ぶ水準まで引き上げることができた（+158%）。AI科学者自身の世界が、科学から育ち、科学とともに成長し始めたという。", "url": "https://arxiv.org/abs/2611.08478", "publishedAt": "2026-11-05T18:58:17Z", "authors": ["Taiming Lu", "Sachin Konan", "Zhuang Liu"], "categories": ["cs.AI", "cs.CL", "cs.LG"], "field": "cs.AI", "genre": "Agents / Reasoning", "timestamp": 1793905097000, "monthKey": "2026-11"}, {"source": "arXiv cs.LG", "title": "XStack: A Benchmark for ML Repo Migration", "titleJa": "XStack――MLリポジトリ移行のためのベンチマーク", "summaryHtml": "機械学習のコードは、PyTorchとNVIDIA GPUの生態系と、JAXとGoogle TPUの生態系という二つに大きく分かれている。研究者が使うハードウェアを自由に選ぶには、リポジトリ全体を別のフレームワークとハードウェアへ移行しなければならない。本論文は、この移行をエージェントのベンチマークとして定式化した「XStack」を提案する。移行は実用的なニーズであると同時に、フレームワークとハードウェアをまたぎ、リポジトリ全体を対象とし、長期にわたる挑戦的な課題でもある。<br><br>エージェントにはPyTorchのリポジトリとまっさらなTPUマシンが与えられ、JAXのリポジトリを納品することが求められる。合否は元のリポジトリの公表結果に基づく採点基準で判定され、著者らが検証と較正を行った。評価の結果、エージェントによる移行は依然として信頼できないことが示された。Claude Opus 5が75%を通過した一方、GPT-5.6-solは45%、それ以外のエージェントはすべて40%以下にとどまった。<br><br>XStackは、機械学習のコードを特定の生態系から解放し、フレームワークやハードウェアを越えた信頼できる移行への進展を測定可能にする一歩である。ベンチマークは公開されており、エージェントによる大規模なコード移行の能力を測る土台となる。", "url": "https://arxiv.org/abs/2611.08472", "publishedAt": "2026-11-05T18:55:54Z", "authors": ["Linrong Cai", "Taiming Lu", "Haozhe Chen", "Zhuang Liu"], "categories": ["cs.LG", "cs.AI"], "field": "cs.LG", "genre": "Agents / Reasoning", "timestamp": 1793904954000, "monthKey": "2026-11"}, {"source": "arXiv cs.LG", "title": "Same Behavior, Different Mechanism: What Finite Experiments Can Certify About Integrated Information Theory", "titleJa": "同じふるまい、異なる仕組み――有限の実験は統合情報理論について何を証明できるか", "summaryHtml": "解釈可能性やAI監査、機械意識の評価は、出力そのものではなく、システムがどう計算するかという因果的な遷移則の量に依拠しつつある。しかし実験は、その法則を有限で部分的、ノイズを含む介入を通してしか見ることができない。本研究は、そうした量が実験のアクセスから識別できるのか、仕組みに対して連続なのか、有限のデータから証明できるのかを、統合情報理論の統合情報φというとりわけ手ごわい事例で厳密に問う。真値が既知の4〜5ユニットの確率ネットワークを対象とした。<br><br>ふるまいは沈黙しうることが示された。入出力の法則が同一の再帰型とフィードフォワード型のネットワークで、φは0.28ビットと0ビットだったが、内部記録では4〜53試行で両者を区別できた。一方、部分的なアクセスには限界がある。1ステップの記録から外れたユニットは0.30〜1.02ビットの精度の下限を課し、サンプル数を増やしても下がらない。さらにφは鋭い境界を持ち、仕組みの微小な変化が境界を越えると、ランダムなネットワークで見つかった境界の99%において25〜100%も変化した。<br><br>ただし片側の主張は生き残る。同じデータから境界の両側について下限が証明でき、64次元の仕組みの領域全体でφが1.004ビットを超えることを証明し、約1000万回の制御された遷移から誤証明の確率をα以下に抑えて認証できた。測定可能性は設計の問題であり、計算可能な答えがあると結論づけている。", "url": "https://arxiv.org/abs/2611.08469", "publishedAt": "2026-11-05T18:55:31Z", "authors": ["Linqian Wu", "Diaoxuan He"], "categories": ["cs.LG", "cs.AI", "q-bio.NC"], "field": "cs.LG", "genre": "Consciousness / Philosophy", "timestamp": 1793904931000, "monthKey": "2026-11"}, {"source": "arXiv cs.LG", "title": "Towards interpreting any residual stream direction by scaling activation inversion", "titleJa": "残差ストリームの任意の方向を解釈する――活性化の反転によるスケーリング", "summaryHtml": "言語モデルの残差ストリームにおけるある方向を解釈するには、その方向を強く活性化するテキストを探すのが常套手段である。だがコーパスを走査して見つける方法では、コーパスに含まれるものしか得られない。本論文は、対象モデルの残差ストリーム方向を、その方向を強く活性化するテキスト例へ写す言語モデル「MAEM（最大活性化例メタモデル）」を開発した。<br><br>目的は、与えられた残差ストリーム方向と、MAEMが生成したテキストの活性化とのコサイン類似度を最大化することである。ラベル不要の強化学習目的により、多様な残差ストリーム方向に対してMAEMをスケールできる。実験では、Qwen3.6-27BのMAEMが、保持された活性化の反転でコーパス探索や自然言語オートエンコーダ（NLA）を上回り、保持された言語・ドメインの過半数でコーパス探索（1000万トークン）を上回り、保持されたSAE特徴の89%を活性化した。<br><br>MAEMは、ステアリングベクトルの背後にある概念をNLAと同程度に特定し、LoRAバックドアのペイロードをコーパス探索より高頻度で復元し、モデルのワークスペースの内的独白の一部を言語化することさえできた。他のメタモデル（NLAなど）の説明と異なり、MAEMの例は対象モデルへのフォワードパスで検証できるため、MAEMの目的はメタモデルの訓練をスケールする根拠のある代替手段となる。", "url": "https://arxiv.org/abs/2611.08465", "publishedAt": "2026-11-05T18:54:40Z", "authors": ["Celeste De Schamphelaere", "Juan J. Vazquez", "Ari Spiesberger", "Tomáš Gavenčiak", "Gavin Leech", "Euan Ong", "Jiahai Feng"], "categories": ["cs.LG", "cs.AI"], "field": "cs.LG", "genre": "LLM / NLP", "timestamp": 1793904880000, "monthKey": "2026-11"}, {"source": "arXiv cs.LG", "title": "Adversarial Training with Large Step Sizes: Implicit Bias, Optimization, and Sharpness", "titleJa": "大きな学習率での敵対的訓練――暗黙のバイアス、最適化、鋭さ", "summaryHtml": "敵対的訓練（AT）はモデルの頑健性を高める重要な手法だが、その学習ダイナミクスは、勾配降下法（GD）が連続時間の流れに近づく小さな学習率の領域で主に研究されてきた。しかし小さな学習率は訓練を非効率にし、実務ではあまり使われない。本研究は、大きな一定の学習率でのGDによるATのダイナミクスを調べる。まず敵対的線形ロジスティック回帰で、パラメータがどこへ収束するか（暗黙のバイアス）と損失がどれだけ速く減るか（最適化）を調べ、次にニューラルネットワークの訓練で損失の鋭さがどう変化するかを調べた。<br><br>結果として、標準訓練（ST）との3つの重要な違いが明らかになった。第一に、ATとSTの暗黙のバイアスの差は、小さな学習率でのみ示されていたものが、任意に大きな一定の学習率でも残る。第二に、STとは異なり、ATでは最適化誤差の収束に一様な速度がない。第三に、鋭さは2段階のダイナミクスを示し、STで観察される安定性の縁（Edge-of-Stability）の振る舞いとは異なる。<br><br>大きな学習率という実務的な設定でも、敵対的訓練の挙動が標準訓練と本質的に異なることを示した研究である。頑健なモデルを効率的に訓練するための理論的な足場となる。", "url": "https://arxiv.org/abs/2611.08457", "publishedAt": "2026-11-05T18:48:50Z", "authors": ["Yi Feng", "Andrea Paudice"], "categories": ["cs.LG", "math.OC"], "field": "cs.LG", "genre": "Ethics / Safety", "timestamp": 1793904530000, "monthKey": "2026-11"}, {"source": "arXiv cs.LG", "title": "Unpacking the Compute Efficiency of Strong-to-Weak OPD against GRPO", "titleJa": "オン方策蒸留はGRPOより計算効率が良いのか――教師の選び方が効率を決める", "summaryHtml": "オン方策蒸留（OPD）は、凍結した教師のトークンごとの監督のもとで、生徒が自分自身の生成（ロールアウト）から学ぶ手法である。密な教師信号は、強化学習と比べて目標精度に到達するまでの学習計算量（FLOPs）を減らせるのだろうか。本研究は、逆KLのOPDとGRPOを、課題の難しさ、生徒・教師の規模、領域、最適化の選択肢を変えて体系的に比較し、保持された精度を学習FLOPsに対して測った。<br><br>外部の事後学習済み教師を使う場合、OPDは同じ設定では精度あたりの学習FLOPsでGRPOに及ばず、教師をさらにGRPOで学習させても逆転せず、応答が長くなる傾向もあった。だが教師を変えると様相が変わる。生徒自身のGRPOチェックポイントを教師にすると、数学ではGRPOが同じ精度に到達するのに必要な蒸留FLOPsの50分の1でチェックポイントの精度を回復できた。この高効率は、より大きな生徒、コード、別のモデル系列でも確認された。ただし単一領域ではGRPOチェックポイント自体が求めるモデルなので、蒸留は計算量を上乗せするだけになる。<br><br>領域ごとに異なるGRPOチェックポイントが別々の能力を持つ点に着目し、複数教師のOPDで領域別の専門家を1人の生徒に統合すると、各専門家の精度に並び、蒸留段階のコストは専門家学習のFLOPsのわずか5.2％（2領域）・8.0％（4領域）だった。専門家学習と蒸留を合わせると、2領域の混合では統合GRPOと同等の性能に42.0％少ない総FLOPsで到達した。教師の選び方次第で蒸留の計算効率が大きく変わることを示した研究である。", "url": "https://arxiv.org/abs/2611.08453", "publishedAt": "2026-11-05T18:47:05Z", "authors": ["Zeyu Leo Liu", "Yang Li", "Bo Pang", "Emre Can Acikgoz", "Xuan-Phi Nguyen", "Anurag Koul", "Srijan Bansal", "Erik Nijkamp", "Shafiq Joty", "Semih Yavuz"], "categories": ["cs.LG", "cs.CL"], "field": "cs.LG", "genre": "Agents / Reasoning", "timestamp": 1793904425000, "monthKey": "2026-11"}, {"source": "arXiv cs.AI", "title": "ReproBridge: Building Reproducibility into ML Research Artifacts", "titleJa": "再現性を成果物に組み込む――機械学習の実験を整えるReproBridge", "summaryHtml": "機械学習の実験を再現するには、論文や公開コード、付随する資料に散らばった手順を復元しなければならない。そのためコーディングエージェントの再現成功は、公開された成果物そのものよりも、欠落した細部を補う能力に左右されがちである。本研究は、回復した手順や意思決定を保存しておくことで、その後の独立した再現が改善するかを問う。<br><br>標準化された成果物設計として、精製されたコードベース、環境設定、実験ランチャー、再現ガイドを定め、それを構築するエージェントワークフローReproBridgeを提案する。評価用のReproBridge-Benchは36本の論文・387件の実験から1,029件のタスクを提供し、各タスクには人間が検証した参照スコアが5件ずつ付与されている。エージェントは新しいセッションで生のコードか精製された成果物を使って課題に挑み、別のAuditorが実行の証拠を確認する。<br><br>4つのモデルで評価した結果、精製された成果物により平均再現成功率は76.4%から92.6%へ上がり、下流のAPI支出は平均19.7%削減された。モデル間の成功率のばらつきは21.6ポイントから3.9ポイントに縮小し、4モデルすべてが平均90%超を達成した。構成要素を除くアブレーションでは成功率が低下し、コードと環境の除去による損失が最大だった。実行の知識を保存することが、再現の信頼性とコストの両方を改善する。", "url": "https://arxiv.org/abs/2611.08452", "publishedAt": "2026-11-05T18:45:36Z", "authors": ["Yubo Wang", "Rui Meng", "Jaehyun Nam", "Tomas Pfister", "Jinsung Yoon"], "categories": ["cs.AI"], "field": "cs.AI", "genre": "Agents / Reasoning", "timestamp": 1793904336000, "monthKey": "2026-11"}, {"source": "arXiv cs.LG", "title": "A Hidden Markov Preference Model for Online Prediction of Adversary Actions", "titleJa": "隠れマルコフ選好モデル――敵対者の次の行動をオンラインで予測する", "summaryHtml": "攻撃者の次の行動を予測しようとする防御側は、行動が起きる前に入手できる情報だけから、その行動の確率分布を作らなければならない。本研究は、攻撃者の行動様式（レジーム）がエピソード内で持続しつつ切り替わりうること、そして各行動が操作と状態依存の引数との組み合わせであり、実行可能な値が時間とともに変わること、という二つの構造を隠れマルコフモデルで捉える。潜在状態を現在のレジームとし、レジームごとの行動法則を、実行可能な行動の木に対するマスク付きの分布として定義する。<br><br>同じ尤度が次の行動の分布を与え、行動が観測されたあとにはレジームへの信念を更新する。部分的にしか観測されていない接頭辞も、解決済みの局所因子を通じて寄与する。推定は凸型のロジスティック回帰に分離でき、レジームのラベルがない場合にもバウム・ウェルチ法がそれを再利用できる。レジーム情報量を表す到達重み付きのノード単位KL表現や、切り替わるレジーム経路に対する系列単位の対数損失の上限、一様なフォールバック保証も導出されている。<br><br>サイバー防御のベンチマークCAGE 2での評価では、フィルタリングされた潜在状態が1ステップあたり0.8ナット分の情報量に相当し、制御器の切り替え後には損失が低下し始めるまで3ステップで済み、回帰型ベースラインの10ステップを大きく上回った。敵対的な行動のオンライン予測における隠れマルコフ型アプローチの有効性を示す結果である。", "url": "https://arxiv.org/abs/2611.08445", "publishedAt": "2026-11-05T18:37:07Z", "authors": ["Angel Daruna", "Michael Cogswell", "Tixiao Shan", "Yi Yao", "Han-Pang Chiu", "Ajay Divakaran"], "categories": ["cs.LG"], "field": "cs.LG", "genre": "Agents / Reasoning", "timestamp": 1793903827000, "monthKey": "2026-11"}, {"source": "arXiv cs.CL", "title": "Understanding AI from the Inside: The State of Mechanistic Interpretability for AI Safety", "titleJa": "AIを内側から理解する――AI安全のためのメカニスティック解釈可能性の現在", "summaryHtml": "ニューラルネットワークは人類史上もっとも影響力の大きい人工物のひとつになりつつあるが、能力と自律性が高まるほど社会に害を及ぼす可能性も増す。にもかかわらず、私たちはその内部の仕組みや未知の状況でのふるまいを十分に理解しないまま、ますます強力なシステムを構築し続けている。メカニスティック解釈可能性は、内部の表現と計算を調べることでモデルのふるまいを評価・予測・制御しようとするアプローチである。<br><br>本論文は「モデルがどう動くかを理解することが、本当にモデルを安全にするのか」という問いに答えるため、この分野を包括的に概観する。特徴や多義性、トランスフォーマーの計算、回路といった基礎概念を整理し、特徴抽出、回路発見と因果的検証、中間表現の自然言語による説明、学習動態、学習データへの帰属といった手法を幅広く紹介する。<br><br>さらに、解釈可能性の主張を評価する統一的な枠組みを提案し、目標や前提の異なる6つの研究志向を特徴づける。知識編集やステアリング、モニタリングといった安全への応用と、その限界や未解決の問題も検討し、再現用のコードノートブックも公開している。理解が安全性にどこまで寄与するかを問い直す、分野の現状をまとめた一論である。", "url": "https://arxiv.org/abs/2611.08438", "publishedAt": "2026-11-05T18:30:54Z", "authors": ["Fazl Barez", "Tung-Yu Wu", "Hunar Batra", "Gabriele Dominici", "Florent Draye", "Yanai Elazar", "Damiano Fornasiere", "Antía García", "Abir Harrasse", "Riley Harris", "Sara Hooker", "Michael Lan", "Belinda Z. Li", "Aaron Maiwald", "Narmeen Fatimah Oozeer", "Naomi Saphra", "Or David Shafran", "Adi Simhi", "Robert Trager", "Shriyash Kaustubh Upadhyay", "Ziyu Yao", "Yu Zhao", "Shay B. Cohen", "Mor Geva", "Yoshua Bengio", "Stella Biderman", "Hassan Sajjad"], "categories": ["cs.CL", "cs.AI", "cs.LG"], "field": "cs.CL", "genre": "Ethics / Safety", "timestamp": 1793903454000, "monthKey": "2026-11"}, {"source": "arXiv cs.CL", "title": "MedGraph: Maintaining Patient State with Graph Memory for Long-Term Medical Dialogue", "titleJa": "MedGraph――長期の医療対話で患者の状態を正しく保つグラフ記憶", "summaryHtml": "複数回の受診にわたって患者に付き添うLLM医療アシスタントには、患者の臨床状態の変化に合わせて正しい記憶を保つ仕組みが要る。著者らは、長期の医療対話における5つの記憶システムの誤りを調べ、3つの典型的な原因を見つけた。取り出した証拠が古い状態を示す、他人の健康情報が混ざる、回答に必要な安全情報が欠けている、というものである。<br><br>この3つの問題に対応するため、MedGraphというグラフ記憶を提案する。各セッションから日付付きの事実を抽出し、誰の事実かを紐づけ、薬剤・診断・測定値を連鎖として結び、過去の状態も保持する。検索では患者の連鎖を単位として順位づけ、質問が問う時点の状態を読み取り、元の対話文も添える。患者プロフィールには記録された安全情報をすべて列挙し、毎回の質問に添付する。<br><br>評価ベンチマークMedMemoryBenchでは、MedGraphはGPTとQwenのどちらの基盤モデルでも5つのベースライン中最高の全体精度を示し、最強のベースラインを10.5ポイントと10.4ポイント上回った。GPTを用いる設定では、記憶の構築と回答も効率的だった。", "url": "https://arxiv.org/abs/2611.08433", "publishedAt": "2026-11-05T18:27:20Z", "authors": ["Donghua Zhang", "Zizheng Wang", "Ze Dong", "Yiding Feng", "Siyu Qian"], "categories": ["cs.CL", "cs.AI"], "field": "cs.CL", "genre": "LLM / NLP", "timestamp": 1793903240000, "monthKey": "2026-11"}, {"source": "arXiv cs.AI", "title": "The Power of Meta Access in the Software of the Future --- Demonstrated on LLM Chat UIs and Chat AI", "titleJa": "メタアクセスの力――未来のソフトウェアでLLMチャットをワークスペースの操作層へ", "summaryHtml": "チャットは多くのLLMタスクの既定の画面であり続ける一方で、モデルが見ているのは現在の対話だけで、その周りのワークスペースは見えていない。本研究は「メタアクセス」――アシスタントにインターフェース自体の構造化された権限付きの見取り図を与える考え方を提案し、機能の案内、メタデータ・設定・好みへのアクセス、要約やメッセージの検索、確認を伴う変更、完全なオーケストレーションへと段階をなす梯子を示す。<br><br>メタアクセスにより、チャットクライアントは多くの画面の集合から、検索・移動・整理・操作の単一の入口へ変わる。その一方で、根拠づけやプライバシー、プロンプトインジェクション、信頼をめぐるリスクも生じる。汎用エージェントの枠組みは自らの設定を変えられる実行環境であり、メタアクセスは再帰的になるため、別の制御面の境界が必要になるという。<br><br>著者らは「Chat AI」クライアントのMeta Chatプロトタイプでこれを具体化した。要約や設定、関連メッセージから限定された文脈を構築し、会話や話題、ペルソナへの参照を結びつけ、確認可能で可逆的な変更を支え、チュートリアル集とペルソナ推薦を備える。スクリーンリーダーをウィジェットの説明から意味的なワークスペース操作へ拡張できる点も示す。IDEやダッシュボード、オフィススイート、OSへアシスタントが組み込まれるにつれ、インターフェースは自らの状態と能力を構造化された権限付きの形で開示すべきだと結論づける。", "url": "https://arxiv.org/abs/2611.08428", "publishedAt": "2026-11-05T18:22:24Z", "authors": ["Julian Kunkel", "Ali Doosthosseini"], "categories": ["cs.AI"], "field": "cs.AI", "genre": "Agents / Reasoning", "timestamp": 1793902944000, "monthKey": "2026-11"}, {"source": "arXiv cs.AI", "title": "StepBack: Step-Level Error-Localized Resampling for Efficient Test-Time Reasoning", "titleJa": "StepBack――ステップ単位の誤り局所化リサンプリングによる効率的なテスト時推論", "summaryHtml": "連鎖的思考（チェーン・オブ・ソート）の推論精度を上げる自己整合性（セルフ・コンシステンシー）は広く使われるデコード戦略だが、完全な推論軌跡をあらかじめ決めた予算で多数サンプリングする必要がある。既存の効率化手法は、全軌跡のサンプリングを途中で打ち切るか、質問ごとにサンプル数を配分するものが中心だった。本論文は、ステップ単位で誤りを局所化して再サンプリングする手法 StepBack を提案する。<br><br>StepBack はまず少数のドラフト軌跡を用意し、軽量なシグナルで最初の誤り位置の候補を特定する。次に、その誤りステップとそれ以降の接尾辞だけを再サンプリングし、多数決で最終回答を決める。7つの数学推論・マルチホップ質問応答ベンチマークでの評価では、平均精度は自己整合性と同等を維持しながら、トークン使用量を最大41.26%削減した。<br><br>さらに StepBack は Adaptive Consistency のような適応的推論手法と組み合わせることもでき、推論時の効率をさらに高められる。軌跡全体ではなく誤りのある部分だけをやり直すという発想で、テスト時推論のコストを大きく下げつつ精度を保つ実践的な手法である。", "url": "https://arxiv.org/abs/2611.08403", "publishedAt": "2026-11-05T18:12:49Z", "authors": ["Yang Ouyang", "Jung-Eun Kim"], "categories": ["cs.AI", "cs.CL", "cs.LG"], "field": "cs.AI", "genre": "Agents / Reasoning", "timestamp": 1793902369000, "monthKey": "2026-11"}, {"source": "Hugging Face Papers", "title": "Muir: Linear Attention with Sensitivity-Allocated Gating and Matched-Filter Readout", "titleJa": "Muir――感度配分ゲートとマッチドフィルタ読み出しによる線形アテンション", "summaryHtml": "線形アテンションは文脈を固定サイズのキー・バリュー状態に圧縮し、線形時間の学習と定数メモリでの推論を実現する。ゲート付きデルタルールモデルはこの状態を減衰させ、入力キーに対する予測を消去してから新しい値を書き込む。Gated DeltaNet-2（GDN-2）はチャネルごとの減衰と、分離されたフルランクの消去・書き込みゲートでこれを一般化した。しかし状態更新は、消去よりも書き込みに対してはるかに敏感であることが分かった。キーの活性化と単位正規化によりキーのエネルギーは少数のチャネルに集中する一方、値の書き込みは全チャネルに及ぶため、消去ゲートは低ランクで十分だという。<br><br>さらに、ゆっくり減衰する状態行は速い行よりはるかに大きなノルムを蓄積し、重みなしの読み出しを支配して、干渉を抑えるためにより強い書き込み時の消去を強いていた。そこでMuirは、すべてのゲートを感度配分型の低ランク射影に統合し、マッチドフィルタ読み出しゲートで状態行を重み付けし、節約したパラメータをより広いフィードフォワード層に再投資する。大きなチャンクサイズで広い行列ユニットを飽和させる際に、標準のチャンクワイズアルゴリズムが数値的に不安定になる問題に対しては、安定で効率的な学習のための並列更新を設計した。<br><br>1億6,600万〜13億4,000万パラメータの範囲で、MuirはGDN-2よりパープレキシティを1.8〜2.0%、Transformerより2.5〜3.6%下げ、常識精度を最大1.9ポイント上げ、抽出的想起も改善した。13億4,000万パラメータではマルチホップとマルチニードルの想起で両ベースラインを上回り、4Kの学習長から1,000万トークンのストリームへ2,560倍に外挿してもパープレキシティの漂いはなく、100万トークンまでのパスキャー検索はほぼ100%を維持した。GDN-2並みのスループットを保ちつつ、100Bトークンの検証損失に1.2倍速く到達し、32KではTransformerより2.7倍速く学習する。", "url": "https://arxiv.org/abs/2611.08376", "publishedAt": "2026-11-05T17:53:49Z", "authors": ["Tushaar Gangavarapu", "Gil Tabak", "Clemens JS Schaefer"], "categories": ["cs.LG"], "field": "cs.LG", "genre": "LLM / NLP", "timestamp": 1793901229000, "monthKey": "2026-11"}, {"source": "arXiv cs.CL", "title": "Cultural Adaptation within Repeated Social Interactions", "titleJa": "繰り返しの社会的相互作用における文化的適応", "summaryHtml": "文化の多くは暗黙のもので、実際の社会的相互作用のなかで学ばれる。LLMが多様なコミュニティで対話エージェントとして使われるようになるなか、文化的適応力を問うには、知識の有無を問う質問応答式の評価から離れ、「何を知っているか」ではなく「どう適応するか」という過程そのものを見る必要がある。本研究は、サンドボックス環境での繰り返しの相互作用を通じ、LLMが文化に適応できるかを調べ、文化適応の評価の射程を広げることを目指した。<br><br>著者らは文化的適応を、社会的相互作用を通じた規範の同化という連続的な過程として捉え直す。実験では、記憶の仕組みが繰り返しの相互作用をまたぐ長期的な学習を促し、異なる社会的場面への転移を助け、5言語にわたる多言語での規範の同化を可能にすることが示された。<br><br>文化への適応を一度きりの知識ではなく、相互作用のなかで続いていく学習として評価する枠組みを示した点が本研究の意義である。繰り返しの対話のなかで規範を吸収していくLLMの姿は、文化を静的な知識ではなく生きた実践として捉える見方を示している。対話を通じて文化を学び続けるLLMのあり方に向けた、土台となる研究といえる。", "url": "https://arxiv.org/abs/2611.08334", "publishedAt": "2026-11-05T17:23:30Z", "authors": ["Chen Cecilia Liu", "Roi Reichart", "Anna Korhonen"], "categories": ["cs.CL"], "field": "cs.CL", "genre": "LLM / NLP", "timestamp": 1793899410000, "monthKey": "2026-11"}, {"source": "Hugging Face Papers", "title": "Terminal-style Mathematical Modeling Bench: The First Agentic and Verifiable Benchmark for Mathematical Modeling", "titleJa": "ターミナル型数理モデリングベンチ――エージェントによる検証可能なモデリング評価", "summaryHtml": "数理モデリングは、現実の未解決問題を仮定・モデル・解法・提言へ落とし込む作業だが、その答えが価値を持つのは、信頼できる参照に近く、かつ物理的に実現可能な場合に限られる。既存のベンチマークは解法の断片を採点するか、LLMジャッジに報告書を採点させるもので、数値の検証が不十分だった。<br><br>本研究はTB-MathModel（ターミナル型数理モデリングベンチ）を提案する。2023〜2025年の実際のCUMCM・MCM問題18題を対象に、コンテスト形式のモデリング問題をエージェント的・検証可能・ターミナル完結にした初のベンチマークである。各課題は問題文と公式の添付資料・図をコンテナ化されたターミナルで提供し、エージェントは1つのJSON成果物を返す。採点は、最優秀賞論文の再現に対する最終設問の数値的な中核で行われる。<br><br>特徴は2つある。アンカーを上回ることを罰しない方向感覚のある片側採点と、6種の決定可能な不変条件に対するプログラム的ゲートと624件のLean 4義務による2層の実現可能性検証で、実現不可能な答えは厳しいゲートで0点になる。7つのマルチモーダルなエントリでは、最強のものが多参照O-Evalで64.58%に達し、オープンモデルも59.81%を100分の1のコストで記録した。長時間のモデリング能力を測る、再現可能な機械検査可能な指標である。", "url": "https://arxiv.org/abs/2611.08237", "publishedAt": "2026-11-05T16:18:35Z", "authors": ["Xiaojun Wu", "Cehao Yang", "Xuhui Jiang", "Chengjin Xu", "Jia Li", "Jian Guo"], "categories": ["cs.CL"], "field": "cs.CL", "genre": "Agents / Reasoning", "timestamp": 1793895515000, "monthKey": "2026-11"}, {"source": "arXiv stat.ML", "title": "Identifying Neural Dynamics Using Nonlinear Interventional State Space Models", "titleJa": "神経ダイナミクスを同定する――非線形介入型状態空間モデル", "summaryHtml": "状態空間モデルは高次元の観測から低次元の潜在ダイナミクスを復元するが、観測データだけでは潜在変数は一般に同定できない。介入型状態空間モデル（iSSM）は摂動によって観測上の対称性を破り、置換・スケーリング・シフトを除いてパラメータを同定する。ただし従来の理論は線形の潜在ダイナミクスと区分線形の出力に限られ、神経回路に特徴的なふるまいの多くを扱えなかった。<br><br>本研究はiSSMを大幅に広いモデルクラスへ拡張する。一般の単射な出力関数とガウス型の潜在遷移のもとでアフィン同定可能性が成り立つこと、さらに介入があれば一般の非線形潜在ダイナミクスのもとでも置換・スケーリング・シフトを除く同定可能性が保たれることを証明した。シミュレーションではFitzHugh-Nagumoダイナミクスで理論を検証している。<br><br>応用として、意思決定の競合モデルの判定と、サルとヒトの神経記録における未知の微小刺激への応答予測を示し、ヒトのデータでは保持しておいた刺激部位への汎化も確認した。刺激プロトコルの設計指針もシミュレーションから導いている。神経回路の同定に理論的な足場を与える研究である。", "url": "https://arxiv.org/abs/2611.08113", "publishedAt": "2026-11-05T14:48:35Z", "authors": ["Hanna M. Tolle", "Carles Balsells-Rodas", "Yixin Wang", "Pedro A. M. Mediano", "Amin Nejatbakhsh"], "categories": ["stat.ML", "cs.LG"], "field": "stat.ML", "genre": "Consciousness / Neuroscience", "timestamp": 1793890115000, "monthKey": "2026-11"}, {"source": "arXiv cs.CL", "title": "Automatic keyphrase extraction and annotation: modern theoretical approaches and practical solutions for text and speech", "titleJa": "キーフレーズ抽出と注釈の現在――テキストと音声における理論と実践の包括的レビュー", "summaryHtml": "テキストと音声・映像情報の爆発的な増加に伴い、文書や発話の要点を自動で抽出するキーフレーズ抽出（KE）の重要性が高まっている。本論文はテキストと音声の両モダリティにわたる現代の理論的アプローチと実践的解決策を包括的に分析し、これまでばらばらに論じられてきた研究の流れを統一的な分析枠組みへと統合する。統計的手法から大規模言語モデル（LLM）や音声のエンドツーエンド処理へと至る分野の変遷をたどる。<br><br>論文はキーフレーズ抽出の各段階、書き言葉と話し言葉におけるキーフレーズの特性、用語の微妙な違いを検討する。統計的・ハイブリッド・機械学習ベース・構造的といった多様な手法を詳細に分析し、LLMによるキーフレーズ生成という新たなパラダイムや、コーパスへの自動注釈の方法論と課題にも多くの紙幅を割く。話し言葉については、書き起こしに基づく手法と音響信号を直接扱うエンドツーエンド手法を比較し、それぞれの方向性と困難を論じる。<br><br>著者らの結論として、この分野はより統合的で文脈を意識したパラダイムへ向かっている。今後の進展は、低リソース言語におけるデータ不足、効果的なマルチモーダル融合、生成型キーフレーズ抽出システムの繊細な評価といった課題の解決にかかっているという。キーフレーズ抽出の現在地と今後の課題を一望できる包括的レビューである。", "url": "https://arxiv.org/abs/2611.08006", "publishedAt": "2026-11-05T13:31:35Z", "authors": ["Daria Guseva", "Olga Mitrofanova"], "categories": ["cs.CL", "cs.HC"], "field": "cs.CL", "genre": "LLM / NLP", "timestamp": 1793885495000, "monthKey": "2026-11"}, {"source": "arXiv cs.CY", "title": "Technohybridism: Recursive Semantic Normalization in AI-Mediated Societies", "titleJa": "テクノハイブリディズム――AIが媒介する社会における再帰的な意味の正規化", "summaryHtml": "言語生成AIはもはや言語的やり取りの対象にとどまらない。その出力は、訓練データの源となったコミュニケーションや制度的実践のなかへ再び入り込み、定着していく。本論文は社会理論、社会認識論、言語哲学を手がかりに、この再流入の社会技術的な説明を展開する。<br><br>著者らは「再帰的意味の正規化」という概念を導入する。機械生成の表現が繰り返し取り上げられ、評価され、再利用され、制度的に保持されることで、意味の規則性の再生産と変容に関与していく過程である。「テクノハイブリディズム」のもとで分析の単位となるのは、人間の実践、計算機による生成、制度的な取り込みが再帰的に結びついたハイブリッドな意味システムだという。<br><br>論文は生成・選択・取り込み・持続を区別する分析モデルを示し、機械に帰属できる変化と、そうでなくとも起きた変化とを切り分ける。さらに、取り込みが制度的に拡散し社会的に層化する実践であることを分析し、機械由来の規則性が規範になるときの条件を述べる。社会的・認識論的な帰結として、出所の洗浄による認識的警戒の弱まり、集合的探究を支える認知的多様性の浸食、共有された解釈資源の狭まりを指摘する。機械の出力に規範的な権威を認めるものではなく、変化するのは人間と制度の取り込みが働く場そのものだという。", "url": "https://arxiv.org/abs/2611.07984", "publishedAt": "2026-11-05T13:14:00Z", "authors": ["Charalampos M. Liapis", "Epameinondas Panagopoulos"], "categories": ["cs.CY", "cs.AI", "cs.HC"], "field": "cs.CY", "genre": "Consciousness / Philosophy", "timestamp": 1793884440000, "monthKey": "2026-11"}, {"source": "arXiv cs.AI", "title": "A Behavioural Framework for Predicting and Understanding Loss of Control in Frontier Artificial Intelligence Systems", "titleJa": "フロンティアAIの制御喪失リスクを予測する行動学的枠組み", "summaryHtml": "フロンティアAIシステムは人間の監督が薄れるなかでますます長期間にわたって動作するようになり、制御の喪失――人間の実効的な制御を超えて、取り返しのつかない結果を招くふるまい――のリスクが高まっている。こうした失敗は封じ込めが難しくなってから初めて顕在化するおそれがあるため、事後ではなく事前に評価する必要がある。<br><br>本論文は制御喪失リスクを「動機のミスアライメント」「危害を可能にする能力」「監視の回避」という三つの要因に分解する行動学的枠組みを提案する。これらを13の測定可能な側面と29の評価タスクとして操作化し、統合して制御喪失（LoC）スコアを算出する。13のフロンティアモデルで検証したところ、LoCスコアは封じ込められた長期リスクシナリオでの失敗率と強く相関し（ピアソン r = 0.84）、将来の失敗を予測する妥当性が示された。リスクはモデルごとに系統的に異なり、能力の高さだけでは説明できなかった。<br><br>さらに、診断された脆弱性に狙いを定めたファインチューニングや監視によって失敗率を下げられることも示され、汎用性能をほぼ維持したまま緩和できるという。制御喪失が現実化する前に予測・理解・緩和するための実践的な基盤となる研究である。", "url": "https://arxiv.org/abs/2611.07953", "publishedAt": "2026-11-05T12:49:20Z", "authors": ["Yao Huang", "Yichi Zhang", "Yifan Wang", "Yitong Sun", "Haoyu Dong", "Jifan Ma", "Jinzhe Tu", "Xiaojian Li", "Sören Mindermann", "Wei Xu", "Yinpeng Dong"], "categories": ["cs.AI", "cs.CL", "cs.LG"], "field": "cs.AI", "genre": "Ethics / Safety", "timestamp": 1793882960000, "monthKey": "2026-11"}, {"source": "Hugging Face Papers", "title": "SAE Interprets MoE: Sparse AutoEncoders Reveal That MoE Experts Exhibit Human-Interpretable Fine-Grained Specialization", "titleJa": "SAEが解き明かすMoE――スパースオートエンコーダが示す専門家の人間にも理解できる細かな分業", "summaryHtml": "Mixture-of-Experts（MoE）モデルは各トークンを多数のエキスパートのうち少数に振り分けるが、個々のエキスパートが何を担っているかは未解明のままだった。従来の分析は、分野ラベル付きコーパスでエキスパートが選ばれる頻度を数えるもので、分類をあらかじめ固定し、粗く、寄与ではなく選択を記録するものだった。本論文は、MoE層の出力にスパースオートエンコーダ（SAE）を訓練し、特徴空間で専門化を調べる。<br><br>MoE層の出力はエキスパート出力のルーター重み付き和であり、SAEのエンコーダはアフィンであるため、すべての潜在変数の事前活性化はエキスパートごとに正確に分解できる。コーパス全体で集計すると、各エキスパートは、その活性化を主に駆動する潜在変数の支配的な集合を持つ。Qwen3-30B-A3Bの第4・30・46層では、寄与はゲーティングよりもはるかに集中しており、ほとんどの潜在変数は1〜2人の支配者しか持たず、支配集合の重なりは少数のエキスパートペアに集中していた。<br><br>支配集合を自動解釈すると、粗い分野の下にある分業が見えてくる。Javaとフロントエンドのウェブコード、あるいは幾何と算術・多項式で異なるエキスパートが働く一方、粗い分野そのものが使うエキスパート数は大きく偏っていた。エキスパートの働きを「選ばれる回数」ではなく「何に寄与するか」で測ることで、MoEの内部構造を人間が理解できる粒度で描き出した研究である。", "url": "https://arxiv.org/abs/2611.08089", "publishedAt": "2026-11-05T09:35:08Z", "authors": ["Anyuan Zhuo", "Shaohua Zhang", "Yuan Lin", "Pinyan Lu"], "categories": ["cs.LG"], "field": "cs.LG", "genre": "LLM / NLP", "timestamp": 1793871308000, "monthKey": "2026-11"}, {"source": "Crossref", "title": "Rethinking the Concept of Consciousness", "titleJa": "意識という概念の再考――エーテルやフロギストンのように消えゆくのか", "summaryHtml": "意識の研究は神経科学、哲学、心理学、物理学、計算機科学にまたがっているが、その多くは意識の本質そのものではなく、意識がもたらす効果を示すことに向けられている。意識は思考過程を覆う包括的な概念として使われながら、その本質は依然として明らかになっておらず、将来的により精密に定義されることが期待されている。なかには意識がニューロンや細胞骨格のなかに宿ると考える理論もある。<br><br>著者は科学史を振り返り、かつて広く受け入れられながら後に存在しないことが判明した概念があることを指摘する。論文の主張は、意識はエーテルやフロギストンと似ているというものだ。これらはかつて科学的真理とみなされたが、最終的には棄却された。意識が根本的な実在なのか、それとも錯覚なのかをめぐる論争は続いているが、著者は意識はたんなる用語にすぎず、実在でも錯覚でもないと断じる。<br><br>脳機能の分子レベルの理解が深まるにつれて、意識という概念もエーテルやフロギストンと同じように、やがて科学の言説から姿を消すだろうというのが本論文の結論である。意識をめぐる問いを概念そのものの問い直しへと転換させる、挑発的な一論である。", "url": "https://doi.org/10.1111/meta.70054", "publishedAt": "2026-11-05T01:01:01Z", "authors": ["Emrah Yücesan"], "categories": ["philosophy of mind", "consciousness"], "field": "Metaphilosophy", "genre": "Consciousness / Philosophy", "timestamp": 1793840461000, "monthKey": "2026-11"}, {"source": "Crossref", "title": "Leveraging AI: Research ethics in action by design", "titleJa": "AIを活用する研究の倫理を設計段階から組み込む", "summaryHtml": "人工知能は発見の加速や効率化、複雑なデータの新たな活用を通じて科学研究を大きく変えつつある。その一方で、説明責任や説明可能性、プライバシー、データの完全性、バイアスといった倫理的課題も生んでいる。科学的妥当性や参加者の保護、公共の信頼が直接かかっているからこそ、研究におけるこれらの懸念は重要だ。<br><br>本論文は、倫理を後付けのコンプライアンス作業として扱うのではなく、AIを活用した研究のごく初期段階から倫理的な省察と意思決定を組み込む「倫理バイ・デザイン」のアプローチを提唱する。責任あるAIに関する国際的な指針に沿い、人々、プロセス、ガバナンス、コミュニティという互いに補強し合う四つの次元からなる実践的な枠組みを示す。AIシステムは動的で文脈に依存するため、適応的な監督や部門横断的な説明責任、関係者の実質的な関与が求められる。<br><br>倫理を設計、導入、評価の各段階に統合することで、研究機関は革新と責任のバランスを取りやすくなり、信頼でき、社会的に正当な科学の進歩を支えることができると著者は結論づけている。", "url": "https://doi.org/10.56012/cgqc1793", "publishedAt": "2026-11-05T01:01:01Z", "authors": ["Uma Swaminathan"], "categories": ["research ethics", "AI governance"], "field": "Medical Writing", "genre": "Ethics / Safety", "timestamp": 1793840461000, "monthKey": "2026-11"}, {"source": "Crossref", "title": "Impairment of ictal consciousness and psychosis in drug‐resistant focal epilepsy: A retrospective clinical cohort study", "titleJa": "発作時の意識障害とてんかん精神病――薬剤抵抗性焦点性てんかんの後方視的コホート研究", "summaryHtml": "てんかん精神病（POE）は焦点性てんかん患者の最大13%にみられる合併症である。発作と発作の間の時期（発作間欠期）のリスク因子はよく調べられているが、発作そのものの最中（発作時）の特徴とPOEとの関連は十分に解明されていなかった。本研究は、発作時の意識障害の程度を測るConsciousness Seizure Scale（CSS）のスコアがPOEと関連するという仮説を検証した。<br><br>著者らは、ビデオ脳波または定位脳波でモニタリングされた薬剤抵抗性焦点性てんかんの成人術前コホートを後方視的に解析した。CSSの評価が可能な発作232件（POE群25件、非POE群207件）を対象に、標準化された精神医学面接でPOEを同定し、一般化推定方程式で発作時の特徴とPOEの関連を検討した。<br><br>結果として、POEの確率は発作時の意識障害と非線形の関係にあり、中程度のCSSスコアでピークを迎えた（オッズ比4.31）。この関連は、てんかんの罹病期間や発作の持続時間で調整した後も有意だった。部分的な意識の途絶が精神症状の出現を促す可能性が示唆される。CSSは患者内での安定性も高く（級内相関0.76）、発作時の意識の変化のあり方がPOEリスクを左右しうるという新たな視点を示す研究である。", "url": "https://doi.org/10.1002/epi.70562", "publishedAt": "2026-11-05T01:01:01Z", "authors": ["Alexis Tarrada", "Coraline Hingray", "Olivier Aron", "Clélia Galmiche", "Louis Maillard", "Marco Mula", "Bertrand De Toffol", "Cédric Baumann", "Sophie Baltassis"], "categories": [], "field": "Epilepsia", "genre": "Consciousness / Neuroscience", "timestamp": 1793840461000, "monthKey": "2026-11"}, {"source": "OSF Preprints", "title": "Changing moral beliefs and behaviors using human-AI dialogues", "titleJa": "人間とAIの対話で道徳的信念と行動は変わるか", "summaryHtml": "道徳的信念は変わりにくいと考えられてきたが、対話型AIの登場は道徳的説得の新たな手段をもたらした。本研究では事前登録された実験で500人の参加者を無作為に割り付け、肉食または慈善への寄付をしないことが道徳的に誤っていると説得するよう促されたAIエージェントと5ラウンドの対話を行わせた。<br><br>対話の結果、道徳的信念は意図した方向へ大きく即時的に変化し、効果量はコーエンのdで0.37〜0.48だった。行動面の変化もみられ、慈善について対話した参加者はボーナスのうち慈善へ寄付する割合が16.35%高く、肉食について対話した参加者は牛肉バーガーではなく植物性バーガーのバウチャーを選ぶ割合が25.04ポイント高かった。1か月後もバーガー選択への効果は残ったが、他の効果は持続しなかった。<br><br>参加者の道徳的正当化とAIの説得方略の自然言語分析からは、直接的な道徳的議論と並んで、事実の訂正が説得を部分的に後押ししていたことが示唆された。とくに肉食の領域では、肉食の自然さや生物学的必要性への訴えが参加者側に最も多かった。対話型AIが人間の価値観を大規模に形作る可能性について、重要な問いを投げかける結果である。", "url": "https://osf.io/preprints/psyarxiv/6qf9p_v3/", "publishedAt": "2026-11-05T00:00:00Z", "authors": ["Joshua Paul White", "Carter Allen", "Lucius Caviola", "David Rand"], "categories": ["moral psychology", "human-AI interaction"], "field": "PsyArXiv", "genre": "Ethics / Safety", "timestamp": 1793836800000, "monthKey": "2026-11"}, {"source": "Crossref", "title": "Systemic ethics framework for artificial intelligence in nursing and healthcare", "titleJa": "看護・医療におけるAIのためのシステム倫理フレームワーク――現場・組織・政策の三層モデル", "summaryHtml": "AIが臨床意思決定支援やトリアージ、予測モニタリングなどを通じて看護・医療の現場に入り込むなかで、専門職としての責任、道徳的主体性、記録の責任、人間の監督、オーバーライドの権限といった問いが切実になっている。原則中心やガバナンス中心の既存のアプローチは規範的な土台を与えるが、日常の臨床実践でこうした緊張がどう交渉されるかについての指針は限られる。<br><br>本研究は2014〜2025年の文献を対象に、Web of ScienceとPubMedから629件を抽出し、41件を統合的に分析した統合的レビューである。書誌マッピングとテーマ統合を組み合わせ、規範的基盤、ガバナンスと説明責任、信頼と透明性、データ正義と公平性、組み込み型・ライフサイクル倫理、教育と倫理リテラシー、生成AIと新興リスク、患者中心・関係性の倫理という8つの概念軸を抽出した。<br><br>これらの軸から、現場（ミクロ）・組織（メソ）・政策（マクロ）の三層で動くシステム倫理モデルを構築した。AI倫理を動的で関係的、フィードバックに敏感な過程として捉え、明確な責任体制、意味のある人間の監督、継続的な倫理モニタリング、専門職の判断への制度的支援を求める。関係性のケアの価値と適応的ガバナンスを結びつけ、AIの倫理的な導入に向けた実践的な基盤を示す研究である。", "url": "https://doi.org/10.1177/09697330261502186", "publishedAt": "2026-11-05T00:00:00Z", "authors": ["Ehsan Javanmardi", "Mohammad Nazari", "Cansu Aksu"], "categories": ["AI ethics", "nursing ethics", "healthcare"], "field": "Nursing Ethics", "genre": "Ethics / Safety", "timestamp": 1793836800000, "monthKey": "2026-11"}, {"source": "arXiv cs.CV", "title": "From Pixels to Actions - Towards Native Vision-Language-Action Policies", "titleJa": "ピクセルから行動へ――視覚エンコーダを持たないネイティブな視覚・言語・行動ポリシー", "summaryHtml": "視覚・言語・行動（VLA）モデルは通常、視覚エンコーダで知覚を圧縮してから行動の推論を始める構成を取る。しかしマニピュレーションで決定的に重要なのは、局所的な形状、境界、奥行き、微妙な状態変化といった、まさにこの抽象化で失われやすい視覚信号である。本論文は、行動ポリシーが固定された視覚的終端を受け継ぐべきか、進化する視覚計算へ直接アクセスすべきかを問う。<br><br>著者らは、構造的にエンコーダを持たないVLAフレームワーク「NEO-VLA」を提案する。画像は軽量なパッチ畳み込み層でトークン化され、言語とともにバックボーン全体を通じて進化し、フローマッチング型の行動エキスパートが、指示に条件づけられた視覚表現を異なる深さから引き出せる。<br><br>制御された比較では、ネイティブなアーキテクチャがエンコーダ型の counterpart を一貫して上回り、全ファインチューニングを行っても差は縮まるものの消えなかった。視覚表現を早い段階で固定せず、行動生成と並行して育てる設計が、操作タスクの性能に効くことを示している。", "url": "https://arxiv.org/abs/2611.06918", "publishedAt": "2026-11-04T18:59:58Z", "timestamp": 1793818798000, "monthKey": "2026-11", "field": "cs.CV", "genre": "Vision / Multimodal", "authors": ["Weichen Fan", "Haiwen Diao", "Penghao Wu", "Siyuan Hu", "Ziqi Huang", "Tianqi Liu", "Mingze Sun", "Ziyi Wang", "Zhongang Cai", "Hanming Deng", "Quan Wang", "Lei Yang", "Lewei Lu", "Fangzhou Hong", "Zhaoxi Chen", "Dahua Lin", "Ziwei Liu"], "categories": ["cs.CV"]}, {"source": "arXiv cs.MA", "title": "A Framework for Context Enrichment and Selective Robustness in LLM Social Agents", "titleJa": "LLM社会エージェントの文脈強化と選択的ロバストネス", "summaryHtml": "大規模言語モデルを社会シミュレーションのエージェントとして使う研究が増えているが、LLMエージェントは意味を保つプロンプトの言い換えでも行動が大きく変わることが知られ、シミュレーションの妥当性検証上の問題になっている。脆弱さの背景には文脈の「接地（グラウンディング）」不足があるという仮説があるが、文脈の豊かさとロバストネスを制御比較できる形で定義した研究は少なかった。<br><br>本論文は2つの道具立てを用意する。第一に「制御された文脈強化」――中立的な埋め草、一般的な社会的背景、説明的な意思決定の根拠、規範的な意思決定の根拠という、異なる種類の文脈を体系的に強化するプロンプト置換ルール群。第二に、検証基準としての「選択的ロバストネス」の導入である。<br><br>文脈を厚くすれば何でも頑健になるわけではなく、どの種類の文脈がどの種類の変動に対する安定性をもたらすかを切り分けて測る枠組みを提示する点に、本研究の意義がある。LLMエージェントによる社会シミュレーションの信頼性を吟味するための基礎的な方法論である。", "url": "https://arxiv.org/abs/2611.06914", "publishedAt": "2026-11-04T18:58:23Z", "timestamp": 1793818703000, "monthKey": "2026-11", "field": "cs.MA", "genre": "LLM / NLP", "authors": ["Mattia Greiche", "Reihaneh Rabbany", "Maximilian Puelma Touzel"], "categories": ["cs.MA", "cs.CL", "cs.LG"]}, {"source": "arXiv cs.RO", "title": "cuRoboV2-Fast: Fast Torque-Limited Collision-Free Motion Planning", "titleJa": "cuRoboV2-Fast――トルク制約下でも衝突しない動作計画をGPUで高速化", "summaryHtml": "NVIDIAの研究チームは、衝突回避・積載物対応・トルク制約付きの動作計画について、計画レイテンシと実行時間の両方を短縮するGPU高速化プランナ「cuRoboV2-Fast」を発表した。Bスプライン軌道最適化で必要な反復回数を減らし、高速化されたロボット計算と微分可能な逆動力学で洗練コストを下げ、変化する積載物にも対応する。<br><br>経路に沿った移動速度は、速度・加速度・ジャーク・トルクの制約をサンプリングしながら最適化するTimeOptが担い、スプラインの局所サポートを利用して帯状のニュートン系をGPU上で効率的に解く。<br><br>3kgの積載物条件では、RTX 5090上で平均計画時間4.4ミリ秒を達成し、cuRoboV2より14.7倍高速になった。Jetson AGX Orin上でも cuRoboV1＋TOPPRA（RTX 5090実行）を上回る。ステレオカメラを備えたYAMへの実機配備では、ピック＆ドロップのサイクルが平均5.93秒と、cuRoboV2より34.6%短縮された。コードはApache 2.0で公開されている。", "url": "https://arxiv.org/abs/2611.06913", "publishedAt": "2026-11-04T18:58:20Z", "timestamp": 1793818700000, "monthKey": "2026-11", "field": "cs.RO", "genre": "Agents / Reasoning", "authors": ["Balakumar Sundaralingam", "Adithyavairavan Murali", "Stan Birchfield"], "categories": ["cs.RO"]}, {"source": "arXiv physics.flu-dyn", "title": "FlowReconBench: Accuracy, calibration and cost of learned and classical flow reconstruction from sparse sensors", "titleJa": "FlowReconBench――スパースセンサからの流れ場再構成を、精度・較正・コストで比べる", "summaryHtml": "スパースなセンサ計測から流れ場全体を再構成するには、測っていない領域や物理量についての事前仮定が欠かせない。しかし、学習型モデルが古典的推定手法を上回るのはどんな場合で、予測のどこまでが信頼できるのかは明らかでなかった。本論文の「FlowReconBench」は、学習型10手法と古典的5手法を3つのレジームで比較するベンチマークである。<br><br>対象はレイノルズ数を変えた層流円柱後流、2次元コルモゴロフ乱流、大規模な3次元等方性乱流。漏洩を管理したデータ分割とセンサ配置を全手法で共有し、チャネルごとの誤差、アンサンブルの広がり、較正、スペクトル、コストで採点する。<br><br>結果はレジームごとに入れ替わった。古典的手法は低次元でセンサが密な条件に強く、円柱後流では線形確率推定とギャッピーPODが、観測していない圧力の推定でも先行した。3次元では逆距離重み付けが観測チャネルで最良の学習型手法に並んだ。学習型が優位になる条件は限定的であり、「学習型が常に勝つ」という単純な図式は成り立たないことを示している。", "url": "https://arxiv.org/abs/2611.06912", "publishedAt": "2026-11-04T18:57:47Z", "timestamp": 1793818667000, "monthKey": "2026-11", "field": "physics.flu-dyn", "genre": "Generative Models", "authors": ["Nicolas Tricard", "Linzheng Wang", "Jason Chen", "Sili Deng"], "categories": ["physics.flu-dyn", "cs.LG"]}, {"source": "arXiv cs.AI", "title": "BEAKER: An Expert-Curated Benchmark for Embodied Brains in Self-Driving Chemical Laboratories", "titleJa": "BEAKER――自動化化学実験室の「身体化した頭脳」を測る専門家監修ベンチマーク", "summaryHtml": "自動運転型化学実験室（SDCL）は、機械が実験室の場面を知覚し、実験の状態について推論し、物理的・手順的・安全上の制約のもとで行動する「身体化した自動化」へと化学実験を移しつつある。マルチモーダル大規模言語モデル（MLLM）がその「身体化した頭脳」の候補と目される一方、既存の実験室ベンチマークは安全性や異常検出、一般的な科学理解に偏り、実行志向の身体化能力は十分に測られてこなかった。<br><br>本論文は、SDCLにおける身体化された行動可能性・知識・実験・推論を評価するベンチマーク「BEAKER」を提案する。専門家が監修した1,000件の質問応答サンプルを、画像と動画の11種のタスク類型にわたって収録する。<br><br>内容は、アフォーダンスの接地、軌道計画、装置・状態・安全の認識、器具のセットアップ、操作と手順の推論など、化学実験の実行に必要な主要な判断をカバーする。MLLMを実験室の実行主体として使う前に、その能力と限界を測るための物差しとなる。", "url": "https://arxiv.org/abs/2611.06911", "publishedAt": "2026-11-04T18:57:17Z", "timestamp": 1793818637000, "monthKey": "2026-11", "field": "cs.AI", "genre": "Vision / Multimodal", "authors": ["Fei Lin", "Tengchao Zhang", "Ziyang Gong", "Xiaotong Yu", "Bohan Zhang", "Yifan Zhou", "Qihao Yang", "Ji Dai", "Dong Li", "Yining Jiang", "Qinghua Ni", "Jun Huang", "Qiang Zhang", "Yue Zhou", "Zhihang Zhong", "Yonglin Tian", "Fei-Yue Wang", "Xue Yang"], "categories": ["cs.AI"]}, {"source": "arXiv cs.AI", "title": "FrontierPhysics: Evaluating Agents for End-to-End Physics Research", "titleJa": "FrontierPhysics――物理学研究の全工程をAIエージェントに任せて評価する", "summaryHtml": "AIエージェントは物理学研究でますます重要な役割を担いつつあるが、既存の物理学ベンチマークは固定された問題、孤立したサブタスク、解法が与えられた論文再現しか評価せず、正しさと並んで研究の質を問うことはまれだった。本論文は、エンドツーエンドのベンチマーク「FrontierPhysics」を提案する。<br><br>課題は56件で、42人の物理学者が自身の研究をもとに作成し、理論・計算・実験にまたがる9領域をカバーする。各課題では、文献調査、研究計画の立案、研究と実験の実施、構造化された成果物と科学論文の作成までをエージェントが行う。決定的な検証器と専門家が書いたルーブリックを組み合わせ、研究が正しいかだけでなく、公表に値するかを評価する。<br><br>22モデル・26構成の評価では、どの構成も168回の試行のうち46回を超えて合格できなかった。軌跡の手作業レビューでは、最先端エージェントの主な弱点は、推論の厳密さの不足と限られた自己検証にあることが示された。", "url": "https://arxiv.org/abs/2611.06910", "publishedAt": "2026-11-04T18:56:22Z", "timestamp": 1793818582000, "monthKey": "2026-11", "field": "cs.AI", "genre": "Agents / Reasoning", "authors": ["Bingran You", "Wenjun Ke", "Ria Rosenauer", "Bo Liu", "Wenbo Chen", "Min Chen", "Shuqi Xu", "Yue Ma", "Jiechao Feng", "Bo Chen", "Xiangkai Sun", "Jiarui Liu", "Jinen Guo", "Zeyu Zhou", "Xu Huang", "Zhuohan Li", "Haoyu Li", "Heguang Lin", "Lijie Ding", "Yadong Zeng", "Kangqi Zhang", "Xinge Liu", "Hanwen Liu", "Zhenghong Li", "Alexander von Recum", "Yuchen Zhu", "Felix Schwarzfischer", "Yizhou Zhao", "Jicheng Wang", "Binxu Li", "Qian Yu", "Chan Li", "Cheng Dai", "Di Wang", "Haoyu Zhang", "Jiankai Sun", "Kaituo Feng", "Mian Qin", "Ruihong Yin", "Yiqun Luo", "Weiwei Wu", "Shihong Pan", "Tsung Yeh Hsieh", "Xiao Huang", "Yan Zhang", "Sihan Li", "Zirui Ren", "Zengji Tu", "Kyoung Whan Choe", "Ke Sun", "Vincenzo Galia", "Vaisakhi Mishra", "Jiashu He", "Hongyang Wang", "Zhiheng Yang", "Shubham Gaur", "Yifan Gu", "Shuyi Wang", "Zihao Zuo", "Steven Dillmann", "Yiyou Sun", "Xinyang Han", "Hanchung Lee", "Molei Tao", "Yue Zhao", "Shilong Liu", "Yuchen Wu", "Xuandong Zhao", "Xiangyi Li", "Florian Brand", "Gerbrand Ceder", "Hartmut Haeffner"], "categories": ["cs.AI"]}, {"source": "arXiv cs.RO", "title": "Perceptive Humanoid Motion from Simulation", "titleJa": "シミュレーションから学ぶ知覚的ヒューマノイド動作――HALO", "summaryHtml": "ヒューマノイドロボットは幅広い物理タスクの自動化を担う潜在力を持つが、汎用的な自律性への進歩はデータのボトルネックに制約されている。ピクセルと自由形式の言語を低レベルの関節指令へ結びつけるには対になった教師データが必要だが、十分な規模のコーパスは存在しない。人間の遠隔操作やウェアラブル計測に頼る方法では、1時間のデータを得るのに少なくとも1時間の人手がかかる。<br><br>本論文の「HALO」は、手続き的に生成した1,000軒の家屋にわたって視覚・言語・動作データを合成するパイプラインで駆動されるヒューマノイド自律システムである。コーパスは人間の労働ではなく計算量に応じて拡大する。<br><br>HALOは、椅子に座る、名前で指定された物体へ移動する、半開きのドアを横向きに通り抜ける、テーブルの下をかがんで這う、箱を押すといった身体技能のレパートリーを獲得し、それらを組み合わせて複合的で長期のタスクを解く。実在の家屋を一度も見ずに合成データだけで学ぶアプローチの到達点を示している。", "url": "https://arxiv.org/abs/2611.06908", "publishedAt": "2026-11-04T18:55:33Z", "timestamp": 1793818533000, "monthKey": "2026-11", "field": "cs.RO", "genre": "Vision / Multimodal", "authors": ["Siyuan Hu", "Abulikemu Abuduweili", "Yue Meng", "Shipeng Liu", "Quentin Leboutet", "Chen Chen", "Matthias Müller", "Vladlen Koltun"], "categories": ["cs.RO", "cs.AI", "cs.CV", "cs.LG"]}, {"source": "arXiv cs.LG", "title": "Reinforcement Learning Enables Scaling Generalist Robot Policy Improvement", "titleJa": "強化学習で汎用ロボットポリシーを「汎用的に」改善する", "summaryHtml": "汎用ロボットポリシーの登場により、単一の大規模モデルが膨大な事前学習コーパスから多様なタスクを学べるようになった。これらのモデルは強力なゼロショット汎化を示す一方、実配備で十分な性能を得るには適応の段階が通常必要である。強化学習（RL）による反復的な自己改善はその適応策として有望視されてきたが、従来の検討は、狭い配備タスクの改善だけを目指す単一タスク設定にほぼ限られていた。<br><br>本研究は、汎用ポリシーが配備先で多様なタスクを同時に狙う「マルチタスクで汎用的な改善」を実現できるか、そしてそれを可能にするアルゴリズムのレシピは何かを問う。<br><br>著者らはまず、汎用的改善の能力を検証する構造化された評価群を開発し、系統的な検討を行った。ベースポリシーのマルチタスク性と矛盾しない形で、RLによる自己改善を複数タスクへ同時に効かせるための条件と手法を明らかにすることを目指している。", "url": "https://arxiv.org/abs/2611.06905", "publishedAt": "2026-11-04T18:52:28Z", "timestamp": 1793818348000, "monthKey": "2026-11", "field": "cs.LG", "genre": "Robotics", "authors": ["Michal Korniak", "Marco Bagatella", "Ralf Römer", "Michal Nauman", "Yarden As", "Pranav Vignesh", "Manan Agarwal", "Leander Diaz-Bone", "Piotr Zalewski", "Mikołaj Czarnecki", "Lenart Treven", "Shashwat Saxena", "Sreyas Venkataraman", "Sarvesh Patil", "Zhiyuan Zhou", "Daniel Marta", "Oier Mees", "Nur Muhammad Mahi Shafiullah", "Carmelo Sferrazza", "Bhavya Sukhija", "Angela P. Schoellig", "Andreas Krause", "Max Simchowitz", "Andrew Wagenmaker"], "categories": ["cs.LG", "cs.RO"]}, {"source": "arXiv cs.CV", "title": "Motion-guided Contrastive Regularization For Latent World Models", "titleJa": "潜在世界モデルの「静的崩壊」を防ぐ――動作誘導型の対照正則化", "summaryHtml": "JEPA式の世界モデルは観測を再構成せずに行動条件付きの潜在ダイナミクスを学ぶが、分布的な正則化だけでは、表現が制御に必要な情報を保つ保証がない。本論文は、エンコーダがエピソード固有の静的内容を保持する一方で、マニピュレーションに関わる状態変化を抑え込んでしまう失敗モード「静的崩壊（static collapse）」を特定する。静的内容は時間的に予測可能でエピソードごとに多様なため、SIGRegのような正則化でもこの失敗は生き残ってしまう。<br><br>OGBench-Cubeでの制御研究では、背景をランダム化すると、操作タスク自体は変わらないのに計画性能が大幅に低下することが示された。<br><br>対策として著者らは「動作誘導型対照正則化」を提案する。予測した潜在遷移を、同じエピソード内の候補観測への遷移と比較し、静的な背景の同一性を行動結果の区別に使いにくくする。最適化の詳細はモデルが背景ではなく、行動に伴う状態変化を捉えるよう促す方向に設計されている。", "url": "https://arxiv.org/abs/2611.06901", "publishedAt": "2026-11-04T18:49:35Z", "timestamp": 1793818175000, "monthKey": "2026-11", "field": "cs.CV", "genre": "Vision / Multimodal", "authors": ["Yiwen Chen", "Qiqi Hou", "Jisoo Jeong", "Yinhao Zhu", "Huaizu Jiang", "Amir Said"], "categories": ["cs.CV"]}, {"source": "arXiv cs.CV", "title": "Occlusion for Free: Detecting Occlusion from the Disagreement Between Two Monocular Distance Cues", "titleJa": "2つの単眼距離手がかりの「不一致」から遮蔽を読み取る", "summaryHtml": "歩行者が遮蔽されていると分かること自体が、隠れたピクセルを復元できなくてもロボットには有用である。しかし遮蔽の推定器は通常、配備環境ではめったに得られない遮蔽アノテーションで訓練される。本論文は、カメラのみのパイプラインがすでに計算している2つの距離推定から、遮蔽を読み取れることを示す。<br><br>仕組みは単純である。見かけの高さは遮蔽の影響をほとんど受けない（検出ボックスは人物全体に張られるため）一方、単眼のメートル深度は遮蔽物側へ引っ張られる（ボックス内で最も近い面が深度マップの値になるため）。両者の順序関係だけを使えばよく、焦点距離も身長も深度のスケールも不要で、深度モデルの誤差がほぼ純粋なゲインであるという条件はラベルなしで確認できる。<br><br>このスコアはKITTIで重度の遮蔽をAUC 0.909で検出し、検出器が見逃した歩行者を含む全アノテーション対象でも0.888を記録した。訓練も遮蔽ラベルも不要で、距離の代理変数でもない（固定した距離帯の中でもAUCは維持される）ことが示されている。", "url": "https://arxiv.org/abs/2611.06899", "publishedAt": "2026-11-04T18:49:13Z", "timestamp": 1793818153000, "monthKey": "2026-11", "field": "cs.CV", "genre": "Robotics", "authors": ["Chibueze Praise Onyenweaku", "Toyibat Adele", "Sikirulahi Opeyemi Abdulkareem", "Obed Honour Eje"], "categories": ["cs.CV", "cs.AI"]}, {"source": "arXiv cs.SE", "title": "MCP-Eco: A Linked Dataset of MCP Servers, Consumers, and Development Activity", "titleJa": "MCP-Eco――MCPサーバと利用側プロジェクト、開発活動をつなぐ大規模データセット", "summaryHtml": "Model Context Protocol（MCP）は、LLMエージェントが外部ツールやデータへアクセスするための標準である。そのソフトウェア生態系を研究するには、サーバのインターフェース、それを設定するプロジェクト群、そして開発活動を結びつける必要があるが、情報はディレクトリ、パッケージレジストリ、設定ファイル、リポジトリ履歴に散在している。<br><br>本論文はこれらを統合した関係データセット「MCP-Eco」を提示する。凍結版リリースは19のParquetテーブルに16,880,899件のレコードを含み、候補サーバプロジェクト78,302件、利用側候補リポジトリ16,165件、設定宣言9,200件をカバーする。うち5,975件の宣言が5,138組のリポジトリ―サーバ対へ解決される。<br><br>ツール・リソース・プロンプトの説明、宣言された依存関係、プルリクエストやレビュー、イシューなどの開発記録も含まれる。MCP生態系の実態を定量的に研究するための基盤データである。", "url": "https://arxiv.org/abs/2611.06897", "publishedAt": "2026-11-04T18:47:50Z", "timestamp": 1793818070000, "monthKey": "2026-11", "field": "cs.SE", "genre": "Vision / Multimodal", "authors": ["Khalid Tounoussi", "Mohammed Sayagh", "Ali Ouni", "Yutaro Kashiwa"], "categories": ["cs.SE"]}, {"source": "arXiv cs.CV", "title": "Procedural Adversarial Learning", "titleJa": "手続き的敵対学習――生成器のパラメータ空間で「難しい事例」を探す", "summaryHtml": "多くのコンピュータビジョン課題で、ニューラルネットは平均誤差を小さく訓練できるのに、一見単純な場面で失敗する。失敗を減らすにはまず失敗を見つける必要があるが、それは固定データセットの中にあるとは限らない。本論文は、手続き的生成器の入力空間を探索して難しい事例を見つける、ミニマックス訓練と敵対的評価の枠組み「手続き的敵対学習（PAL）」を研究する。<br><br>手続き的生成器は、レイアウト・照明・姿勢などの低次元な制御パラメータを、描画画像とそのラベルへ写す解釈可能なプログラムである。著者らは、生成器のパラメータ空間でゼロ次最適化を行い、オンデマンドに敵対的訓練サンプルを提案するSimple-PATアルゴリズムを導入した。<br><br>あわせて、表面法線推定、画像セグメンテーション、人間の姿勢推定のための効率的な手続き的生成器群「PAL-Dojo」を構築した。実データの分布の外側にある失敗例を能動的に掘り起こし、訓練へ還元するアプローチである。", "url": "https://arxiv.org/abs/2611.06890", "publishedAt": "2026-11-04T18:42:28Z", "timestamp": 1793817748000, "monthKey": "2026-11", "field": "cs.CV", "genre": "Vision / Multimodal", "authors": ["Jack Nugent", "Jia Deng"], "categories": ["cs.CV"]}, {"source": "arXiv cs.AI", "title": "Dull, Dirty, Dangerous? Working Conditions and the Limits of Occupational AI Exposure", "titleJa": "単調・汚い・危険？――労働条件と職業別AI曝露の限界", "summaryHtml": "自動化はしばしば「単調（dull）・汚い（dirty）・危険（dangerous）」な仕事からの解放として正当化される。本論文は、米国の754の職業についてO*NETの21項目を用い、こうした労働条件と職業別AI曝露（AIへの晒され度）との関係を検討する。<br><br>曝露が高い職業ほど条件スコアは低いという関連が、大規模言語モデル（LLM）による尺度とAIOE（AI職業曝露）の双方で、職業均等重みでも雇用重みでも見られた。身体的負荷、必要な学歴、訓練と経験、賃金で調整すると複合的な関連は弱まり、調整後の信頼区間はLLM曝露ではゼロを含み、AIOEではゼロ未満にとどまった。<br><br>反復作業と裁量の制限を分けるかどうかで、統合された「単調」スコアの意味も変わる。これらの比較は、項目のまとめ方と職業特性が曝露推定の解釈を左右することを示す。「AIが引き受けるのはつらい仕事だ」という単純な物語への実証的な留保である。", "url": "https://arxiv.org/abs/2611.06888", "publishedAt": "2026-11-04T18:41:40Z", "timestamp": 1793817700000, "monthKey": "2026-11", "field": "cs.AI", "genre": "LLM / NLP", "authors": ["Siyi Yu"], "categories": ["cs.AI", "cs.HC", "econ.GN"]}, {"source": "arXiv cs.RO", "title": "VABAR: A Variational Automation Benchmark for Agentic Robotics", "titleJa": "VABAR――エージェンティックロボティクスのための変分自動化ベンチマーク", "summaryHtml": "ロボットが商業・産業用途で信頼性高く働くには、物体の形状や姿勢に既知のばらつきがあるなかで、特定のタスクを持続的にこなす必要がある。著者らはこれを固定自動化と区別して「変分自動化（Variational Automation）」と呼ぶ。<br><br>事前学習済みLLM・VLMのコーディングエージェントが、解釈可能なロボットプログラミングとモデルフリー方策の開世界適応性を組み合わせる「エージェンティックロボティクス」の近年の流れを踏まえ、本論文はベンチマーク設計の一般基準――アクセスのしやすさ、再現性、多様性、実応用への関連、物理的実現可能性、飽和への耐性、計算効率――を提案する。<br><br>その原則を、産業・医療・インフラにまたがる6つの操作タスク類型（工具の仕分け、工具掛け、ギア噛み合わせ、注射器の梱包、ケーブル挿入、ケーブル配線）で具体化したものが「VABAR」である。", "url": "https://arxiv.org/abs/2611.06881", "publishedAt": "2026-11-04T18:38:01Z", "timestamp": 1793817481000, "monthKey": "2026-11", "field": "cs.RO", "genre": "LLM / NLP", "authors": ["Shuangyu Xie", "Kaiyuan Chen", "Uksang Yoo", "Xinyue Zhu", "Meadow Shen", "Jaimyn Drake", "Eugen Solowjow", "Lionel Gulich", "Alexander Millane", "Rafael Cathomen", "Tuur Stuyck", "Sangeeta Subramanian", "Yichao Pan", "Bruce McGowan", "Michael Benedict", "Linxi Fan", "Yuke Zhu", "Spencer Huang", "Ken Goldberg"], "categories": ["cs.RO"]}, {"source": "arXiv cs.LG", "title": "Adaptive Multi Mode: Budget-Aware Routing of Optimizers By Online Landscape Probes", "titleJa": "Adaptive Multi Mode――地形のオンラインプローブで最適化エンジンを予算に応じて切り替える", "summaryHtml": "連続ブラックボックス問題に最適な古典的最適化手法は、予算と地形（ランドスケープ）に依存する。既存のルータは次元と予算、過去の改善、単一ベンチマークへ当てはめた特徴から判断し、最適化手法の暗黙の仮定をオンラインで検証するものは少ない。<br><br>「AMM（Adaptive Multi Mode）」は、既知の予算を準ニュートン法、信頼領域法、座標法、多スタート法、進化戦略の各エンジンへ配分するルータである。曲率、平坦域、分離可能性、折れ点、盆地、フラクタル構造を調べるオンラインプローブを用い、各プローブには既定値、次元×予算の有効範囲、予算へ課金されるコストが付く。<br><br>bbobでの事前登録つき開発ループでは、最後の16回の確認のうち32/36件の予測が的中した。続いて保留してあったbbobインスタンス101–110（次元2–40）で最大7つの競合手法と一度だけ対決し、600の関数×次元×予算セルのうち382セルで最高の目標到達シェアを記録した（単独最高236、タイ146）。", "url": "https://arxiv.org/abs/2611.06879", "publishedAt": "2026-11-04T18:35:35Z", "timestamp": 1793817335000, "monthKey": "2026-11", "field": "cs.LG", "genre": "Robotics", "authors": ["Benjamin Jacob Bodner"], "categories": ["cs.LG", "cs.NE", "math.OC"]}, {"source": "arXiv cs.CL", "title": "SpecCompact: Accelerating LLM Agent Context Compaction with Slot-Parallel Semantic Speculative Verification", "titleJa": "SpecCompact――スロット並列の投機的検証でLLMエージェントの文脈圧縮を高速化", "summaryHtml": "LLMエージェントは増え続ける対話履歴を管理するために文脈圧縮（コンテキスト・コンパクション）を使うが、長い履歴を大規模モデルで要約すると大きな遅延が生じる。圧縮には、情報の保持とレイテンシのバランスが求められる。著者らは、構造化された要約スロットが独立に生成されても情報を保持できるという観察に着目した。<br><br>提案する「SpecCompact」は、スロット並列の意味的投機によって圧縮を高速化する枠組みである。小さなドラフタをファインチューニングしてスロットを並列に生成し、ターゲットモデルが各行を検証して却下された内容を修復する。その後のドラフトは更新されたスロット接頭辞を使う。システム面の最適化により、文脈処理の繰り返しとモデル呼び出しも削減される。<br><br>AppWorldとτ³ベンチマークで2つのターゲットモデルを用いた評価では、Hermes式の要約に対して2.04〜5.63倍の圧縮高速化を達成した。下流タスクでの別途評価も行われ、速度と品質の両立が検討されている。", "url": "https://arxiv.org/abs/2611.06876", "publishedAt": "2026-11-04T18:34:41Z", "timestamp": 1793817281000, "monthKey": "2026-11", "field": "cs.CL", "genre": "LLM / NLP", "authors": ["Yulu An", "Yifei Feng", "Xiangyang Yin"], "categories": ["cs.CL"]}, {"source": "arXiv cs.AI", "title": "Learning to Decode Linear Codes with Generalized Belief Propagation Network", "titleJa": "一般化信念伝播ネットワークで線形符号の復号を学習する", "summaryHtml": "誤り訂正符号は通信システムの基盤であり、ノイズのあるチャネルでも信頼性の高いデータ伝送を可能にする。近年、ニューラル復号器は古典的な反復アルゴリズムを上回る性能を示してきた。本論文は、メッセージ伝播の対称性を保ちながら復号器の学習能力を高めた「一般化信念伝播ネットワーク（GBPNet）」を提案する。<br><br>アーキテクチャはタナーグラフ構造を維持したまま、変数ノード更新のカスケードと、学習される要素ごとのメッセージスケーリングを用いる。訓練戦略として、段階的に難しくするプログレッシブ訓練と高SNR訓練の2つも導入し、復号精度を改善する。<br><br>複数の線形符号での実験では、GBPNetは従来の信念伝播や、評価対象とした最先端のニューラル復号器よりも低いビット誤り率を達成した。古典アルゴリズムの構造を捨てずに学習を組み込む設計の有効例である。", "url": "https://arxiv.org/abs/2611.06874", "publishedAt": "2026-11-04T18:29:31Z", "timestamp": 1793816971000, "monthKey": "2026-11", "field": "cs.AI", "genre": "Scientific AI", "authors": ["Samira Malek"], "categories": ["cs.AI"]}, {"source": "arXiv cs.CV", "title": "PixelSpline: Continuous Space-Time Video Super-Resolution via Endpoint-Anchored Shared Pixel Trajectories", "titleJa": "PixelSpline――終端に固定した共通ピクセル軌道による連続時空間ビデオ超解像", "summaryHtml": "既存の連続時空間ビデオ超解像（STVSR）は、2つの終端フレームだけから動きを推測し、両方向の動きを独立にモデル化することが多く、対応付けの曖昧さや軌道の不整合に弱い。本論文は、長文脈エンコーディング、連続的な高解像度特徴のリフト、そして終端に固定した「PixelSpline」を組み合わせた連続STVSRフレームワークを提案する。<br><br>長い観測はより信頼できる終端表現を与え、連続アップサンプリングは要求された高解像グリッド上に直接、詳細な外観特徴を構築する。PixelSplineは各ピクセルの動きを、両終端で共有される単一の連続軌道として明示的にモデル化する。<br><br>この軌道を使って終端の色を粗い中間フレームへワープし、高解像特徴を位置合わせして残差を再構成する。空間・時間の各種アップサンプリング設定での実験により、品質と効率の良好なバランスが示された。", "url": "https://arxiv.org/abs/2611.06870", "publishedAt": "2026-11-04T18:25:55Z", "timestamp": 1793816755000, "monthKey": "2026-11", "field": "cs.CV", "genre": "Vision / Multimodal", "authors": ["Wanqi Yuan", "Nianyi Li"], "categories": ["cs.CV"]}, {"source": "arXiv cs.AI", "title": "On Turn-Level Best-of-N Sampling for Scaling LLM Agents", "titleJa": "ターン単位のBest-of-NサンプリングでLLMエージェントをスケールさせる", "summaryHtml": "本研究は、複雑で長期のタスクに取り組むLLMエージェントに対して、「ターン単位のBest-of-Nサンプリング」に基づく単純な推論時スケーリング手法を評価する。生成器と選択器の2つのLLMからなる枠組みで、各ターンに生成器モデルがN個の行動候補を出し、選択器モデルがそのうち1つを選んで環境で実行する。<br><br>推論時の誘導探索に批評家（クリティック）モデルを使った先行研究と異なり、本研究は、市販のオープンウェイトLLMが候補行動同士を直接比較して有効に機能するかを検証する点に特徴がある。<br><br>長期のターミナルタスクでの実験では、この手法が精度（5〜10%）と試行間の一貫性の両面で有意な改善をもたらした。エージェントの軌跡分析では、行動の質の変化も観察されている。訓練なしに推論時の計算でエージェントを底上げする実践的な選択肢である。", "url": "https://arxiv.org/abs/2611.06868", "publishedAt": "2026-11-04T18:23:14Z", "timestamp": 1793816594000, "monthKey": "2026-11", "field": "cs.AI", "genre": "LLM / NLP", "authors": ["Jalaj Bhandari", "Dhawal Gupta", "Hongli Zhan", "Zhenting Wang", "Varad Pimpalkhute", "Zhengzhong Liu", "Eric Xing", "Rupesh Srivastava"], "categories": ["cs.AI"]}, {"source": "arXiv cs.SE", "title": "GH-AWTrace: A Large-Scale Dataset of GitHub Agentic Workflow Execution Logs", "titleJa": "GH-AWTrace――GitHubのエージェンティックワークフロー実行ログ大規模データセット", "summaryHtml": "エージェンティックワークフローは、AIエージェントがスケジュールやリポジトリのイベントに応じて繰り返しのリポジトリ作業を行う仕組みである。既存研究はワークフローの定義と出力を調べるが、実行中に何が起きているかの証拠は限られていた。本論文は、その実行証拠を結びつけたデータセット「GH-AWTrace」を提示する。<br><br>データセットは、検証済みのGitHub Agentic Workflows 25,014件（5,051リポジトリ）を、4,112,526件の実行記録と562,877件の空でない実行ログアーカイブへ結びつける。実行証拠はGitHubのログ保持制限の範囲で保存され、リポジトリのメタデータと生成されたワークフロー設定にもリンクされる。<br><br>事例からは、ツール拒否、プロバイダ障害、エージェントの方針変更、エージェント間の委任といった、ログでなければ見えない事象が読み取れる。実行の失敗、ツール使用、報告された実行結果と実際のタスク進捗との関係を研究する土台となる。なおカバレッジはワークフローごとに異なり、ログは部分的な観測にとどまる。", "url": "https://arxiv.org/abs/2611.06866", "publishedAt": "2026-11-04T18:20:41Z", "timestamp": 1793816441000, "monthKey": "2026-11", "field": "cs.SE", "genre": "Vision / Multimodal", "authors": ["Jasem Khelifi", "Hao Li", "Ali Ouni", "Mohammed Sayagh", "Mohamed Aymen Saied"], "categories": ["cs.SE"]}, {"source": "arXiv cs.CV", "title": "CounterFactual Retrieval for Evidence-Aware Individual Animal Identification", "titleJa": "反事実的検索――動物個体識別の「証拠」を問う評価プロトコル", "summaryHtml": "動物の個体識別の自動化は、小規模な curated 研究から、共有ベンチマークや再利用可能な基盤モデルへと進みつつある。しかし現在の評価は、マッチの背後にある証拠を未解決のままにしている。高い検索精度は、モデルが動物の特徴を使ったのか、個体と相関する近道（ショートカット）を使ったのかを示さない。<br><br>本論文は、証拠を意識した評価プロトコル「反事実的前景検索（CFR）」を提案する。CFRは同じクエリ―ギャラリー課題を、全面画像、前景のみ、近道のみという異なる見え方で評価する。全面画像は標準の検索性能を、前景のみは前景に支えられた検索を、近道のみは背景やシルエットからどれだけ個体信号が回復できるかを測る。<br><br>これにより、検索スコアは「証拠プロファイル」へと変わる。元の画像でどれだけ性能が出るか、その性能のどれだけが動物自体を見たときに残るか、そしてどれだけが背景などの近道に依存していたか――識別モデルの信頼性を吟味する枠組みである。", "url": "https://arxiv.org/abs/2611.06864", "publishedAt": "2026-11-04T18:19:26Z", "timestamp": 1793816366000, "monthKey": "2026-11", "field": "cs.CV", "genre": "Vision / Multimodal", "authors": ["Ankit K. Upadhyay", "Aleksandr Algasov", "Ekaterina Nepovinnykh", "Fedor Zolotarev", "Tuomas Eerola", "Heikki Kälviäinen", "Charles V. Stewart", "Lukas Picek"], "categories": ["cs.CV", "cs.AI", "cs.LG"]}, {"source": "arXiv cs.RO", "title": "Rethinking Self-Repair in Code-as-Policy Agents: What Drives Retry Success?", "titleJa": "コード型ポリシーエージェントの自己修復――再試行の成功を左右するのは何か", "summaryHtml": "コードを方策とするエージェントは、実行フィードバックを使って失敗したプログラムを再試行することが多い。追加のサンプリングやタスクガイダンスも成功率を上げるため、失敗に特化したフィードバックの寄与は不明瞭だった。本研究はこの問いを、シミュレーション上のロボット操作で検証する。<br><br>固定のルックアップが失敗ラベルとAPIの種類からフィードバックテンプレートを選び、凍結されたコードモデルが場面リセットのたびに新しいプログラムを生成する。同じ252件の初期失敗に対して、Qwen2.5-Coder-7Bは5回までの再試行で85.3%を回復し、同じ再試行上限での再サンプリング（68.3%）を上回った。この優位は総トークン予算を固定しても持続した。<br><br>一方、他のエピソードからのフィードバックや固定のタスクガイダンスでも同程度の回復率が得られ、粗い失敗ラベルを一致させる利益は検出されなかった。別の検証では、最初から誘導プロンプトを使う方法がテンプレート式フィードバックと同程度の成功率を示した。「失敗特化フィードバックが効いている」という想定への実証的な問い直しである。", "url": "https://arxiv.org/abs/2611.06863", "publishedAt": "2026-11-04T18:19:24Z", "timestamp": 1793816364000, "monthKey": "2026-11", "field": "cs.RO", "genre": "Agents / Reasoning", "authors": ["Siddharth Aphale", "Ayushman Singh"], "categories": ["cs.RO"]}, {"source": "arXiv cs.CL", "title": "Balancing hierarchical representation and quantization: A performance trade-off in text embeddings", "titleJa": "階層表現と量子化のバランス――テキスト埋め込みの性能トレードオフ", "summaryHtml": "階層型テキスト埋め込みモデルは可変長の表現を提供し、量子化は数値精度を下げて計算効率を高める。両者は直交する既存の技術だが、その相互作用は十分に調べられてこなかった。本研究は、この2つの効率化手法がどう干渉するかを実証的にベンチマークする。<br><br>評価はMTEBの38タスクで、4つのTransformer系埋め込みモデルを用い、1次元・2次元の階層表現と32ビット・8ビット・バイナリ量子化を組み合わせた、タスクあたり168構成を検証する。効率の次元は分けて報告され、理論上のベクトルあたり記憶量と、エンドツーエンドの評価時間が示される。<br><br>Friedman検定とNemenyi事後分析では、int8量子化はペア分類と再ランキングでfloat32と統計的に区別がつかず、全体でも最大1.5ポイントのコストにとどまった。一方、バイナリ量子化は全タスクカテゴリで有意に悪かった。埋め込み次元を半分にすることの影響もあわせて検討されている。", "url": "https://arxiv.org/abs/2611.06859", "publishedAt": "2026-11-04T18:15:08Z", "timestamp": 1793816108000, "monthKey": "2026-11", "field": "cs.CL", "genre": "LLM / NLP", "authors": ["Kai Ponel", "Marco Polignano", "Erasmo Purificato", "Aylin Julia Temizkan", "Marco Levantesi", "Giovanni Semeraro", "Ernesto William De Luca"], "categories": ["cs.CL", "cs.IR", "cs.LG"]}, {"source": "arXiv cs.AI", "title": "CompressionBench: How can your coding agents compress LLMs?", "titleJa": "CompressionBench――コーディングエージェントにLLM圧縮を任せられるか", "summaryHtml": "再帰的自己改善には、後続のシステムが使うモデルや基盤をAIシステム自身が改善することが求められる。LLM圧縮はその具体的な効率化目標となる。事前学習済みモデルの振る舞いを、より小さなモデル記憶予算の中に保持することである。本研究は、コーディングエージェントがこの工程を自律的に遂行できるかを問う。<br><br>圧縮はターミナルタスクとして定式化される。エージェントはソースのチェックポイント、記憶容量の上限、推論環境、時間予算を与えられ、圧縮された重みと実行可能な推論コードを構築する。アルゴリズムと実験の進め方はエージェントが握り、パープレキシティのフィードバックが探索を導き、独立した検証が最終モデルを確認する。<br><br>6つのエージェントと6つのモデル×サイズ設定で、36件の提出のうち29件が検証に合格した。タスクごとに最もパープレキシティの低い設計を選ぶと、BF16比で平均3.4%のパープレキシティ増、下流精度77.33%（BF16は79.56%）となった。記録された実験の過程も分析されている。", "url": "https://arxiv.org/abs/2611.06858", "publishedAt": "2026-11-04T18:14:50Z", "timestamp": 1793816090000, "monthKey": "2026-11", "field": "cs.AI", "genre": "Vision / Multimodal", "authors": ["Xinrui Zhong", "Zhifeng Li", "Zhiming Wang", "Yongqi Liu", "Shanglin Yang", "Yang Zhou", "Zikun Li", "Zhuoming Chen", "Beidi Chen"], "categories": ["cs.AI"]}, {"source": "arXiv cs.CV", "title": "LongBanana: An Expert-Verified Benchmark for Long-Context Multi-Reference Image Synthesis", "titleJa": "LongBanana――長文脈・複数参照の画像合成を測る専門家検証ベンチマーク", "summaryHtml": "エージェント駆動の画像生成の時代に向け、本論文は長文脈・複数参照の画像合成のための、おそらく初の専門家設計・専門家検証ベンチマーク「LongBanana」を提案する。このタスクは、散らばった視覚的証拠を検索し、妨害要素を退け、実体と関係を結びつけ、複数の参照から1枚の一貫した最終画像を構成することを要求する。<br><br>LongBananaは3×3の分類体系で編成された90件の入念に設計されたタスクを含み、各タスクは約32枚の参照画像、20の制約、50の評価項目を持ち、専門家が指定した原子的評価項目は合計4,670件に上る。グラフに基づく評価設計は、各タスクを参照画像と実体―関係グラフで具体化し、ノード・エッジ・グラフ全体への義務を、内容の忠実性、関係の結合、全体制約の充足のチェックリスト項目へ変換する。<br><br>専門家のラベルには15%の二重ラベル付きサブセットが含まれ、完全一致率は89.4%だった。参照を束ねて一貫した画像を作る現行モデルの能力と限界を、細粒度に測る物差しである。", "url": "https://arxiv.org/abs/2611.06856", "publishedAt": "2026-11-04T18:11:56Z", "timestamp": 1793815916000, "monthKey": "2026-11", "field": "cs.CV", "genre": "Vision / Multimodal", "authors": ["Haoxiang Cao", "Yuxuan Zhang", "Penghui Du", "Bo Li", "Jiajiong Cao", "Yingying Fan", "Zimeng Wu", "Yifu Luo", "Mingzhe Zheng", "Junwen Miao", "Huaisong Zhang", "Yang Yao", "Yu Wang", "Dongfu Jiang", "Ping Nie", "Wenhu Chen", "Chaoqun Wang", "Changqian Yu", "Kelsey R. Allen"], "categories": ["cs.CV", "cs.CL"]}, {"source": "arXiv econ.EM", "title": "Regression with Many Generated Controls", "titleJa": "生成された統制変数が多い回帰――潜在変数の代理を大量に使う推定", "summaryHtml": "一部の共変量が内生的である線形回帰では、内生性を統制するのに十分な変数が存在しても、それ自体は観測できない潜在変数である場合がある。たとえば、異なるAI・機械学習手法でその潜在変数を安価に、しかし不完全に補完すれば、手法ごとに異なる代理変数（プロキシ）が得られる状況がこれにあたる。実務家はそうした代理変数を大量に生成できる。本研究は、そうした状況で実務家が取りうる選択肢――すべての代理変数やそこから計算した因子を統制に含める方法、操作変数推定、その非線形の変種――を、透明なモデルで比較する。<br><br>各アプローチが暗黙に狙う推定対象（エスティマンド）を導出し、それが関心のあるパラメータを回復する条件を明らかにしたうえで、実務的な推奨を示す。代理変数の扱い方によって狙う対象が変わるため、手法の選択は単なる実装の違いではなく、推定しているものの違いになる。<br><br>十分に豊かな生成統制変数の集合があれば、検証データに頼らずとも関心パラメータを一致推定できることが示された。AIが生成した代理変数を計量分析に組み込む際の理論的な足場となる研究である。", "url": "https://arxiv.org/abs/2611.06855", "publishedAt": "2026-11-04T18:10:56Z", "timestamp": 1793815856000, "monthKey": "2026-11", "field": "econ.EM", "genre": "Generative Models", "authors": ["Timothy Christensen", "Daniel Vebman"], "categories": ["econ.EM", "stat.ML"]}, {"source": "arXiv cs.CV", "title": "Visual Token Routing: Learning to keep tokens that matter", "titleJa": "Visual Token Routing――「重要なトークンを残す」ことを学ぶ視覚表現", "summaryHtml": "コンピュータ操作エージェント（CUA）は近年、いくつかの長期ベンチマークで人間を超える性能に達した。しかし計算コストが、長期タスクやビデオゲームのようなリアルタイム領域での利用を制約している。主要なボトルネックは、各スクリーンショットを数千の視覚トークンとして表現することであり、対話履歴が伸びるにつれて長い文脈へ蓄積していく。<br><br>著者らは、これらの視覚トークンの大半が、エージェントの次の行動にとって意味的に無関係か、スクリーンショット間で時間的に冗長であることを観察した。この観察に基づき、行動予測に必要な情報を保つ疎な視覚表現を学ぶ共同訓練フレームワーク「Visual Token Routing（VTR）」を提案する。<br><br>VTRでは、視覚言語モデルと軽量な時空間ルータを一緒に訓練する。ルータは現在と過去のスクリーンショットの各画像領域を調べ、その視覚トークンを残すかどうかを判断する。文脈の肥大化を抑えながら行動に必要な情報を残す設計である。", "url": "https://arxiv.org/abs/2611.06854", "publishedAt": "2026-11-04T18:10:33Z", "timestamp": 1793815833000, "monthKey": "2026-11", "field": "cs.CV", "genre": "Vision / Multimodal", "authors": ["Pranjal Aggarwal", "Sean Welleck"], "categories": ["cs.CV", "cs.LG"]}, {"source": "arXiv cs.CV", "title": "Trainspotting: Learning Object-Centric 3D Reconstruction from Found Photos", "titleJa": "Trainspotting――「拾い集めた写真」から物体中心の3次元再構成を学ぶ", "summaryHtml": "最先端のフィードフォワード再構成モデルは、野外の物体中心写真コレクションでは性能が振るわない。これらは主に、物体と環境がほぼ固定された単一セッションの撮影で訓練されており、視点だけが変わるデータを前提にしている。一方、公開写真アーカイブには別の形の多視点データがある。同じ物体や設計を、多くの人々が年月・環境・カメラを変えて、時には実物個体も変えて撮影した「拾い集めた写真（found photos）」である。<br><br>本研究は、Wikimedia Commonsから集めた12,068物体・311,886枚の写真からなるデータセット「Trainspotting」を提案する。各物体について再構成を行い、カメラ姿勢、多視点ステレオ深度、物体マスクを回復する。物体は3つのレジーム――1か所に固定された物体、場所を移動する物体、多くの実物で共有される設計――に分類される。<br><br>近年のフィードフォワード再構成モデルをTrainspottingで評価すると、深刻な失敗が明らかになった。管理された撮影とは異なる、現実の写真集合の難しさを突きつけるデータセットである。", "url": "https://arxiv.org/abs/2611.06849", "publishedAt": "2026-11-04T18:05:22Z", "timestamp": 1793815522000, "monthKey": "2026-11", "field": "cs.CV", "genre": "Vision / Multimodal", "authors": ["Hanyu Chen", "Noah Snavely"], "categories": ["cs.CV"]}, {"source": "arXiv cs.CL", "title": "Persona Perspectives: Adopting Viewpoints Reorganizes Representations in LLMs", "titleJa": "ペルソナという視点――LLMの表現は立場の採用で組み替わる", "summaryHtml": "線形プローブやスパースオートエンコーダ（SAE）など、LLMの特徴を監視する一般的な手法は、特徴が文脈を越えて一貫した表現を保つことを前提にしている。しかしLLMは異なる視点や「ペルソナ」を柔軟に採用でき、その背後には異なる概念関係の体系が示唆される。本論文は、LLMにペルソナを採用させるプロンプトが、モデルの潜在空間の表現幾何を変えるかどうかを検証する。<br><br>著者らは、リベラルと保守の政治的ペルソナを採用したモデルと2つの中立なベースラインから、9,000超の一般語と33の意味軸の表現を抽出して比較した。<br><br>結果として、ペルソナ条件づけは、語の意味軸への射影と、軸同士の整合の双方を、指定されたイデオロギーと整合する方向へ体系的に変えることが分かった。さらに、この再編成が安全性に関わる2つの特徴監視のタスクへ及ぼす影響も検証されている。特徴の監視可能性そのものがペルソナに依存するという、解釈可能性研究への示唆である。", "url": "https://arxiv.org/abs/2611.06848", "publishedAt": "2026-11-04T18:05:17Z", "timestamp": 1793815517000, "monthKey": "2026-11", "field": "cs.CL", "genre": "LLM / NLP", "authors": ["Austin C. Kozlowski", "Avital Mintz", "Madison Lee"], "categories": ["cs.CL"]}, {"source": "arXiv cs.LG", "title": "Navigating Disagreement Among Criteria for Evaluating Explanation Faithfulness", "titleJa": "説明の忠実性をどう測るか――評価基準同士の不一致をどう扱うか", "summaryHtml": "忠実性（faithfulness）は、アルゴリズムによる説明がモデルの振る舞いを正確に反映することを要求する。しかし忠実性の既存の操作化（測り方）は、同じ説明が忠実かどうかについて互いに食い違うことがあり、開発者や監査者は相争う評価の間で選択を迫られる。本論文は、評価基準同士の不一致を調査し、説明の忠実性を評価するための実践的な道筋を提示する。<br><br>著者らはまず、忠実性の操作化が互いにどう異なるかを特定する。次に「忠実性汎関数」を導入し、不一致の所在を、説明がモデルについて何を主張するのか、どの比較がその主張に関わるのか、その比較群の一致をどう集約すべきか、という点に位置づける。そして既存の評価基準をこの汎関数の内側に再構成する。<br><br>著者らの主張では、この再構成は、忠実性をモデルと説明の間の共通だが完全には仕様化されていない関係として理解することを支持する。基準間の差は、測る対象そのものの違いではなく、仕様化の選択の違いを反映しているという整理である。監査実務で評価基準を選ぶ際の理論的な足場となる。", "url": "https://arxiv.org/abs/2611.06846", "publishedAt": "2026-11-04T18:03:15Z", "timestamp": 1793815395000, "monthKey": "2026-11", "field": "cs.LG", "genre": "LLM / NLP", "authors": ["Grant Shanklin", "Jiří Němeček", "Asia Biega"], "categories": ["cs.LG", "cs.CY"]}, {"source": "arXiv cs.CV", "title": "Where to Connect? Boosting MLLMs via Dynamic Gated Pathways across ALL ViT and LLM Layers", "titleJa": "どこでつなぐか――ViTとLLMの全層を動的ゲートで結ぶMLLM", "summaryHtml": "マルチモーダル大規模言語モデル（MLLM）における中心的だが未開拓の問題は、「どこでつなぐか」である。階層的な視覚エンコーダからの視覚情報を、LLMの層ごとの意味へどう配線するか。主流のMLLMは単一層の固定された視覚表現をLLMへ注入し、全LLM層を単一の消費者として扱うため、層ごとに異なる視覚粒度への要求を無視している。近年の多層融合手法も、エンコーダ側で階層特徴を圧縮するか、あらかじめ定義した疎な層間接続に頼り、ViTとLLMの階層間の適応的な相互作用のモデル化には届いていない。<br><br>このギャップに取り組むのが、ルーティング機構「DGP（Dynamic Gated Pathways）」である。DGPはViTの全層とLLMの全層の間に全対全の接続を張り、各LLM層が文脈に応じて視覚層への選好を動的にゲートする。<br><br>視覚情報の「深さ」を層ごとに選び直せるようにすることで、単一の視覚表現の注入よりも細やかなマルチモーダル推論を目指す設計である。接続の場所そのものを学習対象にする視点が新しい。", "url": "https://arxiv.org/abs/2611.06844", "publishedAt": "2026-11-04T18:01:24Z", "timestamp": 1793815284000, "monthKey": "2026-11", "field": "cs.CV", "genre": "Vision / Multimodal", "authors": ["Yingying Yan", "Jiaqi Tang", "Wei Wei", "Qianzhou Wang", "Lei Zhang", "Jianmin Chen", "Yuyang Xia", "Botong Geng", "Jinjian Wu", "Qifeng Chen"], "categories": ["cs.CV"]}, {"source": "arXiv cond-mat.mtrl-sci", "title": "Thermally Conditioned Time-Series Forecasting of Grain Growth in Polycrystalline Materials", "titleJa": "熱条件を組み込んだ多結晶材料の結晶粒成長の時系列予測", "summaryHtml": "熱処理中の結晶粒成長は多結晶材料の微細組織を強く左右し、ひいては機械的性質を決める。フロントトラッキングやフロントキャプチャリングの数値シミュレーションは結晶粒成長を正確に記述できるが、計算コストが高く、長い熱サイクルや非等温サイクルへの適用は限られていた。先行研究では、等温条件のもとで結晶粒径分布を時系列として扱い、リカレントニューラルネットワークでその発展を予測することに成功しており、高コストなPDEシミュレーションではなく数秒で完全な成長軌跡を生成できた。<br><br>本研究はこの予測フレームワークを再定式化し、モデルアーキテクチャへ熱情報を明示的に組み込むことで非等温条件へ対応させる。結晶粒径分布は畳み込みニューラルネットワークで符号化され、熱に関する記述子も入力される。<br><br>実プロセスで一般的な、温度が時間とともに変わる熱処理条件でも結晶粒成長を高速に予測できるようにする試みであり、材料設計のシミュレーションコストを下げる方向の研究である。", "url": "https://arxiv.org/abs/2611.06843", "publishedAt": "2026-11-04T17:59:26Z", "timestamp": 1793815166000, "monthKey": "2026-11", "field": "cond-mat.mtrl-sci", "genre": "Generative Models", "autho
