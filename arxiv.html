","timestamp":1795132800000,"title":"War, Trauma, and Dementia Risk: A Brain Health Perspective on Conflict","titleJa":"戦争、トラウマ、認知症リスク――紛争を脳の健康の視点から捉える","url":"https://doi.org/10.65104/001c.175477"},{"authors":["Maria Nikoloudi","Petros Galanis","Ioanna Tsatsou","Kyriaki Mystakidou"],"categories":[],"field":"Indian Journal of Palliative Care","genre":"Psychedelics / Trauma","monthKey":"2026-11","publishedAt":"2026-11-20T00:00:00Z","source":"Crossref","summaryHtml":"がんの診断や治療は患者に深い心理的負担をもたらすが、苦難を経て肯定的な変化が生じる「心的外傷後成長（PTG）」が、希望や意気消沈とどう関わるかは十分に調べられていなかった。本研究は112人のがん患者を対象に、PTGと希望、意気消沈の関係を検討した。性別、年齢、教育水準、婚姻状態、就労、がん種、転移、ECOG全身状態、治療法といった人口統計学的・臨床的な交絡因子で調整し、3つの尺度の内的整合性もクロンバックのαで確認した。<br><br>PTGはPTGインベントリ（PTGI）、希望はハース希望指数（HHI）、意気消沈は意気消沈尺度II（DS-II）で測定され、変数間の相関はピアソンの相関係数で、関連は単変量および多変量の線形回帰で検討された。PTGIの合計得点は希望と正の相関（r=0.45、p<0.01）、意気消沈と負の相関（r=-0.37、p<0.01）を示した。調整済みの多変量モデルでは、PTGが高いほど希望が高く（B=0.094、95%信頼区間0.047～0.140、p<0.001、R2=23.3%）、意気消沈が低かった（B=-0.130、95%信頼区間-0.199～-0.061、p<0.001、R2=13.0%）。<br><br>結果は、PTGががん患者の心理的適応における資源となりうることを示唆する。ただし本研究は横断研究であり、臨床的意義を明らかにするには縦断研究や介入研究が必要だと著者らは述べている。出典：Crossref（Indian Journal of Palliative Care）","timestamp":1795132800000,"title":"From Trauma to Transformation: The Role of Post-Traumatic Growth in Hope and Demoralisation among Cancer Patients","titleJa":"トラウマから変容へ――がん患者における心的外傷後成長と希望・意気消沈の関係","url":"https://doi.org/10.25259/ijpc_373_2025"},{"authors":["Rebecca Bates"],"categories":[],"field":"The Gerontologist","genre":"Psychedelics / Trauma","monthKey":"2026-11","publishedAt":"2026-11-20T00:00:00Z","source":"Crossref","summaryHtml":"認知症の行動・心理症状はよくみられる臨床的に重要な問題だが、行動的苦痛は神経学的・医学的・心理的・関係的・環境的・社会的要因の相互作用から生じる多因子性のものである。現代の認知症ケアでは包括的評価や本人中心ケア、生活史や環境への配慮が重視されるが、行動の定式化やケア計画にトラウマインフォームドな視点が明示されないこともある。<br><br>本フォーラム論文は、既存の行動評価にトラウマインフォームドな視点を組み込む認知症特化の概念枠組み「トラウマインフォームド行動評価（TIBA）」を提案する。逆境やトラウマ歴、行動の文脈と引き金、トラウマ関連の反応、感覚・環境条件、関係的・伝記的意味、安全とコントロールの源を構造化された視点で検討する。多因子評価や本人中心ケア、DICEアプローチを置き換えるものではなく、トラウマが行動を引き起こすと仮定するものでもない。<br><br>TIBAは検証済みの評価尺度や診断ツールではなく概念的な臨床定式化の枠組みであり、日常的な臨床実装の前に参加型の精緻化、運用化、実現可能性の検証、実証的評価が必要だと著者は述べている。出典：Crossref（The Gerontologist）","timestamp":1795132800000,"title":"Beyond Behaviour: A Trauma-Informed Behaviour Assessment Framework for Understanding and Preventing Behavioural Distress in Dementia","titleJa":"行動の奥にあるもの――認知症の行動的苦痛をとらえるトラウマインフォームドな評価枠組み","url":"https://doi.org/10.1093/geront/gnag263"},{"authors":["Chenruo Liu","Quan Zhang","Qi Lei"],"categories":["cs.AI","cs.CL","cs.LG"],"field":"cs.AI","genre":"LLM / NLP","monthKey":"2026-11","publishedAt":"2026-11-20T00:00:00Z","source":"arXiv","summaryHtml":"思考の連鎖（CoT）は中間ステップを示すが、正解が出たからといってモデルがそのステップの依存関係に本当に依拠しているとは限らず、効率的に推論しているとも限らない。本研究はCoTの忠実さと効率を共通の枠組みで定量化した。CoTを意味的推論グラフとして表し、モデルの予測依存を、意味的な支持で説明される依存と追加の推論履歴による依存、そして答えに至る推論と脇道の推論への配分という2軸に分解した。<br><br>この分解から全体・ステップ単位の不忠実さと非効率の指標を導いた。統制された介入実験で、指標が隠れた依存や意図的に挿入された脇道の推論に意図どおり反応することを確認した。数学とマルチホップ推論の課題では、答えレベルの不忠実さは予測の不確実性の高さと一貫して関連したが、不忠実さ・非効率と正答率の関連は弱いか一貫しなかった。<br><br>さらにグラフを意識したファインチューニング目的関数を理論的に導き、計算コストの高い指標そのものを直接最適化せずに、対象とする推論特性を改善しつつ正答率を損なわないことを示した。正答率と簡潔さだけでは推論の質は測れない。LLMの予測依存が忠実に表され、効率的に配分されているかも評価すべきだという結論である。出典：arXiv","timestamp":1795132800000,"title":"Reasoning in Two Dimensions: Quantifying Chain-of-Thought Faithfulness and Efficiency","titleJa":"思考の連鎖は本当に使われているか――推論の忠実さと効率を2次元で測る","url":"https://arxiv.org/abs/2611.27100v1"},{"authors":["Panayiotis Christou","Satyapragnya Kar","Flavjo Xhelollari","Parijat Dube","Rajarshi Das"],"categories":["cs.AI"],"field":"cs.AI","genre":"Agents / Robotics","monthKey":"2026-11","publishedAt":"2026-11-20T00:00:00Z","source":"arXiv","summaryHtml":"予測型ワールドモデルは観測の短期予測を学ぶが、短期予測が正確でも長期にわたって物理的に整合した振る舞いになるとは限らない。本研究は物理構造を組み込むことが、予測目的を保ったままワールドモデルをどう強化するかを調べた。惑星運動のトークンベースモデルと、力学系のJEPA型ビジュアルモデルで、保存量の教師信号、対称性を意識した表現、時間的一貫性、学習された構造化ダイナミクスを検討した。<br><br>惑星運動では角運動量の教師信号が自律的な次トークン予測を改善し、時間的正則化の効果は併用する物理目的と表現に依存した。ビジュアルモデルでは、エネルギーに基づくダイナミクスヘッドでロールアウトを生成すると、より忠実な軌道と位相空間の発展が得られた。一方、補助的な物理読み出しや局所的な加速度推定の改善が、長期の信頼性向上に自動的につながるわけではないことも分かった。<br><br>初期条件や物理パラメータの変化に対する評価では、効果が持続する場合と汎化が限られる場合の両方が示された。物理構造はワールドモデル改善の実用的な手段であり、モデルが物理的規則性を表現することと、それを使って未来状態を生成することの両方を助ける帰納バイアスこそが有効だというのが中心的な教訓である。出典：arXiv","timestamp":1795132800000,"title":"Where Structure Enters a World Model: From Predictive Fit to Physical Rollout","titleJa":"予測するだけでは足りない――物理構造を取り入れたワールドモデルの長期展開","url":"https://arxiv.org/abs/2611.27149v1"},{"authors":["Yao Tong","Jiaxin Qi","Yan Cui","Jinli Ou","Yuhua Zheng","Jianqiang Huang"],"categories":["cs.CV","cs.AI"],"field":"cs.CV","genre":"Vision / Multimodal","monthKey":"2026-11","publishedAt":"2026-11-20T00:00:00Z","source":"arXiv","summaryHtml":"マルチモーダル大規模言語モデル（MLLM）は動画理解で高い性能を示すが、動画の知覚が内部の事前知識や常識と強く衝突すると、モダリティを統合できず2つの極端に分かれる「モーダル分極」という失敗パターンが現れる。反する視覚的証拠があっても事前知識に固執する「認知的慣性」と、論理的な矛盾を無視して動画知覚を盲信する「知覚的慣性」である。<br><br>これを調べるため、物理法則や常識に反する直観に反する場面で分極を引き出すベンチマークTheaterBenchを導入した。最先端モデルを広く実験した結果、深刻なモーダル分極が確認され、既存のハルシネーション抑制手法の多くは、知覚的慣性と認知的慣性のトレードオフを再配分するだけで、衝突そのものを根本的に解消しないことも分かった。<br><br>本研究は将来の動画理解モデルにおける知覚と認知の均衡を評価・改善するための基礎的な一歩となる。常識に反する場面でのモデルの振る舞いを測るベンチマークが示され、モダリティ間の統合の弱さが具体的に可視化された。知覚と事前知識のどちらに偏るかを定量的に捉えたことで、改善の方向性も見えてきた。出典：arXiv","timestamp":1795132800000,"title":"When Perception Collides with Priors: Diagnosing Modal Polarization in Video Understanding Models","titleJa":"知覚か先入観か――動画理解モデルが陥るモーダル分極とその診断","url":"https://arxiv.org/abs/2611.26972v1"},{"authors":["Ammarah Hashmi","Sahibzada Adil Shahzad","Yu Tsao","Hsin-Min Wang"],"categories":["cs.MM","cs.AI","cs.CV"],"field":"cs.MM","genre":"Ethics / Safety","monthKey":"2026-11","publishedAt":"2026-11-20T00:00:00Z","source":"arXiv","summaryHtml":"人によるディープフェイク検出は信頼性が低く、訂正フィードバック付きで再評価することでその後の判断が改善するかどうかは不明だった。本研究は110人の参加者を対象に、FakeAVCelebとDeepfake Detection Challenge（DFDC）の視聴覚刺激を用いて、初回と繰り返しのディープフェイク評価の違いを調べた。参加者は各データセットから40本の動画を第1段階で評価し、第2段階で同じ動画を繰り返し提示と訂正フィードバックのもとで再評価した。<br><br>FakeAVCelebでは平均正答率が第1段階63.30%から第2段階67.98%へ4.68ポイント上昇し、DFDCでは59.52%から68.16%へ8.64ポイント上昇した。改善は主に偽陰性（見逃し）の減少によるもので、偽陽性率は変わらなかった。一方、判断の反転はFakeAVCelebで27.55%、DFDCで32.91%の評価で起き、初回正しかった判断が再評価で誤る場合もあった。<br><br>繰り返しと訂正フィードバックは検出を中程度に改善したが、判断の不安定さや残存誤差は解消されなかった。参加者は一貫して過信を示し、自己評価した確信度は実際の正答率をFakeAVCelebで11.99ポイント、DFDCで12.82ポイント上回った。人間の判断の限界は繰り返しだけでは完全には克服できないことが示された。出典：arXiv","timestamp":1795132800000,"title":"Fooling the Mind Twice: Human Detection of Audiovisual Deepfakes Under Repeated Exposure and Corrective Feedback","titleJa":"人はディープフェイクを見抜けるか――繰り返しと訂正フィードバックの効果と限界","url":"https://arxiv.org/abs/2611.27080v1"},{"authors":["Yaoyuan Yan","Haoxiang Jie","Zhiyou Heng","Kailin Wang","Yumiao Li","Lifeng Liu","Anwan Yan"],"categories":["cs.AI","cs.RO"],"field":"cs.AI","genre":"Agents / Robotics","monthKey":"2026-11","publishedAt":"2026-11-20T00:00:00Z","source":"arXiv","summaryHtml":"エージェントの成功した対話は訓練データになるが、成功しただけではどの記録を学生モデルが学ぶべきかは決まらない。本研究は、40億パラメータの言語エージェントを対象に、継続学習の構成要素として経験選択を検討した。2つの固定された経験プール、8つの初期化シード、2つのサンプリングシードで9種の選択器を比較し、288人の学生モデルを訓練した。各学生は128の開発タスク群で共通の実行器により評価された。<br><br>全体選択の自由度、256の異なる内容、768回の訓練提示を同一条件とし、最適化器を意識した勾配選択が2つのプールで81.45%と73.19%の成功率に達した。全体ランダム選択に対する上乗せは8.25ポイントと5.96ポイント、高NLL選択に対しては4.10ポイントと4.05ポイントだった。初期化レベルの8つの比較はすべて両ベースラインに対して正だった。<br><br>カバレッジ制約を緩めると勾配選択は改善したが、ランダム選択の性能は低下し、順位付け規則と選択空間を一緒に考える必要があることが示された。128の予約タスク群での別途の凍結再現でも、勾配選択とランダム選択の差は+7.03ポイント、高NLL選択との差は+5.03ポイントだった。出典：arXiv","timestamp":1795132800000,"title":"From Acting to Learning: Experience Selection toward Continually Learning Agents","titleJa":"行動から学習へ――継続学習するエージェントのための経験選択","url":"https://arxiv.org/abs/2611.27159v1"},{"authors":["Buse Sibel Korkmaz","Antonio del Rio Chanona"],"categories":["cs.LG","cs.CL"],"field":"cs.LG","genre":"LLM / NLP","monthKey":"2026-11","publishedAt":"2026-11-20T00:00:00Z","source":"arXiv","summaryHtml":"科学的議論は主張の特定、証拠の評価、一貫した応答の構築という議論的推論に依存している。推論能力をもつ言語モデルは数学、コーディング、論理のベンチマークで強い性能を示してきたが、科学的議論にどこまで関与できるかは不明だった。本研究は論文、査読、研究助成提案を用い、議論マイニング、反論生成、談話レベルの推論にわたる七つの課題で言語モデルを初めて体系的に評価した。<br><br>結果として、強い一般的推論力をもつ最先端モデルでも、領域固有の議論的課題には苦戦し、根本的な能力ギャップが明らかになった。対応策として、言語モデルにおける議論的推論過程を明示的に足場かけする訓練枠組みを導入し、科学的談話における能力を大幅に改善した。得られたコンパクトなモデルは、はるかに大規模なプロプライエタリシステムに匹敵するか上回り、未知の会話設定にも汎化した。<br><br>効果的な科学的議論は規模の創発的性質ではなく、明示的な推論を意識した訓練を要することが示された。科学的議論に意味のある形で貢献できるAIシステムを構築するための実践的な道筋が示された研究である。出典：arXiv","timestamp":1795132800000,"title":"Beyond Math, Code, and Logic: Do Reasoning Models Transfer to Scientific Argumentation?","titleJa":"数学・コード・論理を超えて――推論モデルは科学的議論に転移するか","url":"https://arxiv.org/abs/2611.27722v1"}],"updatedAt":"2026-11-24T11:31:18Z","version":1};
    const byId = id => document.getElementById(id);
    const norm = s => String(s||'').toLowerCase().normalize('NFKC').replace(/\s+/g,' ').trim();
    const esc = s => String(s||'').replace(/[&<>"]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
    const plainText = h => String(h||'').replace(/<br><br>/g,' ').replace(/<[^>]+>/g,'');
    const months = [...new Set((DATA.articles||[]).map(a => a.monthKey).filter(Boolean))].sort().reverse();
    const genres = [...new Set((DATA.articles||[]).map(a => a.genre).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'ja'));
    const fields = [...new Set((DATA.articles||[]).map(a => a.field).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'ja'));
    function fill(select, values){ values.forEach(v=>{ const o=document.createElement('option'); o.value=v; o.textContent=v; select.appendChild(o); }); }
    fill(byId('month'), months); fill(byId('genre'), genres); fill(byId('field'), fields);
    // ---- filter persistence: URL query params win over localStorage ----
    const FILTER_IDS = ['month','genre','field','sort','pageSize'];
    const LS_KEY = 'rd-filters-v1';
    function readUrlState(){ try { const p = new URLSearchParams(location.search); const s = {}; let any = false; FILTER_IDS.concat(['keyword']).forEach(id=>{ if (p.has(id)) { s[id] = p.get(id); any = true; } }); return any ? s : null; } catch(e){ return null; } }
    function readLsState(){ try { return JSON.parse(localStorage.getItem(LS_KEY) || 'null'); } catch(e){ return null; } }
    function applyState(s){ if (!s) return; FILTER_IDS.forEach(id=>{ if (s[id] != null) byId(id).value = s[id]; }); if (s.keyword != null) byId('keyword').value = s.keyword; }
    function currentState(){ const s = {}; FILTER_IDS.forEach(id=>{ s[id] = byId(id).value; }); s.keyword = byId('keyword').value; return s; }
    function persist(){ const s = currentState(); try { localStorage.setItem(LS_KEY, JSON.stringify(s)); } catch(e){} try { const p = new URLSearchParams(); Object.keys(s).forEach(k=>{ if (s[k]) p.set(k, s[k]); }); const q = p.toString(); history.replaceState(null, '', q ? '?' + q : location.pathname); } catch(e){} }
    applyState(readUrlState() || readLsState());
    // ---- summary folding ----
    const FOLD_CHARS = 180;
    const expanded = new Set();
    let currentPage = 1;
    function render(){
      const month=byId('month').value, genre=byId('genre').value, field=byId('field').value, sort=byId('sort').value, kw=norm(byId('keyword').value);
      let rows=(DATA.articles||[]).filter(a=>{
        if(month&&a.monthKey!==month) return false; if(genre&&a.genre!==genre) return false; if(field&&a.field!==field) return false;
        const hay=norm([a.titleJa,a.title,a.summaryHtml,a.authors.join(' '),a.categories.join(' ')].join(' '));
        if(kw&& !hay.includes(kw)) return false; return true;
      });
      rows = rows.slice().sort((a,b)=> sort==='oldest' ? a.timestamp-b.timestamp : sort==='title' ? a.titleJa.localeCompare(b.titleJa,'ja') : b.timestamp-a.timestamp);
      const pageSize = parseInt(byId('pageSize').value, 10) || 0;
      const totalPages = pageSize ? Math.max(1, Math.ceil(rows.length / pageSize)) : 1;
      if (currentPage > totalPages) currentPage = totalPages;
      if (currentPage < 1) currentPage = 1;
      const pageRows = pageSize ? rows.slice((currentPage - 1) * pageSize, currentPage * pageSize) : rows;
      byId('pageInfo').textContent = rows.length ? `${currentPage} / ${totalPages} ページ` : '0 / 0 ページ';
      byId('prevPage').disabled = currentPage <= 1;
      byId('nextPage').disabled = currentPage >= totalPages;
      byId('meta').textContent = `更新: ${DATA.updatedAt || '-'} / 表示件数: ${rows.length}件`;
      byId('emptyState').style.display = rows.length ? 'none' : 'block';
      byId('list').innerHTML = pageRows.map(a=>{
        const plain = plainText(a.summaryHtml);
        const isLong = plain.length > FOLD_CHARS;
        const open = expanded.has(a.url);
        const summaryHtml = (!isLong || open) ? (a.summaryHtml || '') : esc(plain.slice(0, FOLD_CHARS)) + '…';
        const btn = isLong ? `<button type="button" class="summary-toggle" data-url="${esc(a.url)}" aria-expanded="${open}">${open ? '閉じる' : '続きを読む'}</button>` : '';
        return `
        <article>
          <p class="meta">${esc(a.source)}　${esc(a.publishedAt.slice(0,10))}</p>
          <h2 class="article-title">${esc(a.titleJa)}</h2>
          <div class="taxonomy"><span class="chip">${esc(a.genre)}</span><span class="chip">${esc(a.field)}</span>${a.categories.slice(0,4).map(c=>`<span class="chip">${esc(c)}</span>`).join('')}</div>
          <div class="summary">${summaryHtml}</div>${btn}
          <div class="source-box"><strong>ソース・引用元</strong>配信元：${esc(a.source)}<br>原題：${esc(a.title)}<br>著者：${esc(a.authors.join(', '))}<br>原文URL：<a href="${esc(a.url)}" target="_blank" rel="noopener">${esc(a.url)}</a></div>
        </article>`;
      }).join('');
    }
    function resetAndRender(){ currentPage = 1; persist(); render(); }
    ['month','genre','field','sort','pageSize'].forEach(id=>byId(id).addEventListener('change',resetAndRender)); byId('keyword').addEventListener('input',resetAndRender);
    byId('prevPage').addEventListener('click',()=>{ if(currentPage>1){ currentPage--; render(); } });
    byId('nextPage').addEventListener('click',()=>{ currentPage++; render(); });
    byId('list').addEventListener('click',e=>{
      const btn = e.target && e.target.closest ? e.target.closest('.summary-toggle') : null;
      if (!btn) return;
      const u = btn.getAttribute('data-url');
      if (expanded.has(u)) expanded.delete(u); else expanded.add(u);
      render();
    });
    byId('resetFilters').addEventListener('click',()=>{
      byId('month').value=''; byId('genre').value=''; byId('field').value=''; byId('sort').value='newest'; byId('keyword').value=''; byId('pageSize').value='20';
      try { localStorage.removeItem(LS_KEY); } catch(e){}
      try { history.replaceState(null, '', location.pathname); } catch(e){}
      currentPage = 1; render();
    });
    render();
  </script>
