  <script>
    const DATA = {"articles":[{"authors":["Davoud Amiri","Lamberto Briziarelli","Sara Amiri","Barry Karlsson","Swetang J Shah","Hadi Rahimi Danesh"],"categories":[],"field":"World Journal of Psychiatry","genre":"Psychedelics / Trauma","monthKey":"2026-11","publishedAt":"2026-11-19T00:00:00Z","source":"Crossref","summaryHtml":"ニュースフィードやSNS、画像・動画、絶え間ないデジタル更新を通じて、苦痛を伴う出来事に間接的に触れる機会が増えている。直接のトラウマ体験がなくても、不安や睡眠障害、易刺激性、疲労、脅威関連の情報から離れられないといった訴えが臨床でみられる。<br><br>代理トラウマ、メディア誘発ストレス、ドゥームスクローリング、インフォデミック関連の苦痛といった既存の概念は現象の一部を捉えるが、統合的な枠組みはなかった。本レビューは1990〜2025年の文献をPubMed・PsycINFO・Google Scholarで構造的に検索し、縦断研究・横断研究・実験研究・レビュー・概念研究を物語的に統合して、間接的な曝露が心理的苦痛にどう寄与するかを検討し、「外的ストレス過負荷」を臨床・公衆衛生の枠組みとして提案する。<br><br>利用可能な証拠の多くは観察的で不均一であり、外的ストレス過負荷は新しい診断ではなく仮説生成のための概念として扱うべきだと著者らは述べている。繰り返し・図像的・長時間・離脱困難な曝露ほど関連が強く、不確実性への不耐性や反すう、繰り返しの確認やドゥームスクローリングといった認知・行動パターンが苦痛を持続させるとされる。デジタル時代の間接的トラウマ曝露を理解する出発点となるレビューである。出典：Crossref","timestamp":1795046400000,"title":"Beyond direct trauma: Vicarious exposure, media-induced stress, and external stress overload as emerging public mental health challenges","titleJa":"直接のトラウマを超えて――間接的曝露とメディア誘発ストレス、外的ストレス過負荷","url":"https://doi.org/10.5498/wjp.124924"},{"authors":["Rahma Aulia Faradilah","Sabrina Ang","Flora Nasution","Azizah Zaskiyah"],"categories":[],"field":"Lex Journal : Kajian Hukum dan Keadilan","genre":"Consciousness / Philosophy","monthKey":"2026-11","publishedAt":"2026-11-19T00:00:00Z","source":"Crossref","summaryHtml":"社会の動きが絶えず変わるなか、人々が法をどう受け止め、評価し、守るかも変わり続けている。本研究は、法哲学が人々の法的意識を育てるうえで果たす役割を、規範法学的方法と哲学的・概念的アプローチによる文献レビューで検討した。法は形式的な規則の集まりではなく、正義・法的確実性・効用に根ざした価値体系であり、法的意識は条文の知識を超えて、理解や評価的態度、制度への信頼、法を社会行動の指針として内面化する意思を含むという。<br><br>法的意識の育成を阻む要因として、法リテラシーの低さ、実定法と共同体の道徳規範との緊張、法制度への信頼の低下、デジタル技術とAIによる誤情報の急速な拡散、法遵守に対する市民の無関心が挙げられている。法哲学は、法の本質や目的、規範的基盤について批判的で反省的な思考を育てることで、こうした課題に向き合う手がかりになる。<br><br>著者らは、法哲学は批判的・合理的・価値志向的な法的意識を育む戦略的な位置にあり、法遵守や正義、社会秩序、法的保護を支える基盤になると結論づけている。法と社会の関係を哲学の視点から捉え直す論考である。出典：Crossref","timestamp":1795046400000,"title":"Beyond the Law: How Philosophy Shapes Legal Consciousness in a Changing Society","titleJa":"法を超えて――変化する社会における法哲学と法的意識","url":"https://doi.org/10.25139/lex.v10i4.12815"},{"authors":["C. A. Roe","K. Kothe","R. Evrard","B. Greyson","M. Mutis","M. Nahm","N. Tassell-Matamua","M. Woollacott"],"categories":[],"field":"Frontiers in Psychology","genre":"Consciousness / Philosophy","monthKey":"2026-11","publishedAt":"2026-11-19T00:00:00Z","source":"Frontiers in Psychology","summaryHtml":"死の直前に、もうろうとして反応のなかった人が突然はっきりと話し出す――終末期の明晰さ（ターミナル・ルーシディティ）は、進行した認知症など回復の見込みがないとされる状態でも報告されてきた現象だ。その実態や原因はほとんど解明されていない。本研究は、成人の明晰さの事例を目撃した医療従事者と介護者を対象に、オンライン質問票で心理的・生理的な変数とその背景を調べた。<br><br>集まった68件の回答のうち35件が明晰さの事例として採用された。事前の病状は認知症・アルツハイマー病、さまざまながん、心血管疾患、呼吸器疾患、脳卒中、昏睡など多岐にわたり、単一の原因では説明できなかった。薬や治療の変更が明晰さを引き起こしたかとの問いには、35人中30人が否定的で、心理社会的・スピリチュアルな説明を支持した。<br><br>診断名や身体状態、年齢などの属性、明晰さの持続時間や死までの近さだけでは、発生や特徴を十分に説明できないことが示された。著者らは、明晰さが起きる条件をさらに詳しく調べる必要があると結論づけている。出典：Frontiers in Psychology","timestamp":1795046400000,"title":"Circumstances, phenomenology and impacts of terminal lucidity in adults","titleJa":"成人の終末期の明晰さ――その状況・現象学・影響","url":"https://www.frontiersin.org/articles/10.3389/fpsyg.2026.1932801"},{"authors":["Lipeng He","Yihan Wang","Jiawen Zhang","N. Asokan"],"categories":["cs.CR"],"field":"cs.CR","genre":"Ethics / Safety","monthKey":"2026-11","publishedAt":"2026-11-19T00:00:00Z","source":"Hugging Face Papers","summaryHtml":"大規模言語モデルを使ったエージェントは、信頼できない外部データと日常的にやり取りするため、攻撃者が選んだ作業を実行させられる間接プロンプトインジェクション（IPI）の危険にさらされている。脆弱性を大規模に探る自動レッドチーミングでは、強化学習で攻撃成功率の高い攻撃を生成する手法が使われる。見つかった攻撃で敵対的学習を行い、配備前にエージェントを強化する攻防一体の過程はパープルチーミングと呼ばれる。<br><br>ところが本研究は、攻撃成功率の高さがその後の敵対的学習による頑健性の向上を保証しないことを示した。最先端の強化学習型レッドチーミング手法RL-HammerとPISmithはモード崩壊を起こし、似た攻撃方略ばかりを繰り返し発見するため、追加の成功が頑健性の改善につながらなかったのである。そこで提案されたPIPETTEは、辞書学習に基づく報酬で攻撃方略の網羅性を広げ、IPI防御に特化したオン方策の敵対的学習パイプラインを組み合わせた統一フレームワークである。<br><br>エージェント向けベンチマークAgentDojoとASBでの評価では、PIPETTEで鍛えた防御側は静的な攻撃に対して攻撃成功率をほぼゼロに抑え、強力な適応的攻撃にも耐えた一方で、通常のタスクの有用性は無防備なベースラインとほぼ同等に保たれた。出典：Hugging Face Papers","timestamp":1795046400000,"title":"PIPETTE: Prompt Injection Purple-Teaming for Robust LLM Agents","titleJa":"PIPETTE――間接プロンプトインジェクションに対するLLMエージェントの紫チーム演習","url":"https://arxiv.org/abs/2611.24362"},{"authors":["Ziqi Jin","Jiaxi Li","Weiwen Xu","Aixin Sun"],"categories":["cs.CL"],"field":"cs.CL","genre":"LLM / NLP","monthKey":"2026-11","publishedAt":"2026-11-19T00:00:00Z","source":"Hugging Face Papers","summaryHtml":"ループ型言語モデルは、共有した層スタックを1トークンあたりT回繰り返すことで、少ないパラメータ数で推論を深める。従来の早期終了（アーリーエグジット）は最初の数パスで打ち切るため、過去トークンのキー・バリュー・キャッシュが浅い深さで切り捨てられてしまう。本研究はその逆の発想「遅延参入（レイトエントリー）」を調べた。新しいトークンが最初のパスを飛ばし、深い文脈キャッシュ上で最後のK回（K<T）のパスに直接入る方式である。<br><br>軽量なファインチューニングで参入境界における隠れ状態のノルムのずれを解消すると、深いキャッシュされた文脈が、省かれたトークン固有のパスの代わりを果たす。遅延参入は、モデル系列やパス数の組み合わせを横断して、対応する早期終了を上回った。さらに、深いキャッシュの構築で処理が止まらないよう、候補ブロックは最後のKパスだけで検証し、確定済みトークンは後続ステップと並行して1からTまでのパスを完了させる。<br><br>この「Wake検証」は、出力GEMM内に組み込んだ仕組みで、貪欲法と完全一致する検証（τ=0）、マージンで判定する検証（τ>0）、ロールバックなしの損失あり遅延参入（τ=∞）を単一の静的CUDAグラフに統一する。Ouro-2.6B（T=4）ではK=2のWakeがτ=0で5.2倍の高速化を達成し、Huginn-3.5BではT=64で貪欲法と完全一致のまま8.4倍に達した。出典：Hugging Face Papers","timestamp":1795046400000,"title":"Late Entry in Looped Language Models","titleJa":"ループ型言語モデルの遅延参入――深いキャッシュを活かす高速な推論手法","url":"https://arxiv.org/abs/2611.24576"},{"authors":["Haoran Ye","Tianrui Huo","Hangzhen Li","Xin Zhang","Guojie Song"],"categories":["cs.CL"],"field":"cs.CL","genre":"LLM / NLP","monthKey":"2026-11","publishedAt":"2026-11-19T00:00:00Z","source":"Hugging Face Papers","summaryHtml":"大規模言語モデルは、心理的属性の推定や個人の行動予測、社会集団のシミュレーションに使われるようになった。だが、もっともらしい応答を生成する一方で、個人を誤って表現したり、集団の統計をゆがめたりすることが多い。本研究は、人間の行動を測定し予測する基盤モデルChironを提案する。心理構成概念の表現、個人の行動予測、集団の応答分布と人間統計の一致を、言語モデルの共同ファインチューニングで同時に学習させる。<br><br>学習と評価のデータは36の行動領域と78の社会科学実験にわたり、288,307人の記録、1,411,750件の個別の行動決定、109の心理構成概念に関する99,953件の心理測定を含む。評価では、Chironによる心理測定は人間の自己報告により近く一致し、心理測定の妥当性を損なう偏りが少なかった。個人の行動予測は最先端の言語モデルを最大28.4%（相対）上回った。<br><br>社会科学実験のシミュレーションでは、実験効果の方向と大きさをより正確に捉え、効果量の推定誤差を82.2～94.3%削減した。著者らは、Chironが人間の行動の測定と予測のための統一的な計算ツールになると結論づけている。出典：Hugging Face Papers","timestamp":1795046400000,"title":"A Foundation Model to Measure and Predict Human Behaviour","titleJa":"Chiron――人間の行動を測定・予測する基盤モデル","url":"https://arxiv.org/abs/2611.24830"},{"authors":["Xingyang Li","Tianlang Zhao","Song Han","Ligeng Zhu"],"categories":["cs.LG"],"field":"cs.LG","genre":"LLM / NLP","monthKey":"2026-11","publishedAt":"2026-11-19T00:00:00Z","source":"Hugging Face Papers","summaryHtml":"学習後の量子化は、大規模言語モデルを低コストで提供する標準的な方法だ。だが最適な量子化レシピはモデルや精度ごとに異なり、専門家が新しいモデルごとに設計し直す必要があり、時間もかかって最適とは限らない。エージェントが候補の構築と評価を繰り返してレシピを洗練させることはできるが、量子化した推論モデル1件の評価に数十GPU時間を要し、異なるコードベースの手法を組み合わせるには手作業での移植が必要だった。<br><br>そこで提案されたQDAは、エージェントがモデルと精度ごとにレシピを設計するシステムである。評価の高速化のため、エージェントが見ていない推論トレース上で元モデルとの出力KLダイバージェンスを測り、数分で候補を採点する。有望な候補は長い生成で確認し、繰り返しループなどの失敗を捉える。構築の高速化のため、互いに互換性があり新しいアーキテクチャにも対応する公開済み量子化手法のライブラリを用意した。<br><br>4つの推論モデルでは、QDAは最強の公開レシピをW4A16で0.9ポイント、W4A8で1.4ポイント、W3A16で2.2ポイント上回った（探索は64GPU時間）。3200億パラメータのMoEモデルGLM-5.3-Flashでは、NVFP4 W4A4でFP8モデルの精度の98.3%を回復し、最良のベンダー製チェックポイントの96.9%を上回った。生成したチェックポイントは既存の推論カーネルでそのまま動き、追加の推論コストはない。出典：Hugging Face Papers","timestamp":1795046400000,"title":"QDA: Closed-Loop LLM Quantization Design with Agents","titleJa":"QDA――エージェントが量子化レシピを設計する閉ループ手法","url":"https://arxiv.org/abs/2611.23388"},{"authors":["Muad Y. Abd El Hay","Ana Cukić","Marieke L. Schölvinck","Martha N. Havenith"],"categories":[],"field":"Translational Psychiatry","genre":"Psychedelics / Trauma","monthKey":"2026-11","publishedAt":"2026-11-19T00:00:00Z","source":"Crossref","summaryHtml":"サイケデリックはうつ病や不安、PTSDの治療に有望だが、治療効果を生む神経生物学的メカニズムはほとんど解明されていない。動物実験の結果は一貫せず、ヒトへの橋渡しが進まない。本レビューは2014〜2026年に発表されたげっ歯類のサイケデリック研究266件を監査し、実験条件と行動評価の問題点を体系的に洗い出した。<br><br>ヒト治療で重視される「セットとセッティング」にあたる福祉面では、活動期の試験は14%、環境エンリッチメントは7%、丁寧なハンドリングは21%の報告にとどまり、投与はほぼ例外なく拘束を伴うストレスのかかる方法だった。行動評価も短時間で単一指標に頼るものが多く、時間とともに変化するサイケデリック体験の多次元性を捉えられていない。さらに個体差や社会的文脈もほぼ無視され、集団レベルの横断デザインが大半だった。<br><br>著者らは、ストレス下の孤立した動物の短時間試験から、豊かな社会環境での個体の縦断追跡と包括的な行動評価へと根本的に転換すべきだと提言し、実装のための実践的な助言も示している。出典：Crossref","timestamp":1795046400000,"title":"Animal models in psychedelic research – Tripping over translation","titleJa":"サイケデリック研究の動物モデル――翻訳の壁を越えるには","url":"https://doi.org/10.1038/s41398-026-04589-z"},{"authors":["Fritz Günther","Mathis Parent-Couture","Abdo Uyar","Klara Wieczorke","Ulrike Lueken","Ricarda Evens","Max Wolff"],"categories":[],"field":"PsyArXiv","genre":"Psychedelics / Trauma","monthKey":"2026-11","publishedAt":"2026-11-19T00:00:00Z","source":"OSF Preprints","summaryHtml":"メンタルヘルス調査では参加者に体験を自分の言葉で書いてもらう自由記述がよく使われる。情報量は豊富だが数量化が手間だったため分析されることは少なかった。オープンウェイト言語モデルにより、テキストを数値ベクトル（埋め込み）に変換して標準的な統計分析の予測変数にできるようになった。本研究はその手法がサイケデリック体験後の転帰予測に役立つかを検証した。<br><br>3つのデータセット（参加者229〜958人）で、人口統計・設定・質問票の予測変数20〜45項目に自由記述の埋め込みを加えたところ、繰り返しネスト交差検証でウェルビーイングの変化、心理的柔軟性の変化、心的外傷後症状の重症度について説明分散が3〜10ポイント上昇した（相対8〜32%）。対象の5転帰はウェルビーイングの変化、心理的柔軟性の変化、心的外傷後症状の重症度、現在のウェルビーイング、心的外傷後成長である。現在のウェルビーイングと心的外傷後成長では改善は見られなかった。<br><br>自由記述には標準的な質問票では捉えきれない情報が含まれており、オープンエンドの質問を日常的に含め、回答を分析することが推奨される。出典：OSF Preprints","timestamp":1795046400000,"title":"Free-text responses improve prediction of mental health outcomes after psychedelic experiences","titleJa":"自由記述の回答がサイケデリック体験後のメンタルヘルス転帰の予測を高める","url":"https://osf.io/preprints/psyarxiv/e9wzk_v2/"},{"authors":["Chris Soria"],"categories":[],"field":"SocArXiv","genre":"LLM / NLP","monthKey":"2026-11","publishedAt":"2026-11-19T00:00:00Z","source":"OSF Preprints","summaryHtml":"自由記述の回答からカテゴリーを見つけるのにLLMを1回呼ぶだけでは信頼できない。モデルは確率分布からサンプリングするため実行ごとに異なるテーマを返し、どの一覧がデータに属し、どれがその回の抽出によるものか分からない。本研究は「飽和プロンプティング」を提案する。多数の独立した呼び出しがそれぞれ新しいランダムサンプルを読み、各テーマの発見頻度を数えて分布として示す手法だ。<br><br>UCバークレー社会ネットワーク調査の自由記述4設問で検証したところ、Llama 3.1 8Bの飽和実行は手作業で作られた既存コードブック50カテゴリーのうち43〜47を再現し、単回呼び出しの31〜37を上回った。より高性能なClaude Sonnet 5では上積みは小さいが、両モデルとも全設問で単回呼び出しより多くの異なるカテゴリーを見つけた。2回の実行の上位10ラベルの類似度は平均0.85から64回呼び出しで0.96に上昇した。<br><br>飽和プロンプティングにより、ノートPCで動く下位のオープンウェイトモデルでも実行間のばらつきが減り、再現性が高まる。ラベル統合は便利だが、見つけた異なるカテゴリーのうち33〜91%しか残らない点には注意が必要だ。出典：OSF Preprints","timestamp":1795046400000,"title":"Saturation Prompting: Recovering Stable Categories from Open-Ended Survey Responses with Repeated LLM Extraction","titleJa":"飽和プロンプティング――LLMの繰り返し抽出で自由記述の安定したカテゴリーを取り戻す","url":"https://osf.io/preprints/socarxiv/wtkpm_v1/"},{"authors":["Philipp Lutscher","Antonia Schulde","Adrian Rauchfleisch","Andreas Jungherr"],"categories":[],"field":"SocArXiv","genre":"Ethics / Safety","monthKey":"2026-11","publishedAt":"2026-11-19T00:00:00Z","source":"OSF Preprints","summaryHtml":"警察はデータ分析や容疑者の特定、公共空間の監視などにAIを活用しているが、その利用は国家の強制力の拡大につながりうる。人々がそうしたツールをどこまで受け入れるかは、政治的文脈を横断してほとんど分かっていなかった。本研究は、米国、中国、台湾、英国とEU5か国の9,000人を対象とした事前登録調査で、支持が何に支えられているかを検証した。<br><br>ベイズ階層モデルによる分析の結果、ほとんどの用途への支持はすべての国で高かった。支持はAIの一般的メリット、犯罪動向の認識、警察への信頼に支えられており、警察への信頼の効果は国を超えて同様だった。一方でAIの一般的リスク、個人的な犯罪への恐れ、法制度への信頼は平均的には実質的な役割を果たさなかった。<br><br>警察のAI利用への受容は、AIへの楽観と問題の一般的な関連性、警察への信頼に主として結びついていることが示された。支持が技術そのものの見方によるのか、対象となる問題によるのか、それとも利用する機関への信頼によるのかを切り分けた点が特徴で、法執行におけるAI導入をめぐる議論に9か国の比較データを提供する調査である。出典：OSF Preprints","timestamp":1795046400000,"title":"The Majority Report: AI Optimism and Public Support for Police Use of AI in Nine Countries","titleJa":"多数派の報告――9か国におけるAIへの楽観と警察のAI利用への支持","url":"https://osf.io/preprints/socarxiv/pkj7n_v2/"},{"authors":["Yan Qiu","Yuanyuan Li"],"categories":["cs.CL"],"field":"cs.CL","genre":"Ethics / Safety","monthKey":"2026-11","publishedAt":"2026-11-18T18:56:12Z","source":"arXiv","summaryHtml":"ジェイルブレイクや有害なプロンプトは、大規模言語モデルの安全な運用における課題であり続けている。既存の検出手法は下流の分類器を別途訓練する必要があり、その分、訓練コストとラベル付きデータの負担が大きかった。<br><br>本研究は対照学習した表現に基づく手法JDPIを提案する。二値の安全性ラベルだけを用いて有害・良性のプロトタイプを構築し、プロトタイプとの相対距離で判定するため、分類器の追加訓練が不要で、必要なラベル付き事例も少なく済む。異なる入力形式を扱う4つのベンチマークで検証された。<br><br>4つのベンチマークで、対照微調整により検出精度が9.1〜18.0ポイント向上した。同じエンコーダを用いた場合、1つのベンチマークでは分類器を上回り、残りでも0.017以内の差にとどまった。Llama Guard 3-8BをROC-AUCで0.173〜0.310上回り、12件の転移実験でも分類器を平均1.59ポイント上回る頑健さを示した。多ターンの会話では現在の発話だけでなく蓄積された会話履歴を用いることで、会話レベルの精度がさらに高まった。出典： arXiv","timestamp":1795028172000,"title":"Jailbreak Detection on Large Language Models via Contrastive Prototype Structures","titleJa":"ジェイルブレイク検出――対照プロトタイプ構造でLLMの安全性を判定する手法","url":"https://arxiv.org/abs/2611.24936"},{"authors":["Jiashu Li","Tianyu Gao","Qinglong Liu","Jinping Wang","Ye Wei","Zhiqiang Gao"],"categories":["cs.LG"],"field":"cs.LG","genre":"LLM / NLP","monthKey":"2026-11","publishedAt":"2026-11-18T18:08:08Z","source":"arXiv","summaryHtml":"数学的推論は単一の能力ではなく、問題ごとに異なる推論スキルが求められる。近年の研究は数学的推論を原子スキルに分解し、能力別のモジュールを開発してきたが、それらをどう効果的に活用するかは未開拓だった。<br><br>本研究は事例ごとに原子推論スキルを合成する枠組みAMRを提案する。能力別のLoRAエキスパートのライブラリを訓練し、勾配不要の最適化で多様な合成プロトタイプを発見する。各プロトタイプの適合は参照解答のトークン単位の負の対数尤度で評価し、信頼度マージンで曖昧な割当てを除去して軽量ルーターに蒸留する。推論時は問題ごとに適切な合成を選択する。<br><br>AtomicMathベンチマークで一貫した改善が得られた。汎用モデルと数学特化モデルの両方で改善が確認され、Qwen2.5-Math-Instruct-7Bではレベル1の平均分野精度が64.4%から68.1%へ、レベル2が59.3%から63.7%へ、論理推論は39.4%から46.8%へ向上した。専門スキルを効果的に合成することが数学的推論の強化に有望だと示された。出典： arXiv","timestamp":1795025288000,"title":"Atomic MathReasoner: Instance-Level Composition of Atomic Reasoning Skills for Mathematical LLMs","titleJa":"Atomic MathReasoner――原子推論スキルの事例別合成で数学LLMを強化","url":"https://arxiv.org/abs/2611.24846"},{"authors":["Liu He","Yizhi Song","Ruiqi Xu","Baris Sarper Tezcan","Xiao Zeng","Albert Y. C. Chen","Lu Xia","Shashwat Verma","Sankalp Dayal","Min Sun","Cheng-Hao Kuo","Daniel Aliaga"],"categories":["cs.CV"],"field":"cs.CV","genre":"Vision / Multimodal","monthKey":"2026-11","publishedAt":"2026-11-18T17:39:54Z","source":"arXiv","summaryHtml":"マルチモーダル大規模言語モデル（MLLM）は、物体の向きやカメラの視点、カメラショットといったカメラと物体の関係を正確に捉えるのが苦手だった。原因は、訓練に使われてきた画像に含まれるカメラ・物体関係の多様性が限られ、それに対応するテキスト記述も不足していたことにある。<br><br>本研究は3Dアセットを入力に、レンダリングと拡散モデルによる画像生成を組み合わせ、正確なカメラ・物体関係を保った写真風の画像を大規模に合成する手法を提案した。生成された画像は写真のようにリアルでありながら、注釈の正確さは保たれている。さらに大規模言語モデルで視覚指示チューニング用のテキストプロンプトを生成し、24万件のVQAと正確なカメラ・物体注釈からなるデータセットUltimate3Dと、それを測るベンチマークを構築した。<br><br>提案データセットで微調整したMLLMは、カメラ・物体関係の認識において商用モデルを大きく上回り、平均精度が29.7%向上した。コード、データセット、ベンチマークは公開される予定で、3D空間を理解する広範なMLLM応用への貢献が期待される。出典： arXiv","timestamp":1795023594000,"title":"Ultimate3D: Teaching Multimodal LLMs 3D Camera-Object Relations by Large-Scale Visual Instruction Data","titleJa":"Ultimate3D――3Dカメラ・物体関係の大規模視覚指示データでマルチモーダルLLMを鍛える","url":"https://arxiv.org/abs/2611.24795"},{"authors":["Ghadi Nehme","Dahyun Nam","Akshay Govind Srinivasan","Faez Ahmed"],"categories":["cs.AI","cs.CV","cs.RO"],"field":"cs.AI","genre":"Agents / Robotics","monthKey":"2026-11","publishedAt":"2026-11-18T05:02:07Z","source":"arXiv","summaryHtml":"AIエージェントは、現実の世界で動くロボットを設計できるだろうか。本論文は、コーディングエージェントが標準部品・モーター・特注の3Dプリント部品からロボットのハードウェアとプログラムを共同設計するベンチマークRoboBuilderを提案する。シミュレーションで合格した設計はすべて実際に製作され、物理コースでテストされる。<br><br>シミュレーションだけでは不十分で、公開された部品データを用いた場合、最初に合格した15設計のうち実コースを走破したものは一つもなかった。そこでエージェントは、自身が要求した計測値と実走行の動画からシミュレータを学ぶ。4つの最先端コーディングエージェント、3段階の難易度で10の障害物、16,427回のシミュレーション、12,774種の異なるロボット、135台の実機（製作時間は推定240時間）という規模の実験が行われた。<br><br>エージェントは易しい障害物のほぼすべてを解き、探索ベースラインが到達しない機構も発明したが、難易度が上がると苦戦し、シミュレーション合格のうち実世界でも通用したのは全段階で66%にとどまった。実失敗の動画を見せるとエージェントはロボットを再設計し、レベル1・2の失敗の72%を除去した。実機を設計するエージェントの進捗を測る指標となる。出典：arXiv","timestamp":1794978127000,"title":"RoboBuilder: Agentic Robot Co-Design with Real-world Video Feedback in the Loop","titleJa":"RoboBuilder――実世界の動画フィードバックでロボットを共同設計するエージェントのベンチマーク","url":"https://arxiv.org/abs/2611.23855"},{"authors":["Apoorva Vashisth","Manav Kulshrestha","Damon Conover","Zachary Kingston","Aniket Bera"],"categories":["cs.RO","cs.AI","cs.LG"],"field":"cs.RO","genre":"Agents / Robotics","monthKey":"2026-11","publishedAt":"2026-11-18T04:49:41Z","source":"arXiv","summaryHtml":"視覚言語行動（VLA）モデルは汎用的なロボット操作の有望な枠組みだが、複数の相互依存する操作を要する長期タスクでは性能が低下しやすい。長期の推論・記憶・行動生成・進捗追跡・誤り回復のすべてをVLAポリシーに背負わせるのではなく、その短期操作の能力を活かす実行意識型の枠組みが求められていた。<br><br>本論文は、VLAに依存しない枠組みRePlan-VLAを提案する。ロボットの動作を明示的に監視して進捗を評価し、観測された結果に基づいて今後の計画を適応的に修正することで、VLAの短期能力を信頼できる長期実行へとつなげる。既存のVLAポリシーはそのまま使い、追加のファインチューニングは不要である。<br><br>ベンチマークRoboCasa365とCALVINでは、次点のベースラインを成功率で21.9ポイントと10.4ポイント上回った。長期の操作では誤りの蓄積が課題になるが、進捗の監視と計画の修正により、その場で立て直す実行が可能になる。Franka Research 3による実機展開でも有効性が確認されており、長期操作タスクにおけるVLAの実用性を高める手法である。出典：arXiv","timestamp":1794977381000,"title":"RePlan-VLA: Progress-Aware Replanning for Long-Horizon Vision-Language-Action Models","titleJa":"RePlan-VLA――進捗を監視して計画を修正する長期タスク向け視覚言語行動モデル","url":"https://arxiv.org/abs/2611.23843"},{"authors":["Wen Wang","Jindong Wang","Jiahua Bao","Tu Yongsiqi","Yihao Liu","Junwei He"],"categories":["cs.AI"],"field":"cs.AI","genre":"LLM / NLP","monthKey":"2026-11","publishedAt":"2026-11-18T04:24:51Z","source":"arXiv","summaryHtml":"検索拡張言語モデルは、推論と検索を交互に行いながら答えを導く。終端の正答報酬による強化学習では、途中の各検索が有用な情報を得たかどうかに関わらず同じクレジットが与えられる。とくに全ロールアウトが失敗した場合、グループ中心の利得はゼロに潰れ、証拠の集め方の違いが学習に反映されない。<br><br>本論文は、根拠に基づくクレジット割当て（ECA）を提案する。終端報酬に加え、取得した文書が参照回答の尤度をどれだけ高めるかを測る訓練専用の補助信号を用いる。生成された思考や検索クエリの表層的な違いを除くため、質問と重複除去済みの文書だけを含む証拠限定プロンプトで、凍結した方策スナップショットに問いかける。ECA-StepとECA-Horizonの2種の定式化を比較した。<br><br>7つの検索型QAベンチマークで、ECA-Horizonは結果のみのGRPOベースラインに対し、Qwen2.5-3B-Instructで1.03ポイント、7B-Instructで4.80ポイントの厳密マクロ完全一致率の改善を示し、RLOOやGiGPOを上回った。MultiHop-RAGでのゼロショット評価でもマルチホップ推論への転移が確認された。出典：arXiv","timestamp":1794975891000,"title":"Evidence-Based Credit Assignment for Search-Augmented Language Models","titleJa":"根拠に基づくクレジット割当て――検索拡張言語モデルの強化学習を改善する手法","url":"https://arxiv.org/abs/2611.23824"},{"authors":["Ziyi Wang","Xiyue Zhang","Bing Hu","Guangmin Song","Chenyi Zhang","Li Wang"],"categories":["cs.CV"],"field":"cs.CV","genre":"Vision / Multimodal","monthKey":"2026-11","publishedAt":"2026-11-18T03:24:39Z","source":"arXiv","summaryHtml":"推論型の視覚言語モデル（VLM）は、答えるまでに数千トークンの思考を重ねる。KVキャッシュを節約するための保持ポリシーは、推論が伸びるにつれてキャッシュを刈り込むが、この刈り込みがマルチターンの会話で画像を犠牲にしている。画像と推論が1つの予算を共有するため、増えた推論が視覚エントリを押し出す。図表への質問は、最初に尋ねれば全キャッシュ比で8ポイントの低下にとどまるが、推論を1往復挟むと24ポイント低下した。<br><br>本論文は、視覚エントリの小さな予備枠を追放から守るだけで損失の大半が回復し、同じ枠を共有予算に足しても効果が小さいことを示した。画像に足りないのは容量ではなく保護である。この知見に基づき、既存の保持ポリシーの上で動く訓練不要の手法ShelfKVを提案する。視覚エントリはすべてCPUメモリに保持し、各デコード段階で現在のクエリが最も高く評価した視覚エントリを、最も低く評価したテキストエントリの注意スロットと交換する。<br><br>会話型の3ベンチマークを含む4ベンチマークでの評価で、ShelfKVは同一GPUメモリで最強の既存ポリシーDBTrimKVを最大20.3ポイント上回り、DBTrimKVが2倍のメモリを使っても8.7ポイント上回った。単独の質問での精度を損なうこともない。画像は推論から守りつつ、読むときだけ注意を向けるべきだと示した。出典：arXiv","timestamp":1794972279000,"title":"Keep the Reasoning, Read the Image: On-Demand Visual KV for Multi-Turn Reasoning VLMs","titleJa":"推論は残し、画像は読む――マルチターン推論VLM向けオンデマンド視覚KVキャッシュ","url":"https://arxiv.org/abs/2611.23769"},{"authors":["Xingyu Zhao"],"categories":["cs.SE","cs.AI"],"field":"cs.SE","genre":"Ethics / Safety","monthKey":"2026-11","publishedAt":"2026-11-18T02:44:28Z","source":"arXiv","summaryHtml":"公開ベンチマークは大規模言語モデル（LLM）の能力を比較するが、同じ高順位のモデルでもユーザーごとに体験は異なりうる。本論文は、ソフトウェア信頼性の考え方を引き、LLMサービスの信頼性は特定のユーザーと使用条件に対して評価されるべきだと主張する。能力スコアだけでは足りず、将来の運用における失敗について主張を支える評価証拠が必要になる。<br><br>著者は、欠陥を発見するためのテストと信頼性を評価するためのテストを区別し、そうした主張の背後にある10のモデル化上の考慮点を整理する。さらに、主張の仕様化、動的な運用プロファイル、段階的な結果とノイズのある判断、局所的な確率的頑健性、相互作用への依存、再評価を伴う統計的推論をつなぐ6つの作業からなる研究ロードマップを提案する。局所的な確率的頑健性は、異なる具体的な入力を同じタスクとして扱うときに隠れる行動のばらつきに対処する。<br><br>公開された知見と顧客対応の具体例がロードマップを裏づけるが、統合的な検証は今後の課題として残されている。信頼性の主張は安全性やセキュリティの議論に取って代わるものではなく、補完するものだとされる。能力スコアには、誰の要求を、どの条件で、どの程度の不確実性で満たすのかを記した版管理つきの運用上の主張を併記すべきだという提言である。出典：arXiv","timestamp":1794969868000,"title":"Reliability is a user-specific property of large language models","titleJa":"信頼性はユーザー固有の性質である――大規模言語モデルの評価への提言","url":"https://arxiv.org/abs/2611.23732"},{"authors":["Colin Soo","Cynthia van Golen"],"categories":[],"field":"Frontiers in Behavioral Neuroscience","genre":"Consciousness / Philosophy","monthKey":"2026-11","publishedAt":"2026-11-18T00:00:00Z","source":"Crossref","summaryHtml":"感情的に重要な情報は、意識にのぼらなくても処理されるのか。情動神経科学の中心的な問いに対し、本レビューは2016年から2026年3月までに発表された31件のヒト実証研究を統合した。後方マスキングや連続フラッシュ抑制、閾下プライミングといった手法で意識へのアクセスを制限し、機能的脳画像と電気生理学的手法で扁桃体の応答を調べた研究が対象だ。<br><br>結果として、報告可能な意識的知覚がなくても、感情的に際立った刺激は扁桃体の応答を引き起こすことが多くのパラダイムで示された。ただし応答の大きさやタイミング、左右差、結合性は刺激の性質や臨床状態、実験条件によって異なった。電気生理学的知見では意識的報告に先行する速い扁桃体応答が確認され、気づきの段階的な変化や知覚的ブレークスルーを調べた研究では、扁桃体・感覚皮質・高次皮質系の相互作用が示唆された。<br><br>著者らは「独立処理」「部分意識」「意識促進」という三つの理論的説明を検討し、統合的なネットワーク枠組みを提案する。早期の情動評価が感覚の増幅や顕著性の優先づけに影響し、分散した皮質間相互作用がその後の意識的アクセスに寄与するというものだ。扁桃体の活性化は意識的感情知覚に先行しうるが、常に生じるわけでも、意識を成立させるのに十分でもない。今後は客観的・主観的な気づきの指標と時間分解能の高い神経結合性の統合が必要だと結論づけている。出典：Crossref","timestamp":1794960000000,"title":"Amygdala processing beyond awareness: a review of evidence and integrated network model of emotional consciousness","titleJa":"意識にのぼる前に働く扁桃体――感情的意識の統合ネットワークモデル","url":"https://doi.org/10.3389/fnbeh.2026.1975075"},{"authors":["David S Mathai","Sean P Goldy","Thomas D Hull","Kristin Arden","Jack Swain","Leonardo Vando","Matteo Malgaroli"],"categories":[],"field":"Psychopharmacology","genre":"Psychedelics / Trauma","monthKey":"2026-11","publishedAt":"2026-11-18T00:00:00Z","source":"PubMed","summaryHtml":"ケタミンは有効な抗うつ薬だが、投与中の急性の主観的体験が治療反応にどう関わるかは不明だった。従来の研究は解離を副作用として測るものが多く、感情・認知・身体・視覚・聴覚にわたる主観的体験の全体像は捉えられていなかった。本研究は、主観的なサイケデリック体験の強さを副作用の枠組みを超えて捉え、抗うつ効果との関連を検証した。<br><br>中等症から重症のうつ病成人3,637名を対象とした後ろ向き縦断コホート研究で、遠隔医療を伴う治療プログラムのもと4週間に最大4回の舌下ケタミンを投与した。主観的効果は、感情・認知・身体・視覚・聴覚の5項目からなるMindbloom Psychedelic Intensity（MPI）尺度で評価した。主要転帰は治療終了時のPHQ-9スコアの変化、臨床的に有意な変化、治療反応の軌跡で、事前登録した解析により治療中期のMPIスコアと抗うつ効果の関連を調べた。<br><br>2週時点の主観的強度が高いほど、4週時点の抑うつ重症度の低下が大きく、臨床的に有意な変化や改善軌跡に属する可能性が高かった。この関連は投与量や他の共変量とは独立していた。主観的体験が治療反応の臨床的に意味のある相関因子であることが示され、ケタミンの一人称体験を捉える評価の重要性が浮き彫りになった。出典：PubMed","timestamp":1794960000000,"title":"Psychedelic experience intensity during ketamine treatment and antidepressant outcomes.","titleJa":"ケタミン治療中のサイケデリック体験の強さと抗うつ効果の関係","url":"https://pubmed.ncbi.nlm.nih.gov/43045823/"},{"authors":["Pengyi Chen","Feng Hong","Haoyun Jiang","Xu Chen","Yicheng Fu","Ziyi Tang","Xinmu Ge","Xiaofeng Cao","Xiangtao Li","Bo Han","Jiangchao Yao"],"categories":[],"field":"Frontiers in Artificial Intelligence","genre":"LLM / NLP","monthKey":"2026-11","publishedAt":"2026-11-18T00:00:00Z","source":"Frontiers in Artificial Intelligence","summaryHtml":"拡散型大規模言語モデル（DLLM）は並列デコーディングの有望な枠組みだが、脱ノイズの各ステップで双方向の全アテンションを用いるため計算量が二乗で増大し、長文脈では深刻な遅延のボトルネックになっていた。<br><br>研究チームはDLLMのアテンション動態を調べ、構造化スパースアテンション（SSA）を提案した。高速な構造単位のアルゴリズムで幾何学的パターンを選び再利用し、キャッシュした構造パターンとデコード中の活性領域の保護を組み合わせることで、推論効率と出力品質の両立を図る。脱ノイズの後期には隣接ステップ間のアテンション変化が減少し、垂直・対角の幾何学的パターンが確認されたが、その傾向は入力・層・ヘッドによって異なることも分かった。<br><br>LongBenchとRULERでの広範な実験により、従来の最先端手法と競合する品質を保ちながら大幅な高速化を達成し、128K文脈ではエンドツーエンドで約2倍の推論高速化を実現した。拡散型言語モデルの実用的な長文脈推論に向けた一歩となる。出典：Frontiers in Artificial Intelligence","timestamp":1794960000000,"title":"Structured sparse attention for accelerating long-context diffusion language models","titleJa":"長文脈の拡散型言語モデルを高速化する構造化スパースアテンション","url":"https://www.frontiersin.org/articles/10.3389/frai.2026.1993541"},{"authors":["Amir Khajavinia","Jordan Reekie","Deborah Michel","Robert B Laprairie","Anas El-Aneed"],"categories":[],"field":"Psychopharmacology","genre":"Psychedelics / Trauma","monthKey":"2026-11","publishedAt":"2026-11-18T00:00:00Z","source":"PubMed","summaryHtml":"シロシンはシロシビンの活性代謝物で、治療抵抗性うつ病や不安への治療薬として注目されている。脳組織中のシロシンとその主要代謝物4-HIAAの濃度を正確に測ることは、薬物動態の解明と安全で根拠に基づいた使用に不可欠だ。だが脳組織中の低分子をLC-MS/MSで定量する際、内因性のリン脂質がピーク形状を乱し、残留塩がイオン化を抑えるため再現性が損なわれる。脳を対象とした完全検証済みのLC-MS法はこれまで存在しなかった。<br><br>本研究は吸着剤によるリン脂質除去に頼らず、クロマトグラフィー中心のアプローチでこの課題を解いた。マトリックス希釈（ホモジネート：有機溶媒＝1：9）、低流量と緩やかな勾配でリン脂質信号から分析対象を分離し、ダイバーターバルブの精密なタイミングで塩分を含む溶出液を廃棄へ逃がす。タンパク質沈殿のみの前処理で定量下限0.05 ng/mLを達成し、選択性・正確性・精度の生体分析バリデーション基準を満たした。<br><br>この方法でマウス脳組織の信頼できる定量が可能になった。シロシビンとシロシン・シロシビン共結晶製剤の比較では、脳内シロシン濃度に性別や脳部位による差はなく、共結晶はより持続的な濃度を示唆した（有意差なし）。同じ条件で4-HIAAは検出されず、脳内蓄積が限定的で速やかに排出されることが示唆された。出典：PubMed","timestamp":1794960000000,"title":"Novel quantification method for psilocin in brain tissues using liquid chromatography-tandem mass spectrometry.","titleJa":"脳組織中のシロシンを測る――LC-MS/MSによる高感度定量法の確立","url":"https://pubmed.ncbi.nlm.nih.gov/43049361/"},{"authors":["Xin Yu","Fei Xia","Jiaqi Pan","Youbao Tang","Chengzhi Liu","Adams Yu","Sicong Jiang","Yanfei Chen","Lingzhou Xue","Ting Yu"],"categories":["cs.AI"],"field":"cs.AI","genre":"Agents / Robotics","monthKey":"2026-11","publishedAt":"2026-11-18T00:00:00Z","source":"Hugging Face Papers","summaryHtml":"ハーネスの最適化は、固定した方策モデルとベンチマークで研究されることが多い。どちらかが変わると、進化したハーネスのどこを再利用し、どこを改訂すべきかを判断しなければならないが、ハーネス自体は過去の編集がなぜ行われ、どう機能したかを説明しない。本研究は、既存のハーネス最適化手法を別のベンチマークや方策モデルへ継続する設定「継続的再帰的自己改善（CRSI）」を扱う。<br><br>提案する「自己改善メモリ（SIM）」は、課題を解く方策ではなくハーネス最適化器のための記憶である。編集を繰り返し現れるハーネスの問題ごとにまとめ、その根拠、予測された結果と観測された結果、評価文脈を記録し、最適化が進むにつれて履歴を拡張する。ハーネスのみでは過去の判断の理由が失われ、根本原因のみではどの編集が効いたかが見えにくい。SIMはその両方を結びつける。<br><br>4領域の実験で、SIMはハーネスのみや根本原因のみの継続より最終スコアが高かった。コーディングの10回の独立した出発点からの継続では、SIM付きの継続がハーネスのみの継続より最終スコアを平均2.36ポイント改善した（p=0.003）。ベンチマークや方策モデルが変わっても、過去の改善の履歴が新しい最適化に引き継がれることが示された。出典：Hugging Face Papers","timestamp":1794960000000,"title":"Self-Improvement Memory Enables Continual Recursive Self-Improvement","titleJa":"自己改善の記憶で再帰的自己改善を続ける――ハーネス最適化の継続手法","url":"https://arxiv.org/abs/2611.18856"},{"authors":["William John Atkinson","Paul Saproza"],"categories":[],"field":"SocArXiv","genre":"LLM / NLP","monthKey":"2026-11","publishedAt":"2026-11-18","source":"OSF Preprints","summaryHtml":"大規模言語モデル（LLM）は政治問題や政党の立場について有権者に情報を与え、どの党に投票すべきか助言することさえできる。しかし市販のLLMが投票助言アプリ（VAA）としてどれだけ機能するかはこれまで検討されてこなかった。本研究は、ドイツの調査回答者6,022名の政策選好と優先順位だけに基づき、Gemini 3 Flashがどの党への投票を助言するかを調べた。<br><br>概して、LLMの助言に従うことは有権者と政党の政策的一致（コングルエンス）を改善し、政治的関心や学歴が低い有権者ほど改善効果が大きかった。一方で助言には懸念すべき偏りもみられた。LLMは標準的な近接モデルと比べ、AfDへの投票を約1.5倍の頻度で勧め、Die LinkeやBSWへの投票はほとんど勧めなかった。<br><br>LLMはVAAの振る舞いを近似できるものの、その助言には追跡が極めて困難な形の偏りが残ると著者らは結論づける。LLMを政治的意思決定の助言に用いる際に、利用者が意識すべき偏りの所在を示す実証研究である。出典：OSF Preprints","timestamp":1794960000000,"title":"Hi Gemini, Who Should I Vote For? The Benefits (and Problems) of Using LLMs As Voting Advice Applications","titleJa":"「ねえGemini、どの党に投票すべき？」――投票助言アプリとしてのLLMの利点と問題点","url":"https://osf.io/preprints/socarxiv/cf42a_v2/"},{"authors":["Michelle M. Hospital","María E. Contreras Pérez","Katherine R. Perez","Agustin M. Castellanos"],"categories":[],"field":"Frontiers in Psychology","genre":"Consciousness / Philosophy","monthKey":"2026-11","publishedAt":"2026-11-18","source":"Frontiers in Psychology","summaryHtml":"マインドフルネス・プログラム（MBP）は、参加者が実践の体験を探る対話「問いかけ（inquiry）」を通じて変化を生むとされるが、その言語は体系的に分類されてこなかった。既存の尺度は自己報告スキルを回顧的に測るもので、セッション中の発話を対象としていなかった。本論文は参加者の問いかけ言語の分類枠組みを提案する。<br><br>著者らは、動機づけ面接の変化トーク分類法（DARN-CAT）の構造論理、クレーンの問いかけの3層モデル、脱中心化やメタ認知的気づきなどのMBPメカニズム文献を統合し、「問いかけ気づきトーク（IAT）枠組み」を導いた。枠組みは参加者の発話を深さ（準備的／動員的）と水準（近位／遠位）の2次元で整理し、「気づき」から「実行」まで8カテゴリーを示し、非判断を横断的な態度修飾子として扱う。<br><br>動員的かつ遠位の発話は、単一の実践への反応ではなく体験との関係の変化を表す可能性があるため特に重要だと仮説が立てられた。枠組みの信頼性・妥当性の実証は今後の課題だが、問いかけ言語を観察・符号化可能にすることで、問いかけが参加者の学びや統合にどう寄与するかを体系的に検討する基盤ができたとされる。出典：Frontiers in Psychology","timestamp":1794960000000,"title":"Toward a framework for classifying participant language in mindfulness-based inquiry","titleJa":"マインドフルネス・プログラムの「問いかけ」の言語を分類する枠組みに向けて","url":"https://www.frontiersin.org/articles/10.3389/fpsyg.2026.1987639"},{"authors":["Ke Sun","Kevin Yuchen Ma","Yike Zhang","Yanzhe Chen","Mike Zheng Shou"],"categories":[],"field":"cs.RO","genre":"Agents / Robotics","monthKey":"2026-11","publishedAt":"2026-11-18T00:00:00Z","source":"Hugging Face Papers","summaryHtml":"フロンティアのマルチモーダルモデルは画像からゼロショットでロボットを制御できるようになったが、多くの操作課題は画像には映らない接触力に依存する。API経由の凍結モデルに力覚を使わせるには2つの課題がある。接触はモデルの判断より速く変化するため、力のループはモデルの下で閉じる必要がある。また凍結モデルは生の力の時系列を解釈できないため、力が推論できる形で返されなければならない。<br><br>本研究のForceHarnessは、実演もファインチューニングもなしに凍結モデルに力を使わせるハーネスである。手首センサーや関節トルクから手先の力を較正したうえで、自己終了型の力プリミティブが力の制御を自律的に行い、接触イベントで戻る。物理翻訳層が力の軌跡を不確実性付きの物理量へ変換し、ツール結果としてモデルに返す。評価用に隠れた物理変数を持つ7課題のMuJoCoベンチマークHiddenPhysも構築した。<br><br>手首力センサーのない実機アームで、GPT-6 Astraのゼロショット成功率は3.3%から90.0%へ上がった。シミュレーションでは公開ベンチマークForceBenchで17.5ポイント、HiddenPhysで34.3ポイント改善し、実演で訓練した力覚ポリシーを両ベンチマークで上回り、HiddenPhysでは手書きの専門コントローラーに並んだ。小さいモデルほど生の力値より物理量を与えた方が良い判断をすることも示された。出典：Hugging Face Papers","timestamp":1794960000000,"title":"ForceHarness: Turning Force into Action and Physics for Frozen Frontier Models","titleJa":"フォースハーネス：凍結したフロンティアモデルに力覚を使わせる","url":"https://arxiv.org/abs/2611.21099"},{"authors":["Nicolas Chapados","Jean-François Gagné","Nouha Dziri"],"categories":["cs.AI"],"field":"cs.AI","genre":"Agents / Robotics","monthKey":"2026-11","publishedAt":"2026-11-18T00:00:00Z","source":"arXiv","summaryHtml":"コーディングエージェントは今や長時間の自律実行でコードベース全体を書くようになったが、その進行は主にテストの通過で導かれている。しかしテスト通過だけでは、複雑さの蓄積やテストで覆われていない箇所は見えず、エージェントがコードを拡張するなかで弱点が残り続ける。本研究は、推論時に安価なコードメトリクスをエージェントの文脈へ注入する「メトリクス・イン・ザ・ループ」を提案する。<br><br>コードを変更するたびに、循環的複雑度が上限を超えた関数や、テストにカバーされていない変更行を短いフィードバックで知らせ、エージェントにリファクタリングやテスト強化の機会を与える。3つの長期コーディングベンチマークと4つの強力なモデルによる広範な実験とアブレーションで、複雑度フィードバックは保持されたコードの正しさを損なうことなく、複雑さの集中を測る「erosion」を有意に低減した。<br><br>これは、弱点が今後築かれる基盤になる前に、タイムリーで実行可能な測定によってエージェントの軌道を修正する「再誘導」の実践形だと著者らは位置づける。エージェントが数百万行規模のコードベースへ広がるなか、こうした介入は開発の有効性と長期的な保守性を保つうえで重要になるとしている。出典：arXiv","timestamp":1794960000000,"title":"Metrics-in-the-Loop: Complexity Feedback Reshapes Agent-Written Code","titleJa":"メトリクス・イン・ザ・ループ――複雑さのフィードバックがエージェントの書くコードを変える","url":"https://arxiv.org/abs/2611.23817"},{"authors":["Jinbae Seo","Jungin Park","Hyunsung Jang","Namkoo Ha","Jiyoung Lee","Kwanghoon Sohn"],"categories":["cs.AI","cs.LG"],"field":"cs.LG","genre":"Agents / Robotics","monthKey":"2026-11","publishedAt":"2026-11-18T00:00:00Z","source":"arXiv","summaryHtml":"マルチモーダルエージェントは切り抜き・検索・コード実行といった汎用ツールに頼ることが多く、専門の視覚モデルは道具空間の外に置かれている。しかし、すでに訓練済みのエージェントへ新しい専門ツールを組み込むのは容易ではない。新しいツールを効率よく学びつつ、既存のツールを使う能力を保たなければならないからだ。本研究は、アダプタ水準のコストでツールを追加する継続的ツール空間拡張学習「COTEX」を提案する。<br><br>COTEXは、ツール呼び出しを起動して多ターンの推論軌跡を開く方向と、どのツールを選ぶかを決める方向という2組のパラメータ方向を特定する。新しいツールのアダプタは、直交制約によって既存のツール選択に影響しない呼び出し方向に制限される。さらに、専門モデルの既存の課題別注釈を検証済みのツール使用軌跡へ変換する手順も導入した。<br><br>2つの代表的なエージェントと3つの専門ツールでの実験では、10の視覚言語ベンチマークで性能が向上し、既存ツールの低下は最大で0.3ポイントにとどまった。専門モデルをエージェントの道具として少しずつ増やす道筋を示す研究である。出典：arXiv","timestamp":1794960000000,"title":"Continual Tool-Space Extension Learning for Multimodal Agents","titleJa":"COTEX――マルチモーダルエージェントの道具空間を継続的に拡張する学習法","url":"https://arxiv.org/abs/2611.23810"},{"authors":["Zhizhuo Kou","Sizai Hou","Jian Yang","Ge Sun","Junyu Luo","Wenkai Zhang","Sirui Han","Yike Guo"],"categories":["cs.CV"],"field":"cs.CV","genre":"Ethics / Safety","monthKey":"2026-11","publishedAt":"2026-11-18T00:00:00Z","source":"Hugging Face Papers","summaryHtml":"オープンウェイトのGUIエージェントをダウンロードして使う組織が増えるなか、バックドア付きのエージェントは清浄データの受け入れ試験を通過し、画面上の視覚トリガーが現れたときだけ誤作動するため、未検証のチェックポイントがサプライチェーンのリスクになる。既存の検出法は画像分類器やCLIP型エンコーダを対象としており、GUIエージェントのステップ単位でのバックドア検出は手つかずだった。<br><br>清浄なステップでは指示が行動を決めるが、参照されていない画面領域がステップを乗っ取ると、指示は決定状態への制御を失うか、その領域が決定を左右する。著者らはこの特徴を「意図・証拠の支配の逆転」と名づけ、トリガーの知識や攻撃データを必要とせず、各ステップで推論時に検出するIDEAを提案した。指示を書き換えて決定状態がどれだけ動くか（ICP）と、候補領域を除去してどれだけ動くか（RCA）を測り、ゲート付き適合スコアで判定する。<br><br>Qwen2.5-VL-3Bを用い5種の攻撃に対する実験では、誤検出率を制御しつつバックドア起動を一貫して検出し、既存の最先端手法を上回った。警報のたびにトリガー領域を特定でき、推論の追加コストも控えめだった。GUIエージェントの安全性監査に向けた手法である。出典：Hugging Face Papers","timestamp":1794960000000,"title":"IDEA: Intent-Dominance Evidence Audit for Inference-Time Backdoor Detection in GUI Agents","titleJa":"IDEA――GUIエージェントのバックドア起動を推論時に検出する監査法","url":"https://arxiv.org/abs/2611.24102"},{"authors":["Sayumi Muthukumarana","Roshan Godaliyadda","Parakrama Ekanayake","Roshan Ragel"],"categories":["cs.CL","cs.AI"],"field":"cs.CL","genre":"Ethics / Safety","monthKey":"2026-11","publishedAt":"2026-11-18T00:00:00Z","source":"arXiv","summaryHtml":"大規模言語モデルは子ども向け物語の作成に広く使われるようになった。寝物語は子どもの社会役割に対する見方を形作るため、LLMが受け手の性別に応じて物語の描き方を変えるかどうかが懸念される。本研究は、娘向け・息子向けの対応プロンプトと5世代の生成設計を用い、16のLLM・35の国設定・12の語り手役割から得た6万2873編の物語を分析した。語彙率の対比やステレオタイプの整合、語り手と受け手の相互作用、人間評価、表現レベルの介入を組み合わせた多層の評価枠組みを導入している。<br><br>結果として、物語の枠組みには体系的な違いが現れた。息子向けの物語は主体性が高く、共同性が低い傾向があった。語り手の性別による調整は限定的だったが、社交性が高い場合には相互作用がより顕著になった。人間評価もこの傾向と一致し、隠れ状態の分析では受け手の性別情報が復号できることも示された。<br><br>著者らは、LLMが生成する子ども向け物語には持続的だが文脈に依存する表象の偏りがあり、短文ベンチマークを超えた物語固有のバイアス評価が必要だと結論づけている。子ども向け生成物の公平性を問う研究である。出典：arXiv","timestamp":1794960000000,"title":"Once Upon a Bias: Gender Stereotyping in LLM-Generated Children's Stories","titleJa":"昔々、偏見――LLMが生成する子ども向け物語の性別ステレオタイプ","url":"https://arxiv.org/abs/2611.24156"},{"authors":["Muhammad Rizky Wellyanto","Hajara-Yasmin Isa","Kexin Xue","Vishal Ravichandran","Wenpeng Lu","Jerry O. Talton","Ranjitha Kumar"],"categories":["cs.HC","cs.AI","cs.CL"],"field":"cs.HC","genre":"Consciousness / Philosophy","monthKey":"2026-11","publishedAt":"2026-11-18T00:00:00Z","source":"arXiv","summaryHtml":"大規模言語モデルがチューリングの模倣ゲームをほぼ通過する時代に、研究チームはより難しい課題として「個人模倣ゲーム」を提案した。汎用的な人間ではなく、特定の個人を会話で再現できるかを問うものである。30人の参加者による実験で人間のベースラインを確立し、尋問者が頼るアイデンティティの手がかりとして文体、性格特性、伝記的事実を特定した。<br><br>実証のため、著者の1人の10年分の個人的なデジタル通信からなる自己民族誌データセットを用い、その著者になりきるLLMシステムを構築した。20人による欺瞞実験では、尋問者は10ラウンド中7回で著者の友人よりシステムを選び、20回中13回でシステムより著者本人を選んだ。いずれの割合もこのサンプルサイズでは偶然と区別できない水準だった。<br><br>著者らは設計上の改善点、個人AIエージェントへの応用、アイデンティティとプライバシーへの示唆を検討している。特定個人の再現が技術的に射程に入りつつあるなかで、本人性の判定基準そのものを問い直す研究であり、誰を「その人」と認めるのかという問いは今後の個人AIの設計と規制の双方に関わる。出典：arXiv","timestamp":1794960000000,"title":"Who are you? The Personal Imitation Game","titleJa":"あなたは誰か――個人模倣ゲーム","url":"https://arxiv.org/abs/2611.24888"},{"authors":["Priyanka Sinha","Sugam Pandey"],"categories":["cs.AI","cs.CE","cs.HC","cs.LG"],"field":"cs.AI","genre":"Consciousness / Philosophy","monthKey":"2026-11","publishedAt":"2026-11-18T00:00:00Z","source":"arXiv","summaryHtml":"能力の高いモデルと人間のレビュアーが同じ判断に協力するとき、なお人間が価値を加えるのはどのような場合か。研究チームはこれを単一の認知特性、すなわちメタ認知的キャリブレーション――レビュアーの行動上の確信と判断の実際の正しさの一致度――の問題として定式化し、「レビュアー価値の特性理論」を展開した。<br><br>理論は5つの主張からなる。価値は活動量や速度、同意率、経験年数ではなくキャリブレーションが決めること。キャリブレーションは行動テレメトリに痕跡を残すこと。その痕跡だけでは診断にならないこと。人間のキャリブレーションとモデルの自己知識は同じ構成概念であり、項目ごとに優れた側に委ねるべきこと。そして個人のキャリブレーションは単一判断の水準を超えて初めて因果的に同定できること。<br><br>AI支援会計システムの6か月の運用データ（541,621件のレビューイベント、483人のレビュアー）による検証では、行動だけの専門性プロファイルは真実を逆転させ、過信する集団（訂正生存率5.2%）を真の専門家（99.2%）より高く評価した。レビュアーの質は経験年数で変わらず、この特性は現場で学ばれるものではないことも示された。出典：arXiv","timestamp":1794960000000,"title":"Knowing What You Know: A Trait Theory of Reviewer Value in Human-AI Cognitive Systems","titleJa":"自分が何を知っているかを知る――人間とAIの認知システムにおけるレビュアー価値の特性理論","url":"https://arxiv.org/abs/2611.24932"},{"authors":["Jiahang Lin","Jiahao Chen","Yiding Wang","Shichun Liu","Chengjun Pan","Shihan Dou","Honglin Guo","Yuyang Hu","Changhao Jiang","Zhenhua Han","Hang Yan","Qi Zhang","Tao Gui","Xuanjing Huang"],"categories":["cs.SE","cs.AI"],"field":"cs.SE","genre":"Agents / Robotics","monthKey":"2026-11","publishedAt":"2026-11-18T00:00:00Z","source":"arXiv","summaryHtml":"現実のハーネス開発は明示的・暗黙的なユーザー要求に導かれて進むが、既存のハーネス進化手法は暗黙の要求や対話の必要性を見落とし、単一の進化エージェントによる修正とベンチマーク得点による選択に頼りがちだった。その結果、狭いパッチが生まれ、ベンチマーク特化の局所最適に陥りやすい。研究チームは要求中心のループ「AHE-Beta」を提案した。<br><br>ループは3段階からなる。シミュレーションされたユーザーが複数ターンの作業の中で要求を課題として提起するユーザー主導評価、要求をタスク特化のパッチではなく汎用的な変更として実装するチーム型修正、検証済みの要求を解決しレビューに通った変更だけを統合する要求主導の選択である。<br><br>保留タスクでの評価では、pass@1が21.9%から33.3%へ上昇し、トークン使用量はベースハーネスより40.8%削減された。Claude CodeやMeta-Harness、従来のAHEも上回り、盲検の人間A/Bテストでは有効な48組中31組で実ユーザーがAHE-Betaを好み、5次元すべてで高く評価した。出典：arXiv","timestamp":1794960000000,"title":"Agentic Harness Engineering Beta: Requirement-Centered Evolution of Agent Harnesses","titleJa":"エージェンティック・ハーネス・エンジニアリングβ――要求中心のエージェントハーネス進化","url":"https://arxiv.org/abs/2611.24924"},{"authors":["Sarah H. Cen","Lindsey A. Gailmard","Joohan Kim","Rishi Bommasani","Daniel E. Ho","Percy Liang"],"categories":["cs.CY","cs.AI"],"field":"cs.CY","genre":"Ethics / Safety","monthKey":"2026-11","publishedAt":"2026-11-18T00:00:00Z","source":"arXiv","summaryHtml":"AIシステムはモデル、データ、計算資源、資本、人材などを提供する多くの組織の上に築かれる。AIスタックの層構造は比較的よく理解されているが、層をまたぐアクターと構成要素の関係はほとんど文書化されてこなかった。本研究はAIの開発と展開を担う組織の複雑なネットワーク、すなわち「組織的AIサプライチェーン」に焦点を当てた。<br><br>著者らは集中、権力、チョークポイント、連鎖的障害、責任の分散、リスクといった懸念を動機として示したうえで、サプライチェーンを地図化するパイプラインを記述した。その成果は、日付・説明・種別・タグなどを注釈した、AIエコシステムのアクターと関係の大規模な多層データセットである。<br><br>このデータにより、モデル・データ・チップ・インフラ・資本・人材が組織間をどう流れるかを体系的に把握でき、最も中心的なアクターの特定、ネットワーク集中度の分析、コミュニティとチョークポイントの同定といった例示的な分析が可能になった。公開文書の欠落によりデータセットは必然的に不完全であることも著者らは認めている。出典：arXiv","timestamp":1794960000000,"title":"Mapping the AI Supply Chain: Dependencies, Vulnerabilities, and Market Concentration in the AI Ecosystem","titleJa":"AIサプライチェーンの地図化――AIエコシステムにおける依存関係・脆弱性・市場集中","url":"https://arxiv.org/abs/2611.24927"},{"authors":["Xirui Jiang","Yuxi Chen","Rui Yang","Feng Luo","Pengcheng Wang","Bingxuan Li","Zihao Zhao","Yushan Li","Han Wang","Manling Li","Yang Zhang","Shiyu Chang","Tong Zhang","Huan Zhang"],"categories":["cs.CV"],"field":"cs.CV","genre":"Agents / Robotics","monthKey":"2026-11","publishedAt":"2026-11-18T00:00:00Z","source":"Hugging Face Papers","summaryHtml":"ゲームは視覚エージェントの優れた実験場だが、知覚、長期計画、精密な制御が求められる一方で、人間のプレイ収集は高コストで、プレイ動画からは行動情報が欠落する。既存のデータセットは対象ゲームが限られ、明示的な課題や検証可能な成果もないことが多い。本研究は、ゲーム環境とプレイヤーを共に進化させ、多様で検証可能な遊戯経験を大規模に集めるGame2Playerを提案する。<br><br>Game2Playerのループでは、Builderエージェントが既存のウェブゲームを改変して内部状態を露出させ、状態ベースの進捗指標と成功判定を持つ課題を定義する。コーディングプレイヤーとVLMプレイヤーが課題に挑み、問題をBuilderへ報告して修復するため、プレイ自体が環境の検証と訓練データの収集を兼ねる。こうして568の検証済みウェブゲームと3,436の課題、1.57万の軌跡（307時間のプレイ）を収集し、50ゲームをベンチマークPlayerBenchとして分離した。<br><br>収集した経験を訓練データとして評価するため、進捗に寄与するステップを重くする進捗重み付きSFTでVLMエージェントを訓練した。Game2Player-9BはPlayerBenchの進捗率を14.3%から31.2%へ、外部ベンチマークGameWorldでは30.0%から53.1%へ高めた。既存のゲーム世界を構築・検証・学習することで、視覚エージェントの経験を拡張する道筋を示す。出典： Hugging Face Papers","timestamp":1794960000000,"title":"Game2Player: Scaling Gameplay Experience for Visual Agents through Environment-Player Co-Development","titleJa":"Game2Player――環境とプレイヤーの共進化で視覚エージェントの遊戯経験を大規模化する","url":"https://arxiv.org/abs/2611.24154"},{"authors":["Lilly Pijnenburg Muller","Tim Stevens"],"categories":[],"field":"Security Dialogue","genre":"Ethics / Safety","monthKey":"2026-11","publishedAt":"2026-11-18T00:00:00Z","source":"Crossref","summaryHtml":"現在のAIの発展は、有力な行為者の規範的な好みに沿った技術的未来を描く、強力な想像力（イマジナリー）に支えられている。本研究は、巨大テック企業の利益と技術解決主義に駆動されたAIの想像力が、英国におけるAIとサイバーセキュリティの想像力の形成にどう影響したかを、科学技術社会論の「社会技術的想像力」の概念とテクノポリティクスの視点から検討した。<br><br>英国政府の文書と、政府高官・非政府専門家・産業界の関係者37人へのインタビューをもとに、2022年から2024年にかけてAIとサイバーセキュリティの想像力がどのように生まれ、政府内の論争がどう交渉・解決され、英国の安全保障政治の中でどう安定化したかをたどった。企業の想像力と技術楽観主義に支配されたテクノポリティクスが、政府や社会が代替的な想像力を描き実行する能力を制約していることが示された。<br><br>AIの想像力は科学技術の目標と価値を推進する一方で、その形成と機能の力学を理解することが、安全保障の軌跡を理解するうえで重要であることを実証的に裏づけた。想像力が政策と実践にどう影響するかを追うことで、技術の未来をめぐる選択肢が誰の手にあるのかを問い直している。出典： Crossref","timestamp":1794960000000,"title":"Contesting sociotechnical imaginaries: the technopolitics of artificial intelligence/cybersecurity convergence","titleJa":"社会技術的想像力をめぐる争い――AIとサイバーセキュリティの融合のテクノポリティクス","url":"https://doi.org/10.1093/secdia/xhag013"},{"authors":["GuangYuan Ren"],"categories":[],"field":"Общество: философия, история, культура","genre":"Consciousness / Philosophy","monthKey":"2026-11","publishedAt":"2026-11-18T00:00:00Z","source":"Crossref","summaryHtml":"本論文は儒教・道教・仏教という中国思想の三大伝統における意識の概念を、「心（xin）」「性（xing）」「識（shi）」という鍵概念から検討する。西洋の実体論的・機能主義的な意識分析の限界を乗り越え、中国哲学の全体的・過程的な理解に立脚することが狙いである。各伝統の意識モデルを包括的に再構成・解釈し、西洋のパラダイムとの違いを明らかにして、意識のデジタル化という現象の批判的理解に役立てることを目的とする。<br><br>歴史哲学分析、比較哲学、概念分析、哲学人類学の手法を用い、各伝統における意識モデルの包括的な再構成と解釈を行い、西洋のパラダイムとの違いを明らかにした。中国の意識概念は非還元主義的な体系をなし、意識のデジタル化という現象を批判的に理解する道具になると確認された。<br><br>さらにデジタル時代の課題を分析する批判的ツールとして、また代替的な規範的理想の源泉としての啓発的価値が示されている。西洋の枠組みでは捉えにくい意識の側面に光を当て、デジタル時代における意識の捉え直しに寄与する。出典：Crossref","timestamp":1794960000000,"title":"The Concept of Consciousness in Traditional Chinese Philosophy: “Heart – Mind” (xim), “Nature” (xing), and “Cognition/Consciousness” (shi)","titleJa":"中国伝統哲学における意識の概念――「心」「性」「識」から読み解く","url":"https://doi.org/10.24158/fik.2026.10.15"},{"authors":["Hengguang Zhou","I-Hung Hsu","Li Chen","Priyanshi Shrivastava","Anastasios Angelopoulos","Wei-Lin Chiang","Ion Stoica","Cho-Jui Hsieh"],"categories":["cs.LG"],"field":"cs.LG","genre":"Agents / Robotics","monthKey":"2026-11","publishedAt":"2026-11-18T00:00:00Z","source":"arXiv","summaryHtml":"ユーザーシミュレーターは対話エージェントを大規模に評価する手段だが、その品質をどう測るかは未開拓だった。既存の評価枠組みが、模擬ユーザーの行動の意味ある失敗を確実に検出できるかは不明で、ベンチマークの高得点が何を意味するかも分からない。本研究は評価指標そのものをメタ評価する。<br><br>模擬リプレイを意図的に改変し、目標の変更、制約の省略、早期終了、壊れた成果物の受け入れなど10種の失敗を誘発して、指標がそれを罰するかを試した。先行3研究の手法は10件中5〜6件しか検出せず、統合スコアは壊れた成果物を受け入れる集団を無改変の対照より高く評価してしまった。そこで著者らは、エージェント評価におけるシミュレーターの有用性と、実ユーザーへの忠実度の2尺度（集団レベルとトレースレベル）を組み合わせた新評価スイートを提案した。<br><br>新スイートは同じ判定基準で10件すべてを検出した。348人の実ユーザーが23言語で351のマルチターンセッションをこなしたデータで6種のシミュレーターを評価した結果、集団レベルの尺度だけでは、誤った目標の追求や制約の無視、性格からの逸脱を見逃すことが示された。出典：arXiv","timestamp":1794960000000,"title":"On Evaluating User Simulators for Interactive Agents","titleJa":"対話エージェントのユーザーシミュレーターをどう評価するか","url":"https://arxiv.org/abs/2611.24892"},{"authors":["Randall Balestriero","Yann LeCun","Kerda Varaku"],"categories":["cs.LG","cs.AI","cs.CV","cs.RO","stat.ML"],"field":"cs.LG","genre":"LLM / NLP","monthKey":"2026-11","publishedAt":"2026-11-18","source":"arXiv","summaryHtml":"ワールドモデルは観測しきれない世界で動作する。隠れた外乱（船を押す潮流など）が行動の結果を変えたとき、「別の行動をとっていたらどうなっていたか」という反実仮想の問いが生まれる。その答えは悪い判断と運の悪さを区別する。本論文は、事実の遷移だけから学習したワールドモデルは、データや容量をどれだけ増やしても、この問いに自力では答えられないことを証明する。<br><br>多くの物理系では、観測された結果と動力学の単純な性質があれば十分である。「自然は跳躍しない」という原則のもと、行動と外乱が別々の力として働くとき、その相互作用は時間の二次の効果にとどまるため、反実仮想の結果は一次近似で、観測結果に、代替行動と事実行動の下でのワールドモデルの予測の差を加えたものになる。これにより、反実仮想データも追加パラメータも再学習も不要な反実仮想ワールドモデルが得られる。遷移時間hに対し反実仮想誤差のO(h²) boundと、対応するミニマックス下限も示された。<br><br>JEPAワールドモデルを用いたピクセルからの検証では、四つのレンダリング済みシミュレータで反実仮想R²が38〜46%から86〜96%に改善し、水中ビークルでは90〜94%に達した。DINOv3、SigLIP 2、CLIP、EVA-02といった他の凍結エンコーダでも81〜95%が得られた。後知恵プランニングでは、目標に到達できたはずの行動を35〜69%の事象で見つけ、シミュレータを知るオラクルプランナーの14〜23%を上回った。出典：arXiv","timestamp":1794960000000,"title":"Counterfactual World Models: JEPAs That Reason About \"What If\"","titleJa":"反実仮想ワールドモデル――「もしも」を推論するJEPA","url":"https://arxiv.org/abs/2611.24778"},{"authors":["Eugene Agichtein","Charles L. A. Clarke","Kaustubh Dhole","William Stern"],"categories":["cs.IR","cs.CL"],"field":"cs.IR","genre":"LLM / NLP","monthKey":"2026-11","publishedAt":"2026-11-18","source":"arXiv","summaryHtml":"LLMジャッジは大規模な関連性判定の作成に広く使われるようになったが、判定ごとに最先端モデルへの高価な呼び出しが必要で、解釈が難しく再現性にも欠ける。本論文は、LLMがトピックごとに可読性の高いプログラムを書き、文書ごとの判定を置き換えられるかを問う。提案手法ExecJudgesは、最先端LLMで評価ガイドラインを実行可能プログラムに変換し、語彙照合や標準NLPライブラリ、プール統計だけに依存させる。<br><br>人間ラベルの少数の例を用いるExecJudges-L変種も用意された。七つのTRECコレクションで、訓練されたNIST評価者、最先端LLMジャッジ、近年のトピック別分類器と比較して評価した。結果は、ExecJudgesがTREC DL 2019〜2021でClaude Sonnet 5.5のLLMジャッジと同水準でNIST評価者と一致し、ExecJudges-Lは全七コレクションで同じラベル数のトピック別分類器を上回った。<br><br>ラベルは公式TREC DLランをケンドールのタウ0.87〜0.94で順位づけし、プログラム作成コストはトピックあたり0.17〜0.49ドルの一度きりで、採点に追加コストはかからない。ExecJudgesは、深い結果プールのラベリングやシステム評価・順位改善のための、再現可能で検証可能、効率的かつ費用対効果の高いLLMジャッジの代替手段になる。出典：arXiv","timestamp":1794960000000,"title":"Can Programs Replace LLM Judges? Executable Program Judges for Scalable and Efficient Relevance Labeling","titleJa":"プログラムはLLMジャッジに取って代われるか――実行可能なプログラム判定器による効率的な関連性ラベリング","url":"https://arxiv.org/abs/2611.24849"},{"authors":["Xiaoqian Shen","Yunyang Xiong","Changsheng Zhao","Saksham Suri","Chong Zhou","Zechun Liu"],"categories":["cs.CV"],"field":"cs.CV","genre":"Vision / Multimodal","monthKey":"2026-11","publishedAt":"2026-11-18","source":"Hugging Face Papers","summaryHtml":"視覚言語モデルは高度なマルチモーダル課題の解決にテキスト推論への依存を強めているが、このパラダイムには二つの根本的な限界がある。テキスト推論だけでは、課題に関連する視覚的証拠の解釈が答えを左右する視覚中心の設問で知覚能力が制限される。推論の様式と深さの設問依存のばらつきを無視して一律にテキスト推論を適用すると、論理的推論がほとんど不要な場合にも冗長で不必要な痕跡を生む。<br><br>本論文は、視覚的想像力をテキスト思考を補完する推論様式として導入する適応的視覚テキスト推論（AVTR）を提案する。生成的な視覚的省察を通じて視覚観察に立ち返り、顕著な証拠を抽出できる。さらに、推論様式の選択を学習されるルーティング問題として定式化し、単一のポリシーが入力の知覚的・推論的要求に応じて、視覚的省察とテキスト推論の相補的な強みを適応的に活用できるようにする。<br><br>16のベンチマークで、AVTRはQwen3.5ベースラインの平均スコアを4.5ポイント改善し、推論レイテンシを33%削減した。より小さいバックボーンにも効果的に拡張でき、評価した2B規模のベースラインを上回った。出典：Hugging Face Papers","timestamp":1794960000000,"title":"AVTR: Adaptive Multimodal Reasoning with Visual Imagination","titleJa":"AVTR――視覚的想像力を備えた適応的マルチモーダル推論","url":"https://arxiv.org/abs/2611.24161"},{"authors":"Zhenqing Ling, Qirui Jiao, Daoyuan Chen, Cheng Chen, Xinji Mai, Haowen Gao, Zhuo Zhang, Xuchen Pan, Mengsu Ding, Jiaji Deng, Yuexiang Xie, Xiaoming Qin, Weirui Kuang, Zhaoyang Liu, Yaliang Li, Bolin Ding, Jingren Zhou","categories":["cs.AI"],"field":"cs.AI","genre":"Agents / Robotics","monthKey":"2026-11","publishedAt":"2026-11-18T00:00:00Z","source":"Hugging Face Papers","summaryHtml":"Piccoloは、テキストや画像の判断、エージェントの制御、データ処理、対話ゲームなど幅広い意思決定を担うマルチモーダルモデル群（0.8B〜27B）である。研究エージェントがモデルの振る舞いを分析し、学習データを構築・実験し、その結果を次の提案へ反映させる「エージェント型データエンジニアリング」と再帰的自己改善（RSI）により、モデル能力と学習データを共進化させる。意味的スライスと共有の研究メモリが、モデル群全体の開発をつなぐ。<br><br>Piccolo-27BはDecision Index Vision Fullで75.59点を記録し、9B・4Bモデルも各サイズ区分の非公開ベンチマークで首位となった。大規模なRSIの探索からは、直観に反する3つの知見が得られた。第一に、バックボーンと学習レシピの共適応がモデルの新しさ自体より重要で、古いバックボーンでも同一レシピ下では新しい世代を上回ることがある。第二に、狙いを絞ったデータ選別により4B〜9Bモデルが専門ワークフローで27B級に匹敵する。第三に、損失の継続的な低下が離散的な判断精度から乖離し、むしろ悪化させる場合がある。<br><br>重みとツールはData-JuicerおよびAgentScopeのエコシステムとともに公開され、最先端の意思決定モデルを構築し、データ駆動の自己改善を拡張するための実践的な青写真として提示されている。出典：Hugging Face Papers","timestamp":1794960000000,"title":"Piccolo: Co-Evolving Decision Models and Data through Recursive Self-Improvement","titleJa":"Piccolo――モデルとデータを共進化させる再帰的自己改善の意思決定モデル","url":"https://arxiv.org/abs/2611.24651"},{"authors":"Phuong Tuan Dat, Qi Li, Xinchao Wang","categories":["cs.RO"],"field":"cs.RO","genre":"Agents / Robotics","monthKey":"2026-11","publishedAt":"2026-11-18T00:00:00Z","source":"Hugging Face Papers","summaryHtml":"ワールドアクションモデル（WAM）は、行動生成と将来の視覚的変化の予測を結びつけることで、ロボット操作における汎化とデータ効率を示してきた。しかし信頼できるタスク遂行への変換は、既存の事後学習では難しい。オフラインの教師あり微調整は専門家の軌跡で密な指導を与えるが、行動エキスパートは自身のサンプラーが生む中間状態で訓練されたことがない。一方、方策上の強化学習は疎なタスク報酬のもとで探索と信用割当が困難である。<br><br>本研究は、実演の将来映像という「後知恵」を特権情報として用い、行動エキスパートを自身のサンプリング軌跡上で指導する初のオン・ポリシー自己蒸留フレームワークHINT-WAMを提案する。各実演観測に対し、学生モデルが自身のノイズ除去軌跡で行動を生成し、その軌跡上の状態では後知恵を条件とする同一モデルが教師となって条件付き行動分布という密な学習目標を与える。学生は配備時と同じ入力だけを見て学び、環境報酬やシミュレータとの相互作用を必要としない。<br><br>この指導をフローマッチング型の行動エキスパートへ移すため、教師の速度場を回帰するのではなく、エネルギー・スコアによる分布レベルの目的で教師の行動分布を学生の標本から蒸留する。ロボット操作の信頼性向上に向け、報酬設計に頼らない自己蒸留の道筋を示した。出典：Hugging Face Papers","timestamp":1794960000000,"title":"HINT-WAM: Hindsight-Informed Training for World Action Models","titleJa":"HINT-WAM――後知恵を教師にするワールドアクションモデルの自己蒸留","url":"https://arxiv.org/abs/2611.24789"},{"authors":"Zeguan Xiao, Zhuocheng Liang, Yun Chen, Yong Wang, Guanhua Chen, Pinyan Lu","categories":["cs.LG"],"field":"cs.LG","genre":"LLM / NLP","monthKey":"2026-11","publishedAt":"2026-11-18T00:00:00Z","source":"Hugging Face Papers","summaryHtml":"大規模言語モデルを適応させる際の中心的な課題は能力の保持である。狙った能力を獲得できても、汎用能力が劣化してしまうことが多い。本研究は、保持の制約をモデル更新のパラメータ化そのものに組み込む枠組みCurvDeltaを提案する。適応前のモデル周辺における保持制約の局所幾何を解析し、パラメータ更新が保持損失をほぼ不変に保つ「低曲率空間」を構築する。Kronecker因子分解による近似曲率（K-FAC）と因子分解射影により、大規模言語モデルでも実用的に構成できる。同じ保持幾何にもとづく低ランク版CurvLoRAも導入された。<br><br>この手法は、能力の学習と選択的忘却という、保持制約つき適応の課題に適用できる。数学推論とコード生成では、ベースラインと競合する下流性能を達成しつつ汎用能力をより良く保持し、獲得と保持のトレードオフを改善した。知識の忘却では、TOFUとMUSEにおける主要結果が、標的の忘却と知識保持のバランスでベースラインを上回り、保持性能はゼロからの再学習に近い水準に達した。<br><br>学習と忘却を同じ幾何で扱える点が特徴で、モデルの外科的な更新――必要な部分だけを変え、他は守る――を可能にする適応法として提示されている。出典：Hugging Face Papers","timestamp":1794960000000,"title":"CurvDelta: Low-Curvature Delta Modeling For Surgical Learning and Unlearning","titleJa":"CurvDelta――低曲率空間で能力を守りながら学び・忘れるLLM適応法","url":"https://arxiv.org/abs/2611.24654"},{"authors":"Yeongtak Oh, Donghyeok Lee, Joonhee Oh, Jaewon Jeong, Sungroh Yoon","categories":["cs.CV"],"field":"cs.CV","genre":"Vision / Multimodal","monthKey":"2026-11","publishedAt":"2026-11-18T00:00:00Z","source":"Hugging Face Papers","summaryHtml":"個人向け視覚言語アシスタントは、視覚観測と個人の記憶を使って利用者に合わせた助言を行う。観測した場面に物理的な危険がある場合、アレルギーや既往症、移動の制約といった個人の状況が、適切な助けの内容を変える。適切に応答するには、目に見える危険を認識し、該当する個人情報を適用する必要がある。既存モデルは片方の要件を満たしながら他方で失敗することが多く、安全性だけ・個人化だけの訓練では両方を同時に満たす成功に届かない。<br><br>本研究は、この組み合わせを多様な危険と個人記憶の条件で評価する診断ベンチマークPReMind-Benchを導入する。記憶アクセス、接地、棄却、危険対応を別々に測り、相互依存する事例での同時成功も評価する。さらに、記憶を必要に応じて取り出す場合と常に取り出す場合を組み合わせた二段階の強化学習フレームワークPReMindを提案し、接地された記憶利用と危険対応を同時に訓練する。<br><br>4Bモデルでは、相互依存セットでの同時成功率がベースの12.9%から28.6%へ上がり、危険への適切さと正しい棄却も改善した。効果は強制呼び出し評価や第二のLLM判定、未見の危険グループでも持続し、個人アシスタントには視覚的証拠と個人の文脈を結びつけて評価・訓練する必要性が示された。出典：Hugging Face Papers","timestamp":1794960000000,"title":"PReMind: When Personal Memory Meets Visual Hazards","titleJa":"PReMind――個人の記憶と視覚的危険を結びつけるアシスタント","url":"https://arxiv.org/abs/2611.23808"},{"authors":["Dong Wang","Jinting Li","Meng Xiao","Xiaokai Yue","Luwen Zhu"],"categories":[],"field":"Frontiers in Neuroscience","genre":"Neuroscience","monthKey":"2026-11","publishedAt":"2026-11-18T00:00:00Z","source":"Frontiers in Neuroscience","summaryHtml":"外傷性脳損傷（TBI）は海馬の機能を損ない、電気鍼には神経保護効果があるとされるが、電気鍼が海馬のRNA融合転写産物にどう影響するかは分かっていなかった。本研究はTBIモデルのラットを対象に、電気鍼による海馬のRNA融合転写産物の変化を探索的に調べた。<br><br>ラットを偽手術群、TBI群、低・中・高頻度の電気鍼群に分け、モデル作成から7日後と14日後に海馬組織を採取し、RNAシーケンスとSTAR-Fusionで解析した。117件の記録と29の推定転写産物が同定され、電気鍼群ではTBI群と偽手術群に共通する転写産物が少なかった。融合転写産物の様相は時期と頻度で変化し、7日後はカルシウムシグナル伝達やシナプス伝達、14日後は代謝経路に関連する濃縮がみられた。<br><br>電気鍼はTBIラットの海馬RNA融合転写産物を調節する可能性が示され、その変化は治療の時期と頻度に依存するようにみえる。著者らは予備的で仮説生成的な知見と位置づけており、電気鍼の効果を理解する新たなトランスクリプトームの視点を提供するものだ。出典：Frontiers in Neuroscience","timestamp":1794960000000,"title":"Exploratory transcriptome analysis of electroacupuncture-associated changes in hippocampal RNA fusion transcripts in traumatic brain injury rats","titleJa":"外傷性脳損傷ラットの海馬における電気鍼とRNA融合転写産物の変化――探索的トランスクリプトーム解析","url":"https://www.frontiersin.org/articles/10.3389/fnins.2026.1870369"},{"authors":["Mark Marosi","Peter Antal"],"categories":["cs.CL","cs.AI"],"field":"cs.CL","genre":"LLM / NLP","monthKey":"2026-11","publishedAt":"2026-11-18T00:00:00Z","source":"arXiv","summaryHtml":"言語モデルは訓練データから能力を獲得する。開発者は悪用されうる能力を学ばせないよう特定のデータを訓練から除外するが、どれだけ能力獲得を遅らせられるか、後から習得するのにどれだけのデータが必要かは分かっていなかった。本研究は、除外されたスキルがどのように遅れ、回復するかを検証した。<br><br>研究チームはチェス、オセロ、分子文字列、括弧言語、ウェブテキストのモデルで個々のスキルの訓練信号を除外した。除外されたスキルの遅れは小規模モデルから予測でき、チェックへの応答を明示的に訓練されなかったチェスのモデルも、訓練されたモデルとほぼ同等に合法手を評価した。除外データを後から与えると、初期状態から学ぶ場合のごく一部のデータ量でスキルを獲得し、その割合はモデルの進歩とともに減少した。<br><br>同じ難易度の対照ルールははるかにゆっくりと学習されたことから、これは単なる学習の速さではなく、他のデータでの一般的な進歩が除外されたデータを代替していることを示す。能力の出現をデータ除外だけで抑えることの限界を示す結果だ。出典：arXiv","timestamp":1794960000000,"title":"General progress substitutes for specific training data in language models","titleJa":"一般的な進歩が特定の訓練データを代替する――言語モデルの能力獲得","url":"https://arxiv.org/abs/2611.24844"},{"authors":["Zhiyu Liu","Xinyu Yang"],"categories":["cs.LG","cs.AI"],"field":"cs.LG","genre":"Ethics / Safety","monthKey":"2026-11","publishedAt":"2026-11-18T00:00:00Z","source":"arXiv","summaryHtml":"大規模言語モデル（LLM）は臨床予測モデルを説明し、欠陥を見つけ、新たな知識を引き出せると期待されている。本研究はその3つの約束を、答えを検証できる条件でテストした。国際脳卒中試験のデータを用い、ロジスティック回帰など4種類のモデルを2つの転帰について訓練し、24の複製に1つずつ欠陥を仕込んだ。<br><br>GPT-6 Astraがモデルの予測だけを返すツール経由で各モデルを盲検で3回ずつ監査した。代理モデルは監査対象モデルの対数オッズを平均R² 0.976で再現し、仕込んだ欠陥を72回中69回（96%）で発見した。一方で報告された問題の60%は事前に定めたチェックに失敗し、検証可能な報告の15%はモデル内に存在しなかった。<br><br>クリーンなモデルから読み取られた601の予期しない関係のうち、後にランダム化された患者で成り立ったのは11%にとどまった。クエリのみのアクセスでもLLMはブラックボックスモデルを忠実に記述し、ほぼすべての仕込み欠陥を見つけられるが、問題の報告はモデル上で、発見はデータ上で確認する必要があると結論づけている。出典：arXiv","timestamp":1794960000000,"title":"Auditing black-box clinical prediction models with a large language model through queries alone: a blinded test with planted flaws","titleJa":"クエリだけでブラックボックスの臨床予測モデルを監査する――大規模言語モデルによる盲検テスト","url":"https://arxiv.org/abs/2611.24877"},{"authors":["Tobias Braun","Marcus Rohrbach","Lorenzo Cavallaro"],"categories":["cs.CV","cs.CL","cs.LG"],"field":"cs.CV","genre":"Vision / Multimodal","monthKey":"2026-11","publishedAt":"2026-11-18T00:00:00Z","source":"arXiv","summaryHtml":"中間表現を可視化できれば、モデルの出力に至る推論の過程を点検できる。理解と生成を1つのアーキテクチャに統合した統合マルチモーダルモデルは、その機会を提供する。画像生成器はテキスト処理中に形成された表現にアクセスできるため、本研究はその結びつきを使い、選んだトークンの隠れ状態をデコーダの訓練なしに可視化するV-lensを提案する。<br><br>拡散ベース4モデルと自己回帰型2モデルで検証したところ、可視化された画像は、問いと答えを結ぶ中間の概念を明らかにし、それが明示的に言及されていない場合でも描き出された。統制実験では、可視化される内容は文脈やトークン位置、層の深さによって変化することが示された。さらに、V-lensを通じて選んだ隠れ状態に画像で教師を与えるレンズ・チューニングを導入したところ、BAGEL、SenseNova-U1、HunyuanImage-3.0において代名詞の指示対象の正しい可視化率は2〜11%から86〜94%に上昇した。<br><br>驚くべきことに、この視覚的な教師信号は、答えのトークンを直接教師しなくてもテキストの答えも改善した。統合モデルの内部で概念がどう表象され、推論にどう使われているかを調べる新たな手法となり、モデルの振る舞いの点検にもつながる。出典：arXiv","timestamp":1794960000000,"title":"The Elephant in the Question: Unified Models Picture the Concepts Behind Their Answers","titleJa":"問いの中のゾウ――統合モデルは答えの背後にある概念を描く","url":"https://arxiv.org/abs/2611.24793"},{"authors":["Ruiqi Liu","Jinming Li","Mo Wang","Yang Lu","Yanlan Kang"],"categories":["cs.AI"],"field":"cs.AI","genre":"Vision / Multimodal","monthKey":"2026-11","publishedAt":"2026-11-18T00:00:00Z","source":"arXiv","summaryHtml":"密な文書を読む視覚エージェントは、有限の観察予算を候補領域に配分しなければならない。しかし正答率は、エージェントがどこを見たか、残りの読み取りにどう適応したか、観察終了後にどう答えたかを混同してしまう。そこで本研究は、公開された証拠と領域の対応を固定したまま、残りの予算や宣言された課題パラメータだけを変化させる「予算対照反実仮想監査」という評価プロトコルを提案した。取得したすべての履歴は正確な継続価値で評価される。<br><br>この会計処理により、失われた期待正答率は段階的な取得損失と最終的な決定損失に分解される。計画の失敗と、固定された役割のヒューリスティクスによる失敗を切り分けられるのが要点である。評価は40の対照化された経路設定と5つのオープンウェイトモデルを用いて行われた。<br><br>この監査により、視覚エージェントの改善点が観察計画にあるのか最終判断にあるのかを特定でき、予算配分の設計に直接つなげられる。観察の無駄を減らし、判断の質を高める開発に役立つ。有限の観察予算のもとでエージェントを信頼できる形で評価する手法として意義がある。出典：arXiv","timestamp":1794960000000,"title":"Choosing What to Observe: Budget-Paired Counterfactual Audits for Credible Evaluation of Visual Agents","titleJa":"「何を観察するか」を選ぶ――視覚エージェントの信頼できる評価のための予算対照反実仮想監査","url":"https://arxiv.org/abs/2611.24867"},{"authors":["Benjamin Novotny","Doug Szeto","Chang Wang","Shicheng Chen","George Zhihua Yuan","Bob Kamma","Michael Ge","John Xin Zhou","Andrea Olgiati"],"categories":["cs.LG"],"field":"cs.LG","genre":"LLM / NLP","monthKey":"2026-11","publishedAt":"2026-11-18T00:00:00Z","source":"arXiv","summaryHtml":"LLM推論の振り分け率を固定すると、サービング艦隊の規模やリクエスト量が変わるにつれて陳腐化する。生成する出力の長さは受け付け時には分からず、共有プロバイダープールは容量を失うこともある。本研究は、プロバイダーの容量と内部GPUにまたがる非同期推論のための設計「Cap-and-Track」を提案した。Metaのトラフィックシェーパーが投稿とライブ動画理解向けに実装している。<br><br>動作の手がかりはバックエンドの受け付け上限を示す拒否信号だけである。Capは飽和したリソースでのフェイルファストな受け付け判定で、長時間の待機の前に拒否する。Trackディスパッチャは拒否だけを頼りに上限を探りながら上下させる。耐久性のある優先度キューが余剰作業を保持し、拒否されたリクエストも再試行対象として残す。出力長予測や艦隊全体のレート再調整は不要である。<br><br>同じトラフィックでの本番A/Bテストでは、キュー型・固定レートの前身と比べて分類器を43％少ないH100で運用できた一方、バックフィルがピークの際には低優先度作業の待ち時間は延びた。容量一定の実エンジン再生では、容量以上に調整された固定レートのグッドプットの1％以内で動作し、拒否率はその約4分の1だった。シェーパーは1日3億件超のオンラインリクエストと数百テラバイトのメディアを処理し、最も忙しい24時間のバックフィルでは11億件を処理した。出典：arXiv","timestamp":1794960000000,"title":"Cap-and-Track: Optimizing LLM Inference Request Dispatch Across Shifting Capacity","titleJa":"Cap-and-Track――変動する容量下でのLLM推論リクエスト振り分けの最適化","url":"https://arxiv.org/abs/2611.24891"},{"authors":["Samson Yu","Qiran Zou","Jing Yu Lim","Rushi Shah","Anirudh Goyal","Dianbo Liu"],"categories":["cs.CL"],"field":"cs.CL","genre":"LLM / NLP","monthKey":"2026-11","publishedAt":"2026-11-18T00:00:00Z","source":"arXiv","summaryHtml":"大規模言語モデルはもっともらしい研究アイデアを生成できるが、何が自動アイデア創出を効果的にし、生成された新規提案が先行研究からどう生まれるのかは明らかでなかった。本研究は、文献への根拠づけ、反復的な発展、明示的な概念操作を組み合わせたエージェント型枠組み「Creative AI Researcher（CAR）」を提案した。検索した文献から意味的知識グラフを構築し、アイデア創出エージェントにグラフ検索ツールと、双連想・類推・探索・精緻化という4つの操作を与える。<br><br>各操作の呼び出しは構造的な受け入れ条件で検証され、記録されるため、中間の変換過程と宣言された文献出典の追跡が残る。2つの言語モデルバックボーンで40のLiveIdeaBench研究テーマと2つの実行ベンチマークで評価した結果、CARは単発プロンプトやThe AI Scientistより方法論的新規性で有意に高く、実現可能性の評価も両バックボーンで高かった。共有の実験実行器のもとではFML-bench-LiteとBioXArenaで評価したAI手法の中で最も高い対比較勝率を示した。<br><br>ただし10条件のアブレーション研究では、方法論的新規性の点推定はCARを支持したものの、多重比較の補正を経て残る有意な差はなく、明示的な操作が自由形式の反復を超えて一貫した品質上の利点をもたらすことは示されなかった。CARの価値は、アイデアの品質判断と手続きの追跡可能性を分離し、操作の連鎖と文献出典を検証可能にすることにある。出典：arXiv","timestamp":1794960000000,"title":"Ground, Iterate, Trace: Decomposing AI Research Ideation","titleJa":"根拠づけ・反復・追跡――AI研究アイデア創出の分解","url":"https://arxiv.org/abs/2611.24887"},{"authors":["Beyazit Yalcinkaya","Ethan Pronovost","Maximilian Naumann","Marcell Vazquez-Chanlatte"],"categories":["cs.LG"],"field":"cs.LG","genre":"Agents / Robotics","monthKey":"2026-11","publishedAt":"2026-11-18T00:00:00Z","source":"arXiv","summaryHtml":"大規模なマルチエージェント自己対局は、シミュレーションで頑健な運転方策を効果的に訓練できる。しかし、安全性上重要な特定のエッジケースを生成するようモデルを制御することは依然として課題である。既存の目標条件付き自己対局は静的な地図上の位置目標に主に依存し、攻撃的なあおり運転や敵対的な割り込みといった複雑なエージェント間相互作用を確実に生み出せなかった。こうした相互作用は自動運転車の厳密なテストに不可欠である。<br><br>本研究は、エージェント相対的な動的目標を導入した拡張マルチエージェント自己対局枠組みを提案した。この拡張された目標表現で方策を条件づけることで、標的を定めた制御可能なシナリオ合成が可能になる。提案手法は、静的な目標のベースラインではシミュレーションできない対話的な運転行動の生成に成功した。<br><br>これにより、自動運転テストにおけるロングテールのシナリオ生成のための柔軟なツールが得られる。従来は再現が難しかった攻撃的・敵対的な場面を、目標を指定して狙って生成できる。安全性検証で求められる稀だが危険な相互作用を意図的に作り出せる点が意義である。出典：arXiv","timestamp":1794960000000,"title":"Learning to Interact in Multi-Agent Self-Play for Controllable Autonomous Driving Scenario Generation","titleJa":"マルチエージェント自己対局における相互作用の学習――制御可能な自動運転シナリオ生成に向けて","url":"https://arxiv.org/abs/2611.24876"},{"authors":["Giannis Daras","Marios Papachristou","Adam Klivans","Antonio Torralba","Constantinos Daskalakis"],"categories":["cs.LG","cs.AI","cs.CL"],"field":"cs.LG","genre":"LLM / NLP","monthKey":"2026-11","publishedAt":"2026-11-17T18:59:37Z","source":"arXiv","summaryHtml":"大規模言語モデルの事後学習では、事前学習に比べてはるかに小さいデータセットで教師あり微調整（SFT）を行うのが通例で、過学習と分布の裾野の破局的忘却を招きやすい。本論文は、凍結した事前学習モデルをノイズのある教師として活用し、微調整用のデータセットを補強する原理的な枠組み「Ambient SFT」を提案する。微調整後のモデルが出す条件付き分布を高温化したものが、事前学習モデルの高温化した分布と一致するよう求める。<br><br>温度ハイパーパラメータは事前学習モデルへの信頼度を制御する。高温化により分布の細部ではなく大まかな形を一致させる点が、ノイズのある教師からの学習を成立させる鍵だ。極限ではT→∞で通常のSFTに、T=1で知識蒸留に帰着する。手法はドメイン適応、指示チューニング、推論の各場面で標準的なSFTを上回り、平均で最大21%の相対的改善を示した。<br><br>データが乏しい事後学習でも、事前学習で得た知識を壊さずに引き継ぐ実践的な道筋を示すものだ。小規模データでの微調整における過学習対策として、温度という単一のつまみで制御できる点も実用的だ。出典：arXiv","timestamp":1794941977000,"title":"Ambient LLMs: Data-Efficient Supervised Fine-tuning via Temperature Matching","titleJa":"アンビエントLLM――温度マッチングによるデータ効率的な教師あり微調整","url":"https://arxiv.org/abs/2611.23229v1"},{"authors":["Rui Ning","Om Chabra","Hari Balakrishnan"],"categories":["cs.CV","cs.LG"],"field":"cs.CV","genre":"Vision / Multimodal","monthKey":"2026-11","publishedAt":"2026-11-17T18:59:27Z","source":"arXiv","summaryHtml":"視覚アクセシビリティ・エージェントやロボットでは、直近2分程度の映像について素早く問いに答える必要がある。注意機構とGated DeltaNetのような線形回帰層を交互に使うハイブリッド視覚言語モデルはこの用途に適するが、古いフレームを窓から外すたびに窓全体を再計算しなければならず高コストだった。回帰層の更新が状態に対してアフィンであることに着目し、各フレームの効果を合成可能な変換として捉える手法「Spool」を提案する。<br><br>各フレームの状態変換をキャッシュし、窓の進行に合わせて効率よく合成することで、期限切れフレームをバックボーンへの再入力なしに各回帰層の状態から除去できる。除去は各層内では厳密で、専用のデータ構造とGPUカーネルによりキャッシュと合成のオーバーヘッドを抑えた。訓練不要の枠組みである点も特徴だ。<br><br>5つのオープンソースのハイブリッドVLMと4つの動画推論ベンチマークによる評価では、20件のモデル・ベンチマーク組合せすべてで初回トークンまでのp95遅延が最小となり、直近のvLLMベースラインの速い方と比べて幾何平均6.6倍の短縮を達成し、精度も平均2.3ポイント向上した。出典： arXiv","timestamp":1794941967000,"title":"Spool: Low-Latency Streaming Inference for Hybrid Vision-Language Models","titleJa":"Spool――ハイブリッド視覚言語モデルの低遅延ストリーミング推論","url":"https://arxiv.org/abs/2611.23228"},{"authors":["Shobhita Sundaram","Cansu Sancaktar","Phillip Isola"],"categories":["cs.LG","cs.AI"],"field":"cs.LG","genre":"Agents / Robotics","monthKey":"2026-11","publishedAt":"2026-11-17T18:57:10Z","source":"arXiv","summaryHtml":"LLMエージェントは自らの学習を自ら進めるようになり、自己改善の手法はモデル最適化の各要素をモデル自身に委ねてきた。モデルが高性能化する中で、自己改善の「方法」まで人間が指定し続ける必要があるのか。本論文は、基本的なプリミティブとリソース、自己改善という一般的な目標だけを与え、エージェントが文脈ベースの最適化のための自己学習アルゴリズムを自ら構築する自律的パラダイムを検証する。<br><br>実験ではゲームをテストベッドとし、凍結したLLMエージェントに計算予算と経験収集・文書更新のツールを与え、外部から課された学習ループや実世界データなしに自由に実験させた。十分に高性能なモデルはこうした条件でも自己改善し、自己調整学習の古典的な認知枠組みや、自己生成カリキュラムに関する機械学習の知見と整合する方略を示した。<br><br>学習で生まれたテキストの成果物は外部ベンチマークにも転移し、ゲームの地平や力学、3Dナビゲーションを越えて改善が見られた。エージェントの自律的な学習能力がどこまで伸びるかを測る手がかりになる。出典：arXiv","timestamp":1794941830000,"title":"Do LLM Agents Still Need to Be Told How to Self-Improve?","titleJa":"LLMエージェントは自己改善の方法を教わる必要がまだあるか","url":"https://arxiv.org/abs/2611.23219v1"},{"authors":["S. M Seefat Alam"],"categories":["cs.CL","cs.LG"],"field":"cs.CL","genre":"Ethics / Safety","monthKey":"2026-11","publishedAt":"2026-11-17T18:57:08Z","source":"arXiv","summaryHtml":"大規模言語モデルの社会的バイアスを個々のアテンションヘッドに局在させ、切除によって除去する手法は、公平性指標の改善によって検証されるのが通例だ。しかし、ヘッドを選ぶ統計量が実際にバイアスを測っているという証拠は示されてこなかった。本論文はQwen-2.5-7B-InstructとLlama-3.1-8B-Instructでこの前提を監査する。<br><br>ヘッドのマップはラベルに依存しない応答長マップと強く相関した（ρ=-0.950と-0.768）。だが長さとラベルの結びつきを断つ介入により、この読みは退けられる。プロンプトを固定すると応答長が統計量の分散に占める割合は1%にすぎず、説明するのはプロンプトの同一性で分散の64%を占めた。固定プロンプト内では公平性ラベル、応答長、保護属性トークンの有無がφ=0.95で共線的であり、観察だけでは帰属は決定できない。<br><br>実質的な主張も成り立たなかった。バイアス選択性はどちらのモデルでも後層に集中しておらず、切除で不公平率を下げたヘッド集合はなかった。一方、その補集合は逆ラベルで評価すると拒否行動を確実に破壊し（p=2.7×10⁻⁵）、このパイプラインがその規模の効果を検出できることを示した。出典：arXiv","timestamp":1794941828000,"title":"What Does a Bias Head Measure? Non-Identifiability in Head-Level Bias Attribution","titleJa":"バイアスヘッドは何を測っているのか――ヘッド単位のバイアス帰属の非識別可能性","url":"https://arxiv.org/abs/2611.23218"},{"authors":["Yining Hua"],"categories":["cs.SE","cs.AI","cs.LG"],"field":"cs.SE","genre":"LLM / NLP","monthKey":"2026-11","publishedAt":"2026-11-17T18:56:42Z","source":"arXiv","summaryHtml":"新しいコーディングモデルはベンチマークのスコア向上を売りにするが、スコアが高いモデルが実際の仕事を多くこなすのかは検証されてこなかった。2026年6月12日、米国の輸出管理指令によりClaude Fable 5へのアクセスが19日間停止され、多くの利用者がSWE-Bench Proで11ポイント低いOpus 4.8へ移行せざるを得なくなった。本論文はこの停止を自然実験と捉え、人とプロジェクトは同じでモデルだけが変わる条件でFable 5の生産性への影響を分離した。<br><br>297人のFable 5利用者のGitHubプルリクエストを停止前後で追跡し、Opus 4.8を使い続けた8,908人の開発者を対照群とした。さらに2026年のモデル更新5件についても同様の比較を行った（1,208人、15,442件のプルリクエスト）。開発者と日付の固定効果を入れた差分の差分モデルで推定した結果、Fable 5へのアクセスは7日以内のプルリクエスト統合率を1.4ポイント上げるのみで、統計的に有意ではなかった。<br><br>モデル更新による統合率の上昇も見られず、加重平均はマイナス0.9ポイントで、5件の推定はすべて負だった。週あたりの統合件数にも有意な増加はなかった（+2.4%）。ベンチマークの得点向上がそのまま実務の生産性向上につながるわけではないことを示す結果だ。出典： arXiv","timestamp":1794941802000,"title":"Higher-Scoring Coding Models Did Not Get More Work Done","titleJa":"ベンチマーク高得点のコーディングモデルは、実務を多くこなしたか","url":"https://arxiv.org/abs/2611.23216"},{"authors":["John Gideon","Anshul Gupta","Megan Applegate-Kenton","Kayli Battel","Todd J Rowell","Patricio Reyes Gomez","Laporsha Dees","Emily Sumner","Avinash Balachandran","Guy Rosman"],"categories":["cs.CV","cs.LG","cs.RO"],"field":"cs.CV","genre":"Vision / Multimodal","monthKey":"2026-11","publishedAt":"2026-11-17T18:50:22Z","source":"arXiv","summaryHtml":"人間の認知状態（注意散漫やストレスなど）、視線、行動は運転環境と微妙に相互作用するが、認知状態レベルの正解ラベルを大規模に得るのはコストが高い。本論文は、障害ラベルをマスクされたトークンとして予測すると同時に、マスクされた視線と軌跡を再構成する自己教師あり目的を加えたマルチモーダル・マスク拡散オートエンコーダ「ID-MAE」を提案する。<br><br>検証のため、103時間の運転データ（被験者109人）と認知的・視覚的・情緒的な10種類の障害誘発を含む運転シミュレータデータセット「DIVERT」を導入した。視線、車両状態、シーン映像を記録している。ID-MAEはDIVERTと既存データセットの双方で障害推論を大幅に改善し、軌跡や視線の予測といった追加タスクでも強い結果を示した。<br><br>位置を一致させたペアでは、DIVERTにおける障害検出のペアAUCは再構成損失なしの0.590から0.706へ向上した。マスキング方式や位置エンコーディングなどの設計空間も検討し、視覚的要求の高い注意散漫と認知的注意散漫を分離できることも示した。コードとデータは受理後に公開予定だ。出典：arXiv","timestamp":1794941422000,"title":"Multimodal Masked Diffusion Autoencoder for Modeling Impaired Driving","titleJa":"マルチモーダル・マスク拡散オートエンコーダによる運転能力低下のモデリング","url":"https://arxiv.org/abs/2611.23211"},{"authors":["Gabriel Sarch","Declan Campbell","Nicholas Budny","Kia Ghods","Katerina Fragkiadaki","Jonathan D. Cohen","Brenden M. Lake","Taylor W. Webb"],"categories":["cs.CV"],"field":"cs.CV","genre":"Vision / Multimodal","monthKey":"2026-11","publishedAt":"2026-11-17T18:49:33Z","source":"arXiv","summaryHtml":"人間の視覚推論は、課題に関連する視覚的証拠を体系的に探索し抽出することに支えられており、視線はその過程を映す窓だ。本論文は、多様で難度の高い視覚推論課題から7,109件の人間の視線試行を収集し、視線データを視覚言語モデル（VLM）の視覚推論の改善にどう活かせるかを調べる。<br><br>視線にはノイズや冗長性も含まれ、丸ごと模倣するとVLMへの転移が悪い。実験では、視線系列全体による教師あり学習よりも、視線を推論の事前分布として使う方が、図表理解、視覚探索、数え上げの評価で一貫して優れた。ここから「GGR（視線ガイド推論器）」を提案し、主要な根拠づけ推論ベースラインと同等以上の精度で、より人間らしいアライメントと確かな視覚的根拠づけを達成した。<br><br>強化学習は視線の教師なしでも精度、視線アライメント、根拠づけをさらに改善した。視線で教師されたモデルは結論に至る前に視覚的探索を多く行うことも行動分析で示された。視線の価値は完全な模倣ではなく、空間的探索の誘導と推論行動の形成にある。視線をそのままなぞるのではなく、どこを見るべきかという探索の指針として活かすことが、VLMの推論を人間らしく、かつ確かなものにするという。出典：arXiv","timestamp":1794941373000,"title":"Learning Grounded Reasoning from Human Gaze","titleJa":"人間の視線から学ぶ視覚推論――視線ガイドによる根拠づけ","url":"https://arxiv.org/abs/2611.23209"},{"authors":["Aviv Yossef","Or Patashnik","Or Zamir"],"categories":["cs.LG","cs.CR","cs.CV"],"field":"cs.LG","genre":"Ethics / Safety","monthKey":"2026-11","publishedAt":"2026-11-17T18:49:17Z","source":"arXiv","summaryHtml":"生成モデルへのウォーターマークは、出力品質を落とさない「歪みのない」ものであることが望ましい。従来の手法は画像の圧縮や切り抜き、サイズ変更といった良性の変換に弱く、しかも自己回帰テキストや拡散モデルの初期ノイズ制御など、特定のモデル内部へのアクセスを前提とすることが多かった。<br><br>本論文は、生成モデルへのブラックボックスのサンプリングと意味埋め込みへのクエリだけで動作する、証明可能な歪みなしの意味的ウォーターマークを提案する。内容を保つ変換の下で検出が頑健になるよう、意味埋め込みに求められる2つの性質――変換に対する安定性と、同一プロンプトからの独立生成の区別――を定式化し、このトレードオフに直接最適化した画像エンコーダを学習した。<br><br>既成の埋め込みと比べ、分離性能を高めつつ安定性を保ち、各種変換に対して頑健な集約検出を実現した。集約検出により、単一サンプルでは捉えにくい弱い信号も確実に拾える。オープンソースモデルとクローズドモデルの両方で有効性を示しており、ブラックボックスのみで済む点が実用上の強みだ。出典：arXiv","timestamp":1794941357000,"title":"Distortion-Free Semantic Watermarks for Black-Box Generative Models","titleJa":"歪みのない意味的ウォーターマーク――ブラックボックス生成モデル向け","url":"https://arxiv.org/abs/2611.23208v1"},{"authors":["Tongxi Wu","Yuyang Cheng","Jiacheng Xian","Menglin Yang","Kai Chen","Jian Zhang","Yang Gao"],"categories":["cs.CV","cs.AI"],"field":"cs.CV","genre":"Ethics / Safety","monthKey":"2026-11","publishedAt":"2026-11-17T18:48:02Z","source":"arXiv","summaryHtml":"視覚言語モデル（VLM）は、有害な目的の明示的な要求がなくても、視覚的事象の解釈を通じて有害な支援を提供しうる。本論文はこの「場面状態の安全性の脆弱性」を指摘し、375組の画像–質問ペアからなるベンチマークSceneSafetyBenchを導入する。初期・中期・最終の3つの場面状態と5種の視覚提示を網羅する。<br><br>8つのVLMを調べたところ、場面状態の入力は45.6〜72.3%の攻撃成功率で有害な支援を引き出した。層ごとの安全性関連シグナルはQRコード関連画像に最も近い一方、後期層の読み出しは低く、生成中の動態も異なることが分かった。攻撃手法S3TAは有害な目的を場面状態に翻訳し、画像–質問ペアを独立に問い合わせて応答を組み立てる。<br><br>MM-SafetyBenchの7カテゴリ・8モデルでS3TAはモデル平均の攻撃成功率71.2%を達成し、最強のベースラインを6.1ポイント上回った。テキスト側フィルタや視覚モデレーションの防御は限定的で、入力内容の選別だけでなく、場面に根ざした推論からモデルが推し量る支援そのものを守る必要があると結論づけている。出典：arXiv","timestamp":1794941282000,"title":"Reading Scene States: Uncovering Safety Failures in Vision-Language Models","titleJa":"場面の状態を読み取る――視覚言語モデルにおける安全性の失敗を暴く","url":"https://arxiv.org/abs/2611.23206v1"},{"authors":["Viet K. Nguyen","Mohammad I. Husain"],"categories":["cs.AI"],"field":"cs.AI","genre":"Agents / Robotics","monthKey":"2026-11","publishedAt":"2026-11-17T18:44:25Z","source":"arXiv","summaryHtml":"AIエージェントが組織の境界を越えて協働する場面が増え、他組織が運用するエージェントのツールを呼び、やり取りする機会が広がっている。既存のエージェントフレームワークは計画と調整を支えるが、組織を越えたエージェントのアイデンティティ、実行の完全性、認可を検証する共通の仕組みが欠けている。本論文は、公開鍵基盤（PKI）、ゼロトラストアーキテクチャ、リモートアテステーションに基づくフレームワーク非依存のセキュリティアーキテクチャ「Agent Trust Infrastructure（ATI）」を提案する。<br><br>ATIは各組織の認証局（AgentCA）をピアとして連合信頼を確立し、共有のルート認証局を不要にする。要求の実行前にエージェント証明書を検証し、承認されたモデル・ツール・システムプロンプトの構成を確認したうえで、3つのポリシーチェックで認可を強制する。既存フレームワークのモデルを変更することなく、外部のセキュリティ施行層として統合できる。<br><br>8組織の連合シミュレーションで評価したところ、14の攻撃シナリオと6つの良性タスクにおいて、すべての施行機構を有効にすると攻撃封じ込め率は43%から84%に上昇した。要求あたりのオーバーヘッドは約174マイクロ秒にとどまる。ATIはオープンソースとして公開され、IETF WIMSEのワークロードトークン形式とEntity Attestation Tokenを用いる。出典：arXiv","timestamp":1794941065000,"title":"Agent Trust Infrastructure (ATI): A Federated Identity, Trust, Attestation, and Accountability Architecture for Cross-Organization Autonomous AI Agents","titleJa":"エージェント信頼基盤ATI――組織を越える自律AIエージェントの連合型セキュリティ","url":"https://arxiv.org/abs/2611.23202v1"},{"authors":["Hai Huang","Bartosz Żuk","Rassul Magauin","Jiaxin Huang","Xue Liu"],"categories":["cs.CL","cs.AI"],"field":"cs.CL","genre":"LLM / NLP","monthKey":"2026-11","publishedAt":"2026-11-17T18:38:27Z","source":"arXiv","summaryHtml":"次トークン予測だけでは、言語モデルが学ぶべき内部表現の構造までは十分に導けないのではないか。本論文はコルモゴロフ複雑性の二部符号化の考え方にもとづき、表現を「構造」と「実現の細部」に分離する構造–残差の原理を提案する。<br><br>実装は2通りある。Boundary Bottleneck Concept（BBC）はトークン区間の情報を境界キャリア経由で伝えつつ局所的な自己回帰計算を保ち、Continuous Concept（CC）は表現の幾何を正則化して低周波の構造と高周波の残差へスペクトル分解する。BBCは浅い層、CCは深い層で最も効果が高く、両者の併用でGPT-2 Mediumの負の対数尤度が1.44%改善した。20Bトークンまでの学習でも効果は持続した。理論面では、多重性を補正した境界アテンションが、区間内の経路エネルギーが消える極限で厳密になることも示した。<br><br>表現そのものに構造のバイアスを与えることで、次トークン予測を超えた事前学習の改善が可能だと示した。境界状態の予測上の重要性が増し、スペクトル残差エネルギーが減ることも診断で確認されている。出典：arXiv","timestamp":1794940707000,"title":"Structure--Residual Inductive Biases for Language Model Pretraining","titleJa":"言語モデル事前学習における構造–残差の帰納バイアス","url":"https://arxiv.org/abs/2611.23197v1"},{"authors":["Almog Anschel","Sarah Keren"],"categories":["cs.AI","cs.LG","cs.RO"],"field":"cs.AI","genre":"Agents / Robotics","monthKey":"2026-11","publishedAt":"2026-11-17T18:35:53Z","source":"arXiv","summaryHtml":"目標認識は、観察された行動からエージェントの意図する目標を推測する課題だ。既存手法は高水準の記号的認識に偏るか、連続的な軌跡を扱う場合も獲得が難しく転移しにくい動力学モデルに依存し、エージェントが各候補目標へどう向かうかを明示的に学ばない。本論文は、学習した軌跡の事前分布を用いる「WoRD（Waypoint Recognition with Diffusion）」を提案する。<br><br>WoRDは各候補目標につき1本のウォームスタートしたノイズ除去チェーンを走らせ、閉形式の対数尤度勾配で観測された軌跡へ誘導し、ベイズの定理でサンプルを重み付けして目標上の較正された事後分布を得る。シミュレーションしたロボット環境、歩行者軌跡、車両軌跡で評価し、4つの指標で異なる失敗様式を検証した。<br><br>3つの環境すべてで同じ推論手順が、あいまいな軌跡の冒頭でも較正された多峰的な信念を保ち、フィルタや分類器ベースの観測者が単一のモードに崩壊したり過信したりする場面で優位を示した。候補目標への動き方を学んだ事前分布が効くのは、軌跡の冒頭が最もあいまいな場面であり、そこでも多峰的な信念を保てる点が強みだ。出典：arXiv","timestamp":1794940553000,"title":"WoRD: Diffusion-Based Posterior Inference for Online Goal Recognition","titleJa":"WoRD――拡散モデルによるオンライン目標認識の事後推論","url":"https://arxiv.org/abs/2611.23192"},{"authors":["Nhi Hoai Doan","Tatsuya Hiraoka","Munachiso Samuel Nwadike","Kentaro Inui"],"categories":["cs.CL"],"field":"cs.CL","genre":"LLM / NLP","monthKey":"2026-11","publishedAt":"2026-11-17T18:30:35Z","source":"arXiv","summaryHtml":"言語モデルが自然言語推論（NLI）で否定をどう処理するかは、モデルの推論能力を理解するうえで重要な問いだ。否定は言語理解の基本的な操作であり、その処理を誤れば推論の結論は反転してしまう。否定を含む推論は肯定文とは異なる計算を要求し、その内部処理の解明は言語モデルの推論能力の評価に直結する。本論文はこの計算の高水準の因果モデルとして「極性合成仮説」を提案する。行動評価では、言語モデルの予測はおおむねこの仮説に沿うことが示された。<br><br>さらに分散アライメント探索（Distributed Alignment Search）を用いて、仮説の変数に対応する因果的に有効な部分空間を言語モデルの内部表現の中に特定した。これらの表現は否定の形式を越えて転移し、MNLIのサブセットにも部分的に転移することが確認された。データセットとコードも公開されている。<br><br>否定の処理を支える内部機構を、行動だけでなく因果的な証拠で裏づけた点が本論文の意義だ。仮説の変数に対応する部分空間が実際に因果的に有効であることを示したことで、否定処理の理解は行動の観察から内部機構の解明へと進んだ。出典：arXiv","timestamp":1794940235000,"title":"Polarity Composition Hypothesis: Causal Evidence from Negation in NLI","titleJa":"極性合成仮説――自然言語推論における否定からの因果的証拠","url":"https://arxiv.org/abs/2611.23185"},{"authors":["Hansang Lee"],"categories":["cs.CV","cs.AI"],"field":"cs.CV","genre":"Vision / Multimodal","monthKey":"2026-11","publishedAt":"2026-11-17T18:24:58Z","source":"arXiv","summaryHtml":"選好最適化（PO）は大規模視覚言語モデルの対象幻覚を減らす標準的手法だ。ところがLLaVA-1.5-7Bの公開POチェックポイント4件を調べると、幻覚率の低下と引き換えに対象網羅性も下がっていた。言及される対象カテゴリが減り、CHAIRでの集合レベルの対象F1に有意な改善はなかった。<br><br>ではPOの改善のうちどれだけをベースモデルが早期停止で再現できるか。文末（EOS）ロジットへの正のバイアスでベースモデルは各POモデルの再現率に到達し、2つの異なるCOCO集合で3件のチェックポイントのCHAIRi改善の58〜86%を早期停止だけで再現した。長く書いても失われたカテゴリは戻らない。貪欲デコーディングでは負のEOSバイアスで失われた再現率の2〜9%しか回復せず、追加された対象言及の94〜96%は既出カテゴリの繰り返しだった。<br><br>そこでベースモデルが言及した高確信度の対象カテゴリをPOキャプションに訓練なしで追加する「ベース誘導型対象カテゴリ復元」を提案する。開発集合で固定した閾値により、3件のチェックポイントは保持用COCO集合でベースモデルの再現率から1ポイント以内に近づき、対象幻覚率はベースモデルより低くなった。出典：arXiv","timestamp":1794939898000,"title":"Say Less, Hallucinate Less? Diagnosing and Restoring Object Coverage in Preference-Optimized Vision-Language Models","titleJa":"少なく語れば幻覚は減るか――選好最適化された視覚言語モデルの対象網羅性の診断と回復","url":"https://arxiv.org/abs/2611.23179"},{"authors":["Florian Gunsilius","David Van Dijcke","Kaspar Wüthrich"],"categories":["stat.ME","cs.AI","econ.EM"],"field":"stat.ME","genre":"Agents / Robotics","monthKey":"2026-11","publishedAt":"2026-11-17T18:22:01Z","source":"arXiv","summaryHtml":"AIコーディングエージェントはコード作成からデータ操作まで実証研究のあらゆる段階で熟達しつつある。仮説検定への利用は、古典的な推論に大きな脅威をもたらす。エージェントは人間らしい開かれた探索と、選択・推定過程のプログラム的な再現可能性を兼ね備えた、強化された選択的推論を可能にするからだ。<br><br>効果がゼロのシミュレーションデータで「説得力のある発見」を求めたところ、4つの最先端エージェントは54%から98%の確率で有意なp値を報告した。本論文はこの歪みを検出・修正する簡便な手順を提案する。エージェントの分析が終わった後、データをリセットしてサブサンプル上で再実行し、統計的に有利に見える分析をエージェントが選ぶ相対確率を推定する。<br><br>選択行動が安定したエージェントでは、修正後の検定は選択を条件として漸近的に妥当で一致性を持つ。修正はエージェントの探索方法のモデルではなく、ブラックボックスであるエージェントの実際の選択から学習するため、AI技術が進化しても有効性を保つ。シミュレーションでは高い誤棄却率が名目上の5%近くまで下がり、発表済み論文2件への応用でも示された。出典： arXiv","timestamp":1794939721000,"title":"Inference after coding agents","titleJa":"コーディングエージェントの後の推論――実証研究における選択的推論の脅威","url":"https://arxiv.org/abs/2611.23174"},{"authors":["Lorenzo Masoero"],"categories":["cs.SE","cs.AI","cs.CL"],"field":"cs.SE","genre":"Agents / Robotics","monthKey":"2026-11","publishedAt":"2026-11-17T17:59:13Z","source":"arXiv","summaryHtml":"コードはかつてない速度で進化する一方、顧客向けドキュメントは置き去りにされがちだ。LLMエージェントがドキュメントを主要な情報源として使うようになり、古い情報が権威あるものとして広まる害は大きくなっている。著者らは、解決済みサポートチケットやコードとドキュメントの不一致といった手がかりを拾い、ドキュメントのずれを修復するマルチエージェントシステムを実運用に投入した。<br><br>中核はトリアージエージェント「TriAgent」で、43日間のシャドー運用で499件のチケットをトリアージし、92か所のドキュメント不足を発見した。独立したモデル系列のLLM判定パネルによると、検証可能な主張の81.1%が正しく、長さを揃えた比較ではTriAgentの回答が70.5%で人間のエンジニアの回答を上回った。<br><br>人間とエージェントの回答は補完的で、人間が既存ドキュメントの奥に埋もれた知見を示すことも多かった。そうした知見は人間の確認を経てドキュメントの修正につながり、修正後に同じチケットへ答え直すと、判定者は71.4%で修正後の回答を好んだ。ドキュメントを直すことがエージェントの回答を直接改善する好循環が確認された。出典：arXiv","timestamp":1794938353000,"title":"Mind the Gap: A Deployed Multi-Agent System for Documentation Maintenance","titleJa":"ギャップを埋める――ドキュメント保守のための実運用マルチエージェントシステム","url":"https://arxiv.org/abs/2611.23142v1"},{"authors":["Dewu Zheng","Yang Ye","Hongyu Zhang","Jun Yu","Yanlin Wang"],"categories":["cs.AI","cs.LG"],"field":"cs.AI","genre":"LLM / NLP","monthKey":"2026-11","publishedAt":"2026-11-17T17:55:30Z","source":"arXiv","summaryHtml":"大規模言語モデルが訓練される側から訓練を行う側へと役割を広げるなか、モデルが自律的に訓練を行い対象モデルを改善する能力は、再帰的自己改善（RSI）の基盤となる。これまでLLMの訓練能力そのものを対象として体系的に研究し育てる試みは乏しく、本論文はその能力の専用データセット「RSI-Prime」を構築した。7つのタスクカテゴリにわたる350件の完全な実験軌跡を収録している。<br><br>LLMが訓練実践から質の高い実験判断を学べるよう、各実験ステップでの意思決定を細かく特定して品質を注釈した。そのうえで、質の低い行動への教師信号を除外する決定レベルの損失マスキングを適用し、良い判断だけを学習対象とした。訓練の進め方そのものを学ぶための設計である。<br><br>評価はGLM-5.3と自律的事後訓練のベンチマークPostTrainBenchによるもので、RSI-Primeでの訓練により全体性能が元のモデル比で31.95%相対的に向上した。モデルが自らの進歩を持続させる将来のRSIシステムへの道筋を示す成果だと著者らは位置づけている。出典： arXiv","timestamp":1794938130000,"title":"RSI-Prime: Training Models to Train Models","titleJa":"RSI-Prime――モデルを訓練するモデルを育てる","url":"https://arxiv.org/abs/2611.23138"},{"authors":["Basavaraj R M","Harshal Chandel"],"categories":["cs.LG","cs.CL","cs.CV"],"field":"cs.LG","genre":"Vision / Multimodal","monthKey":"2026-11","publishedAt":"2026-11-17T17:45:28Z","source":"arXiv","summaryHtml":"検索拡張型の視覚言語モデルは、検索テキストと画像という2つの証拠源から答えるが、どちらも誤りうる。本論文はCOCOとVisual Genomeから20万件の画像–質問項目を作り、検索ノイズや画像のぼかし、反事実的なすり替えといった統制されたストレス条件で、モデルが2つのモダリティをどう組み合わせるかを調べた。<br><br>理想的なベイズ的合図統合から予測を導き、テキストを重み付けしすぎる「知識の慣性」とその逆の「感覚の捕捉」を定式化した。4つの公開モデルはいずれも清浄な入力では92.5〜94.2%の正答率だったが、敵対的な条件では41.3〜59.9%まで落ちた。LLaVA系はテキストを過重みし、InternVL3は画像を重視した。文書が嘘をつくと、正解の34.8〜71.4%が捨てられた。<br><br>検索の有無で回答を照合する訓練不要の整合性チェックは、誤解を招く文書下での精度をカバレッジと引き換えに改善したが、画像がひどく劣化した場合のフォールバックはうまくいかなかった。清浄時の正答の多くが画像に接地していない「接地の錯覚」を定量化する指標も提案され、再現用の出力・コード・監査が公開されている。出典：arXiv","timestamp":1794937528000,"title":"The Illusion of Grounding: Do Vision-Language Models Weigh Retrieved Text and Images Like an Ideal Observer?","titleJa":"接地の錯覚――視覚言語モデルは検索テキストと画像を理想的観測者のように重み付けするか","url":"https://arxiv.org/abs/2611.23127v1"},{"authors":["Giovanni Adorni","Daniele Grosso"],"categories":["cs.CL","cs.AI"],"field":"cs.CL","genre":"LLM / NLP","monthKey":"2026-11","publishedAt":"2026-11-17T17:27:01Z","source":"arXiv","summaryHtml":"生成AIは計算システムにおける自然言語の役割を変えつつある。従来の自然言語処理では言語は分析・分類・翻訳・生成の対象だったが、大規模言語モデルにより、自然言語は推論を構造化し、問題解決を編成し、人間とAIの協働を調整する実行可能な認知的媒体として機能し始めている。本論文はその理論的・認識論的拡張として「自然言語プログラミング（NLPg）」を提唱する。<br><br>NLPgではプロンプトは目標・制約・前提・検証基準・中間の推論状態を外化する動的な認知アーティファクトと捉えられる。プロンプト操作は単なる技術的対話ではなく、分散した人間／AIの記憶アーキテクチャの中で働く対話的認知プログラミングだ。分散認知、拡張された心、メタ認知、対話的学習の理論を踏まえ、「対話的ワーキングメモリ」の概念を提案し、プロンプトと対話状態が推論の連続性と反省的調整を支える一時的な外部記憶として働くと論じる。<br><br>既存の記憶アーキテクチャ（BTMA、SKGE、RMR）をこの枠組みに位置づけ、エピソード的・意味的・メタ認知的層が長期の対話の一貫性を支える様子を示す。自然言語が通信媒体であると同時に実行可能な仕様、認知の足場、分散記憶として働く、ポスト記号的・ポストインターフェースのパラダイムが示唆される。出典：arXiv","timestamp":1794936421000,"title":"Natural Language Programming: Rethinking Language, Memory, and Cognition in the Era of Generative AI","titleJa":"自然言語プログラミング――生成AI時代の言語・記憶・認知の再考","url":"https://arxiv.org/abs/2611.23106"},{"authors":["Rose N. Kwon","Samy Mammeri","Sabyasachi Sahoo","Christian Gagné","Thomas Jiralerspong"],"categories":["cs.AI"],"field":"cs.AI","genre":"Ethics / Safety","monthKey":"2026-11","publishedAt":"2026-11-17T17:20:33Z","source":"arXiv","summaryHtml":"狭い有害タスクでの微調整は、訓練分布を越えて有害行動が般化する「創発的なミスアラインメント」を引き起こすことがある。望ましくない行動を訓練中に明示的に引き出す「接種プロンプト」はこの影響を減らせるが、評価プロンプトが訓練文脈の手がかりを含むと行動が再出現することが近年の研究で示されている。どのようなプロンプトが効果的な引き金になるのかは明らかになっていなかった。<br><br>本論文は、引き金の条件を検証した。驚くべきことに、接種プロンプトとのテキスト的な類似性は不完全な予測因子だった。代わりに、接種時の文脈が生み出す活性化状態に似た活性化状態を引き起こすプロンプトほど、抑圧された行動を再び引き出しやすいことが分かった。言葉の近さではなく、モデル内部の状態の近さが再出現を決める。<br><br>この知見は、接種プロンプトが条件付きミスアラインメントをどう調整するかの理解を深める。活性化空間の分析により、抑圧されたはずの行動が評価時プロンプトの下でいつアクセス可能なままかを特定できるようになり、安全性評価の手がかりになると著者らは示唆する。出典： arXiv","timestamp":1794936033000,"title":"Hidden-State Similarity Predicts Re-Elicitation After Inoculation Prompting","titleJa":"隠れ状態の類似性が予測する、接種プロンプト後の有害行動の再出現","url":"https://arxiv.org/abs/2611.23096"},{"authors":["Silviu Pitis","Parand A. Alamdari","Jessica Tang","Toryn Q. Klassen","Sheila A. McIlraith"],"categories":["cs.CL","cs.AI","cs.LG"],"field":"cs.CL","genre":"Ethics / Safety","monthKey":"2026-11","publishedAt":"2026-11-17T17:01:00Z","source":"arXiv","summaryHtml":"AIエージェントは数百の自然言語基準で統治されるが、既存の検証器は大量の基準に対してエージェントの出力を効率よく評価し、満たす・違反する・該当しないを報告できない。本論文は、共有コンテキストと対象テキストを符号化し、N個の自然言語基準を並列に採点して基準ごとの三値判定を返すツリーアテンション検証器VFMを提案する。<br><br>VFMは39万4千件の（コンテキスト、対象、基準、判定）タプルからなるCriteriaBankで事前学習した。微調整したVFM-4Bは合成ガバナンスベンチマークでGPT-5.4を上回り、DynaBenchではトレース単位の失敗検出でDynaGuard-4Bを上回った。基準ごとの判定は違反した規則を特定し、大規模な思考連鎖ジャッジへの的を絞ったエスカレーションを支える。<br><br>CriteriaBankによる事前学習は、特にデータが少ない領域でのドメイン横断の転移を改善した。H100 1枚で4Kトークンのコンテキストに対し1,000基準を2秒以内、11GB未満のVRAMで評価でき、実行時検証に適する。出典：arXiv","timestamp":1794934860000,"title":"Runtime Verification of Multiple Natural Language Criteria for Agent Governance","titleJa":"実行時検証――多数の自然言語基準によるエージェント統治","url":"https://arxiv.org/abs/2611.23074"},{"authors":["Yuanhao Zeng","Shaocheng Lan","Ao Lu","Kuang Yan","Heng Lin","Xinang Xu","Yuan Luo","Yueting Wang","Yexin Li","Ruo Shan","Kan Ren"],"categories":["cs.AI","cs.CL"],"field":"cs.AI","genre":"Agents / Robotics","monthKey":"2026-11","publishedAt":"2026-11-17T16:57:03Z","source":"arXiv","summaryHtml":"エージェント進化は、提案者がプロンプトやスキル、記憶などの候補アーティファクトを書き、評価スコアが高いものを選択する単純なループで進む。期待される一方で、手法によって論文ごとの勝敗が入れ替わり、特定のタスクでは進化が立ち上がらないという謎があった。本論文はその原因を「解像度仮説」として提示する。問題はより良いアーティファクトを提案できないことではなく、ノイズの多い評価がそれを確実に見分けられないことにあるという。<br><br>7つの進化手法と6つのモデル、1,000万回超のLLM呼び出しによる検証では、評価スコアが使われる2つの水準で仮説が支持された。候補の水準では、有用な候補は存在するのに選択は有害なものとの区別でランダムと変わらず、誤りがラウンドを重ねて蓄積する。手法の水準では、数ポイントの差は同じ手法の独立した2回の実行の差より小さく、発表された順位は運に左右されることが多い。<br><br>エージェント進化はしばしば、真の改善を確実に検出できるかどうかに律速されている。自己改善エージェントの開発は、候補改善システムを増やす設計から、真の改善を検出可能で蓄積可能にする方向への転換が求められる。出典：arXiv","timestamp":1794934623000,"title":"The Resolution Hypothesis: Agent Evolution's Key Is Identifying Improvements","titleJa":"エージェント進化の鍵は改善の見極めにある――解像度仮説の検証","url":"https://arxiv.org/abs/2611.23068"},{"authors":["Nguyen Quang Trung","Hoang Phan","Shuo Sun","Longyin Zhang","AiTi Aw"],"categories":["cs.CV"],"field":"cs.CV","genre":"Vision / Multimodal","monthKey":"2026-11","publishedAt":"2026-11-17T16:36:16Z","source":"Hugging Face Papers","summaryHtml":"複数の専門教師の技能を一人の生徒モデルに吸収させる「マルチ教師オン・ポリシー蒸留（MOPD）」を、視覚言語モデル（VLM）の推論の事後学習に適用した公開レシピを提案する。対象は画像STEM、画像知覚、動画の三つの推論領域で、教師あり微調整用のM3OPD-SFT-1.35Mと、検証可能な報酬による強化学習用のM3OPD-RL-193Kという二つのデータセットを整備した。<br><br>ベースモデルQwen3.5-9Bから、全領域の混合データで一気に学習する手法と、領域ごとに教師をGSPOで学習させてからMOPDで一人の生徒に蒸留する手法を比較した。21のベンチマークでの評価の結果、GSPOで直接学習した教師からのMOPDが最良のレシピとなり、生徒は各教師の専門領域にほぼ匹敵し、平均では混合学習のベースラインを上回った。<br><br>さらにMOPDの生徒に同じプロンプトで混合強化学習（MixRL）を重ねても崩壊せず性能が伸び、最終モデルM3OPD-Reasoner-9Bが得られた。MOPDとMixRLは同じデータをより引き出す連続した段階として機能する。データ、学習コード、各段階のチェックポイントはすべて公開されている。出典：Hugging Face Papers","timestamp":1794933376000,"title":"M3OPD-Reasoner: An Open Recipe for Post-Training Multimodal Reasoning with Multi-Teacher On-Policy Distillation","titleJa":"M3OPD-Reasoner――複数教師のオン・ポリシー蒸留によるマルチモーダル推論の公開レシピ","url":"https://arxiv.org/abs/2611.23034"},{"authors":["Ron Bekkerman","Nichole Li","Bahareh Kargar","Mark Somers"],"categories":["cs.CL","cs.AI","cs.CY","cs.DL"],"field":"cs.CL","genre":"LLM / NLP","monthKey":"2026-11","publishedAt":"2026-11-17T15:57:22Z","source":"arXiv","summaryHtml":"2022年末の大規模言語モデル（LLM）登場以来、科学の未来が問われてきたが、その影響を測るには科学実践がそれ以前からどう変化していたかを知る必要がある。本論文は2015〜2025年の5分野250万本の全文論文を分析し、語彙・構造・認識論・社会的な幅広い次元で傾向を追跡した。LLM登場前からの変化の延長線上にあるものと、登場後に生じた断絶とを区別するのが狙いだ。<br><br>一部の語の頻度変化を除けば、2023年以前からの傾向の多くは目立った断絶なく続いていた。例外として、コンピュータ科学の共著チームの成長がアジアで著しく加速した一方、生物医学のトピック多様性の見かけの低下は、論文フォーマットの標準化を反映したものだった。LLMによる科学の変容は、語彙の表層的な変化を除けばまだ検出できる段階
