  <script>
    const DATA = {"articles":[{"authors":["Renata Topinkova","Carsten Schwemmer"],"categories":[],"field":"SocArXiv","genre":"Agents / Robotics","monthKey":"2026-11","publishedAt":"2026-11-16T12:13:17Z","source":"OSF Preprints","summaryHtml":"オンライン調査は人間の回答を前提に成り立っているが、簡単な指示一つでウェブサイトを操作し課題を遂行するエージェント型ブラウザの登場が、その前提を揺るがしている。本研究は市販のエージェント型ブラウザ3種に「このアンケートに回答して」という一言の指示だけを与え、オンライン調査を遂行できるか、既存の検出・防止策が通用するかを検証した。<br><br>エージェントはほとんど人間の入力なしに調査を完了し、割り当てられた人口統計学的プロフィールも維持した。技術的なスクリーニング、可視・不可視CAPTCHA、AI専用のプロンプトインジェクション検査、長期調査での回答の一貫性、単一指示による複数調査の完了を試したが、プロンプト漏洩や脱獄風の検査はすべて通過し、ブラウザのメタデータから自動参加を見抜くこともできなかった。不可視reCAPTCHAは一部のブラウザに一貫して突破され、可視reCAPTCHAが最も強い障壁だったものの、解けてしまう場合や人間に制御を戻す場合もあった。<br><br>広く入手可能なAIエージェントが、人間参加者向けの課題を代行し、一見筋の通ったもっともらしい回答を生み出せることが示された。人間が生成したはずのデータが本当に人間によるものかをどう検証するかという、研究の信頼性に関わる問いが浮かび上がる。出典：OSF Preprints","timestamp":1794831197000,"title":"\"Fill Out this Survey\": Capabilities and Detection of Agentic Browsers","titleJa":"「このアンケートに回答して」：エージェント型ブラウザの能力と検出","url":"https://osf.io/preprints/socarxiv/tc5zq_v3/"},{"authors":["Octavio Islas Carmona","Amaia Arribas Urrutia"],"categories":[],"field":"Online Media and Global Communication","genre":"Consciousness / Philosophy","monthKey":"2026-11","publishedAt":"2026-11-16T00:00:00Z","source":"Crossref","summaryHtml":"AIは人間の「副操縦士」から、自律的にふるまうエージェントへと移行しつつある。本論文はメディア・エコロジーの視点から、この変化が人間のアイデンティティ、著者性、思考の自律性をどう組み替えるかを分析する。火の制御から現在までの人間とインターフェースの進化をたどり、マクルーハンのテトラッドでAIが何を拡張し、何を陳腐化し、何を取り戻し、何へ反転するかを診断する。<br><br>著者らはAIを脳処理の外部層「エクソコーテックス」と呼ぶ。AIは決定や趣味、分析を形作り直し、従来のメディアが人間の反映であったのに対し、文化や物語を自律的に生み出すモデルへと変わった。ニューラルネットワークのブラックボックス性は司法や医療など重要分野での透明性と監督を妨げ、判断はアルゴリズムへと委ねられ、人間の批判的判断は次第に麻痺していくという。<br><br>判断と技術的労働を機械に委ねれば、人間の批判力と創造力は萎縮するおそれがある。AIは言語という文明のOSをハックし、「真実」をアルゴリズムの副産物に変える「現実の泡」を生む。効率の独裁が民主的制度の応答能力を上回るなか、著者らは「選択的切断の倫理」を提唱し、不完全さや曖昧さ、沈黙を守るべき人間の要素として擁護する。出典：Crossref","timestamp":1794787200000,"title":"From extension to the reconfiguration of the human: artificial intelligence as an environment in media ecology","titleJa":"AIは人間の「拡張」から「再構成」へ――エージェント化するAIとメディア・エコロジー","url":"https://doi.org/10.1515/omgc-2026-0022"},{"authors":["Maruša Ferjan","Marina Trkman"],"categories":[],"field":"Journal of Information, Communication and Ethics in Society","genre":"Ethics / Safety","monthKey":"2026-11","publishedAt":"2026-11-16T00:00:00Z","source":"Crossref","summaryHtml":"生成AIの急速な普及は大きな機会をもたらす一方で倫理的な懸念も呼ぶ。AI倫理の指針や理論枠組みでは「善行」と「無害」という二つの原則が、生成AIの開発と利用を最大の価値と最小の害へ導くものとされる。だが一般の人々がこれらをどう受け止めているかは十分に分かっていなかった。<br><br>本研究は生成AIシステムに対する「知覚された善行」と「知覚された無害」の二つの構成概念を測る尺度を開発・検証した。若年成人を対象とした探索的因子分析では2因子構造が得られ、分散の約64%を説明した。EU在住の成人を対象とした確認的因子分析でも2因子構造が確認され、標準化負荷量はすべて0.70を超えた。<br><br>開発された尺度は、構造モデルに組み込んでさまざまな利用文脈における生成AIの利用行動を分析できる実用的な手段だ。政策立案者が利用者の受け止めをより深く理解し、生成AIの開発と利用を統治するより堅固な政策を設計する助けになると著者らは述べる。倫理原則を人々の実感に即して測る試みとして、AIガバナンスの議論にもつながる。出典：Crossref","timestamp":1794787200000,"title":"Scales to measure the perceived beneficence and non-maleficence of generative artificial intelligence systems","titleJa":"生成AIは「善い」か「害がない」か――人々の受け止めを測る尺度の開発と検証","url":"https://doi.org/10.1108/jices-11-2025-0319"},{"authors":["Askar Garad","Hosam Alden Riyadh","Abdullah M. Al-Ansi","Mohammed Jaboob","Ali Ateeq"],"categories":[],"field":"Journal of Information, Communication and Ethics in Society","genre":"Ethics / Safety","monthKey":"2026-11","publishedAt":"2026-11-16T00:00:00Z","source":"Crossref","summaryHtml":"AIは気候モデリングや予測、エネルギー最適化、廃棄物管理、生物多様性保全、水資源管理など、環境サステナビリティの幅広い領域に応用されている。本論文は査読付き研究の構造的な文献レビューを通じ、AIの活用実態と倫理・ガバナンス上の論点を整理した。AIは主に予測・監視・最適化・モデルにもとづく意思決定といった分析機能を担っている。<br><br>ただしAIの導入が自動的に持続可能性をもたらすわけではない。AIシステム自体のエネルギー需要、インフラの整備状況、ガバナンス能力、透明性・公平性・説明責任をめぐる倫理的懸念が、成果を左右する条件になる。著者らはAIを「本質的に持続可能な技術」ではなく、条件付きの実現手段として捉えるべきだと論じる。<br><br>政策への示唆として、AIガバナンスへの持続可能性基準の組み込み、気候関連AIの透明性・説明責任の強化、エネルギー効率を重視する「グリーンAI」の推進、能力開発とデータ基盤の整備を挙げる。測定と評価に関する短期・中期・長期の研究アジェンダも提案され、応用研究と倫理・ガバナンス研究を一つの枠組みで統合した点が本論文の貢献である。出典：Crossref","timestamp":1794787200000,"title":"Artificial intelligence for environmental sustainability: opportunities, ethical challenges and future research directions","titleJa":"環境の持続可能性にAIを活かす――機会と倫理的課題、将来の研究方向","url":"https://doi.org/10.1108/jices-08-2025-0229"},{"authors":["Tessa Cunningham","Kate Seymour","Sarah Wendt","Tabitha Lean","David Chikwuba"],"categories":[],"field":"International Journal for Crime, Justice and Social Democracy","genre":"Psychedelics / Trauma","monthKey":"2026-11","publishedAt":"2026-11-16T00:00:00Z","source":"Crossref","summaryHtml":"若者の犯罪化をめぐる研究は、個人のリスク要因を探る個別化・実証主義の枠組みに支配されてきた。そのなかでトラウマへの言及は増えたものの、分析は対人関係や家庭内の被害にほぼ限られ、人種差別や貧困、警察対応、収監といった社会的・構造的・言説的な逆境は見えにくくされてきた。<br><br>本論文は、犯罪化された若者を対象ではなく共同研究者として扱う博士研究にもとづき、共同設計のナラティブ手法で調査を行った。人種化された参加者10人の語りに焦点を当て、植民地主義がつくり出した人種の構築と、そこから生じる暴力が、参加者の人生における中心的で持続的なトラウマであることを描き出す。参加者は日常の人種差別や警察との遭遇、投獄の経験を、単発の出来事ではなく人生を貫く害として語った。<br><br>語られた経験は、支配的なトラウマ理解の枠組みを揺さぶる。個人的・家庭的な被害も、人種化された危害や構造的不平等、国家による暴力という広い地平の中に位置づけ直される。若者を研究の対象ではなく共に知をつくる相手とする手法そのものも、トラウマを個人の問題として切り取るのではなく社会的文脈のなかで捉え直す視点を示している。出典：Crossref","timestamp":1794787200000,"title":"Whose Trauma Counts? Racism as an Enduring Trauma in the Lives of Criminalised Young People","titleJa":"誰のトラウマが数えられるのか――犯罪化された若者の生における持続するトラウマとしての人種差別","url":"https://doi.org/10.5204/ijcjsd.4763"},{"authors":["Ellen J. Langer","Philip Z. Maymin"],"categories":[],"field":"Frontiers in Artificial Intelligence","genre":"Consciousness / Philosophy","monthKey":"2026-11","publishedAt":"2026-11-16T00:00:00Z","source":"Crossref","summaryHtml":"機械はいま、書くことも計算することも助言することもほぼ無料でこなす。知能がそれほど安くなったとき、人間に金を払う価値があるのは何か。本論文の答えは「マインドフルネス」、すなわち新しいことに能動的に気づくという単純な行為だ。この答えは2つの主張に立つ。機械は気づかないこと、そして人は気づくことに対価を払うことだ。著者らは両方を検証した。<br><br>機械は気づくか。2026年にネットで広まった問い「洗車したい。洗車場は50m先。歩くべきか車で行くべきか」では、多くの主要モデルが「歩け」と答え、車を家に置き去りにした。4,240件の回答アーカイブでの9問のテストでは、GPT-5.5とFable 5だけが全90試行に合格した。他のモデルは1問を解いて次の問を逃し、エージェントのハーネス内ではコマンドラインより成績が落ちるものもあった。失敗した5モデルに「気づくよう」指示しても、400試行中わずか9回しか合格しなかった。<br><br>人は気づくことに対価を払うか。事前登録した2つの実験（N=1,006と589）では、AI製と人間製の6つの製品にいくら払うかを尋ねた。人間の作り手は支払意思額を約2倍（+103%）にし、能動的な判断を働かせる人間と説明するとさらに20.9%上がった。手順どおりに作るだけの人間でもAIより53.8%高かった。機械のマインドフルネスは特性というより地図であり、評価は各モデルがどの細部を使うかを描くべきだという。人間の仕事は、機械の失敗がなくても価値を保つ。出典：Crossref","timestamp":1794787200000,"title":"When intelligence is cheap, mindfulness is priceless: AI performance and the value of human production","titleJa":"知能が安くなれば、マインドフルネスは貴重になる――AI時代の人間の価値","url":"https://doi.org/10.3389/frai.2026.1914761"},{"authors":["R. Manjupriya","A. Anny Leema"],"categories":[],"field":"Frontiers in Artificial Intelligence","genre":"Neuroscience","monthKey":"2026-11","publishedAt":"2026-11-16T00:00:00Z","source":"Frontiers in Artificial Intelligence","summaryHtml":"てんかんは脳の異常な電気活動による発作の反復を特徴とする慢性神経疾患だが、既存の自動検出手法はノイズの多い脳波（EEG）信号中の複雑な時空間依存性を十分に捉えられず、頑健性や信頼性に欠けた。本論文はEEGによる自動発作検出のための新しい枠組みEPI-SPA Netを提案する。経験的ウェーブレット変換でノイズやアーチファクトを抑えつつ発作関連の周波数成分を保ち、時空間ハイパーグラフニューラルネットワークで高次の空間結合と長距離の時間依存性を同時に学習し、カプセルネットワークで4秒ごとのEEG区間を発作・非発作に分類する。さらに時間畳み込みセグメンテーションネットワークで区間スコアを発作イベントへ変換し、葉レベルの伝播解析も行う。<br><br>評価の結果、全体の正解率は93.1%、適合率96.0%、再現率55.7%、F1スコア70.5%、コーエンのκは0.669だった。葉の動員順序は患者内では患者間より一貫していた（ケンドールのτは0.371対0.008、p &lt; 0.001）。<br><br>再現率が55.7%と低い点には注意が必要だが、発作検出と頭皮EEGからの伝播解析を組み合わせた本手法は、てんかん発作の臨床評価を支援する可能性があると著者らは述べる。出典：Frontiers in Artificial Intelligence","timestamp":1794787200000,"title":"EPI-SPA Net: hypergraph-based deep learning framework for seizure detection and propagation analysis in EEG signals","titleJa":"EPI-SPA Net：ハイパーグラフ深層学習によるEEGてんかん発作の検出と伝播解析","url":"https://www.frontiersin.org/articles/10.3389/frai.2026.1962680"},{"authors":["Geert E. Smid","Joren R. W. Ramaekers","Chesron R. J. Mersie","Hassan Pazira"],"categories":[],"field":"Frontiers in Psychiatry","genre":"Psychedelics / Trauma","monthKey":"2026-11","publishedAt":"2026-11-16T00:00:00Z","source":"Crossref","summaryHtml":"消防・警察などのファーストレスポンダーは、業務に関連したPTSDを発症するリスクが高い。治療を受けている当事者において、トラウマ関連の恥や自己スティグマ、セルフ・コンパッションがどう関わるかは、治療と予防を考えるうえで重要になる。本研究は業務関連PTSDで治療中の30人を対象に、自己スティグマの高さとその関連要因を横断的に調べた。<br><br>対象者の41.4%が自己スティグマの高い水準にあった。自己スティグマが高いほどトラウマ関連の恥が強く（r=0.75）、セルフ・コンパッションは低かった（r=-0.67）。セルフ・コンパッションの低さと恥の高さはPTSD症状の重さとも関連していた。自由記述からは「社会的な判断にさらされること」と「支え合い、力を与えてくれる関係」という二つのテーマが浮かんだ。<br><br>自己スティグマ、恥、セルフ・コンパッションの低さ、PTSD症状の重さは相互に関連している。自己スティグマと恥を減らし、セルフ・コンパッションを育てることが、援助要請やPTSDの転帰を改善するかどうかは、今後の研究課題だと著者らは述べている。出典：Crossref","timestamp":1794787200000,"title":"Exploring self-stigma, trauma-related shame, and self-compassion among treatment-seeking first responders with work-related PTSD","titleJa":"治療を求めるファーストレスポンダーのPTSD――自己スティグマ、トラウマ関連の恥、セルフ・コンパッション","url":"https://doi.org/10.3389/fpsyt.2026.2010901"},{"authors":["Christina Chwyl","Malena Donas","Angelica Spata","Gabriella Gatto","Akeesha Simmons","Kim Hoffman","M. Kati Lear","Brian Pilecki","Jenna LeJeune","Jason Luoma"],"categories":[],"field":"PsyArXiv","genre":"Psychedelics / Trauma","monthKey":"2026-11","publishedAt":"2026-11-15T00:27:04Z","source":"OSF Preprints","summaryHtml":"社交不安症に対するMDMA支援療法（MDMA-AT）の体験を質的に調べた初めての研究。2回のMDMAセッションを受けた参加者20人に半構造化インタビューを行い、治療的利益に寄与したと感じられた側面を反省的テーマ分析で抽出した。<br><br>5つのテーマが得られた。困難な体験に穏やかに向き合うことで癒しが進むこと（自己批判から好奇心と慈しみへ、感情へのアクセスと処理の向上）、自己と他者への広がった視点による意味づけ（苦悩の起源の明確化、本来の自己の理解、つながりと一体感）、身体化された状態を通じた頭の理解から体感の知への移行（感情の体験と解放、自分とともに安心していられる感覚）、脆弱な自己表現を通じた新しい関係パターンの学習、MDMA体験が継続的な自己発見の拠り所になること。<br><br>参加者は、安全な治療的枠組みの中でのMDMAが、感情と向き合い深く感じ身体で味わうことを促し、新たな洞察と癒しを触媒したと感じていた。自分自身や他者とよりつながり安心できることで、関係の中で本来の自分として現れる意欲が高まったという。出典：OSF Preprints","timestamp":1794702424000,"title":"MDMA-Assisted Therapy for Social Anxiety Disorder: A Qualitative Analysis of Patient Experiences of Change","titleJa":"MDMA支援療法は社交不安に何をもたらすか――患者20人の語りから見えた変化の5テーマ","url":"https://osf.io/preprints/psyarxiv/7kx2p_v1/"},{"authors":["Sophia R Ottofaro","Jessica L Maltman","Javier González-Maeso"],"categories":[],"field":"Neuroscience Letters","genre":"Psychedelics / Trauma","monthKey":"2026-11","publishedAt":"2026-11-15T00:00:00Z","source":"PubMed","summaryHtml":"トラウマ体験は、特定の恐怖記憶だけでなく、新しい刺激への過敏さや中立的な場面での持続的な防衛状態といった、非連合的な変化を残す。セロトニン系サイケデリクスであるシロシビンは、連合的な恐怖の消去を促すことが知られていたが、トラウマ後の非連合的なストレス適応にどう働くかは分かっていなかった。本研究は、文脈的な恐怖想起とストレス感受性・感作を同じ個体で分離して測れるマウスの行動パラダイムを作った。<br><br>雄のC57BL/6Jマウスに急性の足ショックを与え、トラウマ想起を評価したのちシロシビン1mg/kgまたは溶媒を投与し、新しい音刺激と新しい文脈への反応を調べた。トラウマを受けたマウスは強い連合的恐怖と、新しい音へのすくみ増加を示したが、シロシビンはこの刺激誘発性の反応を有意に変えなかった。<br><br>一方、刺激のない新しい文脈での持続的なすくみ（ストレス感作）には、経験依存の両方向の効果が出た。非トラウマ群ではすくみが減ったが、トラウマ群では増えた。シロシビンはトラウマ関連行動を一律に弱めるのではなく、経験に応じて非連合的な防衛反応を調節する。サイケデリクスによる可塑性が、条件によっては潜在的なトラウマ状態を増幅しうることを示す。出典：PubMed","timestamp":1794700800000,"title":"Prior trauma shapes the effects of psilocybin on stress sensitization in mice.","titleJa":"トラウマの有無でシロシビンの効果は逆転する――マウスで見えたストレス感作への両方向作用","url":"https://pubmed.ncbi.nlm.nih.gov/42767398/"},{"authors":["Shaila Islam Nipa"],"categories":[],"field":"Philosophy and Progress","genre":"Consciousness / Philosophy","monthKey":"2026-11","publishedAt":"2026-11-15T00:00:00Z","source":"Crossref","summaryHtml":"自己を知るとはどういうことか。文明の始まりから人間の心の中心的な問いであり続けてきた自己意識の本性を、サルトル、シャンカラ、アヴィケンナ（イブン・シーナー）の3人の哲学者の視点から比較する論文。実存主義、アドヴァイタ・ヴェーダーンタ、イスラーム哲学という異なる伝統が、自己をどう理解してきたかをたどる。<br><br>サルトルは自己意識を選択・責任・絶対的自由の観点から捉える。シャンカラは自己意識をアートマンとブラフマンの非二元性・一体性の自覚とし、解脱への道と結びつける。イブン・シーナーは、身体から独立した魂の内在的な自己認識として自己意識を説明する。質的・概念的な手法で3者の解釈を深く読み解き、共通点と相違点を比較する。<br><br>3人の洞察を並べる比較分析はこれまであまり行われてこなかったという。現代の物質主義的な世界で人間の意識を理解するうえでの意義も検討し、自己意識の涵養が自己実現や倫理的責任、有意義な関係に結びつくと論じる。3人の思想を横断することで、自己意識が単なる自己観察ではなく、生き方そのものを方向づける働きであることが浮かび上がる。出典：Crossref","timestamp":1794700800000,"title":"The Nature of Self-Consciousness: Exploration through Sartre, Shankaracharya and Sina","titleJa":"自己意識とは何か――サルトル、シャンカラ、アヴィケンナが語る自己の本性","url":"https://doi.org/10.3329/pp.v75i1.93271"},{"authors":["Patrizio Tressoldi"],"categories":[],"field":"PsyArXiv","genre":"Consciousness / Philosophy","monthKey":"2026-11","publishedAt":"2026-11-15T00:00:00Z","source":"OSF Preprints","summaryHtml":"臨死体験は心停止や昏睡など生命の危機にともなって語られることが多いが、失神や深い瞑想、催眠、サイケデリクス状態など、生命の脅威がない場面でもよく似た体験が報告される。本総説は、こうした「臨死様体験」と本物の臨死体験とで、体験の内容や心理的な特徴、その後の変化に違いがあるのかを検証した。<br><br>最大規模の回顧調査、混合法のオンライン研究、同一人物内でのサイケデリクス比較を横断した結果、中核的な特徴は文脈を越えて広く重なっていた。一方で、亡くなった人や霊的存在との遭遇は臨死体験の34.7%にみられたのに対し、臨死様体験25例では0件で、人生回顧や「引き返せない地点」も臨死体験にのみ現れた単一事例があった。<br><br>ただし等価性を検証するよう設計された研究はなく、対象は自己選択的で回顧的、測定の等価性も未検証のため、両者が同一だと結論づけるのは早い。著者らは神経生理学的・心理学的・進化的・形而上学的な解釈への含意を整理し、前向きで事前登録された十分な規模の研究を今後の課題に挙げる。出典：OSF Preprints","timestamp":1794700800000,"title":"Near-Death Experiences and Near-Death-Like Experiences: A Comparative Synthesis and Implications for Their Interpretation","titleJa":"臨死体験と臨死様体験はどこが違うのか――現象・心理・後遺効果の比較統合","url":"https://osf.io/preprints/psyarxiv/tu64g_v1/"},{"authors":["Jiaju Justin Yan","Xiaqing Nancy He","Alan Boss"],"categories":[],"field":"SocArXiv","genre":"Other","monthKey":"2026-11","publishedAt":"2026-11-14T23:11:31Z","source":"OSF Preprints","summaryHtml":"起業家は苦境にある事業を続けるかどうかの判断でAIに頼るようになった。だが粘り強さの理論は、その要因を起業家本人の内面か人間同士のネットワークに求めてきた。本論文はAIを、人間ではない第三の要因として位置づける理論枠組みを提示する。心理的資源アプローチやエスカレーション理論、閾値理論、AI起業エージェンシー枠組みを土台に、二つの経路を区別する。<br><br>資源経路では、AIが心理的資源を補い、粘り強さの強度を高め、起業家自身の内的資源への依存を緩める。認識経路では、AIが判断の土台となるフィードバックそのものを形づくり、反証的な証拠への応答性として定義される「粘り強さの較正」を左右する。5つの命題は、二つの経路が組み合わさってAIによるエスカレーション増幅が生じる条件や、不確実性が自信と較正の乖離を広げる仕組み、エージェンシー型AIが逆境と向き合う決断の場面を減らす過程を具体化する。<br><br>時間的な拡張として、持続的なAIの支えが粘り強さをもろくする可能性も論じる。AIをめぐる楽観論と悲観論の双方を調停し、小規模事業主や助言者、AI設計者に向けた検証可能な示唆を提示する。起業の現場でAIが「続ける力」をどう変えるかを考えるための枠組みである。出典：OSF Preprints","timestamp":1794697891000,"title":"Keep on Keeping On, With a Machine: Artificial Intelligence and the Calibration of Entrepreneurial Persistence","titleJa":"AIに相談して続けるかやめるか――起業家の「粘り強さ」をAIがどう変えるか","url":"https://osf.io/preprints/socarxiv/gtd4z_v1/"},{"authors":["Tonglin Yan","Jules Tsukahara","Kenneth Williford","David Rudrauf","Grégoire Sergeant-Perthuis"],"categories":[],"field":"Biological Cybernetics","genre":"Consciousness / Philosophy","monthKey":"2026-11","publishedAt":"2026-11-14T00:00:00Z","source":"Crossref","summaryHtml":"意識の主要理論――統合情報理論（IIT）、グローバル・ワークスペース理論（GWT）、能動的推論（AIF）、高次表象（HOR）、射影意識モデル（PCM）――は、それぞれ異なる数学的言葉で語られ、互いに通じ合わないものと見なされがちだった。本論文は確率論・情報理論・幾何学にもとづく共通の数学的言語で5理論を書き直し、マー（Marr）の階層に沿って計算論とアルゴリズムの水準で厳密に比較する。<br><br>比較から各理論の力点が浮かび上がる。GWTは情報の全体への開放性、IITは還元不能な因果的統合、AIFとHORは不確実性の下での階層的推論と意識的アクセス、PCMは意識経験における視点の幾何学を重視する。理論間の見かけの対立の多くは直接の矛盾ではなく、説明する水準の違いによるものだと論じられる。<br><br>著者らは統合・放送・高次アクセス・視点変換を同じエージェント構造の中で調べられる共通テストベッドを提案し、理論の重なりや食い違い、経験的含意をより体系的に比較する道筋を示す。意識科学におけるモデル比較を一段と厳密にする試みである。出典：Crossref","timestamp":1794614400000,"title":"Formalizing consciousness: a comparative mathematical analysis of leading theories","titleJa":"意識の数理化――主要5理論を共通の数学言語で比較する","url":"https://doi.org/10.1007/s00422-026-01068-y"},{"authors":["Joshua A. Brown","Yijia Ma","Yifan Wang","John J. Massa","Peter Kuan-Hao Cheng","Chaowen Chen","Mingzhou Ding","Norman B. Schmidt","Mohammed R. Milad","Jair C. Soares","Raymond J. Dolan","Chenyu You","Wen Li"],"categories":[],"field":"Nature Communications","genre":"Neuroscience","monthKey":"2026-11","publishedAt":"2026-11-14T00:00:00Z","source":"Nature Communications","summaryHtml":"一時的な脅威が、なぜ消えない恐怖の記憶になるのか。感覚野は従来、刺激の特徴を受け取るだけの受動的な部位とみなされてきたが、近年は恐怖処理にも積極的に関わることが分かってきた。本研究は、高精細α波経頭蓋交流電気刺激とEEG-fMRI同時計測、トランスフォーマーによる神経デコーディングを組み合わせ、恐怖条件づけ後の記憶形成・固定・長期保持を15分後、24時間後、7日後にわたって追跡した。<br><br>記憶の痕跡は3回の評価すべてで確認され、刺激後40〜60ミリ秒という早期の感覚段階から始まり、視覚野と辺縁系に分布していた。条件づけにより後頭部のα波脱同期（視覚野の脱抑制の指標）が強まり、それが長期記憶痕跡の強さを予測した。さらに早期視覚野へのα波刺激で視覚野を抑制すると、条件づけによるα脱同期が消失し、恐怖記憶の固定と保持が選択的に阻害された一方、最初の獲得は保たれた。<br><br>感覚野の脱抑制がヒトの長期恐怖記憶に必要な仕組みであることが示され、早期感覚野が一過性の恐怖体験を持続する記憶へ変える要所であること、非侵襲的な脳刺激でその過程に介入できる可能性が開かれた。不安やトラウマ関連障害の治療への応用が期待される。出典：Nature Communications","timestamp":1794614400000,"title":"Sensory cortical disinhibition underlies long-term fear memory in humans","titleJa":"恐怖の記憶は感覚野から生まれる――視覚野の脱抑制が長期記憶を形づくる","url":"https://www.nature.com/articles/s41467-026-79372-1"},{"authors":["Lynn V. Monrouxe"],"categories":[],"field":"Advances in Health Sciences Education","genre":"Ethics / Safety","monthKey":"2026-11","publishedAt":"2026-11-14T00:00:00Z","source":"Crossref","summaryHtml":"生成AIは学術不正の新しい形を生んだのではない。著者は、もっとも取り締まりの緩かった不正――手抜き――が、生き延びるための3つの性質を奪われたのだと論じる。手抜きは努力と結びつき、1本の論文に収まり、怠慢な誰かのものとして帰属できた。流暢な文章は偽るのにコストがかかったため「正直なシグナル」であり、査読の仕組みはそのコストの上に築かれていた。生成AIはそのシグナルを壊した。<br><br>壊れたのはそれだけではない。証拠の連鎖も損なわれている。捏造された主張が、実在する出典に結びつけて一度引用されることで、参照照合ではたどれないのに来歴を獲得する「引用ロンダリング」が起きる。医療専門職教育の研究では、読んでいない文献を引用したと認める著者もおり、生成AIの利用申告はほぼ未較正の道具だという。総合研究が指針を作り、指針がカリキュラムを作るため、捏造された主張はプロンプトから臨床のベッドサイドで教えられる内容へと伝わりうる。<br><br>査読の現場は検証を担う仕組みをもたず、責任はしばしば装備の乏しい査読者に押しつけられる。著者は、認知的な努力を書く行為から、意図を証明するのではなく実践を記述する、意図的な判断の行為へ移すべきだと結論づける。本論文自体も生成AIを使って作られ、努力と範囲と帰属を取り戻す開示の実例として提示されている。出典：Crossref","timestamp":1794614400000,"title":"A fair amount of slop: generative artificial intelligence and carelessness made cheap, unbounded and unattributable","titleJa":"かなりのスロップ――生成AIが「手抜き」を安く、際限なく、無署名にした","url":"https://doi.org/10.1007/s10459-026-10600-5"},{"authors":["Melissa G Zandstra","Metten Somers","Milou Angevaare","Tom Birkenhager","Birit F P Broekman","Rieky Dikmans","Philip van Eijndhoven","Milou A van Eldik","Eric van Exel","Frank L Gerritse","Johanna M Hegeman","Willemijn Heijnen","Rob M Kok","Dore Loef","Roel J T Mocking","Jasper O Nuninga","Mardien L Oudega","Didi Rhebergen","Jordy Rovers","Bart P F Rutten","Bart Schut","Iris E Sommer","Indira Tendolkar","Esmée Verwijk","Hanneke van Welie","Annemiek Dols","Floortje E Scheepers","Edwin van Dellen"],"categories":[],"field":"Journal of Affective Disorders","genre":"Neuroscience","monthKey":"2026-11","publishedAt":"2026-11-14T00:00:00Z","source":"PubMed","summaryHtml":"電気けいれん療法（ECT）は重症うつ病に有効だが、寛解しない例もあり、認知の副作用も懸念される。全体の重症度だけでなく、個々の抑うつ症状が予後を予測する手がかりになる可能性がある。オランダECTコンソーシアムの多施設コホートで、ハミルトンうつ病評価尺度とMADRSから統合した7症状について、ネットワーク解析で寛解（792人）と認知副作用（100人）との関連を調べた。<br><br>自殺念慮は寛解の確率低下（オッズ比0.77）と認知副作用の確率上昇（同1.34）の両方と関連し、ブートストラップでも頑健だった。食欲低下は寛解の確率上昇と、緊張・不安は認知副作用の上昇とそれぞれ関連した。既知の臨床予測因子の調整、別の寛解定義、多変量ロジスティック回帰による感度分析でも、自殺念慮と両転帰の関連、および緊張・不安と認知副作用の関連は支持された。<br><br>治療前の個々の症状がECTの転帰を予測しうることが示された。特に自殺念慮のある患者では、治療効果と副作用の両面で注意深いモニタリングと説明が重要になるという。出典：PubMed","timestamp":1794614400000,"title":"Baseline suicidal thoughts are associated with ECT non-remission and cognitive side effects: A network outcome analysis.","titleJa":"自殺念慮があるとECTは効きにくく副作用も多い――うつ病792人の多施設データが示す症状別の予後","url":"https://pubmed.ncbi.nlm.nih.gov/43033988/"},{"authors":["Roberto De Filippo"],"categories":[],"field":"Psychedelic medicine (New Rochelle, N.Y.)","genre":"Psychedelics / Trauma","monthKey":"2026-11","publishedAt":"2026-11-14T00:00:00Z","source":"PubMed","summaryHtml":"1950年代半ば、統合失調症治療薬クロルプロマジンがLSDの主観的効果を部分的に打ち消すことが臨床で観察された。本論考は、その出発点となった1955年のジベルティとグレゴレッティによる研究を初めて英訳し、忘れられた知見を掘り起こす。当時の並行する研究には、CIAのMKULTRA計画による倫理的に問題のある人体実験も含まれていたが、薬理学的な遮断そのものは複数の筋から確認されていた。<br><br>1970年代のサイケデリクス研究の抑圧により、この薬物相互作用の知見は文献から切り離され、仕組みの説明もないまま孤立した臨床的事実として数十年放置された。現代の神経薬理学は、クロルプロマジンがLSDの主要な分子標的である5-HT2A受容体のアンタゴニストとして働くことを明らかにしている。<br><br>受容体レベルの知識が、半世紀以上前の臨床的洞察を裏づけ、説明を与えたことになる。「解毒剤」の探索という古い問いが、受容体薬理学の言葉でようやく答えを得た例でもある。サイケデリクス研究の歴史に埋もれた知見を再評価し、過去の観察が現代の理解とどう接続するかを示す一編である。出典：PubMed","timestamp":1794614400000,"title":"The Forgotten Search for an LSD \"Antidote\".","titleJa":"LSDの「解毒剤」を求めた忘れられた探索――1955年の臨床知見と5-HT2A受容体","url":"https://pubmed.ncbi.nlm.nih.gov/43036336/"},{"authors":["Jeffrey D Johnson"],"categories":[],"field":"PsyArXiv","genre":"Neuroscience","monthKey":"2026-11","publishedAt":"2026-11-13T19:09:50Z","source":"OSF Preprints","summaryHtml":"エピソード記憶は、出来事内の刺激同士や出来事と時空間文脈との結びつきで成り立ち、想起の探索を導く。関係記憶の神経基盤は広く調べられてきたが、連続する出来事の結びつきや、過去の時間の表象に想起がどう依存するかは十分に分かっていなかった。時間に沿った記憶の移動そのものが、脳内でどう表されているのかが問いだった。順方向と逆方向では、同じ記憶をたどる経路が違うはずである。<br><br>本研究は、単語リスト学習で直後の単語を思い出す順方向想起と、直前の単語を思い出す逆方向想起を、行動と脳波で直接比べた。想起の直前に記録した頭皮脳波を多変量パターン分類で解析し、熟慮と探索に関わる神経活動を区別した。手がかり語から次・前の単語を思い出す課題である。<br><br>行動成績をそろえても、高周波のガンマ帯振動が順方向と逆方向の想起を区別することが示された。時間の方向が記憶探索の神経動態に刻まれている証拠であり、系列想起や自由想起、過去と未来の時間表象の研究にもつながる。記憶の時間的な向きが脳波に表れるという新しい知見である。出典：OSF Preprints","timestamp":1794596990000,"title":"Traveling back and forth through time: oscillatory brain patterns distinguish directional cued recall","titleJa":"時間を往復する脳――順方向と逆方向の想起を分けるガンマ波","url":"https://osf.io/preprints/psyarxiv/v5w3f_v1/"},{"authors":["Tony H. Zhang","Connor Mattson","Daniel S. Brown"],"categories":["cs.AI","cs.MA"],"field":"cs.AI","genre":"Agents / Robotics","monthKey":"2026-11","publishedAt":"2026-11-13T18:50:05Z","source":"arXiv","summaryHtml":"実演は単体エージェントの強化学習を加速する有効な手段だが、マルチエージェント強化学習への拡張は容易ではない。1人の実演者が複数のエージェントを同時に遠隔操作することは難しく、しばしば不可能だからだ。ラウンドロビン行動クローニング（R2BC）は、実演者が一度に1体を操作し、他のエージェントは現在の方策で動かすことでこの問題に対処する。しかし得られる模倣方策は、実演の質に縛られるという限界があった。<br><br>本研究は、単体向けの模倣ブートストラップ強化学習（IBRL）を協調チームへ拡張した「IBMARL」を提案する。各時刻、各エージェントは模倣方策と強化学習方策の2つの行動提案を受け、中央集権的な批評家のアンサンブルがその組み合わせを選ぶ。ゲート付き模倣ペナルティとソフトなQフィルタ行動クローニング損失により、強化学習方策は批評家が模倣行動を高く評価する場面でのみ模倣方策へ引き寄せられる。学習後は各エージェントが強化学習方策だけで動き、中央の批評家は不要になる。<br><br>4つの協調マルチエージェント・ベンチマークでの評価では、IBMARLは2つのタスクで実演ベースのベースラインより2.6〜4.2倍速く模倣方策を上回り、残る2つのタスクでも唯一それを上回った。4タスク中2つでは実演者自身をも超えた。実際の人間の実演を用いた場合も、模倣学習単独を上回り、最良のベースラインの2倍以上の速さで達成した。出典：arXiv","timestamp":1794595805000,"title":"Imitation Bootstrapped Multi-Agent Reinforcement Learning","titleJa":"実演から学ぶマルチエージェント強化学習――IBMARL","url":"https://arxiv.org/abs/2611.18543"},{"authors":["Wang Ma","Debarun Bhattacharjya","Junkyu Lee","Nhan H Pham","Harsha Kokel","Qiang Ji"],"categories":["cs.LG","cs.AI"],"field":"cs.LG","genre":"LLM / NLP","monthKey":"2026-11","publishedAt":"2026-11-13T17:26:39Z","source":"arXiv","summaryHtml":"大規模言語モデル（LLM）を信頼して使うには、プロンプト自体の曖昧さに由来する不確実性と、モデルの知識不足に由来する不確実性を区別して測る必要がある。ベイズ手法や深層アンサンブルは原理的にはこの分解を与えられるが、LLMの規模では計算コストが高すぎ、ホワイトボックスでのアクセスも必要になる。一方、既存のブラックボックス手法は1つのスカラー値にまとめてしまい、この区別ができない。<br><br>本研究はこの隔たりを埋める2層アンサンブルを提案する。固定したプロンプトの確率的デコードを内側のアンサンブルとし、意味を保ったままプロンプトを摂動させたものを外側のアンサンブルとする。変動を連続的な埋め込み空間で測り、全共分散の法則によって偶然的不確実性と認識的不確実性へと正確に分解する。ブラックボックスでのサンプリングだけで済む。さらに有限標本バイアスの恒等式、ベイズ的な橋渡し、整合性だけの手法では検出できない失敗モードの分離という3つの理論的結果で枠組みを裏づけた。<br><br>5つの短答QAベンチマークと、2ファミリー・2規模にわたる4つの指示チューニング済みLLMでの評価では、強力なホワイトボックスのベースラインと競合し、同じ生成予算では主要なブラックボックス手法と誤りランキングで並びながら不確実性の分解も実現した。制御された介入実験では、2種の不確実性がプロンプトの曖昧さとモデルの知識不足という別々の失敗要因に選択的に反応した。長文の試験では請求レベルの事実性にも再学習なしで拡張できることを示した。出典：arXiv","timestamp":1794590799000,"title":"Black-Box Uncertainty Quantification for Large Language Models via Ensemble-of-Ensembles","titleJa":"ブラックボックスでも不確実性を測る――LLMの不確実性定量化","url":"https://arxiv.org/abs/2611.18453"},{"authors":["Run Luo","Kuan Zhang","Qi Deng","Yukun Chen","Zhihao Yang","Yufei Zhang","Renrong Hu","Yi Zhang","Guiyu Ma","Tianyu Fan","Longze Chen","Hao Sun","Jiaming Li","Jiaming Yang","Xiaohao Liu","Tao Tan","Minzheng Wang","Hangtian Jia","Shuai Yuan","Lvdi Wang","Xiao Liu","Chao Ma","Yuting Zou","Yinhe Zheng","Xiaobo Xia","Dawei Jiang","Shaoqing Ren"],"categories":["cs.CL","cs.AI","cs.CV"],"field":"cs.CL","genre":"Agents / Robotics","monthKey":"2026-11","publishedAt":"2026-11-13T16:39:30Z","source":"arXiv","summaryHtml":"複雑な対話環境で長期のタスクをこなす汎用エージェント「Gamer」を提案する。知覚、記憶管理、多段階の推論を一体化したエンドツーエンドのアーキテクチャで、従来の2Dグラフィカル・インターフェースと複雑な3Dシミュレーション世界の両方とやり取りできる。まず数万時間分のキーボード・マウス操作の軌跡で継続事前学習を行い、シミュレーション・ゲームと身体化環境の双方から環境のダイナミクスを学ばせた。<br><br>冗長な計算を減らしながら複雑な判断に必要な推論を保つ「スパース思考」による指示チューニングを施し、長期の対話向けに安定した多ターン強化学習で方策を訓練した。有限のコンテキストウィンドウ、蓄積するロールアウト誤差、疎な報酬という課題に対処している。リアルタイムの対話にはクラウド・エッジ推論エンジンを用い、多数のシミュレーション環境を並行して動かし、無制限のコンテキスト実行を支えながらオンライン推論の遅延を抑えた。<br><br>複数の難易度の高い3Dオープンワールド・ゲームで、熟練プレイヤーに匹敵する汎化性能と運用効率を示し、従来の2Dゲーム・ベンチマークでも競争力のある結果を出した。繰り返しのキーボード・マウス軌跡からでも、データと学習アルゴリズムのスケーリングで大きな性能向上が得られることを示唆する。デジタルと物理の両方の性質を持つ環境で複雑なスキルを着実に学ぶ、汎用エージェントへの道筋を提示する。出典：arXiv","timestamp":1794587970000,"title":"Gamer: A Generalist Vision-Language-Action Foundation Model for Long-Horizon Real-Time Game Agent","titleJa":"ゲームを極める汎用エージェント――視覚・言語・行動の基盤モデルGamer","url":"https://arxiv.org/abs/2611.18397"},{"authors":["Irma Irayanti","Muhammad Dzaky Asrun","Salfira Az Zahra"],"categories":[],"field":"Journal of Applied Research in Higher Education","genre":"Ethics / Safety","monthKey":"2026-11","publishedAt":"2026-11-13T00:00:00Z","source":"Crossref","summaryHtml":"インドネシアのイスラーム大学で、持続可能性を環境管理や技術的な課題としてではなく、市民としての責任や公共の倫理、道徳的リーダーシップの問題としてどう位置づけ、実践しているかを調べた研究である。生態学的市民性、エコ神学にもとづく公共倫理、持続可能性を志向する学びが、大学のなかでどのように交渉されているかを問う。<br><br>2026年2月から5月にかけて、同大学で半構造化インタビュー、文書分析、限定的な授業観察を実施した。教員、持続可能性・教育の専門家、市民・持続可能性学習に関わる学部生ら18人が参加し、反射的テーマ分析で検討した。結果は三つの主題に整理された。第一に、持続可能性は環境管理ではなく、市民性や社会正義、集合的な説明責任と結びついた倫理的・公共的な責任として解釈されていた。第二に、対話的で参加型の学びを通じて、生態学的市民性とエコ神学の視点が教育的に意味を持ち、持続可能性志向の教授法の革新として機能していた。第三に、カリキュラムへの統合が断片的で制度的な制約や象徴的な取り組みにとどまり、大学内の変革はまだら模様だった。<br><br>著者らは、持続可能性の学びを強めるには、生態学的な問題を各科目の学習成果と結びつけ、地元の事例や構造化された議論、参加型の課題でエコ神学的な責任と市民的判断をつなぐことが有効だと示唆する。環境への配慮を宗教的な責任と公共の関心の両方として語る学びが、学生に社会正義や集合的責任とともに生態問題を考える機会を与えた。ただし一大学・18人という質的研究であり、授業での議論が持続的な市民参加につながるかは未検証だとする。技術中心の持続可能性の枠組みに、道徳的・公共的な視点を対置する論考である。","timestamp":1794528000000,"title":"Reimagining higher education through ecological citizenship and eco-theology: sustainability, public ethics and moral leadership in an Indonesian Islamic university","titleJa":"生態学的市民性とエコ神学で高等教育を再考する――インドネシアのイスラーム大学における持続可能性と公共倫理","url":"https://doi.org/10.1108/jarhe-05-2026-0886"},{"authors":["Bart A. Ellenbroek","Beth Naylor","Jiun Youn"],"categories":[],"field":"Behavioural Pharmacology","genre":"Psychedelics / Trauma","monthKey":"2026-11","publishedAt":"2026-11-13T00:00:00Z","source":"Crossref","summaryHtml":"シロシビンの治療効果は、急性の薬理作用そのものではなく神経可塑性の増強によると考えられているが、その根本的な仕組みは十分に解明されていない。本研究は、再生能力で知られる扁形動物プラナリアをモデルに、シロシビンが連合学習を高めるかどうかを条件性場所嗜好パラダイムで検証した。<br><br>5µMのシロシビンに1回曝露した後、光とショ糖を組み合わせる条件づけを5日間行ったところ、シロシビン投与群は対照群より光への嗜好の変化が有意に大きく、その効果は投与から少なくとも6日間持続した。無脊椎動物でもシロシビンが報酬連合学習を高めることが示された。<br><br>著者らは、サイケデリックによる神経可塑性が進化的に保存されたセロトニン作動性の仕組みを通じて働くという仮説を支持すると結論づける。プラナリアは神経系が単純でありながらセロトニン系を備えるため、薬物の学習への作用を切り分けて調べるモデルとして有用だとされる。ただしプラナリアという単純なモデルでの結果であり、ヒトの治療効果へ直接外挿するには注意が必要だとする。ヒトの臨床効果の神経基盤を考えるうえでの基礎的な知見である。","timestamp":1794528000000,"title":"Psilocybin enhances conditioned place preference learning in planarians","titleJa":"シロシビンがプラナリアの場所―報酬連合学習を高める――神経可塑性の進化的保存性を示す実験","url":"https://doi.org/10.1097/fbp.0000000000000903"},{"authors":["David Porter"],"categories":[],"field":"Frontiers in Psychology","genre":"Consciousness / Philosophy","monthKey":"2026-11","publishedAt":"2026-11-13T00:00:00Z","source":"Crossref","summaryHtml":"人間の意識はつねに逆説のなかにある。統一と分裂、自己と世界、意味と死を同時に意識すること――それが意識の常態であるにもかかわらず、心理学は逆説を存在の構造ではなく認知の葛藤として扱ってきた。本論文は「単一の二重性モデル(SDM)」を提唱し、意識を統合と分化のあいだで振動する自己反省的な場として捉え直す。不安、アイデンティティ、意味、超越といった心理現象はすべて、全体性と分離のあいだの再帰的な動きから生まれるという。<br><br>このモデルを臨床に翻訳したのが「逆説療法(PT)」である。相反する体験を解決も抑圧もせず、意識的に抱え込む「逆説の居住」を中心に据える。SDMは哲学・神学・心理療法における逆説の文献のなかに位置づけられ、ユングの超越機能やリネハンの弁証法的統合といった既存モデルと対比される。逆説を治療の障害ではなく、体験の存在論的な核心として捉え直す点が新しい。<br><br>SDMとPTは、人間の発達、苦しみ、変容を理解するための統一的な言語を提供する。理論心理学、実存的現象学、意識研究のあいだに橋を架け、21世紀の意味づけのための枠組みを更新しようとする試みである。逆説を解消すべき問題ではなく、意識そのものの働きとして受け止める視点は、不安やアイデンティティの揺らぎを理解する手がかりになるだろう。出典：Crossref","timestamp":1794528000000,"title":"The singular duality model: paradox, consciousness, and the foundations of psychological integration","titleJa":"単一の二重性モデル――逆説、意識、そして心理的統合の基盤","url":"https://doi.org/10.3389/fpsyg.2026.1737145"},{"authors":["Henry Pollard"],"categories":[],"field":"Frontiers in Research Metrics and Analytics","genre":"Ethics / Safety","monthKey":"2026-11","publishedAt":"2026-11-13T00:00:00Z","source":"Crossref","summaryHtml":"AIは研究の連絡・支援の域を越え、結果を左右する研究機能そのものを担い始めている。だがガバナンスは、利用後の開示に注目しがちで、委譲するかどうかの事前の判断には目が向いていない。本論文は、定義された研究機能をAIに委ねるべきか、いつ、どのような統制の下で委ねるかを事前に判断するための「12の関門」からなる委譲・リスク管理枠組みを提案する。<br><br>枠組みはAI・機能・文脈の具体的な組み合わせを評価し、目的、許可、課題の定義を、固有のリスク、課題固有の妥当性、信頼性、人間の統制、統制の有効性、残余リスク、出所、報告、説明責任へと結びつける。中心的な区別は「支援」と「委譲」である。委譲とは、AIが本来は独立した人間の判断を要する機能を果たすか、重大な研究判断を実質的に決定する場合を指す。<br><br>委譲そのものをガバナンスの判断として扱い、証拠と統制をリスクに見合ったものにする姿勢は、提案評価や機関ガバナンス、監視設計といった既存の枠組みを補う。AI研究ノートによる出所の記録や、AIによる誤り監視と外部検証の区別も具体化した。研究者、機関、編集者、ガバナンス機関がどこまで任せてよいかを決める実践的な指針になる。出典：Crossref","timestamp":1794528000000,"title":"Delegating research functions to artificial intelligence: a risk-control framework for validation, human control and accountability","titleJa":"研究機能のAIへの委譲――検証・人間の統制・説明責任のためのリスク管理枠組み","url":"https://doi.org/10.3389/frma.2026.1994953"},{"authors":["Alexander Maier"],"categories":[],"field":"OSF Preprints","genre":"Consciousness / Philosophy","monthKey":"2026-11","publishedAt":"2026-11-13T00:00:00Z","source":"Crossref","summaryHtml":"意識の神経科学の最終的な目標は、意識体験（クオリア）とそれを支える脳状態の関係を導き出すことだ。意識の神経相関（NCC）を特定することや、意識体験の構造を記述することだけでは足りず、特定の神経状態や神経メカニズムと特定の意識体験を結びつける必要がある。科学における二つの現象の関係づけは、しばしば数式のような数学的写像の形をとる。本論文は、意識状態と脳状態の間にも同じような写像が存在しうるという展望のもと、関連する実証研究を整理する。<br><br>レビューはまず、神経のスパイク活動を意識内容へ写像する研究を概観する。意識の「橋渡し地点」としてのNCCを探す先駆的なパラダイムと、心理測定関数と神経測定関数を結びつける「橋渡し法則」を探すパラダイムを対比する。さらに、意識体験の構造記述と神経活動の構造記述を写像によって結ぶ試みが、両方のパラダイムをどのように補強するかを検討する。<br><br>意識研究を「相関の発見」から「法則の定式化」へ進めるための枠組みを提示するもので、クオリアと脳状態の対応関係を数学的に記述する道筋を示している。出典：Crossref","timestamp":1794528000000,"title":"Mathematical Relationships Between Brains and Consciousness","titleJa":"脳と意識の数学的関係――クオリアと脳状態を結ぶ写像を求めて","url":"https://doi.org/10.31234/osf.io/k46ad"},{"authors":["Najma Cherrad","Georgios Foustoukos","Laura MJ Fernandez","Alejandro Osorio-Forero","Julie Buron","Nadine Eliasson","Yann Emmenegger","Paola Milanese","João Pedro Ferreira Morais","Virginie Mansuy-Aubert","Paul Franken","Anita Lüthi"],"categories":[],"field":"Nature Communications","genre":"Neuroscience","monthKey":"2026-11","publishedAt":"2026-11-13T00:00:00Z","source":"Nature Communications","summaryHtml":"副交感神経の活動は回復的な睡眠に欠かせないが、迷走神経の感覚性求心路が睡眠と覚醒の脳・身体相関をどう形づくるかは未解明だった。本研究はマウスで迷走神経感覚ニューロン（VSN）を化学遺伝学的に刺激し、脳波・筋電図、心拍数、脳・身体温、ノルアドレナリン作動性の青斑核（LC）ニューロン集団の活動を同時に計測した。<br><br>休息期のVSN刺激は、徐波（0.75〜4 Hz）成分に富み恒常性に制御されたノンレム睡眠様状態を誘発し、レム睡眠を抑制した。同時に脳・身体温は低下したのに、LC活動は上昇した。外部から温めると正常なノンレム・レム睡眠サイクルへの回復が加速し、体温低下が重要な寄与因子であることが分かった。<br><br>睡眠様の脳波・徐脈・体温低下と、覚醒を促す前脳へのノルアドレナリン調節が共存するという、従来は両立しないとされた睡眠と覚醒の特徴が一つの状態に現れることを示した。睡眠と覚醒を分ける境界が末梢からの信号によって揺らぐことを示し、意識状態の制御における身体からの入力の重要性を裏づける成果である。出典：Nature Communications","timestamp":1794528000000,"title":"Vagal afferent activation induces a dissociated NREM sleep-like state with wake-related locus coeruleus activity","titleJa":"迷走神経の活性化がもたらす解離したノンレム睡眠様状態――眠りながら覚醒する脳","url":"https://www.nature.com/articles/s41467-026-79135-y"},{"authors":["Gaetano Rametta"],"categories":[],"field":"Nóema","genre":"Consciousness / Philosophy","monthKey":"2026-11","publishedAt":"2026-11-13T00:00:00Z","source":"Crossref","summaryHtml":"意識と意味（センス）の関係は、ドゥルーズの超越論的哲学における中心問題の一つである。『意味の論理学』を手がかりに、特異性・意味・出来事の概念が、非人称的で前個体的な超越論的場の基盤として検討される。フッサールの現象学と、サルトル『自我の超越』における意識論との対話を通じて、この構想が問い直される。論文は、超越論的な場を自我の座ではなく、意味と出来事の生成の場として捉え直す。<br><br>ドゥルーズの読みでは、意識への訴えはつねに超越論的自我の存在を前提するとされる。だが本論文は、フッサールの『論理学研究』第5研究と若きサルトルの再読により、意識を自我とは別のものとしてではなく、自己組織化する非人称的な場として考える道を開く。自我なき意識という構想である。<br><br>そこから浮かび上がるのは、内在の原理を捨てることなく意識を位置づける、超越論的場の別の構想である。意識を主観の所有物ではなく、出来事と意味が織りなす場そのものとして捉え直す試みであり、心の哲学と現象学の接点に重要な新たな視点を与える。出典：Crossref","timestamp":1794528000000,"title":"Between Consciousness and Sense","titleJa":"意識と意味のあいだ――ドゥルーズの超越論的場を問い直す","url":"https://doi.org/10.54103/2239-5474/32766"},{"authors":["Lana K. Porter","Ece Kaya","Kamlesh Chalise","Janina Klarmann","Armin Goffin","Muad Abd El Hay"],"categories":[],"field":"bioRxiv","genre":"Psychedelics / Trauma","monthKey":"2026-11","publishedAt":"2026-11-13T00:00:00Z","source":"bioRxiv","summaryHtml":"過呼吸を伴う呼吸法（HVB）は、薬物を使わずにサイケデリクス体験に似た変性意識状態を引き起こすことが知られている。だがセッション中の神経活動と主観体験がどう連動するのかは未解明だった。呼吸だけで薬物に匹敵する意識変容が起きる仕組みは、長く謎のままだった。本研究は経験豊富な実践者25名を対象に、自然なHVBセッションの合間に安静時記録を挟み、64チャンネルEEGと体験の深さ・内容を追跡した。<br><br>その結果、HVBが引き起こす神経動態は古典的サイケデリクス状態の最も頑健な神経署名をなぞることが分かった。時間構造のゆるみ――広帯域の皮質脱同期、信号複雑性の増加、アルファ波（8〜13Hz）パワーの低下――と、空間構造の再編――皮質処理階層の平坦化――である。これらの効果は分単位の解像度で主観的な体験の深さと直接相関した。<br><br>音楽聴取や能動的内受容といったHVBの個別要素だけでは説明できないことも示された。薬物によらない経路でもサイケデリクス的な皮質状態に到達できること、誘導法を問わず共通する変性意識状態の神経的特徴が存在することが示唆される。出典：bioRxiv","timestamp":1794528000000,"title":"Neural and Experiential Dynamics of High-Ventilation Breathwork Mirror Psychedelic States","titleJa":"高換気呼吸法の神経・体験ダイナミクスはサイケデリクス状態を映し出す","url":"https://www.biorxiv.org/content/10.64898/2026.11.11.765965"},{"authors":["Xin Cheng","Meiqi Song","Hu Zhao","Xiaojing Ye"],"categories":[],"field":"Legal Medicine Research","genre":"Psychedelics / Trauma","monthKey":"2026-11","publishedAt":"2026-11-13T00:00:00Z","source":"Crossref","summaryHtml":"トラウマに関する語りは、出来事の感情的な意味や中心的な意義を伝えながらも、いつ・どこで・どのように起きたかという具体的な詳細を欠くことがある。本総説は「記憶の般化」という概念を手がかりに、このばらつきを解釈するための神経認知的な枠組みを法精神医学的評価に向けて提示する。<br><br>海馬のパターン分離とパターン完成、前頭前野と扁桃体・分界条床核との相互作用、記憶アンサンブル間の重なりや脅威への反応を形づくる細胞・分子レベルの過程に関する知見を統合する。さらにトラウマ関連の精神病理、反復体験、遅延や繰り返しの想起、事後情報が、自伝的記憶の特異性やエピソードの区別、情報源の帰属にどう影響するかを検討する。<br><br>自伝的想起や記憶弁別、恐怖の般化、情報源記憶を測る行動課題は、これらの過程を相補的に調べる手段になる。機能的画像や電気生理、分子レベルの指標も手がかりになるが、集団レベルの知見だけでは個人の語りの正確さを断定できない。法実務への応用には信頼できる課題や規範データ、誤差率の把握が不可欠だと結論づけている。出典：Crossref","timestamp":1794528000000,"title":"Memory generalization: neural mechanisms and implications for trauma-related accounts in forensic psychiatry","titleJa":"記憶の般化――トラウマの語りのばらつきを読み解く神経認知の枠組み","url":"https://doi.org/10.20517/lmr.2026.12"},{"authors":["Vuyisile Msila"],"categories":[],"field":"The International Journal of Interdisciplinary Civic and Political Studies","genre":"Consciousness / Philosophy","monthKey":"2026-11","publishedAt":"2026-11-13T00:00:00Z","source":"Crossref","summaryHtml":"1973年のダーバン・ストライキは「ダーバン・モーメント」とも呼ばれ、南アフリカの政治地図を大きく塗り替えた労働不安の高まりだった。アパルトヘイト体制下でアフリカ人労働者が労働条件の改善を勝ち取ったことが最大の意義であり、政府は自発的で無統制な紛争の連鎖と見なして動揺した。本稿はその思想的意義をいま問い直す。<br><br>ストライキは職場の不満を超え、やがてアパルトヘイトへの政治闘争と結びついた。一見自発的に見えたが、組織化されていない労働者たちは集団的な決意で構造的不正義に挑んだ。本論文は、ブラック・コンシャスネス運動（BCM）の思想的影響と組織的な推進力がなければ、黒人労働者は広範な社会・経済闘争へ効果的に動員されなかっただろうと論じる。<br><br>ブラック・コンシャスネス哲学は労働者の連帯と地域の動員を鼓舞するうえで決定的な役割を果たした。労働運動は職場の要求を超え、社会変革の触媒になりうる。ダーバン・ストライキは解放闘争における抵抗と成功の新たな現場を示し、政治的動員と産業的動員が不可分であることを浮き彫りにした。出典：Crossref","timestamp":1794528000000,"title":"The Role of Black Consciousness Philosophy in the 1973 Durban Strikes","titleJa":"ブラック・コンシャスネス哲学と1973年ダーバン・ストライキの役割","url":"https://doi.org/10.18848/2327-0071/cgp/a175"},{"authors":["Mélody Boudilmi","Lauriane Landais","Tamara Guenoun","Barbara Smaniotto","Svetoslava Urgese","Aziz Essadek"],"categories":[],"field":"Trauma, Violence, & Abuse","genre":"Psychedelics / Trauma","monthKey":"2026-11","publishedAt":"2026-11-13T00:00:00Z","source":"Crossref","summaryHtml":"消防士や警察官、救急隊員らファーストレスポンダーは、直接・間接にトラウマへ繰り返しさらされる。しかしその影響を指す言葉――二次的外傷性ストレス、代理トラウマ、共感疲労、心的外傷後ストレス障害――は現場でも研究でも混同されがちだった。本レビューはPsycINFO、PubMed、Web of Scienceなど6つのデータベースを2026年1月まで調べ、PRISMAの指針に沿って76件の査読付き研究を抽出し、これらの概念の整理を試みた。2人の研究者が抽出と質の評価を担った。<br><br>分析の結果、概念の境界は症状の重なりや、他の職種向けに作られた測定道具の限界によって曖昧に保たれていることが分かった。トラウマの発生には、さらされる出来事の性質や累積的な負担、個人の経験や職務上の役割に加え、組織的な制約が中心的な役割を果たすことも示された。曝露のあり方を切り分けて考えることの重要性が浮かび上がる。<br><br>著者らは、ファーストレスポンダーのトラウマ曝露を公衆衛生の問題として捉えるべきだと結論づける。言葉の整理は、支援や予防の設計の出発点になるという指摘である。出典：Crossref","timestamp":1794528000000,"title":"Toward a Definition and Differentiation of Secondary Traumatic Stress, Vicarious Trauma, Post-Traumatic Stress, and Compassion Fatigue in Relation to First Responders: An Integrative Literature Review","titleJa":"二次的外傷性ストレスと共感疲労――消防・警察・救急の現場で言葉を整理する","url":"https://doi.org/10.1177/15248380261476699"},{"authors":["Ashraf Fatehi Al-Rai","Ahmed Ibrahim Hassan","Mohamad Albakjaj","Maya Khater"],"categories":[],"field":"Interpersona An International Journal on Personal Relationships","genre":"Ethics / Safety","monthKey":"2026-11","publishedAt":"2026-11-13T00:00:00Z","source":"Crossref","summaryHtml":"人工知能は脱税の手口にも、税務行政の側にも影響を及ぼし始めている。本研究はAI技術と脱税の関係を調べ、脱税の多様な形態、関連する法制度と経済的影響、そして新興デジタル技術がもたらす規制上の課題を検討する。個人や組織が高度なAIシステムを使って脱税を容易にしたり実行したりする能力が高まっていることが問題の出発点である。<br><br>研究は記述的・分析的手法と批判的法学アプローチを用い、AIが脱税にどう関わるかを包括的に把握しようとした。分析の結果、AIはデータ分析や不正検出、自動監査、コンプライアンス監視を通じて税務管理の効率を高めうる一方で、高度な脱税スキームの構築にも使われ、歳入減少や財政赤字、投資の縮小、所得格差の拡大につながりうることが示された。<br><br>著者らは、政府がデジタル時代に対応して税法を更新し、データを保護し、人材を育成し、AIを活用した税務プラットフォームを導入して持続可能で効果的な税務ガバナンスを支えるべきだと提言する。AIによる脱税は従来型の脱税の技術的変形ではなく、帰属やデジタル証拠、データガバナンス、人の監督をめぐる規制課題だと位置づけられる。出典：Crossref","timestamp":1794528000000,"title":"Artificial Intelligence and tax evasion: legal and economic challenges in the digital era","titleJa":"AIと脱税――デジタル時代の法的・経済的課題","url":"https://doi.org/10.54899/iij.v20i4.1392"},{"authors":["Ishika K. Kanakath"],"categories":[],"field":"Frontiers in Neuroscience","genre":"Neuroscience","monthKey":"2026-11","publishedAt":"2026-11-13T00:00:00Z","source":"Frontiers in Neuroscience","summaryHtml":"筋電・神経義肢は実験室では成功しても、日常の臨床利用ではしばしば失敗する。この翻訳の溝はドメインシフトが原因で、神経可塑性や運動学習、筋疲労、電極のずれによって生体信号が非定常になることが背景にある。本レビューは、ドメインシフトの神経生理学的・技術的な起源を総合し、それに対応するアルゴリズム戦略を評価する。<br><br>ドメインシフトは、セッション間のドリフトや解剖学的な個人差など、生物学的過程と技術的過程が結びついて生じる。対策として、閉ループのデコーダ適応、適応フィルタ、アンサンブルモデリング、強化学習、転移学習などがあり、それぞれ適応速度とシステム安定性のバランスが異なる。とりわけ重要なのは、デコーダの更新が進行中の神経・運動可塑性と直接やり取りする「共適応システム」である。<br><br>利用者を受動的な信号源とみなすと長期的な制御は限られる。利用者を能動的な学習パートナーとみなすことが必要だ。複数の適応戦略を、生物学的な時間尺度を尊重する翻訳神経工学の枠組みに統合することで、義肢の長期的な放棄を減らし、臨床で使える頑健な支援神経技術へつながると結論づける。出典：Frontiers in Neuroscience","timestamp":1794528000000,"title":"Co-adaptive learning and domain adaptation bridge the translational gap in neuroprosthetic control: a review","titleJa":"神経義肢の臨床応用へ――共適応学習とドメイン適応のレビュー","url":"https://www.frontiersin.org/articles/10.3389/fnins.2026.1974861"},{"authors":["Bhargavi Anumula","Anil V. Turukmane"],"categories":[],"field":"Frontiers in Artificial Intelligence","genre":"Ethics / Safety","monthKey":"2026-11","publishedAt":"2026-11-13T00:00:00Z","source":"Frontiers in Artificial Intelligence","summaryHtml":"音声ディープフェイクは音声認証や音声システムのセキュリティ上の脅威になっている。本論文は、感情の手がかりを組み込んだ深層学習フレームワーク「Enhanced FusionNet」を提案する。Log-Melの音響表現にMultiScaleCNN、双方向LSTM、マルチヘッドクロスアテンション、残差特徴融合、適応ゲート融合を組み合わせ、真正音声と合成音声を識別する。<br><br>感情表現はRAVDESSデータセットから話者非依存のエンコーダで別途学習し、FoRデータセットによる検出に転移させた。独立したホールドアウト試験では精度98.67％、ROC-AUC 99.88％を達成し、5分割交差検証でも平均精度99.08±0.35％と高い安定性を示した。アブレーションにより各構成要素の寄与も確認されている。<br><br>ただし感情表現の転移は補完的な情報を与えたものの、評価プロトコル下では全体の検出性能をさらに押し上げなかった。著者らはベンチマーク条件での有効性を示しつつ、感情の手がかりが常に上積みになるわけではない点も率直に報告している。音声ディープフェイク対策の設計指針となる成果である。出典：Frontiers in Artificial Intelligence","timestamp":1794528000000,"title":"Enhanced FusionNet: a deep learning structure for multimodal input-based emotion-aware deepfake speech identification","titleJa":"感情の手がかりで音声ディープフェイクを見破る――Enhanced FusionNet","url":"https://www.frontiersin.org/articles/10.3389/frai.2026.1978052"},{"authors":["Xilong Wang","Xiaoxing Chen","Neil Gong"],"categories":["cs.CR","cs.AI","cs.CL"],"field":"cs.CR","genre":"Agents / Robotics","monthKey":"2026-11","publishedAt":"2026-11-13T00:00:00Z","source":"arXiv","summaryHtml":"複数のエージェントが課題を分割し、それぞれの応答を集約して解くマルチエージェントシステムでは、一部のエージェントが悪意ある応答を返すことで最終的な解を操作できてしまう。本論文はこの脅威を「応答操作攻撃（ReMA）」として定式化した。標的あり・なしの攻撃を最適化問題として扱い、代理のマルチエージェントシステムからのフィードバックをもとに悪意ある応答を反復的に磨き上げることで、攻撃効果を最大化する手法を示している。<br><br>防御として、エージェントの応答間の意味的な類似性を手がかりに、十分に多くの他の応答と一致する応答を選ぶ安全な集約ルール「SecMAS」を提案した。標的あり・なしの攻撃に対する理論的な安全性保証も与えている。評価では既存の集約ルールがReMAに対して脆弱だったのに対し、SecMASは評価したすべての攻撃を防御できた。<br><br>エージェント同士の協調が前提のシステムでは、個々のエージェントの正しさだけでなく、集約の仕組みそのものの頑健性が安全性を決める。本研究は攻撃と防御をセットで示すことで、設計段階から安全性を組み込む方向性を提示している。出典：arXiv","timestamp":1794528000000,"title":"Securing Multi-Agent Systems by Design","titleJa":"マルチエージェントの協調を壊す応答操作攻撃――防御集約ルールSecMASの提案","url":"https://arxiv.org/abs/2611.17883"},{"authors":["Mike He","Ankush Desai","Sharad Malik","Aarti Gupta"],"categories":["cs.AI","cs.SE"],"field":"cs.AI","genre":"Ethics / Safety","monthKey":"2026-11","publishedAt":"2026-11-13T00:00:00Z","source":"arXiv","summaryHtml":"複数ステップのツール呼び出しを行うLLMエージェントには、利用者の課題を達成する有用性と、領域のポリシーや正しさの制約を守る安全性の両方が求められる。有用性を優先すれば危険な操作を見逃し、安全性を優先すれば課題が途中で止まる。危険な操作を止めれば違反は防げるが、エージェントは先へ進めず立ち往生してしまう。従来の手法はどちらか一方を犠牲にしてきた。<br><br>本論文が提案するSoteriaは、検証済みの階層的計画と実行時の強制を組み合わせてこの緊張を解消する。実行前にエージェントが生成した構造化された計画を仕様に対して形式的に検証し、ツール呼び出しの前に適合を確認する。実行中は検証済みの計画が仕様に沿った軌跡を保証するとともに、危険な操作が止められたときの回復の指針にもなる。<br><br>多様なツール利用タスクのベンチマークで、Soteriaは最良のベースラインと比べて平均タスク成功率が1.7倍となり、ポリシー違反はゼロだった。安全性と有用性はトレードオフにしなくてよく、検証済みの計画が現場でも機能することを示す結果である。出典：arXiv","timestamp":1794528000000,"title":"Soteria: Formally Verified Planning with Runtime Enforcement for Safe LLM Agents","titleJa":"安全性と有用性を両立するLLMエージェント――形式検証された計画と実行時強制のSoteria","url":"https://arxiv.org/abs/2611.17880"},{"authors":["Tiantong Wang","Zhiren Gong","Yixin Wang","Tiantong Wu","Wei Yang Bryan Lim"],"categories":["cs.LG","cs.AI"],"field":"cs.LG","genre":"LLM / NLP","monthKey":"2026-11","publishedAt":"2026-11-13T00:00:00Z","source":"arXiv","summaryHtml":"Mixture-of-Expertsモデルは、層や計算ステップをまたいでエキスパートを共有することで、さまざまな文脈から学習情報を集約できる。各ステップでの局所的な予測誤差は下がるが、多段階システムが評価されるのは最終出力である。局所的な改善が最後まで生き残るのはいつなのかを本論文は理論的に問う。<br><br>指定された線形回帰モデルにおいて、分散の削減と共有によるバイアスを天秤にかけ、共有と統合の正確な基準を導出した。共通の固定された線形伝播写像のもとでは、最終出力の期待二乗リスクを特徴づけ、共有が平均の局所誤差を下げながら最終出力の誤差を増やす場合があることを示した。等方性ノイズのもとでの直交する完全なプールは、局所的な改善をすべて最終出力に保つことも分かった。<br><br>一般のルーティング計算については、分布シフトや周囲の誤差、エキスパート選択の変化を織り込んだ端から端までの誤差の上限を導出している。正しい予測とルートのラベルだけでは、個々のエキスパートが帰属された操作を実装していることの証拠にはならないという指摘も含む。出典：arXiv","timestamp":1794528000000,"title":"From Local Prediction Error to Final Outputs: A Theory of Expert Sharing in Multi-Step Reasoning","titleJa":"局所的な誤差の改善は最終出力に届くか――エキスパート共有の理論","url":"https://arxiv.org/abs/2611.17879"},{"authors":["Siddarth Srinivasan","Morgan Jane Matthews","Jascha Sohl-Dickstein","Erik Jones"],"categories":["cs.AI"],"field":"cs.AI","genre":"Ethics / Safety","monthKey":"2026-11","publishedAt":"2026-11-13T00:00:00Z","source":"arXiv","summaryHtml":"個々のLLMエージェントに対するアライメント訓練は、複数エージェントのチームではうまく機能しないことがある。本論文はその仕組みを調べ、チームでもアライメントを維持する介入を探った。敗血症トリアージとニュース推薦という2つのソフトウェア工学タスクと、10件のコンサルティング提案書作成タスクを用いている。<br><br>4つの知見が示された。単体とチームの安全ギャップはモデルの能力と明確な関係がなく、AnthropicのMythos Previewはあるタスクで最大のギャップを示し、別のタスクでは最小だった。互いの批判やグループチャットでの調整といった自然な介入は、チームを単体のふるまいに確実に戻せない。責任の分散がギャップの大きな要因で、チーム内のエージェントはシステム全体の安全上の失敗を積極的に確認しなくなり、問題を無視・合理化・転嫁しやすくなる。<br><br>一方で、システム全体の安全を担う専任の安全責任エージェントを置くことと、調整役のエージェントが安全仕様書を公開することは、単体のアライメントを取り戻すのに有効だった。研究チームはマルチエージェントの実験枠組みmagelabも公開している。出典：arXiv","timestamp":1794528000000,"title":"Aligning AI Teams","titleJa":"AIチームのアライメントはなぜ崩れるか――責任分散がもたらす安全ギャップ","url":"https://arxiv.org/abs/2611.17820"},{"authors":["Lihuan Li","Ruiyi Yang","Jiru Wang","Yifan Duan","Xiachong Lin","Hao Xue","Yang Song","Flora Salim"],"categories":["cs.CL","cs.AI"],"field":"cs.CL","genre":"Agents / Robotics","monthKey":"2026-11","publishedAt":"2026-11-13T00:00:00Z","source":"arXiv","summaryHtml":"長期にわたるLLMエージェントはツールやアプリを連携させて複雑な多段階タスクをこなすが、対話履歴が伸びるほど文脈の管理が信頼性と効率を左右する。要約や剪定、履歴選択で文脈を短くする方法はあるが、短い文脈が良い判断につながるとは限らない。要約は後で必要な細部を落とし、履歴の丸ごと保持は無関係な情報を大量に含む。<br><br>本論文が提案するCarryOnは、コンパクトな実行状態と、出典に紐づいた細粒度の証拠を組み合わせる軽量な文脈マネージャーである。学習済みの選択器と適応的な保持ポリシーが、文脈管理のための追加のLLM呼び出しなしに関連する証拠を手元に残す。評価指標として、資源利用を加味したタスク成功度S_αと、成功あたりの正規化コストNCSの2つも導入した。<br><br>AppWorld、OfficeBench、Tau2 Telecomの3ベンチマークで3種のLLMアクターを用いた評価では、CarryOnはマクロ平均タスク成功率75.7%を達成し、最強のベースラインを6.7ポイント上回った。2つの指標でも平均で最良の成績だった。出典：arXiv","timestamp":1794528000000,"title":"CarryOn: Learning What to Keep in Context for Long-Horizon LLM Agents","titleJa":"長期タスクのエージェントは何を文脈に残すか――軽量な文脈管理CarryOn","url":"https://arxiv.org/abs/2611.17808"},{"authors":["Grid Robotics","Qingfeng Lan","Duo Li","Siyao Li","Yiheng Lyu","Shijian Lu","Zhenghao Qi","Shizun Wang","Xinchao Wang","Ming Yang","Zhiqin Yang","Zuhao Yang","Tao Yu"],"categories":["cs.RO"],"field":"cs.RO","genre":"Agents / Robotics","monthKey":"2026-11","publishedAt":"2026-11-13T00:00:00Z","source":"arXiv","summaryHtml":"GPT-6 Astraの登場により、フロンティアモデルにエージェント的ハーネスを組み合わせたシステムが、多くの身体化ベンチマークでタスク専用ポリシーに匹敵し、ときに凌駕するようになった。タスクの種類ごとに専用ポリシーを訓練するのではなく、基盤モデルを実世界の身体化タスクへ直接適用するのがエージェント型ロボティクスである。環境を観測し、利用者の意図を解釈し、課題を推論し、スキルとツールを呼び出し、結果を検証して戦略を適応させる閉ループで動く。<br><br>だがこの新しいパラダイムには、共有された定義も、信頼できる評価枠組みも、研究のロードマップもまだない。著者らは、基盤モデルと身体化ハーネスからなる「Embodied System 2」こそがエージェント型ロボティクスの意思決定の中核だと主張する。中心の課題は、汎用的な推論を、反応時間の制限、機械的な限界、予測不能な環境変化、不可逆な結果といった物理的制約のもとで、効果的かつ検証可能な行動へ翻訳することだ。モデルそのものの能力と、閉ループのシステム性能の両方を測る評価枠組みを提案する。<br><br>さらにデジタルから物理のエージェントへ引き継がれる原則と、信頼できる物理的自律の実現に向けて対処すべき課題を特定したうえで、個別のプリミティブの実行から常駐的な役割の遂行へと、責任範囲を広げながら安全で信頼できる持続的自律をめざす研究ロードマップを描く。身体をもつAIの設計図を整理した展望論文である。出典：arXiv","timestamp":1794528000000,"title":"Envisioning Agentic Robotics: A New Era of Robotic Systems","titleJa":"エージェント型ロボティクスの到来――基盤モデルが身体を動かす新時代","url":"https://arxiv.org/abs/2611.18359"},{"authors":["Jonathan D. McCart","Pranav I. Deevi","Mehdi Azabou","Nanda H. Krishna","Caleb A. McKinney","Nicholas S. Card","Sergey D. Stavisky","Chethan Pandarinath"],"categories":["q-bio.NC","cs.LG"],"field":"q-bio.NC","genre":"Neuroscience","monthKey":"2026-11","publishedAt":"2026-11-13T00:00:00Z","source":"arXiv","summaryHtml":"話す能力を失った人のための音声神経補綴は、脳活動からテキストを解読できるようになった。だが高精度の裏側では、重い言語モデルのスタックが計算コストと遅延のばらつきを生み、自然な会話への参加を妨げていた。とりわけ遅延が読めないことは、相手とのやり取りのリズムを崩す大きな障害だった。本研究は、音声認識（ASR）モデルの速度と軽さを活かしたエンドツーエンドの脳-テキスト解読フレームワークFETTUCCINEを提案する。<br><br>公開データによる評価では、単語誤り率は4.39%まで下がり、従来のエンドツーエンド手法を上回った。神経活動の日ごとの変動にも適応でき、ファインチューニングで後日にも実用的な性能を維持できる。特筆すべきは、市販のモバイルデバイス上で動作し、最大370倍速のスループットを示したことである。脳-テキスト解読のモバイル実証はこれが初めてだ。<br><br>実用的な誤り率10%未満を保ちつつ、遅延のばらつきという実用の壁を越えた。神経補綴を実験室から日常の会話へ近づける一歩であり、話す能力を失った人が自分のペースで会話に参加できる未来を示す研究である。出典：arXiv","timestamp":1794528000000,"title":"FETTUCCINE: Fast and efficient brain-to-text decoding on mobile devices","titleJa":"脳の言葉をスマホで読み取る――モバイル対応の脳-テキスト解読FETTUCCINE","url":"https://arxiv.org/abs/2611.18561"},{"authors":["Jiaming Tang","Zhuoyang Zhang","Junxian Guo","Fangzhou Zhao","Yilong Zhao","Zekai Li","Xingyang Li","Yuyang Zhao","Song Bian","Zhijian Liu","Song Han"],"categories":["cs.RO","cs.LG"],"field":"cs.RO","genre":"Agents / Robotics","monthKey":"2026-11","publishedAt":"2026-11-13T00:00:00Z","source":"arXiv","summaryHtml":"ロボット利用エージェントは汎用ロボット制御の有望な道だが、強い性能はGPT-6 AstraやClaude Fable 5.2のような独占モデルに限られ、オープンウェイトのモデルは大きく劣っていた。本研究は、27Bのオープンウェイト推論モデルを、実演なし・シミュレーション内のみの強化学習で実ロボットを直接操れるよう訓練した。<br><br>コンピュータ利用エージェントと同様、モデルは環境を観測し、思考の連鎖で推論し、次のエンドエフェクタ姿勢を生成する。訓練エンジンPEARでシミュレーションの大規模なロボット課題に取り組ませた結果、習得した技能は未見のロボット、実世界、新しい指示へと汎化した。実機の両腕ロボットでは成功率60%（訓練前のベースモデルは0%）、LIBEROでは1.6%から74.4%へ上昇し、最先端モデルに迫った。<br><br>実演に依存する視覚-言語-行動モデルと比べ、課題そのものの変化にも強い。シミュレーションだけで鍛えた推論が実世界で通用することを示し、オープンなロボットエージェントへの道を開く研究である。出典：arXiv","timestamp":1794528000000,"title":"Training Reasoning Models in Simulation to Natively Use Real Robots","titleJa":"推論モデルをシミュレーションで鍛えて実ロボットを動かす――実演なしのロボット利用エージェント","url":"https://arxiv.org/abs/2611.18562"},{"authors":["Thomas Brennan","Andrew W. Lo","Chaoyi Zhao"],"categories":["cs.AI","q-bio.PE","q-fin.GN"],"field":"cs.AI","genre":"Ethics / Safety","monthKey":"2026-11","publishedAt":"2026-11-13T00:00:00Z","source":"arXiv","summaryHtml":"AIエージェントは課題の遂行と行動規範の遵守の両立を求められるが、この二つは衝突しうる。本研究は、進化的選択がエージェントの選択をどう形づくり、経験がその選択を人間の判断に近づけ、後の圧力に耐えさせるかをモデルで調べた。共通の不確実な報酬状態のもと、報酬を得た行動をとったコピーだけが繁殖する。<br><br>長期的な成長を最大化するのは、各行動を環境が報酬する頻度と同じ頻度でとることだった。課題遂行だけを報酬する環境では遂行特化の方針が栄えるが、規範が問われると破綻する。固定の線形方針は課題の利害が大きくなるほど遂行を優先し、人間が決して報酬しない場面でもそうする。学習方針は環境が報酬するトレードオフへ収束し、人間が報酬を与える場合、著者らはこれを「社会化」と呼ぶ。<br><br>蓄積された経験は、その後の遂行特化の訓練でも社会化を覆しにくくするが、記憶が有限だと保護は弱まる。一度の違反で運用が終わる場面では、厳格な禁止が有効な一方、誤った禁止も代償が大きい。アライメントは与える目的だけでなく、エージェントを育てる環境にも依存することを示す研究である。出典：arXiv","timestamp":1794528000000,"title":"Alignment by Socialization: Learning Tradeoffs Under Selection","titleJa":"アライメントは社会化で育つ――選択のトレードオフを進化がどう形づくるか","url":"https://arxiv.org/abs/2611.18531"},{"authors":["Mohamed Aghzal","Mor Geva","Gregory J. Stein","Ziyu Yao"],"categories":["cs.AI","cs.CL"],"field":"cs.AI","genre":"LLM / NLP","monthKey":"2026-11","publishedAt":"2026-11-13T00:00:00Z","source":"arXiv","summaryHtml":"機械的解釈可能性（MI）は大規模言語モデルの内部計算の説明で進歩したが、LLMエージェントの意思決定の説明では同等の成功を示せていない。本論文は、現実的なエージェントの失敗にMIの道具を当てたときの課題を調べる。具体的な対象は、ウェブエージェントがサイトに存在しない操作を幻覚として生み出す失敗である。<br><br>Qwen2.5-7B-Instructを実際のウェブサイトと対話させた実験では、最後のプロンプトトークンで訓練した線形プローブが生成前に幻覚を予測でき（AUC 0.80）、プローブ方向へのステアリングで幻覚の85%を修正できた。ただし有効な操作の7%も壊してしまう。しかも説明は部分的でしかない。プローブ方向はプロンプトの書式に敏感で、操作の表現を少し変えるだけでステアリング効果の大半が失われる。<br><br>回路の特定も難しく、計算は複数の要素と位置に分散し、エージェントが頼る情報は事例ごとに変わる。標準的なMI手法の前提を揺るがす観察であり、回路発見と特徴同定の今後の方向性を示す研究である。出典：arXiv","timestamp":1794528000000,"title":"Can Mechanistic Interpretability Help Explain LLM Agent Failures? A Case Study on Web Element Hallucination","titleJa":"エージェントの失敗を解釈可能性で説明できるか――ウェブ要素の幻覚を例に","url":"https://arxiv.org/abs/2611.18514"},{"authors":["Mojtaba Soltanalian"],"categories":["cs.IT","cs.LG","stat.ML"],"field":"cs.IT","genre":"Consciousness / Philosophy","monthKey":"2026-11","publishedAt":"2026-11-13T00:00:00Z","source":"arXiv","summaryHtml":"情報システムは、問われる内容をあらかじめ知らないまま学ばなければならない。環境全体を丸ごと記録できなくても、問いの集合に共通の構造があれば、有限の表現で十分に機能する。本論文はこの現象を「将来タスク情報」という概念で定式化した。保持すべき最小の情報量を、利用可能な証拠に対する意思決定の価値から定義するのである。<br><br>手法として、すべての許容タスクについて行動間の事後比較を記録する「共同意思決定・後悔状態」を導入した。コンパクト性の仮定のもと、保持された表現はこの状態に基づく較正された置き換えを常に持ち、タスクの後悔をすべて保ったまま情報量を増やさない。そこから得られる情報・後悔曲線は、操作的な符号化レートと一致する。<br><br>有限の保持を支配する二つの厳密な境界も示された。行動数が固定の場合の弱スター閉包と、すべての有限行動メニューを許す場合の源泉・証拠分布の特異質量である。個々の問いの難しさではなく問いの集合構造が情報要求を決めるという結果は、知性の有限性と世界の無限性をめぐる議論に数学的な土台を与える。出典：arXiv","timestamp":1794528000000,"title":"Why Finite Intelligence Works in an Infinite World: A Mathematical Theory","titleJa":"有限の知性はなぜ無限の世界で機能するのか――数学的理論が示す情報の境界","url":"https://arxiv.org/abs/2611.18538"},{"authors":["Aayush Marasini","Barsat Khadka","Nick Rahimi"],"categories":["cs.LG","cs.AI"],"field":"cs.LG","genre":"LLM / NLP","monthKey":"2026-11","publishedAt":"2026-11-13T00:00:00Z","source":"arXiv","summaryHtml":"近年の研究で、大規模言語モデル（LLM）が他のニューラルネットワークのパラメータを直接読み、故障したネットワークを修正し、勾配降下なしに動作するネットワークをゼロから書けることが示されてきた。この能力は「重み空間プログラミング（WSP）」と呼ばれる。本論文はこの新しいパラダイムを体系的に測るベンチマーク「WeightBench」を提案した。<br><br>ベンチマークは重みの読解・修正・作成、実行不可能な編集の識別、データなし圧縮の5トラック、計42タスクからなる。対象は2千パラメータの制御ポリシーから70億パラメータの言語モデルまで幅広い。評価の結果、最先端のエージェントは小さなネットワークを読み、実行せずに動作する制御ポリシーを書けたが、言語モデルの修正やデータなし圧縮、不可能な編集と難しい編集の区別はまだできなかった。<br><br>42タスク全体のマクロスコアはClaude Opus 5.5が0.535、Sonnet 5.5が0.466、GPT-6.1-solが0.568だった。LLMが重みを扱う能力は始まったばかりで、どこまで届きどこで止まるかを測る物差しができたことは、モデル自体をプログラム対象とする研究の出発点になる。出典：arXiv","timestamp":1794528000000,"title":"WeightBench: Evaluating Language Models as Weight-Space Programmers","titleJa":"言語モデルは重みを読み書きできるか――重み空間プログラミングのベンチマークWeightBench","url":"https://arxiv.org/abs/2611.18553"},{"authors":["Zelin He","Siyu Zhu","Jacob Helwig","Yujian Liu","Li An","Rohit Jain","Shiyu Chang","Alborz Geramifard"],"categories":["cs.AI","cs.CL","cs.LG"],"field":"cs.AI","genre":"Agents / Robotics","monthKey":"2026-11","publishedAt":"2026-11-13T00:00:00Z","source":"arXiv","summaryHtml":"エージェント強化学習では、モデルが自分の対話履歴の何を見て、どんな助言を受けるかを決める「ハーネス」と呼ばれる足場が欠かせない。従来は手書きのハーネスを学習中ずっと固定していたが、効果的なハーネスは領域やデータ、モデルに依存し、モデルの訓練とともに変わっていく。本論文はハーネスをデータから学び、訓練とともに進化するプログラムとして扱う「ModHarness-RL」を提案した。<br><br>対話を型付きブロックからなる構造化された「State」として記録し、ハーネスの二つの中核をその上のプログラムとした。蓄積した履歴をモデルの文脈に組み立てる「圧縮」プログラムと、行動が逸脱したときに助言を与える「操縦」プログラムである。学習中、最近の軌跡から候補プログラムを提案し、実行で検証して過去の軌跡に再適用することで、ハーネスがモデルの変化に追従する。<br><br>コード検索を中心に、ALFWorldとBIRD SQLでも検証し、15億〜80億パラメータのモデルで圧縮と操縦の仕組みが未知のタスクでの性能を改善した。ハーネスを固定の前提から学習対象へ移すことで、エージェント訓練の設計余地が広がる。出典：arXiv","timestamp":1794528000000,"title":"ModHarness-RL: Recasting Harnesses as Learnable and Evolving Programs for Agentic RL","titleJa":"エージェント学習の足場をプログラムとして進化させる――ModHarness-RL","url":"https://arxiv.org/abs/2611.18533"},{"authors":["Dhruv Dixit","Khushi Patel","Congcong Xu","Min Song"],"categories":["cs.AI"],"field":"cs.AI","genre":"LLM / NLP","monthKey":"2026-11","publishedAt":"2026-11-13T00:00:00Z","source":"arXiv","summaryHtml":"小規模言語モデルはローカルで安価に、プライバシーを守って動かせる魅力がある一方、分解・正確な計算・ツール利用・検証を要する数学的推論ではいまだ信頼性が低い。本論文は小さなモデルに実行可能で監査可能な推論軌跡を生成させる二段階の枠組み「ARCHER」を提案した。<br><br>第一段階では自由形式の思考連鎖を、推論ステップ・計算機呼び出し・決定的な実行時観測・検証行為・最終回答を含む型付きの行動トレースへとコンパイルする。計算機が返す観測は決定的なため、誤った計算は途中で露見し、検証行為が軌跡の正しさをその場で確かめられる。学習の標的を説明文の模倣から、ツールに接地した推論方策の学習へと移すのである。第二段階では、回答の正しさ、ツールの接地、過程の規律、トレースの整合性に対する報酬を用いた非対称な階層強化学習でこの方策を洗練する。<br><br>100億未満の5つの標準バックボーンで、ARCHERは最強のツール拡張ベースラインを上回った。推論を「説明する文章」ではなく「実行できる手順」として学ばせることで、小さなモデルの数学的推論の信頼性が高まる方向が示された。出典：arXiv","timestamp":1794528000000,"title":"ARCHER: From Rationale Imitation to Executable Reasoning in Small Language Models","titleJa":"小さな言語モデルに実行可能な推論を――計算機接地の二段階学習ARCHER","url":"https://arxiv.org/abs/2611.18494"},{"authors":["Helma Torkamaan","Masoud Mansoury","Yanan Xin","Oscar Oviedo Trespalacios","Roberta Savella"],"categories":["cs.CY","cs.AI","cs.HC","cs.SE"],"field":"cs.CY","genre":"Ethics / Safety","monthKey":"2026-11","publishedAt":"2026-11-13T00:00:00Z","source":"arXiv","summaryHtml":"EU AI法はハイリスクAIシステムに技術的・組織的な要件を課すが、現場で適用するには何を測り、どんな証拠で適合を示すかという文脈依存の判断が避けられない。本論文は研究者・政策立案者・実務家32人による参加型ワークショップで、医療・採用・公共交通の現実的なシナリオを使い、規制上の義務が技術要件へどう翻訳され評価されるかを調べた。<br><br>ワークショップのテーマ分析から、繰り返し現れる緊張が明らかになった。義務を測定可能なシステム特性へ翻訳する方法、責任と人間の監督が実務でどう行使されるか、運用条件や利用方法の変化が適合証拠の妥当性にどう影響するかである。たとえば公平性指標が採用における差別を隠してしまうこと、時間的圧迫と情報不足が公共交通での人間の監督を損なうこと、患者層の変化が確立した証拠を無効にしうることが挙げられた。<br><br>規制遵守は一度満たせば終わるチェックリストではなく、運用とともに見直し続ける実践だという示唆である。法の文言と技術の現場のあいだに横たわる翻訳の困難を、参加者の経験から具体的に描き出した研究といえる。出典：arXiv","timestamp":1794528000000,"title":"Between Obligations and Evidence: A Participatory Study of Translating the EU AI Act into Technical Requirements","titleJa":"EU AI法を技術要件に翻訳する難しさ――32人の参加型ワークショップが示した緊張","url":"https://arxiv.org/abs/2611.18471"},{"authors":["Jimin Mun","Maarten Sap","Yanai Elazar"],"categories":["cs.AI"],"field":"cs.AI","genre":"LLM / NLP","monthKey":"2026-11","publishedAt":"2026-11-13T00:00:00Z","source":"arXiv","summaryHtml":"人間は「飛行機は速い」「赤い飛行機も速い」「壊れた飛行機は速くない」といったカテゴリ知識を自然に使い分ける。言語モデルはこの知識をどう獲得するのか。本研究は、カテゴリ知識の学習を測る枠組み「LECAT」を提案する。暗記、未知の事例への般化、文脈に応じた柔軟な使用の3つを区別して評価し、事前学習データ中の知識の表現様式が学習にどう影響するかを追跡する。<br><br>199組のカテゴリ―特徴ペアでオープンソースの事前学習済みモデルを評価し、学習データを分析した結果、文脈とカテゴリ―特徴の共起の強さが大きなモデルでの学習を助ける一方、規則をそのまま繰り返すような記述は柔軟な学習を妨げることが分かった。68Mパラメータのモデルをゼロから訓練する統制実験でも、逐語的な繰り返しは柔軟性を損ない、多様な表現の混合が頑健な学習につながることが確認された。<br><br>文脈への柔軟な適応は依然としてモデルにとって難しいが、知識が事前学習でどう表現されるかが、その獲得の頑健さを大きく左右する。カテゴリ知識の学習をデータの表現から捉え直すことで、より柔軟に知識を使えるモデルの設計へ道を開く研究である。出典：arXiv","timestamp":1794528000000,"title":"LECAT: Measuring LLM Category Learning from Pretraining Data","titleJa":"言語モデルはカテゴリ知識をどう学ぶのか――事前学習データから測るLECAT","url":"https://arxiv.org/abs/2611.18419"},{"authors":["Sandip Nandi","Aishwarya Bose","Apurba Bose","Soovadeep Bakshi"],"categories":["cs.MA","cs.AI","cs.CE"],"field":"cs.MA","genre":"Ethics / Safety","monthKey":"2026-11","publishedAt":"2026-11-13T00:00:00Z","source":"arXiv","summaryHtml":"自律取引エージェントには、問題のある注文を防ぎつつ正当な取引を妨げない制御が求められる。本研究は、そのコンプライアンスを再現可能な形で試す指値板シミュレータ「TradeGauntlet」を提示する。検出・防止・実行コストを分離し、Claude Haiku 5.5とSonnet 5.5で1,680回の模擬セッションを実施した。<br><br>すべての行動アラートは自己照合によるもので、自己交差注文を却下するゲートでアラートは消えた。だが「アラートゼロ」はコンプライアンスの証明にはならない。分割注文のスケジュールで規則をすり抜ける弱点が見つかり、学習ベースの検出は2,400件の探索事例をすべて捕捉する一方で、大口メーカーのセッションの15%を誤検出した。行動への注意喚起はモデルによって効果が分かれた。<br><br>実施された管理策の評価は市場仮定に依存し、実験結果は法的コンプライアンスや実市場での検出精度を保証しない。それでも、取引エージェントの統制を再現可能なテストで検証する基盤として、ガバナンスの議論に具体的な材料を与える。出典：arXiv","timestamp":1794528000000,"title":"TradeGauntlet: Evaluating Compliance Controls for Autonomous Trading Agents","titleJa":"自律取引エージェントのコンプライアンスをどう試すか――シミュレータTradeGauntlet","url":"https://arxiv.org/abs/2611.18493"},{"authors":["Suvarna Kadam","Soran Parsa"],"categories":["cs.RO","cs.AI","cs.ET","cs.LG"],"field":"cs.RO","genre":"Agents / Robotics","monthKey":"2026-11","publishedAt":"2026-11-13T00:00:00Z","source":"arXiv","summaryHtml":"視覚・言語・行動（VLA）モデルは、ウェブで事前学習した視覚言語モデルをロボットの行動出力へ適応させ、ウェブの知識を物理的な制御へ持ち込む。RT-2の登場から4年足らずで、消費者向けGPU1台で微調整できる公開モデルや、見知らぬ家庭を片付ける汎用モデルまで現れた。本サーベイは2022年12月から2026年10月の88件を、設計・訓練・展開のライフサイクルに沿って整理する。<br><br>設計では入力と記憶、アーキテクチャ、行動出力、中間予測の4軸、訓練では事前学習データと事後訓練、展開ではリアルタイム実行を分析し、22モデルを比較した。訓練データは約1万時間の遠隔操作データから、2万3,000件のコミュニティ収集エピソードや2万時間の主観映像へと広がり、モデル規模は30〜70億パラメータが主流となる一方、10億未満の軽量モデルも登場している。<br><br>操作と移動の両方を扱う汎用VLAも生まれつつある。ただしベンチマークでほぼ完璧なスコアを出すモデルでも、物体やカメラが少し動いただけで失敗する例があり、堅牢性は未解決の課題として残る。分野の全体像を掴むための包括的な地図である。出典：arXiv","timestamp":1794528000000,"title":"Vision-Language-Action Models: A Life-Cycle Survey of Design, Training and Deployment","titleJa":"視覚・言語・行動モデルをライフサイクルで読む――88件のサーベイ","url":"https://arxiv.org/abs/2611.18372"},{"authors":["Keuntae Kim","Dongjun Kim","Yong Suk Choi"],"categories":[],"field":"Hugging Face Papers","genre":"Vision / Multimodal","monthKey":"2026-11","publishedAt":"2026-11-13T00:00:00Z","source":"Hugging Face","summaryHtml":"V-JEPAのような動画エンコーダは、方向・速度・順序・状態の変化を動画だけから学ぶ。だが言語モデルと組み合わせると、キャプションや問答が動画の属性をわずかしか指し示さないため、モデルは属性の検索だけを学び、エンコーダが持つ動態の情報は使われない。同じ問題で、凍結した特徴からの線形プローブは速度を87%で読めるのに、動画言語モデルは偶然程度の正答率にとどまった。<br><br>著者らは、動態の情報が予測型エンコーダでは動画間で共有される部分空間に宿ることを示し、反実仮想の教師信号で言語モデルにそれを読ませる手法を提案する。画素変換で公開動画から答えが変換で決まる対照的な変種を作り、453万件の公開サンプルで単一ステージ訓練した。1Bから8Bのモデルは11の動画ベンチマークで各サイズ帯のトップとなり、4Bモデルは72.1点を記録した。<br><br>エンコーダが「何を読めるか」を決め、教師信号が「何を読むか」を決める。反実仮想の教師信号は平均で4.5点、速度に関する問題では38点の上積みをもたらした。動画理解の評価と訓練の設計を問い直す研究である。出典：Hugging Face","timestamp":1794528000000,"title":"V-JEPA-LM: Video-Language Models That Read Dynamics Beyond Static, Text-Aligned Representations","titleJa":"動画の「動き」を読む言語モデル――V-JEPA-LM","url":"https://huggingface.co/papers/2611.17831"},{"authors":["Thanni Adewuyi","Adepoju Jeremiah Moyondafoluwa","Dorcas Amapu","Dieko Whenu","Sylvia Essessien","Sandra Oko-Oba","Pelumi Onafadeji","Lily Aimas-Love","Samuel Omolaiye","Abiodun Adereni"],"categories":["cs.CL"],"field":"cs.CL","genre":"LLM / NLP","monthKey":"2026-11","publishedAt":"2026-11-13T00:00:00Z","source":"arXiv","summaryHtml":"臨床言語モデルの推論が途中で止まっても、診断はすでに言及されていることがある。本研究「MamaReason」は、Gemma 4 31Bを基にしたモデルを母子保健の217組の症例で調べ、回答の継続が未完の推論に含まれる診断をそのまま返す振る舞いを分析する。推論の途中で診断が言及され、それが繰り返し現れるかどうかを区別し、継続による回答の回復が何を意味するのかを分解する。<br><br>明示的な診断抽出では、失敗した強化学習の初回パス94件中75件、教師あり微調整の初回パス93件中75件に診断が含まれていた。継続はその診断と強化学習で67/75件、教師あり微調整で58/75件一致した。診断の文字列だけを読むことで、継続により回復した40組のうち30組が復元できた。単なる言及と繰り返しの選択を区別する統制も行い、2回目の言及を促す仕組みで早期の読み取りと正答率のトレードオフを測った。<br><br>推論の内容、回答の完成、診断の正しさは別の結果であり、同じ推論過程を複数の読み取り方で見ることで初めて区別できる。未完の推論でも診断が決まっている場合があり、継続は新しい推論ではなく既存の言及をなぞるにすぎないこともある。臨床言語モデルの評価では、推論の途中で何が決まっているかを問う視点が重要だと示す。出典：arXiv","timestamp":1794528000000,"title":"MamaReason: Unfinished Reasoning and Answer Recovery in Clinical Language Models","titleJa":"未完の推論に答えはもうあるのか――臨床言語モデルのMamaReason","url":"https://arxiv.org/abs/2611.18264"},{"authors":["Valerie A. Canady"],"categories":[],"field":"Mental Health Weekly","genre":"Psychedelics / Trauma","monthKey":"2026-11","publishedAt":"2026-11-13T00:00:00Z","source":"Crossref","summaryHtml":"カリフォルニア州は、州内の退役軍人を対象とするサイケデリクス治療の研究プロジェクトに最大400万ドルを拠出する。ギャビン・ニューサム知事の発表に基づき、精密医療推進イニシアチブが公募を開始した。対象は州内の非営利の学術研究機関と退役軍人コミュニティの連携チームで、3〜4年の研究を支援する。<br><br>近年の研究では、サイケデリクスがうつ病や不安障害、物質使用障害などに有効であることが示され、退役軍人の心的外傷後ストレス障害（PTSD）への有望性も報告されている。今回の資金は、個々の患者に合わせた治療法の研究を進め、健康格差の縮小と退役軍人の経験を研究に取り込むことを目指す。公募は研究機関と退役軍人コミュニティの連携を条件とし、現場の声を研究設計に反映させる仕組みになっている。<br><br>米国退役軍人省によれば、2021年にVAの医療を受けた近年の退役軍人の41.9%に精神保健または物質使用障害の診断があった。研究への公的資金の投入は、サイケデリクス治療の臨床応用に向けた動きが政策レベルでも進んでいることを示す。精密医療の名のもとに、一人ひとりに合った治療へ研究を結びつけようとする試みである。出典：Crossref","timestamp":1794528000000,"title":"California announces psychedelic treatment research funding to improve veterans' health","titleJa":"カリフォルニア州、退役軍人向けサイケデリクス治療研究に最大400万ドル","url":"https://doi.org/10.1002/mhw.35079"},{"authors":["Nima Eshraghi","Lovedeep Gondara","Sagarika Suresh","Xiaotong Xu","Jithin Pradeep","Fanny Chevalier"],"categories":["cs.LG","cs.AI"],"field":"cs.LG","genre":"LLM / NLP","monthKey":"2026-11","publishedAt":"2026-11-13T00:00:00Z","source":"arXiv","summaryHtml":"スパースオートエンコーダによる活性化ステアリングは、言語モデルの振る舞いを微調整なしに制御できる手法だが、従来は生成されるすべてのトークンに介入していた。そのためモデルの表現が学習時の分布からずれ、生成の流暢さが損なわれる問題があった。本研究は「いつ」介入するかが制御の決定的な軸だと指摘する。<br><br>著者らは、介入できるトークン数に予算を設け、どのトークンを選ぶかだけを変数とする枠組みを提案する。2つのゲートを導入した。対照的特徴射影（CFP）は目標行動と最も整合しないトークンを選ぶ記憶を持たない手法で、閉ループ適応ベルヌーイステアリング（CLABS）はこれまでの生成の軌跡を追跡し、遅れが出た箇所に予算を投じる。<br><br>線形のステアリング応答モデルでCLABSの安定性を保証する領域を導出し、実験では両手法が同じ予算の既存手法より大きな行動変化をもたらし、CLABSは予算が厳しい条件ほど強く、流暢さを最もよく保った。介入の「量」ではなく「配分」を最適化する視点を示し、制御の設計に新しい軸を加えた研究である。出典：arXiv","timestamp":1794528000000,"title":"Right Token, Right Time: From Per-Token Gating to Trajectory-Aware Activation Steering","titleJa":"正しいトークンに、正しいタイミングで――言語モデルの活性化ステアリングを軌道で制御する","url":"https://arxiv.org/abs/2611.18274"},{"authors":["Yuan-Chao Hu"],"categories":["cs.AI","cond-mat.dis-nn"],"field":"cs.AI","genre":"LLM / NLP","monthKey":"2026-11","publishedAt":"2026-11-13T00:00:00Z","source":"arXiv","summaryHtml":"言語モデルはトークンを一つずつ生成するが、その生成が事前学習で獲得した幾何学とどう関わるかは分かっていない。本研究は、6つのオープンな言語モデルの入力埋め込みから類似度ネットワークを構築し、生成をその上に写像した。トークン埋め込みのネットワークはスケールフリーで裾が重く、蒸留しても位相はほぼ変わらない。<br><br>連続する生成トークンがネットワーク上で隣り合うことはまれで、ほとんどのモデルでは順序をシャッフルした場合と変わらなかった。生成は既定のネットワーク上の歩行ではないが、訪れるトークンはその中に集中している。知識空間は事前学習からほぼ決定論的に定まることになる。ロジットレンズで層ごとに追うと、トークンは深い層で遅れて定まり、反復的なモデルは小さな部分グラフに閉じこもる。<br><br>これらの観測量は、生成の退化を推論時に監視する指標になりうる。生成の幾何学を可視化することで、モデルの内部を覗く手がかりが増える。知識空間が事前学習から決定論的に定まるなかで、生成をグラフ学習の視点から微視的に理解する新しい見方を提示する。出典：arXiv","timestamp":1794528000000,"title":"Dancing Tokens on the Vocabulary Network from LLM Generation","titleJa":"語彙ネットワークを踊るトークン――LLMの生成を埋め込みの幾何学から読む","url":"https://arxiv.org/abs/2611.18248"},{"authors":["Aritra Lahiri","Florian Marquardt"],"categories":["quant-ph","cs.AI"],"field":"quant-ph","genre":"Agents / Robotics","monthKey":"2026-11","publishedAt":"2026-11-13T00:00:00Z","source":"arXiv","summaryHtml":"実用的な量子コンピュータへの道は、誤り訂正符号で保護された情報に対する回路の効率が鍵を握る。論理状態の準備や論理ゲート、符号切り替えなどの回路は、これまで個別に手作業で設計されてきた。誤り訂正の全工程にわたる回路設計は、量子計算の実用化を左右するボトルネックになっている。本研究はこの設計問題を、エージェント型の進化的プログラム合成として定式化する。<br><br>大規模言語モデルが事前学習の知識とツール使用の能力を活かし、回路検証器の導きのもとで、クリフォード回路を定義するプログラムを進化させる。論理状態の準備、論理ゲートの設計、符号の成長や切り替えといった幅広い課題に対し、提案手法はすべての課題で誤り耐性回路を発見した。モデルが自らプログラムを書き換えながら探索する点が、従来の機械学習による回路設計との違いである。<br><br>発見された回路は、故障に対する網羅的な検査で検証されている。量子回路設計への機械学習の応用を、エージェントの自律的な探索へと広げ、手作業に頼らない設計の可能性を示す研究である。出典：arXiv","timestamp":1794528000000,"title":"Agentic AI for Discovering Fault-Tolerant Quantum Circuits","titleJa":"エージェントAIが見つける誤り耐性量子回路――進化的プログラム合成による設計","url":"https://arxiv.org/abs/2611.18504"},{"authors":["Abirami Namachivayam","Nirmala Paramanandham"],"categories":[],"field":"Frontiers in Artificial Intelligence","genre":"Vision / Multimodal","monthKey":"2026-11","publishedAt":"2026-11-13T00:00:00Z","source":"Frontiers in Artificial Intelligence","summaryHtml":"運転者の注意散漫は交通事故の大きな原因であり、運転行動の分類は先進運転支援システムや運転者モニタリングに欠かせない。本サーベイは、視覚ベースの手法を対象に、深層学習モデルの性能報告の信頼性と比較可能性を批判的に検討した。SFD3ベンチマークでは画像をランダムに分割した場合に97.89〜99.80%という高い分類精度が報告されるが、これはデータセット内評価と被験者非依存でない分割による画像・被験者レベルのデータ漏洩に起因し、過度に楽観的な見積もりになるおそれがある。被験者独立やデータセット横断の評価では精度は大きく下がり、未知の運転者や新しいデータセットへの汎化が課題になる。<br><br>対象は従来の機械学習、畳み込みニューラルネットワーク、転移学習、注意機構モデル、リカレントネットワーク、Vision Transformer、アンサンブル、ハイブリッドモデルに及び、公開・著者独自のデータセット、前処理、データ拡張、分割方法、交差検証、評価指標、計算量、説明可能AI、組み込み実装まで体系的に比較している。<br><br>浮かび上がった課題は、評価慣行の不統一、被験者独立・データセット横断の検証の不足、計算上の制約、説明可能性の欠如である。今後の方向性として、標準化された評価プロトコル、高度なデータ拡張、効率的なTransformerアーキテクチャ、マルチモーダル学習、信頼できる実装可能な運転者モニタリングシステムが挙げられている。出典：Frontiers in Artificial Intelligence","timestamp":1794528000000,"title":"Vision-based driver distraction classification: a comprehensive survey of deep learning methods, evaluation protocols, and deployment challenges","titleJa":"視覚ベースの運転者注意散漫分類：深層学習手法・評価プロトコル・実装課題の包括的サーベイ","url":"https://www.frontiersin.org/articles/10.3389/frai.2026.1947476"},{"authors":["Robin Shing Moon Chan","Ryan Cotterell"],"categories":["cs.CL","cs.AI","cs.LG"],"field":"cs.CL","genre":"LLM / NLP","monthKey":"2026-11","publishedAt":"2026-11-13T00:00:00Z","source":"arXiv","summaryHtml":"プログラム帰納とは、少数の入出力例からプログラムを復元する課題である。ユーザーが規則を実装する代わりに例を示すだけで済むため、プログラミングへの敷居を下げる。だが有限の例だけでは無数のプログラムと整合してしまうため、復元は本質的に曖昧である。<br><br>本研究はこの問題をベイズ的に捉え、言語モデルをプログラム上の事前分布として用いる。学習者は情報量の多い入力を選び、ユーザーなどのオラクルに出力を問う対話型設定のもと、貪欲なクエリ選択アルゴリズムを導出した。問い合わせ回数の上限は事前確率の対数に比例する形で示され、プログラム等価性のPAC的な緩和のもとで、クエリ選択の目的関数を重点サンプリングで推定しながら目標プログラムを近似的に復元できることを示した。<br><br>CodeARCベンチマークでの評価では、言語モデルだけのエージェントと比べ正答率が最大22ポイント向上し、観測する入出力例も最大10.5件少なくて済んだ。言語モデルの事前知識を活用した対話型の帰納が、曖昧さを効率よく解消できることが示された。出典：arXiv","timestamp":1794528000000,"title":"Interactive Program Induction with Language Model Priors","titleJa":"言語モデルを事前分布に――対話型プログラム帰納の理論と実践","url":"https://arxiv.org/abs/2611.18485"},{"authors":["Imene Kerboua","Fatemeh Pesaran Zadeh","Xing Han Lù","Weijian Qi","Alexander Miller","Junyi Song","Yunjia Tian","Dongjin Kang"],"categories":[],"field":"Hugging Face Papers","genre":"Agents / Robotics","monthKey":"2026-11","publishedAt":"2026-11-13T00:00:00Z","source":"Hugging Face","summaryHtml":"大規模言語モデルや視覚言語モデルを搭載したウェブエージェントは、現実のブラウザ作業に広く使われ始めている。だが既存の再現可能なベンチマークは対象アプリが少なく、扱うモダリティもテキストと視覚に限られる。ライブ型のベンチマークは対象を広げられる反面、ページやデータの変化で再現性を失う。<br><br>本研究は6分野20の自己ホスト型ウェブアプリにまたがる300課題からなるWebArena-Proを提案する。音声・動画もテキスト・視覚と並ぶ中核的な観測対象として扱い、そこから情報を抽出する専用アクションも備える。各課題は隔離環境で実行でき、並列評価にも対応する。課題は専用のアノテーター画面で作成し、言語モデルによるトリアージで絞り込んだうえで人間が検証した。<br><br>評価ではCodex（GPT 6.1 Sol搭載）とClaude Code（Claude Opus 5.5搭載）がともに62.3%で最高成績を収め、OpenCode（Kimi 3.1 Pro搭載）が60.7%で続いた。再現可能で人間が監修したウェブエージェント・ベンチマークとしては、対象範囲とマルチモーダル対応の広さでこれまでで最も包括的だと著者らは述べている。出典：Hugging Face","timestamp":1794528000000,"title":"WebArena-Pro: A Heterogeneous, Multimodal, Reproducible Benchmark for Web Agents","titleJa":"WebArena-Pro――多様でマルチモーダルな再現可能ウェブエージェント・ベンチマーク","url":"https://huggingface.co/papers/2611.17955"},{"authors":["Yanke Song","Shuo Chen","Chris Rockwell","Guande He","Nan Liu","Desai Xie","Tianpei Gu","Yong-Hyun Park","Aryan V S","Dennis Yuren Menn","Ming-Hsuan Yang","Xun Huang"],"categories":["cs.CV"],"field":"cs.CV","genre":"Vision / Multimodal","monthKey":"2026-11","publishedAt":"2026-11-12T18:59:55Z","source":"arXiv","summaryHtml":"最先端の動画生成モデルは、動画を空間・時間の両方向で圧縮するVAEの潜在空間で動作してきた。圧縮は学習を現実的にしたが、高解像度化や細かな制御、対話的な生成の妨げになっていた。解像度を2倍にすればトークン数は4倍になり、条件はフレーム群まとめてしか適用できず、応答も複数フレームのブロックが揃うまで待たねばならない。本論文は学習済みの潜在動画モデルを画素空間へ引き上げる手法「PixVid」を提案する。<br><br>PixVidは拡散トランスフォーマーをそのままに、VAEデコーダーを畳み込みヘッドに置き換え、すべてのフレームを画素空間で直接生成する。速度ではなくクリーンな動画を予測することと、ノイズシフトを大きく取ることが品質の鍵だった。Wan2.1-14Bからファインチューニングし、約130万クリップで潜在ベースラインと競合する性能を示した。<br><br>フレーム単位で画素を扱うため、同じフレームあたりトークン数で2倍の解像度を生成でき、速い動きの下でも深さ条件付きの動画編集がずれず、操作への応答も次のフレームで返せる。動画生成を潜在空間から画素空間へ戻すことで、制御性と即応性を両立させる試みである。出典：arXiv","timestamp":1794509995000,"title":"Back to Pixels: Lifting Latent Video Diffusion into Pixel Space","titleJa":"動画生成を潜在空間から画素空間へ――フレーム単位で描くPixVid","url":"https://arxiv.org/abs/2611.17336"},{"authors":["Ellis Brown","Chris Hoang","Shengyi Qian","Shang-Wen Li","Mike Lewis","Marjan Ghazvininejad","Luke Zettlemoyer","Lucas Beyer","Mengye Ren","Jakob Verbeek","Saining Xie","Hu Xu"],"categories":["cs.CV","cs.LG"],"field":"cs.CV","genre":"Vision / Multimodal","monthKey":"2026-11","publishedAt":"2026-11-12T18:59:54Z","source":"arXiv","summaryHtml":"マルチモーダル言語モデルが視覚入力をどう符号化すべきかは未解決だ。多くは事前学習済みの視覚エンコーダを使い、言語モデルと一緒に学習させる手法や、エンコーダをなくす手法も現れている。視覚エンコーダは三つの設計選択を束ねている。事前学習由来の視覚的先行知識、専用の視覚容量、そして融合前に置く配置である。既存モデルはデータも構造も計算量も異なるため、各選択の効果を分離できない。<br><br>本研究は全モデルを共通データでゼロから事前学習し、生涯計算量を揃えて比較する統制された枠組みで三つを切り分けた。視覚的先行知識は必須ではなく、共同学習したエンコーダは事前学習済みと同等だった。決定的だったのは専用の視覚容量で、エンコーダなしのモデルは骨格を同量だけ大きくしても視覚理解で劣った。ただし容量は融合前に置く必要はなく、骨格の初期層に融合内で加えた視覚専用モジュールが同等で、初回トークンまでの時間も短縮できた。<br><br>結果は骨格サイズを変えても、エンコーダ事前学習を無料とみなしても、事前学習済み言語モデルから始めても成り立つ。視覚容量の専用化こそが重要で、配置の自由度は設計の幅を広げる。マルチモーダル設計の指針を示す研究である。出典：arXiv","timestamp":1794509994000,"title":"Unbundling Multimodal Vision Encoding","titleJa":"マルチモーダル視覚符号化の分解――視覚容量こそが決め手","url":"https://arxiv.org/abs/2611.17334"},{"authors":["Jie Wang","Tong Zhu","JiaHao Kuang","Zhe Xu","Yunkai Chai","Dehong Zheng","Yu Cheng","Tao Ji","ZhouHan Lin","Qi Zhang","Bowen Zhou"],"categories":[],"field":"cs.CL","genre":"LLM / NLP","monthKey":"2026-11","publishedAt":"2026-11-12T18:59:52Z","source":"arXiv","summaryHtml":"大規模言語モデルのアーキテクチャは、モデルのスケーリングの挙動や学習効率、推論コストを左右する中心的な研究対象だが、産業界ではDeepSeekやQwen、Kimiなどのチームが導入した工夫のうち何が成功し何が捨てられたかが公開されにくく、学術界では計算資源や評価基準のばらつきから小規模で単発の比較にとどまりがちだ。<br><br>本研究はこうした隔たりを埋める公開プラットフォームArchSpaceを提案する。各提案を実験と推論の記録とともに登録し、コミュニティが査読し、後の研究が参照できる仕組みで、コストの高い大規模学習の前にスケーリング則で大規模時の損失を予測して着想を評価する。Qwen3.5とOLMo3のベースライン、適合させたスケーリング則、再利用可能な学習レシピを初期参照として用意した。<br><br>査読を経て検証された着想は新たなベースラインとなり、次世代モデルを形づくる発想の幅を広げることを目指す。産業界の暗黙知と学術界の検証を同じ土俵に載せ、アーキテクチャ研究の知見を蓄積し共有する基盤として設計されている。出典：arXiv","timestamp":1794509992000,"title":"ArchSpace: Recording, Reviewing, and Referencing LLM Architecture Research","titleJa":"LLMアーキテクチャ研究を記録・査読・参照する公開プラットフォームArchSpace","url":"https://arxiv.org/abs/2611.17332"},{"authors":["Chin-Yang Lin","Ryo Hachiuma","Jaesung Choe","Min-Hung Chen","Yu-Chiang Frank Wang","Yen-Yu Lin","Wei-Chen Chiu","Yu-Lun Liu","Cheng Sun"],"categories":["cs.CV"],"field":"cs.CV","genre":"Vision / Multimodal","monthKey":"2026-11","publishedAt":"2026-11-12T18:59:52Z","source":"arXiv","summaryHtml":"KVキャッシュ付きのデコーダのみの大規模視点合成モデル（LVSM）は、3D形状を再構成せずに新しい視点を回帰することで最高水準の品質を達成してきた。一方、テスト時学習（TTT）の層は計算を節約する代わりに品質を犠牲にする。本論文は、複数視点のアテンションから得た場面全体の情報を軽量MLPへ「焼き付ける」手法TTBを提案する。<br><br>第一の鍵は、TTTの高速重みMLPを流用し、アテンションの入出力ペアから複数視点間のアテンション写像そのものを明示的に学ばせることだ。アテンションを置き換えるのではなく学ぶことで、TTT並みの描画効率を保ちながら大幅に高い品質を実現する。第二の鍵は、文脈の前処理と新視点の描画の間のモダリティのずれを解消するため、文脈トークンをカメラ情報のみのものと画像内容を含むものに分離することだ。<br><br>複数のベンチマークで最大23倍の描画高速化を達成し、品質は最高水準と同等だった。3D再構成なしで高速・高精細な新視点合成を両立させる道が開かれ、実時間の視点合成や没入型メディアへの応用が期待される。出典：arXiv","timestamp":1794509992000,"title":"TTB: Test-time Baking for Efficient Rendering of Decoder-only View Synthesis Models","titleJa":"「焼き付け」で速く美しく――新視点合成を軽くするTTB","url":"https://arxiv.org/abs/2611.17331"},{"authors":["Guangyuan Sui","Yunzhong Hou","Chi Harold Liu"],"categories":["cs.RO","cs.CV"],"field":"cs.RO","genre":"Agents / Robotics","monthKey":"2026-11","publishedAt":"2026-11-12T18:59:49Z","source":"arXiv","summaryHtml":"言語指示でドローンを誘導する視覚言語航行（VLN）は、3Dの動き予測のわずかな誤差が衝突や航行ミスにつながる難題だ。実行の結果を3D環境で思い描けない既存手法は、言語指示から正確な経由点を予測するのに苦労してきた。ドローンの航行では、小さな予測のずれがそのまま衝突につながるため、言葉の指示と見える景色を正確に結びつける仕組みが欠かせない。本論文は「プロトタイプ視覚想像」にもとづく枠組みProtoVis-Navを提案する。<br><br>モデルはまず、次に進むべき場所の局所的な視覚表現を「想像」する。特徴プロトタイプを予測し、その線形結合で目標領域の視覚特徴を推定するのだ。想像した視覚表現を文脈として最終行動を生成することで、視覚文脈と経由点の出力の整合が高まる。行く先の見え方を先に思い描いてから動く、という人間の進み方に近い推論をモデルに組み込んだ形だ。<br><br>広範な実験で既存のベースラインを大きく上回る性能が示された。ドローンが言葉の指示を、見える景色と結びつけて理解する仕組みが具体化し、災害調査や点検、物流など自律飛行の応用が期待される。出典：arXiv","timestamp":1794509989000,"title":"ProtoVis-Nav: Prototypical Visual Imagination for Visual-Spatial Aligned UAV Navigation","titleJa":"ドローンは「想像」して飛ぶ――視覚と言語を結ぶ航行モデル","url":"https://arxiv.org/abs/2611.17330"},{"authors":["Felix O'Mahony","Daniel Olmeda Reino","Roberto Cipolla","Ayush Tewari"],"categories":["cs.CV"],"field":"cs.CV","genre":"Vision / Multimodal","monthKey":"2026-11","publishedAt":"2026-11-12T18:59:09Z","source":"arXiv","summaryHtml":"動画拡散モデルは見た目の質では優れているが、物理的におかしい動きを生みやすい。従来の設定では物理的な推論のすべてを拡散過程の中で同時に行わなければならず、それが破綻の原因だった。本論文は物理推論の役割を、言語モデルに支えられたキーフレーム生成モジュールへ移す手法「K2V」を提案する。<br><br>キーフレーム生成では言語による明示的な推論が働き、動画の重要な瞬間の見た目を細かく制御できる。キーフレームは言語で書かれた物理の筋書きとして働き、各場面で何が起きるべきかを明示する。生成されたキーフレームを条件として動画生成モデルに渡すことで、拡散モデルの役割は物理的に正しい中間状態のあいだを補間するだけの単純な作業になる。全体の系列を拡散だけで推論する必要がなくなる。<br><br>その結果、物理的正確さを測るベンチマークPhysics-IQ VerifiedとPhyGenBenchで従来手法を大きく上回り、最先端の性能を達成した。言語モデルの推論力と拡散モデルの生成力を分業させることで、見た目だけでなく物理的にもっともらしい動画生成へ近づく試みである。出典：arXiv","timestamp":1794509949000,"title":"K2V: Generative Keyframing For Physically Plausible Video Generation","titleJa":"物理的に正しい動画生成へ――言語モデルが描くキーフレーム「K2V」","url":"https://arxiv.org/abs/2611.17324"},{"authors":["Ethan Lin","Akanksha Sarkar","Ziang Liu","Kristin Branson","Jennifer J. Sun"],"categories":["cs.AI","cs.LG"],"field":"cs.AI","genre":"Agents / Robotics","monthKey":"2026-11","publishedAt":"2026-11-12T18:59:06Z","source":"arXiv","summaryHtml":"機械学習を新しい分野に持ち込むとき、ラベル付きデータの確保とパイプラインの手作業が壁になる。ラベル付きデータは乏しいのにラベルなしデータは豊富にある現実的な状況で、機械学習パイプラインを自動設計するMLEエージェントがどこまで使えるかは、これまで検証されてこなかった。本研究は半教師あり学習をプログラム探索の問題として捉え直し、エージェントが限られた監督のもとでどう振る舞うかを調べた。<br><br>弱いフィードバックと同等の計算量でも、エージェントは既存の半教師あり学習手法を組み合わせ・適応させたコードを合成し、12設定中8設定で人間が設計した最強のベースラインを最大21.8%上回った。一方で、プログラム選択が大きなボトルネックになることも判明した。エージェント自身の評価指標で選ぶと性能が最大47%落ちる。研究チームはこの問題を体系的に調べるため、エージェント生成と人間設計のプログラム計16,977件を集めたベンチマークProgramSelectBenchを構築し、教師なし選択と能動的選択の手法を評価した。<br><br>さらに現実の生態学の検出タスクにも適用し、制御された環境の外でもエージェント発見の戦略が移転する可能性と課題を示した。ラベルなしデータを活かすエージェントは、データの乏しい現場で機械学習を広げる道を開く一方、どのプログラムを採用するかの判断が今後の鍵になる。出典：arXiv","timestamp":1794509946000,"title":"AgentSSL: Can MLE Agents Leverage Unlabeled Data?","titleJa":"ラベルなしデータを活かせるか――機械学習エージェントの半教師あり学習","url":"https://arxiv.org/abs/2611.17323"},{"authors":["Minhae Oh","Jeonghye Kim","Jinwoo Koo","Yeongoon Kim","Jimin Seo","Minsik Seol","Jungwoo Lee"],"categories":["cs.CL"],"field":"cs.CL","genre":"LLM / NLP","monthKey":"2026-11","publishedAt":"2026-11-12T18:58:50Z","source":"arXiv","summaryHtml":"拡散言語モデルは再マスクで生成文を修正できるが、修正には「いつ」「何を」直すかの判断が要る。数独での診断から二つの弱点が見つかった。隠れ状態には誤りの情報が含まれているのに、トークンの確信度はそれを確実に表さず、孤立した誤りを直しても周囲の文脈が固定されたままでは同じ誤りが再現される。<br><br>そこで提案されたのが検証器DiVRである。部分的に生成された系列が正解に到達するかを予測し、モデル自身の軌跡の最終的な正誤から学習する。DiVRはブロックを再生成すべきタイミングと、残すべき代替案の両方を決め、生成器そのものは変更しない。検証器を分離した設計のため、既存の生成器に後付けできる点も利点である。<br><br>5つの推論ベンチマークでLLaDA-8B-Baseに適用すると、微調整済み生成器の平均正答率は35.3%から43.4%へ上がり、コストは貪欲デコードの1.9〜3.5倍にとどまった。探索ベースラインの3.8〜7.4倍を下回る効率である。教師あり微調整や強化学習とも相補的で、Dreamを含む他の生成器にも汎化する。出典：arXiv","timestamp":1794509930000,"title":"Learning When Diffusion Language Models Should Regenerate","titleJa":"拡散言語モデルはいつ再生成すべきか――検証器が導く修正のタイミング","url":"https://arxiv.org/abs/2611.17320"},{"authors":["Ethan Lin","Yang Song"],"categories":["cs.CV"],"field":"cs.CV","genre":"Vision / Multimodal","monthKey":"2026-11","publishedAt":"2026-11-12T18:58:36Z","source":"arXiv","summaryHtml":"空間知能には、目にした光景を環境の幾何や物体、持続する状態と結びつける能力が要る。画像だけではこうした関係は暗黙のままで、ばらばらの注釈では見た目とカメラの動き、場面変化を共通の基準で扱えない。本研究は、家具付き住宅の3Dシーン構成5,280件を集めたデータセット「Spatial Foundry」を提案し、視覚・幾何・時間の情報を一つの基準で結びつける。<br><br>間取り図、透視・パノラマRGB、メートル単位の深度、点群、メッシュ、物体単位の3Dバウンディングボックス、映像と対になったカメラ軌跡を備え、共通のシーン座標が視点や時間をまたいで観測をつなぐ。編集可能なシーンからは新たなカメラ経路や物体変化も作れるため、同じ部屋の見え方を系統的に変えながら学べる。<br><br>間取り条件付き3D生成、幾何再構成、物体単位の知覚、カメラ条件付き動画生成、共有ワールドモデル、シーン編集への応用が示され、制御されたカメラ・場面変化が空間知覚とワールドモデルの研究を支える。公開ページでは動画と色付き点群のプレビューが見られる。出典：arXiv","timestamp":1794509916000,"title":"Spatial Foundry: A Multimodal Dataset for Spatial Intelligence","titleJa":"空間知能の土台――5,280の3D住空間がつなぐ視覚・幾何・時間","url":"https://arxiv.org/abs/2611.17318"},{"authors":["Christopher Liaw","Aranyak Mehta","Grigoris Velegkas","Felix Zhou"],"categories":["cs.DS","cs.AI","cs.LG","stat.ML"],"field":"cs.DS","genre":"LLM / NLP","monthKey":"2026-11","publishedAt":"2026-11-12T18:58:22Z","source":"arXiv","summaryHtml":"プロンプトの一部を取り除くとモデルの出力がどう変わるか――これが文脈帰属の問いである。nトークンのプロンプトで全てのleave-one-out値を直接計算するにはn回のモデル評価が必要になる。本研究は安定性の仮定のもと、評価回数を大幅に減らして全ての帰属値を推定するアルゴリズムを示した。<br><br>提案手法は誤差εに対してO(√log(1/ε)/ε)回の評価で全てのleave-one-out値を推定し、オラクルモデルにおける下限も同じオーダーであることを証明した。鍵は、安定性条件を満たす算術回路に対するスケッチ手法を、順方向微分の回路ではなく逆伝播の回路に適用した点で、スケッチの分散を抑えて評価回数を削減した。小規模な言語モデルの検索タスクで係数の減衰が安定性と整合することも実証した。<br><br>プロンプトのどの部分が出力に寄与したかを安く測れるようになれば、検索拡張生成の根拠提示やモデルの挙動の監査が現実的になる。理論的な最適性と実用性の両面から、文脈帰属の計算コストを大きく引き下げる成果である。出典：arXiv","timestamp":1794509902000,"title":"Sketching Language Models for Context Attribution","titleJa":"言語モデルの文脈帰属をスケッチで高速化――どのプロンプト断片が出力を決めたか","url":"https://arxiv.org/abs/2611.17313"},{"authors":["Peiwen Li","Harshit Verma","Sophia Zhou","Haiwen Wang","Ngoc Bui","Heng Chang","Fei Fei","David van Dijk","Rex Ying"],"categories":["cs.AI","cs.CL","cs.SE"],"field":"cs.AI","genre":"Agents / Robotics","monthKey":"2026-11","publishedAt":"2026-11-12T18:58:22Z","source":"arXiv","summaryHtml":"コーディングエージェントは変化し続けるリポジトリ上で次々とタスクをこなすが、次のタスクが何か分からないうちに記憶を書き残さなければならない。将来役立つかどうか分からない記憶に、書き込みと読み込みのコストがかかる。本研究は、記憶の設計とエージェントのふるまいを、次タスクで実際に測った記憶の価値で導く枠組みCoReMemを提案した。<br><br>見込み評価では、同じ状態から次タスクを実行し、個々の軌跡断片がある場合とない場合を比べることで、リポジトリ内の場所と実行可能なチェックを軸にした簡潔な記憶を作る。アクター側は記憶あり・なしのロールアウト群で方策上の記憶価値を推定し、解決を優先して成功時のステップ数を抑える報酬で適応する。記憶由来の手がかりを使ったステップにのみ追加の価値を与える工夫もある。<br><br>ベンチマークChainSWEでは、27Bのアクターの解決率が21.0%から25.7%へ上がり、ステップ数は17%減、キャッシュを考慮した総トークン数も記憶モジュール呼び出しを含めて11%減った。記憶を「ため込むもの」から「価値で選ぶもの」へ変えることで、連続するコーディング作業の効率と成功率を両立させる成果である。出典：arXiv","timestamp":1794509902000,"title":"CoReMem: Cost-Internalizing Memory for Successive Coding Tasks with Prospective Valuation","titleJa":"記憶はため込むものではない――コーディングエージェントの価値を測る記憶","url":"https://arxiv.org/abs/2611.17316"},{"authors":["Abigail L. Tenenbaum","R. Thomas McCoy"],"categories":["cs.LG","cs.CL"],"field":"cs.LG","genre":"Neuroscience","monthKey":"2026-11","publishedAt":"2026-11-12T18:57:49Z","source":"arXiv","summaryHtml":"人間はわずかな経験から素早く学べるのに、ニューラルネットワークは大量の訓練を要する。メタ学習で最適化されたネットワークは新しい関数を素早く学べることが知られているが、その仕組みは不明だった。本研究は、単語ベクトルの古典的な類推――「王−男＋女≒女王」――に着想を得て、関数を表すパラメータベクトルのあいだに加法的な関係があるかを調べた。<br><br>メタ学習ネットワークが特定の関数を素早く学ぶとき、適応後のパラメータ値をすべてつなげたベクトルは、その関数を表すものとみなせる。調べると、こうしたパラメータベクトルは関数のあいだの記号的な関係に沿って加算・減算でき、組み替えて作ったベクトルは、直接の訓練なしに意図した関数を実際に実装することが分かった。メタ学習は、学習の出発点を調整し、その後の学習をパラメータ空間における体系的で意味のある軌跡に沿って組織化する。<br><br>学習の速さを「構造の有無」で説明するこの発見は、人間のような柔軟な学習を機械に近づける手がかりになる。パラメータ空間の幾何学から学習能力を読み解く視点は、メタ学習の設計にも新たな指針を与えるだろう。出典：arXiv","timestamp":1794509869000,"title":"Linking Rapid Learning to Compositional Structure in Neural Networks: Evidence from Additive Analogies in Meta-Learned Parameter Spaces","titleJa":"速い学習は合成的な構造から生まれる――メタ学習ネットワークのパラメータ空間の加法性","url":"https://arxiv.org/abs/2611.17314"},{"authors":["Benjamin Hoover","Hugh Blayney","James C. R. Whittington"],"categories":["cs.AI","cs.LG"],"field":"cs.AI","genre":"LLM / NLP","monthKey":"2026-11","publishedAt":"2026-11-12T18:56:56Z","source":"arXiv","summaryHtml":"ループモデルは推論の有力な枠組みだが、不安定で学習が遅く、単純なパズルにも多くのパラメータと計算量を要する。本研究は1980年代のホップフィールド＆タンクのエネルギー関数を学習版CRAMとして蘇らせ、エネルギー降下による推論がこれらの弱点を解消することを示した。早期停止が組み込まれ、計算量は問題の難しさに適応し、ソルバーを微分せずに速く学習でき、重みはパズルの制約を解釈可能に学ぶ。<br><br>CRAMは1GPUでわずか42ミリ秒と132ミリ秒の学習ののち、Sudoku-Extremeで99.996%、Maze-Uniqueで100%のテスト正解率を達成し、ループモデルより少なくとも1000倍速い。Sudoku-Extremeの最高精度では、推論FLOPsも282分の1以下で同等だった。<br><br>エネルギーがデータからの推論学習の有望な方向であることを示すと同時に、数独や迷路のような自明に解けるベンチマークでループ推論の拡張性を測ることへの注意も促す。古典的な発想の再発見が、最先端の推論研究に新たな視点をもたらす。出典：arXiv","timestamp":1794509816000,"title":"Classical Energies Learn to Reason 1,000x Faster than Looped Models","titleJa":"古典的エネルギーが1000倍速く推論を学ぶ――ループモデルを超えるCRAM","url":"https://arxiv.org/abs/2611.17309"},{"authors":["Tosca Lechner","Vinayak Pathak","Sivan Sabato","Ruth Urner"],"categories":["cs.LG"],"field":"cs.LG","genre":"LLM / NLP","monthKey":"2026-11","publishedAt":"2026-11-12T18:55:58Z","source":"arXiv","summaryHtml":"ディベートは、モデルがますます高性能になるなかでもアライメントを保つ訓練プロトコルとして提案されてきた。人間がラベルを与える代わりに、二つのモデルが正反対のラベルを証明し合う討論を判定する。計算量の高い関数でも、弱い判定者なら正しく判定できることが示されており、非常に複雑な関数をモデルに教えられる可能性が指摘されてきた。<br><br>しかし従来の研究はこれを訓練プロトコルとして捉えず、既知の判定者のもとで二人の討論者が行うゲームだけを分析してきた。本研究はディベートに内在する学習問題をオンライン学習として定式化し、判定者へのアクセスがある場合の最適な学習方法が、敵対的なディベートの実施とは限らない場合があることを示した。そこで協調版のプロトコルを定義し、その学習可能性を組合せ次元で特徴づけた。<br><br>さらに人間判定者が誤りを犯す場合も検討し、少数の判定ミスが学習の大きな誤りにつながりうることを示した。ディベートによるアライメントという構想を、ゲームの分析から学習の理論へと進める重要な一歩である。出典：arXiv","timestamp":1794509758000,"title":"Towards a Theory of Learnability via Debate","titleJa":"ディベートで学べるのか――アライメント訓練プロトコルの学習理論","url":"https://arxiv.org/abs/2611.17303"},{"authors":["Gaurav Parmar","Zhengqi Li","Richard Zhang","Jun-Yan Zhu","Srinivasa Narasimhan","Eli Shechtman","Yotam Nitzan"],"categories":["cs.CV","cs.AI","cs.GR","cs.LG"],"field":"cs.CV","genre":"Vision / Multimodal","monthKey":"2026-11","publishedAt":"2026-11-12T18:55:09Z","source":"arXiv","summaryHtml":"対話的な動画変換では、リアルタイムに生成しながら長い時間の一貫性を保つことが求められる。近年の高速な手法はアテンションを固定長の因果ウィンドウに制限することで速度を稼ぐが、関連する履歴がウィンドウの外に出ると長期の一貫性が損なわれる。本論文は、動画変換には明示的なフレーム間参照があることに着目した対応付け型の手法vid2vid-longを提案する。入力動画で一致する領域は、出力動画でも一致すべきだという考え方だ。<br><br>具体的には入力動画のパッチ単位の対応を計算し、その対応にもとづいて過去に生成した出力の対応する領域を検索し、対応クロスアテンションでモデルに条件づける。固定ウィンドウに縛られないため、遠い過去の履歴も生成に生かせる。実験では近年の動画モデルに適用して長期の時間的一貫性
