関係に結びつくと論じる。3人の思想を横断することで、自己意識が単なる自己観察ではなく、生き方そのものを方向づける働きであることが浮かび上がる。出典：Crossref","timestamp":1794700800000,"title":"The Nature of Self-Consciousness: Exploration through Sartre, Shankaracharya and Sina","titleJa":"自己意識とは何か――サルトル、シャンカラ、アヴィケンナが語る自己の本性","url":"https://doi.org/10.3329/pp.v75i1.93271"},{"authors":["Patrizio Tressoldi"],"categories":[],"field":"PsyArXiv","genre":"Consciousness / Philosophy","monthKey":"2026-11","publishedAt":"2026-11-15T00:00:00Z","source":"OSF Preprints","summaryHtml":"臨死体験は心停止や昏睡など生命の危機にともなって語られることが多いが、失神や深い瞑想、催眠、サイケデリクス状態など、生命の脅威がない場面でもよく似た体験が報告される。本総説は、こうした「臨死様体験」と本物の臨死体験とで、体験の内容や心理的な特徴、その後の変化に違いがあるのかを検証した。<br><br>最大規模の回顧調査、混合法のオンライン研究、同一人物内でのサイケデリクス比較を横断した結果、中核的な特徴は文脈を越えて広く重なっていた。一方で、亡くなった人や霊的存在との遭遇は臨死体験の34.7%にみられたのに対し、臨死様体験25例では0件で、人生回顧や「引き返せない地点」も臨死体験にのみ現れた単一事例があった。<br><br>ただし等価性を検証するよう設計された研究はなく、対象は自己選択的で回顧的、測定の等価性も未検証のため、両者が同一だと結論づけるのは早い。著者らは神経生理学的・心理学的・進化的・形而上学的な解釈への含意を整理し、前向きで事前登録された十分な規模の研究を今後の課題に挙げる。出典：OSF Preprints","timestamp":1794700800000,"title":"Near-Death Experiences and Near-Death-Like Experiences: A Comparative Synthesis and Implications for Their Interpretation","titleJa":"臨死体験と臨死様体験はどこが違うのか――現象・心理・後遺効果の比較統合","url":"https://osf.io/preprints/psyarxiv/tu64g_v1/"},{"authors":["David Hason Rudd","Dennis Singh","Cesar Sanin","Bryn James"],"categories":["cs.CY","cs.AI"],"field":"cs.CY","genre":"Ethics / Safety","monthKey":"2026-11","publishedAt":"2026-11-14T23:48:47Z","source":"arXiv","summaryHtml":"AIが中核業務に組み込まれるにつれ、倫理・法務・運用の複雑なリスクを管理する企業ガバナンス基盤の必要性が高まっている。多くの組織がAI倫理の原則を掲げる一方、AIガバナンスを取締役会の優先事項とする組織の半数未満しか正式な枠組みを持たないという実施の隔たりがある。本論文はその隔たりを埋める構造化された企業AIガバナンス・アーキテクチャ（CAIGA）を提案する。<br><br>柱は二つある。一つは、最高プライバシー責任者（CPO）や最高倫理責任者（ChEO）といった専門のC-suite職の役割の進化で、企業全体のAI利用に対する説明責任を制度化する。もう一つは、法務・技術・データサイエンス・サイバーセキュリティ・事業部門を横断するAIガバナンス委員会で、倫理原則を運用上の決定へ翻訳し、新規AI施策の戦略的なゴー／ノーゴー承認を含む仕組みを担う。<br><br>査読文献やEU AI法を含む規制枠組み、業界実務の概念的検討に基づき、明確な説明責任ポリシー、構造化されたリスク管理ワークフロー、組織全体の倫理的AI文化を組み込んだ再現可能な枠組みを示し、金融サービス部門への適用で例示した。企業リーダーやリスク専門家、政策立案者への直接の示唆を持つ。出典：arXiv","timestamp":1794700127000,"title":"Architecting the Corporate AI Infrastructure: The Evolving Roles of AI Governance Committees and Chief Ethics Officers","titleJa":"企業のAIガバナンス基盤を設計する――AIガバナンス委員会と最高倫理責任者の役割","url":"https://arxiv.org/abs/2611.19670"},{"authors":["Jiaju Justin Yan","Xiaqing Nancy He","Alan Boss"],"categories":[],"field":"SocArXiv","genre":"Other","monthKey":"2026-11","publishedAt":"2026-11-14T23:11:31Z","source":"OSF Preprints","summaryHtml":"起業家は苦境にある事業を続けるかどうかの判断でAIに頼るようになった。だが粘り強さの理論は、その要因を起業家本人の内面か人間同士のネットワークに求めてきた。本論文はAIを、人間ではない第三の要因として位置づける理論枠組みを提示する。心理的資源アプローチやエスカレーション理論、閾値理論、AI起業エージェンシー枠組みを土台に、二つの経路を区別する。<br><br>資源経路では、AIが心理的資源を補い、粘り強さの強度を高め、起業家自身の内的資源への依存を緩める。認識経路では、AIが判断の土台となるフィードバックそのものを形づくり、反証的な証拠への応答性として定義される「粘り強さの較正」を左右する。5つの命題は、二つの経路が組み合わさってAIによるエスカレーション増幅が生じる条件や、不確実性が自信と較正の乖離を広げる仕組み、エージェンシー型AIが逆境と向き合う決断の場面を減らす過程を具体化する。<br><br>時間的な拡張として、持続的なAIの支えが粘り強さをもろくする可能性も論じる。AIをめぐる楽観論と悲観論の双方を調停し、小規模事業主や助言者、AI設計者に向けた検証可能な示唆を提示する。起業の現場でAIが「続ける力」をどう変えるかを考えるための枠組みである。出典：OSF Preprints","timestamp":1794697891000,"title":"Keep on Keeping On, With a Machine: Artificial Intelligence and the Calibration of Entrepreneurial Persistence","titleJa":"AIに相談して続けるかやめるか――起業家の「粘り強さ」をAIがどう変えるか","url":"https://osf.io/preprints/socarxiv/gtd4z_v1/"},{"authors":["Ziwei Gu","Michael S. Lee","Drew Rein","Yash Maurya"],"categories":["cs.CL"],"field":"cs.CL","genre":"LLM / NLP","monthKey":"2026-11","publishedAt":"2026-11-14T22:16:38Z","source":"arXiv","summaryHtml":"シンガポールはLLMの法律推論を試す独特の舞台だ。継承した英コモンローと現地特有の法令が組み合わさり、モデルは一般的なコモンローの直観と現地の法理を区別しなければならない。また一般の法律相談では事実が不足しがちで、結論を左右する事実は準拠する法理次第で変わる。既存の法律ベンチマークはシンガポール法も、この種のあいまいさ認識もほとんど扱ってこなかった。<br><br>本研究はシンガポール法の自由記述式法律推論とあいまいさ認識のための大規模ベンチマーク「SG-LegalClarify」を提案する。弁護士が作成した1100問（10法領域、完全指定340問・不足指定760問）からなり、不足指定の各問には隠れた事実と完全指定版の対応問があり、計1860の評価事例になる。回答は弁護士作成のIRAC（争点・準則・適用・結論）ルーブリックで採点される。<br><br>19のLLMをクローズドブックとウェブ検索付きで評価した結果、最良モデルでも必須ルーブリック項目の充足率はクローズドブックで69.8%（平均53.8%）、ウェブ検索付きで77.8%（平均63.0%）にとどまり、ベンチマークは未飽和である。モデルは明確化が必要な場面の認識にも苦労した。公開スプリットと評価パイプラインが公開される。出典：arXiv","timestamp":1794694598000,"title":"SG-LegalClarify: A Large-Scale Benchmark for Legal Reasoning and Ambiguity Recognition in Singapore Law","titleJa":"シンガポール法の法律推論ベンチマーク――あいまいさを見抜く力を測る","url":"https://arxiv.org/abs/2611.19643"},{"authors":["Mirco Milletarì","Tuhin Kundu"],"categories":["cs.AI"],"field":"cs.AI","genre":"Agents / Robotics","monthKey":"2026-11","publishedAt":"2026-11-14T20:45:31Z","source":"arXiv","summaryHtml":"複雑な場面で働くエージェントは、環境情報の不完全さ、曖昧なユーザー指示、複雑な業務ルール、方策の確率的ゆらぎに直面する。LLMエージェントのベンチマークは増えているが、実運用での信頼性を評価するには、条件ごとに性能を定量化する体系的な枠組みが必要だ。Thinkingboxベンチマークでも最強モデルが業務シナリオで一貫した性能を出せずにいる。<br><br>本論文はエージェントシステムの不確実性と信頼性を評価する統計的フレームワークを提案する。シナリオ・事例・サンプルの階層を定義し、平均合格率、pass@k、pasŝ^kといった既存の指標に不確実性の推定を付与する。指標ごとにサンプリングのばらつきを明示し、条件別の性能を体系的に比較できるようにする。階層の異なる水準で集計すると、方策モデルの異なる構造や性質が見えてくる。<br><br>著者らはこの階層的集計を、物理学や統計学の「粗視化（coarse-graining）」と結びつけ、階層的な不確実性伝播を構成的に導出した。不偏なpass@k推定量の有限標本での分散の厳密な式も独自に導き、実行ノイズとタスクの異質性を分離する。出典：arXiv","timestamp":1794689131000,"title":"A Hierarchical Statistical Framework for Evaluating Agent Reliability","titleJa":"エージェントの信頼性を測る階層的統計フレームワーク","url":"https://arxiv.org/abs/2611.19614"}],"updatedAt":"2026-11-17T19:38:21Z","version":1};
    const byId = id => document.getElementById(id);
    const norm = s => String(s||'').toLowerCase().normalize('NFKC').replace(/\s+/g,' ').trim();
    const esc = s => String(s||'').replace(/[&<>"]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
    const plainText = h => String(h||'').replace(/<br><br>/g,' ').replace(/<[^>]+>/g,'');
    const months = [...new Set((DATA.articles||[]).map(a => a.monthKey).filter(Boolean))].sort().reverse();
    const genres = [...new Set((DATA.articles||[]).map(a => a.genre).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'ja'));
    const fields = [...new Set((DATA.articles||[]).map(a => a.field).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'ja'));
    function fill(select, values){ values.forEach(v=>{ const o=document.createElement('option'); o.value=v; o.textContent=v; select.appendChild(o); }); }
    fill(byId('month'), months); fill(byId('genre'), genres); fill(byId('field'), fields);
    // ---- filter persistence: URL query params win over localStorage ----
    const FILTER_IDS = ['month','genre','field','sort','pageSize'];
    const LS_KEY = 'rd-filters-v1';
    function readUrlState(){ try { const p = new URLSearchParams(location.search); const s = {}; let any = false; FILTER_IDS.concat(['keyword']).forEach(id=>{ if (p.has(id)) { s[id] = p.get(id); any = true; } }); return any ? s : null; } catch(e){ return null; } }
    function readLsState(){ try { return JSON.parse(localStorage.getItem(LS_KEY) || 'null'); } catch(e){ return null; } }
    function applyState(s){ if (!s) return; FILTER_IDS.forEach(id=>{ if (s[id] != null) byId(id).value = s[id]; }); if (s.keyword != null) byId('keyword').value = s.keyword; }
    function currentState(){ const s = {}; FILTER_IDS.forEach(id=>{ s[id] = byId(id).value; }); s.keyword = byId('keyword').value; return s; }
    function persist(){ const s = currentState(); try { localStorage.setItem(LS_KEY, JSON.stringify(s)); } catch(e){} try { const p = new URLSearchParams(); Object.keys(s).forEach(k=>{ if (s[k]) p.set(k, s[k]); }); const q = p.toString(); history.replaceState(null, '', q ? '?' + q : location.pathname); } catch(e){} }
    applyState(readUrlState() || readLsState());
    // ---- summary folding ----
    const FOLD_CHARS = 180;
    const expanded = new Set();
    let currentPage = 1;
    function render(){
      const month=byId('month').value, genre=byId('genre').value, field=byId('field').value, sort=byId('sort').value, kw=norm(byId('keyword').value);
      let rows=(DATA.articles||[]).filter(a=>{
        if(month&&a.monthKey!==month) return false; if(genre&&a.genre!==genre) return false; if(field&&a.field!==field) return false;
        const hay=norm([a.titleJa,a.title,a.summaryHtml,a.authors.join(' '),a.categories.join(' ')].join(' '));
        if(kw&& !hay.includes(kw)) return false; return true;
      });
      rows = rows.slice().sort((a,b)=> sort==='oldest' ? a.timestamp-b.timestamp : sort==='title' ? a.titleJa.localeCompare(b.titleJa,'ja') : b.timestamp-a.timestamp);
      const pageSize = parseInt(byId('pageSize').value, 10) || 0;
      const totalPages = pageSize ? Math.max(1, Math.ceil(rows.length / pageSize)) : 1;
      if (currentPage > totalPages) currentPage = totalPages;
      if (currentPage < 1) currentPage = 1;
      const pageRows = pageSize ? rows.slice((currentPage - 1) * pageSize, currentPage * pageSize) : rows;
      byId('pageInfo').textContent = rows.length ? `${currentPage} / ${totalPages} ページ` : '0 / 0 ページ';
      byId('prevPage').disabled = currentPage <= 1;
      byId('nextPage').disabled = currentPage >= totalPages;
      byId('meta').textContent = `更新: ${DATA.updatedAt || '-'} / 表示件数: ${rows.length}件`;
      byId('emptyState').style.display = rows.length ? 'none' : 'block';
      byId('list').innerHTML = pageRows.map(a=>{
        const plain = plainText(a.summaryHtml);
        const isLong = plain.length > FOLD_CHARS;
        const open = expanded.has(a.url);
        const summaryHtml = (!isLong || open) ? (a.summaryHtml || '') : esc(plain.slice(0, FOLD_CHARS)) + '…';
        const btn = isLong ? `<button type="button" class="summary-toggle" data-url="${esc(a.url)}" aria-expanded="${open}">${open ? '閉じる' : '続きを読む'}</button>` : '';
        return `
        <article>
          <p class="meta">${esc(a.source)}　${esc(a.publishedAt.slice(0,10))}</p>
          <h2 class="article-title">${esc(a.titleJa)}</h2>
          <div class="taxonomy"><span class="chip">${esc(a.genre)}</span><span class="chip">${esc(a.field)}</span>${a.categories.slice(0,4).map(c=>`<span class="chip">${esc(c)}</span>`).join('')}</div>
          <div class="summary">${summaryHtml}</div>${btn}
          <div class="source-box"><strong>ソース・引用元</strong>配信元：${esc(a.source)}<br>原題：${esc(a.title)}<br>著者：${esc(a.authors.join(', '))}<br>原文URL：<a href="${esc(a.url)}" target="_blank" rel="noopener">${esc(a.url)}</a></div>
        </article>`;
      }).join('');
    }
    function resetAndRender(){ currentPage = 1; persist(); render(); }
    ['month','genre','field','sort','pageSize'].forEach(id=>byId(id).addEventListener('change',resetAndRender)); byId('keyword').addEventListener('input',resetAndRender);
    byId('prevPage').addEventListener('click',()=>{ if(currentPage>1){ currentPage--; render(); } });
    byId('nextPage').addEventListener('click',()=>{ currentPage++; render(); });
    byId('list').addEventListener('click',e=>{
      const btn = e.target && e.target.closest ? e.target.closest('.summary-toggle') : null;
      if (!btn) return;
      const u = btn.getAttribute('data-url');
      if (expanded.has(u)) expanded.delete(u); else expanded.add(u);
      render();
    });
    byId('resetFilters').addEventListener('click',()=>{
      byId('month').value=''; byId('genre').value=''; byId('field').value=''; byId('sort').value='newest'; byId('keyword').value=''; byId('pageSize').value='20';
      try { localStorage.removeItem(LS_KEY); } catch(e){}
      try { history.replaceState(null, '', location.pathname); } catch(e){}
      currentPage = 1; render();
    });
    render();
  </script>
