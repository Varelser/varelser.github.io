overy: Open-Ended Scientific Discovery over Competing Explanations","titleJa":"対比的発見――競合する説明の比較で科学的発見を進めるLLMエージェント","url":"https://arxiv.org/abs/2611.14514"},{"authors":["Yeyuan Liu"],"categories":["cs.LG","q-bio.NC"],"field":"cs.LG","genre":"Consciousness / Neuroscience","monthKey":"2026-11","publishedAt":"2026-11-10T18:55:48Z","source":"arXiv","summaryHtml":"コネクトームで制約したモデルが、配線をシャッフルしたり組み換えたりしたモデルより優れれば「構造が機能を決める」と主張されることが多い。しかしこの比較には落とし穴がある。コネクトームが決めるのは「誰が誰とつながるか」だけで、興奮性やゲイン、可塑性の速度といった生理学的なパラメータまでは決まらないため、モデルを作る側が本物の配線のモデルがうまく動くまで調整してしまいがちだ。本研究は、生理学を本物の配線で調整してヌルモデルに転用するP1、配線ごとに個別に調整するP2、P2を独立したデータと整合する生理学に限定するP3という3つの推定方法を区別し、機械学習で知られるバイアス（調整不足のベースライン、重みの継承、勝者の呪い）が生物学的な結論に何をもたらすかを、合成の正解データ、プラセボ・ヌル、3つのショウジョウバエ回路モデルで測定した。<br><br>すべての方法で生き残った主張もある。報酬と罰のドーパミンを分離することは学習を改善し、頭方向のトポグラフィーは持続的なバンプ（活動の隆起）に必要だった。一方キノコ体では、本物のケニオン細胞の出力配線がP1とP2では交差サブタイプ同一性シャッフルを0.09上回ったものの、P3では0.09下回った（95%信頼区間はゼロを除外し、ホールドアウトでも確認）。結論を分けたのは、活性ケニオン細胞のうちalpha'beta'細胞の占める割合で、P1はこれを低く選んでいた。画像データが示す約44%では本物の配線のモデルは学習に失敗し、ハエの配線の欠陥ではなくモデルの不十分さが露呈した。<br><br>flyvisでも、P1は鏡像コネクトームを不利に扱ったが、そこには誤差が本物の配線と中央値で0.07以内の構成的な解があり、50例中50例で空間シャッフルより優れていた。この順位は10倍の再訓練でも保たれたが、50倍のチェックポイントに依存した。著者らは、信頼できる構造の主張には、最適化の対応づけ、データで制約された生理学、そしてその条件でも機能するモデルが必要だと結論づけている。コネクトーム研究の方法論に警鐘を鳴らす検証である。","timestamp":1794336948000,"title":"When Does the Real Wiring Win? Testing connectome structure-function claims against unmeasured physiology","titleJa":"「本物の配線」は本当に勝つのか――コネクトームの構造-機能主張の検証","url":"https://arxiv.org/abs/2611.14508"},{"authors":["Daniel Lenton"],"categories":["cs.LG"],"field":"cs.LG","genre":"Agents / Reasoning","monthKey":"2026-11","publishedAt":"2026-11-10T18:55:01Z","source":"arXiv cs.LG","summaryHtml":"エージェント型ハーネスは継続学習の有望な仕組みとして注目されているが、既存のベンチマークには限界があった。単一の応用領域に偏り、各事例は一度しか提示されず、学習器の系統も一つに限られるため、記憶ベースと重みベースの手法を同じ尺度で比較できなかった。本研究は、ARC-AGIの3エディションから作った生涯学習ストリーム「Continual-ARC」を提案する。領域知識を要しない課題が、休止期間を挟んで新しい事例とともに繰り返し現れ、新課題も次々に到着する。学習器は事例ごとにデモの購入、回答の提出、ハーネス内での行動ができ、誤答のリトライも可能で、消費したフィードバック予算の割合で採点される。事例間で保持するものに制限はないため、記憶ベースと重みベースの手法が同じ尺度で評価できる。<br><br>学習終了後、学習器を凍結し、出会った課題の新しい事例で記憶を、未見の課題で汎化を測る。Qwen3.5-9BとGLM-5.3 Flashを用いたエージェントハーネス（重み固定、永続化あり／なし）と、プロンプトによる下限、プログラム帰納法、GLM-5.3 Flashを模倣するよう学習させたQwen3.5-9Bを比較した。その結果、ハーネスへの永続化は、明示的な専門家の指導がない限り記憶の改善につながらず、ほとんどのハーネス型手法は、課題のデモを単にキャッシュするだけの下限にも及ばなかった。<br><br>未見の課題では、ハーネス型手法はいずれも向上しなかったのに対し、重みベースの学習は大幅な向上を示した。重みを更新する継続学習が、ハーネスを新しい領域で駆動できるモデルを育てる道を開くことを示唆する結果である。","timestamp":1794336901000,"title":"Continual-ARC: Measuring Skill Acquisition over a Working Lifetime","titleJa":"Continual-ARC――ARC-AGIで生涯学習のスキル獲得を測る","url":"https://arxiv.org/abs/2611.14505"},{"authors":["Howard Zhang","Chuck Arvin","Logan Brown","Mihir Bhatia","Neelu Choudhary","Lily Miao"],"categories":["cs.AI","cs.LG","cs.CL"],"field":"cs.AI","genre":"Agents / Reasoning","monthKey":"2026-11","publishedAt":"2026-11-10T18:50:06Z","source":"arXiv","summaryHtml":"LLMベースの分析エージェントを企業で運用するには、複雑な多ツールのワークフロー全体で失敗を確実に検出できる評価フレームワークが欠かせない。本研究は、トレースに基づくLLMジャッジ、レッドチーミング付きテキストのみのLLMジャッジ、決定論的ヒューリスティクスという3つの異なる評価パラダイムを、2つの分析エージェントに適用して比較した。凍結した実行トレースを用い、評価ハーネスの安定性、既知リスクの検出、未知リスクの発見という3段階で検証している。<br><br>安定性の測定では、設定の97%が安定性の閾値を満たし、そのパターンはエージェントに依存しないことがわかった。72件の正解付きテストケースでの既知リスク検出では、トレースに基づく手法が適合率と再現率のバランスで最良（F1=0.90）となり、テキストのみの評価は再現率では並んだものの誤検出が5倍多かった。未知リスクの発見では24件の新規の失敗が見つかり、機能テストとセキュリティのレッドチーミングのあいだに重なりはなかった。<br><br>結果から、評価の質を決めるのは評価ハーネスが得られる情報量であること、機能評価とセキュリティ評価は互いに補完的であること、LLMベースの評価ハーネスは人間のレビューが見逃す微妙な誤りも拾うことが示された。著者らは、機能評価にはトレースに基づく評価を、セキュリティ検証には敵対的なレッドチーミングを組み合わせる二本立ての戦略を推奨している。","timestamp":1794336606000,"title":"Comparative Analysis of Agent Evaluation Frameworks: Stability, Detection, and Discovery in Enterprise Analytics Agents","titleJa":"エージェント評価フレームワークの比較分析――企業向け分析エージェントの安定性・検出・発見","url":"https://arxiv.org/abs/2611.14493"},{"authors":["Kaiyuan Hou","Yang Ping Kuo","Indranil Bhattacharya","Rohith Nama","Arushi Gupta","Carlos D. Castillo","Prathap Ramachandra","Xiaofan Jiang","Francesco Carbone"],"categories":["cs.AI"],"field":"cs.AI","genre":"Agents / Reasoning","monthKey":"2026-11","publishedAt":"2026-11-10T18:49:47Z","source":"arXiv","summaryHtml":"業務自動化では、同じ標準作業手順（SOP）を新しい入力に対して何度も繰り返し実行する。LLMエージェントは自然言語で書かれたSOPに従うことができるが、実行のたびにすべての手順選択をLLMに問い合わせるため、規模が大きくなると遅延とコストがかさむ。本研究は、SOPと数件の実行ログから、コードが次の手順を選ぶ再利用可能なワークフローを生成する手法「ReTrace」を提案する。<br><br>エージェントがツール呼び出しとともに記す推論には、なぜその行動を取ったのかが述べられていることが多い。ReTraceは各手順の背後にある条件を抽出し、複数の実行にわたって統合してコンパクトなルール文書にまとめ、そこから実行可能なワークフローを生成する。最後の段階だけが実行基盤に依存し、ルール文書は異なるオーケストレーション基盤向けにコンパイルできる。<br><br>実運用の79手順では完了率93.8%（エージェントは96.8%）で、タスクあたりのコストは24%削減された。τ²-Benchでは成功率75.8%（エージェント80.6%）ながら、実行時間は170秒から1.3秒へと大幅に短縮された。訓練時の失敗から修復を3回繰り返すと成功率が上がり、SOP-Benchでは修復後に87.8%に達した。わずかな精度低下と引き換えに、高速化と低コスト化を両立させる設計である。","timestamp":1794336587000,"title":"ReTrace: Distilling Tool-Using Agents into Planner-Free Workflows","titleJa":"ReTrace――ツール利用エージェントをプランナー不要のワークフローへ蒸留する","url":"https://arxiv.org/abs/2611.14492"},{"authors":["Muhan Gao","Hangxiao Zhu","Xinqi Su","Yu Zhang","Daniel Khashabi","Kuan-Hao Huang"],"categories":["cs.AI"],"field":"cs.AI","genre":"LLM / NLP","monthKey":"2026-11","publishedAt":"2026-11-10T18:47:22Z","source":"arXiv","summaryHtml":"研究のアイデア出しは、フィードバックを受けながら少しずつ磨いていく反復的な過程である。だが既存の評価はその探索過程を覆い隠しており、LLMが研究アイデアの空間をどう探索し、何が進歩を妨げているのかを理解しにくくしていた。本研究は「二十の質問」の形式を研究アイデア出しに転用したRe-Searchを提案する。発表済み論文の研究課題だけを与え、モデルはイエス・ノーの質問を繰り返して論文の中核的なアイデアを再発見しなければならない。ICML 2026の論文200件から構築され、質問を重ねるごとにモデルのアイデアがどう進化するかを、二値のオラクルフィードバックとともに追跡し、アイデア出しを実行から切り離して測る。<br><br>6つの最新LLMで試したところ、進歩のほぼすべては100問のうち最初の30問で生じ、その後の展開はそこでほぼ決まっていた。その後はほとんどのモデルが停滞した。候補となる質問や仮説空間への介入実験から、ボトルネックは判断ではなく生成にあることがわかった。モデルは良いアイデアや良い質問が提示されればそれを認識できるのに、自分では生み出せないことが多い。アイデアの軌跡を分析すると、失敗は一方向への過剰な活用か、方向を広げすぎる過剰な探索のいずれかに分かれた。<br><br>この結果は自動研究システムの設計に具体的な指針を与える。モデルは自分で生み出せない候補でも評価できるため、単一モデルの生成能力を高めるよりも、外部から集めたアイデアや質問で探索を豊かにする方が効果的だと著者らは結論づけている。","timestamp":1794336442000,"title":"Re-Search: Dissecting LLM Ideation Through a Two-Player Questioning Game","titleJa":"二人プレイの質問ゲームでLLMの研究アイデア創出力を測る――Re-Search","url":"https://arxiv.org/abs/2611.14487"},{"authors":["Zhimin Hu","Chen Jiang","Hanbo Xie","N. Apurva Ratan Murty","Sashank Varma"],"categories":["cs.CL","cs.CV"],"field":"cs.CL","genre":"LLM / NLP","monthKey":"2026-11","publishedAt":"2026-11-10T18:45:07Z","source":"arXiv","summaryHtml":"ニューラルネットワークは、予測を行うシステムとしてだけでなく、その内部計算そのものが科学的探究の対象になりつつある。機械的解釈可能性（MI）の進展により、ニューロンや特徴、回路、集団構造、動的パターンとモデル行動との対応づけが可能になってきた。観測できるものが増えるにつれ、関心は「モデル内で何が観測できるか」から「その観測が機械論的な説明をどう支えるか」へと移っている。<br><br>本論文は、神経科学とMIという並行する二つの取り組みを検討し、複雑な神経系からメカニズムを推論する際に繰り返し現れる推論上のボトルネックを特定する。5つの原則を提案し、それらを再帰的な論理として整理することで、より厳密な機械的推論の手続きを示す。局所的な解釈可能性の知見を、モデル内のメカニズムに関する累積的な知識へとつなげる枠組みである。<br><br>この枠組みは、メカニズムをモデル外の領域について検証可能な仮説を生むほど精密にする。一方で、モデルのメカニズムが世界について何を明らかにするかを確定するには、MIを超えた証拠が最終的に必要だとも指摘する。解釈可能性研究を神経科学と科学哲学の接点から見つめ直す論考である。","timestamp":1794336307000,"title":"Mechanistic Interpretability Needs a Logic of Inference","titleJa":"機械的解釈可能性には推論の論理が必要――神経科学との対照から導く5原則","url":"https://arxiv.org/abs/2611.14483"}],"updatedAt":"2026-11-13T08:29:52Z","version":1};
    const byId = id => document.getElementById(id);
    const norm = s => String(s||'').toLowerCase().normalize('NFKC').replace(/\s+/g,' ').trim();
    const esc = s => String(s||'').replace(/[&<>"]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
    const plainText = h => String(h||'').replace(/<br><br>/g,' ').replace(/<[^>]+>/g,'');
    const months = [...new Set((DATA.articles||[]).map(a => a.monthKey).filter(Boolean))].sort().reverse();
    const genres = [...new Set((DATA.articles||[]).map(a => a.genre).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'ja'));
    const fields = [...new Set((DATA.articles||[]).map(a => a.field).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'ja'));
    function fill(select, values){ values.forEach(v=>{ const o=document.createElement('option'); o.value=v; o.textContent=v; select.appendChild(o); }); }
    fill(byId('month'), months); fill(byId('genre'), genres); fill(byId('field'), fields);
    // ---- filter persistence: URL query params win over localStorage ----
    const FILTER_IDS = ['month','genre','field','sort','pageSize'];
    const LS_KEY = 'rd-filters-v1';
    function readUrlState(){ try { const p = new URLSearchParams(location.search); const s = {}; let any = false; FILTER_IDS.concat(['keyword']).forEach(id=>{ if (p.has(id)) { s[id] = p.get(id); any = true; } }); return any ? s : null; } catch(e){ return null; } }
    function readLsState(){ try { return JSON.parse(localStorage.getItem(LS_KEY) || 'null'); } catch(e){ return null; } }
    function applyState(s){ if (!s) return; FILTER_IDS.forEach(id=>{ if (s[id] != null) byId(id).value = s[id]; }); if (s.keyword != null) byId('keyword').value = s.keyword; }
    function currentState(){ const s = {}; FILTER_IDS.forEach(id=>{ s[id] = byId(id).value; }); s.keyword = byId('keyword').value; return s; }
    function persist(){ const s = currentState(); try { localStorage.setItem(LS_KEY, JSON.stringify(s)); } catch(e){} try { const p = new URLSearchParams(); Object.keys(s).forEach(k=>{ if (s[k]) p.set(k, s[k]); }); const q = p.toString(); history.replaceState(null, '', q ? '?' + q : location.pathname); } catch(e){} }
    applyState(readUrlState() || readLsState());
    // ---- summary folding ----
    const FOLD_CHARS = 180;
    const expanded = new Set();
    let currentPage = 1;
    function render(){
      const month=byId('month').value, genre=byId('genre').value, field=byId('field').value, sort=byId('sort').value, kw=norm(byId('keyword').value);
      let rows=(DATA.articles||[]).filter(a=>{
        if(month&&a.monthKey!==month) return false; if(genre&&a.genre!==genre) return false; if(field&&a.field!==field) return false;
        const hay=norm([a.titleJa,a.title,a.summaryHtml,a.authors.join(' '),a.categories.join(' ')].join(' '));
        if(kw&& !hay.includes(kw)) return false; return true;
      });
      rows = rows.slice().sort((a,b)=> sort==='oldest' ? a.timestamp-b.timestamp : sort==='title' ? a.titleJa.localeCompare(b.titleJa,'ja') : b.timestamp-a.timestamp);
      const pageSize = parseInt(byId('pageSize').value, 10) || 0;
      const totalPages = pageSize ? Math.max(1, Math.ceil(rows.length / pageSize)) : 1;
      if (currentPage > totalPages) currentPage = totalPages;
      if (currentPage < 1) currentPage = 1;
      const pageRows = pageSize ? rows.slice((currentPage - 1) * pageSize, currentPage * pageSize) : rows;
      byId('pageInfo').textContent = rows.length ? `${currentPage} / ${totalPages} ページ` : '0 / 0 ページ';
      byId('prevPage').disabled = currentPage <= 1;
      byId('nextPage').disabled = currentPage >= totalPages;
      byId('meta').textContent = `更新: ${DATA.updatedAt || '-'} / 表示件数: ${rows.length}件`;
      byId('emptyState').style.display = rows.length ? 'none' : 'block';
      byId('list').innerHTML = pageRows.map(a=>{
        const plain = plainText(a.summaryHtml);
        const isLong = plain.length > FOLD_CHARS;
        const open = expanded.has(a.url);
        const summaryHtml = (!isLong || open) ? (a.summaryHtml || '') : esc(plain.slice(0, FOLD_CHARS)) + '…';
        const btn = isLong ? `<button type="button" class="summary-toggle" data-url="${esc(a.url)}" aria-expanded="${open}">${open ? '閉じる' : '続きを読む'}</button>` : '';
        return `
        <article>
          <p class="meta">${esc(a.source)}　${esc(a.publishedAt.slice(0,10))}</p>
          <h2 class="article-title">${esc(a.titleJa)}</h2>
          <div class="taxonomy"><span class="chip">${esc(a.genre)}</span><span class="chip">${esc(a.field)}</span>${a.categories.slice(0,4).map(c=>`<span class="chip">${esc(c)}</span>`).join('')}</div>
          <div class="summary">${summaryHtml}</div>${btn}
          <div class="source-box"><strong>ソース・引用元</strong>配信元：${esc(a.source)}<br>原題：${esc(a.title)}<br>著者：${esc(a.authors.join(', '))}<br>原文URL：<a href="${esc(a.url)}" target="_blank" rel="noopener">${esc(a.url)}</a></div>
        </article>`;
      }).join('');
    }
    function resetAndRender(){ currentPage = 1; persist(); render(); }
    ['month','genre','field','sort','pageSize'].forEach(id=>byId(id).addEventListener('change',resetAndRender)); byId('keyword').addEventListener('input',resetAndRender);
    byId('prevPage').addEventListener('click',()=>{ if(currentPage>1){ currentPage--; render(); } });
    byId('nextPage').addEventListener('click',()=>{ currentPage++; render(); });
    byId('list').addEventListener('click',e=>{
      const btn = e.target && e.target.closest ? e.target.closest('.summary-toggle') : null;

    byId('resetFilters').addEventListener('click',()=>{
      byId('month').value=''; byId('genre').value=''; byId('field').value=''; byId('sort').value='newest'; byId('keyword').value=''; byId('pageSize').value='20';
      try { localStorage.removeItem(LS_KEY); } catch(e){}
      try { history.replaceState(null, '', location.pathname); } catch(e){}

    render();
  </script>
