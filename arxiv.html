rs": ["Eliane Younes", "Elie Hachem", "Marc Bernacki"], "categories": ["cond-mat.mtrl-sci", "cs.LG"]}, {"source": "arXiv cs.AI", "title": "ServerBench: How can your coding agents design specialized LLM serving systems?", "titleJa": "ServerBench――コーディングエージェントにLLMサービングシステムを設計させられるか", "summaryHtml": "LLMコーディングエージェントは実験を通じてソフトウェアを開発する。その力を使えば、自分たちの運用を支えるサービングシステム自体を設計させることもできる。有効なサービングには、セッション依存性、レイテンシ制約、正しさの要件のもとで、実装と運用の判断を調整することが求められる。本論文は、完全で特化したLLMサービングシステムのエージェント設計を測るベンチマーク「ServerBench」を提案する。<br><br>エージェントは共通の目的――「ドルあたりドル」、すなわちGPUコスト1ドルあたりの、レイテンシ条件を満たしたトークン価値――に対して実験を行う。状態を持つリプレイがセッション依存性を保ち、独立した検証が提出されたシステムを確認する。<br><br>11のコーディングエージェントモデルと3つの配備条件での評価では、Claude Sonnet 5.5がGemma E4Bで2.97ドル/ドルを達成し、vLLM参照実装の4.87倍となった。33回の実行のうち22回が検証済みシステムを生み、13回が最強のベースラインを上回った。分析からは、高価値な設計に共通する3つの知見が特定されている。", "url": "https://arxiv.org/abs/2611.06841", "publishedAt": "2026-11-04T17:59:07Z", "timestamp": 1793815147000, "monthKey": "2026-11", "field": "cs.AI", "genre": "LLM / NLP", "authors": ["Xinrui Zhong", "Zhiming Wang", "Yongqi Liu", "Zhaohui Wang", "Shanglin Yang", "Zikun Li", "Zhuoming Chen", "Beidi Chen"], "categories": ["cs.AI"]}, {"source": "arXiv cs.CV", "title": "Same Layout, Different Count: What Number Words Do Past Ten in Text-to-Image Models", "titleJa": "同じレイアウト、違う数――テキスト画像生成モデルで数詞は「10を超えたら」何をするか", "summaryHtml": "SD3.5-Mediumに物体を12個描かせ、同じ初期ノイズから25個に変えてみる。画像のレイアウトは保たれるが、数は新しいランダムシードのときと同じくらいしか変わらず、方向も一貫しない。本研究は、オープンなテキスト画像生成モデル5つについて、要求がおよそ10個を超えたときに数詞が何をするかを調べる。<br><br>物体と初期ノイズを固定し、一度に1つだけを変えながら、要求を見ていない人々が3,088枚の画像を数えた。すべてのモデルは小さな群衆では数に従うが、それには限界（リーチ）がある。SD3.5-MとFLUX.1-devは10を少し超えたところで従わなくなり、FLUX.2 [klein] とQwen-Imageは25までゆるやかに従う。<br><br>SD3.5-Mのリーチを超えると、初期ノイズの粗い部分が画像の構図を決めるが、物体の数は決めない。画像の1/8より細かいノイズだけを描き直してもレイアウトは新しい数のときと同じくらい保たれる。数詞が「構図の種」として働く一方で、個数の精密な制御には届いていない実態が浮かぶ。", "url": "https://arxiv.org/abs/2611.06840", "publishedAt": "2026-11-04T17:57:53Z", "timestamp": 1793815073000, "monthKey": "2026-11", "field": "cs.CV", "genre": "Vision / Multimodal", "authors": ["Liang Yue", "Eric A. Vance"], "categories": ["cs.CV", "cs.LG"]}, {"source": "arXiv cs.CL", "title": "Before You Continue: Evaluating Time-Sensitive Safety Awareness in Conversational Assistants", "titleJa": "続ける前に――会話アシスタントの時間依存の安全意識を評価する", "summaryHtml": "LLMアシスタントは、時間に依存する制約を伴う日常活動をますます手伝うようになっている。しかしユーザが後のリクエストでその制約に触れるとは限らず、アシスタントは自分で気づいて助言を調整する必要がある。この能力を評価するために、本論文はベンチマーク「TASC（会話における時間的行動安全性）」を提案する。<br><br>TASCは128のテンプレートから作られた3,418件の入力と、経過時間の計算能力と、その情報を適用する能力を比較するための33のシナリオ群からなる。<br><br>13モデルでの評価では、提案された行動が規則に違反するケースで、アシスタントが時間依存の制約を考慮できたのは30.5%にとどまり、不要な警告はまれだった。より重要なのは、正しく時間を計算できていながら制約の適用に失敗するケースが62.1%あったことである。「計算できること」と「対話の中で使うこと」の間の溝が、安全上の課題として浮き彫りになった。", "url": "https://arxiv.org/abs/2611.06839", "publishedAt": "2026-11-04T17:54:49Z", "timestamp": 1793814889000, "monthKey": "2026-11", "field": "cs.CL", "genre": "LLM / NLP", "authors": ["Peidi Dong", "Yunze Xiao", "Yu-Lin Tsai", "Yichen Zheng", "Heyuan Huang", "Weihao Xuan", "Mark Dredze", "Jen-tse Huang"], "categories": ["cs.CL"]}, {"source": "arXiv cs.CV", "title": "Context-Aware Autoregressive Image Generation for Emerging Reasoning Properties", "titleJa": "文脈を意識した自己回帰画像生成――創発する推論特性に向けて", "summaryHtml": "自己回帰型の画像生成は近年、競争力のある視覚生成パラダイムとして台頭してきた。しかし生成の順序は、次パッチ予測、ランダム順予測、特定スケールでの一括生成のように、あらかじめ決められたものかヒューリスティックなものが多く、これらの戦略はモデルが画像の重要な構造的依存性を見落とす原因となり、構造的な頑健性と推論能力の双方を制限していた。<br><br>本研究は、全体の文脈と現在の局所情報に基づいてモデルが次のトークン位置を動的に決める、文脈を意識した自己回帰生成フレームワークを提案する。固定やランダムの順序に従うのではなく、生成過程そのものが画像構造と意味的な依存関係へ適応する。<br><br>広範な実験では、文脈を意識した生成が、マスク型自己回帰を含む異なる画像自己回帰パラダイムにわたって構造的頑健性を有意に改善することが示された。生成順序を設計対象として捉え直す研究である。", "url": "https://arxiv.org/abs/2611.06838", "publishedAt": "2026-11-04T17:54:14Z", "timestamp": 1793814854000, "monthKey": "2026-11", "field": "cs.CV", "genre": "Vision / Multimodal", "authors": ["Jixuan Ying", "Haoyu Liu", "Timing Yang", "Tingyu Zhu", "Predrag Neskovic", "Anand Bhattad", "Cihang Xie", "Zeyu Zheng", "Alan Yuille", "Feng Wang"], "categories": ["cs.CV"]}, {"source": "arXiv cs.LG", "title": "Context--Answer Metamodels: Forecasting LLM Activations Before the First Answer Token", "titleJa": "文脈―応答メタモデル――最初の応答トークンの前にLLMの活性化を予測する", "summaryHtml": "確率的デコーディングのもとでは、1つの文脈から言語モデルは多様な応答を引き出しうる。このばらつきの特性評価には通常、多数の高コストな自己回帰ロールアウトが必要で、しかも各 rollout が示すのは1つの実現だけである。本研究は、文脈を読む際に生じる活性化から、モデルのロールアウト活性化を直接予測できるかを問う。<br><br>著者らは、文脈の活性化系列を、平均プールされた応答活性化の点予測または分布予測へ写す「文脈―応答メタモデル」を訓練した。<br><br>主な知見は4つある。(i) 検討した4つのメタモデル族は平均プール応答活性化を高い忠実度で予測し、分布メタモデルはロールアウトの変動も捉える。(ii) 訓練集合が50万プロンプトまで増えるにつれて性能が向上し、ドメイン外データセットへもゼロショットで汎化する。(iii) 予測には行動を予測する信号が保持される。(iv) Qwen2.5の文脈活性化から応答活性化が予測できる。多数のサンプリングをせずに応答分布の見通しを得る道筋である。", "url": "https://arxiv.org/abs/2611.06837", "publishedAt": "2026-11-04T17:53:52Z", "timestamp": 1793814832000, "monthKey": "2026-11", "field": "cs.LG", "genre": "LLM / NLP", "authors": ["Tommy He", "Thomas Jiralerspong"], "categories": ["cs.LG", "cs.AI"]}, {"source": "arXiv cs.CL", "title": "LooM: Loop-Invariant Memory for Causal Encoder-Decoder Language Models", "titleJa": "LooM――因果的エンコーダ・デコーダ言語モデルのためのループ不変メモリ", "summaryHtml": "ループ型Transformerは共有層を再実行することで実効的な深さを増やすが、採用を妨げる3つの限界がある。メモリがループ回数とともに増えること、計算量の調整がブロック単位でしかできないこと、訓練後にループ回数を変えにくいことである。本論文はそのそれぞれに対処する「LooM（ループ不変メモリ）」を提案する。<br><br>因果的エンコーダ・デコーダ（CED）において、LooMは最初のデコーダ層以降だけをループさせ、それらはトークンごとに一度だけ書かれる大域メモリを読む。各層はトークンのキー・バリュー（KV）エントリを最初の訪問時にだけ公開するため、キャッシュはループ回数とともに増えない。<br><br>各層が独立にループすることで、トークンあたり3〜21回の層実行というあらゆる予算が可能になり、予算をランダムにサンプリングして訓練した1つのモデルが、ルータなしで全予算をカバーする。十分なループ数では、同じデータで訓練した単一パスのベースラインを、言語モデリング、ゼロショット精度、長文脈パープレキシティで上回った。", "url": "https://arxiv.org/abs/2611.06835", "publishedAt": "2026-11-04T17:52:11Z", "timestamp": 1793814731000, "monthKey": "2026-11", "field": "cs.CL", "genre": "LLM / NLP", "authors": ["Lele Yang", "Muxi Diao", "Zhonghao Yan", "Jiankang Chen", "Bin Wen", "Tingting Gao", "Wentao Zhang", "Kongming Liang", "Zhanyu Ma", "Weiran Xu"], "categories": ["cs.CL"]}]}"Zhuohan Xie", "Anke Xu", "Wenbo Cao", "Jiarui Chen", "Zehan Li", "Jimin Huang", "Alejandro Lopez-Lira", "Yuehua Tang", "Sophia Ananiadou", "Jian-Yun Nie"], "categories": ["cs.CL"]}, {"source": "arXiv cs.CL", "title": "Measuring Risk, Not Harm: Detecting Psychological Harm Risk Factors in LLM Conversations", "titleJa": "害ではなくリスクを測る――LLM会話における心理的危害のリスク要因検出", "summaryHtml": "LLMとの対話による心理的危害は、繰り返しの対話の中で現れ、利用者個人の主観的な文脈に強く依存するため、直接監視することはできない。本論文は「害ではなくリスクを測る」ことを提案する。AIの応答レベルで観測可能な、心理的危害のリスク要因となるAIの振る舞いを検出し、その信号を集約して長期的な監視を支えるという発想である。<br><br>著者らは8つのそのような振る舞いを操作化し、47,062件のAI応答と373,873件の応答―要因ラベルからなる合成マルチラベルコーパスを構築した。検証と評価のために対象を絞った人手注釈も用意されている。<br><br>訓練済みの埋め込みベース分類器、LLMによる直接判定、分類器と判定器のカスケードが比較された。すべての検出器はモデル非依存で、LLMの出力だけに働き、内部状態へのアクセスを必要としない。検出器は、先行研究の複数の分布外の人間―AI会話データセットへも適用されている。危害そのものではなく前兆を捉える、安全性監視の実務的な設計である。", "url": "https://arxiv.org/abs/2611.06806", "publishedAt": "2026-11-04T17:22:23Z", "timestamp": 1793812943000, "monthKey": "2026-11", "field": "cs.CL", "genre": "LLM / NLP", "authors": ["Nil-Jana Akpinar", "Eugenia Kim", "Natalie Isak", "Amanda Minnich", "Victoria Westerhoff", "Matthew Dressman"], "categories": ["cs.CL", "cs.CY"]}, {"source": "arXiv cs.AI", "title": "Task-Efficient Agent Evaluation Using Cached Traces", "titleJa": "キャッシュした軌跡でエージェント評価を効率化する", "summaryHtml": "効率的なベンチマークは、少数のタスク実行からシステムの完全なベンチマーク性能を推定する。標準的な手法は、すでに評価された参照システム群の実行の二値の正しさだけに依拠する。しかしエージェントシステムは実行ごとに豊かな軌跡（トレース）を生み、それは能力について遥かに多くを明かしうる。この情報を活かすには、有用な軌跡表現が必要である。<br><br>本論文は、軌跡を、LLMで構造化要約を抽出し、標準的なテキストエンコーダで埋め込むことで表現する手法を提案する。この表現は、正しさとタスク関連の信号を保ちながら、生の軌跡埋め込みを支配するシステムの同一性、モデルファミリー、実行ハーネス関連の信号の存在を最小化する。<br><br>全参照システムの各タスク実行についてこの表現が得られれば、システムの低次元表現を構築でき、新しいシステムのスコアを、少数の実行から予測できる。評価コストの高いエージェント時代のベンチマーク設計に対する提案である。", "url": "https://arxiv.org/abs/2611.06803", "publishedAt": "2026-11-04T17:20:09Z", "timestamp": 1793812809000, "monthKey": "2026-11", "field": "cs.AI", "genre": "LLM / NLP", "authors": ["Ben Johnson", "Hayden Helm"], "categories": ["cs.AI"]}, {"source": "arXiv cs.RO", "title": "ConDR: Conservative Reachability through Neural Hamilton-Jacobi Subsolutions", "titleJa": "ConDR――ニューラルHJ部分解による保守的な到達可能性解析", "summaryHtml": "ハミルトン・ヤコビ（HJ）到達可能性は、最悪ケースの外乱のもとで失敗へ追い込まれうる力学系の不安全な状態を特定する。しかし古典的な格子ベースのソルバは、状態次元に対して指数的にスケールする。DeepReachは格子を、HJ-Isaacs（HJI）変分不等式（VI）で訓練したニューラル価値関数に置き換えて拡張性を高めたが、残差の両側を等しく罰するため、学習された値が真の値を上回り、不安全な状態が安全と誤分類されうる。<br><br>本論文は「ConDR（保守的DeepReach）」を提案する。学習された不安全集合が真の集合を含むよう、HJI VIの部分解を学ぶことを目指す。ConDRは障害物分岐と終端条件を構成上強制し、一方向の損失でHJI残差を安全マージンεだけゼロ未満へ押し下げ、すべてを不安全と分類する自明解を防ぐ。<br><br>マージン付き問題の厳密解についての証明も与えられている。安全性の文脈で「誤って安全と判定する」方向の誤りを構造的に抑える設計であり、学習ベース到達可能性解析の信頼性を高める試みである。", "url": "https://arxiv.org/abs/2611.06802", "publishedAt": "2026-11-04T17:18:50Z", "timestamp": 1793812730000, "monthKey": "2026-11", "field": "cs.RO", "genre": "Generative Models", "authors": ["Kendra Givens", "Taylor T. Johnson", "Bryan C. Ward", "Thomas Beckers"], "categories": ["cs.RO", "cs.LG", "eess.SY"]}]};
    const byId = id => document.getElementById(id);
    const norm = s => String(s||'').toLowerCase().normalize('NFKC').replace(/\s+/g,' ').trim();
    const esc = s => String(s||'').replace(/[&<>"]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
    const months = [...new Set((DATA.articles||[]).map(a => a.monthKey).filter(Boolean))].sort().reverse();
    const genres = [...new Set((DATA.articles||[]).map(a => a.genre).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'ja'));
    const fields = [...new Set((DATA.articles||[]).map(a => a.field).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'ja'));
    function fill(select, values){ values.forEach(v=>{ const o=document.createElement('option'); o.value=v; o.textContent=v; select.appendChild(o); }); }
    fill(byId('month'), months); fill(byId('genre'), genres); fill(byId('field'), fields);
    function render(){
      const month=byId('month').value, genre=byId('genre').value, field=byId('field').value, sort=byId('sort').value, kw=norm(byId('keyword').value);
      let rows=(DATA.articles||[]).filter(a=>{
        if(month&&a.monthKey!==month) return false; if(genre&&a.genre!==genre) return false; if(field&&a.field!==field) return false;
        const hay=norm([a.titleJa,a.title,a.summaryHtml,a.authors.join(' '),a.categories.join(' ')].join(' '));
        if(kw&& !hay.includes(kw)) return false; return true;
      });
      rows = rows.slice().sort((a,b)=> sort==='oldest' ? a.timestamp-b.timestamp : sort==='title' ? a.titleJa.localeCompare(b.titleJa,'ja') : b.timestamp-a.timestamp);
      byId('meta').textContent = `更新: ${DATA.updatedAt || '-'} / 表示件数: ${rows.length}件`;
      byId('list').innerHTML = rows.map(a=>`
        <article>
          <div class="src">${esc(a.source)} / ${esc(a.publishedAt.slice(0,10))}</div>
          <h2 class="title">${esc(a.titleJa)}</h2>
          <div class="tags"><span class="tag">AI</span><span class="tag">${esc(a.genre)}</span><span class="tag">${esc(a.field)}</span>${a.categories.slice(0,4).map(c=>`<span class=\"tag\">${esc(c)}</span>`).join('')}</div>
          <div class="summary">${a.summaryHtml}</div>
          <div class="box"><strong>ソース・引用元</strong><br>配信元：${esc(a.source)}<br>原題：${esc(a.title)}<br>著者：${esc(a.authors.join(', '))}<br>原文URL：<a href="${esc(a.url)}" target="_blank" rel="noopener">${esc(a.url)}</a></div>
        </article>`).join('');
    }
    ['month','genre','field','sort'].forEach(id=>byId(id).addEventListener('change',render)); byId('keyword').addEventListener('input',render); render();
  </script>
