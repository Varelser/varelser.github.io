05T18:22:24Z", "source": "arXiv cs.AI", "summaryHtml": "チャットは多くのLLMタスクの既定の画面であり続ける一方で、モデルが見ているのは現在の対話だけで、その周りのワークスペースは見えていない。本研究は「メタアクセス」――アシスタントにインターフェース自体の構造化された権限付きの見取り図を与える考え方を提案し、機能の案内、メタデータ・設定・好みへのアクセス、要約やメッセージの検索、確認を伴う変更、完全なオーケストレーションへと段階をなす梯子を示す。<br><br>メタアクセスにより、チャットクライアントは多くの画面の集合から、検索・移動・整理・操作の単一の入口へ変わる。その一方で、根拠づけやプライバシー、プロンプトインジェクション、信頼をめぐるリスクも生じる。汎用エージェントの枠組みは自らの設定を変えられる実行環境であり、メタアクセスは再帰的になるため、別の制御面の境界が必要になるという。<br><br>著者らは「Chat AI」クライアントのMeta Chatプロトタイプでこれを具体化した。要約や設定、関連メッセージから限定された文脈を構築し、会話や話題、ペルソナへの参照を結びつけ、確認可能で可逆的な変更を支え、チュートリアル集とペルソナ推薦を備える。スクリーンリーダーをウィジェットの説明から意味的なワークスペース操作へ拡張できる点も示す。IDEやダッシュボード、オフィススイート、OSへアシスタントが組み込まれるにつれ、インターフェースは自らの状態と能力を構造化された権限付きの形で開示すべきだと結論づける。", "timestamp": 1793902944000, "title": "The Power of Meta Access in the Software of the Future --- Demonstrated on LLM Chat UIs and Chat AI", "titleJa": "メタアクセスの力――未来のソフトウェアでLLMチャットをワークスペースの操作層へ", "url": "https://arxiv.org/abs/2611.08428"}, {"authors": ["Michal P. Podolinsky", "Yunhao Yang", "Daniel Little", "Hong Lu", "Rohan Siva", "Olin Goudey", "Neel P. Bhatt", "Matthias Scheutz", "Ufuk Topcu"], "categories": ["cs.RO", "cs.AI"], "field": "cs.RO", "genre": "Ethics / Safety", "monthKey": "2026-11", "publishedAt": "2026-11-05T18:21:07Z", "source": "arXiv cs.RO", "summaryHtml": "視覚・言語・行動モデル（VLA）は汎用的な身体知能を可能にするが、分布シフトのもとでは性能が脆く、予期せぬ失敗が機器の損傷や人の危険につながりうる。実世界への展開には、適時で校正済み、かつ情報量があり、エッジで動くほど軽い実行時モニターが求められるが、既存手法はこれらの条件を満たせていない。本論文は、VLAバックボーンの潜在層に対する軽量プローブ「VLA-Tug」を提案する。<br><br>失敗直前の軌跡区間で教師あり学習を行うことで、同じ誤検出率のもとでの早期の失敗検出を、最強の学習ベースラインより最大30%改善し、見逃し率と誤警報率の上限を保証する。未知タスクへのシフト下でも、その上限の有効性は最大86%の実行で維持され、ベースラインの最大21%を大きく上回った。さらに失敗モード自体を予測でき、未知タスクでの上位3位精度を多数派ベースラインより最大44%高めた。<br><br>適切なタイミングの軽量な介入により、タスク成功率も改善する。3,180件の注釈付き操作エピソードからなるデータセットも公開された。安全な実世界展開に向けた、実行時の失敗監視の研究である。", "timestamp": 1793902867000, "title": "Failure Prediction and Classification in Vision-Language-Action Models Via Calibrated Latent Probing", "titleJa": "視覚言語行動モデルの失敗を予測する――校正済み潜在プローブによる早期検出と失敗分類", "url": "https://arxiv.org/abs/2611.08425"}, {"authors": ["Chenruo Liu", "Zihan Wang", "Yijun Dong", "Qi Lei"], "categories": ["cs.LG", "stat.ML"], "field": "cs.LG", "genre": "LLM / NLP", "monthKey": "2026-11", "publishedAt": "2026-11-05T18:17:39Z", "source": "arXiv cs.LG", "summaryHtml": "低ランク適応（LoRA）は教師ありファインチューニング（SFT）でも強化学習（RL）でも広く使われ、最適化の設定も似通っている。だが、二つの段階で学習のダイナミクスがどう異なり、それがLoRAの最適化する低ランク更新にどう現れるかは明らかでなかった。本研究は数学的推論タスクにおいて、LoRA更新の特異スペクトルと部分空間を追跡した。RLではあらゆる学習率でスペクトルが集中するのに対し、SFTでは中程度の学習率でスペクトルが広がった。さらにRLは小さな学習率でも特異部分空間をはるかに速く回転させることが分かった。<br><br>SFTとRLを一要素ずつ補間しながら原因を切り分けると、両方の違いの源はグループ平均ベースライン減算にあることが特定された。LoRAで更新される二次多重指数モデルによる解析では、その仕組みも明らかになった。グループ平均ベースライン減算は、整合的なフィッティングと勾配ノイズという二つの競合する力のバランスを、スペクトル集中と速い部分空間回転の側へ傾け、同時にリスク面で望ましい学習率を低く抑える。<br><br>この知見に基づき、著者らは段階ごとにLoRA更新を調整した。SFTでは更新全体のスペクトルを平坦化して適応を特異方向全体に広げ、RLでは現在のLoRA増分範囲の外側の部分を平坦化して部分空間の回転を促す。複数のモデルによる数学的推論タスクの実験では、それぞれの設定が比較対象の手法の中でほとんどの設定で最良の性能を示した。SFTとRLでLoRAを別々に扱うべき根拠を与える研究である。", "timestamp": 1793902659000, "title": "Spectral and Subspace Dynamics of LoRA in Supervised Fine-Tuning and Reinforcement Learning", "titleJa": "SFTと強化学習におけるLoRAのスペクトル・部分空間ダイナミクス", "url": "https://arxiv.org/abs/2611.08414"}, {"authors": ["Joshua Stiller", "Annika Schneider", "Eyke Hüllermeier"], "categories": ["cs.LG", "stat.ML"], "field": "cs.LG", "genre": "Scientific AI", "monthKey": "2026-11", "publishedAt": "2026-11-05T18:15:42Z", "source": "arXiv cs.LG", "summaryHtml": "科学的機械学習では、洪水予測や金融リスク管理、機械の熱制御といった安全上重要な判断にモデルが使われるため、不確実性の定量化が欠かせない。コンフォーマル予測は分布に依存しないカバレッジ保証を与える手法だが、物理や工学に多い時間依存の設定ではその保証が崩れ、系統的な過小カバレッジが生じることがある。本研究は、偏微分方程式で記述される時間依存の物理系のサロゲートモデルを対象に、この問題を理論的に調べた。<br><br>まず関数空間の設定では、任意に近い時刻の分布が互いに特異になりうるため、厳密なカバレッジ保証は不可能であることを証明した。さらに離散化された設定では、全変動距離が格子解像度とともに指数関数的に速く飽和することが多く、カバレッジを確保するには空間離散化に制限が必要になることも示した。<br><br>そのうえで、特定の設定においては原理に基づいた重み付きコンフォーマル予測を用いることで、増大する時間軸にわたって有限サンプルのカバレッジ保証が得られることを示した。時間依存系における不確実性定量化の限界と、その限界を越えるための条件を明らかにした研究である。", "timestamp": 1793902542000, "title": "Conformal Prediction for Time-Dependent PDEs", "titleJa": "時間依存PDEに対するコンフォーマル予測――時間とともに保証が崩れる理由とその回復", "url": "https://arxiv.org/abs/2611.08409"}, {"authors": ["Yang Ouyang", "Jung-Eun Kim"], "categories": ["cs.AI", "cs.CL", "cs.LG"], "field": "cs.AI", "genre": "Agents / Reasoning", "monthKey": "2026-11", "publishedAt": "2026-11-05T18:12:49Z", "source": "arXiv cs.AI", "summaryHtml": "連鎖的思考（チェーン・オブ・ソート）の推論精度を上げる自己整合性（セルフ・コンシステンシー）は広く使われるデコード戦略だが、完全な推論軌跡をあらかじめ決めた予算で多数サンプリングする必要がある。既存の効率化手法は、全軌跡のサンプリングを途中で打ち切るか、質問ごとにサンプル数を配分するものが中心だった。本論文は、ステップ単位で誤りを局所化して再サンプリングする手法 StepBack を提案する。<br><br>StepBack はまず少数のドラフト軌跡を用意し、軽量なシグナルで最初の誤り位置の候補を特定する。次に、その誤りステップとそれ以降の接尾辞だけを再サンプリングし、多数決で最終回答を決める。7つの数学推論・マルチホップ質問応答ベンチマークでの評価では、平均精度は自己整合性と同等を維持しながら、トークン使用量を最大41.26%削減した。<br><br>さらに StepBack は Adaptive Consistency のような適応的推論手法と組み合わせることもでき、推論時の効率をさらに高められる。軌跡全体ではなく誤りのある部分だけをやり直すという発想で、テスト時推論のコストを大きく下げつつ精度を保つ実践的な手法である。", "timestamp": 1793902369000, "title": "StepBack: Step-Level Error-Localized Resampling for Efficient Test-Time Reasoning", "titleJa": "StepBack――ステップ単位の誤り局所化リサンプリングによる効率的なテスト時推論", "url": "https://arxiv.org/abs/2611.08403"}, {"authors": ["Tushaar Gangavarapu", "Gil Tabak", "Clemens JS Schaefer"], "categories": ["cs.LG"], "field": "cs.LG", "genre": "LLM / NLP", "monthKey": "2026-11", "publishedAt": "2026-11-05T17:53:49Z", "source": "Hugging Face Papers", "summaryHtml": "線形アテンションは文脈を固定サイズのキー・バリュー状態に圧縮し、線形時間の学習と定数メモリでの推論を実現する。ゲート付きデルタルールモデルはこの状態を減衰させ、入力キーに対する予測を消去してから新しい値を書き込む。Gated DeltaNet-2（GDN-2）はチャネルごとの減衰と、分離されたフルランクの消去・書き込みゲートでこれを一般化した。しかし状態更新は、消去よりも書き込みに対してはるかに敏感であることが分かった。キーの活性化と単位正規化によりキーのエネルギーは少数のチャネルに集中する一方、値の書き込みは全チャネルに及ぶため、消去ゲートは低ランクで十分だという。<br><br>さらに、ゆっくり減衰する状態行は速い行よりはるかに大きなノルムを蓄積し、重みなしの読み出しを支配して、干渉を抑えるためにより強い書き込み時の消去を強いていた。そこでMuirは、すべてのゲートを感度配分型の低ランク射影に統合し、マッチドフィルタ読み出しゲートで状態行を重み付けし、節約したパラメータをより広いフィードフォワード層に再投資する。大きなチャンクサイズで広い行列ユニットを飽和させる際に、標準のチャンクワイズアルゴリズムが数値的に不安定になる問題に対しては、安定で効率的な学習のための並列更新を設計した。<br><br>1億6,600万〜13億4,000万パラメータの範囲で、MuirはGDN-2よりパープレキシティを1.8〜2.0%、Transformerより2.5〜3.6%下げ、常識精度を最大1.9ポイント上げ、抽出的想起も改善した。13億4,000万パラメータではマルチホップとマルチニードルの想起で両ベースラインを上回り、4Kの学習長から1,000万トークンのストリームへ2,560倍に外挿してもパープレキシティの漂いはなく、100万トークンまでのパスキャー検索はほぼ100%を維持した。GDN-2並みのスループットを保ちつつ、100Bトークンの検証損失に1.2倍速く到達し、32KではTransformerより2.7倍速く学習する。", "timestamp": 1793901229000, "title": "Muir: Linear Attention with Sensitivity-Allocated Gating and Matched-Filter Readout", "titleJa": "Muir――感度配分ゲートとマッチドフィルタ読み出しによる線形アテンション", "url": "https://arxiv.org/abs/2611.08376"}, {"authors": ["Fuhao Li", "Wenxuan Song", "Qizhou Huang", "Ziyang Zhou", "Jingbo Wang", "Junwu E", "Pengwei Wang", "Yan Wang", "Shunbo Zhou", "Haoang Li"], "categories": ["cs.RO"], "field": "cs.RO", "genre": "Robotics", "monthKey": "2026-11", "publishedAt": "2026-11-05T17:52:16Z", "source": "Hugging Face Papers", "summaryHtml": "確実なロボット操作には、意味の理解と3次元空間での精密な制御の両方が要る。だが視覚・言語・行動（VLA）基盤モデルは2次元の視覚言語事前学習から表現を引き継ぎ、空間的な教師信号はタスク固有の適応時にしか入らないことが多い。本研究は、空間理解を転移可能な基盤モデルの能力として育てるため、より広いロボット経験から学ぶSLA（空間・言語・行動モデル）を提案する。<br><br>事前学習済みのロボット方策π0.5から初期化し、行動予測と、中間視覚埋め込みと凍結した3次元知覚モデルによる空間表現との整合を共同で最適化する。空間学習を支えるため、異なる身体・タスク・場面にまたがる多様なロボットデータセットを整備・統合した。特徴依存ゲートが複数のVLA層からの視覚埋め込みを適応的に集約し、教師モデルはRGB観測に加えて部分的に利用可能な深度やカメラ較正も活用する。<br><br>確率的な状態ドロップアウトにより視覚的手がかりへの依存を促し、実演軌跡への過剰適合を抑える。補助的な構成要素はすべて学習時のみに使い、事前学習済みVLAの重みをそのまま再利用でき、推論時の構造は変えない設計になっている。", "timestamp": 1793901136000, "title": "SLA: Scaling Spatial-Language-Action Model via Continual Pre-training", "titleJa": "SLA――継続事前学習で空間・言語・行動モデルに空間理解を組み込む", "url": "https://arxiv.org/abs/2611.08373"}, {"authors": ["Siva Rajesh Kasa", "Yasong Dai", "Sumit Negi", "Hongdong Li"], "categories": ["cs.CL"], "field": "cs.CL", "genre": "LLM / NLP", "monthKey": "2026-11", "publishedAt": "2026-11-05T17:41:20Z", "source": "arXiv cs.CL", "summaryHtml": "マスク付き拡散言語モデルはテキストを並列に生成できるが、複数トークンを独立にサンプリングするとトークン間の依存関係が壊れ、出力分布が変わってしまう。連続時間サンプリングならこの近似を避けて正確な分布が得られるものの、通常はトークン1つあたり1回の逐次的なモデル評価が必要になる。本研究は、別途ドラフトモデルを用意することなく、この逐次ボトルネックを減らす学習不要の投機的サンプラー SpecCTMC を提案する。<br><br>SpecCTMC は、すでに計算済みのモデル予測を用いて連続するトークン更新を提案し、その中間状態を並列に評価したうえで、厳密な受理・修正手続きを適用する。提案手法が、基礎となる連続時間マルコフ連鎖のイベント時刻・生成順序・トークン値の同時分布を保存することを証明した。時間の離散化誤差も、並列デコーディングによる追加の分解誤差も生じない。<br><br>LLaDA-8B-Instruct と Dream-v0-Instruct-7B を用い、5つのベンチマークで評価した結果、直接の連続時間サンプリングと比べて逐次モデル評価回数を1.73〜4.38倍削減しながら、参照サンプリング分布を維持した。拡散言語モデルの高速化と分布の正確さを両立させる手法である。", "timestamp": 1793900480000, "title": "SpecCTMC: Exact Speculative Simulation of Diffusion Language Model Continuous-Time Markov Chains", "titleJa": "SpecCTMC――拡散言語モデルの連続時間マルコフ連鎖を正確に投機サンプリングする手法", "url": "https://arxiv.org/abs/2611.08362"}], "updatedAt": "2026-11-10T07:28:13Z", "version": 1};
    const byId = id => document.getElementById(id);
    const norm = s => String(s||'').toLowerCase().normalize('NFKC').replace(/\s+/g,' ').trim();
    const esc = s => String(s||'').replace(/[&<>"]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
    const months = [...new Set((DATA.articles||[]).map(a => a.monthKey).filter(Boolean))].sort().reverse();
    const genres = [...new Set((DATA.articles||[]).map(a => a.genre).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'ja'));
    const fields = [...new Set((DATA.articles||[]).map(a => a.field).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'ja'));
    function fill(select, values){ values.forEach(v=>{ const o=document.createElement('option'); o.value=v; o.textContent=v; select.appendChild(o); }); }
    fill(byId('month'), months); fill(byId('genre'), genres); fill(byId('field'), fields);
    function render(){
      const month=byId('month').value, genre=byId('genre').value, field=byId('field').value, sort=byId('sort').value, kw=norm(byId('keyword').value);
      let rows=(DATA.articles||[]).filter(a=>{
        if(month&&a.monthKey!==month) return false; if(genre&&a.genre!==genre) return false; if(field&&a.field!==field) return false;
        const hay=norm([a.titleJa,a.title,a.summaryHtml,a.authors.join(' '),a.categories.join(' ')].join(' '));
        if(kw&& !hay.includes(kw)) return false; return true;
      });
      rows = rows.slice().sort((a,b)=> sort==='oldest' ? a.timestamp-b.timestamp : sort==='title' ? a.titleJa.localeCompare(b.titleJa,'ja') : b.timestamp-a.timestamp);
      byId('meta').textContent = `更新: ${DATA.updatedAt || '-'} / 表示件数: ${rows.length}件`;
      byId('list').innerHTML = rows.map(a=>`
        <article>
          <div class="src">${esc(a.source)} / ${esc(a.publishedAt.slice(0,10))}</div>
          <h2 class="title">${esc(a.titleJa)}</h2>
          <div class="tags"><span class="tag">AI</span><span class="tag">${esc(a.genre)}</span><span class="tag">${esc(a.field)}</span>${a.categories.slice(0,4).map(c=>`<span class=\"tag\">${esc(c)}</span>`).join('')}</div>
          <div class="summary">${a.summaryHtml}</div>
          <div class="box"><strong>ソース・引用元</strong><br>配信元：${esc(a.source)}<br>原題：${esc(a.title)}<br>著者：${esc(a.authors.join(', '))}<br>原文URL：<a href="${esc(a.url)}" target="_blank" rel="noopener">${esc(a.url)}</a></div>
        </article>`).join('');
    }
    ['month','genre','field','sort'].forEach(id=>byId(id).addEventListener('change',render)); byId('keyword').addEventListener('input',render); render();
  </script>
