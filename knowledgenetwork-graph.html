tags":["theory","science"],"birth":null,"death":null,"href":"https://note.com/search?q=from%3A%40varelser%20%E3%82%AF%E3%82%AA%E3%83%AA%E3%82%A2%E5%95%8F%E9%A1%8C%E3%81%A8%E6%84%8F%E8%AD%98%E3%81%AE%E7%A7%91%E5%AD%A6&context=note&mode=search","article":false,"descRaw":"：主観的体験の質的側面（赤の赤さ、痛みの痛さ）を自然科学的に説明する試み。フランク・ジャクソンの「メアリーの部屋」（1982年）や逆転クオリアなどの思考実験が、物理主義的説明の限界を問うた。意識のハードプロブレムと並ぶ中心テーマで、哲学と神経科学の接点となっている。物理的記述だけでは主観的体験を捉えきれないという問題提起である。"},{"name":"意識についての高次理論（ローゼンタール）","chapter":"c14-意識の未来","sub":2,"subCount":3,"tags":["theory"],"birth":null,"death":null,"href":"https://note.com/search?q=from%3A%40varelser%20%E6%84%8F%E8%AD%98%E3%81%AB%E3%81%A4%E3%81%84%E3%81%A6%E3%81%AE%E9%AB%98%E6%AC%A1%E7%90%86%E8%AB%96%EF%BC%88%E3%83%AD%E3%83%BC%E3%82%BC%E3%83%B3%E3%82%BF%E3%83%BC%E3%83%AB%EF%BC%89&context=note&mode=search","article":false,"descRaw":"：米国の哲学者デイヴィッド・ローゼンタールによる高次思考理論（HOT）。意識を「心的状態についての、より高次の表象」として説明し、一次的な感覚状態と、それを対象とする反省的意識を区別した。1986年の論文「Two Concepts of Consciousness」が起点で、意識の構造をメタ表象から解明する代表的理論となった。"},{"name":"パンサイキズム／汎心論","chapter":"c14-意識の未来","sub":2,"subCount":3,"tags":["theory"],"birth":null,"death":null,"href":"https://note.com/search?q=from%3A%40varelser%20%E3%83%91%E3%83%B3%E3%82%B5%E3%82%A4%E3%82%AD%E3%82%BA%E3%83%A0%EF%BC%8F%E6%B1%8E%E5%BF%83%E8%AB%96&context=note&mode=search","article":false,"descRaw":"：意識を物質の根本的性質とみなす立場。心と物の二元論や物理主義の困難を回避する試みとして、古代から議論されてきた。現代ではギャレン・ストローソンの「Realistic Monism」（2006年）やフィリップ・ゴフの『Galileo's Error』（2019年）が復興を担い、意識のハードプロブレムへの回答の一つとして注目されている。"}],"colocGroups":[[250,251,252],[323,324],[381,382],[415,416],[422,423],[448,449],[475,476],[520,521],[531,532],[542,543],[545,546]]};

      // 切替直後のヒット判定用：到達する配置の画面座標（A2）
      settledSnap: null,
      hoverChapter: -1,
      mind: { r1: 280, r2: 520 }, localGroups: [],
      // 枠ツリー表示用：'radial'（放射状マインドマップ）か 'tree'（枠ツリー）。
      // 2Dのみ有効。3Dでは従来の力学的表示。初期表示は放射状。
      treeMode: 'radial',
      treeHub: null, treeFrames: [], treeGroups: [], treeItems: new Map(),
    };

    const nextFrame = (typeof window.requestAnimationFrame === 'function')
      ? window.requestAnimationFrame.bind(window) : (cb) => setTimeout(cb, 16);
    const cancelFrame = (typeof window.cancelAnimationFrame === 'function')
      ? window.cancelAnimationFrame.bind(window) : (id) => clearTimeout(id);

    const edgeKey = (a, b) => (a < b ? a + '-' + b : b + '-' + a);

    function chapterAnchor(id) {
      const idx = GRAPH_CHAPTERS.findIndex((c) => c.id === id);
      const a = (idx < 0 ? 0 : idx) / GRAPH_CHAPTERS.length * Math.PI * 2;
      return { x: Math.cos(a) * 300, y: Math.sin(a) * 300, z: 0 };
    }

    function buildGraph() {
      if (G.built) return;
      // 単独ページ（knowledgenetwork-graph.html）では埋め込み JSON
      // （KN_GRAPH_DATA）から構築し、一覧ページに埋め込まれている場合は
      // 従来どおり DOM（.layout .person-link）から構築する。JSON の
      // descRaw は一覧ページの li テキストから抽出したもので、descOfLi
      // と同じ整形で desc を作る（言及辺の判定は descRaw を使う）。
      const data = (typeof window !== 'undefined' && window.KN_GRAPH_DATA) || null;
      const anchors = data ? [] : Array.from(document.querySelectorAll('.layout .person-link'));
      const nodes = (data ? data.entries : anchors).map((src, i) => {
        if (data) {
          const anchor = chapterAnchor(src.chapter || '');
          return {
            i, name: src.name,
            core: src.name.split('（')[0].split('(')[0].trim(),
            chapter: src.chapter || '',
            sub: src.sub || 0, subCount: src.subCount || 1,
            tags: src.tags || [],
            birth: src.birth != null ? src.birth : null,
            death: src.death != null ? src.death : null,
            href: src.href || '', article: !!src.article,
            desc: cleanDesc(src.descRaw || ''),
            descRaw: src.descRaw || '',
            el: null,
            ax: anchor.x, ay: anchor.y, az: anchor.z,
            x: 0, y: 0, z: 0, vx: 0, vy: 0, vz: 0, fx: 0, fy: 0, fz: 0,
            fixed: false, sx: 0, sy: 0, sr: 3, sdepth: 0, sf: 1,
          };
        }
        const a = src;
        const sec = a.closest('.section-block');
        const subSec = a.closest('.subsection-block');
        const name = a.dataset.person || a.textContent.trim();
        const anchor = chapterAnchor(sec ? sec.id : '');
        // 小節：マインドマップで章の扇形の中で小節ごとにまとめるための番号。
        // 小節がない章（Ⅵ・Ⅷ）は 0。
        let subIdx = 0, subCount = 1;
        if (subSec && sec) {
          const subs = Array.from(sec.querySelectorAll('.subsection-block'));
          subIdx = Math.max(0, subs.indexOf(subSec));
          subCount = Math.max(1, subs.length);
        }
        return {
          i, name,
          core: name.split('（')[0].split('(')[0].trim(),
          chapter: sec ? sec.id : '',
          sub: subIdx, subCount,
          tags: (a.dataset.tags || '').split(/\s+/).filter(Boolean),
          birth: a.dataset.birth ? parseInt(a.dataset.birth, 10) : null,
          death: a.dataset.death ? parseInt(a.dataset.death, 10) : null,
          href: a.href, article: a.classList.contains('has-article'),
          desc: descOfLi(a.closest('li')),
          descRaw: '',
          el: a,
          ax: anchor.x, ay: anchor.y, az: anchor.z,
          x: 0, y: 0, z: 0, vx: 0, vy: 0, vz: 0, fx: 0, fy: 0, fz: 0,
          fixed: false, sx: 0, sy: 0, sr: 3, sdepth: 0, sf: 1,
        };
      });
      const byCore = new Map();
      nodes.forEach((n) => {
        if (!byCore.has(n.core)) byCore.set(n.core, []);
        byCore.get(n.core).push(n.i);
      });
      // 別名：名前の最後の区切り（・／空白／＝）の後の部分（2文字以上）。
      // 2件以上の項目に対応する曖昧な別名と、一般名詞として誤検出しやすい
      // 別名（サックス＝楽器、行動・マインド＝一般語）は除外する。
      const EXCLUDED_ALIASES = new Set(['サックス', '行動', 'マインド']);
      const aliasToIdx = new Map();
      nodes.forEach((n) => {
        const parts = n.core.split(/[・ 　＝]/);
        const last = parts.length > 1 ? parts[parts.length - 1].trim() : '';
        if ([...last].length >= 2 && last !== n.core) {
          if (!aliasToIdx.has(last)) aliasToIdx.set(last, new Set());
          aliasToIdx.get(last).add(n.i);
        }
      });
      // マッチ対象：コア名＋曖昧でない別名（長い順）
      const matchStrs = [];
      for (const [c, idxs] of byCore) {
        if ([...c].length < 2) continue;
        for (const idx of idxs) matchStrs.push({ str: c, idx, alias: false });
      }
      for (const [a, set] of aliasToIdx) {
        if (set.size === 1 && !EXCLUDED_ALIASES.has(a)) {
          matchStrs.push({ str: a, idx: [...set][0], alias: true });
        }
      }
      matchStrs.sort((x, y) => [...y.str].length - [...x.str].length);
      // 別名の一致はカタカナ語の途中に埋もれたものを数えない
      // （例：「セス」は「プロセス」の一部、「グレイ」は「グレイソン」の一部）。
      const isKata = (ch) => {
        const c = ch.charCodeAt(0);
        return c >= 0x30a0 && c <= 0x30ff;
      };
      const aliasHit = (desc, s) => {
        let start = 0;
        for (;;) {
          const i = desc.indexOf(s, start);
          if (i < 0) return false;
          const before = i > 0 ? desc[i - 1] : '';
          const after = i + s.length < desc.length ? desc[i + s.length] : '';
          const badBefore = before && isKata(before) && isKata(s[0]);
          const badAfter = after && isKata(after) && isKata(s[s.length - 1]);
          if (!badBefore && !badAfter) return true;
          start = i + 1;
        }
      };

      // 共有タグ数（全ペア）。タグ辺は3つ以上共有のものだけを辺として保持する。
      const tagIndex = new Map();
      nodes.forEach((n) => n.tags.forEach((t) => {
        if (!tagIndex.has(t)) tagIndex.set(t, []);
        tagIndex.get(t).push(n.i);
      }));
      const shared = new Map();
      for (const list of tagIndex.values()) {
        for (let x = 0; x < list.length; x++) {
          for (let y = x + 1; y < list.length; y++) {
            const k = edgeKey(list[x], list[y]);
            shared.set(k, (shared.get(k) || 0) + 1);
          }
        }
      }

      G.degStrong = nodes.map(() => 0);
      const edges = [];
      const edgeByKey = new Map();
      const addEdge = (a, b, patch) => {
        const k = edgeKey(a, b);
        let e = edgeByKey.get(k);
        if (!e) {
          e = { a: Math.min(a, b), b: Math.max(a, b), tag: 0, mention: false, coloc: false };
          edgeByKey.set(k, e);
          edges.push(e);
          G.degStrong[a]++;
          G.degStrong[b]++;
        }
        Object.assign(e, patch);
        return e;
      };
      let tagEdges = 0;
      for (const [k, w] of shared) {
        if (w < 3) continue;
        const [a, b] = k.split('-').map(Number);
        addEdge(a, b, { tag: w });
        tagEdges++;
      }

      // 言及辺：説明文（liのテキストから項目名・関連・タグ表示を除いたもの）に
      // 他項目のコア名が含まれるペア。長い名前を優先し、短い名前が長い名前の
      // 部分文字列としてだけ現れる場合は長い方だけを採用する。
      const descText = (li) => {
        const clone = li.cloneNode(true);
        clone.querySelectorAll('.person-link, .related, .tags').forEach((el) => el.remove());
        return clone.textContent;
      };
      let mentionEdges = 0;
      const mentionSet = new Set();
      nodes.forEach((n) => {
        // JSON では descRaw を、DOM では li テキストを使う（同じ文字列）。
        const desc = n.el ? descText(n.el.closest('li')) : (n.descRaw || '');
        if (!desc) return;
        // 最も長い一致文字列を項目ごとに保持する
        const hitStr = new Map();
        for (const m of matchStrs) {
          if (m.idx === n.i) continue;
          const ok = m.alias ? aliasHit(desc, m.str) : desc.includes(m.str);
          if (!ok) continue;
          const prev = hitStr.get(m.idx);
          if (prev === undefined || [...m.str].length > [...prev].length) hitStr.set(m.idx, m.str);
        }
        const hitArr = Array.from(hitStr.keys());
        const drop = new Set();
        for (const h of hitArr) {
          for (const o of hitArr) {
            if (h !== o && nodes[o].core.length > [...hitStr.get(h)].length
              && nodes[o].core.includes(hitStr.get(h))) drop.add(h);
          }
        }
        for (const h of hitArr) {
          if (drop.has(h)) continue;
          const k = edgeKey(n.i, h);
          if (mentionSet.has(k)) continue;
          mentionSet.add(k);
          addEdge(n.i, h, { mention: true });
          mentionEdges++;
        }
      });

      // 同行ペア：1つのliを2名以上が共有する行の全ペア（言及辺として扱う）。
      // JSON では transform9.py が抽出した同行グループを使い、DOM では
      // .person-list li からその場で集める（同じ結果）。
      const colocGroups = (data && data.colocGroups) ? data.colocGroups : (() => {
        const groups = [];
        document.querySelectorAll('.person-list li').forEach((li) => {
          const as = Array.from(li.querySelectorAll('.person-link'));
          if (as.length < 2) return;
          groups.push(as.map((a) => anchors.indexOf(a)).filter((v) => v >= 0));
        });
        return groups;
      })();
      let colocRows = 0, colocPairs = 0;
      for (const idxs of colocGroups) {
        if (idxs.length < 2) continue;
        colocRows++;
        for (let x = 0; x < idxs.length; x++) {
          for (let y = x + 1; y < idxs.length; y++) {
            addEdge(idxs[x], idxs[y], { coloc: true });
            colocPairs++;
          }
        }
      }

      // 交流辺：relationships.json（調査済みの交友・交流61本。出典URL付き）。
      // 既存の辺と重複するペアは1本の辺に「交流」の属性を追加するだけ
      // （重複除去のルールは既存のものと同じ）。
      let relEdges = 0, relNew = 0, relUnmatched = 0;
      let REL_DATA = [];
      try {
        const relEl = document.getElementById('kn-relationships');
        if (relEl) REL_DATA = JSON.parse(relEl.textContent || '[]');
      } catch (_) { REL_DATA = []; }
      const byName = new Map();
      nodes.forEach((n) => { if (!byName.has(n.name)) byName.set(n.name, n.i); });
      const relList = [];
      for (const r of REL_DATA) {
        const a = byName.get(r.a), b = byName.get(r.b);
        if (a === undefined || b === undefined || a === b) { relUnmatched++; continue; }
        relEdges++;
        const before = edgeByKey.size;
        addEdge(a, b, { rel: { type: r.type || '', note: r.note || '', source: r.source || '' } });
        if (edgeByKey.size > before) relNew++;
        relList.push({ a, b, type: r.type || '', note: r.note || '', source: r.source || '' });
      }
      G.relList = relList;

      // 弱い辺：タグ2つ以上共有のうち、各項目の共有タグ数上位3件まで。
      // すでに強い辺（3つ以上共通／言及／同行）のペアは弱い辺にしない。
      const nbrs = nodes.map(() => []);
      for (const [k, w] of shared) {
        if (w < 2) continue;
        const [a, b] = k.split('-').map(Number);
        nbrs[a].push([w, b]);
        nbrs[b].push([w, a]);
      }
      let weakEdges = 0;
      G.degWeak = nodes.map(() => 0);
      const weakSeen = new Set();
      for (let i = 0; i < nodes.length; i++) {
        const top = nbrs[i].sort((x, y) => y[0] - x[0]).slice(0, 3);
        for (const [w, j] of top) {
          const k = edgeKey(i, j);
          if (weakSeen.has(k) || edgeByKey.has(k)) continue;
          weakSeen.add(k);
          const e = { a: Math.min(i, j), b: Math.max(i, j), tag: w, weak: true, mention: false, coloc: false };
          edgeByKey.set(k, e);
          edges.push(e);
          G.degWeak[i]++;
          G.degWeak[j]++;
          weakEdges++;
        }
      }

      // 隣接リスト（周辺表示用。タグは1つ以上の共有で隣接とみなす）
      const adj = nodes.map(() => new Map());
      const adjAdd = (a, b, patch) => {
        let e = adj[a].get(b);
        if (!e) { e = { to: b, tagW: 0, mention: false, coloc: false }; adj[a].set(b, e); }
        Object.assign(e, patch);
        let r = adj[b].get(a);
        if (!r) { r = { to: a, tagW: 0, mention: false, coloc: false }; adj[b].set(a, r); }
        Object.assign(r, patch);
      };
      for (const [k, w] of shared) {
        const [a, b] = k.split('-').map(Number);
        adjAdd(a, b, { tagW: w });
      }
      for (const k of mentionSet) {
        const [a, b] = k.split('-').map(Number);
        adjAdd(a, b, { mention: true });
      }
      for (const idxs of colocGroups) {
        if (idxs.length < 2) continue;
        for (let x = 0; x < idxs.length; x++) {
          for (let y = x + 1; y < idxs.length; y++) adjAdd(idxs[x], idxs[y], { coloc: true });
        }
      }
      for (const r of relList) adjAdd(r.a, r.b, { rel: true });

      G.nodes = nodes;
      G.edges = edges;
      G.edgeByKey = edgeByKey;
      G.adj = adj.map((m) => Array.from(m.values()));
      G.stats = { nodes: nodes.length, tagEdges, mentionEdges, colocRows, colocPairs, weakEdges, relEdges, relNew, relUnmatched, total: edges.length };
      // 既定の中心：最もつながりの多いノード
      let best = -1, bestDeg = -1;
      G.adj.forEach((list, i) => { if (list.length > bestDeg) { bestDeg = list.length; best = i; } });
      G.defaultCenter = best;
      G.center = best;
      // 初期配置：章のアンカー周辺に散らす
      nodes.forEach((n) => placeAtAnchor(n));
      G.built = true;
      // 中心ノード選択用の datalist
      const dl = document.getElementById('graph-names');
      if (dl) {
        const frag = document.createDocumentFragment();
        nodes.forEach((n) => {
          const o = document.createElement('option');
          o.value = n.name;
          frag.appendChild(o);
        });
        dl.appendChild(frag);
      }
    }

    function placeAtAnchor(n) {
      const ang = Math.random() * Math.PI * 2;
      const r = Math.random() * 80;
      n.x = n.ax + Math.cos(ang) * r;
      n.y = n.ay + Math.sin(ang) * r;
      n.z = (Math.random() - 0.5) * (G.dim === '3d' ? 200 : 0);
      n.vx = n.vy = n.vz = 0;
    }

    // 周辺表示の初期配置：中心を原点に固定し、隣接ノードを放射状に置く。
    function placeLocalRadial() {
      if (G.mode !== 'local' || G.center < 0) return;
      G.settledSnap = null; // 目標配置のスナップショットは無効になる
      const c = G.nodes[G.center];
      c.x = 0; c.y = 0; c.z = 0; c.vx = 0; c.vy = 0; c.vz = 0; c.fixed = true;
      const hop1 = G.localHop1 || [];
      const n1 = hop1.length;
      hop1.forEach((idx, k) => {
        const n = G.nodes[idx];
        const ang = (k / Math.max(1, n1)) * Math.PI * 2 + (Math.random() - 0.5) * 0.25;
        const r = 185 + (k % 3) * 45 + Math.random() * 20;
        n.x = Math.cos(ang) * r;
        n.y = Math.sin(ang) * r;
        n.z = G.dim === '3d' ? (Math.random() - 0.5) * 160 : 0;
        n.vx = 0; n.vy = 0; n.vz = 0; n.fixed = false;
      });
      for (const [idx, from] of G.localParent) {
        const n = G.nodes[idx], p = G.nodes[from];
        const ang = Math.atan2(p.y, p.x) + (Math.random() - 0.5) * 0.5;
        const r = Math.hypot(p.x, p.y) + 135 + Math.random() * 60;
        n.x = Math.cos(ang) * r;
        n.y = Math.sin(ang) * r;
        n.z = G.dim === '3d' ? (Math.random() - 0.5) * 160 : 0;
        n.vx = 0; n.vy = 0; n.vz = 0; n.fixed = false;
      }
    }

    // 枠ツリー表示（2Dの追加モード）：章・トピックを四角い枠で囲み、
// そこから項目が枝分かれしていくツリー表示。放射状マインドマップは
// そのまま残し、表示モードで切り替える。ボックスと文字はワールド座標
// で大きさが決まり、ズームで一緒に拡大・縮小する（画面固定のラベル
// ではない）。配置は決定論的で、ボックス同士の重なりはない。
const isTree2d = () => G.dim === '2d' && G.treeMode === 'tree';
const TREE_FS = 11; // 項目ボックスの文字サイズ（ワールド単位）
const TREE_LINE_H = 13;
const TREE_PAD_X = 7;
const TREE_PAD_Y = 5;
const TREE_ROWS_PER_COL = 32; // 全体図：1列あたりの項目数
const TREE_HEADER_H = 36; // 章フレームの見出し高さ
const TREE_FRAME_PAD = 10;
const TREE_GROUP_HEADER_H = 30; // 周辺表示：グループフレームの見出し高さ
// 項目名の折り返し行（1〜2行）。splitName と同じ区切り規則を使う。
function treeLines(name, fs) {
  if (textWidth(name, fs) <= 170) return [name];
  const sp = splitName(name, fs);
  return sp || [name];
}
function treeBoxSize(name, fs) {
  const lines = treeLines(name, fs);
  let w = 0;
  for (const l of lines) w = Math.max(w, textWidth(l, fs));
  return { lines, w: w + TREE_PAD_X * 2, h: lines.length * TREE_LINE_H + TREE_PAD_Y * 2 };
}
// ボックス間の行ピッチ（枠の間隔スライダーで変わる）
const treeSlotH = () => 40 + 6 * (G.force.rest || 1);

/* ---- 2Dマインドマップ（決定論的レイアウト。力学的シミュレーションは走らない） ---- */
    // 全体図：中心ハブ「変性意識」＋9章を枝とする放射状マインドマップ。
    // 章の扇形の角度幅は項目数に比例。上から時計回り（-90°起点）。
    function computeChapterSectors() {
      const counts = GRAPH_CHAPTERS.map((c) => G.nodes.filter((n) => n.chapter === c.id).length);
      const total = counts.reduce((a, b) => a + b, 0) || 1;
      let a = -Math.PI / 2;
      return GRAPH_CHAPTERS.map((c, i) => {
        const span = counts[i] / total * Math.PI * 2;
        const s = { id: c.id, label: c.label, short: c.short, color: c.color, count: counts[i], start: a, span, mid: a + span / 2 };
        a += span;
        return s;
      });
    }

  // 全体図の枠ツリー（上から下）：ハブ「変性意識」→9章フレーム（横一列）
  // →フレーム内の項目ボックス（列ごとに折り返し）。章フレームは四角い枠
  // で囲み、見出しに章名と件数を出す。項目ボックスは全文表示（2行まで
  // 折り返し）で、ボックス同士の重なりはない。広がり＝ハブ→章フレーム
  // の距離、枠の間隔＝章フレーム間の隙間・列間・行ピッチ。
  function layoutTreeAll() {
    G.settledSnap = null;
    const spread = G.force.attract;
    const rest = G.force.rest;
    const slotH = treeSlotH();
    const frameGapX = 20 * rest;
    const colGap = 4 * rest;
    const hubGap = 110 * spread;
    const rowsPerCol = TREE_ROWS_PER_COL;
    // 章ごとの項目（DOM順＝小節順）と列幅
    const frames = [];
    let totalW = 0;
    for (const c of GRAPH_CHAPTERS) {
      const items = G.nodes.filter((n) => n.chapter === c.id);
      const ncols = Math.max(1, Math.ceil(items.length / rowsPerCol));
      let colW = 0;
      const sizes = items.map((n) => {
        const s = treeBoxSize(n.name, TREE_FS);
        if (s.w > colW) colW = s.w;
        return s;
      });
      const w = ncols * colW + Math.max(0, ncols - 1) * colGap + TREE_FRAME_PAD * 2;
      const h = rowsPerCol * slotH + TREE_HEADER_H + TREE_FRAME_PAD * 2;
      frames.push({ id: c.id, label: c.label, short: c.short, color: c.color, count: items.length, items, sizes, ncols, colW, w, h });
      totalW += w;
    }
    totalW += frameGapX * (frames.length - 1);
    const hubW = 140, hubH = 48;
    G.hub = { x: 0, y: 0, sx: 0, sy: 0, w: hubW, h: hubH };
    G.treeHub = { x: 0, y: 0, w: hubW, h: hubH };
    const frameTop = hubH / 2 + hubGap;
    let fx = -totalW / 2;
    G.chapterNodes = [];
    G.treeFrames = [];
    G.treeItems = new Map();
    for (const f of frames) {
      const frame = { id: f.id, label: f.label, short: f.short, color: f.color, count: f.count, x: fx, y: frameTop, w: f.w, h: f.h };
      G.treeFrames.push(frame);
      G.chapterNodes.push({ id: f.id, label: f.label, short: f.short, color: f.color, count: f.count, x: fx + f.w / 2, y: frameTop + f.h / 2, sx: 0, sy: 0, start: 0, span: 0, mid: 0, frame });
      f.items.forEach((n, k) => {
        const col = Math.floor(k / rowsPerCol), row = k % rowsPerCol;
        const cx = fx + TREE_FRAME_PAD + col * (f.colW + colGap) + f.colW / 2;
        const cy = frameTop + TREE_FRAME_PAD + TREE_HEADER_H + row * slotH + slotH / 2;
        const s = f.sizes[k];
        n.x = cx; n.y = cy; n.z = 0; n.vx = 0; n.vy = 0; n.vz = 0; n.fixed = false;
        G.treeItems.set(n.i, { x: cx, y: cy, w: f.colW, h: s.h, lines: s.lines, fs: TREE_FS });
      });
      fx += f.w + frameGapX;
    }
  }

    function layoutMindmapAll() {
      if (isTree2d()) { layoutTreeAll(); return; }
      G.settledSnap = null; // 目標配置のスナップショットは無効になる
      const spread = G.force.attract; // 吸引力スライダー＝広がり（半径の倍率）
      const sectors = computeChapterSectors();
      G.hub = { x: 0, y: 0, sx: 0, sy: 0 };
      G.chapterNodes = [];
      const R1 = 300 * spread;
      for (const s of sectors) {
        G.chapterNodes.push({ ...s, x: Math.cos(s.mid) * R1, y: Math.sin(s.mid) * R1, sx: 0, sy: 0 });
      }
      const RIN = 520 * spread, ROUT = RIN + 540 * G.force.rest * spread;
      for (const s of sectors) {
        const items = G.nodes.filter((n) => n.chapter === s.id);
        // DOM順＝小節順。半径は小節で帯状に分け、同じ小節が同じ半径の弧になる。
        const maxSub = Math.max(0, ...items.map((n) => n.sub || 0));
        items.forEach((n, k) => {
          const ang = s.start + (k + 0.5) / Math.max(1, items.length) * s.span;
          const band = maxSub > 0 ? (n.sub || 0) / maxSub : 0.5;
          const r = RIN + band * (ROUT - RIN);
          n.x = Math.cos(ang) * r;
          n.y = Math.sin(ang) * r;
          n.z = 0; n.vx = 0; n.vy = 0; n.vz = 0; n.fixed = false;
        });
      }
    }

    // 章ラベルの配置（2D全体図のみ）：章ドットからハブと反対方向（弧の外側）
    // へずらし、ハブラベル・章ドット・他の章ラベルと重ならない位置を探す。
    // 狭い扇形の章ほど外側へ押し出される。9章すべて必ず描く（スキップしない）。
    // 描画とテストで共通の純粋関数。戻り値: { hub, hubBox, items: [...] }。
    function computeChapterLabelLayout() {
      if (isTree2d()) return null; // 枠ツリーでは章ラベルはフレームの見出しで描く
      if (G.dim !== '2d' || G.mode !== 'all' || !G.hub || !G.chapterNodes || !G.chapterNodes.length) return null;
      const hp = project(G.hub);
      G.hub.sx = hp.x; G.hub.sy = hp.y;
      for (const cn of G.chapterNodes) {
        const cp = project(cn);
        cn.sx = cp.x; cn.sy = cp.y;
      }
      const boxHitsCircle = (box, cx, cy, r) => {
        const nx = Math.max(box.x0, Math.min(cx, box.x1));
        const ny = Math.max(box.y0, Math.min(cy, box.y1));
        return Math.hypot(cx - nx, cy - ny) < r + 2;
      };
      const boxesOverlap = (a, b) => a.x0 < b.x1 && a.x1 > b.x0 && a.y0 < b.y1 && a.y1 > b.y0;
      // ハブラベル「変性意識」（bold 13px、ハブの下26pxに描画）
      const hubBox = { x0: hp.x - 30, y0: hp.y + 16, x1: hp.x + 30, y1: hp.y + 36 };
      const placed = [hubBox];
      const items = [];
      for (const cn of [...G.chapterNodes].sort((a, b) => b.count - a.count)) {
        const num = cn.label.split(' ')[0];
        const w1 = num.length * 12, w2 = cn.short.length * 12;
        const boxW = Math.max(w1, w2) + 8;
        let dx = cn.sx - hp.x, dy = cn.sy - hp.y;
        const dl = Math.hypot(dx, dy) || 1;
        dx /= dl; dy /= dl;
        const px = -dy, py = dx;
        const cands = [];
        for (const d of [30, 48, 66, 84, 102, 120]) {
          for (const t of [0, -22, 22, -44, 44]) {
            cands.push({ ax: cn.sx + dx * d + px * t, ay: cn.sy + dy * d + py * t });
          }
        }
        let chosen = cands[cands.length - 1];
        for (const c of cands) {
          const box = { x0: c.ax - boxW / 2, y0: c.ay - 16, x1: c.ax + boxW / 2, y1: c.ay + 15 };
          let clash = false;
          for (const b of placed) {
            if (boxesOverlap(box, b)) { clash = true; break; }
          }
          if (!clash) {
            for (const o of G.chapterNodes) {
              if (boxHitsCircle(box, o.sx, o.sy, 9)) { clash = true; break; }
            }
          }
          if (!clash) { chosen = c; break; }
        }
        const box = { x0: chosen.ax - boxW / 2, y0: chosen.ay - 16, x1: chosen.ax + boxW / 2, y1: chosen.ay + 15 };
        placed.push(box);
        items.push({ id: cn.id, label: cn.label, short: cn.short, num, color: cn.color, count: cn.count, x: chosen.ax, y: chosen.ay, box });
      }
      return { hub: { x: hp.x, y: hp.y }, hubBox, items };
    }

    // 周辺表示：中心人物を真ん中に、1段目を内側の円、2段目を外側の円に並べる
    // 同心円マインドマップ。1段目は辺の種類（交流／言及・同行／タグ）で
    // グループ化し、グループごとに扇形を割り当てる。戻り値は目標位置のMap。
  // 周辺表示の枠ツリー（左から右）：中心ボックス→グループフレーム
  // （交流→言及・同行→タグ）→2段目ボックス。グループフレームは四角い
  // 枠で囲み、見出しに種類と件数を出す。1段目は必ず全文表示。2段目は
  // 親の行の近くに置き、縦方向の衝突を押し下げで解消する（重なり0）。
  // 広がり＝レベル間の距離、枠の間隔＝グループ間・行間の隙間。
  function computeLocalTreeTargets() {
    const targets = new Map();
    const c = G.center;
    if (c < 0) return targets;
    const spread = G.force.attract;
    const rest = G.force.rest;
    const slotH = treeSlotH();
    const levelGap = 100 * spread;
    const groupGap = 16 * rest;
    const cn = G.nodes[c];
    // 中心ボックス（名前は2行まで折り返し、太字12px）
    const cLines = treeLines(cn.name, 12);
    let cW = 0;
    for (const l of cLines) cW = Math.max(cW, textWidth(l, 12));
    const cBox = { w: cW + 20, h: cLines.length * 15 + 16, lines: cLines };
    targets.set(c, { x: 0, y: 0 });
    G.treeItems = new Map();
    G.treeItems.set(c, { x: 0, y: 0, w: cBox.w, h: cBox.h, lines: cLines, fs: 12 });
    const adj = G.adj[c] || [];
    const kindOf = (idx) => {
      const e = adj.find((x) => x.to === idx);
      if (!e) return 'tag';
      if (e.rel) return 'rel';
      if (e.mention || e.coloc) return 'mention';
      return 'tag';
    };
    const hop1 = G.localHop1 || [];
    const KIND_LABEL = { rel: '交流', mention: '言及・同行', tag: 'タグ' };
    const groups = [
      { kind: 'rel', items: hop1.filter((i) => kindOf(i) === 'rel') },
      { kind: 'mention', items: hop1.filter((i) => kindOf(i) === 'mention') },
      { kind: 'tag', items: hop1.filter((i) => kindOf(i) === 'tag') },
    ].filter((g) => g.items.length > 0);
    // グループフレームの寸法（1段目）
    let stackH = 0;
    for (const g of groups) {
      let colW = 0;
      g.sizes = g.items.map((idx) => {
        const s = treeBoxSize(G.nodes[idx].name, TREE_FS);
        if (s.w > colW) colW = s.w;
        return s;
      });
      g.colW = colW;
      g.w = colW + TREE_FRAME_PAD * 2;
      g.h = g.items.length * slotH + TREE_GROUP_HEADER_H + TREE_FRAME_PAD * 2;
      stackH += g.h;
    }
    stackH += groupGap * Math.max(0, groups.length - 1);
    const groupX = cBox.w / 2 + levelGap;
    let gy = -stackH / 2;
    G.treeGroups = [];
    const hop1Pos = new Map(); // idx -> {x, y}（ボックス中心）
    for (const g of groups) {
      const frame = { kind: g.kind, label: KIND_LABEL[g.kind], count: g.items.length, x: groupX, y: gy, w: g.w, h: g.h };
      G.treeGroups.push(frame);
      g.items.forEach((idx, r) => {
        const cx = groupX + TREE_FRAME_PAD + g.colW / 2;
        const cy = gy + TREE_FRAME_PAD + TREE_GROUP_HEADER_H + r * slotH + slotH / 2;
        const s = g.sizes[r];
        targets.set(idx, { x: cx, y: cy });
        hop1Pos.set(idx, { x: cx, y: cy });
        G.treeItems.set(idx, { x: cx, y: cy, w: g.colW, h: s.h, lines: s.lines, fs: TREE_FS });
      });
      gy += g.h + groupGap;
    }
    // 2段目：親の行を中心に上下へ分散させ、全体でソートして
    // 最小間隔（行ピッチ）を強制する押し下げ処理で重なりを解消する。
    const hop2X = groupX + Math.max(0, ...groups.map((g) => g.w)) + levelGap;
    const byParent = new Map();
    for (const [idx, from] of G.localParent) {
      if (!byParent.has(from)) byParent.set(from, []);
      byParent.get(from).push(idx);
    }
    const hop2List = [];
    for (const [from, kids] of byParent) {
      const p = hop1Pos.get(from);
      if (!p) continue;
      kids.forEach((idx, k) => {
        const y = p.y + (k - (kids.length - 1) / 2) * slotH;
        hop2List.push({ idx, y });
      });
    }
    hop2List.sort((a, b) => a.y - b.y);
    let colW2 = 0;
    const sizes2 = new Map();
    for (const h2 of hop2List) {
      const s = treeBoxSize(G.nodes[h2.idx].name, TREE_FS);
      sizes2.set(h2.idx, s);
      if (s.w > colW2) colW2 = s.w;
    }
    let prevY = -Infinity;
    for (const h2 of hop2List) {
      const y = Math.max(h2.y, prevY + slotH);
      prevY = y;
      const cx = hop2X + colW2 / 2;
      const s = sizes2.get(h2.idx);
      targets.set(h2.idx, { x: cx, y });
      G.treeItems.set(h2.idx, { x: cx, y, w: colW2, h: s.h, lines: s.lines, fs: TREE_FS });
    }
    G.localGroups = groups.map((g) => ({ kind: g.kind, items: g.items, start: 0, span: 0 }));
    return targets;
  }

    function computeLocalMindmapTargets() {
      if (isTree2d()) return computeLocalTreeTargets();
      const targets = new Map();
      const c = G.center;
      if (c < 0) return targets;
      targets.set(c, { x: 0, y: 0 });
      const spread = G.force.attract; // 吸引力＝広がり
      const gap = G.force.rest; // バネの長さ＝円の間隔
      const R1 = 280 * spread;
      const R2 = R1 + 240 * gap;
      G.mind = { r1: R1, r2: R2 };
      const adj = G.adj[c] || [];
      const kindOf = (idx) => {
        const e = adj.find((x) => x.to === idx);
        if (!e) return 'tag';
        if (e.rel) return 'rel';
        if (e.mention || e.coloc) return 'mention';
        return 'tag';
      };
      const hop1 = G.localHop1 || [];
      const groups = [
        { kind: 'rel', items: hop1.filter((i) => kindOf(i) === 'rel') },
        { kind: 'mention', items: hop1.filter((i) => kindOf(i) === 'mention') },
        { kind: 'tag', items: hop1.filter((i) => kindOf(i) === 'tag') },
      ].filter((g) => g.items.length > 0);
      // グループの角度幅：項目数に比例、ただし最低 0.45rad。合計が2πを
      // 超える場合は比例配分で縮める。
      const total = hop1.length || 1;
      let rawSum = 0;
      for (const g of groups) {
        g.rawSpan = Math.max(0.45, (g.items.length / total) * Math.PI * 2);
        rawSum += g.rawSpan;
      }
      const scale = rawSum > Math.PI * 2 ? (Math.PI * 2) / rawSum : 1;
      let a = -Math.PI / 2;
      const angleOf = new Map();
      for (const g of groups) {
        g.span = g.rawSpan * scale;
        g.start = a;
        g.items.forEach((idx, k) => {
          const ang = a + (k + 0.5) / g.items.length * g.span;
          angleOf.set(idx, ang);
          targets.set(idx, { x: Math.cos(ang) * R1, y: Math.sin(ang) * R1 });
        });
        a += g.span;
      }
      G.localGroups = groups;
      // 2段目：親の角度を中心とした扇形に並べる（外側の円）
      const byParent = new Map();
      for (const [idx, from] of G.localParent) {
        if (!byParent.has(from)) byParent.set(from, []);
        byParent.get(from).push(idx);
      }
      for (const [from, kids] of byParent) {
        const pa = angleOf.has(from) ? angleOf.get(from) : 0;
        const wedge = Math.min(0.9, 0.28 * kids.length + 0.2);
        kids.forEach((idx, k) => {
          const ang = pa + (k - (kids.length - 1) / 2) * (wedge / Math.max(1, kids.length));
          angleOf.set(idx, ang);
          targets.set(idx, { x: Math.cos(ang) * R2, y: Math.sin(ang) * R2 });
        });
      }
      return targets;
    }

    // 中心切替・モード切替時の補間アニメーション（easeOutCubic）。
    // 速度スライダーは2Dでは切替アニメーションの速さとして読む。
    function tweenDuration() {
      return Math.round(600 / Math.max(0.3, G.force.speed || 1));
    }

    function startTween(targets, durMs, onDone) {
      if (!targets || targets.size === 0) return;
      const from = new Map();
      for (const [idx] of targets) {
        const n = G.nodes[idx];
        if (n) from.set(idx, { x: n.x, y: n.y });
      }
      G.tween = {
        active: true,
        t0: tweenNow(),
        dur: durMs || tweenDuration(),
        from, to: targets,
        onDone: onDone || null,
        testExtra: 0,
      };
      G.running = true;
      updatePlayBtn();
      if (G.raf == null) G.raf = nextFrame(frameLoop);
    }

    function tweenNow() {
      return (typeof performance !== 'undefined' && performance.now) ? performance.now() : Date.now();
    }

    function advanceTween() {
      const tw = G.tween;
      if (!tw || !tw.active) return;
      const t = Math.min(1, (tweenNow() - tw.t0 + (tw.testExtra || 0)) / tw.dur);
      const e = 1 - Math.pow(1 - t, 3);
      for (const [idx, pos] of tw.to) {
        const f = tw.from.get(idx);
        const n = G.nodes[idx];
        if (!f || !n) continue;
        n.x = f.x + (pos.x - f.x) * e;
        n.y = f.y + (pos.y - f.y) * e;
        n.z = 0;
      }
      if (t >= 1) {
        tw.active = false;
        G.running = false;
        updatePlayBtn();
        // フィット・アニメーションが既に走っている場合（全体図への切替で
        // 並行して開始したもの）は再起動しない。
        if (!G.viewTouched && G.open && G.fitRaf == null) animateFit(650);
        if (tw.onDone) tw.onDone();
      }
    }

    function cancelTween() {
      if (G.tween) G.tween.active = false;
    }

    // スライダー（吸引力＝広がり、バネの長さ＝円の間隔）の変更時に即座に再配置。
    // ドラッグ中の連続入力でも追従するよう、補間なしで置き直す。
    function applyMindmapSpread() {
      cancelTween();
      G.settledSnap = null; // 目標配置のスナップショットは無効になる
      if (G.mode === 'all') {
        layoutMindmapAll();
      } else if (G.mode === 'local') {
        const t = computeLocalMindmapTargets();
        for (const [idx, p] of t) {
          const n = G.nodes[idx];
          if (!n) continue;
          n.x = p.x; n.y = p.y; n.z = 0; n.vx = 0; n.vy = 0; n.vz = 0;
        }
      }
      draw();
    }

    // スライダーと自動回転の2Dでの扱い：反発力と自動回転は3Dのみで無効化。
    // 吸引力＝広がり、バネの長さ＝円の間隔、速度＝切替アニメーションの速さ
    // としてマインドマップに読み替える。ラベルもそれに合わせて変える。
    function updateSliderStates() {
      const is2d = G.dim === '2d';
      const repel = document.getElementById('graph-f-repel');
      if (repel) repel.disabled = is2d;
      const rotate = document.getElementById('graph-rotate');
      if (rotate) rotate.disabled = is2d;
      const isTree = isTree2d();
      const names = {
        'graph-f-attract-name': is2d ? '広がり' : '吸引力',
        'graph-f-repel-name': is2d ? '反発力（3Dのみ）' : '反発力',
        'graph-f-rest-name': is2d ? (isTree ? '枠の間隔' : '円の間隔') : 'バネの長さ',
        'graph-f-speed-name': is2d ? '切替の速さ' : '速度',
      };
      for (const [id, text] of Object.entries(names)) {
        const el = document.getElementById(id);
        if (el) el.textContent = text;
      }
      const note = document.getElementById('graph-f-note');
      if (note) {
        if (!is2d) {
          note.textContent = '3D：力学的シミュレーション';
        } else if (isTree) {
          note.textContent = '枠ツリー：広がり＝レベル間の距離、枠の間隔＝ボックス間の隙間、切替の速さ＝中心切替アニメーションの速さ。反発力・自動回転は3Dのみ。辺は描かず、件数表示で総数を確認できます。';
        } else {
          note.textContent = '2Dマインドマップ：広がり＝全体の半径、円の間隔＝内外の円の間隔、切替の速さ＝中心切替アニメーションの速さ。反発力・自動回転は3Dのみ。';
        }
      }
      // 枠ツリー切替は2Dでのみ有効（3Dでは無効化）
      const radialBtn = document.getElementById('graph-view-radial');
      const treeBtn = document.getElementById('graph-view-tree');
      if (radialBtn) radialBtn.disabled = !is2d;
      if (treeBtn) treeBtn.disabled = !is2d;
    }

    // リセット：4つのスライダーもすべて×1.0に戻す（値・表示・ラベル名）。
    function resetForceSliders() {
      G.force = { attract: 1, repel: 1, rest: 1, speed: 1 };
      const ids = ['graph-f-attract', 'graph-f-repel', 'graph-f-rest', 'graph-f-speed'];
      for (const id of ids) {
        const input = document.getElementById(id);
        if (input) input.value = '1';
        const val = document.getElementById(id + '-val');
        if (val) val.textContent = '×1.0';
      }
      updateSliderStates();
    }

    // 章ノードのヒット判定（2D全体図のみ）
    function hitChapter(px, py) {
      if (G.dim !== '2d' || G.mode !== 'all' || !G.chapterNodes) return -1;
      syncScreenCoords();
      if (isTree2d()) {
        // 枠ツリー：章フレームの矩形に含まれるかで判定する
        const w = canvas ? (canvas.clientWidth || 900) : 900;
        const h = canvas ? (canvas.clientHeight || 560) : 560;
        for (let i = 0; i < G.treeFrames.length; i++) {
          const f = G.treeFrames[i];
          const x0 = w / 2 + f.x * G.scale + G.ox, y0 = h / 2 + f.y * G.scale + G.oy;
          const x1 = w / 2 + (f.x + f.w) * G.scale + G.ox, y1 = h / 2 + (f.y + f.h) * G.scale + G.oy;
          if (px >= x0 && px <= x1 && py >= y0 && py <= y1) return i;
        }
        return -1;
      }
      let best = -1, bestD = Infinity;
      for (let i = 0; i < G.chapterNodes.length; i++) {
        const cn = G.chapterNodes[i];
        if (!isFinite(cn.sx) || !isFinite(cn.sy)) continue;
        const d = Math.hypot(cn.sx - px, cn.sy - py);
        if (d < 18 && d < bestD) { bestD = d; best = i; }
      }
      return best;
    }

    // 枠ツリー：章フレームの見出し帯（上部の余白＋見出し高さ）へのヒット。
    // 見出し帯は薄いため、項目の寛容なヒット判定（16px）より先に判定する
    // （さもないと見出しのクリックが近くの項目ボックスに奪われる）。
    function hitChapterHeader(px, py) {
      if (!isTree2d() || G.dim !== '2d' || G.mode !== 'all') return -1;
      syncScreenCoords();
      const w = canvas ? (canvas.clientWidth || 900) : 900;
      const h = canvas ? (canvas.clientHeight || 560) : 560;
      for (let i = 0; i < G.treeFrames.length; i++) {
        const f = G.treeFrames[i];
        const x0 = w / 2 + f.x * G.scale + G.ox, y0 = h / 2 + f.y * G.scale + G.oy;
        const x1 = w / 2 + (f.x + f.w) * G.scale + G.ox;
        const y1 = h / 2 + (f.y + TREE_FRAME_PAD + TREE_HEADER_H) * G.scale + G.oy;
        if (px >= x0 && px <= x1 && py >= y0 && py <= y1) return i;
      }
      return -1;
    }

    // 章の枝のクリック：その章の項目だけを強調表示（他を薄くする）。
    // もう一度クリックすると解除する。
    function toggleDimChapter(ci) {
      const cn = G.chapterNodes[ci];
      if (!cn) return;
      if (G.dimChapter === cn.id) {
        G.dimChapter = null;
        renderDetail(G.selected);
      } else {
        G.dimChapter = cn.id;
        renderChapterDetail(cn);
      }
      draw();
    }

    function renderChapterDetail(cn) {
      const d = document.getElementById('graph-detail');
      if (!d) return;
      d.innerHTML = '';
      const h = document.createElement('h3');
      h.textContent = cn.label;
      d.appendChild(h);
      const meta = document.createElement('div');
      meta.className = 'gd-meta';
      meta.textContent = '項目 ' + cn.count + '件 — この章の項目を強調表示しています。';
      d.appendChild(meta);
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.textContent = '強調表示を解除';
      btn.addEventListener('click', () => {
        G.dimChapter = null;
        renderDetail(G.selected);
        draw();
      });
      d.appendChild(btn);
    }

    // 初期表示で大枠ができた状態にするための事前ステップ
    function warmup(n) {
      for (let i = 0; i < n; i++) stepSim();
      G.tickCount = 0;
      G.calmTicks = 0;
      G.coolFactor = 0;
    }

    function edgeShown(e, mode) {
      if (e.weak && !G.showWeak) return false;
      if (G.edgeFilter === 'tag') return e.tag > 0;
      if (G.edgeFilter === 'mention') return e.mention || e.coloc || e.rel;
      return true;
    }

    function computeVisible() {
      // 可視集合が変わるので、目標配置のスナップショットは無効になる
      G.settledSnap = null;
      if (G.mode === 'all') {
        G.visible = new Set(G.nodes.map((n) => n.i));
        G.visEdges = G.edges.filter((e) => edgeShown(e, 'all'));
      } else {
        const c = G.center;
        const adj = (c >= 0 && G.adj[c]) ? G.adj[c] : [];
        const byRel = (a, b) => {
          const am = (a.mention || a.coloc || a.rel) ? 1 : 0, bm = (b.mention || b.coloc || b.rel) ? 1 : 0;
          if (bm !== am) return bm - am;
          return b.tagW - a.tagW;
        };
        const sorted = [...adj].sort(byRel);
        // 1段：言及・同行を優先、次に共有タグ数順で最大40件
        const keep = sorted.slice(0, 40).map((x) => x.to);
        const vis = new Set([c, ...keep]);
        G.localHop1 = keep;
        G.localParent = new Map();
        if (G.depth2) {
          const hop2 = [];
          for (const nIdx of keep) {
            for (const e of G.adj[nIdx]) {
              if (!vis.has(e.to)) hop2.push({ e, from: nIdx });
            }
          }
          hop2.sort((x, y) => byRel(x.e, y.e));
          for (const { e, from } of hop2) {
            if (vis.size >= 100) break;
            vis.add(e.to);
            G.localParent.set(e.to, from);
          }
        }
        G.visible = vis;
        // 表示する辺（描画するものだけを数える）:
        //  (a) スポーク — 中心→1段隣接、1段→2段（導入した親から）
        //  (b) 可視ノード間の強い辺（タグ3つ以上共有／言及／同行）
        // タグ1〜2つの共有だけのペアは辺を描かない（組み合わせ数を見せない）。
        const seen = new Set();
        const visEdges = [];
        const pushEdge = (e) => {
          const k = edgeKey(e.a, e.b);
          if (seen.has(k)) return;
          seen.add(k);
          if (edgeShown(e, 'local')) visEdges.push(e);
        };
        const relOf = (from, to) => {
          const list = G.adj[from] || [];
          for (const x of list) if (x.to === to) return x;
          return { to, tagW: 0, mention: false, coloc: false };
        };
        const spoke = (from, to) => {
          const r = relOf(from, to);
          pushEdge({ a: Math.min(from, to), b: Math.max(from, to), tag: r.tagW, mention: !!r.mention, coloc: !!r.coloc, rel: !!r.rel, spoke: true, weak: r.tagW <= 2 && !r.mention && !r.coloc && !r.rel });
        };
        for (const nIdx of keep) spoke(c, nIdx);
        for (const [node, from] of G.localParent) spoke(from, node);
        for (const i of vis) {
          for (const a of G.adj[i]) {
            if (!vis.has(a.to)) continue;
            const e = G.edgeByKey.get(edgeKey(i, a.to));
            if (e) pushEdge(e);
          }
        }
        G.visEdges = visEdges;
      }
      G.visibleNodes = Array.from(G.visible).map((i) => G.nodes[i]);
      updateCount();
    }

    function updateCount() {
      const el = document.getElementById('graph-count');
      if (!el) return;
      if (G.mode === 'all') {
        el.textContent = '全体図：' + G.visibleNodes.length + '件・' + G.visEdges.length + '本';
        el.title = '本数は描く辺の数（タグ共通／言及／同行）';
      } else {
        const name = G.center >= 0 ? G.nodes[G.center].name : '';
        el.textContent = '周辺：' + name + ' — ' + G.visibleNodes.length + '件・' + G.visEdges.length + '本';
        el.title = '本数は描く辺の数（中心とのスポーク＋隣接間の辺）';
      }
    }

    /* ---- フォースシミュレーション ---- */
    // 力のバランス：全体図が収縮してドットの塊にならないよう、反発を強く・
    // 遠くまで効かせ、バネの自然長を長く、中心への引力をなくし、章アンカー
    // への引力を強めた。3Dでは反発が体積で薄まるため、さらに強くする。
    // 周辺表示は放射状配置＋固定中心のため従来の値のまま。
    function stepSim() {
      if (G.dim === '2d') {
        // 2Dマインドマップは決定論的レイアウト。力は働かないが、ティック数・
        // 静穏・減速の帳簿は維持する（停止・速度のテストと再生ボタンの動作が
        // そのまま通る）。位置は変わらないので広がりは常に1.0倍。
        G.maxSpeed = 0;
        G.tickCount++;
        G.calmTicks++;
        let cool = 0;
        if (G.tickCount > 1400) cool = Math.min(1, (G.tickCount - 1400) / 100);
        else if (G.calmTicks >= 4) cool = Math.min(1, (G.calmTicks - 3) / 8);
        G.coolFactor = cool;
        return;
      }
      const ns = G.visibleNodes;
      const dim3 = G.dim === '3d';
      const local = G.mode === 'local';
      const F = G.force;
      const CUTOFF = local ? 220 : dim3 ? 300 : 240, CELL = local ? 220 : dim3 ? 300 : 240;
      const REPEL = (local ? 8000 : dim3 ? 24000 : 9000) * F.repel;
      const REST_STRONG = (local ? 95 : dim3 ? 100 : 90) * F.rest, REST_LIGHT = (local ? 150 : dim3 ? 150 : 130) * F.rest, REST_WEAK = (local ? 190 : dim3 ? 195 : 170) * F.rest;
      const K_STRONG = (local ? 0.05 : 0.04) * F.attract, K_LIGHT = (local ? 0.02 : 0.012) * F.attract, K_WEAK = (local ? 0.008 : 0.006) * F.attract;
      const ANCHOR = (local ? 0 : dim3 ? 0.012 : 0.006) * F.attract, CENTER_PULL = (local ? 0.0006 : 0) * F.attract;
      // 停止へのイージングアウト：上限ティック数（1500）に近づいたら、残り
      // 100ティックかけて徐々に減速させる（急ブレーキにならない）。静穏が
      // 近いとき（calmTicks 4以上）も同じく減速する。減衰は力の釣り合いに
      // 影響しない（速度だけを絞る）ため、最終配置は変わらない。
      let cool = 0;
      if (G.tickCount > 1400) cool = Math.min(1, (G.tickCount - 1400) / 100);
      else if (G.calmTicks >= 4) cool = Math.min(1, (G.calmTicks - 3) / 8);
      G.coolFactor = cool;
      const damp = 0.84 * (1 - 0.35 * cool);
      const cap = 14 * (1 - 0.5 * cool);
      const grid = new Map();
      for (const n of ns) {
        const cx = Math.floor(n.x / CELL), cy = Math.floor(n.y / CELL);
        const cz = dim3 ? Math.floor(n.z / CELL) : 0;
        const k = cx + ',' + cy + ',' + cz;
        let arr = grid.get(k);
        if (!arr) { arr = []; grid.set(k, arr); }
        arr.push(n);
      }
      for (const n of ns) { n.fx = 0; n.fy = 0; n.fz = 0; }
      for (const n of ns) {
        const cx = Math.floor(n.x / CELL), cy = Math.floor(n.y / CELL);
        const cz = dim3 ? Math.floor(n.z / CELL) : 0;
        for (let dx = -1; dx <= 1; dx++) {
          for (let dy = -1; dy <= 1; dy++) {
            for (let dz = dim3 ? -1 : 0; dz <= (dim3 ? 1 : 0); dz++) {
              const arr = grid.get((cx + dx) + ',' + (cy + dy) + ',' + (cz + dz));
              if (!arr) continue;
              for (const m of arr) {
                if (m.i <= n.i) continue;
                const ddx = n.x - m.x, ddy = n.y - m.y, ddz = dim3 ? n.z - m.z : 0;
                const d2 = ddx * ddx + ddy * ddy + ddz * ddz;
                if (d2 > CUTOFF * CUTOFF || d2 < 0.01) continue;
                const d = Math.sqrt(d2);
                let f = REPEL / d2;
                if (f > 60) f = 60;
                const ux = ddx / d, uy = ddy / d, uz = dim3 ? ddz / d : 0;
                n.fx += ux * f; n.fy += uy * f; n.fz += uz * f;
                m.fx -= ux * f; m.fy -= uy * f; m.fz -= uz * f;
              }
            }
          }
        }
      }
      for (const e of G.visEdges) {
        const a = G.nodes[e.a], b = G.nodes[e.b];
        const dx = b.x - a.x, dy = b.y - a.y, dz = dim3 ? b.z - a.z : 0;
        const d = Math.sqrt(dx * dx + dy * dy + dz * dz) || 0.001;
        const strong = e.mention || e.coloc;
        const weak = !!e.weak;
        const rest = strong ? REST_STRONG : weak ? REST_WEAK : REST_LIGHT;
        const k = strong ? K_STRONG : weak ? K_WEAK : K_LIGHT;
        const f = (d - rest) * k;
        const ux = dx / d, uy = dy / d, uz = dim3 ? dz / d : 0;
        a.fx += ux * f; a.fy += uy * f; a.fz += uz * f;
        b.fx -= ux * f; b.fy -= uy * f; b.fz -= uz * f;
      }
      let maxV = 0;
      for (const n of ns) {
        if (n.fixed) { n.vx = 0; n.vy = 0; n.vz = 0; continue; }
        // 章のアンカーへの引力（孤立ノードも章ごとに散らばる）＋ごく弱い中心引力
        // 周辺表示ではアンカー引力を切る（放射状の配置と干渉するため）
        n.fx += (n.ax - n.x) * ANCHOR - n.x * CENTER_PULL;
        n.fy += (n.ay - n.y) * ANCHOR - n.y * CENTER_PULL;
        n.fz += (n.az - n.z) * ANCHOR - n.z * CENTER_PULL;
        n.vx = (n.vx + n.fx) * damp;
        n.vy = (n.vy + n.fy) * damp;
        n.vz = dim3 ? (n.vz + n.fz) * damp : 0;
        const sp = Math.sqrt(n.vx * n.vx + n.vy * n.vy + n.vz * n.vz);
        if (sp > cap) { n.vx *= cap / sp; n.vy *= cap / sp; n.vz *= cap / sp; }
        n.x += n.vx; n.y += n.vy;
        if (dim3) n.z += n.vz;
        if (!isFinite(n.x) || !isFinite(n.y) || !isFinite(n.z)) {
          placeAtAnchor(n);
        }
        if (sp > maxV) maxV = sp;
      }
      G.maxSpeed = maxV;
      G.tickCount++;
      if (maxV < 0.06) G.calmTicks++; else G.calmTicks = 0;
    }

    function reheat() {
      G.tickCount = 0;
      G.calmTicks = 0;
      G.coolFactor = 0;
      G.viewTouched = false;
      cancelFitAnim();
      for (const n of G.visibleNodes) {
        n.vx += (Math.random() - 0.5) * 2;
        n.vy += (Math.random() - 0.5) * 2;
        if (G.dim === '3d') n.vz += (Math.random() - 0.5) * 2;
      }
      runSim();
    }

    function frameLoop() {
      if (!G.open) { G.running = false; G.raf = null; return; }
      // 中心切替の補間アニメーション中はトゥイーンを進める（力は走らない）。
      if (G.tween && G.tween.active) {
        advanceTween();
      } else if (G.running) {
        // アニメーション速度：1フレームあたりのティック数（既定3）
        const steps = Math.max(1, Math.min(6, Math.round(3 * G.force.speed)));
        for (let s = 0; s < steps; s++) stepSim();
        if (G.calmTicks >= 12 || G.tickCount > 1500) {
          G.running = false;
          // 安全策：停止時に全体をキャンバスに収める。ただしジャンプさせず、
          // 視点を650msかけて補間する。ユーザーがホイールやドラッグで視点
          // を変えていた場合は上書きしない。
          if (!G.viewTouched) animateFit(650);
          updatePlayBtn();
        }
      }
      if (G.dim === '3d' && G.autoRotate) G.rotY += 0.004;
      draw();
      if (G.running || (G.dim === '3d' && G.autoRotate) || (G.tween && G.tween.active)) {
        G.raf = nextFrame(frameLoop);
      } else {
        G.raf = null;
      }
    }

    function runSim() {
      if (!G.open) return;
      cancelFitAnim();
      if (!G.running) {
        G.running = true;
        G.tickCount = 0;
        G.calmTicks = 0;
        G.coolFactor = 0;
        updatePlayBtn();
      }
      if (G.raf == null) G.raf = nextFrame(frameLoop);
    }

    function stopSim() {
      G.running = false;
      // 一時停止は補間アニメーションもその場で止める
      cancelTween();
      cancelFitAnim();
      if (G.raf != null) { cancelFrame(G.raf); G.raf = null; }
      updatePlayBtn();
    }

    function updatePlayBtn() {
      const b = document.getElementById('graph-play');
      if (b) b.textContent = G.running ? '一時停止' : '再生';
    }

    // キャンバスの大きさが変わったときの処理。裏面バッファを合わせ、
    // ユーザーが視点を触っていなければ全体を収め直す（レイアウト確定後や
    // 広告表示などで高さが変わり、図がはみ出すのを防ぐ）。シミュレーション
    // やトゥイーンが走っている間は、停止・完了時のフィットに任せる。
    function onGraphResize() {
      if (!canvas || !G.open) return;
      sizeCanvas();
      if (G.tween && G.tween.active && G.dim === '2d') {
        // トゥイーン中のリサイズ：到達配置のフィット目標とクリック用の
        // スナップショットを新しい寸法で求め直す。フィット・アニメーション
        // 自体も寸法変化を毎フレーム追従するが、スナップショットはここで
        // 更新しないと古い寸法のままになる（A2の切替直後のクリック用）。
        const t = computeFitTarget(G.tween.to);
        if (t) {
          storeSettledSnapshot(G.tween.to, t);
          animateFit(650, t, G.tween.to);
        }
      } else if (!G.viewTouched && !G.running && !(G.tween && G.tween.active)) fitView();
      if (!(G.tween && G.tween.active) && G.fitRaf == null) clampTreeView();
      draw();
    }

    /* ---- 描画 ---- */
    let canvas = null, ctx = null;
    // ピンチズーム用：追跡中のポインタ（pointerId → 位置）とピンチ状態。
    // タップ説明用：自動で消えるまでのタイマー。
    const activePointers = new Map();
    let pinchState = null; // { d0, scale0, midX, midY } ピンチ中のみ
    let tipHideTimer = null;
    let TIP_AUTO_HIDE_MS = 5000;
    function sizeCanvas() {
      if (!canvas) return;
      const dpr = window.devicePixelRatio || 1;
      const w = canvas.clientWidth || 900, h = canvas.clientHeight || 560;
      canvas.width = Math.round(w * dpr);
      canvas.height = Math.round(h * dpr);
      if (ctx) ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }

    // 全体をキャンバスに収める視点（スケールと中心位置）を計算する。
    // フィットの余白（画面座標）。ノードのドットと全ラベルがこの余白を
    // 保ってキャンバスに収まるようにする。
    const FIT_MARGIN = 12;

    // 現在の視点で、ドット（半径込み）と全ラベル（章・ハブ・ノード）の
    // 画面上の和集合ボックスを返す。computeFitTarget の2パス目で使う。
    function unionScreenBox() {
      let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
      const eat = (bx0, by0, bx1, by1) => {
        if (!isFinite(bx0) || !isFinite(by0) || !isFinite(bx1) || !isFinite(by1)) return;
        if (bx0 < x0) x0 = bx0;
        if (by0 < y0) y0 = by0;
        if (bx1 > x1) x1 = bx1;
        if (by1 > y1) y1 = by1;
      };
      for (const n of G.visibleNodes) {
        const r = (typeof n.sr === 'number' && isFinite(n.sr)) ? n.sr : 4.2;
        eat(n.sx - r, n.sy - r, n.sx + r, n.sy + r);
      }
      // 枠ツリー：章フレーム・グループフレーム・ハブボックスも和集合に入れる
      if (isTree2d()) {
        const cw = canvas ? (canvas.clientWidth || 900) : 900;
        const chh = canvas ? (canvas.clientHeight || 560) : 560;
        const px = (wx) => cw / 2 + wx * G.scale + G.ox;
        const py = (wy) => chh / 2 + wy * G.scale + G.oy;
        if (G.mode === 'all' && G.treeHub) eat(px(G.treeHub.x - G.treeHub.w / 2), py(G.treeHub.y - G.treeHub.h / 2), px(G.treeHub.x + G.treeHub.w / 2), py(G.treeHub.y + G.treeHub.h / 2));
        if (G.mode === 'all') for (const f of (G.treeFrames || [])) eat(px(f.x), py(f.y), px(f.x + f.w), py(f.y + f.h));
        if (G.mode === 'local') for (const f of (G.treeGroups || [])) eat(px(f.x), py(f.y), px(f.x + f.w), py(f.y + f.h));
      }
      // 章ラベルとハブラベル（2D全体図）
      if (G.dim === '2d' && G.mode === 'all' && G.hub) {
        const ch = computeChapterLabelLayout();
        if (ch) {
          // ハブラベルのプレート（描画と同じ大きさ）
          eat(ch.hub.x - 32, ch.hub.y + 14, ch.hub.x + 32, ch.hub.y + 38);
          for (const it of ch.items) eat(it.box.x0, it.box.y0, it.box.x1, it.box.y1);
        }
      }
      // ノードラベル（周辺表示の中心・1段目・2段目、3Dの選択・ホバー）
      for (const lb of computeLabelLayout()) eat(lb.box.x0, lb.box.y0, lb.box.x1, lb.box.y1);
      if (!isFinite(x0)) return null;
      return { x0, y0, x1, y1 };
    }

    // フィット目標を計算する。positions（Map: idx → {x, y}）が与えられ
    // た場合はその座標で求める（全体図への切替時に、到達する配置で
    // 視点を決めるため）。画面座標での余白で割り、ラベルを含めた2パス
    // で余白を確保する。
    // 必須ラベル（2D周辺表示の中心・1段目）の重なり組数。フィットの候補
    // 選びで使う：小さい画面では全体を収めるために縮小すると1段目ラベルが
    // 重なるため、重なり0の候補を優先する（2段目のはみ出しはパンで見られる）。
    // 全体図・3Dでは必須ラベルがないので常に0。
    function mustLabelOverlaps() {
      if (!(G.dim === '2d' && G.mode === 'local')) return 0;
      const must = new Set([G.center, ...(G.localHop1 || [])]);
      const lbs = computeLabelLayout().filter((lb) => must.has(lb.idx));
      let n = 0;
      for (let i = 0; i < lbs.length; i++) {
        for (let j = i + 1; j < lbs.length; j++) {
          const a = lbs[i].box, b = lbs[j].box;
          if (a.x0 < b.x1 && a.x1 > b.x0 && a.y0 < b.y1 && a.y1 > b.y0) n++;
        }
      }
      return n;
    }

    function computeFitTarget(positions) {
      const ns = G.visibleNodes;
      if (!ns.length || !canvas) return null;
      const posOf = (n) => (positions && positions.get(n.i)) || n;
      let minX = 1e9, maxX = -1e9, minY = 1e9, maxY = -1e9;
      for (const n of ns) {
        const p = posOf(n);
        if (p.x < minX) minX = p.x;
        if (p.x > maxX) maxX = p.x;
        if (p.y < minY) minY = p.y;
        if (p.y > maxY) maxY = p.y;
      }
      const w = canvas.clientWidth || 900, h = canvas.clientHeight || 560;
      const bw = Math.max(60, maxX - minX), bh = Math.max(60, maxY - minY);
      // 画面座標での余白で割る。従来の +90 はワールド単位で、縮小後の
      // 画面上の余白が 10px を切ることがあった（1600×670 で下端 9.4px）。
      const pad = 2 * (FIT_MARGIN + 6);
      const s = Math.min((w - pad) / bw, (h - pad) / bh);
      // 下限 0.05：広がり×5の2D全体図（必要倍率 約0.06）でもフィットが
      // 収まるようにする。周辺表示では重なり0の候補が優先されるため、
      // 小さい画面でも下限まで縮小することはほとんどない。
      // デスクトップの通常のフィット（0.25以上）には影響しない。
      let scale = Math.max(0.05, Math.min(4, s));
      let ox = -(minX + maxX) / 2 * scale, oy = -(minY + maxY) / 2 * scale;
      // 2パス目：ラベルを含めた画面上の和集合が余白を保って収まるよう、
      // スケールと中心を調整する（最大12回まで反復）。候補の視点を一時的
      // に適用して測り、終わったら元の視点・位置に戻す。
      const savedView = { scale: G.scale, ox: G.ox, oy: G.oy };
      const savedPos = new Map();
      if (positions) {
        for (const n of G.nodes) {
          const p = positions.get(n.i);
          if (p) { savedPos.set(n.i, { x: n.x, y: n.y, z: n.z }); n.x = p.x; n.y = p.y; n.z = 0; }
        }
      }
      try {
        // ラベルの配置は視点によって不連続に変わる（候補の切り替え）ため、
        // 反復が収束しないことがある。測定済みの視点のうち最も良いもの
        // （はみ出しが最小、できれば余白内）を返すことで、未測定の視点を
        // 返すのを防ぐ。
        let best = null;
        for (let iter = 0; iter < 12; iter++) {
          G.scale = scale; G.ox = ox; G.oy = oy;
          syncScreenCoords();
          const box = unionScreenBox();
          if (!box) break;
          const overL = FIT_MARGIN - box.x0, overR = box.x1 - (w - FIT_MARGIN);
          const overT = FIT_MARGIN - box.y0, overB = box.y1 - (h - FIT_MARGIN);
          const worst = Math.max(overL, overR, overT, overB);
          // 候補の良さは必須ラベルの重なりを最優先し、次にはみ出しを見る。
          // 小さい画面では、全体を収めようとして縮小すると1段目ラベルが
          // 重なるため、はみ出しが残っても重なり0の候補を選ぶ。
          const ov = mustLabelOverlaps();
          const score = ov * 100000 + worst;
          if (!best || score < best.score) best = { scale, ox, oy, worst, score, ov };
          if (worst <= 0) break;
          const boxW = box.x1 - box.x0, boxH = box.y1 - box.y0;
          // 1回の縮小は最大10%まで：和集合の比で一気に縮めると、重なり0で
          // 収まる中間の倍率（小さい画面の周辺表示で0.3付近）を飛ばして
          // しまうため。12回までの反復で段階的に寄せる。
          const f = Math.max(0.9, Math.min((w - 2 * FIT_MARGIN) / boxW, (h - 2 * FIT_MARGIN) / boxH, 1));
          const s2 = Math.max(0.05, scale * f);
          // スケール変更は原点（画面中心＋オフセット）を中心に行われるので、
          // 和集合の中心の移動量を計算してから画面中心へ移す。
          const Ox = w / 2 + ox, Oy = h / 2 + oy;
          const bcx = (box.x0 + box.x1) / 2, bcy = (box.y0 + box.y1) / 2;
          const ratio = s2 / scale;
          const bcx2 = Ox + (bcx - Ox) * ratio, bcy2 = Oy + (bcy - Oy) * ratio;
          ox += (w / 2 - bcx2);
          oy += (h / 2 - bcy2);
          scale = s2;
        }
        if (best) { scale = best.scale; ox = best.ox; oy = best.oy; }
      } finally {
        G.scale = savedView.scale; G.ox = savedView.ox; G.oy = savedView.oy;
        for (const [i, p] of savedPos) { const n = G.nodes[i]; n.x = p.x; n.y = p.y; n.z = p.z; }
        syncScreenCoords();
      }
      return { scale, ox, oy };
    }

    function fitView() {
      const t = computeFitTarget();
      if (!t) return;
      G.scale = t.scale;
      G.ox = t.ox;
      G.oy = t.oy;
    }

    // ピンチ終了後に内容が画面外へ完全にはみ出していたらフィットし直す。
    // 一部のはみ出し（意図したパン）はそのままにする。
    function refitIfOffscreen() {
      if (!canvas || !G.open) return;
      syncScreenCoords();
      const box = unionScreenBox();
      if (!box) return;
      const w = canvas.clientWidth || 900, h = canvas.clientHeight || 560;
      if (box.x1 < 0 || box.x0 > w || box.y1 < 0 || box.y0 > h) fitView();
    }

    // 枠ツリー（2D）専用：パン・ズーム後に内容が画面外へ逃げないよう視点を
    // クランプする。内容がキャンバスより大きい場合は左右（上下）の端まで
    // たどり着ける範囲に制限し、拡大しても端のボックスをパンで完全に表示
    // できる（詳細パネルの下に隠れたままにならない）。内容がキャンバスに
    // 収まる場合は、全体を余白内に固定するとフィット状態では余白がほぼ0に
    // なるためドラッグが一切効かなくなる（実ブラウザで全方向0pxを確認）。
    // そのため収まる場合のパン自体は許し、内容が完全に画面外へ逃げない
    // よう最低 K px が見えている範囲にだけ制限する。放射状・3Dは変えない
    // （isTree2d() でない場合は何もしない）。
    function clampTreeView() {
      if (!isTree2d() || !canvas) return;
      const w = canvas.clientWidth || 900, h = canvas.clientHeight || 560;
      let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
      const eat = (ax0, ay0, ax1, ay1) => {
        if (!isFinite(ax0) || !isFinite(ay0) || !isFinite(ax1) || !isFinite(ay1)) return;
        if (ax0 < x0) x0 = ax0;
        if (ay0 < y0) y0 = ay0;
        if (ax1 > x1) x1 = ax1;
        if (ay1 > y1) y1 = ay1;
      };
      if (G.mode === 'all' && G.treeHub) eat(G.treeHub.x - G.treeHub.w / 2, G.treeHub.y - G.treeHub.h / 2, G.treeHub.x + G.treeHub.w / 2, G.treeHub.y + G.treeHub.h / 2);
      if (G.mode === 'all') for (const f of (G.treeFrames || [])) eat(f.x, f.y, f.x + f.w, f.y + f.h);
      if (G.mode === 'local') for (const f of (G.treeGroups || [])) eat(f.x, f.y, f.x + f.w, f.y + f.h);
      for (const b of (G.treeItems || new Map()).values()) eat(b.x - b.w / 2, b.y - b.h / 2, b.x + b.w / 2, b.y + b.h / 2);
      if (!isFinite(x0)) return;
      const M = FIT_MARGIN;
      const K = 100; // 収まる場合に最低限見えている幅（内容が完全に画面外へ逃げない）
      const sx0 = w / 2 + x0 * G.scale + G.ox, sx1 = w / 2 + x1 * G.scale + G.ox;
      const sy0 = h / 2 + y0 * G.scale + G.oy, sy1 = h / 2 + y1 * G.scale + G.oy;
      if (sx1 - sx0 <= w - 2 * M) {
        if (sx1 < M + K) G.ox += (M + K) - sx1;
        else if (sx0 > w - M - K) G.ox -= sx0 - (w - M - K);
      } else {
        if (sx0 > M) G.ox -= sx0 - M;
        else if (sx1 < w - M) G.ox += (w - M) - sx1;
      }
      if (sy1 - sy0 <= h - 2 * M) {
        if (sy1 < M + K) G.oy += (M + K) - sy1;
        else if (sy0 > h - M - K) G.oy -= sy0 - (h - M - K);
      } else {
        if (sy0 > M) G.oy -= sy0 - M;
        else if (sy1 < h - M) G.oy += (h - M) - sy1;
      }
    }

    function cancelFitAnim() {
      // 世代カウンタを進めて、進行中のフィット・アニメーションも止める。
      G.fitToken = (G.fitToken || 0) + 1;
      if (G.fitRaf != null) { cancelFrame(G.fitRaf); G.fitRaf = null; }
    }

    // 停止時のフィットをジャンプさせず、視点を補間してアニメーションする。
    // ユーザーが視点を変えたら（viewTouched）途中で中止する。
    // スケールはフィット後のスケールを超えないよう制限する（展開アニメー
    // ション中に図がキャンバスからはみ出すのを防ぐ）。ビュー切替で古い
    // フィット目標へ書き戻されないよう、世代カウンタで陳腐化を検出する。
    // fixedTarget が与えられた場合は、到達する配置でのフィット目標を
    // 使う（全体図への切替時：トゥイーン中の補間位置ではなく最終配置で
    // 視点を決める）。fixedPositions（到達配置）が与えられた場合は、
    // キャンバス寸法が変わるたびにその配置でのフィット目標を求め直す
    // （広告読み込み等でトゥイーン中に寸法が変わっても、古い小さい寸法
    // でのフィット目標のまま完了してラベルが省略表示になるのを防ぐ）。
    function animateFit(durationMs, fixedTarget, fixedPositions) {
      const target0 = fixedTarget || computeFitTarget();
      if (!target0) return;
      cancelFitAnim();
      const token = G.fitToken;
      const from = { scale: G.scale, ox: G.ox, oy: G.oy };
      const dur = durationMs || 650;
      const nowFn = () => (typeof performance !== 'undefined' && performance.now) ? performance.now() : Date.now();
      const t0 = nowFn();
      let lastW = -1, lastH = -1, liveTarget = target0;
      const step = () => {
        if (token !== G.fitToken || !G.open || G.viewTouched) { G.fitRaf = null; return; }
        const t = Math.min(1, (nowFn() - t0) / dur);
        const e = 1 - Math.pow(1 - t, 3);
        let target;
        if (fixedPositions) {
          const w = canvas ? (canvas.clientWidth || 900) : 900;
          const h = canvas ? (canvas.clientHeight || 560) : 560;
          if (w !== lastW || h !== lastH) {
            liveTarget = computeFitTarget(fixedPositions) || target0;
            lastW = w; lastH = h;
          }
          target = liveTarget;
        } else {
          target = computeFitTarget() || target0;
        }
        const s = from.scale + (target.scale - from.scale) * e;
        G.scale = Math.min(s, target.scale);
        G.ox = from.ox + (target.ox - from.ox) * e;
        G.oy = from.oy + (target.oy - from.oy) * e;
        draw();
        if (t < 1) G.fitRaf = nextFrame(step);
        else G.fitRaf = null;
      };
      G.fitRaf = nextFrame(step);
    }

    function project(n) {
      const w = canvas ? (canvas.clientWidth || 900) : 900;
      const h = canvas ? (canvas.clientHeight || 560) : 560;
      const cx = w / 2, cy = h / 2;
      if (G.dim !== '3d') {
        return { x: cx + n.x * G.scale + G.ox, y: cy + n.y * G.scale + G.oy, f: 1, z: 0 };
      }
      const sinX = Math.sin(G.rotX), cosX = Math.cos(G.rotX);
      const sinY = Math.sin(G.rotY), cosY = Math.cos(G.rotY);
      const y1 = n.y * cosX - n.z * sinX, z1 = n.y * sinX + n.z * cosX;
      const x2 = n.x * cosY + z1 * sinY, z2 = -n.x * sinY + z1 * cosY, y2 = y1;
      let f = 1 / (1 + z2 * 0.0011);
      if (f < 0.35) f = 0.35;
      if (f > 2.2) f = 2.2;
      return { x: cx + x2 * f * G.scale + G.ox, y: cy + y2 * f * G.scale + G.oy, f, z: z2 };
    }

    // 画面座標を現在のワールド座標・視点から同期する（draw() と同じ投影）。
    // hitNode/hitChapter は描画の最終フレームの sx/sy を見ていたため、
    // トゥイーン中やフィット・アニメーション中は表示位置と判定位置が最大
    // 1フレーム分ずれ、密集部で誤判定・無反応が起きていた。判定のたびに
    // 現在の補間位置から同期し直すことで、表示と判定を常に一致させる。
    function syncScreenCoords() {
      for (const n of G.visibleNodes) {
        const p = project(n);
        n.sx = p.x; n.sy = p.y; n.sf = p.f; n.sdepth = p.z;
        n.sr = dotRadius(p.f);
      }
      if (G.hub) { const hp = project(G.hub); G.hub.sx = hp.x; G.hub.sy = hp.y; }
      if (G.chapterNodes) {
        for (const cn of G.chapterNodes) { const cp = project(cn); cn.sx = cp.x; cn.sy = cp.y; }
      }
    }

    // 記述文の整形（descOfLi と同じ）。JSON の descRaw（li テキスト）から
    // 表示用の desc を作る。先頭の（…）：と先頭の：—類を除く。
    function cleanDesc(t) {
      return (t || '').replace(/\s+/g, ' ').trim()
        .replace(/^（[^）]*）：\s*/, '').replace(/^[：:—―\-–\s]+/, '');
    }

    // ラベルの文字幅の見積もり（描画・ヒット判定で共通）。全角は1文字幅、
    // 半角（ASCII）は約0.55文字幅。ctx.measureText は jsdom では使えない
    // ため、描画とテストで同じ見積もりを使う。
    function textWidth(name, fs) {
      let w = 0;
      for (const ch of name) {
        const c = ch.codePointAt(0);
        w += (c < 0x1100) ? 0.55 : 1.0;
      }
      return w * fs;
    }

    // ドットの描画半径（2Dでは f=1）。ヒット判定・テストフックと共通。
    function dotRadius(f) {
      return Math.max(1.2, Math.min(6, 4.2 * f));
    }

    // ラベルの背景プレートの色（半透明の白）。辺の上でも読めるようにする。
    const LABEL_BG = 'rgba(255,255,255,0.78)';

    // 長い名前を2行に折り返す分割位置を求める（省略「…」の代わりに全文表示）。
    // 区切りの良し悪しを段階で分け、段階が違うもの同士は幅のバランスより
    // 段階を優先する。段階0：自然な区切り（閉じ括弧・句読点・空白・助詞の後、
    // 開き括弧の前）。段階1：それ以外（漢字同士など。日本語ではやむを得ない）。
    // 段階2：避けたい区切り（英単語の途中、行が開き括弧で終わる／閉じ括弧で
    // 始まる）。従来は幅のバランスだけを見ていたため、ボーナス（6px）が
    // 幅の差（数十px）に負けて「Co-regulati|on」のように英単語の途中で
    // 切れていた。
    function splitName(name, f) {
      const chars = [...name];
      if (chars.length < 8) return null;
      const fullW = textWidth(name, f);
      const isLatin = (ch) => /[A-Za-z0-9]/.test(ch || '');
      const tier = (i) => {
        const prev = chars[i - 1], next = chars[i];
        if ((isLatin(prev) && isLatin(next))
          || (isLatin(prev) && next === '-')
          || (prev === '-' && isLatin(next))) return 2; // 英単語の途中
        if ('（「『'.includes(prev)) return 2; // 行が開き括弧で終わる
        if ('）」』'.includes(next)) return 2; // 行が閉じ括弧で始まる
        if ('）」』、。，．・＝, '.includes(prev)) return 0;
        if ('（「『'.includes(next)) return 0;
        if ('とのでがはにをへやもかねよ'.includes(prev)) return 0;
        return 1;
      };
      let best = null, bestScore = Infinity;
      for (let i = 2; i <= chars.length - 2; i++) {
        const l1 = chars.slice(0, i).join(''), l2 = chars.slice(i).join('');
        const w1 = textWidth(l1, f), w2 = textWidth(l2, f);
        const mx = Math.max(w1, w2);
        const t = tier(i);
        // 折り返しても1行と大差ない場合は使わない。ただし自然な区切り
        // （段階0）は多少アンバランスでも価値があるので上限を緩める。
        // 「CADSS（臨床家施行解離状態尺度）」の括弧前（0.825倍）が
        // 一律0.82で弾かれて語の途中で切れていたため。
        const limit = t === 0 ? fullW * 0.95 : fullW * 0.82;
        if (mx > limit) continue;
        const score = t * 10000 + mx;
        if (score < bestScore) { bestScore = score; best = [l1, l2]; }
      }
      return best;
    }

    // ノードのラベル配置（純粋関数。draw() と hitNode で共通）。
    // 描画するラベルだけを返す。戻り値: [{ idx, x, y, toRight, fs, box, dy }]
    // 候補を複数試す：既定位置→上下にずらす→反対側→フォントを小さくする。
    // 1段目（must）のラベルは必ず描く。2段目などは重なりが避けられなけれ
    // ば描かない。ラベル同士の重なりだけでなく、他ノードのドットをラベル
    // 矩形の中に含まないことも優先する（ドットが文字に隠れると、クリック
    // した文字とドットのどちらを指したのか分からなくなるため）。
    function computeLabelLayout() {
      const isMind = G.dim !== '3d';
      if (isTree2d()) {
        // 枠ツリー：ボックス自体がラベル。画面上のボックス矩形をそのまま返す
        // （ヒット判定・フィット・スナップショットで共通）。ボックスは
        // ワールド座標で大きさが決まるため、矩形は投影した中心±(w,h)×scale/2。
        const out = [];
        for (const n of G.visibleNodes) {
          const b = G.treeItems.get(n.i);
          if (!b) continue;
          const w = b.w * G.scale, h = b.h * G.scale;
          out.push({
            idx: n.i, x: n.sx, y: n.sy, toRight: true, fs: b.fs * G.scale,
            box: { x0: n.sx - w / 2, y0: n.sy - h / 2, x1: n.sx + w / 2, y1: n.sy + h / 2 },
            dy: 0, dx: 0, lines: b.lines || null, text: n.name,
          });
        }
        return out;
      }
      const placed = [];
      const out = [];
      // ドット位置の粗いグリッド（候補の矩形にドットが入るかの判定用）
      const grid = new Map();
      const CELL = 48;
      for (const m of G.visibleNodes) {
        const k = Math.floor(m.sx / CELL) + ',' + Math.floor(m.sy / CELL);
        let arr = grid.get(k);
        if (!arr) { arr = []; grid.set(k, arr); }
        arr.push(m);
      }
      const dotInside = (box, selfIdx) => {
        const x0 = Math.floor((box.x0 - 2) / CELL), x1 = Math.floor((box.x1 + 2) / CELL);
        const y0 = Math.floor((box.y0 - 2) / CELL), y1 = Math.floor((box.y1 + 2) / CELL);
        for (let gx = x0; gx <= x1; gx++) {
          for (let gy = y0; gy <= y1; gy++) {
            const arr = grid.get(gx + ',' + gy);
            if (!arr) continue;
            for (const m of arr) {
              if (m.i === selfIdx) continue;
              if (m.sx >= box.x0 - 2 && m.sx <= box.x1 + 2 && m.sy >= box.y0 - 2 && m.sy <= box.y1 + 2) return true;
            }
          }
        }
        return false;
      };
      const placeLabel = (n, fs, toRight, must) => {
        // 2段目など（mustでない）ラベルは、実描画のプレート（boxの外側2px）
        // と白い縁取り（2px）が隣のプレート・文字に触れないよう、box間に
        // 6pxの隙間を要求する。box同士の重なりは0件でも、隙間が2〜4pxだと
        // プレート同士が重なって判読しづらかったため。ドットを含む候補も
        // 許さない。候補が無ければ描かない（ドットだけ表示し、ホバーで
        // 名前が分かる）。1段目・中心（must）は従来どおり2pxの余白で、
        // 必ず描く。
        const M = must ? 2 : 6;
        const overlapsS = (a, b) => a.x0 < b.x1 + M && a.x1 + M > b.x0 && a.y0 < b.y1 + M && a.y1 + M > b.y0;
        // 候補を広く取る：フォント 11/10/9 × 両側 × 上下 ±64px まで。
        // 密集部では ±32px では足りず、長いラベル同士が重なっていた。
        // 長い名前は2行折り返しの候補も作る（省略「…」より全文表示を優先）。
        // 1段目・中心（must）はさらにフォント8と ±80px まで広げる。
        // 小さいキャンバス（900px幅など）では fs=9・±64px だけでは足りず、
        // 「ポリヴェーガル理論（ポージェス, 1994〜）」などが省略表示に
        // なっていたため。
        const fonts = must
          ? (fs === 10 ? [10, 9, 8, 7] : [fs, 10, 9, 8, 7])
          : (fs === 10 ? [10, 9, 8] : [fs, 10, 9, 8]);
        const dys = must
          ? [0, -16, 16, -32, 32, -48, 48, -64, 64, -80, 80]
          : [0, -16, 16, -32, 32, -48, 48, -64, 64];
        const mkCand = (f, side, dy, lines) => {
          const ax = side ? n.sx + n.sr + 4 : n.sx - n.sr - 4;
          const ay = n.sy + 2 + dy;
          if (!lines) {
            const w = textWidth(n.name, f);
            const box = side
              ? { x0: ax, y0: ay - f * 0.7, x1: ax + w, y1: ay + f * 0.7 }
              : { x0: ax - w, y0: ay - f * 0.7, x1: ax, y1: ay + f * 0.7 };
            return { f, side, dy, x: ax, y: ay, box, lines: null, text: n.name };
          }
          const w = Math.max(textWidth(lines[0], f), textWidth(lines[1], f));
          const box = side
            ? { x0: ax, y0: ay - f * 1.3, x1: ax + w, y1: ay + f * 1.3 }
            : { x0: ax - w, y0: ay - f * 1.3, x1: ax, y1: ay + f * 1.3 };
          return { f, side, dy, x: ax, y: ay, box, lines, text: n.name };
        };
        const cands = [];
        for (const f of fonts) {
          for (const side of [toRight, !toRight]) {
            for (const dy of dys) {
              cands.push(mkCand(f, side, dy, null));
            }
          }
          const sp = splitName(n.name, f);
          if (sp) {
            for (const side of [toRight, !toRight]) {
              for (const dy of dys) {
                cands.push(mkCand(f, side, dy, sp));
              }
            }
          }
        }
        let pick = null;
        for (const c of cands) {
          if (placed.some((b) => overlapsS(c.box, b))) continue;
          if (dotInside(c.box, n.i)) continue;
          pick = c; break;
        }
        if (!pick && must) {
          for (const c of cands) {
            if (placed.some((b) => overlapsS(c.box, b))) continue;
            pick = c; break;
          }
        }
        // (3)(4) 密集部では余白を譲り、面積の重なりだけを避ける（0.3pxの
        // 僅差で候補が全滅するのを防ぐ）。文字同士は重ならないので読める。
        // 1段目・中心（must）だけの緩和で、2段目はプレートの隙間を譲らない。
        const overlapsArea = (a, b) => a.x0 < b.x1 && a.x1 > b.x0 && a.y0 < b.y1 && a.y1 > b.y0;
        if (!pick && must) {
          for (const c of cands) {
            if (placed.some((b) => overlapsArea(c.box, b))) continue;
            if (dotInside(c.box, n.i)) continue;
            pick = c; break;
          }
        }
        if (!pick && must) {
          for (const c of cands) {
            if (placed.some((b) => overlapsArea(c.box, b))) continue;
            pick = c; break;
          }
        }
        if (!pick) {
          // 微調整：重なり面積の小さい候補から順に、上下に数pxずらして
          // 分離を試みる。残る重なりは1〜2pxの垂直方向のものがほとんどで、
          // 全文表示のまま数pxのずれで解消できる。省略表示より優先する。
          // 面積0でも2pxの余白規則で弾かれる候補があるため、面積0で
          // 打ち切らず、ずらして余白を確保する。
          const tryNudge = (allowDot, strict) => {
            const ranked = cands.map((c) => {
              let ov = 0;
              for (const b of placed) {
                const iw = Math.min(c.box.x1, b.x1) - Math.max(c.box.x0, b.x0);
                const ih = Math.min(c.box.y1, b.y1) - Math.max(c.box.y0, b.y0);
                if (iw > 0 && ih > 0) ov += iw * ih;
              }
              return { c, ov };
            }).sort((a, b) => a.ov - b.ov);
            // 1行・2行それぞれ上位3件を試す。2行は箱が大きく重なり面積が
            // 大きくなりがちなため、1行だけでは2行候補に順番が回らず、
            // 数pxのずれで分離できる折り返しが見逃されていた。
            const pool = [
              ...ranked.filter((r) => !r.c.lines).slice(0, 3),
              ...ranked.filter((r) => r.c.lines).slice(0, 3),
            ].sort((a, b) => a.ov - b.ov);
            for (const { c } of pool) {
              for (const d of [-2, 2, -4, 4, -6, 6, -8, 8, -10, 10, -12, 12, -16, 16, -20, 20]) {
                const box = { x0: c.box.x0, y0: c.box.y0 + d, x1: c.box.x1, y1: c.box.y1 + d };
                // strict（2段目）はプレートの隙間も要求し、ドットも許さない。
                if (strict ? placed.some((b) => overlapsS(box, b)) : placed.some((b) => overlapsArea(box, b))) continue;
                if (!allowDot && dotInside(box, n.i)) continue;
                return { f: c.f, side: c.side, dy: c.dy + d, x: c.x, y: c.y + d, box, lines: c.lines || null, text: n.name };
              }
            }
            return null;
          };
          // 2段目はドットを許す緩和をしない（tryNudge(true)はmustだけ）。
          pick = must ? (tryNudge(false, false) || tryNudge(true, false)) : tryNudge(false, true);
        }
        if (!pick && must) {
          // 省略表示（…）はしない。表示するラベルは全文表示する。
          // 水平方向のずらし（外側へ最大80px）も試す。引き出し線でドットと
          // 結ぶため、横にずれても対応が分かる。キャンバス端を超える候補は
          // 除く。どうしても重なる場合は、全文表示のまま重なり面積が最小の
          // 候補を選ぶ（他ノードのドットを含む候補は避ける）。1段目のラベルは
          // 必ず描く。候補の並びはフォントの大きい順・1行優先なので、重なり
          // 0のものが見つかった時点でその候補を採用する。
          const cw = canvas ? (canvas.clientWidth || 900) : 900;
          const keyOf = (box) => {
            let ov = 0;
            for (const b of placed) {
              const iw = Math.min(box.x1, b.x1) - Math.max(box.x0, b.x0);
              const ih = Math.min(box.y1, b.y1) - Math.max(box.y0, b.y0);
              if (iw > 0 && ih > 0) ov += iw * ih;
            }
            return ov + (dotInside(box, n.i) ? 1000000 : 0);
          };
          let minKey = Infinity;
          for (const c of cands) {
            const out = c.side ? 1 : -1;
            for (const dx of [0, 10 * out, 20 * out, 30 * out, 40 * out, 60 * out, 80 * out]) {
              const box = { x0: c.box.x0 + dx, y0: c.box.y0, x1: c.box.x1 + dx, y1: c.box.y1 };
              if (box.x0 < 2 || box.x1 > cw - 2) continue;
              const key = keyOf(box);
              if (key < minKey) {
                minKey = key;
                pick = { ...c, dx, x: c.x + dx, box, text: n.name };
              }
              if (minKey === 0) break;
            }
            if (minKey === 0) break;
          }
        }
        if (!pick) return null;
        placed.push(pick.box);
        const rec = { idx: n.i, x: pick.x, y: pick.y, toRight: pick.side, fs: pick.f, box: pick.box, dy: pick.dy, dx: pick.dx || 0, lines: pick.lines || null, text: pick.text || n.name };
        out.push(rec);
        return rec;
      };
      if (isMind && G.mode === 'local') {
        // 2D周辺表示はマインドマップ：中心＋1段目＋2段目に、中心からの方向に
        // 応じて左右に振り分けた横書きラベルを出す。中心と1段目は必ず描く。
        const hop1 = new Set(G.localHop1 || []);
        const order2 = [G.center, ...(G.localHop1 || []), ...Array.from(G.localParent.keys())]
          .filter((v, i, arr) => v >= 0 && arr.indexOf(v) === i);
        for (const i of order2) {
          if (!G.visible.has(i)) continue;
          const n = G.nodes[i];
          const c = G.center >= 0 ? G.nodes[G.center] : null;
          const cx = c ? c.x : 0, cy = c ? c.y : 0;
          const toRight = (n.i === G.center) || Math.cos(Math.atan2(n.y - cy, n.x - cx)) >= 0;
          placeLabel(n, 11, toRight, n.i === G.center || hop1.has(i));
        }
      } else if (G.mode === 'local') {
        // 3D周辺表示：中心・選択・ホバーとその言及相手にラベルを出す。
        const labelSet = new Set();
        const addMentionPartners = (idx) => {
          if (idx < 0) return;
          for (const a of G.adj[idx] || []) {
            if ((a.mention || a.coloc || a.rel) && G.visible.has(a.to)) labelSet.add(a.to);
          }
        };
        if (G.center >= 0) labelSet.add(G.center);
        if (G.hover >= 0) labelSet.add(G.hover);
        if (G.selected >= 0) labelSet.add(G.selected);
        addMentionPartners(G.center);
        addMentionPartners(G.selected);
        // 中心を先に描いて優先する
        const order = [G.center, G.selected, G.hover, ...labelSet]
          .filter((v, i, arr) => v >= 0 && arr.indexOf(v) === i);
        for (const i of order) {
          if (!G.visible.has(i)) continue;
          const n = G.nodes[i];
          placeLabel(n, 11, true, false);
        }
      } else {
        // 全体図では選択・ホバーのみ。3Dでは従来どおり。
        for (const i of [G.selected, G.hover]) {
          if (i >= 0 && G.visible.has(i)) {
            const n = G.nodes[i];
            placeLabel(n, 12, true, false);
          }
        }
      }
      return out;
    }

    // ラベルの後ろの半透明プレート（角丸が使えれば角丸、なければ四角）。
    function plateRect(x, y, w, h) {
      if (!ctx) return;
      ctx.beginPath();
      if (typeof ctx.roundRect === 'function') ctx.roundRect(x, y, w, h, 4);
      else ctx.rect(x, y, w, h);
      ctx.fill();
    }

    // 枠ツリーの描画（2Dのみ）：章・グループのフレーム、項目ボックス、
    // 枝（直角のエルボー）。項目間の辺（2,174本）は描かず、件数表示で
    // 総数を示す（放射状では従来どおり描画する）。文字はボックスに合
    // わせてワールド単位で大きさを決める（ズームで一緒に拡大・縮小する）。
    // 小さすぎる文字は描かない（ボックスだけ）。
    function drawTree() {
      const dimCh = (G.mode === 'all') ? G.dimChapter : null;
      const P = (wx, wy) => project({ x: wx, y: wy });
      const fontPx = (fs) => Math.max(0, fs * G.scale);
      const drawBoxText = (cx, cy, lines, fs, bold, color) => {
        const fpx = fontPx(fs);
        if (fpx < 3 || !lines || !lines.length) return;
        ctx.font = (bold ? 'bold ' : '') + fpx + 'px sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillStyle = color || '#111111';
        if (lines.length === 1) {
          ctx.fillText(lines[0], cx, cy);
        } else {
          ctx.fillText(lines[0], cx, cy - 6.5 * G.scale);
          ctx.fillText(lines[1], cx, cy + 6.5 * G.scale);
        }
      };
      const rect = (x0, y0, x1, y1, fill, stroke, lw) => {
        ctx.beginPath();
        if (typeof ctx.roundRect === 'function') ctx.roundRect(x0, y0, x1 - x0, y1 - y0, 4);
        else ctx.rect(x0, y0, x1 - x0, y1 - y0);
        if (fill) { ctx.fillStyle = fill; ctx.fill(); }
        if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = lw || 1; ctx.stroke(); }
      };
      const elbow = (x1, y1, x2, y2, color, alpha, dash) => {
        const my = (y1 + y2) / 2;
        ctx.strokeStyle = color;
        ctx.globalAlpha = alpha;
        ctx.lineWidth = 1.5;
        ctx.setLineDash(dash || []);
        ctx.beginPath();
        ctx.moveTo(x1, y1);
        ctx.lineTo(x1, my);
        ctx.lineTo(x2, my);
        ctx.lineTo(x2, y2);
        ctx.stroke();
        ctx.setLineDash([]);
        ctx.globalAlpha = 1;
      };
      const drawItemBox = (n, b, faded, chapterColor) => {
        const p = project(n);
        n.sx = p.x; n.sy = p.y; n.sr = b.h * G.scale / 2;
        const w = b.w * G.scale, h = b.h * G.scale;
        ctx.globalAlpha = faded ? 0.12 : 1;
        rect(p.x - w / 2, p.y - h / 2, p.x + w / 2, p.y + h / 2, 'rgba(255,255,255,0.88)', 'rgba(0,0,0,0.22)', 1);
        drawBoxText(p.x, p.y, b.lines, b.fs, false);
        if (n.i === G.center && G.mode === 'local') {
          rect(p.x - w / 2, p.y - h / 2, p.x + w / 2, p.y + h / 2, null, chapterColor || '#111111', 2.5);
        } else if (n.i === G.selected) {
          rect(p.x - w / 2, p.y - h / 2, p.x + w / 2, p.y + h / 2, null, '#111111', 2);
        } else if (n.i === G.hover) {
          rect(p.x - w / 2, p.y - h / 2, p.x + w / 2, p.y + h / 2, null, 'rgba(0,0,0,0.45)', 1.4);
        }
        ctx.globalAlpha = 1;
      };
      const treeEdgeKind = (from, to) => {
        const list = G.adj[from] || [];
        const e = list.find((x) => x.to === to);
        if (!e) return 'tag';
        if (e.rel) return 'rel';
        if (e.mention || e.coloc) return 'mention';
        return 'tag';
      };
