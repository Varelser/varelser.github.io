"],"birth":null,"death":null,"href":"https://note.com/search?q=from%3A%40varelser%20%E3%82%B0%E3%83%AC%E3%82%A4%E3%83%88%E3%83%95%E3%83%AB%E3%83%BB%E3%83%87%E3%83%83%E3%83%89&context=note&mode=search","article":false,"descRaw":"（米）：1965年に結成されたアメリカのロックバンド。長時間の即興ジャム、特に『ダーク・スター』に代表される演奏で、聴衆との集団的なトランス体験を生み出した。ケン・キージーのアシッド・テストと結びつき、LSD文化と一体化した。デッドヘッズと呼ばれる共同体を形成し、ライヴ録音の交換文化でも知られる。コンサートの録音を自由に交換する文化は、後の音楽共有の先駆となった。"},{"name":"ピンク・フロイド","chapter":"c4-誘発法","sub":8,"subCount":15,"tags":["art"],"birth":null,"death":null,"href":"https://note.com/search?q=from%3A%40varelser%20%E3%83%94%E3%83%B3%E3%82%AF%E3%83%BB%E3%83%95%E3%83%AD%E3%82%A4%E3%83%89&context=note&mode=search","article":false,"descRaw":"（英）：1965年に結成されたイギリスのロックバンド。シド・バレット期のサイケデリアから、『狂気（ザ・ダーク・サイド・オブ・ザ・ムーン）』（1973年）へ展開した。音響的な没入とコンセプト・アルバムの形式で、意識の旅を描いた。光と音による大規模なライヴ演出でも知られ、プログレッシヴ・ロックの代表である。『狂気』は、チャートに長期間とどまる空前のロングセラーとなった。"},{"name":"13thフロア・エレベーターズ","chapter":"c4-誘発法","sub":8,"subCount":15,"tags":["art","substance"],"birth":null,"death":null,"href":"https://note.com/search?q=from%3A%40varelser%2013th%E3%83%95%E3%83%AD%E3%82%A2%E3%83%BB%E3%82%A8%E3%83%AC%E3%83%99%E3%83%BC%E3%82%BF%E3%83%BC%E3%82%BA&context=note&mode=search","article":false,"descRaw":"（米）：1965年に結成されたアメリカ・テキサスのロックバンド。サイケデリック・ロックの命名者として知られる。デビュー作『サイケデリック・サウンズ・オブ・ザ・13thフロア・エレヴェーターズ』（1966年）は、ジャンル名を冠した最初のアルバムとされる。ロッキー・エリクソンの幻視的な歌詞と、エレクトリック・ジャグの音色が特徴である。"},{"name":"ビョーク","chapter":"c4-誘発法","sub":8,"subCount":15,"tags":["art","tech"],"birth":1965,"death":null,"href":"https://note.com/search?q=from%3A%40varelser%20%E3%83%93%E3%83%A7%E3%83%BC%E3%82%AF&context=note&mode=search","article":false,"descRaw":"（アイスランド・1965–）：アイスランドの音楽家。自然・テクノロジー・身体・声を融合させ、電子音楽とオーガニックな音響の境界を溶解させた。『ホモジェニック』（1997年）や『バイオフィリア』（2011年）で知られる。VR作品『ヴルニクラVR』など、没入的な知覚体験を追求し、火山や氷河のイメージとともに、独自の音響宇宙を構築した。"},{"name":"ザ・ドアーズ","chapter":"c4-誘発法","sub":8,"subCount":15,"tags":["art","substance","culture"],"birth":null,"death":null,"href":"https://note.com/search?q=from%3A%40varelser%20%E3%82%B6%E3%83%BB%E3%83%89%E3%82%A2%E3%83%BC%E3%82%BA&context=note&mode=search","article":false,"descRaw":"（米）：1965年にロサンゼルスで結成されたアメリカのロックバンド。バンド名は、オルダス・ハクスリーの『知覚の扉』（ウィリアム・ブレイクに由来）にちなむ。ヴォーカリストのジム・モリソンは、自らをシャーマンになぞらえ、詩とディオニュソス的なステージで観客を陶酔させた。『ハートに火をつけて』（1967年）などが代表曲で、サイケデリック・ロックの象徴となった。"},{"name":"ジョン・コルトレーン","chapter":"c4-誘発法","sub":9,"subCount":15,"tags":["art","religion"],"birth":1926,"death":1967,"href":"https://note.com/varelser/n/nd89e973787fc","article":true,"descRaw":"（米・1926–1967）：アメリカのサックス奏者。『ジャイアント・ステップス』（1960年）で和声の限界に挑み、『至上の愛（ア・ラヴ・シュプリーム）』（1965年）で宗教的な恍惚をジャズで表現した。晩年のフリー・インプロヴィゼーションはトランス的な演奏として知られ、『アセンション』（1966年）では集団即興の極限を探った。1967年に40歳で没した。"},{"name":"アリス・コルトレーン","chapter":"c4-誘発法","sub":9,"subCount":15,"tags":["art","religion","practice"],"birth":1937,"death":2007,"href":"https://note.com/search?q=from%3A%40varelser%20%E3%82%A2%E3%83%AA%E3%82%B9%E3%83%BB%E3%82%B3%E3%83%AB%E3%83%88%E3%83%AC%E3%83%BC%E3%83%B3&context=note&mode=search","article":false,"descRaw":"（米・1937–2007）：アメリカの音楽家。ハープとオルガンによるスピリチュアル・ジャズで知られる。夫ジョンの死後、ヒンドゥー教に帰依し、音楽を修行の実践として位置づけた。『ジャーニー・イン・サッチダーナンダ』（1971年）は、瞑想と恍惚の音楽として知られる。カリフォルニアにアシュラムを設立し、霊的な共同体を導いた。晩年はサッチダーナンダの名で知られ、霊的な指導者としても活動した。"},{"name":"ファラオ・サンダース","chapter":"c4-誘発法","sub":9,"subCount":15,"tags":["art","religion"],"birth":1940,"death":2022,"href":"https://note.com/search?q=from%3A%40varelser%20%E3%83%95%E3%82%A1%E3%83%A9%E3%82%AA%E3%83%BB%E3%82%B5%E3%83%B3%E3%83%80%E3%83%BC%E3%82%B9&context=note&mode=search","article":false,"descRaw":"（米・1940–2022）：アメリカのサックス奏者。スピリチュアル・ジャズの巨人として、呪術的な奏法とオーヴァートーン、声の使用で知られる。『カーマ』（1969年）の『ザ・クリエイター・ハズ・ア・マスター・プラン』は、平和と宇宙的意識を歌う代表作。コルトレーンとの共演を経て、恍惚的なフリー・ジャズを確立した。コルトレーンのバンドで演奏したのち、ソロでスピリチュアル・ジャズを切り開いた。"},{"name":"サン・ラ","chapter":"c4-誘発法","sub":9,"subCount":15,"tags":["art","religion","culture"],"birth":1914,"death":1993,"href":"https://note.com/search?q=from%3A%40varelser%20%E3%82%B5%E3%83%B3%E3%83%BB%E3%83%A9&context=note&mode=search","article":false,"descRaw":"（米・1914–1993）：アメリカの音楽家。アフロフューチャリズムの祖として、「自分は土星から来た」と宣言し、宇宙的意識を掲げた。アーケストラによる集団即興、コスチューム、儀式を統合した音楽的宇宙論を展開した。映画『スペース・イズ・ザ・プレイス』（1973年）でも知られ、ジャズを宇宙的な神話へと拡張した。生涯に100枚を超える録音を残し、ジャズの宇宙的な神話を築いた。"},{"name":"ドン・チェリー","chapter":"c4-誘発法","sub":9,"subCount":15,"tags":["art","culture"],"birth":1936,"death":1995,"href":"https://note.com/search?q=from%3A%40varelser%20%E3%83%89%E3%83%B3%E3%83%BB%E3%83%81%E3%82%A7%E3%83%AA%E3%83%BC&context=note&mode=search","article":false,"descRaw":"（米・1936–1995）：アメリカのトランペット奏者。ポケット・トランペットを手に、世界各地の楽器とスピリチュアリティを融合させた汎民族的な即興音楽を展開した。オーネット・コールマンとの共演で知られ、1972年の『オーガニック・ミュージック・ソサエティ』は、グローバルな意識拡張の音楽として評価された。北欧に暮らした時期もあり、各地の音楽家との共演を重ねた。"},{"name":"マイルス・デイヴィス","chapter":"c4-誘発法","sub":9,"subCount":15,"tags":["art"],"birth":1926,"death":1991,"href":"https://note.com/search?q=from%3A%40varelser%20%E3%83%9E%E3%82%A4%E3%83%AB%E3%82%B9%E3%83%BB%E3%83%87%E3%82%A4%E3%83%B4%E3%82%A3%E3%82%B9&context=note&mode=search","article":false,"descRaw":"（米・1926–1991）：アメリカのトランペット奏者。『カインド・オブ・ブルー』（1959年）でモード・ジャズを確立し、エレクトリック期の『ビッチェズ・ブリュー』（1970年）では、反復と持続音、テクスチャの重層化によるトランス的な音響へ転じた。ジャズの様式を何度も刷新し、意識の変容を音で体現した。1950年代のクール・ジャズからフュージョンまで、様式を次々と刷新した。"},{"name":"灰野敬二","chapter":"c4-誘発法","sub":10,"subCount":15,"tags":["art","practice"],"birth":1952,"death":null,"href":"https://note.com/search?q=from%3A%40varelser%20%E7%81%B0%E9%87%8E%E6%95%AC%E4%BA%8C&context=note&mode=search","article":false,"descRaw":"（日・1952–）：日本の音楽家。1978年に結成した不失者をはじめ、即興演奏における身体と意識の極限的な開放を追求した。ギター、声、打楽器を駆使し、ノイズと静寂が交錯する演奏で知られる。日本のサイケデリック／ノイズ・シーンの最重要人物の一人であり、国内外で膨大な録音を残した。即興のライブでは、音と沈黙の往復が聴き手の意識を揺さぶる。"},{"name":"メルツバウ（秋田昌美）","chapter":"c4-誘発法","sub":10,"subCount":15,"tags":["art"],"birth":1956,"death":null,"href":"https://note.com/search?q=from%3A%40varelser%20%E3%83%A1%E3%83%AB%E3%83%84%E3%83%90%E3%82%A6&context=note&mode=search","article":false,"descRaw":"（日・1956–）：日本のノイズ・ミュージシャン。1979年からメルツバウ名義で活動し、ハーシュノイズの巨人として知られる。情報過多による聴覚の飽和と変容を、爆音の壁によって引き起こす。300枚を超えるリリースを重ね、ノイズを音楽の中心に据えた実践は、世界的なノイズ・シーンの基盤となった。秋田昌美は美術批評や著作でも知られ、ノイズを思想的に位置づけた。"},{"name":"Coil（ジョン・バランス＋ピーター・クリストファーソン）","chapter":"c4-誘発法","sub":10,"subCount":15,"tags":["art","religion","substance"],"birth":null,"death":null,"href":"https://note.com/search?q=from%3A%40varelser%20Coil&context=note&mode=search","article":false,"descRaw":"（英）：1982年に結成されたイギリスの実験音楽ユニット。オカルト、魔術、夢、薬理体験を音楽構造に直接組み込んだ。『ホース・ローター・ヴェイター』（1986年）や『ミュージック・トゥ・プレイ・イン・ザ・ダーク』（1999〜2000年）で知られる。意識変容のテクノロジーとしてのサウンドを明確に主題化した。バランスとクリストファーソンの死後も、その音源は再評価され続けている。"},{"name":"スロッビング・グリッスル","chapter":"c4-誘発法","sub":10,"subCount":15,"tags":["art"],"birth":null,"death":null,"href":"https://note.com/search?q=from%3A%40varelser%20%E3%82%B9%E3%83%AD%E3%83%83%E3%83%93%E3%83%B3%E3%82%B0%E3%83%BB%E3%82%B0%E3%83%AA%E3%83%83%E3%82%B9%E3%83%AB&context=note&mode=search","article":false,"descRaw":"（英）：1975年に結成されたイギリスのグループ。インダストリアル・ミュージックの創始者として知られる。ジェネシス・P・オリッジらが、心理的な不安と知覚のショックによって、意識を強制的に脱臼させる音響を追求した。『ザ・セカンド・アニュアル・レポート』（1977年）などが代表作である。1981年の解散後、メンバーはサイキックTVやクリス＆コージーなどで活動した。"},{"name":"ポポル・ヴー（フローリアン・フリッケ）","chapter":"c4-誘発法","sub":10,"subCount":15,"tags":["art"],"birth":null,"death":null,"href":"https://note.com/search?q=from%3A%40varelser%20%E3%83%9D%E3%83%9D%E3%83%AB%E3%83%BB%E3%83%B4%E3%83%BC&context=note&mode=search","article":false,"descRaw":"（独）：ドイツのグループ。フローリアン・フリッケを中心に1970年に結成され、ムーグ・シンセサイザーと民族楽器を融合させたコスミッシェ・ムジークを展開した。ヴェルナー・ヘルツォーク監督の『アギーレ』（1972年）や『フィッツカラルド』（1982年）の音楽で知られ、瞑想的で宇宙的な音響を作った。ヘルツォーク以外の映画音楽や、瞑想的なアルバムも多数残した。"},{"name":"タンジェリン・ドリーム","chapter":"c4-誘発法","sub":10,"subCount":15,"tags":["art"],"birth":null,"death":null,"href":"https://note.com/search?q=from%3A%40varelser%20%E3%82%BF%E3%83%B3%E3%82%B8%E3%82%A7%E3%83%AA%E3%83%B3%E3%83%BB%E3%83%89%E3%83%AA%E3%83%BC%E3%83%A0&context=note&mode=search","article":false,"descRaw":"（独）：1967年に結成されたドイツの電子音楽グループ。エドガー・フローゼを中心に、シーケンサーの反復による催眠的な音響空間を構築した。『フェードラ』（1974年）でベルリン・スクールの代表となり、映画音楽や長尺の電子音響作品で、意識の漂流を誘う音楽を展開した。1980年代以降は映画音楽を多数手がけ、電子音楽の大衆化を進めた。"},{"name":"クラウス・シュルツェ","chapter":"c4-誘発法","sub":10,"subCount":15,"tags":["art"],"birth":1947,"death":2022,"href":"https://note.com/search?q=from%3A%40varelser%20%E3%82%AF%E3%83%A9%E3%82%A6%E3%82%B9%E3%83%BB%E3%82%B7%E3%83%A5%E3%83%AB%E3%83%84%E3%82%A7&context=note&mode=search","article":false,"descRaw":"（独・1947–2022）：ドイツのシンセサイザー奏者。タンジェリン・ドリームの初期メンバーを経て、ソロでコスミッシェ・ムジークを展開した。『タイムウィンド』（1975年）や『ミラージュ』（1977年）など、長尺の電子音響空間による意識の漂流を描いた。ベルリン派電子音楽の中心人物として、瞑想的なシンセ音楽を確立した。シンセサイザーの即興演奏による長尺の作品を、生涯にわたり多数残した。"},{"name":"CAN","chapter":"c4-誘発法","sub":10,"subCount":15,"tags":["art","religion"],"birth":null,"death":null,"href":"https://note.com/search?q=from%3A%40varelser%20CAN&context=note&mode=search","article":false,"descRaw":"（独）：1968年に結成されたドイツのロックバンド。クラウトロックの代表格として、即興と反復によるトランス的なグルーヴを生み出した。『タゴ・マゴ』（1971年）は、ダモ鈴木の叫びと囁きによるシャーマニスティックな表現で知られる。ホルガー・シューカイのベースとジャッキー・リーベツァイトのドラムが、催眠的なリズムを支えた。"},{"name":"Sunn O)))","chapter":"c4-誘発法","sub":10,"subCount":15,"tags":["art","religion"],"birth":null,"death":null,"href":"https://note.com/search?q=from%3A%40varelser%20Sunn%20O%29%29%29&context=note&mode=search","article":false,"descRaw":"（米）：1998年に結成されたアメリカのドローン・メタル・デュオ。極端な低音と振動、轟音による身体的な変性体験を生み出す。ローブ姿のパフォーマンスは儀式的であり、音の物理的な圧力が聴衆を包み込む。『モノリス・アンド・ディメンションズ』（2009年）など、ドローンとメタルを結びつけた。轟音と低音によるライブは、聴覚を超えた全身の体験として知られる。"},{"name":"クラフトワーク","chapter":"c4-誘発法","sub":10,"subCount":15,"tags":["art","tech"],"birth":null,"death":null,"href":"https://note.com/search?q=from%3A%40varelser%20%E3%82%AF%E3%83%A9%E3%83%95%E3%83%88%E3%83%AF%E3%83%BC%E3%82%AF&context=note&mode=search","article":false,"descRaw":"（独）：1970年にデュッセルドルフでラルフ・ヒュッターとフローリアン・シュナイダーにより結成されたドイツの電子音楽グループ。シンセサイザー、ドラムマシン、ボコーダーを全面的に採用し、シーケンサーによる反復リズムで聴覚的なトランスを誘発した。『アウトバーン』（1974年）の22分に及ぶ表題曲が代表作で、テクノやハウス、ヒップホップの源流となった。"},{"name":"スティーヴ・ローチ","chapter":"c4-誘発法","sub":11,"subCount":15,"tags":["art","practice"],"birth":1955,"death":null,"href":"https://note.com/search?q=from%3A%40varelser%20%E3%82%B9%E3%83%86%E3%82%A3%E3%83%BC%E3%83%B4%E3%83%BB%E3%83%AD%E3%83%BC%E3%83%81&context=note&mode=search","article":false,"descRaw":"（米・1955–）：アメリカのアンビエント音楽家。1984年の『ストラクチャーズ・フロム・サイレンス』や、1988年の『ドリームタイム・リターン』で知られる。30年以上にわたり、ドローンとアンビエントの制作を続け、意識の変容と瞑想を音楽の明確な目的に据えた。持続音の巨匠として、電子瞑想音楽の基盤を築いた。シンセサイザーによるドローンと、民族楽器の音色を結びつけた作品も多い。"},{"name":"ロバート・リッチ","chapter":"c4-誘発法","sub":11,"subCount":15,"tags":["art","dream"],"birth":1963,"death":null,"href":"https://note.com/search?q=from%3A%40varelser%20%E3%83%AD%E3%83%90%E3%83%BC%E3%83%88%E3%83%BB%E3%83%AA%E3%83%83%E3%83%81&context=note&mode=search","article":false,"descRaw":"（米・1963–）：アメリカのアンビエント音楽家。1982年から、聴衆が眠った状態で聴く8時間のスリープ・コンサートを開催し、睡眠と意識の境界を音響で探索した。ドローンと微細な音の変化による作品で知られ、7時間のDVD作品『ソムニウム』（2001年）も発表した。眠りと夢の音楽として評価された。睡眠中の聴き手を想定した作品は、夢と音の関係を探る実験でもある。"},{"name":"エイフェックス・ツイン（リチャード・D・ジェームス）","chapter":"c4-誘発法","sub":11,"subCount":15,"tags":["art","dream"],"birth":1971,"death":null,"href":"https://note.com/search?q=from%3A%40varelser%20%E3%82%A8%E3%82%A4%E3%83%95%E3%82%A7%E3%83%83%E3%82%AF%E3%82%B9%E3%83%BB%E3%83%84%E3%82%A4%E3%83%B3&context=note&mode=search","article":false,"descRaw":"（英・1971–）：イギリスの電子音楽家。1992年の『セレクテッド・アンビエント・ワークス 85–92』で、夢のようなアンビエントと鋭利なビートを結びつけた。明晰夢から着想した楽曲制作を語り、電子音楽における無意識的・夢的なサウンドスケープの先駆となった。仮面や変装による匿名性でも知られる。変名を多数使い分け、テクノとアンビエントの境界を自在に横断した。"},{"name":"ジルベール・ルジェ","chapter":"c4-誘発法","sub":12,"subCount":15,"tags":["theory","art","culture"],"birth":1916,"death":2017,"href":"https://note.com/search?q=from%3A%40varelser%20%E3%82%B8%E3%83%AB%E3%83%99%E3%83%BC%E3%83%AB%E3%83%BB%E3%83%AB%E3%82%B8%E3%82%A7&context=note&mode=search","article":false,"descRaw":"（Gilbert Rouget・1916–2017）：フランスの民族音楽学者。『音楽とトランス』（1980年）で、世界各地の儀礼音楽と変性意識の関係を体系化した。アフリカ音楽の研究を基盤に、音楽がトランスを誘発する仕組みを、リズム・音色・社会的文脈から分析した。民族音楽学と意識研究を結ぶ基礎文献の著者である。アフリカの王宮音楽の研究を基盤に、音楽と儀礼の関係を論じた。"},{"name":"アラン・ローマックス","chapter":"c4-誘発法","sub":12,"subCount":15,"tags":["science","culture","art"],"birth":1915,"death":2002,"href":"https://note.com/varelser/n/n98dc016e7117","article":true,"descRaw":"（米・1915–2002）：アメリカの民俗音楽学者。アメリカ議会図書館などで世界各地の民族音楽を収録・分析し、カントメトリクスと呼ばれる歌唱様式と社会構造の比較研究を提唱した。フォーク音楽の記録者として知られ、歌の様式が社会や意識のあり方を反映するという視点を提示した。フォーク歌手ウディ・ガスリーらの録音を残し、アメリカ音楽の記録者となった。"},{"name":"ラヴィ・シャンカル","chapter":"c4-誘発法","sub":12,"subCount":15,"tags":["art","religion","practice"],"birth":1920,"death":2012,"href":"https://note.com/search?q=from%3A%40varelser%20%E3%83%A9%E3%83%B4%E3%82%A3%E3%83%BB%E3%82%B7%E3%83%A3%E3%83%B3%E3%82%AB%E3%83%AB&context=note&mode=search","article":false,"descRaw":"（印・1920–2012）：インドのシタール奏者。インド古典音楽のラーガを西洋に紹介し、瞑想的な構造が1960年代のサイケデリック運動と合流した。ジョージ・ハリスンとの交流で知られ、1967年のモントレー・ポップ・フェスティヴァルに出演した。ラーガの長時間の展開は、意識の変容を誘う音楽として受容された。娘のアヌーシュカもシタール奏者として活躍し、音楽の伝統を受け継いだ。"},{"name":"ヌスラット・ファテー・アリー・ハーン","chapter":"c4-誘発法","sub":12,"subCount":15,"tags":["art","religion"],"birth":1948,"death":1997,"href":"https://note.com/search?q=from%3A%40varelser%20%E3%83%8C%E3%82%B9%E3%83%A9%E3%83%83%E3%83%88%E3%83%BB%E3%83%95%E3%82%A1%E3%83%86%E3%83%BC%E3%83%BB%E3%82%A2%E3%83%AA%E3%83%BC%E3%83%BB%E3%83%8F%E3%83%BC%E3%83%B3&context=note&mode=search","article":false,"descRaw":"（パキスタン・1948–1997）：パキスタンの歌手。スーフィーの宗教歌謡カッワーリーの最高峰として、恍惚的な歌唱による集団的トランス体験を生み出した。600年続く音楽家系に生まれ、1980年代以降は西洋でも活躍し、ピーター・ガブリエルらとの共演で知られる。声の持続と反復が、聴衆を陶酔へ導いた。映画音楽にも参加し、カッワーリーを世界の音楽へと広めた。"},{"name":"ミッキー・ハート","chapter":"c4-誘発法","sub":12,"subCount":15,"tags":["art","science","culture"],"birth":1943,"death":null,"href":"https://note.com/search?q=from%3A%40varelser%20%E3%83%9F%E3%83%83%E3%82%AD%E3%83%BC%E3%83%BB%E3%83%8F%E3%83%BC%E3%83%88&context=note&mode=search","article":false,"descRaw":"（米・1943–）：アメリカのドラマー。グレイトフル・デッドのメンバーとして、リズムとトランスの関係を人類学的に研究した。著書『ドラミング・アット・ジ・エッジ・オブ・マジック』（1990年）では、世界各地の太鼓と儀礼を取材し、打楽器が意識を変容させる仕組みを論じた。民族打楽器の収集家でもある。スミソニアン博物館とも協力し、世界の打楽器の記録と保存に努めた。"},{"name":"R.マリー・シェーファー","chapter":"c4-誘発法","sub":13,"subCount":15,"tags":["theory","art","science"],"birth":1933,"death":2021,"href":"https://note.com/search?q=from%3A%40varelser%20R.%E3%83%9E%E3%83%AA%E3%83%BC%E3%83%BB%E3%82%B7%E3%82%A7%E3%83%BC%E3%83%95%E3%82%A1%E3%83%BC&context=note&mode=search","article":false,"descRaw":"（加・1933–2021）：カナダの作曲家・音響生態学者。サウンドスケープ（音風景）の概念を創始し、1971年にワールド・サウンドスケープ・プロジェクトを立ち上げた。著書『世界の調律』（1977年）で、環境音と聴覚的意識の生態学を論じた。音の環境が人間の知覚と意識を形づくるという視点を提示した。『世界の調律』は、音の環境をデザインする思想として広く読まれた。"},{"name":"池田亮司","chapter":"c4-誘発法","sub":13,"subCount":15,"tags":["art","tech","science"],"birth":1966,"death":null,"href":"https://note.com/search?q=from%3A%40varelser%20%E6%B1%A0%E7%94%B0%E4%BA%AE%E5%8F%B8&context=note&mode=search","article":false,"descRaw":"（日・1966–）：日本のサウンドアーティスト。超音波や正弦波、データの視聴覚化を手がけ、知覚の閾値を扱う作品で知られる。『datamatics』（2006年〜）では、膨大なデータを音と映像に変換し、人間の知覚の限界を可視化した。ダムタイプの活動を経て、数学的な精密さと身体的な音響を結びつけた。世界各地の美術館や音楽祭で、音と光による大規模な展示を行っている。"},{"name":"ローリー・アンダーソン","chapter":"c4-誘発法","sub":13,"subCount":15,"tags":["art","tech"],"birth":1947,"death":null,"href":"https://note.com/search?q=from%3A%40varelser%20%E3%83%AD%E3%83%BC%E3%83%AA%E3%83%BC%E3%83%BB%E3%82%A2%E3%83%B3%E3%83%80%E3%83%BC%E3%82%BD%E3%83%B3&context=note&mode=search","article":false,"descRaw":"（米・1947–）：アメリカのパフォーマンス・アーティスト。1981年の『オー・スーパーマン』で知られ、テープ・ボウ・ヴァイオリンなどの自作楽器と語り、テクノロジーを用いた実験的パフォーマンスを展開した。チベット仏教の実践者でもあり、『チベット死者の書』への関心を語る。声と物語による意識の実験で知られる。ルー・リードの伴侶としても知られ、晩年は仏教的なテーマを深めた。"},{"name":"バイノーラルビート研究（オスター, 1973〜）","chapter":"c4-誘発法","sub":14,"subCount":15,"tags":["science","tech","practice"],"birth":null,"death":null,"href":"https://note.com/search?q=from%3A%40varelser%20%E3%83%90%E3%82%A4%E3%83%8E%E3%83%BC%E3%83%A9%E3%83%AB%E3%83%93%E3%83%BC%E3%83%88%E7%A0%94%E7%A9%B6%EF%BC%88%E3%82%AA%E3%82%B9%E3%82%BF%E3%83%BC%2C%201973%E3%80%9C%EF%BC%89&context=note&mode=search","article":false,"descRaw":"：左右の耳にわずかに異なる周波数の純音をヘッドフォンで提示すると、脳内でその差分周波数のうなりが知覚される現象。1839年にハインリヒ・ヴィルヘルム・ドーヴェが発見し、生物物理学者ジェラルド・オスターが1973年の『サイエンティフィック・アメリカン』論文で体系化した。差分周波数に脳波が同調する「周波数追従反応」が示唆され、リラクセーションや瞑想状態の誘導への応用が研究されてきたが、効果の再現性には議論がある。 出典：Oster (1973)『Scientific American』 DOI: 10.1038/scientificamerican1073-94"},{"name":"音楽と脳（ザトーレ & サリンパリ, 2011〜）","chapter":"c4-誘発法","sub":14,"subCount":15,"tags":["science","art"],"birth":null,"death":null,"href":"https://note.com/search?q=from%3A%40varelser%20%E9%9F%B3%E6%A5%BD%E3%81%A8%E8%84%B3%EF%BC%88%E3%82%B6%E3%83%88%E3%83%BC%E3%83%AC%20%26%20%E3%82%B5%E3%83%AA%E3%83%B3%E3%83%91%E3%83%AA%2C%202011%E3%80%9C%EF%BC%89&context=note&mode=search","article":false,"descRaw":"：音楽が快感と報酬系をどう動かすかを調べた神経科学。ヴァロリー・サリンパーとロバート・ザトーレらは2011年に『Nature Neuroscience』で、音楽のピーク時に線条体でドーパミンが放出されることをPETで示した。期待の段階では尾状核、鳥肌の立つピークでは側坐核が活動するという解剖学的分離も明らかになった。2001年のブラッドとザトーレの研究と合わせ、音楽的恍惚が薬物や食物と同じ報酬回路を使う証拠となった。"},{"name":"ドラムと意識変容（ネーアー, 1962 / ハーナー）","chapter":"c4-誘発法","sub":14,"subCount":15,"tags":["practice","religion","science"],"birth":null,"death":null,"href":"https://note.com/search?q=from%3A%40varelser%20%E3%83%89%E3%83%A9%E3%83%A0%E3%81%A8%E6%84%8F%E8%AD%98%E5%A4%89%E5%AE%B9%EF%BC%88%E3%83%8D%E3%83%BC%E3%82%A2%E3%83%BC%2C%201962%20/%20%E3%83%8F%E3%83%BC%E3%83%8A%E3%83%BC%EF%BC%89&context=note&mode=search","article":false,"descRaw":"：アンドリュー・ネーアーが1961〜62年に提唱した「聴覚駆動（オーディトリー・ドライビング）」の仮説。単調な太鼓の連打（毎秒3〜8拍）が脳波をシータ帯域へ同調させ、トランスを促進するという。マイケル・ハーナーは『シャーマンの道』（1980）で、世界各地のシャーマニズムが毎秒4〜4.5拍の鼓動に収束することを報告した。後のマックスフィールドらのEEG研究も単調な太鼓でシータ活動の増加を示したが、社会的文脈の役割を強調する批判もある。"},{"name":"ディープ・リスニング（ポーリン・オリヴェロス）","chapter":"c4-誘発法","sub":14,"subCount":15,"tags":["practice","art"],"birth":null,"death":null,"href":"https://note.com/search?q=from%3A%40varelser%20%E3%83%87%E3%82%A3%E3%83%BC%E3%83%97%E3%83%BB%E3%83%AA%E3%82%B9%E3%83%8B%E3%83%B3%E3%82%B0%EF%BC%88%E3%83%9D%E3%83%BC%E3%83%AA%E3%83%B3%E3%83%BB%E3%82%AA%E3%83%AA%E3%83%B4%E3%82%A7%E3%83%AD%E3%82%B9%EF%BC%89&context=note&mode=search","article":false,"descRaw":"：米国の作曲家ポーリン・オリヴェロス（1932–2016）が提唱した、意識的に拡張された聴取の実践と理論。音をただ聞くのではなく、環境音・身体音・沈黙を含む音響世界全体へ注意を開くことで、瞑想的な意識状態へ至る。1980年代末からワークショップとアンサンブルを通じて体系化され、即興演奏・音響瞑想・聴覚トレーニングとして実践された。聴くこと自体を変性意識への入口とする点で、音楽と意識研究の独自の立場を占める。"},{"name":"音楽療法とGIM法（ボニー, 1973〜）","chapter":"c4-誘発法","sub":14,"subCount":15,"tags":["clinical","art","practice"],"birth":null,"death":null,"href":"https://note.com/search?q=from%3A%40varelser%20%E9%9F%B3%E6%A5%BD%E7%99%82%E6%B3%95%E3%81%A8GIM%E6%B3%95%EF%BC%88%E3%83%9C%E3%83%8B%E3%83%BC%2C%201973%E3%80%9C%EF%BC%89&context=note&mode=search","article":false,"descRaw":"：音楽療法家ヘレン・ボニー（1921–2010）が開発した「音楽誘導イメージ法」。1973年にルイス・サヴァリーとの共著『Music and Your Mind』で発表され、メリーランド精神医学研究センターでのLSD心理療法研究に起源をもつ。リラックス状態で選曲されたクラシック音楽を聴きながらイメージを語ることで、変性意識下での象徴的体験と心理療法を結ぶ。現在はボニー・メソッドとして世界各地で訓練・実践されている。"},{"name":"倍音と意識（マーク・ファン・トンゲレン）","chapter":"c4-誘発法","sub":14,"subCount":15,"tags":["art","practice","science"],"birth":null,"death":null,"href":"https://note.com/search?q=from%3A%40varelser%20%E5%80%8D%E9%9F%B3%E3%81%A8%E6%84%8F%E8%AD%98%EF%BC%88%E3%83%9E%E3%83%BC%E3%82%AF%E3%83%BB%E3%83%95%E3%82%A1%E3%83%B3%E3%83%BB%E3%83%88%E3%83%B3%E3%82%B2%E3%83%AC%E3%83%B3%EF%BC%89&context=note&mode=search","article":false,"descRaw":"：オランダの音楽学者マーク・ファン・トンゲレンによる倍音唱法の研究。トゥヴァのホーメイやモンゴルのフーミーなど、一人の声から基音と倍音を同時に響かせる歌唱法の音響学と身体技法を分析し、著書『Overtone Singing』にまとめた。持続音と倍音列がもたらす聴覚的没入は、瞑想的状態やトランス誘導と結びつけられて論じられる。声そのものを楽器化する技法として、音響と意識変容の接点を示す研究である。"},{"name":"ホロトロピック・ブレスワークの生理学","chapter":"c4-誘発法","sub":14,"subCount":15,"tags":["practice","science"],"birth":null,"death":null,"href":"https://note.com/search?q=from%3A%40varelser%20%E3%83%9B%E3%83%AD%E3%83%88%E3%83%AD%E3%83%94%E3%83%83%E3%82%AF%E3%83%BB%E3%83%96%E3%83%AC%E3%82%B9%E3%83%AF%E3%83%BC%E3%82%AF%E3%81%AE%E7%94%9F%E7%90%86%E5%AD%A6&context=note&mode=search","article":false,"descRaw":"：スタニスラフ・グロフが開発した呼吸法の生理学。加速された深い呼吸（過呼吸）を続けると血中二酸化炭素が低下し、呼吸性アルカローシスと脳血流の減少が起きる。これが手足のしびれやテタニー、幻視や強い情動体験を生む生理学的基盤とされる。音楽と身体作業を組み合わせた集団セッションで行われ、薬物を使わない変性意識誘導法として研究・実践されてきたが、過呼吸のリスクにも注意が求められる。"},{"name":"ヴィム・ホフ・メソッドの科学的検証（コックスら, 2014）","chapter":"c4-誘発法","sub":14,"subCount":15,"tags":["practice","science"],"birth":null,"death":null,"href":"https://note.com/search?q=from%3A%40varelser%20%E3%83%B4%E3%82%A3%E3%83%A0%E3%83%BB%E3%83%9B%E3%83%95%E3%83%BB%E3%83%A1%E3%82%BD%E3%83%83%E3%83%89%E3%81%AE%E7%A7%91%E5%AD%A6%E7%9A%84%E6%A4%9C%E8%A8%BC%EF%BC%88%E3%82%B3%E3%83%83%E3%82%AF%E3%82%B9%E3%82%89%2C%202014%EF%BC%89&context=note&mode=search","article":false,"descRaw":"：オランダのラドバウド大学医療センターのマティス・コックスらが2014年に『PNAS』で発表したランダム化比較試験。ヴィム・ホフ・メソッドを10日間訓練した12名と対照群12名に細菌内毒素を投与したところ、訓練群はアドレナリン放出が著しく高まり、炎症性サイトカイン（TNF-α、IL-6、IL-8）が低下し、抗炎症性のIL-10が上昇した。意識的な呼吸法と寒冷暴露が自律神経系と免疫系に及ぶことを示す証拠とされた。 出典：Kox et al. (2014)『Proceedings of the National Academy of Sciences』 DOI: 10.1073/pnas.1322174111"},{"name":"畏怖（Awe）研究（ケルトナー & ハイト, 2003）","chapter":"c5-畏敬","sub":0,"subCount":1,"tags":["science","theory"],"birth":null,"death":null,"href":"https://note.com/search?q=from%3A%40varelser%20%E7%95%8F%E6%80%96%EF%BC%88Awe%EF%BC%89%E7%A0%94%E7%A9%B6%EF%BC%88%E3%82%B1%E3%83%AB%E3%83%88%E3%83%8A%E3%83%BC%20%26%20%E3%83%8F%E3%82%A4%E3%83%88%2C%202003%EF%BC%89&context=note&mode=search","article":false,"descRaw":"：ダチャー・ケルトナーとジョナサン・ハイトが2003年の論文「Approaching Awe」で、畏怖を「広大さ（vastness）の知覚」と「調節（accommodation）の必要性」の二要因で定義した。巨大な自然や芸術、他者の徳に触れると、自己が矮小化し（スモール・セルフ）、時間知覚が拡張し、向社会的行動が増す。ピフら（2015）は畏怖が自己の矮小化を介して向社会性を高めることを実証した。変性意識における自己消失と共通する体験として、神秘体験研究とも結びつく。 出典：Keltner & Haidt (2003)『Cognition and Emotion』 DOI: 10.1080/02699930302297"},{"name":"崇高（Sublime）の美学と神経美学","chapter":"c5-畏敬","sub":0,"subCount":1,"tags":["art","theory","science"],"birth":null,"death":null,"href":"https://note.com/varelser/n/n24c3b42b1516","article":true,"descRaw":"：エドマンド・バークが1757年の『崇高と美の観念の起源についての哲学的探究』で論じ、カントが1790年の『判断力批判』で展開した美学概念。巨大さや力への恐怖と快が混じった感情で、美とは異なる。現代の神経美学では、崇高な風景や芸術に触れた際の畏怖・鳥肌・自己消失の神経基盤が調べられ、畏怖研究と接続する。恐怖と快の混合という点で、変性意識的な体験としての位置づけが論じられる。"},{"name":"予測美学（ヴァン・デ・クルーイス, チャータージーら）","chapter":"c5-畏敬","sub":0,"subCount":1,"tags":["theory","art","science"],"birth":null,"death":null,"href":"https://note.com/varelser/n/nc8cb9ecffc13","article":true,"descRaw":"：予測処理の枠組みで美的体験を説明する計算論。ヴァン・デ・クルーイスとワゲマンスら、神経美学のアンジャン・チャータージーらが展開し、脳が作品の構造を予測し、予測誤差がほどよい水準にあるときに美的快・没入・フロー状態が生じると考える。予測が当たりすぎれば退屈、外れすぎれば混乱となり、そのあいだの緊張が美しさを生む。芸術体験を意識の予測モデルと結びつけ、変性意識的な没入の機序にも示唆を与える。"},{"name":"リズム同調（Entrainment）研究","chapter":"c5-畏敬","sub":0,"subCount":1,"tags":["science","art"],"birth":null,"death":null,"href":"https://note.com/search?q=from%3A%40varelser%20%E3%83%AA%E3%82%BA%E3%83%A0%E5%90%8C%E8%AA%BF%EF%BC%88Entrainment%EF%BC%89%E7%A0%94%E7%A9%B6&context=note&mode=search","article":false,"descRaw":"：音楽的リズムが脳波・心拍・呼吸・運動系を同調（エントレインメント）させるメカニズム。外的リズムに身体の内的リズムが引き込まれる現象で、集団で同じリズムに乗ることで同期感と共同体験が生まれる。太鼓やダンス、行進、合唱など、儀礼と音楽の身体的基盤として研究され、神経科学的には聴覚-運動系の結合や振動子の同期として説明される。個々の意識が集団のリズムに溶け合う過程を捉える概念である。"},{"name":"HEALS理論（フィンケル & レジネラ, 2020）","chapter":"c5-畏敬","sub":0,"subCount":1,"tags":["theory","art","clinical"],"birth":null,"death":null,"href":"https://note.com/search?q=from%3A%40varelser%20HEALS%E7%90%86%E8%AB%96%EF%BC%88%E3%83%95%E3%82%A3%E3%83%B3%E3%82%B1%E3%83%AB%20%26%20%E3%83%AC%E3%82%B8%E3%83%8D%E3%83%A9%2C%202020%EF%BC%89&context=note&mode=search","article":false,"descRaw":"：フィンケルとレジネラが2020年に提唱した、健康（Health）・身体性（Embodiment）・芸術（Arts）・学び（Learning）・社会性（Social）を結ぶ理論モデル。文化活動や芸術参加が、身体感覚・情動・社会的つながりを通じて意識と健康を変容させる経路を系統的に整理する。芸術を単なる娯楽ではなく、健康とウェルビーイングの介入として位置づけ、社会的処方や芸術療法の理論的枠組みとして参照される。"},{"name":"Social Prescribing（社会的処方）と芸術実践","chapter":"c5-畏敬","sub":0,"subCount":1,"tags":["clinical","art"],"birth":null,"death":null,"href":"https://note.com/search?q=from%3A%40varelser%20Social%20Prescribing%EF%BC%88%E7%A4%BE%E4%BC%9A%E7%9A%84%E5%87%A6%E6%96%B9%EF%BC%89%E3%81%A8%E8%8A%B8%E8%A1%93%E5%AE%9F%E8%B7%B5&context=note&mode=search","article":false,"descRaw":"：医療の現場で、薬ではなく芸術活動・運動・自然体験・地域活動などを「処方」する社会的処方の実践。英国を中心に広がり、NHSのリンクワーカーが患者を地域の文化活動へつなぐ仕組みが整備された。孤独・うつ・慢性疾患に対し、文化参加が精神的健康とウェルビーイングを高めるエビデンスが蓄積されつつある。芸術と意識変容の臨床的接点として、医療と文化の境界を越える試みである。"},{"name":"音響的没入とドローン研究","chapter":"c5-畏敬","sub":0,"subCount":1,"tags":["art","practice","science"],"birth":null,"death":null,"href":"https://note.com/search?q=from%3A%40varelser%20%E9%9F%B3%E9%9F%BF%E7%9A%84%E6%B2%A1%E5%85%A5%E3%81%A8%E3%83%89%E3%83%AD%E3%83%BC%E3%83%B3%E7%A0%94%E7%A9%B6&context=note&mode=search","article":false,"descRaw":"：持続音（ドローン）による聴覚的没入が意識状態に与える影響の研究。単一の音高や微妙にずれた倍音が長時間持続すると、時間感覚が薄れ、聴覚的注意が内側へ向かい、瞑想的な状態が誘われる。ラ・モンテ・ヤングらのドローン音楽や、寺院の読経・ディジュリドゥの持続音がその例とされる。反復・微差・スペクトルの密度が知覚を変容させる機序として、音響と変性意識の接点を示す。"},{"name":"インスタレーションと状態設計（チームラボ, エリアソンら）","chapter":"c5-畏敬","sub":0,"subCount":1,"tags":["art","practice"],"birth":null,"death":null,"href":"https://note.com/search?q=from%3A%40varelser%20%E3%82%A4%E3%83%B3%E3%82%B9%E3%82%BF%E3%83%AC%E3%83%BC%E3%82%B7%E3%83%A7%E3%83%B3%E3%81%A8%E7%8A%B6%E6%85%8B%E8%A8%AD%E8%A8%88%EF%BC%88%E3%83%81%E3%83%BC%E3%83%A0%E3%83%A9%E3%83%9C%2C%20%E3%82%A8%E3%83%AA%E3%82%A2%E3%82%BD%E3%83%B3%E3%82%89%EF%BC%89&context=note&mode=search","article":false,"descRaw":"：没入型の環境芸術が知覚・身体感覚・自己感を変容させる設計の理論と実践。オラファー・エリアソンの《The Weather Project》（2003、テート・モダン）は巨大な人工の太陽と霧で来館者の身体感覚を変え、チームラボの《ボーダレス》（2018、東京）は境界のないデジタル空間で自己と環境の区別を緩めた。光・音・空間を制御して意識状態を設計する点で、芸術と変性意識の実践的な接合を示す。"},{"name":"ポール・ピフ","chapter":"c5-畏敬","sub":0,"subCount":1,"tags":["science","theory"],"birth":1981,"death":null,"href":"https://note.com/varelser/n/n2a7d3aa354d8","article":true,"descRaw":"（Paul Piff・1981–）：アメリカの心理学者。畏敬の念（Awe）の実験的研究で知られ、壮大な自然や芸術に触れて自己が小さく感じられる「スモール・セルフ」体験が、他者への向社会性を高めると示した。2015年の論文は、畏敬を変性意識の一形態として実証的に扱う契機となった。カリフォルニア大学アーバイン校で研究し、富と共感の関係でも知られる。"},{"name":"ダッチャー・ケルトナー","chapter":"c5-畏敬","sub":0,"subCount":1,"tags":["science"],"birth":1962,"death":null,"href":"https://note.com/search?q=from%3A%40varelser%20%E3%83%80%E3%83%83%E3%83%81%E3%83%A3%E3%83%BC%E3%83%BB%E3%82%B1%E3%83%AB%E3%83%88%E3%83%8A%E3%83%BC&context=note&mode=search","article":false,"descRaw":"（Dacher Keltner・1962–）：アメリカの心理学者でカリフォルニア大学バークレー校教授。畏敬（Awe）の心理学の開拓者で、自然や芸術、他者の善行に触れる体験が自己を小さくし、つながりの感覚を育むと実証した。『Awe』（2023）でその研究をまとめ、日常の変性意識としての畏敬を広く知らしめた。感情科学の普及にも尽力し、ピクサー映画の監修でも知られる。"},{"name":"ミルチャ・エリアーデ","chapter":"c6-神話と儀礼","sub":0,"subCount":13,"tags":["theory","religion","culture"],"birth":1907,"death":1986,"href":"https://note.com/varelser/n/nc540c918a4cd","article":true,"descRaw":"（1907–1986）：ルーマニア生まれの宗教学者。『シャーマニズム—古代の入神技術』（1951）でシャーマニズムを世界各地に共通する宗教技術として論じ、聖と俗の区別や永遠回帰の思想を展開した。シカゴ大学で宗教学を確立し、変性意識を伴う宗教体験を比較宗教学の中心に据えた。宗教史の比較研究で、聖なるものの普遍的な構造を描き出した。"},{"name":"エミール・デュルケーム","chapter":"c6-神話と儀礼","sub":0,"subCount":13,"tags":["theory","religion","culture"],"birth":1858,"death":1917,"href":"https://note.com/varelser/n/n40af01790a18","article":true,"descRaw":"（1858–1917）：フランスの社会学者。『宗教生活の原初形態』（1912）で、儀礼における「集合的沸騰」—集団の高揚のなかで自己の境界が溶け、聖なるものが生まれる過程—を論じた。宗教を社会の産物と見る視点は、トランスや集団的変性意識を社会学的に理解する出発点となった。社会学の創始者の一人で、宗教を社会的事実として分析した。"},{"name":"ラルフ・ワルド・エマーソン","chapter":"c6-神話と儀礼","sub":0,"subCount":13,"tags":["theory","religion"],"birth":1803,"death":1882,"href":"https://note.com/search?q=from%3A%40varelser%20%E3%83%A9%E3%83%AB%E3%83%95%E3%83%BB%E3%83%AF%E3%83%AB%E3%83%89%E3%83%BB%E3%82%A8%E3%83%9E%E3%83%BC%E3%82%BD%E3%83%B3&context=note&mode=search","article":false,"descRaw":"（1803–1882）：アメリカの思想家・超越主義の中心人物。ハーバード大学を卒業し、牧師を経て講演家・随筆家となった。『自然』（1836）で、自然との交感のなかで自我が消え去る「透明な眼球」の体験を描いた。個の内面に宿る普遍的な精神を説くその思想は、畏敬による自我収縮（スモール・セルフ）の哲学的祖型とされる。ソローら後進の思想家にも大きな影響を与えた。"},{"name":"デヴィッド・ルイス＝ウィリアムズ","chapter":"c6-神話と儀礼","sub":0,"subCount":13,"tags":["science","culture","religion"],"birth":1934,"death":null,"href":"https://note.com/varelser/n/nb84f06c21cc4","article":true,"descRaw":"（David Lewis-Williams・1934–）：南アフリカの考古学者。洞窟壁画を神経心理学的モデルで読み解き、幾何学模様や獣人像をトランス状態の幻視の記録と解釈した。『The Mind in the Cave』（2002）で、変性意識が旧石器時代の芸術と宗教の起源に関わると論じ、サン族の岩絵研究を基盤とした。サン族の岩絵の記録と解釈で、南アフリカ考古学を牽引した。"},{"name":"エリカ・ブルグィニョン","chapter":"c6-神話と儀礼","sub":0,"subCount":13,"tags":["culture","religion","science"],"birth":1924,"death":2015,"href":"https://note.com/search?q=from%3A%40varelser%20%E3%82%A8%E3%83%AA%E3%82%AB%E3%83%BB%E3%83%96%E3%83%AB%E3%82%B0%E3%82%A3%E3%83%8B%E3%83%A7%E3%83%B3&context=note&mode=search","article":false,"descRaw":"（Erika Bourguignon・1924–2015）：アメリカの人類学者。世界各地の社会における恍惚・トランス・憑依を比較し、トランスが文化的に制度化される条件を追究した。編著『Religion, Altered States of Consciousness, and Social Change』（1973）は、変性意識を社会変動と結びつけて論じた文化横断研究の古典となった。"},{"name":"マイケル・ウィンケルマン","chapter":"c6-神話と儀礼","sub":0,"subCount":13,"tags":["science","religion"],"birth":1954,"death":null,"href":"https://note.com/search?q=from%3A%40varelser%20%E3%83%9E%E3%82%A4%E3%82%B1%E3%83%AB%E3%83%BB%E3%82%A6%E3%82%A3%E3%83%B3%E3%82%B1%E3%83%AB%E3%83%9E%E3%83%B3&context=note&mode=search","article":false,"descRaw":"（Michael Winkelman・1954–）：アメリカの人類学者。シャーマニズムを神経心理学の観点から論じ、トランスや幻視が脳の統合的な意識モードと結びつくと説いた。『Shamanism: A Biopsychosocial Paradigm of Consciousness and Healing』（2000）で、シャーマニズムを生物・心理・社会の統合モデルとして体系化した。"},{"name":"ヴィクター・ターナー","chapter":"c6-神話と儀礼","sub":0,"subCount":13,"tags":["theory","culture","religion"],"birth":1920,"death":1983,"href":"https://note.com/search?q=from%3A%40varelser%20%E3%83%B4%E3%82%A3%E3%82%AF%E3%82%BF%E3%83%BC%E3%83%BB%E3%82%BF%E3%83%BC%E3%83%8A%E3%83%BC&context=note&mode=search","article":false,"descRaw":"（Victor Turner・1920–1983）：イギリスの人類学者。ザンビアのンデンブ族の調査から、通過儀礼のなかの境界状態をリミナリティ（境界性）と呼び、日常の構造が解けた状態で生まれる平等な交わりをコミュニタスと論じた。『儀礼の過程』（1969）は、儀礼と変性意識の関係を理解する基礎文献となった。社会劇の概念で、儀礼と演劇のつながりも論じた。"},{"name":"クロード・レヴィ＝ストロース","chapter":"c6-神話と儀礼","sub":0,"subCount":13,"tags":["theory","culture"],"birth":1908,"death":2009,"href":"https://note.com/search?q=from%3A%40varelser%20%E3%82%AF%E3%83%AD%E3%83%BC%E3%83%89%E3%83%BB%E3%83%AC%E3%83%B4%E3%82%A3%EF%BC%9D%E3%82%B9%E3%83%88%E3%83%AD%E3%83%BC%E3%82%B9&context=note&mode=search","article":false,"descRaw":"（Claude Lévi-Strauss・1908–2009）：フランスの人類学者で構造主義の創始者。『野生の思考』（1962）や『神話論理』で、神話や儀礼の背後にある無意識の構造を分析した。1949年の論文「象徴的効果」では、シャーマンの呪文が象徴の操作を通じて身体に働く仕組みを論じ、治療と意味の関係を切り開いた。神話の構造分析は、人類学を超えて広く影響を与えた。"},{"name":"アーノルド・ファン・ヘネップ","chapter":"c6-神話と儀礼","sub":0,"subCount":13,"tags":["theory","culture","religion"],"birth":1873,"death":1957,"href":"https://note.com/search?q=from%3A%40varelser%20%E3%82%A2%E3%83%BC%E3%83%8E%E3%83%AB%E3%83%89%E3%83%BB%E3%83%95%E3%82%A1%E3%83%B3%E3%83%BB%E3%83%98%E3%83%8D%E3%83%83%E3%83%97&context=note&mode=search","article":false,"descRaw":"（Arnold van Gennep・1873–1957）：フランスの民俗学者。『通過儀礼』（1909）で、分離・移行（閾）・統合の三段階モデルを提唱した。境界の時期に人は日常の地位を失い、変容を経て新たな地位へ移るという枠組みは、ターナーのリミナリティ概念の直接の源泉となり、儀礼研究の基本となった。民俗学と人類学の境界を越えて儀礼の普遍構造を示し、今も古典として読み継がれている。"},{"name":"グレゴリー・ベイトソン","chapter":"c6-神話と儀礼","sub":0,"subCount":13,"tags":["theory","science"],"birth":1904,"death":1980,"href":"https://note.com/search?q=from%3A%40varelser%20%E3%82%B0%E3%83%AC%E3%82%B4%E3%83%AA%E3%83%BC%E3%83%BB%E3%83%99%E3%82%A4%E3%83%88%E3%82%BD%E3%83%B3&context=note&mode=search","article":false,"descRaw":"（英-米・1904–1980）：イギリスの人類学者・思想家。二重拘束理論や「精神の生態学」で、意識・コミュニケーション・システムを統合的に論じた。『精神の生態学へ』（1972）や『心と自然』（1979）で、自我の境界を越える認識のあり方を探り、トランスや瞑想を含む意識論に影響を与えた。サイバネティクスや家族療法の発展にも影響を与えた。"},{"name":"ジェームズ・ジョージ・フレイザー","chapter":"c6-神話と儀礼","sub":0,"subCount":13,"tags":["culture","religion"],"birth":1854,"death":1941,"href":"https://note.com/varelser/n/n6255f8e2e95e","article":true,"descRaw":"（英・1854–1941）：イギリスの人類学者。『金枝篇』（1890）で、呪術・宗教・科学の発展段階を比較し、タブーや植物神の殺害、死と再生の儀礼を世界各地の民族誌から集めた。トランスや変身の儀礼を比較する基盤となり、後の神話学・宗教学に大きな影響を与えた。初版は1890年の2巻本で、後に12巻の大著へと成長し、比較宗教学の礎となった。"},{"name":"マルセル・モース","chapter":"c6-神話と儀礼","sub":0,"subCount":13,"tags":["theory","culture","practice"],"birth":1872,"death":1950,"href":"https://note.com/varelser/n/n4197bb90f408","article":true,"descRaw":"（仏・1872–1950）：フランスの社会学者・人類学者。『贈与論』（1925）で贈与を全体社会的事実として論じ、「身体技法」の概念で、歩行や呼吸などの身体の使い方が文化的に習得されることを示した。トランスや瞑想を身体の技術として理解する視点は、変性意識の文化的・技術的側面の研究に不可欠となった。デュルケームの甥で、社会学年報の編集にも携わった。"},{"name":"ジョーゼフ・キャンベル","chapter":"c6-神話と儀礼","sub":0,"subCount":13,"tags":["theory","religion","culture"],"birth":1904,"death":1987,"href":"https://note.com/search?q=from%3A%40varelser%20%E3%82%B8%E3%83%A7%E3%83%BC%E3%82%BC%E3%83%95%E3%83%BB%E3%82%AD%E3%83%A3%E3%83%B3%E3%83%99%E3%83%AB&context=note&mode=search","article":false,"descRaw":"（米・1904–1987）：アメリカの神話学者。『千の顔をもつ英雄』（1949）で、世界各地の神話に共通する「英雄の旅」（モノミス）—出立・試練・帰還の構造を描いた。死と再生や境界の超越を含むその物語構造は、ユングの元型論と神話学を結び、変性意識の旅の比喩としても読まれてきた。スター・ウォーズなど現代の物語にも、その構造は影響を与えた。"},{"name":"エドゥアルド・ヴィヴェイロス・デ・カストロ","chapter":"c6-神話と儀礼","sub":0,"subCount":13,"tags":["theory","culture","religion"],"birth":1951,"death":null,"href":"https://note.com/search?q=from%3A%40varelser%20%E3%82%A8%E3%83%89%E3%82%A5%E3%82%A2%E3%83%AB%E3%83%89%E3%83%BB%E3%83%B4%E3%82%A3%E3%83%B4%E3%82%A7%E3%82%A4%E3%83%AD%E3%82%B9%E3%83%BB%E3%83%87%E3%83%BB%E3%82%AB%E3%82%B9%E3%83%88%E3%83%AD&context=note&mode=search","article":false,"descRaw":"（Eduardo Viveiros de Castro，1951–）：ブラジルの人類学者。アマゾン先住民の宇宙論からペルスペクティヴィズムを提唱し、人間・動物・精霊は視点によって異なる世界を生きると論じた。『食人の形而上学』（2009）などで、シャーマニズムの世界観を理論化した。意識変容そのものの研究者ではないが、変性意識を支える存在論を提示した。アマゾンの先住民運動とも関わり、人類学の脱植民地化を論じた。"},{"name":"フィリップ・デスコラ","chapter":"c6-神話と儀礼","sub":0,"subCount":13,"tags":["theory","culture"],"birth":1949,"death":null,"href":"https://note.com/search?q=from%3A%40varelser%20%E3%83%95%E3%82%A3%E3%83%AA%E3%83%83%E3%83%97%E3%83%BB%E3%83%87%E3%82%B9%E3%82%B3%E3%83%A9&context=note&mode=search","article":false,"descRaw":"（Philippe Descola，1949–）：フランスの人類学者。アマゾンのアチュアル族の調査をもとに、自然と文化の二分法を問い直し、アニミズム・トーテミズム・自然主義・アナロジズムの四つの存在論を提唱した。『自然と文化を越えて』（2005）は、人間と非人間の関係を捉え直す人類学の転換点となった。コレージュ・ド・フランスで人類学を講じ、環境人類学にも影響を与えた。"},{"name":"折口信夫","chapter":"c6-神話と儀礼","sub":1,"subCount":13,"tags":["culture","religion"],"birth":1887,"death":1953,"href":"https://note.com/search?q=from%3A%40varelser%20%E6%8A%98%E5%8F%A3%E4%BF%A1%E5%A4%AB&context=note&mode=search","article":false,"descRaw":"（1887–1953）／（1875–1962）：日本民俗学の双璧。柳田國男（1875–1962）は『遠野物語』（1910）で民間伝承を記録し、「常民」の生活と信仰に日本文化の基層を見た。折口信夫（1887–1953）は国文学と民俗学を結び、「まれびと（訪れる神）」や物忌の思想で古代の祭祀と異界の語りを読み解いた。『死者の書』などの著作で知られる。二人の仕事は、共同体と異界の往還という日本的意識のあり方を学問の対象とした。"},{"name":"柳田國男","chapter":"c6-神話と儀礼","sub":1,"subCount":13,"tags":["culture","religion"],"birth":1875,"death":1962,"href":"https://note.com/search?q=from%3A%40varelser%20%E6%9F%B3%E7%94%B0%E5%9C%8B%E7%94%B7&context=note&mode=search","article":false,"descRaw":"（1887–1953）／（1875–1962）：日本民俗学の双璧。柳田國男（1875–1962）は『遠野物語』（1910）で民間伝承を記録し、「常民」の生活と信仰に日本文化の基層を見た。折口信夫（1887–1953）は国文学と民俗学を結び、「まれびと（訪れる神）」や物忌の思想で古代の祭祀と異界の語りを読み解いた。『死者の書』などの著作で知られる。二人の仕事は、共同体と異界の往還という日本的意識のあり方を学問の対象とした。"},{"name":"南方熊楠","chapter":"c6-神話と儀礼","sub":1,"subCount":13,"tags":["culture","science"],"birth":1867,"death":1941,"href":"https://note.com/search?q=from%3A%40varelser%20%E5%8D%97%E6%96%B9%E7%86%8A%E6%A5%A0&context=note&mode=search","article":false,"descRaw":"（1867–1941）：1867–1941。日本の民俗学者・博物学者。粘菌の研究で知られ、世界各地で採集した標本から新種を多数発見した。民俗・伝承・信仰の記録にも尽力し、連想的・網羅的な知のあり方で知られる。柳田國男らと交流しつつ独自の立場を貫き、『十二支考』などの著作を残した。自然と人間の文化を横断する視点は、民俗学と生態学の先駆として評価される。"},{"name":"岡本太郎","chapter":"c6-神話と儀礼","sub":1,"subCount":13,"tags":["art","culture"],"birth":1911,"death":1996,"href":"https://note.com/varelser/n/n0a1ddc401ae1","article":true,"descRaw":"（1911–1996）：1911–1996。日本の芸術家。パリ留学を経て縄文土器を再評価し、1952年の『縄文土器論』で日本美術の源流に原初的な生命力を見出した。1970年大阪万博の「太陽の塔」で知られ、「芸術は爆発だ」の言葉とともに、既成の美意識を壊す表現を追求した。縄文の再評価は、日本の古代意識と身体性をめぐる議論にも影響を与えた。"},{"name":"中沢新一","chapter":"c6-神話と儀礼","sub":1,"subCount":13,"tags":["culture","theory","religion"],"birth":1950,"death":null,"href":"https://note.com/search?q=from%3A%40varelser%20%E4%B8%AD%E6%B2%A2%E6%96%B0%E4%B8%80&context=note&mode=search","article":false,"descRaw":"（1950–）：1950年生まれ。日本の思想家・人類学者。チベット仏教の研究から出発し、『チベットのモーツァルト』（1983）で知られる。西洋近代の二元論を超える「対称性人類学」を提唱し、宗教・芸術・科学を横断する視点で日本文化を論じた。『アースダイバー』（2005）では東京の地層と神話を重ね、場所と意識の関係を掘り下げた。現代日本思想の代表的論者の一人である。"},{"name":"柳宗悦","chapter":"c6-神話と儀礼","sub":1,"subCount":13,"tags":["art","religion","culture"],"birth":1889,"death":1961,"href":"https://note.com/search?q=from%3A%40varelser%20%E6%9F%B3%E5%AE%97%E6%82%A6&context=note&mode=search","article":false,"descRaw":"（1889–1961）：1889–1961。日本の思想家・美術評論家。民藝運動の提唱者で、1926年頃から日常の工芸品に宿る美を「民藝」として見直す運動を始めた。1936年に日本民藝館を開設した。「無心」の美を説き、作為を超えた作り手の境地に価値を見出した。その思想は、意識のあり方と美の関係を問う日本独自の美学として、工芸・デザイン・思想に広く影響した。"},{"name":"河合隼雄","chapter":"c6-神話と儀礼","sub":1,"subCount":13,"tags":["clinical","theory","culture"],"birth":1928,"death":2007,"href":"https://note.com/search?q=from%3A%40varelser%20%E6%B2%B3%E5%90%88%E9%9A%BC%E9%9B%84&context=note&mode=search","article":false,"descRaw":"（1928–2007）：1928–2007。日本の臨床心理学者。ユング心理学を日本に紹介し、箱庭療法の普及に尽力した。日本文化の心性をユング心理学の枠組みで論じ、臨床と文化心理の接点を開いた。京都大学教授を経て、2002年から2007年まで文化庁長官を務めた。著書『中空構造日本の深層』（1982）などで知られ、日本人の無意識と物語のあり方をめぐる議論に大きな影響を与えた。"},{"name":"西田幾多郎","chapter":"c6-神話と儀礼","sub":1,"subCount":13,"tags":["theory","religion"],"birth":1870,"death":1945,"href":"https://note.com/varelser/n/naa9e96b93f5d","article":true,"descRaw":"（1870–1945）：1870–1945。日本の哲学者で京都学派の祖。主著『善の研究』（1911）で「純粋経験」を提唱し、反省以前の直接的体験を哲学の出発点とした。主客の分化以前の経験に意識の根源を見るその思想は、禅の体験とも響き合う。のちに「場所」の論理を展開し、日本の近代哲学の基盤を築いた。東西哲学の対話における中心人物である。"},{"name":"上田閑照","chapter":"c6-神話と儀礼","sub":1,"subCount":13,"tags":["theory","religion"],"birth":1926,"death":2019,"href":"https://note.com/varelser/n/n0484a554e7d2","article":true,"descRaw":"（1926–2019）：1926–2019。日本の哲学者で京都学派の代表者。京都大学教授を務め、西田幾多郎の哲学を継承し、禅の体験と接続した意識哲学を展開した。「絶対無」と自己の関係を問い、無の場における自己のあり方を論じた。西田哲学の解釈者として、また禅と西洋哲学の対話の担い手として知られ、京都学派の思想を現代に継承した。"},{"name":"井筒俊彦","chapter":"c6-神話と儀礼","sub":1,"subCount":13,"tags":["theory","religion","culture"],"birth":1914,"death":1993,"href":"https://note.com/search?q=from%3A%40varelser%20%E4%BA%95%E7%AD%92%E4%BF%8A%E5%BD%A6&context=note&mode=search","article":false,"descRaw":"（1914–1993）：1914–1993。日本の哲学者・イスラーム学者。主著『意識と本質』（1983）で、イスラーム・禅・道教・ヒンドゥー教・ユダヤ神秘主義を横断する意識の哲学的比較研究を行った。アラビア語をはじめ多数の言語を操り、「意識の深層構造」の解明を試みた。東洋哲学の比較研究における第一人者で、東西の神秘思想を一つの意識論に結ぶ視点は、変性意識研究の思想的基盤の一つとなった。"},{"name":"修験道","chapter":"c6-神話と儀礼","sub":1,"subCount":13,"tags":["practice","religion","culture"],"birth":null,"death":null,"href":"https://note.com/search?q=from%3A%40varelser%20%E4%BF%AE%E9%A8%93%E9%81%93&context=note&mode=search","article":false,"descRaw":"：山岳信仰と密教が習合した日本の実践宗教。役行者を開祖と伝え、山伏が峰入り修行で験力（霊力）を得るとされる。出羽三山などが霊場として知られ、滝行・断食・山中での苦行を通じて心身を変容させる。神道・仏教・道教的要素を融合させた日本独自の修行体系で、自然のなかでの身体的試練による意識変容の伝統を今に伝える。"},{"name":"イタコ","chapter":"c6-神話と儀礼","sub":1,"subCount":13,"tags":["religion","culture","practice"],"birth":null,"death":null,"href":"https://note.com/search?q=from%3A%40varelser%20%E3%82%A4%E3%82%BF%E3%82%B3&context=note&mode=search","article":false,"descRaw":"：東北北部の盲目の女性霊媒師。死者の霊を身に憑依させて言葉を伝える口寄せを業とし、恐山大祭で知られる。修行ののち霊媒としての能力を得るとされ、死者との対話を求める人々の依頼に応えてきた。口寄せでは死者の言葉を伝えるほか、生者の悩みへの助言も行うとされる。日本の民間信仰における憑霊型シャーマニズムの代表例で、近代化のなかでも恐山の祭礼を中心に伝承が続いている。"},{"name":"ユタ","chapter":"c6-神話と儀礼","sub":1,"subCount":13,"tags":["religion","culture","practice"],"birth":null,"death":null,"href":"https://note.com/search?q=from%3A%40varelser%20%E3%83%A6%E3%82%BF&context=note&mode=search","article":false,"descRaw":"：沖縄・奄美の民間霊媒師。多くは女性で、カミダーリィ（巫病）と呼ばれる心身の異変を経て神霊・祖先霊と交信する者となるとされる。ユタになる者は神からの啓示や病を契機とすると伝えられ、託宣と助言を行って地域社会の悩みや判断に関わる。イタコと並ぶ日本の民間霊媒の代表例で、琉球の信仰文化のなかで独自の役割を担い続けている。"},{"name":"神憑り","chapter":"c6-神話と儀礼","sub":1,"subCount":13,"tags":["religion","culture","practice"],"birth":null,"death":null,"href":"https://note.com/search?q=from%3A%40varelser%20%E7%A5%9E%E6%86%91%E3%82%8A&context=note&mode=search","article":false,"descRaw":"：神霊が巫女らの身体に憑依し、託宣を語る状態。古代の巫（かんなぎ）の祭祀の中核で、シャーマニズムの憑霊型の典型とされる。神の言葉を直接伝える媒介として、古代日本の祭祀と政治にも関わった。神楽や祭祀の場でみられる憑依は、神と人との交信の回路として共同体に受け入れられてきた。憑依による意識変容は、託宣・治癒・予言の契機となり、日本の宗教文化の基層をなす現象である。"},{"name":"滝行","chapter":"c6-神話と儀礼","sub":1,"subCount":13,"tags":["practice","religion"],"birth":null,"death":null,"href":"https://note.com/search?q=from%3A%40varelser%20%E6%BB%9D%E8%A1%8C&context=note&mode=search","article":false,"descRaw":"：滝に打たれ経を唱える水行。禊の思想に基づき、修験道・神道・密教にまたがる身心浄化の行法である。冷水の刺激と呼吸・読経の持続が意識変容を伴い、修行者は身心の刷新を図る。滝に打たれる苦行は修験道の峰入り修行や神道の禊祓と結びつき、山岳修行の一環として古くから行われ、現代でも修験道や神道の行場で実践が続けられている。"},{"name":"即身仏","chapter":"c6-神話と儀礼","sub":1,"subCount":13,"tags":["religion","practice","culture"],"birth":null,"death":null,"href":"https://note.com/search?q=from%3A%40varelser%20%E5%8D%B3%E8%BA%AB%E4%BB%8F&context=note&mode=search","article":false,"descRaw":"：厳しい断食・木食行の末にミイラ化した修験者・僧。全国に十数体が確認され、多くは出羽三山周辺に残る。生きたまま仏になることを目指す究極の修行とされ、弥勒信仰と結ぶ。即身仏となった僧は寺院に安置され、信仰の対象として崇敬を集めてきた。死後も腐敗せずに残る身体は、身体の極限的な変容を通じた覚醒の希有な事例である。"},{"name":"巫女","chapter":"c6-神話と儀礼","sub":1,"subCount":13,"tags":["religion","culture"],"birth":null,"death":null,"href":"https://note.com/search?q=from%3A%40varelser%20%E5%B7%AB%E5%A5%B3&context=note&mode=search","article":false,"descRaw":"：神に仕え神託を伝える女性祭祀者。古代は神憑りによる託宣・口寄せ・神楽を担い、神と人との媒介者として祭祀の中核にあった。明治以降は神職の補佐へと役割が変わり、神社での舞や祭祀補助が中心となった。巫女の舞う神楽は、神を楽しませ招く芸能として各地の祭礼に受け継がれている。古代の巫の系譜は、日本のシャーマニズムと神道の接点を示す存在として、宗教史・民俗学で重視される。"},{"name":"憑依","chapter":"c6-神話と儀礼","sub":1,"subCount":13,"tags":["religion","culture"],"birth":null,"death":null,"href":"https://note.com/search?q=from%3A%40varelser%20%E6%86%91%E4%BE%9D&context=note&mode=search","article":false,"descRaw":"：神霊・死霊などが人の心身に乗り移る現象。シャーマニズムの二大類型の一方（脱魂に対する憑霊）で、託宣・治癒の契機となる。憑依した者は別様の声や振る舞いを示し、共同体はそれを神仏や死者の言葉として受け取る。日本のイタコ・ユタ・神憑りをはじめ、世界各地の宗教実践に見られる、意識変容の普遍的な形態の一つである。"},{"name":"神の植物（シュルテス & ホフマン, 1979）","chapter":"c6-神話と儀礼","sub":2,"subCount":13,"tags":["substance","culture"],"birth":null,"death":null,"href":"https://note.com/search?q=from%3A%40varelser%20%E7%A5%9E%E3%81%AE%E6%A4%8D%E7%89%A9%EF%BC%88%E3%82%B7%E3%83%A5%E3%83%AB%E3%83%86%E3%82%B9%20%26%20%E3%83%9B%E3%83%95%E3%83%9E%E3%83%B3%2C%201979%EF%BC%89&context=note&mode=search","article":false,"descRaw":"：民族植物学者リチャード・シュルテスと化学者アルベルト・ホフマンの1979年の共著『Plants of the Gods』。アヤワスカ、ペヨーテ、シロシビン茸など幻覚性植物の利用を、先住民文化の文脈で体系的に記録した民族植物学の百科事典。植物の化学成分と儀礼的使用を結びつけ、エスノボタニーの古典となった。"},{"name":"アヤワスカの幻視（ルナ & アマリンゴ, 1991）","chapter":"c6-神話と儀礼","sub":2,"subCount":13,"tags":["substance","culture","art"],"birth":null,"death":null,"href":"https://note.com/search?q=from%3A%40varelser%20%E3%82%A2%E3%83%A4%E3%83%AF%E3%82%B9%E3%82%AB%E3%81%AE%E5%B9%BB%E8%A6%96%EF%BC%88%E3%83%AB%E3%83%8A%20%26%20%E3%82%A2%E3%83%9E%E3%83%AA%E3%83%B3%E3%82%B4%2C%201991%EF%BC%89&context=note&mode=search","article":false,"descRaw":"：人類学者ルイス・エドゥアルド・ルナとアマゾンの画家パブロ・アマリンゴによる1991年の著書『Ayahuasca Visions』。アマリンゴがアヤワスカの幻視を描いた絵画と、シャーマンの語りを収録した。植物シャーマンの内的世界を視覚的に記録し、エスノボタニーと芸術を統合した民族誌として知られる。アマリンゴ自身も元シャーマンで、幻視の細部を精密に描き出した。"},{"name":"宇宙の蛇（ジェレミー・ナービー, 1998）","chapter":"c6-神話と儀礼","sub":2,"subCount":13,"tags":["substance","culture","theory"],"birth":null,"death":null,"href":"https://note.com/search?q=from%3A%40varelser%20%E5%AE%87%E5%AE%99%E3%81%AE%E8%9B%87%EF%BC%88%E3%82%B8%E3%82%A7%E3%83%AC%E3%83%9F%E3%83%BC%E3%83%BB%E3%83%8A%E3%83%BC%E3%83%93%E3%83%BC%2C%201998%EF%BC%89&context=note&mode=search","article":false,"descRaw":"：カナダの人類学者ジェレミー・ナービーの著書（原著1995年、英訳1998年）。アヤワスカのヴィジョンに現れる蛇とDNAの二重螺旋の形態的相似性に着目し、先住民の植物知識と分子生物学の接点を考察した。アマゾンのシャーマニズムと科学の対話を試みた話題作で、賛否両論を呼んだ。原著は1995年にフランス語で刊行され、世界的なベストセラーとなった。"},{"name":"キノコとソーマ仮説（ワッソン, 1968）","chapter":"c6-神話と儀礼","sub":2,"subCount":13,"tags":["substance","religion","culture"],"birth":null,"death":null,"href":"https://note.com/search?q=from%3A%40varelser%20%E3%82%AD%E3%83%8E%E3%82%B3%E3%81%A8%E3%82%BD%E3%83%BC%E3%83%9E%E4%BB%AE%E8%AA%AC%EF%BC%88%E3%83%AF%E3%83%83%E3%82%BD%E3%83%B3%2C%201968%EF%BC%89&context=note&mode=search","article":false,"descRaw":"：R・ゴードン・ワッソンによる1968年の著書『Soma: Divine Mushroom of Immortality』。リグ・ヴェーダの神酒ソーマがベニテングタケ（Amanita muscaria）であるという民族菌類学的仮説を提示した。古代インドの祭祀とキノコの幻覚作用を結びつけ、宗教の起源における向精神植物の役割を論じた。学界では議論が続いている。"},{"name":"聖なるキノコの探求（ワッソン & ワッソン, 1957）","chapter":"c6-神話と儀礼","sub":2,"subCount":13,"tags":["substance","religion","culture"],"birth":null,"death":null,"href":"https://note.com/search?q=from%3A%40varelser%20%E8%81%96%E3%81%AA%E3%82%8B%E3%82%AD%E3%83%8E%E3%82%B3%E3%81%AE%E6%8E%A2%E6%B1%82%EF%BC%88%E3%83%AF%E3%83%83%E3%82%BD%E3%83%B3%20%26%20%E3%83%AF%E3%83%83%E3%82%BD%E3%83%B3%2C%201957%EF%BC%89&context=note&mode=search","article":false,"descRaw":"：R・ゴードン・ワッソン夫妻による1957年の報告。メキシコ・オアハカ州のマサテコ族の治療師マリア・サビーナによるシロシビン茸の儀礼に、ワッソンが西洋人として初めて参加した。同年『ライフ』誌に「Seeking the Magic Mushroom」を発表し、幻覚茸を世界に紹介した。サイケデリック文化の起点となった記録である。"},{"name":"エレウシスの道（ワッソン, ホフマン, ラック, 1978）","chapter":"c6-神話と儀礼","sub":2,"subCount":13,"tags":["substance","religion","culture"],"birth":null,"death":null,"href":"https://note.com/search?q=from%3A%40varelser%20%E3%82%A8%E3%83%AC%E3%82%A6%E3%82%B7%E3%82%B9%E3%81%AE%E9%81%93%EF%BC%88%E3%83%AF%E3%83%83%E3%82%BD%E3%83%B3%2C%20%E3%83%9B%E3%83%95%E3%83%9E%E3%83%B3%2C%20%E3%83%A9%E3%83%83%E3%82%AF%2C%201978%EF%BC%89&context=note&mode=search","article":false,"descRaw":"：ワッソン、ホフマン、カール・ラックによる1978年の共著『The Road to Eleusis』。古代ギリシアのエレウシスの秘儀で飲まれたキュケオンに、麦角菌由来の幻覚物質が含まれていたという仮説を提示した。古代の宗教儀礼と向精神物質の関係を論じ、古典学と民族薬理学を結ぶ話題作となった。古代の秘儀参加者が体験した幻視の報告とも符合すると論じた。"},{"name":"PiHKAL / TiHKAL（シュルギン夫妻, 1991/1997）","chapter":"c6-神話と儀礼","sub":2,"subCount":13,"tags":["substance","science"],"birth":null,"death":null,"href":"https://note.com/search?q=from%3A%40varelser%20PiHKAL%20/%20TiHKAL%EF%BC%88%E3%82%B7%E3%83%A5%E3%83%AB%E3%82%AE%E3%83%B3%E5%A4%AB%E5%A6%BB%2C%201991/1997%EF%BC%89&context=note&mode=search","article":false,"descRaw":"：化学者アレクサンダー・シュルギン夫妻による著作。『PiHKAL』（1991年）と『TiHKAL』（1997年）で、数百種のフェネチルアミン・トリプタミン系化合物の合成法と自己実験の記録を公開した。MDMAの再発見でも知られるシュルギンの仕事は、精神薬理学の異端的な百科事典として、研究者と愛好家の双方に影響を与えた。"},{"name":"アンティポデス・オブ・ザ・マインド（ベニー・シャノン, 2002）","chapter":"c6-神話と儀礼","sub":2,"subCount":13,"tags":["substance","theory","science"],"birth":null,"death":null,"href":"https://note.com/search?q=from%3A%40varelser%20%E3%82%A2%E3%83%B3%E3%83%86%E3%82%A3%E3%83%9D%E3%83%87%E3%82%B9%E3%83%BB%E3%82%AA%E3%83%96%E3%83%BB%E3%82%B6%E3%83%BB%E3%83%9E%E3%82%A4%E3%83%B3%E3%83%89%EF%BC%88%E3%83%99%E3%83%8B%E3%83%BC%E3%83%BB%E3%82%B7%E3%83%A3%E3%83%8E%E3%83%B3%2C%202002%EF%BC%89&context=note&mode=search","article":false,"descRaw":"：イスラエルの認知心理学者ベニー・シャノンによる2002年の大著。自身のアヤワスカ体験を含む多数の事例をもとに、幻覚の内容と構造を現象学的に分類・分析した。アヤワスカ体験の認知心理学的分析として、ヴィジョンの類型や時間・空間感覚の変容を体系化した。幻覚の持続時間や色彩・幾何学模様の特徴も詳細に記録している。著者はヘブライ大学の認知科学者で、自らの体験も分析対象とした。"},{"name":"身体化された心（ヴァレラ, トンプソン, ロッシュ, 1991）","chapter":"c6-神話と儀礼","sub":2,"subCount":13,"tags":["theory","practice","science"],"birth":null,"death":null,"href":"https://note.com/search?q=from%3A%40varelser%20%E8%BA%AB%E4%BD%93%E5%8C%96%E3%81%95%E3%82%8C%E3%81%9F%E5%BF%83%EF%BC%88%E3%83%B4%E3%82%A1%E3%83%AC%E3%83%A9%2C%20%E3%83%88%E3%83%B3%E3%83%97%E3%82%BD%E3%83%B3%2C%20%E3%83%AD%E3%83%83%E3%82%B7%E3%83%A5%2C%201991%EF%BC%89&context=note&mode=search","article":false,"descRaw":"：フランシスコ・ヴァレラ、エヴァン・トンプソン、エレノア・ロッシュによる1991年の著書『The Embodied Mind』。認知科学と仏教瞑想の対話を通じて、心を脳内の表象ではなく身体と環境との相互作用（エナクション）として捉えるエナクティヴ・アプローチを提唱した。意識の身体的基盤を探る試みで、4E認知の源流となった。"},{"name":"リミナリティとコミュニタス（ヴィクター・ターナー, 1969）","chapter":"c6-神話と儀礼","sub":3,"subCount":13,"tags":["theory","culture","religion"],"birth":null,"death":null,"href":"https://note.com/search?q=from%3A%40varelser%20%E3%83%AA%E3%83%9F%E3%83%8A%E3%83%AA%E3%83%86%E3%82%A3%E3%81%A8%E3%82%B3%E3%83%9F%E3%83%A5%E3%83%8B%E3%82%BF%E3%82%B9%EF%BC%88%E3%83%B4%E3%82%A3%E3%82%AF%E3%82%BF%E3%83%BC%E3%83%BB%E3%82%BF%E3%83%BC%E3%83%8A%E3%83%BC%2C%201969%EF%BC%89&context=note&mode=search","article":false,"descRaw":"：ヴィクター・ターナーが1969年の著書『The Ritual Process』で展開した理論。ファン・ヘネップの通過儀礼論を受け、儀礼の中間段階である「リミナル（閾）」状態では、社会的地位や役割が剥ぎ取られ、構造を超えた平等な結合「コミュニタス」が生まれるとした。ザンビアのンデンブ族でのフィールドワークに基づく。変性意識は、この閾の状態における自己と社会の再編として理解でき、集団的な変性意識の人類学的基盤となる。"},{"name":"集団恍惚研究（デュルケーム「集合的沸騰」）","chapter":"c6-神話と儀礼","sub":3,"subCount":13,"tags":["religion","culture","theory"],"birth":null,"death":null,"href":"https://note.com/search?q=from%3A%40varelser%20%E9%9B%86%E5%9B%A3%E6%81%8D%E6%83%9A%E7%A0%94%E7%A9%B6%EF%BC%88%E3%83%87%E3%83%A5%E3%83%AB%E3%82%B1%E3%83%BC%E3%83%A0%E3%80%8C%E9%9B%86%E5%90%88%E7%9A%84%E6%B2%B8%E9%A8%B0%E3%80%8D%EF%BC%89&context=note&mode=search","article":false,"descRaw":"：エミール・デュルケームが1912年の『宗教生活の原初形態』で論じた「集合的沸騰（effervescence collective）」。儀礼や祝祭で人々が集まり、歌い踊るうちに高揚が集団全体に広がり、個人を超えた力が感じられる状態を指す。デュルケームはこれを宗教と社会結合の起源とみなした。現代では火渡り儀礼での心拍同期（コンヴァリンカら、2011）など、集団的高揚の生理学的測定も行われ、共同的な変性意識の社会学的出発点である。"},{"name":"集団同期研究（マクニール, ウィルターマスら）","chapter":"c6-神話と儀礼","sub":3,"subCount":13,"tags":["science","culture"],"birth":null,"death":null,"href":"https://note.com/search?q=from%3A%40varelser%20%E9%9B%86%E5%9B%A3%E5%90%8C%E6%9C%9F%E7%A0%94%E7%A9%B6%EF%BC%88%E3%83%9E%E3%82%AF%E3%83%8B%E3%83%BC%E3%83%AB%2C%20%E3%82%A6%E3%82%A3%E3%83%AB%E3%82%BF%E3%83%BC%E3%83%9E%E3%82%B9%E3%82%89%EF%BC%89&context=note&mode=search","article":false,"descRaw":"：リズミカルな集団行動（行進・歌唱・ダンス）が協力と一体感を促進するメカニズム。ウィリアム・マクニールは『Keeping Together in Time』（1995）で、集団の同期運動が歴史的に共同体を結んできたと論じた。ウィルターマスとヒース（2009）の実験では、同期して動いた参加者はその後の協力行動が増えた。神経科学的には、同期がオキシトシンや報酬系を介して親社会的行動を高めるとされ、儀礼・軍隊・スポーツにおける集団意識の基盤を説明する。"},{"name":"文化進化理論と変性意識の適応的機能","chapter":"c6-神話と儀礼","sub":3,"subCount":13,"tags":["theory","culture","science"],"birth":null,"death":null,"href":"https://note.com/search?q=from%3A%40varelser%20%E6%96%87%E5%8C%96%E9%80%B2%E5%8C%96%E7%90%86%E8%AB%96%E3%81%A8%E5%A4%89%E6%80%A7%E6%84%8F%E8%AD%98%E3%81%AE%E9%81%A9%E5%BF%9C%E7%9A%84%E6%A9%9F%E8%83%BD&context=note&mode=search","article":false,"descRaw":"：変性意識体験が社会的結合・創造性・治癒を促進する文化進化的適応として機能するという仮説。ボイドとリチャーソンの二重継承理論にならい、瞑想技法・儀礼形式・サイケデリック文化などが、集団の適応度を高める文化的形質として選択・伝播したと考える。シャーマニズムの治療的機能や、集団儀礼の結束効果がその例とされる。変性意識を個人の脳現象だけでなく、文化の進化のなかで維持されてきた実践として捉える視点である。"},{"name":"社会構築主義と変性意識の文化的解釈","chapter":"c6-神話と儀礼","sub":3,"subCount":13,"tags":["theory","culture"],"birth":null,"death":null,"href":"https://note.com/search?q=from%3A%40varelser%20%E7%A4%BE%E4%BC%9A%E6%A7%8B%E7%AF%89%E4%B8%BB%E7%BE%A9%E3%81%A8%E5%A4%89%E6%80%A7%E6%84%8F%E8%AD%98%E3%81%AE%E6%96%87%E5%8C%96%E7%9A%84%E8%A7%A3%E9%87%88&context=note&mode=search","article":false,"descRaw":"：変性意識体験の意味や内容は、文化的文脈や言語、社会制度によって形づくられるという立場。ピーター・バーガーとトーマス・ルックマンの『現実の社会的構成』（1966）に起源をもち、体験の「生の感覚」は普遍でも、解釈は文化に依存すると考える。神秘体験の普遍構造を主張する立場との論争の軸となり、同じ薬理作用でも文化によって体験が異なることを説明する。変性意識研究における普遍主義と構築主義の対立の基盤である。"},{"name":"セット＆セッティング理論（ティモシー・リアリー）","chapter":"c6-神話と儀礼","sub":3,"subCount":13,"tags":["theory","substance"],"birth":null,"death":null,"href":"https://note.com/search?q=from%3A%40varelser%20%E3%82%BB%E3%83%83%E3%83%88%EF%BC%86%E3%82%BB%E3%83%83%E3%83%86%E3%82%A3%E3%83%B3%E3%82%B0%E7%90%86%E8%AB%96%EF%BC%88%E3%83%86%E3%82%A3%E3%83%A2%E3%82%B7%E3%83%BC%E3%83%BB%E3%83%AA%E3%82%A2%E3%83%AA%E3%83%BC%EF%BC%89&context=note&mode=search","article":false,"descRaw":"：ティモシー・リアリーが1960年代に提唱し、ノーマン・ジンバーグが1984年の著書『Drug, Set, and Setting』で体系化した理論。変性意識体験の質は、薬物そのものよりも、個人の心的状態（セット：期待・気分・性格）と環境的文脈（セッティング：場所・同席者・文化）によって決まるとする。臨床試験ではセットとセッティングの管理が安全性と効果を左右し、現代のサイケデリック補助療法のプロトコル設計の基本原則となっている。"},{"name":"カリスマと服従の社会心理学（ウェーバー／ミルグラム）","chapter":"c6-神話と儀礼","sub":3,"subCount":13,"tags":["theory","science"],"birth":null,"death":null,"href":"https://note.com/search?q=from%3A%40varelser%20%E3%82%AB%E3%83%AA%E3%82%B9%E3%83%9E%E3%81%A8%E6%9C%8D%E5%BE%93%E3%81%AE%E7%A4%BE%E4%BC%9A%E5%BF%83%E7%90%86%E5%AD%A6%EF%BC%88%E3%82%A6%E3%82%A7%E3%83%BC%E3%83%90%E3%83%BC%EF%BC%8F%E3%83%9F%E3%83%AB%E3%82%B0%E3%83%A9%E3%83%A0%EF%BC%89&context=note&mode=search","article":false,"descRaw":"：マックス・ウェーバーのカリスマ的支配論と、スタンリー・ミルグラムの服従実験（1963）を結ぶ社会心理学。ウェーバーはカリスマを、非日常的な資質への帰依に基づく支配の型とした。ミルグラムの実験では、権威者の指示で被験者の約65%が最大電圧まで通電を続けた。カリスマ的指導者や閉鎖的集団のもとで変性意識が誘発・維持される社会的条件や、集団催眠・宗教体験の権力構造を分析する視点を与える。"},{"name":"フーコーの権力論と意識の統治（フーコー）","chapter":"c6-神話と儀礼","sub":3,"subCount":13,"tags":["theory","culture"],"birth":null,"death":null,"href":"https://note.com/search?q=from%3A%40varelser%20%E3%83%95%E3%83%BC%E3%82%B3%E3%83%BC%E3%81%AE%E6%A8%A9%E5%8A%9B%E8%AB%96%E3%81%A8%E6%84%8F%E8%AD%98%E3%81%AE%E7%B5%B1%E6%B2%BB%EF%BC%88%E3%83%95%E3%83%BC%E3%82%B3%E3%83%BC%EF%BC%89&context=note&mode=search","article":false,"descRaw":"：ミシェル・フーコーの権力分析を意識研究に応用する立場。『監獄の誕生』（1975）で論じた規律権力や、『性の歴史』で展開した生権力、「統治性」の概念から、「正常な意識」と「異常な体験」を分ける境界そのものが権力装置の産物だとみる。変性意識の病理化・犯罪化・医療化の歴史を系譜学的にたどり、誰がどの意識状態を正統とし、どれを排除するのかを問う。意識の政治性を照らし出す視点である。"},{"name":"ブルデューの文化理論と身体化（ブルデュー）","chapter":"c6-神話と儀礼","sub":3,"subCount":13,"tags":["theory","culture"],"birth":null,"death":null,"href":"https://note.com/search?q=from%3A%40varelser%20%E3%83%96%E3%83%AB%E3%83%87%E3%83%A5%E3%83%BC%E3%81%AE%E6%96%87%E5%8C%96%E7%90%86%E8%AB%96%E3%81%A8%E8%BA%AB%E4%BD%93%E5%8C%96%EF%BC%88%E3%83%96%E3%83%AB%E3%83%87%E3%83%A5%E3%83%BC%EF%BC%89&context=note&mode=search","article":false,"descRaw":"：ピエール・ブルデューのハビトゥス・文化資本・界（フィールド）の理論。身体に沈殿した性向の体系であるハビトゥスが、知覚・判断・実践を規定すると考える。『ディスタンクシオン』（1979）で示されたように、芸術や儀礼の体験の仕方も、階級や教育による文化資本に左右される。変性意識の実践（瞑想・サイケデリック・儀礼）が誰に開かれ、どう解釈されるかは、社会的位置づけに規定されるという視点を与える。"},{"name":"ミーム理論と変性意識の文化的伝播（ドーキンス／デネット）","chapter":"c6-神話と儀礼","sub":3,"subCount":13,"tags":["theory","culture"],"birth":null,"death":null,"href":"https://note.com/search?q=from%3A%40varelser%20%E3%83%9F%E3%83%BC%E3%83%A0%E7%90%86%E8%AB%96%E3%81%A8%E5%A4%89%E6%80%A7%E6%84%8F%E8%AD%98%E3%81%AE%E6%96%87%E5%8C%96%E7%9A%84%E4%BC%9D%E6%92%AD%EF%BC%88%E3%83%89%E3%83%BC%E3%82%AD%E3%83%B3%E3%82%B9%EF%BC%8F%E3%83%87%E3%83%8D%E3%83%83%E3%83%88%EF%BC%89&context=note&mode=search","article":false,"descRaw":"：リチャード・ドーキンスが1976年の『利己的な遺伝子』で提唱した、文化の複製子としてのミームの概念。ダニエル・デネットらが展開し、瞑想技法・儀礼形式・サイケデリック文化などの文化的情報単位が、模倣を通じて複製・変異・選択されると考える。変性意識の実践や解釈の枠組みが、世代や集団を越えて伝播するメカニズムを、遺伝子の進化になぞらえて説明する。文化進化理論と接続する視点である。"},{"name":"構造主義とポスト構造主義（レヴィ＝ストロース／デリダ）","chapter":"c6-神話と儀礼","sub":3,"subCount":13,"tags":["theory","culture"],"birth":null,"death":null,"href":"https://note.com/search?q=from%3A%40varelser%20%E6%A7%8B%E9%80%A0%E4%B8%BB%E7%BE%A9%E3%81%A8%E3%83%9D%E3%82%B9%E3%83%88%E6%A7%8B%E9%80%A0%E4%B8%BB%E7%BE%A9%EF%BC%88%E3%83%AC%E3%83%B4%E3%82%A3%EF%BC%9D%E3%82%B9%E3%83%88%E3%83%AD%E3%83%BC%E3%82%B9%EF%BC%8F%E3%83%87%E3%83%AA%E3%83%80%EF%BC%89&context=note&mode=search","article":false,"descRaw":"：クロード・レヴィ＝ストロースの構造主義と、ジャック・デリダらのポスト構造主義。レヴィ＝ストロースは『野生の思考』（1962）で、神話や儀礼の背後にある普遍的な深層構造を分析した。デリダは『グラマトロジーについて』（1967）などで、構造の中心や二項対立を脱構築し、意味の固定を問い直した。変性意識体験の構造分析と、その分析自体の限界を示す二つの立場として、神話・儀礼研究の理論的背景をなす。"},{"name":"社会劇理論（ターナー）","chapter":"c6-神話と儀礼","sub":3,"subCount":13,"tags":["theory","culture","religion"],"birth":null,"death":null,"href":"https://note.com/search?q=from%3A%40varelser%20%E7%A4%BE%E4%BC%9A%E5%8A%87%E7%90%86%E8%AB%96%EF%BC%88%E3%82%BF%E3%83%BC%E3%83%8A%E3%83%BC%EF%BC%89&context=note&mode=search","article":false,"descRaw":"：ヴィクター・ターナーが1974年の『Dramas, Fields, and Metaphors』で展開した、社会的葛藤の過程の理論。違反（breach）→危機（crisis）→修復的行動（redressive action）→再統合または分裂という四段階で社会過程を記述する。修復の段階で儀礼や演劇が果たす役割が大きく、変性意識を伴う儀礼は、共同体の亀裂を修復し、秩序を再編する機能をもつ。リミナリティ論と並ぶターナーの社会理論である。"},{"name":"神秘体験質問票（MEQ30）（バレット, ジョンソンら）","chapter":"c6-神話と儀礼","sub":4,"subCount":13,"tags":["religion","science"],"birth":null,"death":null,"href":"https://note.com/varelser/n/na3e3a20e673e","article":true,"descRaw":"：ジョンズ・ホプキンス大学のフレデリック・バレットらが2015年に検証した神秘体験の標準尺度。パーンケの質問票を起源とし、30項目・4因子（神秘性、肯定的気分、時空の超越、言語化困難性）で構成される。シロシビン研究で広く用いられ、「完全な神秘体験」の判定基準（各因子60%以上）も定めた。サイケデリック研究における神秘体験の定量化を可能にした。 出典：Barrett et al. (2015)『Journal of Psychopharmacology』 DOI: 10.1177/0269881115609019"},{"name":"パーンケの神秘意識尺度","chapter":"c6-神話と儀礼","sub":4,"subCount":13,"tags":["religion","science"],"birth":null,"death":null,"href":"https://note.com/varelser/n/n0285df0c40cc","article":true,"descRaw":"：ウォルター・パーンケが1962年のグッド・フライデー実験のために整備した神秘体験の評価基準。ステイスの類型論をもとに、一体感、時空の超越、聖なる感覚、ヌーメナスの質、言い表しがたさなど9カテゴリーを設定した。実験的に神秘体験を測定する初の体系的枠組みで、後のMEQ（神秘体験質問票）の原型となり、宗教心理学の基盤を築いた。"},{"name":"フッドの神秘主義尺度（フッド, 1975）","chapter":"c6-神話と儀礼","sub":4,"subCount":13,"tags":["religion","science"],"birth":null,"death":null,"href":"https://note.com/search?q=from%3A%40varelser%20%E3%83%95%E3%83%83%E3%83%89%E3%81%AE%E7%A5%9E%E7%A7%98%E4%B8%BB%E7%BE%A9%E5%B0%BA%E5%BA%A6%EF%BC%88%E3%83%95%E3%83%83%E3%83%89%2C%201975%EF%BC%89&context=note&mode=search","article":false,"descRaw":"：心理学者ラルフ・フッドが1975年に開発した神秘体験の心理測定ツール。ステイスの神秘主義類型論（内向型・外向型）を操作化し、32項目で神秘体験の傾向を定量的に評価する。宗教心理学で最も広く用いられる尺度の一つで、文化横断的な神秘体験の比較研究や、瞑想・祈りの効果測定にも応用されている。日本を含む多国で翻訳・使用され、神秘体験の個人差研究の基礎となった。 出典：Hood (1975)『Journal for the Scientific Study of Religion』 DOI: 10.2307/1384454"},{"name":"神経神学（ニューバーグ & ダキリ, 2001）","chapter":"c6-神話と儀礼","sub":4,"subCount":13,"tags":["religion","science"],"birth":null,"death":null,"href":"https://note.com/varelser/n/nb3c7a742748b","article":true,"descRaw":"：アンドリュー・ニューバーグとユージン・ダキリによる宗教体験の脳科学。2001年の著書『Why God Won't Go Away』で、瞑想・祈り中の脳活動をSPECTで測定し、頭頂葉の活動低下と一体感の関連などを示した。宗教体験の神経基盤を画像化する分野の創始として、神経神学（ニューロセオロジー）の名を広めた。"},{"name":"側頭葉てんかんと宗教体験（ペルシンガー）","chapter":"c6-神話と儀礼","sub":4,"subCount":13,"tags":["religion","science"],"birth":null,"death":null,"href":"https://note.com/varelser/n/n0541228f44f4","article":true,"descRaw":"：カナダの神経科学者マイケル・ペルシンガーによる、側頭葉刺激と宗教体験の研究。1980年代から、側頭葉の電磁刺激（「ゴッド・ヘルメット」）で神の存在感や神秘的体験が誘発されると報告し、宗教体験の神経学的解釈を提唱した。側頭葉てんかん患者に宗教的関心の高まりが見られることとも関連づけられ、議論を呼んだ。"},{"name":"宗教と進化心理学（ボイヤー, 2001）","chapter":"c6-神話と儀礼","sub":4,"subCount":13,"tags":["religion","theory"],"birth":null,"death":null,"href":"https://note.com/search?q=from%3A%40varelser%20%E5%AE%97%E6%95%99%E3%81%A8%E9%80%B2%E5%8C%96%E5%BF%83%E7%90%86%E5%AD%A6%EF%BC%88%E3%83%9C%E3%82%A4%E3%83%A4%E3%83%BC%2C%202001%EF%BC%89&context=note&mode=search","article":false,"descRaw":"：認知人類学者パスカル・ボイヤーの2001年の著書『Religion Explained』。宗教的認知を進化の適応そのものではなく、行為者検出や直観的存在論などの認知システムの副産物として説明した。神や精霊の概念が人間の心の働きから自然に生じると論じ、宗教の認知科学の基盤を築いた。カメルーンのファン族でのフィールドワークにも基づく。"},{"name":"テロスとアクシス・ムンディ（エリアーデ）","chapter":"c6-神話と儀礼","sub":4,"subCount":13,"tags":["religion","culture"],"birth":null,"death":null,"href":"https://note.com/search?q=from%3A%40varelser%20%E3%83%86%E3%83%AD%E3%82%B9%E3%81%A8%E3%82%A2%E3%82%AF%E3%82%B7%E3%82%B9%E3%83%BB%E3%83%A0%E3%83%B3%E3%83%87%E3%82%A3%EF%BC%88%E3%82%A8%E3%83%AA%E3%82%A2%E3%83%BC%E3%83%87%EF%BC%89&context=note&mode=search","article":false,"descRaw":"：ルーマニア出身の宗教学者ミルチャ・エリアーデ（1907〜1986）の宗教現象学。1951年の著書『シャーマニズム—古来のエクスタシーの技法』で、シャーマンのエクスタシーを文化横断的に比較分析した。聖なる中心（アクシス・ムンディ）や聖なる時間の概念を提示し、宗教体験を普遍的な人間現象として捉えた。宗教人類学の古典である。"},{"name":"儀礼と神経生理学（ダキリ & ニューバーグ, 1999）","chapter":"c6-神話と儀礼","sub":4,"subCount":13,"tags":["practice","science","religion"],"birth":null,"death":null,"href":"https://note.com/varelser/n/n8a4f407662b8","article":true,"descRaw":"：ユージン・ダキリとアンドリュー・ニューバーグによる1999年の著書『The Mystical Mind』。リズム的な儀礼行為（詠唱・舞踊・祈り）が自律神経系を介して変性意識状態を誘発するメカニズムを理論化した。交感神経と副交感神経の相互作用が一体感や超越体験を生むとし、儀礼の神経生理学的モデルを提示した。"},{"name":"パスカル・ボイヤー","chapter":"c6-神話と儀礼","sub":4,"subCount":13,"tags":["science","religion","theory"],"birth":null,"death":null,"href":"https://note.com/search?q=from%3A%40varelser%20%E3%83%91%E3%82%B9%E3%82%AB%E3%83%AB%E3%83%BB%E3%83%9C%E3%82%A4%E3%83%A4%E3%83%BC&context=note&mode=search","article":false,"descRaw":"（仏）：仏米の認知人類学者パスカル・ボイヤー。2001年の著書『Religion Explained』で、宗教を進化の適応ではなく、行為者検出や直観的存在論といった認知システムの副産物として説明した。カメルーンのファン族でのフィールドワークに基づき、神や精霊の概念が人間の心の働きから自然に生じると論じた。宗教の認知科学の中心人物である。"},{"name":"マルシリオ・フィチーノ","chapter":"c6-神話と儀礼","sub":5,"subCount":13,"tags":["religion","theory","practice"],"birth":1433,"death":1499,"href":"https://note.com/search?q=from%3A%40varelser%20%E3%83%9E%E3%83%AB%E3%82%B7%E3%83%AA%E3%82%AA%E3%83%BB%E3%83%95%E3%82%A3%E3%83%81%E3%83%BC%E3%83%8E&context=note&mode=search","article":false,"descRaw":"（伊・1433–1499）：1433–1499。ルネサンス期フィレンツェのプラトン主義者。プラトン全集をラテン語に翻訳し、主著『プラトン神学』で新プラトン主義をキリスト教世界に蘇らせた。『生命について』（1489）ではヘルメス文書・音楽・占星術的対応を結びつけ、音楽・祈り・想像力で魂を高め宇宙と共鳴させる理論を整えた。近代以前の西洋における意識技法の重要な起点である。"},{"name":"ジョルダーノ・ブルーノ","chapter":"c6-神話と儀礼","sub":5,"subCount":13,"tags":["theory","religion","practice"],"birth":1548,"death":1600,"href":"https://note.com/search?q=from%3A%40varelser%20%E3%82%B8%E3%83%A7%E3%83%AB%E3%83%80%E3%83%BC%E3%83%8E%E3%83%BB%E3%83%96%E3%83%AB%E3%83%BC%E3%83%8E&context=note&mode=search","article":false,"descRaw":"（伊・1548–1600）：1548–1600。イタリアの哲学者・記憶術家。無限の宇宙に無数の世界があると説き、記憶術・イメージ操作・魔術理論を結びつけて想像力を宇宙的認識の器官とした。主著『影の観念』と『英雄的狂気について』。集中と象徴配置による意識変容を記憶術と魔術の交点で高度化した。異端とされて1600年にローマで火刑に処された。"},{"name":"パラケルスス","chapter":"c6-神話と儀礼","sub":5,"subCount":13,"tags":["religion","science","clinical"],"birth":1493,"death":1541,"href":"https://note.com/search?q=from%3A%40varelser%20%E3%83%91%E3%83%A9%E3%82%B1%E3%83%AB%E3%82%B9%E3%82%B9&context=note&mode=search","article":false,"descRaw":"（スイス・1493–1541）：1493–1541。スイス出身の医師・錬金術師・自然哲学者。本名テオフラストゥス・フォン・ホーエンハイム。化学的医療（イアトロケミストリー）を開拓し、小宇宙と大宇宙の対応論を展開した。主著『Paragranum』『Astronomia Magna』。夢・幻視・霊的自然観を医学と結びつけ、身体の変容と意識の変容を連続的に理解する近代初期の基盤を作った。"},{"name":"エリファス・レヴィ","chapter":"c6-神話と儀礼","sub":5,"subCount":13,"tags":["religion","practice"],"birth":1810,"death":1875,"href":"https://note.com/search?q=from%3A%40varelser%20%E3%82%A8%E3%83%AA%E3%83%95%E3%82%A1%E3%82%B9%E3%83%BB%E3%83%AC%E3%83%B4%E3%82%A3&context=note&mode=search","article":false,"descRaw":"（仏・1810–1875）：1810–1875。フランスの魔術思想家。本名アルフォンス・ルイ・コンスタン。主著『高等魔術の教理と祭儀』（1854–56）でカバラ・タロット・儀礼魔術を近代的言語で再編し、19世紀オカルティズムの標準的図式を整えた。象徴操作・儀礼・集中・意志を通じた意識変容を秘教実践の技法として整理し、後の黄金の夜明け団をはじめとする近代西洋魔術の源流となった。"},{"name":"パピュス","chapter":"c6-神話と儀礼","sub":5,"subCount":13,"tags":["religion","practice"],"birth":1865,"death":1916,"href":"https://note.com/search?q=from%3A%40varelser%20%E3%83%91%E3%83%94%E3%83%A5%E3%82%B9&context=note&mode=search","article":false,"descRaw":"（Papus / Gérard Encausse・1865–1916・仏）：1865–1916。フランスの医師・オカルティスト。本名ジェラール・アンコース。マルティニズムの組織化と普及に尽力し、カバラと儀礼魔術を実践共同体のなかで再現可能な形式へ整備した。主著『Traité méthodique de science occulte』（1891）。タロットの体系化にも関わり、19世紀末から20世紀初頭のパリ・オカルティズムの中心人物として、儀礼・象徴・意識階梯の知識を広めた。"},{"name":"ディオン・フォーチュン","chapter":"c6-神話と儀礼","sub":5,"subCount":13,"tags":["religion","practice","theory"],"birth":1890,"death":1946,"href":"https://note.com/search?q=from%3A%40varelser%20%E3%83%87%E3%82%A3%E3%82%AA%E3%83%B3%E3%83%BB%E3%83%95%E3%82%A9%E3%83%BC%E3%83%81%E3%83%A5%E3%83%B3&context=note&mode=search","article":false,"descRaw":"（英・1890–1946）：1890–1946。イギリスのオカルティスト・作家。本名ヴァイオレット・メアリー・ファース。黄金の夜明け団以後の実践を継承し、1922年に内的光のフラタニティを設立した。主著『The Mystical Qabalah』（1935）と『Psychic Self-Defense』（1930）。想像力・象徴・霊的感受性を心理学的語彙で語り、儀礼実践と深層心理の橋渡しを行った。"},{"name":"オースティン・オスマン・スパー","chapter":"c6-神話と儀礼","sub":5,"subCount":13,"tags":["religion","art","practice"],"birth":1886,"death":1956,"href":"https://note.com/search?q=from%3A%40varelser%20%E3%82%AA%E3%83%BC%E3%82%B9%E3%83%86%E3%82%A3%E3%83%B3%E3%83%BB%E3%82%AA%E3%82%B9%E3%83%9E%E3%83%B3%E3%83%BB%E3%82%B9%E3%83%91%E3%83%BC&context=note&mode=search","article":false,"descRaw":"（英・1886–1956）：1886–1956。イギリスの画家・魔術実践者。主著『The Book of Pleasure』（1913）でシジル魔術を提示した。欲望を象徴（シジル）に凝縮し、恍惚や集中ののち忘却することで無意識に刻む方法を説き、ゾス＝キア思想と自動描画を展開した。現代カオス魔術や自動描画の系譜に深く影響し、芸術と魔術実践の境界を溶かした先駆者である。"},{"name":"イズラエル・リガルディー","chapter":"c6-神話と儀礼","sub":5,"subCount":13,"tags":["religion","practice"],"birth":1907,"death":1985,"href":"https://note.com/search?q=from%3A%40varelser%20%E3%82%A4%E3%82%BA%E3%83%A9%E3%82%A8%E3%83%AB%E3%83%BB%E3%83%AA%E3%82%AC%E3%83%AB%E3%83%87%E3%82%A3%E3%83%BC&context=note&mode=search","article":false,"descRaw":"（英-米・1907–1985）：1907–1985。イギリス生まれのオカルティスト・作家。アレイスター・クロウリーの秘書を務めたのち、黄金の夜明け団の内部文書を整理・出版した『The Golden Dawn』（1937–40）で、近代西洋儀礼魔術の知識基盤を可視化した。『The Middle Pillar』（1938）では呼吸・視覚化・儀礼・身体意識を用いる実践法を普及させ、秘教的意識技法を近代人が参照しうる形で残した。"},{"name":"ジョン・ディー","chapter":"c6-神話と儀礼","sub":5,"subCount":13,"tags":["religion","science","practice"],"birth":1527,"death":1608,"href":"https://note.com/search?q=from%3A%40varelser%20%E3%82%B8%E3%83%A7%E3%83%B3%E3%83%BB%E3%83%87%E3%82%A3%E3%83%BC&context=note&mode=search","article":false,"descRaw":"（John Dee，1527–1608）：1527–1608。エリザベス朝イングランドの数学者・占星術師・魔術師。エリザベス1世の助言者でもあった。透視者エドワード・ケリーとともに水晶による天使との交信を続け、天使語エノク語と48の呼びかけからなるエノク魔術の体系を残した。数学・天文学と魔術を往還する知の姿は、近代科学以前の西洋における意識と宇宙の関係を示す源流の一つである。"},{"name":"マイスター・エックハルト","chapter":"c6-神話と儀礼","sub":6,"subCount":13,"tags":["religion","theory"],"birth":1260,"death":1328,"href":"https://note.com/search?q=from%3A%40varelser%20%E3%83%9E%E3%82%A4%E3%82%B9%E3%82%BF%E3%83%BC%E3%83%BB%E3%82%A8%E3%83%83%E3%82%AF%E3%83%8F%E3%83%AB%E3%83%88&context=note&mode=search","article":false,"descRaw":"（独・1260–1328）：1260–1328年頃。ドイツのドミニコ会士で、キリスト教神秘主義の最高峰の一人。「離脱（アプゲシャイデンハイト）」と「魂における神の内なる誕生」を説き、自我の放棄と神との合一を説いた。その思想は鈴木大拙が禅との類似を指摘したことでも知られ、東西の覚醒体験を結ぶ比較の焦点となった。没後に異端の疑いを受けたが、神秘思想の古典として読み継がれている。"},{"name":"アヴィラの聖テレサ","chapter":"c6-神話と儀礼","sub":6,"subCount":13,"tags":["religion","practice"],"birth":1515,"death":1582,"href":"https://note.com/search?q=from%3A%40varelser%20%E3%82%A2%E3%83%B4%E3%82%A3%E3%83%A9%E3%81%AE%E8%81%96%E3%83%86%E3%83%AC%E3%82%B5&context=note&mode=search","article":false,"descRaw":"（1515–1582）／（西・1542–1591）：16世紀スペインのカルメル会改革者たち。テレサ（1515–1582）は『霊魂の城』（1577）で魂の内室への段階的な深化を描き、ヨハネ（1542–1591）は『暗夜』と『カルメル山登攀』で神との合一に至る暗夜の過程を詩と散文で綴った。二人で跣足カルメル会を創設し、幽閉や迫害のなかで祈りによる意識変容を体系化した。キリスト教的変性意識体験の最も体系的な内省記録として読み継がれる。"},{"name":"十字架の聖ヨハネ","chapter":"c6-神話と儀礼","sub":6,"subCount":13,"tags":["religion","practice"],"birth":1542,"death":1591,"href":"https://note.com/search?q=from%3A%40varelser%20%E5%8D%81%E5%AD%97%E6%9E%B6%E3%81%AE%E8%81%96%E3%83%A8%E3%83%8F%E3%83%8D&context=note&mode=search","article":false,"descRaw":"（1515–1582）／（西・1542–1591）：16世紀スペインのカルメル会改革者たち。テレサ（1515–1582）は『霊魂の城』（1577）で魂の内室への段階的な深化を描き、ヨハネ（1542–1591）は『暗夜』と『カルメル山登攀』で神との合一に至る暗夜の過程を詩と散文で綴った。二人で跣足カルメル会を創設し、幽閉や迫害のなかで祈りによる意識変容を体系化した。キリスト教的変性意識体験の最も体系的な内省記録として読み継がれる。"},{"name":"プロティノス","chapter":"c6-神話と儀礼","sub":6,"subCount":13,"tags":["theory","religion"],"birth":204,"death":270,"href":"https://note.com/search?q=from%3A%40varelser%20%E3%83%97%E3%83%AD%E3%83%86%E3%82%A3%E3%83%8E%E3%82%B9&context=note&mode=search","article":false,"descRaw":"（ローマ帝国・204–270）：204–270。古代ローマ期の哲学者で新プラトン主義の創始者。主著『エネアデス』で、万物の根源である「一者（ト・ヘン）」への魂の上昇と合一（ヘノーシス）を説いた。西洋神秘主義の哲学的原型となり、キリスト教・イスラームの神秘思想にも影響を与えた。弟子ポルピュリオスの伝記によれば、生涯に四度の合一体験があったとされる。"},{"name":"ヘシカズム","chapter":"c6-神話と儀礼","sub":6,"subCount":13,"tags":["practice","religion"],"birth":null,"death":null,"href":"https://note.com/search?q=from%3A%40varelser%20%E3%83%98%E3%82%B7%E3%82%AB%E3%82%BA%E3%83%A0&context=note&mode=search","article":false,"descRaw":"：東方正教会の沈黙の祈りの伝統。「主イエス・キリストよ、我を憐れみたまえ」というイエスの祈りの反復と呼吸法で、心を静めて神の光との合一を目指す。14世紀に神学者グレゴリオス・パラマスが神学的に擁護し、正教会の霊性の中心となった。アトス山の修道士たちを中心に実践が受け継がれ、祈りと呼吸を結ぶ身体技法は、瞑想の東西比較でもしばしば取り上げられる。"},{"name":"イブン・アラビー","chapter":"c6-神話と儀礼","sub":7,"subCount":13,"tags":["religion","theory","dream"],"birth":1165,"death":1240,"href":"https://note.com/search?q=from%3A%40varelser%20%E3%82%A4%E3%83%96%E3%83%B3%E3%83%BB%E3%82%A2%E3%83%A9%E3%83%93%E3%83%BC&context=note&mode=search","article":false,"descRaw":"（Ibn al-ʿArabī・1165–1240・アンダルス-シリア）：1165–1240。アンダルス生まれのスーフィー神秘思想家。存在一性（ワフダト・アル＝ウジュード）の思想で知られ、夢・幻視・啓示・想像力の働きを精緻に論じた。主著は『メッカ啓示録』と『知恵の台座』。夢やヴィジョンを単なる主観ではなく存在論的に意味ある出来事として扱い、変性意識を世界理解の正統な様態として位置づけ、イスラーム神秘思想を巨大な形而上学へ高めた。"},{"name":"アンリ・コルバン","chapter":"c6-神話と儀礼","sub":7,"subCount":13,"tags":["theory","religion","dream"],"birth":1903,"death":1978,"href":"https://note.com/varelser/n/n574214db8e9f","article":true,"descRaw":"（Henry Corbin・1903–1978・仏）：1903–1978。フランスのイスラーム哲学者。スフラワルディーやイブン・アラビーの思想を西洋に紹介し、「想像界（ムンドゥス・イマギナリス）」の概念を広めた。主著『Creative Imagination in the Sufism of Ibn Arabi』と『En Islam iranien』。夢・ヴィジョン・象徴イメージを、物質界と純粋知性界の中間にある実在的領域への知覚として再評価し、芸術・宗教・心理学を横断する理論的基盤を与えた。"},{"name":"ヘレナ・P・ブラヴァツキー","chapter":"c6-神話と儀礼","sub":8,"subCount":13,"tags":["religion","theory"],"birth":1831,"death":1891,"href":"https://note.com/search?q=from%3A%40varelser%20%E3%83%98%E3%83%AC%E3%83%8A%E3%83%BBP%E3%83%BB%E3%83%96%E3%83%A9%E3%83%B4%E3%82%A1%E3%83%84%E3%82%AD%E3%83%BC&context=note&mode=search","article":false,"descRaw":"（Helena P. Blavatsky・1831–1891・露）：1831–1891。ロシア生まれの神秘思想家で、1875年にヘンリー・オルコットらとニューヨークで神智学協会を創設した。『ヴェールを脱いだイシス』（1877）と『シークレット・ドクトリン』（1888）で、東西の宗教・心霊主義・オカルティズムを「古代の叡智」と「霊的進化」の枠組みに統合した。霊視やアストラル光などの秘教的知覚を近代的言説として体系化し、芸術・文学・心理学周辺の変性意識論に巨大な影響を与えた。"},{"name":"アニー・ベサント","chapter":"c6-神話と儀礼","sub":8,"subCount":13,"tags":["religion","theory"],"birth":1847,"death":1933,"href":"https://note.com/search?q=from%3A%40varelser%20%E3%82%A2%E3%83%8B%E3%83%BC%E3%83%BB%E3%83%99%E3%82%B5%E3%83%B3%E3%83%88&context=note&mode=search","article":false,"descRaw":"（Annie Besant・1847–1933・英-印）：1847–1933。イギリスの社会活動家・神智学者。1907年から1933年まで神智学協会会長を務め、講演と出版で教義を世界に広めた。C・W・リードビーターとの共著『Thought-Forms』（1901）で思考形態やオーラ、意識の諸層を図式化し、見えない意識内容の可視化という発想を芸術や神秘思想にもたらした。教育・社会改革と意識進化論を結びつけた点でも知られる。"},{"name":"ルドルフ・シュタイナー","chapter":"c6-神話と儀礼","sub":8,"subCount":13,"tags":["religion","practice","theory"],"birth":1861,"death":1925,"href":"https://note.com/varelser/n/n4894622df5fc","article":true,"descRaw":"（Rudolf Steiner・1861–1925・墺-瑞）：1861–1925。オーストリアの哲学者で人智学の創始者。神智学協会から分かれ1913年に人智学協会を設立し、霊的知覚の訓練を核とする思想を展開した。主著『自由の哲学』（1894）と『神秘学概論』（1910）。スイス・ドルナッハのゲーテアヌムを拠点に、1919年創設のヴァルドルフ教育や芸術・医療へ応用した。訓練された覚醒意識で霊的世界を知覚しうるという意識訓練モデルを近代に大規模に提示した。"},{"name":"G.I.グルジエフ","chapter":"c6-神話と儀礼","sub":9,"subCount":13,"tags":["practice","theory"],"birth":1866,"death":1949,"href":"https://note.com/search?q=from%3A%40varelser%20G.I.%E3%82%B0%E3%83%AB%E3%82%B8%E3%82%A8%E3%83%95&context=note&mode=search","article":false,"descRaw":"（アルメニア-仏・1866–1949）：1866–1949。アルメニア生まれの神秘思想家。「第四の道」を説き、修道僧・ヨーガ行者・隠者の三つの道とは異なる、日常生活のなかでの覚醒の体系を提示した。「人間は眠っている」という前提から、自己想起（セルフ・リメンバリング）による目覚めを説いた。弟子P・D・ウスペンスキーが『奇蹟を求めて』で思想を体系化し、1922年にはフランス・フォンテーヌブロー近郊にプリエーレ研究所を開いた。"},{"name":"ジョン・カバットジン","chapter":"c6-神話と儀礼","sub":9,"subCount":13,"tags":["practice","clinical","science"],"birth":1944,"death":null,"href":"https://note.com/search?q=from%3A%40varelser%20%E3%82%B8%E3%83%A7%E3%83%B3%E3%83%BB%E3%82%AB%E3%83%90%E3%83%83%E3%83%88%E3%82%B8%E3%83%B3&context=note&mode=search","article":false,"descRaw":"（Jon Kabat-Zinn・1944–）：1944年生まれ。アメリカの医学者。1979年にマサチューセッツ大学医学部でストレス低減クリニックを開き、8週間のマインドフルネス・ストレス低減法（MBSR）を創始した。禅・ヴィパッサナー・ハタ・ヨーガを医療に応用し、慢性疼痛やストレスへの瞑想の効果を科学的に検証する道を開いた。著書『Full Catastrophe Living』（1990）などで知られ、瞑想の医療応用と科学化の最大の推進者である。"},{"name":"アンドリュー・ニューバーグ","chapter":"c6-神話と儀礼","sub":10,"subCount":13,"tags":["science","religion","practice"],"birth":1966,"death":null,"href":"https://note.com/varelser/n/n8a4f407662b8","article":true,"descRaw":"（Andrew Newberg・1966–・米）：アメリカの神経科学者で神経神学（neurotheology）の代表的研究者。SPECTやPETなどの脳画像法で、祈り・瞑想・宗教儀礼における脳活動を可視化し、宗教体験を医学・神経科学の対象として定着させた。『How God Changes Your Brain』（2009）『Principles of Neurotheology』（2010）が代表作。"},{"name":"レイモンド・ムーディ","chapter":"c6-神話と儀礼","sub":11,"subCount":13,"tags":["science","religion"],"birth":1944,"death":null,"href":"https://note.com/search?q=from%3A%40varelser%20%E3%83%AC%E3%82%A4%E3%83%A2%E3%83%B3%E3%83%89%E3%83%BB%E3%83%A0%E3%83%BC%E3%83%87%E3%82%A3&context=note&mode=search","article":false,"descRaw":"（Raymond Moody・1944–・米）：アメリカの精神科医・哲学者。『かいまみた死後の世界（Life After Life）』（1975）で、臨死体験（NDE）という概念を学術的・社会的に定着させた。150例の聞き取りから、トンネル・光・人生回顧などの共通要素を抽出し、死の淵での意識体験を研究の対象とした。哲学の博士号も持ち、死生観の研究を生涯にわたり続けた。"},{"name":"ケネス・リング","chapter":"c6-神話と儀礼","sub":11,"subCount":13,"tags":["science","religion"],"birth":1935,"death":null,"href":"https://note.com/varelser/n/n0254d529cda4","article":true,"descRaw":"（Kenneth Ring・1935–・米）：アメリカの心理学者で、臨死体験（NDE）の体系的研究の先駆者。『Life at Death』（1980）などで、光や存在との出会いを含むコア体験のモデルを提唱し、NDEがもたらす価値観の変容や死生観の変化を実証的に調べた。死に直面した意識の変容を心理学の主題とした。コネチカット大学で心理学を教え、NDE研究の第一人者となった。"},{"name":"エリザベス・キューブラー＝ロス","chapter":"c6-神話と儀礼","sub":11,"subCount":13,"tags":["clinical","theory"],"birth":1926,"death":2004,"href":"https://note.com/varelser/n/nf634a3a021ae","article":true,"descRaw":"（Elisabeth Kübler-Ross，1926–2004）：スイス生まれの精神科医。末期患者への面接から「死の五段階」（否認・怒り・取引・抑うつ・受容）を提唱し、『死の瞬間（On Death and Dying）』（1969）で死の心理学を切り開いた。五段階は順序通りに進むものではない点に注意が必要で、晩年は臨死体験にも関心を移した。ホスピス運動の推進にも尽力し、死生学の礎を築いた。"},{"name":"F.W.H.マイヤーズ","chapter":"c6-神話と儀礼","sub":12,"subCount":13,"tags":["theory","science","religion"],"birth":1843,"death":1901,"href":"https://note.com/varelser/n/nce91d566ff1b","article":true,"descRaw":"（Frederic W. H. Myers・1843–1901・英）：イギリスの心霊研究家で、心霊現象研究協会（SPR）の共同創設者（1882）。催眠・自動記述・テレパシーを横断し、「潜在自己／閾下自己」の概念で通常意識の境界を拡張した。『Phantasms of the Living』（1886）や死後刊の『Human Personality and Its Survival of Bodily Death』（1903）が代表作。"},{"name":"エドワード・F・ケリー","chapter":"c6-神話と儀礼","sub":12,"subCount":13,"tags":["theory","science","religion"],"birth":1940,"death":null,"href":"https://note.com/search?q=from%3A%40varelser%20%E3%82%A8%E3%83%89%E3%83%AF%E3%83%BC%E3%83%89%E3%83%BBF%E3%83%BB%E3%82%B1%E3%83%AA%E3%83%BC&context=note&mode=search","article":false,"descRaw":"（米・1940–）：アメリカの心理学者・神経科学者で、バージニア大学知覚研究部門（DOPS）の教授。マイヤーズの閾下自己の理論を現代に蘇らせ、編著『Irreducible Mind』（2007）で、神秘体験や臨死体験などの証拠から意識の物理主義的説明に挑んだ。変性意識の精密な神経画像研究も進める。ハーバード大学で博士号を取得し、長く超心理学の研究に携わった。"},{"name":"ダンテ・アリギエーリ","chapter":"c7-原始性の復権","sub":0,"subCount":12,"tags":["art","religion"],"birth":1265,"death":1321,"href":"https://note.com/search?q=from%3A%40varelser%20%E3%83%80%E3%83%B3%E3%83%86%E3%83%BB%E3%82%A2%E3%83%AA%E3%82%AE%E3%82%A8%E3%83%BC%E3%83%AA&context=note&mode=search","article":false,"descRaw":"（伊・1265–1321）：イタリアの詩人（1265-1321）。長編叙事詩『神曲』は地獄・煉獄・天国を巡る来世遍歴で、ウェルギリウスとベアトリーチェに導かれて死後の世界を幻視的に描く。中世の宇宙観と神学を詩の体系に結晶させ、トスカナ方言で書いたことがイタリア文学の基礎となった。死後の世界を「見た者」の語りとして、幻視文学の原型をなす。"},{"name":"ヒルデガルト・フォン・ビンゲン","chapter":"c7-原始性の復権","sub":0,"subCount":12,"tags":["religion","art"],"birth":1098,"death":1179,"href":"https://note.com/search?q=from%3A%40varelser%20%E3%83%92%E3%83%AB%E3%83%87%E3%82%AC%E3%83%AB%E3%83%88%E3%83%BB%E3%83%95%E3%82%A9%E3%83%B3%E3%83%BB%E3%83%93%E3%83%B3%E3%82%B2%E3%83%B3&context=note&mode=search","article":false,"descRaw":"（独・1098–1179）：ドイツの修道女・預言者（1098-1179）。43歳頃から見た幻視を記録した『スキヴィアス』には26の宗教的ヴィジョンが収められ、光に包まれた人物や宇宙的形象が神の啓示として描かれる。幻視は生涯続き、医学・音楽・自然学の著作にも結実した。中世女性神秘家の代表であり、幻視体験を体系的な神学と芸術に昇華した先駆者である。"},{"name":"エマニュエル・スウェーデンボルグ","chapter":"c7-原始性の復権","sub":0,"subCount":12,"tags":["religion","theory"],"birth":1688,"death":1772,"href":"https://note.com/search?q=from%3A%40varelser%20%E3%82%A8%E3%83%9E%E3%83%8B%E3%83%A5%E3%82%A8%E3%83%AB%E3%83%BB%E3%82%B9%E3%82%A6%E3%82%A7%E3%83%BC%E3%83%87%E3%83%B3%E3%83%9C%E3%83%AB%E3%82%B0&context=note&mode=search","article":false,"descRaw":"（スウェーデン・1688–1772）：スウェーデンの科学者・神学者（1688-1772）。57歳頃から霊界との交信を体験し始め、『天界と地獄』（1758）などで天国・地獄・霊界の構造を数十年にわたり組織的に記録した。霊との対話や死後の生の詳細な描写は、後の心霊主義や神智学、ブレイクやバルザックら文学者にも大きな影響を与えた。神学的幻視の最大の体系化者である。"},{"name":"ウィリアム・ブレイク","chapter":"c7-原始性の復権","sub":0,"subCount":12,"tags":["art","religion"],"birth":1757,"death":1827,"href":"https://note.com/search?q=from%3A%40varelser%20%E3%82%A6%E3%82%A3%E3%83%AA%E3%82%A2%E3%83%A0%E3%83%BB%E3%83%96%E3%83%AC%E3%82%A4%E3%82%AF&context=note&mode=search","article":false,"descRaw":"（英・1757–1827）：イギリスの詩人・版画家（1757-1827）。幼少期から幻視を見たとされ、『天国と地獄の結婚』（1790頃）や預言書群で、想像力を神聖な知覚とみなす独自の神話体系を築いた。天使や預言者的形象を自作の彩色版画とともに描き、理性中心の時代に反旗を翻した。幻視を芸術の根拠とするロマン派的想像力の源流の一人である。"},{"name":"サミュエル・テイラー・コルリッジ","chapter":"c7-原始性の復権","sub":0,"subCount":12,"tags":["art","substance","dream"],"birth":1772,"death":1834,"href":"https://note.com/search?q=from%3A%40varelser%20%E3%82%B5%E3%83%9F%E3%83%A5%E3%82%A8%E3%83%AB%E3%83%BB%E3%83%86%E3%82%A4%E3%83%A9%E3%83%BC%E3%83%BB%E3%82%B3%E3%83%AB%E3%83%AA%E3%83%83%E3%82%B8&context=note&mode=search","article":false,"descRaw":"（英・1772–1834）：イギリスの詩人（1772-1834）。阿片常用者として知られ、1797年頃の阿片による夢幻状態から生まれたとされる詩「クーブラ・カーン」は、幻の宮殿クサナドゥを描くロマン派の代表作。アヘンの陶酔と悪夢は「古舟子の歌」などにも影を落とす。薬物による夢幻体験を詩的想像力の源泉として文学に持ち込んだ先駆者である。"},{"name":"トマス・デ・クインシー","chapter":"c7-原始性の復権","sub":0,"subCount":12,"tags":["substance","art"],"birth":1785,"death":1859,"href":"https://note.com/varelser/n/n5ba141efab2a","article":true,"descRaw":"（英・1785–1859）：イギリスの作家（1785-1859）。『阿片常用者の告白』（1821）で、1804年から始めた阿片常用による陶酔と悪夢、東洋的な幻視の世界を赤裸々に描いた。薬物体験を内省的な散文文学として確立し、ボードレールやドストエフスキーらに影響を与えた。薬理体験と内的幻視を文学化した先駆であり、依存と想像力の関係を問う古典である。"},{"name":"ノヴァーリス","chapter":"c7-原始性の復権","sub":0,"subCount":12,"tags":["art","religion","dream"],"birth":1772,"death":1801,"href":"https://note.com/search?q=from%3A%40varelser%20%E3%83%8E%E3%83%B4%E3%82%A1%E3%83%BC%E3%83%AA%E3%82%B9&context=note&mode=search","article":false,"descRaw":"（独・1772–1801）：ドイツ・ロマン派の詩人・思想家（1772-1801）。婚約者の死を契機に書かれた『夜の賛歌』（1800）や未完の小説『ハインリヒ・フォン・オフターディンゲン』で、夢・夜・死を神秘的な啓示の領域として探求した。「青い花」は憧憬と内的覚醒の象徴となった。夢を哲学と詩の中心に置き、ロマン派の神秘主義的想像力を方向づけた。夭折した天才である。"},{"name":"シャルル・ボードレール","chapter":"c7-原始性の復権","sub":0,"subCount":12,"tags":["substance","art"],"birth":1821,"death":1867,"href":"https://note.com/search?q=from%3A%40varelser%20%E3%82%B7%E3%83%A3%E3%83%AB%E3%83%AB%E3%83%BB%E3%83%9C%E3%83%BC%E3%83%89%E3%83%AC%E3%83%BC%E3%83%AB&context=note&mode=search","article":false,"descRaw":"（仏・1821–1867）：フランスの詩人（1821-1867）。『悪の華』（1857）の作者で、散文『人工楽園』（1860）ではハシシと阿片の幻視効果を、ド・クインシーの翻案も交えて詳細に考察した。薬物による感覚の変容や人工的な陶酔を、近代都市の倦怠と結びつけて描き、デカダンス文学の起点となった。変性意識を美学的に主題化した近代詩人の中心人物である。"},{"name":"ジェラール・ド・ネルヴァル","chapter":"c7-原始性の復権","sub":0,"subCount":12,"tags":["art","dream"],"birth":1808,"death":1855,"href":"https://note.com/search?q=from%3A%40varelser%20%E3%82%B8%E3%82%A7%E3%83%A9%E3%83%BC%E3%83%AB%E3%83%BB%E3%83%89%E3%83%BB%E3%83%8D%E3%83%AB%E3%83%B4%E3%82%A1%E3%83%AB&context=note&mode=search","article":false,"descRaw":"（仏・1808–1855）：フランスの詩人・作家（1808-1855）。『アウレリア—夢と人生』（1855）で、夢と現実の境界が溶ける体験や精神の危機を、神秘的な散文で描いた。夢をもう一つの現実として生きる姿勢はシュルレアリスムに先駆ける。東方への旅やオカルトへの関心も深く、狂気と夢を文学の核心に据えた。精神の変容を自らの生で体現した作家である。"},{"name":"アーサー・ランボー","chapter":"c7-原始性の復権","sub":0,"subCount":12,"tags":["art","substance"],"birth":1854,"death":1891,"href":"https://note.com/search?q=from%3A%40varelser%20%E3%82%A2%E3%83%BC%E3%82%B5%E3%83%BC%E3%83%BB%E3%83%A9%E3%83%B3%E3%83%9C%E3%83%BC&context=note&mode=search","article":false,"descRaw":"（仏・1854–1891）：フランスの詩人（1854-1891）。10代で『地獄の季節』（1873）や『イリュミナシオン』を書き、書簡で提唱した「感覚の体系的な錯乱」は、長期にわたる意識の攪乱を通じて未知の知覚に到達しようとする宣言だった。薬物や放浪、幻視的イメージの連鎖が詩法の核にある。わずか数年の創作で詩の言語を変え、シュルレアリスムやカウンターカルチャーに決定的影響を与えた。"},{"name":"ユイスマンス","chapter":"c7-原始性の復権","sub":0,"subCount":12,"tags":["art"],"birth":1848,"death":1907,"href":"https://note.com/varelser/n/nc4f3f69378d7","article":true,"descRaw":"（仏・1848–1907）：フランスの作家（1848-1907）。『さかしま』（1884）で、人工的な感覚刺激に耽溺する貴族デ・ゼッサントを描き、デカダンス文学の金字塔を築いた。香水・宝石・絵画・音楽による内的幻視の追求は、現実からの逃避としての意識変容の美学を示す。後にカトリックへ回心し、神秘主義小説へ向かった。感覚の人工的陶酔を描いた世紀末文学の代表者である。"},{"name":"W.B.イェイツ","chapter":"c7-原始性の復権","sub":0,"subCount":12,"tags":["art","religion","practice"],"birth":1865,"death":1939,"href":"https://note.com/search?q=from%3A%40varelser%20W.B.%E3%82%A4%E3%82%A7%E3%82%A4%E3%83%84&context=note&mode=search","article":false,"descRaw":"（愛・1865–1939）：アイルランドの詩人（1865-1939）。神智学協会や薔薇十字団、黄金の夜明け団（ゴールデンドーン）に参加し、魔術的実践に深く関わった。妻ジョージーとの自動筆記をもとに『ヴィジョン』（1925）で、歴史と魂を説明する独自の象徴体系を構築した。オカルティズムと詩を統合し、ノーベル文学賞（1923）を受けた。神秘体験を詩学の基盤とした近代詩人である。"},{"name":"ライナー・マリア・リルケ","chapter":"c7-原始性の復権","sub":0,"subCount":12,"tags":["art","religion"],"birth":1875,"death":1926,"href":"https://note.com/search?q=from%3A%40varelser%20%E3%83%A9%E3%82%A4%E3%83%8A%E3%83%BC%E3%83%BB%E3%83%9E%E3%83%AA%E3%82%A2%E3%83%BB%E3%83%AA%E3%83%AB%E3%82%B1&context=note&mode=search","article":false,"descRaw":"（奥-瑞・1875–1926）：オーストリアの詩人（1875-1926）。『ドゥイノの悲歌』（1912-22）で、天使的存在との対話を通じて死・愛・変容を歌い、知覚の極限的開放による超越的詩学を築いた。ロダンの秘書を務めた経験や、ロシアへの旅も世界観を形づくった。内面の深化と「開かれた」意識を詩の中心に置き、20世紀抒情詩に大きな影響を与えた。"},{"name":"ウォルト・ホイットマン","chapter":"c7-原始性の復権","sub":0,"subCount":12,"tags":["art","theory"],"birth":1819,"death":1892,"href":"https://note.com/varelser/n/n1e159b8a0ec1","article":true,"descRaw":"（米・1819–1892）：アメリカの詩人（1819-1892）。『草の葉』（1855）で、身体と魂、自己と宇宙の一体化を謳い、自我の拡張による宇宙的意識を文学化した。エマーソンの超越主義を受け継ぎつつ、肉体の感覚を肯定する詩でアメリカ文学を刷新した。後にリチャード・バックが「コズミック・コンシャスネス」と呼んだ体験の文学的祖型とされる。民主主義的な宇宙意識の詩人である。"},{"name":"オディロン・ルドン","chapter":"c7-原始性の復権","sub":1,"subCount":12,"tags":["art","dream","religion"],"birth":1840,"death":1916,"href":"https://note.com/varelser/n/n189e582f1bcd","article":true,"descRaw":"（1840–1916）：フランス象徴主義の画家。1879年の画集『起源』に始まる黒一色の木炭画の時代を経て、1890年代以降は色彩豊かな幻想へ転じた。夢や内的幻視を描く手法で知られ、気球に乗った眼球を描いた『眼球の気球』（1878年）や、花や蝶と結びついた神秘的な頭部像など、見えない世界の視覚化を生涯の主題とした。晩年のパステルによる花の静物は、夢と現実のあわいを描くものとして評価された。"},{"name":"エドヴァルド・ムンク","chapter":"c7-原始性の復権","sub":1,"subCount":12,"tags":["art"],"birth":1863,"death":1944,"href":"https://note.com/search?q=from%3A%40varelser%20%E3%82%A8%E3%83%89%E3%83%B4%E3%82%A1%E3%83%AB%E3%83%89%E3%83%BB%E3%83%A0%E3%83%B3%E3%82%AF&context=note&mode=search","article":false,"descRaw":"（1863–1944）：ノルウェーの画家。代表作『叫び』（1893年）をはじめ、愛・不安・病・死を連作『生命のフリーズ』として描き続けた。感情を色彩と波打つ線で直接可視化する表現は、後の表現主義に大きな影響を与えた。日記や手記にも不安や幻覚的体験を綴り、内面の渦を芸術の中心に据えた。『思春期』や『吸血鬼』など、愛と不安を主題とする連作を生涯描き続けた。"},{"name":"ヒルマ・アフ・クリント","chapter":"c7-原始性の復権","sub":1,"subCount":12,"tags":["art","religion","practice"],"birth":1862,"death":1944,"href":"https://note.com/search?q=from%3A%40varelser%20%E3%83%92%E3%83%AB%E3%83%9E%E3%83%BB%E3%82%A2%E3%83%95%E3%83%BB%E3%82%AF%E3%83%AA%E3%83%B3%E3%83%88&context=note&mode=search","article":false,"descRaw":"（1862–1944）：スウェーデンの画家。1906年、女性5人の交霊グループ「ザ・ファイヴ」での霊的交信を機に、幾何学と色彩による大規模な抽象絵画を描き始めた。カンディンスキーらより早い抽象の先駆であり、連作『10の最大物』（1907年）などが知られる。生前はほぼ発表せず、死後20年間の公開を禁じる遺言を残した。代表作は、死後に公開された大規模な連作『神殿のための絵画』にまとめられた。"},{"name":"ワシリー・カンディンスキー","chapter":"c7-原始性の復権","sub":1,"subCount":12,"tags":["art","religion","theory"],"birth":1866,"death":1944,"href":"https://note.com/varelser/n/n6a86369fa48e","article":true,"descRaw":"（1866–1944）／（1872–1944）：神智学と精神性に立脚し、抽象絵画を切り開いた二人の先駆者。カンディンスキーは著書『芸術における精神的なもの』（1911年）で、色彩と形態の内的な響きを理論化し、『コンポジション』連作を描いた。モンドリアンは神智学の影響下で具象を削ぎ落とし、原色と直線による新造形主義を確立、『ブロードウェイ・ブギウギ』（1943年）に至った。ともに1944年に没した。"},{"name":"ピート・モンドリアン","chapter":"c7-原始性の復権","sub":1,"subCount":12,"tags":["art","religion","theory"],"birth":1872,"death":1944,"href":"https://note.com/varelser/n/nbaa7c3fe1161","article":true,"descRaw":"（1866–1944）／（1872–1944）：神智学と精神性に立脚し、抽象絵画を切り開いた二人の先駆者。カンディンスキーは著書『芸術における精神的なもの』（1911年）で、色彩と形態の内的な響きを理論化し
