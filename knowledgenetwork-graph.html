<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>変性意識・関連人物 — 関連図</title>
  <meta name="description" content="変性意識に関連する人物・研究・理論の関連図。2Dマインドマップ・3D、全体図・周辺表示。">
  <style>
    :root {
      --bg: #ffffff;
      --panel: rgba(0,0,0,0.72);
      --line: rgba(0,0,0,0.10);
      --line-strong: rgba(0,0,0,0.16);
      --text: #111111;
      --muted: #6b6b6b;
      --link: #111111;
      --max: 1320px;
      --radius: 14px;
      --fs-body: 15px;
      --fs-small: 12px;
      --fs-h1: clamp(1.4rem, 2vw, 2.2rem);
      --fs-h2: 1.15rem;
      --fs-h3: 0.92rem;
      color-scheme: light;
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      background:
        radial-gradient(1100px 520px at 88% -8%, rgba(125,140,255,0.15), transparent 62%),
        radial-gradient(900px 480px at -8% -4%, rgba(255,175,205,0.13), transparent 58%),
        radial-gradient(1000px 640px at 50% 112%, rgba(140,220,255,0.13), transparent 62%),
        var(--bg);
      background-attachment: fixed;
      color: var(--text);
      font: var(--fs-body)/1.68 -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Yu Gothic UI", sans-serif;
      letter-spacing: 0.01em;
    }
    a {
      color: var(--link);
      text-decoration: none;
      transition: opacity 140ms ease, border-color 140ms ease;
    }
    a:hover { opacity: 0.72; }
    .wrap {
      width: 100%;
      max-width: none;
      margin: 0;
      padding: 0;
    }
    .hero {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 10px 12px;
      margin: 0;
      min-height: 52px;
      border-bottom: 1px solid var(--line-strong);
      background: rgba(255,255,255,0.48);
      backdrop-filter: blur(14px) saturate(1.4);
      -webkit-backdrop-filter: blur(14px) saturate(1.4);
    }
    .hero h1 {
      margin: 0;
      font-size: var(--fs-h1);
      line-height: 1.15;
      font-weight: 650;
      letter-spacing: 0.03em;
    }
    .hero-sub {
      color: var(--muted);
      font-size: var(--fs-small);
      white-space: nowrap;
    }
    .toolbar { position: sticky; top: 0; z-index: 30; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; padding: 10px 12px; border-bottom: 1px solid rgba(0,0,0,0.10); background: rgba(255,255,255,0.45); backdrop-filter: blur(28px) saturate(1.8); -webkit-backdrop-filter: blur(28px) saturate(1.8); box-shadow: inset 0 1px 0 rgba(255,255,255,0.8), 0 8px 24px rgba(0,0,0,0.06); }
    .toolbar-home, #graph-link { display: inline-flex; align-items: center; height: 36px; padding: 0 14px; border: 1px solid rgba(0,0,0,0.12); background: rgba(255,255,255,0.65); color: var(--text); border-radius: 12px; backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); box-shadow: inset 0 1px 0 rgba(255,255,255,0.9), 0 1px 2px rgba(0,0,0,0.04); white-space: nowrap; }
    .toolbar-home:hover, #graph-link:hover { background: #ffffff; border-color: rgba(0,0,0,0.25); }
    #result-count { color: var(--muted); font-size: var(--fs-small); white-space: nowrap; }
    #kn-tooltip { position: fixed; z-index: 200; max-width: 320px; padding: 10px 12px; background: rgba(255,255,255,0.68); backdrop-filter: blur(18px) saturate(1.4); -webkit-backdrop-filter: blur(18px) saturate(1.4); border: 1px solid rgba(0,0,0,0.12); border-radius: 12px; box-shadow: 0 8px 24px rgba(0,0,0,0.12), inset 0 1px 0 rgba(255,255,255,0.9); color: var(--text); font-size: var(--fs-small); line-height: 1.6; pointer-events: none; }
    #kn-tooltip .kn-tip-title { font-weight: 650; font-size: var(--fs-body); line-height: 1.4; margin-bottom: 2px; }
    #kn-tooltip .kn-tip-body { color: var(--text); }
    @media (max-width: 980px) { .toolbar { padding: 10px; } .toolbar-home, #graph-link { height: 44px; } .hero { padding: 10px; flex-wrap: wrap; } .hero-sub { white-space: normal; } }
    /* ---- 関連図 (graph view) ---- */
    #graph { margin: 12px; border: 1px solid rgba(0,0,0,0.08); background: rgba(255,255,255,0.74); backdrop-filter: blur(14px) saturate(1.3); -webkit-backdrop-filter: blur(14px) saturate(1.3); border-radius: 18px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); padding: 12px; display: flex; flex-direction: column; height: calc(100vh - 160px); height: calc(100dvh - 160px); }
    .graph-bar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-bottom: 10px; position: sticky; top: 62px; z-index: 20; background: rgba(255,255,255,0.85); backdrop-filter: blur(14px) saturate(1.4); -webkit-backdrop-filter: blur(14px) saturate(1.4); border-radius: 12px; padding: 6px 8px; }
    .graph-bar > button, .graph-detail > button { height: 34px; padding: 0 12px; border: 1px solid rgba(0,0,0,0.12); background: rgba(255,255,255,0.65); color: var(--text); font: inherit; cursor: pointer; border-radius: 12px; backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); box-shadow: inset 0 1px 0 rgba(255,255,255,0.9), 0 1px 2px rgba(0,0,0,0.04); }
    .graph-bar > button:hover, .graph-detail > button:hover { background: #ffffff; border-color: rgba(0,0,0,0.25); }
    .graph-bar > button.is-active { color: #ffffff; background: rgba(0,0,0,0.88); border-color: rgba(0,0,0,0.88); box-shadow: 0 2px 8px rgba(0,0,0,0.18); }
    .graph-seg { display: inline-flex; border: 1px solid rgba(0,0,0,0.12); background: rgba(255,255,255,0.65); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border-radius: 12px; overflow: hidden; box-shadow: inset 0 1px 0 rgba(255,255,255,0.9), 0 1px 2px rgba(0,0,0,0.04); }
    .graph-bar .graph-seg button { appearance: none; border: 0; border-right: 1px solid var(--line); background: transparent; color: var(--muted); height: 34px; min-width: 38px; padding: 0 12px; font: inherit; cursor: pointer; border-radius: 0; box-shadow: none; }
    .graph-bar .graph-seg button:last-child { border-right: 0; }
    .graph-bar .graph-seg button:hover { background: rgba(255,255,255,0.9); color: var(--text); }
    .graph-bar .graph-seg button.is-active { color: #ffffff; background: rgba(0,0,0,0.88); }
    .graph-center { color: var(--muted); font-size: var(--fs-small); display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
    .graph-center input { height: 34px; width: 210px; padding: 0 10px; border: 1px solid rgba(0,0,0,0.12); background: rgba(255,255,255,0.55); color: var(--text); font: inherit; border-radius: 12px; backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); box-shadow: inset 0 1px 0 rgba(255,255,255,0.9), 0 1px 2px rgba(0,0,0,0.04); }
    .graph-center input:focus { outline: none; border-color: rgba(0,0,0,0.35); background: #ffffff; box-shadow: inset 0 1px 0 rgba(255,255,255,0.9), 0 0 0 3px rgba(0,0,0,0.08); }
    .graph-center input:disabled, .graph-check input:disabled { opacity: 0.45; }
    .graph-check { color: var(--muted); font-size: var(--fs-small); display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; cursor: pointer; }
    .graph-sliders { display: flex; flex-wrap: wrap; gap: 6px 18px; align-items: center; margin-bottom: 10px; padding: 8px 10px; border: 1px solid rgba(0,0,0,0.08); background: rgba(255,255,255,0.55); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border-radius: 12px; color: var(--muted); font-size: var(--fs-small); }
    .graph-sliders label { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
    .graph-sliders input[type="range"] { width: 110px; accent-color: rgba(0,0,0,0.75); }
    .graph-sliders input[type="range"]:disabled { opacity: 0.3; }
    .graph-sliders .graph-f-val { color: var(--text); min-width: 34px; font-variant-numeric: tabular-nums; }
    .graph-sliders .graph-f-note { color: var(--muted); font-size: 0.9em; }
    #graph-count { color: var(--muted); font-size: var(--fs-small); margin-left: auto; white-space: nowrap; }
    .graph-main { display: grid; grid-template-columns: minmax(0, 1fr) 252px; gap: 10px; align-items: stretch; flex: 1; min-height: 0; }
    #graph-canvas { width: 100%; height: 100%; min-height: 0; display: block; border: 1px solid rgba(0,0,0,0.08); border-radius: 12px; background: rgba(255,255,255,0.55); touch-action: none; cursor: grab; }
    #graph-canvas:active { cursor: grabbing; }
    .graph-detail { border: 1px solid rgba(0,0,0,0.08); background: rgba(255,255,255,0.55); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border-radius: 12px; padding: 12px; overflow: auto; max-height: 100%; font-size: var(--fs-small); line-height: 1.7; }
    .graph-detail h3 { margin: 0 0 4px; font-size: var(--fs-body); line-height: 1.4; font-weight: 650; }
    .graph-detail h3 a { color: var(--text); border-bottom: 1px solid rgba(0,0,0,0.35); }
    .graph-detail h3 a:hover { border-bottom-color: var(--text); }
    .graph-detail .gd-meta { color: var(--muted); }
    .graph-detail .gd-tags { margin: 8px 0; }
    .graph-detail .gd-tags span { display: inline-block; border: 1px solid rgba(0,0,0,0.14); border-radius: 999px; padding: 1px 8px; margin: 0 4px 4px 0; background: rgba(255,255,255,0.7); color: var(--text); }
    .graph-detail .gd-links { margin: 8px 0 0; display: flex; flex-direction: column; gap: 6px; align-items: flex-start; }
    .graph-detail .gd-note { color: var(--muted); }
    .graph-detail .gd-rel { display: flex; flex-wrap: wrap; gap: 4px 8px; margin: 2px 0 4px; align-items: center; }
    .graph-detail .gd-rel-item { appearance: none; border: 1px solid rgba(142,47,60,0.35); background: rgba(255,255,255,0.7); color: var(--text); font: inherit; font-size: var(--fs-small); cursor: pointer; border-radius: 999px; padding: 1px 9px; }
    .graph-detail .gd-rel-item:hover { background: #ffffff; border-color: rgba(142,47,60,0.7); }
    .graph-detail .gd-rel a { color: var(--muted); font-size: 0.9em; }
    .graph-detail-empty { color: var(--muted); margin: 0; }
    .graph-legend { display: flex; flex-wrap: wrap; gap: 4px 14px; margin-top: 10px; color: var(--muted); font-size: var(--fs-small); align-items: center; }
    .graph-legend .sw { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 5px; vertical-align: -1px; }
    .graph-legend .edge-sample { display: inline-block; width: 22px; height: 0; border-top: 2px solid rgba(0,0,0,0.16); vertical-align: middle; margin-right: 5px; }
    .graph-legend .edge-sample.mention { border-top: 1px solid rgba(0,0,0,0.45); }
    .graph-legend .edge-sample.rel { border-top: 2px dashed rgba(142,47,60,0.7); }
    .graph-legend .edge-sample.weak { border-top: 1px solid rgba(0,0,0,0.08); }
    .graph-legend .edge-sample.spoke { border-top: 1px solid rgba(0,0,0,0.22); }
    @media (max-width: 980px) {
      #graph { margin: 10px; padding: 10px; height: auto; }
      .graph-main { grid-template-columns: 1fr; flex: none; }
      #graph-canvas { height: 420px; height: min(60dvh, 520px); min-height: 320px; }
      .graph-detail { max-height: none; }
      .graph-center input { width: 160px; }
      /* 狭い画面：操作バーは上部に固定しない（ツールバーと重なるため）。
         ボタン・入力・スライダーのタップ領域を指で押しやすい高さにする。 */
      .graph-bar { position: static; }
      .graph-bar > button, .graph-bar .graph-seg button { height: 44px; min-width: 44px; }
      .graph-bar .graph-seg button { padding: 0 14px; }
      .graph-center input { height: 44px; flex: 1 1 160px; min-width: 140px; }
      .graph-check { min-height: 44px; }
      .graph-check input { width: 20px; height: 20px; }
      .graph-sliders label { flex: 1 1 100%; }
      .graph-sliders input[type="range"] { flex: 1; height: 44px; min-width: 120px; }
      .graph-detail > button { min-height: 44px; }
      .graph-detail .gd-rel-item { min-height: 32px; padding: 4px 12px; }
    }

  </style>
</head>
<body>
  <div class="wrap">
    <header class="hero">
      <h1>関連図 — 変性意識・関連人物</h1>
      <span class="hero-sub">2Dマインドマップ・3Dでつながりを眺める</span>
    </header>
    <div class="toolbar" role="navigation" aria-label="ページ移動">
      <a class="toolbar-home" href="https://varelser.github.io/">ホームへ</a>
      <a class="toolbar-home" href="knowledgenetwork.html">一覧へ</a>
      <span id="result-count" aria-live="polite"></span>
    </div>
    <div id="graph" hidden>
      <div class="graph-bar" role="toolbar" aria-label="関連図の操作">
        <div class="graph-seg" role="group" aria-label="表示範囲">
          <button type="button" id="graph-view-all" class="is-active" aria-pressed="true">全体図</button>
          <button type="button" id="graph-view-local" aria-pressed="false">周辺</button>
        </div>
        <label class="graph-center">中心 <input id="graph-center" list="graph-names" placeholder="人物・理論名" autocomplete="off" aria-label="中心ノード"></label>
        <datalist id="graph-names"></datalist>
        <label class="graph-check"><input type="checkbox" id="graph-depth2"> 2段表示</label>
        <div class="graph-seg" role="group" aria-label="辺の種類">
          <button type="button" id="graph-edge-both" class="is-active" aria-pressed="true">両方</button>
          <button type="button" id="graph-edge-tag" aria-pressed="false">タグ</button>
          <button type="button" id="graph-edge-mention" aria-pressed="false">言及</button>
        </div>
        <label class="graph-check"><input type="checkbox" id="graph-weak" checked> 弱い辺も表示</label>
        <div class="graph-seg" role="group" aria-label="次元">
          <button type="button" id="graph-dim-2d" class="is-active" aria-pressed="true">2D</button>
          <button type="button" id="graph-dim-3d" aria-pressed="false">3D</button>
        </div>
        <button type="button" id="graph-play">一時停止</button>
        <button type="button" id="graph-reset">リセット</button>
        <label class="graph-check"><input type="checkbox" id="graph-rotate"> 自動回転</label>
        <span id="graph-count" aria-live="polite"></span>
      </div>
      <div class="graph-sliders" role="group" aria-label="力の調整">
        <label><span id="graph-f-attract-name">吸引力</span> <input type="range" id="graph-f-attract" min="0.2" max="5" step="0.1" value="1" aria-label="吸引力"> <span class="graph-f-val" id="graph-f-attract-val">×1.0</span></label>
        <label><span id="graph-f-repel-name">反発力</span> <input type="range" id="graph-f-repel" min="0.2" max="5" step="0.1" value="1" aria-label="反発力"> <span class="graph-f-val" id="graph-f-repel-val">×1.0</span></label>
        <label><span id="graph-f-rest-name">バネの長さ</span> <input type="range" id="graph-f-rest" min="0.5" max="4" step="0.1" value="1" aria-label="バネの長さ"> <span class="graph-f-val" id="graph-f-rest-val">×1.0</span></label>
        <label><span id="graph-f-speed-name">速度</span> <input type="range" id="graph-f-speed" min="0.3" max="4" step="0.1" value="1" aria-label="アニメーション速度"> <span class="graph-f-val" id="graph-f-speed-val">×1.0</span></label>
        <span class="graph-f-note" id="graph-f-note"></span>
      </div>
      <div class="graph-main">
        <canvas id="graph-canvas" width="900" height="560" aria-label="関連図"></canvas>
        <aside class="graph-detail" id="graph-detail" aria-live="polite">
          <p class="graph-detail-empty">ノードをクリックすると詳細が表示されます。ドラッグで移動、ホイール／ピンチでズームできます。3Dではドラッグで回転します。タッチではノードをタップすると説明が表示されます。</p>
        </aside>
      </div>
      <div class="graph-legend" id="graph-legend"></div>
    </div>

"ヴァージニア・ウルフ","b":"ジークムント・フロイト","type":"交友","note":"1939年1月28日、ウルフ夫妻はロンドンのフロイト宅を訪ねてお茶を共にし、フロイトから水仙の花を贈られた。夫妻のホガース・プレスは1924年からフロイトの著作を出版していた。","source":"https://link.springer.com/chapter/10.1057/9781403919366_1"},{"a":"ラルフ・ワルド・エマーソン","b":"ウォルト・ホイットマン","type":"往復書簡","note":"1855年7月21日、エマーソンは『草の葉』を絶賛する手紙をホイットマンに送り、同年12月11日にはブルックリンを訪ねて夕食を共にした。（記述文中の言及と重複）","source":"https://whitmanarchive.org/item/encyclopedia_entry1"},{"a":"マルセル・モース","b":"エミール・デュルケーム","type":"師弟","note":"モースはデュルケームの甥で、直接の指導を受けて『自殺論』の準備を手伝い、後に『社会学年報』の編集を継承した。","source":"https://www.britannica.com/biography/Marcel-Mauss"},{"a":"ヴィルヘルム・ライヒ","b":"ジークムント・フロイト","type":"師弟","note":"1920年代にフロイトの弟子としてウィーンで活動し、後継者と目されたが、理論の対立から1934年に国際精神分析協会から除名された。","source":"https://www.britannica.com/biography/Wilhelm-Reich"},{"a":"クロード・レヴィ＝ストロース","b":"マルセル・モース","type":"師弟","note":"レヴィ＝ストロースはモースの講義を受け、没後に著作集『社会学と人類学』の編集と長大な序文を担当し、自らをモースの継承者として位置づけた。","source":"https://ja.wikipedia.org/wiki/%E3%82%AF%E3%83%AD%E3%83%BC%E3%83%89%E3%83%BB%E3%83%AC%E3%83%B4%E3%82%A3%EF%BC%9D%E3%82%B9%E3%83%88%E3%83%AD%E3%83%BC%E3%82%B9"},{"a":"ジョン・ケージ","b":"鈴木大拙","type":"師弟","note":"ケージは1952年からコロンビア大学で大拙の禅の講義を3年間聴講し、沈黙と無心の思想が『4分33秒』へと結実した。","source":"https://tower.jp/article/series/2012/08/20/silence"},{"a":"ピンク・フロイド","b":"ジミ・ヘンドリックス","type":"協働","note":"1967年11月14日から12月5日まで、ジミ・ヘンドリックス・エクスペリエンスをヘッドライナーとする16日間の英国パッケージツアーを共にした。","source":"https://www.jimihendrix.com/editorial/the-line-up-of-a-lifetime-on-the-road-with-the-jimi-hendrix-experience-second-uk-tour-nov-dec-1967/"},{"a":"スタニスラフ・グロフ","b":"ティモシー・リアリー","type":"交友","note":"グロフはリアリーと直接議論し、リアリーの「誰でもどんな状況でもサイケデリックを取ってよい」という考えに異を唱えた。","source":"https://www.atpweb.org/jtparchive/trps-40-08-02-155.pdf"},{"a":"スタニスラフ・グロフ","b":"アルベルト・ホフマン","type":"交友","note":"グロフはホフマンを「究極の精神的な父」と呼び、1984年にエサレン研究所で対談するなど長年にわたって交流した。","source":"https://maps.org/news-letters/v11n2/11222gro.html"},{"a":"寺山修司","b":"横尾忠則","type":"協働","note":"横尾は1967年の演劇実験室「天井桟敷」の旗揚げメンバーで美術スタッフとして参加し、『毛皮のマリー』などのポスターと舞台装置を手がけた。","source":"https://jbpress.ismedia.jp/articles/-/94476"},{"a":"ウォルター・パーンケ","b":"ティモシー・リアリー","type":"師弟","note":"パーンケはリアリーの指導のもとで博士論文研究として1962年のグッド・フライデー実験（マーシュ礼拝堂実験）を設計・実施した。","source":"https://archives.lib.purdue.edu/agents/people/435"}]</script>
  <script>
    // ---- 共通ツールチップ（ホバーで説明を表示） ----
    // ガラス風の専用要素（title属性は使わない）。カーソルに追従し、
    // 画面端ではみ出さないよう位置を調整する。マウスが離れるか
    // スクロールしたら消える。
    // タップでも表示できる（モバイル）：1回目のタップで説明を表示し、
    // 同じ要素への2回目のタップでリンクを開く。タップで開いた説明は
    // 別の場所のタップ・スクロール・一定時間（5秒）で消える。
    // iOSではタップ毎に mouseover が発火するため、同じタイトルの説明が
    // 既に出ている場合は owner を上書きしない（タップ→mouseover の順で
    // 呼ばれても、タップ側の owner が残る）。
    let knTipEl = null;
    let tipOwner = null;
    let knTipHideTimer = null;
    let lastPointerType = 'mouse';
    const KN_TIP_AUTO_HIDE_MS = 5000;
    document.addEventListener('pointerdown', (e) => {
      if (e.pointerType) lastPointerType = e.pointerType;
      // タップで開いた説明は、別の要素へのタップで閉じる
      if (e.pointerType === 'touch' && knTipEl && !knTipEl.hidden) {
        const t = e.target;
        if (!knTipEl.contains(t) && !(t.closest && t.closest('a, button'))) knTipHide();
      }
    }, true);
    const armKnTipTimer = () => {
      if (knTipHideTimer) clearTimeout(knTipHideTimer);
      knTipHideTimer = setTimeout(() => { knTipHide(); knTipHideTimer = null; }, KN_TIP_AUTO_HIDE_MS);
    };
    const knTip = () => {
      if (!knTipEl) {
        knTipEl = document.createElement('div');
        knTipEl.id = 'kn-tooltip';
        knTipEl.setAttribute('role', 'tooltip');
        knTipEl.hidden = true;
        document.body.appendChild(knTipEl);
      }
      return knTipEl;
    };
    const knTipShow = (title, body, x, y, owner) => {
      const el = knTip();
      // 同じタイトルの説明が既に出ている場合は内容を作り直さず、owner は
      // タップ側のものを残す（iOSではタップ毎に mouseover が発火し、
      // owner なしで呼ばれてもタップ側の owner を消さないため。2回目の
      // タップでリンクを開けるようにする）
      if (!el.hidden) {
        const curTitle = el.querySelector('.kn-tip-title');
        if (curTitle && curTitle.textContent === title) {
          if (owner && !tipOwner) tipOwner = owner;
          knTipMove(x, y);
          return;
        }
      }
      el.innerHTML = '';
      if (title) {
        const h = document.createElement('div');
        h.className = 'kn-tip-title';
        h.textContent = title;
        el.appendChild(h);
      }
      if (body) {
        const b = document.createElement('div');
        b.className = 'kn-tip-body';
        b.textContent = body;
        el.appendChild(b);
      }
      el.hidden = false;
      tipOwner = owner || null;
      knTipMove(x, y);
    };
    const knTipMove = (x, y) => {
      const el = knTipEl;
      if (!el || el.hidden) return;
      const pad = 12, gap = 14;
      const w = el.offsetWidth, h = el.offsetHeight;
      const vw = window.innerWidth, vh = window.innerHeight;
      let left = x + gap, top = y + gap;
      if (left + w > vw - pad) left = x - w - gap;
      if (left < pad) left = pad;
      if (top + h > vh - pad) top = y - h - gap;
      if (top < pad) top = pad;
      el.style.left = left + 'px';
      el.style.top = top + 'px';
    };
    const knTipHide = () => { if (knTipEl) knTipEl.hidden = true; tipOwner = null; if (knTipHideTimer) { clearTimeout(knTipHideTimer); knTipHideTimer = null; } };
    window.addEventListener('scroll', knTipHide, true);

    // liから記述文を取り出す（項目名リンク・関連・タグ表示を除き、
    // 先頭の（…）：を除く）。論文項目は括弧が項目名リンク内にあって
    // 残りのテキストが「：」から始まるため、先頭の「：」や「—」も除く。
    const descOfLi = (li) => {
      if (!li) return '';
      const clone = li.cloneNode(true);
      clone.querySelectorAll('.person-link, .related, .tags').forEach((el) => el.remove());
      const t = (clone.textContent || '').replace(/\s+/g, ' ').trim();
      return t.replace(/^（[^）]*）：\s*/, '').replace(/^[：:—―\-–\s]+/, '');
    };
    const truncDesc = (t, n) => {
      const chars = [...(t || '')];
      if (chars.length <= n) return t || '';
      return chars.slice(0, n).join('') + '…';
    };
    const fmtYear = (y) => (y < 0 ? '前' + Math.abs(y) : String(y));
    const fmtSpan = (b, d) => fmtYear(b) + '–' + (d == null ? '' : fmtYear(d));

    // 一覧ページ側の状態（関連図の openInList 等が参照するため宣言だけ用意。
    // 単独ページでは一覧の DOM がないため openInList は一覧へ遷移する）
    let activeTag = '';
    let timelineMode = false;

const TAGS = {
      substance: '物質', practice: '実践', dream: '夢・睡眠', theory: '理論',
      clinical: '臨床', religion: '宗教・神秘', art: '芸術', science: '科学',
      tech: '技術', culture: '民族・文化', policy: '制度・倫理'
    };

    // 関連図のデータ（一覧ページ knowledgenetwork.html の person-link から

astro，1951–）：人類学者。アマゾン先住民の宇宙論からペルスペクティヴィズム（人間・動物・精霊は視点によって異なる世界を生きる）を提唱した。シャーマニズムの世界観を理論化した点で関連するが、意識変容そのものの研究者ではない。"},{"name":"フィリップ・デスコラ","chapter":"v-心理学-神経科学-思想家","sub":5,"subCount":6,"tags":["theory","culture"],"birth":1949,"death":null,"href":"https://note.com/search?q=from%3A%40varelser%20%E3%83%95%E3%82%A3%E3%83%AA%E3%83%83%E3%83%97%E3%83%BB%E3%83%87%E3%82%B9%E3%82%B3%E3%83%A9&context=note&mode=search","article":false,"descRaw":"（Philippe Descola，1949–）：人類学者。アチュアル族の調査をもとに自然／文化の二分法を問い直し、アニミズム・トーテミズム・自然主義・アナロジズムの四つの存在論を提唱した。"},{"name":"ジェームズ・ブレイド","chapter":"v-心理学-神経科学-思想家","sub":6,"subCount":7,"tags":["practice","clinical","science"],"birth":1795,"death":1860,"href":"https://note.com/varelser/n/n6cdc6c2d46fd","article":true,"descRaw":"（英・1795–1860）：「催眠（hypnosis）」という用語の創始者。神経催眠学の先駆者（19世紀）。"},{"name":"ミルトン・エリクソン","chapter":"v-心理学-神経科学-思想家","sub":6,"subCount":7,"tags":["clinical","practice"],"birth":1901,"death":1980,"href":"https://note.com/search?q=from%3A%40varelser%20%E3%83%9F%E3%83%AB%E3%83%88%E3%83%B3%E3%83%BB%E3%82%A8%E3%83%AA%E3%82%AF%E3%82%BD%E3%83%B3&context=note&mode=search","article":false,"descRaw":"（Milton Erickson・1901–1980）：エリクソニアン催眠—トランスを治療的ツールとして洗練させた20世紀最大の催眠療法家。"},{"name":"ウィリアム・デメント","chapter":"v-心理学-神経科学-思想家","sub":6,"subCount":7,"tags":["dream","science"],"birth":1928,"death":2020,"href":"https://note.com/search?q=from%3A%40varelser%20%E3%82%A6%E3%82%A3%E3%83%AA%E3%82%A2%E3%83%A0%E3%83%BB%E3%83%87%E3%83%A1%E3%83%B3%E3%83%88&context=note&mode=search","article":false,"descRaw":"（William Dement・1928–2020）：REM睡眠発見への貢献。睡眠医学の父。"},{"name":"アーネスト・ヒルガード","chapter":"v-心理学-神経科学-思想家","sub":6,"subCount":7,"tags":["science","theory","practice"],"birth":1904,"death":2001,"href":"https://note.com/varelser/n/n2dc8b8fdafad","article":true,"descRaw":"（Ernest Hilgard・1904–2001・米）：催眠の新解離理論（Neodissociation Theory）。催眠下の「隠れた観察者（Hidden Observer）」実験。意識の多層性の実証。"},{"name":"ジョン・C・リリー","chapter":"v-心理学-神経科学-思想家","sub":6,"subCount":7,"tags":["tech","substance","science"],"birth":1915,"death":2001,"href":"https://note.com/varelser/n/ne343599d8208","article":true,"descRaw":"（John C. Lilly・1915–2001・米）：感覚遮断タンク（アイソレーション・タンク）の発明者。ケタミン・LSDの自己実験。イルカのコミュニケーション研究。意識探索のテクノロジー化。"},{"name":"ミシェル・ジューヴェ","chapter":"v-心理学-神経科学-思想家","sub":6,"subCount":7,"tags":["dream","science"],"birth":1925,"death":2017,"href":"https://note.com/search?q=from%3A%40varelser%20%E3%83%9F%E3%82%B7%E3%82%A7%E3%83%AB%E3%83%BB%E3%82%B8%E3%83%A5%E3%83%BC%E3%83%B4%E3%82%A7&context=note&mode=search","article":false,"descRaw":"（Michel Jouvet・1925–2017・仏）：睡眠研究の巨人。やったこと：1950年代末に猫でREM睡眠中の筋無力（muscle atonia）を発見し、REM睡眠を「逆説睡眠（paradoxical sleep）」として定式化、REM睡眠行動障害の最初のモデルも作った。代表作：『The Castle of Dreams』、主要論文群（逆説睡眠研究）。変性意識との関連：覚醒でも徐波睡眠でもない「第三の状態」として夢睡眠を科学化し、夢を変性意識研究の中心テーマとして確立した。"},{"name":"マーク・ソームズ","chapter":"v-心理学-神経科学-思想家","sub":6,"subCount":7,"tags":["dream","science","theory"],"birth":1961,"death":null,"href":"https://note.com/search?q=from%3A%40varelser%20%E3%83%9E%E3%83%BC%E3%82%AF%E3%83%BB%E3%82%BD%E3%83%BC%E3%83%A0%E3%82%BA&context=note&mode=search","article":false,"descRaw":"（Mark Solms・1961–・南ア）：神経精神分析と夢研究の中心人物。やったこと：神経心理学・病巣研究・画像研究から、夢見はREM睡眠と同一ではなく前脳系機構とも強く関わることを論証した。代表作：『The Hidden Spring』『Dreaming and REM Sleep are Controlled by Different Brain Mechanisms』。変性意識との関連：夢＝REMという単純図式を崩し、夢経験をより広い意識生成メカニズムの問題として再配置した。"},{"name":"ユージン・アセリンスキー","chapter":"v-心理学-神経科学-思想家","sub":6,"subCount":7,"tags":["dream","science"],"birth":1921,"death":1998,"href":"https://note.com/search?q=from%3A%40varelser%20%E3%83%A6%E3%83%BC%E3%82%B8%E3%83%B3%E3%83%BB%E3%82%A2%E3%82%BB%E3%83%AA%E3%83%B3%E3%82%B9%E3%82%AD%E3%83%BC&context=note&mode=search","article":false,"descRaw":"（1921–1998）：米国の生理学者。1953年にクライトマンとレム睡眠を発見し、夢の客観的研究を開いた。現代睡眠研究の創始者の一人。"},{"name":"ナサニエル・クライトマン","chapter":"v-心理学-神経科学-思想家","sub":6,"subCount":7,"tags":["dream","science"],"birth":1895,"death":1999,"href":"https://note.com/search?q=from%3A%40varelser%20%E3%83%8A%E3%82%B5%E3%83%8B%E3%82%A8%E3%83%AB%E3%83%BB%E3%82%AF%E3%83%A9%E3%82%A4%E3%83%88%E3%83%9E%E3%83%B3&context=note&mode=search","article":false,"descRaw":"（1895–1999）：米国シカゴ大学の生理学者。近代睡眠研究の父。『Sleep and Wakefulness』（1939）を著し、世界初の睡眠研究室を設けた。"},{"name":"金縛り／睡眠麻痺","chapter":"v-心理学-神経科学-思想家","sub":6,"subCount":7,"tags":["dream","culture"],"birth":null,"death":null,"href":"https://note.com/search?q=from%3A%40varelser%20%E9%87%91%E7%B8%9B%E3%82%8A%EF%BC%8F%E7%9D%A1%E7%9C%A0%E9%BA%BB%E7%97%BA&context=note&mode=search","article":false,"descRaw":"：目覚めの際にレム睡眠の筋無力だけが残り、身体が動かない状態。幻覚を伴うことも多く、日本の「金縛り」として知られる。"},{"name":"ナルコレプシー","chapter":"v-心理学-神経科学-思想家","sub":6,"subCount":7,"tags":["dream","clinical","science"],"birth":null,"death":null,"href":"https://note.com/search?q=from%3A%40varelser%20%E3%83%8A%E3%83%AB%E3%82%B3%E3%83%AC%E3%83%97%E3%82%B7%E3%83%BC&context=note&mode=search","article":false,"descRaw":"：覚醒を保つオレキシン（ヒポクレチン）神経の欠損による睡眠障害。日中の強い眠気と、感情で誘発される脱力（カタプレキシー）が特徴。"},{"name":"レイモンド・ムーディ","chapter":"v-心理学-神経科学-思想家","sub":7,"subCount":8,"tags":["science","religion"],"birth":1944,"death":null,"href":"https://note.com/search?q=from%3A%40varelser%20%E3%83%AC%E3%82%A4%E3%83%A2%E3%83%B3%E3%83%89%E3%83%BB%E3%83%A0%E3%83%BC%E3%83%87%E3%82%A3&context=note&mode=search","article":false,"descRaw":"（Raymond Moody・1944–・米）：『かいまみた死後の世界（Life After Life）』（1975）—臨死体験（NDE）の概念を学術的・社会的に定着させた創始的著作。"},{"name":"ケネス・リング","chapter":"v-心理学-神経科学-思想家","sub":7,"subCount":8,"tags":["science","religion"],"birth":1935,"death":null,"href":"https://note.com/varelser/n/n0254d529cda4","article":true,"descRaw":"（Kenneth Ring・1935–・米）：臨死体験の体系的研究。コア体験モデル。NDEの心理学的・変容的側面の解明。"},{"name":"エリザベス・キューブラー＝ロス","chapter":"v-心理学-神経科学-思想家","sub":7,"subCount":8,"tags":["clinical","theory"],"birth":1926,"death":2004,"href":"https://note.com/varelser/n/nf634a3a021ae","article":true,"descRaw":"（Elisabeth Kübler-Ross，1926–2004）：精神科医。末期患者への面接から「死の五段階」（否認・怒り・取引・抑うつ・受容）を提唱し、死の心理学を切り開いた。五段階説は死にゆく患者の反応の記述であり、段階が順序通り進むものではない点に注意。晩年は臨死体験に関心を移した。"},{"name":"デイヴィッド・チャーマーズ","chapter":"v-心理学-神経科学-思想家","sub":8,"subCount":9,"tags":["theory"],"birth":1966,"death":null,"href":"https://note.com/search?q=from%3A%40varelser%20%E3%83%87%E3%82%A4%E3%83%B4%E3%82%A3%E3%83%83%E3%83%89%E3%83%BB%E3%83%81%E3%83%A3%E3%83%BC%E3%83%9E%E3%83%BC%E3%82%BA&context=note&mode=search","article":false,"descRaw":"（David Chalmers・1966–）：意識のハードプロブレム。"},{"name":"ダニエル・デネット","chapter":"v-心理学-神経科学-思想家","sub":8,"subCount":9,"tags":["theory","science"],"birth":1942,"death":2024,"href":"https://note.com/search?q=from%3A%40varelser%20%E3%83%80%E3%83%8B%E3%82%A8%E3%83%AB%E3%83%BB%E3%83%87%E3%83%8D%E3%83%83%E3%83%88&context=note&mode=search","article":false,"descRaw":"（Daniel Dennett・1942–2024）：意識の多元的草稿モデル。"},{"name":"トマス・ネーゲル","chapter":"v-心理学-神経科学-思想家","sub":8,"subCount":9,"tags":["theory"],"birth":1937,"death":null,"href":"https://note.com/varelser/n/n86e13988c34a","article":true,"descRaw":"（Thomas Nagel・1937–）：「コウモリであるとはどのようなことか」—主観的体験の哲学。"},{"name":"フランシスコ・ヴァレラ","chapter":"v-心理学-神経科学-思想家","sub":8,"subCount":9,"tags":["theory","science"],"birth":1946,"death":2001,"href":"https://note.com/search?q=from%3A%40varelser%20%E3%83%95%E3%83%A9%E3%83%B3%E3%82%B7%E3%82%B9%E3%82%B3%E3%83%BB%E3%83%B4%E3%82%A1%E3%83%AC%E3%83%A9&context=note&mode=search","article":false,"descRaw":"（Francisco Varela・1946–2001）：オートポイエーシス、エナクティブ認知。"},{"name":"エヴァン・トンプソン","chapter":"v-心理学-神経科学-思想家","sub":8,"subCount":9,"tags":["theory","dream","practice"],"birth":1962,"death":null,"href":"https://note.com/search?q=from%3A%40varelser%20%E3%82%A8%E3%83%B4%E3%82%A1%E3%83%B3%E3%83%BB%E3%83%88%E3%83%B3%E3%83%97%E3%82%BD%E3%83%B3&context=note&mode=search","article":false,"descRaw":"（Evan Thompson・1962–）：『Waking, Dreaming, Being』—睡眠・夢・瞑想・死を現象学と認知科学で橋渡しした意識研究者。"},{"name":"アルワ・ノエ","chapter":"v-心理学-神経科学-思想家","sub":8,"subCount":9,"tags":["theory","science"],"birth":1964,"death":null,"href":"https://note.com/varelser/n/n746f8113aba0","article":true,"descRaw":"（Alva Noë・1964–）：「知覚は脳内で起きない」—行為としての知覚（Enactive Approach）。"},{"name":"スーザン・ブラックモア","chapter":"v-心理学-神経科学-思想家","sub":8,"subCount":9,"tags":["science","theory","religion"],"birth":1951,"death":null,"href":"https://note.com/search?q=from%3A%40varelser%20%E3%82%B9%E3%83%BC%E3%82%B6%E3%83%B3%E3%83%BB%E3%83%96%E3%83%A9%E3%83%83%E3%82%AF%E3%83%A2%E3%82%A2&context=note&mode=search","article":false,"descRaw":"（Susan Blackmore，1951–）：心理学者・意識研究者。1970年の体外離脱体験をきっかけに超心理学研究に入ったが、検証で再現できず懐疑論に転じた。『Dying to Live』では臨死体験を「死にゆく脳」の産物として説明した。"},{"name":"トーマス・メッツィンガー","chapter":"v-心理学-神経科学-思想家","sub":8,"subCount":9,"tags":["theory","science"],"birth":1958,"death":null,"href":"https://note.com/search?q=from%3A%40varelser%20%E3%83%88%E3%83%BC%E3%83%9E%E3%82%B9%E3%83%BB%E3%83%A1%E3%83%83%E3%83%84%E3%82%A3%E3%83%B3%E3%82%AC%E3%83%BC&context=note&mode=search","article":false,"descRaw":"（Thomas Metzinger，1958–）：哲学者。現象的自己モデル理論の提唱者で、自己とは脳が生成する透明な自己モデルであり、自我はそのモデルの内容にすぎないと論じた。Ⅸ章の自己モデル理論も参照。"},{"name":"アンドリュー・ニューバーグ","chapter":"v-心理学-神経科学-思想家","sub":9,"subCount":10,"tags":["science","religion","practice"],"birth":1966,"death":null,"href":"https://note.com/varelser/n/n8a4f407662b8","article":true,"descRaw":"（Andrew Newberg・1966–・米）：神経神学（neurotheology）の代表的研究者。やったこと：SPECT/PETなどの脳画像法を用いて、祈り・瞑想・宗教儀礼・スピリチュアル体験の神経相関を可視化し、この領域を医学・神経科学の文脈に定着させた。代表作：『Principles of Neurotheology』『How God Changes Your Brain』『The Neuroscience of Spirituality』。変性意識との関連：宗教的没入、祈り、瞑想、合一感などを主観報告だけでなく画像データと結びつけ、神秘体験を経験科学の対象へと押し広げた。"},{"name":"F.M.アレクサンダー","chapter":"v-心理学-神経科学-思想家","sub":10,"subCount":11,"tags":["practice","clinical"],"birth":1869,"death":1955,"href":"https://note.com/search?q=from%3A%40varelser%20F.M.%E3%82%A2%E3%83%AC%E3%82%AF%E3%82%B5%E3%83%B3%E3%83%80%E3%83%BC&context=note&mode=search","article":false,"descRaw":"（豪-英・1869–1955）：アレクサンダー・テクニークの創始者。やったこと：姿勢・発声・習慣的緊張の再教育法を確立した。代表作：『The Use of the Self』。変性意識との関連：意図と動作のあいだに介入し、反射的自己使用を停止することで、注意・身体感覚・自己知覚を変える実践を作った。"},{"name":"モーシェ・フェルデンクライス","chapter":"v-心理学-神経科学-思想家","sub":10,"subCount":11,"tags":["practice","clinical"],"birth":1904,"death":1984,"href":"https://note.com/search?q=from%3A%40varelser%20%E3%83%A2%E3%83%BC%E3%82%B7%E3%82%A7%E3%83%BB%E3%83%95%E3%82%A7%E3%83%AB%E3%83%87%E3%83%B3%E3%82%AF%E3%83%A9%E3%82%A4%E3%82%B9&context=note&mode=search","article":false,"descRaw":"（イスラエル・1904–1984）：フェルデンクライス・メソッドの創始者。やったこと：運動学習と神経可塑性を用いた身体再学習法を展開。代表作：『Awareness Through Movement』『The Potent Self』。変性意識との関連：微細な運動差と感覚注意によって自己像を変容させる、日常的かつ非薬理的な意識変容技法を提示した。"},{"name":"エルザ・ギンドラー","chapter":"v-心理学-神経科学-思想家","sub":10,"subCount":11,"tags":["practice"],"birth":1885,"death":1961,"href":"https://note.com/search?q=from%3A%40varelser%20%E3%82%A8%E3%83%AB%E3%82%B6%E3%83%BB%E3%82%AE%E3%83%B3%E3%83%89%E3%83%A9%E3%83%BC&context=note&mode=search","article":false,"descRaw":"（独・1885–1961）：身体感覚教育の先駆者。やったこと：呼吸・重力・微細感覚への注意を中心とした身体ワークを展開。代表作：講義記録・継承文献群。変性意識との関連：最小限の運動と感覚観察による意識の質的変化を追究し、多くの身体技法の源流となった。"},{"name":"ゲルダ・アレクサンダー","chapter":"v-心理学-神経科学-思想家","sub":10,"subCount":11,"tags":["practice"],"birth":1908,"death":1994,"href":"https://note.com/search?q=from%3A%40varelser%20%E3%82%B2%E3%83%AB%E3%83%80%E3%83%BB%E3%82%A2%E3%83%AC%E3%82%AF%E3%82%B5%E3%83%B3%E3%83%80%E3%83%BC&context=note&mode=search","article":false,"descRaw":"（独-デンマーク・1908–1994）：オイュトニー（Eutony）の創始者。やったこと：筋緊張・触覚・身体感覚の自己調整法を確立。代表作：『Eutony』。変性意識との関連：筋緊張の調整を通じて、自己境界・空間感覚・注意状態が変化することを実践的に示した。"},{"name":"イルゼ・ミッデンドルフ","chapter":"v-心理学-神経科学-思想家","sub":10,"subCount":11,"tags":["practice"],"birth":1910,"death":2009,"href":"https://note.com/search?q=from%3A%40varelser%20%E3%82%A4%E3%83%AB%E3%82%BC%E3%83%BB%E3%83%9F%E3%83%83%E3%83%87%E3%83%B3%E3%83%89%E3%83%AB%E3%83%95&context=note&mode=search","article":false,"descRaw":"（独・1910–2009）：呼吸ワークの実践家。やったこと：「経験される呼吸（Der erfahrbare Atem）」を提唱し、意志的に操作しすぎない呼吸感覚の教育法を発展。代表作：関連著作群。変性意識との関連：呼吸を制御対象ではなく経験対象として扱うことで、微細な意識相の変化を安定的に導く。"},{"name":"アイダ・ロルフ","chapter":"v-心理学-神経科学-思想家","sub":10,"subCount":11,"tags":["practice","clinical"],"birth":1896,"death":1979,"href":"https://note.com/search?q=from%3A%40varelser%20%E3%82%A2%E3%82%A4%E3%83%80%E3%83%BB%E3%83%AD%E3%83%AB%E3%83%95&context=note&mode=search","article":false,"descRaw":"（米・1896–1979）：ロルフィングの創始者。やったこと：筋膜・姿勢・重力との関係を再編する身体ワークを構築。代表作：『Rolfing』。変性意識との関連：身体の構造変化が知覚・情動・自己感覚を変えることを強調し、深い身体再編が意識変容と連動することを臨床的に示した。"},{"name":"レナード・オア","chapter":"v-心理学-神経科学-思想家","sub":10,"subCount":11,"tags":["practice","clinical"],"birth":1937,"death":2019,"href":"https://note.com/varelser/n/ne3df8ba1437c","article":true,"descRaw":"（米・1937–2019）：リバーシングの提唱者。やったこと：連続呼吸を用いた自己探究・情動解放法を普及。代表作：関連著作群。変性意識との関連：呼吸を通じて記憶・情動・身体感覚を動員し、非日常的気づきや回帰的体験を引き起こす系譜を作った。"},{"name":"ウィム・ホフ","chapter":"v-心理学-神経科学-思想家","sub":10,"subCount":11,"tags":["practice","science"],"birth":1959,"death":null,"href":"https://note.com/search?q=from%3A%40varelser%20%E3%82%A6%E3%82%A3%E3%83%A0%E3%83%BB%E3%83%9B%E3%83%95&context=note&mode=search","article":false,"descRaw":"（1959–）：オランダの「アイスマン」。呼吸法と寒冷暴露を組み合わせたメソッドを提唱し、2014年の研究で自律神経・免疫への意図的影響が示された。"},{"name":"ベッセル・ヴァン・デア・コーク","chapter":"v-心理学-神経科学-思想家","sub":11,"subCount":12,"tags":["clinical","practice","theory"],"birth":1943,"death":null,"href":"https://note.com/varelser/n/nf7b3abc01b81","article":true,"descRaw":"（Bessel van der Kolk・1943–）：『身体はトラウマを記録する』—トラウマと身体意識。"},{"name":"スティーブン・ポージェス","chapter":"v-心理学-神経科学-思想家","sub":11,"subCount":12,"tags":["theory","science","clinical"],"birth":1945,"death":null,"href":"https://note.com/varelser/n/ne9121f6b231b","article":true,"descRaw":"（Stephen Porges・1945–）：ポリヴェーガル理論—自律神経と安全の知覚。"},{"name":"ピーター・レヴィン","chapter":"v-心理学-神経科学-思想家","sub":11,"subCount":12,"tags":["clinical","practice"],"birth":1942,"death":null,"href":"https://note.com/varelser/n/nf8fd216c69bb","article":true,"descRaw":"（Peter Levine・1942–）：ソマティック・エクスペリエンシング—身体からのトラウマ解放。"},{"name":"ガボール・マテ","chapter":"v-心理学-神経科学-思想家","sub":11,"subCount":12,"tags":["clinical","theory"],"birth":1944,"death":null,"href":"https://note.com/search?q=from%3A%40varelser%20%E3%82%AC%E3%83%9C%E3%83%BC%E3%83%AB%E3%83%BB%E3%83%9E%E3%83%86&context=note&mode=search","article":false,"descRaw":"（Gabor Maté，1944–）：医師。依存症を道 eligion","culture","practice"],"birth":null,"death":null,"href":"https://note.com/search?q=from%3A%40varelser%20%E3%83%A0%E3%83%BC%E3%83%80%E3%83%B3&context=note&mode=search","article":false,"descRaw":"：韓国のシャーマン。多くは女性で、神降ろしの儀礼グッで神霊を招き、託宣・治癒・死者の送りを行う。"},{"name":"ネイティブ・アメリカン・チャーチ","chapter":"vi-シャーマニズム-薬物-宗教体験","sub":0,"subCount":1,"tags":["religion","substance","culture"],"birth":null,"death":null,"href":"https://note.com/search?q=from%3A%40varelser%20%E3%83%8D%E3%82%A4%E3%83%86%E3%82%A3%E3%83%96%E3%83%BB%E3%82%A2%E3%83%A1%E3%83%AA%E3%82%AB%E3%83%B3%E3%83%BB%E3%83%81%E3%83%A3%E3%83%BC%E3%83%81&context=note&mode=search","article":false,"descRaw":"：ペヨーテを聖餐とする先住民の宗教。1918年にオクラホマで法人化され、1994年の法改正で儀礼的使用が連邦法で保護された。"},{"name":"ヘレナ・P・ブラヴァツキー","chapter":"vii-瞑想-東洋思想-日本思想-宗教思想","sub":0,"subCount":1,"tags":["religion","theory"],"birth":1831,"death":1891,"href":"https://note.com/search?q=from%3A%40varelser%20%E3%83%98%E3%83%AC%E3%83%8A%E3%83%BBP%E3%83%BB%E3%83%96%E3%83%A9%E3%83%B4%E3%82%A1%E3%83%84%E3%82%AD%E3%83%BC&context=note&mode=search","article":false,"descRaw":"（Helena P. Blavatsky・1831–1891・露）：神智学協会の共同創設者。やったこと：近代オカルティズム、心霊主義、東西宗教思想を統合し、「古代の叡智」「霊的進化」「秘教的認識」という枠組みを大衆化した。代表作：『Isis Unveiled』『The Secret Doctrine』『The Key to Theosophy』『The Voice of the Silence』。変性意識との関連：霊視・媒介・アストラル光・秘教的知覚を近代的言説として体系化し、以後の芸術・宗教・心理学周辺の変性意識談義の巨大な母体を形成した。"},{"name":"アニー・ベサント","chapter":"vii-瞑想-東洋思想-日本思想-宗教思想","sub":0,"subCount":1,"tags":["religion","theory"],"birth":1847,"death":1933,"href":"https://note.com/search?q=from%3A%40varelser%20%E3%82%A2%E3%83%8B%E3%83%BC%E3%83%BB%E3%83%99%E3%82%B5%E3%83%B3%E3%83%88&context=note&mode=search","article":false,"descRaw":"（Annie Besant・1847–1933・英-印）：神智学協会会長、演説家、著述家。やったこと：神智学の教義を広く講演・出版し、教育・社会活動と結びつけながら意識進化論を普及させた。代表作：『Thought-Forms』（C.W.リードビーターと共著）『Esoteric Christianity』『A Study in Consciousness』。変性意識との関連：思考形態・オーラ・内的身体・意識の諸層という図式を広め、視覚芸術や神秘思想における「見えない意識内容の可視化」に大きな影響を与えた。"},{"name":"ルドルフ・シュタイナー","chapter":"vii-瞑想-東洋思想-日本思想-宗教思想","sub":0,"subCount":1,"tags":["religion","practice","theory"],"birth":1861,"death":1925,"href":"https://note.com/varelser/n/n4894622df5fc","article":true,"descRaw":"（Rudolf Steiner・1861–1925・墺-瑞）：人智学（Anthroposophy）の創始者。やったこと：霊的知覚の訓練を中核に、人智学協会、ゲーテアヌム、ヴァルドルフ教育、芸術・治療実践へと展開した。代表作：『自由の哲学』『神秘学概論（Occult Science: An Outline）』『An Outline of Esoteric Science』。変性意識との関連：人間はかつてより夢様の意識で世界に参与していたと考え、訓練された覚醒的意識によって再び霊的世界を知覚しうるという「意識訓練型」モデルを近代において大規模に提示した。"},{"name":"マルシリオ・フィチーノ","chapter":"vii-瞑想-東洋思想-日本思想-宗教思想","sub":1,"subCount":2,"tags":["religion","theory","practice"],"birth":1433,"death":1499,"href":"https://note.com/search?q=from%3A%40varelser%20%E3%83%9E%E3%83%AB%E3%82%B7%E3%83%AA%E3%82%AA%E3%83%BB%E3%83%95%E3%82%A3%E3%83%81%E3%83%BC%E3%83%8E&context=note&mode=search","article":false,"descRaw":"（伊・1433–1499）：ルネサンス期のプラトン主義者。やったこと：新プラトン主義・ヘルメス文書・音楽・占星術的想像力を統合し、魂の上昇と宇宙的共鳴の理論を整えた。代表作：『プラトン神学』『生命について（De vita libri tres）』。変性意識との関連：音楽・祈り・想像力・天体的対応を用いて意識状態を変えるという、近代以前の西洋的「意識技法」の重要な起点。"},{"name":"ジョルダーノ・ブルーノ","chapter":"vii-瞑想-東洋思想-日本思想-宗教思想","sub":1,"subCount":2,"tags":["theory","religion","practice"],"birth":1548,"death":1600,"href":"https://note.com/search?q=from%3A%40varelser%20%E3%82%B8%E3%83%A7%E3%83%AB%E3%83%80%E3%83%BC%E3%83%8E%E3%83%BB%E3%83%96%E3%83%AB%E3%83%BC%E3%83%8E&context=note&mode=search","article":false,"descRaw":"（伊・1548–1600）：哲学者・記憶術家・魔術思想家。やったこと：記憶術・イメージ操作・宇宙論・魔術理論を結びつけ、想像力を宇宙的認識の器官として高めた。代表作：『影の観念』『英雄的狂気について』。変性意識との関連：集中・イメージ・象徴配置による意識変容を、記憶術と魔術の交点で高度化した。"},{"name":"パラケルスス","chapter":"vii-瞑想-東洋思想-日本思想-宗教思想","sub":1,"subCount":2,"tags":["religion","science","clinical"],"birth":1493,"death":1541,"href":"https://note.com/search?q=from%3A%40varelser%20%E3%83%91%E3%83%A9%E3%82%B1%E3%83%AB%E3%82%B9%E3%82%B9&context=note&mode=search","article":false,"descRaw":"（スイス・1493–1541）：医師・錬金術師・自然哲学者。やったこと：化学的医療、対応論、小宇宙-大宇宙の思想を展開し、夢・幻視・霊的自然観を医学と結びつけた。代表作：『Paragranum』『Astronomia Magna』。変性意識との関連：治療・錬金術・自然霊論を通じて、身体変容と意識変容を連続的に理解する近代初期の基盤を作った。"},{"name":"エリファス・レヴィ","chapter":"vii-瞑想-東洋思想-日本思想-宗教思想","sub":1,"subCount":2,"tags":["religion","practice"],"birth":1810,"death":1875,"href":"https://note.com/search?q=from%3A%40varelser%20%E3%82%A8%E3%83%AA%E3%83%95%E3%82%A1%E3%82%B9%E3%83%BB%E3%83%AC%E3%83%B4%E3%82%A3&context=note&mode=search","article":false,"descRaw":"（仏・1810–1875）：近代西洋魔術復興の中心人物。やったこと：カバラ・タロット・儀礼魔術を近代的言語で再編し、19世紀オカルティズムの標準的図式を整えた。代表作：『高等魔術の教理と祭儀』。変性意識との関連：象徴操作・儀礼・集中・意志を通じた意識の変容を、秘教実践の技法として整理した。"},{"name":"パピュス","chapter":"vii-瞑想-東洋思想-日本思想-宗教思想","sub":1,"subCount":2,"tags":["religion","practice"],"birth":1865,"death":1916,"href":"https://note.com/search?q=from%3A%40varelser%20%E3%83%91%E3%83%94%E3%83%A5%E3%82%B9&context=note&mode=search","article":false,"descRaw":"（Papus / Gérard Encausse・1865–1916・仏）：医師・オカルティスト。やったこと：マルティニズム、カバラ、儀礼魔術の組織化と普及。代表作：『Traité méthodique de science occulte』。変性意識との関連：儀礼・象徴・意識階梯を実践共同体のなかで再現可能な形式へ整備した。"},{"name":"ディオン・フォーチュン","chapter":"vii-瞑想-東洋思想-日本思想-宗教思想","sub":1,"subCount":2,"tags":["religion","practice","theory"],"birth":1890,"death":1946,"href":"https://note.com/search?q=from%3A%40varelser%20%E3%83%87%E3%82%A3%E3%82%AA%E3%83%B3%E3%83%BB%E3%83%95%E3%82%A9%E3%83%BC%E3%83%81%E3%83%A5%E3%83%B3&context=note&mode=search","article":false,"descRaw":"（英・1890–1946）：オカルティスト・作家。やったこと：黄金の夜明け団以後の実践を継承し、心理学と西洋秘教を接続した。代表作：『The Mystical Qabalah』『Psychic Self-Defense』。変性意識との関連：想像力・象徴・防衛・霊的感受性を心理学的語彙で語り、儀礼実践と深層心理の橋渡しを行った。"},{"name":"オースティン・オスマン・スパー","chapter":"vii-瞑想-東洋思想-日本思想-宗教思想","sub":1,"subCount":2,"tags":["religion","art","practice"],"birth":1886,"death":1956,"href":"https://note.com/search?q=from%3A%40varelser%20%E3%82%AA%E3%83%BC%E3%82%B9%E3%83%86%E3%82%A3%E3%83%B3%E3%83%BB%E3%82%AA%E3%82%B9%E3%83%9E%E3%83%B3%E3%83%BB%E3%82%B9%E3%83%91%E3%83%BC&context=note&mode=search","article":false,"descRaw":"（英・1886–1956）：画家・魔術実践者。やったこと：シジル魔術、自動描画、ゾス=キア思想を展開した。代表作：『The Book of Pleasure』。変性意識との関連：無意識に印を刻むために、欲望・集中・恍惚・忘却を利用する方法を提示し、現代カオス魔術や自動描画の系譜に深く影響した。"},{"name":"イズラエル・リガルディー","chapter":"vii-瞑想-東洋思想-日本思想-宗教思想","sub":1,"subCount":2,"tags":["religion","practice"],"birth":1907,"death":1985,"href":"https://note.com/search?q=from%3A%40varelser%20%E3%82%A4%E3%82%BA%E3%83%A9%E3%82%A8%E3%83%AB%E3%83%BB%E3%83%AA%E3%82%AC%E3%83%AB%E3%83%87%E3%82%A3%E3%83%BC&context=note&mode=search","article":false,"descRaw":"（英-米・1907–1985）：オカルティズム文献の編纂・公開者。やったこと：黄金の夜明け団文書を整理・出版し、近代西洋儀礼魔術の知識基盤を可視化した。代表作：『The Golden Dawn』『The Middle Pillar』。変性意識との関連：呼吸・視覚化・儀礼・身体意識を用いる実践法を普及させ、秘教的意識技法を近代人が参照しうる形で残した。"},{"name":"ジョン・ディー","chapter":"vii-瞑想-東洋思想-日本思想-宗教思想","sub":1,"subCount":2,"tags":["religion","science","practice"],"birth":1527,"death":1608,"href":"https://note.com/search?q=from%3A%40varelser%20%E3%82%B8%E3%83%A7%E3%83%B3%E3%83%BB%E3%83%87%E3%82%A3%E3%83%BC&context=note&mode=search","article":false,"descRaw":"（John Dee，1527–1608）：エリザベス朝の数学者・占星術師・魔術師。透視者エドワード・ケリーとともに水晶による天使との交信を続け、天使語エノク語と48の呼びかけからなるエノク魔術の体系を残した。西洋儀礼魔術の源流の一つ。"},{"name":"イブン・アラビー","chapter":"vii-瞑想-東洋思想-日本思想-宗教思想","sub":2,"subCount":3,"tags":["religion","theory","dream"],"birth":1165,"death":1240,"href":"https://note.com/search?q=from%3A%40varelser%20%E3%82%A4%E3%83%96%E3%83%B3%E3%83%BB%E3%82%A2%E3%83%A9%E3%83%93%E3%83%BC&context=note&mode=search","article":false,"descRaw":"（Ibn al-ʿArabī・1165–1240・アンダルス-シリア）：スーフィー神秘思想の最大級の思想家。やったこと：存在一性、幻視、夢、啓示、想像力の働きを精緻に論じ、イスラーム神秘思想を巨大な形而上学へと高めた。代表作：『メッカ啓示録（al-Futūḥāt al-Makkiyya）』『知恵の台座（Fuṣūṣ al-ḥikam）』。変性意識との関連：夢・幻視・神的顕現を単なる主観ではなく存在論的に意味ある出来事として扱い、変性意識を世界理解の正統な様態として位置づけた。"},{"name":"アンリ・コルバン","chapter":"vii-瞑想-東洋思想-日本思想-宗教思想","sub":2,"subCount":3,"tags":["theory","religion","dream"],"birth":1903,"death":1978,"href":"https://note.com/varelser/n/n574214db8e9f","article":true,"descRaw":"（Henry Corbin・1903–1978・仏）：イスラーム神秘哲学研究の代表的思想家。やったこと：スフラワルディーやイブン・アラビーの思想を西洋に紹介し、「想像界 / mundus imaginalis（イマジナルな界）」という概念を広めた。代表作：『Creative Imagination in the Sufism of Ibn Arabi』『En Islam iranien』『History of Islamic Philosophy』。変性意識との関連：夢・ヴィジョン・象徴イメージを単なる空想ではなく、物質界と純粋知性界の中間にある実在的領域への知覚として再評価し、芸術・宗教・心理学を横断する理論的基盤を与えた。"},{"name":"老子","chapter":"vii-瞑想-東洋思想-日本思想-宗教思想",       const c = GRAPH_CHAPTERS.find((x) => x.id === id);
      return c ? c.label : (id || '');
    };

    const G = {
      built: false, nodes: [], edges: [], edgeByKey: new Map(), adj: [],
      stats: { nodes: 0, tagEdges: 0, mentionEdges: 0, colocRows: 0, colocPairs: 0, weakEdges: 0, relEdges: 0, relNew: 0, relUnmatched: 0, total: 0 },
      relList: [],
      open: false, mode: 'all', center: -1, defaultCenter: -1, depth2: false,
      edgeFilter: 'both', dim: '2d', showWeak: true,
      running: false, raf: null, autoRotate: false,
      rotX: -0.32, rotY: 0.55, scale: 1, ox: 0, oy: 0, viewTouched: false,
      selected: -1, hover: -1,
      // 力の調整（スライダーからの倍率。1.0 が既定値＝従来の力と等しい）
      force: { attract: 1, repel: 1, rest: 1, speed: 1 },
      coolFactor: 0, fitRaf: null, fitToken: 0,
      visible: null, visibleNodes: [], visEdges: [],
      localHop1: [], localParent: new Map(), degStrong: [], degWeak: [],
      tickCount: 0, calmTicks: 0, maxSpeed: 0,
      // 2Dマインドマップ用
      hub: null, chapterNodes: [], dimChapter: null, tween: null,
      // 切替直後のヒット判定用：到達する配置の画面座標（A2）
      settledSnap: null,
      hoverChapter: -1,
      mind: { r1: 280, r2: 520 }, localGroups: [],
    };

    const nextFrame = (typeof window.requestAnimationFrame === 'function')
      ? window.requestAnimationFrame.bind(window) : (cb) => setTimeout(cb, 16);
    const cancelFrame = (typeof window.cancelAnimationFrame === 'function')
      ? window.cancelAnimationFrame.bind(window) : (id) => clearTimeout(id);

    const edgeKey = (a, b) => (a < b ? a + '-' + b : b + '-' + a);

    function chapterAnchor(id) {
      const idx = GRAPH_CHAPTERS.findIndex((c) => c.id === id);
      const a = (idx < 0 ? 0 : idx) / GRAPH_CHAPTERS.length * Math.PI * 2;
      return { x: Math.cos(a) * 300, y: Math.sin(a) * 300, z: 0 };
    }

    function buildGraph() {
      if (G.built) return;
      // 単独ページ（knowledgenetwork-graph.html）では埋め込み JSON
      // （KN_GRAPH_DATA）から構築し、一覧ページに埋め込まれている場合は
      // 従来どおり DOM（.layout .person-link）から構築する。JSON の
      // descRaw は一覧ページの li テキストから抽出したもので、descOfLi
      // と同じ整形で desc を作る（言及辺の判定は descRaw を使う）。
      const data = (typeof window !== 'undefined' && window.KN_GRAPH_DATA) || null;
      const anchors = data ? [] : Array.from(document.querySelectorAll('.layout .person-link'));
      const nodes = (data ? data.entries : anchors).map((src, i) => {
        if (data) {
          const anchor = chapterAnchor(src.chapter || '');
          return {
            i, name: src.name,
            core: src.name.split('（')[0].split('(')[0].trim(),
            chapter: src.chapter || '',
            sub: src.sub || 0, subCount: src.subCount || 1,
            tags: src.tags || [],
            birth: src.birth != null ? src.birth : null,
            death: src.death != null ? src.death : null,
            href: src.href || '', article: !!src.article,
            desc: cleanDesc(src.descRaw || ''),
            descRaw: src.descRaw || '',
            el: null,
            ax: anchor.x, ay: anchor.y, az: anchor.z,
            x: 0, y: 0, z: 0, vx: 0, vy: 0, vz: 0, fx: 0, fy: 0, fz: 0,
            fixed: false, sx: 0, sy: 0, sr: 3, sdepth: 0, sf: 1,
          };
        }
        const a = src;
        const sec = a.closest('.section-block');
        const subSec = a.closest('.subsection-block');
        const name = a.dataset.person || a.textContent.trim();
        const anchor = chapterAnchor(sec ? sec.id : '');
        // 小節：マインドマップで章の扇形の中で小節ごとにまとめるための番号。
        // 小節がない章（Ⅵ・Ⅷ）は 0。
        let subIdx = 0, subCount = 1;
        if (subSec && sec) {
          const subs = Array.from(sec.querySelectorAll('.subsection-block'));
          subIdx = Math.max(0, subs.indexOf(subSec));
          subCount = Math.max(1, subs.length);
        }
        return {
          i, name,
          core: name.split('（')[0].split('(')[0].trim(),
          chapter: sec ? sec.id : '',
          sub: subIdx, subCount,
          tags: (a.dataset.tags || '').split(/\s+/).filter(Boolean),
          birth: a.dataset.birth ? parseInt(a.dataset.birth, 10) : null,
          death: a.dataset.death ? parseInt(a.dataset.death, 10) : null,
          href: a.href, article: a.classList.contains('has-article'),
          desc: descOfLi(a.closest('li')),
          descRaw: '',
          el: a,
          ax: anchor.x, ay: anchor.y, az: anchor.z,
          x: 0, y: 0, z: 0, vx: 0, vy: 0, vz: 0, fx: 0, fy: 0, fz: 0,
          fixed: false, sx: 0, sy: 0, sr: 3, sdepth: 0, sf: 1,
        };
      });
      const byCore = new Map();
      nodes.forEach((n) => {
        if (!byCore.has(n.core)) byCore.set(n.core, []);
        byCore.get(n.core).push(n.i);
      });
      // 別名：名前の最後の区切り（・／空白／＝）の後の部分（2文字以上）。
      // 2件以上の項目に対応する曖昧な別名と、一般名詞として誤検出しやすい
      // 別名（サックス＝楽器、行動・マインド＝一般語）は除外する。
      const EXCLUDED_ALIASES = new Set(['サックス', '行動', 'マインド']);
      const aliasToIdx = new Map();
      nodes.forEach((n) => {
        const parts = n.core.split(/[・ 　＝]/);
        const last = parts.length > 1 ? parts[parts.length - 1].trim() : '';
        if ([...last].length >= 2 && last !== n.core) {
          if (!aliasToIdx.has(last)) aliasToIdx.set(last, new Set());
          aliasToIdx.get(last).add(n.i);
        }
      });
      // マッチ対象：コア名＋曖昧でない別名（長い順）
      const matchStrs = [];
      for (const [c, idxs] of byCore) {
        if ([...c].length < 2) continue;
        for (const idx of idxs) matchStrs.push({ str: c, idx, alias: false });
      }
      for (const [a, set] of aliasToIdx) {
        if (set.size === 1 && !EXCLUDED_ALIASES.has(a)) {
          matchStrs.push({ str: a, idx: [...set][0], alias: true });
        }
      }
      matchStrs.sort((x, y) => [...y.str].length - [...x.str].length);
      // 別名の一致はカタカナ語の途中に埋もれたものを数えない
      // （例：「セス」は「プロセス」の一部、「グレイ」は「グレイソン」の一部）。
      const isKata = (ch) => {
        const c = ch.charCodeAt(0);
        return c >= 0x30a0 && c <= 0x30ff;
      };
      const aliasHit = (desc, s) => {
        let start = 0;
        for (;;) {
          const i = desc.indexOf(s, start);
          if (i < 0) return false;
          const before = i > 0 ? desc[i - 1] : '';
          const after = i + s.length < desc.length ? desc[i + s.length] : '';
          const badBefore = before && isKata(before) && isKata(s[0]);
          const badAfter = after && isKata(after) && isKata(s[s.length - 1]);
          if (!badBefore && !badAfter) return true;
          start = i + 1;
        }
      };

      // 共有タグ数（全ペア）。タグ辺は3つ以上共有のものだけを辺として保持する。
      const tagIndex = new Map();
      nodes.forEach((n) => n.tags.forEach((t) => {
        if (!tagIndex.has(t)) tagIndex.set(t, []);
        tagIndex.get(t).push(n.i);
      }));
      const shared = new Map();
      for (const list of tagIndex.values()) {
        for (let x = 0; x < list.length; x++) {
          for (let y = x + 1; y < list.length; y++) {
            const k = edgeKey(list[x], list[y]);
            shared.set(k, (shared.get(k) || 0) + 1);
          }
        }
      }

      G.degStrong = nodes.map(() => 0);
      const edges = [];
      const edgeByKey = new Map();
      const addEdge = (a, b, patch) => {
        const k = edgeKey(a, b);
        let e = edgeByKey.get(k);
        if (!e) {
          e = { a: Math.min(a, b), b: Math.max(a, b), tag: 0, mention: false, coloc: false };
          edgeByKey.set(k, e);
          edges.push(e);
          G.degStrong[a]++;
          G.degStrong[b]++;
        }
        Object.assign(e, patch);
        return e;
      };
      let tagEdges = 0;
      for (const [k, w] of shared) {
        if (w < 3) continue;
        const [a, b] = k.split('-').map(Number);
        addEdge(a, b, { tag: w });
        tagEdges++;
      }

      // 言及辺：説明文（liのテキストから項目名・関連・タグ表示を除いたもの）に
      // 他項目のコア名が含まれるペア。長い名前を優先し、短い名前が長い名前の
      // 部分文字列としてだけ現れる場合は長い方だけを採用する。
      const descText = (li) => {
        const clone = li.cloneNode(true);
        clone.querySelectorAll('.person-link, .related, .tags').forEach((el) => el.remove());
        return clone.textContent;
      };
      let mentionEdges = 0;
      const mentionSet = new Set();
      nodes.forEach((n) => {
        // JSON では descRaw を、DOM では li テキストを使う（同じ文字列）。
        const desc = n.el ? descText(n.el.closest('li')) : (n.descRaw || '');
        if (!desc) return;
        // 最も長い一致文字列を項目ごとに保持する
        const hitStr = new Map();
        for (const m of matchStrs) {
          if (m.idx === n.i) continue;
          const ok = m.alias ? aliasHit(desc, m.str) : desc.includes(m.str);
          if (!ok) continue;
          const prev = hitStr.get(m.idx);
          if (prev === undefined || [...m.str].length > [...prev].length) hitStr.set(m.idx, m.str);
        }
        const hitArr = Array.from(hitStr.keys());
        const drop = new Set();
        for (const h of hitArr) {
          for (const o of hitArr) {
            if (h !== o && nodes[o].core.length > [...hitStr.get(h)].length
              && nodes[o].core.includes(hitStr.get(h))) drop.add(h);
          }
        }
        for (const h of hitArr) {
          if (drop.has(h)) continue;
          const k = edgeKey(n.i, h);
          if (mentionSet.has(k)) continue;
          mentionSet.add(k);
          addEdge(n.i, h, { mention: true });
          mentionEdges++;
        }
      });

      // 同行ペア：1つのliを2名以上が共有する行の全ペア（言及辺として扱う）。
      // JSON では transform9.py が抽出した同行グループを使い、DOM では
      // .person-list li からその場で集める（同じ結果）。
      const colocGroups = (data && data.colocGroups) ? data.colocGroups : (() => {
        const groups = [];
        document.querySelectorAll('.person-list li').forEach((li) => {
          const as = Array.from(li.querySelectorAll('.person-link'));
          if (as.length < 2) return;
          groups.push(as.map((a) => anchors.indexOf(a)).filter((v) => v >= 0));
        });
        return groups;
      })();
      let colocRows = 0, colocPairs = 0;
      for (const idxs of colocGroups) {
        if (idxs.length < 2) continue;
        colocRows++;
        for (let x = 0; x < idxs.length; x++) {
          for (let y = x + 1; y < idxs.length; y++) {
            addEdge(idxs[x], idxs[y], { coloc: true });
            colocPairs++;
          }
        }
      }

      // 交流辺：relationships.json（調査済みの交友・交流61本。出典URL付き）。
      // 既存の辺と重複するペアは1本の辺に「交流」の属性を追加するだけ
      // （重複除去のルールは既存のものと同じ）。
      let relEdges = 0, relNew = 0, relUnmatched = 0;
      let REL_DATA = [];
      try {
        const relEl = document.getElementById('kn-relationships');
        if (relEl) REL_DATA = JSON.parse(relEl.textContent || '[]');
      } catch (_) { REL_DATA = []; }
      const byName = new Map();
      nodes.forEach((n) => { if (!byName.has(n.name)) byName.set(n.name, n.i); });
      const relList = [];
      for (const r of REL_DATA) {
        const a = byName.get(r.a), b = byName.get(r.b);
        if (a === undefined || b === undefined || a === b) { relUnmatched++; continue; }
        relEdges++;
        const before = edgeByKey.size;
        addEdge(a, b, { rel: { type: r.type || '', note: r.note || '', source: r.source || '' } });
        if (edgeByKey.size > before) relNew++;
        relList.push({ a, b, type: r.type || '', note: r.note || '', source: r.source || '' });
      }
      G.relList = relList;

      // 弱い辺：タグ2つ以上共有のうち、各項目の共有タグ数上位3件まで。
      // すでに強い辺（3つ以上共通／言及／同行）のペアは弱い辺にしない。
      const nbrs = nodes.map(() => []);
      for (const [k, w] of shared) {
        if (w < 2) continue;
        const [a, b] = k.split('-').map(Number);
        nbrs[a].push([w, b]);
        nbrs[b].push([w, a]);
      }
      let weakEdges = 0;
      G.degWeak = nodes.map(() => 0);
      const weakSeen = new Set();
      for (let i = 0; i < nodes.length; i++) {
        const top = nbrs[i].sort((x, y) => y[0] - x[0]).slice(0, 3);
        for (const [w, j] of top) {
          const k = edgeKey(i, j);
          if (weakSeen.has(k) || edgeByKey.has(k)) continue;
          weakSeen.add(k);
          const e = { a: Math.min(i, j), b: Math.max(i, j), tag: w, weak: true, mention: false, coloc: false };
          edgeByKey.set(k, e);
          edges.push(e);
          G.degWeak[i]++;
          G.degWeak[j]++;
          weakEdges++;
        }
      }

      // 隣接リスト（周辺表示用。タグは1つ以上の共有で隣接とみなす）
      const adj = nodes.map(() => new Map());
      const adjAdd = (a, b, patch) => {
        let e = adj[a].get(b);
        if (!e) { e = { to: b, tagW: 0, mention: false, coloc: false }; adj[a].set(b, e); }
        Object.assign(e, patch);
        let r = adj[b].get(a);
        if (!r) { r = { to: a, tagW: 0, mention: false, coloc: false }; adj[b].set(a, r); }
        Object.assign(r, patch);
      };
      for (const [k, w] of shared) {
        const [a, b] = k.split('-').map(Number);
        adjAdd(a, b, { tagW: w });
      }
      for (const k of mentionSet) {
        const [a, b] = k.split('-').map(Number);
        adjAdd(a, b, { mention: true });
      }
      for (const idxs of colocGroups) {
        if (idxs.length < 2) continue;
        for (let x = 0; x < idxs.length; x++) {
          for (let y = x + 1; y < idxs.length; y++) adjAdd(idxs[x], idxs[y], { coloc: true });
        }
      }
      for (const r of relList) adjAdd(r.a, r.b, { rel: true });

      G.nodes = nodes;
      G.edges = edges;
      G.edgeByKey = edgeByKey;
      G.adj = adj.map((m) => Array.from(m.values()));
      G.stats = { nodes: nodes.length, tagEdges, mentionEdges, colocRows, colocPairs, weakEdges, relEdges, relNew, relUnmatched, total: edges.length };
      // 既定の中心：最もつながりの多いノード
      let best = -1, bestDeg = -1;
      G.adj.forEach((list, i) => { if (list.length > bestDeg) { bestDeg = list.length; best = i; } });
      G.defaultCenter = best;
      G.center = best;
      // 初期配置：章のアンカー周辺に散らす
      nodes.forEach((n) => placeAtAnchor(n));
      G.built = true;
      // 中心ノード選択用の datalist
      const dl = document.getElementById('graph-names');
      if (dl) {
        const frag = document.createDocumentFragment();
        nodes.forEach((n) => {
          const o = document.createElement('option');
          o.value = n.name;
          frag.appendChild(o);
        });
        dl.appendChild(frag);
      }
    }

    function placeAtAnchor(n) {
      const ang = Math.random() * Math.PI * 2;
      const r = Math.random() * 80;
      n.x = n.ax + Math.cos(ang) * r;
      n.y = n.ay + Math.sin(ang) * r;
      n.z = (Math.random() - 0.5) * (G.dim === '3d' ? 200 : 0);
      n.vx = n.vy = n.vz = 0;
    }

    // 周辺表示の初期配置：中心を原点に固定し、隣接ノードを放射状に置く。
    function placeLocalRadial() {
      if (G.mode !== 'local' || G.center < 0) return;
      G.settledSnap = null; // 目標配置のスナップショットは無効になる
      const c = G.nodes[G.center];
      c.x = 0; c.y = 0; c.z = 0; c.vx = 0; c.vy = 0; c.vz = 0; c.fixed = true;
      const hop1 = G.localHop1 || [];
      const n1 = hop1.length;
      hop1.forEach((idx, k) => {
        const n = G.nodes[idx];
        const ang = (k / Math.max(1, n1)) * Math.PI * 2 + (Math.random() - 0.5) * 0.25;
        const r = 185 + (k % 3) * 45 + Math.random() * 20;
        n.x = Math.cos(ang) * r;
        n.y = Math.sin(ang) * r;
        n.z = G.dim === '3d' ? (Math.random() - 0.5) * 160 : 0;
        n.vx = 0; n.vy = 0; n.vz = 0; n.fixed = false;
      });
      for (const [idx, from] of G.localParent) {
        const n = G.nodes[idx], p = G.nodes[from];
        const ang = Math.atan2(p.y, p.x) + (Math.random() - 0.5) * 0.5;
        const r = Math.hypot(p.x, p.y) + 135 + Math.random() * 60;
        n.x = Math.cos(ang) * r;
        n.y = Math.sin(ang) * r;
        n.z = G.dim === '3d' ? (Math.random() - 0.5) * 160 : 0;
        n.vx = 0; n.vy = 0; n.vz = 0; n.fixed = false;
      }
    }

    /* ---- 2Dマインドマップ（決定論的レイアウト。力学的シミュレーションは走らない） ---- */
    // 全体図：中心ハブ「変性意識」＋9章を枝とする放射状マインドマップ。
    // 章の扇形の角度幅は項目数に比例。上から時計回り（-90°起点）。
    function computeChapterSectors() {
      const counts = GRAPH_CHAPTERS.map((c) => G.nodes.filter((n) => n.chapter === c.id).length);
      const total = counts.reduce((a, b) => a + b, 0) || 1;
      let a = -Math.PI / 2;
      return GRAPH_CHAPTERS.map((c, i) => {
        const span = counts[i] / total * Math.PI * 2;
        const s = { id: c.id, label: c.label, short: c.short, color: c.color, count: counts[i], start: a, span, mid: a + span / 2 };
        a += span;
        return s;
      });
    }

    function layoutMindmapAll() {
      G.settledSnap = null; // 目標配置のスナップショットは無効になる
      const spread = G.force.attract; // 吸引力スライダー＝広がり（半径の倍率）
      const sectors = computeChapterSectors();
      G.hub = { x: 0, y: 0, sx: 0, sy: 0 };
      G.chapterNodes = [];
      const R1 = 300 * spread;
      for (const s of sectors) {
        G.chapterNodes.push({ ...s, x: Math.cos(s.mid) * R1, y: Math.sin(s.mid) * R1, sx: 0, sy: 0 });
      }
      const RIN = 520 * spread, ROUT = RIN + 540 * G.force.rest * spread;
      for (const s of sectors) {
        const items = G.nodes.filter((n) => n.chapter === s.id);
        // DOM順＝小節順。半径は小節で帯状に分け、同じ小節が同じ半径の弧になる。
        const maxSub = Math.max(0, ...items.map((n) => n.sub || 0));
        items.forEach((n, k) => {
          const ang = s.start + (k + 0.5) / Math.max(1, items.length) * s.span;
          const band = maxSub > 0 ? (n.sub || 0) / maxSub : 0.5;
          const r = RIN + band * (ROUT - RIN);
          n.x = Math.cos(ang) * r;
          n.y = Math.sin(ang) * r;
          n.z = 0; n.vx = 0; n.vy = 0; n.vz = 0; n.fixed = false;
        });
      }
    }

    // 章ラベルの配置（2D全体図のみ）：章ドットからハブと反対方向（弧の外側）
    // へずらし、ハブラベル・章ドット・他の章ラベルと重ならない位置を探す。
    // 狭い扇形の章ほど外側へ押し出される。9章すべて必ず描く（スキップしない）。
    // 描画とテストで共通の純粋関数。戻り値: { hub, hubBox, items: [...] }。
    function computeChapterLabelLayout() {
      if (G.dim !== '2d' || G.mode !== 'all' || !G.hub || !G.chapterNodes || !G.chapterNodes.length) return null;
      const hp = project(G.hub);
      G.hub.sx = hp.x; G.hub.sy = hp.y;
      for (const cn of G.chapterNodes) {
        const cp = project(cn);
        cn.sx = cp.x; cn.sy = cp.y;
      }
      const boxHitsCircle = (box, cx, cy, r) => {
        const nx = Math.max(box.x0, Math.min(cx, box.x1));
        const ny = Math.max(box.y0, Math.min(cy, box.y1));
        return Math.hypot(cx - nx, cy - ny) < r + 2;
      };
      const boxesOverlap = (a, b) => a.x0 < b.x1 && a.x1 > b.x0 && a.y0 < b.y1 && a.y1 > b.y0;
      // ハブラベル「変性意識」（bold 13px、ハブの下26pxに描画）
      const hubBox = { x0: hp.x - 30, y0: hp.y + 16, x1: hp.x + 30, y1: hp.y + 36 };
      const placed = [hubBox];
      const items = [];
      for (const cn of [...G.chapterNodes].sort((a, b) => b.count - a.count)) {
        const num = cn.label.split(' ')[0];
        const w1 = num.length * 12, w2 = cn.short.length * 12;
        const boxW = Math.max(w1, w2) + 8;
        let dx = cn.sx - hp.x, dy = cn.sy - hp.y;
        const dl = Math.hypot(dx, dy) || 1;
        dx /= dl; dy /= dl;
        const px = -dy, py = dx;
        const cands = [];
        for (const d of [30, 48, 66, 84, 102, 120]) {
          for (const t of [0, -22, 22, -44, 44]) {
            cands.push({ ax: cn.sx + dx * d + px * t, ay: cn.sy + dy * d + py * t });
          }
        }
        let chosen = cands[cands.length - 1];
        for (const c of cands) {
          const box = { x0: c.ax - boxW / 2, y0: c.ay - 16, x1: c.ax + boxW / 2, y1: c.ay + 15 };
          let clash = false;
          for (const b of placed) {
            if (boxesOverlap(box, b)) { clash = true; break; }
          }
          if (!clash) {
            for (const o of G.chapterNodes) {
              if (boxHitsCircle(box, o.sx, o.sy, 9)) { clash = true; break; }
            }
          }
          if (!clash) { chosen = c; break; }
        }
        const box = { x0: chosen.ax - boxW / 2, y0: chosen.ay - 16, x1: chosen.ax + boxW / 2, y1: chosen.ay + 15 };
        placed.push(box);
        items.push({ id: cn.id, label: cn.label, short: cn.short, num, color: cn.color, count: cn.count, x: chosen.ax, y: chosen.ay, box });
      }
      return { hub: { x: hp.x, y: hp.y }, hubBox, items };
    }

    // 周辺表示：中心人物を真ん中に、1段目を内側の円、2段目を外側の円に並べる
    // 同心円マインドマップ。1段目は辺の種類（交流／言及・同行／タグ）で
    // グループ化し、グループごとに扇形を割り当てる。戻り値は目標位置のMap。
    function computeLocalMindmapTargets() {
      const targets = new Map();
      const c = G.center;
      if (c < 0) return targets;
      targets.set(c, { x: 0, y: 0 });
      const spread = G.force.attract; // 吸引力＝広がり
      const gap = G.force.rest; // バネの長さ＝円の間隔
      const R1 = 280 * spread;
      const R2 = R1 + 240 * gap;
      G.mind = { r1: R1, r2: R2 };
      const adj = G.adj[c] || [];
      const kindOf = (idx) => {
        const e = adj.find((x) => x.to === idx);
        if (!e) return 'tag';
        if (e.rel) return 'rel';
        if (e.mention || e.coloc) return 'mention';
        return 'tag';
      };
      const hop1 = G.localHop1 || [];
      const groups = [
        { kind: 'rel', items: hop1.filter((i) => kindOf(i) === 'rel') },
        { kind: 'mention', items: hop1.filter((i) => kindOf(i) === 'mention') },
        { kind: 'tag', items: hop1.filter((i) => kindOf(i) === 'tag') },
      ].filter((g) => g.items.length > 0);
      // グループの角度幅：項目数に比例、ただし最低 0.45rad。合計が2πを
      // 超える場合は比例配分で縮める。
      const total = hop1.length || 1;
      let rawSum = 0;
      for (const g of groups) {
        g.rawSpan = Math.max(0.45, (g.items.length / total) * Math.PI * 2);
        rawSum += g.rawSpan;
      }
      const scale = rawSum > Math.PI * 2 ? (Math.PI * 2) / rawSum : 1;
      let a = -Math.PI / 2;
      const angleOf = new Map();
      for (const g of groups) {
        g.span = g.rawSpan * scale;
        g.start = a;
        g.items.forEach((idx, k) => {
          const ang = a + (k + 0.5) / g.items.length * g.span;
          angleOf.set(idx, ang);
          targets.set(idx, { x: Math.cos(ang) * R1, y: Math.sin(ang) * R1 });
        });
        a += g.span;
      }
      G.localGroups = groups;
      // 2段目：親の角度を中心とした扇形に並べる（外側の円）
      const byParent = new Map();
      for (const [idx, from] of G.localParent) {
        if (!byParent.has(from)) byParent.set(from, []);
        byParent.get(from).push(idx);
      }
      for (const [from, kids] of byParent) {
        const pa = angleOf.has(from) ? angleOf.get(from) : 0;
        const wedge = Math.min(0.9, 0.28 * kids.length + 0.2);
        kids.forEach((idx, k) => {
          const ang = pa + (k - (kids.length - 1) / 2) * (wedge / Math.max(1, kids.length));
          angleOf.set(idx, ang);
          targets.set(idx, { x: Math.cos(ang) * R2, y: Math.sin(ang) * R2 });
        });
      }
      return targets;
    }

    // 中心切替・モード切替時の補間アニメーション（easeOutCubic）。
    // 速度スライダーは2Dでは切替アニメーションの速さとして読む。
    function tweenDuration() {
      return Math.round(600 / Math.max(0.3, G.force.speed || 1));
    }

    function startTween(targets, durMs, onDone) {
      if (!targets || targets.size === 0) return;
      const from = new Map();
      for (const [idx] of targets) {
        const n = G.nodes[idx];
        if (n) from.set(idx, { x: n.x, y: n.y });
      }
      G.tween = {
        active: true,
        t0: tweenNow(),
        dur: durMs || tweenDuration(),
        from, to: targets,
        onDone: onDone || null,
        testExtra: 0,
      };
      G.running = true;
      updatePlayBtn();
      if (G.raf == null) G.raf = nextFrame(frameLoop);
    }

    function tweenNow() {
      return (typeof performance !== 'undefined' && performance.now) ? performance.now() : Date.now();
    }

    function advanceTween() {
      const tw = G.tween;
      if (!tw || !tw.active) return;
      const t = Math.min(1, (tweenNow() - tw.t0 + (tw.testExtra || 0)) / tw.dur);
      const e = 1 - Math.pow(1 - t, 3);
      for (const [idx, pos] of tw.to) {
        const f = tw.from.get(idx);
        const n = G.nodes[idx];
        if (!f || !n) continue;
        n.x = f.x + (pos.x - f.x) * e;
        n.y = f.y + (pos.y - f.y) * e;
        n.z = 0;
      }
      if (t >= 1) {
        tw.active = false;
        G.running = false;
        updatePlayBtn();
        // フィット・アニメーションが既に走っている場合（全体図への切替で
        // 並行して開始したもの）は再起動しない。
        if (!G.viewTouched && G.open && G.fitRaf == null) animateFit(650);
        if (tw.onDone) tw.onDone();
      }
    }

    function cancelTween() {
      if (G.tween) G.tween.active = false;
    }

    // スライダー（吸引力＝広がり、バネの長さ＝円の間隔）の変更時に即座に再配置。
    // ドラッグ中の連続入力でも追従するよう、補間なしで置き直す。
    function applyMindmapSpread() {
      cancelTween();
      G.settledSnap = null; // 目標配置のスナップショットは無効になる
      if (G.mode === 'all') {
        layoutMindmapAll();
      } else if (G.mode === 'local') {
        const t = computeLocalMindmapTargets();
        for (const [idx, p] of t) {
          const n = G.nodes[idx];
          if (!n) continue;
          n.x = p.x; n.y = p.y; n.z = 0; n.vx = 0; n.vy = 0; n.vz = 0;
        }
      }
      draw();
    }

    // スライダーと自動回転の2Dでの扱い：反発力と自動回転は3Dのみで無効化。
    // 吸引力＝広がり、バネの長さ＝円の間隔、速度＝切替アニメーションの速さ
    // としてマインドマップに読み替える。ラベルもそれに合わせて変える。
    function updateSliderStates() {
      const is2d = G.dim === '2d';
      const repel = document.getElementById('graph-f-repel');
      if (repel) repel.disabled = is2d;
      const rotate = document.getElementById('graph-rotate');
      if (rotate) rotate.disabled = is2d;
      const names = {
        'graph-f-attract-name': is2d ? '広がり' : '吸引力',
        'graph-f-repel-name': is2d ? '反発力（3Dのみ）' : '反発力',
        'graph-f-rest-name': is2d ? '円の間隔' : 'バネの長さ',
        'graph-f-speed-name': is2d ? '切替の速さ' : '速度',
      };
      for (const [id, text] of Object.entries(names)) {
        const el = document.getElementById(id);
        if (el) el.textContent = text;
      }
      const note = document.getElementById('graph-f-note');
      if (note) {
        note.textContent = is2d
          ? '2Dマインドマップ：広がり＝全体の半径、円の間隔＝内外の円の間隔、切替の速さ＝中心切替アニメーションの速さ。反発力・自動回転は3Dのみ。'
          : '3D：力学的シミュレーション';
      }
    }

    // リセット：4つのスライダーもすべて×1.0に戻す（値・表示・ラベル名）。
    function resetForceSliders() {
      G.force = { attract: 1, repel: 1, rest: 1, speed: 1 };
      const ids = ['graph-f-attract', 'graph-f-repel', 'graph-f-rest', 'graph-f-speed'];
      for (const id of ids) {
        const input = document.getElementById(id);
        if (input) input.value = '1';
        const val = document.getElementById(id + '-val');
        if (val) val.textContent = '×1.0';
      }
      updateSliderStates();
    }

    // 章ノードのヒット判定（2D全体図のみ）
    function hitChapter(px, py) {
      if (G.dim !== '2d' || G.mode !== 'all' || !G.chapterNodes) return -1;
      syncScreenCoords();
      let best = -1, bestD = Infinity;
      for (let i = 0; i < G.chapterNodes.length; i++) {
        const cn = G.chapterNodes[i];
        if (!isFinite(cn.sx) || !isFinite(cn.sy)) continue;
        const d = Math.hypot(cn.sx - px, cn.sy - py);
        if (d < 18 && d < bestD) { bestD = d; best = i; }
      }
      return best;
    }

    // 章の枝のクリック：その章の項目だけを強調表示（他を薄くする）。
    // もう一度クリックすると解除する。
    function toggleDimChapter(ci) {
      const cn = G.chapterNodes[ci];
      if (!cn) return;
      if (G.dimChapter === cn.id) {
        G.dimChapter = null;
        renderDetail(G.selected);
      } else {
        G.dimChapter = cn.id;
        renderChapterDetail(cn);
      }
      draw();
    }

    function renderChapterDetail(cn) {
      const d = document.getElementById('graph-detail');
      if (!d) return;
      d.innerHTML = '';
      const h = document.createElement('h3');
      h.textContent = cn.label;
      d.appendChild(h);
      const meta = document.createElement('div');
      meta.className = 'gd-meta';
      meta.textContent = '項目 ' + cn.count + '件 — この章の項目を強調表示しています。';
      d.appendChild(meta);
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.textContent = '強調表示を解除';
      btn.addEventListener('click', () => {
        G.dimChapter = null;
        renderDetail(G.selected);
        draw();
      });
      d.appendChild(btn);
    }

    // 初期表示で大枠ができた状態にするための事前ステップ
    function warmup(n) {
      for (let i = 0; i < n; i++) stepSim();
      G.tickCount = 0;
      G.calmTicks = 0;
      G.coolFactor = 0;
    }

    function edgeShown(e, mode) {
      if (e.weak && !G.showWeak) return false;
      if (G.edgeFilter === 'tag') return e.tag > 0;
      if (G.edgeFilter === 'mention') return e.mention || e.coloc || e.rel;
      return true;
    }

    function computeVisible() {
      // 可視集合が変わるので、目標配置のスナップショットは無効になる
      G.settledSnap = null;
      if (G.mode === 'all') {
        G.visible = new Set(G.nodes.map((n) => n.i));
        G.visEdges = G.edges.filter((e) => edgeShown(e, 'all'));
      } else {
        const c = G.center;
        const adj = (c >= 0 && G.adj[c]) ? G.adj[c] : [];
        const byRel = (a, b) => {
          const am = (a.mention || a.coloc || a.rel) ? 1 : 0, bm = (b.mention || b.coloc || b.rel) ? 1 : 0;
          if (bm !== am) return bm - am;
          return b.tagW - a.tagW;
        };
        const sorted = [...adj].sort(byRel);
        // 1段：言及・同行を優先、次に共有タグ数順で最大40件
        const keep = sorted.slice(0, 40).map((x) => x.to);
        const vis = new Set([c, ...keep]);
        G.localHop1 = keep;
        G.localParent = new Map();
        if (G.depth2) {
          const hop2 = [];
          for (const nIdx of keep) {
            for (const e of G.adj[nIdx]) {
              if (!vis.has(e.to)) hop2.push({ e, from: nIdx });
            }
          }
          hop2.sort((x, y) => byRel(x.e, y.e));
          for (const { e, from } of hop2) {
            if (vis.size >= 100) break;
            vis.add(e.to);
            G.localParent.set(e.to, from);
          }
        }
        G.visible = vis;
        // 表示する辺（描画するものだけを数える）:
        //  (a) スポーク — 中心→1段隣接、1段→2段（導入した親から）
        //  (b) 可視ノード間の強い辺（タグ3つ以上共有／言及／同行）
        // タグ1〜2つの共有だけのペアは辺を描かない（組み合わせ数を見せない）。
        const seen = new Set();
        const visEdges = [];
        const pushEdge = (e) => {
          const k = edgeKey(e.a, e.b);
          if (seen.has(k)) return;
          seen.add(k);
          if (edgeShown(e, 'local')) visEdges.push(e);
        };
        const relOf = (from, to) => {
          const list = G.adj[from] || [];
          for (const x of list) if (x.to === to) return x;
          return { to, tagW: 0, mention: false, coloc: false };
        };
        const spoke = (from, to) => {
          const r = relOf(from, to);
          pushEdge({ a: Math.min(from, to), b: Math.max(from, to), tag: r.tagW, mention: !!r.mention, coloc: !!r.coloc, rel: !!r.rel, spoke: true, weak: r.tagW <= 2 && !r.mention && !r.coloc && !r.rel });
        };
        for (const nIdx of keep) spoke(c, nIdx);
        for (const [node, from] of G.localParent) spoke(from, node);
        for (const i of vis) {
          for (const a of G.adj[i]) {
            if (!vis.has(a.to)) continue;
            const e = G.edgeByKey.get(edgeKey(i, a.to));
            if (e) pushEdge(e);
          }
        }
        G.visEdges = visEdges;
      }
      G.visibleNodes = Array.from(G.visible).map((i) => G.nodes[i]);
      updateCount();
    }

    function updateCount() {
      const el = document.getElementById('graph-count');
      if (!el) return;
      if (G.mode === 'all') {
        el.textContent = '全体図：' + G.visibleNodes.length + '件・' + G.visEdges.length + '本';
        el.title = '本数は描く辺の数（タグ共通／言及／同行）';
      } else {
        const name = G.center >= 0 ? G.nodes[G.center].name : '';
        el.textContent = '周辺：' + name + ' — ' + G.visibleNodes.length + '件・' + G.visEdges.length + '本';
        el.title = '本数は描く辺の数（中心とのスポーク＋隣接間の辺）';
      }
    }

    /* ---- フォースシミュレーション ---- */
    // 力のバランス：全体図が収縮してドットの塊にならないよう、反発を強く・
    // 遠くまで効かせ、バネの自然長を長く、中心への引力をなくし、章アンカー
    // への引力を強めた。3Dでは反発が体積で薄まるため、さらに強くする。
    // 周辺表示は放射状配置＋固定中心のため従来の値のまま。
    function stepSim() {
      if (G.dim === '2d') {
        // 2Dマインドマップは決定論的レイアウト。力は働かないが、ティック数・
        // 静穏・減速の帳簿は維持する（停止・速度のテストと再生ボタンの動作が
        // そのまま通る）。位置は変わらないので広がりは常に1.0倍。
        G.maxSpeed = 0;
        G.tickCount++;
        G.calmTicks++;
        let cool = 0;
        if (G.tickCount > 1400) cool = Math.min(1, (G.tickCount - 1400) / 100);
        else if (G.calmTicks >= 4) cool = Math.min(1, (G.calmTicks - 3) / 8);
        G.coolFactor = cool;
        return;
      }
      const ns = G.visibleNodes;
      const dim3 = G.dim === '3d';
      const local = G.mode === 'local';
      const F = G.force;
      const CUTOFF = local ? 220 : dim3 ? 300 : 240, CELL = local ? 220 : dim3 ? 300 : 240;
      const REPEL = (local ? 8000 : dim3 ? 24000 : 9000) * F.repel;
      const REST_STRONG = (local ? 95 : dim3 ? 100 : 90) * F.rest, REST_LIGHT = (local ? 150 : dim3 ? 150 : 130) * F.rest, REST_WEAK = (local ? 190 : dim3 ? 195 : 170) * F.rest;
      const K_STRONG = (local ? 0.05 : 0.04) * F.attract, K_LIGHT = (local ? 0.02 : 0.012) * F.attract, K_WEAK = (local ? 0.008 : 0.006) * F.attract;
      const ANCHOR = (local ? 0 : dim3 ? 0.012 : 0.006) * F.attract, CENTER_PULL = (local ? 0.0006 : 0) * F.attract;
      // 停止へのイージングアウト：上限ティック数（1500）に近づいたら、残り
      // 100ティックかけて徐々に減速させる（急ブレーキにならない）。静穏が
      // 近いとき（calmTicks 4以上）も同じく減速する。減衰は力の釣り合いに
      // 影響しない（速度だけを絞る）ため、最終配置は変わらない。
      let cool = 0;
      if (G.tickCount > 1400) cool = Math.min(1, (G.tickCount - 1400) / 100);
      else if (G.calmTicks >= 4) cool = Math.min(1, (G.calmTicks - 3) / 8);
      G.coolFactor = cool;
      const damp = 0.84 * (1 - 0.35 * cool);
      const cap = 14 * (1 - 0.5 * cool);
      const grid = new Map();
      for (const n of ns) {
        const cx = Math.floor(n.x / CELL), cy = Math.floor(n.y / CELL);
        const cz = dim3 ? Math.floor(n.z / CELL) : 0;
        const k = cx + ',' + cy + ',' + cz;
        let arr = grid.get(k);
        if (!arr) { arr = []; grid.set(k, arr); }
        arr.push(n);
      }
      for (const n of ns) { n.fx = 0; n.fy = 0; n.fz = 0; }
      for (const n of ns) {
        const cx = Math.floor(n.x / CELL), cy = Math.floor(n.y / CELL);
        const cz = dim3 ? Math.floor(n.z / CELL) : 0;
        for (let dx = -1; dx <= 1; dx++) {
          for (let dy = -1; dy <= 1; dy++) {
            for (let dz = dim3 ? -1 : 0; dz <= (dim3 ? 1 : 0); dz++) {
              const arr = grid.get((cx + dx) + ',' + (cy + dy) + ',' + (cz + dz));
              if (!arr) continue;
              for (const m of arr) {
                if (m.i <= n.i) continue;
                const ddx = n.x - m.x, ddy = n.y - m.y, ddz = dim3 ? n.z - m.z : 0;
                const d2 = ddx * ddx + ddy * ddy + ddz * ddz;
                if (d2 > CUTOFF * CUTOFF || d2 < 0.01) continue;
                const d = Math.sqrt(d2);
                let f = REPEL / d2;
                if (f > 60) f = 60;
                const ux = ddx / d, uy = ddy / d, uz = dim3 ? ddz / d : 0;
                n.fx += ux * f; n.fy += uy * f; n.fz += uz * f;
                m.fx -= ux * f; m.fy -= uy * f; m.fz -= uz * f;
              }
            }
          }
        }
      }
      for (const e of G.visEdges) {
        const a = G.nodes[e.a], b = G.nodes[e.b];
        const dx = b.x - a.x, dy = b.y - a.y, dz = dim3 ? b.z - a.z : 0;
        const d = Math.sqrt(dx * dx + dy * dy + dz * dz) || 0.001;
        const strong = e.mention || e.coloc;
        const weak = !!e.weak;
        const rest = strong ? REST_STRONG : weak ? REST_WEAK : REST_LIGHT;
        const k = strong ? K_STRONG : weak ? K_WEAK : K_LIGHT;
        const f = (d - rest) * k;
        const ux = dx / d, uy = dy / d, uz = dim3 ? dz / d : 0;
        a.fx += ux * f; a.fy += uy * f; a.fz += uz * f;
        b.fx -= ux * f; b.fy -= uy * f; b.fz -= uz * f;
      }
      let maxV = 0;
      for (const n of ns) {
        if (n.fixed) { n.vx = 0; n.vy = 0; n.vz = 0; continue; }
        // 章のアンカーへの引力（孤立ノードも章ごとに散らばる）＋ごく弱い中心引力
        // 周辺表示ではアンカー引力を切る（放射状の配置と干渉するため）
        n.fx += (n.ax - n.x) * ANCHOR - n.x * CENTER_PULL;
        n.fy += (n.ay - n.y) * ANCHOR - n.y * CENTER_PULL;
        n.fz += (n.az - n.z) * ANCHOR - n.z * CENTER_PULL;
        n.vx = (n.vx + n.fx) * damp;
        n.vy = (n.vy + n.fy) * damp;
