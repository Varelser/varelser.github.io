、『コンポジション』連作を描いた。モンドリアンは神智学の影響下で具象を削ぎ落とし、原色と直線による新造形主義を確立、『ブロードウェイ・ブギウギ』（1943年）に至った。ともに1944年に没した。"},{"name":"ジャン・デルヴィル","chapter":"c7-原始性の復権","sub":1,"subCount":12,"tags":["art","religion"],"birth":1867,"death":1953,"href":"https://note.com/varelser/n/n8a1ccf697c78","article":true,"descRaw":"（ベルギー・1867–1953）：ベルギーの象徴主義画家。1890年代に薔薇十字サロンの中心人物として活動し、神智学と神秘主義に根ざした絵画を描いた。代表作『サタンの宝物』（1895年）は、悪魔と女性を描く官能的で謎めいた図像で知られる。死後の世界や霊的合一をテーマに、理想化された人体と象徴的モチーフを結びつけた。神智学協会の会員として、霊的な進化を絵画で表現することを目指した。"},{"name":"フェルナン・クノップフ","chapter":"c7-原始性の復権","sub":1,"subCount":12,"tags":["art","religion"],"birth":1858,"death":1921,"href":"https://note.com/varelser/n/n616d64bd8abe","article":true,"descRaw":"（ベルギー・1858–1921）：ベルギーの象徴主義画家。沈黙と謎をたたえた女性像、スフィンクスや天使のイメージで知られる。代表作『愛撫』（1896年）は、スフィンクスに寄り添う青年を描き、欲望と死の結びつきを示唆する。ブリュッセルを拠点に、夢の淵にあるような静謐で閉ざされた画面を描き続け、意識の閾を可視化した。自邸を芸術の神殿として設計し、夢の世界に閉じこもるように暮らした。"},{"name":"ヤン・トーロップ","chapter":"c7-原始性の復権","sub":1,"subCount":12,"tags":["art","religion","dream"],"birth":1858,"death":1928,"href":"https://note.com/varelser/n/nf9b156903ac8","article":true,"descRaw":"（オランダ・1858–1928）：オランダの象徴主義画家。神智学協会の会員として、東洋思想と西洋象徴主義を融合させた幻視的な線描を展開した。代表作『3つの花嫁』（1893年）は、細い波打つ線で死と再生の神秘を描く。後に点描や宗教画へ移行したが、初期の象徴主義作品は、霊的な世界の可視化として高く評価されている。後にカトリックに改宗し、宗教画を描いたが、象徴主義の線描は高く評価された。"},{"name":"豪州アボリジニ画家（エミリー・K・クングワレイなど）","chapter":"c7-原始性の復権","sub":2,"subCount":12,"tags":["art","culture","religion"],"birth":null,"death":null,"href":"https://note.com/search?q=from%3A%40varelser%20%E8%B1%AA%E5%B7%9E%E3%82%A2%E3%83%9C%E3%83%AA%E3%82%B8%E3%83%8B%E7%94%BB%E5%AE%B6&context=note&mode=search","article":false,"descRaw":"：オーストラリア先住民アボリジニの画家たち。天地創造の物語ドリーミングを、点描や線で描く。エミリー・カーメ・ウングワレイは、ユートピアの女性長老として1988年頃からキャンバス画を始め、ヤムイモの夢の跡などを描いた。土地と祖先の物語が、時空を横断する意識的な風景として画面に定着する。点描の技法は、砂絵や身体装飾に由来する伝統的な表現である。"},{"name":"ウイチョル族の画家たち","chapter":"c7-原始性の復権","sub":2,"subCount":12,"tags":["art","substance","culture"],"birth":null,"death":null,"href":"https://note.com/search?q=from%3A%40varelser%20%E3%82%A6%E3%82%A4%E3%83%81%E3%83%A7%E3%83%AB%E6%97%8F%E3%81%AE%E7%94%BB%E5%AE%B6%E3%81%9F%E3%81%A1&context=note&mode=search","article":false,"descRaw":"（メキシコ）：メキシコの先住民ウイチョル族の画家たち。聖なるサボテン、ペヨーテの幻視体験をもとに、色鮮やかな毛糸を板に押しつけるネアリカ（毛糸絵）を制作する。鹿・トウモロコシ・太陽などの神話的形象が、幾何学的な色彩で描かれ、幻視の世界観を可視化する。シャーマニズムと芸術が一体化した伝統である。毛糸絵は、儀礼で用いられる神聖な図像を、土産品としても発展させた。"},{"name":"ポール・ゴーギャン","chapter":"c7-原始性の復権","sub":2,"subCount":12,"tags":["art","culture"],"birth":1848,"death":1903,"href":"https://note.com/search?q=from%3A%40varelser%20%E3%83%9D%E3%83%BC%E3%83%AB%E3%83%BB%E3%82%B4%E3%83%BC%E3%82%AE%E3%83%A3%E3%83%B3&context=note&mode=search","article":false,"descRaw":"（1848–1903）／（1881–1973）など：プリミティヴィズム（原始主義）を体現した二人。ゴーギャンは1891年からタヒチに渡り、西洋文明を離れた土地で、神話と官能に満ちた絵画を描いた。ピカソは1907年の『アヴィニョンの娘たち』でアフリカ彫刻やイベリア彫刻に学び、キュビスムへの道を開いた。ともに「原始」の造形に、意識の刷新を見出した。西洋の伝統を離れ、異文化の造形に学ぶ姿勢は、近代美術の転換点となった。"},{"name":"パブロ・ピカソ","chapter":"c7-原始性の復権","sub":2,"subCount":12,"tags":["art","culture"],"birth":1881,"death":1973,"href":"https://note.com/search?q=from%3A%40varelser%20%E3%83%91%E3%83%96%E3%83%AD%E3%83%BB%E3%83%94%E3%82%AB%E3%82%BD&context=note&mode=search","article":false,"descRaw":"（1848–1903）／（1881–1973）など：プリミティヴィズム（原始主義）を体現した二人。ゴーギャンは1891年からタヒチに渡り、西洋文明を離れた土地で、神話と官能に満ちた絵画を描いた。ピカソは1907年の『アヴィニョンの娘たち』でアフリカ彫刻やイベリア彫刻に学び、キュビスムへの道を開いた。ともに「原始」の造形に、意識の刷新を見出した。西洋の伝統を離れ、異文化の造形に学ぶ姿勢は、近代美術の転換点となった。"},{"name":"夏目漱石","chapter":"c7-原始性の復権","sub":3,"subCount":12,"tags":["art","dream"],"birth":1867,"death":1916,"href":"https://note.com/search?q=from%3A%40varelser%20%E5%A4%8F%E7%9B%AE%E6%BC%B1%E7%9F%B3&context=note&mode=search","article":false,"descRaw":"（1867–1916）：日本の作家（1867-1916）。『夢十夜』（1908）で、10の夢の断片を連ね、潜在意識の深層を視覚的に描き出した。『こころ』（1914）や『明暗』（未完）では、自我の内面と無意識の葛藤を掘り下げた。西洋心理学にも通じ、夢を近代日本文学の方法として確立した。日本の夢文学の出発点となった作家である。"},{"name":"安部公房","chapter":"c7-原始性の復権","sub":3,"subCount":12,"tags":["art","theory"],"birth":1924,"death":1993,"href":"https://note.com/search?q=from%3A%40varelser%20%E5%AE%89%E9%83%A8%E5%85%AC%E6%88%BF&context=note&mode=search","article":false,"descRaw":"（1924–1993）：日本の作家（1924-1993）。『砂の女』（1962）や『他人の顔』（1964）で、顔や肉体の変容、自己同一性の解体を描いた。シュルレアリスムやカフカの影響を受け、現実と悪夢の境界を曖昧にする世界を構築した。劇団「安部公房スタジオ」でも、身体と意識の実験を舞台化した。変容する自己を描いた戦後日本文学の代表者である。"},{"name":"村上春樹","chapter":"c7-原始性の復権","sub":3,"subCount":12,"tags":["art","dream"],"birth":1949,"death":null,"href":"https://note.com/varelser/n/n0d215068835f","article":true,"descRaw":"（1949–）：日本の作家（1949-）。『海辺のカフカ』（2002）や『1Q84』（2009）で、井戸・影・闇といったイメージを通じ、意識と無意識の境界を行き来する世界を描く。夢や記憶、喪失をめぐる物語は、ユング心理学との親和性でも論じられる。『ノルウェイの森』（1987）で世界的な読者を獲得し、現代日本文学を代表する作家となった。"},{"name":"ベン・オクリ","chapter":"c7-原始性の復権","sub":3,"subCount":12,"tags":["art","religion","culture"],"birth":1959,"death":null,"href":"https://note.com/search?q=from%3A%40varelser%20%E3%83%99%E3%83%B3%E3%83%BB%E3%82%AA%E3%82%AF%E3%83%AA&context=note&mode=search","article":false,"descRaw":"（ナイジェリア・1959–）：ナイジェリアの作家（1959-）。『飢えた路』（1991）で、輪廻する精霊児アビクの視点から、霊界と現実世界を往還する意識を描き、ブッカー賞を受けた。ヨルバの民間信仰と魔術的リアリズムを結びつけ、死と生の境界を曖昧にする物語を展開した。アフリカ文学における夢と霊性の表現の中心人物である。その幻想的な語りは、アフリカ文学の新しい可能性を開いた。"},{"name":"アモス・トゥトゥオラ","chapter":"c7-原始性の復権","sub":3,"subCount":12,"tags":["art","culture","dream"],"birth":1920,"death":1997,"href":"https://note.com/varelser/n/n832a96a0c187","article":true,"descRaw":"（ナイジェリア・1920–1997）：ナイジェリアの作家（1920-1997）。『やし酒飲み』（1952）で、死者の町を旅する男の冒険を、ヨルバの土着神話と夢的な論理で描いた。英語の破格的な文体が、神話的意識のありようをそのまま伝えるものとして評価された。アフリカの口承神話を近代小説に持ち込んだ先駆者である。その幻想的な語りは、アフリカ文学の新しい可能性を開いた。"},{"name":"ハン・ガン","chapter":"c7-原始性の復権","sub":3,"subCount":12,"tags":["art"],"birth":1970,"death":null,"href":"https://note.com/search?q=from%3A%40varelser%20%E3%83%8F%E3%83%B3%E3%83%BB%E3%82%AC%E3%83%B3&context=note&mode=search","article":false,"descRaw":"（韓・1970–）：韓国の作家（1970-）。『菜食主義者』（2007）で、肉食を拒み植物への変身を願う女性を描き、身体変容と社会からの意識的逸脱を主題化した。『少年が来る』（2014）や『別れを告げない』（2021）でも、暴力と記憶、死者との交感を描く。2024年にノーベル文学賞を受けた。身体を通じた意識の変容を描く作家である。"},{"name":"稲垣足穂","chapter":"c7-原始性の復権","sub":3,"subCount":12,"tags":["art"],"birth":1900,"death":1977,"href":"https://note.com/search?q=from%3A%40varelser%20%E7%A8%B2%E5%9E%A3%E8%B6%B3%E7%A9%82&context=note&mode=search","article":false,"descRaw":"（1900–1977）：日本の作家（1900-1977）。『一千一秒物語』（1923）で、天体・少年・エロスをめぐる宇宙的なイメージと恍惚を、極小の散文に凝縮した。飛行機や星への偏愛は、日常を超えた意識の拡張への憧れと結びつく。『少年愛の美学』などでも、独自の宇宙観と官能を展開した。大正期の異端的な幻想文学の作家である。晩年まで独自の宇宙観を語り続け、異端の文学者として再評価された。"},{"name":"ホルヘ・ルイス・ボルヘス","chapter":"c7-原始性の復権","sub":4,"subCount":12,"tags":["art","dream"],"birth":1899,"death":1986,"href":"https://note.com/varelser/n/n0735a4a3c78f","article":true,"descRaw":"（亜・1899–1986）：アルゼンチンの作家（1899-1986）。短編「円環の廃墟」（1940）で、夢の中で人間を創造する男が、自分自身も他者の夢であることを知るという、夢と現実の相互生成を描いた。『伝奇集』（1944）や『アレフ』（1949）で、無限・迷宮・分岐する時間を主題化した。夢と現実の境界をめぐる思索的幻想文学の巨匠である。"},{"name":"フリオ・コルタサル","chapter":"c7-原始性の復権","sub":4,"subCount":12,"tags":["art","theory"],"birth":1914,"death":1984,"href":"https://note.com/search?q=from%3A%40varelser%20%E3%83%95%E3%83%AA%E3%82%AA%E3%83%BB%E3%82%B3%E3%83%AB%E3%82%BF%E3%82%B5%E3%83%AB&context=note&mode=search","article":false,"descRaw":"（亜・1914–1984）：アルゼンチンの作家（1914-1984）。短編「公園につづく道」（1956）で、読書中の男が小説の世界に入り込み、殺人の標的になるという、意識と現実の境界の崩壊を描いた。『石蹴り遊び』（1963）では読む順序を読者が選ぶ実験的小説を試みた。夢と日常が交錯するラテンアメリカ文学の中心人物である。『石蹴り遊び』の実験性は、読者の意識そのものを作品の構造に組み込んだ。"},{"name":"ガブリエル・ガルシア＝マルケス","chapter":"c7-原始性の復権","sub":4,"subCount":12,"tags":["art","dream"],"birth":1927,"death":2014,"href":"https://note.com/varelser/n/n42e3f3612802","article":true,"descRaw":"（コロンビア・1927–2014）：コロンビアの作家（1927-2014）。『百年の孤独』（1967）で、ブエンディア家の百年にわたる歴史に、夢・予言・狂気・超常現象を日常と地続きに描き、魔術的リアリズムを世界文学の中心に押し上げた。1982年にノーベル文学賞を受けた。夢と現実の融合を、ラテンアメリカの歴史認識そのものとした作家である。"},{"name":"アレホ・カルペンティエル","chapter":"c7-原始性の復権","sub":4,"subCount":12,"tags":["art","culture"],"birth":1904,"death":1980,"href":"https://note.com/search?q=from%3A%40varelser%20%E3%82%A2%E3%83%AC%E3%83%9B%E3%83%BB%E3%82%AB%E3%83%AB%E3%83%9A%E3%83%B3%E3%83%86%E3%82%A3%E3%82%A8%E3%83%AB&context=note&mode=search","article":false,"descRaw":"（キューバ・1904–1980）：キューバの作家（1904-1980）。『この世の王国』（1949）の序文で「驚異的現実（lo real maravilloso）」を提唱し、ラテンアメリカの現実そのものが夢と奇跡に満ちていると論じた。ハイチ革命を題材とした同作や『失われた足跡』（1953）で、歴史と神話、理性と呪術の交錯を描いた。魔術的リアリズムの理論的先駆者である。"},{"name":"アドルフ・ヴェルフリ","chapter":"c7-原始性の復権","sub":5,"subCount":12,"tags":["art","religion"],"birth":1864,"death":1930,"href":"https://note.com/search?q=from%3A%40varelser%20%E3%82%A2%E3%83%89%E3%83%AB%E3%83%95%E3%83%BB%E3%83%B4%E3%82%A7%E3%83%AB%E3%83%95%E3%83%AA&context=note&mode=search","article":false,"descRaw":"（1864–1930）：スイスのアウトサイダー・アーティスト。精神病院ヴァルトアウで、25,000ページに及ぶ自叙伝的叙事と、強迫的な曼荼羅のような絵画を残した。1908年頃から制作を始め、音楽記譜や幾何学模様で満たされた画面に、内的世界の詳細な宇宙を構築した。デュビュッフェらに見出され、アール・ブリュットの原型とされる。"},{"name":"ジャン・デュビュッフェ","chapter":"c7-原始性の復権","sub":5,"subCount":12,"tags":["art","theory"],"birth":1901,"death":1985,"href":"https://note.com/search?q=from%3A%40varelser%20%E3%82%B8%E3%83%A3%E3%83%B3%E3%83%BB%E3%83%87%E3%83%A5%E3%83%93%E3%83%A5%E3%83%83%E3%83%95%E3%82%A7&context=note&mode=search","article":false,"descRaw":"（1901–1985）：フランスの画家。1945年にアール・ブリュット（生の芸術）の概念を提唱し、精神病患者や霊媒、独学の人々による制度外の表現を収集・評価した。自身の絵画も、子どもの落書きや素朴な造形に学んだ粗いマチエールで知られる。美術の制度と常識を問い直し、内的衝動から生まれる芸術の価値を主張した。収集したアール・ブリュット作品は、ローザンヌのコレクションに寄贈された。"},{"name":"山下清","chapter":"c7-原始性の復権","sub":5,"subCount":12,"tags":["art","science"],"birth":1922,"death":1971,"href":"https://note.com/search?q=from%3A%40varelser%20%E5%B1%B1%E4%B8%8B%E6%B8%85&context=note&mode=search","article":false,"descRaw":"（1922–1971）：日本の画家。放浪の旅で見た風景を、記憶だけを頼りに貼絵で精密に再構成した。1940年代から各地を放浪し、風景や祭りを、ちぎった色紙を重ねる独自の手法で描いた。写真を見て描くのではなく、想起されたイメージを再現する驚異的な記憶力が、記憶とイメージの関係を問うものとして注目された。『裸の大将』のモデルとしても知られ、放浪の画家として親しまれた。"},{"name":"ヘンリー・ダーガー","chapter":"c7-原始性の復権","sub":5,"subCount":12,"tags":["art","dream"],"birth":1892,"death":1973,"href":"https://note.com/search?q=from%3A%40varelser%20%E3%83%98%E3%83%B3%E3%83%AA%E3%83%BC%E3%83%BB%E3%83%80%E3%83%BC%E3%82%AC%E3%83%BC&context=note&mode=search","article":false,"descRaw":"（米・1892–1973）：アメリカのアウトサイダー・アーティスト。シカゴで清掃員として暮らしながら、15,000ページ超の叙事『非現実の王国』と数百点の挿絵を秘密裏に制作した。少女戦士ヴィヴィアン・ガールズの戦いを描く壮大な幻視叙事は、死後に発見され、アウトサイダー・アートの最重要作の一つとされる。生前は作品を誰にも見せず、死後にアパートから膨大な原稿が発見された。"},{"name":"アロイーズ・コルバス","chapter":"c7-原始性の復権","sub":5,"subCount":12,"tags":["art","religion"],"birth":1886,"death":1964,"href":"https://note.com/varelser/n/n345f29aef9e2","article":true,"descRaw":"（瑞・1886–1964）：スイスのアウトサイダー・アーティスト。オペラ歌手を夢見たのち、1918年に統合失調症と診断され、1920年から44年間、ラ・ロジエールの精神病院で暮らした。ドイツ皇帝への想像上の恋を主題に、鮮やかな色彩と流れるような線で、壮大な内的宇宙を描き続けた。デュビュッフェに見出され、アール・ブリュットの代表とされる。"},{"name":"マデゲ・ギル","chapter":"c7-原始性の復権","sub":5,"subCount":12,"tags":["art","religion"],"birth":1882,"death":1961,"href":"https://note.com/search?q=from%3A%40varelser%20%E3%83%9E%E3%83%87%E3%82%B2%E3%83%BB%E3%82%AE%E3%83%AB&context=note&mode=search","article":false,"descRaw":"（英・1882–1961）：イギリスの霊媒画家。霊能者の叔母のもとで心霊主義に触れ、子どもの死と自身の危篤を経て、精霊ミルニラの導きによる自動描画を始めた。インクによる細密な線で埋め尽くされた画面に、女性の顔や建築的な構造が浮かぶ。数千点の作品は死後に発見され、交霊と芸術の接点として評価された。作品はほとんどが死後に発見され、交霊芸術の代表例として評価された。"},{"name":"オーギュスタン・ルサージュ","chapter":"c7-原始性の復権","sub":5,"subCount":12,"tags":["art","religion"],"birth":1876,"death":1954,"href":"https://note.com/varelser/n/n09bf68c27c61","article":true,"descRaw":"（仏・1876–1954）：フランスの炭鉱夫から霊媒画家へ転じた人物。1911年、坑内で霊の声を聞いたことを機に絵を描き始め、交霊的な導きによる巨大な幻視的絵画を制作した。エジプトやインドの神殿を思わせる対称的な建築的画面は、細密な装飾で満たされる。美術教育を受けず、霊的啓示を芸術に変換した代表例とされる。作品はローザンヌのアール・ブリュット・コレクションにも収められている。"},{"name":"ジャクソン・ポロック","chapter":"c7-原始性の復権","sub":6,"subCount":12,"tags":["art","practice"],"birth":1912,"death":1956,"href":"https://note.com/search?q=from%3A%40varelser%20%E3%82%B8%E3%83%A3%E3%82%AF%E3%82%BD%E3%83%B3%E3%83%BB%E3%83%9D%E3%83%AD%E3%83%83%E3%82%AF&context=note&mode=search","article":false,"descRaw":"（1912–1956）：アメリカの抽象表現主義画家。1947年頃から床に広げたキャンバスに絵具を垂らすドリッピングを始め、身体全体の動きによるアクション・ペインティングを確立した。代表作『秋のリズム』（1950年）は、偶然と制御が交錯する網状の画面で知られる。ユング心理学やネイティブアメリカンの砂絵への関心も語られ、制作そのものがトランス的な行為とみなされた。"},{"name":"マーク・ロスコ","chapter":"c7-原始性の復権","sub":6,"subCount":12,"tags":["art","practice"],"birth":1903,"death":1970,"href":"https://note.com/search?q=from%3A%40varelser%20%E3%83%9E%E3%83%BC%E3%82%AF%E3%83%BB%E3%83%AD%E3%82%B9%E3%82%B3&context=note&mode=search","article":false,"descRaw":"（1903–1970）：ラトヴィア生まれのアメリカの画家。ぼかした色面が漂うカラーフィールド絵画で、沈潜と瞑想の空間を創出した。シーグラム壁画や、没後の1971年に完成したヒューストンのロスコ・チャペルは、色彩に囲まれることで内省を促す場として知られる。絵画を宗教的体験に近いものと捉え、観る者の感情を深い静けさへ導いた。画面の前に立つ観者に、絵画との対話による瞑想的な体験を求めた。"},{"name":"アグネス・マーティン","chapter":"c7-原始性の復権","sub":6,"subCount":12,"tags":["art","practice"],"birth":1912,"death":2004,"href":"https://note.com/search?q=from%3A%40varelser%20%E3%82%A2%E3%82%B0%E3%83%8D%E3%82%B9%E3%83%BB%E3%83%9E%E3%83%BC%E3%83%86%E3%82%A3%E3%83%B3&context=note&mode=search","article":false,"descRaw":"（1912–2004）：カナダ生まれのアメリカの画家。鉛筆と淡い色彩による反復する格子と水平線の絵画で知られる。禅や道教への関心を語り、ニューメキシコの砂漠で隠棲的な生活を送った。『幸福』や『無垢』といった題名が示すように、静かな反復を通じて内的な平安と恍惚を描き、瞑想的な抽象の代表とされる。「芸術は心の表現である」と語り、感情を排した静謐な画面を追究した。"},{"name":"ジョージア・オキーフ","chapter":"c7-原始性の復権","sub":6,"subCount":12,"tags":["art","religion"],"birth":1887,"death":1986,"href":"https://note.com/search?q=from%3A%40varelser%20%E3%82%B8%E3%83%A7%E3%83%BC%E3%82%B8%E3%82%A2%E3%83%BB%E3%82%AA%E3%82%AD%E3%83%BC%E3%83%95&context=note&mode=search","article":false,"descRaw":"（米・1887–1986）：アメリカの画家。花や骨、砂漠の風景を大きく拡大して描き、自然との合一感覚を表現した。1920年代の花のクローズアップは、知覚の純化と官能性を結びつけたものとして知られる。ニューメキシコに移住後は砂漠の骨や建築を描き、自然の形態に内在する精神的なリズムを、簡潔で力強い画面に定着させた。夫の写真家アルフレッド・スティーグリッツの支援を受け、ニューヨークで認められた。"},{"name":"H.R.ギーガー","chapter":"c7-原始性の復権","sub":7,"subCount":12,"tags":["art","religion"],"birth":1940,"death":2014,"href":"https://note.com/search?q=from%3A%40varelser%20H.R.%E3%82%AE%E3%83%BC%E3%82%AC%E3%83%BC&context=note&mode=search","article":false,"descRaw":"（1940–2014）：スイスの画家・造形作家。機械と有機体が融合したバイオメカニカルな様式で、無意識の暗部を描いた。画集『ネクロノミコン』（1977年）が注目され、映画『エイリアン』（1979年）のクリーチャー・デザインでアカデミー視覚効果賞を受けた。生体的な悪夢のイメージは、暗黒的な統合の美学としてサイケデリック文化にも影響した。"},{"name":"アレックス・グレイ","chapter":"c7-原始性の復権","sub":7,"subCount":12,"tags":["art","substance","practice"],"birth":1953,"death":null,"href":"https://note.com/search?q=from%3A%40varelser%20%E3%82%A2%E3%83%AC%E3%83%83%E3%82%AF%E3%82%B9%E3%83%BB%E3%82%B0%E3%83%AC%E3%82%A4&context=note&mode=search","article":false,"descRaw":"（1953–）：アメリカのヴィジョナリー・アート画家。薬理的体験と瞑想、チベット仏教の修行を背景に、人体を透視するような解剖学的絵画を描いた。連作『聖なる鏡』（1979〜89年）は、皮膚・筋肉・骨格・エネルギー体を重ねて描く21点のシリーズ。ニューヨークにチャペル・オブ・セイクリッド・ミラーズを設立し、霊的な共同体の場とした。"},{"name":"横尾忠則","chapter":"c7-原始性の復権","sub":7,"subCount":12,"tags":["art","dream"],"birth":1936,"death":null,"href":"https://note.com/search?q=from%3A%40varelser%20%E6%A8%AA%E5%B0%BE%E5%BF%A0%E5%89%87&context=note&mode=search","article":false,"descRaw":"（1936–）／（1936–2024）：1960年代の日本ポップアートを代表する二人。横尾忠則は、夢の記憶や幻視体験を、サイケデリックな色彩と日本の大衆文化のイメージで描くポスターや絵画で知られる。田名網敬一も、夢と記憶、映画や漫画の断片を、鮮やかなコラージュで描き、網膜的なポップの世界を展開した。ともに夢の視覚を大衆文化と結びつけた。ポスターやレコードジャケットなど、商業美術の領域でも広く活躍した。"},{"name":"田名網敬一","chapter":"c7-原始性の復権","sub":7,"subCount":12,"tags":["art","dream"],"birth":1936,"death":2024,"href":"https://note.com/search?q=from%3A%40varelser%20%E7%94%B0%E5%90%8D%E7%B6%B2%E6%95%AC%E4%B8%80&context=note&mode=search","article":false,"descRaw":"（1936–）／（1936–2024）：1960年代の日本ポップアートを代表する二人。横尾忠則は、夢の記憶や幻視体験を、サイケデリックな色彩と日本の大衆文化のイメージで描くポスターや絵画で知られる。田名網敬一も、夢と記憶、映画や漫画の断片を、鮮やかなコラージュで描き、網膜的なポップの世界を展開した。ともに夢の視覚を大衆文化と結びつけた。ポスターやレコードジャケットなど、商業美術の領域でも広く活躍した。"},{"name":"草間彌生","chapter":"c7-原始性の復権","sub":7,"subCount":12,"tags":["art","religion"],"birth":1929,"death":2026,"href":"https://note.com/varelser/n/nfcaaffed5708","article":true,"descRaw":"（1929–2026）：日本の前衛芸術家。幼少期から幻視・幻聴を体験し、10歳頃から水玉や網目を描き始めた。1957年に渡米し、ネット・ペインティングやソフト・スカルプチャーを発表。鏡による『インフィニティ・ミラー・ルーム』（1965年〜）では無限に増殖する空間を作り、自己と世界の境界を消す「自己消滅」の哲学を掲げた。1929年生まれ、2026年没。"},{"name":"パブロ・アマリンゴ","chapter":"c7-原始性の復権","sub":7,"subCount":12,"tags":["art","substance","culture"],"birth":1938,"death":2009,"href":"https://note.com/search?q=from%3A%40varelser%20%E3%83%91%E3%83%96%E3%83%AD%E3%83%BB%E3%82%A2%E3%83%9E%E3%83%AA%E3%83%B3%E3%82%B4&context=note&mode=search","article":false,"descRaw":"（ペルー・1938–2009）：ペルーの画家・シャーマン。アヤワスカの儀礼で得た幻視を、精密で色彩豊かな絵画に描き起こした。植物の精霊や幾何学的な光、アマゾンの宇宙観を可視化し、民族植物学者ルイス・エドゥアルド・ルナとの共著『アヤワスカ・ヴィジョン』（1991年）で世界に知られた。ペルーにウスコ・アヤル学校を設立し、幻視絵画の伝承に努めた。"},{"name":"フレッド・トマセリ","chapter":"c7-原始性の復権","sub":7,"subCount":12,"tags":["art","substance"],"birth":1956,"death":null,"href":"https://note.com/search?q=from%3A%40varelser%20%E3%83%95%E3%83%AC%E3%83%83%E3%83%89%E3%83%BB%E3%83%88%E3%83%9E%E3%82%BB%E3%83%AA&context=note&mode=search","article":false,"descRaw":"（米・1956–）：アメリカの画家。錠剤、葉、虫などの素材を樹脂に封じ込めたコラージュ絵画で知られる。薬理的な知覚と自然史を融合させ、曼荼羅のように同心円状に広がる画面を作る。1990年代以降、向精神薬や植物のイメージを用い、サイケデリックな視覚体験を精緻な装飾性とともに提示し、意識変容の図像化を追求した。樹脂の層に素材を封じ込める手法は、標本と宝石の中間のような輝きを生む。"},{"name":"ジェームズ・タレル","chapter":"c7-原始性の復権","sub":8,"subCount":12,"tags":["art","practice"],"birth":1943,"death":null,"href":"https://note.com/search?q=from%3A%40varelser%20%E3%82%B8%E3%82%A7%E3%83%BC%E3%83%A0%E3%82%BA%E3%83%BB%E3%82%BF%E3%83%AC%E3%83%AB&context=note&mode=search","article":false,"descRaw":"（米・1943–）：アメリカのインスタレーション作家。光そのものを素材とし、視知覚の境界を溶解させる空間を作る。アリゾナの死火山に建設中の『ロデン・クレーター』（1977年〜）は、天体観測と瞑想のための巨大な環境作品。クエーカー教徒の家庭に育ち、光の体験を精神的なものと捉える『スカイスペース』シリーズでも知られる。日本でも金沢21世紀美術館などに作品があり、光の体験を広く提示している。"},{"name":"オラファー・エリアソン","chapter":"c7-原始性の復権","sub":8,"subCount":12,"tags":["art"],"birth":1967,"death":null,"href":"https://note.com/search?q=from%3A%40varelser%20%E3%82%AA%E3%83%A9%E3%83%95%E3%82%A1%E3%83%BC%E3%83%BB%E3%82%A8%E3%83%AA%E3%82%A2%E3%82%BD%E3%83%B3&context=note&mode=search","article":false,"descRaw":"（デンマーク-アイスランド・1967–）：デンマーク生まれのアイスランド系作家。気象・光・運動を用いた没入的なインスタレーションで、知覚と環境の関係を問う。テート・モダンでの『ウェザー・プロジェクト』（2003年）は、人工の太陽と霧で大空間を満たし、来場者の知覚体験を変容させた。自然現象の再現を通じて、身体と意識の境界を揺さぶる。環境問題への関心も深く、気候変動をテーマとするプロジェクトも手がけた。"},{"name":"ダン・フレイヴィン","chapter":"c7-原始性の復権","sub":8,"subCount":12,"tags":["art"],"birth":1933,"death":1996,"href":"https://note.com/search?q=from%3A%40varelser%20%E3%83%80%E3%83%B3%E3%83%BB%E3%83%95%E3%83%AC%E3%82%A4%E3%83%B4%E3%82%A3%E3%83%B3&context=note&mode=search","article":false,"descRaw":"（米・1933–1996）：アメリカのミニマル・アート作家。1963年から市販の蛍光灯だけを用いた光の作品を制作し、空間全体を色彩で満たした。代表作『対角線の5月25日』（1963年）は、壁に斜めに置かれた一本の蛍光管による。光と色彩が身体感覚と空間認知を同時に変容させる、ミニマルな知覚実験として評価された。蛍光灯の色と配置だけが作品であり、絵画と彫刻の境界を問い直した。"},{"name":"ロバート・アーウィン","chapter":"c7-原始性の復権","sub":8,"subCount":12,"tags":["art"],"birth":1928,"death":2023,"href":"https://note.com/search?q=from%3A%40varelser%20%E3%83%AD%E3%83%90%E3%83%BC%E3%83%88%E3%83%BB%E3%82%A2%E3%83%BC%E3%82%A6%E3%82%A3%E3%83%B3&context=note&mode=search","article":false,"descRaw":"（米・1928–2023）：アメリカの作家。ライト＆スペース・ムーブメントの中心人物として、知覚そのものを主題にしたサイトスペシフィックなインスタレーションを展開した。スクリム（半透明の布）や光の調整で、空間の輪郭を曖昧にし、見る者の注意を研ぎ澄ませる。ゲティ・センターの庭園設計でも知られ、環境と知覚の関係を探求した。美術館の展示空間そのものを作品化する手法は、後のインスタレーションに影響した。"},{"name":"ブリジット・ライリー","chapter":"c7-原始性の復権","sub":8,"subCount":12,"tags":["art","science"],"birth":1931,"death":null,"href":"https://note.com/search?q=from%3A%40varelser%20%E3%83%96%E3%83%AA%E3%82%B8%E3%83%83%E3%83%88%E3%83%BB%E3%83%A9%E3%82%A4%E3%83%AA%E3%83%BC&context=note&mode=search","article":false,"descRaw":"（英・1931–）：イギリスのオプ・アート画家。白黒や色彩の幾何学的パターンを用い、視覚的な振動・残像・眩暈を誘発する絵画で知られる。代表作『ムーヴメント・イン・スクエアーズ』（1961年）は、歪む正方形の連なりで画面を揺らす。網膜レベルの知覚変容を、絵画の構造そのものから引き出す実践として評価された。1965年のニューヨーク近代美術館のオプ・アート展『レスポンシヴ・アイ』で注目された。"},{"name":"アンソニー・マッコール","chapter":"c7-原始性の復権","sub":8,"subCount":12,"tags":["art"],"birth":1946,"death":null,"href":"https://note.com/search?q=from%3A%40varelser%20%E3%82%A2%E3%83%B3%E3%82%BD%E3%83%8B%E3%83%BC%E3%83%BB%E3%83%9E%E3%83%83%E3%82%B3%E3%83%BC%E3%83%AB&context=note&mode=search","article":false,"descRaw":"（英-米・1946–）：イギリス生まれの作家。1973年の『ライン・ディスクライビング・ア・コーン』に始まる「固体の光」シリーズで、霧の中に投影された光の円錐を、触れられる彫刻のような存在として提示した。光の体積を歩く体験は、空間知覚を根本から変容させる。映画と彫刻の境界に位置する知覚の実験として知られる。2000年代以降に再評価され、光の彫刻として世界各地で展示されている。"},{"name":"アルドゥス・ハクスリー","chapter":"c7-原始性の復権","sub":9,"subCount":12,"tags":["substance","art","theory"],"birth":1894,"death":1963,"href":"https://note.com/varelser/n/nf35a68d05ea0","article":true,"descRaw":"（英・1894–1963）：イギリスの作家（1894-1963）。『知覚の扉』（1954）で、メスカリン体験による意識の拡張と知覚の変容を記録し、「マインド・アット・ラージ（心の広がり）」という概念を提示した。『天国と地獄』（1956）や晩年の小説『島』（1962）でも、サイケデリクスと瞑想による意識変容を探求した。サイケデリック文学の出発点となった思想家である。"},{"name":"ウィリアム・S・バロウズ","chapter":"c7-原始性の復権","sub":9,"subCount":12,"tags":["substance","art"],"birth":1914,"death":1997,"href":"https://note.com/varelser/n/ndc5e2fb28ec6","article":true,"descRaw":"（米・1914–1997）：アメリカの作家（1914-1997）。『裸のランチ』（1959）で、麻薬依存と幻視的なイメージの断片を、非線形の文体で描いた。ブリオン・ガイシンとともに開発したカットアップ法は、既存のテクストを切り刻んで再構成し、意識の統制を攪乱する技法だった。ビート文学の中心人物であり、薬物とコントロールの言語を主題化した作家である。"},{"name":"ハンター・S・トンプソン","chapter":"c7-原始性の復権","sub":9,"subCount":12,"tags":["substance","art"],"birth":1937,"death":2005,"href":"https://note.com/varelser/n/n970379c645fe","article":true,"descRaw":"（米・1937–2005）：アメリカのジャーナリスト・作家（1937-2005）。『ラスベガスをやっつけろ』（1971）で、ドラッグにまみれた取材旅行を幻覚的な一人称で描き、「ゴンゾー・ジャーナリズム」を確立した。現実と妄想の境界を崩壊させる文体は、アメリカン・ドリームの崩壊と意識変容を結びつけた。薬物文化を内側から記録したカウンターカルチャーの代弁者である。"},{"name":"カルロス・カスタネダ","chapter":"c7-原始性の復権","sub":9,"subCount":12,"tags":["religion","practice","culture"],"birth":1925,"death":1998,"href":"https://note.com/search?q=from%3A%40varelser%20%E3%82%AB%E3%83%AB%E3%83%AD%E3%82%B9%E3%83%BB%E3%82%AB%E3%82%B9%E3%82%BF%E3%83%8D%E3%83%80&context=note&mode=search","article":false,"descRaw":"（米・1925–1998）：ペルー生まれの人類学者・作家（1925-1998）。『ドン・ファンの教え』（1968）で、メキシコのヤキ族の呪術師ドン・フアンとの修行を描き、ペヨーテや幻覚性キノコによる入神と知覚の変容を記録したとされる。学術的真実性をめぐる論争は続くが、シャーマニズム体験記のベストセラーとして1960年代以降の意識文化に巨大な影響を与えた。"},{"name":"フィリップ・K・ディック","chapter":"c7-原始性の復権","sub":9,"subCount":12,"tags":["art","religion"],"birth":1928,"death":1982,"href":"https://note.com/varelser/n/n4b16a5b59d82","article":true,"descRaw":"（米・1928–1982）：アメリカのSF作家（1928-1982）。1974年2月に体験したという謎の光と啓示（2-3-74体験）をもとに『ヴァリス』（1981）で、宗教的幻視と現実の崩壊を描いた。『アンドロイドは電気羊の夢を見るか？』（1968）は映画『ブレードランナー』の原作となった。薬物体験と神学的思索が交錯する、意識の不確定性を描いた作家である。"},{"name":"アレン・ギンズバーグ","chapter":"c7-原始性の復権","sub":9,"subCount":12,"tags":["art","substance","practice"],"birth":1926,"death":1997,"href":"https://note.com/search?q=from%3A%40varelser%20%E3%82%A2%E3%83%AC%E3%83%B3%E3%83%BB%E3%82%AE%E3%83%B3%E3%82%BA%E3%83%90%E3%83%BC%E3%82%B0&context=note&mode=search","article":false,"descRaw":"（米・1926–1997）：アメリカの詩人（1926-1997）。長詩『吠える』（1956）で、ビート世代の意識拡張と性的解放を謳い、検閲裁判を経てカウンターカルチャーの聖典となった。瞑想やサイケデリクス、チベット仏教の師チョギャム・トゥルンパとの協働も深く、ティモシー・リアリーとも交流した。詩と霊的実践を結んだビート詩人の中心人物である。"},{"name":"ジャック・ケルアック","chapter":"c7-原始性の復権","sub":9,"subCount":12,"tags":["art","religion"],"birth":1922,"death":1969,"href":"https://note.com/varelser/n/n8a1137a98c3a","article":true,"descRaw":"（米・1922–1969）：アメリカの作家（1922-1969）。『路上』（1957）で、即興的な「自発的散文（スポンテイニアス・プローズ）」により、意識の流れをそのまま記録するビート文学の方法を確立した。禅仏教への関心は『禅ヒッピー』（1958）に結実し、東洋思想とアメリカ放浪の文学を結んだ。ビート世代の象徴的な作家である。"},{"name":"J.G.バラード","chapter":"c7-原始性の復権","sub":9,"subCount":12,"tags":["art","theory"],"birth":1930,"death":2009,"href":"https://note.com/search?q=from%3A%40varelser%20J.G.%E3%83%90%E3%83%A9%E3%83%BC%E3%83%89&context=note&mode=search","article":false,"descRaw":"（英・1930–2009）：イギリスのSF作家（1930-2009）。「内宇宙（インナー・スペース）」の概念を掲げ、外的宇宙ではなく意識の内的風景を探求するニューウェーブSFを理論的に牽引した。『クラッシュ』（1973）や『太陽の帝国』（1984）などで、テクノロジーと心理の変容を描いた。上海の収容所での少年期の体験が、現実と幻覚の境界への関心の背景にある。"},{"name":"アーシュラ・K・ル＝グウィン","chapter":"c7-原始性の復権","sub":9,"subCount":12,"tags":["art","theory"],"birth":1929,"death":2018,"href":"https://note.com/search?q=from%3A%40varelser%20%E3%82%A2%E3%83%BC%E3%82%B7%E3%83%A5%E3%83%A9%E3%83%BBK%E3%83%BB%E3%83%AB%EF%BC%9D%E3%82%B0%E3%82%A6%E3%82%A3%E3%83%B3&context=note&mode=search","article":false,"descRaw":"（米・1929–2018）：アメリカのSF・ファンタジー作家（1929-2018）。『闇の左手』（1969）で両性具有の異星人を描き、タオイズムに基づく知覚と社会構造の異化を試みた。『ゲド戦記』（1968）では、影との対決を通じた自己の統合を描いた。意識と世界の関係を問い直す思索的SFの第一人者である。『西のはての年代記』などでも、文化と知覚の多様性を描き続けた。"},{"name":"オクタヴィア・バトラー","chapter":"c7-原始性の復権","sub":9,"subCount":12,"tags":["art"],"birth":1947,"death":2006,"href":"https://note.com/search?q=from%3A%40varelser%20%E3%82%AA%E3%82%AF%E3%82%BF%E3%83%B4%E3%82%A3%E3%82%A2%E3%83%BB%E3%83%90%E3%83%88%E3%83%A9%E3%83%BC&context=note&mode=search","article":false,"descRaw":"（米・1947–2006）：アメリカのSF作家（1947-2006）。『リリスの子ら』（1987）で、異星人との交配による身体変容と共感覚的な意識融合を描き、アフロフューチャリズムの先駆となった。『キンドレッド』（1979）では、奴隷制時代への時間移動を通じて歴史的トラウマを体験させる。身体と意識の変容をSFの中心に据えた作家である。"},{"name":"トマス・ピンチョン","chapter":"c7-原始性の復権","sub":9,"subCount":12,"tags":["art","theory"],"birth":1937,"death":null,"href":"https://note.com/varelser/n/n8142b741de46","article":true,"descRaw":"（米・1937–）：アメリカの作家（1937-）。『重力の虹』（1973）で、パラノイアとエントロピー、知覚の不確定性を描き、情報と意識の境界の崩壊を巨大なテクストに仕立てた。『ヴァインランド』（1990）や『逆光』（2006）でも、歴史と幻覚が交錯する世界を描く。公の場に姿を現さない謎の作家として知られる。匿名性を貫き、写真も公表しないことで知られる。"},{"name":"アレイスター・クロウリー","chapter":"c7-原始性の復権","sub":9,"subCount":12,"tags":["religion","practice","substance"],"birth":1875,"death":1947,"href":"https://note.com/search?q=from%3A%40varelser%20%E3%82%A2%E3%83%AC%E3%82%A4%E3%82%B9%E3%82%BF%E3%83%BC%E3%83%BB%E3%82%AF%E3%83%AD%E3%82%A6%E3%83%AA%E3%83%BC&context=note&mode=search","article":false,"descRaw":"（英・1875–1947）：イギリスのオカルティスト・作家（1875-1947）。1904年の啓示をもとにセレマ（Thelema）の教義を創始し、「汝の意志することを行え」を掲げた。『魔術—理論と実践』（1929）で、ヨガ・性魔術・薬物を組み合わせた魔術的トランスの技法を体系化した。ゴールデンドーンを経て独自の魔術団体を率い、20世紀オカルティズムに決定的影響を与えた。"},{"name":"ヒエロニムス・ボス","chapter":"c7-原始性の復権","sub":10,"subCount":12,"tags":["art","religion","dream"],"birth":1450,"death":1516,"href":"https://note.com/varelser/n/n8c29b0af8198","article":true,"descRaw":"（蘭・1450–1516）：オランダの画家。三連祭壇画『快楽の園』（1490〜1500年頃）で知られ、天国・地上の快楽・地獄を、異形の生き物と悪夢的な情景で描いた。中世末期の宗教的想像力と、夢のような異様な細部が結びついた画面は、後のシュルレアリストらにも大きな影響を与えた。幻視と寓意の画家として位置づけられる。寓意と風刺に満ちた画面は、500年以上にわたり解釈をめぐる議論を呼んでいる。"},{"name":"フランシスコ・デ・ゴヤ","chapter":"c7-原始性の復権","sub":10,"subCount":12,"tags":["art","dream"],"birth":1746,"death":1828,"href":"https://note.com/search?q=from%3A%40varelser%20%E3%83%95%E3%83%A9%E3%83%B3%E3%82%B7%E3%82%B9%E3%82%B3%E3%83%BB%E3%83%87%E3%83%BB%E3%82%B4%E3%83%A4&context=note&mode=search","article":false,"descRaw":"（西・1746–1828）：スペインの画家。版画集『ロス・カプリチョス』（1799年）の『理性の眠りは怪物を生む』は、理性が眠るときに生まれる怪物を描き、白昼夢と怪異の図像として知られる。晩年の『黒い絵』（1819〜23年）は、壁に直接描かれた暗い幻視である。聴力を失ったのち、内面の闇を描き続けた。宮廷画家として名声を得ながら、晩年はボルドーに亡命して制作を続けた。"},{"name":"ヨハン・ハインリヒ・フュースリー","chapter":"c7-原始性の復権","sub":10,"subCount":12,"tags":["art","dream"],"birth":1741,"death":1825,"href":"https://note.com/search?q=from%3A%40varelser%20%E3%83%A8%E3%83%8F%E3%83%B3%E3%83%BB%E3%83%8F%E3%82%A4%E3%83%B3%E3%83%AA%E3%83%92%E3%83%BB%E3%83%95%E3%83%A5%E3%83%BC%E3%82%B9%E3%83%AA%E3%83%BC&context=note&mode=search","article":false,"descRaw":"（瑞-英・1741–1825）：スイス生まれの画家。『悪夢』（1781年）は、眠る女性の胸に座る夢魔インキュバスと、暗闇から覗く馬の頭を描いた、夢の視覚化の代表作。シェイクスピアやミルトンの文学的想像力に取材し、恐怖と官能が交錯する劇的な画面を描いた。ロマン主義の夢と無意識の先駆とされる。ロンドンのロイヤル・アカデミーで教授を務め、文学的な想像力を説いた。"},{"name":"ギュスターヴ・モロー","chapter":"c7-原始性の復権","sub":10,"subCount":12,"tags":["art","religion"],"birth":1826,"death":1898,"href":"https://note.com/search?q=from%3A%40varelser%20%E3%82%AE%E3%83%A5%E3%82%B9%E3%82%BF%E3%83%BC%E3%83%B4%E3%83%BB%E3%83%A2%E3%83%AD%E3%83%BC&context=note&mode=search","article":false,"descRaw":"（仏・1826–1898）：フランスの象徴主義画家。聖書や神話の主題を、宝石のように細密で幻想的な画面に描いた。代表作『出現』（1875年）は、サロメの前に浮かぶ洗礼者ヨハネの首を描く。夢幻的な色彩と装飾性は、後の象徴主義とシュルレアリスムに影響し、内的ヴィジョンの画家として知られる。パリの自邸は現在、ギュスターヴ・モロー美術館として公開されている。"},{"name":"グスタフ・クリムト","chapter":"c7-原始性の復権","sub":10,"subCount":12,"tags":["art","religion"],"birth":1862,"death":1918,"href":"https://note.com/search?q=from%3A%40varelser%20%E3%82%B0%E3%82%B9%E3%82%BF%E3%83%95%E3%83%BB%E3%82%AF%E3%83%AA%E3%83%A0%E3%83%88&context=note&mode=search","article":false,"descRaw":"（1862–1918）／（奥・1890–1918）：ウィーン世紀末を代表する二人。クリムトは『接吻』（1908年）など、金箔と装飾によるエロスと官能の画面で知られる。シーレは師クリムトの影響を受け、ねじれた自画像や裸体で、不安と欲望を露わにした。ともにエロスとタナトス、恍惚と死の結びつきを描き、1918年に相次いで没した。ともにウィーン分離派に関わり、世紀末ウィーンの芸術を代表した。"},{"name":"エゴン・シーレ","chapter":"c7-原始性の復権","sub":10,"subCount":12,"tags":["art","religion"],"birth":1890,"death":1918,"href":"https://note.com/search?q=from%3A%40varelser%20%E3%82%A8%E3%82%B4%E3%83%B3%E3%83%BB%E3%82%B7%E3%83%BC%E3%83%AC&context=note&mode=search","article":false,"descRaw":"（1862–1918）／（奥・1890–1918）：ウィーン世紀末を代表する二人。クリムトは『接吻』（1908年）など、金箔と装飾によるエロスと官能の画面で知られる。シーレは師クリムトの影響を受け、ねじれた自画像や裸体で、不安と欲望を露わにした。ともにエロスとタナトス、恍惚と死の結びつきを描き、1918年に相次いで没した。ともにウィーン分離派に関わり、世紀末ウィーンの芸術を代表した。"},{"name":"ズジスワフ・ベクシンスキ","chapter":"c7-原始性の復権","sub":10,"subCount":12,"tags":["art","dream"],"birth":1929,"death":2005,"href":"https://note.com/search?q=from%3A%40varelser%20%E3%82%BA%E3%82%B8%E3%82%B9%E3%83%AF%E3%83%95%E3%83%BB%E3%83%99%E3%82%AF%E3%82%B7%E3%83%B3%E3%82%B9%E3%82%AD&context=note&mode=search","article":false,"descRaw":"（波・1929–2005）：ポーランドの画家。廃墟、骸骨、崩壊した建造物が広がるポスト黙示録的な風景で知られる。写真家から転じ、1970年代以降、悪夢のような終末の光景を精密に描いた。タイトルを付けず、解釈を観る者に委ねた。妻と息子の死を経たのちも制作を続け、2005年に殺害された。音楽にも造形にも通じ、建築を学んだのち独学で絵画を始めた。"},{"name":"フランティシェク・クプカ","chapter":"c7-原始性の復権","sub":10,"subCount":12,"tags":["art","religion"],"birth":1871,"death":1957,"href":"https://note.com/search?q=from%3A%40varelser%20%E3%83%95%E3%83%A9%E3%83%B3%E3%83%86%E3%82%A3%E3%82%B7%E3%82%A7%E3%82%AF%E3%83%BB%E3%82%AF%E3%83%97%E3%82%AB&context=note&mode=search","article":false,"descRaw":"（チェコ・1871–1957）：チェコ生まれの画家。神智学や心霊研究に関心を持ち、霊的な世界を抽象絵画で表現した先駆者の一人。代表作『アモルファ、フーガ2色』（1912年）は、音楽的な構造を持つ抽象画。プラハとパリで活動し、目に見えない力や振動を色彩と形態に変換する試みを、抽象の源流として展開した。抽象の理論を著書『造形芸術における創造』（1923年）にまとめた。"},{"name":"パーヴェル・フィロノフ","chapter":"c7-原始性の復権","sub":10,"subCount":12,"tags":["art"],"birth":1883,"death":1941,"href":"https://note.com/search?q=from%3A%40varelser%20%E3%83%91%E3%83%BC%E3%83%B4%E3%82%A7%E3%83%AB%E3%83%BB%E3%83%95%E3%82%A3%E3%83%AD%E3%83%8E%E3%83%95&context=note&mode=search","article":false,"descRaw":"（露・1883–1941）：ロシアの画家。分析的芸術を提唱し、微粒子のような細部が増殖する内的世界を描いた。画面全体を小さな単位で埋め尽くす手法は、意識の深層を顕微鏡的に描く試みとされる。革命後のロシアで活動したが、公式の美術から孤立し、1941年にレニングラード包囲下で餓死した。弟子たちとともに「分析的芸術」の集団を形成し、絵画の理論を追究した。"},{"name":"カジミール・マレーヴィチ","chapter":"c7-原始性の復権","sub":10,"subCount":12,"tags":["art","religion"],"birth":1879,"death":1935,"href":"https://note.com/search?q=from%3A%40varelser%20%E3%82%AB%E3%82%B8%E3%83%9F%E3%83%BC%E3%83%AB%E3%83%BB%E3%83%9E%E3%83%AC%E3%83%BC%E3%83%B4%E3%82%A3%E3%83%81&context=note&mode=search","article":false,"descRaw":"（露・1879–1935）：ロシアの画家。1915年に発表した『黒い正方形』を起点に、シュプレマティズム（至高主義）を創始した。形態を極限まで削ぎ落とし、純粋な感覚だけを描くことを目指した。『白の上の白』（1918年）は、恍惚的な無の境地を示す。抽象絵画の思想的基盤を築いた一人である。『非対象世界』などの著作で、シュプレマティズムの理論を展開した。"},{"name":"アーシル・ゴーキー","chapter":"c7-原始性の復権","sub":10,"subCount":12,"tags":["art","theory"],"birth":1904,"death":1948,"href":"https://note.com/search?q=from%3A%40varelser%20%E3%82%A2%E3%83%BC%E3%82%B7%E3%83%AB%E3%83%BB%E3%82%B4%E3%83%BC%E3%82%AD%E3%83%BC&context=note&mode=search","article":false,"descRaw":"（米・1904–1948）：アルメニア生まれのアメリカの画家。抽象表現主義の先駆者として、自動描画的な線による無意識の形象を描いた。代表作『肝臓は雄鶏の櫛』（1944年）は、有機的な形態が漂う画面で知られる。ポロックら後進に影響を与えたが、病と事故に苦しみ、1948年に自殺した。アルメニア人虐殺を逃れて渡米し、故郷の記憶を作品に込めた。"},{"name":"ルチオ・フォンタナ","chapter":"c7-原始性の復権","sub":10,"subCount":12,"tags":["art","religion"],"birth":1899,"death":1968,"href":"https://note.com/search?q=from%3A%40varelser%20%E3%83%AB%E3%83%81%E3%82%AA%E3%83%BB%E3%83%95%E3%82%A9%E3%83%B3%E3%82%BF%E3%83%8A&context=note&mode=search","article":false,"descRaw":"（伊-亜・1899–1968）：イタリア生まれの画家・彫刻家。空間主義を提唱し、1949年からキャンバスに切り込みを入れた『空間概念』シリーズを制作した。画面を切り裂く行為は、平面を超えて宇宙的な空間へ開く身振りとされる。切断による超越の表現は、戦後美術における物質と空間の問い直しとなった。切り込みのほかに、穴を開けたブーカ（穴）シリーズも制作した。"},{"name":"白髪一雄","chapter":"c7-原始性の復権","sub":10,"subCount":12,"tags":["art","practice"],"birth":1924,"death":2008,"href":"https://note.com/search?q=from%3A%40varelser%20%E7%99%BD%E9%AB%AA%E4%B8%80%E9%9B%84&context=note&mode=search","article":false,"descRaw":"（日・1924–2008）：日本の画家。具体美術協会の中心メンバー。1955年頃から、床に置いたキャンバスの上で天井から吊るしたロープにつかまり、足に絵具をつけて描くフット・ペインティングを始めた。身体全体を使ったアクションは、トランス的な制作行為として知られ、絵画を身体の痕跡として捉え直した。具体美術協会の創設メンバーとして、戦後日本の前衛を牽引した。"},{"name":"小松美羽","chapter":"c7-原始性の復権","sub":10,"subCount":12,"tags":["art","religion","culture"],"birth":1984,"death":null,"href":"https://note.com/search?q=from%3A%40varelser%20%E5%B0%8F%E6%9D%BE%E7%BE%8E%E7%BE%BD&context=note&mode=search","article":false,"descRaw":"（日・1984–）：日本の画家。神獣や狛犬など、シャーマニックな記号と儀礼的な図像を描く。長野県出身で、神社への奉納や、世界各地でのライブペインティングで知られる。祈りと鎮魂をテーマに、動物の霊的な姿を力強い線と色彩で描き、現代における祭祀的な芸術の実践として注目されている。神社への奉納画や世界各地でのライブペインティングでも知られ、祈りの芸術を実践している。"},{"name":"大竹伸朗","chapter":"c7-原始性の復権","sub":10,"subCount":12,"tags":["art"],"birth":1955,"death":null,"href":"https://note.com/search?q=from%3A%40varelser%20%E5%A4%A7%E7%AB%B9%E4%BC%B8%E6%9C%97&context=note&mode=search","article":false,"descRaw":"（日・1955–）：日本の美術家。都市の断片や印刷物、写真を重ねたコラージュと、大量のスクラップブックで知られる。記憶の堆積と意識の断片を、層状の画面に定着させる。直島の銭湯『I♥湯』（2009年）など、場所と記憶を結びつけるプロジェクトも手がけ、日常の残像を芸術に変換した。膨大なスクラップブックは、記憶の断片を集積する作品として展示もされた。"},{"name":"会田誠","chapter":"c7-原始性の復権","sub":10,"subCount":12,"tags":["art","theory"],"birth":1965,"death":null,"href":"https://note.com/search?q=from%3A%40varelser%20%E4%BC%9A%E7%94%B0%E8%AA%A0&context=note&mode=search","article":false,"descRaw":"（日・1965–）：日本の美術家。無意識のグロテスクな欲望や社会のタブーを、あえて可視化する作品で知られる。代表作『紐育空爆之図』（1996年）は、戦争と日常のイメージを衝突させた。漫画的な筆致と日本画の技法を交え、内面の暗部と社会の抑圧を、ユーモアと不穏さをもって描き出す。日本画の技法と現代的な題材を組み合わせ、国内外で議論を呼んだ。"},{"name":"伊藤若冲","chapter":"c7-原始性の復権","sub":10,"subCount":12,"tags":["art","practice"],"birth":1716,"death":1800,"href":"https://note.com/search?q=from%3A%40varelser%20%E4%BC%8A%E8%97%A4%E8%8B%A5%E5%86%B2&context=note&mode=search","article":false,"descRaw":"（日・1716–1800）：江戸時代の画家。『動植綵絵』（1757〜66年）の30幅で知られ、鶏や花鳥を、夢幻的で精密な色彩で描いた。禅的な瞑想と観察が結びついた画面は、生物の生命感を誇張し、現実を超えたリズムを持つ。京都の相国寺に奉納された連作は、日本絵画における幻視的な自然描写の頂点とされる。晩年には水墨による簡潔な表現へ移行し、禅的な境地を示した。"},{"name":"河鍋暁斎","chapter":"c7-原始性の復権","sub":10,"subCount":12,"tags":["art","culture"],"birth":1831,"death":1889,"href":"https://note.com/search?q=from%3A%40varelser%20%E6%B2%B3%E9%8D%8B%E6%9A%81%E6%96%8E&context=note&mode=search","article":false,"descRaw":"（日・1831–1889）：江戸末期から明治の絵師。妖怪や地獄、変化の世界を、戯画的な筆致で描いた。狩野派に学びながら、庶民的な笑いと怪異を結びつけ、無意識の劇場性を見せた。『暁斎漫画』などの画集は、夢と現実が交錯する江戸の想像力を伝え、後の漫画表現にも影響を与えた。明治期には『暁斎漫画』などの画集を刊行し、戯画の大家として知られ、浮世絵から漫画への橋渡しとなった。"},{"name":"マン・レイ","chapter":"c7-原始性の復権","sub":10,"subCount":12,"tags":["art","dream"],"birth":1890,"death":1976,"href":"https://note.com/varelser/n/ne7ead4db5504","article":true,"descRaw":"（米-仏・1890–1976）：アメリカ生まれの写真家・画家。ダダとシュルレアリスムの中心人物として、印画紙に物を置いて感光させるレイヨグラフや、ソラリゼーションの技法を開発した。夢のような写真表現で、日常の事物を幻想的なイメージへ変換した。パリを拠点に、写真を芸術の実験場とした。写真家としてだけでなく、オブジェや映画も手がけ、パリの前衛芸術の中心人物となった。"},{"name":"ドラ・マール","chapter":"c7-原始性の復権","sub":10,"subCount":12,"tags":["art","dream"],"birth":1907,"death":1997,"href":"https://note.com/search?q=from%3A%40varelser%20%E3%83%89%E3%83%A9%E3%83%BB%E3%83%9E%E3%83%BC%E3%83%AB&context=note&mode=search","article":false,"descRaw":"（仏・1907–1997）：フランスの写真家。1930年代のシュルレアリスム写真で知られ、ピカソの『泣く女』のモデルとしても有名。夢的で歪んだ写真表現を残し、モンタージュや二重露光で無意識のイメージを定着させた。ピカソとの関係ののちは絵画に移行し、内省的な作品を描き続けた。ピカソとの関係ののちは、孤独な生活の中で絵画や素描を描き続けた。"},{"name":"クロード・カアン","chapter":"c7-原始性の復権","sub":10,"subCount":12,"tags":["art"],"birth":1894,"death":1954,"href":"https://note.com/search?q=from%3A%40varelser%20%E3%82%AF%E3%83%AD%E3%83%BC%E3%83%89%E3%83%BB%E3%82%AB%E3%82%A2%E3%83%B3&context=note&mode=search","article":false,"descRaw":"（仏・1894–1954）：フランスの作家・写真家。仮面や鏡を用いたジェンダー越境的なセルフポートレートで知られる。男性とも女性ともつかない姿で自らを撮り、自己のアイデンティティを流動的なものとして提示した。第二次大戦中はレジスタンスに参加し、芸術と政治的実践を結びつけた。ジャージー島でレジスタンス活動を行い、戦後は静かに暮らした。"},{"name":"アグネス・ペルトン","chapter":"c7-原始性の復権","sub":10,"subCount":12,"tags":["art","religion"],"birth":1881,"death":1961,"href":"https://note.com/search?q=from%3A%40varelser%20%E3%82%A2%E3%82%B0%E3%83%8D%E3%82%B9%E3%83%BB%E3%83%9A%E3%83%AB%E3%83%88%E3%83%B3&context=note&mode=search","article":false,"descRaw":"（米・1881–1961）：アメリカの画家。1938年結成の超越的絵画グループ（トランセンデンタル・ペインティング・グループ）に参加し、内的光の幻視を描いた。砂漠の風景と抽象的な光の形態を結びつけ、精神的なヴィジョンを静謐な画面に定着させた。神智学や東洋思想への関心が、超越的な絵画の背景にある。ニューメキシコの砂漠に暮らし、光と風景の幻視を描き続けた。"},{"name":"エマ・クンツ","chapter":"c7-原始性の復権","sub":10,"subCount":12,"tags":["art","clinical","religion"],"birth":1892,"death":1963,"href":"https://note.com/varelser/n/nc19d2a68b83d","article":true,"descRaw":"（瑞・1892–1963）：スイスのヒーラー・研究者・画家。1938年から、振り子を用いたダウジング（ラジオエステジア）によって、方眼紙に大規模な幾何学図を描いた。400点を超える図像は、診断と治療のための道具であり、エネルギー場や意識の関係を可視化する試みだった。生前は芸術家を名乗らず、死後に再評価された。死後の1973年に初めて展示され、抽象絵画の再評価へつながった。"},{"name":"ウィーン幻想派（エルンスト・フックスなど）","chapter":"c7-原始性の復権","sub":10,"subCount":12,"tags":["art","religion"],"birth":null,"death":null,"href":"https://note.com/varelser/n/nf8ce38baafbe","article":true,"descRaw":"：1946年にウィーンで結成された画家集団。エルンスト・フックスらが中心となり、旧巨匠の細密な技法で神秘主義的な幻視を描いた。夢と神話、錬金術的なイメージを、写実的な筆致で定着させる様式は、シュルレアリスムと結びつきながら、戦後オーストリアの幻想絵画を代表した。旧巨匠の油彩技法を学び直し、細密な描写で夢の世界を描いた。"},{"name":"S.H.ラザ","chapter":"c7-原始性の復権","sub":10,"subCount":12,"tags":["art","practice","religion"],"birth":1922,"death":2016,"href":"https://note.com/varelser/n/n10b315cb7f48","article":true,"descRaw":"（印・1922–2016）：インドの画家。1947年にボンベイ・プログレッシブ・アーティスツ・グループを結成し、後にパリに移住した。ヒンドゥー教のタントラ思想に根ざし、宇宙の始原を示す「ビンドゥ（点）」を中心に据えた瞑想的な抽象を描いた。点と幾何学による静かな画面は、瞑想と宇宙論の視覚化である。インドの部族芸術やタントラの図像からも影響を受け、色彩の瞑想を深めた。"},{"name":"フリーダ・カーロ","chapter":"c7-原始性の復権","sub":10,"subCount":12,"tags":["art","dream"],"birth":1907,"death":1954,"href":"https://note.com/varelser/n/n75033f0f16aa","article":true,"descRaw":"（墨・1907–1954）：メキシコの画家。1925年のバス事故による重傷を機に絵を描き始め、痛みと夢に満ちた自画像を生涯にわたり描いた。ディエゴ・リベラとの関係、メキシコの民俗文化、身体の苦痛とアイデンティティを結びつけ、内面の世界を鮮烈な色彩で表現した。夢的な自画像の代表である。メキシコの民俗芸術や先住民文化を背景に、自己と身体を描き続けた。"},{"name":"ウィフレド・ラム","chapter":"c7-原始性の復権","sub":10,"subCount":12,"tags":["art","religion","culture"],"birth":1902,"death":1982,"href":"https://note.com/varelser/n/ndc847281b50d","article":true,"descRaw":"（キューバ・1902–1982）：キューバの画家。アフリカ系と中国系の血を引き、サンテリアの霊性を背景に持つ。パリでピカソらと交流し、シュルレアリスムとアフリカ的造形を融合させた。代表作『ジャングル』（1943年）は、仮面のような顔と密林の形態が交錯する画面で、霊的な世界観を描き出した。キューバ革命後はパリとキューバを行き来し、カリブの霊性を描いた。"},{"name":"李禹煥（リー・ウーファン）","chapter":"c7-原始性の復権","sub":10,"subCount":12,"tags":["art","theory","religion"],"birth":1936,"death":null,"href":"https://note.com/search?q=from%3A%40varelser%20%E6%9D%8E%E7%A6%B9%E7%85%A5&context=note&mode=search","article":false,"descRaw":"（韓-日・1936–）：韓国生まれの美術家。1968年頃から日本でもの派を主導し、石と鉄板などの素材を、余白のある空間に配置した。素材同士の「出会い」と、空間に生じる知覚の変容を主題とし、東洋的な「空」の思想と現代美術を接続した。絵画においても、余白と筆触による瞑想的な画面を追求した。1970年代の個展や著作を通じて、もの派の思想を広く提示した。"},{"name":"杉本博司","chapter":"c7-原始性の復権","sub":10,"subCount":12,"tags":["art","theory"],"birth":1948,"death":null,"href":"https://note.com/varelser/n/n655b45d568f3","article":true,"descRaw":"（日・1948–）：日本の写真家。『海景』（1980年〜）や『劇場』（1976年〜）のシリーズで、長時間露光による時間の凝縮を表現した。海と空だけの画面や、映画一本分の光を一枚に焼き付けた劇場の写真は、意識と記憶、時間の物質化をテーマとする。古代美術への関心も深く、時間の哲学を写真で問う。近年は建築や舞台美術も手がけ、時間と空間の芸術を多角的に展開している。"},{"name":"イヴ・クライン","chapter":"c7-原始性の復権","sub":10,"subCount":12,"tags":["art","theory"],"birth":1928,"death":1962,"href":"https://note.com/varelser/n/ne1a018d13e11","article":true,"descRaw":"（仏・1928–1962）：フランスの美術家。独自の青色顔料インターナショナル・クライン・ブルー（IKB）によるモノクローム絵画で知られる。1958年の「空虚」展では画廊を空にして展示し、物質を超えた空間と感受性を提示した。1960年の「人体測定」では、IKBを塗った身体をキャンバスに押し当てた。薔薇十字思想や禅に関心を持ち、柔道四段の段位も得た。34歳で没した。"},{"name":"ルイーズ・ブルジョワ","chapter":"c7-原始性の復権","sub":10,"subCount":12,"tags":["art","theory"],"birth":1911,"death":2010,"href":"https://note.com/search?q=from%3A%40varelser%20%E3%83%AB%E3%82%A4%E3%83%BC%E3%82%BA%E3%83%BB%E3%83%96%E3%83%AB%E3%82%B8%E3%83%A7%E3%83%AF&context=note&mode=search","article":false,"descRaw":"（仏・1911–2010）：フランス生まれのアメリカの彫刻家。幼少期の家族の記憶とトラウマを素材に、意識と無意識、母性と恐怖の緊張を、彫刻・インスタレーション・ドローイングで表現した。巨大な蜘蛛の彫刻《ママン》（1999年）は、母の象徴であり自画像でもあると語った。10年以上にわたる精神分析の経験が作品の背景にあり、1982年のMoMA回顧展で国際的評価を確立した。"},{"name":"フランシス・ベーコン","chapter":"c7-原始性の復権","sub":10,"subCount":12,"tags":["art","theory"],"birth":1909,"death":1992,"href":"https://note.com/varelser/n/n16fd7a69380b","article":true,"descRaw":"（英・1909–1992）：アイルランド生まれのイギリスの画家。歪み、叫び、溶けかかる肉体を、檻のような幾何学的構造の中に描き、実存の不安を可視化した。ベラスケスの『教皇インノケンティウス10世』に基づく「叫ぶ教皇」シリーズ（1953年〜）が代表作。「我々は肉であり、潜在的な死体である」と語り、神経に直接作用する絵画を目指した。恋人ジョージ・ダイアーの死を悼む三幅対も知られる。"},{"name":"アンゼルム・キーファー","chapter":"c7-原始性の復権","sub":10,"subCount":12,"tags":["art","religion"],"birth":1945,"death":null,"href":"https://note.com/search?q=from%3A%40varelser%20%E3%82%A2%E3%83%B3%E3%82%BC%E3%83%AB%E3%83%A0%E3%83%BB%E3%82%AD%E3%83%BC%E3%83%95%E3%82%A1%E3%83%BC&context=note&mode=search","article":false,"descRaw":"（独・1945–）：ドイツの画家・彫刻家。戦後ドイツの歴史、神話、聖書、カバラを題材に、鉛・藁・砂・灰などを用いた巨大な画面を描く。鉛は錬金術における変容の物質であり、土星と結びつく素材とされる。ヨーゼフ・ボイスに師事し、代表作《マルガレーテ》（1981年）や鉛の本のシリーズで、記憶と破壊、救済の問いを提示した。2023年にはヴィム・ヴェンダース監督のドキュメンタリー映画も公開された。"},{"name":"エドガー・アラン・ポー","chapter":"c7-原始性の復権","sub":11,"subCount":12,"tags":["art","dream"],"birth":1809,"death":1849,"href":"https://note.com/search?q=from%3A%40varelser%20%E3%82%A8%E3%83%89%E3%82%AC%E3%83%BC%E3%83%BB%E3%82%A2%E3%83%A9%E3%83%B3%E3%83%BB%E3%83%9D%E3%83%BC&context=note&mode=search","article":false,"descRaw":"（米・1809–1849）：アメリカの作家・詩人（1809-1849）。「アッシャー家の崩壊」や「黒猫」などで、恐怖・悪夢・催眠状態の内面を精密に描いた。詩「大鴉」や探偵小説の創始でも知られる。死の直前の譫妄や、阿片・アルコールとの関係も論じられてきた。悪夢の心理を科学的に観察するような文体で、ゴシック文学と心理小説の橋渡しをした作家である。"},{"name":"フョードル・ドストエフスキー","chapter":"c7-原始性の復権","sub":11,"subCount":12,"tags":["art","science"],"birth":1821,"death":1881,"href":"https://note.com/varelser/n/n5d16aee73885","article":true,"descRaw":"（露・1821–1881）：ロシアの作家（1821-1881）。てんかん発作の前兆として体験した恍惚感（エクスタティック・オーラ）は、『白痴』のムイシュキン公爵の発作描写に反映された。『罪と罰』（1866）や『カラマーゾフの兄弟』（1880）で、分裂する意識や二重人格、罪の意識の深層を描いた。発熱的な意識状態を、宗教的・哲学的探求と結びつけた文学者である。"},{"name":"マルセル・プルースト","chapter":"c7-原始性の復権","sub":11,"subCount":12,"tags":["art","theory"],"birth":1871,"death":1922,"href":"https://note.com/search?q=from%3A%40varelser%20%E3%83%9E%E3%83%AB%E3%82%BB%E3%83%AB%E3%83%BB%E3%83%97%E3%83%AB%E3%83%BC%E3%82%B9%E3%83%88&context=note&mode=search","article":false,"descRaw":"（仏・1871–1922）：フランスの作家（1871-1922）。『失われた時を求めて』（1913-27）で、マドレーヌの一片から蘇る無意識的記憶（無意志的記憶）を描き、記憶の深層と時間の意識を文学化した。夢と半覚醒の状態における想起を、精密な内面描写で捉えた。意識の時間的構造を探求した20世紀文学の巨匠である。社交界と内面の往還を描く長大な小説は、20世紀文学の金字塔である。"},{"name":"クラリス・リスペクトル","chapter":"c7-原始性の復権","sub":11,"subCount":12,"tags":["art","theory"],"birth":1920,"death":1977,"href":"https://note.com/varelser/n/nef5957e5da25","article":true,"descRaw":"（伯・1920–1977）：ウクライナ生まれのブラジル人作家（1920-1977）。『受難の身』や『星の時』などで、内的時間の拡張と、存在の瞬間における意識の変容を描いた。日常の些細な出来事から形而上学的な覚醒へと至る文体は、実存的な意識の探求として評価される。ブラジル文学における内面文学の中心人物である。その文体は、ポルトガル語文学における意識の詩学として高く評価される。"},{"name":"ブルーノ・シュルツ","chapter":"c7-原始性の復権","sub":11,"subCount":12,"tags":["art","dream"],"birth":1892,"death":1942,"href":"https://note.com/search?q=from%3A%40varelser%20%E3%83%96%E3%83%AB%E3%83%BC%E3%83%8E%E3%83%BB%E3%82%B7%E3%83%A5%E3%83%AB%E3%83%84&context=note&mode=search","article":false,"descRaw":"（波・1892–1942）：ポーランドの作家・画家（1892-1942）。『シナモン商店街』（1934、日本では『ワニ街』などとして紹介）で、故郷ドロホビチの日常を夢質の散文で変容させ、父や街が神話的形象へと変わる世界を描いた。現実の変容と夢の論理を結ぶ、東欧幻想文学の特異な作家である。ホロコーストで命を落とした。未完の長編『メシア』の構想も残され、戦火で失われた作品も多い。"},{"name":"ミハイル・ブルガーコフ","chapter":"c7-原始性の復権","sub":11,"subCount":12,"tags":["art","religion"],"birth":1891,"death":1940,"href":"https://note.com/search?q=from%3A%40varelser%20%E3%83%9F%E3%83%8F%E3%82%A4%E3%83%AB%E3%83%BB%E3%83%96%E3%83%AB%E3%82%AC%E3%83%BC%E3%82%B3%E3%83%95&context=note&mode=search","article":false,"descRaw":"（露・1891–1940）：ロシアの作家（1891-1940）。『巨匠とマルガリータ』（1928-40執筆、死後刊行）で、悪魔ヴォランドの来訪と、魔女となったマルガリータの飛行など、悪魔的幻視と夢の世界を描いた。ソ連の検閲下で書かれたこの大作は、幻視を政治的寓話として機能させた。現実と超自然が交錯する20世紀ロシア文学の傑作である。"},{"name":"スタニスワフ・レム","chapter":"c7-原始性の復権","sub":11,"subCount":12,"tags":["art","theory"],"birth":1921,"death":2006,"href":"https://note.com/varelser/n/nde1e188fa5cc","article":true,"descRaw":"（波・1921–2006）：ポーランドのSF作家（1921-2006）。『ソラリス』（1961）で、思考を実体化する惑星ソラリスの海を描き、人間の知覚と記憶の不確定性を問うた。『エデン』や『砂漠の惑星』でも、他者との接触不可能性を主題化した。意識の限界をSFの哲学的核心に据えた作家であり、タルコフスキーが『ソラリス』を映画化した。"},{"name":"アンリ・ミショー","chapter":"c7-原始性の復権","sub":11,"subCount":12,"tags":["substance","art"],"birth":1899,"death":1984,"href":"https://note.com/search?q=from%3A%40varelser%20%E3%82%A2%E3%83%B3%E3%83%AA%E3%83%BB%E3%83%9F%E3%82%B7%E3%83%A7%E3%83%BC&context=note&mode=search","article":false,"descRaw":"（仏・1899–1984）：ベルギー生まれのフランスの詩人・画家（1899-1984）。メスカリン体験をもとに『惨めな奇蹟』（1956）などで、幻覚の言語化と素描による記録を試みた。薬物による意識変容を、詩と絵画の両方で精密に観察・記述した。内面の空間を描く実験的な作家として、シュルレアリスムの周辺で独自の位置を占める。素描による幻覚の記録は、言語を超えた意識の地図とも評される。"},{"name":"ケン・キージー","chapter":"c7-原始性の復権","sub":11,"subCount":12,"tags":["substance","art"],"birth":1935,"death":2001,"href":"https://note.com/search?q=from%3A%40varelser%20%E3%82%B1%E3%83%B3%E3%83%BB%E3%82%AD%E3%83%BC%E3%82%B8%E3%83%BC&context=note&mode=search","article":false,"descRaw":"（米・1935–2001）：アメリカの作家（1935-2001）。『カッコーの巣の上で』（1962）の作者で、スタンフォード大学でのCIA系の幻覚剤実験への参加を経て、メリー・プランクスターズとともに「アシッド・テスト」を主催し、LSD文化の中心人物となった。精神病院とドラッグ体験を結ぶカウンターカルチャーの象徴であり、トム・ウルフ『クール・クール・LSDテスト』に描かれた。"},{"name":"H.P.ラヴクラフト","chapter":"c7-原始性の復権","sub":11,"subCount":12,"tags":["art","dream"],"birth":1890,"death":1937,"href":"https://note.com/search?q=from%3A%40varelser%20H.P.%E3%83%A9%E3%83%B4%E3%82%AF%E3%83%A9%E3%83%95%E3%83%88&context=note&mode=search","article":false,"descRaw":"（米・1890–1937）：アメリカの作家（1890-1937）。クトゥルフ神話や「夢境諸篇」で、人間の理解を超えた宇宙的存在との遭遇による恐怖と、夢の世界ランドルフ・カーターの冒険を描いた。コズミック・ホラーの創始者であり、夢をもう一つの現実の次元として体系化した。生前は無名に近かったが、死後にSF・ホラー文学に巨大な影響を与えた。"},{"name":"フアン・ルルフォ","chapter":"c7-原始性の復権","sub":11,"subCount":12,"tags":["art","dream","religion"],"birth":1917,"death":1986,"href":"https://note.com/search?q=from%3A%40varelser%20%E3%83%95%E3%82%A2%E3%83%B3%E3%83%BB%E3%83%AB%E3%83%AB%E3%83%95%E3%82%A9&context=note&mode=search","article":false,"descRaw":"（墨・1917–1986）：メキシコの作家（1917-1986）。『ペドロ・パラモ』（1955）で、死者の声が満ちる村コマラを描き、死者の世界と夢が融合した物語を築いた。わずか2冊の小説と短編集で、ラテンアメリカ文学の方向を変えた。死と生の境界を曖昧にする語りは、魔術的リアリズムの先駆とされる。短編集『燃える平原』と合わせ、わずかな作品で文学史を変えた。"},{"name":"イサベル・アジェンデ","chapter":"c7-原始性の復権","sub":11,"subCount":12,"tags":["art","culture"],"birth":1942,"death":null,"href":"https://note.com/search?q=from%3A%40varelser%20%E3%82%A4%E3%82%B5%E3%83%99%E3%83%AB%E3%83%BB%E3%82%A2%E3%82%B8%E3%82%A7%E3%83%B3%E3%83%87&context=note&mode=search","article":false,"descRaw":"（智・1942–）：チリの作家（1942-）。『精霊たちの家』（1982）で、霊媒や予知夢、死者との交信を日常に織り込んだ魔術的リアリズムを展開した。チリの激動の歴史を、女性たちの霊的な視点から描く。ラテンアメリカ文学における魔術的リアリズムの代表的な女性作家である。『エバ・ルーナ』（1987）でも、物語ることによる自己の回復を描いた。"},{"name":"サルマン・ラシュディ","chapter":"c7-原始性の復権","sub":11,"subCount":12,"tags":["art","dream"],"birth":1947,"death":null,"href":"https://note.com/search?q=from%3A%40varelser%20%E3%82%B5%E3%83%AB%E3%83%9E%E3%83%B3%E3%83%BB%E3%83%A9%E3%82%B7%E3%83%A5%E3%83%87%E3%82%A3&context=note&mode=search","article":false,"descRaw":"（印-英・1947–）：インド生まれのイギリスの作家（1947-）。『真夜中の子供たち』（1981）で、インド独立の瞬間に生まれた子供たちの超能力と夢を描き、ブッカー賞を受けた。『悪魔の詩』（1988）では、夢と記憶、預言者的幻視が政治的変容と交錯する。夢を歴史とアイデンティティの言語とした作家である。『ハルーンと物語の海』などでも、物語と夢の力を描き続けた。"},{"name":"サーデグ・ヘダーヤト","chapter":"c7-原始性の復権","sub":11,"subCount":12,"tags":["art","dream"],"birth":1903,"death":1951,"href":"https://note.com/varelser/n/n0842c83d6aae","article":true,"descRaw":"（イラン・1903–1951）：イランの作家（1903-1951）。『盲目の梟』（1936）で、悪夢のような反復と死の執着に満ちた世界を描き、ペルシア文学のモダニズムを切り開いた。死とエロス、幻覚的なイメージの連鎖は、イラン文学における意識の暗部への探求として評価される。パリで自ら命を絶った。カフカやサルトルの影響を受け、イラン近代文学の父の一人とされる。"},{"name":"莫言（モー・イェン）","chapter":"c7-原始性の復権","sub":11,"subCount":12,"tags":["art","culture","dream"],"birth":1955,"death":null,"href":"https://note.com/varelser/n/n05ee676d9e8e","article":true,"descRaw":"（中・1955–）：中国の作家（1955-）。『紅いコーリャン』（1987）や『酒国』（1992）で、民間信仰と身体変容、夢的な現実を交錯させ、「幻覚的リアリズム」と評される文体を築いた。高密県の農村を舞台に、歴史と神話、暴力と笑いを結ぶ物語を展開した。2012年にノーベル文学賞を受けた。『生死疲労』（2006）でも、輪廻する魂の視点から中国の百年を描いた。"},{"name":"残雪（Can Xue）","chapter":"c7-原始性の復権","sub":11,"subCount":12,"tags":["art","dream"],"birth":1953,"death":null,"href":"https://note.com/search?q=from%3A%40varelser%20%E6%AE%8B%E9%9B%AA&context=note&mode=search","article":false,"descRaw":"（中・1953–）：中国の作家（1953-）。『黄泥街』や『蒼老たる浮雲』などで、夢と怪異が融合した現実を描き、因果の崩れた悪夢的論理による物語を展開する。カフカやボルヘスの影響を受けつつ、中国の前衛文学における夢の作家として国際的に評価される。意識の深層を寓話的に描く現代中国文学の特異な存在である。その独特の夢の論理は、海外でも高く評価され、翻訳が進んでいる。"},{"name":"ルーミー","chapter":"c7-原始性の復権","sub":11,"subCount":12,"tags":["art","religion","practice"],"birth":1207,"death":1273,"href":"https://note.com/search?q=from%3A%40varelser%20%E3%83%AB%E3%83%BC%E3%83%9F%E3%83%BC&context=note&mode=search","article":false,"descRaw":"（ペルシア・1207–1273）／（1145–1221）：ペルシアのスーフィー詩人、アッタール（1145頃-1221頃）とルーミー（1207-1273）。アッタールの『鳥の会議』は、鳥たちがシームルグを求める旅を魂の合一への寓意として描いた。ルーミーの『マスナヴィー』は、愛と神との合一体験を謳う神秘詩の金字塔となった。二人はともに、神への愛による自我の消滅と合一を詩にした、スーフィー神秘詩の双璧である。"},{"name":"アッタール","chapter":"c7-原始性の復権","sub":11,"subCount":12,"tags":["art","religion","practice"],"birth":1145,"death":1221,"href":"https://note.com/search?q=from%3A%40varelser%20%E3%82%A2%E3%83%83%E3%82%BF%E3%83%BC%E3%83%AB&context=note&mode=search","article":false,"descRaw":"（ペルシア・1207–1273）／（1145–1221）：ペルシアのスーフィー詩人、アッタール（1145頃-1221頃）とルーミー（1207-1273）。アッタールの『鳥の会議』は、鳥たちがシームルグを求める旅を魂の合一への寓意として描いた。ルーミーの『マスナヴィー』は、愛と神との合一体験を謳う神秘詩の金字塔となった。二人はともに、神への愛による自我の消滅と合一を詩にした、スーフィー神秘詩の双璧である。"},{"name":"夢野久作","chapter":"c7-原始性の復権","sub":11,"subCount":12,"tags":["art","science"],"birth":1889,"death":1936,"href":"https://note.com/search?q=from%3A%40varelser%20%E5%A4%A2%E9%87%8E%E4%B9%85%E4%BD%9C&context=note&mode=search","article":false,"descRaw":"（1889–1936）：日本の作家（1889-1936）。『ドグラ・マグラ』（1935）で、精神病院を舞台に、記憶喪失の青年が体験する意識の迷宮と精神病理的な幻視を描いた。探偵小説の枠を超えたこの大作は、催眠・遺伝・脳の謎をめぐる実験的な物語として、日本の幻想文学の頂点とされる。『瓶詰の地獄』などの短編でも、狂気と幻想の世界を描いた。"},{"name":"泉鏡花","chapter":"c7-原始性の復権","sub":11,"subCount":12,"tags":["art","religion"],"birth":1873,"death":1939,"href":"https://note.com/search?q=from%3A%40varelser%20%E6%B3%89%E9%8F%A1%E8%8A%B1&context=note&mode=search","article":false,"descRaw":"（1873–1939）：日本の作家（1873-1939）。『高野聖』（1900）や『天守物語』（1917）で、山中の妖女や天守の富姫など、怪異と幽玄の世界を描いた。現実と異界の境界が溶ける意識を、幻想的な美文で物語化した。明治・大正期の浪漫主義文学の代表者であり、幻想文学の源流となった作家である。『婦系図』（1907）や『歌行燈』など、幻想と人情を描いた作品も多い。"},{"name":"江戸川乱歩","chapter":"c7-原始性の復権","sub":11,"subCount":12,"tags":["art","theory"],"birth":1894,"death":1965,"href":"https://note.com/search?q=from%3A%40varelser%20%E6%B1%9F%E6%88%B8%E5%B7%9D%E4%B9%B1%E6%AD%A9&context=note&mode=search","article":false,"descRaw":"（1894–1965）：日本の作家（1894-1965）。『人間椅子』（1925）や『陰獣』（1928）で、倒錯した知覚と欲望、見ることと見られることの転倒を描いた。日本の探偵小説の父であり、エログロ・ナンセンスの美学を通じて、意識の暗部と幻想を主題化した。夢と現実のあわいを描く推理文学の巨匠である。明智小五郎の創造者でもあり、日本のミステリー文学の礎を築いた。"},{"name":"寺山修司","chapter":"c7-原始性の復権","sub":11,"subCount":12,"tags":["art","dream"],"birth":1935,"death":1983,"href":"https://note.com/search?q=from%3A%40varelser%20%E5%AF%BA%E5%B1%B1%E4%BF%AE%E5%8F%B8&context=note&mode=search","article":false,"descRaw":"（1935–1983）：日本の詩人・劇作家・映画監督（1935-1983）。『書を捨てよ町へ出よう』（1971）などで、詩・映画・舞台に夢的な仕掛けを施し、日常と幻想を交錯させた。劇団「天井桟敷」を主宰し、見世物的な祝祭空間で観客の意識を揺さぶった。言葉と身体による意識変容の仕掛け人として、前衛芸術の中心にいた。『田園に死す』（1974）では、自伝的な記憶と幻想を交錯させた。"},{"name":"三島由紀夫","chapter":"c7-原始性の復権","sub":11,"subCount":12,"tags":["art"],"birth":1925,"death":1970,"href":"https://note.com/varelser/n/n7e336f28e454","article":true,"descRaw":"（1925–1970）：日本の作家（1925-1970）。『金閣寺』（1956）や『豊饒の海』（1965-70）で、身体・美・死を結びつけ、肉体の陶酔と滅びへの志向を描いた。ボディビルによる肉体改造や、古典芸能への傾倒も、意識の変容と美の探求と結びつく。戦後日本文学を代表する作家であり、1970年に自決した。『仮面の告白』（1949）でデビューし、早くから自我と身体を主題とした。"},{"name":"筒井康隆","chapter":"c7-原始性の復権","sub":11,"subCount":12,"tags":["art","dream"],"birth":1934,"death":null,"href":"https://note.com/search?q=from%3A%40varelser%20%E7%AD%92%E4%BA%95%E5%BA%B7%E9%9A%86&context=note&mode=search","article":false,"descRaw":"（1934–）：日本のSF作家（1934-）。『時をかける少女』（1967）や『パプリカ』（1993）で、時間・夢・知覚の改変を扱った。『パプリカ』では、夢探偵パプリカが他者の夢に入り込み、夢と現実の境界を崩壊させる。『虚人たち』（1981）などでも、意識の変容を実験的に描いた。日本のSFにおける夢と意識の作家である。"},{"name":"アンドレ・ブレトン","chapter":"c8-シュルレアリスムと無意識","sub":0,"subCount":2,"tags":["art","practice"],"birth":1896,"death":1966,"href":"https://note.com/varelser/n/n4de43605a06c","article":true,"descRaw":"（仏・1896–1966）：フランスの詩人・理論家（1896-1966）。『シュルレアリスム宣言』（1924）で、自動記述（オートマティスム）や夢の記録を芸術の方法として提唱し、シュルレアリスム運動を主導した。第一次大戦中の精神医学の経験が、無意識への関心の出発点となった。理性や道徳の検閲を外した意識の解放を目指し、20世紀芸術の方向を決定づけた。"},{"name":"アントナン・アルトー","chapter":"c8-シュルレアリスムと無意識","sub":0,"subCount":2,"tags":["art","substance","practice"],"birth":1896,"death":1948,"href":"https://note.com/search?q=from%3A%40varelser%20%E3%82%A2%E3%83%B3%E3%83%88%E3%83%8A%E3%83%B3%E3%83%BB%E3%82%A2%E3%83%AB%E3%83%88%E3%83%BC&context=note&mode=search","article":false,"descRaw":"（仏・1896–1948）：フランスの詩人・劇作家・俳優（1896-1948）。1936年にメキシコのタラウマラ族を訪れ、ペヨーテ儀礼に参加した体験を『タラウマラ』に記した。言語以前の身体と叫びによる「残酷の演劇」を提唱し、演劇をトランスとカタルシスの場とみなした。精神病院での長期入院も含め、極限の意識状態を芸術の核心に据えた前衛の巨人である。"},{"name":"ルネ・ドーマル","chapter":"c8-シュルレアリスムと無意識","sub":0,"subCount":2,"tags":["art","religion"],"birth":1908,"death":1944,"href":"https://note.com/search?q=from%3A%40varelser%20%E3%83%AB%E3%83%8D%E3%83%BB%E3%83%89%E3%83%BC%E3%83%9E%E3%83%AB&context=note&mode=search","article":false,"descRaw":"（仏・1908–1944）：フランスの詩人・作家（1908-1944）。未完の小説『類推の山』（死後出版）で、見えない山への登攀を神秘主義的な意識の上昇の寓意として描いた。グルジェフの教えにも関わり、東洋思想と西洋文学を結ぶ探求を続けた。夢と覚醒のあいだの意識状態への関心は、シュルレアリスムの周辺で独自の位置を占める。36歳で夭折した神秘主義文学の作家である。"},{"name":"ジェームズ・ジョイス","chapter":"c8-シュルレアリスムと無意識","sub":0,"subCount":2,"tags":["art"],"birth":1882,"death":1941,"href":"https://note.com/search?q=from%3A%40varelser%20%E3%82%B8%E3%82%A7%E3%83%BC%E3%83%A0%E3%82%BA%E3%83%BB%E3%82%B8%E3%83%A7%E3%82%A4%E3%82%B9&context=note&mode=search","article":false,"descRaw":"（愛・1882–1941）／（英・1882–1941）：アイルランドのジェームズ・ジョイス（1882-1941）とイギリスのヴァージニア・ウルフ（1882-1941）は、ともに1882年生まれで1941年に没したモダニズム文学の双璧である。ジョイスの『ユリシーズ』（1922）とウルフの『ダロウェイ夫人』（1925）や『灯台へ』（1927）は、意識の流れと内的独白により、知覚と記憶の内面時間を描き出した。二人の実験は、意識そのものを小説の形式とした20世紀文学の転換点である。"},{"name":"ヴァージニア・ウルフ","chapter":"c8-シュルレアリスムと無意識","sub":0,"subCount":2,"tags":["art"],"birth":1882,"death":1941,"href":"https://note.com/search?q=from%3A%40varelser%20%E3%83%B4%E3%82%A1%E3%83%BC%E3%82%B8%E3%83%8B%E3%82%A2%E3%83%BB%E3%82%A6%E3%83%AB%E3%83%95&context=note&mode=search","article":false,"descRaw":"（愛・1882–1941）／（英・1882–1941）：アイルランドのジェームズ・ジョイス（1882-1941）とイギリスのヴァージニア・ウルフ（1882-1941）は、ともに1882年生まれで1941年に没したモダニズム文学の双璧である。ジョイスの『ユリシーズ』（1922）とウルフの『ダロウェイ夫人』（1925）や『灯台へ』（1927）は、意識の流れと内的独白により、知覚と記憶の内面時間を描き出した。二人の実験は、意識そのものを小説の形式とした20世紀文学の転換点である。"},{"name":"フランツ・カフカ","chapter":"c8-シュルレアリスムと無意識","sub":0,"subCount":2,"tags":["art","dream"],"birth":1883,"death":1924,"href":"https://note.com/search?q=from%3A%40varelser%20%E3%83%95%E3%83%A9%E3%83%B3%E3%83%84%E3%83%BB%E3%82%AB%E3%83%95%E3%82%AB&context=note&mode=search","article":false,"descRaw":"（奥・1883–1924）：プラハのドイツ語作家（1883-1924）。『変身』『審判』『城』などで、ある朝目覚めると虫になっていた男や、到達できない城を描き、悪夢的な迷宮と自己同一性の解体を文学化した。夢の論理がそのまま現実の構造となる世界は、20世紀文学の原型となった。生前に発表した作品は少なく、死後に友人マックス・ブロートが遺稿を刊行した。"},{"name":"グスタフ・マイリンク","chapter":"c8-シュルレアリスムと無意識","sub":0,"subCount":2,"tags":["art","dream","religion"],"birth":1868,"death":1932,"href":"https://note.com/search?q=from%3A%40varelser%20%E3%82%B0%E3%82%B9%E3%82%BF%E3%83%95%E3%83%BB%E3%83%9E%E3%82%A4%E3%83%AA%E3%83%B3%E3%82%AF&context=note&mode=search","article":false,"descRaw":"（奥・1868–1932）：オーストリアの作家（1868-1932）。小説『ゴーレム』（1915）で、プラハのユダヤ人街に伝わるゴーレム伝説を、夢と現実が交錯する神秘的物語に仕立てた。神智学やオカルティズムへの関心が深く、夢の記憶や二重人格を主題化した。『緑の顔』『白いドミニコ会修道士』などでも、秘教的な想像力による現実の変容を描いた。"},{"name":"ロベルト・ムジール","chapter":"c8-シュルレアリスムと無意識","sub":0,"subCount":2,"tags":["art","theory"],"birth":1880,"death":1942,"href":"https://note.com/search?q=from%3A%40varelser%20%E3%83%AD%E3%83%99%E3%83%AB%E3%83%88%E3%83%BB%E3%83%A0%E3%82%B8%E3%83%BC%E3%83%AB&context=note&mode=search","article":false,"descRaw":"（奥・1880–1942）：オーストリアの作家（1880-1942）。未完の大作『特性のない男』で、主人公ウルリヒが体験する意識の「別の状態（Anderer Zustand）」を、神秘体験と倫理の探求として小説内に体系化した。数学と心理学を修めた背景が、意識の精密な分析を支えた。20世紀モダニズム文学における変性意識の最重要の理論的実践者とされる。"},{"name":"ヘルマン・ヘッセ","chapter":"c8-シュルレアリスムと無意識","sub":0,"subCount":2,"tags":["art","religion"],"birth":1877,"death":1962,"href":"https://note.com/search?q=from%3A%40varelser%20%E3%83%98%E3%83%AB%E3%83%9E%E3%83%B3%E3%83%BB%E3%83%98%E3%83%83%E3%82%BB&context=note&mode=search","article":false,"descRaw":"（独・1877–1962）：ドイツ生まれの作家（1877-1962）。『シッダールタ』（1922）で仏陀と同時代の求道者の悟りを描き、『荒野の狼』（1927）では自我の分裂と解体を描いた。ユング心理学の影響を受け、東洋的神秘と西洋文学の橋渡しをした。1946年にノーベル文学賞を受けた。自己探求と意識の変容を生涯の主題とした作家である。"},{"name":"フェルナンド・ペソア","chapter":"c8-シュルレアリスムと無意識","sub":0,"subCount":2,"tags":["art","theory"],"birth":1888,"death":1935,"href":"https://note.com/varelser/n/nbe527c2462ed","article":true,"descRaw":"（葡・1888–1935）：ポルトガルの詩人（1888-1935）。70を超える異名（ヘテロニム）を創出し、それぞれに異なる経歴・文体・世界観を与えて作品を書いた。解離的な多重人格を意図的な文学実践として運用し、自我の統一性を解体した。代表作『不安の書』は死後に編まれた。分裂する自己を方法化した、20世紀文学の特異な存在である。"},{"name":"アナイス・ニン","chapter":"c8-シュルレアリスムと無意識","sub":0,"subCount":2,"tags":["art","dream"],"birth":1903,"death":1977,"href":"https://note.com/varelser/n/n08e85b699fde","article":true,"descRaw":"（仏-米・1903–1977）：フランス生まれの作家（1903-1977）。10代から書き続けた『アナイス・ニンの日記』は、夢・性・無意識の継続的な自己記録として知られる。精神分析を受け、シュルレアリスムやユング心理学と交わりながら、内的心理を文学化した。『ヘンリー・ミラーとの愛』など、エロティシズムと夢の言語を結ぶ先駆的な女性作家である。"},{"name":"ジャン＝ポール・サルトル","chapter":"c8-シュルレアリスムと無意識","sub":0,"subCount":2,"tags":["substance","theory","art"],"birth":1905,"death":1980,"href":"https://note.com/search?q=from%3A%40varelser%20%E3%82%B8%E3%83%A3%E3%83%B3%EF%BC%9D%E3%83%9D%E3%83%BC%E3%83%AB%E3%83%BB%E3%82%B5%E3%83%AB%E3%83%88%E3%83%AB&context=note&mode=search","article":false,"descRaw":"（仏・1905–1980）：フランスの哲学者・作家（1905-1980）。1935年、想像力の研究の一環として精神科医ダニエル・ラガッシュのもとでメスカリン注射を受け、ロブスターやカニの幻覚に悩まされる体験をした。この体験は『想像力の問題』（1940）や『嘔吐』（1938）の想像力論に影を落とす。実存主義における意識の自由と、嘔吐的な覚醒の思想家である。"},{"name":"エルンスト・ユンガー","chapter":"c8-シュルレアリスムと無意識","sub":0,"subCount":2,"tags":["substance","art"],"birth":1895,"death":1998,"href":"https://note.com/search?q=from%3A%40varelser%20%E3%82%A8%E3%83%AB%E3%83%B3%E3%82%B9%E3%83%88%E3%83%BB%E3%83%A6%E3%83%B3%E3%82%AC%E3%83%BC&context=note&mode=search","article":false,"descRaw":"（独・1895–1998）：ドイツの作家・思想家（1895-1998）。『アプローチ—薬物と陶酔』（1970）で、エーテル・コカイン・メスカリン・LSDなどの体験を内省的に記録した。1951年にはLSDの発見者アルベルト・ホフマンと共同でLSD実験を行い、後に「サイコノート（精神の航海者）」の語を広めた。保守的知識人による薬理的意識変容の文学的記録として特異な位置を占める。"},{"name":"ロバート・グレイヴス","chapter":"c8-シュルレアリスムと無意識","sub":0,"subCount":2,"tags":["art","religion","culture"],"birth":1895,"death":1985,"href":"https://note.com/search?q=from%3A%40varelser%20%E3%83%AD%E3%83%90%E3%83%BC%E3%83%88%E3%83%BB%E3%82%B0%E3%83%AC%E3%82%A4%E3%83%B4%E3%82%B9&context=note&mode=search","article":false,"descRaw":"（英・1895–1985）：イギリスの詩人・作家（1895-1985）。『白い女神』（1948）で、詩的霊感の源泉を月の女神と結びつけ、神話学と人類学を横断するトランスの詩学を展開した。キノコ儀礼への関心からゴードン・ワッソンと交流し、古代の幻覚性キノコ儀礼を論じた。神話と陶酔を結ぶ詩的想像力の研究者であり、『さらば、すべてのことよ』の作者でもある。"},{"name":"アンドレ・マッソン","chapter":"c8-シュルレアリスムと無意識","sub":1,"subCount":2,"tags":["art","dream","practice"],"birth":1896,"death":1987,"href":"https://note.com/search?q=from%3A%40varelser%20%E3%82%A2%E3%83%B3%E3%83%89%E3%83%AC%E3%83%BB%E3%83%9E%E3%83%83%E3%82%BD%E3%83%B3&context=note&mode=search","article":false,"descRaw":"（1896–1987）／（1900–1955）：シュルレアリスムの自動描画（オートマティスム）を代表する二人。マッソンは1920年代半ばから、意識の統制を外した速い線による自動素描を実践し、暴力とエロスの交錯する夢景を描いた。タンギーは、骨のような有機的形態が漂う静謐な夢の風景を精密に描き、無意識の地形を可視化した。ともに夢と自動性を絵画の方法とした。"},{"name":"イヴ・タンギー","chapter":"c8-シュルレアリスムと無意識","sub":1,"subCount":2,"tags":["art","dream"],"birth":1900,"death":1955,"href":"https://note.com/search?q=from%3A%40varelser%20%E3%82%A4%E3%83%B4%E3%83%BB%E3%82%BF%E3%83%B3%E3%82%AE%E3%83%BC&context=note&mode=search","article":false,"descRaw":"（1896–1987）／（1900–1955）：シュルレアリスムの自動描画（オートマティスム）を代表する二人。マッソンは1920年代半ばから、意識の統制を外した速い線による自動素描を実践し、暴力とエロスの交錯する夢景を描いた。タンギーは、骨のような有機的形態が漂う静謐な夢の風景を精密に描き、無意識の地形を可視化した。ともに夢と自動性を絵画の方法とした。"},{"name":"サルバドール・ダリ","chapter":"c8-シュルレアリスムと無意識","sub":1,"subCount":2,"tags":["art","dream"],"birth":1904,"death":1989,"href":"https://note.com/search?q=from%3A%40varelser%20%E3%82%B5%E3%83%AB%E3%83%90%E3%83%89%E3%83%BC%E3%83%AB%E3%83%BB%E3%83%80%E3%83%AA&context=note&mode=search","article":false,"descRaw":"（1904–1989）：スペインのシュルレアリスム画家。偏執狂的批判的方法と名づけた手法で、妄想的な二重イメージを精密に描いた。代表作『記憶の固執』（1931年）の溶ける時計は、時間感覚の溶解を象徴する。睡眠と覚醒の境界、夢の定着、性的・宗教的妄想を、写実的な筆致で描き出し、無意識を可視のものとした。ガラとの共同生活や、アメリカ亡命期の活動も含め、20世紀美術の最も有名な奇才となった。"},{"name":"レオノーラ・キャリントン","chapter":"c8-シュルレアリスムと無意識","sub":1,"subCount":2,"tags":["art","religion","practice"],"birth":1917,"death":2011,"href":"https://note.com/search?q=from%3A%40varelser%20%E3%83%AC%E3%82%AA%E3%83%8E%E3%83%BC%E3%83%A9%E3%83%BB%E3%82%AD%E3%83%A3%E3%83%AA%E3%83%B3%E3%83%88%E3%83%B3&context=note&mode=search","article":false,"descRaw":"（1917–2011）／（1908–1963）：メキシコを拠点に活動した女性シュルレアリストの二人。キャリントンはケルト神話や錬金術に取材し、儀礼的で夢幻的な形象を描いた。バロは魔術・錬金術・神秘学に根ざし、時計仕掛けのような精密な画面に、変容と探求の物語を込めた。ともに夢の儀礼と魔術的想像力を、綿密な具象描写で定着させた。ともにメキシコで活動し、魔術と錬金術の図像を女性の視点から描いた。"},{"name":"レメディオス・バロ","chapter":"c8-シュルレアリスムと無意識","sub":1,"subCount":2,"tags":["art","religion","practice"],"birth":1908,"death":1963,"href":"https://note.com/search?q=from%3A%40varelser%20%E3%83%AC%E3%83%A1%E3%83%87%E3%82%A3%E3%82%AA%E3%82%B9%E3%83%BB%E3%83%90%E3%83%AD&context=note&mode=search","article":false,"descRaw":"（1917–2011）／（1908–1963）：メキシコを拠点に活動した女性シュルレアリストの二人。キャリントンはケルト神話や錬金術に取材し、儀礼的で夢幻的な形象を描いた。バロは魔術・錬金術・神秘学に根ざし、時計仕掛けのような精密な画面に、変容と探求の物語を込めた。ともに夢の儀礼と魔術的想像力を、綿密な具象描写で定着させた。ともにメキシコで活動し、魔術と錬金術の図像を女性の視点から描いた。"},{"name":"ルネ・マグリット","chapter":"c8-シュルレアリスムと無意識","sub":1,"subCount":2,"tags":["art","theory"],"birth":1898,"death":1967,"href":"https://note.com/varelser/n/n809faa2c93a0","article":true,"descRaw":"（1898–1967）：ベルギーのシュルレアリスム画家。日常の事物を組み合わせた視覚的パラドックスで、意識の習慣的な見方を撹乱した。『イメージの裏切り』（1929年）の「これはパイプではない」という言葉遊びや、昼夜が逆転した『光の帝国』シリーズが代表作。冷静な写実の背後に、夢のような論理のずれを仕掛けた。言葉とイメージのずれを仕掛ける手法は、後のコンセプチュアル・アートにも影響を与えた。"},{"name":"マックス・エルンスト","chapter":"c8-シュルレアリスムと無意識","sub":1,"subCount":2,"tags":["art","dream"],"birth":1891,"death":1976,"href":"https://note.com/varelser/n/nea109028c999","article":true,"descRaw":"（独-仏・1891–1976）：ドイツ生まれの画家。ダダからシュルレアリスムへ移行し、木目などを写し取るフロッタージュや、コラージュ小説『百頭女』（1929年）で知られる。鳥頭の分身ロプロップを創造し、夢の風景を自動的な技法で描いた。戦争体験や無意識の形象を、異質な素材の衝突によって画面に定着させた。コラージュ小説『百頭女』に続き、『優しさの一週間』（1934年）も発表した。"},{"name":"ジョアン・ミロ","chapter":"c8-シュルレアリスムと無意識","sub":1,"subCount":2,"tags":["art","dream"],"birth":1893,"death":1983,"href":"https://note.com/search?q=from%3A%40varelser%20%E3%82%B8%E3%83%A7%E3%82%A2%E3%83%B3%E3%83%BB%E3%83%9F%E3%83%AD&context=note&mode=search","article":false,"descRaw":"（西・1893–1983）：カタルーニャ出身の画家。自動描画から生まれた記号的な形象で、夢幻的な世界を描いた。代表作『農場』（1921〜22年）や『星座』シリーズ（1940〜41年）は、星・鳥・女性などの素朴な記号が漂う画面で知られる。シュルレアリスムの詩的な側面を体現し、無意識の自由な形象を色彩豊かに展開した。晩年は陶芸や彫刻にも取り組み、記号的な形象を立体へと展開した。"},{"name":"ロベルト・マッタ","chapter":"c8-シュルレアリスムと無意識","sub":1,"subCount":2,"tags":["art","theory"],"birth":1911,"death":2002,"href":"https://note.com/search?q=from%3A%40varelser%20%E3%83%AD%E3%83%99%E3%83%AB%E3%83%88%E3%83%BB%E3%83%9E%E3%83%83%E3%82%BF&context=note&mode=search","article":false,"descRaw":"（智・1911–2002）：チリ生まれの画家。1938年にパリでブルトンらと出会いシュルレアリスムに参加。心の内面を風景化したインサイコスケープ（心的風景）を提唱し、多次元的な空間に漂う有機的な形態を描いた。夢や無意識の地形を、建築的な透視と流動的な形態で表現し、後の抽象表現主義にも影響を与えた。第二次大戦中はアメリカに亡命し、ニューヨークの若い画家たちに影響を与えた。"},{"name":"ドロテア・タニング","chapter":"c8-シュルレアリスムと無意識","sub":1,"subCount":2,"tags":["art","dream"],"birth":1910,"death":2012,"href":"https://note.com/search?q=from%3A%40varelser%20%E3%83%89%E3%83%AD%E3%83%86%E3%82%A2%E3%83%BB%E3%82%BF%E3%83%8B%E3%83%B3%E3%82%B0&context=note&mode=search","article":false,"descRaw":"（米・1910–2012）：アメリカのシュルレアリスム画家。『誕生日』（1942年）や『小さな夜の音楽』（1943年）で、少女と扉のイメージを用いて夢と現実の境界を描いた。扉の向こうに広がる無限の回廊は、思春期の不安と変容の象徴とされる。晩年は柔らかな布の彫刻へ移行し、身体と夢のテーマを立体で追求した。マックス・エルンストの伴侶としても知られ、晩年は詩作にも取り組んだ。"},{"name":"メレット・オッペンハイム","chapter":"c8-シュルレアリスムと無意識","sub":1,"subCount":2,"tags":["art"],"birth":1913,"death":1985,"href":"https://note.com/search?q=from%3A%40varelser%20%E3%83%A1%E3%83%AC%E3%83%83%E3%83%88%E3%83%BB%E3%82%AA%E3%83%83%E3%83%9A%E3%83%B3%E3%83%8F%E3%82%A4%E3%83%A0&context=note&mode=search","article":false,"descRaw":"（瑞・1913–1985）：スイス生まれのシュルレアリスム作家。毛皮で覆ったカップとソーサーによるオブジェ『毛皮の朝食』（1936年）で一躍知られる。夢の記録を生涯にわたり日記に綴り、無意識のイメージをオブジェや絵画に変換した。日常物の変容を通じて、欲望と不安が交錯する夢の論理を提示した。夢日記を数十年にわたり綴り、夢のイメージを作品の源泉とし続けた。"},{"name":"ハンス・ベルメール","chapter":"c8-シュルレアリスムと無意識","sub":1,"subCount":2,"tags":["art","theory"],"birth":1902,"death":1975,"href":"https://note.com/search?q=from%3A%40varelser%20%E3%83%8F%E3%83%B3%E3%82%B9%E3%83%BB%E3%83%99%E3%83%AB%E3%83%A1%E3%83%BC%E3%83%AB&context=note&mode=search","article":false,"descRaw":"（独-仏・1902–1975）：ドイツのシュルレアリスム作家。1933年から制作した球体関節人形（プッペ）は、分解と再構成が可能な身体を通じて無意識の欲望と不安を可視化した。写真と素描による人形の記録は、身体の幻想的な変容を提示し、フロイト的な無意識の造形としてシュルレアリスムの重要な一翼を担った。写真集『人形』（1934年）は、シュルレアリスムの機関誌にも掲載され話題となった。"},{"name":"ヴィクトル・ブローネル","chapter":"c8-シュルレアリスムと無意識","sub":1,"subCount":2,"tags":["art","religion"],"birth":1903,"death":1966,"href":"https://note.com/search?q=from%3A%40varelser%20%E3%83%B4%E3%82%A3%E3%82%AF%E3%83%88%E3%83%AB%E3%83%BB%E3%83%96%E3%83%AD%E3%83%BC%E3%83%8D%E3%83%AB&context=note&mode=search","article":false,"descRaw":"（ルーマニア・1903–1966）：ルーマニア生まれのシュルレアリスム画家。パリで活動し、オカルティズム、錬金術、魔術的な変身を主題とした。自動描画の実践者でもあり、夢と現実が交錯する幻想的な形象を描いた。1930年代後半から、眼や手などの断片化された身体、変容する生き物のイメージを多用し、神秘的な無意識の世界を展開した。錬金術の文献や、変身の神話に取材した作品を、生涯にわたり描き続けた。"},{"name":"ウニカ・チュルン","chapter":"c8-シュルレアリスムと無意識","sub":1,"subCount":2,"tags":["art","dream"],"birth":1916,"death":1970,"href":"https://note.com/varelser/n/nd8ba4bd802a6","article":true,"descRaw":"（独・1916–1970）：ドイツの作家・画家。自動描線と自動筆記を実践し、分裂した意識や二重の自己を描き出した。ベルメールとの関係でも知られ、言葉と線が交錯する作品で、無意識の断片的な形象を定着させた。アナグラム詩や素描は、夢と現実の境界が揺らぐ内的世界を示し、戦後シュルレアリスムの特異な存在となった。言葉とイメージが交錯する作品は、戦後の前衛芸術における特異な位置を占める。"},{"name":"アンドレイ・タルコフスキー","chapter":"c9-映画における変性意識","sub":0,"subCount":5,"tags":["art","dream"],"birth":1932,"death":1986,"href":"https://note.com/varelser/n/nfba2a86464c8","article":true,"descRaw":"（露・1932–1986）：ソ連・ロシアの映画監督（1932-1986）。『鏡』（1975）で夢と記憶を詩的に交錯させ、『ストーカー』（1979）では願望が叶う「ゾーン」を描いた。長回しと水・雨・火のイメージによる「時間の彫刻」の理論を『刻まれた時間』で展開した。夢・記憶・時間を映像の本質とする、映画詩の巨匠である。『ノスタルジア』（1983）や『サクリファイス』（1986）でも、信仰と時間を描いた。"},{"name":"ルイス・ブニュエル","chapter":"c9-映画における変性意識","sub":0,"subCount":5,"tags":["art","dream"],"birth":1900,"death":1983,"href":"https://note.com/search?q=from%3A%40varelser%20%E3%83%AB%E3%82%A4%E3%82%B9%E3%83%BB%E3%83%96%E3%83%8B%E3%83%A5%E3%82%A8%E3%83%AB&context=note&mode=search","article":false,"descRaw":"（西-墨・1900–1983）：スペインの映画監督（1900-1983）。サルバドール・ダリとともに作った『アンダルシアの犬』（1929）は、目の切断や蟻の群れなど夢の論理による映像で、シュルレアリスム映画の出発点となった。『昼顔』（1967）や『ブルジョワジーの密かな愉しみ』（1972）でも、夢と現実の境界を崩す。シュルレアリスム映画の先駆者である。"},{"name":"マヤ・デレン","chapter":"c9-映画における変性意識","sub":0,"subCount":5,"tags":["art","religion","practice"],"birth":1917,"death":1961,"href":"https://note.com/search?q=from%3A%40varelser%20%E3%83%9E%E3%83%A4%E3%83%BB%E3%83%87%E3%83%AC%E3%83%B3&context=note&mode=search","article":false,"descRaw":"（米・1917–1961）：ウクライナ生まれのアメリカの実験映画作家（1917-1961）。『午後の網目』（1943）で、夢の反復と分身による迷宮的な時間構造を築いた。ハイチのヴードゥー儀礼を撮影した『神々に魅入られた人馬』（死後刊行）では、トランスと憑依を記録した。舞踊・儀礼・夢を結ぶ実験映画の先駆者である。映画理論の著作でも、映画を詩的・儀礼的な芸術として論じた。"},{"name":"スタン・ブラッケージ","chapter":"c9-映画における変性意識","sub":0,"subCount":5,"tags":["art"],"birth":1933,"death":2003,"href":"https://note.com/varelser/n/n18ab9ce18109","article":true,"descRaw":"（米・1933–2003）：アメリカの実験映画作家（1933-2003）。『ドッグ・スター・マン』（1961-64）などで、カメラを眼の延長とみなし、知覚そのものを映像化することを試みた。フィルムに直接絵を描く手法や、閉じたまぶたの内側の光を描く試みで知られる。アメリカ実験映画の中心人物であり、視覚の現象学を映画化した作家である。"},{"name":"ケネス・アンガー","chapter":"c9-映画における変性意識","sub":0,"subCount":5,"tags":["art","religion"],"birth":1927,"death":2023,"href":"https://note.com/search?q=from%3A%40varelser%20%E3%82%B1%E3%83%8D%E3%82%B9%E3%83%BB%E3%82%A2%E3%83%B3%E3%82%AC%E3%83%BC&context=note&mode=search","article":false,"descRaw":"（米・1927–2023）：アメリカの実験映画作家（1927-2023）。『スコーピオ・ライジング』（1963）や『ルシファー・ライジング』（1972）で、魔術・オカルトをモチーフに、音楽と映像の陶酔的なモンタージュを展開した。アレイスター・クロウリーのセレマの実践者でもあった。変性意識状態をフィルムに封じ込める実験映画の先駆者である。"},{"name":"ハリー・スミス","chapter":"c9-映画における変性意識","sub":0,"subCount":5,"tags":["art","practice"],"birth":1923,"death":1991,"href":"https://note.com/search?q=from%3A%40varelser%20%E3%83%8F%E3%83%AA%E3%83%BC%E3%83%BB%E3%82%B9%E3%83%9F%E3%82%B9&context=note&mode=search","article":false,"descRaw":"（米・1923–1991）：アメリカの実験映画作家・民俗学者（1923-1991）。フィルムに直接描いた抽象アニメーション『天と地の魔術』などで、催眠的な視覚音楽の先駆となった。アメリカ民謡のアンソロジー編纂でも知られ、オカルトや錬金術への関心も深かった。映像・音楽・神秘思想を結ぶ、アメリカ前衛の異才である。『アメリカン・フォーク・ミュージック・アンソロジー』（1952）の編纂でも知られる。"},{"name":"ヨナス・メカス","chapter":"c9-映画における変性意識","sub":0,"subCount":5,"tags":["art","dream"],"birth":1922,"death":2019,"href":"https://note.com/search?q=from%3A%40varelser%20%E3%83%A8%E3%83%8A%E3%82%B9%E3%83%BB%E3%83%A1%E3%82%AB%E3%82%B9&context=note&mode=search","article":false,"descRaw":"（リトアニア-米・1922–2019）：リトアニア生まれのアメリカの映画作家（1922-2019）。日記映画の創始者として、『リトアニアへの旅の追憶』（1972）などで、フラッシュカットや手持ち撮影による夢的な記憶の時間体験を描いた。ニューヨークのアンダーグラウンド映画の拠点アンソロジー・フィルム・アーカイヴズを設立した。個人映画の父と呼ばれる。"},{"name":"ジャン・コクトー","chapter":"c9-映画における変性意識","sub":0,"subCount":5,"tags":["art","dream","religion"],"birth":1889,"death":1963,"href":"https://note.com/search?q=from%3A%40varelser%20%E3%82%B8%E3%83%A3%E3%83%B3%E3%83%BB%E3%82%B3%E3%82%AF%E3%83%88%E3%83%BC&context=note&mode=search","article":false,"descRaw":"（仏・1889–1963）：フランスの詩人・映画監督（1889-1963）。『詩人の血』（1930）や『オルフェ』（1950）で、鏡を通る死の世界や、夢と神話が交錯する映像を描いた。詩・演劇・絵画・映画を横断する多芸の作家で、幻視的なイメージと映画技法を融合させた。夢の映画化における先駆者である。『美女と野獣』（1946）でも、鏡と魔法による幻想世界を描いた。"},{"name":"ジョーダン・ベルソン","chapter":"c9-映画における変性意識","sub":0,"subCount":5,"tags":["art","practice","religion"],"birth":1926,"death":2011,"href":"https://note.com/search?q=from%3A%40varelser%20%E3%82%B8%E3%83%A7%E3%83%BC%E3%83%80%E3%83%B3%E3%83%BB%E3%83%99%E3%83%AB%E3%82%BD%E3%83%B3&context=note&mode=search","article":false,"descRaw":"（米・1926–2011）：アメリカの実験映画作家（1926-2011）。フィッシンガーの影響を受け、抽象的な光と色彩による「コズミック・シネマ」を築いた。1957-59年にはサンフランシスコのプラネタリウムで電子音楽と映像の「ヴォルテックス・コンサート」を演出した。『サマディ』（1967）は瞑想の境地を題名とし、ヨガや東洋思想に根ざした瞑想的な映像体験を追求した。"},{"name":"オスカー・フィッシンガー","chapter":"c9-映画における変性意識","sub":0,"subCount":5,"tags":["art","theory"],"birth":1900,"death":1967,"href":"https://note.com/search?q=from%3A%40varelser%20%E3%82%AA%E3%82%B9%E3%82%AB%E3%83%BC%E3%83%BB%E3%83%95%E3%82%A3%E3%83%83%E3%82%B7%E3%83%B3%E3%82%AC%E3%83%BC&context=note&mode=search","article":false,"descRaw":"（独-米・1900–1967）：ドイツ生まれのアメリカの実験映画作家（1900-1967）。幾何学的図形を音楽に同期させた抽象アニメーション「視覚音楽（ヴィジュアル・ミュージック）」の父とされる。『光学的詩』（1937）や『モーション・ペインティング第1番』（1947）で、音楽のリズムと色彩の運動を結んだ。ディズニーの『ファンタジア』（1940）にも影響を与えた、抽象映画の先駆者である。"},{"name":"松本俊夫","chapter":"c9-映画における変性意識","sub":1,"subCount":5,"tags":["art","theory"],"birth":1932,"death":2017,"href":"https://note.com/varelser/n/n728dbc21b468","article":true,"descRaw":"（日・1932–2017）：日本の実験映画作家・映像理論家（1932-2017）。『薔薇の葬列』（1969）で、ドキュメンタリーとフィクションを交錯させ、映像による意識の拡張と知覚の解体を試みた。『石の詩』や『アートマン』などの実験映画でも、映像の物質性と知覚の変容を探求した。日本実験映画の理論的中心人物である。その映像理論は、日本の実験映画の思想的基盤となった。"},{"name":"塚本晋也","chapter":"c9-映画における変性意識","sub":1,"subCount":5,"tags":["art","practice","tech"],"birth":1960,"death":null,"href":"https://note.com/varelser/n/n7d00bb310a9b","article":true,"descRaw":"（日・1960–）：日本の映画監督（1960-）。『鉄男』（1989）で、肉体が金属に変容する男を描き、サイバーパンク的な身体変容とトランス状態を映像化した。『野火』（2014）や『斬、』（2018）でも、極限状態における意識の変容を描く。肉体と機械、狂気と陶酔を結ぶ、日本の異端映画の代表者である。『六月の蛇』（2002）でも、日常に潜む欲望と変容を描いた。"},{"name":"土方巽","chapter":"c9-映画における変性意識","sub":1,"subCount":5,"tags":["art","practice"],"birth":1928,"death":1986,"href":"https://note.com/search?q=from%3A%40varelser%20%E5%9C%9F%E6%96%B9%E5%B7%BD&context=note&mode=search","article":false,"descRaw":"（日・1928–1986）：日本の舞踊家（1928-1986）。1959年の『禁色』で暗黒舞踏を創始し、痙攣・頽廃・土着的な身体による非日常の意識を喚起した。「腐る身体」「死体を立たせる」といった言葉で、身体の極限を通じた意識変容の詩学を展開した。舞踏の創始者として、世界の身体芸術に決定的影響を与えた。『疱瘡譚』（1972）など、晩年の独舞でも身体の極限を探求した。"},{"name":"大野一雄","chapter":"c9-映画における変性意識","sub":1,"subCount":5,"tags":["art","practice","religion"],"birth":1906,"death":2010,"href":"https://note.com/varelser/n/n38071ed9556c","article":true,"descRaw":"（日・1906–2010）：日本の舞踊家（1906-2010）。土方巽とともに舞踏を築いた巨人で、1977年の『ラ・アルヘンティーナ頌』で世界的に知られた。高齢化・死・女性性・他者との合一を踊りで体現し、100歳を超えても舞台に立った。魂の舞踊として、舞踏を霊的な身体芸術へと高めた。息子・大野慶人との共演でも知られ、舞踏を世界に広めた。"},{"name":"飯村隆彦","chapter":"c9-映画における変性意識","sub":1,"subCount":5,"tags":["art","tech"],"birth":1937,"death":2022,"href":"https://note.com/search?q=from%3A%40varelser%20%E9%A3%AF%E6%9D%91%E9%9A%86%E5%BD%A6&context=note&mode=search","article":false,"descRaw":"（日・1937–2022）：日本の実験映画作家・ビデオアーティスト（1937-2022）。『あい』（1962-63）などの構造映画や、ビデオによる知覚と時間の実験で知られる。フィルムの物質性や、映像と観客の関係を問い直す作品を多数発表した。日本の構造映画・ビデオアートの先駆者である。アメリカでも活動し、映像と身体の関係を問い続けた。"},{"name":"鈴木清順","chapter":"c9-映画における変性意識","sub":1,"subCount":5,"tags":["art","dream"],"birth":1923,"death":2017,"href":"https://note.com/search?q=from%3A%40varelser%20%E9%88%B4%E6%9C%A8%E6%B8%85%E9%A0%86&context=note&mode=search","article":false,"descRaw":"（日・1923–2017）：日本の映画監督（1923-2017）。『ツィゴイネルワイゼン』（1980）や『陽炎座』（1981）で、夢と現実が地続きになる幻想的な映像世界を築いた。大正期の日本を舞台に、死者や幻影が日常に侵入する物語を描いた。日本映画における幻想的意識変容の代表格であり、晩年に国際的再評価を受けた。『殺しの烙印』（1967）での日活との対立も、映画史の伝説となった。"},{"name":"イングマール・ベルイマン","chapter":"c9-映画における変性意識","sub":2,"subCount":5,"tags":["art","dream","theory"],"birth":1918,"death":2007,"href":"https://note.com/search?q=from%3A%40varelser%20%E3%82%A4%E3%83%B3%E3%82%B0%E3%83%9E%E3%83%BC%E3%83%AB%E3%83%BB%E3%83%99%E3%83%AB%E3%82%A4%E3%83%9E%E3%83%B3&context=note&mode=search","article":false,"descRaw":"（スウェーデン・1918–2007）：スウェーデンの映画監督（1918-2007）。『第七の封印』（1957）で死とのチェス対局を描き、『仮面／ペルソナ』（1966）で二人の女性の自己同一性の融解と二重性を描いた。夢・沈黙・信仰の危機を映画言語として確立し、神の沈黙と人間の孤独を問い続けた。20世紀映画の巨匠である。『野いちご』（1957）や『叫びとささやき』（1972）でも、死と信仰を描いた。"},{"name":"フェデリコ・フェリーニ","chapter":"c9-映画における変性意識","sub":2,"subCount":5,"tags":["art","dream","theory"],"birth":1920,"death":1993,"href":"https://note.com/search?q=from%3A%40varelser%20%E3%83%95%E3%82%A7%E3%83%87%E3%83%AA%E3%82%B3%E3%83%BB%E3%83%95%E3%82%A7%E3%83%AA%E3%83%BC%E3%83%8B&context=note&mode=search","article":false,"descRaw":"（伊・1920–1993）：イタリアの映画監督（1920-1993）。『8½』（1963）や『アマルコルド』（1973）で、夢日記をもとに夢と記憶を映画の構造原理とした。ユング派の分析を受けた経験が、集合的無意識や元型のイメージに結実した。『甘い生活』（1960）や『サテリコン』（1969）でも、夢幻的な祝祭世界を描いた。『道』（1954）では、旅芸人と少女の寓話的な世界を描いた。"},{"name":"ピエル・パオロ・パゾリーニ","chapter":"c9-映画における変性意識","sub":2,"subCount":5,"tags":["art","religion"],"birth":1922,"death":1975,"href":"https://note.com/search?q=from%3A%40varelser%20%E3%83%94%E3%82%A8%E3%83%AB%E3%83%BB%E3%83%91%E3%82%AA%E3%83%AD%E3%83%BB%E3%83%91%E3%82%BE%E3%83%AA%E3%83%BC%E3%83%8B&context=note&mode=search","article":false,"descRaw":"（伊・1922–1975）：イタリアの映画監督・詩人（1922-1975）。『テオレマ』（1968）で、謎の訪問者によって一家の日常意識が破壊される様を描いた。聖と猥褻、原始的な身体性を主題とし、『アラビアンナイト』（1974）などでも神話と欲望の世界を描いた。詩人・思想家としての映画作家であり、1975年に殺害された。「生の三部作」でも神話と欲望の世界を描いた。"},{"name":"ニコラス・ローグ","chapter":"c9-映画における変性意識","sub":2,"subCount":5,"tags":["art","dream"],"birth":1928,"death":2018,"href":"https://note.com/search?q=from%3A%40varelser%20%E3%83%8B%E3%82%B3%E3%83%A9%E3%82%B9%E3%83%BB%E3%83%AD%E3%83%BC%E3%82%B0&context=note&mode=search","article":false,"descRaw":"（英・1928–2018）：イギリスの映画監督（1928-2018）。『赤い影』（1973）で、予知夢と死の予感を非線形の編集で描き、『パフォーマンス』（1970）ではギャングとロックスターの自我の融合を描いた。時間の断片化による意識の解体を映画言語とした。撮影監督出身の映像詩人であり、イギリス映画の異端児である。『地球に落ちて来た男』（1976）でも、異星人の孤独な意識を描いた。"},{"name":"デヴィッド・リンチ","chapter":"c9-映画における変性意識","sub":3,"subCount":5,"tags":["art","dream","practice"],"birth":1946,"death":2025,"href":"https://note.com/varelser/n/ne6b539647813","article":true,"descRaw":"（米・1946–2025）：アメリカの映画監督（1946-2025）。『マルホランド・ドライブ』（2001）や『ツイン・ピークス』（1990-91、2017）で、夢と無意識の映像言語を確立した。1973年から超越瞑想を実践し、デヴィッド・リンチ財団を通じて瞑想の普及にも取り組んだ。『エレファント・マン』（1980）や『ブルーベルベット』（1986）でも、日常の裏側の闇を描いた。"},{"name":"アレハンドロ・ホドロフスキー","chapter":"c9-映画における変性意識","sub":3,"subCount":5,"tags":["art","religion","practice"],"birth":1929,"death":null,"href":"https://note.com/varelser/n/nb010f6353d13","article":true,"descRaw":"（智-墨・1929–）：チリ生まれの映画監督・作家（1929-）。『エル・トポ』（1970）や『ホーリー・マウンテン』（1973）で、儀礼的・錬金術的な映像世界を築いた。タロットや精神分析をもとに考案した「サイコマジック」は、儀礼的行為によるトラウマの治癒を目指す実践である。カルト映画の巨匠であり、サイケデリック文化の象徴である。"},{"name":"ガスパー・ノエ","chapter":"c9-映画における変性意識","sub":3,"subCount":5,"tags":["art","religion"],"birth":1963,"death":null,"href":"https://note.com/varelser/n/nf4ab2bfdf8e1","article":true,"descRaw":"（亜-仏・1963–）：アルゼンチン生まれのフランスの映画監督（1963-）。『エンター・ザ・ヴォイド』（2009）で、チベット死者の書をもとに、臨死体験と輪廻を主観映像で描いた。『カルネ』（1991）や『不可逆』（2002）でも、暴力と陶酔の極限状態を映像化した。意識拡張の映像体験を追求する、現代フランス映画の異端児である。"},{"name":"ヴェルナー・ヘルツォーク","chapter":"c9-映画における変性意識","sub":3,"subCount":5,"tags":["art","practice","religion"],"birth":1942,"death":null,"href":"https://note.com/search?q=from%3A%40varelser%20%E3%83%B4%E3%82%A7%E3%83%AB%E3%83%8A%E3%83%BC%E3%83%BB%E3%83%98%E3%83%AB%E3%83%84%E3%82%A9%E3%83%BC%E3%82%AF&context=note&mode=search","article":false,"descRaw":"（独・1942–）：ドイツの映画監督（1942-）。『アギーレ、神の怒り』（1972）や『フィッツカラルド』（1982）で、恍惚と狂気、限界状態の人間を記録した。『ガラスの心』（1976）では、出演者の多くに催眠をかけて撮影し、トランス的な演技を引き出した。ドキュメンタリーとフィクションの境界を越える、映画の探求者である。"},{"name":"アピチャッポン・ウィーラセタクン","chapter":"c9-映画における変性意識","sub":3,"subCount":5,"tags":["art","dream","religion"],"birth":1970,"death":null,"href":"https://note.com/varelser/n/n9805905ad4be","article":true,"descRaw":"（タイ・1970–）：タイの映画監督（1970-）。『ブンミおじさんの森』（2010）で、輪廻する魂と精霊の世界を描き、カンヌ国際映画祭パルムドールを受けた。夢・記憶・輪廻の重層を、瞑想的な長回しと静寂で映像化する。『メモリア』（2021）でも、音と記憶の意識を探求した。タイ映画を代表する作家である。短編やインスタレーションでも、夢と記憶の層を描き続けている。"},{"name":"テレンス・マリック","chapter":"c9-映画における変性意識","sub":3,"subCount":5,"tags":["art","religion","theory"],"birth":1943,"death":null,"href":"https://note.com/search?q=from%3A%40varelser%20%E3%83%86%E3%83%AC%E3%83%B3%E3%82%B9%E3%83%BB%E3%83%9E%E3%83%AA%E3%83%83%E3%82%AF&context=note&mode=search","article":false,"descRaw":"（米・1943–）：アメリカの映画監督（1943-）。『ツリー・オブ・ライフ』（2011）で、宇宙の誕生と家族の記憶を結ぶ超越的な映像詩を描いた。ハーバード大学で哲学を学び、ハイデガーの翻訳も手がけた経歴を持つ。『シン・レッド・ライン』（1998）や『天国の日々』（1978）でも、存在論的な意識の映画化を試みた。20年の沈黙を経て復帰したことでも知られる。"},{"name":"クリス・マルケル","chapter":"c9-映画における変性意識","sub":3,"subCount":5,"tags":["art","dream","theory"],"birth":1921,"death":2012,"href":"https://note.com/search?q=from%3A%40varelser%20%E3%82%AF%E3%83%AA%E3%82%B9%E3%83%BB%E3%83%9E%E3%83%AB%E3%82%B1%E3%83%AB&context=note&mode=search","article":false,"descRaw":"（仏・1921–2012）：フランスの映画作家（1921-2012）。『ラ・ジュテ』（1962）は静止画のみで構成された時間旅行の物語で、記憶と意識の映像エッセイの金字塔となった。『サン・ソレイユ』（1983）でも、記憶と歴史の断片をエッセイ的に綴った。静止画と運動のあいだの知覚実験を通じて、映画の本質を問うた作家である。『美しき五月に』（1963）など、ドキュメンタリーでも記憶を主題とした。"},{"name":"ゴッドフリー・レッジョ","chapter":"c9-映画における変性意識","sub":3,"subCount":5,"tags":["art","practice"],"birth":1940,"death":null,"href":"https://note.com/varelser/n/n29e901660194","article":true,"descRaw":"（米・1940–）：アメリカの映画監督（1940-）。『コヤニスカッツィ』（1982）をはじめとする「カッツィ三部作」で、フィリップ・グラスの音楽とともに、言語を用いない催眠的な映像瞑想を展開した。都市と自然、テクノロジーと人間の関係を、映像の流れそのもので描いた。非言語映画による意識変容体験の先駆者である。三部作は、言葉なしに文明と意識の関係を問いかけた。"},{"name":"スタンリー・キューブリック","chapter":"c9-映画における変性意識","sub":3,"subCount":5,"tags":["art","dream","tech"],"birth":1928,"death":1999,"href":"https://note.com/search?q=from%3A%40varelser%20%E3%82%B9%E3%82%BF%E3%83%B3%E3%83%AA%E3%83%BC%E3%83%BB%E3%82%AD%E3%83%A5%E3%83%BC%E3%83%96%E3%83%AA%E3%83%83%E3%82%AF&context=note&mode=search","article":false,"descRaw":"（米・1928–1999）：アメリカの映画監督（1928-1999）。『2001年宇宙の旅』（1968）のスターゲート・シークエンスで、光と色彩による意識の宇宙的拡張を描いた。『シャイニング』（1980）では、閉鎖空間における狂気と幻視を描いた。映像の精密な制御による知覚操作を追求し、映画史に決定的な影響を与えた巨匠である。『時計じかけのオレンジ』（1971）でも、暴力と条件づけの意識を描いた。"},{"name":"黒沢明","chapter":"c9-映画における変性意識","sub":3,"subCount":5,"tags":["art","dream"],"birth":1910,"death":1998,"href":"https://note.com/search?q=from%3A%40varelser%20%E9%BB%92%E6%B2%A2%E6%98%8E&context=note&mode=search","article":false,"descRaw":"（1910–1998）：日本の映画監督（1910-1998）。『夢』（1990）は監督自身が見た夢をもとにした8話のオムニバスで、狐の嫁入りや雪女、戦死した戦友の亡霊など、夢と現実が地続きの世界を映像化した。『羅生門』（1950）や『七人の侍』（1954）で世界的な評価を受けた。日本映画の巨匠である。『生きる』（1952）では、死を前にした男の覚醒を描いた。"},{"name":"今敏","chapter":"c9-映画における変性意識","sub":3,"subCount":5,"tags":["art","dream"],"birth":1963,"death":2010,"href":"https://note.com/search?q=from%3A%40varelser%20%E4%BB%8A%E6%95%8F&context=note&mode=search","article":false,"descRaw":"（日・1963–2010）：日本の長編アニメーション監督（1963-2010）。『PERFECT BLUE』（1997）で監督デビューし、『千年女優』（2001）、筒井康隆原作の『パプリカ』（2006）で夢と現実の境界を描いた。『パプリカ』では夢を共有する装置をめぐり、夢探偵が他者の夢に入り込み、悪夢が現実へ氾濫する。夢と現実の交錯をアニメーションならではの編集で表現した現代日本アニメの巨匠である。"},{"name":"押井守","chapter":"c9-映画における変性意識","sub":3,"subCount":5,"tags":["art","theory","tech"],"birth":1951,"death":null,"href":"https://note.com/search?q=from%3A%40varelser%20%E6%8A%BC%E4%BA%95%E5%AE%88&context=note&mode=search","article":false,"descRaw":"（日・1951–）：日本のアニメーション監督・映画監督（1951-）。『GHOST IN THE SHELL／攻殻機動隊』（1995）で、電脳化した近未来における「ゴースト（魂・意識）」の所在を問うた。全身義体の主人公草薙素子は、ネットの海から生まれた意識的存在「人形使い」と融合し、新たな存在へ変容する。意識・記憶・身体の関係をSFとして描いた、日本アニメの哲学的到達点である。"},{"name":"クリストファー・ノーラン","chapter":"c9-映画における変性意識","sub":3,"subCount":5,"tags":["art","dream"],"birth":1970,"death":null,"href":"https://note.com/search?q=from%3A%40varelser%20%E3%82%AF%E3%83%AA%E3%82%B9%E3%83%88%E3%83%95%E3%82%A1%E3%83%BC%E3%83%BB%E3%83%8E%E3%83%BC%E3%83%A9%E3%83%B3&context=note&mode=search","article":false,"descRaw":"（英・1970–）：イギリスの映画監督（1970-）。『インセプション』（2010）で、他者の夢に侵入してアイデアを盗み、植えつける産業スパイを描き、夢を多層化した階層構造と時間の相対性で表現した。夢の設計士や「キック」による覚醒など、夢のルールを建築的に構築した。『メメント』（2000）や『インターステラー』（2014）でも、記憶と時間の意識を探求した。"},{"name":"ダーレン・アロノフスキー","chapter":"c9-映画における変性意識","sub":3,"subCount":5,"tags":["art","dream","substance"],"birth":1969,"death":null,"href":"https://note.com/search?q=from%3A%40varelser%20%E3%83%80%E3%83%BC%E3%83%AC%E3%83%B3%E3%83%BB%E3%82%A2%E3%83%AD%E3%83%8E%E3%83%95%E3%82%B9%E3%82%AD%E3%83%BC&context=note&mode=search","article":false,"descRaw":"（米・1969–）：アメリカの映画監督（1969-）。『レクイエム・フォー・ドリーム』（2000）で、薬物依存による意識の崩壊を強烈な映像で描いた。『ブラック・スワン』（2010）では、バレリーナが白鳥と黒鳥の二重性を演じる重圧から幻覚と自己崩壊へ至る過程を描き、主演のナタリー・ポートマンがアカデミー主演女優賞を受けた。陶酔と破滅の意識を描く作家である。"},{"name":"テリー・ギリアム","chapter":"c9-映画における変性意識","sub":3,"subCount":5,"tags":["art","dream"],"birth":1940,"death":null,"href":"https://note.com/search?q=from%3A%40varelser%20%E3%83%86%E3%83%AA%E3%83%BC%E3%83%BB%E3%82%AE%E3%83%AA%E3%82%A2%E3%83%A0&context=note&mode=search","article":false,"descRaw":"（英・1940–）：アメリカ生まれのイギリスの映画監督・アニメーター（1940-）。モンティ・パイソンのメンバーとして出発し、『未来世紀ブラジル』（1985）や『バロン』（1988）、『フィッシャー・キング』（1991）で、夢と現実を行き来する幻想的な世界を描いた。『ラスベガスをやっつけろ』（1998）ではドラッグによる幻覚の旅を映像化した。想像力と狂気を結ぶ映画作家である。"},{"name":"ラース・フォン・トリアー","chapter":"c9-映画における変性意識","sub":3,"subCount":5,"tags":["art","dream","clinical"],"birth":1956,"death":null,"href":"https://note.com/search?q=from%3A%40varelser%20%E3%83%A9%E3%83%BC%E3%82%B9%E3%83%BB%E3%83%95%E3%82%A9%E3%83%B3%E3%83%BB%E3%83%88%E3%83%AA%E3%82%A2%E3%83%BC&context=note&mode=search","article":false,"descRaw
