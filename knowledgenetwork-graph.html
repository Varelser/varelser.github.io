3%83%88%2C%20%E3%83%95%E3%83%AA%E3%82%B9%E3%83%88%E3%83%B3%2C%20%E3%83%95%E3%83%AC%E3%83%83%E3%83%81%E3%83%A3%E3%83%BC%E3%82%89%EF%BC%89&context=note&mode=search","article":false,"descRaw":"：幻覚と妄想を、予測モデルの精度推定の異常として説明する計算論的モデル。ポール・フレッチャーとクリス・フリスの2009年の論文や、フィリップ・コーレットらの研究で、強い事前信念が感覚入力を上書きすると幻覚が生じるとした。サイケデリック体験と精神病の共通基盤を示す枠組みである。統合失調症の陽性症状を予測処理の異常として説明する点で、精神医学にも波及した。 出典：Fletcher & Frith (2009)『Nature Reviews Neuroscience』 DOI: 10.1038/nrn2536"},{"name":"制御された幻覚としての知覚（アニル・セス）","chapter":"c3-エントロピック・ブレイン","sub":1,"subCount":8,"tags":["theory","science"],"birth":null,"death":null,"href":"https://note.com/search?q=from%3A%40varelser%20%E5%88%B6%E5%BE%A1%E3%81%95%E3%82%8C%E3%81%9F%E5%B9%BB%E8%A6%9A%E3%81%A8%E3%81%97%E3%81%A6%E3%81%AE%E7%9F%A5%E8%A6%9A%EF%BC%88%E3%82%A2%E3%83%8B%E3%83%AB%E3%83%BB%E3%82%BB%E3%82%B9%EF%BC%89&context=note&mode=search","article":false,"descRaw":"：英国の神経科学者アニル・セスによる理論。通常の知覚そのものが脳の予測による「制御された幻覚」であり、幻覚はその制御が外れたものだとする。2021年の著書『Being You』で広く知られ、意識を予測処理の産物として再定義した。変性意識を予測モデルの変化として統一的に理解する視点である。セスはサセックス大学サックラー意識科学センターの共同ディレクターを務める。"},{"name":"ベイズ脳仮説と意識（ホーイら）","chapter":"c3-エントロピック・ブレイン","sub":1,"subCount":8,"tags":["theory","science"],"birth":null,"death":null,"href":"https://note.com/varelser/n/n961cc233eeef","article":true,"descRaw":"：豪州の哲学者ヤコブ・ホーイらによる、脳がベイズ推論を実装しているという仮説。2013年の著書『The Predictive Mind』で、脳が事前分布と感覚証拠を統合して世界を推論すると論じた。事前分布の更新不全や精度の変化として変性意識を数理的に記述し、予測処理理論の哲学的基盤を提示した。ホーイは予測処理の哲学的基礎を論じ、意識研究の計算論的転回を担った。"},{"name":"予測的符号化と意識（クラーク, 2013〜）","chapter":"c3-エントロピック・ブレイン","sub":1,"subCount":8,"tags":["theory","science"],"birth":null,"death":null,"href":"https://note.com/search?q=from%3A%40varelser%20%E4%BA%88%E6%B8%AC%E7%9A%84%E7%AC%A6%E5%8F%B7%E5%8C%96%E3%81%A8%E6%84%8F%E8%AD%98%EF%BC%88%E3%82%AF%E3%83%A9%E3%83%BC%E3%82%AF%2C%202013%E3%80%9C%EF%BC%89&context=note&mode=search","article":false,"descRaw":"：英国の哲学者アンディ・クラークによる予測処理の哲学。2013年の論文や2016年の著書『Surfing Uncertainty』で、脳をベイズ的予測機械として記述し、知覚・幻覚・変性意識を予測モデルの誤差として統一的に説明する枠組みを提示した。意識を世界との能動的な予測的関わりとして捉える視点である。 出典：Clark (2013)『Behavioral and Brain Sciences』 DOI: 10.1017/S0140525X12000477"},{"name":"グッド・フライデー実験（パーンケ, 1962）","chapter":"c3-エントロピック・ブレイン","sub":2,"subCount":8,"tags":["science","substance","religion"],"birth":null,"death":null,"href":"https://note.com/varelser/n/ncad86bfd3931","article":true,"descRaw":"：1962年4月20日、ボストン大学マーシュ礼拝堂で実施された実験。ハーバード大学の神学生ウォルター・パーンケが、神学生20名にシロシビン30mgまたはナイアシン（対照）を二重盲検で投与し、礼拝中の神秘体験を調べた。シロシビン群の9割が深い神秘体験を報告し、薬物による宗教体験の実験的誘発を初めて示した。神秘体験の9項目の評価基準もここで整備された。"},{"name":"グッド・フライデー実験の追跡調査（ドブリン, 1991）","chapter":"c3-エントロピック・ブレイン","sub":2,"subCount":8,"tags":["science","substance","religion"],"birth":null,"death":null,"href":"https://note.com/search?q=from%3A%40varelser%20%E3%82%B0%E3%83%83%E3%83%89%E3%83%BB%E3%83%95%E3%83%A9%E3%82%A4%E3%83%87%E3%83%BC%E5%AE%9F%E9%A8%93%E3%81%AE%E8%BF%BD%E8%B7%A1%E8%AA%BF%E6%9F%BB%EF%BC%88%E3%83%89%E3%83%96%E3%83%AA%E3%83%B3%2C%201991%EF%BC%89&context=note&mode=search","article":false,"descRaw":"：MAPS創設者リック・ドブリンが、グッド・フライデー実験から25年後に実施した追跡調査（1991年、『Journal of Transpersonal Psychology』掲載）。当時の被験者の大半が、あの日の体験を人生で最も霊的に意義深い出来事の一つと評価し続けていることを確認した。一方で二重盲検の破綻など方法論的欠陥も指摘し、後の厳密な臨床試験への教訓となった。"},{"name":"シロシビンと神秘体験（グリフィスら, 2006）","chapter":"c3-エントロピック・ブレイン","sub":2,"subCount":8,"tags":["science","substance","religion"],"birth":null,"death":null,"href":"https://note.com/varelser/n/ne363d6327ff7","article":true,"descRaw":"：ジョンズ・ホプキンス大学のローランド・グリフィスらによる2006年の画期的研究（『Psychopharmacology』）。幻覚剤未経験の健常者36名にシロシビンと活性プラセボを二重盲検で投与し、シロシビンが持続的な神秘体験を誘発することを実証した。14か月後の追跡では58%が人生で最も意義深い体験の一つと評価し、現代サイケデリック研究の復興を決定づけた。 出典：Griffiths et al. (2006)『Psychopharmacology』 DOI: 10.1007/s00213-006-0457-5"},{"name":"シロシビンによる終末期不安の治療（グリフィスら, 2016）","chapter":"c3-エントロピック・ブレイン","sub":2,"subCount":8,"tags":["clinical","substance","science"],"birth":null,"death":null,"href":"https://note.com/search?q=from%3A%40varelser%20%E3%82%B7%E3%83%AD%E3%82%B7%E3%83%93%E3%83%B3%E3%81%AB%E3%82%88%E3%82%8B%E7%B5%82%E6%9C%AB%E6%9C%9F%E4%B8%8D%E5%AE%89%E3%81%AE%E6%B2%BB%E7%99%82%EF%BC%88%E3%82%B0%E3%83%AA%E3%83%95%E3%82%A3%E3%82%B9%E3%82%89%2C%202016%EF%BC%89&context=note&mode=search","article":false,"descRaw":"：がん患者の実存的苦痛に対するシロシビン補助療法の無作為化試験（2016年、『Journal of Psychopharmacology』）。51名のがん患者を対象に、高用量シロシビン投与で抑うつ・不安が大幅に改善し、約80%の被験者で6か月後も効果が持続した。神秘体験の深さが治療効果と相関し、終末期ケアにおけるサイケデリック療法の可能性を示した。 出典：Griffiths et al. (2016)『Journal of Psychopharmacology』 DOI: 10.1177/0269881116675513"},{"name":"MAPS MDMA-PTSD臨床試験（ミトーファーら, 2011〜）","chapter":"c3-エントロピック・ブレイン","sub":2,"subCount":8,"tags":["clinical","substance","science"],"birth":null,"death":null,"href":"https://note.com/search?q=from%3A%40varelser%20MAPS%20MDMA-PTSD%E8%87%A8%E5%BA%8A%E8%A9%A6%E9%A8%93%EF%BC%88%E3%83%9F%E3%83%88%E3%83%BC%E3%83%95%E3%82%A1%E3%83%BC%E3%82%89%2C%202011%E3%80%9C%EF%BC%89&context=note&mode=search","article":false,"descRaw":"：MAPS（多角的サイケデリック研究協会）が主導するMDMA補助心理療法の臨床試験。ミトーファーらの第2相試験を経て、2021年の第3相試験（ミッチェルら、『Nature Medicine』）では重症PTSD患者90名のうち67%が治療後にPTSD診断基準を満たさなくなった（プラセボ群32%）。2024年8月にFDAは承認を見送り追加試験を求めたが、治療抵抗性PTSDへの有効性は注目される。 出典：Mithoefer et al. (2011)『Journal of Psychopharmacology』 DOI: 10.1177/0269881110378371；Mitchell et al. (2021)『Nature Medicine』 DOI: 10.1038/s41591-021-01336-3"},{"name":"ケタミンと即効性抗うつ作用（バーマンら, 2000）","chapter":"c3-エントロピック・ブレイン","sub":2,"subCount":8,"tags":["clinical","substance","science"],"birth":null,"death":null,"href":"https://note.com/search?q=from%3A%40varelser%20%E3%82%B1%E3%82%BF%E3%83%9F%E3%83%B3%E3%81%A8%E5%8D%B3%E5%8A%B9%E6%80%A7%E6%8A%97%E3%81%86%E3%81%A4%E4%BD%9C%E7%94%A8%EF%BC%88%E3%83%90%E3%83%BC%E3%83%9E%E3%83%B3%E3%82%89%2C%202000%EF%BC%89&context=note&mode=search","article":false,"descRaw":"：イェール大学のバーマンらによる2000年の研究（『Biological Psychiatry』）。うつ病患者7名に低用量ケタミン（0.5mg/kg、40分点滴）を投与し、数時間以内に抗うつ効果が現れることを初めて示した。NMDA受容体拮抗薬がグルタミン酸系を介して速やかに気分を改善する機序が注目され、2006年のザラテらによる追試を経て、治療抵抗性うつ病の新規治療法として発展した。 出典：Berman et al. (2000)『Biological Psychiatry』 DOI: 10.1016/S0006-3223(99)00230-9"},{"name":"マイクロドージング研究（ファドマン, 2011〜）","chapter":"c3-エントロピック・ブレイン","sub":2,"subCount":8,"tags":["science","substance"],"birth":null,"death":null,"href":"https://note.com/search?q=from%3A%40varelser%20%E3%83%9E%E3%82%A4%E3%82%AF%E3%83%AD%E3%83%89%E3%83%BC%E3%82%B8%E3%83%B3%E3%82%B0%E7%A0%94%E7%A9%B6%EF%BC%88%E3%83%95%E3%82%A1%E3%83%89%E3%83%9E%E3%83%B3%2C%202011%E3%80%9C%EF%BC%89&context=note&mode=search","article":false,"descRaw":"：心理学者ジェームズ・ファドマンが2011年頃から体系化した微量投与の研究。LSDやシロシビンを知覚に影響しない微量（通常量の約10分の1）で定期的に摂取し、気分・創造性・集中力への影響を調べる。ファドマンは2011年の著書『The Psychedelic Explorer's Guide』で自己報告を集積し、その後のプラセボ対照試験では期待効果との区別が課題となっている。"},{"name":"サイケデリック・ルネサンス概観（ニコルズ, 2016）","chapter":"c3-エントロピック・ブレイン","sub":2,"subCount":8,"tags":["substance","science"],"birth":null,"death":null,"href":"https://note.com/search?q=from%3A%40varelser%20%E3%82%B5%E3%82%A4%E3%82%B1%E3%83%87%E3%83%AA%E3%83%83%E3%82%AF%E3%83%BB%E3%83%AB%E3%83%8D%E3%82%B5%E3%83%B3%E3%82%B9%E6%A6%82%E8%A6%B3%EF%BC%88%E3%83%8B%E3%82%B3%E3%83%AB%E3%82%BA%2C%202016%EF%BC%89&context=note&mode=search","article":false,"descRaw":"：薬理学者デイヴィッド・ニコルズによる2016年の総説（『Pharmacological Reviews』）。1960年代の禁止で途絶えたサイケデリック研究が、2000年代以降に神経科学・精神医学として復興した経緯を包括的にレビューした。5-HT2A受容体の作用機序、LSD・シロシビン・DMTの薬理、臨床応用の展望を整理し、「サイケデリック・ルネサンス」の学術的基盤を示した。 出典：Nichols (2016)『Pharmacological Reviews』 DOI: 10.1124/pr.115.011478"},{"name":"アヤワスカの神経薬理学（マッケナら）","chapter":"c3-エントロピック・ブレイン","sub":2,"subCount":8,"tags":["science","substance","culture"],"birth":null,"death":null,"href":"https://note.com/search?q=from%3A%40varelser%20%E3%82%A2%E3%83%A4%E3%83%AF%E3%82%B9%E3%82%AB%E3%81%AE%E7%A5%9E%E7%B5%8C%E8%96%AC%E7%90%86%E5%AD%A6%EF%BC%88%E3%83%9E%E3%83%83%E3%82%B1%E3%83%8A%E3%82%89%EF%BC%89&context=note&mode=search","article":false,"descRaw":"：民族薬理学者デニス・マッケナらによるアヤワスカの作用機序の解明。アヤワスカはDMTを含む植物と、MAO阻害作用のあるハルミン類を含む植物の煎じ薬で、組み合わせによりDMTが経口で活性化される。マッケナは1980年代からアマゾンの伝統的調合を化学的に分析し、植物知識と神経薬理学を結ぶエスノファーマコロジーの代表的研究となった。"},{"name":"幻覚剤は何を教えてくれるのか（マイケル・ポーラン, 2018）","chapter":"c3-エントロピック・ブレイン","sub":2,"subCount":8,"tags":["substance","science"],"birth":null,"death":null,"href":"https://note.com/search?q=from%3A%40varelser%20%E5%B9%BB%E8%A6%9A%E5%89%A4%E3%81%AF%E4%BD%95%E3%82%92%E6%95%99%E3%81%88%E3%81%A6%E3%81%8F%E3%82%8C%E3%82%8B%E3%81%AE%E3%81%8B%EF%BC%88%E3%83%9E%E3%82%A4%E3%82%B1%E3%83%AB%E3%83%BB%E3%83%9D%E3%83%BC%E3%83%A9%E3%83%B3%2C%202018%EF%BC%89&context=note&mode=search","article":false,"descRaw":"：米国のジャーナリスト、マイケル・ポーランの2018年の著作『How to Change Your Mind』。サイケデリック研究の歴史、ジョンズ・ホプキンス大学やNYUの臨床試験、神経科学の最新知見を取材で統合し、自身の体験も交えて綴った。学術研究の社会的再評価を促し、サイケデリック・ルネサンスを一般読者に広めたベストセラーとなった。"},{"name":"エトムント・フッサール","chapter":"c3-エントロピック・ブレイン","sub":3,"subCount":8,"tags":["theory"],"birth":1859,"death":1938,"href":"https://note.com/varelser/n/n8b374dfb3968","article":true,"descRaw":"（独・1859–1938）：ドイツの哲学者で現象学の創始者。『論理学研究』（1900–01）や『イデーン』（1913）で、意識は常になにものかを志向する働きだと説き、判断を保留するエポケーや時間意識の分析を打ち立てた。体験そのものの構造を記述する方法は、変性意識を科学と哲学の両面から捉える基盤となった。弟子のハイデガーらを通じ、現象学は20世紀哲学の主軸となった。"},{"name":"モーリス・メルロ＝ポンティ","chapter":"c3-エントロピック・ブレイン","sub":3,"subCount":8,"tags":["theory"],"birth":1908,"death":1961,"href":"https://note.com/varelser/n/ndf9ddb74b99a","article":true,"descRaw":"（仏・1908–1961）：フランスの哲学者。『知覚の現象学』（1945）で、意識は脳のなかではなく「生きられた身体（corps vécu）」を通じた世界との関わりのなかにあると説いた。知覚の優位や身体図式の議論は、幻覚・身体感覚の変容・瞑想体験を理解する現象学的な土台を与えた。芸術や言語の現象学にも関心を広げ、セザンヌ論でも知られる。"},{"name":"アンリ・ベルクソン","chapter":"c3-エントロピック・ブレイン","sub":3,"subCount":8,"tags":["theory"],"birth":1859,"death":1941,"href":"https://note.com/varelser/n/nb96174f30c1e","article":true,"descRaw":"（仏・1859–1941）：フランスの哲学者。『時間と自由』（1889）や『創造的進化』（1907）で、時計の時間とは異なる、意識の流れとしての持続（durée）を説いた。生命の躍動（エラン・ヴィタル）や純粋記憶の理論は、瞑想や変性意識における時間体験の変容を哲学的に照らす古典となった。1927年にノーベル文学賞を受け、思想家として広く知られた。"},{"name":"マルティン・ハイデガー","chapter":"c3-エントロピック・ブレイン","sub":3,"subCount":8,"tags":["theory"],"birth":1889,"death":1976,"href":"https://note.com/varelser/n/n3f52ea7abafc","article":true,"descRaw":"（独・1889–1976）：ドイツの哲学者。『存在と時間』（1927）で、現存在は日常の雑事に埋没した意識から、不安や退屈といった根本気分によって本来の自己へと開かれると説いた。死への先駆や開示性の議論は、日常的な意識の枠組みが解体される体験を哲学の中心に据えた。晩年は言語・芸術・技術をめぐる思索を深め、20世紀哲学に決定的な影響を残した。"},{"name":"ウィリアム・ジェームズ","chapter":"c3-エントロピック・ブレイン","sub":3,"subCount":8,"tags":["theory","religion","substance"],"birth":1842,"death":1910,"href":"https://note.com/varelser/n/n6298d9ce0a12","article":true,"descRaw":"（米・1842–1910）：アメリカの心理学者・哲学者。『心理学原理』（1890）で意識の流れを論じ、『宗教的経験の諸相』（1902）で神秘体験を言い表し難さ・直観的認識・束の間・受動性の四点から分類した。自ら亜酸化窒素を吸入する自己実験も行い、変性意識を経験科学の主題として切り開いた。心理学と哲学を往還し、プラグマティズムの創始者でもある。"},{"name":"ジョルジュ・バタイユ","chapter":"c3-エントロピック・ブレイン","sub":3,"subCount":8,"tags":["theory","religion"],"birth":1897,"death":1962,"href":"https://note.com/varelser/n/nbfc2b6b318c7","article":true,"descRaw":"（仏・1897–1962）：フランスの思想家。『内的体験』（1943）で、知の限界を越える非知やエクスタシー、自己からの脱出（脱自）を哲学の中心に置いた。エロティシズムと聖なるものの連続性、至高性（souveraineté）の概念は、恍惚や境界溶解の体験を思想として言語化した試みだった。秘密結社アセファルを主宰するなど、実践的な探求も行った。"},{"name":"ジル・ドゥルーズ＋フェリックス・ガタリ","chapter":"c3-エントロピック・ブレイン","sub":3,"subCount":8,"tags":["theory"],"birth":null,"death":null,"href":"https://note.com/search?q=from%3A%40varelser%20%E3%82%B8%E3%83%AB%E3%83%BB%E3%83%89%E3%82%A5%E3%83%AB%E3%83%BC%E3%82%BA%EF%BC%8B%E3%83%95%E3%82%A7%E3%83%AA%E3%83%83%E3%82%AF%E3%82%B9%E3%83%BB%E3%82%AC%E3%82%BF%E3%83%AA&context=note&mode=search","article":false,"descRaw":"（仏）：フランスの哲学者ジル・ドゥルーズ（1925–1995）と精神分析家フェリックス・ガタリ（1930–1992）の共著コンビ。『アンチ・オイディプス』（1972）『千のプラトー』（1980）で、樹木状の思考に対するリゾームや器官なき身体、分裂分析を提唱した。意識の脱領域化・脱コード化という発想は、変性意識を制度や自我の枠組みからの解放として読む視点を与えた。"},{"name":"木村敏","chapter":"c3-エントロピック・ブレイン","sub":3,"subCount":8,"tags":["theory","science","clinical"],"birth":1931,"death":2021,"href":"https://note.com/search?q=from%3A%40varelser%20%E6%9C%A8%E6%9D%91%E6%95%8F&context=note&mode=search","article":false,"descRaw":"（1931–2021）：日本の精神科医・現象学的精神病理学者。『時間と自己』（1982）『あいだ』（1988）で、統合失調症を時間体験の破綻として記述し、自己と他者のあいだに生まれる関係性から精神病を論じた。現象学と臨床を結ぶその仕事は、意識の時間構造が変容する体験を精密に捉えた。京都大学で精神医学を講じ、日本の現象学的精神病理学を牽引した。"},{"name":"デイヴィッド・チャーマーズ","chapter":"c3-エントロピック・ブレイン","sub":4,"subCount":8,"tags":["theory"],"birth":1966,"death":null,"href":"https://note.com/search?q=from%3A%40varelser%20%E3%83%87%E3%82%A4%E3%83%B4%E3%82%A3%E3%83%83%E3%83%89%E3%83%BB%E3%83%81%E3%83%A3%E3%83%BC%E3%83%9E%E3%83%BC%E3%82%BA&context=note&mode=search","article":false,"descRaw":"（David Chalmers・1966–）：オーストラリアの哲学者。意識のハードプロブレム—脳の物理過程から主観的体験がなぜ生じるのかという問い—を1996年の『The Conscious Mind』で定式化した。哲学的ゾンビの思考実験でも知られ、意識を物理主義では捉えきれない問題として哲学の中心に据えた。意識の科学的探求を擁護し、オーストラリア国立大学などで教えた。"},{"name":"ダニエル・デネット","chapter":"c3-エントロピック・ブレイン","sub":4,"subCount":8,"tags":["theory","science"],"birth":1942,"death":2024,"href":"https://note.com/search?q=from%3A%40varelser%20%E3%83%80%E3%83%8B%E3%82%A8%E3%83%AB%E3%83%BB%E3%83%87%E3%83%8D%E3%83%83%E3%83%88&context=note&mode=search","article":false,"descRaw":"（Daniel Dennett・1942–2024）：アメリカの哲学者。『Consciousness Explained』（1991）で、意識を単一の劇場ではなく並行する複数の草稿として説明する多元的草稿モデルを提唱した。進化論と認知科学から意識を解明する立場で、チャーマーズのハードプロブレムに対して意識は説明可能だと論じた。タフツ大学で長く教え、認知科学の普及に尽力した。"},{"name":"トマス・ネーゲル","chapter":"c3-エントロピック・ブレイン","sub":4,"subCount":8,"tags":["theory"],"birth":1937,"death":null,"href":"https://note.com/varelser/n/n86e13988c34a","article":true,"descRaw":"（Thomas Nagel・1937–）：アメリカの哲学者。1974年の論文「コウモリであるとはどのようなことか」で、主観的体験の本質を問うた。コウモリの反響定位の経験は、物理的記述だけでは捉えられない「それがどのようなことか」という次元をもつとし、意識の主観性を哲学の中心問題として提示した。ニューヨーク大学で教え、倫理学や政治哲学でも知られる。"},{"name":"フランシスコ・ヴァレラ","chapter":"c3-エントロピック・ブレイン","sub":4,"subCount":8,"tags":["theory","science"],"birth":1946,"death":2001,"href":"https://note.com/search?q=from%3A%40varelser%20%E3%83%95%E3%83%A9%E3%83%B3%E3%82%B7%E3%82%B9%E3%82%B3%E3%83%BB%E3%83%B4%E3%82%A1%E3%83%AC%E3%83%A9&context=note&mode=search","article":false,"descRaw":"（Francisco Varela・1946–2001）：チリ生まれの生物学者・哲学者。マトゥラーナとともに、生命を自己を生み出すシステムとするオートポイエーシスの概念を提唱した。『The Embodied Mind』（1991）で認知を身体と環境の相互作用とするエナクティブ・アプローチを展開し、神経現象学で瞑想と脳科学を結んだ。仏教の瞑想実践者でもあり、科学と仏教の対話を進めた。"},{"name":"エヴァン・トンプソン","chapter":"c3-エントロピック・ブレイン","sub":4,"subCount":8,"tags":["theory","dream","practice"],"birth":1962,"death":null,"href":"https://note.com/search?q=from%3A%40varelser%20%E3%82%A8%E3%83%B4%E3%82%A1%E3%83%B3%E3%83%BB%E3%83%88%E3%83%B3%E3%83%97%E3%82%BD%E3%83%B3&context=note&mode=search","article":false,"descRaw":"（Evan Thompson・1962–）：カナダの哲学者。『Waking, Dreaming, Being』（2014）で、睡眠・夢・瞑想・死を現象学と認知科学の両面から論じ、意識を自己と世界の関係のなかで捉えた。エナクティブ認知の立場から、自己意識の変容や死の体験を哲学と科学の橋渡しとして追究している。トロント大学で哲学を教え、仏教と認知科学の対話を続けている。"},{"name":"アルワ・ノエ","chapter":"c3-エントロピック・ブレイン","sub":4,"subCount":8,"tags":["theory","science"],"birth":1964,"death":null,"href":"https://note.com/varelser/n/n746f8113aba0","article":true,"descRaw":"（Alva Noë・1964–）：アメリカの哲学者。『Action in Perception』（2004）で、「知覚は脳のなかで起きるのではなく、身体の行為のなかで起きる」とするエナクティブな知覚論を提唱した。感覚運動随伴性の考えは、知覚の変容や幻覚を、脳だけでなく身体と環境の関係から理解する視点を与えた。カリフォルニア大学バークレー校で哲学を教えている。"},{"name":"スーザン・ブラックモア","chapter":"c3-エントロピック・ブレイン","sub":4,"subCount":8,"tags":["science","theory","religion"],"birth":1951,"death":null,"href":"https://note.com/search?q=from%3A%40varelser%20%E3%82%B9%E3%83%BC%E3%82%B6%E3%83%B3%E3%83%BB%E3%83%96%E3%83%A9%E3%83%83%E3%82%AF%E3%83%A2%E3%82%A2&context=note&mode=search","article":false,"descRaw":"（Susan Blackmore，1951–）：イギリスの心理学者・意識研究者。1970年の体外離脱体験をきっかけに超心理学の研究に入ったが、検証で再現できず懐疑論に転じた。『Dying to Live』（1993）では臨死体験を「死にゆく脳」の産物として説明し、『The Meme Machine』（1999）でも知られる。意識研究の入門書は、世界中で教科書として使われている。"},{"name":"トーマス・メッツィンガー","chapter":"c3-エントロピック・ブレイン","sub":4,"subCount":8,"tags":["theory","science"],"birth":1958,"death":null,"href":"https://note.com/search?q=from%3A%40varelser%20%E3%83%88%E3%83%BC%E3%83%9E%E3%82%B9%E3%83%BB%E3%83%A1%E3%83%83%E3%83%84%E3%82%A3%E3%83%B3%E3%82%AC%E3%83%BC&context=note&mode=search","article":false,"descRaw":"（Thomas Metzinger，1958–）：ドイツの哲学者。現象的自己モデル理論の提唱者で、自己とは脳が生成する透明な自己モデルであり、自我はそのモデルの内容にすぎないと論じた。『Being No One』（2003）『The Ego Tunnel』（2009）で、夢・体外離脱・自我溶解などの体験を自己モデルの変容として説明した。マインツ大学で哲学を教え、意識の倫理についても論じている。"},{"name":"神経現象学（ヴァレラ, 1996）","chapter":"c3-エントロピック・ブレイン","sub":5,"subCount":8,"tags":["theory","science"],"birth":null,"death":null,"href":"https://note.com/varelser/n/naf9b16c18a9e","article":true,"descRaw":"：フランシスコ・ヴァレラが1996年の論文で提唱した方法論。一人称的な体験報告と三人称的な神経データを相互に制約し合う形で統合し、意識の「ハードプロブレム」への実践的アプローチとした。瞑想者の体験報告と脳活動を結びつける研究の枠組みとなり、神経科学と現象学の対話を切り開いた。ヴァレラはチリ出身の生物学者・神経科学者で、オートポイエーシス理論の提唱者でもある。"},{"name":"マイクロフェノメノロジー（ペティメンジン）","chapter":"c3-エントロピック・ブレイン","sub":5,"subCount":8,"tags":["science","theory"],"birth":null,"death":null,"href":"https://note.com/varelser/n/ncfc6c3528316","article":true,"descRaw":"：フランスの研究者クレール・ペティメンジンが開発した、体験の微細な構造を詳細面接法で記述する質的手法。2006年の論文で第二人称面接の方法を体系化し、体験がどう展開するかを段階的に言語化する。変性意識体験の言語化困難な側面へのアクセスを可能にし、神経現象学の実践手法となった。この手法は瞑想・てんかん前兆・直観的判断など多様な体験の研究に応用されている。"},{"name":"体験サンプリング法（ESM）","chapter":"c3-エントロピック・ブレイン","sub":5,"subCount":8,"tags":["science"],"birth":null,"death":null,"href":"https://note.com/search?q=from%3A%40varelser%20%E4%BD%93%E9%A8%93%E3%82%B5%E3%83%B3%E3%83%97%E3%83%AA%E3%83%B3%E3%82%B0%E6%B3%95%EF%BC%88ESM%EF%BC%89&context=note&mode=search","article":false,"descRaw":"：日常生活の中で意識状態をリアルタイムに繰り返しサンプリングする手法。チクセントミハイとラーソンが1987年に妥当性を検証し、ポケットベルやスマートフォンでその瞬間の体験を記録させる。マインドワンダリング、フロー、解離などの生態学的研究に用いられ、実験室外の意識を捉える方法となった。現在ではスマートフォンアプリを用いた大規模な日常意識の調査も行われている。"},{"name":"解釈学的現象学分析（IPA）","chapter":"c3-エントロピック・ブレイン","sub":5,"subCount":8,"tags":["science","theory"],"birth":null,"death":null,"href":"https://note.com/varelser/n/n3b51f326d54f","article":true,"descRaw":"：ジョナサン・スミスが1996年に提唱した質的研究法。個人の生きられた体験を詳細に解釈し、その意味構造を明らかにする。サイケデリック体験や神秘体験の主観的意味の分析に応用され、少数の事例を深く掘り下げることで、変性意識体験の個別性と共通性を描き出す。IPAは心理学の質的研究で広く用いられ、健康心理学などで多くの研究がある。"},{"name":"一人称研究と主観報告の方法論","chapter":"c3-エントロピック・ブレイン","sub":5,"subCount":8,"tags":["science","theory"],"birth":null,"death":null,"href":"https://note.com/search?q=from%3A%40varelser%20%E4%B8%80%E4%BA%BA%E7%A7%B0%E7%A0%94%E7%A9%B6%E3%81%A8%E4%B8%BB%E8%A6%B3%E5%A0%B1%E5%91%8A%E3%81%AE%E6%96%B9%E6%B3%95%E8%AB%96&context=note&mode=search","article":false,"descRaw":"：内省報告の信頼性と妥当性をめぐる方法論的議論。変性意識研究では主観的体験そのものが研究対象となるため、報告の正確性やバイアス、言語化の限界が問われる。神経現象学やマイクロフェノメノロジーは、主観データを科学的に扱うための方法論として発展した。主観報告の妥当性を高めるため、訓練された内省や現象学的面接が工夫されている。"},{"name":"言語化困難性（Ineffability）の研究","chapter":"c3-エントロピック・ブレイン","sub":5,"subCount":8,"tags":["theory","science"],"birth":null,"death":null,"href":"https://note.com/search?q=from%3A%40varelser%20%E8%A8%80%E8%AA%9E%E5%8C%96%E5%9B%B0%E9%9B%A3%E6%80%A7%EF%BC%88Ineffability%EF%BC%89%E3%81%AE%E7%A0%94%E7%A9%B6&context=note&mode=search","article":false,"descRaw":"：神秘体験やサイケデリック体験の本質的特徴としての「言葉にできなさ」をめぐる研究。ジェイムズが神秘体験の第一の特徴に挙げた言い表しがたさは、ステイスの類型論やMEQの因子にも組み込まれた。記述不可能性を哲学的・認知科学的に分析し、体験と言語の関係を問う。言語化困難性は、神秘体験の測定尺度MEQの4因子の一つにもなっている。"},{"name":"二人称アプローチと対話的研究","chapter":"c3-エントロピック・ブレイン","sub":5,"subCount":8,"tags":["theory","science"],"birth":null,"death":null,"href":"https://note.com/search?q=from%3A%40varelser%20%E4%BA%8C%E4%BA%BA%E7%A7%B0%E3%82%A2%E3%83%97%E3%83%AD%E3%83%BC%E3%83%81%E3%81%A8%E5%AF%BE%E8%A9%B1%E7%9A%84%E7%A0%94%E7%A9%B6&context=note&mode=search","article":false,"descRaw":"：研究者と体験者の対話的関係を通じて知を生成する方法論。ペティメンジンの第二人称面接に代表され、共感的理解と誘導的な問いかけで体験の微細な構造を引き出す。観察者と対象を分離するのではなく、対話の中で体験を共同で構成する意識研究の方法として注目されている。この方法は神経現象学の実践として、脳計測と体験報告を結びつける試みでもある。"},{"name":"エナクティヴィズム（ヴァレラ, トンプソン, ロッシュ）","chapter":"c3-エントロピック・ブレイン","sub":6,"subCount":8,"tags":["theory","practice"],"birth":null,"death":null,"href":"https://note.com/varelser/n/n030a1f7e9c2e","article":true,"descRaw":"：フランシスコ・ヴァレラ、エヴァン・トンプソン、エレノア・ロッシュが1991年の著書『The Embodied Mind』で展開した認知理論。認知を脳内の表象計算ではなく、身体をもつ存在が環境と相互行為するなかで世界を「立ち上げる」過程とみる。自己組織化（オートポイエーシス）や仏教の縁起思想と対話し、瞑想を認知科学の方法として位置づけた。身体化された心の理論として、4E認知の中心的な柱となった。"},{"name":"アフォーダンス理論（ギブソン, 1979）","chapter":"c3-エントロピック・ブレイン","sub":6,"subCount":8,"tags":["theory","science"],"birth":null,"death":null,"href":"https://note.com/search?q=from%3A%40varelser%20%E3%82%A2%E3%83%95%E3%82%A9%E3%83%BC%E3%83%80%E3%83%B3%E3%82%B9%E7%90%86%E8%AB%96%EF%BC%88%E3%82%AE%E3%83%96%E3%82%BD%E3%83%B3%2C%201979%EF%BC%89&context=note&mode=search","article":false,"descRaw":"：ジェイムズ・J・ギブソンが1979年の著書『The Ecological Approach to Visual Perception』で提唱した概念。環境が行為者に提供する行為の可能性（例：椅子は「座れる」、地面は「歩ける」）を指し、知覚を情報の能動的な探索として再定義した。知覚は脳内の表象構築ではなく、環境との直接的な関わりだとする生態学的心理学の核である。身体と環境の関係性のなかで意識を捉える視点として、エナクティヴィズムや4E認知の基盤となった。"},{"name":"拡張心仮説（クラーク & チャーマーズ, 1998）","chapter":"c3-エントロピック・ブレイン","sub":6,"subCount":8,"tags":["theory","tech","science"],"birth":null,"death":null,"href":"https://note.com/varelser/n/n00d21357f5fc","article":true,"descRaw":"：アンディ・クラークとデイヴィッド・チャーマーズが1998年の論文「The Extended Mind」で提唱した仮説。認知プロセスは頭蓋内に限定されず、ノートやスマートフォンなどの環境の道具が、脳の記憶と同じ役割を果たすなら認知系の一部だとする。アルツハイマー症のオットーが手帳を記憶の代わりに使う思考実験が有名。意識の境界を身体の外へ拡張する議論として、変性意識における道具・技術・環境の役割を考える手がかりとなる。 出典：Clark & Chalmers (1998)『Analysis』 DOI: 10.1093/analys/58.1.7"},{"name":"ミラーニューロン理論（リゾラッティら, 1996）","chapter":"c3-エントロピック・ブレイン","sub":6,"subCount":8,"tags":["science","theory"],"birth":null,"death":null,"href":"https://note.com/search?q=from%3A%40varelser%20%E3%83%9F%E3%83%A9%E3%83%BC%E3%83%8B%E3%83%A5%E3%83%BC%E3%83%AD%E3%83%B3%E7%90%86%E8%AB%96%EF%BC%88%E3%83%AA%E3%82%BE%E3%83%A9%E3%83%83%E3%83%86%E3%82%A3%E3%82%89%2C%201996%EF%BC%89&context=note&mode=search","article":false,"descRaw":"：ジャコモ・リゾラッティらが1996年に報告した、マカクザルの腹側運動前野（F5野）の神経細胞。自分が行為するときも、他者が同じ行為をするのを観察するときも発火する。ガレーゼらとの論文「Action recognition in the premotor cortex」（Brain, 1996）で、92個のミラーニューロンの性質が詳述された。他者の行為理解・模倣・共感の神経基盤とされ、身体化された社会認知の証拠として、集団的変性意識や共感の研究とも結びつけられる。 出典：Gallese et al. (1996)『Brain』 DOI: 10.1093/brain/119.2.593"},{"name":"制定的認知と参加型意味生成（デ・ヤーガー & ディ・パオロ）","chapter":"c3-エントロピック・ブレイン","sub":6,"subCount":8,"tags":["theory","science"],"birth":null,"death":null,"href":"https://note.com/search?q=from%3A%40varelser%20%E5%88%B6%E5%AE%9A%E7%9A%84%E8%AA%8D%E7%9F%A5%E3%81%A8%E5%8F%82%E5%8A%A0%E5%9E%8B%E6%84%8F%E5%91%B3%E7%94%9F%E6%88%90%EF%BC%88%E3%83%87%E3%83%BB%E3%83%A4%E3%83%BC%E3%82%AC%E3%83%BC%20%26%20%E3%83%87%E3%82%A3%E3%83%BB%E3%83%91%E3%82%AA%E3%83%AD%EF%BC%89&context=note&mode=search","article":false,"descRaw":"：ハンネ・デ・ヤーガーとエセキエル・ディ・パオロが2007年に提唱した、エナクティヴィズムの社会認知論。意味は個人の頭のなかで作られるのではなく、二者間の相互行為の動態のなかで共同的に生成される（参加型意味生成）とする。会話やダンス、儀礼での同期など、相互作用そのものが認知の場となる。集団的変性意識や共同体の一体感を、個人の脳状態の総和ではなく関係性の過程として捉える枠組みである。"},{"name":"中国語の部屋と記号接地問題（サール, 1980）","chapter":"c3-エントロピック・ブレイン","sub":6,"subCount":8,"tags":["theory","tech"],"birth":null,"death":null,"href":"https://note.com/search?q=from%3A%40varelser%20%E4%B8%AD%E5%9B%BD%E8%AA%9E%E3%81%AE%E9%83%A8%E5%B1%8B%E3%81%A8%E8%A8%98%E5%8F%B7%E6%8E%A5%E5%9C%B0%E5%95%8F%E9%A1%8C%EF%BC%88%E3%82%B5%E3%83%BC%E3%83%AB%2C%201980%EF%BC%89&context=note&mode=search","article":false,"descRaw":"：ジョン・サールが1980年の論文「Minds, brains, and programs」で提示した思考実験。中国語を理解しない人が規則書に従って中国語の質問に正しく答えても、中国語を「理解」していることにはならない。統語的操作だけでは意味理解（意識）は生じないとし、強いAIの主張を批判した。関連する「記号接地問題」（ハルナッド、1990）は、記号がどう身体や世界と結びつくかを問う。意識の計算論的説明の限界を示す古典的な論点である。 出典：Searle (1980)『Behavioral and Brain Sciences』 DOI: 10.1017/S0140525X00005756"},{"name":"予測的心とエコロジカル・アプローチの統合","chapter":"c3-エントロピック・ブレイン","sub":6,"subCount":8,"tags":["theory","science"],"birth":null,"death":null,"href":"https://note.com/search?q=from%3A%40varelser%20%E4%BA%88%E6%B8%AC%E7%9A%84%E5%BF%83%E3%81%A8%E3%82%A8%E3%82%B3%E3%83%AD%E3%82%B8%E3%82%AB%E3%83%AB%E3%83%BB%E3%82%A2%E3%83%97%E3%83%AD%E3%83%BC%E3%83%81%E3%81%AE%E7%B5%B1%E5%90%88&context=note&mode=search","article":false,"descRaw":"：予測処理（脳は世界を予測する機械）と、ギブソンの生態学的知覚論（知覚は環境との直接的な関わり）を統合する枠組み。アンディ・クラークらが展開し、予測は頭のなかの抽象計算ではなく、身体化され、環境に埋め込まれた能動的な過程だとする。知覚・行為・環境が一体となった予測的存在として意識を捉え、変性意識を予測モデルの再編として理解する視点を与える。4E認知と予測処理の接合点である。"},{"name":"4E認知（Embodied, Embedded, Enacted, Extended）","chapter":"c3-エントロピック・ブレイン","sub":6,"subCount":8,"tags":["theory","science"],"birth":null,"death":null,"href":"https://note.com/search?q=from%3A%40varelser%204E%E8%AA%8D%E7%9F%A5%EF%BC%88Embodied%2C%20Embedded%2C%20Enacted%2C%20Extended%EF%BC%89&context=note&mode=search","article":false,"descRaw":"：意識を脳内に閉じ込めず、身体化され（embodied）、環境に埋め込まれ（embedded）、行為によって生み出され（enacted）、道具へ拡張される（extended）ものとして捉える認知科学のパラダイム。クラークとチャーマーズの「拡張心」仮説（1998年）やヴァレラらのエナクティヴィズムを源流とし、変性意識も身体と環境の相互作用から理解しようとする。"},{"name":"存在と時間（ハイデガー, 1927）","chapter":"c3-エントロピック・ブレイン","sub":7,"subCount":8,"tags":["theory"],"birth":null,"death":null,"href":"https://note.com/search?q=from%3A%40varelser%20%E5%AD%98%E5%9C%A8%E3%81%A8%E6%99%82%E9%96%93%EF%BC%88%E3%83%8F%E3%82%A4%E3%83%87%E3%82%AC%E3%83%BC%2C%201927%EF%BC%89&context=note&mode=search","article":false,"descRaw":"：ドイツの哲学者マルティン・ハイデガーの1927年の主著。現存在（ダーザイン）の存在論的分析を通じ、「世界内存在」「不安」「本来性」などの概念で人間の存在構造を解明した。意識を主観の内部現象ではなく、世界との関わりの中で開かれるものとして捉え、現象学と実存哲学の基礎を築いた。未完のまま刊行されたが、20世紀哲学に決定的な影響を与えた。"},{"name":"知覚の現象学（メルロ＝ポンティ, 1945）","chapter":"c3-エントロピック・ブレイン","sub":7,"subCount":8,"tags":["theory","science"],"birth":null,"death":null,"href":"https://note.com/varelser/n/n246dda2a1f39","article":true,"descRaw":"：フランスの哲学者モーリス・メルロ＝ポンティの1945年の主著。知覚を身体を通じた世界との関わりとして分析し、「生きられた身体」の概念を提示した。意識を脳や心の内部ではなく、身体と世界のあいだに位置づける視点は、変性意識を含む知覚変容の哲学的基盤となり、身体性認知の源流となった。現象学と認知科学の対話を促し、エナクティヴィズムにも影響を与えた。"},{"name":"時間意識の現象学（フッサール）","chapter":"c3-エントロピック・ブレイン","sub":7,"subCount":8,"tags":["theory"],"birth":null,"death":null,"href":"https://note.com/search?q=from%3A%40varelser%20%E6%99%82%E9%96%93%E6%84%8F%E8%AD%98%E3%81%AE%E7%8F%BE%E8%B1%A1%E5%AD%A6%EF%BC%88%E3%83%95%E3%83%83%E3%82%B5%E3%83%BC%E3%83%AB%EF%BC%89&context=note&mode=search","article":false,"descRaw":"：ドイツの哲学者エトムント・フッサールによる内的時間意識の分析。1905年の講義をもとに、体験の流れを「把持（過去の保持）—原印象（現在の知覚）—予持（未来の予期）」の構造で記述した。時間体験の変容を伴う変性意識状態を理解する理論的根拠となり、現象学の中心概念となった。この分析は後の現象学や神経現象学の時間論の出発点となった。"},{"name":"テレンス・マッケナ","chapter":"c4-誘発法","sub":0,"subCount":15,"tags":["substance","culture","theory"],"birth":1946,"death":2000,"href":"https://note.com/varelser/n/ncee1476f7552","article":true,"descRaw":"（Terence McKenna・1946–2000）：アメリカの著述家・民族植物学者。サイケデリック体験の文化的・進化的意義を説き、言語や宗教の起源にキノコが関わったとする「ストーンド・エイプ仮説」を提唱した。『Food of the Gods』（1992）や『True Hallucinations』（1993）で、アヤワスカやシロシビンの体験を語った。"},{"name":"デニス・マッケナ","chapter":"c4-誘発法","sub":0,"subCount":15,"tags":["substance","science"],"birth":1950,"death":null,"href":"https://note.com/varelser/n/nc23110243b0e","article":true,"descRaw":"（Dennis McKenna・1950–）：アメリカの民族薬理学者で、テレンス・マッケナの弟。アヤワスカやDMTの科学的研究を推進し、アマゾンの植物化学を調査した。『The Brotherhood of the Screaming Abyss』（2012）で兄との探求を回想し、サイケデリック研究の科学的基盤を築いた一人である。ミネソタ大学で教え、アヤワスカの薬理学的研究を続けている。"},{"name":"ゴードン・ワッソン","chapter":"c4-誘発法","sub":0,"subCount":15,"tags":["substance","culture","religion"],"birth":1898,"death":1986,"href":"https://note.com/search?q=from%3A%40varelser%20%E3%82%B4%E3%83%BC%E3%83%89%E3%83%B3%E3%83%BB%E3%83%AF%E3%83%83%E3%82%BD%E3%83%B3&context=note&mode=search","article":false,"descRaw":"（R. Gordon Wasson・1898–1986）：アメリカの銀行家・民族菌学者。1955年にマリア・サビーナを訪ね、メソアメリカのマジックマッシュルーム儀礼を西洋に「再発見」した。1957年の『ライフ』誌記事「Seeking the Magic Mushroom」で広く知られ、シロシビン研究とサイケデリック文化の出発点となった。銀行家としての経歴をもち、菌類研究は趣味から始まった。"},{"name":"マリア・サビーナ","chapter":"c4-誘発法","sub":0,"subCount":15,"tags":["religion","substance","culture"],"birth":1894,"death":1985,"href":"https://note.com/search?q=from%3A%40varelser%20%E3%83%9E%E3%83%AA%E3%82%A2%E3%83%BB%E3%82%B5%E3%83%93%E3%83%BC%E3%83%8A&context=note&mode=search","article":false,"descRaw":"（María Sabina・1894–1985）：メキシコ・マサテック族のシャーマン（curandera）。聖なるキノコを用いた夜通しの治癒儀礼ヴェラーダの実践者で、1955年にワッソンを迎え入れたことで世界的に知られた。歌と祈りによる治癒の伝統を守り、先住民の薬草知識と変性意識の結びつきを象徴する人物である。ワッソンの訪問後、多くの外国人が村を訪れるようになった。"},{"name":"アルベルト・ホフマン","chapter":"c4-誘発法","sub":0,"subCount":15,"tags":["substance","science"],"birth":1906,"death":2008,"href":"https://note.com/search?q=from%3A%40varelser%20%E3%82%A2%E3%83%AB%E3%83%99%E3%83%AB%E3%83%88%E3%83%BB%E3%83%9B%E3%83%95%E3%83%9E%E3%83%B3&context=note&mode=search","article":false,"descRaw":"（Albert Hofmann・1906–2008）：スイスの化学者。1938年にLSDを合成し、1943年4月19日に自ら摂取してその作用を発見した（「自転車の日」）。1958年にはシロシビンの単離にも成功した。『LSD: My Problem Child』（1979）で、幻覚剤の科学的・文化的可能性を生涯にわたって擁護した。晩年まで幻覚剤の研究を擁護し、100歳を超えて生きた。"},{"name":"ティモシー・リアリー","chapter":"c4-誘発法","sub":0,"subCount":15,"tags":["substance","culture"],"birth":1920,"death":1996,"href":"https://note.com/varelser/n/nd17e1eef0445","article":true,"descRaw":"（Timothy Leary・1920–1996）：アメリカの心理学者でサイケデリック運動の推進者。ハーバード大学でシロシビン・プロジェクトを率い、後に「ターン・オン、チューン・イン、ドロップ・アウト」のスローガンでカウンターカルチャーの象徴となった。『The Psychedelic Experience』（1964）などの著作で、意識拡張の思想を広めた。"},{"name":"ラルフ・メッツナー","chapter":"c4-誘発法","sub":0,"subCount":15,"tags":["substance","theory"],"birth":1936,"death":2019,"href":"https://note.com/varelser/n/n97eacbf00620","article":true,"descRaw":"（Ralph Metzner・1936–2019）：ドイツ生まれの心理学者。リアリー、ラム・ダスとともにハーバード・サイケデリック・プロジェクトの中心人物で、『The Psychedelic Experience』（1964）の共著者。後にサイケデリック体験と生態学を結ぶグリーン・サイコロジーを展開し、意識変容と自然との関わりを論じた。晩年はカリフォルニア統合研究所で教え、意識研究を続けた。"},{"name":"リチャード・エヴァンス・シュルテス","chapter":"c4-誘発法","sub":0,"subCount":15,"tags":["substance","science","culture"],"birth":1915,"death":2001,"href":"https://note.com/search?q=from%3A%40varelser%20%E3%83%AA%E3%83%81%E3%83%A3%E3%83%BC%E3%83%89%E3%83%BB%E3%82%A8%E3%83%B4%E3%82%A1%E3%83%B3%E3%82%B9%E3%83%BB%E3%82%B7%E3%83%A5%E3%83%AB%E3%83%86%E3%82%B9&context=note&mode=search","article":false,"descRaw":"（Richard Evans Schultes・1915–2001）：アメリカの植物人類学者。アマゾンの幻覚植物を科学的に調査した先駆者で、ハーバード大学植物博物館の館長を務めた。ペヨーテやアヤワスカの植物学的基盤を確立し、ホフマンとの共著『Plants of the Gods』（1979）で民族植物学の古典を残した。アマゾンでの長期調査で、数千の植物標本を収集した。"},{"name":"アレクサンダー・シュルギン","chapter":"c4-誘発法","sub":0,"subCount":15,"tags":["substance","science"],"birth":1925,"death":2014,"href":"https://note.com/search?q=from%3A%40varelser%20%E3%82%A2%E3%83%AC%E3%82%AF%E3%82%B5%E3%83%B3%E3%83%80%E3%83%BC%E3%83%BB%E3%82%B7%E3%83%A5%E3%83%AB%E3%82%AE%E3%83%B3&context=note&mode=search","article":false,"descRaw":"（Alexander Shulgin・1925–2014）：アメリカの化学者。MDMAを再合成し、200種以上のサイコアクティブ物質を合成・自己実験してその作用を記録した。妻アンとの共著『PiHKAL』（1991）『TiHKAL』（1997）は、精神薬理学の異端的な百科事典として、サイケデリック研究の基盤となった。カリフォルニアの自宅の実験室で、数十年にわたり研究を続けた。"},{"name":"マイケル・ハーナー","chapter":"c4-誘発法","sub":0,"subCount":15,"tags":["religion","practice","culture"],"birth":1929,"death":2018,"href":"https://note.com/varelser/n/nc947948fc6db","article":true,"descRaw":"（Michael Harner・1929–2018）：アメリカの人類学者でコアシャーマニズムの提唱者。アマゾンでのアヤワスカ体験を経て、文化を超えた共通のシャーマニズム実践を抽出し、訓練法として体系化した。『The Way of the Shaman』（1980）は現代のネオシャーマニズムの教科書となり、シャーマニック・スタディーズ財団を創設した。その訓練法は、世界各地のワークショップで今も教えられている。"},{"name":"ジェレミー・ナービー","chapter":"c4-誘発法","sub":0,"subCount":15,"tags":["substance","theory","culture"],"birth":1959,"death":null,"href":"https://note.com/search?q=from%3A%40varelser%20%E3%82%B8%E3%82%A7%E3%83%AC%E3%83%9F%E3%83%BC%E3%83%BB%E3%83%8A%E3%83%BC%E3%83%93%E3%83%BC&context=note&mode=search","article":false,"descRaw":"（Jeremy Narby・1959–）：カナダの人類学者。『宇宙の蛇（The Cosmic Serpent）』（1998）で、アヤワスカのヴィジョンに現れる蛇とDNAの二重らせんの対応を論じ、シャーマンの知識が分子レベルの直観に通じるという仮説を提示した。科学と先住民知識の対話をめぐる議論の起点となった。人類学の博士号をもち、科学者としての視点で仮説を立てた。"},{"name":"ベニー・シャノン","chapter":"c4-誘発法","sub":0,"subCount":15,"tags":["substance","science","theory"],"birth":1948,"death":2025,"href":"https://note.com/varelser/n/nd218600c9b57","article":true,"descRaw":"（Benny Shanon・1948–2025）：イスラエルの認知心理学者でヘブライ大学教授。『The Antipodes of the Mind』（2002）で、数百回の自己飲用を含む約2,500件のアヤワスカ体験のコーパスをもとに、その現象学を認知心理学的に分析した。モーセの体験を幻覚植物と結びつける聖書エンテオジェン仮説でも知られる。その仮説は学界で大きな論争を呼んだ。"},{"name":"エヴリン・アンダーヒル","chapter":"c4-誘発法","sub":0,"subCount":15,"tags":["religion","theory"],"birth":1875,"death":1941,"href":"https://note.com/search?q=from%3A%40varelser%20%E3%82%A8%E3%83%B4%E3%83%AA%E3%83%B3%E3%83%BB%E3%82%A2%E3%83%B3%E3%83%80%E3%83%BC%E3%83%92%E3%83%AB&context=note&mode=search","article":false,"descRaw":"（Evelyn Underhill・1875–1941）：イギリスの神秘主義研究家。『神秘主義（Mysticism）』（1911）で、キリスト教神秘体験を覚醒・浄化・照明・暗夜・合一の五段階で整理した。浄化から照明を経て神との合一に至る道程の記述は、宗教体験の変容過程を体系化した古典となった。神秘体験を心理学的にも読み解いた。著作は神秘主義研究の入門書として今も読み継がれている。"},{"name":"ウォルター・パーンケ","chapter":"c4-誘発法","sub":0,"subCount":15,"tags":["substance","science","religion"],"birth":1931,"death":1971,"href":"https://note.com/search?q=from%3A%40varelser%20%E3%82%A6%E3%82%A9%E3%83%AB%E3%82%BF%E3%83%BC%E3%83%BB%E3%83%91%E3%83%BC%E3%83%B3%E3%82%B1&context=note&mode=search","article":false,"descRaw":"（Walter Pahnke・1931–1971）：アメリカの神学者・精神科医。1962年のグッドフライデー実験で、マーシュ・チャペルの礼拝中にシロシビンとプラセボを二重盲検で投与し、薬物が神秘体験を引き起こすかを検証した。参加者の多くが深い宗教体験を報告し、サイケデリックと神秘体験の関係を実験的に示した画期的研究となった。その後の追跡調査でも、体験の持続的な影響が確認された。"},{"name":"ジョナサン・オット","chapter":"c4-誘発法","sub":0,"subCount":15,"tags":["substance","culture","science"],"birth":1949,"death":2025,"href":"https://note.com/search?q=from%3A%40varelser%20%E3%82%B8%E3%83%A7%E3%83%8A%E3%82%B5%E3%83%B3%E3%83%BB%E3%82%AA%E3%83%83%E3%83%88&context=note&mode=search","article":false,"descRaw":"（Jonathan Ott・1949–2025・米）：アメリカの民族植物学者・化学者。ワッソンらとともに「エンテオジェン（entheogen）」の概念を1979年に提唱し、幻覚剤を神聖な文脈で捉え直した。『Pharmacotheon』（1993）は千種を超える幻視植物の百科全書的研究で、ブフォテニンの精神活性を確認したことでも知られる。メキシコに暮らし、植物園を営みながら研究を続けた。"},{"name":"ルイス・エドゥアルド・ルナ","chapter":"c4-誘発法","sub":0,"subCount":15,"tags":["substance","culture","religion"],"birth":1947,"death":null,"href":"https://note.com/search?q=from%3A%40varelser%20%E3%83%AB%E3%82%A4%E3%82%B9%E3%83%BB%E3%82%A8%E3%83%89%E3%82%A5%E3%82%A2%E3%83%AB%E3%83%89%E3%83%BB%E3%83%AB%E3%83%8A&context=note&mode=search","article":false,"descRaw":"（Luis Eduardo Luna・1947–・コロンビア-フィンランド）：ブラジル生まれの人類学者でアヤワスカ研究の第一人者。アマゾンのメスティーソ治療者の実践を調査し、「植物の教師（Plantas Maestras）」の概念を学術化した。アマリンゴとの共著『Ayahuasca Visions』（1991）は、幻視の絵画と語りによる民族誌の古典となった。アマゾンの治療者たちとの長期調査をもとに、植物の知恵を記録し続けた。"},{"name":"リック・ドブリン","chapter":"c4-誘発法","sub":0,"subCount":15,"tags":["substance","clinical"],"birth":1953,"death":null,"href":"https://note.com/varelser/n/n3920ba34344c","article":true,"descRaw":"（Rick Doblin・1953–・米）：アメリカの活動家・研究者。1986年にMAPS（Multidisciplinary Association for Psychedelic Studies）を創設し、MDMA支援療法の臨床試験を牽引した。PTSD治療への応用をめざす組織的基盤を築き、サイケデリック・ルネサンスを制度面から支えた最重要人物の一人である。"},{"name":"ハンフリー・オズモンド","chapter":"c4-誘発法","sub":0,"subCount":15,"tags":["substance","clinical","science"],"birth":1917,"death":2004,"href":"https://note.com/search?q=from%3A%40varelser%20%E3%83%8F%E3%83%B3%E3%83%95%E3%83%AA%E3%83%BC%E3%83%BB%E3%82%AA%E3%82%BA%E3%83%A2%E3%83%B3%E3%83%89&context=note&mode=search","article":false,"descRaw":"（Humphry Osmond，1917–2004）：イギリス生まれの精神科医。1953年にハクスリーにメスカリン400mgを投与・監督し、その体験が『知覚の扉』（1954）につながった。1956年の書簡で「psychedelic（心を顕すもの）」という語を造語した。LSDによるアルコール依存症治療の研究でも知られる。サスカチュワン州で精神科医として働き、アルコール依存症の治療に取り組んだ。"},{"name":"ブウィティ","chapter":"c4-誘発法","sub":0,"subCount":15,"tags":["religion","substance","culture"],"birth":null,"death":null,"href":"https://note.com/search?q=from%3A%40varelser%20%E3%83%96%E3%82%A6%E3%82%A3%E3%83%86%E3%82%A3&context=note&mode=search","article":false,"descRaw":"：ガボンの森林民の宗教。イボガの根皮を聖餐とし、入信儀礼では長時間の幻視体験を経て祖先霊と交わる。ファン族やバブンゴ族などに伝わり、ガボンの公認宗教の一つとして認められている。植物による意識変容を宗教の中心に据えた伝統である。儀礼では音楽と踊りが重要な役割を果たし、共同体全体で祝われる宗教行事として今も続いている。"},{"name":"サン族のトランスダンス","chapter":"c4-誘発法","sub":0,"subCount":15,"tags":["religion","practice","culture"],"birth":null,"death":null,"href":"https://note.com/search?q=from%3A%40varelser%20%E3%82%B5%E3%83%B3%E6%97%8F%E3%81%AE%E3%83%88%E3%83%A9%E3%83%B3%E3%82%B9%E3%83%80%E3%83%B3%E3%82%B9&context=note&mode=search","article":false,"descRaw":"：カラハリのサン族の徹夜の治癒の踊り。歌と太鼓、拍手のなかで霊的エネルギーn/umが沸騰し、治癒者が!kiaと呼ばれる変性意識に入って病を吸い取るとされる。リチャード・カッツの『Boiling Energy』（1982）などで記録され、共同体による治癒の儀礼として知られる。治癒の踊りは、共同体の結束を強める社会的な役割も果たす。"},{"name":"ムーダン","chapter":"c4-誘発法","sub":0,"subCount":15,"tags":["religion","culture","practice"],"birth":null,"death":null,"href":"https://note.com/search?q=from%3A%40varelser%20%E3%83%A0%E3%83%BC%E3%83%80%E3%83%B3&context=note&mode=search","article":false,"descRaw":"：韓国のシャーマン。多くは女性で、神降ろしの儀礼グッで神霊を招き、託宣や治癒、死者の送りを行う。神に選ばれた者は病や苦難を経て巫となる「神病」の伝承でも知られ、儒教社会のなかで民間信仰を担い、朝鮮半島の民間信仰と変性意識の結びつきを今に伝える。グッの儀礼は、地域の守護や豊作祈願など多様な目的で行われている。"},{"name":"ネイティブ・アメリカン・チャーチ","chapter":"c4-誘発法","sub":0,"subCount":15,"tags":["religion","substance","culture"],"birth":null,"death":null,"href":"https://note.com/search?q=from%3A%40varelser%20%E3%83%8D%E3%82%A4%E3%83%86%E3%82%A3%E3%83%96%E3%83%BB%E3%82%A2%E3%83%A1%E3%83%AA%E3%82%AB%E3%83%B3%E3%83%BB%E3%83%81%E3%83%A3%E3%83%BC%E3%83%81&context=note&mode=search","article":false,"descRaw":"：ペヨーテを聖餐とする先住民の宗教。1918年にオクラホマで法人化され、北米各地の先住民に広がった。1990年の最高裁判決で儀礼的使用が制限されたが、1994年の法改正で連邦法により保護された。薬物と宗教の自由をめぐる議論の中心にある伝統である。ペヨーテの儀礼は、歌と祈りによる夜通しの集会として行われる。"},{"name":"アン・シュルギン","chapter":"c4-誘発法","sub":0,"subCount":15,"tags":["substance","clinical"],"birth":1931,"death":2022,"href":"https://note.com/search?q=from%3A%40varelser%20%E3%82%A2%E3%83%B3%E3%83%BB%E3%82%B7%E3%83%A5%E3%83%AB%E3%82%AE%E3%83%B3&context=note&mode=search","article":false,"descRaw":"（米・1931–2022）：アメリカの著述家・セラピストで、化学者アレクサンダー・シュルギンの妻。夫とともに『PiHKAL』（1991）『TiHKAL』（1997）を共著し、200種以上の化合物の体験記録を残した。ユング心理学を背景に、MDMAや2C-Bが合法だった時代にサイケデリックを用いた療法を先駆的に実践し、治療への応用の道を開いた。"},{"name":"ハワード・ロットソフ","chapter":"c4-誘発法","sub":0,"subCount":15,"tags":["substance","clinical"],"birth":1943,"death":2010,"href":"https://note.com/search?q=from%3A%40varelser%20%E3%83%8F%E3%83%AF%E3%83%BC%E3%83%89%E3%83%BB%E3%83%AD%E3%83%83%E3%83%88%E3%82%BD%E3%83%95&context=note&mode=search","article":false,"descRaw":"（米・1943–2010）：アメリカの研究者・活動家。1962年、19歳のヘロイン依存者だったときにイボガインを摂取し、離脱症状なしに渇望が消えることを偶然発見した。以後、イボガインの依存症治療への応用を生涯かけて提唱し、1985年に米国特許を取得。ブウィティの聖なる植物を西洋医学の文脈に持ち込んだ人物である。イボガインの安全性をめぐる議論は今も続いている。"},{"name":"ウェイド・デイヴィス","chapter":"c4-誘発法","sub":0,"subCount":15,"tags":["culture","science","substance"],"birth":1953,"death":null,"href":"https://note.com/search?q=from%3A%40varelser%20%E3%82%A6%E3%82%A7%E3%82%A4%E3%83%89%E3%83%BB%E3%83%87%E3%82%A4%E3%83%B4%E3%82%A3%E3%82%B9&context=note&mode=search","article":false,"descRaw":"（加・1953–）：カナダの人類学者・民族植物学者で、ハーバード大学で博士号を取得。ハイチのゾンビをめぐる調査を描いた『The Serpent and the Rainbow』（1985）で知られ、テトロドトキシンの仮説を提示した。世界の先住民文化と精神活性植物の伝統的利用を記録し、シュルテスの学統を継ぐ民族植物学者である。"},{"name":"アンドリュー・ウェイル","chapter":"c4-誘発法","sub":0,"subCount":15,"tags":["substance","science","clinical"],"birth":1942,"death":null,"href":"https://note.com/search?q=from%3A%40varelser%20%E3%82%A2%E3%83%B3%E3%83%89%E3%83%AA%E3%83%A5%E3%83%BC%E3%83%BB%E3%82%A6%E3%82%A7%E3%82%A4%E3%83%AB&context=note&mode=search","article":false,"descRaw":"（米・1942–）：アメリカの医師・著述家で、統合医療の提唱者。ハーバード大学で民族植物学を学び、学生時代にリアリーやアルパートと出会った。『The Natural Mind』（1972）で薬物と高次の意識の関係を論じ、後にアリゾナ大学に統合医療センターを創設した。変性意識への関心が医療観の出発点となった。著書はベストセラーとなり、健康法の第一人者となった。"},{"name":"グラハム・ハンコック","chapter":"c4-誘発法","sub":0,"subCount":15,"tags":["culture","theory","substance"],"birth":1950,"death":null,"href":"https://note.com/search?q=from%3A%40varelser%20%E3%82%B0%E3%83%A9%E3%83%8F%E3%83%A0%E3%83%BB%E3%83%8F%E3%83%B3%E3%82%B3%E3%83%83%E3%82%AF&context=note&mode=search","article":false,"descRaw":"（英・1950–）：イギリスの作家・ジャーナリスト。『Supernatural』（2005）で、旧石器時代の洞窟壁画をルイス＝ウィリアムズの神経心理学的モデルで読み解き、トランス状態の幻視が人類の象徴的思考の起源に関わると論じた。自らアヤワスカやイボガを体験し、変性意識を人類史の鍵として語る。その主張は学界から疑似考古学と批判される一方、広い読者を集めた。"},{"name":"ウィリアム・リチャーズ","chapter":"c4-誘発法","sub":0,"subCount":15,"tags":["substance","clinical","religion"],"birth":1940,"death":null,"href":"https://note.com/search?q=from%3A%40varelser%20%E3%82%A6%E3%82%A3%E3%83%AA%E3%82%A2%E3%83%A0%E3%83%BB%E3%83%AA%E3%83%81%E3%83%A3%E3%83%BC%E3%82%BA&context=note&mode=search","article":false,"descRaw":"（米・1940–）：アメリカの臨床心理学者で、ジョンズ・ホプキンス大学サイケデリック研究センターの中心人物。1963年にゲッティンゲンでシロシビン研究を始め、1967〜77年にメリーランド精神医学研究センターでLSDなどの精神療法研究を行った。パーンケと神秘体験質問票を開発し、2015年の『Sacred Knowledge』で宗教体験としてのサイケデリック療法を論じた。"},{"name":"レスター・グリンスプーン","chapter":"c4-誘発法","sub":0,"subCount":15,"tags":["substance","policy","science"],"birth":1928,"death":2020,"href":"https://note.com/search?q=from%3A%40varelser%20%E3%83%AC%E3%82%B9%E3%82%BF%E3%83%BC%E3%83%BB%E3%82%B0%E3%83%AA%E3%83%B3%E3%82%B9%E3%83%97%E3%83%BC%E3%83%B3&context=note&mode=search","article":false,"descRaw":"（米・1928–2020）：アメリカの精神科医でハーバード大学医学部准教授。『Marihuana Reconsidered』（1971）で、大麻の危険性に関する通説を科学的に再検討し、医療大麻の議論の先駆けとなった。『Psychedelic Drugs Reconsidered』（1979）でも幻覚剤を論じ、薬物政策の改革を訴えた。意識変容物質の科学と政策を結んだ知識人である。"},{"name":"クリスチャン・レッチュ","chapter":"c4-誘発法","sub":0,"subCount":15,"tags":["substance","science","culture"],"birth":1957,"death":2022,"href":"https://note.com/search?q=from%3A%40varelser%20%E3%82%AF%E3%83%AA%E3%82%B9%E3%83%81%E3%83%A3%E3%83%B3%E3%83%BB%E3%83%AC%E3%83%83%E3%83%81%E3%83%A5&context=note&mode=search","article":false,"descRaw":"（独・1957–2022）：ドイツの人類学者・民族薬理学者。メキシコのラカンドン・マヤのあいだで3年間のフィールドワークを行い、呪文と治癒の研究で博士号を取得した。『The Encyclopedia of Psychoactive Plants』（1998）で400種以上の精神活性植物を網羅し、シャーマニズムにおける植物利用の世界的百科事典を築いた。"},{"name":"感覚遮断とREST（リリー／サドフィールド）","chapter":"c4-誘発法","sub":1,"subCount":15,"tags":["practice","science","clinical"],"birth":null,"death":null,"href":"https://note.com/search?q=from%3A%40varelser%20%E6%84%9F%E8%A6%9A%E9%81%AE%E6%96%AD%E3%81%A8REST%EF%BC%88%E3%83%AA%E3%83%AA%E3%83%BC%EF%BC%8F%E3%82%B5%E3%83%89%E3%83%95%E3%82%A3%E3%83%BC%E3%83%AB%E3%83%89%EF%BC%89&context=note&mode=search","article":false,"descRaw":"：ジョン・リリーが1954年に米・国立精神衛生研究所で開発した感覚遮断タンクに始まる技法。体温と等しい塩水に浮かび、光・音・重力感覚を最小化する。ピーター・サドフィールドらはこれを制限環境刺激法（REST）と名づけ、1970年代後半から治療応用を研究した。遮断下では幻覚・時間感覚の変容・深いリラックスが生じ、ストレス・疼痛・依存への応用が試みられた。感覚入力の減少が意識を変えることを示す代表的な非薬理的技法である。"},{"name":"ニューロフィードバックと意識制御","chapter":"c4-誘発法","sub":1,"subCount":15,"tags":["practice","science","tech"],"birth":null,"death":null,"href":"https://note.com/varelser/n/nde9d2acec75a","article":true,"descRaw":"：脳波などの脳活動をリアルタイムで本人に返し、意識状態を随意的・学習的に調整する技法。1960年代のジョー・カミヤによるアルファ波訓練に起源をもち、後にSMR波やシータ波の訓練、fMRIニューロフィードバックへ発展した。注意・不安・てんかん・ADHDなどへの応用が試みられ、瞑想状態の促進やパフォーマンス向上の研究もある。脳活動を「見る」ことで自己制御を学ぶ点で、意識の可塑性を示す技法である。"},{"name":"経頭蓋磁気刺激（TMS）と意識操作","chapter":"c4-誘発法","sub":1,"subCount":15,"tags":["science","tech"],"birth":null,"death":null,"href":"https://note.com/search?q=from%3A%40varelser%20%E7%B5%8C%E9%A0%AD%E8%93%8B%E7%A3%81%E6%B0%97%E5%88%BA%E6%BF%80%EF%BC%88TMS%EF%BC%89%E3%81%A8%E6%84%8F%E8%AD%98%E6%93%8D%E4%BD%9C&context=note&mode=search","article":false,"descRaw":"：経頭蓋磁気刺激。頭皮上のコイルから磁気パルスで局所の神経活動を活性化・抑制する非侵襲的脳刺激法で、1985年にアンソニー・バーカーらが開発した。運動野や前頭前野への刺激で知覚・認知・気分が変わり、側頭葉刺激による宗教的体験の誘発実験（「神のヘルメット」論争）でも知られる。うつ病治療では反復TMS（rTMS）が承認され、意識操作の実験的手段として、因果的な検証を可能にした点が重要である。"},{"name":"経頭蓋直流電気刺激（tDCS）と認知変容","chapter":"c4-誘発法","sub":1,"subCount":15,"tags":["science","tech","practice"],"birth":null,"death":null,"href":"https://note.com/search?q=from%3A%40varelser%20%E7%B5%8C%E9%A0%AD%E8%93%8B%E7%9B%B4%E6%B5%81%E9%9B%BB%E6%B0%97%E5%88%BA%E6%BF%80%EF%BC%88tDCS%EF%BC%89%E3%81%A8%E8%AA%8D%E7%9F%A5%E5%A4%89%E5%AE%B9&context=note&mode=search","article":false,"descRaw":"：経頭蓋直流電気刺激。頭皮に貼った電極から微弱な直流電流（通常1〜2mA）を流し、神経細胞の興奮性を変調する非侵襲的技法。ニッチェとパウルスが2000年に基礎を確立し、陽極刺激は興奮性を高め、陰極刺激は下げるとされる。運動学習・記憶・創造性・瞑想状態の促進などの探索的研究があり、家庭用機器の普及に伴い安全性と効果の議論も続く。TMSより簡便だが、効果は穏やかで個人差が大きい。"},{"name":"断食・睡眠剥奪と意識変容","chapter":"c4-誘発法","sub":1,"subCount":15,"tags":["practice","religion","science"],"birth":null,"death":null,"href":"https://note.com/search?q=from%3A%40varelser%20%E6%96%AD%E9%A3%9F%E3%83%BB%E7%9D%A1%E7%9C%A0%E5%89%A5%E5%A5%AA%E3%81%A8%E6%84%8F%E8%AD%98%E5%A4%89%E5%AE%B9&context=note&mode=search","article":false,"descRaw":"：代謝ストレスと感覚飢餓による変性意識の誘発。宗教的断食や修行では、血糖低下・ケトン体産生・脱水などが意識変容の生理学的基盤とされる。睡眠剥奪は24時間を超えると幻覚・時間感覚の歪み・思考の散漫を生み、断食と組み合わさることで儀礼的トランスを深める。いずれも身体への負荷が大きく、現代の研究では安全面の配慮が必須とされる。苦行と意識変容の結びつきを生理学から説明する視点である。"},{"name":"舞踏・ダンス・反復運動とトランス","chapter":"c4-誘発法","sub":1,"subCount":15,"tags":["practice","culture","religion"],"birth":null,"death":null,"href":"https://note.com/search?q=from%3A%40varelser%20%E8%88%9E%E8%B8%8F%E3%83%BB%E3%83%80%E3%83%B3%E3%82%B9%E3%83%BB%E5%8F%8D%E5%BE%A9%E9%81%8B%E5%8B%95%E3%81%A8%E3%83%88%E3%83%A9%E3%83%B3%E3%82%B9&context=note&mode=search","article":false,"descRaw":"：リズミカルな身体運動によるトランス誘導。スーフィーの旋回舞踊（セマー）、アフリカの儀礼的舞踏、ブラジルのカンドンブレ、現代のテクノダンスまで、反復運動・回転・跳躍が意識変容を促す。音楽と一体となった運動は呼吸・心拍・脳波を同調させ、集団の一体感を高める。ルージェの『音楽とトランス』（1985）は、音楽・舞踊・憑依の関係を体系化した古典である。身体運動そのものが変性意識の誘導法であることを示す。"},{"name":"VR/XRと意識変容（スレーターら）","chapter":"c4-誘発法","sub":1,"subCount":15,"tags":["tech","practice","clinical"],"birth":null,"death":null,"href":"https://note.com/search?q=from%3A%40varelser%20VR/XR%E3%81%A8%E6%84%8F%E8%AD%98%E5%A4%89%E5%AE%B9%EF%BC%88%E3%82%B9%E3%83%AC%E3%83%BC%E3%82%BF%E3%83%BC%E3%82%89%EF%BC%89&context=note&mode=search","article":false,"descRaw":"：バーチャルリアリティが身体所有感・自己感・共感を変容させる研究。メル・スレーターらは2009年に、VR空間で仮想の腕や全身を自分のものとして感じる錯覚を実証し、エールソンらの体外離脱実験（2007）と並んで身体性のVR研究の基盤となった。アバターの姿を変えることで共感や偏見が変わる「プロテウス効果」や、VR瞑想・VR心理療法の応用も進む。現実感そのものを操作できる点で、意識研究の実験室として注目される。"},{"name":"光刺激と意識変容（ドリームマシン／ストロボスコピック効果）","chapter":"c4-誘発法","sub":1,"subCount":15,"tags":["practice","science"],"birth":null,"death":null,"href":"https://note.com/search?q=from%3A%40varelser%20%E5%85%89%E5%88%BA%E6%BF%80%E3%81%A8%E6%84%8F%E8%AD%98%E5%A4%89%E5%AE%B9%EF%BC%88%E3%83%89%E3%83%AA%E3%83%BC%E3%83%A0%E3%83%9E%E3%82%B7%E3%83%B3%EF%BC%8F%E3%82%B9%E3%83%88%E3%83%AD%E3%83%9C%E3%82%B9%E3%82%B3%E3%83%94%E3%83%83%E3%82%AF%E5%8A%B9%E6%9E%9C%EF%BC%89&context=note&mode=search","article":false,"descRaw":"：点滅光による閉眼視覚パターン（フォスフェン）の誘発。ブリオン・ガイシンとイアン・ソマーヴィルが1960年前後に考案したドリームマシンは、回転する円筒のスリットから一定周期の光を閉じた瞼に投射し、幾何学的な幻視を生む装置である。ウィリアム・バロウズらビート世代に広がり、ストロボスコピック効果による視覚野の同調として科学的にも検証された。薬物を使わず光だけで意識を変える技法の代表例である。"},{"name":"F.M.アレクサンダー","chapter":"c4-誘発法","sub":2,"subCount":15,"tags":["practice","clinical"],"birth":1869,"death":1955,"href":"https://note.com/search?q=from%3A%40varelser%20F.M.%E3%82%A2%E3%83%AC%E3%82%AF%E3%82%B5%E3%83%B3%E3%83%80%E3%83%BC&context=note&mode=search","article":false,"descRaw":"（豪-英・1869–1955）：オーストラリア生まれの俳優・朗読家で、アレクサンダー・テクニークの創始者。声の不調をきっかけに、習慣的な緊張や姿勢の使い方を観察し、意図と動作のあいだに介入する再教育法を確立した。『The Use of the Self』（1932）で、反射的な自己使用を止めることで注意と身体感覚が変わると説いた。"},{"name":"モーシェ・フェルデンクライス","chapter":"c4-誘発法","sub":2,"subCount":15,"tags":["practice","clinical"],"birth":1904,"death":1984,"href":"https://note.com/search?q=from%3A%40varelser%20%E3%83%A2%E3%83%BC%E3%82%B7%E3%82%A7%E3%83%BB%E3%83%95%E3%82%A7%E3%83%AB%E3%83%87%E3%83%B3%E3%82%AF%E3%83%A9%E3%82%A4%E3%82%B9&context=note&mode=search","article":false,"descRaw":"（イスラエル・1904–1984）：ウクライナ生まれの物理学者・柔道家で、フェルデンクライス・メソッドの創始者。微細な運動の違いへの注意を通じて運動学習と神経可塑性を促し、身体の使い方を再学習させる方法を展開した。『Awareness Through Movement』（1972）などで、感覚への注意が自己像を変える技法を示した。その技法は、ダンサーや音楽家の訓練にも広く用いられている。"},{"name":"エルザ・ギンドラー","chapter":"c4-誘発法","sub":2,"subCount":15,"tags":["practice"],"birth":1885,"death":1961,"href":"https://note.com/search?q=from%3A%40varelser%20%E3%82%A8%E3%83%AB%E3%82%B6%E3%83%BB%E3%82%AE%E3%83%B3%E3%83%89%E3%83%A9%E3%83%BC&context=note&mode=search","article":false,"descRaw":"（独・1885–1961）：ドイツの身体感覚教育の先駆者。ベルリンで活動し、呼吸・重力・微細な感覚への注意を中心とした身体ワークを展開した。最小限の運動と感覚の観察によって意識の質が変わることを追究し、弟子のシャルロッテ・ゼルヴァーらを通じて多くの身体技法の源流となった。ナチス時代に活動を続けたことでも知られ、戦後の身体教育に影響を残した。"},{"name":"ゲルダ・アレクサンダー","chapter":"c4-誘発法","sub":2,"subCount":15,"tags":["practice"],"birth":1908,"death":1994,"href":"https://note.com/search?q=from%3A%40varelser%20%E3%82%B2%E3%83%AB%E3%83%80%E3%83%BB%E3%82%A2%E3%83%AC%E3%82%AF%E3%82%B5%E3%83%B3%E3%83%80%E3%83%BC&context=note&mode=search","article":false,"descRaw":"（独-デンマーク・1908–1994）：ドイツの身体教育家でオイュトニー（Eutony）の創始者。筋緊張や触覚、身体感覚の自己調整法を確立し、緊張の調整を通じて自己境界や空間感覚、注意の状態が変化することを実践的に示した。著書『Eutony』は、身体感覚の教育法の古典となった。デンマークで活動し、北欧の身体教育に大きな影響を与え、技法は世界に広まった。"},{"name":"イルゼ・ミッデンドルフ","chapter":"c4-誘発法","sub":2,"subCount":15,"tags":["practice"],"birth":1910,"death":2009,"href":"https://note.com/search?q=from%3A%40varelser%20%E3%82%A4%E3%83%AB%E3%82%BC%E3%83%BB%E3%83%9F%E3%83%83%E3%83%87%E3%83%B3%E3%83%89%E3%83%AB%E3%83%95&context=note&mode=search","article":false,"descRaw":"（独・1910–2009）：ドイツの呼吸教育家。「経験される呼吸（Der erfahrbare Atem）」を提唱し、呼吸を意志で操作するのではなく、感じられるままに経験する教育法を発展させた。呼吸を制御の対象ではなく経験の対象として扱うことで、微細な意識の変化を安定的に導く実践として知られる。呼吸教育の研究所を設立し、後進の育成にもあたった。"},{"name":"アイダ・ロルフ","chapter":"c4-誘発法","sub":2,"subCount":15,"tags":["practice","clinical"],"birth":1896,"death":1979,"href":"https://note.com/search?q=from%3A%40varelser%20%E3%82%A2%E3%82%A4%E3%83%80%E3%83%BB%E3%83%AD%E3%83%AB%E3%83%95&context=note&mode=search","article":false,"descRaw":"（米・1896–1979）：アメリカの生化学者でロルフィング（構造的統合）の創始者。筋膜や姿勢、重力との関係を再編する身体ワークを構築し、身体の構造変化が知覚や情動、自己感覚を変えると説いた。『Rolfing』（1977）で、深い身体の再編が意識の変容と連動することを臨床的に示した。生化学者としての経歴をもち、科学的な視点で身体を捉えた。"},{"name":"レナード・オア","chapter":"c4-誘発法","sub":2,"subCount":15,"tags":["practice","clinical"],"birth":1937,"death":2019,"href":"https://note.com/varelser/n/ne3df8ba1437c","article":true,"descRaw":"（米・1937–2019）：アメリカのリバーシング（Rebirthing）の提唱者。連続的な呼吸を用いた自己探究・情動解放法を1970年代に普及させ、呼吸を通じて記憶や情動、身体感覚を動員する実践を築いた。出生時の体験への回帰をめざすその手法は、呼吸による意識変容の系譜の一つとなった。リバーシングは、呼吸法ブームのなかで世界に広まった。"},{"name":"ウィム・ホフ","chapter":"c4-誘発法","sub":2,"subCount":15,"tags":["practice","science"],"birth":1959,"death":null,"href":"https://note.com/search?q=from%3A%40varelser%20%E3%82%A6%E3%82%A3%E3%83%A0%E3%83%BB%E3%83%9B%E3%83%95&context=note&mode=search","article":false,"descRaw":"（1959–）：オランダの「アイスマン」。呼吸法と寒冷暴露を組み合わせたウィム・ホフ・メソッドを提唱し、氷水への長時間の浸漬などで知られる。2014年の研究では、訓練によって自律神経系や免疫反応に意図的に影響を与えられることが示され、呼吸と意識の関係を科学的に問うきっかけとなった。ギネス記録にも認定された氷水の耐久記録で知られる。"},{"name":"パタンジャリ","chapter":"c4-誘発法","sub":3,"subCount":15,"tags":["practice","theory","religion"],"birth":null,"death":null,"href":"https://note.com/search?q=from%3A%40varelser%20%E3%83%91%E3%82%BF%E3%83%B3%E3%82%B8%E3%83%A3%E3%83%AA&context=note&mode=search","article":false,"descRaw":"：『ヨーガ・スートラ』の著者とされる古代インドの思想家。紀元後2〜4世紀頃の人物と推定される。心の働きの止滅をヨーガと定義し、八支則（ヤマ・ニヤマ・坐法・呼吸法・制感・集中・瞑想・三昧）を体系化した。意識変容の体系的技法の古典的源泉であり、集中から三昧へ至る段階的な意識の深化の枠組みは、後世のヨーガと瞑想思想の規範となった。"},{"name":"ナーガールジュナ（龍樹）","chapter":"c4-誘発法","sub":3,"subCount":15,"tags":["theory","religion"],"birth":150,"death":250,"href":"https://note.com/search?q=from%3A%40varelser%20%E3%83%8A%E3%83%BC%E3%82%AC%E3%83%BC%E3%83%AB%E3%82%B8%E3%83%A5%E3%83%8A&context=note&mode=search","article":false,"descRaw":"（150–250）：150–250年頃のインドの仏教哲学者。中観派の祖で、主著『中論』で空（シューニャター）の哲学を展開した。あらゆる存在は固定的な実体をもたず縁起によって成り立つと説き、概念的固定を溶解する論理を提示した。自我や対象への執着をほどくその思考は、瞑想における意識の変容と深く結びつき、大乗仏教の哲学的核心となった。"},{"name":"パドマサンバヴァ","chapter":"c4-誘発法","sub":3,"subCount":15,"tags":["religion","practice"],"birth":null,"death":null,"href":"https://note.com/search?q=from%3A%40varelser%20%E3%83%91%E3%83%89%E3%83%9E%E3%82%B5%E3%83%B3%E3%83%90%E3%83%B4%E3%82%A1&context=note&mode=search","article":false,"descRaw":"：8世紀のインドの密教僧で、チベット密教の祖とされる。チベットに密教を伝え、ニンマ派（古派）の源流となった。儀礼・観想・マントラによる意識変容の伝統を確立し、伏蔵（テルマ）の伝承でも知られる。蓮華生大士（グル・リンポチェ）として崇敬され、チベット仏教の瞑想と儀礼の体系に決定的な影響を与えた。年代の詳細は伝承による。"},{"name":"道元","chapter":"c4-誘発法","sub":3,"subCount":15,"tags":["practice","religion","theory"],"birth":1200,"death":1253,"href":"https://note.com/search?q=from%3A%40varelser%20%E9%81%93%E5%85%83&context=note&mode=search","article":false,"descRaw":"（1200–1253）：1200–1253。日本の禅僧で曹洞宗の開祖。主著『正法眼蔵』で「只管打坐（ひたすら坐ること）」を説き、修行と悟りを切り離さない立場を示した。身心脱落の境地、自己認識と変性意識の仏教的枠組みを提示した。1244年に越前（福井）に永平寺を開き、日本の禅の実践と思想の基盤を築いた。宋に渡って学んだ体験がその思想の背景にある。"},{"name":"白隠慧鶴","chapter":"c4-誘発法","sub":3,"subCount":15,"tags":["practice","religion","clinical"],"birth":1686,"death":1769,"href":"https://note.com/search?q=from%3A%40varelser%20%E7%99%BD%E9%9A%A0%E6%85%A7%E9%B6%B4&context=note&mode=search","article":false,"descRaw":"（日・1686–1769）：1686–1769。臨済禅の中興の祖。衰退していた臨済宗を再興し、公案を用いた見性（本性を見抜く体験）への体系的指導を確立した。内観法（軟酥の法）による心身調整を説き、坐禅による身体の不調を治す方法も伝えた。著書『夜船閑話』でも内観法を説いている。その教えは日本の禅の実践様式を決定づけ、近代以降の禅の普及の基礎となった。"},{"name":"空海","chapter":"c4-誘発法","sub":3,"subCount":15,"tags":["religion","practice","art"],"birth":774,"death":835,"href":"https://note.com/search?q=from%3A%40varelser%20%E7%A9%BA%E6%B5%B7&context=note&mode=search","article":false,"descRaw":"（日・774–835）：774–835。真言密教の体系化者で、真言宗の開祖。唐に渡って密教を学び、帰国後に高野山（816年開創）を拠点とした。三密加持（身・口・意の修行）による即身成仏を説き、身体的実践を通じた意識の根本的変容を体系化した。曼荼羅による宇宙的意識の視覚化や、文字・音声の思想でも知られ、日本の宗教文化に広範な影響を与えた。"},{"name":"鈴木大拙","chapter":"c4-誘発法","sub":3,"subCount":15,"tags":["religion","theory","culture"],"birth":1870,"death":1966,"href":"https://note.com/search?q=from%3A%40varelser%20%E9%88%B4%E6%9C%A8%E5%A4%A7%E6%8B%99&context=note&mode=search","article":false,"descRaw":"（1870–1966）：1870–1966。日本の仏教学者。『禅と日本文化』（1938）などで禅を西洋に紹介し、エックハルトとの比較を通じて東洋の覚醒体験を西洋思想に接続した。英語による著作と講演で、禅の「悟り」や無の思想を欧米の知識人に伝え、心理学・哲学・芸術への影響も大きい。晩年まで著述と講演を続け、東西の意識論の橋渡し役となった。"},{"name":"鈴木俊隆","chapter":"c4-誘発法","sub":3,"subCount":15,"tags":["practice","religion"],"birth":1904,"death":1971,"href":"https://note.com/search?q=from%3A%40varelser%20%E9%88%B4%E6%9C%A8%E4%BF%8A%E9%9A%86&context=note&mode=search","article":false,"descRaw":"（日-米・1904–1971）：1904–1971。日本の曹洞宗の僧侶。1959年に渡米し、1962年にサンフランシスコ禅センターを創設した。『禅マインド ビギナーズ・マインド』（1970）で坐禅の直接的実践を説き、カウンターカルチャー世代に禅を伝えた。「初心」の姿勢と只管打坐の実践を重んじ、アメリカにおける禅の定着に決定的な役割を果たした。弟子たちによりその教えは広く継承された。"},{"name":"ティック・ナット・ハン","chapter":"c4-誘発法","sub":3,"subCount":15,"tags":["practice","religion"],"birth":1926,"death":2022,"href":"https://note.com/search?q=from%3A%40varelser%20%E3%83%86%E3%82%A3%E3%83%83%E3%82%AF%E3%83%BB%E3%83%8A%E3%83%83%E3%83%88%E3%83%BB%E3%83%8F%E3%83%B3&context=note&mode=search","article":false,"descRaw":"（Thich Nhat Hanh・1926–2022）：1926–2022。ベトナムの禅僧。マインドフルネスを日常の呼吸・歩行・食事に結びつける実践を広め、平和運動と結びつけた「エンゲージド・ブディズム」の代表者。1982年にフランスにプラムヴィレッジを開き、世界中から修行者を集めた。著書『Peace Is Every Step』（1991）などで知られ、瞑想を宗教の枠を超えた日常の気づきの実践として世界に広めた。"},{"name":"ラム・ダス","chapter":"c4-誘発法","sub":3,"subCount":15,"tags":["practice","religion","substance"],"birth":1931,"death":2019,"href":"https://note.com/varelser/n/nd3a3f1a383f3","article":true,"descRaw":"（Ram Dass・1931–2019）：1931–2019。アメリカの霊的教師。本名リチャード・アルパート。ハーバード大学の心理学者としてティモシー・リアリーとともにサイケデリック研究を行い、1963年に大学を去った。インドでニーム・カロリ・ババに師事してラム・ダスとなり、著書『ビー・ヒア・ナウ』（1971）で西洋知識人のサイケデリックから瞑想への転換を象徴した。慈悲と奉仕の実践を説き続けた。"},{"name":"チョギャム・トゥルンパ","chapter":"c4-誘発法","sub":3,"subCount":15,"tags":["religion","practice"],"birth":1939,"death":1987,"href":"https://note.com/search?q=from%3A%40varelser%20%E3%83%81%E3%83%A7%E3%82%AE%E3%83%A3%E3%83%A0%E3%83%BB%E3%83%88%E3%82%A5%E3%83%AB%E3%83%B3%E3%83%91&context=note&mode=search","article":false,"descRaw":"（Chögyam Trungpa・1939–1987・チベット-米）：1939–1987。チベット仏教のラマ。1959年にチベットを脱出して西洋に渡り、チベット仏教の主要な導入者となった。1974年にコロラド州ボルダーにナーロパ大学（当初ナーロパ研究所）を創設し、瞑想と学問・芸術を結ぶ教育を試みた。「狂慧（クレイジー・ウィズダム）」の概念や『Cutting Through Spiritual Materialism』（1973）で知られ、西洋の仏教受容に大きな影響を与えた。"},{"name":"マハリシ・マヘーシュ・ヨーギー","chapter":"c4-誘発法","sub":3,"subCount":15,"tags":["practice","religion","theory"],"birth":1918,"death":2008,"href":"https://note.com/search?q=from%3A%40varelser%20%E3%83%9E%E3%83%8F%E3%83%AA%E3%82%B7%E3%83%BB%E3%83%9E%E3%83%98%E3%83%BC%E3%82%B7%E3%83%A5%E3%83%BB%E3%83%A8%E3%83%BC%E3%82%AE%E3%83%BC&context=note&mode=search","article":false,"descRaw":"（印・1918–2008）：1918–2008。インドの導師で超越瞑想（TM）の創始者。1950年代末に超越瞑想の運動を始め、マントラを用いる簡便な瞑想法を世界に広めた。意識の七段階モデルを説き、1968年にビートルズがインド・リシケシュのアシュラムを訪れたことで瞑想は大衆文化に浸透した。TMは科学的研究の対象ともなり、瞑想の大衆化を牽引した。"},{"name":"ラマナ・マハルシ","chapter":"c4-誘発法","sub":3,"subCount":15,"tags":["practice","religion"],"birth":1879,"death":1950,"href":"https://note.com/search?q=from%3A%40varelser%20%E3%83%A9%E3%83%9E%E3%83%8A%E3%83%BB%E3%83%9E%E3%83%8F%E3%83%AB%E3%82%B7&context=note&mode=search","article":false,"descRaw":"（印・1879–1950）：1879–1950。インドの聖者。16歳のとき死の体験を経て自我の探求に目覚め、南インドのアルナーチャラ山に隠棲した。「私は誰か？（Who am I?）」という自己探究（アートマ・ヴィチャーラ）を説き、思考の源へ遡ることで自我を超える道を示した。教義や儀礼によらない直接体験の人として、東西の求道者に恒常的覚醒のモデルを与えた。"},{"name":"シュリ・オーロビンド","chapter":"c4-誘発法","sub":3,"subCount":15,"tags":["theory","religion","practice"],"birth":1872,"death":1950,"href":"https://note.com/search?q=from%3A%40varelser%20%E3%82%B7%E3%83%A5%E3%83%AA%E3%83%BB%E3%82%AA%E3%83%BC%E3%83%AD%E3%83%93%E3%83%B3%E3%83%89&context=note&mode=search","article":false,"descRaw":"（印・1872–1950）：1872–1950。インドの思想家・ヨーガ行者。インテグラル・ヨーガを説き、意識の進化的上昇と超心（スーパーマインド）への到達を説いた。1926年にポンディシェリにアシュラムを開き、主著『The Life Divine』で宇宙と意識の進化論を展開した。個人の覚醒を人類全体の進化と結ぶ視点は、ケン・ウィルバーら後世の統合的思想に大きな影響を与えた。"},{"name":"ジッドゥ・クリシュナムルティ","chapter":"c4-誘発法","sub":3,"subCount":15,"tags":["theory","practice"],"birth":1895,"death":1986,"href":"https://note.com/search?q=from%3A%40varelser%20%E3%82%B8%E3%83%83%E3%83%89%E3%82%A5%E3%83%BB%E3%82%AF%E3%83%AA%E3%82%B7%E3%83%A5%E3%83%8A%E3%83%A0%E3%83%AB%E3%83%86%E3%82%A3&context=note&mode=search","article":false,"descRaw":"（印・1895–1986）：1895–1986。インド生まれの思想家。少年期に神智学協会に「世界教師」として育てられたが、1929年に東方の星教団を解散し、「真理は道なき大地」と宣言して組織と決別した。「選択なき気づき」を説き、組織・権威・方法を一切拒否した。思考の観察そのものによる自我の超越を説くその姿勢は、瞑想や心理学の議論にも影響を与え続けた。"},{"name":"夢ヨーガ","chapter":"c4-誘発法","sub":3,"subCount":15,"tags":["practice","dream","religion"],"birth":null,"death":null,"href":"https://note.com/search?q=from%3A%40varelser%20%E5%A4%A2%E3%83%A8%E3%83%BC%E3%82%AC&context=note&mode=search","article":false,"descRaw":"：チベット仏教の夢の修行（ミラム）。ナーローパの六法の一つで、夢の中で覚醒（明晰夢）を保ち、夢と現実の区別を超えて一切の経験の幻性を悟ることを目指す。睡眠中の意識を訓練する体系であり、明晰夢の宗教的展開として知られる。死の過程や中有（バルド）の修行とも結びつき、意識の連続性を保つ実践として伝えられた。"},{"name":"クンダリーニ","chapter":"c4-誘発法","sub":3,"subCount":15,"tags":["practice","religion"],"birth":null,"death":null,"href":"https://note.com/search?q=from%3A%40varelser%20%E3%82%AF%E3%83%B3%E3%83%80%E3%83%AA%E3%83%BC%E3%83%8B&context=note&mode=search","article":false,"descRaw":"：脊柱基底に眠るとされる蛇のエネルギー。呼吸法・瞑想・ハタ・ヨーガの実践で覚醒させ、脊柱に沿って頭頂のチャクラへ上昇させることで解脱に至るとされる。上昇の過程では身体感覚の変化や強烈な体験が伴うと伝えられ、インドのヨーガとタントラの中心概念である。近代では心理学やニューエイジの文脈でも広く語られるようになった。"},{"name":"タントラ","chapter":"c4-誘発法","sub":3,"subCount":15,"tags":["practice","religion"],"birth":null,"death":null,"href":"https://note.com/search?q=from%3A%40varelser%20%E3%82%BF%E3%83%B3%E3%83%88%E3%83%A9&context=note&mode=search","article":false,"descRaw":"：1千年紀半ばに南アジアで興った密教的実践体系。マントラ・曼荼羅・本尊観想・身体技法などで身体と意識を変容させ、日常の経験そのものを悟りへの道とする。ヒンドゥー教と仏教の双方に展開し、仏教では金剛乗と呼ばれる。性や死などの禁忌をあえて用いる実践も含み、意識変容の技法として後世のヨーガ・瞑想・芸術に広範な影響を与えた。"},{"name":"ヴィパッサナー","chapter":"c4-誘発法","sub":3,"subCount":15,"tags":["practice","religion"],"birth":null,"death":null,"href":"https://note.com/search?q=from%3A%40varelser%20%E3%83%B4%E3%82%A3%E3%83%91%E3%83%83%E3%82%B5%E3%83%8A%E3%83%BC&context=note&mode=search","article":false,"descRaw":"：上座部仏教の観察瞑想。身体感覚や心の動きをあるがままに観察し、無常・苦・無我を直観することを目指す。観察の対象は呼吸・身体感覚・心の動きで、サティ（気づき）を育てる実践とされる。S・N・ゴエンカらが10日間の沈黙コースで世界に広め、宗教色を抑えた実践として普及した。マインドフルネス瞑想の源流の一つであり、現代の心理療法やストレス低減法（MBSR）にも影響を与えた。"},{"name":"老子","chapter":"c4-誘発法","sub":4,"subCount":15,"tags":["theory","religion","practice"],"birth":null,"death":null,"href":"https://note.com/search?q=from%3A%40varelser%20%E8%80%81%E5%AD%90&context=note&mode=search","article":false,"descRaw":"：『道徳経』の著者とされる古代中国の思想家。無為自然・玄・虚の思想を説き、作為的な意志や概念的区分を手放すことで、流動的で非作為的な気づきへ移る道を示した。道（タオ）と一体になる境地は、自己中心的な意識を超えた変性意識の基礎モデルとして、後世の道教・禅・瞑想思想の源流となった。生没年は不詳で、実在をめぐる議論も続いている。"},{"name":"荘子","chapter":"c4-誘発法","sub":4,"subCount":15,"tags":["theory","dream","religion"],"birth":-369,"death":-286,"href":"https://note.com/search?q=from%3A%40varelser%20%E8%8D%98%E5%AD%90&context=note&mode=search","article":false,"descRaw":"（前369–前286）：『荘子』の著者とされる古代中国の思想家。胡蝶の夢、坐忘、心斎などの説話で、夢と覚醒の境界を相対化し、自己同一性の流動化を描いた。概念的分節を外れた自由な意識、万物と斉しくなる境地を説き、変性意識の哲学的記述として最重要の一人である。老子と並ぶ道家思想の中心人物で、後世の禅や芸術思想にも深い影響を与えた。"},{"name":"葛洪","chapter":"c4-誘発法","sub":4,"subCount":15,"tags":["practice","religion","substance"],"birth":283,"death":343,"href":"https://note.com/search?q=from%3A%40varelser%20%E8%91%9B%E6%B4%AA&context=note&mode=search","article":false,"descRaw":"（Ge Hong・283–343・中）：283–343。中国・晋代の道士・思想家。主著『抱朴子』で錬丹術・養生・仙道・呪術・呼吸法を総合した。外丹（鉱物による不老不死薬の錬成）と内丹の萌芽、服気・導引などの身体技法を体系化し、薬物・呼吸・修練・長寿法を通じた身体＝意識変容の古典的体系を作った。神仙思想と錬丹術を結びつけて不老不死への道を論じ、道教の理論的基礎を築いた人物の一人である。"},{"name":"陶弘景","chapter":"c4-誘発法","sub":4,"subCount":15,"tags":["practice","religion","substance"],"birth":456,"death":536,"href":"https://note.com/search?q=from%3A%40varelser%20%E9%99%B6%E5%BC%98%E6%99%AF&context=note&mode=search","article":false,"descRaw":"（Tao Hongjing・456–536・中）：456–536。中国・南北朝時代の道教思想家・医家。上清派の啓示を整理した『真誥』を編纂し、茅山を開いて上清派を大成させた。薬学書『本草経集注』も著した。視覚化・内観・啓示・薬草知を組み合わせ、瞑想による神真との交信と身体養生を結びつけた。宗教体験と身体技法を媒介する道教瞑想の古典的モデルを残した。"},{"name":"陳摶","chapter":"c4-誘発法","sub":4,"subCount":15,"tags":["practice","dream","religion"],"birth":871,"death":989,"href":"https://note.com/search?q=from%3A%40varelser%20%E9%99%B3%E6%91%B6&context=note&mode=search","article":false,"descRaw":"（Chen Tuan・871–989・中）：871–989。中国・五代から北宋初の道士。睡功（睡眠を用いる修行）・導引・易学・内観法で知られる。華山に隠棲し、眠りと覚醒の境界、静坐と呼吸を用いる半覚醒的な意識訓練の系譜に位置づく。睡功はのちの内丹修行にも受け継がれ、眠りを活用する修行法の代表とされた。後世の道教文献や伝承にしばしば登場し、呂洞賓らと並ぶ内丹・仙道の象徴的人物として語り継がれた。"},{"name":"呂洞賓","chapter":"c4-誘発法","sub":4,"subCount":15,"tags":["religion","practice","theory"],"birth":null,"death":null,"href":"https://note.com/search?q=from%3A%40varelser%20%E5%91%82%E6%B4%9E%E8%B3%93&context=note&mode=search","article":false,"descRaw":"（Lü Dongbin・中）：八仙の一人として知られる内丹伝統の象徴的人物。唐代の道士と伝えられ、内丹・心性修養・剣の象徴を伴う修行譜系の核となった。呂祖文献群と呼ばれる多くのテクストがその名に帰せられ、精・気・神の変容を通じた段階的な意識変容の人格化された姿として信仰と実践の両面で広がった。実在の年代は不詳で、伝説と修行法が重なって伝えられている。"},{"name":"張伯端","chapter":"c4-誘発法","sub":4,"subCount":15,"tags":["practice","theory","religion"],"birth":987,"death":1082,"href":"https://note.com/search?q=from%3A%40varelser%20%E5%BC%B5%E4%BC%AF%E7%AB%AF&context=note&mode=search","article":false,"descRaw":"（Zhang Boduan・987–1082・中）：987–1082。中国・北宋の内丹思想家。南宗内丹の代表的テクスト『悟真篇』を著し、身体内部の錬成過程を詩的・理論的に定式化した。精・気・神を錬る内丹の段階を、意識変容と覚醒のプロセスとして描き、後世の内丹実践の規範となった。外丹から内丹への転換を象徴する人物で、道教の身体＝意識変容論の古典的到達点を示した。"},{"name":"王重陽","chapter":"c4-誘発法","sub":4,"subCount":15,"tags":["religion","practice"],"birth":1113,"death":1170,"href":"https://note.com/search?q=from%3A%40varelser%20%E7%8E%8B%E9%87%8D%E9%99%BD&context=note&mode=search","article":false,"descRaw":"（Wang Chongyang・1113–1170・中）：1113–1170。中国・金代の道士で全真教の祖。12世紀後半に全真教を開き、道教・仏教・儒教を統合した実践共同体を創設した。禁欲・静坐・気の練習・宗教共同体を結びつけ、日常生活の規律のなかで意識を変える道を制度化した。全真教はのちに中国道教の最大宗派の一つとなり、その修行体系は内丹と禅的要素を融合させたものとして広がった。"},{"name":"MBSR—マインドフルネスストレス低減法（カバットジン, 1979〜）","chapter":"c4-誘発法","sub":5,"subCount":15,"tags":["clinical","practice","science"],"birth":null,"death":null,"href":"https://note.com/search?q=from%3A%40varelser%20MBSR%E2%80%94%E3%83%9E%E3%82%A4%E3%83%B3%E3%83%89%E3%83%95%E3%83%AB%E3%83%8D%E3%82%B9%E3%82%B9%E3%83%88%E3%83%AC%E3%82%B9%E4%BD%8E%E6%B8%9B%E6%B3%95%EF%BC%88%E3%82%AB%E3%83%90%E3%83%83%E3%83%88%E3%82%B8%E3%83%B3%2C%201979%E3%80%9C%EF%BC%89&context=note&mode=search","article":false,"descRaw":"：ジョン・カバットジンが1979年にマサチューセッツ大学医学部で創始した8週間のマインドフルネス・ストレス低減プログラム。慢性疼痛患者を対象に、ボディスキャン・座位瞑想・ヨガを組み合わせ、痛みやストレスとの関わり方を変える訓練を行う。1982年の報告では慢性疼痛患者51名の65%で痛みが3分の1以上軽減し、医療における瞑想導入の先駆けとなった。"},{"name":"瞑想と脳の可塑性（デイヴィッドソン & ルッツら）","chapter":"c4-誘発法","sub":5,"subCount":15,"tags":["science","practice"],"birth":null,"death":null,"href":"https://note.com/search?q=from%3A%40varelser%20%E7%9E%91%E6%83%B3%E3%81%A8%E8%84%B3%E3%81%AE%E5%8F%AF%E5%A1%91%E6%80%A7%EF%BC%88%E3%83%87%E3%82%A4%E3%83%B4%E3%82%A3%E3%83%83%E3%83%89%E3%82%BD%E3%83%B3%20%26%20%E3%83%AB%E3%83%83%E3%83%84%E3%82%89%EF%BC%89&context=note&mode=search","article":false,"descRaw":"：ウィスコンシン大学のリチャード・デイヴィッドソンらによる長期瞑想者の脳研究。チベット仏教の熟練瞑想者を対象に、慈悲の瞑想中に高振幅のガンマ波同期が生じることを2004年に報告した。長期の瞑想訓練が注意・感情調整に関わる脳構造と機能を持続的に変容させる神経可塑性の証拠を示し、瞑想の神経科学の基盤を築いた。"},{"name":"Altered Traits（ゴールマン & デイヴィッドソン, 2017）","chapter":"c4-誘発法","sub":5,"subCount":15,"tags":["science","practice"],"birth":null,"death":null,"href":"https://note.com/search?q=from%3A%40varelser%20Altered%20Traits%EF%BC%88%E3%82%B4%E3%83%BC%E3%83%AB%E3%83%9E%E3%83%B3%20%26%20%E3%83%87%E3%82%A4%E3%83%B4%E3%82%A3%E3%83%83%E3%83%89%E3%82%BD%E3%83%B3%2C%202017%EF%BC%89&context=note&mode=search","article":false,"descRaw":"：ダニエル・ゴールマンとリチャード・デイヴィッドソンによる2017年の著書。数十年にわたる瞑想研究のエビデンスを批判的に精査し、一過性の「状態」変化と、長期訓練による持続的な「特性」変化を区別した。注意・慈悲・自己感の変容には長期の実践が必要だと結論づけ、瞑想ブームへの科学的な注釈となった。著者らは瞑想の効果を過大評価する風潮にも警鐘を鳴らしている。"},{"name":"シャマタ・プロジェクト（サロンら, 2007〜）","chapter":"c4-誘発法","sub":5,"subCount":15,"tags":["science","practice"],"birth":null,"death":null,"href":"https://note.com/search?q=from%3A%40varelser%20%E3%82%B7%E3%83%A3%E3%83%9E%E3%82%BF%E3%83%BB%E3%83%97%E3%83%AD%E3%82%B8%E3%82%A7%E3%82%AF%E3%83%88%EF%BC%88%E3%82%B5%E3%83%AD%E3%83%B3%E3%82%89%2C%202007%E3%80%9C%EF%BC%89&context=note&mode=search","article":false,"descRaw":"：クリフォード・サロンらが主導し、2007年にコロラド州シャンバラ・マウンテン・センターで実施された3か月間の集中瞑想リトリートの縦断研究。参加者60名を対象に注意・感情調整・知覚弁別を測定し、テロメラーゼ活性が対照群より約3分の1高いことなどを報告した（ジェイコブズら、2011年）。集中瞑想の効果を多面的に検証した大規模プロジェクトである。"},{"name":"マインドフルネスの認知神経科学（タン, ホルツェルら, 2015）","chapter":"c4-誘発法","sub":5,"subCount":15,"tags":["science","practice","theory"],"birth":null,"death":null,"href":"https://note.com/search?q=from%3A%40varelser%20%E3%83%9E%E3%82%A4%E3%83%B3%E3%83%89%E3%83%95%E3%83%AB%E3%83%8D%E3%82%B9%E3%81%AE%E8%AA%8D%E7%9F%A5%E7%A5%9E%E7%B5%8C%E7%A7%91%E5%AD%A6%EF%BC%88%E3%82%BF%E3%83%B3%2C%20%E3%83%9B%E3%83%AB%E3%83%84%E3%82%A7%E3%83%AB%E3%82%89%2C%202015%EF%BC%89&context=note&mode=search","article":false,"descRaw":"：イー・ユアン・タン、サラ・ホルツェルらによる2015年の総説（『Nature Reviews Neuroscience』）。マインドフルネス瞑想の神経メカニズムを、注意制御・身体感覚への気づき・感情調整・自己観の変化の4要素に整理した。長期実践による前頭前野・島・扁桃体の構造変化を統合し、瞑想の認知神経科学の枠組みを提示した。 出典：Tang et al. (2015)『Nature Reviews Neuroscience』 DOI: 10.1038/nrn3916"},{"name":"フロー理論（チクセントミハイ, 1975〜）","chapter":"c4-誘発法","sub":5,"subCount":15,"tags":["theory","science","practice"],"birth":null,"death":null,"href":"https://note.com/search?q=from%3A%40varelser%20%E3%83%95%E3%83%AD%E3%83%BC%E7%90%86%E8%AB%96%EF%BC%88%E3%83%81%E3%82%AF%E3%82%BB%E3%83%B3%E3%83%88%E3%83%9F%E3%83%8F%E3%82%A4%2C%201975%E3%80%9C%EF%BC%89&context=note&mode=search","article":false,"descRaw":"：ハンガリー出身の心理学者ミハイ・チクセントミハイが1975年の著書『Beyond Boredom and Anxiety』で提唱した理論。技能と課題の難易度が釣り合うとき、時間感覚の喪失や自我意識の希薄化を伴う没入状態「フロー」が生じるとした。芸術家・登山家・棋士らへの面接調査に基づき、最適体験の構造を定式化した。変性意識研究とも接点を持つ。"},{"name":"瞑想の暗い夜（ウィロビー・ブリトン）","chapter":"c4-誘発法","sub":5,"subCount":15,"tags":["clinical","practice","science"],"birth":null,"death":null,"href":"https://note.com/search?q=from%3A%40varelser%20%E7%9E%91%E6%83%B3%E3%81%AE%E6%9A%97%E3%81%84%E5%A4%9C%EF%BC%88%E3%82%A6%E3%82%A3%E3%83%AD%E3%83%93%E3%83%BC%E3%83%BB%E3%83%96%E3%83%AA%E3%83%88%E3%83%B3%EF%BC%89&context=note&mode=search","article":false,"descRaw":"：ブラウン大学のウィロビー・ブリトンらによる瞑想の有害事象の研究。集中的な瞑想実践が不安・解離・知覚変容などの困難な体験（「暗い夜」）を引き起こす場合があることを系統的に調査し、2017年の論文で60名以上の事例を報告した。「瞑想は常に有益」という前提を問い直し、安全な実践と支援体制の議論を促した。調査は「Varieties of Contemplative Experience」プロジェクトとして進められた。 出典：Lindahl et al. (2017)『PLOS ONE』 DOI: 10.1371/journal.pone.0176239"},{"name":"デフォルトモードと瞑想（ブルーワーら, 2011）","chapter":"c4-誘発法","sub":5,"subCount":15,"tags":["science","practice"],"birth":null,"death":null,"href":"https://note.com/search?q=from%3A%40varelser%20%E3%83%87%E3%83%95%E3%82%A9%E3%83%AB%E3%83%88%E3%83%A2%E3%83%BC%E3%83%89%E3%81%A8%E7%9E%91%E6%83%B3%EF%BC%88%E3%83%96%E3%83%AB%E3%83%BC%E3%83%AF%E3%83%BC%E3%82%89%2C%202011%EF%BC%89&context=note&mode=search","article":false,"descRaw":"：イェール大学のジャドソン・ブルーワーらによる2011年のfMRI研究（『PNAS』）。経験豊富な瞑想者では、集中・慈悲・開放的気づきのいずれの瞑想中も、デフォルトモード・ネットワーク（内側前頭前野・後部帯状回）の活動が低下していた。自己参照的思考の低減の神経基盤を示し、瞑想が「さまよう心」を静める仕組みを実証した。 出典：Brewer et al. (2011)『Proceedings of the National Academy of Sciences』 DOI: 10.1073/pnas.1112029108"},{"name":"集中瞑想 vs 開放モニタリングの神経科学的区別（ルッツら, 2008）","chapter":"c4-誘発法","sub":5,"subCount":15,"tags":["science","practice"],"birth":null,"death":null,"href":"https://note.com/search?q=from%3A%40varelser%20%E9%9B%86%E4%B8%AD%E7%9E%91%E6%83%B3%20vs%20%E9%96%8B%E6%94%BE%E3%83%A2%E3%83%8B%E3%82%BF%E3%83%AA%E3%83%B3%E3%82%B0%E3%81%AE%E7%A5%9E%E7%B5%8C%E7%A7%91%E5%AD%A6%E7%9A%84%E5%8C%BA%E5%88%A5%EF%BC%88%E3%83%AB%E3%83%83%E3%83%84%E3%82%89%2C%202008%EF%BC%89&context=note&mode=search","article":false,"descRaw":"：アントワーヌ・ルッツらによる2008年の総説（『Trends in Cognitive Sciences』）。瞑想を、対象に注意を絞る焦点的注意（FA）と、浮かぶ体験を判断なく見守る開放モニタリング（OM）に区別し、それぞれ異なる神経活動パターンを示した。注意制御と受容的気づきの二重モデルとして、瞑想研究の分類枠組みを提示した。 出典：Lutz et al. (2008)『Trends in Cognitive Sciences』 DOI: 10.1016/j.tics.2008.01.005"},{"name":"非二元瞑想（Nondual Awareness）研究","chapter":"c4-誘発法","sub":5,"subCount":15,"tags":["science","practice","religion"],"birth":null,"death":null,"href":"https://note.com/search?q=from%3A%40varelser%20%E9%9D%9E%E4%BA%8C%E5%85%83%E7%9E%91%E6%83%B3%EF%BC%88Nondual%20Awareness%EF%BC%89%E7%A0%94%E7%A9%B6&context=note&mode=search","article":false,"descRaw":"：主体と客体の区別が溶解した覚醒状態を対象とする研究。ゾクチェンのリクパやアドヴァイタ・ヴェーダーンタの非二元的気づきなど、伝統的な瞑想概念と現代神経科学の対話を試みる。自己感の消失や境界の融解を神経現象学的に記述し、デフォルトモードの抑制や自己参照処理の変化との関連が検討されている。覚醒時の自己感の神経基盤を問う点で、意識のハードプロブレムとも接続する。"},{"name":"マントラと反復音声の神経効果","chapter":"c4-誘発法","sub":5,"subCount":15,"tags":["science","practice","religion"],"birth":null,"death":null,"href":"https://note.com/search?q=from%3A%40varelser%20%E3%83%9E%E3%83%B3%E3%83%88%E3%83%A9%E3%81%A8%E5%8F%8D%E5%BE%A9%E9%9F%B3%E5%A3%B0%E3%81%AE%E7%A5%9E%E7%B5%8C%E5%8A%B9%E6%9E%9C&context=note&mode=search","article":false,"descRaw":"：マントラ詠唱や反復音声が意識変容を誘導するメカニズムの研究。反復的な発声は呼吸リズムを整え、迷走神経を介した副交感神経の活性化や脳波の同調、デフォルトモード活動の抑制をもたらすとされる。超越瞑想や念仏・真言などの伝統的実践を神経科学的に検証する試みで、音声の反復が注意を安定させる効果が注目されている。"},{"name":"ハーバート・ベンソン","chapter":"c4-誘発法","sub":5,"subCount":15,"tags":["science","practice","clinical"],"birth":1935,"death":2022,"href":"https://note.com/search?q=from%3A%40varelser%20%E3%83%8F%E3%83%BC%E3%83%90%E3%83%BC%E3%83%88%E3%83%BB%E3%83%99%E3%83%B3%E3%82%BD%E3%83%B3&context=note&mode=search","article":false,"descRaw":"（米・1935–2022）：ハーバード大学医学部の心臓専門医ハーバート・ベンソン（1935〜2022）。1975年の著書『The Relaxation Response』で、瞑想が心拍・血圧・代謝を下げる「リラクセーション反応」を引き起こすことを示し、闘争・逃走反応の対極として定式化した。超越瞑想の研究から出発し、心身医学の先駆けとなった。マインドフルネスを医療に結びつける道を開いた。"},{"name":"リチャード・デイヴィッドソン","chapter":"c4-誘発法","sub":5,"subCount":15,"tags":["science","practice"],"birth":1951,"death":null,"href":"https://note.com/search?q=from%3A%40varelser%20%E3%83%AA%E3%83%81%E3%83%A3%E3%83%BC%E3%83%89%E3%83%BB%E3%83%87%E3%82%A4%E3%83%B4%E3%82%A3%E3%83%83%E3%83%89%E3%82%BD%E3%83%B3&context=note&mode=search","article":false,"descRaw":"（米・1951–）：ウィスコンシン大学マディソン校の心理学者・神経科学者リチャード・デイヴィッドソン（1951〜）。ダライ・ラマの依頼で1990年代からチベット仏教の瞑想者の脳を研究し、慈悲の瞑想中のガンマ波同期や左前頭前野の活性化を報告した。2008年にヘルシーマインド・センターを創設し、瞑想の神経科学とウェルビーイング研究を主導している。"},{"name":"リヒャルト・ワーグナー","chapter":"c4-誘発法","sub":6,"subCount":15,"tags":["art","religion"],"birth":1813,"death":1883,"href":"https://note.com/search?q=from%3A%40varelser%20%E3%83%AA%E3%83%92%E3%83%A3%E3%83%AB%E3%83%88%E3%83%BB%E3%83%AF%E3%83%BC%E3%82%B0%E3%83%8A%E3%83%BC&context=note&mode=search","article":false,"descRaw":"（独・1813–1883）：ドイツの作曲家。『トリスタンとイゾルデ』（1865年）のトリスタン和声は、調性の溶解による持続的な陶酔を生み、近代音楽の転換点となった。詩・音楽・舞台を統合する総合芸術を掲げ、1876年にバイロイト祝祭劇場を開場。『ニーベルングの指環』四部作などで、音楽による催眠的な没入体験を構造化した。バイロイトの祝祭劇場は、観客を暗闇に包み、音楽への没入を促す設計である。"},{"name":"アレクサンドル・スクリャービン","chapter":"c4-誘発法","sub":6,"subCount":15,"tags":["art","religion"],"birth":1872,"death":1915,"href":"https://note.com/search?q=from%3A%40varelser%20%E3%82%A2%E3%83%AC%E3%82%AF%E3%82%B5%E3%83%B3%E3%83%89%E3%83%AB%E3%83%BB%E3%82%B9%E3%82%AF%E3%83%AA%E3%83%A3%E3%83%BC%E3%83%93%E3%83%B3&context=note&mode=search","article":false,"descRaw":"（露・1872–1915）：ロシアの作曲家。『法悦の詩』（1908年）や『プロメテウス—火の詩』（1910年）で知られ、後者では色光鍵盤ルーチェによる共感覚的な演出を試みた。神秘和音と呼ばれる独自の和声を用い、エクスタシーによる全存在の変容を構想した未完の総合芸術『神秘劇』の計画は、音楽と意識変容の結びつきを示す。晩年は神秘劇の構想に没頭し、音楽による人類の変容を夢見た。"},{"name":"エリック・サティ","chapter":"c4-誘発法","sub":6,"subCount":15,"tags":["art","theory"],"birth":1866,"death":1925,"href":"https://note.com/search?q=from%3A%40varelser%20%E3%82%A8%E3%83%AA%E3%83%83%E3%82%AF%E3%83%BB%E3%82%B5%E3%83%86%E3%82%A3&context=note&mode=search","article":false,"descRaw":"（仏・1866–1925）：フランスの作曲家。『ジムノペディ』（1888年）や『グノシエンヌ』で知られる簡潔で静謐な作風を確立した。1917年には、環境の一部として機能する「家具の音楽」を提唱し、聴くことよりも空間に漂うことを目的とした音楽を構想した。反復曲『ヴェクサシオン』（1893年頃）は、840回の反復を指定する実験的な作品である。"},{"name":"オリヴィエ・メシアン","chapter":"c4-誘発法","sub":6,"subCount":15,"tags":["art","religion"],"birth":1908,"death":1992,"href":"https://note.com/search?q=from%3A%40varelser%20%E3%82%AA%E3%83%AA%E3%83%B4%E3%82%A3%E3%82%A8%E3%83%BB%E3%83%A1%E3%82%B7%E3%82%A2%E3%83%B3&context=note&mode=search","article":false,"descRaw":"（仏・1908–1992）：フランスの作曲家。音と色を結びつける「色聴（共感覚）」的な作曲で知られ、カトリック神秘主義と鳥の歌声を素材とした。『トゥランガリーラ交響曲』（1948年）や、捕虜収容所で書かれた『時の終わりのための四重奏曲』（1941年）は、時間を超えた意識の拡張を描く。移調の限られた旋法による独自の音響が特徴である。"},{"name":"ハリー・パーチ","chapter":"c4-誘発法","sub":6,"subCount":15,"tags":["art","science"],"birth":1901,"death":1974,"href":"https://note.com/search?q=from%3A%40varelser%20%E3%83%8F%E3%83%AA%E3%83%BC%E3%83%BB%E3%83%91%E3%83%BC%E3%83%81&context=note&mode=search","article":false,"descRaw":"（米・1901–1974）：アメリカの作曲家。平均律を捨て、オクターヴを43音に分割する独自の音律を開発し、通常の知覚を解体する音響実験を行った。自作の楽器群を用い、古代ギリシャの音楽理論やアジアの音楽に学んだ。代表作『意識の迷妄』（1950年）など、身体と音の直接的な関係を探求した。自作楽器の多くは、廃材やガラス瓶などを用いて作られた。"},{"name":"アルヴォ・ペルト","chapter":"c4-誘発法","sub":6,"subCount":15,"tags":["art","religion","practice"],"birth":1935,"death":null,"href":"https://note.com/search?q=from%3A%40varelser%20%E3%82%A2%E3%83%AB%E3%83%B4%E3%82%A9%E3%83%BB%E3%83%9A%E3%83%AB%E3%83%88&context=note&mode=search","article":false,"descRaw":"（エストニア・1935–）：エストニアの作曲家。1976年に確立したティンティナブリ様式は、最小限の音の反復と静寂によって、恍惚と瞑想の音楽を生む。代表作『鏡の中の鏡』（1978年）や『フラトレス』（1977年）は、単純な構造の中に深い精神性を宿す。東方正教会への帰依が、音楽の静けさと祈りの性格を支えている。ソ連時代の抑圧を経て、亡命先のベルリンで作風を確立した。"},{"name":"ヤニス・クセナキス","chapter":"c4-誘発法","sub":6,"subCount":15,"tags":["art","science"],"birth":1922,"death":2001,"href":"https://note.com/varelser/n/n56f92553ef45","article":true,"descRaw":"（ギリシア-仏・1922–2001）：ギリシャ生まれの作曲家・建築家。確率論にもとづくストカスティック音楽を提唱し、集団音響による圧倒的な身体体験を生み出した。代表作『メタスタシス』（1954年）や『プレイアデス』（1978年）は、音の塊が空間を動くような感覚をもたらす。ル・コルビュジエ事務所での経験を生かし、音響と建築を融合させたポリトープも手がけた。"},{"name":"カールハインツ・シュトックハウゼン","chapter":"c4-誘発法","sub":6,"subCount":15,"tags":["art","religion","tech"],"birth":1928,"death":2007,"href":"https://note.com/search?q=from%3A%40varelser%20%E3%82%AB%E3%83%BC%E3%83%AB%E3%83%8F%E3%82%A4%E3%83%B3%E3%83%84%E3%83%BB%E3%82%B7%E3%83%A5%E3%83%88%E3%83%83%E3%82%AF%E3%83%8F%E3%82%A6%E3%82%BC%E3%83%B3&context=note&mode=search","article":false,"descRaw":"（独・1928–2007）：ドイツの作曲家。電子音楽の先駆者として、宇宙的意識と超感覚的知覚を音楽の目的に据えた。『グルッペン』（1957年）や『ゲザング・デア・ユングリンゲ』（1956年）で空間的な音響を切り開き、1977年から2003年にかけて七部作のオペラ『リヒト（光）』を作曲した。演奏者の直観に委ねる直観音楽も提唱した。"},{"name":"ジョン・タヴナー","chapter":"c4-誘発法","sub":6,"subCount":15,"tags":["art","religion","practice"],"birth":1944,"death":2013,"href":"https://note.com/search?q=from%3A%40varelser%20%E3%82%B8%E3%83%A7%E3%83%B3%E3%83%BB%E3%82%BF%E3%83%B4%E3%83%8A%E3%83%BC&context=note&mode=search","article":false,"descRaw":"（英・1944–2013）：イギリスの作曲家。東方正教会の神秘主義に基づく聖なる音楽で知られる。1977年の改宗を機に、祈りと静寂を中心とした作風を確立した。代表作『ヴェール（神殿のヴェール）』（2003年）は、7時間に及ぶ徹夜的な音楽体験として構想された。『ソング・フォー・アテネ』（1997年）は、ダイアナ元妃の葬儀で演奏され広く知られた。"},{"name":"モートン・フェルドマン","chapter":"c4-誘発法","sub":6,"subCount":15,"tags":["art","theory"],"birth":1926,"death":1987,"href":"https://note.com/search?q=from%3A%40varelser%20%E3%83%A2%E3%83%BC%E3%83%88%E3%83%B3%E3%83%BB%E3%83%95%E3%82%A7%E3%83%AB%E3%83%89%E3%83%9E%E3%83%B3&context=note&mode=search","article":false,"descRaw":"（米・1926–1987）：アメリカの作曲家。ジョン・ケージと出会い、図形譜と不確定性の音楽の先駆者となった。弱音による幽かな響きと反復の微細な変化を追究し、晩年は演奏時間が長大化した。『弦楽四重奏曲第2番』（1983年）は6時間を超える単一楽章で、時間の方向性を宙づりにし、聴き手の時間感覚を変容させる。静けさの音楽の代表である。"},{"name":"ジャチント・シェルシ","chapter":"c4-誘発法","sub":6,"subCount":15,"tags":["art","religion","theory"],"birth":1905,"death":1988,"href":"https://note.com/varelser/n/n42b39efadb0a","article":true,"descRaw":"（伊・1905–1988）：イタリアの作曲家。1949年から1952年の精神の危機を経て、単一の音の内部へ潜行する様式を確立した。『1つの音による4つの小品』（1959年）は、一つの音高を微分音の振動や音色の変化で彫刻する。自身を作曲家ではなく、超越的な次元からのメッセージを受信する霊媒（メディアム）と規定し、瞑想と禅仏教に根ざした音響の宇宙を展開した。"},{"name":"ラ・モンテ・ヤング","chapter":"c4-誘発法","sub":7,"subCount":15,"tags":["art","practice"],"birth":1935,"death":null,"href":"https://note.com/search?q=from%3A%40varelser%20%E3%83%A9%E3%83%BB%E3%83%A2%E3%83%B3%E3%83%86%E3%83%BB%E3%83%A4%E3%83%B3%E3%82%B0&context=note&mode=search","article":false,"descRaw":"（米・1935–）：アメリカの作曲家。ミニマル・ミュージックとドローン音楽の祖の一人。1962年に結成したドリーム・シンジケート（シアター・オブ・エターナル・ミュージック）で、純正律による持続音の演奏を実践した。代表作『ザ・ウェル・チューンド・ピアノ』（1964年〜）は、数時間に及ぶ即興演奏で、時間感覚を変容させる。妻マリアン・ザジーラとのドリーム・ハウスも知られる。"},{"name":"エリアーヌ・ラディーグ","chapter":"c4-誘発法","sub":7,"subCount":15,"tags":["art","practice"],"birth":1932,"death":2026,"href":"https://note.com/search?q=from%3A%40varelser%20%E3%82%A8%E3%83%AA%E3%82%A2%E3%83%BC%E3%83%8C%E3%83%BB%E3%83%A9%E3%83%87%E3%82%A3%E3%83%BC%E3%82%B0&context=note&mode=search","article":false,"descRaw":"（仏・1932–2026）：フランスの作曲家。ピエール・シェフェールに師事してミュジック・コンクレートを学んだのち、ARP 2500シンセサイザーによる超低速のドローン音楽を確立した。3時間に及ぶ『死の三部作』（1993〜98年）は、チベット仏教の死の瞑想に取材する。2004年以降はアコースティック楽器へ移行し、持続音による意識の変容を追究した。1932年生まれ、2026年没。"},{"name":"ポーリン・オリヴェロス","chapter":"c4-誘発法","sub":7,"subCount":15,"tags":["art","practice"],"birth":1932,"death":2016,"href":"https://note.com/varelser/n/n9bcc97e6a328","article":true,"descRaw":"（米・1932–2016）：アメリカの作曲家。1971年の『ソニック・メディテーションズ』に始まる、聴くこと自体を瞑想とする実践を展開した。1988年に提唱したディープ・リスニングは、環境音や身体の音への深い注意を通じて、意識のあり方を変える試みである。アコーディオン奏者としても知られ、フェミニズムと実験音楽を結びつけた。アコーディオンの即興演奏でも知られ、聴くことを瞑想とする実践を広めた。"},{"name":"ジョン・ケージ","chapter":"c4-誘発法","sub":7,"subCount":15,"tags":["art","religion","practice"],"birth":1912,"death":1992,"href":"https://note.com/search?q=from%3A%40varelser%20%E3%82%B8%E3%83%A7%E3%83%B3%E3%83%BB%E3%82%B1%E3%83%BC%E3%82%B8&context=note&mode=search","article":false,"descRaw":"（米・1912–1992）：アメリカの作曲家。1952年の『4分33秒』で、沈黙と環境音を音楽として提示し、偶然性（チャンス・オペレーション）を導入した。プリペアド・ピアノや図形譜でも知られる。禅への深い関心を持ち、1951年の無響室体験で、沈黙の中にも身体の音があることを悟った。聴くことと意識の関係を根本から問い直した。キノコの研究家としても知られ、偶然と自然への関心は生涯続いた。"},{"name":"ブライアン・イーノ","chapter":"c4-誘発法","sub":7,"subCount":15,"tags":["art","tech"],"birth":1948,"death":null,"href":"https://note.com/search?q=from%3A%40varelser%20%E3%83%96%E3%83%A9%E3%82%A4%E3%82%A2%E3%83%B3%E3%83%BB%E3%82%A4%E3%83%BC%E3%83%8E&context=note&mode=search","article":false,"descRaw":"（英・1948–）：イギリスの音楽家。ロキシー・ミュージックを経て、1978年の『ミュージック・フォー・エアポーツ』でアンビエント・ミュージックを確立した。環境の一部として機能し、注意のあり方を変える音楽を提唱し、生成システムによる作曲法を開発した。プロデューサーとしても知られ、音響と意識の関係を多方面で探求した。音楽以外の分野でも、生成システムやアートの実験を続けている。"},{"name":"フィリップ・グラス","chapter":"c4-誘発法","sub":7,"subCount":15,"tags":["art"],"birth":1937,"death":null,"href":"https://note.com/search?q=from%3A%40varelser%20%E3%83%95%E3%82%A3%E3%83%AA%E3%83%83%E3%83%97%E3%83%BB%E3%82%B0%E3%83%A9%E3%82%B9&context=note&mode=search","article":false,"descRaw":"（1937–）／（1936–）／（米・1935–）：ミニマル・ミュージックの三巨頭。ライリーは『インC』（1964年）で、53の短いフレーズを演奏者が自由に反復する形式を生み、ライヒは『ピアノ・フェイズ』（1967年）の位相ずれによる変容を、グラスは『浜辺のアインシュタイン』（1976年）の反復と加算リズムを確立した。反復と微細な変化が、時間感覚を解体し、催眠的な意識変容を生む。"},{"name":"スティーヴ・ライヒ","chapter":"c4-誘発法","sub":7,"subCount":15,"tags":["art"],"birth":1936,"death":null,"href":"https://note.com/search?q=from%3A%40varelser%20%E3%82%B9%E3%83%86%E3%82%A3%E3%83%BC%E3%83%B4%E3%83%BB%E3%83%A9%E3%82%A4%E3%83%92&context=note&mode=search","article":false,"descRaw":"（1937–）／（1936–）／（米・1935–）：ミニマル・ミュージックの三巨頭。ライリーは『インC』（1964年）で、53の短いフレーズを演奏者が自由に反復する形式を生み、ライヒは『ピアノ・フェイズ』（1967年）の位相ずれによる変容を、グラスは『浜辺のアインシュタイン』（1976年）の反復と加算リズムを確立した。反復と微細な変化が、時間感覚を解体し、催眠的な意識変容を生む。"},{"name":"テリー・ライリー","chapter":"c4-誘発法","sub":7,"subCount":15,"tags":["art"],"birth":1935,"death":null,"href":"https://note.com/search?q=from%3A%40varelser%20%E3%83%86%E3%83%AA%E3%83%BC%E3%83%BB%E3%83%A9%E3%82%A4%E3%83%AA%E3%83%BC&context=note&mode=search","article":false,"descRaw":"（1937–）／（1936–）／（米・1935–）：ミニマル・ミュージックの三巨頭。ライリーは『インC』（1964年）で、53の短いフレーズを演奏者が自由に反復する形式を生み、ライヒは『ピアノ・フェイズ』（1967年）の位相ずれによる変容を、グラスは『浜辺のアインシュタイン』（1976年）の反復と加算リズムを確立した。反復と微細な変化が、時間感覚を解体し、催眠的な意識変容を生む。"},{"name":"トニー・コンラッド","chapter":"c4-誘発法","sub":7,"subCount":15,"tags":["art","science"],"birth":1940,"death":2016,"href":"https://note.com/search?q=from%3A%40varelser%20%E3%83%88%E3%83%8B%E3%83%BC%E3%83%BB%E3%82%B3%E3%83%B3%E3%83%A9%E3%83%83%E3%83%89&context=note&mode=search","article":false,"descRaw":"（米・1940–2016）：アメリカの作曲家・映像作家。ラ・モンテ・ヤングのシアター・オブ・エターナル・ミュージックの中心メンバーとして、永続ドローンの実践を担った。ヴァイオリンによる純正律の持続音で、知覚の変容を実験した。ファウストとの共演作『アウトサイド・ザ・ドリーム・シンジケート』（1973年）や、フリッカー映画でも知られる。"},{"name":"フィル・ニブロック","chapter":"c4-誘発法","sub":7,"subCount":15,"tags":["art"],"birth":1933,"death":2024,"href":"https://note.com/search?q=from%3A%40varelser%20%E3%83%95%E3%82%A3%E3%83%AB%E3%83%BB%E3%83%8B%E3%83%96%E3%83%AD%E3%83%83%E3%82%AF&context=note&mode=search","article":false,"descRaw":"（米・1933–2024）：アメリカの作曲家。1960年代末から、微分音による持続音（ドローン）の作品を作り続けた。わずかにずれた多数の音を重ね、うなりと倍音が身体に浸透する音響を構築する。写真家・映画作家としても活動し、映像と音の重層的なインスタレーションを展開した。極限まで持続する音による、身体的な変性体験の探求で知られる。"},{"name":"シャルルマーニュ・パレスティーヌ","chapter":"c4-誘発法","sub":7,"subCount":15,"tags":["art","religion"],"birth":1947,"death":null,"href":"https://note.com/varelser/n/n3c921ad590ec","article":true,"descRaw":"（米・1947–）：アメリカ生まれの作曲家・パフォーマー。オルガンやピアノの倍音を重ねるストラミング（鍵盤を叩くように弾く）奏法で、スペクトルが蓄積する恍惚的な音響を作る。代表作『ストラミング・ミュージック』（1974年）は、反復と持続によるトランス的な音楽。テディベアを聖なる存在として舞台に置く儀式的なパフォーマンスでも知られる。"},{"name":"マリアンヌ・アマシェ","chapter":"c4-誘発法","sub":7,"subCount":15,"tags":["art","science"],"birth":1938,"death":2009,"href":"https://note.com/search?q=from%3A%40varelser%20%E3%83%9E%E3%83%AA%E3%82%A2%E3%83%B3%E3%83%8C%E3%83%BB%E3%82%A2%E3%83%9E%E3%82%B7%E3%82%A7&context=note&mode=search","article":false,"descRaw":"（米・1938–2009）：アメリカの作曲家。耳の中で生まれる音、耳音響放射（DPOAE）を利用した知覚実験音楽の先駆者。2つの純音を同時に聴かせると、蝸牛の非線形性により、外部に存在しない第3の音が耳の中で生成される現象を作曲の素材とした。1967年の『シティ・リンクス』など、建築や通信を用いた音響環境の実践でも知られる。音響が建築を伝わる構造伝播音の研究でも知られ、空間そのものを楽器とした。"},{"name":"ジミ・ヘンドリックス","chapter":"c4-誘発法","sub":8,"subCount":15,"tags":["art","substance"],"birth":1942,"death":1970,"href":"https://note.com/search?q=from%3A%40varelser%20%E3%82%B8%E3%83%9F%E3%83%BB%E3%83%98%E3%83%B3%E3%83%89%E3%83%AA%E3%83%83%E3%82%AF%E3%82%B9&context=note&mode=search","article":false,"descRaw":"（米・1942–1970）：アメリカのギタリスト。エレクトリック・ギターの表現を極限まで拡張し、フィードバックやワウ、歪みによる聴覚的な幻覚空間を創出した。1967年のモントレー・ポップ・フェスティヴァルや、1969年のウッドストックでの演奏は伝説となった。『エレクトリック・レディランド』（1968年）など、サイケデリック・ロックの象徴的存在である。"},{"name":"グレイトフル・デッド","chapter":"c4-誘発法","sub":8,"subCount":15,"tags":["art","substance","culture
