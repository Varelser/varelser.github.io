<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>変性意識・関連人物 — 関連図</title>
  <meta name="description" content="変性意識に関連する人物・研究・理論の関連図。2D（放射状・枠ツリー）・3D、全体図・周辺表示。">
  <style>
    :root {
      --bg: #ffffff;
      --panel: rgba(0,0,0,0.72);
      --line: rgba(0,0,0,0.10);
      --line-strong: rgba(0,0,0,0.16);
      --text: #111111;
      --muted: #6b6b6b;
      --link: #111111;
      --max: 1320px;
      --radius: 14px;
      --fs-body: 15px;
      --fs-small: 12px;
      --fs-h1: clamp(1.4rem, 2vw, 2.2rem);
      --fs-h2: 1.15rem;
      --fs-h3: 0.92rem;
      color-scheme: light;
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      background:
        radial-gradient(1100px 520px at 88% -8%, rgba(125,140,255,0.15), transparent 62%),
        radial-gradient(900px 480px at -8% -4%, rgba(255,175,205,0.13), transparent 58%),
        radial-gradient(1000px 640px at 50% 112%, rgba(140,220,255,0.13), transparent 62%),
        var(--bg);
      background-attachment: fixed;
      color: var(--text);
      font: var(--fs-body)/1.68 -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Yu Gothic UI", sans-serif;
      letter-spacing: 0.01em;
    }
    a {
      color: var(--link);
      text-decoration: none;
      transition: opacity 140ms ease, border-color 140ms ease;
    }
    a:hover { opacity: 0.72; }
    .wrap {
      width: 100%;
      max-width: none;
      margin: 0;
      padding: 0;
    }
    .hero {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 10px 12px;
      margin: 0;
      min-height: 52px;
      border-bottom: 1px solid var(--line-strong);
      background: rgba(255,255,255,0.48);
      backdrop-filter: blur(14px) saturate(1.4);
      -webkit-backdrop-filter: blur(14px) saturate(1.4);
    }
    .hero h1 {
      margin: 0;
      font-size: var(--fs-h1);
      line-height: 1.15;
      font-weight: 650;
      letter-spacing: 0.03em;
    }
    .hero-sub {
      color: var(--muted);
      font-size: var(--fs-small);
      white-space: nowrap;
    }
    .toolbar { position: sticky; top: 0; z-index: 30; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; padding: 10px 12px; border-bottom: 1px solid rgba(0,0,0,0.10); background: rgba(255,255,255,0.45); backdrop-filter: blur(28px) saturate(1.8); -webkit-backdrop-filter: blur(28px) saturate(1.8); box-shadow: inset 0 1px 0 rgba(255,255,255,0.8), 0 8px 24px rgba(0,0,0,0.06); }
    .toolbar-home, #graph-link { display: inline-flex; align-items: center; height: 36px; padding: 0 14px; border: 1px solid rgba(0,0,0,0.12); background: rgba(255,255,255,0.65); color: var(--text); border-radius: 12px; backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); box-shadow: inset 0 1px 0 rgba(255,255,255,0.9), 0 1px 2px rgba(0,0,0,0.04); white-space: nowrap; }
    .toolbar-home:hover, #graph-link:hover { background: #ffffff; border-color: rgba(0,0,0,0.25); }
    #result-count { color: var(--muted); font-size: var(--fs-small); white-space: nowrap; }
    #kn-tooltip { position: fixed; z-index: 200; max-width: 320px; padding: 10px 12px; background: rgba(255,255,255,0.68); backdrop-filter: blur(18px) saturate(1.4); -webkit-backdrop-filter: blur(18px) saturate(1.4); border: 1px solid rgba(0,0,0,0.12); border-radius: 12px; box-shadow: 0 8px 24px rgba(0,0,0,0.12), inset 0 1px 0 rgba(255,255,255,0.9); color: var(--text); font-size: var(--fs-small); line-height: 1.6; pointer-events: none; }
    #kn-tooltip .kn-tip-title { font-weight: 650; font-size: var(--fs-body); line-height: 1.4; margin-bottom: 2px; }
    #kn-tooltip .kn-tip-body { color: var(--text); }
    @media (max-width: 980px) { .toolbar { padding: 10px; } .toolbar-home, #graph-link { height: 44px; } .hero { padding: 10px; flex-wrap: wrap; } .hero-sub { white-space: normal; } }
    /* ---- 関連図 (graph view) ---- */
    #graph { margin: 12px; border: 1px solid rgba(0,0,0,0.08); background: rgba(255,255,255,0.74); backdrop-filter: blur(14px) saturate(1.3); -webkit-backdrop-filter: blur(14px) saturate(1.3); border-radius: 18px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); padding: 12px; display: flex; flex-direction: column; height: calc(100vh - 160px); height: calc(100dvh - 160px); }
    .graph-bar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-bottom: 10px; position: sticky; top: 62px; z-index: 20; background: rgba(255,255,255,0.85); backdrop-filter: blur(14px) saturate(1.4); -webkit-backdrop-filter: blur(14px) saturate(1.4); border-radius: 12px; padding: 6px 8px; }
    .graph-bar > button, .graph-detail > button { height: 34px; padding: 0 12px; border: 1px solid rgba(0,0,0,0.12); background: rgba(255,255,255,0.65); color: var(--text); font: inherit; cursor: pointer; border-radius: 12px; backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); box-shadow: inset 0 1px 0 rgba(255,255,255,0.9), 0 1px 2px rgba(0,0,0,0.04); }
    .graph-bar > button:hover, .graph-detail > button:hover { background: #ffffff; border-color: rgba(0,0,0,0.25); }
    .graph-bar > button.is-active { color: #ffffff; background: rgba(0,0,0,0.88); border-color: rgba(0,0,0,0.88); box-shadow: 0 2px 8px rgba(0,0,0,0.18); }
    .graph-seg { display: inline-flex; border: 1px solid rgba(0,0,0,0.12); background: rgba(255,255,255,0.65); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border-radius: 12px; overflow: hidden; box-shadow: inset 0 1px 0 rgba(255,255,255,0.9), 0 1px 2px rgba(0,0,0,0.04); }
    .graph-bar .graph-seg button { appearance: none; border: 0; border-right: 1px solid var(--line); background: transparent; color: var(--muted); height: 34px; min-width: 38px; padding: 0 12px; font: inherit; cursor: pointer; border-radius: 0; box-shadow: none; }
    .graph-bar .graph-seg button:last-child { border-right: 0; }
    .graph-bar .graph-seg button:hover { background: rgba(255,255,255,0.9); color: var(--text); }
    .graph-bar .graph-seg button.is-active { color: #ffffff; background: rgba(0,0,0,0.88); }
    .graph-bar .graph-seg button:disabled { opacity: 0.45; cursor: default; }
    .graph-center { color: var(--muted); font-size: var(--fs-small); display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
    .graph-center input { height: 34px; width: 210px; padding: 0 10px; border: 1px solid rgba(0,0,0,0.12); background: rgba(255,255,255,0.55); color: var(--text); font: inherit; border-radius: 12px; backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); box-shadow: inset 0 1px 0 rgba(255,255,255,0.9), 0 1px 2px rgba(0,0,0,0.04); }
    .graph-center input:focus { outline: none; border-color: rgba(0,0,0,0.35); background: #ffffff; box-shadow: inset 0 1px 0 rgba(255,255,255,0.9), 0 0 0 3px rgba(0,0,0,0.08); }
    .graph-center input:disabled, .graph-check input:disabled { opacity: 0.45; }
    .graph-check { color: var(--muted); font-size: var(--fs-small); display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; cursor: pointer; }
    .graph-sliders { display: flex; flex-wrap: wrap; gap: 6px 18px; align-items: center; margin-bottom: 10px; padding: 8px 10px; border: 1px solid rgba(0,0,0,0.08); background: rgba(255,255,255,0.55); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border-radius: 12px; color: var(--muted); font-size: var(--fs-small); }
    .graph-sliders label { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
    .graph-sliders input[type="range"] { width: 110px; accent-color: rgba(0,0,0,0.75); }
    .graph-sliders input[type="range"]:disabled { opacity: 0.3; }
    .graph-sliders .graph-f-val { color: var(--text); min-width: 34px; font-variant-numeric: tabular-nums; }
    .graph-sliders .graph-f-note { color: var(--muted); font-size: 0.9em; }
    #graph-count { color: var(--muted); font-size: var(--fs-small); margin-left: auto; white-space: nowrap; }
    .graph-main { display: grid; grid-template-columns: minmax(0, 1fr) 252px; gap: 10px; align-items: stretch; flex: 1; min-height: 0; }
    #graph-canvas { width: 100%; height: 100%; min-height: 0; display: block; border: 1px solid rgba(0,0,0,0.08); border-radius: 12px; background: rgba(255,255,255,0.55); touch-action: none; cursor: grab; }
    #graph-canvas:active { cursor: grabbing; }
    .graph-detail { border: 1px solid rgba(0,0,0,0.08); background: rgba(255,255,255,0.55); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border-radius: 12px; padding: 12px; overflow: auto; max-height: 100%; font-size: var(--fs-small); line-height: 1.7; }
    .graph-detail h3 { margin: 0 0 4px; font-size: var(--fs-body); line-height: 1.4; font-weight: 650; }
    .graph-detail h3 a { color: var(--text); border-bottom: 1px solid rgba(0,0,0,0.35); }
    .graph-detail h3 a:hover { border-bottom-color: var(--text); }
    .graph-detail .gd-meta { color: var(--muted); }
    .graph-detail .gd-tags { margin: 8px 0; }
    .graph-detail .gd-tags span { display: inline-block; border: 1px solid rgba(0,0,0,0.14); border-radius: 999px; padding: 1px 8px; margin: 0 4px 4px 0; background: rgba(255,255,255,0.7); color: var(--text); }
    .graph-detail .gd-links { margin: 8px 0 0; display: flex; flex-direction: column; gap: 6px; align-items: flex-start; }
    .graph-detail .gd-note { color: var(--muted); }
    .graph-detail .gd-rel { display: flex; flex-wrap: wrap; gap: 4px 8px; margin: 2px 0 4px; align-items: center; }
    .graph-detail .gd-rel-item { appearance: none; border: 1px solid rgba(142,47,60,0.35); background: rgba(255,255,255,0.7); color: var(--text); font: inherit; font-size: var(--fs-small); cursor: pointer; border-radius: 999px; padding: 1px 9px; }
    .graph-detail .gd-rel-item:hover { background: #ffffff; border-color: rgba(142,47,60,0.7); }
    .graph-detail .gd-rel a { color: var(--muted); font-size: 0.9em; }
    .graph-detail-empty { color: var(--muted); margin: 0; }
    .graph-legend { display: flex; flex-wrap: wrap; gap: 4px 14px; margin-top: 10px; color: var(--muted); font-size: var(--fs-small); align-items: center; }
    .graph-legend .sw { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 5px; vertical-align: -1px; }
    .graph-legend .edge-sample { display: inline-block; width: 22px; height: 0; border-top: 2px solid rgba(0,0,0,0.16); vertical-align: middle; margin-right: 5px; }
    .graph-legend .edge-sample.mention { border-top: 1px solid rgba(0,0,0,0.45); }
    .graph-legend .edge-sample.rel { border-top: 2px dashed rgba(142,47,60,0.7); }
    .graph-legend .edge-sample.weak { border-top: 1px solid rgba(0,0,0,0.08); }
    .graph-legend .edge-sample.spoke { border-top: 1px solid rgba(0,0,0,0.22); }
    @media (max-width: 980px) {
      #graph { margin: 10px; padding: 10px; height: auto; }
      .graph-main { grid-template-columns: 1fr; flex: none; }
      #graph-canvas { height: 420px; height: min(60dvh, 520px); min-height: 320px; }
      .graph-detail { max-height: none; }
      .graph-center input { width: 160px; }
      /* 狭い画面：操作バーは上部に固定しない（ツールバーと重なるため）。
         ボタン・入力・スライダーのタップ領域を指で押しやすい高さにする。 */
      .graph-bar { position: static; }
      .graph-bar > button, .graph-bar .graph-seg button { height: 44px; min-width: 44px; }
      .graph-bar .graph-seg button { padding: 0 14px; }
      .graph-center input { height: 44px; flex: 1 1 160px; min-width: 140px; }
      .graph-check { min-height: 44px; }
      .graph-check input { width: 20px; height: 20px; }
      .graph-sliders label { flex: 1 1 100%; }
      .graph-sliders input[type="range"] { flex: 1; height: 44px; min-width: 120px; }
      .graph-detail > button { min-height: 44px; }
      .graph-detail .gd-rel-item { min-height: 32px; padding: 4px 12px; }
    }

  </style>
</head>
<body>
  <div class="wrap">
    <header class="hero">
      <h1>関連図 — 変性意識・関連人物</h1>
      <span class="hero-sub">2D（放射状・枠ツリー）・3Dでつながりを眺める</span>
    </header>
    <div class="toolbar" role="navigation" aria-label="ページ移動">
      <a class="toolbar-home" href="https://varelser.github.io/">ホームへ</a>
      <a class="toolbar-home" href="knowledgenetwork.html">一覧へ</a>
      <span id="result-count" aria-live="polite"></span>
    </div>
    <div id="graph" hidden>
      <div class="graph-bar" role="toolbar" aria-label="関連図の操作">
        <div class="graph-seg" role="group" aria-label="表示範囲">
          <button type="button" id="graph-view-all" class="is-active" aria-pressed="true">全体図</button>
          <button type="button" id="graph-view-local" aria-pressed="false">周辺</button>
        </div>
        <label class="graph-center">中心 <input id="graph-center" list="graph-names" placeholder="人物・理論名" autocomplete="off" aria-label="中心ノード"></label>
        <datalist id="graph-names"></datalist>
        <label class="graph-check"><input type="checkbox" id="graph-depth2"> 2段表示</label>
        <div class="graph-seg" role="group" aria-label="辺の種類">
          <button type="button" id="graph-edge-both" class="is-active" aria-pressed="true">両方</button>
          <button type="button" id="graph-edge-tag" aria-pressed="false">タグ</button>
          <button type="button" id="graph-edge-mention" aria-pressed="false">言及</button>
        </div>
        <label class="graph-check"><input type="checkbox" id="graph-weak" checked> 弱い辺も表示</label>
        <div class="graph-seg" role="group" aria-label="次元">
          <button type="button" id="graph-dim-2d" class="is-active" aria-pressed="true">2D</button>
          <button type="button" id="graph-dim-3d" aria-pressed="false">3D</button>
        </div>
        <div class="graph-seg" role="group" aria-label="2Dの表示">
          <button type="button" id="graph-view-radial" class="is-active" aria-pressed="true">放射状</button>
          <button type="button" id="graph-view-tree" aria-pressed="false">枠ツリー</button>
        </div>
        <button type="button" id="graph-play">一時停止</button>
        <button type="button" id="graph-reset">リセット</button>
        <button type="button" id="graph-save">PNG保存</button>
        <label class="graph-check"><input type="checkbox" id="graph-rotate"> 自動回転</label>
        <span id="graph-count" aria-live="polite"></span>
      </div>
      <div class="graph-sliders" role="group" aria-label="力の調整">
        <label><span id="graph-f-attract-name">吸引力</span> <input type="range" id="graph-f-attract" min="0.2" max="5" step="0.1" value="1" aria-label="吸引力"> <span class="graph-f-val" id="graph-f-attract-val">×1.0</span></label>
        <label><span id="graph-f-repel-name">反発力</span> <input type="range" id="graph-f-repel" min="0.2" max="5" step="0.1" value="1" aria-label="反発力"> <span class="graph-f-val" id="graph-f-repel-val">×1.0</span></label>
        <label><span id="graph-f-rest-name">バネの長さ</span> <input type="range" id="graph-f-rest" min="0.5" max="4" step="0.1" value="1" aria-label="バネの長さ"> <span class="graph-f-val" id="graph-f-rest-val">×1.0</span></label>
        <label><span id="graph-f-speed-name">速度</span> <input type="range" id="graph-f-speed" min="0.3" max="4" step="0.1" value="1" aria-label="アニメーション速度"> <span class="graph-f-val" id="graph-f-speed-val">×1.0</span></label>
        <span class="graph-f-note" id="graph-f-note"></span>
      </div>
      <div class="graph-main">
        <canvas id="graph-canvas" width="900" height="560" aria-label="関連図"></canvas>
        <aside class="graph-detail" id="graph-detail" aria-live="polite">
          <p class="graph-detail-empty">ノードをクリックすると詳細が表示されます。ドラッグで移動、ホイール／ピンチでズームできます。3Dではドラッグで回転します。タッチではノードをタップすると説明が表示されます。</p>
        </aside>
      </div>
      <div class="graph-legend" id="graph-legend"></div>
    </div>

"ヴァージニア・ウルフ","b":"ジークムント・フロイト","type":"交友","note":"1939年1月28日、ウルフ夫妻はロンドンのフロイト宅を訪ねてお茶を共にし、フロイトから水仙の花を贈られた。夫妻のホガース・プレスは1924年からフロイトの著作を出版していた。","source":"https://link.springer.com/chapter/10.1057/9781403919366_1"},{"a":"ラルフ・ワルド・エマーソン","b":"ウォルト・ホイットマン","type":"往復書簡","note":"1855年7月21日、エマーソンは『草の葉』を絶賛する手紙をホイットマンに送り、同年12月11日にはブルックリンを訪ねて夕食を共にした。（記述文中の言及と重複）","source":"https://whitmanarchive.org/item/encyclopedia_entry1"},{"a":"マルセル・モース","b":"エミール・デュルケーム","type":"師弟","note":"モースはデュルケームの甥で、直接の指導を受けて『自殺論』の準備を手伝い、後に『社会学年報』の編集を継承した。","source":"https://www.britannica.com/biography/Marcel-Mauss"},{"a":"ヴィルヘルム・ライヒ","b":"ジークムント・フロイト","type":"師弟","note":"1920年代にフロイトの弟子としてウィーンで活動し、後継者と目されたが、理論の対立から1934年に国際精神分析協会から除名された。","source":"https://www.britannica.com/biography/Wilhelm-Reich"},{"a":"クロード・レヴィ＝ストロース","b":"マルセル・モース","type":"師弟","note":"レヴィ＝ストロースはモースの講義を受け、没後に著作集『社会学と人類学』の編集と長大な序文を担当し、自らをモースの継承者として位置づけた。","source":"https://ja.wikipedia.org/wiki/%E3%82%AF%E3%83%AD%E3%83%BC%E3%83%89%E3%83%BB%E3%83%AC%E3%83%B4%E3%82%A3%EF%BC%9D%E3%82%B9%E3%83%88%E3%83%AD%E3%83%BC%E3%82%B9"},{"a":"ジョン・ケージ","b":"鈴木大拙","type":"師弟","note":"ケージは1952年からコロンビア大学で大拙の禅の講義を3年間聴講し、沈黙と無心の思想が『4分33秒』へと結実した。","source":"https://tower.jp/article/series/2012/08/20/silence"},{"a":"ピンク・フロイド","b":"ジミ・ヘンドリックス","type":"協働","note":"1967年11月14日から12月5日まで、ジミ・ヘンドリックス・エクスペリエンスをヘッドライナーとする16日間の英国パッケージツアーを共にした。","source":"https://www.jimihendrix.com/editorial/the-line-up-of-a-lifetime-on-the-road-with-the-jimi-hendrix-experience-second-uk-tour-nov-dec-1967/"},{"a":"スタニスラフ・グロフ","b":"ティモシー・リアリー","type":"交友","note":"グロフはリアリーと直接議論し、リアリーの「誰でもどんな状況でもサイケデリックを取ってよい」という考えに異を唱えた。","source":"https://www.atpweb.org/jtparchive/trps-40-08-02-155.pdf"},{"a":"スタニスラフ・グロフ","b":"アルベルト・ホフマン","type":"交友","note":"グロフはホフマンを「究極の精神的な父」と呼び、1984年にエサレン研究所で対談するなど長年にわたって交流した。","source":"https://maps.org/news-letters/v11n2/11222gro.html"},{"a":"寺山修司","b":"横尾忠則","type":"協働","note":"横尾は1967年の演劇実験室「天井桟敷」の旗揚げメンバーで美術スタッフとして参加し、『毛皮のマリー』などのポスターと舞台装置を手がけた。","source":"https://jbpress.ismedia.jp/articles/-/94476"},{"a":"ウォルター・パーンケ","b":"ティモシー・リアリー","type":"師弟","note":"パーンケはリアリーの指導のもとで博士論文研究として1962年のグッド・フライデー実験（マーシュ礼拝堂実験）を設計・実施した。","source":"https://archives.lib.purdue.edu/agents/people/435"}]</script>
  <script>
    // ---- 共通ツールチップ（ホバーで説明を表示） ----
    // ガラス風の専用要素（title属性は使わない）。カーソルに追従し、
    // 画面端ではみ出さないよう位置を調整する。マウスが離れるか
    // スクロールしたら消える。
    // タップでも表示できる（モバイル）：1回目のタップで説明を表示し、
    // 同じ要素への2回目のタップでリンクを開く。タップで開いた説明は
    // 別の場所のタップ・スクロール・一定時間（5秒）で消える。
    // iOSではタップ毎に mouseover が発火するため、同じタイトルの説明が
    // 既に出ている場合は owner を上書きしない（タップ→mouseover の順で
    // 呼ばれても、タップ側の owner が残る）。
    let knTipEl = null;
    let tipOwner = null;
    let knTipHideTimer = null;
    let lastPointerType = 'mouse';
    const KN_TIP_AUTO_HIDE_MS = 5000;
    document.addEventListener('pointerdown', (e) => {
      if (e.pointerType) lastPointerType = e.pointerType;
      // タップで開いた説明は、別の要素へのタップで閉じる
      if (e.pointerType === 'touch' && knTipEl && !knTipEl.hidden) {
        const t = e.target;
        if (!knTipEl.contains(t) && !(t.closest && t.closest('a, button'))) knTipHide();
      }
    }, true);
    const armKnTipTimer = () => {
      if (knTipHideTimer) clearTimeout(knTipHideTimer);
      knTipHideTimer = setTimeout(() => { knTipHide(); knTipHideTimer = null; }, KN_TIP_AUTO_HIDE_MS);
    };
    const knTip = () => {
      if (!knTipEl) {
        knTipEl = document.createElement('div');
        knTipEl.id = 'kn-tooltip';
        knTipEl.setAttribute('role', 'tooltip');
        knTipEl.hidden = true;
        document.body.appendChild(knTipEl);
      }
      return knTipEl;
    };
    const knTipShow = (title, body, x, y, owner) => {
      const el = knTip();
      // 同じタイトルの説明が既に出ている場合は内容を作り直さず、owner は
      // タップ側のものを残す（iOSではタップ毎に mouseover が発火し、
      // owner なしで呼ばれてもタップ側の owner を消さないため。2回目の
      // タップでリンクを開けるようにする）
      if (!el.hidden) {
        const curTitle = el.querySelector('.kn-tip-title');
        if (curTitle && curTitle.textContent === title) {
          if (owner && !tipOwner) tipOwner = owner;
          knTipMove(x, y);
          return;
        }
      }
      el.innerHTML = '';
      if (title) {
        const h = document.createElement('div');
        h.className = 'kn-tip-title';
        h.textContent = title;
        el.appendChild(h);
      }
      if (body) {
        const b = document.createElement('div');
        b.className = 'kn-tip-body';
        b.textContent = body;
        el.appendChild(b);
      }
      el.hidden = false;
      tipOwner = owner || null;
      knTipMove(x, y);
    };
    const knTipMove = (x, y) => {
      const el = knTipEl;
      if (!el || el.hidden) return;
      const pad = 12, gap = 14;
      const w = el.offsetWidth, h = el.offsetHeight;
      const vw = window.innerWidth, vh = window.innerHeight;
      let left = x + gap, top = y + gap;
      if (left + w > vw - pad) left = x - w - gap;
      if (left < pad) left = pad;
      if (top + h > vh - pad) top = y - h - gap;
      if (top < pad) top = pad;
      el.style.left = left + 'px';
      el.style.top = top + 'px';
    };
    const knTipHide = () => { if (knTipEl) knTipEl.hidden = true; tipOwner = null; if (knTipHideTimer) { clearTimeout(knTipHideTimer); knTipHideTimer = null; } };
    window.addEventListener('scroll', knTipHide, true);

    // liから記述文を取り出す（項目名リンク・関連・タグ表示を除き、
    // 先頭の（…）：を除く）。論文項目は括弧が項目名リンク内にあって
    // 残りのテキストが「：」から始まるため、先頭の「：」や「—」も除く。
    const descOfLi = (li) => {
      if (!li) return '';
      const clone = li.cloneNode(true);
      clone.querySelectorAll('.person-link, .related, .tags').forEach((el) => el.remove());
      const t = (clone.textContent || '').replace(/\s+/g, ' ').trim();
      return t.replace(/^（[^）]*）：\s*/, '').replace(/^[：:—―\-–\s]+/, '');
    };
    const truncDesc = (t, n) => {
      const chars = [...(t || '')];
      if (chars.length <= n) return t || '';
      return chars.slice(0, n).join('') + '…';
    };
    const fmtYear = (y) => (y < 0 ? '前' + Math.abs(y) : String(y));
    const fmtSpan = (b, d) => fmtYear(b) + '–' + (d == null ? '' : fmtYear(d));

    // 一覧ページ側の状態（関連図の openInList 等が参照するため宣言だけ用意。
    // 単独ページでは一覧の DOM がないため openInList は一覧へ遷移する）
    let activeTag = '';
    let timelineMode = false;

const TAGS = {
      substance: '物質', practice: '実践', dream: '夢・睡眠', theory: '理論',
      clinical: '臨床', religion: '宗教・神秘', art: '芸術', science: '科学',
      tech: '技術', culture: '民族・文化', policy: '制度・倫理'
    };

    // 関連図のデータ（一覧ページ knowledgenetwork.html の person-link から

    window.KN_GRAPH_DATA = {"entries":[{"name":"デフォルトモードネットワーク仮説（レイクル, 2001）","chapter":"c2-脳のネットワーク","sub":0,"subCount":7,"tags":["science","theory"],"birth":null,"death":null,"href":"https://note.com/search?q=from%3A%40varelser%20%E3%83%87%E3%83%95%E3%82%A9%E3%83%AB%E3%83%88%E3%83%A2%E3%83%BC%E3%83%89%E3%83%8D%E3%83%83%E3%83%88%E3%83%AF%E3%83%BC%E3%82%AF%E4%BB%AE%E8%AA%AC%EF%BC%88%E3%83%AC%E3%82%A4%E3%82%AF%E3%83%AB%2C%202001%EF%BC%89&context=note&mode=search","article":false,"descRaw":"：マーカス・レイクルらが2001年、米ワシントン大学のPET研究から提唱した脳の安静時基底状態。内側前頭前野・後部帯状皮質・楔前部・外側頭頂葉などが課題遂行時に活動を落とし、安静時に高まる。自己参照的な思考、自伝的記憶の想起、未来の想像、マインドワンダリングの基盤とされ、瞑想やサイケデリクスで活動が低下することから変性意識研究の中核概念となった。 出典：Raichle et al. (2001)『Proceedings of the National Academy of Sciences』 DOI: 10.1073/pnas.98.2.676"},{"name":"エントロピック・ブレイン仮説（カーハート＝ハリス, 2014）","chapter":"c2-脳のネットワーク","sub":0,"subCount":7,"tags":["science","substance","theory"],"birth":null,"death":null,"href":"https://note.com/varelser/n/n8a5523d07d6d","article":true,"descRaw":"：ロビン・カーハート＝ハリスらが2014年に『Frontiers in Human Neuroscience』で提唱した理論。サイケデリクス下では脳活動のエントロピー（無秩序さ）が増し、通常の意識を縛る制約が緩むと考える。覚醒・睡眠・麻酔・精神病など意識状態の豊かさを神経エントロピーで位置づけ、自我溶解や幻視の神経基盤を説明する枠組みとして、後のREBUSモデルの土台となった。 出典：Carhart-Harris et al. (2014)『Frontiers in Human Neuroscience』 DOI: 10.3389/fnhum.2014.00020"},{"name":"REBUSモデル（カーハート＝ハリス & フリストン, 2019）","chapter":"c2-脳のネットワーク","sub":0,"subCount":7,"tags":["theory","science","substance"],"birth":null,"death":null,"href":"https://note.com/varelser/n/n0974d5d447f3","article":true,"descRaw":"：カーハート＝ハリスとカール・フリストンが2019年に『Pharmacological Reviews』で発表したモデル。正式名は「Relaxed Beliefs Under Psychedelics」。サイケデリクスは階層的予測処理における高次信念（事前信念）の確信度を下げ、ボトムアップの情報を解放すると考える。固着した自己像やうつ病的な反芻が緩み、信念の書き換えが起きる仕組みとして、治療効果の説明にも用いられる。 出典：Carhart-Harris & Friston (2019)『Pharmacological Reviews』 DOI: 10.1124/pr.118.017160"},{"name":"統合情報理論（ジュリオ・トノーニ, 2004〜）","chapter":"c2-脳のネットワーク","sub":0,"subCount":7,"tags":["theory","science"],"birth":null,"death":null,"href":"https://note.com/search?q=from%3A%40varelser%20%E7%B5%B1%E5%90%88%E6%83%85%E5%A0%B1%E7%90%86%E8%AB%96%EF%BC%88%E3%82%B8%E3%83%A5%E3%83%AA%E3%82%AA%E3%83%BB%E3%83%88%E3%83%8E%E3%83%BC%E3%83%8B%2C%202004%E3%80%9C%EF%BC%89&context=note&mode=search","article":false,"descRaw":"：ジュリオ・トノーニが2004年に提唱した意識理論。意識を「統合された情報」と同一視し、その量をΦ（ファイ）で数理的に定義する。経験の統合性と情報性という現象学的公理から出発し、物理系が満たすべき要請を導く点が特徴。脳の複雑な因果構造が意識の量と質を決めるとし、睡眠・麻酔・植物状態での意識レベルの評価や、摂動複雑性指標（PCI）の理論的背景ともなった。 出典：Tononi (2004)『BMC Neuroscience』 DOI: 10.1186/1471-2202-5-42"},{"name":"グローバル・ワークスペース理論（バーナード・バース, 1988）","chapter":"c2-脳のネットワーク","sub":0,"subCount":7,"tags":["theory","science"],"birth":null,"death":null,"href":"https://note.com/search?q=from%3A%40varelser%20%E3%82%B0%E3%83%AD%E3%83%BC%E3%83%90%E3%83%AB%E3%83%BB%E3%83%AF%E3%83%BC%E3%82%AF%E3%82%B9%E3%83%9A%E3%83%BC%E3%82%B9%E7%90%86%E8%AB%96%EF%BC%88%E3%83%90%E3%83%BC%E3%83%8A%E3%83%BC%E3%83%89%E3%83%BB%E3%83%90%E3%83%BC%E3%82%B9%2C%201988%EF%BC%89&context=note&mode=search","article":false,"descRaw":"：バーナード・バースが1988年の著書『A Cognitive Theory of Consciousness』で提唱した理論。多数の無意識的な専門処理装置と、情報を全脳へ「放送」する容量限定のグローバル・ワークスペースを想定する。ワークスペースに入った情報だけが意識的アクセスを得る。後にドゥアンヌらが神経科学的な「グローバル・ニューロナル・ワークスペース理論」へ発展させ、前頭-頭頂ネットワークの全脳的な点火が意識の成立条件とされた。"},{"name":"自由エネルギー原理（カール・フリストン）","chapter":"c2-脳のネットワーク","sub":0,"subCount":7,"tags":["theory","science"],"birth":null,"death":null,"href":"https://note.com/varelser/n/n7710167e567a","article":true,"descRaw":"：カール・フリストンが2010年前後に体系化した脳の統一理論。脳を予測誤差（自由エネルギー）を最小化する推論機械とみなし、知覚・学習・行動を予測モデルの更新として記述する。変性意識は予測モデルの精度や階層構造が崩れ、再編される過程として解釈できる。REBUSモデルや予測処理の意識研究の数理的基盤となり、精神医学の計算論的アプローチにも広く用いられる。 出典：Friston (2010)『Nature Reviews Neuroscience』 DOI: 10.1038/nrn2787"},{"name":"意識の神経相関（NCC）研究","chapter":"c2-脳のネットワーク","sub":0,"subCount":7,"tags":["science","theory"],"birth":null,"death":null,"href":"https://note.com/search?q=from%3A%40varelser%20%E6%84%8F%E8%AD%98%E3%81%AE%E7%A5%9E%E7%B5%8C%E7%9B%B8%E9%96%A2%EF%BC%88NCC%EF%BC%89%E7%A0%94%E7%A9%B6&context=note&mode=search","article":false,"descRaw":"：意識体験に対応する最小限の神経活動を特定しようとする研究プログラム。フランシス・クリックとクリストフ・コッホが1990年の論文で、意識を科学的に扱うための枠組みとして提唱した。両眼視野闘争などを用い、知覚内容ごとに必要な神経相関を切り分ける。内容特異的NCCと全体としてのNCCを区別し、後部皮質ホットゾーン説などへつながった意識科学の中心的な課題である。"},{"name":"ガンマ波同期と瞑想（リュツ, デイヴィッドソンら, 2004）","chapter":"c2-脳のネットワーク","sub":0,"subCount":7,"tags":["science","practice"],"birth":null,"death":null,"href":"https://note.com/search?q=from%3A%40varelser%20%E3%82%AC%E3%83%B3%E3%83%9E%E6%B3%A2%E5%90%8C%E6%9C%9F%E3%81%A8%E7%9E%91%E6%83%B3%EF%BC%88%E3%83%AA%E3%83%A5%E3%83%84%2C%20%E3%83%87%E3%82%A4%E3%83%B4%E3%82%A3%E3%83%83%E3%83%89%E3%82%BD%E3%83%B3%E3%82%89%2C%202004%EF%BC%89&context=note&mode=search","article":false,"descRaw":"：アントワーヌ・リュツ、リチャード・デイヴィッドソンらが2004年に『PNAS』で報告した研究。1万〜5万時間の修行を積んだチベット仏教の長期瞑想者8名と初心者を比較し、慈悲の瞑想中に高振幅ガンマ帯（25〜42Hz）の持続的な同期が自己誘導されることを示した。安静時のベースラインでもガンマ活動が高く、長期の心的訓練が脳の機能的統合を変える証拠として、瞑想の神経科学の出発点となった。 出典：Lutz et al. (2004)『Proceedings of the National Academy of Sciences』 DOI: 10.1073/pnas.0407401101"},{"name":"サイケデリクスとDMN抑制（カーハート＝ハリスら, 2012）","chapter":"c2-脳のネットワーク","sub":0,"subCount":7,"tags":["science","substance"],"birth":null,"death":null,"href":"https://note.com/search?q=from%3A%40varelser%20%E3%82%B5%E3%82%A4%E3%82%B1%E3%83%87%E3%83%AA%E3%82%AF%E3%82%B9%E3%81%A8DMN%E6%8A%91%E5%88%B6%EF%BC%88%E3%82%AB%E3%83%BC%E3%83%8F%E3%83%BC%E3%83%88%EF%BC%9D%E3%83%8F%E3%83%AA%E3%82%B9%E3%82%89%2C%202012%EF%BC%89&context=note&mode=search","article":false,"descRaw":"：カーハート＝ハリスらが2012年に『PNAS』で発表した初のシロシビンfMRI研究。静脈内投与したシロシビン下では、予想に反して脳血流とBOLD信号が上昇せず、視床や前部・後部帯状皮質などのハブ領域で低下した。内側前頭前野の活動低下の大きさが主観的体験の強さと相関し、DMNの脱結合が「自我溶解」の神経メカニズムとする解釈を生んだ。サイケデリクス神経科学の転換点となった。 出典：Carhart-Harris et al. (2012)『Proceedings of the National Academy of Sciences』 DOI: 10.1073/pnas.1119598109"},{"name":"クラウストラムと意識（クリック & コッホ, 2005）","chapter":"c2-脳のネットワーク","sub":0,"subCount":7,"tags":["science","theory"],"birth":null,"death":null,"href":"https://note.com/search?q=from%3A%40varelser%20%E3%82%AF%E3%83%A9%E3%82%A6%E3%82%B9%E3%83%88%E3%83%A9%E3%83%A0%E3%81%A8%E6%84%8F%E8%AD%98%EF%BC%88%E3%82%AF%E3%83%AA%E3%83%83%E3%82%AF%20%26%20%E3%82%B3%E3%83%83%E3%83%9B%2C%202005%EF%BC%89&context=note&mode=search","article":false,"descRaw":"：フランシス・クリックとクリストフ・コッホが2005年に『Philosophical Transactions of the Royal Society B』で提唱した仮説。薄いシート状の神経核である前障（クラウストラム）はほぼ全皮質と双方向に結合し、多様な感覚・運動情報を統合する「指揮者」の役割を果たす可能性がある。意識の統一性を担う解剖学的座の候補とされ、後に刺激実験でも関心を集めたが、検証はなお途上である。 出典：Crick & Koch (2005)『Philosophical Transactions of the Royal Society B』 DOI: 10.1098/rstb.2005.1661"},{"name":"後部ホットゾーン仮説（コッホ, マッシミーニら）","chapter":"c2-脳のネットワーク","sub":0,"subCount":7,"tags":["science","theory"],"birth":null,"death":null,"href":"https://note.com/varelser/n/nb283d80f26ac","article":true,"descRaw":"：クリストフ・コッホ、マルチェッロ・マッシミーニらが2016年の『Nature Reviews Neuroscience』総説で主張した仮説。意識内容の神経相関は前頭-頭頂ネットワークではなく、感覚野を含む後部皮質（頭頂-側頭-後頭の接合領域）に局在するという。夢や知覚の研究から、前頭葉は報告や課題遂行に関わるが意識内容そのものには不要とする「前頭葉不要論」と結びつき、意識理論の論争の焦点となった。 出典：Koch et al. (2016)『Nature Reviews Neuroscience』 DOI: 10.1038/nrn.2016.22"},{"name":"ジェラルド・エーデルマン","chapter":"c2-脳のネットワーク","sub":0,"subCount":7,"tags":["science","theory"],"birth":1929,"death":2014,"href":"https://note.com/search?q=from%3A%40varelser%20%E3%82%B8%E3%82%A7%E3%83%A9%E3%83%AB%E3%83%89%E3%83%BB%E3%82%A8%E3%83%BC%E3%83%87%E3%83%AB%E3%83%9E%E3%83%B3&context=note&mode=search","article":false,"descRaw":"（米・1929–2014）：米国の生物学者。抗体の化学構造の解明で1972年にノーベル生理学・医学賞を受賞した後、脳の研究へ転じた。1987年の著書『Neural Darwinism』で、神経細胞群の選択と再入力（リエントリー）によって脳が形成される「神経ダーウィニズム」を提唱した。トノーニとの共著『A Universe of Consciousness』（2000）では意識を動的なコアの活動として論じ、統合情報理論の源流となった。"},{"name":"マーク・ソルムズ","chapter":"c2-脳のネットワーク","sub":0,"subCount":7,"tags":["science","theory"],"birth":1961,"death":null,"href":"https://note.com/search?q=from%3A%40varelser%20%E3%83%9E%E3%83%BC%E3%82%AF%E3%83%BB%E3%82%BD%E3%83%AB%E3%83%A0%E3%82%BA&context=note&mode=search","article":false,"descRaw":"（南ア・1961–）：南アフリカの神経心理学者・精神分析家。ケープタウン大学教授で、神経精神分析の創始者の一人。夢の前脳メカニズムの発見で知られ、レム睡眠がなくても夢を見ることを示した。2021年の著書『The Hidden Spring』では、意識は大脳皮質ではなく脳幹に由来する感情的なもので、「私たちは考える機械が感じるのではなく、感じる機械が考える」と論じ、フロイトのイドを意識の源泉として再評価した。"},{"name":"マイケル・ガザニガ","chapter":"c2-脳のネットワーク","sub":0,"subCount":7,"tags":["science","theory"],"birth":1939,"death":null,"href":"https://note.com/search?q=from%3A%40varelser%20%E3%83%9E%E3%82%A4%E3%82%B1%E3%83%AB%E3%83%BB%E3%82%AC%E3%82%B6%E3%83%8B%E3%82%AC&context=note&mode=search","article":false,"descRaw":"（米・1939–）：米国の認知神経科学者マイケル・ガザニガ（1939〜）。ロジャー・スペリーのもとで分離脳患者の研究を始め、脳梁を切断された患者の左右半球が別々に機能することを示した。左半球が行動の理由を事後的に「解釈」する「インタープリター」理論を提唱し、統一的な自己感が脳の構築物であることを示した。認知神経科学の創始者の一人。"},{"name":"トリプルネットワーク理論（メノン, 2011）","chapter":"c2-脳のネットワーク","sub":1,"subCount":7,"tags":["science","theory"],"birth":null,"death":null,"href":"https://note.com/search?q=from%3A%40varelser%20%E3%83%88%E3%83%AA%E3%83%97%E3%83%AB%E3%83%8D%E3%83%83%E3%83%88%E3%83%AF%E3%83%BC%E3%82%AF%E7%90%86%E8%AB%96%EF%BC%88%E3%83%A1%E3%83%8E%E3%83%B3%2C%202011%EF%BC%89&context=note&mode=search","article":false,"descRaw":"：スタンフォード大学のヴィノド・メノンが2011年に『Trends in Cognitive Sciences』で提唱したモデル。デフォルトモード・ネットワーク（DMN）、セントラル・エグゼクティブ・ネットワーク（CEN）、サリエンス・ネットワーク（SN）の三つの大規模ネットワークの動的相互作用で認知と精神病理を説明する。SNは前部島皮質と背側前帯状皮質を中核とし、内外の処理の切替を担う。うつ病・統合失調症・PTSDなどで三者のバランスの崩壊が報告され、変性意識状態の理解にも用いられる。 出典：Menon (2011)『Trends in Cognitive Sciences』 DOI: 10.1016/j.tics.2011.08.003"},{"name":"サリエンスネットワーク（SN）と意識の切替","chapter":"c2-脳のネットワーク","sub":1,"subCount":7,"tags":["science","theory"],"birth":null,"death":null,"href":"https://note.com/search?q=from%3A%40varelser%20%E3%82%B5%E3%83%AA%E3%82%A8%E3%83%B3%E3%82%B9%E3%83%8D%E3%83%83%E3%83%88%E3%83%AF%E3%83%BC%E3%82%AF%EF%BC%88SN%EF%BC%89%E3%81%A8%E6%84%8F%E8%AD%98%E3%81%AE%E5%88%87%E6%9B%BF&context=note&mode=search","article":false,"descRaw":"：前部島皮質と背側前帯状皮質を中核とする大規模脳ネットワーク。内外からの刺激のうち重要（サリエント）なものを検出し、デフォルトモード・ネットワークとセントラル・エグゼクティブ・ネットワークの切替ゲートとして働く。シーらが2007年に同定し、メノンのトリプルネットワーク理論では切替の要と位置づけられた。瞑想やサイケデリクスでSNの機能が変わると、自己感や注意の向け先の質的変化が生じると考えられている。"},{"name":"機能的結合性研究（FCS）とサイケデリクス","chapter":"c2-脳のネットワーク","sub":1,"subCount":7,"tags":["science","substance"],"birth":null,"death":null,"href":"https://note.com/search?q=from%3A%40varelser%20%E6%A9%9F%E8%83%BD%E7%9A%84%E7%B5%90%E5%90%88%E6%80%A7%E7%A0%94%E7%A9%B6%EF%BC%88FCS%EF%BC%89%E3%81%A8%E3%82%B5%E3%82%A4%E3%82%B1%E3%83%87%E3%83%AA%E3%82%AF%E3%82%B9&context=note&mode=search","article":false,"descRaw":"：サイケデリクス投与下の機能的結合性（functional connectivity）の変化を調べる研究。DMN内部の結合性が低下する一方で、通常は結ばれないネットワーク間の結合が増大し、脳全体の結合パターンが拡散することが報告されている。タリアズッキら（2016）はLSD下での全脳的な機能的結合の増大が自我溶解の強さと相関することを示した。脳のモジュール構造が緩むことが、変性意識の柔軟で連合的な体験の基盤とする解釈を支える。"},{"name":"コネクトーム研究と意識（ヒューマン・コネクトーム・プロジェクト）","chapter":"c2-脳のネットワーク","sub":1,"subCount":7,"tags":["science","tech","theory"],"birth":null,"death":null,"href":"https://note.com/search?q=from%3A%40varelser%20%E3%82%B3%E3%83%8D%E3%82%AF%E3%83%88%E3%83%BC%E3%83%A0%E7%A0%94%E7%A9%B6%E3%81%A8%E6%84%8F%E8%AD%98%EF%BC%88%E3%83%92%E3%83%A5%E3%83%BC%E3%83%9E%E3%83%B3%E3%83%BB%E3%82%B3%E3%83%8D%E3%82%AF%E3%83%88%E3%83%BC%E3%83%A0%E3%83%BB%E3%83%97%E3%83%AD%E3%82%B8%E3%82%A7%E3%82%AF%E3%83%88%EF%BC%89&context=note&mode=search","article":false,"descRaw":"：脳の構造的・機能的結合の全体地図（コネクトーム）を描く研究。米国NIHが2010年に開始したヒューマン・コネクトーム・プロジェクトは、多数の被験者の拡散MRIと安静時fMRIから高解像度の結合地図を構築した。意識状態の変化に伴い、コネクトームのハブ構造やモジュール性が再編されることが示され、睡眠・麻酔・瞑想・サイケデリクス下の脳をネットワークのトポロジー変化として比較する基盤となった。"},{"name":"リッチクラブ構造と意識統合","chapter":"c2-脳のネットワーク","sub":1,"subCount":7,"tags":["science","theory"],"birth":null,"death":null,"href":"https://note.com/varelser/n/n68c48cc49468","article":true,"descRaw":"：脳の高次ハブ領域どうしが互いに密に結びついた「リッチクラブ」構造。ファン・デン・ホイフェルとスポーンズが2011年にヒトのコネクトームで報告し、高度に接続された領域群が全脳の情報統合の中核を担うとした。変性意識状態ではリッチクラブ間の結合が変化し、通常の統合様式が緩むことが報告されている。意識の統合と分離のバランスをネットワークの階層構造から捉える概念として、統合情報理論などとも関連づけられる。"},{"name":"小世界ネットワークとスケールフリー性","chapter":"c2-脳のネットワーク","sub":1,"subCount":7,"tags":["science","theory","substance"],"birth":null,"death":null,"href":"https://note.com/search?q=from%3A%40varelser%20%E5%B0%8F%E4%B8%96%E7%95%8C%E3%83%8D%E3%83%83%E3%83%88%E3%83%AF%E3%83%BC%E3%82%AF%E3%81%A8%E3%82%B9%E3%82%B1%E3%83%BC%E3%83%AB%E3%83%95%E3%83%AA%E3%83%BC%E6%80%A7&context=note&mode=search","article":false,"descRaw":"：脳ネットワークが高いクラスタリング（局所の密な結合）と短い平均経路長を併せもつ「小世界」特性を示すこと。ワッツとストロガッツが1998年に『Nature』で定式化した小世界モデルを、ブルモアとスポーンズらが脳に適用した。効率的な情報伝達と局所処理の両立を可能にする構造で、サイケデリクス下ではこのトポロジーがランダム化方向へ変化し、局所性が弱まるとの報告がある。スケールフリー性と合わせて脳のネットワーク設計を記述する。"},{"name":"視床皮質ネットワークと意識の門番機能","chapter":"c2-脳のネットワーク","sub":1,"subCount":7,"tags":["science","theory","dream"],"birth":null,"death":null,"href":"https://note.com/varelser/n/nf700c2724b9e","article":true,"descRaw":"：視床が感覚情報を皮質へ中継する際のゲート（門番）として働く仕組み。視床-皮質ループの結合状態が、感覚入力が意識に上るかどうかを左右する。麻酔や深い睡眠では視床-皮質の機能的結合が低下し、覚醒とともに回復する。サイケデリクスでは視床のフィルタリングが緩み、通常は遮断される情報が皮質へ流入するとの解釈があり、ハクスリーの「減圧弁」や感覚ゲート仮説の神経科学的な対応物として論じられる。"},{"name":"自己組織化臨界（SOC）と脳（ベッグス & プレンツ, 2003）","chapter":"c2-脳のネットワーク","sub":2,"subCount":7,"tags":["science","theory"],"birth":null,"death":null,"href":"https://note.com/search?q=from%3A%40varelser%20%E8%87%AA%E5%B7%B1%E7%B5%84%E7%B9%94%E5%8C%96%E8%87%A8%E7%95%8C%EF%BC%88SOC%EF%BC%89%E3%81%A8%E8%84%B3%EF%BC%88%E3%83%99%E3%83%83%E3%82%B0%E3%82%B9%20%26%20%E3%83%97%E3%83%AC%E3%83%B3%E3%83%84%2C%202003%EF%BC%89&context=note&mode=search","article":false,"descRaw":"：脳が秩序と無秩序のあいだの臨界点で動作するという仮説。ジョン・ベッグスとディートマー・プレンツが2003年に『Journal of Neuroscience』で、ラット皮質切片の自発活動が「ニューロナル・アバランシェ」（神経雪崩）として伝播し、その規模分布が指数-3/2のベキ則に従うことを示した。分岐パラメータが臨界値1に近いとき情報伝達が最適化される。サイケデリクスが脳を臨界点へ近づけるとの指摘もあり、変性意識の動態論の基盤となった。 出典：Beggs & Plenz (2003)『The Journal of Neuroscience』 DOI: 10.1523/JNEUROSCI.23-35-11167.2003"},{"name":"相転移理論と意識状態遷移","chapter":"c2-脳のネットワーク","sub":2,"subCount":7,"tags":["theory","science","substance"],"birth":null,"death":null,"href":"https://note.com/search?q=from%3A%40varelser%20%E7%9B%B8%E8%BB%A2%E7%A7%BB%E7%90%86%E8%AB%96%E3%81%A8%E6%84%8F%E8%AD%98%E7%8A%B6%E6%85%8B%E9%81%B7%E7%A7%BB&context=note&mode=search","article":false,"descRaw":"：意識状態の変化を、物理系の相転移（水が氷になるような秩序-無秩序転移）のアナロジーで記述する立場。覚醒・睡眠・麻酔・サイケデリクス状態を、脳の動態の異なる「相」とみなし、状態間の遷移を臨界点での急激な切り替えとして捉える。自己組織化臨界やエントロピック・ブレイン仮説と親和性が高く、意識レベルの定量的指標の変化を相転移の枠組みで解釈する試みもある。比喩の域を出ないとの批判もあるが、意識研究のモデル言語として広く使われる。"},{"name":"メタスタビリティと意識（ケルソー, 1995〜）","chapter":"c2-脳のネットワーク","sub":2,"subCount":7,"tags":["theory","science"],"birth":null,"death":null,"href":"https://note.com/search?q=from%3A%40varelser%20%E3%83%A1%E3%82%BF%E3%82%B9%E3%82%BF%E3%83%93%E3%83%AA%E3%83%86%E3%82%A3%E3%81%A8%E6%84%8F%E8%AD%98%EF%BC%88%E3%82%B1%E3%83%AB%E3%82%BD%E3%83%BC%2C%201995%E3%80%9C%EF%BC%89&context=note&mode=search","article":false,"descRaw":"：J.A.スコット・ケルソーが1995年の著書『Dynamic Patterns』で展開した協調動態（コーディネーション・ダイナミクス）の概念。脳の神経集団は完全に同期することも完全に独立することもなく、安定状態のあいだを漂い続ける「準安定」な動態を示す。統合と分離の両傾向が共存することで、意識は柔軟さと安定性を両立できると考える。指の協調運動のHKBモデルに起源をもち、後に大規模脳ネットワークの動態や変性意識の結合様式の変化の説明にも応用された。"},{"name":"アトラクタ・ダイナミクスと意識の景観モデル","chapter":"c2-脳のネットワーク","sub":2,"subCount":7,"tags":["theory","science"],"birth":null,"death":null,"href":"https://note.com/search?q=from%3A%40varelser%20%E3%82%A2%E3%83%88%E3%83%A9%E3%82%AF%E3%82%BF%E3%83%BB%E3%83%80%E3%82%A4%E3%83%8A%E3%83%9F%E3%82%AF%E3%82%B9%E3%81%A8%E6%84%8F%E8%AD%98%E3%81%AE%E6%99%AF%E8%A6%B3%E3%83%A2%E3%83%87%E3%83%AB&context=note&mode=search","article":false,"descRaw":"：意識状態をエネルギー地形上のアトラクタ（安定点やその盆地）として記述するモデル。脳の動態は特定の活動パターンへ引き込まれ、そこに留まる。変性意識は、アトラクタ盆地の形状が変わったり、盆地間の遷移が起きたりすることとして理論化される。うつ病の反芻を深いアトラクタ盆地、サイケデリクスを地形の平坦化（REBUSモデルの自由エネルギー地形の比喩）とみる解釈と通じ、意識状態の遷移を力学系の言葉で捉える枠組みである。"},{"name":"脳エントロピーと意識レベル（カシリオら, 2013）","chapter":"c2-脳のネットワーク","sub":2,"subCount":7,"tags":["science","clinical"],"birth":null,"death":null,"href":"https://note.com/search?q=from%3A%40varelser%20%E8%84%B3%E3%82%A8%E3%83%B3%E3%83%88%E3%83%AD%E3%83%94%E3%83%BC%E3%81%A8%E6%84%8F%E8%AD%98%E3%83%AC%E3%83%99%E3%83%AB%EF%BC%88%E3%82%AB%E3%82%B7%E3%83%AA%E3%82%AA%E3%82%89%2C%202013%EF%BC%89&context=note&mode=search","article":false,"descRaw":"：意識のレベルを脳活動の複雑性・無秩序さで定量化する研究。カシリオとマッシミーニらは2013年に『Science Translational Medicine』で、TMSで皮質を刺激した際のEEG応答の複雑性を測る摂動複雑性指標（PCI）を発表した。覚醒時にはPCIが高く、ノンレム睡眠や麻酔、植物状態では低下し、最小意識状態や閉じ込め症候群では保たれる。統合情報理論のΦの実用的な代理指標とされ、意識レベルの客観評価として臨床応用が進む。 出典：Casali et al. (2013)『Science Translational Medicine』 DOI: 10.1126/scitranslmed.3006294"},{"name":"カオス理論と脳のダイナミクス（フリーマン）","chapter":"c2-脳のネットワーク","sub":2,"subCount":7,"tags":["theory","science"],"birth":null,"death":null,"href":"https://note.com/search?q=from%3A%40varelser%20%E3%82%AB%E3%82%AA%E3%82%B9%E7%90%86%E8%AB%96%E3%81%A8%E8%84%B3%E3%81%AE%E3%83%80%E3%82%A4%E3%83%8A%E3%83%9F%E3%82%AF%E3%82%B9%EF%BC%88%E3%83%95%E3%83%AA%E3%83%BC%E3%83%9E%E3%83%B3%EF%BC%89&context=note&mode=search","article":false,"descRaw":"：ウォルター・フリーマンが嗅覚系の研究から展開した脳のカオス動態論。ウサギの嗅球のEEGを解析し、知覚時に神経集団がカオス的なアトラクタ間を遷移することを示した。著書『Mass Action in the Nervous System』（1975）に始まる一連の研究で、決定論的カオスが脳の柔軟性と創造性に寄与すると論じた。カオスは無秩序ではなく、初期条件に敏感で豊かな動態を生む秩序であり、変性意識の非線形な状態遷移を理解する視点を与えた。"},{"name":"創発理論と意識","chapter":"c2-脳のネットワーク","sub":2,"subCount":7,"tags":["theory"],"birth":null,"death":null,"href":"https://note.com/search?q=from%3A%40varelser%20%E5%89%B5%E7%99%BA%E7%90%86%E8%AB%96%E3%81%A8%E6%84%8F%E8%AD%98&context=note&mode=search","article":false,"descRaw":"：意識を、脳の構成要素には還元できない創発的な性質として位置づける理論的立場。神経細胞の活動からは予測できない質が、システム全体の相互作用から生じると考える。「弱い創発」は原理的には構成要素から説明可能だが実際には予測困難なもの、「強い創発」は構成要素の法則からは原理的に導けないものと区別される。意識の「難しい問題」と結びつき、還元主義への対抗軸として、複雑系・非線形科学とともに変性意識研究の哲学的背景をなす。"},{"name":"フラクタル構造と神経活動のスケーリング則","chapter":"c2-脳のネットワーク","sub":2,"subCount":7,"tags":["science","theory"],"birth":null,"death":null,"href":"https://note.com/search?q=from%3A%40varelser%20%E3%83%95%E3%83%A9%E3%82%AF%E3%82%BF%E3%83%AB%E6%A7%8B%E9%80%A0%E3%81%A8%E7%A5%9E%E7%B5%8C%E6%B4%BB%E5%8B%95%E3%81%AE%E3%82%B9%E3%82%B1%E3%83%BC%E3%83%AA%E3%83%B3%E3%82%B0%E5%89%87&context=note&mode=search","article":false,"descRaw":"：脳活動が時間的・空間的にフラクタル性（自己相似性）を示すこと。脳波の振幅変動は1/fゆらぎと呼ばれるベキ則的な時間構造をもち、リンケンケア＝ハンセンら（2001）がその長距離時間相関を報告した。意識状態によってフラクタル次元やスケーリング指数が変化し、瞑想や睡眠、サイケデリクス下での変化が調べられている。臨界性や自己組織化臨界とも関連し、脳の動態が複数の時間スケールにわたって組織化されていることを示す指標である。"},{"name":"ロビン・カーハート＝ハリス","chapter":"c2-脳のネットワーク","sub":3,"subCount":7,"tags":["science","substance","theory"],"birth":1980,"death":null,"href":"https://note.com/search?q=from%3A%40varelser%20%E3%83%AD%E3%83%93%E3%83%B3%E3%83%BB%E3%82%AB%E3%83%BC%E3%83%8F%E3%83%BC%E3%83%88%EF%BC%9D%E3%83%8F%E3%83%AA%E3%82%B9&context=note&mode=search","article":false,"descRaw":"（Robin Carhart-Harris・1980–）：イギリスの神経科学者で、サイケデリック研究の最前線に立つ人物。インペリアル・カレッジ・ロンドンでシロシビンの脳画像研究を主導し、デフォルト・モード・ネットワークの抑制と自我溶解を結びつけるREBUSモデルを提唱した。脳の信念の緩みとして変性意識を説明する枠組みを与えた。うつ病へのシロシビン療法の臨床試験でも中心的な役割を果たした。"},{"name":"マシュー・ナウア","chapter":"c2-脳のネットワーク","sub":3,"subCount":7,"tags":["science","substance"],"birth":null,"death":null,"href":"https://note.com/search?q=from%3A%40varelser%20%E3%83%9E%E3%82%B7%E3%83%A5%E3%83%BC%E3%83%BB%E3%83%8A%E3%82%A6%E3%82%A2&context=note&mode=search","article":false,"descRaw":"（Matthew Nour）：イギリスの心理学者・神経科学者。自我溶解（Ego Dissolution）を測る尺度EDI（Ego-Dissolution Inventory）を2016年に開発し、サイケデリック体験における自我の境界の溶解を定量化した。インペリアル・カレッジ・ロンドンでの研究は、神秘体験や合一感を科学的に測る基盤となった。"},{"name":"アニル・セス","chapter":"c2-脳のネットワーク","sub":3,"subCount":7,"tags":["science","theory"],"birth":1972,"death":null,"href":"https://note.com/varelser/n/na7d3d03eda43","article":true,"descRaw":"（1972–）：イギリスの神経科学者でサセックス大学教授。予測的処理の観点から意識を解明し、知覚を「制御された幻覚」と捉える立場で知られる。『Being You』（2021）で意識の神経科学を一般読者に伝え、身体と予測がつくる自己意識の理論を展開した。サックラー意識科学センターの共同所長も務めた。著書や講演で意識科学を広く一般に伝えている。"},{"name":"ローランド・グリフィス","chapter":"c2-脳のネットワーク","sub":3,"subCount":7,"tags":["science","substance","religion"],"birth":1946,"death":2023,"href":"https://note.com/search?q=from%3A%40varelser%20%E3%83%AD%E3%83%BC%E3%83%A9%E3%83%B3%E3%83%89%E3%83%BB%E3%82%B0%E3%83%AA%E3%83%95%E3%82%A3%E3%82%B9&context=note&mode=search","article":false,"descRaw":"（Roland R. Griffiths・1946–2023）：アメリカの心理学者で、ジョンズ・ホプキンス大学のシロシビン研究を主導した。2006年の論文で、シロシビンが神秘体験を引き起こし、長期的な人格変容（開放性の上昇）をもたらすと実証し、現代のサイケデリック・ルネサンスの出発点となった。うつ病や依存症への応用研究も進めた。がん患者の不安や依存症への応用研究も主導した。"},{"name":"デイヴィッド・ナット","chapter":"c2-脳のネットワーク","sub":3,"subCount":7,"tags":["science","substance","policy"],"birth":1951,"death":null,"href":"https://note.com/search?q=from%3A%40varelser%20%E3%83%87%E3%82%A4%E3%83%B4%E3%82%A3%E3%83%83%E3%83%89%E3%83%BB%E3%83%8A%E3%83%83%E3%83%88&context=note&mode=search","article":false,"descRaw":"（David Nutt・1951–）：イギリスの神経精神薬理学者でインペリアル・カレッジ・ロンドン教授。薬物の有害性を科学的に順位づけた2010年のランセット論文で知られ、薬物政策をめぐる議論で政府の諮問職を解任された経緯がある。『Drugs Without the Hot Air』（2012）で薬理学と政策の橋渡しを続ける。薬物政策の科学的根拠を訴え続けている。"},{"name":"リチャード・デヴィッドソン","chapter":"c2-脳のネットワーク","sub":3,"subCount":7,"tags":["science","practice"],"birth":1951,"death":null,"href":"https://note.com/search?q=from%3A%40varelser%20%E3%83%AA%E3%83%81%E3%83%A3%E3%83%BC%E3%83%89%E3%83%BB%E3%83%87%E3%83%B4%E3%82%A3%E3%83%83%E3%83%89%E3%82%BD%E3%83%B3&context=note&mode=search","article":false,"descRaw":"（Richard J. Davidson・1951–）：アメリカの神経科学者でウィスコンシン大学教授。瞑想が脳に可塑的な変化をもたらすことを実証し、ダライ・ラマらチベット仏教の修行者との共同研究で知られる。感情のスタイルやウェルビーイングの神経基盤を追究し、瞑想を変性意識の科学的対象として確立した。感情の脳基盤を測る研究で、ウェルビーイングの科学を切り開いた。"},{"name":"カール・フリストン","chapter":"c2-脳のネットワーク","sub":3,"subCount":7,"tags":["science","theory"],"birth":1959,"death":null,"href":"https://note.com/varelser/n/n136938689f25","article":true,"descRaw":"（Karl Friston・1959–）：イギリスの神経科学者でユニヴァーシティ・カレッジ・ロンドン教授。脳は感覚入力を予測し誤差を最小化するという自由エネルギー原理と予測処理の理論を提唱した。カーハート＝ハリスのREBUSモデルにも影響を与え、変性意識を脳の予測モデルの緩みとして理解する枠組みの源流となった。脳画像解析の統計手法の開発でも知られる。"},{"name":"アントニオ・ダマシオ","chapter":"c2-脳のネットワーク","sub":3,"subCount":7,"tags":["science","theory"],"birth":1944,"death":null,"href":"https://note.com/varelser/n/nf83a06785a1e","article":true,"descRaw":"（Antonio Damasio・1944–）：ポルトガル生まれの神経科学者で南カリフォルニア大学教授。『デカルトの誤り』（1994）で、情動が理性的判断に不可欠だとする身体マーカー仮説を提唱した。フィネアス・ゲイジの症例研究などを通じ、感情と意識が身体に根ざすことを示し、変性意識の身体的基盤を照らした。感情と身体、意識の関係をめぐる著作は広く読まれている。"},{"name":"マーカス・ライヒル","chapter":"c2-脳のネットワーク","sub":3,"subCount":7,"tags":["science"],"birth":1937,"death":null,"href":"https://note.com/varelser/n/n8d163aa2318d","article":true,"descRaw":"（Marcus Raichle・1937–）：アメリカの神経科学者でワシントン大学教授。安静時に活動する脳領域のネットワーク、デフォルト・モード・ネットワーク（DMN）を2001年の論文で発見した。DMNの抑制が自我溶解や瞑想・サイケデリック体験と結びつくことが後に示され、変性意識の神経基盤の鍵となった。脳のエネルギー消費の研究でも、安静時活動の重要性を示した。"},{"name":"ジュリオ・トノーニ","chapter":"c2-脳のネットワーク","sub":3,"subCount":7,"tags":["science","theory"],"birth":1960,"death":null,"href":"https://note.com/search?q=from%3A%40varelser%20%E3%82%B8%E3%83%A5%E3%83%AA%E3%82%AA%E3%83%BB%E3%83%88%E3%83%8E%E3%83%BC%E3%83%8B&context=note&mode=search","article":false,"descRaw":"（Giulio Tononi・1960–）：イタリア生まれの神経科学者でウィスコンシン大学教授。意識を統合された情報の量（Φ）で測る統合情報理論（IIT）を提唱した。『Phi』（2012）などで、意識の有無と質を数学的に記述する試みを展開し、睡眠・麻酔・サイケデリック状態の比較研究にも応用されている。睡眠中の意識の消失をIITで説明する研究も進めている。"},{"name":"バーナード・バーズ","chapter":"c2-脳のネットワーク","sub":3,"subCount":7,"tags":["science","theory"],"birth":1946,"death":null,"href":"https://note.com/search?q=from%3A%40varelser%20%E3%83%90%E3%83%BC%E3%83%8A%E3%83%BC%E3%83%89%E3%83%BB%E3%83%90%E3%83%BC%E3%82%BA&context=note&mode=search","article":false,"descRaw":"（Bernard Baars・1946–）：アメリカの心理学者。意識を脳全体へ情報を放送するグローバル・ワークスペースとして説明する理論を『A Cognitive Theory of Consciousness』（1988）で提唱した。意識にのぼる情報とそうでない情報の違いを実験的に追究する枠組みとなり、ドゥアンヌらの神経科学的研究の出発点となった。"},{"name":"ジャック・パンクセップ","chapter":"c2-脳のネットワーク","sub":3,"subCount":7,"tags":["science","theory"],"birth":1943,"death":2017,"href":"https://note.com/search?q=from%3A%40varelser%20%E3%82%B8%E3%83%A3%E3%83%83%E3%82%AF%E3%83%BB%E3%83%91%E3%83%B3%E3%82%AF%E3%82%BB%E3%83%83%E3%83%97&context=note&mode=search","article":false,"descRaw":"（Jaak Panksepp・1943–2017）：エストニア生まれの神経科学者で情動神経科学の創始者。『Affective Neuroscience』（1998）で、哺乳類に共通する七つの基本情動システム（探索・怒り・恐怖・性欲・世話・悲嘆・遊び）を提唱した。ラットの50kHz超音波発声を笑いと結びつける研究など、情動の生物学的基盤を拓いた。情動の神経科学は精神医学にも応用されている。"},{"name":"マシュー・ウォーカー","chapter":"c2-脳のネットワーク","sub":3,"subCount":7,"tags":["science","dream"],"birth":1973,"death":null,"href":"https://note.com/search?q=from%3A%40varelser%20%E3%83%9E%E3%82%B7%E3%83%A5%E3%83%BC%E3%83%BB%E3%82%A6%E3%82%A9%E3%83%BC%E3%82%AB%E3%83%BC&context=note&mode=search","article":false,"descRaw":"（Matthew Walker・1973–）：イギリスの神経科学者でカリフォルニア大学バークレー校教授。『Why We Sleep』（2017）の著者で、睡眠と記憶の定着、夢による情動処理、睡眠不足が心身に及ぼす害を実証的に示した。睡眠研究センターを率い、REM睡眠と夢を変性意識の中心テーマとして科学的に語った第一人者である。睡眠の啓蒙活動でも知られ、講演や著作で睡眠の重要性を訴える。"},{"name":"スティーブン・ラバージュ","chapter":"c2-脳のネットワーク","sub":3,"subCount":7,"tags":["science","dream","practice"],"birth":1947,"death":null,"href":"https://note.com/search?q=from%3A%40varelser%20%E3%82%B9%E3%83%86%E3%82%A3%E3%83%BC%E3%83%96%E3%83%B3%E3%83%BB%E3%83%A9%E3%83%90%E3%83%BC%E3%82%B8%E3%83%A5&context=note&mode=search","article":false,"descRaw":"（Stephen LaBerge・1947–）：アメリカの心理学者で明晰夢研究の開拓者。スタンフォード大学で、夢のなかで眼球を動かす合図により、夢を見ている最中の意識的な気づきを客観的に実証した。『Lucid Dreaming』（1985）やMILD法などの訓練法で、夢を意図的に探索できる変性意識として確立した。明晰夢の訓練法は、悪夢の治療にも応用されている。"},{"name":"アーノルド・ミンデル","chapter":"c2-脳のネットワーク","sub":3,"subCount":7,"tags":["theory","practice","dream"],"birth":1940,"death":2024,"href":"https://note.com/search?q=from%3A%40varelser%20%E3%82%A2%E3%83%BC%E3%83%8E%E3%83%AB%E3%83%89%E3%83%BB%E3%83%9F%E3%83%B3%E3%83%87%E3%83%AB&context=note&mode=search","article":false,"descRaw":"（Arnold Mindell・1940–2024）：アメリカの心理学者でプロセス指向心理学（プロセスワーク）の創始者。夢・身体症状・対人葛藤・社会問題を一つの意識フィールドの表れと捉え、夢の身体（ドリームボディ）の概念を提唱した。『Dreambody』（1982）などの著作で、日常と夢の境界を越える実践を体系化した。紛争解決や組織開発にもプロセスワークは応用されている。"},{"name":"オリバー・サックス","chapter":"c2-脳のネットワーク","sub":3,"subCount":7,"tags":["science","clinical"],"birth":1933,"death":2015,"href":"https://note.com/search?q=from%3A%40varelser%20%E3%82%AA%E3%83%AA%E3%83%90%E3%83%BC%E3%83%BB%E3%82%B5%E3%83%83%E3%82%AF%E3%82%B9&context=note&mode=search","article":false,"descRaw":"（英-米・1933–2015）：イギリス生まれの神経学者・著述家。『妻を帽子とまちがえた男』（1985）で神経学的症例を文学的に描き、『幻覚の脳科学』（2012）では偏頭痛や音楽性幻覚など、知覚の変容と幻覚の多様な姿を記録した。脳の障害が意識の境界をいかに変えるかを示す臨床の語り手だった。著書は世界中で愛読され、神経学の魅力を広く伝えた。"},{"name":"V.S.ラマチャンドラン","chapter":"c2-脳のネットワーク","sub":3,"subCount":7,"tags":["science"],"birth":1951,"death":null,"href":"https://note.com/search?q=from%3A%40varelser%20V.S.%E3%83%A9%E3%83%9E%E3%83%81%E3%83%A3%E3%83%B3%E3%83%89%E3%83%A9%E3%83%B3&context=note&mode=search","article":false,"descRaw":"（印-米・1951–）：インド生まれの神経科学者でカリフォルニア大学サンディエゴ校教授。幻肢痛のミラーボックス療法や共感覚の研究で知られ、身体イメージの可塑性を実証した。『脳のなかの幽霊』（1998）で、知覚が脳による能動的な構成物であることを示し、変性意識の神経基盤を照らした。視覚の錯覚や身体認識をめぐる独創的な実験でも知られる。"},{"name":"リック・ストラスマン","chapter":"c2-脳のネットワーク","sub":3,"subCount":7,"tags":["science","substance","clinical"],"birth":1952,"death":null,"href":"https://note.com/search?q=from%3A%40varelser%20%E3%83%AA%E3%83%83%E3%82%AF%E3%83%BB%E3%82%B9%E3%83%88%E3%83%A9%E3%82%B9%E3%83%9E%E3%83%B3&context=note&mode=search","article":false,"descRaw":"（Rick Strassman・1952–・米）：アメリカの精神科医。1990年代にニューメキシコ大学でDMT（ジメチルトリプタミン）のヒト臨床研究を再開し、60人の被験者に投与してその強烈な体験を記録した。『DMT: The Spirit Molecule』（2000）は、内因性の幻覚物質と神秘体験の関係をめぐる議論の起点となった。被験者の体験は、宗教的・霊的な色彩を帯びるものも多かった。"},{"name":"マシュー・ジョンソン","chapter":"c2-脳のネットワーク","sub":3,"subCount":7,"tags":["science","substance","clinical"],"birth":null,"death":null,"href":"https://note.com/search?q=from%3A%40varelser%20%E3%83%9E%E3%82%B7%E3%83%A5%E3%83%BC%E3%83%BB%E3%82%B8%E3%83%A7%E3%83%B3%E3%82%BD%E3%83%B3&context=note&mode=search","article":false,"descRaw":"（Matthew Johnson・米）：アメリカの精神科医で、ジョンズ・ホプキンス大学サイケデリック研究センターの所長を務める。シロシビンによるニコチン依存の治療研究（2014）や、うつ病・がんの苦悩への応用研究を主導した。2008年の安全ガイドライン策定にも関わり、現代のサイケデリック臨床研究の中心人物である。幻覚剤のリスクと可能性を科学的に論じる論客でもある。"},{"name":"チャールズ・タート","chapter":"c2-脳のネットワーク","sub":3,"subCount":7,"tags":["science","theory"],"birth":1937,"death":2025,"href":"https://note.com/varelser/n/n0721125adb15","article":true,"descRaw":"（Charles Tart・1937–2025・米）：アメリカの心理学者で、変性意識状態（ASC）研究の体系化者。『Altered States of Consciousness』（1969）は同分野の基本文献となり、瞑想・催眠・夢・薬物体験を一つの枠組みで捉えた。状態特異的科学の提唱やトランスパーソナル心理学の創設にも関わり、カリフォルニア大学デーヴィス校で長く教えた。"},{"name":"ジョン・アラン・ホブソン","chapter":"c2-脳のネットワーク","sub":3,"subCount":7,"tags":["science","dream","theory"],"birth":1933,"death":2021,"href":"https://note.com/search?q=from%3A%40varelser%20%E3%82%B8%E3%83%A7%E3%83%B3%E3%83%BB%E3%82%A2%E3%83%A9%E3%83%B3%E3%83%BB%E3%83%9B%E3%83%96%E3%82%BD%E3%83%B3&context=note&mode=search","article":false,"descRaw":"（J. Allan Hobson・1933–2021・米）：アメリカの精神科医・睡眠研究者。マッカーリーとともに夢の活性化-合成仮説（1977）を提唱し、夢を脳幹のランダムな活性化と前脳による合成として説明した。後のAIMモデルでは覚醒・睡眠・夢を意識の次元で位置づけ、夢の神経科学的説明の基礎を築いた。夢の内容を脳のランダムな信号として説明する立場は、フロイトの夢解釈への挑戦となった。"},{"name":"イアン・マクギルクリスト","chapter":"c2-脳のネットワーク","sub":3,"subCount":7,"tags":["science","theory"],"birth":1953,"death":null,"href":"https://note.com/varelser/n/n2403c8660166","article":true,"descRaw":"（Iain McGilchrist・1953–・英）：イギリスの精神科医・著述家。『The Master and His Emissary』（2009）で、左右の大脳半球が異なる注意様式と世界への関わり方をもたらすと論じた。右半球的な注意が、全体性や暗黙の意味への開かれとして変性意識と結びつくという視点は、意識の質的差異をめぐる議論に大きな影響を与えた。"},{"name":"スタンレー・クリップナー","chapter":"c2-脳のネットワーク","sub":3,"subCount":7,"tags":["science","dream","religion"],"birth":1932,"death":null,"href":"https://note.com/search?q=from%3A%40varelser%20%E3%82%B9%E3%82%BF%E3%83%B3%E3%83%AC%E3%83%BC%E3%83%BB%E3%82%AF%E3%83%AA%E3%83%83%E3%83%97%E3%83%8A%E3%83%BC&context=note&mode=search","article":false,"descRaw":"（Stanley Krippner・1932–・米）：アメリカの心理学者で、夢と意識研究の先駆者。1960〜70年代にマイモニデス医療センターでウルマンらと夢テレパシー実験を行い、夢の超心理学的研究を主導した。シャーマニズムやサイケデリクス、創造性の心理学を統合的に論じ、セイブルック大学で長く教えた。サイケデリックやシャーマニズムの比較研究でも知られ、多数の著作を残した。"},{"name":"ジェームズ・ファディマン","chapter":"c2-脳のネットワーク","sub":3,"subCount":7,"tags":["science","substance"],"birth":1939,"death":null,"href":"https://note.com/search?q=from%3A%40varelser%20%E3%82%B8%E3%82%A7%E3%83%BC%E3%83%A0%E3%82%BA%E3%83%BB%E3%83%95%E3%82%A1%E3%83%87%E3%82%A3%E3%83%9E%E3%83%B3&context=note&mode=search","article":false,"descRaw":"（James Fadiman・1939–・米）：アメリカの心理学者でマイクロドージング研究の先駆者。1960年代にサイケデリクスの創造性への影響を研究し、後に少用量の定期的服用に関する匿名調査を集めた。『サイケデリック・エクスプローラーズ・ガイド』（2011）で、安全な探索のための実践的な指針を示した。創造性研究の草分けとして、1960年代から幻覚剤の可能性を探ってきた。"},{"name":"マイケル・ポラン","chapter":"c2-脳のネットワーク","sub":3,"subCount":7,"tags":["substance","science"],"birth":1955,"death":null,"href":"https://note.com/search?q=from%3A%40varelser%20%E3%83%9E%E3%82%A4%E3%82%B1%E3%83%AB%E3%83%BB%E3%83%9D%E3%83%A9%E3%83%B3&context=note&mode=search","article":false,"descRaw":"（Michael Pollan・1955–・米）：アメリカのジャーナリスト・著述家。『幻覚剤は役に立つのか（How to Change Your Mind）』（2018）で、グリフィスやジョンソンらのシロシビン研究をはじめとするサイケデリック・ルネサンスを一般読者に広く伝えた。食や園芸の著作でも知られ、意識変容の科学を社会に可視化した立役者である。"},{"name":"フランシス・クリック","chapter":"c2-脳のネットワーク","sub":3,"subCount":7,"tags":["science","theory"],"birth":1916,"death":2004,"href":"https://note.com/search?q=from%3A%40varelser%20%E3%83%95%E3%83%A9%E3%83%B3%E3%82%B7%E3%82%B9%E3%83%BB%E3%82%AF%E3%83%AA%E3%83%83%E3%82%AF&context=note&mode=search","article":false,"descRaw":"（Francis Crick，1916–2004）：イギリスの分子生物学者。ワトソンとともにDNA二重らせん構造を1953年に解明し、ノーベル賞を受けた。晩年は意識研究に転じ、コッホとともに意識の神経相関（NCC）という研究プログラムを提唱した。『The Astonishing Hypothesis』（1994）で、意識を神経科学の問題として正面から論じた。"},{"name":"クリストフ・コッホ","chapter":"c2-脳のネットワーク","sub":3,"subCount":7,"tags":["science","theory"],"birth":1956,"death":null,"href":"https://note.com/search?q=from%3A%40varelser%20%E3%82%AF%E3%83%AA%E3%82%B9%E3%83%88%E3%83%95%E3%83%BB%E3%82%B3%E3%83%83%E3%83%9B&context=note&mode=search","article":false,"descRaw":"（Christof Koch，1956–）：ドイツ生まれの神経科学者。クリックとの共同研究で意識の神経相関（NCC）の探索を主導し、視覚意識の神経基盤を追究した。のちにアレン脳科学研究所の所長を務め、トノーニの統合情報理論（IIT）の擁護者となった。『The Quest for Consciousness』（2004）などの著書がある。意識研究の一般書も多数執筆している。"},{"name":"マイケル・グラツィアーノ","chapter":"c2-脳のネットワーク","sub":3,"subCount":7,"tags":["science","theory"],"birth":1967,"death":null,"href":"https://note.com/search?q=from%3A%40varelser%20%E3%83%9E%E3%82%A4%E3%82%B1%E3%83%AB%E3%83%BB%E3%82%B0%E3%83%A9%E3%83%84%E3%82%A3%E3%82%A2%E3%83%BC%E3%83%8E&context=note&mode=search","article":false,"descRaw":"（Michael Graziano，1967–）：アメリカの神経科学者でプリンストン大学教授。注意スキーマ理論を提唱し、脳が自らの注意についてつくる簡略化されたモデルが、「気づき」や「意識」という主観体験の正体だと論じた。『Consciousness and the Social Brain』（2013）で、意識を社会的認知の延長として説明した。意識の進化的起源についても論じている。"},{"name":"スタニスラス・ドゥアンヌ","chapter":"c2-脳のネットワーク","sub":3,"subCount":7,"tags":["science","theory"],"birth":1965,"death":null,"href":"https://note.com/search?q=from%3A%40varelser%20%E3%82%B9%E3%82%BF%E3%83%8B%E3%82%B9%E3%83%A9%E3%82%B9%E3%83%BB%E3%83%89%E3%82%A5%E3%82%A2%E3%83%B3%E3%83%8C&context=note&mode=search","article":false,"descRaw":"（Stanislas Dehaene，1965–）：フランスの認知神経科学者。バーズのグローバル・ワークスペース理論をもとに、グローバル・ニューロナル・ワークスペース理論を展開した。情報が脳全体へ放送されるとき意識にのぼるという過程を、視覚マスキング実験などで追究した。『Consciousness and the Brain』（2014）が代表作。読み書きや数の認知の研究でも知られる。"},{"name":"デイヴィッド・イーグルマン","chapter":"c2-脳のネットワーク","sub":3,"subCount":7,"tags":["science"],"birth":1971,"death":null,"href":"https://note.com/search?q=from%3A%40varelser%20%E3%83%87%E3%82%A4%E3%83%B4%E3%82%A3%E3%83%83%E3%83%89%E3%83%BB%E3%82%A4%E3%83%BC%E3%82%B0%E3%83%AB%E3%83%9E%E3%83%B3&context=note&mode=search","article":false,"descRaw":"（David Eagleman，1971–）：アメリカの神経科学者でスタンフォード大学教授。時間知覚や共感覚、脳可塑性の研究で知られ、高所からの自由落下実験で恐怖下の時間の歪みを検証した。『Incognito』（2011）『Livewired』（2020）などで、意識が脳の無意識的な処理の上に成り立つ姿を一般読者に伝えた。感覚置換デバイスの開発など、知覚の拡張にも取り組んでいる。"},{"name":"ラバーハンド錯覚（ボッチヴィンク & コーエン, 1998）","chapter":"c2-脳のネットワーク","sub":4,"subCount":7,"tags":["science","theory"],"birth":null,"death":null,"href":"https://note.com/varelser/n/n37fc983ebdf8","article":true,"descRaw":"：マシュー・ボッチヴィンクとジョナサン・コーエンが1998年に『Nature』で報告した身体所有感の実験。自分の手を隠し、目の前のゴム手を自分の手と同期して撫でると、被験者はゴム手を自分の手のように感じ、ゴム手が脅かされると皮膚電気反応が高まる。視覚と触覚の多感覚統合が身体所有感を構成することを示し、自己の身体的基盤の研究の出発点となった。後の全身所有感やVR身体交換の実験へ直接つながる。 出典：Botvinick & Cohen (1998)『Nature』 DOI: 10.1038/35784"},{"name":"最小自己（ギャラガー, 2000）","chapter":"c2-脳のネットワーク","sub":4,"subCount":7,"tags":["theory"],"birth":null,"death":null,"href":"https://note.com/varelser/n/nc6be321e6ad9","article":true,"descRaw":"：ショーン・ギャラガーが2000年ごろに提唱した、最も基本的な自己の概念。物語的な自己（自伝やアイデンティティ）とは異なり、経験が「自分のもの」であるという前反省的な一人称的所有感と主体感からなる。身体性・時間性・行為の主体としての感じがその核で、思考や反省がなくても成立する。瞑想やサイケデリクス、離人感などでこの最小の自己感が変容することが、自己と意識の研究の焦点となる。"},{"name":"自己モデル理論（メッツィンガー, 2003）","chapter":"c2-脳のネットワーク","sub":4,"subCount":7,"tags":["theory","science","dream"],"birth":null,"death":null,"href":"https://note.com/search?q=from%3A%40varelser%20%E8%87%AA%E5%B7%B1%E3%83%A2%E3%83%87%E3%83%AB%E7%90%86%E8%AB%96%EF%BC%88%E3%83%A1%E3%83%83%E3%83%84%E3%82%A3%E3%83%B3%E3%82%AC%E3%83%BC%2C%202003%EF%BC%89&context=note&mode=search","article":false,"descRaw":"：トーマス・メッツィンガーが2003年の著書『Being No One』で展開した理論。自己とは、脳が生成する現象的自己モデル（PSM）であり、モデルであることが意識されない「透明性」のために、自己は実在するものとして経験されるという。「自己のトンネル」とも呼ばれ、夢・体外離脱・離人感・サイケデリクスによる自我溶解を、自己モデルの変容として統一的に説明する。自己は実体ではなく、脳の表象過程の産物だとする立場である。"},{"name":"離人感・現実感喪失の神経メカニズム","chapter":"c2-脳のネットワーク","sub":4,"subCount":7,"tags":["clinical","science","theory"],"birth":null,"death":null,"href":"https://note.com/search?q=from%3A%40varelser%20%E9%9B%A2%E4%BA%BA%E6%84%9F%E3%83%BB%E7%8F%BE%E5%AE%9F%E6%84%9F%E5%96%AA%E5%A4%B1%E3%81%AE%E7%A5%9E%E7%B5%8C%E3%83%A1%E3%82%AB%E3%83%8B%E3%82%BA%E3%83%A0&context=note&mode=search","article":false,"descRaw":"：自分が自分でないように感じる離人感と、世界が現実でないように感じる現実感喪失の神経メカニズム。島皮質や前頭前皮質の機能変化、情動処理と身体感覚の乖離が関与するとされる。強いストレス・疲労・カンナビスやサイケデリクスでも一過性に生じ、変性意識研究との境界領域をなす。自己感と現実感が脳の構成的な過程であることを示す病理的な例として、身体所有感や自己モデル理論の検証にも用いられる。"},{"name":"身体交換錯覚と自己境界（ペトコヴァ & エールソン, 2008）","chapter":"c2-脳のネットワーク","sub":4,"subCount":7,"tags":["science","tech","theory"],"birth":null,"death":null,"href":"https://note.com/search?q=from%3A%40varelser%20%E8%BA%AB%E4%BD%93%E4%BA%A4%E6%8F%9B%E9%8C%AF%E8%A6%9A%E3%81%A8%E8%87%AA%E5%B7%B1%E5%A2%83%E7%95%8C%EF%BC%88%E3%83%9A%E3%83%88%E3%82%B3%E3%83%B4%E3%82%A1%20%26%20%E3%82%A8%E3%83%BC%E3%83%AB%E3%82%BD%E3%83%B3%2C%202008%EF%BC%89&context=note&mode=search","article":false,"descRaw":"：ヴァレリア・ペトコヴァとヘンリック・エールソンが2008年に『PLoS ONE』で報告した実験。ヘッドマウントディスプレイでマネキンの身体を一人称視点で見ながら、自分の腹部とマネキンの腹部を同期して撫でると、被験者は他者の身体を自分の身体として体験した。自分の身体と向き合って握手すると、自分の身体が他者のものに感じられるほど強い。身体所有感が全身に拡張しうること、自己境界が可塑的であることを実証した。 出典：Petkova & Ehrsson (2008)『PLoS ONE』 DOI: 10.1371/journal.pone.0003832"},{"name":"自我溶解の定量的研究（ナウアーら, 2016）","chapter":"c2-脳のネットワーク","sub":4,"subCount":7,"tags":["substance","science"],"birth":null,"death":null,"href":"https://note.com/search?q=from%3A%40varelser%20%E8%87%AA%E6%88%91%E6%BA%B6%E8%A7%A3%E3%81%AE%E5%AE%9A%E9%87%8F%E7%9A%84%E7%A0%94%E7%A9%B6%EF%BC%88%E3%83%8A%E3%82%A6%E3%82%A2%E3%83%BC%E3%82%89%2C%202016%EF%BC%89&context=note&mode=search","article":false,"descRaw":"：ナウアーらが2016年に発表した自我溶解インベントリ（EDI）の開発と検証。サイケデリクスによる自我境界の融解を定量的に測定する8項目の尺度で、「自分と世界の境界が溶けた」といった体験を数値化する。EDI得点はDMNの脱結合や神秘体験の強さと相関し、サイケデリクス研究で標準的な指標となった。自我溶解を主観報告として扱い、脳活動と結びつける橋渡しをした研究である。 出典：Nour et al. (2016)『Frontiers in Human Neuroscience』 DOI: 10.3389/fnhum.2016.00269"},{"name":"幻肢とファントム体験（ラマチャンドラン）","chapter":"c2-脳のネットワーク","sub":4,"subCount":7,"tags":["science","clinical","theory"],"birth":null,"death":null,"href":"https://note.com/search?q=from%3A%40varelser%20%E5%B9%BB%E8%82%A2%E3%81%A8%E3%83%95%E3%82%A1%E3%83%B3%E3%83%88%E3%83%A0%E4%BD%93%E9%A8%93%EF%BC%88%E3%83%A9%E3%83%9E%E3%83%81%E3%83%A3%E3%83%B3%E3%83%89%E3%83%A9%E3%83%B3%EF%BC%89&context=note&mode=search","article":false,"descRaw":"：切断後に失われた手足がなお存在するように感じる幻肢と、その神経基盤。V.S.ラマチャンドランは、切断者の脳の身体表象が再編成されることで幻肢感覚や幻肢痛が生じることを示し、1990年代に鏡を用いた「鏡療法」を開発した。鏡に映る健側の手足の動きが幻肢の動きとして知覚され、痛みが軽減する。身体図式と意識の可塑性を示す古典的な例で、身体所有感の研究の基礎となった。"},{"name":"オラフ・ブランケ","chapter":"c2-脳のネットワーク","sub":4,"subCount":7,"tags":["science","theory"],"birth":1969,"death":null,"href":"https://note.com/search?q=from%3A%40varelser%20%E3%82%AA%E3%83%A9%E3%83%95%E3%83%BB%E3%83%96%E3%83%A9%E3%83%B3%E3%82%B1&context=note&mode=search","article":false,"descRaw":"（瑞・1969–）：スイスとドイツの神経科学者。ローザンヌ連邦工科大学（EPFL）教授として、身体的自己意識の神経基盤を研究する。2002年、てんかん患者の右角回への電気刺激で体外離脱体験を再現性高く誘発したことを『Nature』で報告し、体外離脱が側頭頭頂接合部での体性感覚と前庭感覚の統合の破綻によることを示した。2007年にはVRを用いた全身所有感の操作実験を『Science』で発表し、自己の身体性の実験科学を切り開いた。"},{"name":"5D-ASC / 11D-ASC（ディットリヒ, 1998）","chapter":"c2-脳のネットワーク","sub":5,"subCount":7,"tags":["science","substance"],"birth":null,"death":null,"href":"https://note.com/varelser/n/n9a6e1794a612","article":true,"descRaw":"：アドルフ・ディットリヒが1998年に体系化した、変性意識状態の多次元的自己報告尺度。94項目の視覚アナログ尺度で、海洋的無境界感（OBN）、恐怖的自我溶解（DED）、幻視的再構成（VRS）、聴覚変容、覚醒低下の5次元を測る。前身のOAV尺度（3次元）から発展し、シュトゥーデルスら（2010）の因子分析で11因子版（11D-ASC）が導かれた。サイケデリクス・瞑想・感覚遮断など多様な変性意識の比較に広く用いられる標準的尺度である。 出典：Dittrich (1998)『Pharmacopsychiatry』 DOI: 10.1055/s-2007-979351；Studerus et al. (2010)『PLOS ONE』 DOI: 10.1371/journal.pone.0012412"},{"name":"摂動複雑性指標（PCI）（カシリオ & マッシミーニ, 2013）","chapter":"c2-脳のネットワーク","sub":5,"subCount":7,"tags":["science","clinical"],"birth":null,"death":null,"href":"https://note.com/search?q=from%3A%40varelser%20%E6%91%82%E5%8B%95%E8%A4%87%E9%9B%91%E6%80%A7%E6%8C%87%E6%A8%99%EF%BC%88PCI%EF%BC%89%EF%BC%88%E3%82%AB%E3%82%B7%E3%83%AA%E3%82%AA%20%26%20%E3%83%9E%E3%83%83%E3%82%B7%E3%83%9F%E3%83%BC%E3%83%8B%2C%202013%EF%BC%89&context=note&mode=search","article":false,"descRaw":"：カシリオとマッシミーニらが2013年に『Science Translational Medicine』で発表した、意識レベルの客観的指標。経頭蓋磁気刺激（TMS）で皮質を刺激し、EEG応答の時空間パターンの複雑性を圧縮アルゴリズムで数値化する。覚醒時0.44〜0.67、ノンレム睡眠時0.18〜0.28と状態を区別し、植物状態の患者と最小意識状態・閉じ込め症候群の患者を識別できた。統合情報理論のΦの実用的な代理指標として、意識の客観評価の臨床応用が進んでいる。 出典：Casali et al. (2013)『Science Translational Medicine』 DOI: 10.1126/scitranslmed.3006294"},{"name":"EEGマイクロステートと意識状態","chapter":"c2-脳のネットワーク","sub":5,"subCount":7,"tags":["science"],"birth":null,"death":null,"href":"https://note.com/search?q=from%3A%40varelser%20EEG%E3%83%9E%E3%82%A4%E3%82%AF%E3%83%AD%E3%82%B9%E3%83%86%E3%83%BC%E3%83%88%E3%81%A8%E6%84%8F%E8%AD%98%E7%8A%B6%E6%85%8B&context=note&mode=search","article":false,"descRaw":"：脳電場の頭皮トポグラフィが約60〜120ミリ秒ごとに離散的に切り替わるパターンの分析。ディートリッヒ・レーマンらが1987年に提唱し、安静時のEEGはA〜Dの4つの典型的なマイクロステートの連鎖として記述できる。マイクロステートの持続時間や遷移パターンは、意識状態や精神疾患で変化し、瞑想やサイケデリクス下での変化も調べられている。意識の時間的な微細構造を捉える手法として、脳動態研究の標準的な解析法の一つである。"},{"name":"心拍変動（HRV）と自律神経-意識状態の関連","chapter":"c2-脳のネットワーク","sub":5,"subCount":7,"tags":["science","practice","clinical"],"birth":null,"death":null,"href":"https://note.com/search?q=from%3A%40varelser%20%E5%BF%83%E6%8B%8D%E5%A4%89%E5%8B%95%EF%BC%88HRV%EF%BC%89%E3%81%A8%E8%87%AA%E5%BE%8B%E7%A5%9E%E7%B5%8C-%E6%84%8F%E8%AD%98%E7%8A%B6%E6%85%8B%E3%81%AE%E9%96%A2%E9%80%A3&context=note&mode=search","article":false,"descRaw":"：心拍変動。心拍間隔のゆらぎを指標とした自律神経機能の評価法で、副交感神経活動の反映とされる。瞑想・フロー・ストレス・変性意識状態でHRVが変化し、呼吸法では呼吸性洞性不整脈を介してHRVが高まる。心拍と脳の相互作用（心臓-脳軸）のバイオマーカーとして、感情調節や自己感の研究にも用いられる。ウェアラブル機器の普及で日常的な意識状態のモニタリングにも使われるが、解釈には呼吸や運動の影響への注意が要る。"},{"name":"混合研究法（Mixed Methods）と意識研究","chapter":"c2-脳のネットワーク","sub":5,"subCount":7,"tags":["science","theory"],"birth":null,"death":null,"href":"https://note.com/search?q=from%3A%40varelser%20%E6%B7%B7%E5%90%88%E7%A0%94%E7%A9%B6%E6%B3%95%EF%BC%88Mixed%20Methods%EF%BC%89%E3%81%A8%E6%84%8F%E8%AD%98%E7%A0%94%E7%A9%B6&context=note&mode=search","article":false,"descRaw":"：定量的手法（神経画像・心理尺度）と定性的手法（面接・現象学的記述）を統合する研究法。変性意識のように主観体験が中心的な対象では、脳活動の数値だけでも体験の語りだけでも不十分で、両者を三角測量的に組み合わせることが求められる。量的方法で体験の強度を測り、質的方法で体験の意味や構造を描く。方法論的多元主義の立場から、意識研究の方法論的標準として提唱される。"},{"name":"再現性の危機と変性意識研究の課題","chapter":"c2-脳のネットワーク","sub":5,"subCount":7,"tags":["science","theory"],"birth":null,"death":null,"href":"https://note.com/search?q=from%3A%40varelser%20%E5%86%8D%E7%8F%BE%E6%80%A7%E3%81%AE%E5%8D%B1%E6%A9%9F%E3%81%A8%E5%A4%89%E6%80%A7%E6%84%8F%E8%AD%98%E7%A0%94%E7%A9%B6%E3%81%AE%E8%AA%B2%E9%A1%8C&context=note&mode=search","article":false,"descRaw":"：心理学の再現性問題が変性意識研究にも及ぶ課題。2015年のオープンサイエンス・コラボレーションによる大規模再現実験では、心理学の主要な100研究のうち統計的に有意に再現できたのは約36%にとどまった。変性意識研究は小サンプル、セット＆セッティングの効果、盲検化の困難、体験の個人差といった再現性を脅かす要因を抱える。事前登録・大規模化・オープンデータなど、再現性向上の取り組みが求められている。 出典：Open Science Collaboration (2015)『Science』 DOI: 10.1126/science.aac4716"},{"name":"OAV尺度（視覚アナログ尺度による変性意識測定）","chapter":"c2-脳のネットワーク","sub":5,"subCount":7,"tags":["science","substance"],"birth":null,"death":null,"href":"https://note.com/search?q=from%3A%40varelser%20OAV%E5%B0%BA%E5%BA%A6%EF%BC%88%E8%A6%96%E8%A6%9A%E3%82%A2%E3%83%8A%E3%83%AD%E3%82%B0%E5%B0%BA%E5%BA%A6%E3%81%AB%E3%82%88%E3%82%8B%E5%A4%89%E6%80%A7%E6%84%8F%E8%AD%98%E6%B8%AC%E5%AE%9A%EF%BC%89&context=note&mode=search","article":false,"descRaw":"：ディットリヒらが開発した、視覚アナログ尺度による変性意識測定法。海洋的無境界感（OBN）、不安的自我溶解（DED）、幻視的再構成（VRS）の3主次元からなり、1975年のAPZ質問紙に起源をもつ。5D-ASCの基盤となった評価体系で、薬物・瞑想・感覚遮断など多様な変性意識誘発法の比較に用いられた。体験の質的な違いを数値化し、異なる誘発法に共通する構造を抽出する先駆的な尺度である。"},{"name":"HRS（幻覚評価尺度）（ストラスマン, 1994）","chapter":"c2-脳のネットワーク","sub":5,"subCount":7,"tags":["science","substance"],"birth":null,"death":null,"href":"https://note.com/search?q=from%3A%40varelser%20HRS%EF%BC%88%E5%B9%BB%E8%A6%9A%E8%A9%95%E4%BE%A1%E5%B0%BA%E5%BA%A6%EF%BC%89%EF%BC%88%E3%82%B9%E3%83%88%E3%83%A9%E3%82%B9%E3%83%9E%E3%83%B3%2C%201994%EF%BC%89&context=note&mode=search","article":false,"descRaw":"：リック・ストラスマンが1994年にDMT研究のために開発した幻覚評価尺度。99項目からなり、強度・身体感覚・気分・知覚・認知・意志の6下位尺度で幻覚体験を多次元的に評価する。静脈内DMT投与の用量反応性を定量化するために作られ、アヤワスカ研究などにも応用された。主観的な幻覚体験を構造化して測る先駆的な尺度で、後の神秘体験質問票（MEQ）や5D-ASCと並ぶ変性意識測定の標準である。 出典：Strassman et al. (1994)『Archives of General Psychiatry』 DOI: 10.1001/archpsyc.1994.03950020022002"},{"name":"CADSS（臨床家施行解離状態尺度）","chapter":"c2-脳のネットワーク","sub":5,"subCount":7,"tags":["clinical","science"],"birth":null,"death":null,"href":"https://note.com/search?q=from%3A%40varelser%20CADSS%EF%BC%88%E8%87%A8%E5%BA%8A%E5%AE%B6%E6%96%BD%E8%A1%8C%E8%A7%A3%E9%9B%A2%E7%8A%B6%E6%85%8B%E5%B0%BA%E5%BA%A6%EF%BC%89&context=note&mode=search","article":false,"descRaw":"：ブレムナーらが1998年に開発した、臨床家施行解離状態尺度。解離症状を臨床場面でリアルタイムに評価する尺度で、27項目からなり、離人感・現実感喪失・健忘の3因子で構成される。被験者評定19項目と観察者評定8項目を組み合わせる。ケタミン投与による解離の定量化や、PTSD・解離性障害の研究で広く用いられ、薬理学的変性意識と病理的解離を同じ物差しで測る橋渡しをした。 出典：Bremner et al. (1998)『Journal of Traumatic Stress』 DOI: 10.1023/A:1024465317902"},{"name":"エピジェネティクスと意識・行動","chapter":"c2-脳のネットワーク","sub":6,"subCount":7,"tags":["science","theory"],"birth":null,"death":null,"href":"https://note.com/search?q=from%3A%40varelser%20%E3%82%A8%E3%83%94%E3%82%B8%E3%82%A7%E3%83%8D%E3%83%86%E3%82%A3%E3%82%AF%E3%82%B9%E3%81%A8%E6%84%8F%E8%AD%98%E3%83%BB%E8%A1%8C%E5%8B%95&context=note&mode=search","article":false,"descRaw":"：遺伝子発現の後天的な調節をめぐる研究。トラウマ、瞑想、環境ストレスがDNAメチル化などを介して意識や行動に影響し、その影響が世代を超えて伝わる可能性が検討されている。2000年代以降の研究で、経験がゲノムの働きを変える仕組みが明らかになり、意識と環境の相互作用の分子基盤を示した。母体のストレスが子の遺伝子発現に影響する研究など、世代間の影響も検証されている。"},{"name":"ヘッブ則と神経可塑性（ヘッブ, 1949）","chapter":"c2-脳のネットワーク","sub":6,"subCount":7,"tags":["science","theory"],"birth":null,"death":null,"href":"https://note.com/search?q=from%3A%40varelser%20%E3%83%98%E3%83%83%E3%83%96%E5%89%87%E3%81%A8%E7%A5%9E%E7%B5%8C%E5%8F%AF%E5%A1%91%E6%80%A7%EF%BC%88%E3%83%98%E3%83%83%E3%83%96%2C%201949%EF%BC%89&context=note&mode=search","article":false,"descRaw":"：カナダの心理学者ドナルド・ヘッブが1949年の著書『The Organization of Behavior』で提示した原理。「共に発火するニューロンは結びつく」というヘッブ則は、学習と記憶の細胞レベルの基本原理となった。シナプス可塑性研究の出発点で、瞑想やサイケデリクスによる可塑性促進の理解の基盤でもある。"},{"name":"長期増強（LTP）/ 長期抑圧（LTD）","chapter":"c2-脳のネットワーク","sub":6,"subCount":7,"tags":["science"],"birth":null,"death":null,"href":"https://note.com/search?q=from%3A%40varelser%20%E9%95%B7%E6%9C%9F%E5%A2%97%E5%BC%B7%EF%BC%88LTP%EF%BC%89/%20%E9%95%B7%E6%9C%9F%E6%8A%91%E5%9C%A7%EF%BC%88LTD%EF%BC%89&context=note&mode=search","article":false,"descRaw":"：シナプス伝達効率の持続的な増強と抑圧。1973年にブリスとレモがウサギの海馬でLTPを発見し、記憶形成の分子メカニズムとして確立された。NMDA受容体依存的な可塑性は、学習・記憶の基盤であり、瞑想やサイケデリクスによる可塑性促進との関連も研究されている。LTPの発見は、記憶の神経基盤の研究に転換をもたらしたとされる。"},{"name":"報酬予測誤差と意識（シュルツ, 1997）","chapter":"c2-脳のネットワーク","sub":6,"subCount":7,"tags":["science","theory"],"birth":null,"death":null,"href":"https://note.com/search?q=from%3A%40varelser%20%E5%A0%B1%E9%85%AC%E4%BA%88%E6%B8%AC%E8%AA%A4%E5%B7%AE%E3%81%A8%E6%84%8F%E8%AD%98%EF%BC%88%E3%82%B7%E3%83%A5%E3%83%AB%E3%83%84%2C%201997%EF%BC%89&context=note&mode=search","article":false,"descRaw":"：スイスの神経科学者ヴォルフラム・シュルツによる1997年の研究（『Science』）。ドーパミンニューロンが報酬の予測誤差（予想と実際の報酬の差）を符号化することを発見した。驚き・学習・動機づけの神経基盤を示し、変性意識下での報酬処理の変化を理解する枠組みとなった。この発見は強化学習理論と神経科学を結びつけ、依存症研究にも応用されている。 出典：Schultz et al. (1997)『Science』 DOI: 10.1126/science.275.5306.1593"},{"name":"熟達化と訓練研究（エリクソン / デイヴィッドソン）","chapter":"c2-脳のネットワーク","sub":6,"subCount":7,"tags":["science","practice"],"birth":null,"death":null,"href":"https://note.com/search?q=from%3A%40varelser%20%E7%86%9F%E9%81%94%E5%8C%96%E3%81%A8%E8%A8%93%E7%B7%B4%E7%A0%94%E7%A9%B6%EF%BC%88%E3%82%A8%E3%83%AA%E3%82%AF%E3%82%BD%E3%83%B3%20/%20%E3%83%87%E3%82%A4%E3%83%B4%E3%82%A3%E3%83%83%E3%83%89%E3%82%BD%E3%83%B3%EF%BC%89&context=note&mode=search","article":false,"descRaw":"：アンダース・エリクソンらの熟達研究と、リチャード・デイヴィッドソンらの瞑想訓練研究。エリクソンらは1993年に意図的練習（deliberate practice）の重要性を示し、「1万時間」の議論の元となった。デイヴィッドソンらは長期瞑想者の脳変化を実証し、状態（state）から特性（trait）への移行を検証した。"},{"name":"発達的感受性期と意識の形成","chapter":"c2-脳のネットワーク","sub":6,"subCount":7,"tags":["science","theory"],"birth":null,"death":null,"href":"https://note.com/search?q=from%3A%40varelser%20%E7%99%BA%E9%81%94%E7%9A%84%E6%84%9F%E5%8F%97%E6%80%A7%E6%9C%9F%E3%81%A8%E6%84%8F%E8%AD%98%E3%81%AE%E5%BD%A2%E6%88%90&context=note&mode=search","article":false,"descRaw":"：臨界期・感受性期における経験依存的な脳発達をめぐる研究。幼児期の意識発達やアタッチメントと自己感の形成は、特定の時期の経験に強く依存する。視覚の臨界期（ヒューベルとウィーゼル）や言語獲得の感受性期が知られ、意識の発達を神経発達学的に理解する基盤となった。感受性期の概念は、言語・視覚・愛着の発達を理解するうえで中心的な枠組みである。"},{"name":"ニッチ構築理論と変性意識","chapter":"c2-脳のネットワーク","sub":6,"subCount":7,"tags":["theory","culture","science"],"birth":null,"death":null,"href":"https://note.com/search?q=from%3A%40varelser%20%E3%83%8B%E3%83%83%E3%83%81%E6%A7%8B%E7%AF%89%E7%90%86%E8%AB%96%E3%81%A8%E5%A4%89%E6%80%A7%E6%84%8F%E8%AD%98&context=note&mode=search","article":false,"descRaw":"：生物が環境を能動的に構築し、進化の選択圧を変えるという理論。オドリング＝スミーらが2003年の著書『Niche Construction』で体系化した。儀礼や薬物使用などの文化的環境が、人類の意識の進化に影響を与えた可能性を示し、変性意識の誘発が文化と進化の相互作用であることを示唆する。人類の火の使用や農耕もニッチ構築の例とされ、文化と進化の相互作用を示す。"},{"name":"強化学習理論と意識的/無意識的学習","chapter":"c2-脳のネットワーク","sub":6,"subCount":7,"tags":["theory","science"],"birth":null,"death":null,"href":"https://note.com/search?q=from%3A%40varelser%20%E5%BC%B7%E5%8C%96%E5%AD%A6%E7%BF%92%E7%90%86%E8%AB%96%E3%81%A8%E6%84%8F%E8%AD%98%E7%9A%84/%E7%84%A1%E6%84%8F%E8%AD%98%E7%9A%84%E5%AD%A6%E7%BF%92&context=note&mode=search","article":false,"descRaw":"：報酬に基づく行動学習の計算論。サットンとバートの強化学習理論（1998年の著書）をもとに、習慣的な無意識的学習（モデルフリー）と目標指向的な意識的学習（モデルベース）の二重過程モデルが提唱された。意識が行動選択に果たす機能的役割を、計算論的に解明する枠組みである。モデルフリー学習とモデルベース学習の区別は、習慣と熟慮の神経基盤の研究に用いられる。"},{"name":"行動主義から認知科学への転換","chapter":"c2-脳のネットワーク","sub":6,"subCount":7,"tags":["theory","science"],"birth":null,"death":null,"href":"https://note.com/search?q=from%3A%40varelser%20%E8%A1%8C%E5%8B%95%E4%B8%BB%E7%BE%A9%E3%81%8B%E3%82%89%E8%AA%8D%E7%9F%A5%E7%A7%91%E5%AD%A6%E3%81%B8%E3%81%AE%E8%BB%A2%E6%8F%9B&context=note&mode=search","article":false,"descRaw":"：ワトソンやスキナーの行動主義から、チョムスキーの1959年のスキナー批判を経て認知革命へ至る歴史的過程。ミラーの「マジカルナンバー7」（1956年）やナイサーの『認知心理学』（1967年）が転換を象徴する。意識の科学的研究が再び正当化され、現代の意識科学の前提が築かれた。認知革命により、意識・表象・情報処理が心理学の中心課題として復権した。"},{"name":"宗教的経験の諸相（ウィリアム・ジェイムズ, 1902）","chapter":"c3-エントロピック・ブレイン","sub":0,"subCount":8,"tags":["theory","religion","science"],"birth":null,"death":null,"href":"https://note.com/varelser/n/na2a982e0838b","article":true,"descRaw":"：1901〜02年のギフォード講義をもとにした1902年の主著。改宗・回心、聖性、神秘体験を症例中心に記述し、宗教を教義ではなく個人の体験から捉えた。神秘体験の四つの特徴として言い表しがたさ、知覚的確実性、儚さ、受動性を挙げ、「閾下の意識」にも触れた。実証的心理学と宗教哲学を架橋し、近代の意識研究と神秘体験研究の出発点となった。"},{"name":"聖なるもの（ルドルフ・オットー, 1917）","chapter":"c3-エントロピック・ブレイン","sub":0,"subCount":8,"tags":["theory","religion"],"birth":null,"death":null,"href":"https://note.com/varelser/n/nfc5114de7739","article":true,"descRaw":"：ドイツの神学者・宗教学者ルドルフ・オットーの1917年の主著。宗教体験の核心を、合理的・倫理的側面では捉えきれない「ヌミノーゼ（畏怖すべき神秘）」とした。畏怖と魅惑が一体となった感情を分析し、聖なるものへの畏敬の念を宗教の普遍的要素とみなした。感情と身体感覚に根ざした宗教現象学として、後の神秘体験研究や宗教心理学に大きな影響を与えた。"},{"name":"神秘主義と哲学（W.T.ステイス, 1960）","chapter":"c3-エントロピック・ブレイン","sub":0,"subCount":8,"tags":["theory","religion"],"birth":null,"death":null,"href":"https://note.com/search?q=from%3A%40varelser%20%E7%A5%9E%E7%A7%98%E4%B8%BB%E7%BE%A9%E3%81%A8%E5%93%B2%E5%AD%A6%EF%BC%88W.T.%E3%82%B9%E3%83%86%E3%82%A4%E3%82%B9%2C%201960%EF%BC%89&context=note&mode=search","article":false,"descRaw":"：英米の哲学者W.T.ステイスの1960年の主著。神秘体験を内向型（自我や対象の消滅による純粋意識）と外向型（外界との一体感）に類型化し、文化や宗教の違いを超えた共通構造を主張した。体験の言い表しがたさや逆説性を分析し、神秘主義の哲学的正当性を擁護した。神秘体験の比較研究と類型論の古典として、現代の神経科学や宗教心理学でも参照される。"},{"name":"コズミック・コンシャスネス（R.M.バック, 1901）","chapter":"c3-エントロピック・ブレイン","sub":0,"subCount":8,"tags":["theory","religion","science"],"birth":null,"death":null,"href":"https://note.com/search?q=from%3A%40varelser%20%E3%82%B3%E3%82%BA%E3%83%9F%E3%83%83%E3%82%AF%E3%83%BB%E3%82%B3%E3%83%B3%E3%82%B7%E3%83%A3%E3%82%B9%E3%83%8D%E3%82%B9%EF%BC%88R.M.%E3%83%90%E3%83%83%E3%82%AF%2C%201901%EF%BC%89&context=note&mode=search","article":false,"descRaw":"：カナダの精神科医リチャード・モーリス・バックの1901年の著書。単純意識・自己意識を超えた第三の意識段階「宇宙的意識」を提唱し、ブッダ、イエス、ホイットマン、ブレイクらの体験記録を収集・比較した。光の知覚や道徳的昂揚、死の恐怖の消滅などを特徴として挙げた。神秘体験を進化の展望から捉えた先駆的研究で、後のトランスパーソナル心理学にも影響した。"},{"name":"知覚の扉（オルダス・ハクスリー, 1954）","chapter":"c3-エントロピック・ブレイン","sub":0,"subCount":8,"tags":["substance","theory"],"birth":null,"death":null,"href":"https://note.com/varelser/n/n17bac2c33237","article":true,"descRaw":"：英国の作家オルダス・ハクスリーが1953年のメスカリン体験を綴った1954年のエッセイ。脳を感覚情報をふるいにかける「減圧弁」とみなし、メスカリンがその弁を緩めて知覚を拡張すると論じた。色彩や形態の鮮明化、自我の希薄化を現象学的に記述した。ブレイクの詩句から題名を採り、サイケデリック体験の思想的基盤を築いた。続編『天国と地獄』（1956年）とともに広く読まれた。"},{"name":"意識のスペクトル（ケン・ウィルバー, 1977）","chapter":"c3-エントロピック・ブレイン","sub":0,"subCount":8,"tags":["theory","religion"],"birth":null,"death":null,"href":"https://note.com/search?q=from%3A%40varelser%20%E6%84%8F%E8%AD%98%E3%81%AE%E3%82%B9%E3%83%9A%E3%82%AF%E3%83%88%E3%83%AB%EF%BC%88%E3%82%B1%E3%83%B3%E3%83%BB%E3%82%A6%E3%82%A3%E3%83%AB%E3%83%90%E3%83%BC%2C%201977%EF%BC%89&context=note&mode=search","article":false,"descRaw":"：米国の思想家ケン・ウィルバーの処女作（1977年）。フロイトの自我、ユングの元型、仏教の意識論などを一つの階層モデルに統合し、意識を自我・実存・心・精神へと広がるスペクトルとして描いた。東西の心理学と哲学を架橋する試みで、トランスパーソナル心理学とインテグラル理論の理論的支柱となった。後のAQALモデルへ発展する出発点でもある。"},{"name":"LSD—私の問題児（アルベルト・ホフマン, 1979）","chapter":"c3-エントロピック・ブレイン","sub":0,"subCount":8,"tags":["substance","theory","science"],"birth":null,"death":null,"href":"https://note.com/search?q=from%3A%40varelser%20LSD%E2%80%94%E7%A7%81%E3%81%AE%E5%95%8F%E9%A1%8C%E5%85%90%EF%BC%88%E3%82%A2%E3%83%AB%E3%83%99%E3%83%AB%E3%83%88%E3%83%BB%E3%83%9B%E3%83%95%E3%83%9E%E3%83%B3%2C%201979%EF%BC%89&context=note&mode=search","article":false,"descRaw":"：1943年にLSDを合成・自己実験したスイスの化学者アルベルト・ホフマンの回想録（1979年）。LSD発見の経緯、麦角菌研究、メスカリンやシロシビンとの関わりを綴り、薬物の乱用への懸念と精神医学・宗教研究への可能性を論じた。精神薬理学と意識研究の交差点に立つ記録で、サイケデリック・ルネサンスの時代にも原点として読み継がれている。"},{"name":"意識と本質（井筒俊彦, 1983）","chapter":"c3-エントロピック・ブレイン","sub":0,"subCount":8,"tags":["theory","religion"],"birth":null,"death":null,"href":"https://note.com/varelser/n/n2599c5439224","article":true,"descRaw":"：日本の哲学者・イスラーム学者井筒俊彦の1983年の主著。禅・道教・イスラーム神秘主義（スーフィズム）・ヒンドゥー教を横断し、意識の深層構造を比較哲学的に探究した。東洋の「本質」概念と西洋哲学の対話を通じて、言語以前の意識のあり方を描き出した。日本発の意識研究の古典として、東西比較の視座を提示した。東西の神秘主義を一つの意識論に結ぶ比較思想の金字塔とされる。"},{"name":"善の研究（西田幾多郎, 1911）","chapter":"c3-エントロピック・ブレイン","sub":0,"subCount":8,"tags":["theory","religion"],"birth":null,"death":null,"href":"https://note.com/search?q=from%3A%40varelser%20%E5%96%84%E3%81%AE%E7%A0%94%E7%A9%B6%EF%BC%88%E8%A5%BF%E7%94%B0%E5%B9%BE%E5%A4%9A%E9%83%8E%2C%201911%EF%BC%89&context=note&mode=search","article":false,"descRaw":"：日本の哲学者西田幾多郎の処女作（1911年）。主客未分の直接体験である「純粋経験」を哲学の出発点に据え、意識と実在の根源を論じた。善を実在の統一的展開として捉える独自の体系を提示し、京都学派の出発点となった。禅の体験と西洋哲学を結ぶ試みとして、意識哲学の日本的源流に位置づけられる。西田は後に「場所」の哲学へ発展させ、日本近代哲学の礎を築いた。"},{"name":"生きられた宗教体験（ヴィルヘルム・ディルタイ）","chapter":"c3-エントロピック・ブレイン","sub":0,"subCount":8,"tags":["theory","religion"],"birth":null,"death":null,"href":"https://note.com/search?q=from%3A%40varelser%20%E7%94%9F%E3%81%8D%E3%82%89%E3%82%8C%E3%81%9F%E5%AE%97%E6%95%99%E4%BD%93%E9%A8%93%EF%BC%88%E3%83%B4%E3%82%A3%E3%83%AB%E3%83%98%E3%83%AB%E3%83%A0%E3%83%BB%E3%83%87%E3%82%A3%E3%83%AB%E3%82%BF%E3%82%A4%EF%BC%89&context=note&mode=search","article":false,"descRaw":"：ドイツの哲学者ヴィルヘルム・ディルタイ（1833〜1911）が展開した体験（Erlebnis）概念。体験を精神科学（人文科学）の基礎に据え、自然科学的な説明ではなく「了解」による理解を主張した。宗教体験を内面から捉える方法論として、現象学や解釈学の先駆けとなった。意識を客観的対象ではなく生きられた現実として扱う視点は、後の質的研究にもつながる。"},{"name":"ジュリアン・ジェインズ","chapter":"c3-エントロピック・ブレイン","sub":0,"subCount":8,"tags":["theory","science"],"birth":1920,"death":1997,"href":"https://note.com/search?q=from%3A%40varelser%20%E3%82%B8%E3%83%A5%E3%83%AA%E3%82%A2%E3%83%B3%E3%83%BB%E3%82%B8%E3%82%A7%E3%82%A4%E3%83%B3%E3%82%BA&context=note&mode=search","article":false,"descRaw":"（米・1920–1997）：プリンストン大学の心理学者ジュリアン・ジェインズ（1920〜1997）。1976年の著書『神々の沈黙—意識の起源と二分心の崩壊』で、意識は言語と文化に根ざした学習された行動であり、紀元前2千年紀頃まで人類は「二分心」の状態にあったと提唱した。古代人は思考を神々の声という幻聴として体験したとし、イリアスなどの古代文献を分析した。論争を呼んだが、意識の起源をめぐる独創的な仮説として読み継がれている。"},{"name":"予測符号化理論（ラオ & バラード, 1999）","chapter":"c3-エントロピック・ブレイン","sub":1,"subCount":8,"tags":["theory","science"],"birth":null,"death":null,"href":"https://note.com/varelser/n/nad484b90df6e","article":true,"descRaw":"：ラジェシュ・ラオとダナ・バラードによる1999年の論文（『Nature Neuroscience』）。脳が感覚入力を予測し、予測と実際の入力の誤差だけを上位へ伝達するという階層的符号化モデルを提示した。視覚野の働きを予測処理で説明し、知覚の能動的構成理論の基礎となった。後の予測処理・ベイズ脳理論の出発点である。 出典：Rao & Ballard (1999)『Nature Neuroscience』 DOI: 10.1038/4580"},{"name":"能動的推論（カール・フリストン）","chapter":"c3-エントロピック・ブレイン","sub":1,"subCount":8,"tags":["theory","science"],"birth":null,"death":null,"href":"https://note.com/search?q=from%3A%40varelser%20%E8%83%BD%E5%8B%95%E7%9A%84%E6%8E%A8%E8%AB%96%EF%BC%88%E3%82%AB%E3%83%BC%E3%83%AB%E3%83%BB%E3%83%95%E3%83%AA%E3%82%B9%E3%83%88%E3%83%B3%EF%BC%89&context=note&mode=search","article":false,"descRaw":"：英国の神経科学者カール・フリストンが提唱した、自由エネルギー原理に基づく知覚・行動・学習の統合的枠組み。生物は予測誤差（驚き）を最小化するよう行動し、行動自体を「予測誤差を減らすための環境への介入」として記述する。知覚と行動を一つの推論過程として統一し、計算論的神経科学の中心理論となった。フリストンはロンドン大学ユニバーシティ・カレッジで計算論的神経科学を主導してきた。"},{"name":"精度重みづけと注意（フェルドマン & フリストン, 2010）","chapter":"c3-エントロピック・ブレイン","sub":1,"subCount":8,"tags":["theory","science"],"birth":null,"death":null,"href":"https://note.com/search?q=from%3A%40varelser%20%E7%B2%BE%E5%BA%A6%E9%87%8D%E3%81%BF%E3%81%A5%E3%81%91%E3%81%A8%E6%B3%A8%E6%84%8F%EF%BC%88%E3%83%95%E3%82%A7%E3%83%AB%E3%83%89%E3%83%9E%E3%83%B3%20%26%20%E3%83%95%E3%83%AA%E3%82%B9%E3%83%88%E3%83%B3%2C%202010%EF%BC%89&context=note&mode=search","article":false,"descRaw":"：ジェイコブ・フェルドマンとカール・フリストンによる2010年の論文。予測誤差の「精度」（信頼度）を調節するメカニズムとして注意を定式化した。注意は信頼できる誤差信号を増幅し、信頼できないものを抑えるとし、変性意識状態における精度の崩壊や再配分を説明する理論的根拠となった。この枠組みでは、注意の障害が幻覚や妄想の理解にもつながるとされる。 出典：Feldman & Friston (2010)『Frontiers in Human Neuroscience』 DOI: 10.3389/fnhum.2010.00215"},{"name":"内受容推論モデル（セス, 2013）","chapter":"c3-エントロピック・ブレイン","sub":1,"subCount":8,"tags":["theory","science"],"birth":null,"death":null,"href":"https://note.com/varelser/n/n489e0364fc3d","article":true,"descRaw":"：アニル・セスによる2013年の論文。身体内部状態の予測処理として感情を捉え、「感情は内受容的予測誤差の知覚である」とする情動の計算論を提示した。心拍や内臓感覚の予測が自己感や情動体験を形づくるとし、身体と意識の関係をベイズ推論で説明した。感情を身体の予測処理として捉える点で、ダマシオの身体マーカー仮説とも対話する。セスはサセックス大学で意識科学センターを率いている。 出典：Seth (2013)『Trends in Cognitive Sciences』 DOI: 10.1016/j.tics.2013.09.007"},{"name":"幻覚の計算論モデル（コーレット, フリストン, フレッチャーら）","chapter":"c3-エントロピック・ブレイン","sub":1,"subCount":8,"tags":["theory","science","substance"],"birth":null,"death":null,"href":"https://note.com/search?q=from%3A%40varelser%20%E5%B9%BB%E8%A6%9A%E3%81%AE%E8%A8%88%E7%AE%97%E8%AB%96%E3%83%A2%E3%83%87%E3%83%AB%EF%BC%88%E3%82%B3%E3%83%BC%E3%83%AC%E3%83%83%E
