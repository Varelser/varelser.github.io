        n.vz = dim3 ? (n.vz + n.fz) * damp : 0;
        const sp = Math.sqrt(n.vx * n.vx + n.vy * n.vy + n.vz * n.vz);
        if (sp > cap) { n.vx *= cap / sp; n.vy *= cap / sp; n.vz *= cap / sp; }
        n.x += n.vx; n.y += n.vy;
        if (dim3) n.z += n.vz;
        if (!isFinite(n.x) || !isFinite(n.y) || !isFinite(n.z)) {
          placeAtAnchor(n);
        }
        if (sp > maxV) maxV = sp;
      }
      G.maxSpeed = maxV;
      G.tickCount++;
      if (maxV < 0.06) G.calmTicks++; else G.calmTicks = 0;
    }

    function reheat() {
      G.tickCount = 0;
      G.calmTicks = 0;
      G.coolFactor = 0;
      G.viewTouched = false;
      cancelFitAnim();
      for (const n of G.visibleNodes) {
        n.vx += (Math.random() - 0.5) * 2;
        n.vy += (Math.random() - 0.5) * 2;
        if (G.dim === '3d') n.vz += (Math.random() - 0.5) * 2;
      }
      runSim();
    }

    function frameLoop() {
      if (!G.open) { G.running = false; G.raf = null; return; }
      // 中心切替の補間アニメーション中はトゥイーンを進める（力は走らない）。
      if (G.tween && G.tween.active) {
        advanceTween();
      } else if (G.running) {
        // アニメーション速度：1フレームあたりのティック数（既定3）
        const steps = Math.max(1, Math.min(6, Math.round(3 * G.force.speed)));
        for (let s = 0; s < steps; s++) stepSim();
        if (G.calmTicks >= 12 || G.tickCount > 1500) {
          G.running = false;
          // 安全策：停止時に全体をキャンバスに収める。ただしジャンプさせず、
          // 視点を650msかけて補間する。ユーザーがホイールやドラッグで視点
          // を変えていた場合は上書きしない。
          if (!G.viewTouched) animateFit(650);
          updatePlayBtn();
        }
      }
      if (G.dim === '3d' && G.autoRotate) G.rotY += 0.004;
      draw();
      if (G.running || (G.dim === '3d' && G.autoRotate) || (G.tween && G.tween.active)) {
        G.raf = nextFrame(frameLoop);
      } else {
        G.raf = null;
      }
    }

    function runSim() {
      if (!G.open) return;
      cancelFitAnim();
      if (!G.running) {
        G.running = true;
        G.tickCount = 0;
        G.calmTicks = 0;
        G.coolFactor = 0;
        updatePlayBtn();
      }
      if (G.raf == null) G.raf = nextFrame(frameLoop);
    }

    function stopSim() {
      G.running = false;
      // 一時停止は補間アニメーションもその場で止める
      cancelTween();
      cancelFitAnim();
      if (G.raf != null) { cancelFrame(G.raf); G.raf = null; }
      updatePlayBtn();
    }

    function updatePlayBtn() {
      const b = document.getElementById('graph-play');
      if (b) b.textContent = G.running ? '一時停止' : '再生';
    }

    // キャンバスの大きさが変わったときの処理。裏面バッファを合わせ、
    // ユーザーが視点を触っていなければ全体を収め直す（レイアウト確定後や
    // 広告表示などで高さが変わり、図がはみ出すのを防ぐ）。シミュレーション
    // やトゥイーンが走っている間は、停止・完了時のフィットに任せる。
    function onGraphResize() {
      if (!canvas || !G.open) return;
      sizeCanvas();
      if (G.tween && G.tween.active && G.dim === '2d') {
        // トゥイーン中のリサイズ：到達配置のフィット目標とクリック用の
        // スナップショットを新しい寸法で求め直す。フィット・アニメーション
        // 自体も寸法変化を毎フレーム追従するが、スナップショットはここで
        // 更新しないと古い寸法のままになる（A2の切替直後のクリック用）。
        const t = computeFitTarget(G.tween.to);
        if (t) {
          storeSettledSnapshot(G.tween.to, t);
          animateFit(650, t, G.tween.to);
        }
      } else if (!G.viewTouched && !G.running && !(G.tween && G.tween.active)) fitView();
      draw();
    }

    /* ---- 描画 ---- */
    let canvas = null, ctx = null;
    // ピンチズーム用：追跡中のポインタ（pointerId → 位置）とピンチ状態。
    // タップ説明用：自動で消えるまでのタイマー。
    const activePointers = new Map();
    let pinchState = null; // { d0, scale0, midX, midY } ピンチ中のみ
    let tipHideTimer = null;
    let TIP_AUTO_HIDE_MS = 5000;
    function sizeCanvas() {
      if (!canvas) return;
      const dpr = window.devicePixelRatio || 1;
      const w = canvas.clientWidth || 900, h = canvas.clientHeight || 560;
      canvas.width = Math.round(w * dpr);
      canvas.height = Math.round(h * dpr);
      if (ctx) ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }

    // 全体をキャンバスに収める視点（スケールと中心位置）を計算する。
    // フィットの余白（画面座標）。ノードのドットと全ラベルがこの余白を
    // 保ってキャンバスに収まるようにする。
    const FIT_MARGIN = 12;

    // 現在の視点で、ドット（半径込み）と全ラベル（章・ハブ・ノード）の
    // 画面上の和集合ボックスを返す。computeFitTarget の2パス目で使う。
    function unionScreenBox() {
      let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
      const eat = (bx0, by0, bx1, by1) => {
        if (!isFinite(bx0) || !isFinite(by0) || !isFinite(bx1) || !isFinite(by1)) return;
        if (bx0 < x0) x0 = bx0;
        if (by0 < y0) y0 = by0;
        if (bx1 > x1) x1 = bx1;
        if (by1 > y1) y1 = by1;
      };
      for (const n of G.visibleNodes) {
        const r = (typeof n.sr === 'number' && isFinite(n.sr)) ? n.sr : 4.2;
        eat(n.sx - r, n.sy - r, n.sx + r, n.sy + r);
      }
      // 章ラベルとハブラベル（2D全体図）
      if (G.dim === '2d' && G.mode === 'all' && G.hub) {
        const ch = computeChapterLabelLayout();
        if (ch) {
          // ハブラベルのプレート（描画と同じ大きさ）
          eat(ch.hub.x - 32, ch.hub.y + 14, ch.hub.x + 32, ch.hub.y + 38);
          for (const it of ch.items) eat(it.box.x0, it.box.y0, it.box.x1, it.box.y1);
        }
      }
      // ノードラベル（周辺表示の中心・1段目・2段目、3Dの選択・ホバー）
      for (const lb of computeLabelLayout()) eat(lb.box.x0, lb.box.y0, lb.box.x1, lb.box.y1);
      if (!isFinite(x0)) return null;
      return { x0, y0, x1, y1 };
    }

    // フィット目標を計算する。positions（Map: idx → {x, y}）が与えられ
    // た場合はその座標で求める（全体図への切替時に、到達する配置で
    // 視点を決めるため）。画面座標での余白で割り、ラベルを含めた2パス
    // で余白を確保する。
    // 必須ラベル（2D周辺表示の中心・1段目）の重なり組数。フィットの候補
    // 選びで使う：小さい画面では全体を収めるために縮小すると1段目ラベルが
    // 重なるため、重なり0の候補を優先する（2段目のはみ出しはパンで見られる）。
    // 全体図・3Dでは必須ラベルがないので常に0。
    function mustLabelOverlaps() {
      if (!(G.dim === '2d' && G.mode === 'local')) return 0;
      const must = new Set([G.center, ...(G.localHop1 || [])]);
      const lbs = computeLabelLayout().filter((lb) => must.has(lb.idx));
      let n = 0;
      for (let i = 0; i < lbs.length; i++) {
        for (let j = i + 1; j < lbs.length; j++) {
          const a = lbs[i].box, b = lbs[j].box;
          if (a.x0 < b.x1 && a.x1 > b.x0 && a.y0 < b.y1 && a.y1 > b.y0) n++;
        }
      }
      return n;
    }

    function computeFitTarget(positions) {
      const ns = G.visibleNodes;
      if (!ns.length || !canvas) return null;
      const posOf = (n) => (positions && positions.get(n.i)) || n;
      let minX = 1e9, maxX = -1e9, minY = 1e9, maxY = -1e9;
      for (const n of ns) {
        const p = posOf(n);
        if (p.x < minX) minX = p.x;
        if (p.x > maxX) maxX = p.x;
        if (p.y < minY) minY = p.y;
        if (p.y > maxY) maxY = p.y;
      }
      const w = canvas.clientWidth || 900, h = canvas.clientHeight || 560;
      const bw = Math.max(60, maxX - minX), bh = Math.max(60, maxY - minY);
      // 画面座標での余白で割る。従来の +90 はワールド単位で、縮小後の
      // 画面上の余白が 10px を切ることがあった（1600×670 で下端 9.4px）。
      const pad = 2 * (FIT_MARGIN + 6);
      const s = Math.min((w - pad) / bw, (h - pad) / bh);
      // 下限 0.05：広がり×5の2D全体図（必要倍率 約0.06）でもフィットが
      // 収まるようにする。周辺表示では重なり0の候補が優先されるため、
      // 小さい画面でも下限まで縮小することはほとんどない。
      // デスクトップの通常のフィット（0.25以上）には影響しない。
      let scale = Math.max(0.05, Math.min(4, s));
      let ox = -(minX + maxX) / 2 * scale, oy = -(minY + maxY) / 2 * scale;
      // 2パス目：ラベルを含めた画面上の和集合が余白を保って収まるよう、
      // スケールと中心を調整する（最大12回まで反復）。候補の視点を一時的
      // に適用して測り、終わったら元の視点・位置に戻す。
      const savedView = { scale: G.scale, ox: G.ox, oy: G.oy };
      const savedPos = new Map();
      if (positions) {
        for (const n of G.nodes) {
          const p = positions.get(n.i);
          if (p) { savedPos.set(n.i, { x: n.x, y: n.y, z: n.z }); n.x = p.x; n.y = p.y; n.z = 0; }
        }
      }
      try {
        // ラベルの配置は視点によって不連続に変わる（候補の切り替え）ため、
        // 反復が収束しないことがある。測定済みの視点のうち最も良いもの
        // （はみ出しが最小、できれば余白内）を返すことで、未測定の視点を
        // 返すのを防ぐ。
        let best = null;
        for (let iter = 0; iter < 12; iter++) {
          G.scale = scale; G.ox = ox; G.oy = oy;
          syncScreenCoords();
          const box = unionScreenBox();
          if (!box) break;
          const overL = FIT_MARGIN - box.x0, overR = box.x1 - (w - FIT_MARGIN);
          const overT = FIT_MARGIN - box.y0, overB = box.y1 - (h - FIT_MARGIN);
          const worst = Math.max(overL, overR, overT, overB);
          // 候補の良さは必須ラベルの重なりを最優先し、次にはみ出しを見る。
          // 小さい画面では、全体を収めようとして縮小すると1段目ラベルが
          // 重なるため、はみ出しが残っても重なり0の候補を選ぶ。
          const ov = mustLabelOverlaps();
          const score = ov * 100000 + worst;
          if (!best || score < best.score) best = { scale, ox, oy, worst, score, ov };
          if (worst <= 0) break;
          const boxW = box.x1 - box.x0, boxH = box.y1 - box.y0;
          // 1回の縮小は最大10%まで：和集合の比で一気に縮めると、重なり0で
          // 収まる中間の倍率（小さい画面の周辺表示で0.3付近）を飛ばして
          // しまうため。12回までの反復で段階的に寄せる。
          const f = Math.max(0.9, Math.min((w - 2 * FIT_MARGIN) / boxW, (h - 2 * FIT_MARGIN) / boxH, 1));
          const s2 = Math.max(0.05, scale * f);
          // スケール変更は原点（画面中心＋オフセット）を中心に行われるので、
          // 和集合の中心の移動量を計算してから画面中心へ移す。
          const Ox = w / 2 + ox, Oy = h / 2 + oy;
          const bcx = (box.x0 + box.x1) / 2, bcy = (box.y0 + box.y1) / 2;
          const ratio = s2 / scale;
          const bcx2 = Ox + (bcx - Ox) * ratio, bcy2 = Oy + (bcy - Oy) * ratio;
          ox += (w / 2 - bcx2);
          oy += (h / 2 - bcy2);
          scale = s2;
        }
        if (best) { scale = best.scale; ox = best.ox; oy = best.oy; }
      } finally {
        G.scale = savedView.scale; G.ox = savedView.ox; G.oy = savedView.oy;
        for (const [i, p] of savedPos) { const n = G.nodes[i]; n.x = p.x; n.y = p.y; n.z = p.z; }
        syncScreenCoords();
      }
      return { scale, ox, oy };
    }

    function fitView() {
      const t = computeFitTarget();
      if (!t) return;
      G.scale = t.scale;
      G.ox = t.ox;
      G.oy = t.oy;
    }

    // ピンチ終了後に内容が画面外へ完全にはみ出していたらフィットし直す。
    // 一部のはみ出し（意図したパン）はそのままにする。
    function refitIfOffscreen() {
      if (!canvas || !G.open) return;
      syncScreenCoords();
      const box = unionScreenBox();
      if (!box) return;
      const w = canvas.clientWidth || 900, h = canvas.clientHeight || 560;
      if (box.x1 < 0 || box.x0 > w || box.y1 < 0 || box.y0 > h) fitView();
    }

    function cancelFitAnim() {
      // 世代カウンタを進めて、進行中のフィット・アニメーションも止める。
      G.fitToken = (G.fitToken || 0) + 1;
      if (G.fitRaf != null) { cancelFrame(G.fitRaf); G.fitRaf = null; }
    }

    // 停止時のフィットをジャンプさせず、視点を補間してアニメーションする。
    // ユーザーが視点を変えたら（viewTouched）途中で中止する。
    // スケールはフィット後のスケールを超えないよう制限する（展開アニメー
    // ション中に図がキャンバスからはみ出すのを防ぐ）。ビュー切替で古い
    // フィット目標へ書き戻されないよう、世代カウンタで陳腐化を検出する。
    // fixedTarget が与えられた場合は、到達する配置でのフィット目標を
    // 使う（全体図への切替時：トゥイーン中の補間位置ではなく最終配置で
    // 視点を決める）。fixedPositions（到達配置）が与えられた場合は、
    // キャンバス寸法が変わるたびにその配置でのフィット目標を求め直す
    // （広告読み込み等でトゥイーン中に寸法が変わっても、古い小さい寸法
    // でのフィット目標のまま完了してラベルが省略表示になるのを防ぐ）。
    function animateFit(durationMs, fixedTarget, fixedPositions) {
      const target0 = fixedTarget || computeFitTarget();
      if (!target0) return;
      cancelFitAnim();
      const token = G.fitToken;
      const from = { scale: G.scale, ox: G.ox, oy: G.oy };
      const dur = durationMs || 650;
      const nowFn = () => (typeof performance !== 'undefined' && performance.now) ? performance.now() : Date.now();
      const t0 = nowFn();
      let lastW = -1, lastH = -1, liveTarget = target0;
      const step = () => {
        if (token !== G.fitToken || !G.open || G.viewTouched) { G.fitRaf = null; return; }
        const t = Math.min(1, (nowFn() - t0) / dur);
        const e = 1 - Math.pow(1 - t, 3);
        let target;
        if (fixedPositions) {
          const w = canvas ? (canvas.clientWidth || 900) : 900;
          const h = canvas ? (canvas.clientHeight || 560) : 560;
          if (w !== lastW || h !== lastH) {
            liveTarget = computeFitTarget(fixedPositions) || target0;
            lastW = w; lastH = h;
          }
          target = liveTarget;
        } else {
          target = computeFitTarget() || target0;
        }
        const s = from.scale + (target.scale - from.scale) * e;
        G.scale = Math.min(s, target.scale);
        G.ox = from.ox + (target.ox - from.ox) * e;
        G.oy = from.oy + (target.oy - from.oy) * e;
        draw();
        if (t < 1) G.fitRaf = nextFrame(step);
        else G.fitRaf = null;
      };
      G.fitRaf = nextFrame(step);
    }

    function project(n) {
      const w = canvas ? (canvas.clientWidth || 900) : 900;
      const h = canvas ? (canvas.clientHeight || 560) : 560;
      const cx = w / 2, cy = h / 2;
      if (G.dim !== '3d') {
        return { x: cx + n.x * G.scale + G.ox, y: cy + n.y * G.scale + G.oy, f: 1, z: 0 };
      }
      const sinX = Math.sin(G.rotX), cosX = Math.cos(G.rotX);
      const sinY = Math.sin(G.rotY), cosY = Math.cos(G.rotY);
      const y1 = n.y * cosX - n.z * sinX, z1 = n.y * sinX + n.z * cosX;
      const x2 = n.x * cosY + z1 * sinY, z2 = -n.x * sinY + z1 * cosY, y2 = y1;
      let f = 1 / (1 + z2 * 0.0011);
      if (f < 0.35) f = 0.35;
      if (f > 2.2) f = 2.2;
      return { x: cx + x2 * f * G.scale + G.ox, y: cy + y2 * f * G.scale + G.oy, f, z: z2 };
    }

    // 画面座標を現在のワールド座標・視点から同期する（draw() と同じ投影）。
    // hitNode/hitChapter は描画の最終フレームの sx/sy を見ていたため、
    // トゥイーン中やフィット・アニメーション中は表示位置と判定位置が最大
    // 1フレーム分ずれ、密集部で誤判定・無反応が起きていた。判定のたびに
    // 現在の補間位置から同期し直すことで、表示と判定を常に一致させる。
    function syncScreenCoords() {
      for (const n of G.visibleNodes) {
        const p = project(n);
        n.sx = p.x; n.sy = p.y; n.sf = p.f; n.sdepth = p.z;
        n.sr = dotRadius(p.f);
      }
      if (G.hub) { const hp = project(G.hub); G.hub.sx = hp.x; G.hub.sy = hp.y; }
      if (G.chapterNodes) {
        for (const cn of G.chapterNodes) { const cp = project(cn); cn.sx = cp.x; cn.sy = cp.y; }
      }
    }

    // 記述文の整形（descOfLi と同じ）。JSON の descRaw（li テキスト）から
    // 表示用の desc を作る。先頭の（…）：と先頭の：—類を除く。
    function cleanDesc(t) {
      return (t || '').replace(/\s+/g, ' ').trim()
        .replace(/^（[^）]*）：\s*/, '').replace(/^[：:—―\-–\s]+/, '');
    }

    // ラベルの文字幅の見積もり（描画・ヒット判定で共通）。全角は1文字幅、
    // 半角（ASCII）は約0.55文字幅。ctx.measureText は jsdom では使えない
    // ため、描画とテストで同じ見積もりを使う。
    function textWidth(name, fs) {
      let w = 0;
      for (const ch of name) {
        const c = ch.codePointAt(0);
        w += (c < 0x1100) ? 0.55 : 1.0;
      }
      return w * fs;
    }

    // ドットの描画半径（2Dでは f=1）。ヒット判定・テストフックと共通。
    function dotRadius(f) {
      return Math.max(1.2, Math.min(6, 4.2 * f));
    }

    // ラベルの背景プレートの色（半透明の白）。辺の上でも読めるようにする。
    const LABEL_BG = 'rgba(255,255,255,0.78)';

    // 長い名前を2行に折り返す分割位置を求める（省略「…」の代わりに全文表示）。
    // 区切りの良し悪しを段階で分け、段階が違うもの同士は幅のバランスより
    // 段階を優先する。段階0：自然な区切り（閉じ括弧・句読点・空白・助詞の後、
    // 開き括弧の前）。段階1：それ以外（漢字同士など。日本語ではやむを得ない）。
    // 段階2：避けたい区切り（英単語の途中、行が開き括弧で終わる／閉じ括弧で
    // 始まる）。従来は幅のバランスだけを見ていたため、ボーナス（6px）が
    // 幅の差（数十px）に負けて「Co-regulati|on」のように英単語の途中で
    // 切れていた。
    function splitName(name, f) {
      const chars = [...name];
      if (chars.length < 8) return null;
      const fullW = textWidth(name, f);
      const isLatin = (ch) => /[A-Za-z0-9]/.test(ch || '');
      const tier = (i) => {
        const prev = chars[i - 1], next = chars[i];
        if ((isLatin(prev) && isLatin(next))
          || (isLatin(prev) && next === '-')
          || (prev === '-' && isLatin(next))) return 2; // 英単語の途中
        if ('（「『'.includes(prev)) return 2; // 行が開き括弧で終わる
        if ('）」』'.includes(next)) return 2; // 行が閉じ括弧で始まる
        if ('）」』、。，．・＝, '.includes(prev)) return 0;
        if ('（「『'.includes(next)) return 0;
        if ('とのでがはにをへやもかねよ'.includes(prev)) return 0;
        return 1;
      };
      let best = null, bestScore = Infinity;
      for (let i = 2; i <= chars.length - 2; i++) {
        const l1 = chars.slice(0, i).join(''), l2 = chars.slice(i).join('');
        const w1 = textWidth(l1, f), w2 = textWidth(l2, f);
        const mx = Math.max(w1, w2);
        const t = tier(i);
        // 折り返しても1行と大差ない場合は使わない。ただし自然な区切り
        // （段階0）は多少アンバランスでも価値があるので上限を緩める。
        // 「CADSS（臨床家施行解離状態尺度）」の括弧前（0.825倍）が
        // 一律0.82で弾かれて語の途中で切れていたため。
        const limit = t === 0 ? fullW * 0.95 : fullW * 0.82;
        if (mx > limit) continue;
        const score = t * 10000 + mx;
        if (score < bestScore) { bestScore = score; best = [l1, l2]; }
      }
      return best;
    }

    // ノードのラベル配置（純粋関数。draw() と hitNode で共通）。
    // 描画するラベルだけを返す。戻り値: [{ idx, x, y, toRight, fs, box, dy }]
    // 候補を複数試す：既定位置→上下にずらす→反対側→フォントを小さくする。
    // 1段目（must）のラベルは必ず描く。2段目などは重なりが避けられなけれ
    // ば描かない。ラベル同士の重なりだけでなく、他ノードのドットをラベル
    // 矩形の中に含まないことも優先する（ドットが文字に隠れると、クリック
    // した文字とドットのどちらを指したのか分からなくなるため）。
    function computeLabelLayout() {
      const isMind = G.dim !== '3d';
      const placed = [];
      const out = [];
      // ドット位置の粗いグリッド（候補の矩形にドットが入るかの判定用）
      const grid = new Map();
      const CELL = 48;
      for (const m of G.visibleNodes) {
        const k = Math.floor(m.sx / CELL) + ',' + Math.floor(m.sy / CELL);
        let arr = grid.get(k);
        if (!arr) { arr = []; grid.set(k, arr); }
        arr.push(m);
      }
      const dotInside = (box, selfIdx) => {
        const x0 = Math.floor((box.x0 - 2) / CELL), x1 = Math.floor((box.x1 + 2) / CELL);
        const y0 = Math.floor((box.y0 - 2) / CELL), y1 = Math.floor((box.y1 + 2) / CELL);
        for (let gx = x0; gx <= x1; gx++) {
          for (let gy = y0; gy <= y1; gy++) {
            const arr = grid.get(gx + ',' + gy);
            if (!arr) continue;
            for (const m of arr) {
              if (m.i === selfIdx) continue;
              if (m.sx >= box.x0 - 2 && m.sx <= box.x1 + 2 && m.sy >= box.y0 - 2 && m.sy <= box.y1 + 2) return true;
            }
          }
        }
        return false;
      };
      const placeLabel = (n, fs, toRight, must) => {
        // 2段目など（mustでない）ラベルは、実描画のプレート（boxの外側2px）
        // と白い縁取り（2px）が隣のプレート・文字に触れないよう、box間に
        // 6pxの隙間を要求する。box同士の重なりは0件でも、隙間が2〜4pxだと
        // プレート同士が重なって判読しづらかったため。ドットを含む候補も
        // 許さない。候補が無ければ描かない（ドットだけ表示し、ホバーで
        // 名前が分かる）。1段目・中心（must）は従来どおり2pxの余白で、
        // 必ず描く。
        const M = must ? 2 : 6;
        const overlapsS = (a, b) => a.x0 < b.x1 + M && a.x1 + M > b.x0 && a.y0 < b.y1 + M && a.y1 + M > b.y0;
        // 候補を広く取る：フォント 11/10/9 × 両側 × 上下 ±64px まで。
        // 密集部では ±32px では足りず、長いラベル同士が重なっていた。
        // 長い名前は2行折り返しの候補も作る（省略「…」より全文表示を優先）。
        // 1段目・中心（must）はさらにフォント8と ±80px まで広げる。
        // 小さいキャンバス（900px幅など）では fs=9・±64px だけでは足りず、
        // 「ポリヴェーガル理論（ポージェス, 1994〜）」などが省略表示に
        // なっていたため。
        const fonts = must
          ? (fs === 10 ? [10, 9, 8, 7] : [fs, 10, 9, 8, 7])
          : (fs === 10 ? [10, 9, 8] : [fs, 10, 9, 8]);
        const dys = must
          ? [0, -16, 16, -32, 32, -48, 48, -64, 64, -80, 80]
          : [0, -16, 16, -32, 32, -48, 48, -64, 64];
        const mkCand = (f, side, dy, lines) => {
          const ax = side ? n.sx + n.sr + 4 : n.sx - n.sr - 4;
          const ay = n.sy + 2 + dy;
          if (!lines) {
            const w = textWidth(n.name, f);
            const box = side
              ? { x0: ax, y0: ay - f * 0.7, x1: ax + w, y1: ay + f * 0.7 }
              : { x0: ax - w, y0: ay - f * 0.7, x1: ax, y1: ay + f * 0.7 };
            return { f, side, dy, x: ax, y: ay, box, lines: null, text: n.name };
          }
          const w = Math.max(textWidth(lines[0], f), textWidth(lines[1], f));
          const box = side
            ? { x0: ax, y0: ay - f * 1.3, x1: ax + w, y1: ay + f * 1.3 }
            : { x0: ax - w, y0: ay - f * 1.3, x1: ax, y1: ay + f * 1.3 };
          return { f, side, dy, x: ax, y: ay, box, lines, text: n.name };
        };
        const cands = [];
        for (const f of fonts) {
          for (const side of [toRight, !toRight]) {
            for (const dy of dys) {
              cands.push(mkCand(f, side, dy, null));
            }
          }
          const sp = splitName(n.name, f);
          if (sp) {
            for (const side of [toRight, !toRight]) {
              for (const dy of dys) {
                cands.push(mkCand(f, side, dy, sp));
              }
            }
          }
        }
        let pick = null;
        for (const c of cands) {
          if (placed.some((b) => overlapsS(c.box, b))) continue;
          if (dotInside(c.box, n.i)) continue;
          pick = c; break;
        }
        if (!pick && must) {
          for (const c of cands) {
            if (placed.some((b) => overlapsS(c.box, b))) continue;
            pick = c; break;
          }
        }
        // (3)(4) 密集部では余白を譲り、面積の重なりだけを避ける（0.3pxの
        // 僅差で候補が全滅するのを防ぐ）。文字同士は重ならないので読める。
        // 1段目・中心（must）だけの緩和で、2段目はプレートの隙間を譲らない。
        const overlapsArea = (a, b) => a.x0 < b.x1 && a.x1 > b.x0 && a.y0 < b.y1 && a.y1 > b.y0;
        if (!pick && must) {
          for (const c of cands) {
            if (placed.some((b) => overlapsArea(c.box, b))) continue;
            if (dotInside(c.box, n.i)) continue;
            pick = c; break;
          }
        }
        if (!pick && must) {
          for (const c of cands) {
            if (placed.some((b) => overlapsArea(c.box, b))) continue;
            pick = c; break;
          }
        }
        if (!pick) {
          // 微調整：重なり面積の小さい候補から順に、上下に数pxずらして
          // 分離を試みる。残る重なりは1〜2pxの垂直方向のものがほとんどで、
          // 全文表示のまま数pxのずれで解消できる。省略表示より優先する。
          // 面積0でも2pxの余白規則で弾かれる候補があるため、面積0で
          // 打ち切らず、ずらして余白を確保する。
          const tryNudge = (allowDot, strict) => {
            const ranked = cands.map((c) => {
              let ov = 0;
              for (const b of placed) {
                const iw = Math.min(c.box.x1, b.x1) - Math.max(c.box.x0, b.x0);
                const ih = Math.min(c.box.y1, b.y1) - Math.max(c.box.y0, b.y0);
                if (iw > 0 && ih > 0) ov += iw * ih;
              }
              return { c, ov };
            }).sort((a, b) => a.ov - b.ov);
            // 1行・2行それぞれ上位3件を試す。2行は箱が大きく重なり面積が
            // 大きくなりがちなため、1行だけでは2行候補に順番が回らず、
            // 数pxのずれで分離できる折り返しが見逃されていた。
            const pool = [
              ...ranked.filter((r) => !r.c.lines).slice(0, 3),
              ...ranked.filter((r) => r.c.lines).slice(0, 3),
            ].sort((a, b) => a.ov - b.ov);
            for (const { c } of pool) {
              for (const d of [-2, 2, -4, 4, -6, 6, -8, 8, -10, 10, -12, 12, -16, 16, -20, 20]) {
                const box = { x0: c.box.x0, y0: c.box.y0 + d, x1: c.box.x1, y1: c.box.y1 + d };
                // strict（2段目）はプレートの隙間も要求し、ドットも許さない。
                if (strict ? placed.some((b) => overlapsS(box, b)) : placed.some((b) => overlapsArea(box, b))) continue;
                if (!allowDot && dotInside(box, n.i)) continue;
                return { f: c.f, side: c.side, dy: c.dy + d, x: c.x, y: c.y + d, box, lines: c.lines || null, text: n.name };
              }
            }
            return null;
          };
          // 2段目はドットを許す緩和をしない（tryNudge(true)はmustだけ）。
          pick = must ? (tryNudge(false, false) || tryNudge(true, false)) : tryNudge(false, true);
        }
        if (!pick && must) {
          // 省略表示（…）はしない。表示するラベルは全文表示する。
          // 水平方向のずらし（外側へ最大80px）も試す。引き出し線でドットと
          // 結ぶため、横にずれても対応が分かる。キャンバス端を超える候補は
          // 除く。どうしても重なる場合は、全文表示のまま重なり面積が最小の
          // 候補を選ぶ（他ノードのドットを含む候補は避ける）。1段目のラベルは
          // 必ず描く。候補の並びはフォントの大きい順・1行優先なので、重なり
          // 0のものが見つかった時点でその候補を採用する。
          const cw = canvas ? (canvas.clientWidth || 900) : 900;
          const keyOf = (box) => {
            let ov = 0;
            for (const b of placed) {
              const iw = Math.min(box.x1, b.x1) - Math.max(box.x0, b.x0);
              const ih = Math.min(box.y1, b.y1) - Math.max(box.y0, b.y0);
              if (iw > 0 && ih > 0) ov += iw * ih;
            }
            return ov + (dotInside(box, n.i) ? 1000000 : 0);
          };
          let minKey = Infinity;
          for (const c of cands) {
            const out = c.side ? 1 : -1;
            for (const dx of [0, 10 * out, 20 * out, 30 * out, 40 * out, 60 * out, 80 * out]) {
              const box = { x0: c.box.x0 + dx, y0: c.box.y0, x1: c.box.x1 + dx, y1: c.box.y1 };
              if (box.x0 < 2 || box.x1 > cw - 2) continue;
              const key = keyOf(box);
              if (key < minKey) {
                minKey = key;
                pick = { ...c, dx, x: c.x + dx, box, text: n.name };
              }
              if (minKey === 0) break;
            }
            if (minKey === 0) break;
          }
        }
        if (!pick) return null;
        placed.push(pick.box);
        const rec = { idx: n.i, x: pick.x, y: pick.y, toRight: pick.side, fs: pick.f, box: pick.box, dy: pick.dy, dx: pick.dx || 0, lines: pick.lines || null, text: pick.text || n.name };
        out.push(rec);
        return rec;
      };
      if (isMind && G.mode === 'local') {
        // 2D周辺表示はマインドマップ：中心＋1段目＋2段目に、中心からの方向に
        // 応じて左右に振り分けた横書きラベルを出す。中心と1段目は必ず描く。
        const hop1 = new Set(G.localHop1 || []);
        const order2 = [G.center, ...(G.localHop1 || []), ...Array.from(G.localParent.keys())]
          .filter((v, i, arr) => v >= 0 && arr.indexOf(v) === i);
        for (const i of order2) {
          if (!G.visible.has(i)) continue;
          const n = G.nodes[i];
          const c = G.center >= 0 ? G.nodes[G.center] : null;
          const cx = c ? c.x : 0, cy = c ? c.y : 0;
          const toRight = (n.i === G.center) || Math.cos(Math.atan2(n.y - cy, n.x - cx)) >= 0;
          placeLabel(n, 11, toRight, n.i === G.center || hop1.has(i));
        }
      } else if (G.mode === 'local') {
        // 3D周辺表示：中心・選択・ホバーとその言及相手にラベルを出す。
        const labelSet = new Set();
        const addMentionPartners = (idx) => {
          if (idx < 0) return;
          for (const a of G.adj[idx] || []) {
            if ((a.mention || a.coloc || a.rel) && G.visible.has(a.to)) labelSet.add(a.to);
          }
        };
        if (G.center >= 0) labelSet.add(G.center);
        if (G.hover >= 0) labelSet.add(G.hover);
        if (G.selected >= 0) labelSet.add(G.selected);
        addMentionPartners(G.center);
        addMentionPartners(G.selected);
        // 中心を先に描いて優先する
        const order = [G.center, G.selected, G.hover, ...labelSet]
          .filter((v, i, arr) => v >= 0 && arr.indexOf(v) === i);
        for (const i of order) {
          if (!G.visible.has(i)) continue;
          const n = G.nodes[i];
          placeLabel(n, 11, true, false);
        }
      } else {
        // 全体図では選択・ホバーのみ。3Dでは従来どおり。
        for (const i of [G.selected, G.hover]) {
          if (i >= 0 && G.visible.has(i)) {
            const n = G.nodes[i];
            placeLabel(n, 12, true, false);
          }
        }
      }
      return out;
    }

    // ラベルの後ろの半透明プレート（角丸が使えれば角丸、なければ四角）。
    function plateRect(x, y, w, h) {
      if (!ctx) return;
      ctx.beginPath();
      if (typeof ctx.roundRect === 'function') ctx.roundRect(x, y, w, h, 4);
      else ctx.rect(x, y, w, h);
      ctx.fill();
    }

    function draw() {
      if (!ctx || !canvas) return;
      const w = canvas.clientWidth || 900, h = canvas.clientHeight || 560;
      ctx.clearRect(0, 0, w, h);
      const dim3 = G.dim === '3d';
      const isMind = !dim3; // 2Dはマインドマップ
      const dimCh = (isMind && G.mode === 'all') ? G.dimChapter : null;
      const nodeDimmed = (n) => dimCh && n.chapter !== dimCh;
      const edgeDimmed = (e) => dimCh
        && G.nodes[e.a].chapter !== dimCh && G.nodes[e.b].chapter !== dimCh;
      // マインドマップの骨格（2D全体図のみ）：ハブ—章—項目。項目同士の辺とは
      // 区別できる線で描く。件数には数えない（G.edges には含めない）。
      if (isMind && G.mode === 'all' && G.hub && G.chapterNodes) {
        const hp = project(G.hub);
        G.hub.sx = hp.x; G.hub.sy = hp.y;
        for (const cn of G.chapterNodes) {
          const cp = project(cn);
          cn.sx = cp.x; cn.sy = cp.y;
        }
        ctx.lineWidth = 2;
        for (const cn of G.chapterNodes) {
          const faded = dimCh && cn.id !== dimCh;
          ctx.strokeStyle = cn.color;
          ctx.globalAlpha = faded ? 0.08 : 0.5;
          ctx.beginPath();
          ctx.moveTo(hp.x, hp.y);
          ctx.lineTo(cn.sx, cn.sy);
          ctx.stroke();
        }
        ctx.lineWidth = 1;
        for (const n of G.visibleNodes) {
          const cn = G.chapterNodes.find((c) => c.id === n.chapter);
          if (!cn) continue;
          const p = project(n);
          const faded = dimCh && n.chapter !== dimCh;
          ctx.strokeStyle = cn.color;
          ctx.globalAlpha = faded ? 0.04 : 0.22;
          ctx.beginPath();
          ctx.moveTo(cn.sx, cn.sy);
          ctx.lineTo(p.x, p.y);
          ctx.stroke();
        }
        ctx.globalAlpha = 1;
      }
      // 辺
      for (const e of G.visEdges) {
        const a = G.nodes[e.a], b = G.nodes[e.b];
        const pa = project(a), pb = project(b);
        a.sx = pa.x; a.sy = pa.y; a.sf = pa.f; a.sdepth = pa.z;
        b.sx = pb.x; b.sy = pb.y; b.sf = pb.f; b.sdepth = pb.z;
        if (e.rel) {
          ctx.strokeStyle = 'rgba(142,47,60,0.7)';
          ctx.lineWidth = 1.5;
          ctx.setLineDash([5, 3]);
        } else if (e.mention || e.coloc) {
          ctx.strokeStyle = 'rgba(0,0,0,0.45)';
          ctx.lineWidth = 1;
        } else if (e.weak) {
          ctx.strokeStyle = 'rgba(0,0,0,0.08)';
          ctx.lineWidth = 1;
        } else if (e.spoke) {
          ctx.strokeStyle = 'rgba(0,0,0,0.22)';
          ctx.lineWidth = 1;
        } else {
          ctx.strokeStyle = 'rgba(0,0,0,0.14)';
          ctx.lineWidth = 1;
        }
        ctx.globalAlpha = edgeDimmed(e) ? 0.08 : 1;
        ctx.beginPath();
        ctx.moveTo(pa.x, pa.y);
        ctx.lineTo(pb.x, pb.y);
        ctx.stroke();
        ctx.setLineDash([]);
      }
      ctx.globalAlpha = 1;
      // ノード（3Dでは奥から描く）
      const order = dim3
        ? [...G.visibleNodes].sort((p, q) => q.sdepth - p.sdepth)
        : G.visibleNodes;
      for (const n of order) {
        const p = project(n);
        n.sx = p.x; n.sy = p.y; n.sf = p.f; n.sdepth = p.z;
        const r = dotRadius(p.f);
        n.sr = r;
        ctx.beginPath();
        ctx.arc(p.x, p.y, r, 0, Math.PI * 2);
        ctx.fillStyle = CHAPTER_COLOR[n.chapter] || '#888888';
        ctx.globalAlpha = nodeDimmed(n) ? 0.12 : (dim3 ? Math.max(0.45, Math.min(1, p.f)) : 1);
        ctx.fill();
        ctx.globalAlpha = 1;
        if (n.i === G.selected || n.i === G.hover || (G.mode === 'local' && n.i === G.center)) {
          ctx.beginPath();
          ctx.arc(p.x, p.y, r + 3, 0, Math.PI * 2);
          ctx.strokeStyle = n.i === G.selected ? '#111111' : 'rgba(0,0,0,0.45)';
          ctx.lineWidth = n.i === G.selected ? 2 : 1.4;
          ctx.stroke();
        }
      }
      // ハブと章ノード（2D全体図のみ）
      if (isMind && G.mode === 'all' && G.hub && G.chapterNodes) {
        for (const cn of G.chapterNodes) {
          const faded = dimCh && cn.id !== dimCh;
          ctx.beginPath();
          ctx.arc(cn.sx, cn.sy, 9, 0, Math.PI * 2);
          ctx.fillStyle = cn.color;
          ctx.globalAlpha = faded ? 0.25 : 1;
          ctx.fill();
          ctx.globalAlpha = 1;
          ctx.lineWidth = 2;
          ctx.strokeStyle = 'rgba(255,255,255,0.95)';
          ctx.stroke();
        }
        const hp = project(G.hub);
        ctx.beginPath();
        ctx.arc(hp.x, hp.y, 13, 0, Math.PI * 2);
        ctx.fillStyle = '#111111';
        ctx.fill();
        ctx.lineWidth = 2;
        ctx.strokeStyle = 'rgba(255,255,255,0.95)';
        ctx.stroke();
        // ハブと章のラベル（横書き・2行）。章ラベルは章ドットから弧の外側へ
        // ずらし、ハブラベル・ドット・他の章ラベルと重ならない（9章すべて描く）。
        const chLayout = computeChapterLabelLayout();
        ctx.textBaseline = 'middle';
        ctx.textAlign = 'center';
        ctx.font = 'bold 13px sans-serif';
        ctx.lineWidth = 4;
        ctx.strokeStyle = 'rgba(255,255,255,0.9)';
        // ハブラベルの後ろに半透明の白いプレート（辺の上でも読めるように）
        ctx.fillStyle = LABEL_BG;
        plateRect(hp.x - 32, hp.y + 14, 64, 24);
        ctx.strokeText('変性意識', hp.x, hp.y + 26);
        ctx.fillStyle = '#111111';
        ctx.fillText('変性意識', hp.x, hp.y + 26);
        if (chLayout) {
          ctx.font = 'bold 12px sans-serif';
          for (const it of chLayout.items) {
            const cn = G.chapterNodes.find((c) => c.id === it.id);
            const faded = dimCh && it.id !== dimCh;
            ctx.globalAlpha = faded ? 0.25 : 1;
            // ドットからラベルへの短い引き出し線
            if (cn) {
              const ux = it.x - cn.sx, uy = it.y - cn.sy;
              const ul = Math.hypot(ux, uy) || 1;
              ctx.lineWidth = 1;
              ctx.strokeStyle = it.color;
              ctx.globalAlpha = faded ? 0.1 : 0.35;
              ctx.beginPath();
              ctx.moveTo(cn.sx + ux / ul * 10, cn.sy + uy / ul * 10);
              ctx.lineTo(it.x, it.y);
              ctx.stroke();
              ctx.globalAlpha = faded ? 0.25 : 1;
            }
            // 章ラベルの後ろに半透明の白いプレート
            ctx.fillStyle = LABEL_BG;
            plateRect(it.box.x0 - 2, it.box.y0 - 2, it.box.x1 - it.box.x0 + 4, it.box.y1 - it.box.y0 + 4);
            ctx.lineWidth = 4;
            ctx.strokeStyle = 'rgba(255,255,255,0.9)';
            ctx.strokeText(it.num, it.x, it.y - 7);
            ctx.strokeText(it.short, it.x, it.y + 6);
            ctx.fillStyle = it.color;
            ctx.fillText(it.num, it.x, it.y - 7);
            ctx.fillText(it.short, it.x, it.y + 6);
            ctx.globalAlpha = 1;
          }
        }
        ctx.textAlign = 'left';
      }
      // ラベル：背景プレート＋引き出し線＋白い縁取りの上に文字を描く。
      // ずらして配置したラベルはドットからの引き出し線で結ぶ。
      // （配置は computeLabelLayout() で共通化。hitNode でも同じ矩形を使う）
      const labelLayout = computeLabelLayout();
      ctx.textBaseline = 'middle';
      for (const lb of labelLayout) {
        const n = G.nodes[lb.idx];
        ctx.fillStyle = LABEL_BG;
        plateRect(lb.box.x0 - 2, lb.box.y0 - 2, lb.box.x1 - lb.box.x0 + 4, lb.box.y1 - lb.box.y0 + 4);
      }
      for (const lb of labelLayout) {
        const n = G.nodes[lb.idx];
        if (Math.abs(lb.dy || 0) >= 14 || Math.abs(lb.dx || 0) >= 14) {
          ctx.lineWidth = 1;
          ctx.strokeStyle = 'rgba(0,0,0,0.35)';
          ctx.beginPath();
          ctx.moveTo(lb.toRight ? n.sx + n.sr : n.sx - n.sr, n.sy);
          ctx.lineTo(lb.x, lb.y);
          ctx.stroke();
        }
      }
      for (const lb of labelLayout) {
        const n = G.nodes[lb.idx];
        ctx.font = lb.fs + 'px sans-serif';
        ctx.textAlign = lb.toRight ? 'left' : 'right';
        ctx.lineWidth = 4;
        ctx.strokeStyle = 'rgba(255,255,255,0.9)';
        if (lb.lines) {
          ctx.strokeText(lb.lines[0], lb.x, lb.y - lb.fs * 0.65);
          ctx.strokeText(lb.lines[1], lb.x, lb.y + lb.fs * 0.65);
          ctx.fillStyle = '#111111';
          ctx.fillText(lb.lines[0], lb.x, lb.y - lb.fs * 0.65);
          ctx.fillText(lb.lines[1], lb.x, lb.y + lb.fs * 0.65);
        } else {
          ctx.strokeText(lb.text || n.name, lb.x, lb.y);
          ctx.fillStyle = '#111111';
          ctx.fillText(lb.text || n.name, lb.x, lb.y);
        }
      }
      ctx.textAlign = 'left';
    }

    function requestDraw() {
      if (!G.open) return;
      if (!G.running && G.raf == null) draw();
    }

    /* ---- 選択・詳細 ---- */
    function renderDetail(idx) {
      const d = document.getElementById('graph-detail');
      if (!d) return;
      d.innerHTML = '';
      if (idx < 0) {
        const p = document.createElement('p');
        p.className = 'graph-detail-empty';
        p.textContent = 'ノードをクリックすると詳細が表示されます。ドラッグで移動、ホイール／ピンチでズームできます。3Dではドラッグで回転します。タッチではノードをタップすると説明が表示されます。';
        d.appendChild(p);
        return;
      }
      const n = G.nodes[idx];
      const h = document.createElement('h3');
      const a = document.createElement('a');
      a.href = n.href;
      a.target = '_blank';
      a.rel = 'noopener noreferrer';
      a.textContent = n.name;
      h.appendChild(a);
      d.appendChild(h);
      const meta = document.createElement('div');
      meta.className = 'gd-meta';
      meta.textContent = chapterLabel(n.chapter)
        + '　' + (n.birth != null ? fmtSpan(n.birth, n.death) : '生没年なし');
      d.appendChild(meta);
      if (n.tags.length) {
        const tags = document.createElement('div');
        tags.className = 'gd-tags';
        n.tags.forEach((t) => {
          const s = document.createElement('span');
          s.textContent = (typeof TAGS !== 'undefined' && TAGS[t]) ? TAGS[t] : t;
          tags.appendChild(s);
        });
        d.appendChild(tags);
      }
      const adj = G.adj[idx] || [];
      // 「つながり」は描画される辺の次数（強い辺：タグ3つ以上／言及／同行）。
      // タグ1つ以上共有の件数は別行で表示する。
      const deg = G.degStrong[idx] || 0;
      const mentions = G.edges.filter((e) => (e.a === idx || e.b === idx) && (e.mention || e.coloc)).length;
      const tagShared = adj.filter((e) => e.tagW >= 1).length;
      const info = document.createElement('div');
      info.className = 'gd-meta';
      info.textContent = 'つながり：' + deg + '件（うち言及・同行 ' + mentions + '件） — この項目から出る強い辺の数です';
      d.appendChild(info);
      const degW = G.degWeak[idx] || 0;
      const infoW = document.createElement('div');
      infoW.className = 'gd-meta';
      infoW.textContent = '弱い辺：' + degW + '件（タグ2つ共通の上位3件）';
      d.appendChild(infoW);
      // 交流：相手名（type）の一覧。クリックでその項目を中心にした周辺表示へ。
      const rels = G.edges.filter((e) => e.rel && (e.a === idx || e.b === idx));
      if (rels.length) {
        const relHead = document.createElement('div');
        relHead.className = 'gd-meta';
        relHead.textContent = '交流：';
        d.appendChild(relHead);
        const relList = document.createElement('div');
        relList.className = 'gd-rel';
        rels.forEach((e) => {
          const other = e.a === idx ? e.b : e.a;
          const on = G.nodes[other];
          if (!on) return;
          const btn = document.createElement('button');
          btn.type = 'button';
          btn.className = 'gd-rel-item';
          btn.textContent = on.name + '（' + e.rel.type + '）';
          if (e.rel.note) btn.title = e.rel.note;
          btn.addEventListener('click', () => setCenter(other));
          relList.appendChild(btn);
          if (e.rel.source) {
            const src = document.createElement('a');
            src.href = e.rel.source;
            src.target = '_blank';
            src.rel = 'noopener noreferrer';
            src.textContent = '出典';
            relList.appendChild(src);
          }
        });
        d.appendChild(relList);
      }
      const info2 = document.createElement('div');
      info2.className = 'gd-meta';
      info2.textContent = 'タグを1つ以上共有：' + tagShared + '件（図の辺は3つ以上共通、または2つ共通の上位3件のみ）';
      d.appendChild(info2);
      const links = document.createElement('div');
      links.className = 'gd-links';
      const note = document.createElement('a');
      note.href = n.href;
      note.target = '_blank';
      note.rel = 'noopener noreferrer';
      note.textContent = n.article ? 'note記事を開く' : 'noteで検索する';
      note.style.cssText = 'color: var(--text); border-bottom: 1px solid rgba(0,0,0,0.35);';
      links.appendChild(note);
      // 単独ページでは一覧の DOM がないため、一覧ページへのリンクにする。
      // 一覧ページに埋め込まれている場合は従来どおり一覧で開く。
      if (!n.el) {
        const openLink = document.createElement('a');
        openLink.href = 'knowledgenetwork.html';
        openLink.textContent = '一覧で開く';
        openLink.style.cssText = 'color: var(--text); border-bottom: 1px solid rgba(0,0,0,0.35);';
        links.appendChild(openLink);
      } else {
        const openBtn = document.createElement('button');
        openBtn.type = 'button';
        openBtn.textContent = '一覧で開く';
        openBtn.addEventListener('click', () => openInList(idx));
        links.appendChild(openBtn);
      }
      const hint = document.createElement('div');
      hint.className = 'gd-note';
      hint.textContent = '2Dでは全体図のノードをクリックすると周辺表示に切り替わります。周辺表示では、ノードのクリックで中心が切り替わります。';
      links.appendChild(hint);
      d.appendChild(links);
    }

    function selectNode(idx) {
      G.selected = idx;
      renderDetail(idx);
      requestDraw();
    }

    function openInList(idx) {
      const n = G.nodes[idx];
      if (!n) return;
      // 単独ページでは一覧の DOM がないため、一覧ページへ遷移する。
      if (!n.el) { window.location.href = 'knowledgenetwork.html'; return; }
      setGraphOpen(false);
      const q = document.getElementById('q');
      const chapter = document.getElementById('chapter');
      if (q) q.value = '';
      if (chapter) chapter.value = '';
      activeTag = '';
      document.querySelectorAll('.tag-chip').forEach((c) => c.classList.remove('is-active'));
      if (q) q.dispatchEvent(new Event('input'));
      const li = n.el.closest('li');
      if (li) {
        if (li.scrollIntoView) li.scrollIntoView({ block: 'center' });
        li.classList.add('flash');
        setTimeout(() => li.classList.remove('flash'), 1800);
      }
    }

    /* ---- 中心・モード切替 ---- */
    function findNodeByName(q) {
      q = (q || '').trim();
      if (!q) return -1;
      const exact = G.nodes.find((n) => n.name === q);
      if (exact) return exact.i;
      const cands = G.nodes.filter((n) => n.name.includes(q) || n.core.includes(q));
      if (!cands.length) return -1;
      cands.sort((a, b) => {
        const ac = a.core.includes(q) ? 0 : 1, bc = b.core.includes(q) ? 0 : 1;
        if (ac !== bc) return ac - bc;
        return a.name.length - b.name.length;
      });
      return cands[0].i;
    }

    function setCenter(idx) {
      if (idx < 0 || !G.nodes[idx]) return;
      cancelFitAnim();
      if (G.center >= 0 && G.nodes[G.center]) G.nodes[G.center].fixed = false;
      G.center = idx;
      const input = document.getElementById('graph-center');
      if (input) input.value = G.nodes[idx].name;
      if (G.mode !== 'local') setGraphMode('local', true);
      computeVisible();
      if (G.dim === '2d') {
        // 2Dマインドマップ：新しい位置へ600ms程度かけて補間して移動する
        G.nodes[idx].fixed = true;
        tweenToLocalMindmap();
        selectNode(idx);
      } else {
        placeLocalRadial();
        warmup(120);
        fitView();
        selectNode(idx);
        reheat();
      }
    }

    function setSeg(groupId, activeId) {
      document.querySelectorAll('#' + groupId + ' button').forEach((b) => {
        const on = b.id === activeId;
        b.classList.toggle('is-active', on);
        b.setAttribute('aria-pressed', String(on));
      });
    }

    // 周辺表示への切替：新しいマインドマップ配置へトゥイーンし、視点も
    // 到達する配置でのフィットへ並行して補間する。全体図の縮小倍率を
    // 周辺表示に引き継がない（A1(1)：切替直後から1段目のラベルが全文
    // 読める倍率になる）。到達する配置の画面座標も同期的に保持する
    // （A2：最初のフレームを待たずに目標位置へのクリックが効く）。
    function tweenToLocalMindmap() {
      const targets = computeLocalMindmapTargets();
      const localFit = computeFitTarget(targets);
      G.viewTouched = false;
      cancelTween();
      startTween(targets, tweenDuration());
      storeSettledSnapshot(targets, localFit);
      if (localFit) animateFit(650, localFit, targets);
    }

    // 到達する配置（トゥイーンの目標＋フィット後の視点）での画面座標を
    // 同期的に計算して保持する。切替直後・最初のフレームの前でも、目標
    // 位置へのクリックがヒット判定で拾えるようにするため（A2）。
    // screen: idx → {x, y}（目標のドット位置）、labels: 目標配置での
    // ラベル矩形一覧。ヒット判定のフォールバック専用。
    function storeSettledSnapshot(targets, fitView) {
      if (!fitView || !targets || targets.size === 0) { G.settledSnap = null; return; }
      const w = canvas ? (canvas.clientWidth || 900) : 900;
      const h = canvas ? (canvas.clientHeight || 560) : 560;
      const cx = w / 2, cy = h / 2;
      const screen = new Map();
      for (const [idx, p] of targets) {
        screen.set(idx, { x: cx + p.x * fitView.scale + fitView.ox, y: cy + p.y * fitView.scale + fitView.oy });
      }
      // 目標配置でのラベル矩形：画面座標を一時的に目標位置へ置き換えて配置を計算する
      const saved = new Map();
      for (const n of G.visibleNodes) {
        saved.set(n.i, { sx: n.sx, sy: n.sy, sr: n.sr });
        const s = screen.get(n.i);
        if (s) { n.sx = s.x; n.sy = s.y; n.sr = dotRadius(1); }
      }
      let labels = [];
      try {
        labels = computeLabelLayout().map((lb) => ({ idx: lb.idx, box: { x0: lb.box.x0, y0: lb.box.y0, x1: lb.box.x1, y1: lb.box.y1 } }));
      } catch (_) { labels = []; }
      for (const [i, s] of saved) { const n = G.nodes[i]; n.sx = s.sx; n.sy = s.sy; n.sr = s.sr; }
      G.settledSnap = { screen, labels };
    }

    // 周辺表示→全体図：現在位置を起点に全体図マインドマップへトゥイーンし、
    // 視点も最終フィットへ補間する。再生ボタンを押さなくても展開が始まる。
    function tweenToAllMindmap() {
      const saved = new Map();
      for (const n of G.nodes) saved.set(n.i, { x: n.x, y: n.y, z: n.z });
      layoutMindmapAll();
      const targets = new Map();
      for (const n of G.nodes) targets.set(n.i, { x: n.x, y: n.y });
      // 最終レイアウトでのフィットを先に求めておく（トゥイーン中の補間位置
      // ではなく、到達する配置で視点を決める）
      const allFit = computeFitTarget(targets);
      for (const [i, p] of saved) { const n = G.nodes[i]; n.x = p.x; n.y = p.y; n.z = p.z; }
      cancelTween();
      startTween(targets, tweenDuration());
      storeSettledSnapshot(targets, allFit);
      if (allFit) animateFit(650, allFit, targets);
    }

    function setGraphMode(mode, silent) {
      if (mode === 'all' && G.mode === 'local' && G.center >= 0 && G.nodes[G.center]) {
        G.nodes[G.center].fixed = false;
      }
      G.mode = mode;
      cancelFitAnim();
      setSeg('graph-view-seg', mode === 'all' ? 'graph-view-all' : 'graph-view-local');
      const d2 = document.getElementById('graph-depth2');
      const ci = document.getElementById('graph-center');
      if (d2) d2.disabled = mode !== 'local';
      if (ci) ci.disabled = false;
      if (mode === 'local' && G.center < 0) G.center = G.defaultCenter;
      computeVisible();
      if (!silent) {
        if (G.dim === '2d') {
          if (mode === 'local') {
            tweenToLocalMindmap();
          } else {
            tweenToAllMindmap();
          }
        } else {
          if (mode === 'local') placeLocalRadial();
          else G.nodes.forEach((n) => placeAtAnchor(n));
          warmup(120);
          fitView();
          reheat();
        }
      }
    }

    function setEdgeFilter(f) {
      G.edgeFilter = f;
      setSeg('graph-edge-seg', 'graph-edge-' + f);
      computeVisible();
      reheat();
    }

    function setDim(dim) {
      if (G.dim === dim) return;
      G.dim = dim;
      cancelFitAnim();
      setSeg('graph-dim-seg', 'graph-dim-' + dim);
      updateSliderStates();
      if (dim === '3d') {
        let allFlat = true;
        for (const n of G.nodes) if (Math.abs(n.z) > 0.01) { allFlat = false; break; }
        if (allFlat) G.nodes.forEach((n) => { n.z = (Math.random() - 0.5) * 220; });
        reheat();
      } else {
        // 2Dへ：現在のモードをマインドマップで再配置する。
        // reheat() はフィット・アニメーションを止めるため、全体図への
        // トゥイーン＋フィットを開始する前に呼ぶ。
        cancelTween();
        reheat();
        if (G.mode === 'all') {
          tweenToAllMindmap();
        } else {
          tweenToLocalMindmap();
        }
      }
    }

    /* ---- 開閉（年表と排他） ---- */
    function setGraphOpen(open) {
      G.open = open;
      const btn = document.getElementById('graph-btn');
      const panel = document.getElementById('graph');
      const layout = document.querySelector('.layout');
      const tlBtn = document.getElementById('timeline-btn');
      const tlRoot = document.getElementById('timeline');
      if (btn) {
        btn.classList.toggle('is-active', open);
        btn.setAttribute('aria-pressed', String(open));
      }
      if (panel) panel.hidden = !open;
      if (open) {
        // 開く直前に古いフィット・アニメーションを止める（前のビューへの
        // 書き戻しで、開いた直後の図がはみ出すのを防ぐ）
        cancelFitAnim();
        if (typeof timelineMode !== 'undefined' && timelineMode) {
          timelineMode = false;
          if (tlBtn) {
            tlBtn.classList.toggle('is-active', false);
            tlBtn.setAttribute('aria-pressed', 'false');
          }
          if (tlRoot) tlRoot.hidden = true;
          const q = document.getElementById('q');
          if (q) q.dispatchEvent(new Event('input'));
        }
        if (layout) layout.style.display = 'none';
        if (!G.built) buildGraph();
        canvas = document.getElementById('graph-canvas');
        try { ctx = canvas ? canvas.getContext('2d') : null; } catch (_) { ctx = null; }
        sizeCanvas();
        computeVisible();
        if (G.dim === '2d') {
          // 2Dはマインドマップで即座に配置する（開いた直後の導入アニメはなし）
          cancelTween();
          if (G.mode === 'local') {
            const t = computeLocalMindmapTargets();
            for (const [idx, p] of t) {
              const n = G.nodes[idx];
              if (!n) continue;
              n.x = p.x; n.y = p.y; n.z = 0; n.vx = 0; n.vy = 0; n.vz = 0;
            }
          } else {
            layoutMindmapAll();
          }
          fitView();
        } else {
          if (G.mode === 'local') placeLocalRadial();
          warmup(120);
          fitView();
        }
        reheat();
      } else {
        stopSim();
        knTipHide();
        if (typeof timelineMode === 'undefined' || !timelineMode) {
          if (layout) layout.style.display = '';
        }
      }
    }

    // タップでの説明表示（モバイル）：ホバーと同じ内容（名前・章・記述文）を
    // タップ位置の近くに出す。中心切替とは別に表示し、切替を妨げない。
    // 別の場所のタップ・ドラッグ・ピンチ・スクロールで消え、一定時間でも消える。
    function showTapTip(idx, e) {
      const n = G.nodes[idx];
      if (!n) return;
      const body = chapterLabel(n.chapter) + (n.desc ? ' — ' + truncDesc(n.desc, 200) : '');
      knTipShow(n.name, body, clientXOf(e), clientYOf(e));
      armTipTimer();
    }
    function showTapTipChapter(ch, e) {
      const cn = G.chapterNodes[ch];
      if (!cn) return;
      knTipShow(cn.label, '項目 ' + cn.count + '件 — クリックでこの章だけを強調表示', clientXOf(e), clientYOf(e));
      armTipTimer();
    }
    function clientXOf(e) {
      if (typeof e.clientX === 'number') return e.clientX;
      if (canvas) { const r = canvas.getBoundingClientRect(); return r.left + (e.offsetX || 0); }
      return 0;
    }
    function clientYOf(e) {
      if (typeof e.clientY === 'number') return e.clientY;
      if (canvas) { const r = canvas.getBoundingClientRect(); return r.top + (e.offsetY || 0); }
      return 0;
    }
    function armTipTimer() {
      if (tipHideTimer) clearTimeout(tipHideTimer);
      tipHideTimer = setTimeout(() => { knTipHide(); tipHideTimer = null; }, TIP_AUTO_HIDE_MS);
    }

    /* ---- ポインタ操作 ---- */
    function canvasPos(e) {
      if (typeof e.offsetX === 'number' && canvas) {
        return { x: e.offsetX, y: e.offsetY };
      }
      const r = canvas.getBoundingClientRect();
      return { x: e.clientX - r.left, y: e.clientY - r.top };
    }

    // ヒット判定。切替直後（トゥイーン／フィット・アニメーション中）は
    // スナップショットを渡すと、到達する配置での判定も試す（A2）。
    function hitNode(px, py, snap) {
      syncScreenCoords();
      const labels = computeLabelLayout();
      const cur = hitNodeCore(px, py,
        (idx) => { const n = G.nodes[idx]; return { x: n.sx, y: n.sy, sr: n.sr }; },
        labels);
      if (!snap || !snap.screen || !snap.screen.size) return cur.idx;
      const tgt = hitNodeCore(px, py,
        (idx) => { const s = snap.screen.get(idx); return s ? { x: s.x, y: s.y, sr: dotRadius(1) } : null; },
        snap.labels || []);
      // 現在配置と到達する配置の両方で当たる場合は、クリック点に近い方を
      // 返す。切替直後の目標位置へのクリック（到達配置での距離≒0）が、
      // 旧配置の別ノードに奪われない。トゥイーン半ばに表示されている
      // ノードをクリックした場合は現在配置の方が近いのでそちらが勝つ。
      if (tgt.idx >= 0 && tgt.d <= cur.d) return tgt.idx;
      return cur.idx;
    }

    // ヒット判定の本体（位置の出所を差し替えて現在配置・目標配置で共通化）。
    // { idx, d } を返す。d は判定に使った距離（ドット中心・ラベル矩形中心
    // までの距離）。当たらなかった場合は idx=-1, d=Infinity。
    function hitNodeCore(px, py, posOf, labelList) {
      // 優先順位：
      // (0) ドットの円盤上のクリック（ドット中心から視覚半径＋1px以内）。
      //     ただしクリック点がラベル文字の中心に近い（10px以内）場合は
      //     ラベルを優先する（見えているのは文字だから）。
      // (1) ラベル文字のクリック（重なったラベルは、クリック点にいちばん
      //     近い矩形中心のもの）。
      // (2) ドット本体への精密なヒット（視覚半径＋4px）。
      // (3) ドットへのゆとりのあるヒット（16px）。
      // ラベルはドットの上に描かれるため、ラベル矩形の中をクリックした
      // 場合は文字の持ち主を返すのが基本。だが密集部では他ノードのドット
      // がラベル矩形の中に入ることもあり、そのドットの中心をクリックした
      // 場合はドットを返す必要がある（0）。ドットを先にすると、ラベル
      // 中心から数pxの位置にある隣ノードのドットに当たって誤った人物に
      // 切り替わってしまうため、(0) はラベル中心から離れている場合に限る。
      const narrow = canvas && canvas.clientWidth < 700;
      const base = narrow ? 24 : 16;
      // (1) の候補：クリック点を含むラベルのうち、矩形中心が最も近いもの
      let bestLb = null, bestLbD = Infinity;
      for (const lb of labelList) {
        const b = lb.box;
        if (px >= b.x0 && px <= b.x1 && py >= b.y0 && py <= b.y1) {
          const cx = (b.x0 + b.x1) / 2, cy = (b.y0 + b.y1) / 2;
          const d = Math.hypot(px - cx, py - cy);
          if (d < bestLbD) { bestLbD = d; bestLb = lb; }
        }
      }
      // (0) ドットの円盤上か
      let bestDot = -1, bestDotD = Infinity;
      for (const n of G.visibleNodes) {
        const p = posOf(n.i);
        if (!p) continue;
        const d = Math.hypot(p.x - px, p.y - py);
        const lim = p.sr + 1;
        if (d < lim && d < bestDotD) { bestDotD = d; bestDot = n.i; }
      }
      if (bestDot >= 0 && (!bestLb || bestLbD > 10)) return { idx: bestDot, d: bestDotD };
      if (bestLb) return { idx: bestLb.idx, d: bestLbD };
      let best = -1, bestD = Infinity;
      for (const n of G.visibleNodes) {
        const p = posOf(n.i);
        if (!p) continue;
        const d = Math.hypot(p.x - px, p.y - py);
        const lim = p.sr + 4;
        if (d < lim && d < bestD) { bestD = d; best = n.i; }
      }
      if (best >= 0) return { idx: best, d: bestD };
      best = -1; bestD = Infinity;
      for (const n of G.visibleNodes) {
        const p = posOf(n.i);
        if (!p) continue;
        const d = Math.hypot(p.x - px, p.y - py);
        const lim = Math.max(base, p.sr + (narrow ? 10 : 6));
        if (d < lim && d < bestD) { bestD = d; best = n.i; }
      }
      return { idx: best, d: best >= 0 ? bestD : Infinity };
    }

    function screenToWorld(px, py, depthF, depthZ) {
      const w = canvas ? (canvas.clientWidth || 900) : 900;
      const h = canvas ? (canvas.clientHeight || 560) : 560;
      const cx = w / 2, cy = h / 2;
      if (G.dim !== '3d') {
        return { x: (px - cx - G.ox) / G.scale, y: (py - cy - G.oy) / G.scale, z: 0 };
      }
      const f = depthF || 1, z2 = depthZ || 0;
      const x2 = (px - cx - G.ox) / (G.scale * f);
      const y2 = (py - cy - G.oy) / (G.scale * f);
      const sinX = Math.sin(G.rotX), cosX = Math.cos(G.rotX);
      const sinY = Math.sin(G.rotY), cosY = Math.cos(G.rotY);
      const x1 = x2 * cosY - z2 * sinY;
      const z1 = x2 * sinY + z2 * cosY;
      const y = y2 * cosX + z1 * sinX;
      const z = -y2 * sinX + z1 * cosX;
      return { x: x1, y, z };
    }

    function initGraph() {
      const btn = document.getElementById('graph-btn');
      const panel = document.getElementById('graph');
      if (!panel) return;
      // 単独ページには graph-btn がない（ページ自体が関連図）。その場合は
      // トグル不要で、そのまま初期化を続ける。
      if (btn) btn.addEventListener('click', () => setGraphOpen(!G.open));
      const tlBtn = document.getElementById('timeline-btn');
      if (tlBtn) tlBtn.addEventListener('click', () => { if (G.open) setGraphOpen(false); });

      // セグメントボタン群にグループidを付与（setSeg用）
      const segOf = (id) => document.getElementById(id).closest('.graph-seg');
      const viewSeg = segOf('graph-view-all'); if (viewSeg) viewSeg.id = 'graph-view-seg';
      const edgeSeg = segOf('graph-edge-both'); if (edgeSeg) edgeSeg.id = 'graph-edge-seg';
      const dimSeg = segOf('graph-dim-2d'); if (dimSeg) dimSeg.id = 'graph-dim-seg';

      document.getElementById('graph-view-all').addEventListener('click', () => setGraphMode('all'));
      document.getElementById('graph-view-local').addEventListener('click', () => setGraphMode('local'));
      document.getElementById('graph-center').addEventListener('change', (e) => {
        const idx = findNodeByName(e.target.value);
        if (idx >= 0) setCenter(idx);
      });
      document.getElementById('graph-depth2').addEventListener('change', (e) => {
        G.depth2 = e.target.checked;
        if (G.mode === 'local') {
          computeVisible();
          if (G.dim === '2d') {
            tweenToLocalMindmap();
          } else {
            placeLocalRadial(); warmup(120); fitView(); reheat();
          }
        }
      });
      document.getElementById('graph-edge-both').addEventListener('click', () => setEdgeFilter('both'));
      document.getElementById('graph-edge-tag').addEventListener('click', () => setEdgeFilter('tag'));
      document.getElementById('graph-edge-mention').addEventListener('click', () => setEdgeFilter('mention'));
      document.getElementById('graph-weak').addEventListener('change', (e) => {
        G.showWeak = e.target.checked;
        computeVisible();
        reheat();
      });
      document.getElementById('graph-dim-2d').addEventListener('click', () => setDim('2d'));
      document.getElementById('graph-dim-3d').addEventListener('click', () => setDim('3d'));
      document.getElementById('graph-play').addEventListener('click', () => {
        if (G.running) stopSim(); else runSim();
      });
      document.getElementById('graph-reset').addEventListener('click', () => {
        cancelTween();
        G.dimChapter = null;
        resetForceSliders();
        // reheat() はフィット・アニメーションを止めるため、トゥイーン＋
        // フィットを開始する前に呼ぶ（後だと並行フィットが即キャンセルされる）
        reheat();
        if (G.dim === '2d') {
          if (G.mode === 'local') {
            tweenToLocalMindmap();
          } else {
            layoutMindmapAll();
            fitView();
          }
        } else {
          if (G.mode === 'local') placeLocalRadial();
          else G.nodes.forEach((n) => placeAtAnchor(n));
          fitView();
        }
      });
      document.getElementById('graph-rotate').addEventListener('change', (e) => {
        G.autoRotate = e.target.checked;
        if (G.autoRotate && G.open && G.raf == null) G.raf = nextFrame(frameLoop);
      });
      // 力の調整スライダー：倍率を即座に反映し、シミュレーションを再加熱する。
      // 2D/3Dの基準値は異なるが、スライダーはどちらも基準値に対する倍率。
      // 2Dでは吸引力＝広がり、バネの長さ＝円の間隔としてマインドマップに
      // 読み替え、変更時に即座に再配置する。反発力は2Dでは無効。
      const bindForce = (id, key) => {
        const input = document.getElementById(id);
        const val = document.getElementById(id + '-val');
        if (!input) return;
        input.addEventListener('input', () => {
          const v = parseFloat(input.value) || 1;
          G.force[key] = v;
          if (val) val.textContent = '×' + v.toFixed(1);
          if (G.dim === '2d' && (key === 'attract' || key === 'rest')) applyMindmapSpread();
          reheat();
        });
      };
      bindForce('graph-f-attract', 'attract');
      bindForce('graph-f-repel', 'repel');
      bindForce('graph-f-rest', 'rest');
      bindForce('graph-f-speed', 'speed');
      updateSliderStates();

      // 凡例（章の色＋辺の種類）
      const legend = document.getElementById('graph-legend');
      if (legend) {
        GRAPH_CHAPTERS.forEach((c) => {
          const s = document.createElement('span');
          const sw = document.createElement('span');
          sw.className = 'sw';
          sw.style.background = c.color;
          s.appendChild(sw);
          s.appendChild(document.createTextNode(c.label));
          legend.appendChild(s);
        });
        const t = document.createElement('span');
        const tSw = document.createElement('span');
        tSw.className = 'edge-sample';
        t.appendChild(tSw);
        t.appendChild(document.createTextNode('タグ辺（共有タグ3つ以上）'));
        legend.appendChild(t);
        const w = document.createElement('span');
        const wSw = document.createElement('span');
        wSw.className = 'edge-sample weak';
        w.appendChild(wSw);
        w.appendChild(document.createTextNode('弱い辺（タグ2つ共通・各項目の上位3件）'));
        legend.appendChild(w);
        const s = document.createElement('span');
        const sSw = document.createElement('span');
        sSw.className = 'edge-sample spoke';
        s.appendChild(sSw);
        s.appendChild(document.createTextNode('中心とのつながり'));
        legend.appendChild(s);
        const m = document.createElement('span');
        const mSw = document.createElement('span');
        mSw.className = 'edge-sample mention';
        m.appendChild(mSw);
        m.appendChild(document.createTextNode('言及・同行辺'));
        legend.appendChild(m);
        const r = document.createElement('span');
        const rSw = document.createElement('span');
        rSw.className = 'edge-sample rel';
        r.appendChild(rSw);
        r.appendChild(document.createTextNode('交流（対談・交友・師弟など）'));
        legend.appendChild(r);
      }

      canvas = document.getElementById('graph-canvas');
      let dragNode = -1, viewDrag = false, lastX = 0, lastY = 0, downX = 0, downY = 0, moved = false;
      let downChapter = -1;
      const pidOf = (e) => (e.pointerId != null ? e.pointerId : 'ptr');
      if (canvas) {
        canvas.addEventListener('pointerdown', (e) => {
          knTipHide();
          const p = canvasPos(e);
          activePointers.set(pidOf(e), { x: p.x, y: p.y });
          if (activePointers.size === 2) {
            // 2本指になったらピンチ開始：進行中のドラッグを解消し、
            // このジェスチャーではクリック（中心切替）を発火させない。
            if (dragNode >= 0) {
              if (!(G.mode === 'local' && dragNode === G.center)) G.nodes[dragNode].fixed = false;
              dragNode = -1;
            }
            downChapter = -1;
            viewDrag = false;
            moved = true;
            const pts = [...activePointers.values()];
            const d = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
            pinchState = {
              d0: Math.max(1, d), scale0: G.scale,
              midX: (pts[0].x + pts[1].x) / 2, midY: (pts[0].y + pts[1].y) / 2,
            };
            cancelTween();
            cancelFitAnim();
            try { canvas.setPointerCapture(e.pointerId); } catch (_) {}
            return;
          }
          if (activePointers.size > 2) return; // 3本目以降は無視
          downX = p.x; downY = p.y; moved = false;
          // 切替直後のクリック：トゥイーン／フィット・アニメーション中は
          // 到達する配置での判定も試す（キャンセルする前にスナップショットを確保）。
          const snapForHit = (((G.tween && G.tween.active) || G.fitRaf != null) && G.settledSnap) ? G.settledSnap : null;
          // 補間アニメーション中のドラッグは位置をその場で固定する。
          // フィット・アニメーションも止めて、クリック中に視点が動かないようにする。
          cancelTween();
          cancelFitAnim();
          // 固定した位置で描画し直してから判定する（表示と判定の一致）。
          draw();
          downChapter = -1;
          const ch = hitChapter(p.x, p.y);
          if (ch >= 0) {
            // 章ノードはドラッグしない。クリックで強調表示を切り替える。
            // ドラッグした場合はビュー全体をパンする。
            downChapter = ch;
            viewDrag = true;
          } else {
            const hit = hitNode(p.x, p.y, snapForHit);
            if (hit >= 0) {
              dragNode = hit;
              const n = G.nodes[hit];
              n.fixed = true;
              n.vx = n.vy = n.vz = 0;
            } else {
              viewDrag = true;
            }
          }
          lastX = p.x; lastY = p.y;
          try { canvas.setPointerCapture(e.pointerId); } catch (_) {}
        });
        canvas.addEventListener('pointermove', (e) => {
          const p = canvasPos(e);
          if (activePointers.has(pidOf(e))) {
            const pt = activePointers.get(pidOf(e));
            pt.x = p.x; pt.y = p.y;
          }
          if (pinchState && activePointers.size >= 2) {
            // ピンチズーム：2本指の中心に追従してパンし、中点を基準にズームする。
            // 1本指のドラッグ・タップとは干渉しない（ここで return する）。
            const pts = [...activePointers.values()].slice(0, 2);
            const d = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
            const midX = (pts[0].x + pts[1].x) / 2, midY = (pts[0].y + pts[1].y) / 2;
            const w = canvas.clientWidth || 900, h = canvas.clientHeight || 560;
            const cx = w / 2, cy = h / 2;
            G.ox += midX - pinchState.midX;
            G.oy += midY - pinchState.midY;
            const ns = Math.max(0.05, Math.min(6, pinchState.scale0 * d / pinchState.d0));
            const r = ns / G.scale;
            G.ox = (midX - cx) - ((midX - cx) - G.ox) * r;
            G.oy = (midY - cy) - ((midY - cy) - G.oy) * r;
            G.scale = ns;
            pinchState.midX = midX; pinchState.midY = midY;
            G.viewTouched = true;
            cancelFitAnim();
            moved = true;
            draw();
            return;
          }
          if (dragNode >= 0) {
            if (Math.hypot(p.x - downX, p.y - downY) > 4) moved = true;
            const n = G.nodes[dragNode];
            const w = screenToWorld(p.x, p.y, n.sf, n.sdepth);
            n.x = w.x; n.y = w.y;
            if (G.dim === '3d') n.z = w.z;
            n.vx = n.vy = n.vz = 0;
            draw();
          } else if (viewDrag) {
            const dx = p.x - lastX, dy = p.y - lastY;
            if (Math.hypot(p.x - downX, p.y - downY) > 4) moved = true;
            if (G.dim === '3d') {
              G.rotY += dx * 0.005;
              G.rotX += dy * 0.005;
              if (G.rotX > 1.4) G.rotX = 1.4;
              if (G.rotX < -1.4) G.rotX = -1.4;
            } else {
              G.ox += dx; G.oy += dy;
              G.viewTouched = true;
              cancelFitAnim();
            }
            lastX = p.x; lastY = p.y;
            draw();
          } else {
            // 章ノードのホバー（2D全体図のみ）：章名と件数のツールチップ
            const ch = hitChapter(p.x, p.y);
            if (ch >= 0) {
              const cn = G.chapterNodes[ch];
              if (G.hoverChapter !== ch) {
                G.hoverChapter = ch;
                canvas.style.cursor = 'pointer';
                knTipShow(cn.label, '項目 ' + cn.count + '件 — クリックでこの章だけを強調表示', e.clientX, e.clientY);
              } else {
                knTipMove(e.clientX, e.clientY);
              }
              if (G.hover >= 0) { G.hover = -1; requestDraw(); }
              return;
            }
            if (G.hoverChapter >= 0) { G.hoverChapter = -1; knTipHide(); }
            const hit = hitNode(p.x, p.y);
            if (hit !== G.hover) {
              G.hover = hit;
              canvas.style.cursor = hit >= 0 ? 'pointer' : 'grab';
              if (hit >= 0) {
                const n = G.nodes[hit];
                const body = chapterLabel(n.chapter) + (n.desc ? ' — ' + truncDesc(n.desc, 200) : '');
                knTipShow(n.name, body, e.clientX, e.clientY);
              } else {
                knTipHide();
              }
              requestDraw();
            } else if (hit >= 0) {
              knTipMove(e.clientX, e.clientY);
            }
          }
        });
        const endDrag = (e) => {
          activePointers.delete(pidOf(e));
          if (pinchState && activePointers.size < 2) {
            pinchState = null;
            // ピンチ終了後に内容が画面外へ完全にはみ出していたらフィットし直す
            refitIfOffscreen();
          }
          const p = canvasPos(e);
          if (downChapter >= 0) {
            const ch = downChapter;
            downChapter = -1;
            viewDrag = false;
            if (!moved) {
              // タップ（タッチ）：章の説明をタップ位置の近くに表示する
              if (e.pointerType === 'touch') showTapTipChapter(ch, e);
              toggleDimChapter(ch);
            }
            draw();
            return;
          }
          if (dragNode >= 0) {
            const idx = dragNode;
            // 周辺表示の中心ノードは固定のままにする
            if (!(G.mode === 'local' && idx === G.center)) G.nodes[idx].fixed = false;
            dragNode = -1;
            if (!moved) {
              // タップ（タッチ）：ノードの説明をタップ位置の近くに表示する。
              // ホバーと同じ内容。中心切替も従来どおり行う。
              if (e.pointerType === 'touch') showTapTip(idx, e);
              // 2Dでは全体図のノードをクリックすると周辺表示に切り替わる
              if (G.mode === 'local' || G.dim === '2d') setCenter(idx);
              else selectNode(idx);
            }
          } else if (viewDrag) {
            viewDrag = false;
            if (!moved) {
              G.dimChapter = null;
              selectNode(-1);
            }
          }
          draw();
        };
        canvas.addEventListener('pointerup', endDrag);
        canvas.addEventListener('pointercancel', (e) => {
          activePointers.delete(pidOf(e));
          if (pinchState && activePointers.size < 2) {
            pinchState = null;
            refitIfOffscreen();
          }
          if (dragNode >= 0) {
            if (!(G.mode === 'local' && dragNode === G.center)) G.nodes[dragNode].fixed = false;
            dragNode = -1;
          }
          downChapter = -1;
          viewDrag = false;
        });
        canvas.addEventListener('pointerleave', () => {
          if (G.hover >= 0) { G.hover = -1; requestDraw(); }
          if (G.hoverChapter >= 0) { G.hoverChapter = -1; }
          knTipHide();
        });
        canvas.addEventListener('wheel', (e) => {
          e.preventDefault();
          knTipHide();
          G.viewTouched = true;
          cancelFitAnim();
          const p = canvasPos(e);
          const w = canvas.clientWidth || 900, h = canvas.clientHeight || 560;
          const cx = w / 2, cy = h / 2;
          const k = Math.exp(-e.deltaY * 0.001);
          const ns = Math.max(0.2, Math.min(6, G.scale * k));
          const r = ns / G.scale;
          G.ox = (p.x - cx) - ((p.x - cx) - G.ox) * r;
          G.oy = (p.y - cy) - ((p.y - cy) - G.oy) * r;
          G.scale = ns;
          draw();
        }, { passive: false });
      }
      window.addEventListener('resize', () => {
        knTipHide();
        if (!G.open) return;
        onGraphResize();
      });
      // キャンバス自体の大きさの変化も監視する（ウィンドウのリサイズを
      // 伴わないレイアウト確定・広告表示などによる高さの変化に対応）。
      if (typeof ResizeObserver === 'function' && canvas) {
        try {
          const ro = new ResizeObserver(() => { if (G.open) onGraphResize(); });
          ro.observe(canvas);
        } catch (_) {}
      }
      // 初期状態：2段表示は周辺モード専用
      const d2 = document.getElementById('graph-depth2');
      if (d2) d2.disabled = true;
    }

    // テスト用フック
    window.__knGraph = {
      G, buildGraph, setGraphOpen, setGraphMode, setCenter, setDim, setEdgeFilter,
      findNodeByName,
      stats: () => ({ ...G.stats }),
      visibleCount: () => (G.visible ? G.visible.size : 0),
      visibleEdgeCount: () => G.visEdges.length,
      neighborCount: (idx) => (G.adj[idx] ? G.adj[idx].length : 0),
      strongDegree: (idx) => (G.degStrong[idx] || 0),
      weakDegree: (idx) => (G.degWeak[idx] || 0),
      totalDegree: (idx) => (G.degStrong[idx] || 0) + (G.degWeak[idx] || 0),
      isolatedCount: () => G.nodes.filter((n, i) => (G.degStrong[i] || 0) + (G.degWeak[i] || 0) === 0).length,
      setWeak: (on) => {
        G.showWeak = !!on;
        const cb = document.getElementById('graph-weak');
        if (cb) cb.checked = G.showWeak;
        computeVisible();
      },
      tagSharedCount: (idx) => (G.adj[idx] ? G.adj[idx].filter((e) => e.tagW >= 1).length : 0),
      relOf: (idx) => (G.relList || []).filter((r) => r.a === idx || r.b === idx)
        .map((r) => ({ other: r.a === idx ? r.b : r.a, type: r.type, note: r.note, source: r.source })),
      relStats: () => ({ total: G.stats.relEdges || 0, new: G.stats.relNew || 0, unmatched: G.stats.relUnmatched || 0 }),
      tick: (n) => { for (let i = 0; i < n; i++) stepSim(); draw(); },
      stepFrame: () => frameLoop(),
      // 力の調整・停止のイージング・フィットアニメーション用フック
      force: () => ({ ...G.force }),
      setForce: (key, v) => {
        if (!(key in G.force)) return;
        G.force[key] = v;
        const input = document.getElementById('graph-f-' + key);
        if (input) input.value = String(v);
        const val = document.getElementById('graph-f-' + key + '-val');
        if (val) val.textContent = '×' + Number(v).toFixed(1);
      },
      coolFactor: () => G.coolFactor,
      maxSpeed: () => G.maxSpeed,
      tickCount: () => G.tickCount,
      isRunning: () => G.running,
      isOpen: () => G.open,
      view: () => ({ scale: G.scale, ox: G.ox, oy: G.oy, viewTouched: G.viewTouched }),
      fitTarget: () => computeFitTarget(),
      animateFit: (ms) => animateFit(ms),
      fitAnimActive: () => G.fitRaf != null,
      setViewTouched: (v) => { G.viewTouched = !!v; },
      // 2Dマインドマップ用フック
      chapterLabelLayout: () => computeChapterLabelLayout(),
      labelBox: (idx) => {
        const lb = computeLabelLayout().find((x) => x.idx === idx);
        return lb ? { x0: lb.box.x0, y0: lb.box.y0, x1: lb.box.x1, y1: lb.box.y1, x: lb.x, y: lb.y, toRight: lb.toRight } : null;
      },
      // 描画されるラベル全件（配置・矩形・フォント・ずれ量・表示文字列つき）
      labelLayout: () => computeLabelLayout().map((lb) => ({
        idx: lb.idx, x: lb.x, y: lb.y, toRight: lb.toRight, fs: lb.fs, dy: lb.dy, dx: lb.dx || 0,
        text: lb.text || G.nodes[lb.idx].name,
        lines: lb.lines || null,
        box: { ...lb.box },
      })),
      hitNode: (px, py) => hitNode(px, py),
      // 2行折り返しの分割位置（テスト用。表示と同じ関数を使う）
      splitName: (n, f) => splitName(n, f),
      // 到達する配置のスナップショット（A2）。screen は目標のドット位置。
      settledSnap: () => G.settledSnap ? {
        screen: [...G.settledSnap.screen.entries()].map(([idx, p]) => ({ idx, x: p.x, y: p.y })),
        labels: (G.settledSnap.labels || []).map((lb) => ({ idx: lb.idx, box: { ...lb.box } })),
      } : null,
      // スナップショットでのヒット判定（A2。現在配置では外れる場合の確認用）
      hitNodeSnap: (px, py) => hitNode(px, py, G.settledSnap),
      // 画面座標を描画なしで同期する（jsdom では draw() が走らないため）
      projectAll: () => { syncScreenCoords(); },
      nodeScreen: (idx) => {
        const n = G.nodes[idx];
        return n ? { sx: n.sx, sy: n.sy, sr: n.sr } : null;
      },
      setView: (s, ox, oy) => { G.scale = s; G.ox = ox; G.oy = oy; draw(); },
      // モバイル用フック：ピンチズーム・タップ説明
      isPinching: () => pinchState != null,
      tipVisible: () => { const el = document.getElementById('kn-tooltip'); return !!el && !el.hidden; },
      tipTitle: () => { const el = document.getElementById('kn-tooltip'); const t = el ? el.querySelector('.kn-tip-title') : null; return t ? t.textContent : null; },
      tipBody: () => { const el = document.getElementById('kn-tooltip'); const t = el ? el.querySelector('.kn-tip-body') : null; return t ? t.textContent : null; },
      tipHide: () => { if (tipHideTimer) { clearTimeout(tipHideTimer); tipHideTimer = null; } knTipHide(); },
      tipTimerActive: () => tipHideTimer != null,
      setTipAutoHideMs: (ms) => { TIP_AUTO_HIDE_MS = ms; },
      refitIfOffscreen: () => refitIfOffscreen(),
      layoutInfo: () => ({
        dim: G.dim, mode: G.mode, spread: G.force.attract,
        hub: G.hub ? { x: G.hub.x, y: G.hub.y } : null,
        chapters: (G.chapterNodes || []).map((c) => ({
          id: c.id, label: c.label, short: c.short, count: c.count,
          start: c.start, span: c.span, mid: c.mid, x: c.x, y: c.y,
        })),
      }),
      sectorCheck: () => {
        // 全項目が自分の章の扇形の中にあるか
        if (!G.chapterNodes || !G.chapterNodes.length) return { checked: 0, bad: 0 };
        const secById = new Map(G.chapterNodes.map((c) => [c.id, c]));
        let bad = 0, checked = 0;
        for (const n of G.nodes) {
          const s = secById.get(n.chapter);
          if (!s) continue;
          checked++;
          const ang = Math.atan2(n.y, n.x);
          let rel = ang - s.start;
          while (rel < 0) rel += Math.PI * 2;
          while (rel >= Math.PI * 2) rel -= Math.PI * 2;
          if (rel > s.span + 1e-9) bad++;
        }
        return { checked, bad };
      },
      chapterGap: () => {
        const cs = G.chapterNodes || [];
        let min = Infinity;
        for (let i = 0; i < cs.length; i++) {
          for (let j = i + 1; j < cs.length; j++) {
            const d = Math.hypot(cs[i].x - cs[j].x, cs[i].y - cs[j].y);
            if (d < min) min = d;
          }
        }
        return min === Infinity ? 0 : min;
      },
      localLayoutInfo: () => {
        if (G.mode !== 'local' || G.center < 0) return null;
        const c = G.nodes[G.center];
        const info = (idx) => {
          const n = G.nodes[idx];
          return { idx, name: n.name, r: Math.hypot(n.x - c.x, n.y - c.y), angle: Math.atan2(n.y - c.y, n.x - c.x) };
        };
        return {
          center: G.center, r1: (G.mind || {}).r1, r2: (G.mind || {}).r2,
          hop1: (G.localHop1 || []).map(info),
          hop2: Array.from(G.localParent.keys()).map(info),
          groups: (G.localGroups || []).map((g) => ({ kind: g.kind, count: g.items.length, start: g.start, span: g.span })),
        };
      },
      tweenActive: () => !!(G.tween && G.tween.active),
      tweenFrom: (idx) => {
        const tw = G.tween;
        if (!tw || !tw.from.has(idx)) return null;
        const f = tw.from.get(idx);
        return { x: f.x, y: f.y };
      },
      tweenTo: (idx) => {
        const tw = G.tween;
        if (!tw || !tw.to.has(idx)) return null;
        const t = tw.to.get(idx);
        return { x: t.x, y: t.y };
      },
      tweenAdvance: (ms) => {
        if (G.tween && G.tween.active) {
          G.tween.testExtra = (G.tween.testExtra || 0) + ms;
          advanceTween();
          draw();
        }
      },
      tweenDuration: () => tweenDuration(),
      dimChapter: () => G.dimChapter,
      setDimChapter: (id) => { G.dimChapter = id || null; draw(); },
      toggleDimChapter: (ci) => toggleDimChapter(ci),
      nodePos: (idx) => {
        const n = G.nodes[idx];
        return n ? { x: n.x, y: n.y } : null;
      },
    };

    initGraph();


    // 関連図ページは開いたらすぐ関連図を表示する
    window.__knGraph.setGraphOpen(true);
    (function () {
      const rc = document.getElementById('result-count');
      const s = window.__knGraph.stats();
      if (rc && s) rc.textContent = '全' + s.nodes + '件・' + s.total + '本の辺';
    })();
  </script>
</body>
