":"（デンマーク・1956–）：デンマークの映画監督（1956-）。長編デビュー作『エレメント・オブ・クライム』（1984）は、催眠下の刑事の回想として描かれる夢幻的なフィルムノワールである。『メランコリア』（2011）では、自身のうつ病体験をもとに惑星衝突の予感と人間の意識を描いた。ドグマ95の提唱者でもあり、トランスや抑うつ状態を映画言語とした異端の作家である。"},{"name":"マリーナ・アブラモヴィッチ","chapter":"c9-映画における変性意識","sub":4,"subCount":5,"tags":["art","practice"],"birth":1946,"death":null,"href":"https://note.com/varelser/n/n56e433ca99c9","article":true,"descRaw":"（セルビア-米・1946–）：セルビア生まれのパフォーマンス・アーティスト（1946-）。痛みや疲弊、長時間の持続を伴う極限的パフォーマンスで、トランス状態と観客との関係を探求してきた。2010年のニューヨーク近代美術館での『The Artist Is Present』では、3か月にわたり736時間30分、来館者と無言で向き合い、凝視による意識変容の社会的実験となった。"},{"name":"ヘルマン・ニッチュ","chapter":"c9-映画における変性意識","sub":4,"subCount":5,"tags":["art","religion","practice"],"birth":1938,"death":2022,"href":"https://note.com/search?q=from%3A%40varelser%20%E3%83%98%E3%83%AB%E3%83%9E%E3%83%B3%E3%83%BB%E3%83%8B%E3%83%83%E3%83%81%E3%83%A5&context=note&mode=search","article":false,"descRaw":"（奥・1938–2022）：オーストリアの芸術家（1938-2022）。「オルギエン・ミステリエン・シアター」では、血・内臓・儀礼的行為による集団的なカタルシスと、ディオニュソス的なトランスを追求した。ウィーン・アクショニズムの中心人物であり、1960年代から断続的に続けられた6日間の祝祭は、芸術と儀礼の境界を問うた。その祝祭は、芸術と儀礼の境界を問い続け、論争を呼んだ。"},{"name":"キャロリー・シュネーマン","chapter":"c9-映画における変性意識","sub":4,"subCount":5,"tags":["art","practice"],"birth":1939,"death":2019,"href":"https://note.com/search?q=from%3A%40varelser%20%E3%82%AD%E3%83%A3%E3%83%AD%E3%83%AA%E3%83%BC%E3%83%BB%E3%82%B7%E3%83%A5%E3%83%8D%E3%83%BC%E3%83%9E%E3%83%B3&context=note&mode=search","article":false,"descRaw":"（米・1939–2019）：アメリカのパフォーマンス・アーティスト（1939-2019）。『インテリア・スクロール』（1975）などで、身体・性・エクスタシーをパフォーマンスに統合し、フェミニスト身体芸術の先駆となった。絵画から身体芸術へと展開し、女性の身体を主体的な表現の場とした。1960年代以降の前衛芸術における身体の解放の旗手である。"},{"name":"ジョゼフ・ボイス","chapter":"c9-映画における変性意識","sub":4,"subCount":5,"tags":["art","religion","culture"],"birth":1921,"death":1986,"href":"https://note.com/search?q=from%3A%40varelser%20%E3%82%B8%E3%83%A7%E3%82%BC%E3%83%95%E3%83%BB%E3%83%9C%E3%82%A4%E3%82%B9&context=note&mode=search","article":false,"descRaw":"（独・1921–1986）：ドイツの芸術家（1921-1986）。フェルトと脂肪を用いた儀礼的行為や、コヨーテと8日間を過ごした『コヨーテ—私はアメリカが好き、アメリカも私が好き』（1974）で、シャーマニズム的なパフォーマンスを展開した。「社会彫刻」の概念を提唱し、芸術を社会変革の実践とみなした。戦後ドイツ美術の巨人である。"},{"name":"ビル・ヴィオラ","chapter":"c9-映画における変性意識","sub":4,"subCount":5,"tags":["art","religion","tech"],"birth":1951,"death":2024,"href":"https://note.com/search?q=from%3A%40varelser%20%E3%83%93%E3%83%AB%E3%83%BB%E3%83%B4%E3%82%A3%E3%82%AA%E3%83%A9&context=note&mode=search","article":false,"descRaw":"（米・1951–2024）：アメリカの映像作家（1951-2024）。映像インスタレーションで、生死・水・火・呼吸を極端なスローモーションで描き、スーフィズムや禅などの神秘主義と映像技術を統合した。『The Crossing』（1996）や『Man of Sorrows』（2001）などで、変性意識体験の映像化における最重要アーティストの一人とされる。"},{"name":"クリス・バーデン","chapter":"c9-映画における変性意識","sub":4,"subCount":5,"tags":["art","practice"],"birth":1946,"death":2015,"href":"https://note.com/search?q=from%3A%40varelser%20%E3%82%AF%E3%83%AA%E3%82%B9%E3%83%BB%E3%83%90%E3%83%BC%E3%83%87%E3%83%B3&context=note&mode=search","article":false,"descRaw":"（米・1946–2015）：アメリカのパフォーマンス・アーティスト（1946-2015）。1971年の『シュート』では、友人に小口径ライフルで腕を撃たせ、痛みと危険を身体で引き受けるパフォーマンスを行った。ベトナム戦争下のアメリカにおける暴力への応答として、観客の傍観を問い直した。身体の極限を通じた意識変容と、芸術の倫理を問うた先駆者である。"},{"name":"ピナ・バウシュ","chapter":"c9-映画における変性意識","sub":4,"subCount":5,"tags":["art","practice"],"birth":1940,"death":2009,"href":"https://note.com/search?q=from%3A%40varelser%20%E3%83%94%E3%83%8A%E3%83%BB%E3%83%90%E3%82%A6%E3%82%B7%E3%83%A5&context=note&mode=search","article":false,"descRaw":"（独・1940–2009）：ドイツの振付家・舞踊家（1940-2009）。1973年にヴッパタール舞踊団の芸術監督に就任し、ダンスと演劇を融合させた「タンツテアター」を確立した。『春の祭典』（1975）では土の敷かれた舞台で生贄の恐怖を踊らせ、『カフェ・ミュラー』（1978）では夢遊病者のような動きで記憶と孤独を描いた。身体の反復と感情の極限による意識の変容を舞台化した。"},{"name":"サイケデリック補助療法のプロトコル（準備-体験-統合）","chapter":"c10-統合-実践-生化学-安全","sub":0,"subCount":11,"tags":["clinical","substance","practice"],"birth":null,"death":null,"href":"https://note.com/search?q=from%3A%40varelser%20%E3%82%B5%E3%82%A4%E3%82%B1%E3%83%87%E3%83%AA%E3%83%83%E3%82%AF%E8%A3%9C%E5%8A%A9%E7%99%82%E6%B3%95%E3%81%AE%E3%83%97%E3%83%AD%E3%83%88%E3%82%B3%E3%83%AB%EF%BC%88%E6%BA%96%E5%82%99-%E4%BD%93%E9%A8%93-%E7%B5%B1%E5%90%88%EF%BC%89&context=note&mode=search","article":false,"descRaw":"：サイケデリック補助心理療法の三段階モデル。薬物投与前の「準備」（期待の調整・信頼関係の構築・意図の明確化）、投与当日の「体験」（安全な環境でのセッション）、投与後の「統合」（体験の意味づけと日常生活への組み込み）からなる。MAPSのMDMA療法やジョンズ・ホプキンスのシロシビン療法で標準化され、統合セッションの質が治療効果を左右するとされる。変性意識体験を安全に治療へ結びつける臨床枠組みである。"},{"name":"依存症とサイケデリック治療（ジョンソンら, 2014）","chapter":"c10-統合-実践-生化学-安全","sub":0,"subCount":11,"tags":["clinical","substance"],"birth":null,"death":null,"href":"https://note.com/search?q=from%3A%40varelser%20%E4%BE%9D%E5%AD%98%E7%97%87%E3%81%A8%E3%82%B5%E3%82%A4%E3%82%B1%E3%83%87%E3%83%AA%E3%83%83%E3%82%AF%E6%B2%BB%E7%99%82%EF%BC%88%E3%82%B8%E3%83%A7%E3%83%B3%E3%82%BD%E3%83%B3%E3%82%89%2C%202014%EF%BC%89&context=note&mode=search","article":false,"descRaw":"：マシュー・ジョンソンらが2014年にジョンズ・ホプキンス大学で行った、シロシビン補助療法による禁煙のパイロット研究。平均31年間喫煙し、6回の禁煙失敗歴をもつ15名に認知行動療法と2〜3回のシロシビン投与を行い、6ヶ月後に80%が禁煙を維持した（生化学的に確認）。12ヶ月後も67%が禁煙を続け、通常の治療の禁煙率（35%未満）を大きく上回った。依存症における変性意識体験の治療的機能を示す代表的な研究である。 出典：Johnson et al. (2014)『Journal of Psychopharmacology』 DOI: 10.1177/0269881114548296"},{"name":"緩和ケアと実存的苦痛へのサイケデリック介入","chapter":"c10-統合-実践-生化学-安全","sub":0,"subCount":11,"tags":["clinical","substance","religion"],"birth":null,"death":null,"href":"https://note.com/search?q=from%3A%40varelser%20%E7%B7%A9%E5%92%8C%E3%82%B1%E3%82%A2%E3%81%A8%E5%AE%9F%E5%AD%98%E7%9A%84%E8%8B%A6%E7%97%9B%E3%81%B8%E3%81%AE%E3%82%B5%E3%82%A4%E3%82%B1%E3%83%87%E3%83%AA%E3%83%83%E3%82%AF%E4%BB%8B%E5%85%A5&context=note&mode=search","article":false,"descRaw":"：終末期患者の死の不安や実存的苦痛に対するサイケデリック介入。ローランド・グリフィスらが2016年に『JAMA Psychiatry』で、がん患者51名を対象とした二重盲検試験で、シロシビン1回投与が死の不安・うつ・絶望を数ヶ月にわたり軽減したことを報告した。神秘体験の強さが効果と相関し、スピリチュアルケアとの接点が論じられた。死を前にした意識の変容が、実存的な苦痛の緩和に寄与する可能性を示す。"},{"name":"レジリエンス研究と変性意識","chapter":"c10-統合-実践-生化学-安全","sub":0,"subCount":11,"tags":["clinical","theory"],"birth":null,"death":null,"href":"https://note.com/search?q=from%3A%40varelser%20%E3%83%AC%E3%82%B8%E3%83%AA%E3%82%A8%E3%83%B3%E3%82%B9%E7%A0%94%E7%A9%B6%E3%81%A8%E5%A4%89%E6%80%A7%E6%84%8F%E8%AD%98&context=note&mode=search","article":false,"descRaw":"：逆境からの回復力（レジリエンス）に変性意識体験が寄与するメカニズムの研究。強い変性意識体験は、自己や世界の見方を組み替え、困難な経験に新たな意味を与えることがある。テデスキとカルフーンの「心的外傷後成長（PTG）」の概念と結びつき、トラウマ後の成長や、うつ・依存からの回復における体験の役割が論じられる。体験そのものよりも、その後の統合と意味づけが回復力を左右するとされる。"},{"name":"統合プロセス研究（Integration Research）","chapter":"c10-統合-実践-生化学-安全","sub":0,"subCount":11,"tags":["clinical","substance","practice"],"birth":null,"death":null,"href":"https://note.com/search?q=from%3A%40varelser%20%E7%B5%B1%E5%90%88%E3%83%97%E3%83%AD%E3%82%BB%E3%82%B9%E7%A0%94%E7%A9%B6%EF%BC%88Integration%20Research%EF%BC%89&context=note&mode=search","article":false,"descRaw":"：変性意識体験の後に行われる「統合（インテグレーション）」――体験の意味づけと日常生活への組み込み――が治療効果を左右するという知見。サイケデリック療法では、投与セッション後の統合セッションで、体験で得た洞察を具体的な行動変容へつなげる。統合が不十分だと、強い体験が混乱や不安を残すこともある。体験の内容だけでなく、その後の対話と実践が変容を定着させるという、臨床的に重要な研究領域である。"},{"name":"安全設計とハームリダクション","chapter":"c10-統合-実践-生化学-安全","sub":0,"subCount":11,"tags":["clinical","substance"],"birth":null,"death":null,"href":"https://note.com/search?q=from%3A%40varelser%20%E5%AE%89%E5%85%A8%E8%A8%AD%E8%A8%88%E3%81%A8%E3%83%8F%E3%83%BC%E3%83%A0%E3%83%AA%E3%83%80%E3%82%AF%E3%82%B7%E3%83%A7%E3%83%B3&context=note&mode=search","article":false,"descRaw":"：変性意識を誘導する際の安全管理の枠組み。事前のスクリーニング（精神病歴・薬物相互作用・心疾患の確認）、禁忌の把握、環境設計（静かで安全な場・信頼できる同席者）、サポート体制の整備からなる。臨床試験では厳格なプロトコルが、フェスティバルなど実践現場ではゼンドー・プロジェクトのようなピアサポートがハームリダクションを担う。体験の質と安全性はセット＆セッティングに大きく依存する。"},{"name":"看護学における意識状態の評価とケア","chapter":"c10-統合-実践-生化学-安全","sub":0,"subCount":11,"tags":["clinical","science"],"birth":null,"death":null,"href":"https://note.com/search?q=from%3A%40varelser%20%E7%9C%8B%E8%AD%B7%E5%AD%A6%E3%81%AB%E3%81%8A%E3%81%91%E3%82%8B%E6%84%8F%E8%AD%98%E7%8A%B6%E6%85%8B%E3%81%AE%E8%A9%95%E4%BE%A1%E3%81%A8%E3%82%B1%E3%82%A2&context=note&mode=search","article":false,"descRaw":"：グラスゴー・コーマ・スケール（GCS）からRASSまで、臨床現場での意識状態の評価と看護介入。GCSはティーズデールとジェネットが1974年に開発した、開眼・言語・運動反応の3要素による意識障害の評価法で、救急・集中治療の標準である。RASS（リッチモンド興奮-鎮静スケール）は鎮静の深さを測り、せん妄の早期発見と結びつく。覚醒・鎮静・せん妄の評価が、患者の安全と尊厳あるケアの基盤となる。"},{"name":"うつ病の神経ネットワーク仮説と変性意識治療","chapter":"c10-統合-実践-生化学-安全","sub":0,"subCount":11,"tags":["clinical","science","substance"],"birth":null,"death":null,"href":"https://note.com/search?q=from%3A%40varelser%20%E3%81%86%E3%81%A4%E7%97%85%E3%81%AE%E7%A5%9E%E7%B5%8C%E3%83%8D%E3%83%83%E3%83%88%E3%83%AF%E3%83%BC%E3%82%AF%E4%BB%AE%E8%AA%AC%E3%81%A8%E5%A4%89%E6%80%A7%E6%84%8F%E8%AD%98%E6%B2%BB%E7%99%82&context=note&mode=search","article":false,"descRaw":"：うつ病をデフォルトモード・ネットワーク（DMN）の過活動と捉えるモデル。反芻的な自己参照思考がDMNの過剰な結合と結びつき、サイケデリクスや瞑想によるDMNの再編が治療機序だとする仮説である。カーハート＝ハリスら（2017）は治療抵抗性うつ病へのシロシビン投与でDMNの結合低下と症状改善を報告した。DMNを標的とする神経刺激やマインドフルネス介入も、この枠組みで理解される。"},{"name":"サイケデリック療法","chapter":"c10-統合-実践-生化学-安全","sub":0,"subCount":11,"tags":["clinical","substance"],"birth":null,"death":null,"href":"https://note.com/varelser/n/n2801f5d7f534","article":true,"descRaw":"：MDMA・シロシビンなどを心理療法と組み合わせる治療。米国FDAは2017年にMDMA療法へ画期的治療薬指定を与えたが、2024年6月の諮問委員会の否定的答申を受け、同年8月に承認申請を却下し、追加の第3相試験を求めた。シロシビンも2018〜19年に画期的治療薬指定を受け、治療抵抗性うつ病の第3相試験が進む。幻覚剤を医薬品化する試みとして、規制と科学の接点にある。"},{"name":"オレゴン州シロシビン合法化","chapter":"c10-統合-実践-生化学-安全","sub":0,"subCount":11,"tags":["policy","substance","clinical"],"birth":null,"death":null,"href":"https://note.com/search?q=from%3A%40varelser%20%E3%82%AA%E3%83%AC%E3%82%B4%E3%83%B3%E5%B7%9E%E3%82%B7%E3%83%AD%E3%82%B7%E3%83%93%E3%83%B3%E5%90%88%E6%B3%95%E5%8C%96&context=note&mode=search","article":false,"descRaw":"：2020年11月の住民投票で第109号法案が可決され、米国初の州管理シロシビン・サービス制度が成立した。医療ではなく、21歳以上の成人への管理下での提供で、認可を受けたファシリテーターが許可施設で投与を行う。2023年から許可施設が稼働し、うつ・不安・依存などへの利用が報告される。連邦法では依然として規制物質だが、州レベルの合法化モデルとして注目される。"},{"name":"コロラド州天然幻覚剤合法化","chapter":"c10-統合-実践-生化学-安全","sub":0,"subCount":11,"tags":["policy","substance","culture"],"birth":null,"death":null,"href":"https://note.com/search?q=from%3A%40varelser%20%E3%82%B3%E3%83%AD%E3%83%A9%E3%83%89%E5%B7%9E%E5%A4%A9%E7%84%B6%E5%B9%BB%E8%A6%9A%E5%89%A4%E5%90%88%E6%B3%95%E5%8C%96&context=note&mode=search","article":false,"descRaw":"：2022年11月の住民投票で第122号提案が可決され、シロシビン・シロシン・DMT・イボガイン・メスカリンなど天然幻覚剤の個人所持が非犯罪化された。ペヨーテは対象外とされた。さらに認可ヒーリングセンターでの管理下での使用制度が創設され、オレゴン州に続く州レベルの規制モデルとなった。医療制度の外での成人への提供を認める点で、サイケデリック政策の転換を示す。"},{"name":"コンパス・パスウェイズ","chapter":"c10-統合-実践-生化学-安全","sub":0,"subCount":11,"tags":["clinical","substance"],"birth":null,"death":null,"href":"https://note.com/search?q=from%3A%40varelser%20%E3%82%B3%E3%83%B3%E3%83%91%E3%82%B9%E3%83%BB%E3%83%91%E3%82%B9%E3%82%A6%E3%82%A7%E3%82%A4%E3%82%BA&context=note&mode=search","article":false,"descRaw":"：英国のバイオテクノロジー企業。合成シロシビン製剤COMP360を治療抵抗性うつ病向けに開発し、2018年に米国FDAから画期的治療薬指定を受けた。2025年には第3相試験で主要評価項目を達成したと発表し、承認申請へ向けた動きが報じられた。サイケデリック・ルネサンスの商業化の象徴として、特許や企業の役割をめぐる議論も呼んでいる。"},{"name":"トランスパーソナル心理学の創立（マズロー, サティッチ, グロフ, 1969）","chapter":"c10-統合-実践-生化学-安全","sub":1,"subCount":11,"tags":["theory","religion","science"],"birth":null,"death":null,"href":"https://note.com/varelser/n/nc44d4a1cd985","article":true,"descRaw":"：1969年にアブラハム・マズロー、アンソニー・サティッチ、スタニスラフ・グロフらが創設した「第四の心理学」。行動主義・精神分析・人間性心理学に続くものとして、自己超越体験や霊的体験を心理学の正当な研究対象とした。同年に『Journal of Transpersonal Psychology』も創刊され、変性意識研究の制度的基盤となった。"},{"name":"至高体験（マズロー, 1964）","chapter":"c10-統合-実践-生化学-安全","sub":1,"subCount":11,"tags":["theory","religion"],"birth":null,"death":null,"href":"https://note.com/search?q=from%3A%40varelser%20%E8%87%B3%E9%AB%98%E4%BD%93%E9%A8%93%EF%BC%88%E3%83%9E%E3%82%BA%E3%83%AD%E3%83%BC%2C%201964%EF%BC%89&context=note&mode=search","article":false,"descRaw":"：アブラハム・マズローが1964年の著書『Religions, Values, and Peak-Experiences』で記述した体験。自己実現者に共通する、自我の境界が溶け、一体感や畏敬、至福を伴う一過性の頂点体験を「至高体験（peak experience）」と名づけた。宗教体験を心理学的現象として記述し、人間性心理学から変性意識研究への架橋となった。"},{"name":"変性意識状態の概念（チャールズ・タート, 1969）","chapter":"c10-統合-実践-生化学-安全","sub":1,"subCount":11,"tags":["theory","science"],"birth":null,"death":null,"href":"https://note.com/search?q=from%3A%40varelser%20%E5%A4%89%E6%80%A7%E6%84%8F%E8%AD%98%E7%8A%B6%E6%85%8B%E3%81%AE%E6%A6%82%E5%BF%B5%EF%BC%88%E3%83%81%E3%83%A3%E3%83%BC%E3%83%AB%E3%82%BA%E3%83%BB%E3%82%BF%E3%83%BC%E3%83%88%2C%201969%EF%BC%89&context=note&mode=search","article":false,"descRaw":"：米国の心理学者チャールズ・タートが1969年の編著『Altered States of Consciousness』でASCの概念を学術的に定義・分類した。催眠・瞑想・薬物・夢などの変性意識状態を、通常の意識状態との質的な違いから体系化し、意識研究のパラダイムを形成した。タートは後に「状態特異的科学」の構想も提唱した。"},{"name":"周産期マトリクス理論（グロフ）","chapter":"c10-統合-実践-生化学-安全","sub":1,"subCount":11,"tags":["theory","clinical"],"birth":null,"death":null,"href":"https://note.com/search?q=from%3A%40varelser%20%E5%91%A8%E7%94%A3%E6%9C%9F%E3%83%9E%E3%83%88%E3%83%AA%E3%82%AF%E3%82%B9%E7%90%86%E8%AB%96%EF%BC%88%E3%82%B0%E3%83%AD%E3%83%95%EF%BC%89&context=note&mode=search","article":false,"descRaw":"：スタニスラフ・グロフによる、出生過程の4段階（BPM I〜IV）が深層心理と変性意識体験の構造を規定するという理論。子宮内の安寧、陣痛の圧迫、産道通過、誕生の解放という各段階が、後の体験の原型になるとした。LSD精神療法の臨床観察から生まれ、トランスパーソナル心理学の中心理論の一つとなった。グロフはLSDセッション数千例の観察からこの理論を導き出した。"},{"name":"ケン・ウィルバーのAQALモデル","chapter":"c10-統合-実践-生化学-安全","sub":1,"subCount":11,"tags":["theory","religion"],"birth":null,"death":null,"href":"https://note.com/search?q=from%3A%40varelser%20%E3%82%B1%E3%83%B3%E3%83%BB%E3%82%A6%E3%82%A3%E3%83%AB%E3%83%90%E3%83%BC%E3%81%AEAQAL%E3%83%A2%E3%83%87%E3%83%AB&context=note&mode=search","article":false,"descRaw":"：ウィルバーが1995年の著書『Sex, Ecology, Spirituality』で体系化したインテグラル理論の枠組み。四象限（内面・外面×個人・集合）、発達レベル、発達ライン、状態、タイプを統合し、変性意識の「状態」と発達の「段階」を区別して位置づけた。意識研究の包括的地図として、トランスパーソナル心理学の理論的支柱となった。"},{"name":"インテグラル・スピリチュアリティ（ウィルバー, 2006）","chapter":"c10-統合-実践-生化学-安全","sub":1,"subCount":11,"tags":["theory","religion"],"birth":null,"death":null,"href":"https://note.com/search?q=from%3A%40varelser%20%E3%82%A4%E3%83%B3%E3%83%86%E3%82%B0%E3%83%A9%E3%83%AB%E3%83%BB%E3%82%B9%E3%83%94%E3%83%AA%E3%83%81%E3%83%A5%E3%82%A2%E3%83%AA%E3%83%86%E3%82%A3%EF%BC%88%E3%82%A6%E3%82%A3%E3%83%AB%E3%83%90%E3%83%BC%2C%202006%EF%BC%89&context=note&mode=search","article":false,"descRaw":"：ウィルバーの2006年の著書。霊的体験を発達心理学的に位置づけ、幼児的な前合理的な体験と、発達を経た超合理的な体験を混同する「前／トランスの誤謬（pre/trans fallacy）」を回避するモデルを提示した。瞑想や神秘体験を発達段階と結びつけ、スピリチュアリティの統合的理解を試みた。瞑想体験を発達段階と結びつける点で、トランスパーソナル心理学の発展形とされる。"},{"name":"ポスト・トラウマティック・グロース（テデスキ & カルフーン, 1996）","chapter":"c10-統合-実践-生化学-安全","sub":1,"subCount":11,"tags":["clinical","theory"],"birth":null,"death":null,"href":"https://note.com/search?q=from%3A%40varelser%20%E3%83%9D%E3%82%B9%E3%83%88%E3%83%BB%E3%83%88%E3%83%A9%E3%82%A6%E3%83%9E%E3%83%86%E3%82%A3%E3%83%83%E3%82%AF%E3%83%BB%E3%82%B0%E3%83%AD%E3%83%BC%E3%82%B9%EF%BC%88%E3%83%86%E3%83%87%E3%82%B9%E3%82%AD%20%26%20%E3%82%AB%E3%83%AB%E3%83%95%E3%83%BC%E3%83%B3%2C%201996%EF%BC%89&context=note&mode=search","article":false,"descRaw":"：リチャード・テデスキとローレンス・カルフーンによる1996年の研究。トラウマ後の心理的成長（PTG）を提唱し、苦痛体験が自己認識の深化や他者との絆、人生観の変容をもたらす逆説的プロセスを実証した。21項目のPTG尺度を開発し、トラウマを単なる障害ではなく自己変容の契機として捉える視点を示した。逆境後の成長は、PTSDの回復過程の研究にも応用されている。 出典：Tedeschi & Calhoun (1996)『Journal of Traumatic Stress』 DOI: 10.1007/BF02103658"},{"name":"アウェアネス・プロジェクト（パルス研究所）","chapter":"c10-統合-実践-生化学-安全","sub":1,"subCount":11,"tags":["science","clinical","religion"],"birth":null,"death":null,"href":"https://note.com/search?q=from%3A%40varelser%20%E3%82%A2%E3%82%A6%E3%82%A7%E3%82%A2%E3%83%8D%E3%82%B9%E3%83%BB%E3%83%97%E3%83%AD%E3%82%B8%E3%82%A7%E3%82%AF%E3%83%88%EF%BC%88%E3%83%91%E3%83%AB%E3%82%B9%E7%A0%94%E7%A9%B6%E6%89%80%EF%BC%89&context=note&mode=search","article":false,"descRaw":"：蘇生医学の専門家サム・パルニアらが主導する、臨死体験と体外離脱の前向き臨床研究。2008年に開始されたAWARE研究では、33病院で心停止患者を対象に、蘇生中の意識の有無を検証した。2014年の報告では、蘇生中に意識があったとされる事例が確認され、臨死体験の科学的検証の試みとして注目された。パルニアはサウサンプトン大学などで蘇生中の意識を研究してきた。 出典：Parnia et al. (2014)『Resuscitation』 DOI: 10.1016/j.resuscitation.2014.09.004"},{"name":"吸収（Absorption）理論（テレジェン & アトキンソン, 1974）","chapter":"c10-統合-実践-生化学-安全","sub":1,"subCount":11,"tags":["theory","science"],"birth":null,"death":null,"href":"https://note.com/search?q=from%3A%40varelser%20%E5%90%B8%E5%8F%8E%EF%BC%88Absorption%EF%BC%89%E7%90%86%E8%AB%96%EF%BC%88%E3%83%86%E3%83%AC%E3%82%B8%E3%82%A7%E3%83%B3%20%26%20%E3%82%A2%E3%83%88%E3%82%AD%E3%83%B3%E3%82%BD%E3%83%B3%2C%201974%EF%BC%89&context=note&mode=search","article":false,"descRaw":"：アウケ・テレジェンとギルバート・アトキンソンによる1974年の研究。注意が対象に全面的に没入する傾向を「吸収（absorption）」という特性変数として定義し、尺度（TAS）を開発した。催眠感受性、フロー、神秘体験、サイケデリック反応の個人差を説明する要因として、変性意識への感受性の基盤を捉えた。 出典：Tellegen & Atkinson (1974)『Journal of Abnormal Psychology』 DOI: 10.1037/h0036681"},{"name":"アブラハム・マズロー","chapter":"c10-統合-実践-生化学-安全","sub":2,"subCount":11,"tags":["theory","science"],"birth":1908,"death":1970,"href":"https://note.com/varelser/n/nf9763dc86d5e","article":true,"descRaw":"（1908–1970）：アメリカの心理学者で人間性心理学の中心人物。欲求階層説を提唱し、その頂点に自己実現を置いた。『人間性の心理学』（1954）などで、自己や世界の境界が溶ける至高体験（Peak Experience）を健康な人間の変性意識として記述し、後のトランスパーソナル心理学への道を開いた。晩年はトランスパーソナル心理学の創設にも関わった。"},{"name":"カール・ロジャーズ","chapter":"c10-統合-実践-生化学-安全","sub":2,"subCount":11,"tags":["theory","clinical"],"birth":1902,"death":1987,"href":"https://note.com/varelser/n/n22905aa8244e","article":true,"descRaw":"（1902–1987）：アメリカの心理学者でクライエント中心療法（来談者中心療法）の創始者。『クライエント中心療法』（1951）で、無条件の肯定的配慮、共感的理解、自己一致を治療の条件とし、治療者の技法より関係そのものを重視した。人間性心理学の柱となり、瞑想や変性意識への関心も晩年に深めた。教育や集団療法の場でもその姿勢は広く応用された。"},{"name":"スタニスラフ・グロフ","chapter":"c10-統合-実践-生化学-安全","sub":2,"subCount":11,"tags":["theory","substance","clinical"],"birth":1931,"death":null,"href":"https://note.com/varelser/n/na2cbd9e26fbc","article":true,"descRaw":"（1931–）：チェコ生まれの精神科医でトランスパーソナル心理学の創始者の一人。1960年代にプラハでLSDを用いた精神療法を研究し、出生前後の体験を周産期マトリクスとして理論化した。薬物を用いない呼吸法ホロトロピック・ブレスワークを開発し、変性意識を治療と自己探求の手段として体系化した。エサレン研究所での活動を通じ、呼吸法は世界に広まった。"},{"name":"ケン・ウィルバー","chapter":"c10-統合-実践-生化学-安全","sub":2,"subCount":11,"tags":["theory","religion"],"birth":1949,"death":null,"href":"https://note.com/search?q=from%3A%40varelser%20%E3%82%B1%E3%83%B3%E3%83%BB%E3%82%A6%E3%82%A3%E3%83%AB%E3%83%90%E3%83%BC&context=note&mode=search","article":false,"descRaw":"（1949–）：アメリカの思想家でインテグラル理論の提唱者。『意識のスペクトル』（1977）で意識を発達の段階と状態の二軸で捉え、心理学・神秘主義・科学を統合する枠組みを築いた。瞑想や変性意識を発達の階梯のなかに位置づけ、トランスパーソナル心理学の理論的支柱となった。AQALモデルでは、主観・客観・個人・集団の四象限で現実を捉えた。"},{"name":"ヴィクトール・フランクル","chapter":"c10-統合-実践-生化学-安全","sub":2,"subCount":11,"tags":["theory","clinical","religion"],"birth":1905,"death":1997,"href":"https://note.com/varelser/n/n18f79adcf36c","article":true,"descRaw":"（1905–1997）：オーストリアの精神科医でロゴセラピーの創始者。ナチスの強制収容所での体験を記した『夜と霧』（1946）で知られ、苦悩のなかでも意味への意志が人間の核心だと説いた。意味の発見による実存的超越は、日常意識を超える体験として変性意識の主題と重なる。収容所での体験をもとに、態度の自由と意味の発見を説き、著書は世界中で読み継がれている。"},{"name":"アレン・ワッツ","chapter":"c10-統合-実践-生化学-安全","sub":2,"subCount":11,"tags":["theory","religion","substance"],"birth":1915,"death":1973,"href":"https://note.com/search?q=from%3A%40varelser%20%E3%82%A2%E3%83%AC%E3%83%B3%E3%83%BB%E3%83%AF%E3%83%83%E3%83%84&context=note&mode=search","article":false,"descRaw":"（英-米・1915–1973）：イギリス生まれの哲学者・著述家で、禅・タオイズム・ヴェーダーンタを西洋に普及させた。『禅の道』（1957）などの著作で東洋思想を紹介し、サイケデリック体験と瞑想の共通性を語った。1960年代のカウンターカルチャーに大きな影響を与え、意識の変容を日常の言葉で伝えた啓蒙者だった。著書はベストセラーとなり、禅ブームの火付け役となった。"},{"name":"R.D.レイン","chapter":"c10-統合-実践-生化学-安全","sub":2,"subCount":11,"tags":["theory","clinical"],"birth":1927,"death":1989,"href":"https://note.com/varelser/n/n67c11237909b","article":true,"descRaw":"（英・1927–1989）：スコットランドの精神科医で反精神医学の代表者。『引き裂かれた自己』（1960）で統合失調症を脳の故障ではなく、耐えがたい現実への意味ある反応と捉え直した。狂気を「意識の別の形態」と見る視点は、変性意識を病理ではなく経験の様態として扱う議論の出発点となった。ロンドンのキングスレイ・ホールでは、患者とともに暮らす共同体を試みた。"},{"name":"フリッツ・パールズ","chapter":"c10-統合-実践-生化学-安全","sub":2,"subCount":11,"tags":["theory","clinical","practice"],"birth":1893,"death":1970,"href":"https://note.com/varelser/n/n69c52b19116d","article":true,"descRaw":"（独-米・1893–1970）：ドイツ生まれの精神科医でゲシュタルト療法の創始者。『ゲシュタルト療法』（1951）で「今・ここ」への全面的な気づきを重視し、未完の感情を身体感覚とともに体験し直す技法を築いた。カリフォルニアのエサレン研究所での活動を通じ、人間性心理学と意識変容の実践に大きな影響を与えた。夢を語るのではなく、夢の登場人物になりきって演じる技法でも知られる。"},{"name":"クラウディオ・ナランホ","chapter":"c10-統合-実践-生化学-安全","sub":2,"subCount":11,"tags":["clinical","substance","theory"],"birth":1932,"death":2019,"href":"https://note.com/varelser/n/n04cd44ed2ab7","article":true,"descRaw":"（チリ-米・1932–2019）：チリ生まれの精神科医・ゲシュタルト療法家。ゲシュタルト療法にエンテオジェン（神聖植物）を用いた療法を統合し、MDAやイボガインの治療的利用を先駆的に探った。『The Healing Journey』（1973）などの著作があり、エニアグラムの性格論を西洋に広めたことでも知られる。晩年は教育改革や意識の進化を説く活動を続けた。"},{"name":"ミハイ・チクセントミハイ","chapter":"c10-統合-実践-生化学-安全","sub":2,"subCount":11,"tags":["theory","science"],"birth":1934,"death":2021,"href":"https://note.com/varelser/n/ne649da87519e","article":true,"descRaw":"（ハンガリー-米・1934–2021）：ハンガリー生まれの心理学者。フロー（Flow）の概念化で知られ、技能と課題が釣り合うとき自意識が消え、時間感覚が変容する最適体験を記述した。シカゴ大学での研究をもとにした『フロー』（1990）はスポーツ・芸術・労働に広がり、日常のなかの変性意識を心理学の主題として確立した。創造性やスポーツの研究でもフローの概念は応用された。"},{"name":"夢の解釈（フロイト, 1900）","chapter":"c10-統合-実践-生化学-安全","sub":3,"subCount":11,"tags":["dream","theory","clinical"],"birth":null,"death":null,"href":"https://note.com/search?q=from%3A%40varelser%20%E5%A4%A2%E3%81%AE%E8%A7%A3%E9%87%88%EF%BC%88%E3%83%95%E3%83%AD%E3%82%A4%E3%83%88%2C%201900%EF%BC%89&context=note&mode=search","article":false,"descRaw":"：ジークムント・フロイトの1900年の主著。夢を無意識への「王道」とし、顕在内容と潜在内容を区別して、夢の仕事（圧縮・置換・二次加工）を理論化した。夢を願望充足の表現とみなし、精神分析の基礎を築いた。夢研究と変性意識研究の古典として、後の夢の科学にも影響を与えた。初版は1899年11月に刊行されたが、奥付は1900年とされたことでも知られる。"},{"name":"集合的無意識と元型論（ユング）","chapter":"c10-統合-実践-生化学-安全","sub":3,"subCount":11,"tags":["theory","religion"],"birth":null,"death":null,"href":"https://note.com/search?q=from%3A%40varelser%20%E9%9B%86%E5%90%88%E7%9A%84%E7%84%A1%E6%84%8F%E8%AD%98%E3%81%A8%E5%85%83%E5%9E%8B%E8%AB%96%EF%BC%88%E3%83%A6%E3%83%B3%E3%82%B0%EF%BC%89&context=note&mode=search","article":false,"descRaw":"：カール・G・ユングによる、個人を超えた無意識の共通層と、そこに現れる普遍的イメージ・パターン（元型）の理論。母・英雄・影・自己などの元型は、神話や夢、変性意識体験に現れるとした。個人的無意識を超えた心の深層を想定し、変性意識体験の深層心理学的解釈の基盤となった。元型は神話・昔話・夢に繰り返し現れる普遍的な心像とされる。"},{"name":"個性化過程（ユング）","chapter":"c10-統合-実践-生化学-安全","sub":3,"subCount":11,"tags":["theory","religion","practice"],"birth":null,"death":null,"href":"https://note.com/search?q=from%3A%40varelser%20%E5%80%8B%E6%80%A7%E5%8C%96%E9%81%8E%E7%A8%8B%EF%BC%88%E3%83%A6%E3%83%B3%E3%82%B0%EF%BC%89&context=note&mode=search","article":false,"descRaw":"：ユングによる、意識と無意識の統合を通じた全人格的な自己実現のプロセス。自我と自己（セルフ）の対話を通じて人格が全体化するとし、夢や能動的想像、変性意識体験を個性化の契機として位置づけた。人生後半の発達課題として、自己実現の心理学的モデルを提示した。ユングはこの過程を生涯にわたる課題とし、後半生の心理的発達の中心に置いた。"},{"name":"積極的想像法（ユング）","chapter":"c10-統合-実践-生化学-安全","sub":3,"subCount":11,"tags":["practice","theory","dream"],"birth":null,"death":null,"href":"https://note.com/search?q=from%3A%40varelser%20%E7%A9%8D%E6%A5%B5%E7%9A%84%E6%83%B3%E5%83%8F%E6%B3%95%EF%BC%88%E3%83%A6%E3%83%B3%E3%82%B0%EF%BC%89&context=note&mode=search","article":false,"descRaw":"：ユングが開発した、覚醒状態で無意識のイメージと対話する技法。瞑想のように心に浮かぶ像を能動的に展開させ、無意識との交流を図る。ユング自身の『赤の書』（1913〜30年頃に執筆）での実践が知られ、夢見や瞑想、サイケデリック体験との方法論的類似性が指摘されている。ユングはこの技法を夢分析と並ぶ無意識への接近法として重視した。"},{"name":"アタッチメント理論と変性意識（ボウルビー／メイン）","chapter":"c10-統合-実践-生化学-安全","sub":3,"subCount":11,"tags":["theory","clinical"],"birth":null,"death":null,"href":"https://note.com/varelser/n/n4055083f8957","article":true,"descRaw":"：ジョン・ボウルビーのアタッチメント理論と、メアリー・メインの成人アタッチメント面接（AAI）に基づく視点。安全基地の有無が変性意識体験の質に影響し、安定した愛着がトラウマや解離からの回復を支えるとされる。治療関係と、サイケデリック療法における「セット＆セッティング」の理論的基盤となった。メインはAAIにより成人の愛着スタイルを分類し、世代間伝達を示した。"},{"name":"EMDR（シャピロ, 1987）","chapter":"c10-統合-実践-生化学-安全","sub":3,"subCount":11,"tags":["clinical","practice"],"birth":null,"death":null,"href":"https://note.com/search?q=from%3A%40varelser%20EMDR%EF%BC%88%E3%82%B7%E3%83%A3%E3%83%94%E3%83%AD%2C%201987%EF%BC%89&context=note&mode=search","article":false,"descRaw":"：フランシン・シャピロが1987年に発見した眼球運動によるトラウマ記憶の再処理法。両側性の眼球運動を伴いながら外傷記憶を想起することで、記憶の処理が促進されるとする。1989年の最初の論文以来、PTSD治療として広く用いられ、情報処理の加速が変性意識的な状態を介して行われる可能性も議論されている。WHOもPTSDの推奨治療としてEMDRを挙げている。 出典：Shapiro (1989)『Journal of Traumatic Stress』 DOI: 10.1007/BF00974159"},{"name":"ポリヴェーガル理論の臨床応用（ダナ, 2018）","chapter":"c10-統合-実践-生化学-安全","sub":3,"subCount":11,"tags":["clinical","theory","science"],"birth":null,"death":null,"href":"https://note.com/search?q=from%3A%40varelser%20%E3%83%9D%E3%83%AA%E3%83%B4%E3%82%A7%E3%83%BC%E3%82%AC%E3%83%AB%E7%90%86%E8%AB%96%E3%81%AE%E8%87%A8%E5%BA%8A%E5%BF%9C%E7%94%A8%EF%BC%88%E3%83%80%E3%83%8A%2C%202018%EF%BC%89&context=note&mode=search","article":false,"descRaw":"：デブ・ダナによる2018年の著書『The Polyvagal Theory in Therapy』。スティーヴン・ポージェスのポリヴェーガル理論をもとに、自律神経の状態（安全・動員・凍結）を臨床的にマッピングする方法を提示した。安全の神経状態が治療的変性意識体験の前提条件であるという視点で、トラウマ治療に応用されている。"},{"name":"ACT（アクセプタンス＆コミットメント・セラピー）と脱フュージョン","chapter":"c10-統合-実践-生化学-安全","sub":3,"subCount":11,"tags":["clinical","practice"],"birth":null,"death":null,"href":"https://note.com/search?q=from%3A%40varelser%20ACT%EF%BC%88%E3%82%A2%E3%82%AF%E3%82%BB%E3%83%97%E3%82%BF%E3%83%B3%E3%82%B9%EF%BC%86%E3%82%B3%E3%83%9F%E3%83%83%E3%83%88%E3%83%A1%E3%83%B3%E3%83%88%E3%83%BB%E3%82%BB%E3%83%A9%E3%83%94%E3%83%BC%EF%BC%89%E3%81%A8%E8%84%B1%E3%83%95%E3%83%A5%E3%83%BC%E3%82%B8%E3%83%A7%E3%83%B3&context=note&mode=search","article":false,"descRaw":"：スティーヴン・ヘイズらが1999年に体系化した第三世代の認知行動療法。思考と自己を同一視する「フュージョン」から距離を取る「脱フュージョン」を通じ、心理的柔軟性を高める。マインドフルネスと価値に基づく行動を統合し、思考からの距離という変性意識的な側面を持つ。ACTは「第三世代の認知行動療法」の代表例として、世界で広く実践されている。"},{"name":"DBT（弁証法的行動療法）（リネハン, 1993）","chapter":"c10-統合-実践-生化学-安全","sub":3,"subCount":11,"tags":["clinical","practice"],"birth":null,"death":null,"href":"https://note.com/search?q=from%3A%40varelser%20DBT%EF%BC%88%E5%BC%81%E8%A8%BC%E6%B3%95%E7%9A%84%E8%A1%8C%E5%8B%95%E7%99%82%E6%B3%95%EF%BC%89%EF%BC%88%E3%83%AA%E3%83%8D%E3%83%8F%E3%83%B3%2C%201993%EF%BC%89&context=note&mode=search","article":false,"descRaw":"：マーシャ・リネハンが1993年の著書で体系化した心理療法。マインドフルネス、対人関係、感情調整、苦痛耐性の4モジュールからなり、境界性パーソナリティ障害の治療として開発された。受容と変化の弁証法的統合を特徴とし、変性意識的な注意訓練を含む。DBTは自殺企図の低減効果が無作為化試験で示され、標準治療の一つとなった。リネハン自身も若年期に精神的困難を経験したことを後に公表している。"},{"name":"ポジティブ心理学と意識のポジティブ状態（セリグマン, 2000〜）","chapter":"c10-統合-実践-生化学-安全","sub":3,"subCount":11,"tags":["theory","science"],"birth":null,"death":null,"href":"https://note.com/search?q=from%3A%40varelser%20%E3%83%9D%E3%82%B8%E3%83%86%E3%82%A3%E3%83%96%E5%BF%83%E7%90%86%E5%AD%A6%E3%81%A8%E6%84%8F%E8%AD%98%E3%81%AE%E3%83%9D%E3%82%B8%E3%83%86%E3%82%A3%E3%83%96%E7%8A%B6%E6%85%8B%EF%BC%88%E3%82%BB%E3%83%AA%E3%82%B0%E3%83%9E%E3%83%B3%2C%202000%E3%80%9C%EF%BC%89&context=note&mode=search","article":false,"descRaw":"：マーティン・セリグマンとミハイ・チクセントミハイが2000年の論文で提唱したポジティブ心理学。ウェルビーイング、フロー、強み、感謝などのポジティブな心理状態を科学的に研究する。畏怖・フロー・感謝といったポジティブな変性意識状態を、病理ではなく人間の成長の側面から捉えた。セリグマンは米国心理学会会長としてポジティブ心理学を提唱した。 出典：Seligman & Csikszentmihalyi (2000)『American Psychologist』 DOI: 10.1037/0003-066X.55.1.5"},{"name":"認知バイアス研究（カーネマン & トヴェルスキー）","chapter":"c10-統合-実践-生化学-安全","sub":3,"subCount":11,"tags":["theory","science"],"birth":null,"death":null,"href":"https://note.com/search?q=from%3A%40varelser%20%E8%AA%8D%E7%9F%A5%E3%83%90%E3%82%A4%E3%82%A2%E3%82%B9%E7%A0%94%E7%A9%B6%EF%BC%88%E3%82%AB%E3%83%BC%E3%83%8D%E3%83%9E%E3%83%B3%20%26%20%E3%83%88%E3%83%B4%E3%82%A7%E3%83%AB%E3%82%B9%E3%82%AD%E3%83%BC%EF%BC%89&context=note&mode=search","article":false,"descRaw":"：ダニエル・カーネマンとエイモス・トヴェルスキーによる、ヒューリスティクスと体系的バイアスの研究。1979年のプロスペクト理論や、直観的で速いシステム1と思考的で遅いシステム2の二重過程理論（2011年の著書『ファスト＆スロー』）で知られる。自動的認知と意識的修正の関係を明らかにした。カーネマンは2002年にノーベル経済学賞を受賞した。 出典：Kahneman & Tversky (1979)『Econometrica』 DOI: 10.2307/1914185"},{"name":"認知的不協和理論（フェスティンガー, 1957）","chapter":"c10-統合-実践-生化学-安全","sub":3,"subCount":11,"tags":["theory","science"],"birth":null,"death":null,"href":"https://note.com/search?q=from%3A%40varelser%20%E8%AA%8D%E7%9F%A5%E7%9A%84%E4%B8%8D%E5%8D%94%E5%92%8C%E7%90%86%E8%AB%96%EF%BC%88%E3%83%95%E3%82%A7%E3%82%B9%E3%83%86%E3%82%A3%E3%83%B3%E3%82%AC%E3%83%BC%2C%201957%EF%BC%89&context=note&mode=search","article":false,"descRaw":"：レオン・フェスティンガーが1957年の著書で提唱した理論。矛盾する認知（信念と行動の不一致）が心理的緊張を生み、人は認知や行動を変えて不協和を解消しようとするとした。変性意識体験後の世界観の再構築や認知的再編との接点があり、社会心理学の古典となった。フェスティンガーの理論は社会心理学の最も影響力のある理論の一つとされる。"},{"name":"学習性無力感（セリグマン, 1967）","chapter":"c10-統合-実践-生化学-安全","sub":3,"subCount":11,"tags":["theory","science"],"birth":null,"death":null,"href":"https://note.com/search?q=from%3A%40varelser%20%E5%AD%A6%E7%BF%92%E6%80%A7%E7%84%A1%E5%8A%9B%E6%84%9F%EF%BC%88%E3%82%BB%E3%83%AA%E3%82%B0%E3%83%9E%E3%83%B3%2C%201967%EF%BC%89&context=note&mode=search","article":false,"descRaw":"：マーティン・セリグマンとスティーヴン・マイヤーによる1967年の研究。制御不能な状況への反復曝露が、逃避可能な場面でも受動性を生む現象を犬の実験で示した。うつ病モデルの基盤となり、サイケデリック体験による無力感の解除や、学習性楽観主義への展開も議論されている。セリグマンは後に「学習性楽観主義」を提唱し、無力感の克服を論じた。 出典：Seligman & Maier (1967)『Journal of Experimental Psychology』 DOI: 10.1037/h0024514"},{"name":"同時性（シンクロニシティ）（ユング & パウリ, 1952）","chapter":"c10-統合-実践-生化学-安全","sub":3,"subCount":11,"tags":["theory","religion"],"birth":null,"death":null,"href":"https://note.com/search?q=from%3A%40varelser%20%E5%90%8C%E6%99%82%E6%80%A7%EF%BC%88%E3%82%B7%E3%83%B3%E3%82%AF%E3%83%AD%E3%83%8B%E3%82%B7%E3%83%86%E3%82%A3%EF%BC%89%EF%BC%88%E3%83%A6%E3%83%B3%E3%82%B0%20%26%20%E3%83%91%E3%82%A6%E3%83%AA%2C%201952%EF%BC%89&context=note&mode=search","article":false,"descRaw":"：ユングと物理学者ヴォルフガング・パウリが1952年の共著『Naturerklärung und Psyche』で論じた概念。因果的に無関係な事象間の意味ある一致を「同時性」と名づけ、因果律を超えた結びつきを想定した。変性意識状態では同時性体験が増加するとされ、心理学と物理学の対話の試みとして知られる。"},{"name":"積極的分離理論（TPD）（ドンブロフスキ）","chapter":"c10-統合-実践-生化学-安全","sub":3,"subCount":11,"tags":["theory","clinical"],"birth":null,"death":null,"href":"https://note.com/varelser/n/n2835bc6a0fb7","article":true,"descRaw":"：ポーランドの心理学者カジミエシュ・ドンブロフスキによる理論。心理的危機や内的葛藤が、既存の人格構造の「積極的分離」を通じて高次の統合へ至る発達的契機になるとした。1964年の著書『Positive Disintegration』で体系化され、変性意識体験を発達論的に位置づける視点を示した。ドンブロフスキはポーランドの精神科医で、英才児の発達研究でも知られる。"},{"name":"ジークムント・フロイト","chapter":"c10-統合-実践-生化学-安全","sub":4,"subCount":11,"tags":["theory","science","dream"],"birth":1856,"death":1939,"href":"https://note.com/search?q=from%3A%40varelser%20%E3%82%B8%E3%83%BC%E3%82%AF%E3%83%A0%E3%83%B3%E3%83%88%E3%83%BB%E3%83%95%E3%83%AD%E3%82%A4%E3%83%88&context=note&mode=search","article":false,"descRaw":"（1856–1939）：オーストリアの精神科医で精神分析の創始者。『夢判断』（1900）で夢を無意識への王道とし、自由連想やエディプス・コンプレックスの理論を築いた。晩年、ロマン・ロランとの往復書簡で宗教感情の根源とされる「大洋感情」を論じ、自我の境界が溶ける体験を精神分析の言葉で捉え直した。晩年の『文化への不満』では文明と本能の葛藤を論じた。"},{"name":"カール・G・ユング","chapter":"c10-統合-実践-生化学-安全","sub":4,"subCount":11,"tags":["theory","religion"],"birth":1875,"death":1961,"href":"https://note.com/search?q=from%3A%40varelser%20%E3%82%AB%E3%83%BC%E3%83%AB%E3%83%BBG%E3%83%BB%E3%83%A6%E3%83%B3%E3%82%B0&context=note&mode=search","article":false,"descRaw":"（1875–1961）：スイスの精神科医で分析心理学の創始者。フロイトから離れ、個人の無意識の奥に人類共通の集合的無意識と元型を想定し、生涯をかけた自己実現の過程を個性化と呼んだ。内面との対話を描いた『赤の書』（2009年刊）や能動的想像の技法は、夢や幻視を意識変容の道として開いた。フロイトとの決別後、神話・錬金術・東洋思想の研究へと進んだ。"},{"name":"アルフレッド・アドラー","chapter":"c10-統合-実践-生化学-安全","sub":4,"subCount":11,"tags":["theory","science"],"birth":1870,"death":1937,"href":"https://note.com/search?q=from%3A%40varelser%20%E3%82%A2%E3%83%AB%E3%83%95%E3%83%AC%E3%83%83%E3%83%89%E3%83%BB%E3%82%A2%E3%83%89%E3%83%A9%E3%83%BC&context=note&mode=search","article":false,"descRaw":"（1870–1937）：オーストリアの精神科医で個人心理学の創始者。フロイトのウィーン精神分析学会を離れ、劣等感とその補償を人間の動機の中心に置いた。共同体感覚を健康の指標とし、フロイト、ユングと並ぶ深層心理学の第三の柱を築いた。劣等感の克服としての意識の変容を説いた点で、変性意識の議論とも接する。教育や子育ての現場でもその心理学は応用された。"},{"name":"ピエール・ジャネ","chapter":"c10-統合-実践-生化学-安全","sub":4,"subCount":11,"tags":["theory","science","practice"],"birth":1859,"death":1947,"href":"https://note.com/search?q=from%3A%40varelser%20%E3%83%94%E3%82%A8%E3%83%BC%E3%83%AB%E3%83%BB%E3%82%B8%E3%83%A3%E3%83%8D&context=note&mode=search","article":false,"descRaw":"（仏・1859–1947）：フランスの心理学者・精神科医で、フロイトに先立つ無意識研究の先駆者。『心理的自動症』（1889）で解離（dissociation）の概念を創始し、催眠下の心的自動症や多重人格を精密に記述した。意識が複数の層に分かれうるという考えは、後のトラウマ・解離研究と変性意識研究の土台となった。トラウマによる記憶の分断を臨床的に記述した。"},{"name":"オットー・ランク","chapter":"c10-統合-実践-生化学-安全","sub":4,"subCount":11,"tags":["theory","science"],"birth":1884,"death":1939,"href":"https://note.com/search?q=from%3A%40varelser%20%E3%82%AA%E3%83%83%E3%83%88%E3%83%BC%E3%83%BB%E3%83%A9%E3%83%B3%E3%82%AF&context=note&mode=search","article":false,"descRaw":"（奥・1884–1939）：オーストリアの精神分析家。フロイトの側近から離れ、『出生のトラウマ』（1924）で誕生時の分離体験をあらゆる不安の原型と捉えた。芸術家の創造性や意思療法を論じ、死と再生の体験を重視したその思想は、スタニスラフ・グロフの周産期マトリクス理論に直接の源流を与えた。晩年はアメリカで活動し、短期療法の先駆者となった。"},{"name":"ドナルド・ウィニコット","chapter":"c10-統合-実践-生化学-安全","sub":4,"subCount":11,"tags":["theory","science"],"birth":1896,"death":1971,"href":"https://note.com/varelser/n/ne81931a0621a","article":true,"descRaw":"（英・1896–1971）：イギリスの小児科医・精神分析家。母親の抱える環境（ホールディング）や移行対象の概念で、自己の基盤は他者との関係のなかで育つと説いた。「十分に良い母親」や遊びの理論は、自我がまだ固まる前の前反省的な意識のあり方を照らし、変性意識研究にもつながる視点を残した。小児科医として母子相談にあたり、遊びのなかでこそ自己が育つと考えた。"},{"name":"ヴィルヘルム・ライヒ","chapter":"c10-統合-実践-生化学-安全","sub":4,"subCount":11,"tags":["theory","science","practice"],"birth":1897,"death":1957,"href":"https://note.com/search?q=from%3A%40varelser%20%E3%83%B4%E3%82%A3%E3%83%AB%E3%83%98%E3%83%AB%E3%83%A0%E3%83%BB%E3%83%A9%E3%82%A4%E3%83%92&context=note&mode=search","article":false,"descRaw":"（奥-米・1897–1957）：オーストリアの精神分析家。性格の鎧（Character Armor）という概念で、抑圧された感情が筋肉の緊張として身体に蓄積すると説き、身体からの解放を重視した。オルゴン・エネルギー論へと進み、後のソマティック心理学や身体技法の源流となった。晩年は米国で活動し、1957年に没した。晩年のオルゴン研究は学界から異端視された。"},{"name":"ロベルト・アサジオリ","chapter":"c10-統合-実践-生化学-安全","sub":4,"subCount":11,"tags":["theory","religion","practice"],"birth":1888,"death":1974,"href":"https://note.com/varelser/n/nd2e2aec72a3b","article":true,"descRaw":"（伊・1888–1974）：イタリアの精神科医でサイコシンセシス（精神統合）の創始者。フロイトの無意識を下位だけでなく、創造性や霊性の源泉である「上位無意識」へと拡張し、人格の統合と自己実現を目指した。瞑想やイメージ療法を取り入れ、超個的心理学（トランスパーソナル心理学）の先駆とされる。瞑想やイメージを用いた技法は後の心理療法に受け継がれた。"},{"name":"解離の構造的モデル（ヴァン・デア・ハート, ナイエンハウス, スティール）","chapter":"c10-統合-実践-生化学-安全","sub":5,"subCount":11,"tags":["theory","clinical","science"],"birth":null,"death":null,"href":"https://note.com/search?q=from%3A%40varelser%20%E8%A7%A3%E9%9B%A2%E3%81%AE%E6%A7%8B%E9%80%A0%E7%9A%84%E3%83%A2%E3%83%87%E3%83%AB%EF%BC%88%E3%83%B4%E3%82%A1%E3%83%B3%E3%83%BB%E3%83%87%E3%82%A2%E3%83%BB%E3%83%8F%E3%83%BC%E3%83%88%2C%20%E3%83%8A%E3%82%A4%E3%82%A8%E3%83%B3%E3%83%8F%E3%82%A6%E3%82%B9%2C%20%E3%82%B9%E3%83%86%E3%82%A3%E3%83%BC%E3%83%AB%EF%BC%89&context=note&mode=search","article":false,"descRaw":"：オランダの臨床心理学者ヴァン・デア・ハートらによるトラウマ性解離の理論。2006年の著書『The Haunted Self』で、人格が「日常の部分」と「感情の部分」に構造的に解離すると定式化した。心的外傷後ストレス障害や解離性障害の臨床像を、変性意識と解離の連続性から体系化し、トラウマ治療の理論基盤となった。"},{"name":"スタンフォード催眠感受性尺度（ヒルガード, ワイツェンホッファー, 1962）","chapter":"c10-統合-実践-生化学-安全","sub":5,"subCount":11,"tags":["science","clinical","practice"],"birth":null,"death":null,"href":"https://note.com/search?q=from%3A%40varelser%20%E3%82%B9%E3%82%BF%E3%83%B3%E3%83%95%E3%82%A9%E3%83%BC%E3%83%89%E5%82%AC%E7%9C%A0%E6%84%9F%E5%8F%97%E6%80%A7%E5%B0%BA%E5%BA%A6%EF%BC%88%E3%83%92%E3%83%AB%E3%82%AC%E3%83%BC%E3%83%89%2C%20%E3%83%AF%E3%82%A4%E3%83%84%E3%82%A7%E3%83%B3%E3%83%9B%E3%83%83%E3%83%95%E3%82%A1%E3%83%BC%2C%201962%EF%BC%89&context=note&mode=search","article":false,"descRaw":"：アーネスト・ヒルガードとアンドレ・ワイツェンホッファーが開発した催眠反応性の標準的測定法。1959年のA・B版に続き1962年にC版が刊行され、12項目の暗示課題への反応を採点する。催眠感受性の個人差を定量化し、催眠研究の方法論的基盤を確立した。ハーバード集団尺度（1962年）と並ぶ代表的尺度である。"},{"name":"新解離理論（ヒルガード, 1977）","chapter":"c10-統合-実践-生化学-安全","sub":5,"subCount":11,"tags":["theory","science","practice"],"birth":null,"death":null,"href":"https://note.com/varelser/n/n59f43201bbbf","article":true,"descRaw":"：ヒルガードが1977年の著書『Divided Consciousness』で提唱した理論。催眠下では意識が複数の制御系に分かれ、痛みを感じない部分とは別に「隠れた観察者（hidden observer）」が痛みを記録しているとした。意識の並行処理と解離を統一的に説明する試みで、催眠・多重人格・自動書記などの現象を一つの枠組みで捉えた。"},{"name":"ホロトロピック・ブレスワーク（グロフ, 1988〜）","chapter":"c10-統合-実践-生化学-安全","sub":5,"subCount":11,"tags":["practice","clinical"],"birth":null,"death":null,"href":"https://note.com/varelser/n/n985d8536a68f","article":true,"descRaw":"：スタニスラフ・グロフが1988年頃から開発した非薬理的な変性意識誘導法。加速した呼吸、喚起的な音楽、ボディワークを組み合わせ、LSD精神療法の臨床経験を呼吸法へ転用した。周産期マトリクス（BPM）などの体験が現れるとされ、サイケデリックを用いない意識変容の技法としてワークショップで広く実践されている。"},{"name":"感覚遮断とアイソレーション・タンク（ジョン・リリー, 1954〜）","chapter":"c10-統合-実践-生化学-安全","sub":5,"subCount":11,"tags":["science","practice","tech"],"birth":null,"death":null,"href":"https://note.com/search?q=from%3A%40varelser%20%E6%84%9F%E8%A6%9A%E9%81%AE%E6%96%AD%E3%81%A8%E3%82%A2%E3%82%A4%E3%82%BD%E3%83%AC%E3%83%BC%E3%82%B7%E3%83%A7%E3%83%B3%E3%83%BB%E3%82%BF%E3%83%B3%E3%82%AF%EF%BC%88%E3%82%B8%E3%83%A7%E3%83%B3%E3%83%BB%E3%83%AA%E3%83%AA%E3%83%BC%2C%201954%E3%80%9C%EF%BC%89&context=note&mode=search","article":false,"descRaw":"：米国の神経科学者ジョン・リリーが1954年に開発した感覚遮断の研究法。遮音・遮光の塩水タンクに浮かぶことで外部刺激を遮断し、意識がどう変容するかを系統的に調べた。幻覚や自己感の変容が報告され、フローティング療法や制限環境刺激療法（REST）の科学的基礎となった。リリーは後にイルカ研究やケタミン実験でも知られる。"},{"name":"明晰夢研究（スティーヴン・ラバージ, 1980〜）","chapter":"c10-統合-実践-生化学-安全","sub":5,"subCount":11,"tags":["dream","science"],"birth":null,"death":null,"href":"https://note.com/search?q=from%3A%40varelser%20%E6%98%8E%E6%99%B0%E5%A4%A2%E7%A0%94%E7%A9%B6%EF%BC%88%E3%82%B9%E3%83%86%E3%82%A3%E3%83%BC%E3%83%B4%E3%83%B3%E3%83%BB%E3%83%A9%E3%83%90%E3%83%BC%E3%82%B8%2C%201980%E3%80%9C%EF%BC%89&context=note&mode=search","article":false,"descRaw":"：スタンフォード大学のスティーヴン・ラバージによる明晰夢の実験的研究。1980年の博士論文で、レム睡眠中に夢の中で「夢だと気づく」状態を、事前に取り決めた眼球運動シグナルで客観的に検証した。1981年の論文で成果を発表し、夢の中からの通信を実証した。MILD法などの誘導技法も開発し、1987年にルシディティ研究所を設立した。 出典：LaBerge et al. (1981)『Perceptual and Motor Skills』 DOI: 10.2466/pms.1981.52.3.727"},{"name":"臨死体験の尺度化（グレイソン, 1983）","chapter":"c10-統合-実践-生化学-安全","sub":5,"subCount":11,"tags":["science","clinical"],"birth":null,"death":null,"href":"https://note.com/search?q=from%3A%40varelser%20%E8%87%A8%E6%AD%BB%E4%BD%93%E9%A8%93%E3%81%AE%E5%B0%BA%E5%BA%A6%E5%8C%96%EF%BC%88%E3%82%B0%E3%83%AC%E3%82%A4%E3%82%BD%E3%83%B3%2C%201983%EF%BC%89&context=note&mode=search","article":false,"descRaw":"：精神科医ブルース・グレイソンが1983年に開発した臨死体験（NDE）の測定尺度。16項目からなり、認知的・感情的・超自然的・超越的の4要素で体験の深さを定量化する。臨死体験研究の標準ツールとして広く用いられ、体験の有無や強度を客観的に比較可能にした。グレイソンはバージニア大学で臨死体験の臨床研究を長年主導した。 出典：Greyson (1983)『The Journal of Nervous and Mental Disease』 DOI: 10.1097/00005053-198306000-00007"},{"name":"臨死体験の前向き研究（ファン・ロンメルら, 2001）","chapter":"c10-統合-実践-生化学-安全","sub":5,"subCount":11,"tags":["science","clinical"],"birth":null,"death":null,"href":"https://note.com/search?q=from%3A%40varelser%20%E8%87%A8%E6%AD%BB%E4%BD%93%E9%A8%93%E3%81%AE%E5%89%8D%E5%90%91%E3%81%8D%E7%A0%94%E7%A9%B6%EF%BC%88%E3%83%95%E3%82%A1%E3%83%B3%E3%83%BB%E3%83%AD%E3%83%B3%E3%83%A1%E3%83%AB%E3%82%89%2C%202001%EF%BC%89&context=note&mode=search","article":false,"descRaw":"：オランダの心臓専門医ピム・ファン・ロンメルらによる2001年の前向き研究（『The Lancet』）。オランダの10病院で心停止から蘇生した患者344名を追跡し、約18%が臨死体験を報告した。体験の有無を薬物・酸素不足・恐怖などの要因では説明できず、臨死体験を前向きコホート研究で検証した画期的論文となった。2年後・8年後の再調査でも報告は安定していた。 出典：van Lommel et al. (2001)『The Lancet』 DOI: 10.1016/S0140-6736(01)07100-8"},{"name":"LSDと精神療法（グロフ, 1975）","chapter":"c10-統合-実践-生化学-安全","sub":5,"subCount":11,"tags":["substance","clinical","theory"],"birth":null,"death":null,"href":"https://note.com/search?q=from%3A%40varelser%20LSD%E3%81%A8%E7%B2%BE%E7%A5%9E%E7%99%82%E6%B3%95%EF%BC%88%E3%82%B0%E3%83%AD%E3%83%95%2C%201975%EF%BC%89&context=note&mode=search","article":false,"descRaw":"：スタニスラフ・グロフの1975年の著書『Realms of the Human Unconscious』（邦題『LSDと精神療法』）。プラハと米国でのLSD精神療法の臨床記録をもとに、周産期マトリクス（BPM I〜IV）の理論を提唱した。出生過程の体験が深層心理と変性意識体験の構造を規定するとし、トランスパーソナル心理学の臨床的基盤を築いた。"},{"name":"レム睡眠","chapter":"c10-統合-実践-生化学-安全","sub":5,"subCount":11,"tags":["dream","science"],"birth":null,"death":null,"href":"https://note.com/search?q=from%3A%40varelser%20%E3%83%AC%E3%83%A0%E7%9D%A1%E7%9C%A0&context=note&mode=search","article":false,"descRaw":"：1953年にシカゴ大学のユージン・アセリンスキーとナサニエル・クライトマンが発見した睡眠段階。急速眼球運動を伴い、脳波は覚醒時に近く、夢の多くがこの段階で見られる。夢と脳活動の相関を示したことで夢研究の出発点となり、後の明晰夢研究や睡眠科学の基礎となった。レム睡眠の発見は、睡眠が単なる休息ではなく能動的な脳の状態であることを示した。"},{"name":"ジェームズ・ブレイド","chapter":"c10-統合-実践-生化学-安全","sub":6,"subCount":11,"tags":["practice","clinical","science"],"birth":1795,"death":1860,"href":"https://note.com/varelser/n/n6cdc6c2d46fd","article":true,"descRaw":"（英・1795–1860）：スコットランドの医師で、「催眠（hypnosis）」という用語の創始者。『Neurypnology』（1843）で、催眠を磁気流体ではなく神経系の状態として説明し、神経催眠学を打ち立てた。凝視による誘導や治療への応用を試み、近代催眠研究の出発点となった19世紀の先駆者である。催眠の語源はギリシャ語のヒュプノス（眠り）に由来する。"},{"name":"ミルトン・エリクソン","chapter":"c10-統合-実践-生化学-安全","sub":6,"subCount":11,"tags":["clinical","practice"],"birth":1901,"death":1980,"href":"https://note.com/search?q=from%3A%40varelser%20%E3%83%9F%E3%83%AB%E3%83%88%E3%83%B3%E3%83%BB%E3%82%A8%E3%83%AA%E3%82%AF%E3%82%BD%E3%83%B3&context=note&mode=search","article":false,"descRaw":"（Milton Erickson・1901–1980）：アメリカの精神科医で、20世紀最大の催眠療法家とされる。間接暗示や利用法（クライエントの抵抗そのものを治療に活かす技法）で、トランスを自然な日常の延長として扱った。エリクソニアン催眠は、言語と注意の操作による意識変容の臨床技法として広く継承されている。弟子のジェイ・ヘイリーらが、その技法を家族療法へと発展させた。"},{"name":"ウィリアム・デメント","chapter":"c10-統合-実践-生化学-安全","sub":6,"subCount":11,"tags":["dream","science"],"birth":1928,"death":2020,"href":"https://note.com/search?q=from%3A%40varelser%20%E3%82%A6%E3%82%A3%E3%83%AA%E3%82%A2%E3%83%A0%E3%83%BB%E3%83%87%E3%83%A1%E3%83%B3%E3%83%88&context=note&mode=search","article":false,"descRaw":"（William Dement・1928–2020）：アメリカの睡眠研究者で「睡眠医学の父」と呼ばれる。アセリンスキーらとともにREM睡眠の発見に関わり、スタンフォード大学に睡眠研究センターを築いた。睡眠時無呼吸の研究や啓蒙に尽力し、『The Promise of Sleep』（1999）で睡眠の科学を一般に広めた。スタンフォードの睡眠クリニックは、世界初の睡眠障害センターとなった。"},{"name":"アーネスト・ヒルガード","chapter":"c10-統合-実践-生化学-安全","sub":6,"subCount":11,"tags":["science","theory","practice"],"birth":1904,"death":2001,"href":"https://note.com/varelser/n/n2dc8b8fdafad","article":true,"descRaw":"（Ernest Hilgard・1904–2001・米）：アメリカの心理学者でスタンフォード大学教授。催眠の新解離理論を提唱し、催眠下でも痛みを記録する「隠れた観察者（Hidden Observer）」の実験で、意識が複数の層に分かれうることを実証した。催眠感受性の測定法の開発でも知られ、意識の多層性を実験心理学に持ち込んだ。学習心理学の教科書でも知られ、長くスタンフォードで教えた。"},{"name":"ジョン・C・リリー","chapter":"c10-統合-実践-生化学-安全","sub":6,"subCount":11,"tags":["tech","substance","science"],"birth":1915,"death":2001,"href":"https://note.com/varelser/n/ne343599d8208","article":true,"descRaw":"（John C. Lilly・1915–2001・米）：アメリカの神経科学者・医師。1954年に感覚遮断タンク（アイソレーション・タンク）を発明し、外界の刺激を断った状態での意識の変容を研究した。イルカのコミュニケーション研究や、ケタミン・LSDの自己実験でも知られる。『The Center of the Cyclone』（1972）が代表作。感覚遮断タンクは後に瞑想やリラクゼーションの道具としても広まった。"},{"name":"ミシェル・ジューヴェ","chapter":"c10-統合-実践-生化学-安全","sub":6,"subCount":11,"tags":["dream","science"],"birth":1925,"death":2017,"href":"https://note.com/search?q=from%3A%40varelser%20%E3%83%9F%E3%82%B7%E3%82%A7%E3%83%AB%E3%83%BB%E3%82%B8%E3%83%A5%E3%83%BC%E3%83%B4%E3%82%A7&context=note&mode=search","article":false,"descRaw":"（Michel Jouvet・1925–2017・仏）：フランスの睡眠研究者。1950年代末に猫の実験で、REM睡眠中の筋無力（アトニア）を発見し、覚醒でも徐波睡眠でもない「第三の状態」として逆説睡眠（paradoxical sleep）を定式化した。REM睡眠行動障害の最初のモデルも作り、夢を変性意識研究の中心テーマとして科学化した。夢の神経機構の解明は、後のREM睡眠研究の出発点となった。"},{"name":"マーク・ソームズ","chapter":"c10-統合-実践-生化学-安全","sub":6,"subCount":11,"tags":["dream","science","theory"],"birth":1961,"death":null,"href":"https://note.com/search?q=from%3A%40varelser%20%E3%83%9E%E3%83%BC%E3%82%AF%E3%83%BB%E3%82%BD%E3%83%BC%E3%83%A0%E3%82%BA&context=note&mode=search","article":false,"descRaw":"（Mark Solms・1961–・南ア）：南アフリカ生まれの神経心理学者で神経精神分析の中心人物。病巣研究や脳画像研究から、夢見はREM睡眠と同一ではなく、前脳の機構とも強く関わることを論証した。『The Hidden Spring』（2021）や2000年の論文で、夢をより広い意識生成の問題として再配置し、夢＝REMという単純な図式を崩した。"},{"name":"ユージン・アセリンスキー","chapter":"c10-統合-実践-生化学-安全","sub":6,"subCount":11,"tags":["dream","science"],"birth":1921,"death":1998,"href":"https://note.com/search?q=from%3A%40varelser%20%E3%83%A6%E3%83%BC%E3%82%B8%E3%83%B3%E3%83%BB%E3%82%A2%E3%82%BB%E3%83%AA%E3%83%B3%E3%82%B9%E3%82%AD%E3%83%BC&context=note&mode=search","article":false,"descRaw":"（1921–1998）：アメリカの生理学者。1953年に指導教官のクライトマンとともに、睡眠中の急速な眼球運動（REM睡眠）を発見し、夢の客観的研究の扉を開いた。シカゴ大学での研究は、夢を脳の活動として測れるものとし、現代の睡眠科学と夢研究の創始となった。REM睡眠の発見により、夢を実験室で客観的に捉える時代が開かれ、睡眠科学は大きく前進した。"},{"name":"ナサニエル・クライトマン","chapter":"c10-統合-実践-生化学-安全","sub":6,"subCount":11,"tags":["dream","science"],"birth":1895,"death":1999,"href":"https://note.com/search?q=from%3A%40varelser%20%E3%83%8A%E3%82%B5%E3%83%8B%E3%82%A8%E3%83%AB%E3%83%BB%E3%82%AF%E3%83%A9%E3%82%A4%E3%83%88%E3%83%9E%E3%83%B3&context=note&mode=search","article":false,"descRaw":"（1895–1999）：アメリカの生理学者で近代睡眠研究の父。『Sleep and Wakefulness』（1939）を著し、シカゴ大学に世界初の睡眠研究室を設けた。弟子のアセリンスキーとともにREM睡眠の発見を導いたその研究は、夢と意識の科学的探求の土台を築いた。睡眠の周期性を明らかにし、約90分周期の基礎を築いたことで知られる。"},{"name":"金縛り／睡眠麻痺","chapter":"c10-統合-実践-生化学-安全","sub":6,"subCount":11,"tags":["dream","culture"],"birth":null,"death":null,"href":"https://note.com/search?q=from%3A%40varelser%20%E9%87%91%E7%B8%9B%E3%82%8A%EF%BC%8F%E7%9D%A1%E7%9C%A0%E9%BA%BB%E7%97%BA&context=note&mode=search","article":false,"descRaw":"：目覚めの際にレム睡眠の筋無力だけが残り、身体が動かない状態。幻覚や胸の圧迫感を伴うことも多く、日本の「金縛り」として知られる。生涯有病率は約8%とされ、世界各地で老魔女や悪霊の仕業として語られてきた。睡眠と覚醒の境界で生じる、ありふれた変性意識の一形態である。文化によって、老魔女や悪霊、宇宙人など多様に解釈されてきた。"},{"name":"ナルコレプシー","chapter":"c10-統合-実践-生化学-安全","sub":6,"subCount":11,"tags":["dream","clinical","science"],"birth":null,"death":null,"href":"https://note.com/search?q=from%3A%40varelser%20%E3%83%8A%E3%83%AB%E3%82%B3%E3%83%AC%E3%83%97%E3%82%B7%E3%83%BC&context=note&mode=search","article":false,"descRaw":"：覚醒を保つオレキシン（ヒポクレチン）神経の欠損による睡眠障害。日中の強い眠気と、笑いなどの感情で誘発される脱力（カタプレキシー）が特徴で、入眠時幻覚や睡眠麻痺を伴うこともある。覚醒とレム睡眠の境界が崩れる病態は、意識の状態が脳の制御によっていかに保たれるかを示す。1型と2型があり、カタプレキシーを伴うものが1型とされる。"},{"name":"ベッセル・ヴァン・デア・コーク","chapter":"c10-統合-実践-生化学-安全","sub":7,"subCount":11,"tags":["clinical","practice","theory"],"birth":1943,"death":null,"href":"https://note.com/varelser/n/nf7b3abc01b81","article":true,"descRaw":"（Bessel van der Kolk・1943–）：オランダ生まれの精神科医。『身体はトラウマを記録する（The Body Keeps the Score）』（2014）で、トラウマが身体感覚や脳の警戒システムに刻まれることを論じた。ヨガやEMDR、演劇などの身体的アプローチを治療に取り入れ、トラウマと身体意識の関係を広く知らしめた。トラウマ治療の第一人者として、世界中で講演を行っている。"},{"name":"スティーブン・ポージェス","chapter":"c10-統合-実践-生化学-安全","sub":7,"subCount":11,"tags":["theory","science","clinical"],"birth":1945,"death":null,"href":"https://note.com/varelser/n/ne9121f6b231b","article":true,"descRaw":"（Stephen Porges・1945–）：アメリカの神経科学者。1994年にポリヴェーガル理論を提唱し、迷走神経の働きから安全・危険の神経知覚（ニューロセプション）や社会的関与のシステムを説明した。身体の状態が情動や対人関係、意識のあり方を規定するという視点は、トラウマ治療や身体技法に大きな影響を与えた。インディアナ大学などで教え、トラウマ治療の理論的支柱となった。"},{"name":"ピーター・レヴィン","chapter":"c10-統合-実践-生化学-安全","sub":7,"subCount":11,"tags":["clinical","practice"],"birth":1942,"death":null,"href":"https://note.com/varelser/n/nf8fd216c69bb","article":true,"descRaw":"（Peter Levine・1942–）：アメリカの心理学者でソマティック・エクスペリエンシングの創始者。動物が脅威の後に身体を震わせて緊張を解く様子に着目し、トラウマを身体感覚のレベルから解放する技法を開発した。『Waking the Tiger』（1997）で、身体に閉じ込められた反応を完了させる治療を説いた。野生動物の観察から着想を得た点が、その技法の特徴である。"},{"name":"ガボール・マテ","chapter":"c10-統合-実践-生化学-安全","sub":7,"subCount":11,"tags":["clinical","theory"],"birth":1944,"death":null,"href":"https://note.com/search?q=from%3A%40varelser%20%E3%82%AC%E3%83%9C%E3%83%BC%E3%83%AB%E3%83%BB%E3%83%9E%E3%83%86&context=note&mode=search","article":false,"descRaw":"（Gabor Maté，1944–）：ハンガリー生まれのカナダの医師。依存症を道徳的失敗ではなく、幼少期のトラウマや慢性ストレスに対する自己治療・痛みからの逃避として捉える立場を提唱した。『In the Realm of Hungry Ghosts』（2008）などの著作があり、学術的には論争もあるが、トラウマを重視する臨床の視点として読まれている。"},{"name":"中井久夫","chapter":"c10-統合-実践-生化学-安全","sub":7,"subCount":11,"tags":["clinical","theory"],"birth":1934,"death":2022,"href":"https://note.com/search?q=from%3A%40varelser%20%E4%B8%AD%E4%BA%95%E4%B9%85%E5%A4%AB&context=note&mode=search","article":false,"descRaw":"（1934–2022）：日本の精神科医。統合失調症の寛解過程論や風景構成法で知られ、病の経過を時間のなかで捉える臨床を展開した。阪神・淡路大震災（1995）後の「こころのケア」を主導し、PTSDの概念とケアを日本に広めた。『分裂病と人類』などの著作で精神医学と文化を結んだ。神戸大学で精神医学を講じ、災害精神医学の礎を築いた。"},{"name":"ソマティック・マーカー仮説（ダマシオ, 1994）","chapter":"c10-統合-実践-生化学-安全","sub":8,"subCount":11,"tags":["theory","science"],"birth":null,"death":null,"href":"https://note.com/search?q=from%3A%40varelser%20%E3%82%BD%E3%83%9E%E3%83%86%E3%82%A3%E3%83%83%E3%82%AF%E3%83%BB%E3%83%9E%E3%83%BC%E3%82%AB%E3%83%BC%E4%BB%AE%E8%AA%AC%EF%BC%88%E3%83%80%E3%83%9E%E3%82%B7%E3%82%AA%2C%201994%EF%BC%89&context=note&mode=search","article":false,"descRaw":"：アントニオ・ダマシオが1994年の著書『デカルトの誤り』で提唱した仮説。身体状態の信号（心拍・発汗・内臓感覚など）が選択肢に「良い・悪い」の印をつけ、意識的な熟慮の前に意思決定を方向づけるという。腹内側前頭前野を損傷した患者は知能が保たれながら日常生活の判断ができなくなることが根拠とされ、アイオワ・ギャンブリング課題で実証が試みられた。「感情とは身体の地図である」とする身体性認知の神経科学的な出発点である。"},{"name":"内受容感覚研究（クリッチリー & ガーフィンケル）","chapter":"c10-統合-実践-生化学-安全","sub":8,"subCount":11,"tags":["science","theory"],"birth":null,"death":null,"href":"https://note.com/search?q=from%3A%40varelser%20%E5%86%85%E5%8F%97%E5%AE%B9%E6%84%9F%E8%A6%9A%E7%A0%94%E7%A9%B6%EF%BC%88%E3%82%AF%E3%83%AA%E3%83%83%E3%83%81%E3%83%AA%E3%83%BC%20%26%20%E3%82%AC%E3%83%BC%E3%83%95%E3%82%A3%E3%83%B3%E3%82%B1%E3%83%AB%EF%BC%89&context=note&mode=search","article":false,"descRaw":"：心拍・呼吸・内臓感覚など体内信号の知覚が、感情・自己感・意識に与える影響を調べる研究。ヒュー・クリッチリーらは2004年に、心拍への注意が右前部島皮質を活性化し、その活動が心拍知覚の正確さと相関することを示した。サラ・ガーフィンケルらは2015年に、内受容感覚を「正確さ」「自己評価」「メタ認知的気づき」の三つの次元に分ける枠組みを提唱した。内受容感度の個人差は不安や変性意識体験のしやすさとも関連づけられる。 出典：Critchley et al. (2004)『Nature Neuroscience』 DOI: 10.1038/nn1176"},{"name":"ポリヴェーガル理論（ポージェス, 1994〜）","chapter":"c10-統合-実践-生化学-安全","sub":8,"subCount":11,"tags":["theory","science","clinical"],"birth":null,"death":null,"href":"https://note.com/varelser/n/n9e3c7122be3a","article":true,"descRaw":"：スティーヴン・ポージェスが1994年に提唱し、2011年の著書『The Polyvagal Theory』で体系化した理論。迷走神経を腹側複合体（哺乳類に特有の社会交流系）と背側複合体（古い不動化系）に分け、交感神経系と合わせた三層モデルで自律神経を記述する。安全が検知されれば腹側迷走神経が優位となり、危険では闘争・逃走、生命の脅威ではシャットダウンへ移行する。トラウマ治療や身体心理療法の理論的基盤として広く用いられる一方、解剖学的細部には批判もある。"},{"name":"アロスタシスと意識の再較正","chapter":"c10-統合-実践-生化学-安全","sub":8,"subCount":11,"tags":["theory","science","clinical"],"birth":null,"death":null,"href":"https://note.com/search?q=from%3A%40varelser%20%E3%82%A2%E3%83%AD%E3%82%B9%E3%82%BF%E3%82%B7%E3%82%B9%E3%81%A8%E6%84%8F%E8%AD%98%E3%81%AE%E5%86%8D%E8%BC%83%E6%AD%A3&context=note&mode=search","article":false,"descRaw":"：恒常性（ホメオスタシス）を超えた適応的調節の概念。ピーター・スターリングとジョセフ・エアーが1988年に提唱し、ブルース・マキューアンが「アロスタティック負荷」として展開した。環境変化を予測して血圧やホルモンなどを先回りで調整する仕組みで、慢性ストレスが続くと負荷が蓄積し、心身の不調や意識の質の変化を招く。変性意識は、アロスタティックな再較正――ストレスで固定化した調節パターンを緩め、再編する過程――として理解されることもある。"},{"name":"精神神経免疫学（PNI）と意識","chapter":"c10-統合-実践-生化学-安全","sub":8,"subCount":11,"tags":["science","clinical"],"birth":null,"death":null,"href":"https://note.com/search?q=from%3A%40varelser%20%E7%B2%BE%E7%A5%9E%E7%A5%9E%E7%B5%8C%E5%85%8D%E7%96%AB%E5%AD%A6%EF%BC%88PNI%EF%BC%89%E3%81%A8%E6%84%8F%E8%AD%98&context=note&mode=search","article":false,"descRaw":"：精神神経免疫学。脳・免疫系・内分泌系の相互作用を研究する分野で、ロバート・エイダーとニコラス・コーエンが1975年に条件づけによる免疫抑制を示したことが出発点となった。炎症性サイトカインは気分・認知・睡眠・意識状態に影響し、うつ病の炎症仮説や、瞑想・呼吸法の抗炎症効果の研究と結びつく。ストレスが免疫を介して意識を変え、逆に意識状態が免疫を変える双方向の経路として、身体と心の統合的な理解を支える。"},{"name":"腸脳相関と意識状態","chapter":"c10-統合-実践-生化学-安全","sub":8,"subCount":11,"tags":["science"],"birth":null,"death":null,"href":"https://note.com/search?q=from%3A%40varelser%20%E8%85%B8%E8%84%B3%E7%9B%B8%E9%96%A2%E3%81%A8%E6%84%8F%E8%AD%98%E7%8A%B6%E6%85%8B&context=note&mode=search","article":false,"descRaw":"：腸内細菌叢（マイクロバイオーム）が迷走神経・免疫系・代謝物を介して脳機能と意識に影響する経路。ジョン・クライアンとティモシー・ディナンらが「微生物叢-腸-脳軸」として体系化した。無菌マウスでは不安様行動や神経伝達物質が変わり、プロバイオティクスが気分に及ぶ可能性も報告される。断食や食事が意識状態を変える機序の一端としても注目され、腸を「第二の脳」とみる見方の科学的背景となっている。"},{"name":"呼吸の神経生理学と意識変容","chapter":"c10-統合-実践-生化学-安全","sub":8,"subCount":11,"tags":["practice","science"],"birth":null,"death":null,"href":"https://note.com/search?q=from%3A%40varelser%20%E5%91%BC%E5%90%B8%E3%81%AE%E7%A5%9E%E7%B5%8C%E7%94%9F%E7%90%86%E5%AD%A6%E3%81%A8%E6%84%8F%E8%AD%98%E5%A4%89%E5%AE%B9&context=note&mode=search","article":false,"descRaw":"：呼吸リズムが脳活動と意識に及ぼす影響。鼻呼吸は嗅球を介して辺縁系の振動を同調させ、ゼラーノら（2016）は鼻呼吸が恐怖刺激への反応や記憶を変えることを示した。呼吸中枢（プレベッツィンガー複合体）は覚醒や情動とも結びつき、意識的な呼吸法は自律神経を介して注意・感情を調整する。過呼吸がCO2低下と脳血流減少を招くことも含め、呼吸は最も直接的に意識を変えられる身体技法の神経基盤である。"},{"name":"ニューロセプション（ポージェス）","chapter":"c10-統合-実践-生化学-安全","sub":8,"subCount":11,"tags":["theory","science"],"birth":null,"death":null,"href":"https://note.com/search?q=from%3A%40varelser%20%E3%83%8B%E3%83%A5%E3%83%BC%E3%83%AD%E3%82%BB%E3%83%97%E3%82%B7%E3%83%A7%E3%83%B3%EF%BC%88%E3%83%9D%E3%83%BC%E3%82%B8%E3%82%A7%E3%82%B9%EF%BC%89&context=note&mode=search","article":false,"descRaw":"：スティーヴン・ポージェスがポリヴェーガル理論の中で提唱した概念。意識的な知覚や思考を介さず、神経系が環境の安全・危険を自動的に評価する過程を指す。顔の表情・声の調子・身体の構えなどの手がかりから、腹側迷走神経による社会交流か、交感神経による防衛か、背側迷走神経によるシャットダウンかが決まる。トラウマではニューロセプションが誤作動し、安全な場でも危険と感じるとされる。治療では安全の手がかりを整えることが重視される。"},{"name":"睡眠・覚醒調節と意識の連続体","chapter":"c10-統合-実践-生化学-安全","sub":8,"subCount":11,"tags":["dream","science"],"birth":null,"death":null,"href":"https://note.com/search?q=from%3A%40varelser%20%E7%9D%A1%E7%9C%A0%E3%83%BB%E8%A6%9A%E9%86%92%E8%AA%BF%E7%AF%80%E3%81%A8%E6%84%8F%E8%AD%98%E3%81%AE%E9%80%A3%E7%B6%9A%E4%BD%93&context=note&mode=search","article":false,"descRaw":"：覚醒・ノンレム睡眠・レム睡眠・明晰夢にわたる意識状態の連続的変化。その調節には、覚醒を促すオレキシン（ヒポクレチン）系、眠気を高めるアデノシン、概日リズムを刻む視交叉上核が関わる。オレキシンは1998年に発見され、欠損するとナルコレプシーを起こす。睡眠段階ごとに脳の結合様式と意識の内容が変わり、夢や明晰夢は覚醒に近い意識が睡眠中に現れる例として、意識の連続体モデルを支える。"},{"name":"共同調整（Co-regulation）と関係性の中の意識","chapter":"c10-統合-実践-生化学-安全","sub":8,"subCount":11,"tags":["clinical","theory"],"birth":null,"death":null,"href":"https://note.com/varelser/n/n6b3a9b11b519","article":true,"descRaw":"：養育者と乳児、治療者とクライエントなど、他者とのあいだで自律神経状態を相互に調整し合う過程。ポージェスらのポリヴェーガル理論では、安全な他者の存在が腹側迷走神経を介して相手の神経状態を落ち着かせるとされる。乳児の情動調節は養育者の抱っこや声かけによる共同調整から発達し、心理療法でも治療関係そのものが調整の場となる。意識状態は個人の脳内だけで完結せず、関係性のなかで共同的に形成されるという視点を与える。"},{"name":"リサ・フェルドマン・バレット","chapter":"c10-統合-実践-生化学-安全","sub":8,"subCount":11,"tags":["science","theory"],"birth":1963,"death":null,"href":"https://note.com/search?q=from%3A%40varelser%20%E3%83%AA%E3%82%B5%E3%83%BB%E3%83%95%E3%82%A7%E3%83%AB%E3%83%89%E3%83%9E%E3%83%B3%E3%83%BB%E3%83%90%E3%83%AC%E3%83%83%E3%83%88&context=note&mode=search","article":false,"descRaw":"（加・1963–）：カナダ出身の心理学者。ノースイースタン大学教授で、感情の「構築理論」を提唱する。感情は普遍的な実体ではなく、脳が内受容感覚などの身体信号を過去の経験と文化から得た概念で予測的に構成するものだとする。2017年の著書『How Emotions Are Made』で広く知られ、感情を身体予算の管理と結びつける視点は、変性意識における身体感覚と感情の関係を考える基盤となる。"},{"name":"ジョゼフ・ルドゥー","chapter":"c10-統合-実践-生化学-安全","sub":8,"subCount":11,"tags":["science","theory"],"birth":1949,"death":null,"href":"https://note.com/search?q=from%3A%40varelser%20%E3%82%B8%E3%83%A7%E3%82%BC%E3%83%95%E3%83%BB%E3%83%AB%E3%83%89%E3%82%A5%E3%83%BC&context=note&mode=search","article":false,"descRaw":"（米・1949–）：米国の神経科学者。ニューヨーク大学教授で、恐怖の神経回路の研究の第一人者。パブロフ型恐怖条件づけを用い、感覚情報が視床から扁桃体へ直接届く速い「低位の道」と、皮質を経る遅い「高位の道」を明らかにした。1996年の著書『The Emotional Brain』で知られ、2015年の『Anxious』では扁桃体は恐怖そのものではなく生存回路だとする立場へ転換し、感情と意識の区別を論じた。"},{"name":"5-HT2A受容体とサイケデリック作用機序","chapter":"c10-統合-実践-生化学-安全","sub":9,"subCount":11,"tags":["substance","science"],"birth":null,"death":null,"href":"https://note.com/search?q=from%3A%40varelser%205-HT2A%E5%8F%97%E5%AE%B9%E4%BD%93%E3%81%A8%E3%82%B5%E3%82%A4%E3%82%B1%E3%83%87%E3%83%AA%E3%83%83%E3%82%AF%E4%BD%9C%E7%94%A8%E6%A9%9F%E5%BA%8F&context=note&mode=search","article":false,"descRaw":"：古典的サイケデリクス（LSD、シロシビン、DMT）の主要な標的受容体。セロトニン5-HT2A受容体は前頭前野などの皮質第5層錐体ニューロンに豊富に存在し、作動薬が結合するとグルタミン酸放出を介して皮質の興奮性を高める。受容体を欠損させたマウスでは幻覚様反応が消失し、拮抗薬ケタンセリンでヒトのサイケデリクス体験が遮断されることから、知覚変容と自我溶解の起点とされる。DMNの脱同期や脳エントロピーの増大もこの受容体を介して生じる。"},{"name":"セロトニン系と意識状態の調節","chapter":"c10-統合-実践-生化学-安全","sub":9,"subCount":11,"tags":["science","substance"],"birth":null,"death":null,"href":"https://note.com/search?q=from%3A%40varelser%20%E3%82%BB%E3%83%AD%E3%83%88%E3%83%8B%E3%83%B3%E7%B3%BB%E3%81%A8%E6%84%8F%E8%AD%98%E7%8A%B6%E6%85%8B%E3%81%AE%E8%AA%BF%E7%AF%80&context=note&mode=search","article":false,"descRaw":"：脳幹の縫線核から全脳へ投射するセロトニン作動性神経系。覚醒・気分・食欲・睡眠・知覚の調節を担い、14種以上の受容体サブタイプを通じて多様な働きをする。セロトニンの放出パターンが変わると意識の質が変わり、サイケデリクスは5-HT2A受容体への作用で、MDMAはセロトニン放出促進で変性意識を誘発する。抗うつ薬SSRIもこの系を標的とし、気分と意識状態の神経化学的な結節点として、サイケデリック研究の中心的対象である。"},{"name":"NMDA受容体拮抗と解離（ケタミンの作用機序）","chapter":"c10-統合-実践-生化学-安全","sub":9,"subCount":11,"tags":["substance","science","clinical"],"birth":null,"death":null,"href":"https://note.com/search?q=from%3A%40varelser%20NMDA%E5%8F%97%E5%AE%B9%E4%BD%93%E6%8B%AE%E6%8A%97%E3%81%A8%E8%A7%A3%E9%9B%A2%EF%BC%88%E3%82%B1%E3%82%BF%E3%83%9F%E3%83%B3%E3%81%AE%E4%BD%9C%E7%94%A8%E6%A9%9F%E5%BA%8F%EF%BC%89&context=note&mode=search","article":false,"descRaw":"：グルタミン酸NMDA受容体の拮抗による解離と変性意識。麻酔薬ケタミンはNMDA受容体を遮断し、身体からの切り離し感や体外離脱感、時間感覚の変容を伴う解離状態を生む。低用量では数時間で現れる速効性の抗うつ作用も知られ、2019年にはエスケタミン（スプレー剤）が治療抵抗性うつ病薬として米国FDAに承認された。NMDA遮断によるグルタミン酸サージとBDNF放出が、抗うつ効果と可塑性亢進の機序とされる。"},{"name":"エンドカンナビノイド系と意識変容","chapter":"c10-統合-実践-生化学-安全","sub":9,"subCount":11,"tags":["science","substance","practice"],"birth":null,"death":null,"href":"https://note.com/search?q=from%3A%40varelser%20%E3%82%A8%E3%83%B3%E3%83%89%E3%82%AB%E3%83%B3%E3%83%8A%E3%83%93%E3%83%8E%E3%82%A4%E3%83%89%E7%B3%BB%E3%81%A8%E6%84%8F%E8%AD%98%E5%A4%89%E5%AE%B9&context=note&mode=search","article":false,"descRaw":"：体内で作られるカンナビノイド（アナンダミド、2-AG）とCB1・CB2受容体による神経調節系。アナンダミドは1992年に発見され、サンスクリット語の「アーナンダ（至福）」にちなんで名づけられた。食欲・痛み・気分・記憶の調節に関わり、ランナーズハイや瞑想時の内因性の高揚感との関連が論じられる。大麻の作用点でもあり、内因性カンナビノイドの変動が意識状態を穏やかに変容させる経路として研究されている。"},{"name":"神経可塑性とBDNF（脳由来神経栄養因子）","chapter":"c10-統合-実践-生化学-安全","sub":9,"subCount":11,"tags":["science","substance","clinical"],"birth":null,"death":null,"href":"https://note.com/search?q=from%3A%40varelser%20%E7%A5%9E%E7%B5%8C%E5%8F%AF%E5%A1%91%E6%80%A7%E3%81%A8BDNF%EF%BC%88%E8%84%B3%E7%94%B1%E6%9D%A5%E7%A5%9E%E7%B5%8C%E6%A0%84%E9%A4%8A%E5%9B%A0%E5%AD%90%EF%BC%89&context=note&mode=search","article":false,"descRaw":"：脳由来神経栄養因子（BDNF）とサイケデリクスによる神経可塑性の促進。BDNFは神経細胞の生存・成長・シナプス形成を支えるタンパク質で、TrkB受容体とmTOR経路を介して働く。ライら（2018）はシロシビン・LSD・DMTが樹状突起スパインの成長とシナプス新生を速やかに促すことを示し、モリナーら（2023）はサイケデリクスがBDNF受容体TrkBに直接結合することを報告した。うつ病などで低下した可塑性の回復が、サイケデリック療法の持続的効果の機序とされる。"},{"name":"DMTの内因性産生仮説","chapter":"c10-統合-実践-生化学-安全","sub":9,"subCount":11,"tags":["substance","science","dream"],"birth":null,"death":null,"href":"https://note.com/search?q=from%3A%40varelser%20DMT%E3%81%AE%E5%86%85%E5%9B%A0%E6%80%A7%E7%94%A3%E7%94%9F%E4%BB%AE%E8%AA%AC&context=note&mode=search","article":false,"descRaw":"：松果体などでDMT（ジメチルトリプタミン）が体内で作られる可能性をめぐる仮説。リック・ストラスマンが『DMT: The Spirit Molecule』（2001）で提唱し、臨死体験や夢、神秘体験における内因性サイケデリクスの役割を論じた。2019年にはラットの松果体から内因性DMTが検出されたとの報告もあるが、ヒトでの産生量や生理的意義は未解明で、仮説の域を出ない。松果体を「第三の目」とする神秘主義的解釈と混同されやすい点にも注意が要る。"},{"name":"GABAとグルタミン酸の興奮-抑制バランス","chapter":"c10-統合-実践-生化学-安全","sub":9,"subCount":11,"tags":["science","theory"],"birth":null,"death":null,"href":"https://note.com/search?q=from%3A%40varelser%20GABA%E3%81%A8%E3%82%B0%E3%83%AB%E3%82%BF%E3%83%9F%E3%83%B3%E9%85%B8%E3%81%AE%E8%88%88%E5%A5%AE-%E6%8A%91%E5%88%B6%E3%83%90%E3%83%A9%E3%83%B3%E3%82%B9&context=note&mode=search","article":false,"descRaw":"：脳の主たる抑制性伝達物質GABAと興奮性伝達物質グルタミン酸のバランス（E/Iバランス）と意識状態の関係。覚醒時は両者の動的な釣り合いの上に成り立ち、麻酔薬の多くはGABA作動性を高めるかグルタミン酸を抑えることで意識を落とす。てんかんでは興奮優位、瞑想ではバランスの再調整が報告される。サイケデリクスも5-HT2A受容体を介してグルタミン酸放出を高め、E/Iバランスを変動させる。意識レベルの神経化学的な基盤として広く研究される。"},{"name":"オピオイド系と恍惚体験","chapter":"c10-統合-実践-生化学-安全","sub":9,"subCount":11,"tags":["science","religion","practice"],"birth":null,"death":null,"href":"https://note.com/search?q=from%3A%40varelser%20%E3%82%AA%E3%83%94%E3%82%AA%E3%82%A4%E3%83%89%E7%B3%BB%E3%81%A8%E6%81%8D%E6%83%9A%E4%BD%93%E9%A8%93&context=note&mode=search","article":false,"descRaw":"：内因性オピオイド（βエンドルフィン、エンケファリンなど）と恍惚体験の関係。脳内報酬系や鎮痛系を担い、社会的結合・母子愛着・儀礼的苦行・ランナーズハイにおける高揚感に関与する。2008年のPET研究では、長時間走行後に脳のオピオイド受容体結合が変化し、ランナーズハイの神経基盤が示された。瞑想や集団儀礼での一体感にも内因性オピオイドの関与が論じられ、薬物によらない意識変容の化学的な一端を担う系である。"},{"name":"アマンダ・フィールディング","chapter":"c10-統合-実践-生化学-安全","sub":9,"subCount":11,"tags":["science","policy"],"birth":1943,"death":2025,"href":"https://note.com/search?q=from%3A%40varelser%20%E3%82%A2%E3%83%9E%E3%83%B3%E3%83%80%E3%83%BB%E3%83%95%E3%82%A3%E3%83%BC%E3%83%AB%E3%83%87%E3%82%A3%E3%83%B3%E3%82%B0&context=note&mode=search","article":false,"descRaw":"（英・1943–2025）：英国の薬物政策改革者・研究者。1998年にベックリー財団を設立し、サイケデリック研究がタブー視された時代に、インペリアル・カレッジ・ロンドンなどとの共同研究を主導した。2016年のLSD脳画像研究やシロシビンのうつ病治療試験など50本以上の共著論文に関わり、現代のサイケデリック・ルネサンスの立役者とされる。1970年に自ら穿頭術を行ったことでも知られ、2025年に死去した。"},{"name":"パラダイム理論と変性意識研究（クーン, 1962）","chapter":"c10-統合-実践-生化学-安全","sub":10,"subCount":11,"tags":["theory","science"],"birth":null,"death":null,"href":"https://note.com/search?q=from%3A%40varelser%20%E3%83%91%E3%83%A9%E3%83%80%E3%82%A4%E3%83%A0%E7%90%86%E8%AB%96%E3%81%A8%E5%A4%89%E6%80%A7%E6%84%8F%E8%AD%98%E7%A0%94%E7%A9%B6%EF%BC%88%E3%82%AF%E3%83%BC%E3%83%B3%2C%201962%EF%BC%89&context=note&mode=search","article":false,"descRaw":"：トーマス・クーンが1962年の著書『科学革命の構造』で提唱した科学論。通常科学は共有されたパラダイム（理論・方法・価値の枠組み）のなかでパズル解きを進め、説明できない変則（アノマリー）が蓄積すると危機を経て科学革命が起き、新パラダイムへ移行するとした。変性意識研究は、還元主義的な通常科学に統合される過程と、パラダイム間の不通約性の問題を抱え、科学哲学の視点から研究の位置を問う素材となる。"},{"name":"還元主義 vs. 全体論の論争と意識研究","chapter":"c10-統合-実践-生化学-安全","sub":10,"subCount":11,"tags":["theory","science"],"birth":null,"death":null,"href":"https://note.com/search?q=from%3A%40varelser%20%E9%82%84%E5%85%83%E4%B8%BB%E7%BE%A9%20vs.%20%E5%85%A8%E4%BD%93%E8%AB%96%E3%81%AE%E8%AB%96%E4%BA%89%E3%81%A8%E6%84%8F%E8%AD%98%E7%A0%94%E7%A9%B6&context=note&mode=search","article":false,"descRaw":"：意識体験を神経化学や神経活動に還元できるとする立場と、意識は全体の創発的性質で還元できないとする立場の対立。サイケデリクス研究では、5-HT2A受容体への作用という分子レベルの説明と、体験の意味や文脈を重視する説明が並存する。両者のあいだに方法論的多元主義――複数のレベルの説明を相補的に用いる立場――が提唱される。意識の「難しい問題」をめぐる科学哲学の中心的な論争である。"},{"name":"神秘化の危険と批判的合理主義","chapter":"c10-統合-実践-生化学-安全","sub":10,"subCount":11,"tags":["theory","science"],"birth":null,"death":null,"href":"https://note.com/search?q=from%3A%40varelser%20%E7%A5%9E%E7%A7%98%E5%8C%96%E3%81%AE%E5%8D%B1%E9%99%BA%E3%81%A8%E6%89%B9%E5%88%A4%E7%9A%84%E5%90%88%E7%90%86%E4%B8%BB%E7%BE%A9&context=note&mode=search","article":false,"descRaw":"：変性意識研究が安易な神秘主義や疑似科学に陥るリスクへの警鐘。カール・ポパーの反証可能性の基準にならい、検証可能な仮説と反証不能な主張を区別し、体験の主観的な真実味を客観的な証拠と混同しないことが求められる。神秘体験の実在感は強いが、それだけでは超自然的な実在を証明しない。批判的検証を保ちつつ、体験の豊かさを損なわない方法論が課題となる。"},{"name":"病理化の危険と正常-異常の境界","chapter":"c10-統合-実践-生化学-安全","sub":10,"subCount":11,"tags":["theory","clinical"],"birth":null,"death":null,"href":"https://note.com/search?q=from%3A%40varelser%20%E7%97%85%E7%90%86%E5%8C%96%E3%81%AE%E5%8D%B1%E9%99%BA%E3%81%A8%E6%AD%A3%E5%B8%B8-%E7%95%B0%E5%B8%B8%E3%81%AE%E5%A2%83%E7%95%8C&context=note&mode=search","article":false,"descRaw":"：変性意識体験を精神病理に還元する医学的パラダイムへの批判。幻覚・自我溶解・離人感は、統合失調症や解離性障害の症状と重なるが、文脈や本人の評価によっては成長や治癒の体験ともなる。文化的文脈と体験者の主観的評価を尊重し、正常と異常の境界を固定的に引かないことが求められる。トランスパーソナル心理学や文化精神医学が、この境界の再考を促してきた。"},{"name":"文化的偏りと西洋中心主義批判","chapter":"c10-統合-実践-生化学-安全","sub":10,"subCount":11,"tags":["theory","culture","science"],"birth":null,"death":null,"href":"https://note.com/search?q=from%3A%40varelser%20%E6%96%87%E5%8C%96%E7%9A%84%E5%81%8F%E3%82%8A%E3%81%A8%E8%A5%BF%E6%B4%8B%E4%B8%AD%E5%BF%83%E4%B8%BB%E7%BE%A9%E6%89%B9%E5%88%A4&context=note&mode=search","article":false,"descRaw":"：変性意識研究がWEIRD（西洋的・教育のある・工業化・裕福・民主的）集団に偏っている問題。ヘンリックら（2010）は心理学研究の被験者の大半がWEIRD集団であり、知見の普遍性に疑問を投げかけた。先住民の儀礼や非西洋の瞑想伝統を「原始的」とみなす西洋中心主義的な枠組みも批判される。多文化的な研究と、先住民の知への敬意ある協働が求められている。"},{"name":"倫理的問題と研究倫理","chapter":"c10-統合-実践-生化学-安全","sub":10,"subCount":11,"tags":["policy","theory","clinical"],"birth":null,"death":null,"href":"https://note.com/search?q=from%3A%40varelser%20%E5%80%AB%E7%90%86%E7%9A%84%E5%95%8F%E9%A1%8C%E3%81%A8%E7%A0%94%E7%A9%B6%E5%80%AB%E7%90%86&context=note&mode=search","article":false,"descRaw":"：サイケデリック研究におけるインフォームド・コンセント、脆弱な被験者の保護、文化的搾取の防止などの倫理的課題。変性意識下では判断力が低下するため、同意の取り方やセッション中の境界管理に特別な配慮が要る。先住民の植物薬の知識を商業利用する際の利益還元や、セラピストによる権力濫用の問題も論じられる。研究と実践の倫理的境界を明確にすることが、分野の信頼性の基盤となる。"},{"name":"「意識拡張」概念への批判","chapter":"c10-統合-実践-生化学-安全","sub":10,"subCount":11,"tags":["theory"],"birth":null,"death":null,"href":"https://note.com/search?q=from%3A%40varelser%20%E3%80%8C%E6%84%8F%E8%AD%98%E6%8B%A1%E5%BC%B5%E3%80%8D%E6%A6%82%E5%BF%B5%E3%81%B8%E3%81%AE%E6%89%B9%E5%88%A4&context=note&mode=search","article":false,"descRaw":"：「拡張」「高次」「深い」といった評価的な語彙が、変性意識を通常意識より優れたものとして暗に位置づける前提への批判。記述的な中立性を保たず、規範的な判断が紛れ込むと、体験の階層化やスピリチュアルな優越感を生む。マズローの至高体験論などにも向けられた批判で、意識状態の多様性を価値判断なしに記述することの重要性を説く。言葉の選び方が研究の枠組みを規定するという方法論的な注意である。"},{"name":"商業化と権力の問題","chapter":"c10-統合-実践-生化学-安全","sub":10,"subCount":11,"tags":["theory","culture"],"birth":null,"death":null,"href":"https://note.com/search?q=from%3A%40varelser%20%E5%95%86%E6%A5%AD%E5%8C%96%E3%81%A8%E6%A8%A9%E5%8A%9B%E3%81%AE%E5%95%8F%E9%A1%8C&context=note&mode=search","article":false,"descRaw":"：サイケデリック・ルネサンスの商業化と、マインドフルネスの産業化がもたらす構造的問題。ベンチャー企業の参入・特許取得・高額なセラピー料金は、アクセスの不平等や、先住民の知の商品化を招く。瞑想が生産性向上の技術として売られる「マクマインドフルネス」批判もその一例である。変性意識の実践が市場化されるなかで、誰が利益を得て、誰が排除されるのかを問う視点である。"},{"name":"マーシャル・マクルーハン","chapter":"c14-意識の未来","sub":0,"subCount":3,"tags":["theory","tech"],"birth":1911,"death":1980,"href":"https://note.com/search?q=from%3A%40varelser%20%E3%83%9E%E3%83%BC%E3%82%B7%E3%83%A3%E3%83%AB%E3%83%BB%E3%83%9E%E3%82%AF%E3%83%AB%E3%83%BC%E3%83%8F%E3%83%B3&context=note&mode=search","article":false,"descRaw":"（加・1911–1980）：1911–1980。カナダのメディア論者。主著『メディア論』（1964）で「メディアはメッセージである」と説き、メディア環境が知覚と意識を構造的に変容させると論じた。印刷術が視覚優位の意識を生み、電子メディアが「地球村」をもたらすという歴史観を提示した。『グーテンベルクの銀河系』（1962）と並ぶその理論は、テクノロジーと意識の関係を問う出発点となった。"},{"name":"ティモシー・リアリー（後期）","chapter":"c14-意識の未来","sub":0,"subCount":3,"tags":["tech","substance","theory"],"birth":1920,"death":1996,"href":"https://note.com/varelser/n/nd17e1eef0445","article":true,"descRaw":"（米・1920–1996）：アメリカの心理学者。1960年代のLSD研究で知られるが、1980年代以降はコンピュータ・VR・ネットワークを意識変容の新たなツールと捉える「サイバーデリック」思想を展開した。SMI²LE（宇宙移住・知能増強・寿命延長）を掲げ、デジタル技術による意識の拡張を構想した。薬物から情報技術への転換は、サイケデリック文化とサイバーカルチャーの接点を示す。"},{"name":"テレンス・マッケナ（後期）","chapter":"c14-意識の未来","sub":0,"subCount":3,"tags":["tech","theory","substance"],"birth":1946,"death":2000,"href":"https://note.com/varelser/n/ncee1476f7552","article":true,"descRaw":"（米・1946–2000）：アメリカの民族植物学者・思想家。サイケデリック体験の理論家として知られるが、後期はアーケイック・リバイバル（古代的な意識への回帰）とサイバーカルチャーの交差を論じた。主著『Food of the Gods』（1992）で植物と人類の意識進化の関係を論じ、言語・VR・意識の関係性を探究した。テクノロジーが古代のシャーマニズム的意識を呼び戻すという視点を示した。"},{"name":"ジャロン・ラニアー","chapter":"c14-意識の未来","sub":0,"subCount":3,"tags":["tech","science"],"birth":1960,"death":null,"href":"https://note.com/search?q=from%3A%40varelser%20%E3%82%B8%E3%83%A3%E3%83%AD%E3%83%B3%E3%83%BB%E3%83%A9%E3%83%8B%E3%82%A2%E3%83%BC&context=note&mode=search","article":false,"descRaw":"（米・1960–）：1960年生まれ。アメリカの計算機科学者・作家で、「バーチャル・リアリティ」という言葉の普及者。1985年にVPL Researchを創業し、データグローブなどの初期VR機器を開発した。VR体験における身体感覚の変容と知覚のリマッピングを論じ、身体イメージの可塑性を示す「ホムンクルス柔軟性」の概念で知られる。著書『You Are Not a Gadget』（2010）でテクノロジーと人間の関係を問い続ける。"},{"name":"ロイ・アスコット","chapter":"c14-意識の未来","sub":0,"subCount":3,"tags":["art","tech","religion"],"birth":1934,"death":null,"href":"https://note.com/varelser/n/n82377989ea8a","article":true,"descRaw":"（英・1934–）：1934年生まれ。イギリスのアーティスト・理論家で、テレマティック・アートの先駆者。ネットワーク技術とテレプレゼンスを用い、地理的に離れた参加者が一つの作品と意識を共有する実践を展開した。サイバネティクスとシャーマニズムを統合する視点で知られ、意識の分散・拡張を芸術の主題とした。コンピュータ・ネットワークを霊的な接続の媒体と捉える議論は、テクノロジーと神秘思想の接点を示す。"},{"name":"ブライオン・ガイシン","chapter":"c14-意識の未来","sub":0,"subCount":3,"tags":["art","tech","practice"],"birth":1916,"death":1986,"href":"https://note.com/varelser/n/n4f081eb6300f","article":true,"descRaw":"（Brion Gysin・1916–1986・英-仏系）：1916–1986。カナダ生まれの詩人・画家・パフォーマー。ウィリアム・バロウズとともにカットアップ技法を発展させ、言語の線形性を切断する実験を行った。主著に『The Third Mind』（バロウズとの共作、1978）。イアン・ソマーヴィルとともにDreamachine（1961）を開発し、閉眼下で光刺激によりヴィジョンを誘発する装置を作った。手法と装置の両面から知覚改変を実践した。"},{"name":"イアン・ソマーヴィル","chapter":"c14-意識の未来","sub":0,"subCount":3,"tags":["tech","art"],"birth":1940,"death":1976,"href":"https://note.com/varelser/n/n1fa30fc194f5","article":true,"descRaw":"（Ian Sommerville・1940–1976・英）：1940–1976。イギリスの技術者・プログラマ。ブライオン・ガイシンとともにDreamachineを設計し、回転する円筒のスリットから漏れる光刺激で閉眼下に幾何学的なヴィジョンを誘発する装置を実装した。ランダム・シーケンス生成などでカットアップ実験にも関与した。変性意識を神秘主義や薬理だけでなく、工学的に再現・誘発しうる現象として扱う先駆例を作った。"},{"name":"機械意識","chapter":"c14-意識の未来","sub":0,"subCount":3,"tags":["theory","tech","science"],"birth":null,"death":null,"href":"https://note.com/search?q=from%3A%40varelser%20%E6%A9%9F%E6%A2%B0%E6%84%8F%E8%AD%98&context=note&mode=search","article":false,"descRaw":"：人工システムが主観的体験（クオリア）をもちうるかという問いと、その検証法を扱う研究分野。意識理論をAIに応用し、統合情報理論やグローバル・ワークスペース理論などの枠組みから機械の意識の可能性を評価する。チューリング・テストを超える検証指標の探求や、AIの道徳的地位をめぐる議論とも結びつく。心と機械の境界を問う、テクノロジーと意識論の交差点である。"},{"name":"生成AIと意識","chapter":"c14-意識の未来","sub":0,"subCount":3,"tags":["theory","tech","science"],"birth":null,"death":null,"href":"https://note.com/search?q=from%3A%40varelser%20%E7%94%9F%E6%88%90AI%E3%81%A8%E6%84%8F%E8%AD%98&context=note&mode=search","article":false,"descRaw":"：大規模言語モデルなど生成AIが意識をもちうるかを、意識理論から導いた指標で評価する議論。Butlin & Longら（2023）の論文は、統合情報理論やグローバル・ワークスペース理論などから意識の指標群を抽出し、現行のAIシステムに当てはめて検討した。意識の有無をめぐる哲学的問いが、具体的な技術評価の問題として現れた事例で、AI倫理と意識科学の接点となっている。"},{"name":"ブレイン・コンピュータ・インターフェース","chapter":"c14-意識の未来","sub":0,"subCount":3,"tags":["tech","science","clinical"],"birth":null,"death":null,"href":"https://note.com/search?q=from%3A%40varelser%20%E3%83%96%E3%83%AC%E3%82%A4%E3%83%B3%E3%83%BB%E3%82%B3%E3%83%B3%E3%83%94%E3%83%A5%E3%83%BC%E3%82%BF%E3%83%BB%E3%82%A4%E3%83%B3%E3%82%BF%E3%83%BC%E3%83%95%E3%82%A7%E3%83%BC%E3%82%B9&context=note&mode=search","article":false,"descRaw":"：脳信号で外部機器を直接操作する技術。1973年にジャック・ヴィダルが用語を提唱し、1998年に初のヒトへの埋め込み、2004年にはBrainGateが臨床試験を開始した。運動機能を失った人の意思伝達や義肢操作を可能にし、脳と機械の直接接続による意識の拡張を示す。神経信号の解読が進むなかで、自己と身体の境界をめぐる議論も呼んでいる。"},{"name":"スーザン・シュナイダー","chapter":"c14-意識の未来","sub":0,"subCount":3,"tags":["theory","tech"],"birth":1968,"death":null,"href":"https://note.com/search?q=from%3A%40varelser%20%E3%82%B9%E3%83%BC%E3%82%B6%E3%83%B3%E3%83%BB%E3%82%B7%E3%83%A5%E3%83%8A%E3%82%A4%E3%83%80%E3%83%BC&context=note&mode=search","article":false,"descRaw":"（Susan Schneider・1968–）：1968年生まれ。アメリカの哲学者・認知科学者。著書『Artificial You』（2019）で、AIが意識をもちうるかという問いと、脳のニューロンを人工物で徐々に置換する思考実験が自己に与える影響を論じた。意識の本質とテクノロジーによる自己の変容を結びつける議論で、機械意識論の哲学的基盤を提示した。AI時代の心の哲学における主要な論者の一人である。"},{"name":"ニック・ボストロム","chapter":"c14-意識の未来","sub":0,"subCount":3,"tags":["theory","tech"],"birth":1973,"death":null,"href":"https://note.com/search?q=from%3A%40varelser%20%E3%83%8B%E3%83%83%E3%82%AF%E3%83%BB%E3%83%9C%E3%82%B9%E3%83%88%E3%83%AD%E3%83%A0&context=note&mode=search","article":false,"descRaw":"（1973–）：1973年生まれ。スウェーデンの哲学者。主著『Superintelligence』（2014）で超知能AIのリスクと制御問題を論じ、AIの安全性議論を牽引した。2003年のシミュレーション仮説では、私たちの現実が高度な文明によるシミュレーションである可能性を論じ、意識の現実性を問うた。オックスフォード大学のフューチャー・オブ・ヒューマニティ研究所の設立者として知られる。"},{"name":"レイ・カーツワイル","chapter":"c14-意識の未来","sub":0,"subCount":3,"tags":["tech","theory"],"birth":1948,"death":null,"href":"https://note.com/search?q=from%3A%40varelser%20%E3%83%AC%E3%82%A4%E3%83%BB%E3%82%AB%E3%83%BC%E3%83%84%E3%83%AF%E3%82%A4%E3%83%AB&context=note&mode=search","article":false,"descRaw":"（1948–）：1948年生まれ。アメリカの発明家・未来学者。主著『The Singularity Is Near』（2005）で、技術進歩の加速により2045年頃に技術的特異点が訪れ、意識の機械へのアップロードが可能になると予見した。音声認識や電子キーボードなどの発明でも知られる。脳のデジタル化と不死の展望をめぐる議論は、テクノロジーと意識の未来像の代表例となっている。"},{"name":"ウィリアム・ギブスン","chapter":"c14-意識の未来","sub":0,"subCount":3,"tags":["tech","art","culture"],"birth":1948,"death":null,"href":"https://note.com/search?q=from%3A%40varelser%20%E3%82%A6%E3%82%A3%E3%83%AA%E3%82%A2%E3%83%A0%E3%83%BB%E3%82%AE%E3%83%96%E3%82%B9%E3%83%B3&context=note&mode=search","article":false,"descRaw":"（米・1948–）：1948年生まれのアメリカのSF作家。短篇「クローム襲撃」（1982）で「サイバースペース」の語を生み、初長篇『ニューロマンサー』（1984）で電脳空間に没入するカウボーイたちの世界を描き、ヒューゴー賞・ネビュラ賞・フィリップ・K・ディック賞を受賞した。サイバーパンクの確立者として、ネットワーク化された意識と身体の未来像を提示し、『マトリックス』をはじめとする映像・テクノロジー文化に決定的な影響を与えた。"},{"name":"ニール・スティーヴンスン","chapter":"c14-意識の未来","sub":0,"subCount":3,"tags":["tech","art"],"birth":1959,"death":null,"href":"https://note.com/search?q=from%3A%40varelser%20%E3%83%8B%E3%83%BC%E3%83%AB%E3%83%BB%E3%82%B9%E3%83%86%E3%82%A3%E3%83%BC%E3%83%B4%E3%83%B3%E3%82%B9%E3%83%B3&context=note&mode=search","article":false,"descRaw":"（米・1959–）：1959年生まれのアメリカのSF作家。『スノウ・クラッシュ』（1992）で「メタバース」の語を生み、アバターとなって仮想空間を行き来する人々の社会を描いた。仮想空間における経済・言語・身体のあり方を先取りし、後のVR・メタバース開発の想像力の源泉となった。技術と社会の未来を長篇小説で構想し続ける、ポストサイバーパンクの代表的作家である。"},{"name":"アンディ・クラーク","chapter":"c14-意識の未来","sub":0,"subCount":3,"tags":["theory","tech","science"],"birth":1957,"death":null,"href":"https://note.com/search?q=from%3A%40varelser%20%E3%82%A2%E3%83%B3%E3%83%87%E3%82%A3%E3%83%BB%E3%82%AF%E3%83%A9%E3%83%BC%E3%82%AF&context=note&mode=search","article":false,"descRaw":"（英・1957–）：1957年生まれのイギリスの哲学者・認知科学者。デイヴィッド・チャーマーズとの共著論文「拡張された心」（1998）で、心は脳内に閉じずノートや道具などの外部リソースへ拡張するという拡張心仮説を提唱した。著書『Natural-Born Cyborgs』（2003）では人間を「生まれながらのサイボーグ」と位置づけ、技術との融合による意識と自己の拡張を論じた。身体化認知と予測的処理の研究でも知られる。"},{"name":"ドナルド・ホフマン","chapter":"c14-意識の未来","sub":0,"subCount":3,"tags":["theory","science"],"birth":1955,"death":null,"href":"https://note.com/search?q=from%3A%40varelser%20%E3%83%89%E3%83%8A%E3%83%AB%E3%83%89%E3%83%BB%E3%83%9B%E3%83%95%E3%83%9E%E3%83%B3&context=note&mode=search","article":false,"descRaw":"（米・1955–）：1955年生まれのアメリカの認知科学者（カリフォルニア大学アーバイン校）。知覚のインターフェース理論を提唱し、知覚は現実を写すのではなく、自然選択によって形づくられた種固有のユーザインターフェースだと論じた。時空や物理的対象をアイコンにたとえ、意識こそが根本的実在だとする「意識的実在論」を展開した。著書『The Case Against Reality』（2019）で知られる。"},{"name":"マーヴィン・ミンスキー","chapter":"c14-意識の未来","sub":0,"subCount":3,"tags":["science","tech","theory"],"birth":1927,"death":2016,"href":"https://note.com/search?q=from%3A%40varelser%20%E3%83%9E%E3%83%BC%E3%83%B4%E3%82%A3%E3%83%B3%E3%83%BB%E3%83%9F%E3%83%B3%E3%82%B9%E3%82%AD%E3%83%BC&context=note&mode=search","article":false,"descRaw":"（米・1927–2016）：1927–2016。アメリカの計算機科学者で「人工知能の父」と呼ばれる。1956年のダートマス会議に参加し、1959年にMIT人工知能プロジェクトを共同設立した。著書『The Society of Mind』（1986）では、心は知性をもたない多数の小さなエージェントの協調から生まれると説き、自己を単一の実体ではなく過程の束として捉えた。心の機械的モデルの先駆者である。"},{"name":"ダグラス・ホフスタッター","chapter":"c14-意識の未来","sub":0,"subCount":3,"tags":["theory","science","art"],"birth":1945,"death":null,"href":"https://note.com/search?q=from%3A%40varelser%20%E3%83%80%E3%82%B0%E3%83%A9%E3%82%B9%E3%83%BB%E3%83%9B%E3%83%95%E3%82%B9%E3%82%BF%E3%83%83%E3%82%BF%E3%83%BC&context=note&mode=search","article":false,"descRaw":"（米・1945–）：1945年生まれのアメリカの認知科学者。著書『ゲーデル、エッシャー、バッハ』（1979）で、ゲーデルの不完全性定理、エッシャーの版画、バッハのフーガに通底する自己言及の構造を描き、ピュリツァー賞を受賞した。階層をめぐって出発点に戻る「ストレンジ・ループ」こそが「私」という感覚の核だとする意識論を展開し、『I Am a Strange Loop』（2007）で深化させた。"},{"name":"モートン・ハイリグ","chapter":"c14-意識の未来","sub":0,"subCount":3,"tags":["tech","art"],"birth":1926,"death":1997,"href":"https://note.com/search?q=from%3A%40varelser%20%E3%83%A2%E3%83%BC%E3%83%88%E3%83%B3%E3%83%BB%E3%83%8F%E3%82%A4%E3%83%AA%E3%82%B0&context=note&mode=search","article":false,"descRaw":"（米・1926–1997）：1926–1997。アメリカの映画撮影技師・発明家で、VRの先駆者。1955年の論文「The Cinema of the Future」で五感を刺激する「体験劇場」を構想し、1962年に立体映像・音響・振動・風・香りを組み合わせた多感覚装置センソラマを特許取得した。頭部装着型の立体テレビ「テレスフィア・マスク」（1960年特許）も設計し、映像による没入体験の技術的起源を作った。"},{"name":"アイヴァン・サザーランド","chapter":"c14-意識の未来","sub":0,"subCount":3,"tags":["tech","science"],"birth":1938,"death":null,"href":"https://note.com/search?q=from%3A%40varelser%20%E3%82%A2%E3%82%A4%E3%83%B4%E3%82%A1%E3%83%B3%E3%83%BB%E3%82%B5%E3%82%B6%E3%83%BC%E3%83%A9%E3%83%B3%E3%83%89&context=note&mode=search","article":false,"descRaw":"（米・1938–）：1938年生まれのアメリカの計算機科学者で、コンピュータグラフィックスとVRの先駆者。1963年のスケッチパッドで図形の直接操作を実現し、GUIの起源を作った。1965年の論文「究極のディスプレイ」で計算機が生成する仮想世界への没入を構想し、1968年に学生ボブ・スプロールと初のヘッドマウントディスプレイ「ダモクレスの剣」を製作した。頭部の動きに同期して更新される立体視の世界は、現代VRの原型である。"},{"name":"ハワード・ラインゴールド","chapter":"c14-意識の未来","sub":0,"subCount":3,"tags":["tech","culture"],"birth":1947,"death":null,"href":"https://note.com/search?q=from%3A%40varelser%20%E3%83%8F%E3%83%AF%E3%83%BC%E3%83%89%E3%83%BB%E3%83%A9%E3%82%A4%E3%83%B3%E3%82%B4%E3%83%BC%E3%83%AB%E3%83%89&context=note&mode=search","article":false,"descRaw":"（米・1947–）：1947年生まれのアメリカの作家・評論家。初期のオンラインコミュニティWELLへの参加をもとに『バーチャル・コミュニティ』（1993）を著し、「仮想共同体」の語を広めた。『バーチャル・リアリティ』（1991）は一般読者向けのVR解説の先駆で、洞窟壁画からサイバースペースまで人工体験の歴史をたどった。ネットワーク上の社会関係と意識の変容を早くから論じた、サイバーカルチャーの記録者である。"},{"name":"エリック・デイヴィス","chapter":"c14-意識の未来","sub":0,"subCount":3,"tags":["tech","religion","culture"],"birth":1967,"death":null,"href":"https://note.com/search?q=from%3A%40varelser%20%E3%82%A8%E3%83%AA%E3%83%83%E3%82%AF%E3%83%BB%E3%83%87%E3%82%A4%E3%83%B4%E3%82%A3%E3%82%B9&context=note&mode=search","article":false,"descRaw":"（米・1967–）：1967年生まれのアメリカの作家・文化批評家。著書『TechGnosis』（1998）で、印刷機から電信・ラジオ・インターネットに至る通信技術の歴史に、グノーシス主義的な神秘衝動が一貫して流れていると論じた。テクノロジーの背後にある超越への欲望、VRとグノーシス神話、プログラミング言語とカバラの結びつきなどを描き、情報技術と宗教的想像力の交差を読み解く「テクノグノーシス」の視点を提示した。"},{"name":"マイケル・パースィンガー","chapter":"c14-意識の未来","sub":0,"subCount":3,"tags":["science","religion","tech"],"birth":1945,"death":2018,"href":"https://note.com/search?q=from%3A%40varelser%20%E3%83%9E%E3%82%A4%E3%82%B1%E3%83%AB%E3%83%BB%E3%83%91%E3%83%BC%E3%82%B9%E3%82%A3%E3%83%B3%E3%82%AC%E3%83%BC&context=note&mode=search","article":false,"descRaw":"（加・1945–2018）：1945–2018。カナダ・ローレンシャン大学の心理学者。神秘体験や宗教体験の神経基盤は側頭葉にあるとする仮説を提唱し、微弱な磁場で側頭葉を刺激する「ゴッドヘルメット」（コーレン・ヘルメット）で「何者かの存在感」や体外離脱感が誘発されると報告した。神経神学の代表的実験として注目されたが、二重盲検試験での再現性をめぐる論争もあり、暗示効果の指摘も受けている。"},{"name":"ピエール・レヴィ","chapter":"c14-意識の未来","sub":0,"subCount":3,"tags":["theory","tech","culture"],"birth":1956,"death":null,"href":"https://note.com/search?q=from%3A%40varelser%20%E3%83%94%E3%82%A8%E3%83%BC%E3%83%AB%E3%83%BB%E3%83%AC%E3%83%B4%E3%82%A3&context=note&mode=search","article":false,"descRaw":"（仏・1956–）：1956年チュニジア生まれのフランスの哲学者・メディア理論家。著書『L'intelligence collective』（1994）で、ネットワーク上で人々の知が結びつく「集合的知性」の概念を提唱した。欧州評議会への報告書『Cyberculture』（1997、英訳2001）では、サイバースペースの成長を技術的出来事ではなく文化的出来事として捉え、仮想化と集合知による意識と社会の変容を論じた。"},{"name":"シャノン情報理論と意識のエントロピー","chapter":"c14-意識の未来","sub":1,"subCount":3,"tags":["theory","science"],"birth":null,"death":null,"href":"https://note.com/search?q=from%3A%40varelser%20%E3%82%B7%E3%83%A3%E3%83%8E%E3%83%B3%E6%83%85%E5%A0%B1%E7%90%86%E8%AB%96%E3%81%A8%E6%84%8F%E8%AD%98%E3%81%AE%E3%82%A8%E3%83%B3%E3%83%88%E3%83%AD%E3%83%94%E3%83%BC&context=note&mode=search","article":false,"descRaw":"：クロード・シャノンが1948年の論文で提示した情報量とエントロピーの数学的定義。情報の不確実性を定量化する枠組みは、意識のエントロピック・ブレイン仮説や脳活動の情報論的指標の理論的基盤となった。サイケデリック状態での脳のエントロピー増大など、意識状態を情報量で記述する試みの出発点である。シャノンの理論は通信工学の基礎となり、神経科学にも情報論的視点をもたらした。 出典：Shannon (1948)『Bell System Technical Journal』 DOI: 10.1002/j.1538-7305.1948.tb01338.x"},{"name":"サイバネティクスと意識（ウィーナー／ベイトソン）","chapter":"c14-意識の未来","sub":1,"subCount":3,"tags":["theory","science"],"birth":null,"death":null,"href":"https://note.com/search?q=from%3A%40varelser%20%E3%82%B5%E3%82%A4%E3%83%90%E3%83%8D%E3%83%86%E3%82%A3%E3%82%AF%E3%82%B9%E3%81%A8%E6%84%8F%E8%AD%98%EF%BC%88%E3%82%A6%E3%82%A3%E3%83%BC%E3%83%8A%E3%83%BC%EF%BC%8F%E3%83%99%E3%82%A4%E3%83%88%E3%82%BD%E3%83%B3%EF%BC%89&context=note&mode=search","article":false,"descRaw":"：ノーバート・ウィーナーが1948年の著書『Cybernetics』で提唱したフィードバック制御の科学。グレゴリー・ベイトソンは『Steps to an Ecology of Mind』（1972年）で、心を個体ではなく関係性のパターンとして記述した。意識を制御系や情報の循環として捉える視点は、システム論的意識研究の源流となった。"},{"name":"オートポイエーシス理論（マトゥラーナ & ヴァレラ, 1973）","chapter":"c14-意識の未来","sub":1,"subCount":3,"tags":["theory","science"],"birth":null,"death":null,"href":"https://note.com/search?q=from%3A%40varelser%20%E3%82%AA%E3%83%BC%E3%83%88%E3%83%9D%E3%82%A4%E3%82%A8%E3%83%BC%E3%82%B7%E3%82%B9%E7%90%86%E8%AB%96%EF%BC%88%E3%83%9E%E3%83%88%E3%82%A5%E3%83%A9%E3%83%BC%E3%83%8A%20%26%20%E3%83%B4%E3%82%A1%E3%83%AC%E3%83%A9%2C%201973%EF%BC%89&context=note&mode=search","article":false,"descRaw":"：チリの生物学者ウンベルト・マトゥラーナとフランシスコ・ヴァレラによる理論。生命を自己を産出するシステム（オートポイエーシス）とし、「知ることは行うこと」として認知と生命を同一視した。1973年の共著で提示され、エナクティヴィズムの源流となり、意識を生命の自己組織化から理解する視点を示した。この理論は生物学だけでなく、認知科学・社会学・組織論にも広く影響した。"},{"name":"ルーマンの社会システム理論と意識","chapter":"c14-意識の未来","sub":1,"subCount":3,"tags":["theory"],"birth":null,"death":null,"href":"https://note.com/search?q=from%3A%40varelser%20%E3%83%AB%E3%83%BC%E3%83%9E%E3%83%B3%E3%81%AE%E7%A4%BE%E4%BC%9A%E3%82%B7%E3%82%B9%E3%83%86%E3%83%A0%E7%90%86%E8%AB%96%E3%81%A8%E6%84%8F%E8%AD%98&context=note&mode=search","article":false,"descRaw":"：ドイツの社会学者ニクラス・ルーマンによる理論。1984年の著書『社会システム論』で、意識をコミュニケーションの自己言及的システムとして記述し、心的システムと社会システムの構造的カップリングを論じた。意識を個人の内部ではなく、コミュニケーションとの関係で捉える視点は、社会的な意識研究の枠組みとなった。"},{"name":"記号論と意識の意味生成（パース）","chapter":"c14-意識の未来","sub":1,"subCount":3,"tags":["theory"],"birth":null,"death":null,"href":"https://note.com/search?q=from%3A%40varelser%20%E8%A8%98%E5%8F%B7%E8%AB%96%E3%81%A8%E6%84%8F%E8%AD%98%E3%81%AE%E6%84%8F%E5%91%B3%E7%94%9F%E6%88%90%EF%BC%88%E3%83%91%E3%83%BC%E3%82%B9%EF%BC%89&context=note&mode=search","article":false,"descRaw":"：米国の哲学者チャールズ・サンダース・パースによる記号論。記号・対象・解釈項の三項関係で意味生成を捉え、意識体験の意味づけ過程を記号論的に分析する枠組みを提示した。推論の三類型（アブダクション・演繹・帰納）も含め、体験の意味がどう生まれるかを論じた。記号論的意識研究の基盤である。パースはプラグマティズムの創始者の一人でもあり、記号論はその哲学の中心にある。"},{"name":"自己言及とメタ認知（ホフスタッター）","chapter":"c14-意識の未来","sub":1,"subCount":3,"tags":["theory","science"],"birth":null,"death":null,"href":"https://note.com/search?q=from%3A%40varelser%20%E8%87%AA%E5%B7%B1%E8%A8%80%E5%8F%8A%E3%81%A8%E3%83%A1%E3%82%BF%E8%AA%8D%E7%9F%A5%EF%BC%88%E3%83%9B%E3%83%95%E3%82%B9%E3%82%BF%E3%83%83%E3%82%BF%E3%83%BC%EF%BC%89&context=note&mode=search","article":false,"descRaw":"：ダグラス・ホフスタッターによる自己参照システムの理論。1979年の著書『ゲーデル、エッシャー、バッハ』で、ゲーデルの不完全性定理、エッシャーの絵画、バッハの音楽に共通する自己言及の構造を描いた。「奇妙なループ」として意識の自己言及的構造を論じ、意識と自己の関係を考える枠組みとなった。ホフスタッターは後に『I Am a Strange Loop』（2007年）でこの主題をさらに展開した。"},{"name":"『ゲーデル、エッシャー、バッハ』（ホフスタッター, 1979）","chapter":"c14-意識の未来","sub":1,"subCount":3,"tags":["theory","science"],"birth":null,"death":null,"href":"https://note.com/search?q=from%3A%40varelser%20%E3%80%8E%E3%82%B2%E3%83%BC%E3%83%87%E3%83%AB%E3%80%81%E3%82%A8%E3%83%83%E3%82%B7%E3%83%A3%E3%83%BC%E3%80%81%E3%83%90%E3%83%83%E3%83%8F%E3%80%8F%EF%BC%88%E3%83%9B%E3%83%95%E3%82%B9%E3%82%BF%E3%83%83%E3%82%BF%E3%83%BC%2C%201979%EF%BC%89&context=note&mode=search","article":false,"descRaw":"：ダグラス・ホフスタッターの1979年の著書『ゲーデル、エッシャー、バッハ—永遠の金色の絡み目』。ゲーデルの不完全性定理、エッシャーの絵画、バッハの音楽に共通する自己言及の構造を描き、意識を「奇妙なループ」として論じた。1980年にピューリッツァー賞を受賞し、意識と自己言及を考える古典となった。邦訳は『ゲーデル、エッシャー、バッハ』として1985年に刊行された。"},{"name":"意識のハードプロブレム（チャーマーズ, 1995）","chapter":"c14-意識の未来","sub":2,"subCount":3,"tags":["theory"],"birth":null,"death":null,"href":"https://note.com/varelser/n/n87eb54e9b446","article":true,"descRaw":"：豪州の哲学者デイヴィッド・チャーマーズが1995年の論文「Facing Up to the Problem of Consciousness」で定式化した問題。脳の情報処理という「やさしい問題」とは別に、なぜ物理過程に主観的体験（クオリア）が伴うのかという「ハードプロブレム」があると論じた。意識研究の核心的難問として、哲学と神経科学の議論を方向づけた。"},{"name":"意識する心（チャーマーズ, 1996）","chapter":"c14-意識の未来","sub":2,"subCount":3,"tags":["theory"],"birth":null,"death":null,"href":"https://note.com/search?q=from%3A%40varelser%20%E6%84%8F%E8%AD%98%E3%81%99%E3%82%8B%E5%BF%83%EF%BC%88%E3%83%81%E3%83%A3%E3%83%BC%E3%83%9E%E3%83%BC%E3%82%BA%2C%201996%EF%BC%89&context=note&mode=search","article":false,"descRaw":"：チャーマーズの1996年の主著『The Conscious Mind』。機能主義的な還元では意識の主観性を説明できないと論証し、意識を物理世界の基本的な特徴とみなす自然主義的二元論を提唱した。ゾンビ論証などの思考実験で知られ、現代の意識哲学の中心文献となった。意識を物理世界の基本要素とみなす立場は、後の汎心論の議論にもつながった。"},{"name":"クオリア問題と意識の科学","chapter":"c14-意識の未来","sub":2,"subCount":3,"
