name: leary-tests

on:
  workflow_dispatch:
  push:
    paths:
      - leary.html
      - tests/**
  pull_request:
    paths:
      - leary.html
      - tests/**

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node tests/leary.test.mjs
