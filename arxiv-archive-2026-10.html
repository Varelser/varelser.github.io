<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Research Digest アーカイブ 2026年10月 | VARELSER</title>
  <style>
    body{margin:0;background:#fff;color:#111;font-family:ui-sans-serif,system-ui,-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;line-height:1.8}
    .container{max-width:920px;margin:0 auto;padding:40px 18px 56px}.back{display:inline-block;margin-bottom:28px;color:#666;text-decoration:none;font-size:14px}
    h1{font-size:24px;margin:0 0 8px}.desc{color:#666;font-size:13px;margin:0 0 18px}
    .panel{border:1px solid #e5e7eb;border-radius:12px;padding:14px;background:#fff;margin-bottom:24px}
    .grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.wide{grid-column:1/-1}
    select,input{width:100%;height:42px;padding:0 12px;border:1px solid #d1d5db;border-radius:10px;background:#fff}.label{display:block;font-size:12px;color:#666;margin:0 0 6px}
    .meta{font-size:13px;color:#666;margin-top:10px}.list{display:grid;gap:18px}
    article{border-bottom:1px solid #e5e7eb;padding-bottom:28px}.src{font-size:12px;color:#666;margin-bottom:8px}.title{font-size:20px;line-height:1.5;font-weight:700;margin:0 0 10px}
    .tags{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 12px}.tag{font-size:12px;padding:4px 10px;border:1px solid #e5e7eb;border-radius:999px;background:#f3f4f6}
    .summary{font-size:14px;color:#222}.box{margin-top:14px;padding:12px 14px;border:1px solid #e5e7eb;border-radius:10px;background:#fafafa;font-size:13px;color:#555}
    a{color:#0f766e;text-decoration:none} a:hover{text-decoration:underline}
    @media (max-width:720px){.grid{grid-template-columns:1fr}.wide{grid-column:auto}}
  </style>
</head>
<body>
  <div class="container">
    <a href="arxiv.html" class="back">← Research Digest に戻る</a>
    <h1>Research Digest アーカイブ 2026年10月</h1>
    <p class="desc">アーカイブ一覧は本体ページにあります。 <a href="arxiv.html">Research Digest に戻る</a></p>

    <div class="panel">
      <div class="grid">
        <label><span class="label">月</span><select id="month"><option value="">すべて</option></select></label>
        <label><span class="label">ジャンル</span><select id="genre"><option value="">すべて</option></select></label>
        <label><span class="label">主分類</span><select id="field"><option value="">すべて</option></select></label>
        <label><span class="label">並び順</span><select id="sort"><option value="newest">新しい順</option><option value="oldest">古い順</option><option value="title">タイトル順</option></select></label>
        <label class="wide"><span class="label">キーワード</span><input id="keyword" type="search" placeholder="タイトル・要約・著者・分類を検索" /></label>
      </div>
      <div id="meta" class="meta"></div>
    </div>
    <div class="list" id="list"></div>
  </div>
  <script>
    const DATA = {"version": 1, "updatedAt": "2026-11-07T18:32:12Z", "articles": [{"source": "PubMed", "title": "MDMA-Assisted Therapy for Veterans with Comorbid Posttraumatic Stress Disorder and Alcohol Use Disorder: Clinical Outcomes from the First Open-Label Pilot Trial.", "titleJa": "退役軍人のPTSDとアルコール使用障害に対するMDMA補助療法――初のオープンラベル試験", "summaryHtml": "心的外傷後ストレス障害（PTSD）とアルコール使用障害（AUD）の併存は、米国の退役軍人に多くみられ、どちらか一方だけの場合より症状が重く、機能障害が大きく、治療成績も悪い。既存の治療は効果が限定的で、治療への参加の継続や改善の持続が課題となってきた。本研究は、PTSDとAUDを併せ持つ退役軍人10名を対象に、MDMA補助療法の実現可能性・安全性・忍容性と予備的な臨床転帰を調べた初のオープンラベル試験である。準備3回、MDMA投与セッション2回、統合6回の計11回のセッションを行い、4週間追跡した。<br><br>登録した参加者の90％が治療を完了し、PTSD症状は有意に軽減した（p = 0.006、効果量 d = 1.241）。飲酒量も記述的には減少し、飲酒日1日あたりの飲酒量が31％、大量飲酒日が54％減ったが、統計的な有意差には至らなかった。重篤な有害事象はなく、現れた有害事象はプロトコール下で想定されるMDMAの急性効果の範囲内だった。物質使用の指標は、アルコールや他の物質の使用の体系的な増加を示さず、コカイン使用の再発が1名で報告されたのみだった。<br><br>結果は、PTSDとAUDを併せ持つ退役軍人に対するMDMA補助療法の安全性と実施可能性を支持し、PTSD症状と飲酒関連アウトカムの改善を示す予備的な証拠となった。著者らは、効果の持続性や便益とリスクの全体像を確かめるには、より大規模なランダム化比較試験が必要だと結論づけている。", "url": "https://pubmed.ncbi.nlm.nih.gov/42962981/", "publishedAt": "2026-10-30T00:00:00Z", "authors": ["Erica Eaton", "Christy Capone", "Brian J Gully", "Lewis Nunez Severino", "Mollie A Monnig", "Michael S Worden", "Robert M Swift", "Carolina L Haass-Koffler"], "categories": ["MDMA-assisted therapy", "PTSD", "alcohol use disorder", "veterans"], "field": "Alcohol", "genre": "Psychedelics / Therapy", "timestamp": 1793318400000, "monthKey": "2026-10"}, {"source": "PubMed", "title": "The Fireside Database: Large-scale evidence from 25,419 psychedelic support interactions.", "titleJa": "Fireside Database――25,419件のサイケデリック・サポートから得た大規模な証拠", "summaryHtml": "サイケデリック体験の多くは臨床の場の外で起きている。非臨床的使用を認める政策枠組みが急速に広がる一方で、誰がどのような状況で支援を求め、何が支援を有効にするのかを示す体系的なデータはなかった。本研究は、米国のFireside Projectによるサイケデリック・サポートラインで、2021年4月から2026年2月に220人の訓練されたボランティアが行った25,419件のピアサポートのやり取りを統合した「Fireside Database」を提示する。<br><br>このデータベースは、構造化されたやり取りの記録とボランティアが付与したメタデータ、2,777件の利用者満足度調査を5つのアウトカム次元にわたって統合したものだ。報告された物質で最も多かったのはシロシビンで、コード化されたやり取りの59.9％を占めた。一方、苦痛の割合が最も高かったのは大麻で47.2％だった。50人のサポーターがそれぞれ10件以上の調査付きやり取りを担当する入れ子構造により、支援者個人の効果を利用者の転帰に結びつける多層モデリングが可能になっている。<br><br>このリソースは、サイケデリックの疫学、根拠に基づく訓練設計、そしてどのような心理的支援が有効なのかを調べる研究を可能にする。臨床の外で起きているサイケデリック体験への支援の実態を、大規模なデータで初めて可視化した取り組みである。", "url": "https://pubmed.ncbi.nlm.nih.gov/42962007/", "publishedAt": "2026-10-30T00:00:00Z", "authors": ["Felix Schoeller", "Marc Santolini", "Dana Xiadani", "Mickael Eskinazi", "Ashwin Murali", "David Esselman", "Wyatt Houtz", "Wesley Bellanca", "Joshua White"], "categories": ["psychedelics", "peer support", "harm reduction"], "field": "Science advances", "genre": "Psychedelics / Therapy", "timestamp": 1793318400000, "monthKey": "2026-10"}, {"source": "Europe PMC", "title": "AI is not as conscious as humans: Essentialism in mental state attributions to artificial systems", "titleJa": "AIは人間ほど意識があるとは見なされない――心的状態の帰属における本質主義", "summaryHtml": "人工システムはますます人間に似た振る舞いをするようになっている。だが、それだけで私たちは人工システムを意識的だとみなすのだろうか。本論文は二つの可能性を対比する。一つは機能主義的な帰属で、環境への応答が適切であるほど、相手が人間でも人工物でも意識的だとみなすというもの。もう一つは本質主義的な帰属で、人工システムが人間と同じくらい適切に応答しても、意識は低いと判断するというもの。さらに、この傾向が意識に特有なのか、気づきのような関連概念にも広がるのかを問う。<br><br>事前登録された2組の研究（5実験、参加者1092人）では、英国の参加者が空間的・社会的・時間的な環境特徴への応答性が異なる人間または人工エージェントのシナリオを読み、その意識と気づきを評価した。その結果、意識の帰属は本質主義的な論理に従った。応答性が同程度でも、参加者は一貫して人間の方により大きな意識を帰属させた。<br><br>一方、気づきの帰属は機能主義的なパターンを示した。人間でも人工エージェントでも、応答性が高まるにつれて気づきの評価は着実に上がった（ただし最高水準では人間がより気づいていると評価された）。つまり人々は、心的概念ごとに異なる推論規則を用いている。意識はエージェントが何であるかに、気づきはエージェントが何をするかに依存すると扱われる、という知見である。", "url": "https://europepmc.org/article/MED/42822076", "publishedAt": "2026-10-01T00:00:00Z", "authors": ["Longin L", "Karpus J", "Meertens N", "Bahrami B", "Deroy O"], "categories": ["consciousness", "experimental philosophy"], "field": "Cognition", "genre": "Consciousness / Philosophy", "timestamp": 1790812800000, "monthKey": "2026-10"}]};
    const byId = id => document.getElementById(id);
    const norm = s => String(s||'').toLowerCase().normalize('NFKC').replace(/\s+/g,' ').trim();
    const esc = s => String(s||'').replace(/[&<>"]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
    const months = [...new Set((DATA.articles||[]).map(a => a.monthKey).filter(Boolean))].sort().reverse();
    const genres = [...new Set((DATA.articles||[]).map(a => a.genre).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'ja'));
    const fields = [...new Set((DATA.articles||[]).map(a => a.field).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'ja'));
    function fill(select, values){ values.forEach(v=>{ const o=document.createElement('option'); o.value=v; o.textContent=v; select.appendChild(o); }); }
    fill(byId('month'), months); fill(byId('genre'), genres); fill(byId('field'), fields);
    function render(){
      const month=byId('month').value, genre=byId('genre').value, field=byId('field').value, sort=byId('sort').value, kw=norm(byId('keyword').value);
      let rows=(DATA.articles||[]).filter(a=>{
        if(month&&a.monthKey!==month) return false; if(genre&&a.genre!==genre) return false; if(field&&a.field!==field) return false;
        const hay=norm([a.titleJa,a.title,a.summaryHtml,a.authors.join(' '),a.categories.join(' ')].join(' '));
        if(kw&& !hay.includes(kw)) return false; return true;
      });
      rows = rows.slice().sort((a,b)=> sort==='oldest' ? a.timestamp-b.timestamp : sort==='title' ? a.titleJa.localeCompare(b.titleJa,'ja') : b.timestamp-a.timestamp);
      byId('meta').textContent = `更新: ${DATA.updatedAt || '-'} / 表示件数: ${rows.length}件`;
      byId('list').innerHTML = rows.map(a=>`
        <article>
          <div class="src">${esc(a.source)} / ${esc(a.publishedAt.slice(0,10))}</div>
          <h2 class="title">${esc(a.titleJa)}</h2>
          <div class="tags"><span class="tag">AI</span><span class="tag">${esc(a.genre)}</span><span class="tag">${esc(a.field)}</span>${a.categories.slice(0,4).map(c=>`<span class=\"tag\">${esc(c)}</span>`).join('')}</div>
          <div class="summary">${a.summaryHtml}</div>
          <div class="box"><strong>ソース・引用元</strong><br>配信元：${esc(a.source)}<br>原題：${esc(a.title)}<br>著者：${esc(a.authors.join(', '))}<br>原文URL：<a href="${esc(a.url)}" target="_blank" rel="noopener">${esc(a.url)}</a></div>
        </article>`).join('');
    }
    ['month','genre','field','sort'].forEach(id=>byId(id).addEventListener('change',render)); byId('keyword').addEventListener('input',render); render();
  </script>
</body>
</html>
