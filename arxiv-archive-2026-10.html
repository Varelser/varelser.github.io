    body{margin:0;background:#fff;color:#111;font-family:ui-sans-serif,system-ui,-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;line-height:1.8}

    .tags{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 12px}.tag{font-size:12px;padding:4px 10px;border:1px solid #e5e7eb;border-radius:999px;background:#f3f4f6}
    .summary{font-size:14px;color:#222}.box{margin-top:14px;padding:12px 14px;border:1px solid #e5e7eb;border-radius:10px;background:#fafafa;font-size:13px;color:#555}

<body>
  <div class="container">

    <h1>Research Digest アーカイブ 2026年10月</h1>
    <p class="desc">アーカイブ一覧は本体ページにあります。 <a href="arxiv.html">Research Digest に戻る</a></p>

    <div class="panel">
      <div class="grid">
        <label><span class="label">月</span><select id="month"><option value="">すべて</option></select></label>
        <label><span class="label">ジャンル</span><select id="genre"><option value="">すべて</option></select></label>
        <label><span class="label">主分類</span><select id="field"><option value="">すべて</option></select></label>
        <label><span class="label">並び順</span><select id="sort"><option value="newest">新しい順</option><option value="oldest">古い順</option><option value="title">タイトル順</option></select></label>
        <label class="wide"><span class="label">キーワード</span><input id="keyword" type="search" placeholder="タイトル・要約・著者・分類を検索" /></label>
      </div>
      <div id="meta" class="meta"></div>
    </div>
    <div class="list" id="list"></div>
  </div>
  <script>
    const DATA = {"version": 1, "updatedAt": "2026-11-08T05:30:44Z", "articles": [{"source": "PubMed", "title": "MDMA-Assisted Therapy for Veterans with Comorbid Posttraumatic Stress Disorder and Alcohol Use Disorder: Clinical Outcomes from the First Open-Label Pilot Trial.", "titleJa": "退役軍人のPTSDとアルコール使用障害に対するMDMA補助療法――初のオープンラベル試験", "summaryHtml": "心的外傷後ストレス障害（PTSD）とアルコール使用障害（AUD）の併存は、米国の退役軍人に多くみられ、どちらか一方だけの場合より症状が重く、機能障害が大きく、治療成績も悪い。既存の治療は効果が限定的で、治療への参加の継続や改善の持続が課題となってきた。本研究は、PTSDとAUDを併せ持つ退役軍人10名を対象に、MDMA補助療法の実現可能性・安全性・忍容性と予備的な臨床転帰を調べた初のオープンラベル試験である。準備3回、MDMA投与セッション2回、統合6回の計11回のセッションを行い、4週間追跡した。<br><br>登録した参加者の90％が治療を完了し、PTSD症状は有意に軽減した（p = 0.006、効果量 d = 1.241）。飲酒量も記述的には減少し、飲酒日1日あたりの飲酒量が31％、大量飲酒日が54％減ったが、統計的な有意差には至らなかった。重篤な有害事象はなく、現れた有害事象はプロトコール下で想定されるMDMAの急性効果の範囲内だった。物質使用の指標は、アルコールや他の物質の使用の体系的な増加を示さず、コカイン使用の再発が1名で報告されたのみだった。<br><br>結果は、PTSDとAUDを併せ持つ退役軍人に対するMDMA補助療法の安全性と実施可能性を支持し、PTSD症状と飲酒関連アウトカムの改善を示す予備的な証拠となった。著者らは、効果の持続性や便益とリスクの全体像を確かめるには、より大規模なランダム化比較試験が必要だと結論づけている。", "url": "https://pubmed.ncbi.nlm.nih.gov/42962981/", "publishedAt": "2026-10-30T00:00:00Z", "authors": ["Erica Eaton", "Christy Capone", "Brian J Gully", "Lewis Nunez Severino", "Mollie A Monnig", "Michael S Worden", "Robert M Swift", "Carolina L Haass-Koffler"], "categories": ["MDMA-assisted therapy", "PTSD", "alcohol use disorder", "veterans"], "field": "Alcohol", "genre": "Psychedelics / Therapy", "timestamp": 1793318400000, "monthKey": "2026-10"}, {"source": "PubMed", "title": "The Fireside Database: Large-scale evidence from 25,419 psychedelic support interactions.", "titleJa": "Fireside Database――25,419件のサイケデリック・サポートから得た大規模な証拠", "summaryHtml": "サイケデリック体験の多くは臨床の場の外で起きている。非臨床的使用を認める政策枠組みが急速に広がる一方で、誰がどのような状況で支援を求め、何が支援を有効にするのかを示す体系的なデータはなかった。本研究は、米国のFireside Projectによるサイケデリック・サポートラインで、2021年4月から2026年2月に220人の訓練されたボランティアが行った25,419件のピアサポートのやり取りを統合した「Fireside Database」を提示する。<br><br>このデータベースは、構造化されたやり取りの記録とボランティアが付与したメタデータ、2,777件の利用者満足度調査を5つのアウトカム次元にわたって統合したものだ。報告された物質で最も多かったのはシロシビンで、コード化されたやり取りの59.9％を占めた。一方、苦痛の割合が最も高かったのは大麻で47.2％だった。50人のサポーターがそれぞれ10件以上の調査付きやり取りを担当する入れ子構造により、支援者個人の効果を利用者の転帰に結びつける多層モデリングが可能になっている。<br><br>このリソースは、サイケデリックの疫学、根拠に基づく訓練設計、そしてどのような心理的支援が有効なのかを調べる研究を可能にする。臨床の外で起きているサイケデリック体験への支援の実態を、大規模なデータで初めて可視化した取り組みである。", "url": "https://pubmed.ncbi.nlm.nih.gov/42962007/", "publishedAt": "2026-10-30T00:00:00Z", "authors": ["Felix Schoeller", "Marc Santolini", "Dana Xiadani", "Mickael Eskinazi", "Ashwin Murali", "David Esselman", "Wyatt Houtz", "Wesley Bellanca", "Joshua White"], "categories": ["psychedelics", "peer support", "harm reduction"], "field": "Science advances", "genre": "Psychedelics / Therapy", "timestamp": 1793318400000, "monthKey": "2026-10"}, {"source": "PubMed", "title": "Evolutionary neuropharmacology of serotonergic psychedelics: a cross-species perspective on mechanisms, consciousness, and therapeutic potential.", "titleJa": "セロトニン作動性サイケデリックスの進化的神経薬理学――種を超えた機序・意識・治療可能性", "summaryHtml": "セロトニン作動性サイケデリックスは、特定の神経精神疾患に迅速で持続的な臨床効果をもたらす可能性から精神医学研究を活性化させてきた。しかし受容体の活性化が神経可塑性や意識体験の変容、臨床的改善へとどうつながるのかは未解明の部分が多く、サイケデリック信号の進化的起源や動物モデルの翻訳的価値も議論が続いている。本総説は、進化生物学、分子薬理学、比較神経科学、計算精神医学を統合し、生物学的スケールを横断する統一的な枠組みを提示する。<br><br>予測処理と「サイケデリックス下での信念の緩和（REBUS）」の枠組みに基づき、サイケデリックスが階層的推論を一時的に組み替える仕組みを論じる。無脊椎動物から非ヒト霊長類までの比較から、保存された受容体薬理と種特異的な回路編成が共存することが示され、動物モデルはヒトの幻覚体験の直接の代理ではなく、分子・細胞・計算レベルの機序を探る補完的な手段として解釈すべきだとする。<br><br>さらに、バイアスのかかった受容体シグナル伝達や非幻覚性の精神可塑性促進物質（サイコプラストゲン）が、可塑性に関わる治療作用と幻覚作用を部分的に切り離せる可能性を示す前臨床および臨床応用に向けた初期の証拠も論じる。受容体薬理から神経可塑性、回路計算、治療転帰までをつなぐ機序的枠組みとして、次世代サイケデリック治療薬の開発に向けた概念的・実験的な戦略を提示した総説である。", "url": "https://pubmed.ncbi.nlm.nih.gov/42957826/", "publishedAt": "2026-10-28T00:00:00Z", "authors": ["Haojiang Zhai", "Hongshuang Wang", "Yibo Wang", "Xiaohui Wang"], "categories": ["serotonergic psychedelics", "consciousness", "evolutionary neuropharmacology"], "field": "Molecular Psychiatry", "genre": "Psychedelics / Therapy", "timestamp": 1793145600000, "monthKey": "2026-10"}, {"source": "PubMed", "title": "What goes up must come down: prevalence rates, characteristics, and coping strategies concerning MDMA aftereffects.", "titleJa": "MDMA使用後の不快な余波――有病率・症状・対処法を調べた497名調査", "summaryHtml": "MDMAは心的外傷後ストレス障害（PTSD）の治療薬として研究が進む一方、使用後の急性期を過ぎてからの負の影響がどれほど一般的で、どのようなものかは議論が続いている。本研究はレクリエーション使用者を対象に、急性期後の負の影響の有病率と症状像を明らかにすることを目的とした。さらに、サプリメントや抗うつ薬が負の影響を和らげる可能性を示す前臨床研究や限定的なヒトの知見を踏まえ、対処法としての利用実態も調べた。Prolificで募集したMDMA経験者497名への横断的オンライン調査である。<br><br>参加者の74.5%が少なくとも一度は急性期後の負の影響（いわゆる「コムダウン」）を経験していた。発症は摂取から約24時間後で、平均約40時間続いた。最も多い症状は疲労（88.1%）、集中困難（85.7%）、落ち着かなさ（82.9%）、頭痛（79.7%）だった。経験者のうち14.6%が受動的な希死念慮、6.2%が能動的な希死念慮を報告した。<br><br>対処として、30.3%がサプリメント（N-アセチルシステイン、アセチル-L-カルニチン、マグネシウムが最多）、5.1%が抗うつ薬を用いており、効果の実感は中程度だった。MDMAの急性期後の負の影響はレクリエーション使用者において広く見られ、疲労や負の感情、希死念慮の上昇を伴う。著者らは、使用後に生じるリスクとしてさらなる調査が必要だと注意を喚起している。", "url": "https://pubmed.ncbi.nlm.nih.gov/42891831/", "publishedAt": "2026-10-17T00:00:00Z", "authors": ["Sean P Goldy", "Kelcy A Klein", "David B Yaden", "Sandeep M Nayak"], "categories": ["MDMA", "comedown", "psychedelic therapy"], "field": "Psychopharmacology", "genre": "Psychedelics / Therapy", "timestamp": 1792195200000, "monthKey": "2026-10"}, {"source": "PubMed", "title": "A living systematic review, meta-analysis, and open data resource of trials of MDMA-assisted therapy for PTSD.", "titleJa": "MDMA補助療法の生きたシステマティックレビュー――PTSD試験のメタ分析とオープンデータ資源", "summaryHtml": "MDMAは心的外傷後ストレス障害（PTSD）の治療薬候補として浮上したが、急速に変化するエビデンスを統合するのは難しい。本研究はMDMAによるPTSD治療に関する「生きた」システマティックレビューと、オープンデータのメタ分析資源を提示する。初回リリースでは286名を含む6件の無作為化比較試験がデータベースに収録され、すべてがMAPS（多分野サイケデリック研究協会）の支援によるものだった。<br><br>逆分散ランダム効果モデルによるメタ分析では、対照条件と比べてMDMA補助療法（MDMA-AT）がPTSD症状をより大きく軽減した（Hedges' g = −0.71）。プラセボと比較すると奏効率は1.35倍、寛解率は2.25倍だった。用量変数のメタ回帰も検討された。収録研究の多くはコクランの基準でバイアスリスクが低いとされたが、期待効果、機能的盲検解除、実施上の課題、安全性といった分野特有の問題は捉えきれていないとし、全体の確実性はGRADE評価で「低」とされた。<br><br>結論として、MDMA-ATはこれまでの研究全体でPTSD症状の短期的な減少をもたらすことが示唆された。本レビューとメタ分析、データベース、オンラインダッシュボード（sypres.io）はエビデンスの出現とともに更新され続け、急速に変化する分野の研究者に開かれた透明な資源となる。", "url": "https://pubmed.ncbi.nlm.nih.gov/42860436/", "publishedAt": "2026-10-11T00:00:00Z", "authors": ["Brooke L Sevchik", "S Parker Singleton", "Analiese Lahey", "Pim Cuijpers", "Mathias Harrer", "Megan T Jones", "Sandeep M Nayak", "Eric C Strain", "Simon N Vandekar", "David B Yaden", "Robert H Dworkin", "J Cobb Scott", "Theodore D Satterthwaite"], "categories": ["MDMA", "PTSD", "psychedelic therapy"], "field": "Neuropsychopharmacology", "genre": "Psychedelics / Therapy", "timestamp": 1791676800000, "monthKey": "2026-10"}, {"source": "Europe PMC", "title": "AI is not as conscious as humans: Essentialism in mental state attributions to artificial systems", "titleJa": "AIは人間ほど意識があるとは見なされない――心的状態の帰属における本質主義", "summaryHtml": "人工システムはますます人間に似た振る舞いをするようになっている。だが、それだけで私たちは人工システムを意識的だとみなすのだろうか。本論文は二つの可能性を対比する。一つは機能主義的な帰属で、環境への応答が適切であるほど、相手が人間でも人工物でも意識的だとみなすというもの。もう一つは本質主義的な帰属で、人工システムが人間と同じくらい適切に応答しても、意識は低いと判断するというもの。さらに、この傾向が意識に特有なのか、気づきのような関連概念にも広がるのかを問う。<br><br>事前登録された2組の研究（5実験、参加者1092人）では、英国の参加者が空間的・社会的・時間的な環境特徴への応答性が異なる人間または人工エージェントのシナリオを読み、その意識と気づきを評価した。その結果、意識の帰属は本質主義的な論理に従った。応答性が同程度でも、参加者は一貫して人間の方により大きな意識を帰属させた。<br><br>一方、気づきの帰属は機能主義的なパターンを示した。人間でも人工エージェントでも、応答性が高まるにつれて気づきの評価は着実に上がった（ただし最高水準では人間がより気づいていると評価された）。つまり人々は、心的概念ごとに異なる推論規則を用いている。意識はエージェントが何であるかに、気づきはエージェントが何をするかに依存すると扱われる、という知見である。", "url": "https://europepmc.org/article/MED/42822076", "publishedAt": "2026-10-01T00:00:00Z", "authors": ["Longin L", "Karpus J", "Meertens N", "Bahrami B", "Deroy O"], "categories": ["consciousness", "experimental philosophy"], "field": "Cognition", "genre": "Consciousness / Philosophy", "timestamp": 1790812800000, "monthKey": "2026-10"}]};
    const byId = id => document.getElementById(id);
    const norm = s => String(s||'').toLowerCase().normalize('NFKC').replace(/\s+/g,' ').trim();
    const esc = s => String(s||'').replace(/[&<>"]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
    const months = [...new Set((DATA.articles||[]).map(a => a.monthKey).filter(Boolean))].sort().reverse();
    const genres = [...new Set((DATA.articles||[]).map(a => a.genre).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'ja'));
    const fields = [...new Set((DATA.articles||[]).map(a => a.field).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'ja'));
    function fill(select, values){ values.forEach(v=>{ const o=document.createElement('option'); o.value=v; o.textContent=v; select.appendChild(o); }); }
    fill(byId('month'), months); fill(byId('genre'), genres); fill(byId('field'), fields);
    function render(){
      const month=byId('month').value, genre=byId('genre').value, field=byId('field').value, sort=byId('sort').value, kw=norm(byId('keyword').value);
      let rows=(DATA.articles||[]).filter(a=>{
        if(month&&a.monthKey!==month) return false; if(genre&&a.genre!==genre) return false; if(field&&a.field!==field) return false;
        const hay=norm([a.titleJa,a.title,a.summaryHtml,a.authors.join(' '),a.categories.join(' ')].join(' '));
        if(kw&& !hay.includes(kw)) return false; return true;
      });
      rows = rows.slice().sort((a,b)=> sort==='oldest' ? a.timestamp-b.timestamp : sort==='title' ? a.titleJa.localeCompare(b.titleJa,'ja') : b.timestamp-a.timestamp);
      byId('meta').textContent = `更新: ${DATA.updatedAt || '-'} / 表示件数: ${rows.length}件`;
      byId('list').innerHTML = rows.map(a=>`
        <article>
          <div class="src">${esc(a.source)} / ${esc(a.publishedAt.slice(0,10))}</div>
          <h2 class="title">${esc(a.titleJa)}</h2>
          <div class="tags"><span class="tag">AI</span><span class="tag">${esc(a.genre)}</span><span class="tag">${esc(a.field)}</span>${a.categories.slice(0,4).map(c=>`<span class=\"tag\">${esc(c)}</span>`).join('')}</div>
          <div class="summary">${a.summaryHtml}</div>
          <div class="box"><strong>ソース・引用元</strong><br>配信元：${esc(a.source)}<br>原題：${esc(a.title)}<br>著者：${esc(a.authors.join(', '))}<br>原文URL：<a href="${esc(a.url)}" target="_blank" rel="noopener">${esc(a.url)}</a></div>
        </article>`).join('');
    }
    ['month','genre','field','sort'].forEach(id=>byId(id).addEventListener('change',render)); byId('keyword').addEventListener('input',render); render();
  </script>
</body>
