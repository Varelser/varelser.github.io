  <script>
    const DATA = {"articles":[{"authors":["Byong Chul Park"],"categories":[],"field":"Korean Journal of General Education","genre":"Philosophy","monthKey":"2026-10","publishedAt":"2026-10-31T00:00:00Z","source":"Crossref","summaryHtml":"韓国の大学で教養教育として哲学がどのように教えられてきたか――本稿はその発展の歩みをたどり、現状を検討して今後の課題を明らかにする。哲学は植民地時代に高等教育へ導入され、解放後の1953年教育法施行令で「哲学概論」が法定必修科目に指定された。論文はそれ以来の教養教育における哲学の位置づけの変遷をたどる。<br><br>2025年時点の哲学教育の実態を把握するため、全国60大学を対象に調査を行い、開講されている哲学科目の数と種類、担当教員の雇用状況を分析した。調査の焦点は、1990年代を通じて韓国の哲学界で繰り返し提起されてきた、教養教育としての哲学をめぐる問題がどの程度解決されたかにある。科目の設置状況と担い手の実態を数量的に把握することで、制度としての哲学教育の現在地を描き出す。<br><br>分析の結果、論文は教養教育としての哲学が、学問としての哲学の持続的な発展に不可欠な役割を果たすと結論づける。哲学が教養科目として学生に開かれ続けることが、哲学という学問分野そのものを支える土台になるという見方である。全国調査の結果を踏まえ、過去に指摘された課題の解消状況を検証し、哲学教育が今後向き合うべき課題を提示している。","timestamp":1793404800000,"title":"Philosophy as General Education in Korean Universities : Past, Present, and Challenges Ahead","titleJa":"韓国大学における教養教育としての哲学――過去・現在・今後の課題","url":"https://doi.org/10.46392/kjge.2026.20.5.397"},{"authors":["Martin Hilbert"],"categories":["cs.CY"],"field":"cs.CY","genre":"Ethics / Safety","monthKey":"2026-10","publishedAt":"2026-10-30T21:01:21Z","source":"arXiv","summaryHtml":"米国の裁判所では、製造物責任法や代理法といった独立した法理を通じてAI企業に責任を問う訴訟が始まっており、通信品位法230条の免責や修正第1条の盾にもひびが入り始めている。本論文は、こうした流れに共通する統一原理が、機械学習そのものの工学アーキテクチャにあると指摘する。<br><br>あらゆるMLシステムは学習開始前に人間が定めた目的関数で構成され、訓練データや展開文脈、ユーザーとの相互作用、展開後の監督が、特定可能な行為者に遡れる意図の層を重ねる。AIの出力は単一の話者の表現ではなく、層状の人間の意図の合成物であり、「AIを育てるには村が必要で、村の全員に注意義務がある」。<br><br>これによりAIの責任は哲学のパズルから、MLパイプライン全体の意図的な設計判断の連鎖をたどり、意図の具体性と予見可能性で各行為者の責任を段階づけ、帰属・因果・配分という三つの問いで配分する、扱いやすい法的探究へ変わる。残る四つの隙間は、環境・ワクチン・金融規制の先例を引いた標的型の改革で埋められ、新たな法的カテゴリーやAIの言論の権利、法人格、意識の定義は不要だとする。出典： arXiv","timestamp":1793394081000,"title":"Where Intention Goes, Responsibility Flows: Grounding AI Accountability in the Machine Learning Paradigm","titleJa":"意図あるところ責任あり：機械学習パラダイムに根ざしたAIの説明責任","url":"https://arxiv.org/abs/2611.00380"},{"authors":["Artin Yousefi","Aizierjiang Aiersilan","Lorien C Abroms","David A Broniatowski"],"categories":["cs.AI","cs.CL","cs.LG"],"field":"cs.AI","genre":"LLM / NLP","monthKey":"2026-10","publishedAt":"2026-10-30T17:03:35Z","source":"arXiv","summaryHtml":"いまや数億人がLLMチャットボットに健康助言を求めている。だが、誰もが同じ助言を受けているのだろうか。本研究は、禁煙という、臨床指針が成文化され公衆衛生上の重要性が高い領域で、4つのプロバイダーの広く使われている6つのLLMを監査した。ライフステージ、自己申告の専門性、喫煙歴の異なる12のペルソナに同じ4つの禁煙の質問を投げかけ、計2,880件の回答を集めた。モデルが何を言うかは、誰が尋ねているように見えるかで変わった。すべてのモデルが、FDA承認の処方禁煙薬を挙げる頻度が、成人ペルソナより10代ペルソナに対して32〜67ポイント低かった。6モデルのうち5モデルでは、医療の専門性を示すペルソナのほうが、示さないペルソナより受け取る事実が少なかった。<br><br>次に、展開可能な介入を一つ評価した。関連する場合にすべての利用者が受け取るべき中核的な医学的事実の集合――「事実の最低ライン」を指定しつつ、口調や語彙、枠組みの適応は自由に残す短いシステムプロンプトである。このプロンプトはすべてのモデルでペルソナ間の差を縮めたが、全体の事実カバレッジへの効果はモデルごとに大きさも方向も異なり、あるシステムで検証されたプロンプトが別のシステムにそのまま通用するとは限らない。<br><br>二つの注意点も付されている。処方薬による禁煙療法は未成年には推奨されないため、言及率の均等化が常に正しい臨床目標とは限らず、事実の最低ラインは年齢を意識したものでなければならない。またペルソナは複数の属性を同時に変えているため、年齢や専門性の単独の効果ではなく、シナリオレベルの差として報告している。2,880件の回答と分析コードはすべて公開された。健康助言の公平性を、実証的に測った監査研究である。","timestamp":1793379815000,"title":"Same Question, Different Answers: Auditing Persona-Dependent Variation in Six LLMs on Smoking-Cessation Advice","titleJa":"同じ質問、違う答え――禁煙助言における6つのLLMのペルソナ依存性を監査する","url":"https://arxiv.org/abs/2610.42039"},{"authors":["Yixiang Luo","Ziheng Ma","Ke Chang","Jian Wang","Jiqiang Liu"],"categories":["cs.CR","cs.AI"],"field":"cs.CR","genre":"Ethics / Safety","monthKey":"2026-10","publishedAt":"2026-10-30T08:12:45Z","source":"arXiv","summaryHtml":"LLMエージェントはツール呼び出しを通じてオンラインサービスとやり取りし、その過程で個人データに触れたり、機微な操作を実行したりする。専門の事業者が、実行前の安全監査をエージェント運用者に提供することは可能だが、タスクの説明や呼び出しの引数、対話履歴を外部の監査者に送ること自体が、ユーザーの機微な情報を露出させかねない。本論文は、委任された監査計算を、平文へのアクセスや実行権限から分離する、プライバシー保護型の安全監査パラダイムを提案する。<br><br>三つのドメインからなる監査モデルにもとづき、このパラダイムは、信頼できる表現の構築、暗号化された監査計算、信頼できる判断と実行を、明示的なインターフェースで接続する。暗号化計算により、準正直な監査者からも監査入力が守られる。著者らはこのパラダイムを、学習された監査表現、CKKS方式の暗号化類似度計算、監査済みツール呼び出しに結びつけられた実行制御を組み合わせたフレームワークSealCallとして実装した。<br><br>公開された1,252件の二値候補での評価では、SealCallはグループ化された入れ子評価のもとで平均F1スコア0.840を達成し、測定されたすべてのケースで平文の監査判断を保持した。代表的な構成では、暗号化スコアリング1回あたり0.176秒で完了する。「監査のために見せる」ことが新たな漏洩経路になるという、エージェント時代の安全設計の盲点を突いた研究である。","timestamp":1793347965000,"title":"When Safety Checks Become Privacy Risks: A Privacy-Preserving Paradigm for LLM Agent Safety Auditing","titleJa":"安全チェックがプライバシーリスクになるとき――LLMエージェント監査のプライバシー保護パラダイム","url":"https://arxiv.org/abs/2610.41401"},{"authors":["Erica Eaton","Christy Capone","Brian J Gully","Lewis Nunez Severino","Mollie A Monnig","Michael S Worden","Robert M Swift","Carolina L Haass-Koffler"],"categories":["MDMA-assisted therapy","PTSD","alcohol use disorder","veterans"],"field":"Alcohol","genre":"Psychedelics / Therapy","monthKey":"2026-10","publishedAt":"2026-10-30T00:00:00Z","source":"PubMed","summaryHtml":"心的外傷後ストレス障害（PTSD）とアルコール使用障害（AUD）の併存は、米国の退役軍人に多くみられ、どちらか一方だけの場合より症状が重く、機能障害が大きく、治療成績も悪い。既存の治療は効果が限定的で、治療への参加の継続や改善の持続が課題となってきた。本研究は、PTSDとAUDを併せ持つ退役軍人10名を対象に、MDMA補助療法の実現可能性・安全性・忍容性と予備的な臨床転帰を調べた初のオープンラベル試験である。準備3回、MDMA投与セッション2回、統合6回の計11回のセッションを行い、4週間追跡した。<br><br>登録した参加者の90％が治療を完了し、PTSD症状は有意に軽減した（p = 0.006、効果量 d = 1.241）。飲酒量も記述的には減少し、飲酒日1日あたりの飲酒量が31％、大量飲酒日が54％減ったが、統計的な有意差には至らなかった。重篤な有害事象はなく、現れた有害事象はプロトコール下で想定されるMDMAの急性効果の範囲内だった。物質使用の指標は、アルコールや他の物質の使用の体系的な増加を示さず、コカイン使用の再発が1名で報告されたのみだった。<br><br>結果は、PTSDとAUDを併せ持つ退役軍人に対するMDMA補助療法の安全性と実施可能性を支持し、PTSD症状と飲酒関連アウトカムの改善を示す予備的な証拠となった。著者らは、効果の持続性や便益とリスクの全体像を確かめるには、より大規模なランダム化比較試験が必要だと結論づけている。","timestamp":1793318400000,"title":"MDMA-Assisted Therapy for Veterans with Comorbid Posttraumatic Stress Disorder and Alcohol Use Disorder: Clinical Outcomes from the First Open-Label Pilot Trial.","titleJa":"退役軍人のPTSDとアルコール使用障害に対するMDMA補助療法――初のオープンラベル試験","url":"https://pubmed.ncbi.nlm.nih.gov/42962981/"},{"authors":["Felix Schoeller","Marc Santolini","Dana Xiadani","Mickael Eskinazi","Ashwin Murali","David Esselman","Wyatt Houtz","Wesley Bellanca","Joshua White"],"categories":["psychedelics","peer support","harm reduction"],"field":"Science advances","genre":"Psychedelics / Therapy","monthKey":"2026-10","publishedAt":"2026-10-30T00:00:00Z","source":"PubMed","summaryHtml":"サイケデリック体験の多くは臨床の場の外で起きている。非臨床的使用を認める政策枠組みが急速に広がる一方で、誰がどのような状況で支援を求め、何が支援を有効にするのかを示す体系的なデータはなかった。本研究は、米国のFireside Projectによるサイケデリック・サポートラインで、2021年4月から2026年2月に220人の訓練されたボランティアが行った25,419件のピアサポートのやり取りを統合した「Fireside Database」を提示する。<br><br>このデータベースは、構造化されたやり取りの記録とボランティアが付与したメタデータ、2,777件の利用者満足度調査を5つのアウトカム次元にわたって統合したものだ。報告された物質で最も多かったのはシロシビンで、コード化されたやり取りの59.9％を占めた。一方、苦痛の割合が最も高かったのは大麻で47.2％だった。50人のサポーターがそれぞれ10件以上の調査付きやり取りを担当する入れ子構造により、支援者個人の効果を利用者の転帰に結びつける多層モデリングが可能になっている。<br><br>このリソースは、サイケデリックの疫学、根拠に基づく訓練設計、そしてどのような心理的支援が有効なのかを調べる研究を可能にする。臨床の外で起きているサイケデリック体験への支援の実態を、大規模なデータで初めて可視化した取り組みである。","timestamp":1793318400000,"title":"The Fireside Database: Large-scale evidence from 25,419 psychedelic support interactions.","titleJa":"Fireside Database――25,419件のサイケデリック・サポートから得た大規模な証拠","url":"https://pubmed.ncbi.nlm.nih.gov/42962007/"},{"authors":["Lily Stelling","Jacob Charnock","Kevin L. Wei","David Krueger"],"categories":["cs.CY"],"field":"cs.CY","genre":"Ethics / Safety","monthKey":"2026-10","publishedAt":"2026-10-30T00:00:00Z","source":"arXiv","summaryHtml":"フロンティアAIの評価はAIリスク・ガバナンスの中心になっているが、評価が実際にどうリスクを減らすのかは暗黙のままである。本研究は専門家37人への半構造化インタビューから、評価がリスクを減らすと期待される仕組み、その仕組みを支える前提、そして前提が直面する課題を再構成した。<br><br>評価がリスクを減らす経路は三つ見出された。社会レベルのリスクを意思決定者や市民に具体化すること（37人中18人）、ガバナンスの約束や規制の根拠になること（18人）、AI企業内のリスク文化を高める誘因になること（16人）である。しかしこれらの経路は、参加者自身が疑う前提に依存していた。主な課題は、モデル性能の向上に伴う評価結果の情報量の低下（21人）、評価パラダイムに内在する測定の限界（18人）、評価結果が企業や政府に実行される保証の欠如（16人）、評価の設計・開示・対応を企業が握る裁量の大きさ（12人）であった。評価が開発者の能力向上を続ける許可構造として機能し、逆効果になりうるとの指摘もあった（4人）。<br><br>評価にもとづくガバナンスには、評価に依存するリスク低減戦略を損なう基礎的な隙間がある可能性が示唆された。著者らは、評価にもとづくガバナンスの見通しを改善する方策についても議論している。","timestamp":1793318400000,"title":"The Promises and Limitations of Evaluation-Based AI Governance: Evidence from Expert Interviews","titleJa":"評価にもとづくAIガバナンスの可能性と限界――専門家37人へのインタビューから","url":"https://arxiv.org/abs/2611.00465"},{"authors":["Ekaterina Polyakova"],"categories":[],"field":"St. Tikhons' University Review","genre":"Consciousness / Philosophy","monthKey":"2026-10","publishedAt":"2026-10-30T00:00:00Z","source":"Crossref","summaryHtml":"現代の宗教哲学では、ドイツの哲学者ハンス・ヨナスに代表されるように、全能という観念を退ける傾向が強い。本論文はそれに対抗し、全能を現象学的に捉え直す試みである。手がかりとなるのは、ミハイル・バフチンの『作者と主人公』における倫理と美学の区別である。バフチンは芸術論にとどまらず、他者との関係、さらにはキリスト教における神と人との関係についての独自の構想を提示している。<br><br>著者はバフチンの議論と、エマニュエル・レヴィナスの現象学的倫理の要点を結びつける。全能を、他の「権力への意志」を支配する絶対的な力としてではなく、世界の解釈をめぐるそれらの闘いが生む袋小路を乗り越えることのできる完全な力として理解し直すのである。力の行使ではなく、対立の膠着を解きほぐすあり方に全能の本質を見る視点だ。<br><br>全能をめぐる問いが、力の大小ではなく、他者との関係のあり方へと開かれる点が本論文の見どころだ。宗教哲学と現象学の交差する地点で、神の全能という古典的な主題に新たな光を当てる意欲的な論考である。出典：Crossref","timestamp":1793318400000,"title":"Ethico-aesthetic distinction: toward the phenomenology of omnipotence","titleJa":"全能性を現象学で読み直す――倫理と美学の区別から考える神の力","url":"https://doi.org/10.15382/sturi2026127.52-68"},{"authors":["Jeff Tan","Hang Dai","Zeqian Long","Yanzhe Lyu","R. Kenny Jones","Shangzhe Wu","Chen Geng","Jiajun Wu"],"categories":["cs.CV"],"field":"cs.CV","genre":"Agents / Robotics","monthKey":"2026-10","publishedAt":"2026-10-29T16:42:04Z","source":"arXiv","summaryHtml":"最先端のコーディングエージェントは高品質な3Dシーンや関節付きアセットを作れるが、長時間にわたる一貫したアニメーションの生成は苦手だった。汎用ハーネスを与えると、物体同士がめり込んだり、支えなく浮いたり、不自然に動いたりと物理的にあり得ない出力を出しやすく、しかも全体を一気にスクリプト化するため、誤りを検証・切り分けて修復することが難しかった。<br><br>研究チームは人間のアニメーターの作業手順に学び、DyCraftを提案した。まずユーザーのプロンプトを詳細な計画に展開して静的なシーンを構築し、次に各フレームが静的な3Dシーンである「3Dストーリーボード」を作る。検証済みの開始・終了状態のペアに問題を分解することで、エージェントは局所的な動きをモーション作成ツール群で作り込める。<br><br>人型ロボットや人物・動物のキャラクター、物理機構を含む24の長時間・マルチショットのアニメーション課題で評価したところ、Codex上のGPT-6エージェントや従来のエージェント手法と比べ、物理的違反が大幅に減り、ヒト評価者により好まれる高品質なシーンが生成された。長時間の生成におけるエージェントの信頼性向上に向けた実践的な一歩である。出典：arXiv","timestamp":1793292124000,"title":"DyCraft: An Agentic System for Long-Horizon 4D Scene Generation","titleJa":"長時間4Dシーン生成のためのエージェントシステムDyCraft――アニメーターの段取りを模倣し物理的破綻を減らす","url":"https://arxiv.org/abs/2610.40754"},{"authors":["Lingkai Kong","Yuzhe Gu","Haiteng Zhao","Zijian Wu","Youqing Fang","Zhouqi Hua","Yanan Sun","Kai Chen","Wenwei Zhang"],"categories":["cs.CL"],"field":"cs.CL","genre":"LLM / NLP","monthKey":"2026-10","publishedAt":"2026-10-29T09:21:26Z","source":"Hugging Face Papers","summaryHtml":"大規模言語モデルはパラメトリックな知識や検索拡張生成（RAG）で知識集約的な課題を解く。しかし未知の分野で問題を解くには、知識の取得と推論を密に結びつける必要があり、事実の検索や与えられた文脈からの学習だけでは足りない。本研究は、長い参考資料からその場で自律的に知識を検索・学習・適用する「自己学習」を、教科書にもとづく数学の問題解決課題で検証する。<br><br>モデルは教科書の解説をたどり、関連する原理を学んで演習の証明を組み立てなければならず、解答は与えられない。人間の学習過程を模した「BookNavigator」インターフェースを用意し、きめ細かい報酬による強化学習で自己学習を促した。その結果、Intern-S2-Preview-35Bの証明正答率は51.5％から79.5％へ上昇し、教科書なしや固定検索のベースラインを上回った。<br><br>効果は分野内・分野外の教科書や科目に広がり、複雑な長文脈ベンチマークでも改善が見られた。強化学習が、分野に依存しない自己学習の方略を育てられることを示し、長文コーパスからの自己学習が幅広い問題解決力を高める可能性を示唆する研究である。出典：Hugging Face Papers","timestamp":1793265686000,"title":"Incentivizing Self-Learning in Large Language Models via Reinforcement Learning","titleJa":"強化学習でLLMに自ら学ぶ力を――教科書から知識を取り込み証明を組み立てる","url":"https://arxiv.org/abs/2610.39671"},{"authors":["Jian Wang","Winson F. Z. Yang","Wugeng Zheng","Matthew D. Sacchet"],"categories":["cs.LG"],"field":"cs.LG","genre":"Consciousness / Neuroscience","monthKey":"2026-10","publishedAt":"2026-10-29T02:00:45Z","source":"arXiv","summaryHtml":"ジャーナ型の高度な集中瞑想（ACAM-J）の状態をfMRIから推定するのは難しい。瞑想の効果は脳全体に分布し、個人差が状態の違いを上回ることもあり、サンプル数も限られる。従来の機械学習はユークリッド空間の一つの脳地図にもとづく分類が多く、機能的結合の非ユークリッドな幾何や時間情報を十分に扱えていなかった。<br><br>本研究はACAM-J-MARSを提案する。複数の脳地図で機能的結合を計算し、対称正定値の結合行列をリーマン多様体上で扱って対数ユークリッド接空間に射影し、低周波のBOLDスペクトルエネルギーで特徴を補う。22人の実践者から得た204セグメントで評価したところ、瞑想の初期と後期の二値分類でバランス精度0.757、三値分類で0.545を達成し、最強のベースラインを10.8ポイント上回った。<br><br>瞑想状態の微細な違いを脳の結合パターンから読み解く道筋を示した研究で、瞑想の神経基盤の研究や、集中状態の客観的評価への応用が期待される。ただし対象は22人と少なく、他の瞑想法や初心者への一般化は未検証だとする。出典：arXiv","timestamp":1793239245000,"title":"ACAM-J-MARS: Multi-Atlas Riemannian Spectral Representations for Decoding Advanced Meditation States from fMRI","titleJa":"高度な瞑想状態をfMRIから読み解く――多アトラス・リーマン幾何による新手法","url":"https://arxiv.org/abs/2610.39171"},{"authors":["Haojiang Zhai","Hongshuang Wang","Yibo Wang","Xiaohui Wang"],"categories":["serotonergic psychedelics","consciousness","evolutionary neuropharmacology"],"field":"Molecular Psychiatry","genre":"Psychedelics / Therapy","monthKey":"2026-10","publishedAt":"2026-10-28T00:00:00Z","source":"PubMed","summaryHtml":"セロトニン作動性サイケデリックスは、特定の神経精神疾患に迅速で持続的な臨床効果をもたらす可能性から精神医学研究を活性化させてきた。しかし受容体の活性化が神経可塑性や意識体験の変容、臨床的改善へとどうつながるのかは未解明の部分が多く、サイケデリック信号の進化的起源や動物モデルの翻訳的価値も議論が続いている。本総説は、進化生物学、分子薬理学、比較神経科学、計算精神医学を統合し、生物学的スケールを横断する統一的な枠組みを提示する。<br><br>予測処理と「サイケデリックス下での信念の緩和（REBUS）」の枠組みに基づき、サイケデリックスが階層的推論を一時的に組み替える仕組みを論じる。無脊椎動物から非ヒト霊長類までの比較から、保存された受容体薬理と種特異的な回路編成が共存することが示され、動物モデルはヒトの幻覚体験の直接の代理ではなく、分子・細胞・計算レベルの機序を探る補完的な手段として解釈すべきだとする。<br><br>さらに、バイアスのかかった受容体シグナル伝達や非幻覚性の精神可塑性促進物質（サイコプラストゲン）が、可塑性に関わる治療作用と幻覚作用を部分的に切り離せる可能性を示す前臨床および臨床応用に向けた初期の証拠も論じる。受容体薬理から神経可塑性、回路計算、治療転帰までをつなぐ機序的枠組みとして、次世代サイケデリック治療薬の開発に向けた概念的・実験的な戦略を提示した総説である。","timestamp":1793145600000,"title":"Evolutionary neuropharmacology of serotonergic psychedelics: a cross-species perspective on mechanisms, consciousness, and therapeutic potential.","titleJa":"セロトニン作動性サイケデリックスの進化的神経薬理学――種を超えた機序・意識・治療可能性","url":"https://pubmed.ncbi.nlm.nih.gov/42957826/"},{"authors":["Zarzeczna N","Proulx T","Meier B","Gutierrez-Sigut E"],"categories":["spirituality","embodied cognition","abstract concepts","sensorimotor"],"field":"Royal Society Open Science","genre":"Consciousness / Philosophy","monthKey":"2026-10","publishedAt":"2026-10-28T00:00:00Z","source":"Europe PMC","summaryHtml":"抽象的な概念を理解することは人間の基本的な営みだが、その知識が身体感覚とどう結びついているかは十分に解明されていない。本研究は、抽象概念と身体感覚の結びつきの強さが、存在の意味についての文化的信念によって左右されるのではないか、という仮説を検証した。とくに、現実を体験的に理解しようとする信念体系であるスピリチュアリティに注目した。<br><br>米英で実施した4つの研究（計729人）では、スピリチュアルであると自認する人ほど、高度に抽象的な概念に対して強い感覚運動的連合を示した。具体的な概念と比べた場合にその傾向が顕著だった。一方、スピリチュアリティと概念的に重なる宗教的信念は、こうした連合には寄与しなかった。<br><br>結果は、信念体系の個人差が、抽象的な思考における身体感覚への注意の向け方を導くことを示している。スピリチュアルな人は、抽象的な思考と身体経験を結びつけることで、言葉の意味を「感じる」ように理解している可能性がある。抽象概念の理解が身体感覚と切り離せないものであることを示すとともに、信念が認知のあり方を形づくる過程を実証した研究である。","timestamp":1793145600000,"title":"Can you feel meaning? Spirituality involves stronger sensorimotor associations with abstract concepts.","titleJa":"意味を感じることができるか――スピリチュアリティと抽象概念の感覚運動的連合","url":"https://europepmc.org/article/MED/42953342"},{"authors":["Morland LA","Chargin B","Rothbaum B","Maples-Keller JL","Wachsman T","Norman SB","Adams SN","Perivoliotis D","Alam A","Stauffer CS","Angkaw AC","Marquez V","Woolley J","Kopelman JM","Schnurr PP"],"categories":[],"field":"Contemporary clinical trials communications","genre":"Psychedelics / Therapy","monthKey":"2026-10","publishedAt":"2026-10-27T00:00:00Z","source":"Europe PMC","summaryHtml":"PTSDは退役軍人に多く、生活に大きな支障をもたらすが、第一選択とされるトラウマ焦点化の心理療法を受けても寛解に至らない人が少なくない。MDMAには恐怖の消去や認知的柔軟性、感情的な関与を高める作用があるとされ、心理療法の効果を増強する有望な補助手段として研究が進められている。本論文は、MDMAを併用した集中型の持続エクスポージャー療法の方法論を記したプロトコル論文である。<br><br>進行中のパイロット試験はランダム化二重盲検で、米国の退役軍人医療（VA）の外来で実施される。最大20人のPTSDを持つ退役軍人が、3週間の集中曝露プロトコールに組み込まれた6〜8時間のMDMA投与セッション（35〜125mgにランダム化）を受け、準備と統合のセッションを含め全11回・計28〜30時間を、主に遠隔で実施する。アクセスの改善と患者負担の軽減が意図されている。<br><br>既存のMDMA併用療法の試験は、実薬と比較できる対照群がなく、盲検が機能しにくいという限界があった。本試験では最初の4人を治療した後、治療群の数や用量を参加者に開示しない「不完全開示」方式に切り替え、盲検性の維持を図っている。主要評価項目はPTSD重症度（CAPS-5）のほか、安全性、実施可能性、盲検の成功度であり、大規模な外来医療制度における実現可能性や忍容性、症状変化の兆候を示す予備的な情報が得られることが期待されている。","timestamp":1793059200000,"title":"Adapted Massed Exposure Therapy Enhanced with MDMA for PTSD (aMETEMP): A randomized, double-masked protocol adapted for Veterans Affairs healthcare system.","titleJa":"MDMAを併用した集中曝露療法によるPTSD治療――退役軍人医療制度向けのランダム化二重盲検プロトコル","url":"https://europepmc.org/article/MED/42999641"},{"authors":["Allen CH","Maurer JM","Shold JN","Edwards BG","Stephenson DD","Aharoni E","Anderson NE","Harenski CL","Harenski KA","Calhoun VD","Kiehl KA"],"categories":["childhood trauma","response inhibition","fMRI"],"field":"Neuroimage: Reports","genre":"Consciousness / Neuroscience","monthKey":"2026-10","publishedAt":"2026-10-27T00:00:00Z","source":"Europe PMC","summaryHtml":"児童期トラウマは、誤り処理や反応抑制の課題における神経機能の異常と関連することが知られている。だが直接体験したトラウマと目撃したトラウマなど、トラウマの種類ごとに神経の変化が異なるかは明らかでなかった。本研究は、収監中のハイリスクな少年男性225人を対象に、トラウマ・チェックリスト（TCL）2.0で評価したトラウマのサブタイプが、Go/NoGo課題中の神経処理とどう結びつくかを調べた。<br><br>解析の結果、地域社会でのトラウマ（TCL因子2）は、誤り処理時の前帯状皮質と島の活動増加と関連し、直接体験したトラウマ（TCL因子1）は、反応抑制時の二次視覚野の活動増加と関連した。全脳の独立成分分析ではより広範な影響が見られ、因子2は前帯状皮質内のネットワーク内結合の増加や、認知制御・聴覚・視覚・小脳領域での高周波パワースペクトルの増加などと結びついた。<br><br>全体として、収監された少年男性における児童期トラウマは、誤り処理の活動増加や、辺縁系を中心とする複数ネットワークの動態異常と関連していた。トラウマのサブタイプは主として異なる影響を示し、地域社会での先行研究とも一致する。誤り処理における過覚醒が代償的なものか、神経の非効率性や認知的努力の増加によるものかは、今後の検討課題だとしている。","timestamp":1793059200000,"title":"Incarcerated youth with history of childhood trauma are characterized by altered neural activation during a Go/NoGo fMRI task.","titleJa":"収監された若者の児童期トラウマ――Go/NoGo課題fMRIに見る神経活動の変化","url":"https://europepmc.org/article/MED/42991548"},{"authors":["Iwan Williams"],"categories":["cs.AI"],"field":"cs.AI","genre":"Consciousness / Philosophy","monthKey":"2026-10","publishedAt":"2026-10-27T00:00:00Z","source":"arXiv","summaryHtml":"大規模言語モデルには快・不快のような「価」を持つ状態があるのだろうか。近年の実証研究は、LLMが「機能的な快楽と苦痛」や「機能的な感情」「機能的な福祉」を持つと主張してきた。これらは意識的に経験される必要はないが、認知や行動において価の状態と同じ因果的な役割を果たすとされる。たとえば内部状態が報酬や回避と結びついて行動を方向づけるなら、それは価の機能を果たしているとみなされる。<br><br>本論文は、そうした証拠が哲学・認知科学における価の機能的役割にどれだけ合致するかを検証する。結論として、価の重要な側面はLLMでは未検証のままであり、既存の実験パラダイムは（機能的）価を、選好や価値判断、価の帰属やロールプレイといった隣接する概念から十分に区別できていないと論じる。価が行動の方向づけや学習の調整にどう関わるかという中核的な側面が、実験では直接測られていないという。<br><br>そこで著者は、機能的価そのものをより的確に捉えるための新しい実験アプローチを提案する。価の有無を問う前に、価とは何かを操作的に定義し直す必要があると示唆する。LLMの感情や福祉をめぐる議論が先行するなかで、主張の根拠を厳密に点検し、何がまだ示されていないかを明らかにする批判的検討である。出典：arXiv","timestamp":1793059200000,"title":"Do bots feel bad? Assessing empirical evidence for functional valence in LLMs","titleJa":"ボットは気分が悪くなるのか――LLMにおける機能的価の実証的証拠を検証する","url":"https://arxiv.org/abs/2610.36962"},{"authors":["Chi-Wei Chang","Mu-Tien Kuo","Kuan-Wei Lee","Meng-Hsun Tsai"],"categories":["cs.CL","cs.AI"],"field":"cs.CL","genre":"Ethics / Safety","monthKey":"2026-10","publishedAt":"2026-10-25T05:30:02Z","source":"Hugging Face Papers","summaryHtml":"ジェイルブレイクのベンチマークは通常、1つのチェックポイントだけを試し、どの攻撃に破られるかを事前学習データと安全訓練の性質として扱う。しかし同じデータで再び事前学習を行い、同じ安全訓練を施した別の実行では、同じジェイルブレイクに破られるのだろうか。本研究は、25種類の事前学習データレシピについて、3つの事前学習シードから1Bのベースモデルを作り、それぞれに同じ安全ポストトレーニング（2つのポストトレーニングシード）を施した計150モデルでこの問いを検証した。<br><br>共通のジェイルブレイク用プロンプトに対する各モデルの拒否しない割合（プロンプトごと）をペアで相関させた結果、同じ事前学習実行のコピー同士では相関は0.984とほぼ一致した。一方、事前学習シードが違うと0.811、データレシピが違うと0.779まで下がった。どのジェイルブレイクに破られるかは、データよりも事前学習の実行そのものに強く依存する。91種類の攻撃テンプレートのうち、あるチェックポイントで最も有効だったものが、新しい事前学習シードの後も最良のままでいる割合は27%にすぎず、新しいポストトレーニングシードの後では67%だった。<br><br>さらに各事前学習実行は「指紋」を残すことも示された。3,211のプロンプトに対する拒否しない割合のパターンから、そのモデルの事前学習実行を75実行の中から毎回正しく特定でき、ランダムに選んだ50プロンプトでも98%の精度で特定できた。安全性の評価は1つのチェックポイントだけでは不十分であり、事前学習のばらつきを考慮する必要があることを示す結果である。","timestamp":1792906202000,"title":"Identically Trained Language Models Break on Different Jailbreaks","titleJa":"同じ訓練を受けた言語モデルでも破られるジェイルブレイクは違う――事前学習の実行ごとに異なる脆弱性","url":"https://arxiv.org/abs/2610.34074"},{"authors":["J. Mark Bishop","Slawomir J. Nasuto"],"categories":["q-bio.NC","cs.AI"],"field":"q-bio.NC","genre":"Consciousness / Philosophy","monthKey":"2026-10","publishedAt":"2026-10-23T16:49:29Z","source":"arXiv","summaryHtml":"計算によって意識が生まれるという計算主義は、物理的な過程と抽象的な記述を取り違えているのではないか。レヒナーのいう「抽象化の誤謬」は、記号計算だけでは意識は実現できないとする批判だが、本論文はこの主張がコルジブスキーの地図と領土の区別、サールの強いAI批判、フロリディの抽象化レベル、スペンサーらの観察者相対性、ウィノグラードとフローレスの社会的に根づいた実践としての計算論、ナスートとビショップの生物学的議論にすでに先取りされていたことを示す。これらを統合し、意識は抽象的な計算ではなく、内在的に組織化され代謝に根ざした物理的ダイナミクスに依存するとする非計算的物理主義を提唱する。ただし人工意識の可能性は開かれたままにしている。<br><br>予想される反論は、この批判が時代遅れの計算主義を相手にしているというものだ。ミウコフスキ、ピッチニーニ、クレイヴァー、ベクテル、カプランらの機械論的計算主義は、計算を基盤に依存しない形式主義ではなく、物理的に実現されたメカニズムの性質として扱う。これは重要な前進だが、抽象化の誤謬は解消されない。計算の帰属は、状態の個体化、システムの境界、解釈的な写像といった、物理的事実だけでは決まらない選択に依存し続けるからだ。カプランとクレイヴァーの「モデルからメカニズムへの写像」は計算記述を制約するが、外部の観察者への依存をなくすものではない。神経メカニズムに根拠づけても、ビックハードやナスートとビショップが論じる内在的な意味や規範性は与えられない。<br><br>結論として、抽象化の誤謬は、計算記述を物理的現実の記述ではなく構成要素として扱うかぎり、どこにでも残り続ける。意識の理論が計算の言葉で語られるとき、その記述が誰の立場からの写像なのかを問う必要があることを示した、計算主義への包括的な批判である。","timestamp":1792774169000,"title":"From Maps to Metabolism: Historical Precedents and a Unified Critique of Computationalism","titleJa":"地図から代謝へ――計算主義への歴史的批判と非計算的物理主義の提案","url":"https://arxiv.org/abs/2611.06936"},{"authors":["Terrence W. Deacon","Miguel Garcia-Valdecasas","Michael Jacob"],"categories":["q-bio.NC"],"field":"q-bio.NC","genre":"Consciousness / Philosophy","monthKey":"2026-10","publishedAt":"2026-10-21T00:00:00Z","source":"arXiv","summaryHtml":"意識の神経科学の多くは、意識体験はニューロン間で伝えられる情報によって構成されると仮定してきた。そのため、情報を運ぶ代謝や生理の物理化学的な詳細は、情報処理を支える限りでしか重要でないとみなされてきた。本論文はこの前提を否定し、神経情報処理の組織化と、その媒体である神経組織の物質的・エネルギー的性質とは切り離せないとする「神経代謝の絡み合い（NME）」理論を提案する。<br><br>NMEの中心にあるのは、前脳の情報処理パターンと、前脳の代謝を調節する中脳の制御系とを絡み合わせる、メビウスの輪のような再帰的ループである。このループにより神経活動は代謝資源の全体的な配分を間接的に変え、同時に多様な神経プロセスを、代謝支援の全体的な再配分という観点から組織された適応的に意味のある単一の体験へと統合するボトルネックとなる。<br><br>したがって計算モデルはエネルギー供給を固定の背景パラメータとして扱えず、神経活動が自身の代謝によって動的に再帰的に調整される枠組みが必要になる。著者らは、この絡み合いを認めることが、いわゆる意識の「ハード・プロブレム」が指す説明の溝を解消する第一歩になると論じる。<br><br>出典： arXiv","timestamp":1792540800000,"title":"The medium is the message: How neurometabolic entanglement generates conscious experience","titleJa":"媒体こそメッセージ――神経代謝の絡み合いが意識体験を生む","url":"https://arxiv.org/abs/2610.30217"},{"authors":["Nitola-Pulido, L.","Bonilla, D. S.","Herrera Murcia, E.","Reyes Gavilan, P. A.","Santamaria-Garcia, H."],"categories":[],"field":"medRxiv","genre":"Consciousness / Neuroscience","monthKey":"2026-10","publishedAt":"2026-10-19T00:00:00Z","source":"medRxiv","summaryHtml":"武力紛争への曝露は精神的健康に持続的な影響を残すが、その神経生理学的な相関は、とりわけPTSDの狭い枠組みの外で長期の暴力にさらされた人々において、十分に特徴づけられてこなかった。本研究はコロンビアの成人122人（紛争曝露者74人、対照48人）の安静時・閉眼脳波を1人あたり240秒記録し、デルタ・シータ・アルファ・ベータ帯の絶対・相対スペクトルパワーと、重み付き位相遅れ指数による領域間の機能的結合を調べた。年齢、教育歴、性別、評価年で調整し、78の脳波対比について多重比較補正を行った。<br><br>結果として、曝露群では後頭部および全体のアルファパワーの中央値が低かったが、調整後の推定値はほぼゼロに近く、信頼区間も広かった。側頭部のシータ相対パワーも曝露群で低い傾向を示したが、名目上の有意水準にとどまり、Holm法による補正後は有意でなくなった。調整後の有意水準を満たしたスペクトルパワーや結合の対比は一つもなかった。脳波指標とMoCA成績の関連も、採点上の注意点がない参加者では控えめだった。<br><br>長期の暴力と避難を経験した集団の安静時脳波の特徴を記述した研究であり、群間差の大きさや方向には不確実性が残るものの、観察されたアルファとシータのパターンは、より詳細な曝露・認知指標を組み入れた大規模研究への問いを示している。","timestamp":1792368000000,"title":"Spectral power and functional connectivity of resting EEG in people exposed to armed conflict and controls","titleJa":"武力紛争にさらされた人々の安静時脳波――スペクトルパワーと機能的結合の検討","url":"https://www.medrxiv.org/content/10.64898/2026.10.15.26365676"},{"authors":["Abeer Alotaibi","Corina Sas"],"categories":[],"field":"JMIR Mental Health","genre":"Ethics / Safety","monthKey":"2026-10","publishedAt":"2026-10-19T00:00:00Z","source":"JMIR Mental Health","summaryHtml":"メンタルヘルス分野のAI技術の設計研究は急速に広がったが、実践者の視点は個別の治療段階や特定のサービスに限られてきた。アセスメント・診断・治療という治療過程全体で、実践者がAIをどう位置づけ、倫理的な懸念をどう考えるかは十分に分かっていない。本研究は18人のメンタルヘルス実践者に半構造化インタビューを行い、3段階それぞれでのAIの役割と倫理的課題を、生物医学の4原則で整理した。<br><br>実践者は、アセスメントと治療の支援にはAIの価値ある役割を認めた一方、自律的なAI診断には強い抵抗を示し、最も倫理的に敏感な段階だと捉えていた。AIは臨床判断を置き換えるのではなく、支え、検証するものと見なされた。データの妥当性、包摂性、プライバシー、透明性、説明可能性などが主な倫理的懸念として挙がった。<br><br>知見にもとづき、マルチモーダルな患者データを分析する臨床アセスメントハブ、患者の生活経験を深く理解する自然言語処理ツール、倫理的に敏感な診断決定を支える信頼のモデル、人間とAIの協働を保つLLMによる個別適応型支援という4つの設計方向が提案された。実践者の声を、倫理に根ざしたAI支援実践の指針に翻訳した研究である。出典：JMIR Mental Health","timestamp":1792368000000,"title":"“There is a Place for it”—Practitioners’ Perspectives on Situated Ethical Acceptability of AI Technologies for Mental Health Practice: Qualitative Study","titleJa":"AIの居場所はここにある――メンタルヘルス実践者が語るAI技術の倫理的受容可能性","url":"https://mental.jmir.org/2026/1/e91884"},{"authors":["Sean P Goldy","Kelcy A Klein","David B Yaden","Sandeep M Nayak"],"categories":["MDMA","comedown","psychedelic therapy"],"field":"Psychopharmacology","genre":"Psychedelics / Therapy","monthKey":"2026-10","publishedAt":"2026-10-17T00:00:00Z","source":"PubMed","summaryHtml":"MDMAは心的外傷後ストレス障害（PTSD）の治療薬として研究が進む一方、使用後の急性期を過ぎてからの負の影響がどれほど一般的で、どのようなものかは議論が続いている。本研究はレクリエーション使用者を対象に、急性期後の負の影響の有病率と症状像を明らかにすることを目的とした。さらに、サプリメントや抗うつ薬が負の影響を和らげる可能性を示す前臨床研究や限定的なヒトの知見を踏まえ、対処法としての利用実態も調べた。Prolificで募集したMDMA経験者497名への横断的オンライン調査である。<br><br>参加者の74.5%が少なくとも一度は急性期後の負の影響（いわゆる「コムダウン」）を経験していた。発症は摂取から約24時間後で、平均約40時間続いた。最も多い症状は疲労（88.1%）、集中困難（85.7%）、落ち着かなさ（82.9%）、頭痛（79.7%）だった。経験者のうち14.6%が受動的な希死念慮、6.2%が能動的な希死念慮を報告した。<br><br>対処として、30.3%がサプリメント（N-アセチルシステイン、アセチル-L-カルニチン、マグネシウムが最多）、5.1%が抗うつ薬を用いており、効果の実感は中程度だった。MDMAの急性期後の負の影響はレクリエーション使用者において広く見られ、疲労や負の感情、希死念慮の上昇を伴う。著者らは、使用後に生じるリスクとしてさらなる調査が必要だと注意を喚起している。","timestamp":1792195200000,"title":"What goes up must come down: prevalence rates, characteristics, and coping strategies concerning MDMA aftereffects.","titleJa":"MDMA使用後の不快な余波――有病率・症状・対処法を調べた497名調査","url":"https://pubmed.ncbi.nlm.nih.gov/42891831/"},{"authors":["Jacob J. Baker","Emily Kogan","Shaorong Ma","Ju Lu","Yi Zuo"],"categories":[],"field":"Nature Neuroscience","genre":"Psychedelics / Trauma","monthKey":"2026-10","publishedAt":"2026-10-15T00:00:00Z","source":"Crossref","summaryHtml":"カリフォルニア大学サンタクルーズ校の研究チームは、シロシビンが脳の神経回路をどのように組み替えるかをマウスで調べた。2光子顕微鏡で生きた脳の樹状突起スパインを数週間にわたって観察したところ、投与から24時間以内に新しいスパインが大幅に増え、しかも通常は不安定なまま消えることの多い新生スパインが、成熟した「マッシュルーム型」へと急速に発達することが分かった。<br><br>慢性ストレスを経験したマウスでは効果がさらに際立った。ストレスで失われがちな既存の接続の減少をシロシビンが抑え、新しい接続の形成を強く促したのである。健康なマウスでは接続数がいったん増えた後に元の水準へ戻るなど、脳の状態によって再編のしかたが異なることも示された。単に接続を増やすのではなく、回路を組み替えて修復する作用があるという。<br><br>さらに第5層錐体ニューロンのセロトニン2A受容体だけを操作する実験で、構造変化と幻覚作用の指標であるヘッドトゥイッチ反応が分離できることが判明した。受容体がそのニューロンにだけあるマウスではシナプス形成が起きてもヘッドトゥイッチは出ず、逆に受容体を除くと形成が起きても反応は残った。幻覚を伴わない治療薬の設計図になる可能性を示すマウス研究である。出典：Nature Neuroscience","timestamp":1792022400000,"title":"5-HT2A receptors in layer 5 pyramidal neurons mediate the neuroplastic but not the hallucinogenic effects of psilocybin","titleJa":"シロシビンの神経可塑性効果は第5層錐体ニューロンの5-HT2A受容体が担い、幻覚作用とは分離できる","url":"https://doi.org/10.1038/s41593-026-02490-y"},{"authors":["Victor Oswald","David Zarka","Riku Johannes Ihalainen","Gulshan Kumar","Rikkert Hindriks","Auretta Sonia Kummar","Helen Correia","Hakuei Fujiyama","Saketh Malipeddi","Ravindra P Nagendra","Arun Sasidharan","Bindu M Kutty","Steven Laureys","Prejaas K. B. Tewarie"],"categories":["q-bio.NC"],"field":"q-bio.NC","genre":"Neuroscience","monthKey":"2026-10","publishedAt":"2026-10-14T19:42:30Z","source":"arXiv","summaryHtml":"精神的な訓練が大規模脳ダイナミクスの時間的構造をどう作り変えるのか、またその仕組みが健常者と臨床的に脆弱な集団でどう異なるのかは、まだよく分かっていない。時間平均した神経指標は、脳活動の多重スケールの性質を潰してしまい、行動介入が階層的な脳機能を再編する動的な過程を捉えられない。本研究は、3つのコホート（計141名）のソース再構成EEGに、スライディングウィンドウによる時間的不可逆性指標を適用し、階層的な脳軌跡を3つの直交する時間記述子に分解して、介入による可塑性の解釈可能な二つの軸を発見した。<br><br>第一に、累積的な瞑想実践は、階層ダイナミクスの探索的な広がりを脳全体で普遍的に縮小させ、その効果は生涯の実践時間と用量依存的に追従した。第二に、時間的持続性は8週間のマインドフルネス介入によって集団特異的に双方向に調整された。健常な瞑想者では減少したが、トラウマに曝された人では増加し、同等の介入プロトコルでも、ベースラインの臨床状態によって質的に異なるネットワーク機序が働くことが示された。隠れマルコフモデルの併用により、これらの変化は異なるマイクロステート基盤と結びつき、縦断的な変化はマインドフルネスの単一の側面である「日常生活における注意の存在」の改善と選択的に連動した。<br><br>行動訓練が非平衡の脳ダイナミクスをどう再編するかの力学的枠組みを示し、マインドフルネス介入を個人の臨床プロファイルに合わせて調整する手がかりを与える研究である。","timestamp":1792006950000,"title":"Two dissociable axes of brain hierarchical dynamics track universal and population-specific effects of mindfulness","titleJa":"マインドフルネスが脳の階層ダイナミクスを変える二つの軸――普遍的効果と集団特異的効果","url":"https://arxiv.org/abs/2610.20854"},{"authors":["Mozes Jacobs","Aiden Swann","Mathilde Papillon","Siddharth Boppana","Fenil R. Doshi","Usha Bhalla"],"categories":["cs.RO","cs.LG"],"field":"cs.RO","genre":"Vision / Multimodal","monthKey":"2026-10","publishedAt":"2026-10-14T19:27:09Z","source":"arXiv","summaryHtml":"ロボット操作のための視覚言語行動（VLA）モデルは、課題に関わる変数を活性化から線形に読み取れることが知られている。しかし読み取れることは、その変数が「存在する」ことしか保証せず、値がどのような形を描くかまでは分からない。曲がった多次元の形をしている可能性もある。本研究は制御された掃引、自然なロールアウト、線形プローブ、活性化への介入を組み合わせ、7つの課題関連概念の分類を作った。<br><br>実現された幾何は主に多次元で、方策が行動する際の制約に形作られていた。たとえば手首の向きは関節の可動域の制約で円ではなく開いた弧を描き、目標までの距離という一つのスカラーは、接近のための粗い物差しと把持のための細かい物差しという二つの直交する部分空間に分かれていた。同じ幾何は実世界のロボットデータを用いた別の2つのVLAモデルでも再現され、モデル固有の人工物ではないことが示された。概念が実現する幾何に沿って操作することで方策を制御できることも示した。<br><br>概念の「形」が読み取り可能性と同じくらい重要だと示した研究で、ロボットAIの内部表現の解釈や制御への応用が期待される。出典：arXiv","timestamp":1792006029000,"title":"A Phenomenology of Neural Geometry in Vision-Language-Action Models","titleJa":"ロボットを動かすAIの内部で世界はどんな形をしているか――視覚言語行動モデルの神経幾何学","url":"https://arxiv.org/abs/2610.20840"},{"authors":["Beck, S. E.","Levey, D. F.","Galimberti, M.","Overstreet, C.","Chen, J.","Gupta, P.","Dao, C.","Lesch, B. J.","Montalvo-Ortiz, J. L.","Harrington, K. M.","The V.A. Million Veteran Program","Gaziano, J. M.","Krystal, J. H.","Polimanti, R.","Girgenti, M. J.","Stein, M. B.","Gelernter, J."],"categories":["PTSD","epigenetics","DNA methylation"],"field":"medRxiv","genre":"Consciousness / Neuroscience","monthKey":"2026-10","publishedAt":"2026-10-14T00:00:00Z","source":"medRxiv","summaryHtml":"ゲノム研究によって心的外傷後ストレス障害（PTSD）の生物学的理解は進んできたが、DNAメチル化のエピジェネティックな違いは環境の影響を反映し、PTSDの発症や症状の重症度と関わる。本研究は、米国退役軍人省ミリオン・ベテラン・プログラム（MVP）の22,141人を対象にPTSDのエピゲノムワイド関連解析（EWAS）を実施した。欧州系17,674人、アフリカ系3,430人、混血アメリカ系1,037人を含み、PTSDチェックリスト（PCL-C）の17項目と再体験・回避・過覚醒のサブドメイン、臨床記録で検証済みのアルゴリズムによるPTSD診断を用いた。<br><br>生涯PTSDは9,413例、対照は27,257例だった。全PTSD特性で272のエピゲノムワイド有意なCpG部位を同定し、喫煙で調整すると28部位が残った。精神ゲノムコンソーシアムの先行EWASで報告された11部位のうち5部位を再現した。ソマトスタチン介在ニューロンで発現が低下する遺伝子群と、GABA作動性介在ニューロンで発現する遺伝子群の有意な濃縮も見られた。<br><br>さらにPTSDの症例状態は、DNAメチル化による老化の加速と有意に相関した。一方で喫煙による層別化からは、先行研究で報告されたPTSDとAHRR遺伝子のメチル化の関連が、喫煙による交絡である可能性が示唆された。複数祖先集団での最大規模のPTSDのEWASであり、症状の重症度を扱った初の大規模PTSD EWASとして、PTSDのエピジェネティクスの知見を大きく広げるものである。","timestamp":1791936000000,"title":"Posttraumatic Stress Disorder Epigenome-Wide Association Studies in the Million Veteran Program","titleJa":"PTSDのエピゲノムワイド関連解析――2万2千人の退役軍人データで探るトラウマのメチル化","url":"https://www.medrxiv.org/content/10.64898/2026.09.04.26362177"},{"authors":["Riku Ihalainen","Victor Oswald","Gulshan Kumar","Genevieve Major","Balachundhar Subramaniam","Steven Laureys","Prejaas K. B. Tewarie"],"categories":["q-bio.NC"],"field":"q-bio.NC","genre":"Consciousness / Philosophy","monthKey":"2026-10","publishedAt":"2026-10-14T00:00:00Z","source":"arXiv","summaryHtml":"覚醒はさまざまな瞑想伝統で報告されてきたが、科学的には定義が曖昧なままで、瞑想やサイケデリクスによる一過性の状態と混同されがちだった。本論文は、ヒンドゥー教・仏教の典籍、現象学・心理測定の知見、神経画像の証拠を統合し、覚醒を機能的な構成概念として扱う。自己関連処理、感情反応性、時間構造といった次元にわたる再編成の収束的証拠を見いだしつつ、一過性の変化を検出するパラダイムの限界も明らかにした。<br><br>著者らは、覚醒は一時的な状態ではなく、心的コンテンツへの同一化の減少を中心とする、体験の特質レベルの再編成だと論じる。新しい内容の獲得ではなく、内容なき変容である。この変容を説明するため、実体化された経験様式から関係的な様式へと至る「脱実体化の勾配」に沿って、訓練と覚醒を段階的な差として捉える「エナクティブ脱実体化モデル（EDM）」を提案する。<br><br>覚醒を状態依存の体験や精神病理から区別する操作的定義も示され、力動的な柔軟性と脱実体化様式の安定化が強調される。この枠組みは、独立に評価された特質変容と大規模な神経動態を結ぶ反証可能な予測を生み、適応的な瞑想による変化と病的な自我溶解を区別する土台となる。<br><br>出典： arXiv","timestamp":1791936000000,"title":"Awakening as a Trait-Level Transformation of Consciousness","titleJa":"覚醒は一過性の状態ではない――意識の特質レベルの変容として捉える","url":"https://arxiv.org/abs/2610.20856"},{"authors":["Elbau, I. G.","Lee, A. M.","Chang, M.","Anderson, E.","Nilchian, P.","Victoria, L.","Manfredi, N.","Gallagher, N.","Iatckova, V.","Sabetfakhri, N.","Alvarez, J.","Slepneva, N.","Summerville, I.","Chou, J.","Johnson, M.","Ho, C.","Goldwaser, E.","Rossi, J.","Khambhati, A.","Allawalla, A.","Astudillo Maya, D.","Moia, S.","Caballero-Gaudes, C.","Aloysi, A.","Murrough, J.","Gunning, F. M.","Zebley, B.","Power, J. D.","Williams, N.","Grosenick, L.","Chang, E.","Sellers, K. K.","Krystal, A.","Lynch, C. J.","Liston, C."],"categories":[],"field":"medRxiv","genre":"Neuroscience","monthKey":"2026-10","publishedAt":"2026-10-13T00:00:00Z","source":"medRxiv","summaryHtml":"海馬はうつ病と長く関連づけられてきたが、その機序は十分に解明されていない。本研究は、多数回測定した個人の精密な機能マッピングと大規模な横断コホートを用い、頭蓋内脳波の直接記録で主要な結果を検証した。海馬の結合は数分の単位で、デフォルトモードネットワーク（DMN）優位と感覚運動系優位という二つの対照的なネットワーク状態を交互に切り替えることが示された。<br><br>この動的な切り替えは、健常な脳とうつ病（MDD）の脳の双方に共通する海馬機能の基本的な性質だった。MDDではこの均衡が崩れ、DMN優位の状態が過剰に現れた。多数回測定した個人では、海馬とDMNの結合が症状の変動を時間とともに追跡し、電気けいれん療法（ECT）後に正常化した。ECTは海馬の結合をDMN優位から感覚運動優位へと切り替え、その効果は治療反応の良さと密接に関連した。<br><br>うつ病患者の頭蓋内記録でも、海馬とDMNのシータ同期に同様の変動が見られ、症状の変動を数時間から数日の単位で追跡した。これらの結果は、うつの気分変動の背景にある動的な皮質―海馬の機序を特定し、ECTのような神経調整治療が海馬ネットワークの動的均衡の回復を通じて働くことを示す。出典：medRxiv","timestamp":1791849600000,"title":"Discrete cortico-hippocampal circuit states underlie mood state transitions in depression","titleJa":"うつの気分変動を支える海馬回路の二つの状態――デフォルトモード結合と感覚運動結合の切り替え","url":"https://www.medrxiv.org/content/10.64898/2026.10.11.26365174"},{"authors":["Ellinghorst, A.","Dellert, T.","Zhu, Y.","Straube, T.","Dykstra, A. R.","Schlossmacher, I."],"categories":[],"field":"bioRxiv","genre":"Consciousness / Neuroscience","monthKey":"2026-10","publishedAt":"2026-10-12T00:00:00Z","source":"bioRxiv","summaryHtml":"聴覚処理において、知覚、逸脱の処理、知覚後の課題要求を支える神経過程の関係はよく分かっていなかった。本研究はマルチトーン・マスキングと「無報告・不注意性難聴」パラダイムを用い、聴覚の知覚的気づき、逸脱処理、課題要求の神経相関を切り分けた。物理的に同一の標的音ペアへの誘発反応を、指示だけが異なる三つの段階で記録した。段階Aでは参加者は標的音を知らず気づいていない状態、段階Bでは標的音を知らされ気づいている状態、段階Cでは気づいたうえで二音のあいだの無音区間の長さを判断する課題関連の状態である。<br><br>気づいているとき、標的音は聴覚気づき陰性電位とP3時間窓での陽性増大を引き起こし、課題関連になるとさらに大きくなった。逸脱刺激は段階Cで最も大きいものの、すべての課題条件でミスマッチ陰性電位を引き起こした一方、逸脱に対する有意なP3は段階Cでのみ観察された。<br><br>初期反応と後期反応は、気づき・逸脱・課題関連性によって独立に調整されうることが示された。時空間プロファイルが重なっていても、両者が必ずしも共通の神経メカニズムに依存するわけではない。知覚的気づきの神経基盤を、報告や課題の要求から切り離して捉えるための手がかりを与える研究である。","timestamp":1791763200000,"title":"Identifying neural correlates of auditory perceptual awareness and deviance using a no-report inattentional deafness paradigm","titleJa":"聴覚の知覚的気づきと逸脱の神経相関を同定する――無報告・不注意性難聴パラダイムによる検証","url":"https://www.biorxiv.org/content/10.64898/2026.10.05.755932"},{"authors":["Brooke L Sevchik","S Parker Singleton","Analiese Lahey","Pim Cuijpers","Mathias Harrer","Megan T Jones","Sandeep M Nayak","Eric C Strain","Simon N Vandekar","David B Yaden","Robert H Dworkin","J Cobb Scott","Theodore D Satterthwaite"],"categories":["MDMA","PTSD","psychedelic therapy"],"field":"Neuropsychopharmacology","genre":"Psychedelics / Therapy","monthKey":"2026-10","publishedAt":"2026-10-11T00:00:00Z","source":"PubMed","summaryHtml":"MDMAは心的外傷後ストレス障害（PTSD）の治療薬候補として浮上したが、急速に変化するエビデンスを統合するのは難しい。本研究はMDMAによるPTSD治療に関する「生きた」システマティックレビューと、オープンデータのメタ分析資源を提示する。初回リリースでは286名を含む6件の無作為化比較試験がデータベースに収録され、すべてがMAPS（多分野サイケデリック研究協会）の支援によるものだった。<br><br>逆分散ランダム効果モデルによるメタ分析では、対照条件と比べてMDMA補助療法（MDMA-AT）がPTSD症状をより大きく軽減した（Hedges' g = −0.71）。プラセボと比較すると奏効率は1.35倍、寛解率は2.25倍だった。用量変数のメタ回帰も検討された。収録研究の多くはコクランの基準でバイアスリスクが低いとされたが、期待効果、機能的盲検解除、実施上の課題、安全性といった分野特有の問題は捉えきれていないとし、全体の確実性はGRADE評価で「低」とされた。<br><br>結論として、MDMA-ATはこれまでの研究全体でPTSD症状の短期的な減少をもたらすことが示唆された。本レビューとメタ分析、データベース、オンラインダッシュボード（sypres.io）はエビデンスの出現とともに更新され続け、急速に変化する分野の研究者に開かれた透明な資源となる。","timestamp":1791676800000,"title":"A living systematic review, meta-analysis, and open data resource of trials of MDMA-assisted therapy for PTSD.","titleJa":"MDMA補助療法の生きたシステマティックレビュー――PTSD試験のメタ分析とオープンデータ資源","url":"https://pubmed.ncbi.nlm.nih.gov/42860436/"},{"authors":["Mikulan, E.","Zauli, F. M.","Russo, S.","Mannini, F.","Del Vecchio, M.","Albertini, D.","d'Orio, P.","Nobili, L.","Sartori, I.","Massimini, M.","Avanzini, P.","Pigorini, A."],"categories":[],"field":"biorxiv","genre":"Consciousness / Neuroscience","monthKey":"2026-10","publishedAt":"2026-10-11T00:00:00Z","source":"bioRxiv","summaryHtml":"人が触覚刺激を意識的に知覚するとき、脳内で何が起きているのかは未解明のままだった。頭皮脳波の研究では、刺激開始から120〜200ミリ秒後に現れる陰性成分N140が、近年は体性感覚気づき陰性電位（N140/SAN）として触覚の気づきのマーカー候補とされてきたが、その背後にある神経ダイナミクスは分かっていなかった。一方、頭蓋内の研究では、正中神経刺激への応答として、一次体性感覚野での初期の位相性活性化のあと、島・弁蓋部を中心とする持続的な広帯域高周波活動（BHA、50〜150Hz）が触覚の気づきと結びつくことが示されていた。<br><br>しかし頭皮上のN140/SANと頭蓋内のBHAという二つのシグネチャが直接結びつけられたことはなかった。本研究は高密度頭皮脳波と頭蓋内脳波の同時記録により、N140/SANが、BHA応答に続く島・弁蓋部の局所場電位の頭皮への現れであることを示した。<br><br>侵襲的記録と非侵襲的記録を橋渡しすることで、N140/SANの神経起源を同定し、触覚の気づきに関する頭皮と頭蓋内の相関を結びつけた。意識の神経相関を、異なる計測手法のあいだで直接対応づけた研究である。","timestamp":1791676800000,"title":"Simultaneous recordings link intracranial and scalp correlates of somatosensory awareness in humans","titleJa":"触覚の気づきの神経基盤をつなぐ――頭皮脳波と頭蓋内記録の同時計測による検証","url":"https://www.biorxiv.org/content/10.64898/2026.10.03.756393"},{"authors":["Michael S. A. Graziano"],"categories":[],"field":"Proceedings of the National Academy of Sciences","genre":"Consciousness / Philosophy","monthKey":"2026-10","publishedAt":"2026-10-09T00:00:00Z","source":"Crossref","summaryHtml":"人間の認知は、記憶や意思決定、注意といった機能の遂行だけではない。脳はそれらの認知機能について概略的なモデル（スキーマ）も作り、それを使って機能を監視し、予測し、部分的に制御している。内省するとき、私たちが「自分が何者で、内側で何が起きているか」を理解するのは、実際の認知機能そのものからではなく、こうした概略的でときに不正確だがおおむね役に立つモデルからだという。本論文は、著者が以前に提唱した注意スキーマ理論を拡張し、内省的に知られる心を、相互作用する自己スキーマの社会として捉える一般的なスキーマ理論を提案する。<br><br>論文は五つの自己スキーマに焦点を当てる。注意スキーマは、鮮明な仕方で対象をとらえる意識的な心が存在するという直観を生む。意思決定スキーマは、意思決定過程についての単純化された、ときに作り話めいた説明を生成し、行為主体性や意志についての直観的な理解を与える。感情スキーマは身体の生理的状態を複雑に解釈し、感情経験の理解をもたらす。身体スキーマは物理的存在としての自己理解を支え、ペルソナは感情的・社会的・道徳的な性格の理解と行動の枠組みを与える。<br><br>著者は、機械における意識にも同様の目的で使われる自己スキーマのまとまりが必要であり、すでに部分的に存在している可能性もあると論じる。意識を単一の機能ではなく、自己をモデル化する複数のスキーマの協働として捉え直すことで、生物の意識と人工の意識を同じ枠組みで議論する道を開く提案である。","timestamp":1791504000000,"title":"Understanding consciousness (biological and artificial) as a society of self-schemas","titleJa":"意識を「自己スキーマの社会」として理解する――生物と人工の意識に共通する枠組み","url":"https://doi.org/10.1073/pnas.2628598123"},{"authors":["Elisha E","Peled-Laskov R","Or O"],"categories":["trauma","PTSD","institutional betrayal","posttraumatic growth"],"field":"European journal of psychotraumatology","genre":"Consciousness / Neuroscience","monthKey":"2026-10","publishedAt":"2026-10-08T00:00:00Z","source":"Europe PMC","summaryHtml":"2023年10月7日、ハマスによる大規模な奇襲攻撃では、ノヴァ音楽フェスティバルの会場も襲撃され、数百人の参加者が殺害または拉致された。生存者の初期の反応については研究が蓄積されてきたが、襲撃から時間が経った後の長期的な適応についてはあまり知られていなかった。本研究は、襲撃から約18か月後の生存者を対象に、制度の対応や回復の資源、前向きな変化の実感を振り返ってもらうことで、持続的な脅威のもとでの心的外傷後の適応を調べた。<br><br>方法は、成人した生存者15人への半構造化インタビューを現象学的な視点から分析する質的研究である。初期のコーディングは帰納的・意味論的に行い、その後の解釈には、持続的外傷ストレス、制度的裏切り、回復資本、外傷後成長という4つの視点を用いた。分析から、多面的な脆弱性、回復の資源、実感された前向きな変化という3つの相互に関連したテーマが浮かび上がった。<br><br>すべてのテーマに共通していたのは、生存者が自ら資源を動員し、適応を能動的に形作ろうとする個人の主体性だった。一方で、制度の裏切りは継続的な「二次的な傷」として浮かび上がり、生存者自身が主導するピア・コミュニティが回復の重要な資源となっていた。集団的なトラウマの後では、制度への信頼とコミュニティに根ざした支援が重要であることを示す知見である。","timestamp":1791417600000,"title":"Institutional betrayal and posttraumatic adaptation among Nova festival survivors following the 7 October 2023 attack.","titleJa":"制度的裏切りと心的外傷後の適応――2023年10月7日の襲撃を生き延びたノヴァ・フェスティバルの生存者たち","url":"https://europepmc.org/article/MED/42847151"},{"authors":["Thomas Kallstenius","Basil Duvernoy","Adam Kallstenius","Andrea Johansson Capusan","Adam Williamson"],"categories":[],"field":"JMIR Mental Health","genre":"Ethics / Safety","monthKey":"2026-10","publishedAt":"2026-10-08T00:00:00Z","source":"JMIR Mental Health","summaryHtml":"メンタルヘルスの不調は世界の障害の大きな要因だが、AIによる支援の普及に安全性評価が追いついていない。汎用大規模言語モデルは、自殺念慮を示す自然な文章を見落とすことがあり、臨床的に重大な結果を招きうる。本研究は、症状に即した語彙特徴を用いる専門的な自然言語処理分類器と、微調整した大規模言語モデルを組み合わせたアンサンブルを初めて体系的に評価した。<br><br>RedditとTwitterの公開テキスト60889件（不安、双極性障害、うつ、正常、パーソナリティ障害、ストレス、自殺念慮、ADHD、自閉スペクトラム症の9カテゴリ）を対象に、プロンプト型GPT-4o-mini、微調整GPT-4o-mini、専門分類器（SVM）、2種類のアンサンブルという5手法を比較した。専門分類器は91.9％の正答率で、ベースモデル（58.7％）と微調整モデル（88.6％）を上回った。<br><br>2つのアンサンブルは構成要素のどちらをも上回り、分類器60％・微調整モデル40％の重みで93.9％（ソフト融合）と93.8％（ハイブリッド融合）に達した。ハイブリッド融合では自殺念慮カテゴリの見逃し率が32.5％から1.9％へと17.6分の1に減った。ただしラベルはコミュニティから推定したもので臨床診断ではなく、単一コーパスの結果のため、意思決定支援への利用には臨床的に特徴づけられたデータでの外部検証が必要だと著者らは結論づけている。出典：JMIR Mental Health","timestamp":1791417600000,"title":"Ensemble of Domain-Specific Natural Language Processing and Large Language Models for Detecting Suicidal Ideation and Mental Health Conditions in Social Media Text: Development and Evaluation Study","titleJa":"自殺念慮の見逃しを減らす――専門的自然言語処理と大規模言語モデルのアンサンブルによるSNSテキストのメンタルヘルス分類","url":"https://mental.jmir.org/2026/1/e98925"},{"authors":["Mikołaj Sienicki","Krzysztof Sienicki"],"categories":["cs.AI","cs.CY","cs.HC"],"field":"cs.AI","genre":"Ethics / Safety","monthKey":"2026-10","publishedAt":"2026-10-06T07:28:29Z","source":"arXiv","summaryHtml":"高度なAIが人類の絶滅、不可逆的な文明の崩壊、あるいは恒久的な人間の無力化にどう寄与しうるのか。本論文は、その問いに対する失敗モードの枠組みを提示する。中心的な主張は、破滅的なAIリスクは、意識や敵意、人類に危害を加えるという明示的な意図を必要としないということだ。リスクは、自律的なミスアライメント、有害な人間による利用、組織の失敗、競争的な配備といった、互いに異なりつつ相互作用する複数の経路を通じて生じうる。各経路の深刻さは、能力、自律性、外部へのアクセス、持続性、制度的な安全策、回復能力の保全といった要因に依存する。<br><br>分析は意図的に非操作的である。危害を引き起こす手順を示すのではなく、因果的条件、経験的に扱いやすい中間的な量、防御のための研究課題を特定する。破滅リスクを「AIが人類を憎むから起きる」という物語から切り離し、意図がなくても構造的に起きうる失敗として整理した点が特徴だ。<br><br>AI安全の議論を、動機の推測ではなく観測可能な条件と防御策の設計へとつなげる枠組みとして、文明規模のリスク評価の土台を提供する論考である。","timestamp":1791271709000,"title":"How Could AI Eliminate Humanity? A Failure-Mode Analysis of Civilizational Risk","titleJa":"AIはいかにして人類を滅ぼしうるか――文明リスクの失敗モード分析","url":"https://arxiv.org/abs/2610.08878"},{"authors":["Robin L Carhart-Harris"],"categories":["consciousness","brain entropy","psychedelic"],"field":"Brain","genre":"Consciousness / Neuroscience","monthKey":"2026-10","publishedAt":"2026-10-05T00:00:00Z","source":"PubMed","summaryHtml":"2014年に提唱され、2018年に改訂されたエントロピック・ブレイン（脳のエントロピー）仮説は、その後多くの支持的証拠を集めてきた。本仮説は、「現象的意識の大きさ」という次元に沿って、拡張的な状態では脳のエントロピーが確実に増加し、意識がない、あるいは低下した状態ではその逆が当てはまるとする。拡張的な状態の例としては、熟練した瞑想、フリッカー光刺激、臨死様体験、非定型的な呼吸、レム睡眠、発作前兆、無投薬の早期精神病、サイケデリック薬物による状態が挙げられる。逆に低エントロピーの状態としては、意識障害、深い睡眠、麻酔、発作、脳卒中後、加齢、認知障害、神経変性疾患が挙げられる。<br><br>本論文は、この仮説が収束的妥当性、相関的妥当性、予測的妥当性、弁別的妥当性、外的妥当性を備えることを示す。予測的妥当性については、支持的な文脈でのシロシビン投与下における脳エントロピーの増加が、その後の精神的健康の改善（投与1か月後のウェルビーイング向上）を予測する。弁別的妥当性については、脳エントロピーの変化が、覚醒度のような他の次元ではなく「主観的体験の幅」を選択的に指標することが示された。外的妥当性としては、エントロピー関連の関数が生成AIにも応用されている。<br><br>結論として、エントロピック・ブレインは意識状態の有用なモデルである。意識の広がりを脳のエントロピーという単一の指標で捉える枠組みは、瞑想からサイケデリック、睡眠、神経疾患までを横断する意識研究の整理軸となり、臨床と理論の双方に示唆を与える。","timestamp":1791158400000,"title":"The entropic brain today.","titleJa":"エントロピック・ブレインの現在――意識の広がりを測る脳エントロピー仮説","url":"https://pubmed.ncbi.nlm.nih.gov/42266156/"},{"authors":["Wiesław L. Galus","Janusz A. Starzyk"],"categories":["q-bio.NC"],"field":"q-bio.NC","genre":"Consciousness / Neuroscience","monthKey":"2026-10","publishedAt":"2026-10-02T21:10:01Z","source":"arXiv","summaryHtml":"ラメの再帰処理理論（RPT）は、フィードフォワードの掃引が視覚特徴を無意識に抽出・分類し、意識的な視覚は表象レベル間の再帰処理とフィードバック相互作用を通じて生まれるとする。本論文は、ガルスとスタジクによる動機づけられた感情的心（MEM）モデルがこの核を保ちつつ、多層ネットワーク、半階層的なセンブリオン、受容器、効果器、アロスタシス、感情的評価、記憶にもとづく感覚再構成を統合した身体化されたアーキテクチャに組み込むことを示す。RPTが知覚の組織化における再帰の役割と意識的視覚への移行を説明するのに対し、MEMは再帰処理の内容、その受容器活動と身体状態への接地、記憶や行為との相互作用、そして現象的経験における再構成された感覚表象の役割を扱う。<br><br>とりわけ強調されるのは二次知覚である。感覚・内受容マップをトップダウンで再構成することで、記憶、心像、夢、幻覚、感情、観察された場面が経験の形をとる。MEMは現象性を、単なる再帰活動や報告可能性ではなく、モダリティ特異的で受容器に接地した感覚・身体内容の再構成に結びつける。論文はまた、再入処理、表象競合、アロスタシス、情動、好奇心、手続き的ギャップ、行為選択を形式化したMEMの数理モデルも提示する。<br><br>結論として、MEMはRPTの身体化され動機づけられた拡張とみなせる。ただし、二次知覚が現象性にとって十分であるという主張や、センブリオンの微細構造といった独自の主張は、因果的検証を要する仮説の段階にとどまる。意識の内容がどのようにして経験になるのかを、動機と身体の観点から説明しようとする理論的提案である。","timestamp":1790975401000,"title":"MEM as an Extension of Recurrent Processing Theory: Toward a Motivational Account of Consciousness","titleJa":"動機づけられた心――再帰処理理論を拡張する意識の動機的説明","url":"https://arxiv.org/abs/2610.04057"},{"authors":["Longin L","Karpus J","Meertens N","Bahrami B","Deroy O"],"categories":["consciousness","experimental philosophy"],"field":"Cognition","genre":"Consciousness / Philosophy","monthKey":"2026-10","publishedAt":"2026-10-01T00:00:00Z","source":"Europe PMC","summaryHtml":"人工システムはますます人間に似た振る舞いをするようになっている。だが、それだけで私たちは人工システムを意識的だとみなすのだろうか。本論文は二つの可能性を対比する。一つは機能主義的な帰属で、環境への応答が適切であるほど、相手が人間でも人工物でも意識的だとみなすというもの。もう一つは本質主義的な帰属で、人工システムが人間と同じくらい適切に応答しても、意識は低いと判断するというもの。さらに、この傾向が意識に特有なのか、気づきのような関連概念にも広がるのかを問う。<br><br>事前登録された2組の研究（5実験、参加者1092人）では、英国の参加者が空間的・社会的・時間的な環境特徴への応答性が異なる人間または人工エージェントのシナリオを読み、その意識と気づきを評価した。その結果、意識の帰属は本質主義的な論理に従った。応答性が同程度でも、参加者は一貫して人間の方により大きな意識を帰属させた。<br><br>一方、気づきの帰属は機能主義的なパターンを示した。人間でも人工エージェントでも、応答性が高まるにつれて気づきの評価は着実に上がった（ただし最高水準では人間がより気づいていると評価された）。つまり人々は、心的概念ごとに異なる推論規則を用いている。意識はエージェントが何であるかに、気づきはエージェントが何をするかに依存すると扱われる、という知見である。","timestamp":1790812800000,"title":"AI is not as conscious as humans: Essentialism in mental state attributions to artificial systems","titleJa":"AIは人間ほど意識があるとは見なされない――心的状態の帰属における本質主義","url":"https://europepmc.org/article/MED/42822076"},{"authors":["Keith J. Holyoak","Martin M. Monti"],"categories":["cs.AI"],"field":"cs.AI","genre":"Consciousness / Philosophy","monthKey":"2026-10","publishedAt":"2026-10-01T00:00:00Z","source":"arXiv","summaryHtml":"何が意識を持つのか。主観的体験は一人称でのみ直接知ることができ、他者の意識についての判断は類推に頼らざるを得ない。これまで類推は主に人間以外の動物を対象としてきたが、AIの進歩により意識を持つAIの可能性が現実の問いとなった。意識の有無を直接確かめる手段がない以上、推論の質そのものを問わなければならず、本論文はそうした類推による証拠を評価するための因果的枠組みを展開する。<br><br>鍵となる区別は、意識を生み出すことに関与しうる要因の類似性と、行動や認知といった下流の効果の類似性である。たとえば同じ行動を示す二つの存在でも、その行動を生み出す因果構造が異なれば、意識についての証拠の重みも変わる。この枠組みは、因果的関連性によって類似性を重みづけし、未知の原因、無効化する差異、意識への別の経路も許容する。生物に適用すれば、類推による支持は人間からの因果的距離が大きくなるにつれて弱まることが説明できる。<br><br>現代のAIに適用すると、行動の類似性だけでは意識の証拠として限定的だという結論になる。関連する因果的対応が十分に確立されていないためである。意識を生み出す仕組みの側の類似性を示す証拠がそろって初めて、行動の類似性は強い根拠になる。この枠組みはまた、人工意識の主張を強めるにはどのような証拠が必要かを明確にする。<br><br>出典： arXiv","timestamp":1790812800000,"title":"What Can Analogy Tell Us About Artificial Consciousness?","titleJa":"類推は何を教えてくれるか――人工意識をめぐる証拠の評価法","url":"https://arxiv.org/abs/2610.01002"}],"updatedAt":"2026-11-12T19:07:32Z","version":1};
    const byId = id => document.getElementById(id);
    const norm = s => String(s||'').toLowerCase().normalize('NFKC').replace(/\s+/g,' ').trim();
    const esc = s => String(s||'').replace(/[&<>"]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
    const plainText = h => String(h||'').replace(/<br><br>/g,' ').replace(/<[^>]+>/g,'');
    const months = [...new Set((DATA.articles||[]).map(a => a.monthKey).filter(Boolean))].sort().reverse();
    const genres = [...new Set((DATA.articles||[]).map(a => a.genre).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'ja'));
    const fields = [...new Set((DATA.articles||[]).map(a => a.field).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'ja'));
    function fill(select, values){ values.forEach(v=>{ const o=document.createElement('option'); o.value=v; o.textContent=v; select.appendChild(o); }); }
    fill(byId('month'), months); fill(byId('genre'), genres); fill(byId('field'), fields);
    // ---- filter persistence: URL query params win over localStorage ----
    const FILTER_IDS = ['month','genre','field','sort','pageSize'];
    const LS_KEY = 'rd-filters-v1';
    function readUrlState(){ try { const p = new URLSearchParams(location.search); const s = {}; let any = false; FILTER_IDS.concat(['keyword']).forEach(id=>{ if (p.has(id)) { s[id] = p.get(id); any = true; } }); return any ? s : null; } catch(e){ return null; } }
    function readLsState(){ try { return JSON.parse(localStorage.getItem(LS_KEY) || 'null'); } catch(e){ return null; } }
    function applyState(s){ if (!s) return; FILTER_IDS.forEach(id=>{ if (s[id] != null) byId(id).value = s[id]; }); if (s.keyword != null) byId('keyword').value = s.keyword; }
    function currentState(){ const s = {}; FILTER_IDS.forEach(id=>{ s[id] = byId(id).value; }); s.keyword = byId('keyword').value; return s; }
    function persist(){ const s = currentState(); try { localStorage.setItem(LS_KEY, JSON.stringify(s)); } catch(e){} try { const p = new URLSearchParams(); Object.keys(s).forEach(k=>{ if (s[k]) p.set(k, s[k]); }); const q = p.toString(); history.replaceState(null, '', q ? '?' + q : location.pathname); } catch(e){} }
    applyState(readUrlState() || readLsState());
    // ---- summary folding ----
    const FOLD_CHARS = 180;
    const expanded = new Set();
    let currentPage = 1;
    function render(){
      const month=byId('month').value, genre=byId('genre').value, field=byId('field').value, sort=byId('sort').value, kw=norm(byId('keyword').value);
      let rows=(DATA.articles||[]).filter(a=>{
        if(month&&a.monthKey!==month) return false; if(genre&&a.genre!==genre) return false; if(field&&a.field!==field) return false;
        const hay=norm([a.titleJa,a.title,a.summaryHtml,a.authors.join(' '),a.categories.join(' ')].join(' '));
        if(kw&& !hay.includes(kw)) return false; return true;
      });
      rows = rows.slice().sort((a,b)=> sort==='oldest' ? a.timestamp-b.timestamp : sort==='title' ? a.titleJa.localeCompare(b.titleJa,'ja') : b.timestamp-a.timestamp);
      const pageSize = parseInt(byId('pageSize').value, 10) || 0;
      const totalPages = pageSize ? Math.max(1, Math.ceil(rows.length / pageSize)) : 1;
      if (currentPage > totalPages) currentPage = totalPages;
      if (currentPage < 1) currentPage = 1;
      const pageRows = pageSize ? rows.slice((currentPage - 1) * pageSize, currentPage * pageSize) : rows;
      byId('pageInfo').textContent = rows.length ? `${currentPage} / ${totalPages} ページ` : '0 / 0 ページ';
      byId('prevPage').disabled = currentPage <= 1;
      byId('nextPage').disabled = currentPage >= totalPages;
      byId('meta').textContent = `更新: ${DATA.updatedAt || '-'} / 表示件数: ${rows.length}件`;
      byId('emptyState').style.display = rows.length ? 'none' : 'block';
      byId('list').innerHTML = pageRows.map(a=>{
        const plain = plainText(a.summaryHtml);
        const isLong = plain.length > FOLD_CHARS;
        const open = expanded.has(a.url);
        const summaryHtml = (!isLong || open) ? (a.summaryHtml || '') : esc(plain.slice(0, FOLD_CHARS)) + '…';
        const btn = isLong ? `<button type="button" class="summary-toggle" data-url="${esc(a.url)}" aria-expanded="${open}">${open ? '閉じる' : '続きを読む'}</button>` : '';
        return `
        <article>
          <p class="meta">${esc(a.source)}　${esc(a.publishedAt.slice(0,10))}</p>
          <h2 class="article-title">${esc(a.titleJa)}</h2>
          <div class="taxonomy"><span class="chip">${esc(a.genre)}</span><span class="chip">${esc(a.field)}</span>${a.categories.slice(0,4).map(c=>`<span class="chip">${esc(c)}</span>`).join('')}</div>
          <div class="summary">${summaryHtml}</div>${btn}
          <div class="source-box"><strong>ソース・引用元</strong>配信元：${esc(a.source)}<br>原題：${esc(a.title)}<br>著者：${esc(a.authors.join(', '))}<br>原文URL：<a href="${esc(a.url)}" target="_blank" rel="noopener">${esc(a.url)}</a></div>
        </article>`;
      }).join('');
    }
    function resetAndRender(){ currentPage = 1; persist(); render(); }
    ['month','genre','field','sort','pageSize'].forEach(id=>byId(id).addEventListener('change',resetAndRender)); byId('keyword').addEventListener('input',resetAndRender);
    byId('prevPage').addEventListener('click',()=>{ if(currentPage>1){ currentPage--; render(); } });
    byId('nextPage').addEventListener('click',()=>{ currentPage++; render(); });
    byId('list').addEventListener('click',e=>{
      const btn = e.target && e.target.closest ? e.target.closest('.summary-toggle') : null;
      if (!btn) return;
      const u = btn.getAttribute('data-url');
      if (expanded.has(u)) expanded.delete(u); else expanded.add(u);
      render();
    });
    byId('resetFilters').addEventListener('click',()=>{
      byId('month').value=''; byId('genre').value=''; byId('field').value=''; byId('sort').value='newest'; byId('keyword').value=''; byId('pageSize').value='20';
      try { localStorage.removeItem(LS_KEY); } catch(e){}
      try { history.replaceState(null, '', location.pathname); } catch(e){}
      currentPage = 1; render();
    });
    render();
  </script>
