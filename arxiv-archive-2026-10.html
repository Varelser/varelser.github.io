  <script>
    const DATA = {"version": 1, "updatedAt": "2026-11-09T05:35:18Z", "articles": [{"authors": ["Byong Chul Park"], "categories": [], "field": "Korean Journal of General Education", "genre": "Philosophy", "monthKey": "2026-10", "publishedAt": "2026-10-31T00:00:00Z", "source": "Crossref", "summaryHtml": "韓国の大学で教養教育として哲学がどのように教えられてきたか――本稿はその発展の歩みをたどり、現状を検討して今後の課題を明らかにする。哲学は植民地時代に高等教育へ導入され、解放後の1953年教育法施行令で「哲学概論」が法定必修科目に指定された。論文はそれ以来の教養教育における哲学の位置づけの変遷をたどる。<br><br>2025年時点の哲学教育の実態を把握するため、全国60大学を対象に調査を行い、開講されている哲学科目の数と種類、担当教員の雇用状況を分析した。調査の焦点は、1990年代を通じて韓国の哲学界で繰り返し提起されてきた、教養教育としての哲学をめぐる問題がどの程度解決されたかにある。科目の設置状況と担い手の実態を数量的に把握することで、制度としての哲学教育の現在地を描き出す。<br><br>分析の結果、論文は教養教育としての哲学が、学問としての哲学の持続的な発展に不可欠な役割を果たすと結論づける。哲学が教養科目として学生に開かれ続けることが、哲学という学問分野そのものを支える土台になるという見方である。全国調査の結果を踏まえ、過去に指摘された課題の解消状況を検証し、哲学教育が今後向き合うべき課題を提示している。", "timestamp": 1793404800000, "title": "Philosophy as General Education in Korean Universities : Past, Present, and Challenges Ahead", "titleJa": "韓国大学における教養教育としての哲学――過去・現在・今後の課題", "url": "https://doi.org/10.46392/kjge.2026.20.5.397"}, {"source": "PubMed", "title": "MDMA-Assisted Therapy for Veterans with Comorbid Posttraumatic Stress Disorder and Alcohol Use Disorder: Clinical Outcomes from the First Open-Label Pilot Trial.", "titleJa": "退役軍人のPTSDとアルコール使用障害に対するMDMA補助療法――初のオープンラベル試験", "summaryHtml": "心的外傷後ストレス障害（PTSD）とアルコール使用障害（AUD）の併存は、米国の退役軍人に多くみられ、どちらか一方だけの場合より症状が重く、機能障害が大きく、治療成績も悪い。既存の治療は効果が限定的で、治療への参加の継続や改善の持続が課題となってきた。本研究は、PTSDとAUDを併せ持つ退役軍人10名を対象に、MDMA補助療法の実現可能性・安全性・忍容性と予備的な臨床転帰を調べた初のオープンラベル試験である。準備3回、MDMA投与セッション2回、統合6回の計11回のセッションを行い、4週間追跡した。<br><br>登録した参加者の90％が治療を完了し、PTSD症状は有意に軽減した（p = 0.006、効果量 d = 1.241）。飲酒量も記述的には減少し、飲酒日1日あたりの飲酒量が31％、大量飲酒日が54％減ったが、統計的な有意差には至らなかった。重篤な有害事象はなく、現れた有害事象はプロトコール下で想定されるMDMAの急性効果の範囲内だった。物質使用の指標は、アルコールや他の物質の使用の体系的な増加を示さず、コカイン使用の再発が1名で報告されたのみだった。<br><br>結果は、PTSDとAUDを併せ持つ退役軍人に対するMDMA補助療法の安全性と実施可能性を支持し、PTSD症状と飲酒関連アウトカムの改善を示す予備的な証拠となった。著者らは、効果の持続性や便益とリスクの全体像を確かめるには、より大規模なランダム化比較試験が必要だと結論づけている。", "url": "https://pubmed.ncbi.nlm.nih.gov/42962981/", "publishedAt": "2026-10-30T00:00:00Z", "authors": ["Erica Eaton", "Christy Capone", "Brian J Gully", "Lewis Nunez Severino", "Mollie A Monnig", "Michael S Worden", "Robert M Swift", "Carolina L Haass-Koffler"], "categories": ["MDMA-assisted therapy", "PTSD", "alcohol use disorder", "veterans"], "field": "Alcohol", "genre": "Psychedelics / Therapy", "timestamp": 1793318400000, "monthKey": "2026-10"}, {"source": "PubMed", "title": "The Fireside Database: Large-scale evidence from 25,419 psychedelic support interactions.", "titleJa": "Fireside Database――25,419件のサイケデリック・サポートから得た大規模な証拠", "summaryHtml": "サイケデリック体験の多くは臨床の場の外で起きている。非臨床的使用を認める政策枠組みが急速に広がる一方で、誰がどのような状況で支援を求め、何が支援を有効にするのかを示す体系的なデータはなかった。本研究は、米国のFireside Projectによるサイケデリック・サポートラインで、2021年4月から2026年2月に220人の訓練されたボランティアが行った25,419件のピアサポートのやり取りを統合した「Fireside Database」を提示する。<br><br>このデータベースは、構造化されたやり取りの記録とボランティアが付与したメタデータ、2,777件の利用者満足度調査を5つのアウトカム次元にわたって統合したものだ。報告された物質で最も多かったのはシロシビンで、コード化されたやり取りの59.9％を占めた。一方、苦痛の割合が最も高かったのは大麻で47.2％だった。50人のサポーターがそれぞれ10件以上の調査付きやり取りを担当する入れ子構造により、支援者個人の効果を利用者の転帰に結びつける多層モデリングが可能になっている。<br><br>このリソースは、サイケデリックの疫学、根拠に基づく訓練設計、そしてどのような心理的支援が有効なのかを調べる研究を可能にする。臨床の外で起きているサイケデリック体験への支援の実態を、大規模なデータで初めて可視化した取り組みである。", "url": "https://pubmed.ncbi.nlm.nih.gov/42962007/", "publishedAt": "2026-10-30T00:00:00Z", "authors": ["Felix Schoeller", "Marc Santolini", "Dana Xiadani", "Mickael Eskinazi", "Ashwin Murali", "David Esselman", "Wyatt Houtz", "Wesley Bellanca", "Joshua White"], "categories": ["psychedelics", "peer support", "harm reduction"], "field": "Science advances", "genre": "Psychedelics / Therapy", "timestamp": 1793318400000, "monthKey": "2026-10"}, {"authors": ["Schoeller F", "Santolini M", "Xiadani D", "Eskinazi M", "Murali A", "Esselman D", "Houtz W", "Bellanca W", "White J"], "categories": ["psychedelic", "peer support", "psilocybin", "cannabis", "harm reduction"], "field": "Science advances", "genre": "Psychedelics / Therapy", "monthKey": "2026-10", "publishedAt": "2026-10-30T00:00:00Z", "source": "Europe PMC", "summaryHtml": "サイケデリック体験の多くは臨床の場の外で起きている。非臨床利用を認める政策枠組みが広がるなかで、誰がどのような状況で支援を求め、どのような支援が有効なのかを体系的に示すデータはこれまで存在しなかった。本論文は、米国のファイアサイド・プロジェクトが運営するサイケデリック・サポートラインで、2021年4月から2026年2月にかけて訓練を受けた220人のボランティアが行った25,419件のピアサポート相談を統合したデータベースを公開する。<br><br>データには構造化された相談記録とボランティアによるメタデータに加え、5つの成果指標にわたる2,777件の利用者満足度調査が含まれている。報告された物質で最も多かったのはシロシビン（59.9％）で、苦痛の割合が最も高かったのは大麻（47.2％）だった。10件以上の調査付き相談を担当した50人のサポーターのデータ構造により、支援者ごとの効果の違いを多層モデルで分析できる。<br><br>このデータベースは、サイケデリックの疫学研究、エビデンスに基づく研修の設計、心理的支援を有効にする要因の解明に役立つ基盤となる。臨床外のサイケデリック利用が広がるなかで、支援の実態を大規模データで初めて可視化した意義がある。", "timestamp": 1793318400000, "title": "The Fireside Database: Large-scale evidence from 25,419 psychedelic support interactions.", "titleJa": "ファイアサイド・データベース――25,419件のサイケデリック支援相談から見えたもの", "url": "https://europepmc.org/article/MED/42962007"}, {"source": "PubMed", "title": "Evolutionary neuropharmacology of serotonergic psychedelics: a cross-species perspective on mechanisms, consciousness, and therapeutic potential.", "titleJa": "セロトニン作動性サイケデリックスの進化的神経薬理学――種を超えた機序・意識・治療可能性", "summaryHtml": "セロトニン作動性サイケデリックスは、特定の神経精神疾患に迅速で持続的な臨床効果をもたらす可能性から精神医学研究を活性化させてきた。しかし受容体の活性化が神経可塑性や意識体験の変容、臨床的改善へとどうつながるのかは未解明の部分が多く、サイケデリック信号の進化的起源や動物モデルの翻訳的価値も議論が続いている。本総説は、進化生物学、分子薬理学、比較神経科学、計算精神医学を統合し、生物学的スケールを横断する統一的な枠組みを提示する。<br><br>予測処理と「サイケデリックス下での信念の緩和（REBUS）」の枠組みに基づき、サイケデリックスが階層的推論を一時的に組み替える仕組みを論じる。無脊椎動物から非ヒト霊長類までの比較から、保存された受容体薬理と種特異的な回路編成が共存することが示され、動物モデルはヒトの幻覚体験の直接の代理ではなく、分子・細胞・計算レベルの機序を探る補完的な手段として解釈すべきだとする。<br><br>さらに、バイアスのかかった受容体シグナル伝達や非幻覚性の精神可塑性促進物質（サイコプラストゲン）が、可塑性に関わる治療作用と幻覚作用を部分的に切り離せる可能性を示す前臨床および臨床応用に向けた初期の証拠も論じる。受容体薬理から神経可塑性、回路計算、治療転帰までをつなぐ機序的枠組みとして、次世代サイケデリック治療薬の開発に向けた概念的・実験的な戦略を提示した総説である。", "url": "https://pubmed.ncbi.nlm.nih.gov/42957826/", "publishedAt": "2026-10-28T00:00:00Z", "authors": ["Haojiang Zhai", "Hongshuang Wang", "Yibo Wang", "Xiaohui Wang"], "categories": ["serotonergic psychedelics", "consciousness", "evolutionary neuropharmacology"], "field": "Molecular Psychiatry", "genre": "Psychedelics / Therapy", "timestamp": 1793145600000, "monthKey": "2026-10"}, {"source": "Europe PMC", "title": "Can you feel meaning? Spirituality involves stronger sensorimotor associations with abstract concepts.", "titleJa": "意味を感じることができるか――スピリチュアリティと抽象概念の感覚運動的連合", "summaryHtml": "抽象的な概念を理解することは人間の基本的な営みだが、その知識が身体感覚とどう結びついているかは十分に解明されていない。本研究は、抽象概念と身体感覚の結びつきの強さが、存在の意味についての文化的信念によって左右されるのではないか、という仮説を検証した。とくに、現実を体験的に理解しようとする信念体系であるスピリチュアリティに注目した。<br><br>米英で実施した4つの研究（計729人）では、スピリチュアルであると自認する人ほど、高度に抽象的な概念に対して強い感覚運動的連合を示した。具体的な概念と比べた場合にその傾向が顕著だった。一方、スピリチュアリティと概念的に重なる宗教的信念は、こうした連合には寄与しなかった。<br><br>結果は、信念体系の個人差が、抽象的な思考における身体感覚への注意の向け方を導くことを示している。スピリチュアルな人は、抽象的な思考と身体経験を結びつけることで、言葉の意味を「感じる」ように理解している可能性がある。抽象概念の理解が身体感覚と切り離せないものであることを示すとともに、信念が認知のあり方を形づくる過程を実証した研究である。", "url": "https://europepmc.org/article/MED/42953342", "publishedAt": "2026-10-28T00:00:00Z", "authors": ["Zarzeczna N", "Proulx T", "Meier B", "Gutierrez-Sigut E"], "categories": ["spirituality", "embodied cognition", "abstract concepts", "sensorimotor"], "field": "Royal Society Open Science", "genre": "Consciousness / Philosophy", "timestamp": 1793145600000, "monthKey": "2026-10"}, {"source": "Hugging Face Papers", "title": "Identically Trained Language Models Break on Different Jailbreaks", "titleJa": "同じ訓練を受けた言語モデルでも破られるジェイルブレイクは違う――事前学習の実行ごとに異なる脆弱性", "summaryHtml": "ジェイルブレイクのベンチマークは通常、1つのチェックポイントだけを試し、どの攻撃に破られるかを事前学習データと安全訓練の性質として扱う。しかし同じデータで再び事前学習を行い、同じ安全訓練を施した別の実行では、同じジェイルブレイクに破られるのだろうか。本研究は、25種類の事前学習データレシピについて、3つの事前学習シードから1Bのベースモデルを作り、それぞれに同じ安全ポストトレーニング（2つのポストトレーニングシード）を施した計150モデルでこの問いを検証した。<br><br>共通のジェイルブレイク用プロンプトに対する各モデルの拒否しない割合（プロンプトごと）をペアで相関させた結果、同じ事前学習実行のコピー同士では相関は0.984とほぼ一致した。一方、事前学習シードが違うと0.811、データレシピが違うと0.779まで下がった。どのジェイルブレイクに破られるかは、データよりも事前学習の実行そのものに強く依存する。91種類の攻撃テンプレートのうち、あるチェックポイントで最も有効だったものが、新しい事前学習シードの後も最良のままでいる割合は27%にすぎず、新しいポストトレーニングシードの後では67%だった。<br><br>さらに各事前学習実行は「指紋」を残すことも示された。3,211のプロンプトに対する拒否しない割合のパターンから、そのモデルの事前学習実行を75実行の中から毎回正しく特定でき、ランダムに選んだ50プロンプトでも98%の精度で特定できた。安全性の評価は1つのチェックポイントだけでは不十分であり、事前学習のばらつきを考慮する必要があることを示す結果である。", "url": "https://arxiv.org/abs/2610.34074", "publishedAt": "2026-10-25T05:30:02Z", "authors": ["Chi-Wei Chang", "Mu-Tien Kuo", "Kuan-Wei Lee", "Meng-Hsun Tsai"], "categories": ["cs.CL", "cs.AI"], "field": "cs.CL", "genre": "Ethics / Safety", "timestamp": 1792906202000, "monthKey": "2026-10"}, {"source": "PubMed", "title": "What goes up must come down: prevalence rates, characteristics, and coping strategies concerning MDMA aftereffects.", "titleJa": "MDMA使用後の不快な余波――有病率・症状・対処法を調べた497名調査", "summaryHtml": "MDMAは心的外傷後ストレス障害（PTSD）の治療薬として研究が進む一方、使用後の急性期を過ぎてからの負の影響がどれほど一般的で、どのようなものかは議論が続いている。本研究はレクリエーション使用者を対象に、急性期後の負の影響の有病率と症状像を明らかにすることを目的とした。さらに、サプリメントや抗うつ薬が負の影響を和らげる可能性を示す前臨床研究や限定的なヒトの知見を踏まえ、対処法としての利用実態も調べた。Prolificで募集したMDMA経験者497名への横断的オンライン調査である。<br><br>参加者の74.5%が少なくとも一度は急性期後の負の影響（いわゆる「コムダウン」）を経験していた。発症は摂取から約24時間後で、平均約40時間続いた。最も多い症状は疲労（88.1%）、集中困難（85.7%）、落ち着かなさ（82.9%）、頭痛（79.7%）だった。経験者のうち14.6%が受動的な希死念慮、6.2%が能動的な希死念慮を報告した。<br><br>対処として、30.3%がサプリメント（N-アセチルシステイン、アセチル-L-カルニチン、マグネシウムが最多）、5.1%が抗うつ薬を用いており、効果の実感は中程度だった。MDMAの急性期後の負の影響はレクリエーション使用者において広く見られ、疲労や負の感情、希死念慮の上昇を伴う。著者らは、使用後に生じるリスクとしてさらなる調査が必要だと注意を喚起している。", "url": "https://pubmed.ncbi.nlm.nih.gov/42891831/", "publishedAt": "2026-10-17T00:00:00Z", "authors": ["Sean P Goldy", "Kelcy A Klein", "David B Yaden", "Sandeep M Nayak"], "categories": ["MDMA", "comedown", "psychedelic therapy"], "field": "Psychopharmacology", "genre": "Psychedelics / Therapy", "timestamp": 1792195200000, "monthKey": "2026-10"}, {"source": "medRxiv", "title": "Posttraumatic Stress Disorder Epigenome-Wide Association Studies in the Million Veteran Program", "titleJa": "PTSDのエピゲノムワイド関連解析――2万2千人の退役軍人データで探るトラウマのメチル化", "summaryHtml": "ゲノム研究によって心的外傷後ストレス障害（PTSD）の生物学的理解は進んできたが、DNAメチル化のエピジェネティックな違いは環境の影響を反映し、PTSDの発症や症状の重症度と関わる。本研究は、米国退役軍人省ミリオン・ベテラン・プログラム（MVP）の22,141人を対象にPTSDのエピゲノムワイド関連解析（EWAS）を実施した。欧州系17,674人、アフリカ系3,430人、混血アメリカ系1,037人を含み、PTSDチェックリスト（PCL-C）の17項目と再体験・回避・過覚醒のサブドメイン、臨床記録で検証済みのアルゴリズムによるPTSD診断を用いた。<br><br>生涯PTSDは9,413例、対照は27,257例だった。全PTSD特性で272のエピゲノムワイド有意なCpG部位を同定し、喫煙で調整すると28部位が残った。精神ゲノムコンソーシアムの先行EWASで報告された11部位のうち5部位を再現した。ソマトスタチン介在ニューロンで発現が低下する遺伝子群と、GABA作動性介在ニューロンで発現する遺伝子群の有意な濃縮も見られた。<br><br>さらにPTSDの症例状態は、DNAメチル化による老化の加速と有意に相関した。一方で喫煙による層別化からは、先行研究で報告されたPTSDとAHRR遺伝子のメチル化の関連が、喫煙による交絡である可能性が示唆された。複数祖先集団での最大規模のPTSDのEWASであり、症状の重症度を扱った初の大規模PTSD EWASとして、PTSDのエピジェネティクスの知見を大きく広げるものである。", "url": "https://www.medrxiv.org/content/10.64898/2026.09.04.26362177", "publishedAt": "2026-10-14T00:00:00Z", "authors": ["Beck, S. E.", "Levey, D. F.", "Galimberti, M.", "Overstreet, C.", "Chen, J.", "Gupta, P.", "Dao, C.", "Lesch, B. J.", "Montalvo-Ortiz, J. L.", "Harrington, K. M.", "The V.A. Million Veteran Program", "Gaziano, J. M.", "Krystal, J. H.", "Polimanti, R.", "Girgenti, M. J.", "Stein, M. B.", "Gelernter, J."], "categories": ["PTSD", "epigenetics", "DNA methylation"], "field": "medRxiv", "genre": "Consciousness / Neuroscience", "timestamp": 1791936000000, "monthKey": "2026-10"}, {"source": "PubMed", "title": "A living systematic review, meta-analysis, and open data resource of trials of MDMA-assisted therapy for PTSD.", "titleJa": "MDMA補助療法の生きたシステマティックレビュー――PTSD試験のメタ分析とオープンデータ資源", "summaryHtml": "MDMAは心的外傷後ストレス障害（PTSD）の治療薬候補として浮上したが、急速に変化するエビデンスを統合するのは難しい。本研究はMDMAによるPTSD治療に関する「生きた」システマティックレビューと、オープンデータのメタ分析資源を提示する。初回リリースでは286名を含む6件の無作為化比較試験がデータベースに収録され、すべてがMAPS（多分野サイケデリック研究協会）の支援によるものだった。<br><br>逆分散ランダム効果モデルによるメタ分析では、対照条件と比べてMDMA補助療法（MDMA-AT）がPTSD症状をより大きく軽減した（Hedges' g = −0.71）。プラセボと比較すると奏効率は1.35倍、寛解率は2.25倍だった。用量変数のメタ回帰も検討された。収録研究の多くはコクランの基準でバイアスリスクが低いとされたが、期待効果、機能的盲検解除、実施上の課題、安全性といった分野特有の問題は捉えきれていないとし、全体の確実性はGRADE評価で「低」とされた。<br><br>結論として、MDMA-ATはこれまでの研究全体でPTSD症状の短期的な減少をもたらすことが示唆された。本レビューとメタ分析、データベース、オンラインダッシュボード（sypres.io）はエビデンスの出現とともに更新され続け、急速に変化する分野の研究者に開かれた透明な資源となる。", "url": "https://pubmed.ncbi.nlm.nih.gov/42860436/", "publishedAt": "2026-10-11T00:00:00Z", "authors": ["Brooke L Sevchik", "S Parker Singleton", "Analiese Lahey", "Pim Cuijpers", "Mathias Harrer", "Megan T Jones", "Sandeep M Nayak", "Eric C Strain", "Simon N Vandekar", "David B Yaden", "Robert H Dworkin", "J Cobb Scott", "Theodore D Satterthwaite"], "categories": ["MDMA", "PTSD", "psychedelic therapy"], "field": "Neuropsychopharmacology", "genre": "Psychedelics / Therapy", "timestamp": 1791676800000, "monthKey": "2026-10"}, {"source": "Europe PMC", "title": "Institutional betrayal and posttraumatic adaptation among Nova festival survivors following the 7 October 2023 attack.", "titleJa": "制度的裏切りと心的外傷後の適応――2023年10月7日の襲撃を生き延びたノヴァ・フェスティバルの生存者たち", "summaryHtml": "2023年10月7日、ハマスによる大規模な奇襲攻撃では、ノヴァ音楽フェスティバルの会場も襲撃され、数百人の参加者が殺害または拉致された。生存者の初期の反応については研究が蓄積されてきたが、襲撃から時間が経った後の長期的な適応についてはあまり知られていなかった。本研究は、襲撃から約18か月後の生存者を対象に、制度の対応や回復の資源、前向きな変化の実感を振り返ってもらうことで、持続的な脅威のもとでの心的外傷後の適応を調べた。<br><br>方法は、成人した生存者15人への半構造化インタビューを現象学的な視点から分析する質的研究である。初期のコーディングは帰納的・意味論的に行い、その後の解釈には、持続的外傷ストレス、制度的裏切り、回復資本、外傷後成長という4つの視点を用いた。分析から、多面的な脆弱性、回復の資源、実感された前向きな変化という3つの相互に関連したテーマが浮かび上がった。<br><br>すべてのテーマに共通していたのは、生存者が自ら資源を動員し、適応を能動的に形作ろうとする個人の主体性だった。一方で、制度の裏切りは継続的な「二次的な傷」として浮かび上がり、生存者自身が主導するピア・コミュニティが回復の重要な資源となっていた。集団的なトラウマの後では、制度への信頼とコミュニティに根ざした支援が重要であることを示す知見である。", "url": "https://europepmc.org/article/MED/42847151", "publishedAt": "2026-10-08T00:00:00Z", "authors": ["Elisha E", "Peled-Laskov R", "Or O"], "categories": ["trauma", "PTSD", "institutional betrayal", "posttraumatic growth"], "field": "European journal of psychotraumatology", "genre": "Consciousness / Neuroscience", "timestamp": 1791417600000, "monthKey": "2026-10"}, {"source": "PubMed", "title": "The entropic brain today.", "titleJa": "エントロピック・ブレインの現在――意識の広がりを測る脳エントロピー仮説", "summaryHtml": "2014年に提唱され、2018年に改訂されたエントロピック・ブレイン（脳のエントロピー）仮説は、その後多くの支持的証拠を集めてきた。本仮説は、「現象的意識の大きさ」という次元に沿って、拡張的な状態では脳のエントロピーが確実に増加し、意識がない、あるいは低下した状態ではその逆が当てはまるとする。拡張的な状態の例としては、熟練した瞑想、フリッカー光刺激、臨死様体験、非定型的な呼吸、レム睡眠、発作前兆、無投薬の早期精神病、サイケデリック薬物による状態が挙げられる。逆に低エントロピーの状態としては、意識障害、深い睡眠、麻酔、発作、脳卒中後、加齢、認知障害、神経変性疾患が挙げられる。<br><br>本論文は、この仮説が収束的妥当性、相関的妥当性、予測的妥当性、弁別的妥当性、外的妥当性を備えることを示す。予測的妥当性については、支持的な文脈でのシロシビン投与下における脳エントロピーの増加が、その後の精神的健康の改善（投与1か月後のウェルビーイング向上）を予測する。弁別的妥当性については、脳エントロピーの変化が、覚醒度のような他の次元ではなく「主観的体験の幅」を選択的に指標することが示された。外的妥当性としては、エントロピー関連の関数が生成AIにも応用されている。<br><br>結論として、エントロピック・ブレインは意識状態の有用なモデルである。意識の広がりを脳のエントロピーという単一の指標で捉える枠組みは、瞑想からサイケデリック、睡眠、神経疾患までを横断する意識研究の整理軸となり、臨床と理論の双方に示唆を与える。", "url": "https://pubmed.ncbi.nlm.nih.gov/42266156/", "publishedAt": "2026-10-05T00:00:00Z", "authors": ["Robin L Carhart-Harris"], "categories": ["consciousness", "brain entropy", "psychedelic"], "field": "Brain", "genre": "Consciousness / Neuroscience", "timestamp": 1791158400000, "monthKey": "2026-10"}, {"source": "Europe PMC", "title": "AI is not as conscious as humans: Essentialism in mental state attributions to artificial systems", "titleJa": "AIは人間ほど意識があるとは見なされない――心的状態の帰属における本質主義", "summaryHtml": "人工システムはますます人間に似た振る舞いをするようになっている。だが、それだけで私たちは人工システムを意識的だとみなすのだろうか。本論文は二つの可能性を対比する。一つは機能主義的な帰属で、環境への応答が適切であるほど、相手が人間でも人工物でも意識的だとみなすというもの。もう一つは本質主義的な帰属で、人工システムが人間と同じくらい適切に応答しても、意識は低いと判断するというもの。さらに、この傾向が意識に特有なのか、気づきのような関連概念にも広がるのかを問う。<br><br>事前登録された2組の研究（5実験、参加者1092人）では、英国の参加者が空間的・社会的・時間的な環境特徴への応答性が異なる人間または人工エージェントのシナリオを読み、その意識と気づきを評価した。その結果、意識の帰属は本質主義的な論理に従った。応答性が同程度でも、参加者は一貫して人間の方により大きな意識を帰属させた。<br><br>一方、気づきの帰属は機能主義的なパターンを示した。人間でも人工エージェントでも、応答性が高まるにつれて気づきの評価は着実に上がった（ただし最高水準では人間がより気づいていると評価された）。つまり人々は、心的概念ごとに異なる推論規則を用いている。意識はエージェントが何であるかに、気づきはエージェントが何をするかに依存すると扱われる、という知見である。", "url": "https://europepmc.org/article/MED/42822076", "publishedAt": "2026-10-01T00:00:00Z", "authors": ["Longin L", "Karpus J", "Meertens N", "Bahrami B", "Deroy O"], "categories": ["consciousness", "experimental philosophy"], "field": "Cognition", "genre": "Consciousness / Philosophy", "timestamp": 1790812800000, "monthKey": "2026-10"}]};
    const byId = id => document.getElementById(id);
    const norm = s => String(s||'').toLowerCase().normalize('NFKC').replace(/\s+/g,' ').trim();
    const esc = s => String(s||'').replace(/[&<>"]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
    const months = [...new Set((DATA.articles||[]).map(a => a.monthKey).filter(Boolean))].sort().reverse();
    const genres = [...new Set((DATA.articles||[]).map(a => a.genre).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'ja'));
    const fields = [...new Set((DATA.articles||[]).map(a => a.field).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'ja'));
    function fill(select, values){ values.forEach(v=>{ const o=document.createElement('option'); o.value=v; o.textContent=v; select.appendChild(o); }); }
    fill(byId('month'), months); fill(byId('genre'), genres); fill(byId('field'), fields);
    function render(){
      const month=byId('month').value, genre=byId('genre').value, field=byId('field').value, sort=byId('sort').value, kw=norm(byId('keyword').value);
      let rows=(DATA.articles||[]).filter(a=>{
        if(month&&a.monthKey!==month) return false; if(genre&&a.genre!==genre) return false; if(field&&a.field!==field) return false;
        const hay=norm([a.titleJa,a.title,a.summaryHtml,a.authors.join(' '),a.categories.join(' ')].join(' '));
        if(kw&& !hay.includes(kw)) return false; return true;
      });
      rows = rows.slice().sort((a,b)=> sort==='oldest' ? a.timestamp-b.timestamp : sort==='title' ? a.titleJa.localeCompare(b.titleJa,'ja') : b.timestamp-a.timestamp);
      byId('meta').textContent = `更新: ${DATA.updatedAt || '-'} / 表示件数: ${rows.length}件`;
      byId('list').innerHTML = rows.map(a=>`
        <article>
          <div class="src">${esc(a.source)} / ${esc(a.publishedAt.slice(0,10))}</div>
          <h2 class="title">${esc(a.titleJa)}</h2>
          <div class="tags"><span class="tag">AI</span><span class="tag">${esc(a.genre)}</span><span class="tag">${esc(a.field)}</span>${a.categories.slice(0,4).map(c=>`<span class=\"tag\">${esc(c)}</span>`).join('')}</div>
          <div class="summary">${a.summaryHtml}</div>
          <div class="box"><strong>ソース・引用元</strong><br>配信元：${esc(a.source)}<br>原題：${esc(a.title)}<br>著者：${esc(a.authors.join(', '))}<br>原文URL：<a href="${esc(a.url)}" target="_blank" rel="noopener">${esc(a.url)}</a></div>
        </article>`).join('');
    }
    ['month','genre','field','sort'].forEach(id=>byId(id).addEventListener('change',render)); byId('keyword').addEventListener('input',render); render();
  </script>
