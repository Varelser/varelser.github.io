      try { rec = new MediaRecorder(c.captureStream(30), { mimeType: mime, videoBitsPerSecond: 8000000 }); }
      catch (e) { v.res.textContent = '録画を開始できませんでした: ' + e.message; return; }
      rec.ondataavailable = function (e) { if (e.data && e.data.size) chunks.push(e.data); };
      rec.onstop = function () {
        var bytes = chunks.reduce(function (a, x) { return a + x.size; }, 0);
        if (!bytes) { v.res.textContent = '録画データ 0 バイト — この環境では映像フレームが生成されませんでした（実ブラウザでは通常動作します）'; return; }
        var blob = new Blob(chunks, { type: mime });
        var url = URL.createObjectURL(blob);
        v.res.innerHTML = '';
        var span = document.createElement('span');
        span.textContent = '成功: ' + mime.split(';')[0] + ' / ' + Math.round(bytes / 1024) + ' KB ';
        var a = document.createElement('a');
        a.href = url; a.download = 'yayoi_video_test.' + (mime.includes('mp4') ? 'mp4' : 'webm'); a.textContent = 'ダウンロード';
        v.res.appendChild(span); v.res.appendChild(a);
      };
      rec.start(250);
      setTimeout(function () { try { rec.stop(); } catch (e) {} }, 2500);
    });

    var mi = diagRow(body, 'マイク');
    var level = document.createElement('div'); level.id = 'yc-miclevel'; level.innerHTML = '<i></i>';
    mi.row.appendChild(level);
    mi.btn.addEventListener('click', function () {
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) { mi.res.textContent = 'このブラウザは未対応です'; return; }
      mi.res.textContent = 'マイクを開始しています…';
      navigator.mediaDevices.getUserMedia({ audio: true }).then(function (stream) {
        var actx = new (window.AudioContext || window.webkitAudioContext)();
        var src = actx.createMediaStreamSource(stream);
        var an = actx.createAnalyser(); an.fftSize = 512;
        src.connect(an);
        var data = new Uint8Array(an.frequencyBinCount);
        level.style.display = 'block';
        var max = 0, t0 = Date.now();
        (function tick() {
          an.getByteTimeDomainData(data);
          var sum = 0;
          for (var i = 0; i < data.length; i++) { var d = (data[i] - 128) / 128; sum += d * d; }
          var rms = Math.sqrt(sum / data.length);
          max = Math.max(max, rms);
          level.querySelector('i').style.width = Math.min(100, rms * 220) + '%';
          if (Date.now() - t0 < 5000) requestAnimationFrame(tick);
          else {
            stream.getTracks().forEach(function (t) { t.stop(); });
            actx.close();
            level.style.display = 'none';
            mi.res.textContent = '取得できました（5秒間の最大レベル 約 ' + Math.round(max * 100) + '%）。音への反応は Sync / Expression 側の設定で使われます';
          }
        })();
      }).catch(function (e) { mi.res.textContent = '開始できませんでした: ' + e.name; });
    });

    var md = diagRow(body, 'Web MIDI');
    md.btn.addEventListener('click', function () {
      if (!navigator.requestMIDIAccess) { md.res.textContent = 'このブラウザは未対応です'; return; }
      navigator.requestMIDIAccess().then(function (acc) {
        var names = [];
        acc.inputs.forEach(function (i) { names.push(i.name || 'MIDI入力'); });
        md.res.textContent = names.length ? '入力デバイス: ' + names.join(' / ') : '接続されている入力デバイスはありません';
      }).catch(function (e) { md.res.textContent = '開始できませんでした: ' + e.name; });
    });

    var pp = diagRow(body, 'PiP');
    pp.btn.addEventListener('click', function () {
      if (!('documentPictureInPicture' in window)) { pp.res.textContent = 'このブラウザは未対応です'; return; }
      documentPictureInPicture.requestWindow({ width: 420, height: 300 }).then(function (w) {
        w.document.body.innerHTML = '<div style="font-family:sans-serif;padding:16px">Yayoi 動作チェック — PiP は動作しています</div>';
        pp.res.textContent = '小さな窓を開けました（1秒後に閉じます）';
        setTimeout(function () { try { w.close(); } catch (e) {} }, 1000);
      }).catch(function (e) { pp.res.textContent = '開けませんでした: ' + e.name; });
    });

    var wk = diagRow(body, 'Wake Lock');
    wk.btn.addEventListener('click', function () {
      if (!('wakeLock' in navigator)) { wk.res.textContent = 'このブラウザは未対応です'; return; }
      navigator.wakeLock.request('screen').then(function (lock) {
        wk.res.textContent = '取得できました（画面は眠りません。1秒後に解放します）';
        setTimeout(function () { try { lock.release(); } catch (e) {} }, 1000);
      }).catch(function (e) { wk.res.textContent = '取得できませんでした: ' + e.name; });
    });

    var gp = diagRow(body, 'Gamepad');
    gp.btn.addEventListener('click', function () {
      var pads = navigator.getGamepads ? [...navigator.getGamepads()].filter(Boolean) : [];
      gp.res.textContent = pads.length ? '接続中: ' + pads.map(function (p) { return p.id.slice(0, 42); }).join(' / ') + ' — A=生成 / B=戻す / X=PNG / Y=次のタブ' : '未接続です（パッドのボタンを押すと認識されます）';
    });

    var st = diagRow(body, '保存容量');
    st.btn.addEventListener('click', function () {
      if (!navigator.storage || !navigator.storage.estimate) { st.res.textContent = 'このブラウザは未対応です'; return; }
      Promise.all([navigator.storage.estimate(), navigator.storage.persisted ? navigator.storage.persisted() : Promise.resolve(false)]).then(function (r) {
        var est = r[0];
        st.res.textContent = '使用中 約 ' + Math.round((est.usage || 0) / 1048576 * 10) / 10 + ' MB / 上限 約 ' + Math.round((est.quota || 0) / 1073741824 * 10) / 10 + ' GB ・ 永続化: ' + (r[1] ? '有効' : '未許可（自動で要求済み）');
      }).catch(function (e) { st.res.textContent = '取得できませんでした: ' + e.name; });
    });

    var fm = diagRow(body, '書き出し形式');
    fm.btn.addEventListener('click', function () {
      var probe = document.createElement('canvas'); probe.width = 4; probe.height = 4;
      var out = [];
      var pending = 2;
      function done() { if (--pending === 0) fm.res.textContent = out.join(' ・ '); }
      probe.toBlob(function (b) { out.push('WebP: ' + (b && b.type === 'image/webp' ? '対応' : '未対応')); done(); }, 'image/webp', 0.9);
      probe.toBlob(function (b) { out.push('AVIF: ' + (b && b.type === 'image/avif' ? '対応' : '未対応')); done(); }, 'image/avif', 0.9);
    });
  }

  /* ---------- Phase 3f: extra export row + diag entry (injected into Plus) ---------- */
  function dlName(ext) {
    var d = new Date();
    function p(n) { return String(n).padStart(2, '0'); }
    return 'yayoi_' + d.getFullYear() + p(d.getMonth() + 1) + p(d.getDate()) + '_' + p(d.getHours()) + p(d.getMinutes()) + p(d.getSeconds()) + '.' + ext;
  }
  function downloadBlob(blob, name) {
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = name; a.click();
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 4000);
  }
  function exportAs(type) {
    var c = canvas(); if (!c) return;
    c.toBlob(function (b) {
      if (!b || b.type !== type) { toast('このブラウザは ' + type.split('/')[1].toUpperCase() + ' 書き出しに未対応です'); return; }
      downloadBlob(b, dlName(type.split('/')[1]));
      toast(type.split('/')[1].toUpperCase() + ' を保存しました');
    }, type, 0.92);
  }
  function shareImage() {
    var c = canvas(); if (!c) return;
    c.toBlob(function (b) {
      if (!b) { toast('画像を作れませんでした'); return; }
      var file = new File([b], dlName('png'), { type: 'image/png' });
      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        navigator.share({ files: [file] }).catch(function () {});
      } else {
        toast('このブラウザは画像の直接共有に未対応です（PNG保存をお使いください）');
      }
    }, 'image/png');
  }
  function plusRow(labelText) {
    var row = document.createElement('div');
    row.className = 'yayoi-plus-row';
    var lab = document.createElement('span');
    lab.className = 'yayoi-plus-label'; lab.textContent = labelText;
    row.appendChild(lab);
    return row;
  }
  function plusBtn(row, text, fn) {
    var b = document.createElement('button');
    b.type = 'button'; b.className = 'yayoi-plus-btn'; b.textContent = text;
    b.addEventListener('click', fn);
    row.appendChild(b);
    return b;
  }
  function ensureExtraRows() {
    var plus = document.getElementById('yayoi-plus');
    if (plus && !document.getElementById('yc-plus-row')) {
      var row = plusRow('追加の書き出し・診断');
      row.id = 'yc-plus-row';
      plusBtn(row, 'WebP保存', function () { exportAs('image/webp'); });
      plusBtn(row, 'AVIF保存', function () { exportAs('image/avif'); });
      plusBtn(row, '画像を共有', shareImage);
      plusBtn(row, '動作チェック', function () { if (!diag) buildDiag(); openOverlay(diag); });
      plus.appendChild(row);
    }
    var plus2 = document.getElementById('yayoi-plus2');
    if (plus2 && !document.getElementById('yc-plus2-row')) {
      var row2 = plusRow('ヘルプ');
      row2.id = 'yc-plus2-row';
      plusBtn(row2, 'キーボードショートカット', function () { openOverlay(help); });
      plusBtn(row2, '動作チェック', function () { if (!diag) buildDiag(); openOverlay(diag); });
      plus2.appendChild(row2);
    }
  }

  /* ---------- Phase 3d: shortcut help ---------- */
  var help = makeOverlay('yc-help', 'キーボードショートカット', 'Yayoi で使えるキー操作の一覧です。');
  help.querySelector('.yc-body').innerHTML = '<div class="yc-keys">' +
    '<div><b>1 〜 5</b>タブ切替（Shapes / Layout / Style / Size / Space）</div>' +
    '<div><b>G</b>新しい絵を生成</div>' +
    '<div><b>Ctrl + Z</b>元に戻す</div>' +
    '<div><b>I</b>没入モード（UIを隠す）</div>' +
    '<div><b>Esc</b>パネル・パレットを閉じる</div>' +
    '<div><b>⌘K / Ctrl + K</b>コマンドパレット（全タブ横断検索）</div>' +
    '<div><b>D</b>動作チェック（動画・マイク・MIDI等）</div>' +
    '<div><b>?</b>この一覧</div>' +
    '<div><b>ダブルクリック</b>キャンバス上で生成</div>' +
    '<div><b>Gamepad</b>A=生成 / B=戻す / X=PNG / Y=次のタブ / Start=⌘K</div></div>';

  document.addEventListener('keydown', function (e) {
    var tag = document.activeElement && document.activeElement.tagName;
    if (/INPUT|TEXTAREA|SELECT/.test(tag || '')) return;
    if (e.key === '?') { e.preventDefault(); openOverlay(help); }
    if ((e.key === 'd' || e.key === 'D') && !e.metaKey && !e.ctrlKey && !e.altKey) {
      if (!diag) buildDiag();
      openOverlay(diag);
    }
    if (e.key === 'Escape') { $$('.yc-overlay.yc-open').forEach(function (o) { o.classList.remove('yc-open'); }); }
  });

  /* ---------- Phase 3a: gamepad ---------- */
  var padState = {};
  window.addEventListener('gamepadconnected', function () {
    toast('ゲームパッド接続: A=生成 / B=戻す / X=PNG / Y=次のタブ / Start=⌘K', 4200);
  });
  function toolbarClick(match) {
    var b = $$('.toolbar button').find(match);
    if (b) b.click();
    return !!b;
  }
  function tabClick(dir) {
    var tabs = $$('.toolbar-left .tool-btn');
    if (!tabs.length) return;
    var idx = tabs.findIndex(function (t) { return t.classList.contains('is-active'); });
    var next = tabs[(idx + dir + tabs.length) % tabs.length];
    if (next) next.click();
  }
  function padAction(i) {
    var tag = document.activeElement && document.activeElement.tagName;
    if (/INPUT|TEXTAREA|SELECT/.test(tag || '')) return;
    if (i === 0) toolbarClick(function (b) { return (b.getAttribute('aria-label') || '') === 'Generate'; });
    else if (i === 1) toolbarClick(function (b) { return /元に戻す/.test(b.getAttribute('aria-label') || ''); });
    else if (i === 2) toolbarClick(function (b) { return b.textContent.trim() === 'PNG'; });
    else if (i === 3) tabClick(1);
    else if (i === 4) tabClick(-1);
    else if (i === 5) tabClick(1);
    else if (i === 9) { var pb = $$('.toolbar button').find(function (b) { return /⌘K/.test(b.textContent); }); if (pb) pb.click(); }
  }
  setInterval(function () {
    if (document.hidden || !navigator.getGamepads) return;
    var pads = [...navigator.getGamepads()].filter(Boolean);
    if (!pads.length) return;
    var gp = pads[0];
    gp.buttons.forEach(function (btn, i) {
      var key = gp.index + ':' + i;
      var was = !!padState[key];
      if (btn.pressed && !was) padAction(i);
      padState[key] = btn.pressed;
    });
  }, 120);

  /* ---------- Phase 3b: media session ---------- */
  if ('mediaSession' in navigator) {
    try {
      navigator.mediaSession.metadata = new MediaMetadata({ title: 'Yayoi — Generative Shapes', artist: 'Varelser', album: 'varelser.github.io' });
      var autoRow = function () {
        var sec = document.getElementById('yayoi-plus');
        if (!sec) return null;
        return $$('.yayoi-plus-row', sec).find(function (r) { var l = r.querySelector('.yayoi-plus-label'); return l && /オート生成/.test(l.textContent); });
      };
      navigator.mediaSession.setActionHandler('play', function () {
        var row = autoRow(); if (!row) return;
        var start = $$('button', row).find(function (b) { return /開始/.test(b.textContent); });
        if (start) start.click();
      });
      navigator.mediaSession.setActionHandler('pause', function () {
        var row = autoRow(); if (!row) return;
        var stop = $$('button', row).find(function (b) { return /停止/.test(b.textContent); });
        if (stop) stop.click();
      });
      navigator.mediaSession.setActionHandler('previoustrack', function () { toolbarClick(function (b) { return /元に戻す/.test(b.getAttribute('aria-label') || ''); }); });
      navigator.mediaSession.setActionHandler('nexttrack', function () { toolbarClick(function (b) { return /やり直し/.test(b.getAttribute('aria-label') || ''); }); });
    } catch (e) {}
  }

  /* ---------- Phase 3e: storage persistence request ---------- */
  try {
    if (navigator.storage && navigator.storage.persist && navigator.storage.persisted) {
      navigator.storage.persisted().then(function (p) { if (!p) navigator.storage.persist().catch(function () {}); }).catch(function () {});
    }
  } catch (e) {}

  /* ---------- Phase 3g: tab crossfade ---------- */
  var reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
  document.addEventListener('click', function (e) {
    if (reduceMotion) return;
    var t = e.target.closest('.toolbar-left .tool-btn');
    if (!t) return;
    var c = canvas();
    if (!c || !c.parentElement) return;
    var w = c.parentElement;
    w.classList.add('yc-fadewrap', 'yc-fading');
    setTimeout(function () { w.classList.remove('yc-fading'); }, 160);
  }, true);

  /* ---------- row injection loop ---------- */
  setInterval(ensureExtraRows, 1200);
  ensureExtraRows();
})();
</script>

</body>
</html>
