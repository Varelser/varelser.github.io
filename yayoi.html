    /* ==== Lien-style reskin v4: header / toolbar / floating panel / sliders ==== */
    :root {
      --yayoi-border: #171717;
      --yayoi-panel-bg: rgba(0, 0, 0, 0.90);
      --yayoi-control-bg: #171717;
      --yayoi-control-bg-hover: #262626;
      --yayoi-shadow: 0 25px 50px -12px rgba(0,0,0,0.75);
    }
    body { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Hiragino Kaku Gothic ProN", "Noto Sans JP", sans-serif; }
    .yayoi-root { height: 100vh; height: 100dvh; }
    @keyframes yayoiSlideUpFade { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    .app-header { flex: 0 0 64px; height: 64px; display: flex; align-items: center; justify-content: space-between; padding: 0 16px; gap: 8px; border-bottom: 1px solid var(--yayoi-border); background: #000; position: relative; z-index: 30; user-select: none; }
    .app-brand { display: inline-flex; align-items: center; color: #ffffff; text-decoration: none; transition: opacity .2s ease; -webkit-tap-highlight-color: transparent; }
    .app-brand:hover { opacity: .75; }
    .app-brand:focus-visible { outline: 2px solid rgba(255, 255, 255, 0.4); outline-offset: 3px; }
    .app-brand img { height: 24px; width: auto; display: block; }
    .app-brand .app-emblem { width: 28px; height: 28px; object-fit: contain; display: block; flex: none; }
    @media (max-width: 640px) { .app-header { padding: 0 10px; } .app-brand img { height: 20px; } .app-brand .app-emblem { width: 24px; height: 24px; } .app-title { font-size: 0.8rem; } }
    .app-title { position: absolute; left: 50%; transform: translateX(-50%); font-size: 1rem; line-height: 1; letter-spacing: 0.2em; font-weight: 300; color: rgba(255,255,255,0.78); margin: 0; white-space: nowrap; }
    .yayoi-canvas { min-height: 0; transition: padding 0.35s cubic-bezier(0.25, 1, 0.5, 1); }
    @media (min-width: 768px) { .yayoi-canvas-shift { padding-right: calc(min(880px, 52vw) + 48px); } }
    @media (max-width: 767px) { .yayoi-canvas-shift { padding-bottom: calc(44vh + 20px); } }
    .app-footer { flex: 0 0 auto; position: relative; z-index: 30; background: #000; }
    .toolbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 24px; border-top: 1px solid var(--yayoi-border); background: #000; overflow-x: auto; scrollbar-width: none; }
    .toolbar::-webkit-scrollbar { display: none; }
    .toolbar-left, .toolbar-right { display: flex; align-items: center; }
    .toolbar-left { gap: 4px; }
    .toolbar-right { gap: 4px; }
    .toolbar-sep { width: 1px; height: 20px; background: #262626; margin: 0 8px; flex: none; }
    .tool-btn { padding: 6px 8px; font-size: 11px; line-height: 0.875rem; letter-spacing: 0.1em; text-transform: uppercase; font-weight: 500; border: 0; border-radius: 0; color: #737373; background: none; cursor: pointer; white-space: nowrap; transition: color 0.2s ease, opacity 0.2s ease; }
    .tool-btn:hover { color: #ffffff; }
    .tool-btn.is-active { color: #ffffff; }
    .tool-btn:disabled { opacity: 0.35; cursor: default; }
    .tool-btn:disabled:hover { color: #737373; }
    .tool-btn-primary { color: #ffffff; font-weight: 700; }
    .tool-btn-recording { color: #ef4444; }
    .tool-btn-recording:hover { color: #ef4444; }
    .yayoi-status { position: fixed; left: 24px; bottom: 76px; z-index: 60; max-width: min(480px, calc(100vw - 48px)); border: 1px solid rgba(255,255,255,0.15); border-radius: 12px; padding: 10px 14px; font-size: 12px; letter-spacing: 0.04em; background: rgba(0,0,0,0.72); color: #ffffff; backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); }
    .yayoi-panel { position: fixed; right: 24px; bottom: 76px; z-index: 40; width: min(880px, calc(100vw - 48px)); border: 0; border-radius: 12px; background: var(--yayoi-panel-bg); box-shadow: var(--yayoi-shadow); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); animation: yayoiSlideUpFade 0.2s ease-out forwards; }
    @media (min-width: 768px) { .yayoi-panel { width: min(880px, 52vw); } }
    .yayoi-panel-inner { max-height: min(62vh, calc(100dvh - 170px)); overflow-y: auto; overflow-x: hidden; padding: 20px; }
    @media (max-width: 767px) { .yayoi-panel { left: 16px; right: 16px; width: auto; bottom: 68px; height: 44vh; } .yayoi-panel-inner { max-height: none; height: 100%; } .yayoi-status { left: 16px; bottom: 72px; } .toolbar { padding: 12px 16px; } }
    .yayoi-panel-header { display: flex; align-items: center; justify-content: space-between; position: sticky; top: -20px; z-index: 10; margin: -20px -20px 12px; padding: 16px 20px 10px; background: rgba(0,0,0,0.92); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); }
    .yayoi-panel-title { font-size: 12px; line-height: 1rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.12em; color: rgba(255,255,255,0.72); display: flex; align-items: center; gap: 8px; margin: 0; }
    .yayoi-panel-close { color: rgba(255,255,255,0.6); background: none; border: 0; padding: 2px 6px; cursor: pointer; transition: color 0.2s ease; display: inline-flex; }
    .yayoi-panel-close:hover { color: #ffffff; }
    .yayoi-panel button, .yayoi-panel input, .yayoi-panel select, .yayoi-panel textarea { border: 0; }
    .yayoi-panel input[type="range"] { -webkit-appearance: none; appearance: none; height: 4px; border-radius: 9999px; background: var(--yayoi-control-bg); cursor: pointer; outline: none; }
    .yayoi-panel input[type="range"]:hover { background: var(--yayoi-control-bg-hover); }
    .yayoi-panel input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 14px; height: 14px; border-radius: 9999px; background: #ffffff; border: 0; }
    .yayoi-panel input[type="range"]::-moz-range-thumb { width: 14px; height: 14px; border-radius: 9999px; background: #ffffff; border: 0; }
    .yayoi-panel button:focus-visible, .yayoi-panel input:focus-visible, .yayoi-panel select:focus-visible, .toolbar button:focus-visible { outline: 2px solid #f5f5f5; outline-offset: 2px; }
  </style>

  <style id="yayoi-refine-style">
/* ==== Yayoi refine (additive): shell density / blur removal / panel bottom-left ==== */
.yayoi-panel { background: rgba(0,0,0,0.97); backdrop-filter: none; -webkit-backdrop-filter: none; }
.yayoi-panel-header { background: #000; backdrop-filter: none; -webkit-backdrop-filter: none; top: -14px; margin: -14px -16px 10px; padding: 12px 16px 8px; }
.yayoi-panel-inner { padding: 14px 16px; }
/* Status toast moves to top centre: the panel now owns the bottom-left. */
.yayoi-status { backdrop-filter: none; -webkit-backdrop-filter: none; background: rgba(0,0,0,0.92); left: 50%; right: auto; bottom: auto; top: 68px; transform: translateX(-50%); }
.yayoi-panel .space-y-4 > * + * { margin-top: 10px; }
.yayoi-panel .space-y-3 > * + * { margin-top: 8px; }
.yayoi-panel .mb-4 { margin-bottom: 10px; }
.yayoi-panel .mb-3 { margin-bottom: 8px; }
.yayoi-panel .mb-2 { margin-bottom: 6px; }
.yayoi-panel .p-3 { padding: 9px; }
.yayoi-panel .py-2 { padding-top: 5px; padding-bottom: 5px; }
.yayoi-panel * { min-width: 0; }
.yayoi-panel .font-mono { overflow-wrap: anywhere; }
/* Panel sits directly above the Shapes..Space tabs (bottom-left);
   the artwork shifts RIGHT instead of left. Mobile keeps the bottom sheet. */
@media (min-width: 768px) {
  .yayoi-panel { left: 24px; right: auto; }
  .yayoi-canvas-shift { padding-right: 0; padding-left: calc(min(880px, 52vw) + 48px); }
  body[data-yayoi-tab="shape"] .yayoi-panel { width: min(560px, calc(100vw - 48px)); }
  body[data-yayoi-tab="shape"] .yayoi-canvas-shift { padding-right: 0; padding-left: calc(min(560px, calc(100vw - 48px)) + 48px); }
  body[data-yayoi-tab="color"] .yayoi-panel { width: min(620px, calc(100vw - 48px)); }
  body[data-yayoi-tab="color"] .yayoi-canvas-shift { padding-right: 0; padding-left: calc(min(620px, calc(100vw - 48px)) + 48px); }
  body[data-yayoi-tab="size"] .yayoi-panel { width: min(620px, calc(100vw - 48px)); }
  body[data-yayoi-tab="size"] .yayoi-canvas-shift { padding-right: 0; padding-left: calc(min(620px, calc(100vw - 48px)) + 48px); }
  body[data-yayoi-tab="space"] .yayoi-panel { width: min(620px, calc(100vw - 48px)); }
  body[data-yayoi-tab="space"] .yayoi-canvas-shift { padding-right: 0; padding-left: calc(min(620px, calc(100vw - 48px)) + 48px); }
}
/* Toolbar centre state mirror */
.toolbar { position: relative; }
#yayoi-mirror { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); font-size: 10px; letter-spacing: 0.14em; color: #737373; white-space: nowrap; pointer-events: none; text-transform: uppercase; }
#yayoi-mirror b { color: #d4d4d4; font-weight: 600; }
@media (max-width: 1150px) { #yayoi-mirror { display: none; } }
/* Immersive mode (key: I) */
body.yayoi-immersive .app-header, body.yayoi-immersive .app-footer { display: none; }
/* Canvas display textures (display only; exports unaffected) */
canvas.yayoi-tex-glow { filter: drop-shadow(0 0 18px rgba(255,255,255,0.45)) brightness(1.06); }
canvas.yayoi-tex-soft { filter: blur(1.2px) brightness(1.05) saturate(1.1); }
canvas.yayoi-tex-invert { filter: invert(1); }
canvas.yayoi-tex-dream { filter: blur(2px) brightness(1.18) saturate(1.35); }
canvas.yayoi-tex-psy { animation: yayoiHue 9s linear infinite; }
@keyframes yayoiHue { from { filter: hue-rotate(0deg) saturate(1.6); } to { filter: hue-rotate(360deg) saturate(1.6); } }
/* Thirds + centre guide overlay (positioned by plus.js to the canvas rect) */
#yayoi-grid-overlay { position: absolute; z-index: 20; pointer-events: none; display: none;
  background:
    linear-gradient(to right, transparent calc(33.333% - 0.5px), rgba(255,255,255,0.28) 33.333%, transparent calc(33.333% + 0.5px)),
    linear-gradient(to right, transparent calc(66.666% - 0.5px), rgba(255,255,255,0.28) 66.666%, transparent calc(66.666% + 0.5px)),
    linear-gradient(to bottom, transparent calc(33.333% - 0.5px), rgba(255,255,255,0.28) 33.333%, transparent calc(33.333% + 0.5px)),
    linear-gradient(to bottom, transparent calc(66.666% - 0.5px), rgba(255,255,255,0.28) 66.666%, transparent calc(66.666% + 0.5px)),
    linear-gradient(to right, transparent calc(50% - 0.5px), rgba(255,255,255,0.4) 50%, transparent calc(50% + 0.5px)),
    linear-gradient(to bottom, transparent calc(50% - 0.5px), rgba(255,255,255,0.4) 50%, transparent calc(50% + 0.5px));
}
body.yayoi-grid-on #yayoi-grid-overlay { display: block; }

#varelser-link-panel button.vl-sync { border: 0 !important; background: #171717; border-radius: 0; }
#varelser-link-panel.vl-collapsed > *:not(.vl-title) { display: none !important; }
#varelser-link-panel.vl-collapsed { width: auto; padding: 8px 12px; }
/* Plus section inside the core panel */
.yayoi-plus { margin-top: 16px; }
.yayoi-plus-title { display: flex; align-items: center; gap: 8px; font-size: 10px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: #a3a3a3; margin-bottom: 8px; }
.yayoi-plus-row { display: flex; flex-wrap: wrap; gap: 4px 14px; align-items: center; margin-bottom: 10px; }
.yayoi-plus-label { font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; color: #737373; width: 100%; margin-bottom: 2px; }
.yayoi-plus-btn { padding: 4px 2px; font-size: 11px; letter-spacing: 0.06em; border: 0; background: none; color: #a3a3a3; cursor: pointer; white-space: nowrap; }
.yayoi-plus-btn:hover { color: #fff; }
.yayoi-plus-btn.is-active { color: #000; background: #fff; padding: 4px 8px; }
.yayoi-plus-btn:disabled { opacity: 0.35; cursor: default; }
.yayoi-plus-note { font-size: 10.5px; color: #737373; line-height: 1.6; }
.yayoi-plus-swatch { width: 20px; height: 20px; border-radius: 9999px; border: 0; cursor: pointer; padding: 0; flex: none; }
.yayoi-plus-chip { font-family: ui-monospace, Menlo, monospace; font-size: 10.5px; }
.yayoi-plus-thumb { width: 26px; height: 32px; object-fit: cover; border-radius: 3px; vertical-align: middle; margin-right: 5px; }
#yayoi-plus-toast { position: fixed; left: 50%; transform: translateX(-50%); top: 68px; z-index: 70; max-width: min(480px, calc(100vw - 48px)); border-radius: 12px; padding: 10px 14px; font-size: 12px; letter-spacing: 0.04em; background: rgba(0,0,0,0.94); color: #fff; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.75); }
#yayoi-drop-hint { position: fixed; inset: 0; z-index: 80; display: none; align-items: center; justify-content: center; background: rgba(0,0,0,0.72); color: #fff; font-size: 13px; letter-spacing: 0.2em; text-transform: uppercase; pointer-events: none; }
body.yayoi-dragging #yayoi-drop-hint { display: flex; }
  </style>

  <style id="yayoi-refine-style2">
/* ==== Yayoi refine v3 (additive): FX overlay / meter ==== */
#yayoi-fx-canvas { position: absolute; z-index: 21; pointer-events: none; display: none; }
body.yayoi-fx-on #yayoi-fx-canvas { display: block; }
body.yayoi-fx-on .yayoi-canvas canvas:not(#yayoi-fx-canvas) { visibility: hidden; }
.yayoi-meter { width: 120px; height: 6px; background: #262626; position: relative; flex: none; }
.yayoi-meter > div { position: absolute; left: 0; top: 0; bottom: 0; background: #fff; width: 0%; }
.yayoi-plus2-status { font-size: 10.5px; color: #737373; }
  </style>

  <style id="yayoi-refine-style3">
/* ==== Yayoi refine v4 (additive): Sync section controls ==== */
.yayoi-sync-row { display: flex; flex-wrap: wrap; gap: 4px 14px; align-items: center; margin-bottom: 8px; }
.yayoi-sync-slider { display: inline-flex; align-items: center; gap: 6px; font-size: 10.5px; color: #a3a3a3; letter-spacing: 0.04em; }
.yayoi-sync-slider input[type="range"] { width: 104px; accent-color: #fff; height: 18px; }
.yayoi-sync-slider .yv { font-family: ui-monospace, Menlo, monospace; font-size: 10px; color: #e5e5e5; min-width: 30px; }
.yayoi-sync-sel { background: #171717; color: #d4d4d4; border: 0; font-size: 11px; padding: 3px 6px; letter-spacing: 0.04em; }
.yayoi-sync-status { font-size: 10.5px; color: #737373; line-height: 1.7; }
.yayoi-sync-status b { color: #d4d4d4; font-weight: 600; }
  </style>

<style id="yayoi-b-style">
/* YAYOI-B-STYLE-START (candidate B: focus + cmdk + a11y, additive only) */
@media (min-width: 768px) {
  /* align with the canvas top edge; 80px would collide with the Varelser Link box */
  .yayoi-panel { top: 136px; bottom: auto; }
}
/* small text floor + muted contrast inside the panel */
.yayoi-panel [class*="text-[10px]"] { font-size: 11px; }
.yayoi-panel [class*="text-neutral-500"] { color: #a3a3a3; }
.yayoi-plus-title { font-size: 11px; color: #c9c9c9; }
.yayoi-plus-label { font-size: 11px; color: #9a9a9a; }
.yayoi-plus-note, .yayoi-sync-status, .yayoi-plus2-status { font-size: 11.5px; color: #9a9a9a; }
.yayoi-sync-slider { font-size: 11.5px; color: #c9c9c9; }
.yayoi-sync-slider .yv { font-size: 11px; }
/* folded plus sections in focus mode */
.yayoi-plus.yb-folded > *:not(.yayoi-plus-title) { display: none !important; }
.yayoi-plus .yayoi-plus-title { cursor: pointer; }
.yb-fold-btn { margin-left: auto; background: none; border: 1px solid #3a3a3a !important; border-radius: 999px; color: #d4d4d4; font-size: 10.5px; letter-spacing: .04em; padding: 2px 9px; cursor: pointer; flex: none; }
.yb-fold-btn:hover { color: #fff; border-color: #666 !important; }
.yb-summary { font-size: 11px; color: #9a9a9a; letter-spacing: .02em; text-transform: none; font-weight: 400; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
/* numeric inputs next to slider values */
.yb-num { width: 54px; background: #171717; color: #fff; border: 1px solid #3a3a3a !important; border-radius: 4px; font-family: ui-monospace, Menlo, monospace; font-size: 11px; padding: 1px 4px; margin-left: 6px; }
.yb-num:focus-visible { outline: 2px solid #f5f5f5; outline-offset: 1px; }
.yb-flash { outline: 2px solid #fff !important; outline-offset: 3px; transition: outline-color .3s; }
/* toolbar additions */
#yb-focus-btn[aria-pressed="true"] { background: #fff; color: #000; }
#yb-cmdk-btn .yb-kbd { border: 1px solid #555; border-bottom-width: 2px; border-radius: 4px; padding: 0 4px; font-size: 10px; margin-right: 4px; }
/* cmdk palette */
#yb-palette { position: fixed; inset: 0; z-index: 200; background: rgba(0,0,0,.55); display: flex; align-items: flex-start; justify-content: center; padding-top: 12vh; }
#yb-palette[hidden] { display: none; }
.yb-pal-box { width: min(560px, calc(100vw - 32px)); background: #0a0a0a; border: 1px solid #333; border-radius: 12px; box-shadow: 0 24px 60px rgba(0,0,0,.6); overflow: hidden; }
.yb-pal-input { width: 100%; background: #0a0a0a; color: #fff; border: 0; border-bottom: 1px solid #262626; font-size: 15px; padding: 14px 16px; outline: none; }
.yb-pal-list { max-height: 46vh; overflow-y: auto; padding: 6px; margin: 0; list-style: none; }
.yb-pal-item { display: flex; justify-content: space-between; gap: 12px; padding: 8px 10px; border-radius: 8px; color: #d4d4d4; font-size: 13px; cursor: pointer; }
.yb-pal-item .yb-kind { color: #8a8a8a; font-size: 11px; flex: none; }
.yb-pal-item.yb-active { background: #fff; color: #000; }
.yb-pal-item.yb-active .yb-kind { color: #555; }
.yb-pal-empty { padding: 14px; color: #8a8a8a; font-size: 13px; }
.yb-pal-foot { border-top: 1px solid #262626; padding: 7px 12px; color: #8a8a8a; font-size: 11px; }
@media (max-width: 767px) { .yb-cmdk-label { display: none; } }
@media (prefers-reduced-motion: reduce) { .yb-flash { transition: none; } }
/* YAYOI-B-STYLE-END */
</style>
<style id="yayoi-c-style">
/* YAYOI-C-STYLE (additive only) */
#yc-toast { position: fixed; left: 50%; bottom: 84px; transform: translateX(-50%); z-index: 2147483200; background: #111; color: #f5f5f5; border: 1px solid #3f3f46; border-radius: 8px; padding: 8px 14px; font-size: 12.5px; opacity: 0; pointer-events: none; transition: opacity .25s; max-width: 86vw; text-align: center; }
#yc-toast.yc-show { opacity: 1; }
#yc-batch { position: fixed; left: 16px; bottom: 84px; z-index: 2147483100; background: #111; color: #f5f5f5; border: 1px solid #3f3f46; border-radius: 10px; padding: 10px 12px; font-size: 12.5px; display: none; min-width: 230px; }
#yc-batch.yc-on { display: block; }
#yc-batch .yc-bar { height: 5px; background: #2a2a2a; border-radius: 3px; margin: 7px 0 8px; overflow: hidden; }
#yc-batch .yc-bar i { display: block; height: 100%; background: #f5f5f5; width: 0%; transition: width .4s; }
#yc-batch button { background: #1c1c1e; color: #f5f5f5; border: 1px solid #3f3f46; border-radius: 6px; padding: 3px 10px; font-size: 12px; cursor: pointer; }
#yc-render { position: fixed; top: 76px; left: 50%; transform: translateX(-50%); z-index: 2147483100; background: rgba(17,17,17,.92); color: #f5f5f5; border: 1px solid #3f3f46; border-radius: 999px; padding: 5px 14px; font-size: 12px; display: none; }
#yc-render.yc-on { display: block; }
#yc-render i { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #f5f5f5; margin-right: 7px; animation: yc-pulse 0.9s ease-in-out infinite alternate; }
@keyframes yc-pulse { from { opacity: .25; } to { opacity: 1; } }
.yc-overlay { position: fixed; inset: 0; z-index: 2147483300; background: rgba(0,0,0,.55); display: none; align-items: flex-start; justify-content: center; padding: 7vh 14px 14px; box-sizing: border-box; }
.yc-overlay.yc-open { display: flex; }
.yc-card { background: #101012; color: #f5f5f5; border: 1px solid #3f3f46; border-radius: 12px; width: min(560px, 94vw); max-height: 82vh; overflow: auto; padding: 16px 18px; box-sizing: border-box; }
.yc-card h3 { margin: 0 0 4px; font-size: 15px; letter-spacing: .06em; }
.yc-card .yc-sub { color: #a1a1aa; font-size: 12px; margin-bottom: 10px; }
.yc-row { display: flex; align-items: center; gap: 10px; padding: 7px 0; border-top: 1px solid #232326; font-size: 13px; }
.yc-row .yc-name { flex: 0 0 92px; color: #e4e4e7; }
.yc-row .yc-res { flex: 1; color: #a1a1aa; font-size: 12px; word-break: break-all; }
.yc-row button, .yc-card .yc-close { background: #1c1c1e; color: #f5f5f5; border: 1px solid #3f3f46; border-radius: 6px; padding: 4px 12px; font-size: 12px; cursor: pointer; }
.yc-row button:hover, .yc-card .yc-close:hover { background: #2a2a2e; }
.yc-row a { color: #f5f5f5; }
#yc-miclevel { height: 6px; background: #2a2a2a; border-radius: 3px; overflow: hidden; margin-top: 5px; display: none; }
#yc-miclevel i { display: block; height: 100%; background: #f5f5f5; width: 0%; }
.yc-keys { font-size: 13px; line-height: 2; }
.yc-keys b { display: inline-block; min-width: 108px; font-weight: 600; color: #e4e4e7; }
.yc-fadewrap { transition: opacity .15s ease; }
.yc-fading { opacity: .3; }
@media (prefers-reduced-motion: reduce) { .yc-fadewrap { transition: none; } #yc-render i { animation: none; } }
</style>

/* Yayoi FREE EDITION restriction layer (public web build only) */
(function () {
  var lastToast = 0;
  window.__FREE_BLOCKED__ = function () {
    var now = Date.now();
    if (now - lastToast < 2500) return;
    lastToast = now;
    var t = document.getElementById('yayoi-free-toast');
    if (!t) {
      t = document.createElement('div');
      t.id = 'yayoi-free-toast';
      t.style.cssText = 'position:fixed;left:50%;bottom:96px;transform:translateX(-50%);z-index:2147483300;background:#111;color:#f5f5f5;border:1px solid #3f3f46;border-radius:10px;padding:10px 16px;font:13px/1.5 system-ui,sans-serif;max-width:88vw;text-align:center;box-shadow:0 8px 30px rgba(0,0,0,.35)';
      document.body.appendChild(t);
    }
    t.innerHTML = '書き出し（PNG / SVG / WebP / AVIF / 動画 / JSON 等）は完全版のみです。<br><span style="opacity:.75">Export is available in the full edition on Gumroad.</span>';
    t.style.display = 'block';
    clearTimeout(t._h);
    t._h = setTimeout(function () { t.style.display = 'none'; }, 3600);
  };
  // Block programmatic download-anchor clicks (blob: + download attribute)
  var origClick = HTMLAnchorElement.prototype.click;
  HTMLAnchorElement.prototype.click = function () {
    if (this.getAttribute('download') !== null && (this.href || '').indexOf('blob:') === 0) { window.__FREE_BLOCKED__(); return; }
    return origClick.apply(this, arguments);
  };
  // Block real user clicks on download links (e.g. video result link)
  document.addEventListener('click', function (e) {
    var a = e.target && e.target.closest ? e.target.closest('a[download]') : null;
    if (a) { e.preventDefault(); e.stopPropagation(); window.__FREE_BLOCKED__(); }
  }, true);
  // File System Access save dialog -> refuse
  if ('showSaveFilePicker' in window) {
    window.showSaveFilePicker = function () { window.__FREE_BLOCKED__(); return Promise.reject(new DOMException('Aborted', 'AbortError')); };
  }
  // Web Share with files -> refuse (text/URL share still allowed)
  if (navigator.share) {
    var origShare = navigator.share.bind(navigator);
    navigator.share = function (data) {
      if (data && data.files && data.files.length) { window.__FREE_BLOCKED__(); return Promise.reject(new DOMException('Aborted', 'AbortError')); }
      return origShare(data);
    };
  }
  // FREE EDITION badge
  function addBadge() {
    if (document.getElementById('yayoi-free-badge') || !document.body) return;
    var b = document.createElement('a');
    b.id = 'yayoi-free-badge';

    document.body.appendChild(b);
  }

<script id="studio-x-yayoi">
/* ═══ Studio Link 専用機能 for Yayoi (2026-11-19): シード残像 ═══
   Studio 接続中だけ、Seed が変わる瞬間に「前の絵」が残像として残る。
   接続中はキャンバスを定期的に控えておき (ローリングスナップショット)、
   Seed の変化 (__varelserLinkMasterHash の変化 / seed-sync 受信) を検知したら
   控えをキャンバスの上に重ねてフェードアウトさせる。残像の長さは Studio の
   sync-config amount (Yayoi宛) から決まる。本体コード・保存キーには触らない。
   自分の Link が OFF の間は無効。 */
(function(){
'use strict';
var LSKEY='yayoi.varelserLink.v1', FRESH_MS=6000;
var SNAPK='yayoi.studioEcho.snap', PENDK='yayoi.studioEcho.pending';
var lastSeen=0, linked=false, enabled=true, durMul=1.0;
var syncAmount=null, snapUrl=null, lastHash=null, triggers=0, fading=false;
function ownOn(){ try{ return localStorage.getItem(LSKEY)==='1'; }catch(e){ return false; } }
function lsGet(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
function lsSet(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }
var ch=null;
try{ ch=new BroadcastChannel('varelser-link-v1'); }catch(e){}
if(ch)ch.addEventListener('message',function(ev){
  var m=ev.data||{};
  if(m.app==='studio'){
    if(m.type==='presence'||m.type==='session-bus'){ lastSeen=Date.now(); }
    else if(m.type==='studio-bye'){ lastSeen=0; }
    else if(m.type==='sync-config'){
      var t=m.targets&&m.targets.yayoi;
      if(t&&typeof t.amount==='number'&&isFinite(t.amount))syncAmount=Math.max(0,Math.min(1,t.amount));
    }
  }
  if(m.type==='seed-sync'){
    /* Yayoi 本体は seed-sync でページを再読込して Seed を適用するため、
       残像のリクエストを localStorage に残し、再読込後に必ず表示する */
    lsSet(PENDK,String(Date.now()));
    if(linked)triggerEcho();
  }
});
function mainCanvas(){
  var cs=document.querySelectorAll('canvas'), best=null, area=0;
  for(var i=0;i<cs.length;i++){ var a=cs[i].width*cs[i].height; if(a>area){ area=a; best=cs[i]; } }
  return best;
}
var off=document.createElement('canvas');
function snapshot(){
  var c=mainCanvas(); if(!c||!c.width)return;
  try{
    off.width=Math.max(2,Math.round(c.width/2)); off.height=Math.max(2,Math.round(c.height/2));
    var ctx=off.getContext('2d'); if(!ctx)return;
    ctx.drawImage(c,0,0,off.width,off.height);
    snapUrl=off.toDataURL('image/jpeg',0.85);
    lsSet(SNAPK,snapUrl);
  }catch(e){}
}
function fadeSec(){ return (syncAmount!=null?(1.5+syncAmount*3.5):2.5)*durMul; }
function triggerEcho(){
  if(!enabled||fading)return;
  if(!snapUrl)snapUrl=lsGet(SNAPK);
  if(!snapUrl)return;
  var c=mainCanvas(); if(!c)return;
  var r=c.getBoundingClientRect();
  if(r.width<10||r.height<10)return;
  var img=document.getElementById('sxEcho-yayoi');
  if(!img){ img=document.createElement('img'); img.id='sxEcho-yayoi'; document.body.appendChild(img); }
  var sec=fadeSec();
  img.src=snapUrl;
  img.style.cssText='position:fixed;left:'+r.left+'px;top:'+r.top+'px;width:'+r.width+'px;height:'+r.height
    +'px;z-index:40;pointer-events:none;opacity:1;object-fit:contain';
  fading=true; triggers++;
  requestAnimationFrame(function(){ requestAnimationFrame(function(){
    img.style.transition='opacity '+sec+'s linear'; img.style.opacity='0';
  });});
  setTimeout(function(){ img.style.transition=''; img.style.opacity='1'; img.removeAttribute('src'); fading=false; },(sec+0.3)*1000);
  var s=document.getElementById('sxStatus-yayoi');
  if(s)s.textContent='残像を表示しました ('+triggers+'回目、'+sec.toFixed(1)+'秒)';
}
/* ── UI ── */
var st=document.createElement('style');
st.textContent='#sxBadge-yayoi{position:fixed;top:10px;right:10px;z-index:9990;display:none;padding:4px 10px;border:1px solid #e8e8ec;border-radius:999px;background:rgba(10,10,12,.85);color:#e8e8ec;font-size:11.5px;letter-spacing:.14em}'
 +'#sxPanel-yayoi{position:fixed;right:10px;bottom:10px;z-index:9990;display:none;width:250px;padding:10px 12px;border:1px solid #3a3a40;border-radius:10px;background:rgba(14,14,17,.93);color:#e8e8ec;font-size:12.5px;line-height:1.6}'
 +'#sxPanel-yayoi .t{letter-spacing:.08em}#sxPanel-yayoi .s{opacity:.85;font-size:11.5px}'
 +'#sxPanel-yayoi label{display:flex;align-items:center;gap:6px;margin-top:6px;cursor:pointer}'
 +'#sxPanel-yayoi select{background:#1c1c20;color:#e8e8ec;border:1px solid #3a3a40;border-radius:6px;font-size:12px;padding:2px 4px}';
document.head.appendChild(st);
var badge=document.createElement('div'); badge.id='sxBadge-yayoi'; badge.textContent='STUDIO LINKED';
var panel=document.createElement('div'); panel.id='sxPanel-yayoi';
panel.innerHTML='<div class="t">STUDIO ECHO — シード残像</div><div class="s" id="sxStatus-yayoi">Seed の変化を待っています</div>'
 +'<label><input type="checkbox" id="sxEnable-yayoi" checked> 残像有効</label>'
 +'<label>長さ <select id="sxDur-yayoi"><option value="0.6">短</option><option value="1" selected>中</option><option value="1.6">長</option></select></label>';
document.body.appendChild(badge); document.body.appendChild(panel);
panel.querySelector('#sxEnable-yayoi').addEventListener('change',function(){ enabled=this.checked; });
panel.querySelector('#sxDur-yayoi').addEventListener('change',function(){ durMul=parseFloat(this.value)||1; });
setInterval(function(){
  var now=linked;
  linked=ownOn()&&(Date.now()-lastSeen<FRESH_MS);
  if(linked!==now){
    badge.style.display=linked?'block':'none';
    panel.style.display=linked?'block':'none';
    if(linked){ lastHash=(typeof window.__varelserLinkMasterHash!=='undefined')?window.__varelserLinkMasterHash:null; snapshot(); }
    else { snapUrl=null; }
  }
  if(!linked)return;
  var pend=lsGet(PENDK);
  if(pend){
    lsSet(PENDK,'');
    if(Date.now()-parseInt(pend,10)<12000)triggerEcho();
  }
  var h=(typeof window.__varelserLinkMasterHash!=='undefined')?window.__varelserLinkMasterHash:null;
  if(h!=null&&lastHash!=null&&h!==lastHash)triggerEcho();
  if(h!=null)lastHash=h;
},400);
setInterval(function(){ if(linked&&!document.hidden)snapshot(); },2500);
window.__studioEchoYayoi={version:'PhaseJ-1',
  get linked(){return linked;}, get triggers(){return triggers;},
  get hasSnap(){return !!snapUrl;}, get fadeSec(){return fadeSec();}};
})();

</script>
<script id="studio-freedom-yayoi">
/* ═══ FREEDOM CONSOLE for Yayoi (2026-11-19, Phase N) ═══
   Yayoi は id 付き入力を持たず、設定は localStorage の
   'yayoi-settings-v2' オブジェクトに集約されている。そのため
   プリセットは設定オブジェクトの名前付きコピーとして実装し、
   適用時は書き戻して再読込する (Yayoi 本体もシード同期で再読込する
   設計のため、その作法に合わせる)。本体コードには触らない。 */
(function(){
'use strict';
var OBJKEY='yayoi-settings-v2', SETKEY='yayoi.studioFreedom.v1';
var S={presets:{}};
(function load(){ try{ var raw=localStorage.getItem(SETKEY);
  if(raw){ var p=JSON.parse(raw); if(p.presets)S.presets=p.presets; } }catch(e){} })();
function save(){ try{ localStorage.setItem(SETKEY,JSON.stringify(S)); }catch(e){} }
function readObj(){ try{ var raw=localStorage.getItem(OBJKEY);
  return raw?JSON.parse(raw):null; }catch(e){ return null; } }
var st=document.createElement('style');
st.textContent='#fdPanel-yayoi{position:fixed;left:10px;bottom:10px;z-index:9988;width:284px;max-height:74vh;overflow-y:auto;padding:10px 12px;border:1px solid #3a3a40;border-radius:10px;background:rgba(14,14,17,.94);color:#e8e8ec;font-size:12.5px;line-height:1.55}'
 +'#fdPanel-yayoi .t{letter-spacing:.08em}#fdPanel-yayoi .sec{margin-top:9px;border-top:1px solid #2c2c31;padding-top:7px}'
 +'#fdPanel-yayoi .sec b{font-size:12px;letter-spacing:.06em}#fdPanel-yayoi .s{opacity:.85;font-size:11.5px}'
 +'#fdPanel-yayoi .row{display:flex;align-items:center;gap:6px;margin-top:5px}'
 +'#fdPanel-yayoi input[type=text]{background:#1c1c20;color:#e8e8ec;border:1px solid #3a3a40;border-radius:6px;font-size:12px;padding:3px 6px;flex:1}'
 +'#fdPanel-yayoi button{background:#1c1c20;color:#e8e8ec;border:1px solid #3a3a40;border-radius:6px;font-size:12px;padding:4px 8px;cursor:pointer}'
 +'#fdPanel-yayoi .chip{display:inline-flex;gap:4px;align-items:center;margin:3px 4px 0 0}'
 +'#fdPanel-yayoi .keys{font-size:11.5px;opacity:.88;line-height:1.7}';
document.head.appendChild(st);
var panel=document.createElement('div'); panel.id='fdPanel-yayoi'; panel.setAttribute('data-fd-panel','1');
panel.innerHTML='<div class="t">FREEDOM CONSOLE — Yayoi</div>'
 +'<div class="sec"><b>設定プリセット</b>'
 +'<div class="s">現在の設定一式 (yayoi-settings-v2) を名前付きで保存します。適用すると設定を書き戻して再読込します。</div>'
 +'<div class="row"><input type="text" id="fdPresetName-yayoi" placeholder="名前"><button type="button" id="fdPresetSave-yayoi">保存</button></div>'
 +'<div id="fdPresetList-yayoi"></div>'
 +'<div class="row"><button type="button" id="fdExport-yayoi">設定を書き出し</button><button type="button" id="fdImport-yayoi">読み込み</button><input type="file" id="fdImportFile-yayoi" accept="application/json" style="display:none"></div>'
 +'<div class="s" id="fdState-yayoi"></div></div>'
 +'<div class="sec"><b>ショートカット</b><div class="keys">1〜9=プリセット適用（再読込） / F=このパネルの表示切替</div></div>';
document.body.appendChild(panel);
function $(id){ return panel.querySelector('#'+id+'-yayoi'); }
function state(){ var o=readObj(); $('fdState').textContent=o?('現在の設定: '+Object.keys(o).length+' 項目を検出'):'設定オブジェクトが見つかりません'; }
function applyPreset(name){ var p=S.presets[name]; if(!p)return;
  try{ localStorage.setItem(OBJKEY,JSON.stringify(p)); }catch(e){}
  $('fdState').textContent='「'+name+'」を適用しました。再読込します…';
  setTimeout(function(){ location.reload(); },350); }
function buildList(){ var wrap=$('fdPresetList'); wrap.innerHTML='';
  var names=Object.keys(S.presets);
  names.forEach(function(name,idx){
    var chip=document.createElement('span'); chip.className='chip';
    var b=document.createElement('button'); b.type='button'; b.textContent=(idx+1)+'. '+name;
    b.addEventListener('click',function(){ applyPreset(name); });
    var x=document.createElement('button'); x.type='button'; x.textContent='×';
    x.addEventListener('click',function(){ delete S.presets[name]; save(); buildList(); });
    chip.appendChild(b); chip.appendChild(x); wrap.appendChild(chip);
  });
  if(!names.length)wrap.innerHTML='<span class="s">まだありません</span>';
}
$('fdPresetSave').addEventListener('click',function(){
  var o=readObj(); if(!o){ $('fdState').textContent='設定オブジェクトが見つからないため保存できません'; return; }
  var name=($('fdPresetName').value||'').trim()||('プリセット'+(Object.keys(S.presets).length+1));
  S.presets[name]=o; save(); buildList(); state(); });
document.addEventListener('keydown',function(ev){
  var t=ev.target; if(!t)return; var tag=(t.tagName||'').toLowerCase();
  if(tag==='input'||tag==='textarea'||tag==='select'||t.isContentEditable)return;
  if(ev.metaKey||ev.ctrlKey||ev.altKey)return;
  var k=ev.key.toLowerCase();
  if(k==='f')panel.style.display=(panel.style.display==='none')?'block':'none';
  else if(/^[1-9]$/.test(k)){ var names=Object.keys(S.presets); var nm=names[parseInt(k,10)-1];
    if(nm)applyPreset(nm); }
});
buildList(); state();
/* ── 設定の書き出し/読み込み (Phase P) ── */
function exportData(){ return JSON.stringify({app:'varelser-freedom-settings',target:'yayoi',version:'PhaseP-2',settings:S},null,1); }
function importData(str){ try{ var o=JSON.parse(str);
  if(!o||o.target!=='yayoi'||!o.settings||typeof o.settings!=='object')return false;
  if(o.settings.presets&&typeof o.settings.presets==='object')S.presets=o.settings.presets;
  save(); setTimeout(function(){ location.reload(); },250); return true;
 }catch(e){ return false; } }
$('fdExport').addEventListener('click',function(){
  var blob=new Blob([exportData()],{type:'application/json'});
  var a=document.createElement('a'); a.href=URL.createObjectURL(blob);
  a.download='yayoi-freedom-settings.json'; document.body.appendChild(a); a.click();
  setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); },400); });
$('fdImport').addEventListener('click',function(){ $('fdImportFile').click(); });
$('fdImportFile').addEventListener('change',function(){ var f=this.files&&this.files[0]; if(!f)return;
  var rd=new FileReader();
  rd.onload=function(){ var ok=importData(String(rd.result||''));
    if(!ok)alert('読み込めませんでした（Yayoi の設定ファイルではありません）'); };
  rd.readAsText(f); this.value=''; });
window.__studioFreedom={version:'PhaseP-2-yayoi',app:'yayoi',
  exportData:exportData, importData:importData,
  settings:function(){ return JSON.parse(JSON.stringify(S)); },
  savePreset:function(name){ var o=readObj(); if(o){ S.presets[name]=o; save(); buildList(); } },
  applyPreset:applyPreset,
  hasSettingsObject:function(){ return !!readObj(); }};
})();

</script>
<script id="studio-dock-yayoi">
/* Varelser Studio — Side Dock (Phase O)
   既存の追加パネル (Studio Link / STUDIO FLUID / FREEDOM CONSOLE) を
   右端の縦タブ・レールに集約する。パネルの中身・id・保存キーには触らず、
   DOM の置き場所と見せ方だけを引き受ける。 */
(function(){
'use strict';
var CFG = {"app": "yayoi", "tabs": [{"key": "link", "label": "連携", "panel": "sxPanel-yayoi", "badge": "sxBadge-yayoi", "api": "__studioEchoYayoi"}, {"key": "free", "label": "自由化", "panel": "fdPanel-yayoi", "badge": null, "api": "__studioFreedom"}]};
var LSKEY = CFG.app + '.studioDock.v1';
var state = { open: null };
try { var raw = localStorage.getItem(LSKEY); if (raw) { var p = JSON.parse(raw); if (p && typeof p.open === 'string') state.open = p.open; } } catch (e) {}
function save(){ try { localStorage.setItem(LSKEY, JSON.stringify({ open: state.open })); } catch (e) {} }

var css = ''
+ '#sdockRail{position:fixed;right:0;top:50%;transform:translateY(-50%);z-index:99997;display:flex;flex-direction:column;gap:6px;font-family:inherit;}'
+ '.sdock-tab{writing-mode:vertical-rl;letter-spacing:.14em;font-size:11.5px;padding:12px 6px;background:rgba(14,14,17,.93);color:#d7d7db;border:1px solid #3a3a40;border-right:none;border-radius:9px 0 0 9px;cursor:pointer;user-select:none;display:flex;align-items:center;gap:7px;}'
+ '.sdock-tab:hover{color:#fff;border-color:#6a6a72;}'
+ '.sdock-tab.active{background:#e9e9ec;color:#101013;border-color:#e9e9ec;font-weight:700;}'
+ '.sdock-tab .sdot{width:7px;height:7px;border-radius:50%;background:#8a8a91;flex:none;}'
+ '.sdock-tab .sdot.on{background:#f2f2f4;box-shadow:0 0 0 2px rgba(255,255,255,.22);}'
+ '.sdock-tab.active .sdot{background:#8a8a91;} .sdock-tab.active .sdot.on{background:#101013;box-shadow:none;}'
+ '.sdock-wrap{position:fixed;right:31px;top:50%;transform:translateY(-50%) translateX(118%);transition:transform .3s ease;z-index:99996;pointer-events:none;}'
+ '.sdock-wrap.open{transform:translateY(-50%) translateX(0);pointer-events:auto;}'
+ '.sdock-wrap>*{max-width:calc(100vw - 52px);}'
+ '@media (max-width:640px){.sdock-tab{font-size:11px;padding:10px 5px;}}';

var rail = null, tabs = {}, wraps = {};
function ensureChrome(){
  if (document.getElementById('sdockStyle')) return;
  var st = document.createElement('style'); st.id = 'sdockStyle'; st.textContent = css; document.head.appendChild(st);
  rail = document.createElement('div'); rail.id = 'sdockRail'; rail.setAttribute('role', 'tablist'); rail.setAttribute('aria-label', 'Studio panels');
  document.body.appendChild(rail);
  CFG.tabs.forEach(function(t){
    var b = document.createElement('button'); b.type = 'button'; b.className = 'sdock-tab'; b.id = 'sdockTab-' + t.key;
    b.setAttribute('role', 'tab'); b.setAttribute('aria-expanded', 'false');
    b.innerHTML = '<span class="sdot"></span>' + t.label;
    b.style.display = 'none';
    b.addEventListener('click', function(){ toggle(t.key); });
    rail.appendChild(b); tabs[t.key] = b;
  });
}
function adopt(t){
  var panel = document.getElementById(t.panel);
  if (!panel || panel.dataset.docked) return !!panel;
  ensureChrome();
  var wrap = document.createElement('div'); wrap.className = 'sdock-wrap'; wrap.id = 'sdockWrap-' + t.key;
  document.body.appendChild(wrap);
  wrap.appendChild(panel);
  panel.dataset.docked = '1';
  ['position','left','right','top','bottom','margin','float'].forEach(function(prop){
    panel.style.setProperty(prop, prop === 'position' ? 'static' : 'auto', 'important');
  });
  panel.style.setProperty('margin', '0', 'important');
  wraps[t.key] = wrap;
  if (t.badge) { var bg = document.getElementById(t.badge); if (bg) bg.style.setProperty('display', 'none', 'important'); }
  return true;
}
function panelAvail(t){
  var panel = document.getElementById(t.panel);
  if (!panel) return false;
  return getComputedStyle(panel).display !== 'none';
}
function linkedNow(t){
  try { var a = t.api && window[t.api]; return !!(a && a.linked); } catch (e) { return false; }
}
function applyOpen(){
  CFG.tabs.forEach(function(t){
    var w = wraps[t.key], b = tabs[t.key];
    if (w) w.classList.toggle('open', state.open === t.key);
    if (b) { b.classList.toggle('active', state.open === t.key); b.setAttribute('aria-expanded', state.open === t.key ? 'true' : 'false'); }
  });
}
function toggle(key){
  state.open = (state.open === key) ? null : key;
  save(); applyOpen();
}
function tick(){
  ensureChrome();
  var anyAvail = false;
  CFG.tabs.forEach(function(t){
    adopt(t);
    var av = panelAvail(t);
    var b = tabs[t.key];
    if (b) {
      b.style.display = av ? '' : 'none';
      var dot = b.querySelector('.sdot');
      if (dot) dot.classList.toggle('on', linkedNow(t));
    }
    if (t.badge) { var bg = document.getElementById(t.badge); if (bg && bg.style.getPropertyValue('display') !== 'none') bg.style.setProperty('display', 'none', 'important'); }
    if (av) anyAvail = true;
    if (state.open === t.key && !av) { state.open = null; save(); }
  });
  if (rail) rail.style.display = anyAvail ? '' : 'none';
  applyOpen();
}
document.addEventListener('keydown', function(ev){
  if (ev.key === 'Escape' && state.open) { state.open = null; save(); applyOpen(); return; }
  if (ev.altKey && /^[1-9]$/.test(ev.key)) {
    var avail = CFG.tabs.filter(function(t){ return panelAvail(t); });
    var t = avail[parseInt(ev.key, 10) - 1];
    if (t) { ev.preventDefault(); toggle(t.key); }
  }
});
document.addEventListener('pointerdown', function(ev){
  if (!state.open) return;
  var w = wraps[state.open];
  if (w && w.contains(ev.target)) return;
  if (rail && rail.contains(ev.target)) return;
  state.open = null; save(); applyOpen();
}, true);
function boot(){ tick(); setInterval(tick, 700); }
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', function(){ setTimeout(boot, 300); });
else setTimeout(boot, 300);
window.__studioDock = { version: 'PhaseO-2', app: CFG.app, open: function(){ return state.open; }, toggle: toggle };
})();

</script>
</body>
